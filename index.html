小的定当尽心竭力，绝不辜负仙师厚恩！”陈长庚双膝跪地，心里却提起了十二分小心。\n\n葛老栓闲聊时提过，这两年丹房已经连着抬出去三具童子尸首了。仙师住的暖室灵气充裕，哪来那么多年轻学徒接连暴病而亡？\n\n孙奉先笑眯眯地扶起他，从铜炉上端过一只白瓷碗，又摸出半页泛黄麻纸递过来：“你首窍初松，肺底余毒未清。这半页《引火行气诀》拿去熟读，先把这碗老夫亲手熬的‘温脉汤’趁热喝了，旁人跪破头都求不来这一碗。”\n\n白瓷碗里琥珀色药汤热气氤氲，闻着竟有一股蜜枣般的甘甜醇香。\n\n“小的何德何能，竟劳仙师亲手赐药！”陈长庚眼圈微红，双手捧碗凑到唇边作势吹气。\n\n鼻尖贴近碗沿半寸的刹那，他瞳孔微不可察地一缩！\n\n他在丙字灶熬了整整三年毒卤，鼻子早被千百种地底火煞熏得比猎犬还尖。这碗温脉汤表层蜜香扑鼻，碗底热气深处却裹着一丝极淡、极阴冷的腥甜火煞味！\n\n这绝不是拔毒养身的补汤，而是被人用高明控火术化进汤水里的慢毒！\n\n陈长庚余光扫过孙奉先笑吟吟却紧盯他喉结的双眼，心头雪亮。\n\n通窍九窍圆满的修真丹师跟前，只要他敢犹豫半息，或是手抖洒了药汤，对方一指头就能碾碎他的天灵盖！\n\n怀里有灰石臼在，慢毒未必拔不掉；当场拒喝，十条命都不够死。\n\n一念电转，陈长庚面上神色不变，仰起脖子咕咚咕咚将整碗温脉汤喝得涓滴不剩，双手高举空碗过顶：“好暖和！谢仙师赐神汤，小的胸口一下子就顺畅了！”\n\n孙奉先眼底最后一丝审视散去，捋须微笑：“好，是个知恩实诚的好孩子。早些歇着，明早老夫教你辨认风门火色。”\n\n目送孙奉先背手关上内室石门，陈长庚脸上的感激涕零瞬间冻成一片冷寂。\n\n他吹熄油灯盘坐竹榻，借着廊下微光飞快记熟百余字的《引火行气诀》，闭目引动首窍内息往内一探，后背冷汗唰地湿透了中衣！\n\n温脉汤九成药力化作虚浮热气敷在体表，唯独一缕细如发丝的赤红毒气顺着食管钻进血脉，像活蛭般缠向心脉根部！\n\n他试着调动首窍暖流去冲刷，那赤红毒丝滑不溜手，一旦硬撞便如钢针扎心，分明是孙奉先种在他体内拿捏性命的毒根！\n\n“慈眉善目端毒碗，这是拿我当牲口养肥了再宰。”\n\n陈长庚睁开双目，隔着破衣摸了摸冰凉沉寂的灰石臼。\n\n前半夜在丙字灶刚用过一轮，按地脉大潮三日一涌的脾性，至少还得苦熬整整三十六个时辰！\n\n接下来的三天，白日里他在炉前弓腰添炭，每到傍晚孙奉先便笑呵呵端来一碗温脉汤看着他喝干。每多喝一碗，心口缠绕的赤红毒丝便粗壮一分，全靠首窍道髓晶砂打下的纯厚根基护住心房核心。\n\n终于熬到入丹房后的第三夜子初！\n\n丹房地下紧贴盐场最旺的地火支脉，子时刚交，已满三十六个时辰，陈长庚胸口的灰石臼骤然滚烫发颤！\n\n陈长庚悄无声息翻下竹榻，猫腰摸到外间角落堆积的报废丹炉灰袋旁，抓起两大把丹毒酷烈的紫黑废灰塞进石臼凹槽，将臼底紧按在渗出地火热气的墙角砖缝上。\n\n内室药炉昼夜不熄，排烟筒呼啸抽风，将石臼收尾一刻钟逸散的浓烈地火腥甜气卷得一干二净。\n\n待石臼重归微凉，陈长庚伸手往臼心一摸，心头大喜——高浓废丹灰炼出的道髓晶砂，竟比前次黑卤渣足足多出一倍！\n\n他先用干净油纸将一半晶砂裹严揣入怀内，随即拈起剩下半撮莹白晶砂吞入腹中，催动《引火行气诀》裹挟磅礴暖流狠狠碾向心脉！\n\n无瑕髓晶至纯至净，那缕盘踞三日的赤红毒丝一遇暖流便如滚汤泼雪般剥离溃退，顺着左臂经络一路被逼至中指尖！\n\n陈长庚用右指甲轻轻一掐左中指肚，一滴凝而不散的暗红毒血珠缓缓渗出。\n\n他还未来得及松口气，外间回廊青石板上毫无征兆地响起两声轻微的布鞋踏地声——窗纸微光一晃，突然映出孙奉先提灯折返的瘦长人影！"}, {"n": 5, "title": "咳血藏锋", "body": "窗纸外，孙奉先枯瘦的手指已经搭上了外间木门栓。\n\n电光石火间，陈长庚左指猛地插进脚边的紫黑废丹灰袋里，将指尖那滴暗红毒血死死捻入炭灰深处，同时心念一松，任由体内刚平复的气机轰然撞乱！\n\n“咳！咳咳咳——”\n\n木门吱呀推开的刹那，陈长庚正蜷在废灰袋旁的冷地上，双手揪紧胸口衣襟，咳得撕心裂肺、满脸涨红。\n\n孙奉先提着白纸灯笼跨过门槛，目光如鹰隼般先扫过竹榻与墙角，随即快步上前扶住他后背：“长庚？深更半夜不睡，怎地坐在灰堆旁咳成这样？”\n\n“仙、仙师……”陈长庚嘴角挂着一点刚咬破舌根渗出的血沫子，喘得上气不接下气，“小的睡到半夜，胸口像揣了块烧红的烙铁……想爬起来讨口凉水喝，腿一软就栽这儿了……”\n\n孙奉先不动声色地扣住他右腕脉门。\n\n指下脉象虚浮杂乱，一缕灼热火气正在肺腑间横冲直撞，半点人为逼毒的凝练痕迹也无。\n\n孙奉先悬着的一颗疑心瞬间落回肚里，眼角笑纹更深了三分。\n\n看来连服三碗温脉汤，火毒药引已经顺顺当当扎进这小子的心脉，正跟陈年盐毒搅在一处发作呢！\n\n“傻孩子，这是温脉汤的药力化开了，正在替你冲刷肺底死血。”孙奉先慈爱地替他顺了顺脊背，扶他坐回竹榻，“往后夜里心口灼痛是常事，莫要惊慌，熬过去便是脱胎换骨的大造化。”\n\n“原来是仙师的神汤在起效！”陈长庚做出又惊又喜的模样，擦去嘴角血迹就要下榻磕头，“小的肉眼凡胎，还当是旧疾犯了，白白惊扰仙师清梦！”\n\n“躺着歇息吧。”孙奉先摆了摆手，瞥见墙角堆得半人高的几个大麻袋，顺口吩咐道，“外间这些报废丹炉灰积了快十天，味儿冲得很。明早卯时你装上独轮车，自己推去西墙根排污总渠倒掉，莫让外院那些手脚不干净的杂役进屋乱翻。”\n\n陈长庚心头猛地一跳！\n\n报废丹炉灰在旁人眼里是沾皮起疮的剧毒废料，在他手里却是能翻倍析出道髓晶砂的无价宝山！\n\n前两日他还愁怎么瞒着耳目偷抓废灰，如今孙奉先竟亲口把清运差事交到了他手上！\n\n“是！小的明早一准清得干干净净，绝不放半个外人进屋！”陈长庚低头恭声应下，遮住了眼底一闪而逝的精芒。\n\n次日卯初，大泽晨雾湿冷刺骨。\n\n陈长庚推着吱呀作响的独轮木车走出丹房后门，车上摞着四袋沉甸甸的废丹炉灰，怀里贴肉揣着昨夜省下来的那半撮道髓晶砂。\n\n出门前他暗窥了一眼油纸包，昨夜子初裹好的这半撮晶砂离臼尚不足三个时辰，灵光便已黯淡近半。照此推算，晶砂离了石臼至多存留六个时辰，一过今日午初便会散成无用白灰。\n\n他手里既无护身横练，也没半件能破开高阶修士护体气的利器，光躲在丹房拔毒坐等孙奉先开刀只有死路一条，必须赶在晶砂散化前换成实打实的保命家底！\n\n刚推车拐进盐场西墙根偏僻的排污总渠，前头芦苇掩映的青石涵洞口忽然传来一阵慌乱的木板磕碰声。\n\n一个身穿脚行短打、精瘦得像猴儿似的三旬汉子正蹲在一辆粪灰板车旁，手忙脚乱地往车底夹层塞两包油布裹紧的雪白私盐。\n\n听见独轮车轮响，那汉子浑身一激灵，右手刷地摸向腰后铁尺；待看清推车过来的是身穿丹房灰布袍的陈长庚，眼珠滴溜溜一转，忙松开铁尺堆起笑脸：“哟，这不是丹房新晋的陈小哥吗？这么早出来倒炉灰呐！”\n\n陈长庚认得此人。他叫贺九斤，是大泽脚行的老趟子手，通窍四窍的散修底子，常年往返乌卤盐场与三十里外散修混居的“黑石坊市”，黑市门道熟得很。\n\n陈长庚还没答话，北头巡防哨卡突然传来一阵急促的铁链哗啦声！\n\n“汪！汪汪——”\n\n两条肩高近尺、鼻头赤红的巡卫灵犬拽着皮绳狂奔而来，后头跟着三名挎刀矿卫，老远便厉声喝道：“前头拉粪车的站住！昨夜东灶丢了二十斤精盐，挨个验车！”\n\n贺九斤脸色唰地惨白如纸！\n\n那巡卫灵犬最擅嗅辨精盐卤气，一旦搜出车底夹层这二十斤私盐，按场规当场就得挑断脚筋扔进毒水塘！\n\n此时弃车逃跑已然不及，贺九斤额角青筋乱跳，惊惶的眼神下意识瞟向近在咫尺的陈长庚。\n\n陈长庚神色不变，半句废话没讲，推着独轮车迎面往粪灰板车旁一横，“哎哟”一声假装脚底泥滑，车上敞口的一袋紫黑废丹炉灰轰然倾覆，正好将贺九斤的车辙与板车底盘严严实实泼了一层！\n\n苦涩刺鼻的丹毒浓烟瞬间腾起三尺高！\n\n两条狂奔而来的巡卫灵犬刚冲进三丈之内，鼻孔吸进半口废丹灰粉，当场“嗷呜”一声惨叫，拼命打着喷嚏往后乱缩，眼泪鼻涕糊了一脸，任凭矿卫怎么抽鞭子都不敢再往前凑半步！\n\n“妈的，什么鬼玩意儿这么呛！”领头的络腮胡矿卫捂着口鼻连退两步。\n\n陈长庚慌忙从泥地里爬起来，拍着灰袍躬身赔罪：“几位军爷恕罪！小的奉孙丹师之命倾倒废炉毒灰，路滑摔了一跤，冲撞了军爷的灵犬！”\n\n“孙丹师的废炉毒灰？”络腮胡矿卫脸色一变，嫌恶地挥手扇风，“真他娘的晦气！沾身就起烂疮，赶紧铲进渠里冲走！”\n\n“是是是，小的这就铲干净！”陈长庚连连点头。\n\n络腮胡矿卫哪还肯凑近沾满毒灰的粪车细查，冲贺九斤不耐烦地一挥刀鞘：“贺猴子，还不赶紧滚出闸口，留在这儿等吃毒灰啊？”\n\n“军爷辛苦！小的这就滚，这就滚！”贺九斤如蒙大赦，推起粪灰板车一溜烟拐过了哨卡死角。\n\n等矿卫牵着直打喷嚏的灵犬走远，陈长庚才慢条斯理地把洒出的毒灰铲进暗渠，又将另外两袋好灰悄悄藏进涵洞干燥的石槽暗格里，推着空车转过芦苇湾。\n\n断墙阴影下，贺九斤果然没走，正靠着石壁擦冷汗。\n\n一见陈长庚过来，他立刻拢着袖筒迎上前，压低嗓门抱了抱拳：“长庚兄弟，今儿哥哥我欠你一条腿！说吧，看上车底几斤精盐，还是想要现银？哥哥绝不含糊！”\n\n“纹银在盐场花不出去，私盐我也没处藏。”陈长庚停下脚步，直视贺九斤精明的双眼，“久闻贺哥常跑黑石坊市，手里有散修的路子？”\n\n贺九斤眼睛微微一眯，左右扫了一圈，嗓音压得像蚊子哼：“长庚兄弟这话可就深了。亲兄弟明算账，丹房的事儿哥哥可不敢瞎沾边。”\n\n陈长庚也不多言，从怀里摸出那包提前拿粗石磨去棱角、又裹了一层老盐泥的半撮道髓晶砂，掀开油纸一角递到贺九斤鼻端下。\n\n贺九斤起初还不以为意，可伸指往油纸里一探，整个人如遭雷击般僵在原地！\n\n他在黑市摸爬十几年，练就一手蒙眼摸货估价的绝活——指肚触及的哪是什么普通盐晶？\n\n那股温润醇厚、不含半分狂暴火煞的精纯灵气，分明是极罕见的天然地底老矿髓，净度比云泽宗十枚灵石一剂的劣等净髓引还要高出几筹！\n\n“嘶……极品老矿髓？！”贺九斤喉结猛滚了一下，看陈长庚的眼神彻底变了，“兄弟从三号废井底下顺出来的？！”\n\n陈长庚既不点头也不摇头，啪地合上油纸包收回掌心：“货的来历贺哥按黑市规矩别问。这东西离了地气封不住太久，必须在今日午时前赶黑石坊市早集出手，晚了灵气散尽就是一把白灰。”\n\n贺九斤眼珠飞快转动，伸出两根手指在袖筒里比划得飞快：“赶早集正好来得及！按坊市行情，这半撮极品矿髓少说能换五六枚下品灵石！哥哥我担着掉脑袋的干系替你跑腿，抽两成佣金，少一厘哥哥今儿这双耳朵就是摆设！”\n\n跟贪财惜命的聪明人做买卖，远比跟讲虚头巴脑义气的人稳妥。\n\n“就按两成算。”陈长庚干脆利落地将油纸包拍进他掌心，“灵石先不用全换现的。替我在黑市淘一篇不挑气窍、专练筋骨皮膜的横练功法，外加一柄能藏进袖筒的破甲短刺；再替我打听清楚，修真丹师给人喝带火煞甜腥味的温脉汤，到底是什么路数。”\n\n贺九斤攥紧油纸包揣进贴身暗袋，深深看了眼这个年仅十六岁却稳如老狐的少年，拍胸脯低喝道：“痛快！两成跑腿费包哥哥嘴严如铁，后天夜里子正，还是这处排污暗渠交货！”\n\n贺九斤推车钻进晨雾远去，陈长庚则扛着空独轮车稳稳当当回了丹房。\n\n从这一日起，丹房内外演起了一出心照不宣的师徒双簧。\n\n每天黄昏，孙奉先都会笑吟吟端来温脉汤，碗底暗藏的火煞毒引一日重过一日：“长庚啊，你气窍底子薄，为师特地在汤里添了三分赤阳草，夜里越痛，离洗髓破关便越近。”\n\n“小的省得！仙师待小的如同再生父母，这点疼算不得什么！”陈长庚每次都感恩戴德地仰脖喝干。\n\n转过天清早孙奉先搭脉查验时，陈长庚便提前用牙齿咬破舌尖，混着指甲缝里藏的一点煤灰，当面咳出几缕乌黑血丝，再故意用行气诀把表层脉象搅得虚浮散乱。\n\n孙奉先每见他眼窝青黑、咳血不止，眼底的戒心便少去三分，连内室门外的废灰簸箕都放心交给他清扫。\n\n待到约定交货的后天夜里子初，距前次提纯恰满三十六个时辰，地脉潮汐再度如期涌动。\n\n陈长庚把藏在暗渠石槽里的两袋高浓废丹灰偷运回外间，趁夜深炉火轰鸣时用灰石臼整整炼出一大捧晶莹夺目的道髓晶砂！\n\n他当场吞下一小半，滚滚暖流顷刻间将这三日积在心脉边缘的九成新毒涤荡一空，首窍气血更是被打磨得圆融饱满，只差一线便能撞开第二窍！\n\n将剩余大半撮新晶贴身收好，算准子正已到，陈长庚推起装满臭泥的独轮车借口夜里清渠，摸黑来到了西墙根排污暗渠口。\n\n漆黑涵洞水声潺潺，一团黑影准时从齐膝深的臭水沟里探出脑袋，正是满身泥浆的贺九斤！\n\n“长庚兄弟！”贺九斤抹了把脸上的黑泥水，隔着铁栅栏将一只油蜡封死的厚油纸包塞进陈长庚手里，脸色白得像死人，“功法和短刺全给你办齐了，剩下的碎灵石也在里头！”\n\n陈长庚接过沉甸甸的油纸包滑入袖袋：“有劳贺哥。我托你打听的温脉汤呢？”\n\n贺九斤牙齿咯咯打颤，死死攥住铁栅栏压极了嗓音：“兄弟，你快想辙逃命吧！哥哥在黑石坊市鬼市问了老毒修，那带甜腥味儿的压根不是补药，是夺命的‘赤煞引’！最近坊市里正有人高价悬赏耐火毒的活人炉渣——”\n\n话音未落！\n\n“汪汪汪——嗷！”\n\n三十丈外的芦苇堤坝上骤然爆起一阵凶戾狂躁的铁犬嘶吠，十余支明晃晃的松脂火把刺破夜雾，急促的皮靴踏水声直奔排污暗渠包抄而来！"}, {"n": 6, "title": "借虎驱犬", "body": "火把红光转眼逼近二十丈内，铁犬腥风扑面而来！\n\n贺九斤吓得寒毛倒竖，连句告辞都顾不上说，缩头便像泥鳅一样滑回漆黑的排污暗涵深处，顺着湍急臭水潜没了踪影。\n\n陈长庚站在原地半步没跑——空旷苇堤上提步狂奔，不出十息就会被铁犬扑倒咬碎咽喉！\n\n他反手抄起独轮车底暗藏的半捧刺鼻废丹炉灰，看准夜风吹来的上风向猛地扬手一撒，自己则把木车横在渠沿，抄起长柄木锹不紧不慢地往水沟里铲臭泥。\n\n两头披着铁甲的巡夜恶犬狂扑到十丈外，迎头撞进随风散开的苦涩毒灰雾里，顿时狂打着响鼻原地乱转，呜咽着不肯再往前冲。\n\n四名提刀巡防趟子赶上来，火把一照身穿丹房灰袍的陈长庚，领头的小头目捂鼻皱眉骂道：“又是丹房倒毒灰的小子！深更半夜不睡觉跑这儿熏狗玩？”\n\n“军爷担待，白日里孙仙师开炉废渣多，严令小的赶在寅时前清干净，免得污了明早仙师入定的清气。”陈长庚垂手弯腰，陪着笑脸往侧边让开半步，“要么军爷随小的回丹房跟孙仙师禀一声，改明儿正午再倒？”\n\n小头目一听要去触孙丹师的霉头，嘴角猛抽了一下，一把拽回直打喷嚏的铁犬：“少拿孙仙师压人！倒完赶紧滚回去拴门，这两天场里严查私盐，少在外头瞎晃悠！”\n\n“是是是，小的倒完这两锹就回！”\n\n目送巡防队骂骂咧咧转向东堤，陈长庚面不改色地推起空车，稳步返回丹房后院堆放湿柴与废卤桶的偏僻柴屋。\n\n反手插严柴屋木门，他这才从袖袋里摸出那只油蜡封紧的厚油纸包。\n\n拆开油蜡，里头整整齐齐码着四样物件：一块半棱角分明的碎灵石，一柄七寸长、通体乌黑无光且开着三道血槽的精铁“淬毒分水刺”，半卷兽皮抄录的体修残篇《井煞锻骨功》，以及一张贺九斤拿炭条草草写就的口讯纸条。\n\n陈长庚先捏起那柄淬毒分水刺，指尖隔着皮套都能感受到刃口浸染的蛇蝎寒气，顺手扣进右袖特制的布袋里，贴合得严丝合缝。\n\n接着他展开那半卷《井煞锻骨功》与炭条纸讯，结合方才贺九斤暗渠里的警告，背脊寒意直冲头顶！\n\n原来修真界有些卡在通窍九窍圆满、六十岁气血衰败大限将至却叩不开仙脉的老丹师，会暗购黑市禁方强炼破障邪丹。\n\n因主药火煞霸道绝伦，老丹师惜命不敢亲自试毒，便挑耐火毒的学徒天天喂服“赤煞引”，把活人五脏六腑养成容纳火煞的药罐子——待开炉之日催动母引法诀，活生生抽干童子一身精血髓液入炉成丹！\n\n“难怪前几任司火童子全都无声无息暴病身亡……好一个慈眉善目的孙仙师！”\n\n陈长庚指节捏得发白，随即缓缓吐出一口浊气，将翻涌的杀心压进胸膛最深处。\n\n将炭条纸讯凑到灯苗上烧成飞灰，他低头盘算起手头的筹码。\n\n单凭现在的通窍一窍，就算加上淬毒分水刺，也破不开九窍圆满修士随身佩戴的护身灵符。想在死局里翻盘，先得把这一身皮肉筋骨炼成刀剑难伤的熟铁！\n\n趁着子初刚析出的大半撮道髓晶砂尚在六个时辰保鲜期内，陈长庚仰头将晶砂尽数吞入腹中，脱去灰袍跨进柴屋角落那只盛满滚烫废卤水的木桶里，照着《井煞锻骨功》的行气法门全力运转起来！\n\n“嗤——”\n\n滚烫霸道的废卤井煞顺着毛孔往骨缝里钻，换作寻常武夫早被毒煞蚀烂了皮膜。\n\n可陈长庚体内道髓晶砂化开的纯厚暖流紧随其后，前脚井煞撕裂筋膜淬炼骨骼，后脚无瑕髓晶便毫无丹毒地滋养修复！\n\n不过半个时辰，胸腹深处轰然一震，第二处蒙尘气窍应声冲破！\n\n尝到甜头的陈长庚昼伏夜出，白日照旧在炉前弯腰咳黑血装病，夜里便锁好柴屋泡废卤桶苦修锻骨，借着满桶腥咸热气遮住气血翻涌的动静。\n\n转眼又过三日，待第四轮地脉潮汐在凌晨寅初准时涌来，他借着高浓废丹灰新析出的大把髓晶一鼓作气，接连撞破第三处气窍！\n\n跨出木桶擦干水迹时，他原本瘦削蜡黄的胸膛皮膜隐泛一层古铜铁泽，五指轻轻一捻，灶角一块坚硬青砖被无声捏成了细粉，举手投足已具通窍三窍横练武夫的沉凝劲力。\n\n这日午正，盐场南坡地火总阀气压不稳，孙奉先背着药箱亲自出院查看火脉走向。\n\n前脚孙奉先刚走出一盏茶工夫，丹房后院紧闭的小侧门忽然被人拿铜钥匙从外头悄悄拧开！\n\n外灶胡管事满脸谄笑地哈腰让开半边路，正把头周大昌带着两名膀大腰圆的心腹刀手，黑着脸大步闯进了后院天井！\n\n正在屋檐下拿竹筛分拣炭块的陈长庚眼皮微抬，瞬间放缓呼吸，将一身通窍三窍的横练劲力锁得涓滴不露，肩膀瑟缩着退后半步：“大、大把头？这儿是孙仙师的丹房重地，您怎地进来了……”\n\n“少他娘的拿老杂毛吓唬老子！他去南坡验火阀没半个时辰回不来！”\n\n周大昌三角眼凶光毕露，三步并作两步冲上前，一脚踹翻竹筛，恶狠狠盯着陈长庚：“小畜生，老子忍你整整九天了！前儿老子翻出阿禄屋里的暗账，他明明还差四十两银子才凑够百两，为啥偏偏死前踹开你独自钻三号井？！”\n\n陈长庚脸色煞白，步步往炼丹外室的青石台阶上退去：“大把头明鉴，周副把头下井的事小的真不知情啊……”\n\n“不知情？胡管事早就查清了，那天早上阿禄当众从你怀里搜出了头等雪花私盐！”周大昌狞笑一声，蒲扇大手猛地探出，一把揪住陈长庚胸口衣襟，“说！井底那窝老卤冰晶是不是让你提前偷挖藏起来了？今儿不交出一百两纹银，老子拧断你的脖子塞进废灰坑，就说你火毒攻心暴毙！”\n\n守在侧门口望风的胡管事尖声帮腔：“长庚啊，识时务者为俊杰！孙仙师前两任童子不也说没就没了？把银子孝敬大把头，好歹留具全尸！”\n\n两名心腹刀手左右包抄上来，伸手就要往陈长庚怀里乱摸！\n\n陈长庚右袖里就扣着淬毒分水刺，以他如今三窍井煞锻骨的拳力，三息之内便能把周大昌和这两个蠢货统统砸碎喉骨！\n\n可他眼底寒芒一闪，硬生生松开了扣在刺柄上的五指。\n\n在丹房后院动手杀人？一旦暴露通窍三窍的真实气力，半个时辰后回来的孙奉先立马就会发现这头“病羊”早已长出了铁爪，到时候九窍修士雷霆强杀，他连半分翻盘机会都没有！\n\n驱狼吞犬，何须自己脏手？\n\n就在周大昌一拳砸向他鼻梁逼供的刹那，陈长庚非但没有格挡，反而顺着对方揪衣领的推劲，“啊”地惨叫一声，像断线风筝般仰面跌退进炼丹外室敞开的大门里！\n\n摔倒的瞬间，他左脚脚跟看似慌乱实则精准无比地勾中了炉台旁架着的一盆备用赤红火炭！\n\n“哐当——哗啦！”\n\n整盆烧得通红的兽骨炭轰然掀翻，几十块滚烫火炭径直砸向正中央那尊青铜药炉的底座，火星四溅，焦烟骤起！\n\n“小杂种你找死！”\n\n周大昌没料到这病秧子如此不经推，生怕烧坏仙师器物担不起罪责，下意识跨进门槛抬脚去踢炉边的火炭！\n\n“大胆狂徒！敢毁老夫丹炉？！”\n\n前院拱门外陡然炸开一声惊怒交加的厉喝！\n\n南坡火阀不过是个小岔子，孙奉先竟提前折返了！他刚踏进前院就闻见外室焦糊味，一抬眼正瞧见周大昌一只大脚踹在青铜药炉旁，满地红炭险些引燃炉底药草！\n\n这炉里温着的可是他耗尽十年私蓄筹备的禁丹辅药，地上摔着的更是他千挑万选的活体药渣！\n\n孙奉先气得须发皆张，哪管周大昌嘴里喊什么，枯瘦右手隔空一指，一缕炽白刺目的精纯丹火如毒蛇出洞般呼啸射出！\n\n“仙师饶命！不是小的——啊！！”\n\n周大昌骇得肝胆俱裂，慌忙抬起右掌格挡。\n\n“嗤啦！”\n\n通窍三窍武夫引以为傲的粗壮肉掌，在那缕九窍丹火面前脆得像张薄纸，半边右掌连皮带肉瞬间被燎得焦黑溃烂，露出森森白骨，外室里顿时弥漫开一股刺鼻的皮肉焦臭！\n\n周大昌痛得满地打滚，杀猪般凄厉嚎叫起来。\n\n守在侧门口的胡管事和两名刀手吓得扑通跪倒，裤裆当场湿了一片，脑门磕在青砖上砰砰作响。\n\n“仙师救命……咳咳……大把头闯进来非逼小的交一百两私盐银子，小的没钱，他就把小的推在炭盆上……”陈长庚趴在灰堆旁，嘴角溢着刚咬出来的鲜血，气若游丝地哭诉道。\n\n“混账东西！”孙奉先脸色阴沉得能滴下水来，袖袍猛地一拂，一股凌厉气劲将周大昌连人带滚震出外室石阶，“陈长庚是老夫亲点的司火童子！再敢踏进丹房半步伤他一根毫毛，老夫立刻修书云泽宗执法堂，拿你满门填三号废井！滚！”\n\n“谢仙师不杀之恩！小的再也不敢了！”\n\n周大昌捂着血肉模糊的烂手掌，疼得浑身抽搐，连看都不敢再看陈长庚一眼，被两个刀手架着屁股尿流地逃出了后院侧门。\n\n院内重归死寂。\n\n陈长庚挣扎着爬起身，拿起铁撮箕手脚麻利地将散落火炭归拢干净，低头惶恐道：“小的无能，险些惊了仙师宝炉，请仙师责罚。”\n\n孙奉先脸上的暴怒早已如春雪般消融，又恢复了那副慈眉善目的长辈模样。\n\n他缓步走上前，亲手拍去陈长庚肩头的炭灰，顺势拉过陈长庚的手腕搭了搭脉。\n\n探见那脉象比三日前更加“微弱迟滞”，火煞气机仿佛已彻底浸润心房，孙奉先满意得眉眼都弯了起来，拍着陈长庚冰凉的手背慢悠悠开口道：\n\n“无妨，一点小惊吓算不得什么。你的身子骨已经被温脉汤养熟了，下月初八地火大潮，为师替你开大炉彻底洗髓。”"}, {"n": 7, "title": "暗渠换雷", "body": "十月廿九午后定下初八开炉，满打满算只给陈长庚留了九天活命工夫。\n\n转眼熬过三日，到了十一月初二寅初。\n\n丹房外室墙角的青砖缝再次渗出滚烫地热，第五轮地脉潮汐如期而至。\n\n陈长庚听准内室孙奉先绵长的吐纳声未变，悄悄摸到排烟总道下方，将两捧紫黑油亮的头等废丹炉灰塞进灰石臼。\n\n暗金裂痕微光流转，一刻钟后，一股甜腻刺鼻的地火异味钻出臼口，转瞬便被轰鸣的药炉黑烟卷上夜空。\n\n陈长庚低头一瞧，臼底静静躺着一撮足有指甲盖大小、宝光莹然的道髓晶砂，成色比前几回还要精纯三分。\n\n他喉结微动，却硬生生忍住了仰头吞服的冲动。\n\n哪怕借这撮晶砂冲上通窍四窍，未入开脉境终究无法外放灵气。\n\n孙奉先是通窍九窍圆满的老丹师，腰间常年挂着一枚翠绿护身玉符，单凭横练拳脚与淬毒分水刺，绝难在一息之内破符杀人。\n\n一旦首击不中，让那老鬼腾出手祭出丹火或是捏碎传讯玉牌，自己必死无疑。\n\n想要十拿九稳，手里就得攥着不耗内息、贴脸一击便能轰碎高阶护身符的狂暴重火器！\n\n陈长庚用粗石飞快磨去晶砂边角，裹上一层薄薄的老盐泥封进油纸包，看了眼窗外渐沉的残月。\n\n晶砂离了石臼只能存留六个时辰，一过今日申初便会散成白灰。\n\n卯初刚到，他照常推起堆满废灰的独轮车出了后院，一路摇到西墙根芦苇掩映的排污暗渠口。\n\n“哗啦。”\n\n铁栅栏下的臭水里准时探出一颗包着黑头巾的精瘦脑袋。\n\n贺九斤搓着冻僵的手指凑近栅栏，压低嗓门笑道：“长庚兄弟，隔了才三天又唤哥哥来，莫非又从哪个废槽抠出碎矿髓了？”\n\n“贺哥自己掌眼。”\n\n陈长庚不多寒暄，隔着铁栅缝将油纸包递过去，掀开一角。\n\n贺九斤伸指一捻，指肚刚触到那股磅礴温润的精纯灵气，手腕猛地一抖，险些把油纸包掉进臭水沟里！\n\n“我的亲娘！”贺九斤倒吸一口凉气，眼珠子瞪得溜圆，“这么大一撮极品老矿髓？！拿到黑石坊市大铺子里，少说能换十枚下品灵石！”\n\n啪的一声，陈长庚合拢油纸撤回半尺。\n\n“我不换灵石。”陈长庚盯着贺九斤发红的眼睛，一字一顿道，“替我跑一趟黑石坊市鬼市，今晚亥末之前，带三枚‘过载烈阳火珠’回来。”\n\n贺九斤脸上的狂喜瞬间僵住，嘴角狠狠一抽：“啥玩意儿？过载烈阳火珠？！”\n\n他拼命摆着双手往后缩了半尺：“兄弟你疯了！那是黑市火器匠炼坏的残次雷火珠，不用灌多少内息、扯断铜引就炸！”\n\n“三枚一块儿响，连通窍八九窍老修的护身符都能掀碎，可珠壳烫得跟烙铁似的，揣怀里磕碰一下，连人带骨头都得炸成肉泥！”\n\n“正因为没人敢揣，三枚残次货顶多值七枚下品灵石。”陈长庚声音冷平，“剩下的差价，全归贺哥当跑腿费。”\n\n“不是钱的事儿！”贺九斤苦着脸直搓牙花子，“大白天往返六十里去淘违禁火器，万一让坊市黑店盯上，哥哥这条小命可就交待了！缓三天，等下集夜墟我再替你摸……”\n\n“缓不了。”\n\n陈长庚打断他，左手摸出上次剩下的那一块半碎灵石拍在栅栏石台上，心里故意把矿髓离地的时辰往多里报了一截，好给坊市铺子留足验货余量：\n\n“这包矿髓已离地气两个时辰，封不住灵。今日巳末之前卖不掉，一到午时就是一把不值钱的白灰。”\n\n贺九斤眼皮狂跳，目光在十枚灵石的暴利与碎灵石定金之间来回挣扎。\n\n跑这一趟顶他在大泽倒腾三年私盐！\n\n陈长庚右袖微垂，指尖轻轻叩了叩袖里的精铁短刺，语气淡得听不出喜怒：“算上这块半定金，贺哥这一趟净赚四枚半灵石。接，现在咬破指头立个心血毒誓；不接，我这就把矿髓倒进臭水沟，绝不连累贺哥。”\n\n这话软中带铁，半点退路不留。\n\n贺九斤一咬后槽牙，狠心往自己右手大拇指上咬出一滴殷红血珠，弹在铁栅栏上低咒道：“妈的，富贵险中求！我贺九斤今儿指血为誓，但凡走漏长庚兄弟半句口风、私吞一分货，教我肠穿肚烂死在盐泥坑里！”\n\n“爽快。”陈长庚将油纸包与碎灵石一并推过去，“今晚亥末，别进暗渠，到盐场西外围那片芦苇毒泥荡的老柳树下交货。”\n\n“成！亥末不见不散！”\n\n贺九斤一把抓过货揣进怀里，猫腰钻出涵洞外口，撒开快腿一头扎进了茫茫晨雾。\n\n陈长庚望着他远去的背影，眼底却无半分轻松。\n\n十枚灵石的极品矿髓急着在巳末前脱手，换的又是无人问津的残次雷火珠，黑石坊市那些吃人不吐骨头的铺子掌柜岂能不起歹心？\n\n当夜亥初，乌卤盐场各灶熄了明火，夜雾浓得伸手不见五指。\n\n陈长庚替内室添足夜炭，锁好外间房门，悄无声息钻进干涸的备用排卤管，提前半个时辰摸到了盐场西墙一里外的芦苇毒泥荡。\n\n他没有站在约定的老柳树下，而是抓起两把恶臭黑泥涂满脸颊脖颈，整个人伏进距柳树三丈外的一处芦苇浅泥坑里，连呼吸都压得近乎断绝。\n\n夜风吹过枯苇，发出沙沙轻响。\n\n挨到亥末时分，西面小径终于传来一阵深一脚浅一脚的急促踏水声！\n\n贺九斤怀里紧抱着一只厚牛皮袋，跑得上气不接下气，刚冲到老柳树下，左后方芦苇丛里猛地窜出两条提刀黑影，一前一后将去路堵了个严实！\n\n“跑啊，贺猴子，怎么不跑了？”\n\n前头一个左脸带刀疤的壮汉狞笑着晃了晃手里的鬼头刀，通窍三窍的凶悍气机毫不掩饰地压了过来。\n\n后头堵路的矮墩伙计更是贪婪地盯着贺九斤怀里：“大清早拿极品老矿髓急换三枚废火珠，铁火铺做了十年买卖也没见过这么肥的羊！说，盐场里头供货的正主是谁？”\n\n贺九斤吓得面无人色，脊背紧贴住老柳树干：“刘疤子、钱五！你俩疯了？坏了铁火铺的规矩，掌柜饶不了你们！”\n\n“少拿掌柜吓唬爷！”刘疤子往前逼近一步，刀尖直抵贺九斤咽喉，“宰了你沉进毒泥塘，神不知鬼不觉！把火珠交出来，再带爷去摸那正主的底，饶你不死！”\n\n矮墩伙计钱五在后头怪笑道：“跟他废什么话，先卸一条胳膊，保管他连亲娘姓啥都招出来！”\n\n贺九斤额头冷汗如雨，眼瞅着刀锋已经割破脖颈油皮，求生的本能让他双膝一软，张嘴就要往丹房方向指：“别动手！我说，货是盐场里头——”\n\n“哗啦！！”\n\n他后半句话还没出口，刘疤子身侧三尺外的黑泥坑骤然炸开！\n\n一道裹满黑泥的瘦削身影如潜渊恶蛟般暴起发难，快得在夜雾里拉出一道残影！\n\n刘疤子不愧是刀口舔血的通窍三窍恶徒，耳听风响猛地拧腰回劈！\n\n陈长庚不闪不避，覆着古铜铁泽的左小臂硬生生格开刀背，金铁交击般的闷响中，他右拳裹挟着《井煞锻骨功》千斤横练巨力，正面轰在刘疤子毫无防备的咽喉上！\n\n“咔嚓！”\n\n喉骨寸寸塌陷的脆响在夜雾中格外瘆人！\n\n刘疤子眼珠暴凸，连半声惨叫都没发出来，百十斤的壮硕身躯便像破麻袋一样倒飞出去！\n\n“点子扎手——”\n\n后头的矮墩伙计钱五吓得亡魂皆冒，刚举起短刀要喊，陈长庚脚下泥水一炸，已贴着芦苇根欺进他怀里！\n\n右袖乌光一闪，七寸淬毒分水刺精准无比地从钱五左肋缝隙扎入，直透心房！\n\n钱五浑身剧颤，嘴里涌出黑血，当场软倒在泥水里抽搐了两下便没了声息。\n\n前后不过三息！\n\n贺九斤张着嘴僵在老柳树下，双腿抖得像筛糠一样，裤管顺着脚踝直往下滴热尿。\n\n陈长庚半句废话没讲，拔出分水刺在尸身衣襟上擦净，利索地从刘疤子怀里摸出四两碎银和一块隔热石棉布，随后一手拎起一具尸首的脚踝，拖到旁边冒着绿泡的毒泥深塘边，松手沉了底。\n\n咕嘟两串浊泡翻过，泥塘恢复死寂。\n\n陈长庚掬起一捧凉水洗净脸上手上的黑泥，这才转过身，静静看向树下瘫软的贺九斤。\n\n“噗通！”\n\n贺九斤双膝一软，结结实实跪进了烂泥里，双手高举着那只厚牛皮袋过顶，牙齿撞得咯咯直响：“长、长庚爷！刚才小的那是诈他们近身，绝没敢吐您半个字啊！”\n\n他心里早已掀起了惊涛骇浪——一拳打死通窍三窍的刘疤子，这哪是什么受气的司火童子，分明是一尊披着羊皮的煞神！\n\n陈长庚走上前接过厚牛皮袋，隔着三层牛皮都能摸到里头三枚铁珠惊人的灼烫。\n\n他打开袋口扫了一眼，三枚龙眼大小、遍布赤红裂纹的烈阳火珠正用火油泥封着铜引，确认无误，随手将刚摸来的四两碎银丢在贺九斤膝前。\n\n“这两天黑石坊市必有人查刘疤子的下落。”陈长庚声音平淡，“你找个由头歇脚避避风头，我不传讯，别再往暗渠凑。”\n\n“是是是！小的明早一准去南镇躲半个月，烂掉舌头也绝不敢提今晚半个字！”贺九斤抓起碎银磕了个响头，连滚带爬地消失在夜雾深处。\n\n陈长庚揣稳火珠，原路钻回排卤干管，赶在子正前悄无声息回到了丹房外室。\n\n接下来两日风平浪静。\n\n转眼到了十一月初五寅初，距初八开炉死限只剩最后三天。\n\n第六轮地脉潮汐汹涌而至，陈长庚将这几日攒下的高浓废丹灰尽数炼化，一鼓作气吞下整捧道髓晶砂！\n\n轰隆！\n\n四肢百骸气血如烘炉沸腾，第四处蒙尘主气窍势如破竹般轰然贯通！《井煞锻骨功》水到渠成踏入小成之境，周身筋骨紧绷时硬如百锻熟铁。\n\n天色将明，陈长庚吹熄油灯，就着炉膛微光，用抢来的隔热石棉布裹紧三枚滚烫的过载烈阳火珠，一颗颗贴肉塞进左腕特制的厚牛皮护腕暗槽里。\n\n刚拉紧护腕皮扣系成活结——\n\n“咔哒。”\n\n一墙之隔的丹房内室炉基底下，忽然传出一声轻微的青砖松动闷响！\n\n想是连日地火渐旺烘裂了旧泥灰，墙根连接内室排灰槽的一块缺角青砖往外滑开了半寸，紧接着，半截带着深深抓痕、被邪火熬得枯黑干瘪的少年指骨，咕噜噜从砖缝里滚了出来，正停在陈长庚鞋尖前！"}, {"n": 8, "title": "石闸落锁", "body": "外室炉火幽暗，那半截枯黑指骨静静躺在青砖地上，指尖断面还残留着死前抠抓石板崩裂的惨状。\n\n陈长庚垂眸看了两息，眼皮都没跳一下。\n\n不用猜也知道，这就是上一任“火毒攻心病逝”的司火童子留下的唯一遗骸。\n\n他弯下腰，不动声色地用一块油布将这半截枯黑指骨裹紧，顺手塞进自己贴腰破布带的暗袋深处——等掀了桌子，这截指骨或许还能派上大用场。\n\n随手拿湿泥将松动的炉基砖缝重新抹平，内室木门恰好吱呀一声开了。\n\n孙奉先披着褐色丹袍走出来，气色显得有些阴晴不定，目光扫过正在弯腰添炭的陈长庚，忽然温和一笑：“长庚，这两日地火躁得很，外头的粗活先放一放，好生养足精神，莫亏了气血。”\n\n“谢仙师体恤，小的省得。”陈长庚扶着膝盖慢吞吞站起身，面色蜡黄地低咳了两声。\n\n初五、初六两日，丹房内外安静得反常。\n\n孙奉先不仅停了原本每日递增的苦差，甚至没再盯着他清扫炉灰，一门心思关在内室调试那尊四尺高的青铜主炉。\n\n陈长庚心里跟明镜似的——杀猪之前，总得让猪喘匀了气，放出来的血才够鲜亮。\n\n他照旧每天按时现身，左腕厚牛皮护腕里三枚过载烈阳火珠烘得皮肉微红，右袖滑扣里顶着淬毒分水刺，单等初八清早进炉房见真章。\n\n谁知到了十一月初七申末，变故突生！\n\n天边残阳刚沉入大泽芦苇荡，紧闭了两日的内室大门猛地推开。\n\n孙奉先竟已换上一身浆洗得笔挺的云泽宗青色法袍，腰悬翠绿护身玉符与锦缎储物囊，大步流星走出外室，站在院心拍了拍巴掌：“老张、小六，都过来！”\n\n正在前院挑水劈柴的三名外院杂役慌忙丢下扁担，小跑着凑到石阶下躬身听训。\n\n孙奉先摸出两串铜钱丢在石桌上，笑眯眯地开口：“地底火脉潮汐提前半日涌上来了，今晚老夫要封院静修。你们几个拿钱去前头伙房打两斤烧刀子，再替丹房去总库领十车冬炭，明早辰时之前，谁也不许回院惊扰清气！”\n\n挑水的老张欢天喜地抓起铜钱磕头：“谢仙师赏！小的们明早再来伺候！”\n\n唯独扫院的机灵杂役小六偷瞄了一眼屋檐下冒黑烟的排风口，迟疑着小声道：“仙师，今晚地火这么旺，外院一个人不留，万一后半夜走水可咋整？”\n\n孙奉先脸上的慈和笑意瞬间淡了半分，浑浊老眼冷冷斜了小六一眼：“老夫通窍九窍的修为亲自坐镇，还要你一个凡人操心走水？”\n\n一股无形煞气迎面压下，小六吓得脖子一缩，脸色煞白地连扇自己两个嘴巴：“小的蠢嘴！小的这就滚去拉炭！”\n\n三名杂役哪敢多留半息，逃命似的挤出丹房大门。\n\n孙奉先亲自走到院门后，“哐当”一声落下碗口粗的包铁大木栓，又从袖里摸出一张黄纸隔音符贴在门背上。\n\n屋檐阴影里，陈长庚透过窗棂缝隙看着这一幕，心脏骤然收紧。\n\n老狐狸等不到明早初八了！\n\n大概是前几日周大昌闯院闹事让他生了忌讳，生怕夜长梦多走漏禁丹风声，竟提前半日清场锁院！\n\n不过片刻，杂沓脚步声折回内室，不多时，孙奉先双手托着一只黑釉瓷碗，慢步跨进了外室门槛。\n\n碗盖一揭，一股浓烈得令人作呕的甜腻火腥气扑面而来！\n\n碗里盛着的不再是平日清亮的温脉汤，而是一碗粘稠如暗红猪血、表面还在微微翻滚细泡的诡异浓汤——里头掺的“赤煞引”分量，少说比平日重了三倍不止！\n\n“长庚啊，过来。”\n\n孙奉先没有走近，而是稳稳停在距陈长庚五步开外的长案前，将黑釉瓷碗放在桌沿，慈眉善目地招了招手：“天赐良机，地火大潮提前到了。来，把这碗为师熬了两个时辰的‘固元浓汤’趁热喝干，半个时辰后为师就替你开大炉洗髓。”\n\n陈长庚双手拢在灰袍袖里，肩膀微微瑟缩，故意往后退了半寸，喘着粗气颤声道：“仙、仙师……前儿您不是算准了明早初八才开炉吗？小的今儿不知怎的心慌气短，能不能容小的缓一宿，明早再喝……”\n\n“傻孩子，地火潮汐哪会等人？”\n\n孙奉先语调依旧慢条斯理，句句透着长辈的关切，可他脚下正好堵死了外室唯一的正门！\n\n陈长庚眼角余光看得清清楚楚：孙奉先左手两指正轻轻搭在腰间那枚翠绿护身玉符上，垂在身侧的右手袖口无风自动，隐隐透出一丝炽白丹火热浪！\n\n“为师为了凑齐这碗汤里的三株百年血芝，连压箱底的灵石都搭进去了。”孙奉先眯起眼睛，死死钉住陈长庚的咽喉，声音轻缓却字字诛心，“怎么，到了临门一脚，你倒信不过为师的一片苦心了？”\n\n外室空气仿佛在这一刻凝成了铁块。\n\n陈长庚脑海中念头电转，瞬间将眼下死局扒了个底朝天！\n\n现在翻脸拒喝、拔刺暴起？\n\n两人相距整整五步！九窍圆满修士全神戒备之下，不等他跨出两步，那缕能瞬间烧穿周大昌肉掌的炽白丹火就会糊在他脸上，腰间护身玉符更会挡死所有偷袭！\n\n至于破窗硬逃？院门已封，盐场外围全是巡防铁骑和灵犬，没拿到脱籍路引冲出去，不出半个时辰就会被云泽宗驻场执事当叛逃杂役格杀！\n\n孙奉先如此惜命多疑，之所以堵在五步外逼他喝药，就是生怕猎物临死反扑！\n\n不亲眼看着这碗三倍毒汤滑进肚里、不亲手探见药渣脉绝垂死，这老鬼绝不会撤掉防备，更不会打开隔绝声息的地下地火密室！\n\n想在盐场神不知鬼不觉地弄死一位九窍仙师，唯一的生路，就是顺着他的意，把这碗催命毒汤当面咽下去！\n\n电光石火间，陈长庚脸上浮现出惶恐愧疚之色，“噗通”一声跪在青砖地上，重重磕了个头：“小的不知好歹！仙师待小的恩重如山，小的这就喝，绝不糟蹋仙师的心血！”\n\n说着，他膝行两步凑到长案前，双手颤巍巍捧起那只滚烫的黑釉瓷碗，凑到嘴边仰起脖子，“咕咚、咕咚”三大口，眼皮都不眨地将整碗粘稠暗红的毒汤喝了个精光！\n\n喝罢，他甚至主动把空碗底翻转过来，亮给五步外的孙奉先过目。\n\n孙奉先死死盯着陈长庚上下滚动的喉结，见那碗霸道绝伦的三倍赤煞浓汤滴水不漏全进了食管，紧绷的右肩终于微不可察地松了一丝：“好孩子，快坐下运功化开药力。”\n\n“谢……谢仙师……”\n\n陈长庚刚吐出四个字，那股滑入咽喉的暗红毒汤便如滚烫铁水般轰然炸开，蚀骨火煞疯了似的朝下腹心脉猛钻！\n\n早有准备的陈长庚眸底精芒暗闪，体内通窍四窍的磅礴气血瞬间在食管下端筑起一道铜墙铁壁，死死锁住咽喉关隘！\n\n与此同时，他双臂死死箍住胸口，让贴肉藏着的灰石臼紧紧抵住膻中穴——虽离明日寅初第七轮潮汐冷却还差三个多时辰，无法析晶拔毒，但微温的古石臼本能汲取火煞，硬生生替他分担吸走了三成狂暴燥气！\n\n九成剧毒浓汤被他生生截留在食管上端，连半丝都没能渗进心脉！\n\n剧烈的火毒灼烧得咽喉血肉嘶嘶作响，陈长庚借着这股真切剧痛，牙齿狠狠咬破舌底血络，同时逆冲鼻腔与耳根微末血丝，喉咙里发出一声凄厉嘶哑的惨哼，“哐当”摔碎瓷碗，整个人软绵绵扑倒在冰冷石地上！\n\n“噗——咳咳！”\n\n大股截留在食管里的暗紫黑血顺着他嘴角狂涌而出，紧接着，他眼角、鼻孔与双耳竟齐齐渗出一缕缕触目惊心的乌黑毒血，浑身剧烈抽搐了两下，气息瞬间微弱得如同风中残烛！\n\n“仙师……汤里……好烫……徒儿心口……像裂开了……”\n\n陈长庚十指徒劳地抠着地面青砖，眼神涣散失焦，气若游丝地呢喃着。\n\n五步外的孙奉先没有立刻扑上来，而是背着手站在原地冷眼瞧了足足五息。\n\n见地上少年抽搐渐止、连胸膛起伏都快看不见了，他才慢悠悠踱步上前，先拿靴尖踢了踢陈长庚瘫软的小腿，随后俯身探出两根枯指，重重搭在陈长庚右腕脉门上。\n\n陈长庚早已运转《井煞锻骨功》将四窍真气尽数锁入骨髓深处，只留一缕被咽喉残毒熏染得杂乱将绝的表层浮脉在指下苟延残喘。\n\n“脉若游丝，赤煞锁心……成了！哈哈，成了！”\n\n孙奉先探足三息，感受到那股直冲指尖的狂暴赤煞药力，压抑了二十年的狂喜终于冲垮了最后一丝戒备！\n\n他站起身拍了拍手上的灰尘，哪还有半点方才慈爱师长的模样，居高临下瞥着满脸黑血的陈长庚，冷笑道：“九窍蒙尘的短命鬼，能给老夫的‘赤煞破障丸’当主药引子，也算你八辈子修来的福分！”\n\n说罢，孙奉先弯腰一把揪住陈长庚后背灰袍衣领，像拖一条死狗似的将他拖进内室，一脚踩开丹架后的精铁机括。\n\n轰隆隆！\n\n地面裂开一道幽深暗门，灼热浪潮裹挟着刺鼻硫磺味扑面涌出。\n\n孙奉先拽着“人事不省”的陈长庚顺着十二级青石台阶一路拖到底部宽敞的地下地火炼丹室，随手将他扔在正中央那尊烈焰翻腾的青铜大丹炉前。\n\n转身扳动墙侧铁绞盘——\n\n“轰隆！！咔嚓！”\n\n重达千斤的生铁包石大闸轰然坠落，严丝合缝地锁死了地室出口，将内外一切声响彻底隔绝！\n\n赤红地火映照下，孙奉先彻底收起了维持半月有余的慈和假面，枯瘦十指飞快掐动诡异母引法诀，遥遥对准石地上惨白染血的陈长庚：“乖徒儿，借你一身精血助老夫叩开仙脉吧。”"}, {"n": 9, "title": "贴脸炸符", "body": "地下地火炼丹室四壁皆由整块黑沉青冈岩垒砌，地面三条火道赤焰咆哮，将中央那尊四尺高的三足青铜丹炉烧得通体暗红。\n\n炉盖气孔正汩汩冒着紫黑药雾，散发出令人头晕目眩的血腥甜香。\n\n五步开外的石台之上，孙奉先双手结成古怪的赤红法印，浑身通窍九窍圆满的气机毫无保留地轰然张开，袖袍鼓荡猎猎作响！\n\n“赤煞归母，抽髓化虹——起！！”\n\n随着他一声阴厉低喝，一缕殷红丹煞自他指尖激射入青铜主炉！\n\n炉内沸腾的紫黑药液猛地掀起尺许高的血浪，发出一阵阵凄厉如鬼哭般的嗡鸣，一股无形吸摄之力瞬间笼罩在炉前五步外的陈长庚身上！\n\n按黑市禁方铁律，只要猎物心脉种满了“赤煞引”，母炉一响，全身精血骨髓便会不受控制地破体而出，化作血虹尽数投入炉中，半盏茶工夫就能把活人抽成一张干皮！\n\n孙奉先嘴角高高扬起，满眼狂热地盯着炉口，坐等精血入鼎。\n\n一息过去。\n\n两息过去。\n\n足足五息过去！\n\n青铜大炉里的紫黑药液空自翻滚咆哮，可瘫在冰冷石地上的陈长庚除了一身刚吐出来的黑血，周身毛孔竟干干爽爽，莫说精血化虹，连半滴汗珠子都没被抽出来！\n\n“嗯？！”\n\n孙奉先脸上的狂喜骤然僵住，眉头拧成一个死结：“怎会毫无动静？！”\n\n他不信邪地猛咬舌尖，一口本命精血喷在法印上，双目赤红地再度厉喝：“给老夫起！！”\n\n嗡——！\n\n母炉震颤得连炉脚都在火星乱迸，可五步外的陈长庚依旧纹丝不动！\n\n孙奉先哪里想得到，他苦心孤诣喂了半个月的赤煞引，早被灰石臼炼出的无瑕道髓晶砂洗得连渣都不剩；就连方才那碗三倍重剂的固元浓汤，也早在咽喉关口被截下吐净，心脉深处干净得宛如一块百炼生铁，母引法诀如何勾得动分毫？\n\n“不对！绝不可能！”\n\n孙奉先脸色瞬间变得铁青，眼中疑云暴涨，猛地收住法诀阴鸷盯向地上的少年：“小畜生，你把刚才那碗浓汤吐哪儿去了？！还是你身怀什么锁血异骨？！”\n\n石地上，陈长庚依旧紧闭双眼，没有在五步开外暴起发难。\n\n五步距离看似极近，可隔着青铜大炉，九窍老修只要一步退上石台，三枚火珠便炸不碎他的要害！\n\n猎人耐得住最后一口气，恶狼才会自己把脖子伸进夹子里。\n\n“咳……仙师……”\n\n陈长庚肩膀痛苦地抽搐了一下，嘴角又溢出一缕黑血沫子，声音细若蚊蚋、断断续续：“徒儿肚子里……像结了冰……好冷……是不是汤熬坏了……”\n\n听见这濒死般的虚弱呓语，孙奉先眼角微跳，惊疑稍减，可惜命多疑的本性仍让他没有直接迈步上前。\n\n“哼，装神弄鬼！”\n\n孙奉先右手往腰间锦缎储物囊上一拍！\n\n哗啦一声脆响，一条拇指粗细、通体铭刻赤火符文的法器“赤铜火链”如火蟒出洞般破空飞出，瞬间在陈长庚双肩、胸膛与上臂紧缠了三道，链尾倒钩啪地扣严！\n\n炙热器火当场将陈长庚外层的灰布袍灼出焦烟！\n\n陈长庚暗咬牙关，将《井煞锻骨功》小成的古铜皮膜向内微敛，任由滚烫铜链勒破表层油皮而不触发骨骼反震，顺势闷哼一声扑倒在地，连那缕表层浮脉都彻底散去，活脱脱一副被法器震断生机的垂死惨状！\n\n“一窍蝼蚁，捆住了看你还能翻出什么浪花！”\n\n孙奉先狠狠拽了两下链尾，见地上之人软得像摊烂泥、连手指头都抬不起来，高悬的疑心终于落定。\n\n他扭头看了一眼火道里渐渐逼近极盛顶峰的赤白地火，额头急出了细汗。\n\n地火大潮至多只能维持两刻钟！既然隔空母引勾不出精血，定是这小子常年熬卤导致火毒淤堵了心口血窍——只需上前一掌拍碎他天灵盖，再拿短刀割开心口直接往炉里放血，照样能赶在火潮退去前凝成破障金丹！\n\n“葛伯……别压秤……小的没偷盐……”\n\n石地上，陈长庚双目半翻，喉咙里溢出两声神志不清的临终胡话。\n\n“蠢货，下辈子投个好胎，莫再进乌卤盐场当耗材了！”\n\n孙奉先嗤笑一声，最后一丝戒备彻底烟消云散。\n\n他松开链尾，大步跨下石台——\n\n五步！\n\n四步！\n\n三步！\n\n转眼间，孙奉先已走到陈长庚头顶跟前，毫无防备地弯下老腰，枯瘦如鹰爪的右手带着凌厉劲风，径直朝陈长庚天灵盖抓落！\n\n两尺！\n\n一尺！\n\n指尖阴风已吹动陈长庚额前碎发！\n\n就在那五根枯指将触未触的一刹那，原本趴在血泊里“气息奄奄”的陈长庚骤然抬头！\n\n那双漆黑眸子里哪有半分涣散浑浊，唯有蛰伏半月、冷彻骨髓的森然杀机！\n\n没有半句废话，更无一声呐喊！\n\n陈长庚胸背肌肉轰然鼓胀，通窍四窍的狂暴气血与《井煞锻骨功》百锻铁骨在同一息炸开极致怪力，双肩猛地向外一振——\n\n“咔嚓——嘣！！”\n\n专用来困锁低阶修士的赤铜火链竟承受不住这股蛮横巨力，三道铜环应声崩裂炸飞！\n\n“什么？！四窍横练——”\n\n孙奉先吓得头皮炸裂，眼珠子险些瞪出眼眶，本能地想要仰身暴退并催动袖中丹火！\n\n晚了！\n\n三步之内，便是贴脸绝杀的阎王死距！\n\n陈长庚双膝借力如暴虎扑食般贴地欺入他怀中，左臂猛地撕裂焦黑衣袖与厚牛皮护腕，五指不顾滚烫灼烧，一把攥住全部三枚布满裂纹的过载烈阳火珠，大拇指一抹扯断三根铜引，用血肉左掌狠狠按在了孙奉先心窝正中！\n\n“疯子！不——！！”\n\n“轰隆——！！！”\n\n三枚濒临极限的残次烈阳火珠在零距离同时炸膛！\n\n刺目欲盲的狂暴赤白雷火瞬间吞没了整座地下石室，震耳欲聋的轰鸣撞在四壁青冈岩与千斤石闸上，震得碎石灰尘簌簌狂落！\n\n孙奉先腰间那枚翠绿护身玉符瞬间自动激发，撑起一道尺许厚的碧绿灵光护罩！\n\n可这护罩在三枚过载火珠毫无死角的贴胸叠加轰击下，仅仅硬撑了不到半息，便发出一声哀鸣，“啪”地寸寸崩裂成漫天绿粉！\n\n毁灭性的雷火气浪长驱直入，当场将孙奉先胸前青色法袍连同大片皮肉炸得血肉模糊，右半边肩胛骨咔嚓碎裂，整个人如断线破布般狂喷鲜血倒飞出去，重重砸在青铜丹炉粗大的铜足上！\n\n近在咫尺的陈长庚同样被狂暴反震掀退两步，左前臂皮开肉绽、一片焦黑糊烂，五脏六腑震得翻江倒海，一口逆血涌到嘴边，又被他咬紧牙关硬咽了回去！\n\n“咳噗……你、你敢阴老夫……”\n\n浓烟烈焰之中，半边身子血肉淋漓的孙奉先竟还没断气！\n\n九窍圆满修士强横的生命力让他从剧痛中生出无边恐惧，眼看陈长庚提刺走来，他左手疯了似的探进怀里，一把摸出一枚莹白传讯玉牌，五指发力就要将其捏碎唤来云泽宗执法铁骑！\n\n“给老夫陪葬——”\n\n陈长庚连一个字都没回他！\n\n顶着尚未散尽的滚烫火浪，陈长庚脚下猛踏青砖，身形如鬼魅般跨过两步火海，赶在孙奉先指尖发力的前一瞬，左脚如铁桩般狠狠跺下，一脚踩碎了孙奉先握着传讯玉牌的左手腕骨！\n\n“啊——！”\n\n惨叫声刚冲出半声，陈长庚右手紧扣的七寸乌黑淬毒分水刺已化作一道夺命寒芒，“噗嗤”一声从孙奉先仰起的咽喉正中悍然捅入，透颈而出，将其牢牢钉在了滚烫的青冈岩石柱上！\n\n手腕冷酷一拧！\n\n三棱血槽携着剧毒蛇蝎寒气瞬间绞断了喉管与颈椎骨！\n\n孙奉先双目圆睁，凸出的眼球定定望着眼前这个满脸烟灰、左臂焦烂却稳如磐石的十六岁少年，喉咙里咯咯涌出两团黑红血泡，头颅一歪，彻底断绝了生机。\n\n地火炼丹室内，只剩赤红岩浆火道还在呼呼咆哮。\n\n陈长庚剧烈喘息了两口粗气，握住刺柄猛地拔出淬毒分水刺，在孙奉先尚带余温的衣摆上擦去黑血。\n\n他强忍左臂火辣辣的焦痛蹲下身，先从孙奉先踩碎的左手掌心里掰出那枚完好无损的莹白传讯玉牌塞进怀里，右手刚摸向尸身腰间的锦缎储物囊——\n\n“砰！砰砰！”\n\n十二级台阶上方，那道厚重的千斤石闸外，忽然响起一阵沉闷试探的拍门声！\n\n紧接着，正把头周大昌嘶哑谄媚的嗓音顺着石闸底缝钻了进来：“孙仙师，外头排烟口烟色发黑不对劲，可要小的进来替您添把炭？”"}, {"n": 10, "title": "焚炉截信", "body": "石闸厚达尺许，外头周大昌的拍门声闷如擂鼓。\n\n陈长庚蹲在孙奉先尚带余温的尸身旁，动作骤然定住，连呼吸都压到了极点。\n\n贴着石闸底缝侧耳细听，台阶上方除了周大昌粗重的喘息，还夹杂着另一道压低嗓门的哆嗦劝阻声：\n\n“大把头，孙仙师前头贴了封院符，咱拿后门私钥匙偷偷摸进来，万一惹恼了他老人家……”\n\n是外灶胡管事的声音！\n\n“闭上你的乌鸦嘴！”周大昌咬牙低骂，“刚那声闷响震得后巷地面都颤了，排烟口还直冒黑烟！万一姓陈的小畜生抗不住药劲闹出乱子，老子正好进去邀功！”\n\n陈长庚眸光一冷，瞬间摸透了两人的心思。\n\n硬开石闸冲出去杀人？外头不知跟了几个刀手，一旦惊动盐场巡防铁骑围院，他浑身是血插翅难逃。\n\n眼下千斤石闸锁严，外头根本看不见密室里的血腥惨状！\n\n电光石火间，陈长庚左手食指与中指轻轻抵住自己被毒汤灼哑的喉结，胸腔内息微沉，硬生生将少年清亮嗓音压成苍老沙哑的慢腔：\n\n“周大昌……谁借你的狗胆，敢私闯老夫禁地？”\n\n这声音慢条斯理，带着三分刚被惊扰的阴鸷怒意，顺着石闸底缝幽幽飘上台阶，与平日孙奉先训斥下人的腔调一般无二！\n\n石闸外猛地一静。\n\n紧接着响起周大昌吓得倒退半步、撞在石壁上的闷响：“啊！仙、仙师息怒！小的见烟囱冒黑火，生怕炉炭不够坏了您的大事！”\n\n“蠢货！”陈长庚一边维持着苍老慢腔隔门训斥，一边手脚不停，悄无声息解下孙奉先腰间的锦缎储物囊，“老夫正融百年赤阳铁髓入丹，烟黑几分又有何奇？”\n\n外头胡管事吓得腿肚子直转筋，拽着周大昌衣袖直颤：“仙师恕罪！小的这就劝大把头退出去！”\n\n陈长庚眼底寒芒微闪，对着闸缝又补了诛心一句：“周大昌，看来前几日那缕丹火只烧烂你半只右手，还没让你长足记性？”\n\n门外周大昌浑身剧震，断掌旧伤火辣辣地抽痛起来，双膝一软差点跪在台阶上：“不敢！小的长记性了！小的这就滚！”\n\n“滚去院墙十丈外候着！”陈长庚冷哼一声，语气透着不容置疑的倨傲，“子时之前，谁敢再靠近内院半步惊了凝丹火候，老夫连你叔侄一并炼成飞灰！”\n\n“是是是！小的亲自替仙师守住巷口，绝不放半只苍蝇进来！”\n\n“快走快走，莫触了仙师霉头！”\n\n杂乱惶恐的脚步声连滚带爬退出十二级台阶，很快听见内室木门被轻轻合拢，彻底没了动静。\n\n陈长庚这才松开抵住喉结的手指，吐出一口带血的浊气。\n\n这一吓顶多能瞒过一刻钟，必须赶在地火失控前把家底刮干净！\n\n他先掏出方才掰下的那枚莹白传讯玉牌扫了一眼，毫不犹豫扬手丢进脚边咆哮的赤红岩浆火道。\n\n传讯玉牌连半息都没撑住，嗤地融成一滩白汁，彻底断绝了云泽宗本山追查气息的可能。\n\n紧接着，陈长庚将一缕四窍气血探入那只无主锦缎储物囊，哗啦一声把里头的东西尽数倒在干燥青砖上。\n\n最先滚出来的是一小堆棱角分明、流淌着莹润灵光的晶石！\n\n陈长庚五指飞快拨过，心脏重重一跳：“足足十八枚下品灵石……老鬼十年刮地皮的家底全在这儿了。”\n\n按盐场市价，一枚下品灵石抵得上百两纹银还要门路，这十八枚灵石便是近两千两雪花银的巨款！\n\n灵石旁边还躺着半卷非丝非麻的赤褐绢书，封皮书着《控火诀》三字，正是孙奉先赖以成名的控火辨脉真传残篇。\n\n陈长庚顺手将灵石与绢书塞进储物囊，目光落在了最后一件巴掌大小的青白玉匣上。\n\n玉匣入手冰凉刺骨，匣盖四周镌刻着细密的锁灵阵纹。\n\n“竟是一只锁灵寒玉匣！”陈长庚眼底涌起真切喜色，“有了这匣子封存，灰石臼往后炼出的道髓晶砂，再不怕满六个时辰散成白灰了！”\n\n搜空储物囊，他没有就此罢休，而是提着淬毒分水刺快步走到中央那尊青铜大丹炉后侧。\n\n孙奉先这等惜命多疑的老狐狸，真正见不得光的命根子绝不会全放在腰包里。\n\n陈长庚蹲下身，拿刺尖沿着丹炉底座一块颜色略深的隔火青砖猛力一撬！\n\n咔哒一声轻响，青砖翻开，底下果然藏着一格尺许见方的精铁暗匣。\n\n暗匣里没有灵石，只压着半张绘满山川水路的兽皮残图，以及一封火漆未封口、尚未寄出的信函，信封左下角赫然盖着一方鲜红的“云泽宗外门纳贡院”私印！\n\n陈长庚抽出信纸飞快扫过，瞳孔骤然一缩。\n\n这信竟是云泽宗外门纳贡院管事冯保山亲笔所写！\n\n信中冯保山替孙奉先指了条明路：下月中旬外门正好空出一个杂役补缺名额，只要奉上三十枚下品灵石打点，便可凭那半张纳贡残图与引荐信免试入宗。\n\n信末还特意点了一句：“丙字废渣房三年连折三任杂役，炉毒刺鼻无人肯去，正宜安插无根脚生面孔顶缺，保无内门耳目盘查。”\n\n“三十枚下品灵石买补缺，丙字废渣房……”\n\n陈长庚指尖摩挲着信纸边缘，嘴角勾起一抹无声冷弧：“旁人避之不及的毒灰绝地，对我和灰石臼倒是天造地设的宝库！可惜手头只有十八枚灵石，还差十二枚买路硬缺口。”\n\n既拿到了入宗路线，这乌卤盐场便半日也不必多留，待脱了身先去黑石坊市凑齐灵石！\n\n陈长庚不再耽搁，将纳贡残图、冯保山私函连同寒玉匣一并贴胸收稳，转身开始布置最后一场大戏。\n\n他先解开腰间破布带暗袋，取出前几日从炉基砖缝捡来的那半截前任童子枯黑指骨，丢进沸腾翻滚的青铜主炉之中；又铲起案上残留的“赤煞破障丸”剧毒药渣，一股脑倒进炉膛。\n\n随后，他拖起孙奉先血肉模糊的尸身，将其正面朝下严严实实卡在主炉喷火气孔正上方，好叫即将爆发的狂暴炉火把咽喉刺痕与胸前炸伤烧成焦炭。\n\n做完这一切，陈长庚扫向西侧石壁——那里有一条倾斜向上、专供排放地底浊烟的副排烟砖道，出口正好通往后院偏僻的湿柴屋背后。\n\n他深吸一口气，走到墙角地火总阀前，双手握住烧得滚烫的生铁扳手，用尽四窍全身蛮力，朝着严禁逆行的死卡方向狠狠一扳到底！\n\n“嘎吱——轰！！”\n\n三条火道积蓄到顶峰的狂暴地火瞬间倒灌入青铜主炉，被堵严的炉腹如充气皮囊般急剧鼓胀，暗红炉壁眨眼间迸裂出无数道刺目金纹！\n\n至多十息，整座丹炉便会彻底炸膛！\n\n陈长庚头也不回地扑到西侧副排烟砖道前，右拳古铜铁泽暴涨，《井煞锻骨功》劲力催至极限，一拳悍然轰在年久酥脆的封口青砖上！\n\n砰哗！砖石碎裂出一个尺半宽的黑洞！\n\n陈长庚忍着左前臂焦烂剧痛，缩骨如狸猫般钻进滚烫呛人的斜烟道，手脚并用拼命向上攀爬，赶在气浪追尾前一把推开柴屋后墙的排风铁栅，滚落进杂草丛生的泥沟里！\n\n他抓起两把黑臭烂泥往左臂焦伤与脸上一抹，撕破半截外袍衣摆，猫腰贴着柴垛绕回外院西角。\n\n恰在此时，二十丈外的岔道口传来阵阵车轮碾地声。\n\n挑水老张与机灵杂役小六刚从总库拉回两车冬炭，慑于仙师晚晌立下的严令，只敢把木车停在二十丈外的岔道口卸货，半步不敢往丹房巷里迈。\n\n谁知小六隔着排水沟一抬头，远远望见蹲在院墙十丈外的周大昌与胡管事，不禁惊疑不定地压声喊道：“周大把头？孙仙师不是严令明早辰时前谁也不准靠近丹房吗？”\n\n周大昌捂着包扎渗血的右手掌，隔沟恶狠狠喝骂：“少废话！仙师刚隔着地室石闸亲口发了话，命老子在十丈外替他老人家护法守院！”\n\n旁边卸炭的老张一抬头，手里麻绳哐当掉在地上，指着内院屋顶失声尖叫：“不对劲啊大把头！您快瞧内室屋脊，咋连青瓦缝都在往外喷紫黑火苗子？！”\n\n话音未落，脚下大地猛地往上一拱！\n\n胡管事脸色惨白如鬼，撕心裂肺地大吼：“不好！地底火脉炸炉了！快趴下——”\n\n“轰隆隆——！！！”\n\n一声天崩地裂般的恐怖巨响自丹房地底悍然炸开！\n\n狂暴无匹的赤黑毒焰如火山喷发般撞碎地下青冈岩穹顶，将整座炼丹内室连同半边青砖屋脊掀上十丈高空，碗口粗的燃烧房梁挟着滚烫碎砖如暴雨般砸向四方！\n\n门外十丈处的周大昌与胡管事被恐怖热浪迎面掀翻，滚进臭水沟里狼狈逃命；岔道口的老张和小六也吓得一屁股跌坐在炭堆旁。\n\n“走水啦！孙仙师的丹房炸膛啦！”老张连滚带爬站起身，拍着大腿冲四周盐灶嘶声哭喊，“各灶快提水桶来救人啊！”\n\n陈长庚趁着漫天黑烟碎瓦坠落的混乱，歪歪扭扭从西侧柴屋浓烟里跌撞而出，扑倒在院门豁口外。\n\n灰头土脸的小六跑近几步，一眼瞧见满身烟灰焦痕的陈长庚，惊得瞪圆了眼：“长庚？！你还活着！你咋从西头柴屋钻出来的？”\n\n“咳！咳咳咳……”\n\n陈长庚左手捂着焦黑淌血的小臂，咳得肺管子仿佛都要呕出来，嗓音嘶哑颤抖：“晚晌仙师嫌我碍事……赶我去后院清副道烟灰……内室大炉突然响得吓人，一眨眼就全炸了！快救火啊！”\n\n尖利的铜锣声霎时响彻整座乌卤盐场！\n\n数十名提桶拿钩的各灶杂役与挎刀矿卫顶着热浪冲到巷口，领头的矿卫百夫长一闻那股扑面而来的甜腻紫黑毒烟，脸色剧变，拔刀拦住众人怒吼：\n\n“毒火太烈，沾着就烂肉，谁也不准硬冲内室！先泼湿东西两厢外墙，快去前镇飞马禀报云泽宗驻场执事！”\n\n周大昌浑身泥水地从沟里爬出来，直勾勾望着化作一片赤黑火海的丹房废墟，惊骇喃喃：“怎会炸得这么狠……里头可还有活人？”\n\n胡管事瘫在泥地里直打摆子：“连地底石闸都被紫黑邪火烧穿塌陷了，莫说血肉凡胎，便是铁打的仙师怕也化成焦炭了啊！”\n\n救火呼号声、木桶泼水声与房屋坍塌声乱作一团。\n\n身后丹房再度炸起一团冲天赤黑毒焰，彻底吞没了地底最后一丝尸骸痕迹；陈长庚混在哭喊溃逃的杂役人群里弯腰捂嘴剧咳，怀中紧贴着那封盖有云泽宗外门纳贡院私印的密信。"}, {"n": 11, "title": "验灰定案", "body": "巡灶丹房塌陷的主屋还在往外喷吐紫黑火舌，焦臭毒烟呛得救火杂役哭爹喊娘。\n\n陈长庚缩在西院豁口的乱砖堆旁，左手托着皮开肉绽、糊满黑臭烂泥的小臂，弯腰咳得撕心裂肺。\n\n一双沾满泥浆的牛皮靴猛地踩碎瓦砾，直逼到他鼻尖前！\n\n“把这小畜生给我围起来！”\n\n丙字灶正把头周大昌举着包扎渗血的烂右手，满脸横肉因怨毒和贪婪扭作一团。\n\n胡管事领着四名挎厚背砍刀的周家心腹呼啦围拢，刀鞘狠狠顶住陈长庚后心。\n\n周围提水桶的杂役吓得哗啦退开半丈。\n\n“大、大把头……”陈长庚嗓音嘶哑如破锣，惊惶地往后缩了半尺，“小的做错了何事？”\n\n“做错了何事？！”周大昌唾沫星子喷了他一脸，拿缠着麻布的左手点向火海，“全丹房就你一个贴身司火童子！孙仙师在底下炼丹化了灰，偏偏你小子活蹦乱跳钻出来！”\n\n胡管事眼珠乱转，立刻跟着帮腔：“定是这小杂种看火偷懒引爆了地火阀，还趁乱摸走了仙师身上的宝贝！来人，先把他衣裳剥干净搜身！”\n\n两名周家刀手狞笑着上前，伸手便抓向陈长庚胸襟！\n\n陈长庚眼底寒芒一闪即逝。\n\n他怀里贴肉揣着灰石臼、锁灵寒玉匣与冯保山密信，腰间更系着孙奉先装有十八枚灵石的储物囊，一旦被剥衣，今晚就得血溅当场！\n\n不等那两只大手沾身，陈长庚突然脚下一软斜扑出去，扯着嘶哑破嗓冲巷口披甲执刀的矿卫统领凄声高喊：\n\n“赵百夫长救命！孙仙师尸骨未寒，周把头就要剥小的衣裳私分丹房遗物啊！”\n\n这一嗓子犹如滚油泼水，全场骤然一静！\n\n正在指挥泼水封墙的赵百夫长脸色猛沉，提着长柄斩马刀大步跨过来，刀锋咣当一横，直接架住了两名周家刀手的胳膊：“周大昌，你要造反不成？！”\n\n周大昌额角冷汗唰地冒了出来，点头哈腰赔笑：“赵爷误会！这小子司火失职害死仙师，小的怕他夹带赃物跑了，替您先审审……”\n\n“审个屁！”赵百夫长一脚踹开胡管事，眼神阴冷地扫过周大昌，“丹房里一针一线都是云泽宗本山的产业！快马已经去前镇请郑执事了，执事未到之前若是少了一块碎灵石，你拿脑袋替老子顶缸？”\n\n周大昌脸皮青一阵白一阵：“小的不敢……”\n\n“咳咳……”陈长庚蜷在地上直喘粗气，指了指炭堆旁发抖的老张和小六，怯生生补了一句，“赵爷明鉴，小的晚晌被仙师赶去后院湿柴屋捅副道烟灰，小六哥亲眼见小的从柴屋爬出来的。倒是周把头，方才小六哥瞧见他私开后门蹲在内院外头……”\n\n小六生怕担上干系，竹筒倒豆子般抢着点头：“对对对！周大把头刚还隔沟骂我们，说孙仙师亲口隔着石闸命他在外头护法呢！”\n\n全场矿卫齐刷刷盯向周大昌。\n\n周大昌后脊梁瞬间凉透，连退半步急辩：“你、你血口喷人！老子那是听见动静过来瞧一眼！”\n\n“少他娘的扯淡！”赵百夫长懒得听他们狗咬狗，大手一挥，“来人！把这几个昨晚挨过丹房边的全圈到前坪空地上盯紧了！谁敢私下动手搜身，按盗抢宗门资粮论处，立斩！”\n\n“是！”\n\n八名披甲矿卫持刀围成铁桶，将陈长庚、老张、小六与脸色铁青的周大昌一干人等隔开五步看押。\n\n周大昌死死剜了陈长庚一眼，却慑于明晃晃的官刀，半步也不敢越雷池。\n\n陈长庚低垂着眼皮缩在墙根抱膝发抖，心里已稳下大半。\n\n夜风裹着大泽寒露吹到五更寅初。\n\n贴在左胸肋骨上的蚀纹石臼，距前次提纯恰满三十六个时辰，悄无声息地泛起一阵温热微颤。\n\n陈长庚借着捂伤臂的动作按稳胸口，一丝气血也不往外引。\n\n眼下八双眼睛提着火把盯在跟前，石臼一旦投料收尾必散地火腥甜气，况且左前臂这道皮肉翻卷的真伤，正是天亮过堂最好的护身符。\n\n一直熬到初八辰时初刻，东边铅云刚透出一线惨白。\n\n“呜——！”\n\n一道尖锐破空声陡然自半空压下！\n\n众人骇然抬头，只见一艘两丈长的青铜飞舟破开晨雾疾掠而至，稳稳悬停在丹房废墟半丈高处。\n\n一名身穿云泽宗皂青劲装、面容阴鸷的鹰钩鼻中年修士负手跃下飞舟，周身鼓荡的雄浑气机压得满场凡人呼吸一滞。\n\n正是驻守前镇的云泽宗外门巡矿执事，开脉境修士郑奎！\n\n“拜见郑执事！”赵百夫长率众矿卫轰然单膝跪地。\n\n郑奎看都没看众人，快步走到已烧成深坑的内室断墙边。待看清坑底坍塌的千斤石闸与满地紫黑油腻灰烬，他眼角肌肉狠狠抽搐了两下，豁然转身喝问：“怎会炸成这副模样？！昨晚谁在炉前当值？”\n\n跪在前排的周大昌眼珠一亮，抢在所有人前头重重磕头：“回执事大人！就是后头那个司火童子陈长庚！昨晚全院杂役都被打发走了，独留他一人看守风门，定是他偷奸耍滑逆了火阀害死孙丹师！小的恳请执事搜他全身、严刑拷问！”\n\n郑奎森冷如鹰隼的目光瞬间钉在陈长庚身上：“是你看的火？”\n\n压力迎面扑来，陈长庚身子一晃，胸口微震牵动咽喉灼伤，“噗”地当众咳出两口暗红带黑丝的真血，整个人趴伏在泥地里瑟瑟发抖。\n\n“执事饶命……咳咳……给小的十个胆子也不敢动内室风门啊！”\n\n陈长庚颤巍巍从身侧摸出昨晚顺出来的半截熏黑长木杆，双手高举过头：“昨日申末，孙仙师说地火潮汐提前到了，赏钱把老张和小六哥全打发去领冬炭，又嫌小的肺病咳血污了丹气，骂小的滚去后院湿柴屋捅副排烟道的积灰……”\n\n“你撒谎！”周大昌厉声打断，“你在柴屋怎没被一块儿炸死？！”\n\n“柴屋隔着两道防火墙，小的是顺着泥沟爬出来的，小六哥亲眼所见！”陈长庚喘着粗气，没跟周大昌纠缠，反而抬起惨白的脸望向郑奎，声音压低了几分，“倒是小的有一事不明，不知当讲不当讲……”\n\n郑奎眉头紧皱：“讲！”\n\n“前几日小的扫外室时，总闻见地下石闸缝里飘出一股甜腻发腥的怪味，闻一口就头晕心慌。”陈长庚咽了口血沫，怯生生道，“而且三天前，外室记赤阳草火耗的毒药账册突然叫仙师烧了，仙师还自言自语说……说这炉药要是成了便可直入内门，万不可教前镇驻场执事知晓半点风声……”\n\n郑奎瞳孔骤然缩成针尖！\n\n他三步并作两步掠到焦坑边缘，隔空一抓，一团尚未冷透的紫黑药渣与半截干瘪发乌的陈年碎指骨飞入掌中。\n\n凑到鼻端只闻了半息，郑奎脸色唰地变了！\n\n作为云泽宗老牌外门执事，他怎会认不出这股甜腥刺骨的邪味？这是宗门律堂严令禁绝、专抽活人精血冲关的邪丹“赤煞破障丸”！连坑底那半截指骨上的陈年焦痕，都分明是早年害死药童留下的铁证！\n\n郑奎手心瞬间沁出一层冷汗。\n\n乌卤盐场归他驻点督察三年！孙奉先如今炸得连块好肉都不剩，倘若他据实上报本山执法堂说驻场丹师私炼禁丹炸炉，死人没法领罪，他郑奎头一个就得按“督察失察、纵容魔丹”论罪，少说要被扒掉执事皮罚去黑水矿坑挖十年苦矿！\n\n“执事大人！”周大昌压根没看懂郑奎阴晴不定的脸色，还在急吼吼往前膝行两步，“这小杂种连仙师烧账册都敢编排，分明心里有鬼！快让小的搜他衣裳——”\n\n“啪！！”\n\n一声清脆暴烈的耳光炸响！\n\n郑奎反手一掌甩出，狂暴开脉罡气抽得周大昌整个人横飞出一丈多远，连吐四五颗带血后槽牙，半边脸肿得老高，砸翻了两只救火水桶！\n\n全场死一般寂静，胡管事吓得把脑袋死死埋进泥水里。\n\n“混账东西！谁准你污蔑宗门丹师、胡乱攀咬了？！”\n\n郑奎一挥大袖，将掌中那团紫黑药渣与碎骨不动声色碾成飞灰随风扬散，冷冷环视全场：“老夫已验看清楚！孙奉先年迈体衰，急于炼制寻常固元丹冲击开脉，一时控火失手走火入魔才引爆地火！哪来什么怪味邪账？！”\n\n赵百夫长何等机灵，立刻低下头高声应和：“执事明察秋毫！确是寻常走火入魔！”\n\n陈长庚把额头贴在冰凉泥地上，嘴角在无人看见的阴影里微微一勾。\n\n赌对了。上官最怕的从来不是下头死人，而是脏水溅湿自己的乌纱帽。\n\n郑奎厌恶地扫了一眼趴在地上吐血水的周大昌，森然下令：“周大昌昨夜擅开丹房后门惊扰丹气，今日又妖言惑众败坏宗门清誉，死罪可免活罪难逃——罚没半年月俸，杖二十军棍！再敢多嚼半句舌根，老夫割了你的脑袋！”\n\n周大昌吓得魂不附体，顾不得满嘴血沫，拼命磕头求饶：“谢执事开恩！小的不敢了！小的烂嘴！”\n\n郑奎冷哼一声，又斜睨了陈长庚、老张和小六三人一眼：“孙丹师既已身故，巡灶丹房暂行封存。你们三个丹房杂役留着也是白吃干饭，书吏，当场给他们签发脱籍遣散文牒，限两日内滚出乌卤盐场自谋生路！”\n\n随行书吏连忙掏出三张盖着云泽宗矿司鲜红官印的麻纸文牒，填上姓名籍贯，随手丢在三人面前。\n\n老张和小六喜极而泣，抓起脱籍文牒千恩万谢——熬盐苦役一辈子都赎不出的贱籍身契，竟因一场炸炉白捡了自由身！\n\n陈长庚双手捧起那纸轻飘飘的麻纸文牒塞入怀中，强撑着爬起身磕头谢恩。\n\n郑奎懒得再留在这乌烟瘴气的盐场，转身踏上青铜飞舟。\n\n飞舟缓缓升空的刹那，郑奎忽然低头盯住鼻青脸肿的周大昌，压低嗓音冷冷丢下一句：“还有一事。老夫前几日在前镇风闻，孙奉先生前似乎在黑石坊市欠下一笔毒货尾款未结。这两日给老夫盯紧进出盐场的生人，谁敢把坊市那帮不干不净的散修招惹到矿司跟前，拿你是问！”\n\n“是、是！小的遵命！”周大昌捂着肿脸连声应承。\n\n青光一闪，飞舟破空没入云层。\n\n周大昌挨完二十记杀威军棍被抬走前，那双充血的三角眼越过攒动人头，像毒蛇一样死死钉在陈长庚背上。\n\n陈长庚低眉敛目，捂着伤臂慢吞吞退向杂役草棚方向。\n\n刚拐出前坪巷口，他脚步微不可察地顿了半息——三十步外卸货苇棚的阴影底下，两名身穿脚行短褐、腰鼓硬囊的精瘦生面孔没有看热闹，四道阴冷探究的目光正牢牢锁在他身上。"}, {"n": 12, "title": "雨夜留银", "body": "拿到了矿司红印脱籍文牒，老张和小六一刻也不敢多待，不到晌午便卷起铺盖欢天喜地奔了前镇大路。\n\n陈长庚却哪儿也没去。\n\n他弓着腰钻回外院角落漏风的旧草棚，用破草席蒙住脑袋，整整一天连伙房都没露面，任由外头两拨暗哨在泥巷口枯等。\n\n白日走官道，无异于提着肥肉往狼嘴里送。\n\n挨到十一月初八戌时，铅黑天幕轰然裂开，瓢泼冬雨砸得大泽芦苇荡白茫茫一片，十步之外人畜难辨。\n\n草棚里，陈长庚掀开破席悄然坐起，眸光清亮如铁，哪有半分白日咳血萎靡的病态。\n\n他先从草铺砖缝下摸出昨夜趁乱自丹房外间顺来的两包寻常“祛火毒药散”，塞进一只只装了两件破麻衣的空瘪包袱；随后披上烂蓑衣、扣紧竹斗笠，贴着墙根黑影摸到西墙排污暗渠涵洞。\n\n伸手探入涵洞上方干燥的石槽暗格，早先藏下的半袋高浓紫黑废丹炉灰完好无损。\n\n陈长庚将这半袋毒灰贴胸悬在顺手处，拨开后侧坍塌的木栅栏，一头扎进了滂沱夜雨之中。\n\n距离冯保山私函所写的十一月中旬补缺大限只剩十日，他手头还差十二枚下品灵石硬缺口，今夜必须赶到黑石坊市落脚变现。\n\n刚走出乌卤盐场西外围二里地，前方出现一座横跨黑臭水荡的独木窄桥——这是通往官道与黑石坊市的必经咽喉。\n\n距桥头尚有十五丈，陈长庚脚步倏然停在齐腰深的枯芦苇丛里。\n\n通窍四窍的敏锐耳力穿透哗哗雨幕，清晰捕捉到桥头断苇窝棚下传来两道刻意压低的粗重呼吸声，风里还裹着一缕劣质拭刀油混杂旱烟叶的怪味！\n\n“妈的，这鬼雨下得骨头缝都凉透了……”一道沙哑嗓音在苇丛后低声骂娘，“老张和小六晌午就滚蛋了，那姓陈的小杂种该不会死在草棚里了吧？”\n\n另一名刀手压着嗓子哼了一声：“死个屁！大把头挨了二十军棍又罚半年俸禄，肠子都悔青了，笃定孙老鬼的私房银子全落在这小子兜里！砍了他脑袋回去领二十两现银，瞪大眼盯着！”\n\n“怕啥？不过是个靠狗屎运撞松一窍、左胳膊还炸烂了的熬卤病秧子，只要他敢上桥，老子一刀就能把他劈成两半喂乌鱼！”\n\n芦苇暗影中，陈长庚神色冷寂，连眼皮都没抬一下。\n\n两名通窍一窍的周家心腹刀手。\n\n周大昌白天被郑执事打怕了不敢亲自露面，果然派了黑手套在半道截杀灭口。\n\n陈长庚没有踏上独木桥半步，而是借着狂风暴雨的哗啦水声，猫腰踩进齐膝深的芦苇水洼，悄无声息绕到了窝棚侧后方的上风口。\n\n三丈。\n\n一丈！\n\n一阵猛烈的西北狂风卷着暴雨直扑窝棚后背！\n\n陈长庚左手闪电般扯开怀中麻袋扎口，抓起满满两大把干燥辛辣的紫黑废丹炉灰，顺着狂风朝窝棚内狠狠一扬！\n\n“呼——！”\n\n腥臭刺鼻的紫黑毒粉混进雨水雾气，劈头盖脸灌进窝棚！\n\n“咳咳！什么鬼东西？！”\n\n“啊——我的眼睛！辣死老子了！！”\n\n废丹炉灰本就蕴含烈性火毒，一沾湿气入眼便如滚烫烙铁滋啦灼烧！两名刀手眼眶瞬间流血红肿，痛得涕泪横流，拔出厚背砍刀对着空气胡乱劈砍！\n\n陈长庚动了。\n\n脚下泥水炸开，他身形如扑食夜枭般撞入窝棚，不闪不避侧肩让开胡乱劈来的刀锋，右袖滑扣咔哒轻响，七寸乌黑淬毒分水刺已滑入掌心！\n\n寒芒一闪！\n\n左边高个刀手刚张嘴欲喊，冰冷三棱刺尖已精准无比地从他喉结正中一穿而过！\n\n右边矮壮刀手听见身旁闷响，头皮骤然炸麻，双腿一软险些跪进泥里，闭着流血的眼睛横刀护胸猛砍：“有鬼——”\n\n陈长庚矮身欺进刀圈内侧，左肘带着《井煞锻骨功》千斤铁劲悍然撞碎他胸前肋骨，右手分水刺顺势反撩，噗嗤割断颈侧大筋！\n\n蛇蝎寒毒见血封喉，两人喉咙里只发出两声短促的漏气声，便双双抽搐着栽倒在泥水里。\n\n前后不过三息，暴雨依旧哗哗倾泻，连半点喊杀声都没传出十丈外。\n\n陈长庚甩净刺尖血水收回袖扣，蹲下身利落地在两具尸身怀里摸索一圈，很快摸出四锭五两重的官银（正是周大昌预支的二十两买命钱），外加两人贴身攒的七两散碎纹银。\n\n他抓起二十七两纹银揣进怀里，抬脚将两具尸首连同两把厚背砍刀一并踹进桥下深不见底的芦苇毒泥塘，看着黑泥气泡咕嘟嘟吞没衣角，雨水眨眼间便冲净了棚底血迹。\n\n盐场最后一截烂尾巴，至此彻底掐断。\n\n然而陈长庚没有立刻转身奔赴黑石坊市，而是拉低斗笠，顶着茫茫雨幕折向西北，悄悄绕回了乌卤盐场边缘的丙字灶后巷。\n\n夜深雨急，巡夜矿卫全缩在门房烤火喝酒，低矮破败的灶匠土坯房一片漆黑。\n\n陈长庚熟门熟路停在巷尾最破的那间茅屋篱笆外，收敛全身气息立在黑影里。\n\n漏雨的芦苇屋顶下，隐隐传出一阵撕心裂肺的苍老干咳声：“咳……咳咳咳……”\n\n屋里没点灯，只听见老灶匠葛老栓翻了个身，压着破风箱似的嗓子对着黑屋子轻声叹气：\n\n“造孽哟……这鬼天连下冷雨，也不知长庚那娃儿领了文牒往哪儿投奔去了……胳膊上还带着伤，身上又没两文铜板，千万莫冻死在荒泽里啊……”\n\n屋檐滴水砸在陈长庚斗笠上，溅起冰凉水花。\n\n十六岁父母双亡被强征入场，头半年他饿得拎不动木桶，若非葛老栓屡次借着骂他手笨，偷偷往他豁口碗底塞半块硬杂粮饼，他根本活不到摸出灰石臼的那天。\n\n陈长庚静静站在雨影里听了三息，终究没有抬手敲响那扇破木门。\n\n周禄死在他手里，孙奉先死在他手里，刚才芦苇荡又添了周家两条人命。他如今踏上的是一条沾血就回不了头的吃人仙途，一旦露面相认，留给这风烛残年老人的绝不是福分，而是杀身灭顶之祸。\n\n仙凡殊途，不见才是保全。\n\n陈长庚猫腰拨开虚掩的后院柴扉，轻手轻脚走到外檐遮雨的水缸旁。\n\n他从怀里摸出整整二十两官银，连同那两包能压制凡人肺底盐毒的“祛火毒药散”，用两层厚油布裹得滴水不透，单手托起沉重水缸一角，将其稳稳塞进缸底干燥的垫砖凹槽边缘——明早葛老栓掀盖舀水，一眼便能瞧见这包救命银药。\n\n剩下的七两散银足够他路上零花，二十两纹银在凡俗小镇够葛老栓赎身买两亩薄田，安安稳稳活过余年了。\n\n“咳咳……”里屋葛老栓又含糊嘟囔了一句，翻身睡熟过去。\n\n陈长庚轻轻放下水缸，不曾惊起一丝声响。\n\n他退回篱笆外的滂沱大雨中，隔着如注雨帘朝那间矮破茅屋深深望了一眼，随即压低竹斗笠，毫不犹豫转身踏入苍茫黑夜。\n\n雨势至亥时方才渐歇，化作漫天湿冷的锁泽浓雾。\n\n陈长庚运转四窍气血赶了整整两个时辰夜路，草鞋踩过最后一道泥岗，已是十一月初九子末，前方灰白雾气深处终于浮现出一座高达两丈、顶端燃着两团惨绿鬼火的黑石界碑！\n\n界碑百丈开外，黑石坊市高耸的寨墙轮廓隐约可见，正门税卡处更是挑起了十几盏通明气死风灯，隐约可见几名挎刀劲装汉子正横杆盘查夜行散修。\n\n陈长庚眼神微凛，刚收慢脚步贴向路边断墙观察虚实——\n\n“嗤！”\n\n右侧半截坍塌的乱石断墙后头，冷不防探出一只瘦得青筋凸起的手爪，一把死死拽住他的蓑衣袖口往暗影里猛拉！\n\n陈长庚右袖分水刺瞬间顶到掌心，待瞥见那张淋得像落汤瘦猴般的精明熟脸，才在毫厘间收住杀招。\n\n断墙夹缝里，刚从南镇连夜冒雨赶回的贺九斤脸色煞白，抹了一把脸上冰冷雨水，压极了嗓门急促低喝：\n\n“长庚兄弟快收脚！千万别走正门，卖给孙老鬼毒引的赤蝎崔婆正在税卡拿人！”"}, {"n": 13, "title": "暗涵入坊", "body": "断墙后头寒风夹着冷雨星子直灌脖子，百丈外坊市正门税卡的灯笼火光在夜雾里一跳一跳。\n\n陈长庚借着墙影挡住身形，不动声色拨开贺九斤攥着自己袖口的手指，声音压得极稳：“贺哥不是去南镇避铁火铺的风头了吗？怎会在这儿？”\n\n“害！昨日脚行快马传遍了大泽，说乌卤盐场巡灶丹房炸上了天，孙奉先那老鬼连骨头渣都没剩下！”\n\n贺九斤缩着脖子拢紧湿袖筒，看陈长庚的眼神比前几日在芦苇荡还要敬畏三分：“哥哥我一琢磨，盐场出了这么大乱子，兄弟你这等人物岂会留在那儿吃灰？准得连夜来黑石坊市寻路子，这才紧赶慢赶绕小道回来接你！”\n\n陈长庚不置可否，抬眼瞥向远处横杆拦路的正门税卡：“你说那个赤蝎崔婆，是什么来头？”\n\n“通窍六窍的老牌毒修！养了一窝吃人不吐骨头的腐骨毒蜂，心黑手辣在整个黑石坊市都排得上号！”\n\n贺九斤说起这名号便直吸凉气，语速飞快地交了底：“孙奉先生前为了偷炼破境禁丹，暗地里找这老毒婆赊了一大批赤煞毒引，还欠着整整十二枚下品灵石的尾款没结清！”\n\n“昨儿听说孙老鬼炸炉死了，崔婆气得当场掀了药铺，带着徒弟和帮闲直接堵死正门税卡——凡是拿着乌卤盐场文牒进坊的活人，有一个算一个全扣下来搜身逼债！”\n\n陈长庚眸光微凝。\n\n幸亏没贸然拿矿司脱籍文牒去闯正门！\n\n他怀里不仅贴着冯保山的补缺私函，腰间还系着孙奉先那只锦缎储物囊，一旦被通窍六窍的老毒修拦门摸底，当场就得在坊市大门口撞个不死不休。\n\n“除了正门，还有别的道能进坊？”陈长庚直接问重点。\n\n贺九斤嘿嘿一笑，老毛病复发，两根手指在湿漉漉的袖筒里飞快捻了捻：“正门东头三里外有条前代荒废的排卤暗涵，铁栅栏早锈穿了，能绕过税卡直通坊市西头的散修棚户区。亲兄弟明算账，领路外加替你寻一间不查文牒的落脚石屋，收半块碎灵石不过分吧？”\n\n“可以。”陈长庚答应得半点不拖泥带水，随即补了一个硬条件，“但屋子必须选在西棚区最偏僻的角落，而且地底得紧挨火煞支脉。”\n\n贺九斤愣了一下：“挨着火煞支脉？那地方又闷又呛，租金可不便宜……”\n\n“我在盐场熬了三年毒卤，肺底落了寒湿病根，夜里没地火热气烘着直咳血，睡不踏实。”陈长庚淡淡回了一句，顺势背过身去，借着宽大蓑衣与竹斗笠遮挡，从贴肉暗袋里摸出一枚下品灵石。\n\n在黑石坊市底层散修手里，一枚完整下品灵石往往要錾成五块均匀的碎灵石零花。\n\n陈长庚不想露富更不会亮出储物囊，左手两指捏稳灵石边缘，右手隔袖用淬毒分水刺沉重的精铁刺柄轻轻一磕！\n\n四窍横练的精准暗劲透入石理，“啪”地一声轻响，整枚下品灵石顺着天然纹路齐整裂作五小块碎灵石，他又分出一半，反手抛给贺九斤半块：“前头带路，莫撞见铁火铺的人。”\n\n贺九斤接住温润碎灵石揣进兜里，眉开眼笑地打了个千：“得嘞！包在哥哥身上！”\n\n两人趁着夜色浓雾，一前一后猫腰摸进东侧荒滩的芦苇沟，钻入那条仅容一人弯腰通行的排卤暗涵。\n\n涵洞内弥漫着陈年卤泥的咸腥恶臭，黑水漫过脚背。摸黑走了约莫半个时辰，贺九斤推开一块松动的青石窨井盖，左右探看无人，带着陈长庚悄无声息翻进了黑石坊市西侧的散修棚户区。\n\n此时已是十一月初九丑初，黑沉沉的夜雾笼着泥泞窄巷，两侧挤满了乱石黑泥垒成的低矮石屋，偶有夜行散修戴着遮面竹笠匆匆掠过，眼神阴鸷戒备。\n\n贺九斤领着陈长庚七拐八绕，一直走到西棚区尽头紧靠乱石岗的一排孤僻石屋前，敲响了巷口守屋老瞎婆的木窗。\n\n按坊市散修规矩无需查验官府路引，陈长庚当场再付半块碎灵石押下十日房租，接过一把生锈铁钥匙，推开了最里头那间久无人住的青石小屋。\n\n“长庚兄弟，这两日崔婆查得紧，铁火铺那两个失踪伙计的掌柜也在暗地里打听生面孔，你先在屋里安心养伤，千万别去东街露头。”贺九斤站在门缝边低声交代了一句，“等风声松快点，哥哥再来找你通气！”\n\n“有劳贺哥，慢走。”\n\n目送贺九斤溜出暗巷，陈长庚刚关拢木门准备点亮火折解开左臂烂布——\n\n“哐当！！”\n\n老旧木门连同门栓被人从外头狠狠一脚踹开，撞在石墙上震落大片灰土！\n\n陈长庚眼神骤冷，右袖里的淬毒分水刺瞬间滑落半寸，待借着门外风灯光亮看清来人，指尖又悄然松开，顺势将四窍气血尽数敛入骨髓，受惊般缩向土炕墙角。\n\n门口大摇大摆跨进来一名敞着短褂、胸口刺着黑狼头的光头汉子，腰挎窄刃弯刀，身上散发着通窍三窍的彪悍气血；身后还跟着两个提风灯、持铁尺的满脸横肉打手。\n\n正是把持西棚区几十户穷散修的地头蛇，罗三！\n\n罗三刚在巷口赌坊散了夜局，听见老瞎婆半夜开锁放进生客便赶来刮油水，斜睨了一眼屋里穷酸相，拿弯刀鞘重重敲了敲门框：\n\n“深更半夜偷偷摸摸搬进来？瞎眼婆只管收房钱，爷管这片地界的规矩！西棚区压着地火眼，新户落脚先交三枚下品灵石的‘押火钱’，拿出来吧！”\n\n张口就是三枚下品灵石！\n\n陈长庚心里冷笑。以他通窍四窍配《井煞锻骨功》小成的身手，三步之内两刺便能叫这罗三横尸屋中。\n\n可这儿不是荒郊芦苇荡！\n\n赤蝎崔婆正满城筛查盐场来客，西棚区若是突然暴毙一个通窍三窍的地头蛇，不出半个时辰坊市执法队和崔婆眼线就会把这儿翻个底朝天！\n\n念头电转间，陈长庚膝盖微曲，脸上顿时堆满底层苦力的惶恐苦相，连声咳嗽着摸出乌卤盐场遣散文牒，又摊开一双布满厚黄老茧与燎泡旧疤的粗糙手掌：\n\n“好汉爷饶命！小的哪是什么体面散修，小的是乌卤盐场走水刚撵出来的熬卤苦力啊！您瞧小的这双手和烫烂的左胳膊，在盐灶熬了三年连灵石渣子都没摸过，刚押给婆婆的那半块碎石子，还是跟同乡脚夫磕破头借的印子钱……”\n\n“少跟爷哭丧！”左边铁尺打手跨前一步揪住陈长庚蓑衣前襟，恶狠狠扬起铁尺，“没灵石跑黑石坊市充什么大瓣蒜？搜！刮不出油水打断腿扔进臭水沟！”\n\n“别别别！好汉爷手下留情！”\n\n陈长庚顺着拉扯踉跄半步，丝毫不露硬骨斤两，慌慌张张从贴腰旧布袋摸出五两散碎纹银，又弯腰捧过刚倒进屋角豁口陶罐里的半罐雪白头等精盐，高举到罗三眼皮底下：\n\n“罗爷高抬贵手！小的拼死从盐灶裤裆里夹带出这半罐头等雪花精盐，外加这五两救命棺材银，全孝敬罗爷和两位哥哥打酒喝！求罗爷宽限十天，等天一亮小的就去黑石渡口扛大包熬苦力，十天内一定给您凑齐押火钱！”\n\n罗三狐疑地眯起三角眼，探指往陶罐里捻了一撮白盐放进嘴里砸吧两下，眼睛微亮——确是官灶才出得来的头等精盐，拿到前街酒楼能换三四两现银。\n\n他又伸手捏了捏陈长庚瘦削的肩胛骨，探见对方气血滞涩微弱、连一窍门槛都没摸稳，浑身除了一股刺鼻盐卤汗臭再无半点灵气波动，那点怀疑彻底散了。\n\n现在一尺打死顶多捞堆烂衣裳；留着这条贱命去码头扛包，十天后还能再刮一层皮！\n\n“妈的，真晦气，大半夜招来个叫花子！”\n\n罗三一口浓痰吐在青砖地上，一把抓走五两纹银，示意打手抱走那半罐精盐，拿刀鞘指着陈长庚鼻尖恶声警告：\n\n“看你小子懂事，爷给你记十天账！本月十九日晌午之前，交不出一枚灵石连本带利，爷亲自来剥你的皮点天灯！滚屋里待着去！”\n\n“谢罗爷大恩！小的做牛做马一定凑齐！”陈长庚点头哈腰，一直把三人恭送出门槛。\n\n直到风灯光亮与骂咧声彻底消失在夜巷尽头，陈长庚脸上的卑微惶恐才褪得干干净净。\n\n五两凡俗纹银加半包带不进宗门的私盐，买下地头蛇眼里的“逃荒穷鬼”护身符，这笔买卖划算得很。\n\n他转身扶正木门插死铁栓，搬起墙角一根碗口粗的顶门石条抵死门板，又拉严了破木窗上的麻布帘。\n\n狭小石屋内重归漆黑。\n\n陈长庚走到紧靠乱石岗的北墙根蹲下，拔出淬毒分水刺沿着一块焦黑青石砖缝轻轻一撬。\n\n青砖翻开，底下露出一道三指宽的幽深地缝，温热硫磺火煞气丝丝缕缕扑面涌出！\n\n贴胸绑紧的蚀纹石臼嗅到地脉余韵，贴着肋骨发出两声极轻微的嗡鸣，臼体变得温润发烫。\n\n第七轮潮汐充能早在昨日五更寅初便已蓄满，眼下地火支脉就在脚底，只需塞进两把废丹毒灰，便能炼出新晶治好左臂焦伤！\n\n陈长庚心头微松，左手刚解开怀里那小半袋剩余紫黑废丹灰的麻绳——\n\n“嚓……嚓嚓……”\n\n他的手指猛地僵在半空！\n\n紧挨破土炕的西侧夹壁石墙深处，毫无征兆地传来了两声细碎如鼠啮、实则是尖头铁钎悄悄刮挖泥灰缝隙的窥探声！"}, {"n": 14, "title": "借客抬价", "body": "夹壁墙里的铁钎刮擦声极轻，走两下便停一息，显然是个撬墙摸底的老手。\n\n陈长庚蹲在撬开的青砖地缝旁，呼吸未乱半分。\n\n西棚区鱼龙混杂，他前脚刚向罗三哭穷交了碎银，隔壁这只夜耗子多半是听见顶门石响动，想钻个针眼看看新租客裤裆里还剩几文钱。\n\n若拔刺翻出去宰人，血腥味一飘，天亮老瞎婆查房又是桩麻烦。\n\n陈长庚眼底掠过一丝冷意，左手从怀里小半袋废丹毒灰中捻出一撮最辣的紫黑细粉，摊在刚用火折子烤得滚烫的分水刺宽脊上。\n\n墙体本就是乱石掺黄泥垒的，不过半盏茶工夫，西侧土炕上方的灰缝里“噗”地掉下一小撮干泥末。\n\n一根筷子粗的尖铁钎悄然探出，缓缓拧开一道指肚大的斜孔。\n\n紧接着，隔壁微弱油灯光亮被挡住，一只布满血丝、闪着贼光的右眼死死贴在了墙洞另一头！\n\n就是现在！\n\n陈长庚无声欺近墙根，将烧出焦烟的滚烫刺脊凑准孔洞，胸腔气血一吐，对着那只贼眼猛地一吹！\n\n“呼——噗！”\n\n滚烫如烙铁的紫黑丹毒细粉毫无阻拦地钻过斜孔，结结实实糊进了那只瞪大的眼珠子里！\n\n“啊——！！我的眼！！”\n\n一墙之隔骤然爆出一声凄厉如杀猪般的惨嚎！\n\n隔壁桌凳翻倒声乱作一团，那惯偷痛得在地上疯狂打滚，抓着烧烂流脓的右眼眶撞开自家木门：“鬼！屋里有毒鬼啊！”\n\n陈长庚吹熄火折子，贴在门缝后冷眼旁观。\n\n只见一名豁牙瘦汉捂着满手黑血的右脸冲进窄巷，连屋里家当都不敢回头拿，跌跌撞撞翻过乱石岗逃得没了踪影。\n\n巷子里两户散修推窗骂了一句“大半夜发什么羊癫疯”，又砰地关死了木窗。\n\n陈长庚等了十息，确认四下再无动静，这才拔开顶门石闪身出门，借着夜色在隔壁敞开的破门槛边扫了一眼。\n\n豁牙瘦汉撞门逃命时挂断了腰绳，一只油腻灰布袋正掉在门槛泥水里。\n\n陈长庚弯腰拾起布袋退回自家石屋，重新顶死大门。\n\n布袋里除了两根撬锁铁钎，竟装着六块切口参差的碎灵石，外加一只塞着红布塞的小瓷瓶。\n\n拔开瓶塞一嗅，里头躺着两粒鸽眼大小的灰褐药丸，散发着淡淡的腐叶涩味。\n\n“低阶敛息丸？”陈长庚眉头微挑。\n\n前几日贺九斤提过一嘴，黑市梁上君子最爱备这玩意儿，吞一粒能把周身气窍波动压死半日。\n\n白捡六块碎灵石加两粒保命药，倒省了一桩功夫。\n\n陈长庚拿湿泥将西墙那道窥孔堵得严严实实，又把屋角前任租客留下的半篓潮炭渣拢进火盆点着。\n\n呛人的灰白煤烟很快填满窄屋，顺着破窗缝往外直冒。\n\n挨到初九五更寅初，脚底地缝涌出的硫磺火煞气攀至顶峰。\n\n陈长庚掏出温热发烫的蚀纹石臼按在地缝口，将怀里剩下的小半袋紫黑废丹灰尽数倒进臼槽！\n\n石臼嗡鸣轻颤，灰粉肉眼可见地塌陷凝缩。\n\n一刻钟后，浓烈的地火腥甜气如期散出，却刚冒头便被满屋劣质湿炭浓烟裹住冲散，连半丝异香都没漏出巷外。\n\n臼底最终凝出小半捧莹白璀璨的道髓晶砂。\n\n陈长庚先拈起三成晶砂仰脖吞入腹中，催动《引火行气诀》引着温润药力直冲左前臂与咽喉！\n\n不过半个时辰，左臂被烈阳火珠反震炸烂的焦黑死皮寸寸剥落，底下生出淡粉新肉，连火毒灼哑的嗓子也恢复了清亮顺畅。\n\n看着臼心剩下约莫一钱重的精纯晶砂，陈长庚取出孙奉先遗留的那只青白锁灵寒玉匣，将其严丝合缝封入匣中。\n\n锁灵阵纹微光一闪，晶砂灵气稳稳锁死，再无六个时辰散化白灰之忧；至于灰石臼，则需再等满三十六个时辰，到十二日五更寅初方能开启下一轮提纯。\n\n闭门蛰伏两日待左臂新肉长实，十一月十一日入夜，黑石坊市东街脚底的地下鬼市亮起了惨绿磷灯。\n\n陈长庚没有去曾结下灭口死仇的铁火铺，而是换了一只粗木小匣装上刮去棱角、裹满老盐泥的一钱晶砂，压低竹斗笠踏入了南巷字号最老的杂货铺“鼎余轩”。\n\n柜台后，留着三缕鼠须的掌柜钱半城正拨弄紫檀算盘，见进来个粗衣斗笠客，眼皮只掀了一半：“客官买符还是淘器？”\n\n“卖货。掌柜掌掌眼。”\n\n陈长庚话少声沉，将粗木小匣推上柜面。\n\n钱半城漫不经心推开匣盖，拿银耳挖勺挑起一粒晶砂凑近磷火一照，整只枯手猛地一抖！\n\n晶芯澄澈如秋水，半分狂暴赤红丹毒也无！\n\n钱半城眼底贪光一闪即逝，啪地合上木匣，长叹一声把匣子往回推了半寸：“唉，老弟这撮废井老矿髓看着亮堂，可惜离了地脉太久，灵气已散了七成。看你是头回登门，老夫吃点亏，给你三枚下品灵石收了吧。”\n\n话音落下的同时，钱半城藏在袖里的左手轻轻敲了两下柜板。\n\n原本蹲在门口擦铜炉的两名通窍三窍壮汉伙计，不动声色站起身，一左一右抱臂堵住了铺门大半去路！\n\n三枚灵石就想吞掉价值近十枚的无瑕矿髓，不卖还要摸底强留？\n\n陈长庚隔着斗笠黑纱瞥了钱半城一眼，半句废话没争，右手闪电般探出，赶在钱半城按匣前一把将粗木小匣抓回掌心！\n\n“钱掌柜眼力高，这残次货就不脏宝号的地界了。”\n\n说罢，陈长庚转身便朝铺门走去。\n\n“诶，小兄弟留步，买卖不成仁义在嘛——”左边疤脸伙计狞笑一声，横跨半步伸铁蒲扇似的大手去拦陈长庚肩膀。\n\n陈长庚脚步未停，右肩微沉，四窍《井煞锻骨功》的浑厚暗劲在布衣下骤然一吐！\n\n“嘭！”\n\n疤脸伙计只觉一巴掌拍在了飞驰的铁犀牛背上，整条右臂酸麻欲裂，噔噔噔连退三步撞翻了博古架！\n\n不等另一名伙计拔棍，陈长庚已一步跨出鼎余轩门槛，径直走到丈许外对门散修地摊的气死风灯下，啪地掀开木匣朗声开口：\n\n“刚出废井的零火毒老矿髓，足足一钱！换九枚下品灵石，哪位道友验货？”\n\n这嗓子不高不低，恰好传遍整条鬼市窄街！\n\n对摊挑拣药草的一名黄脸老散修和一名缺耳壮汉闻声扭头，凑近灯下只吸了一口那醇厚灵气，呼吸瞬间粗重如牛！\n\n他们卡在通窍四五窍瓶颈多年，指节早被劣等净髓引染得发乌，哪见过这等毫无丹毒的洗髓神物？\n\n“嘶——真没火毒！小友莫走，老夫出六枚现成灵石！”黄脸老散修攥住腰包急声高喊。\n\n缺耳壮汉一把挤开老头，脖颈青筋直冒：“滚开！老子出七枚下品灵石，再搭一柄百炼分水刃！”\n\n周围七八名夜行散修闻风围拢过来，鼎余轩门口顿时水泄不通！\n\n铺内的钱半城脸色黑如锅底，肠子都快悔青了——这等极品矿髓转手卖给破关富户少说能赚十五枚灵石，哪想这斗笠小子如此滑溜狠辣，半息都不受拿捏！\n\n眼看缺耳壮汉已经去解灵石袋，钱半城再也端不住掌柜架子，三步冲出柜台堆笑隔开众人：“诸位莫抢！这位小兄弟刚在敝铺只差一步谈拢，老夫出八枚足色下品灵石，现钱交割！”\n\n八枚整灵石一出，黄脸老修与缺耳壮汉顿时面露肉痛迟疑之色。\n\n陈长庚压低斗笠，目光越过钱半城肩膀扫过鼎余轩后院墙根——那里堆着十几只散发刺鼻焦苦味的黑麻袋，正是店铺炼废药散攒下、还得雇苦力拉去填沟的剧毒废丹灰。\n\n“八枚整灵石可以。”陈长庚指了指墙根那堆黑麻袋，语气平淡，“但我家火炕潮湿招毒虫，钱掌柜得把后院那十袋没人要的废炉毒灰搭给我垫炕底。少一袋，我这便卖给这位壮士。”\n\n钱半城一怔，暗骂这小子穷酸爱占小便宜，嘴上却痛快得紧：“成交！来人，快给贵客装十袋废灰！”\n\n一手交木匣，八枚灵光饱满的下品灵石当场落入陈长庚袖袋！\n\n加上原有的十七枚整灵石与十块碎灵石，他怀里的硬通货涨到了二十五枚整下品灵石外加十块碎灵石，离三十枚买路钱已触手可及！\n\n陈长庚单肩扛起捆成一团的十袋废丹灰，趁着散修们围住钱半城求购的乱劲，一头扎进鬼市污水暗巷。\n\n连翻两道矮墙甩净缀尾眼线，直至十一日亥末，陈长庚才扛着麻袋悄无声息绕回西棚区外侧的岔路口。\n\n刚要迈进巷子，路边坍塌的破土地庙阴影里忽然伸出一根竹竿，急促敲了三下地面！\n\n陈长庚脚步骤停，闪入墙角暗处望去。\n\n只见贺九斤浑身泥水蹲在神龛底下，一张瘦脸白得没有半点人色，正指着西棚区巷子深处拼命冲他打着“快退”的死手势——\n\n三十丈外的窄巷火光晃动，光头地头蛇罗三正点头哈腰在前引路，身后跟着一名捧着青竹蛊筒的黑衣药童，挨家挨户踹门搜查大泽盐场口音的新租客！"}, {"n": 15, "title": "染囊嫁祸", "body": "西棚区窄巷里犬吠与踹门声响成一片，两名散修稍慢了一步开门，当场被罗三的手下揪着头发拖出石屋按在泥水里。\n\n破土地庙后，贺九斤急得满嘴起泡，猫腰拽着陈长庚的衣角往外拉：\n\n“长庚兄弟快翻西岗走！罗三那狗东西收了赤蝎崔婆两块碎灵石，领着崔婆的亲传药童端了只‘寻煞蛊’挨门筛人，但凡沾过赤煞毒引或是大泽盐场口音的，今晚一个都跑不掉！”\n\n陈长庚按住肩上十袋沉甸甸的废丹灰，钉在原地没动半步。\n\n现在弃屋往外跑？\n\n坊市四门和外围暗哨早被崔婆的帮闲盯死了，扛着大包在夜里乱窜，正好一头撞进六窍老毒修的腐骨毒蜂网里。\n\n何况这间石屋紧压地下火煞支脉，再过不到三个时辰便是五更寅初第八轮石臼冷却到期的关口，一旦丢了窝点上哪儿提纯破窍去？\n\n“寻煞蛊？”陈长庚透过断墙豁口盯了一眼那名黑衣药童怀里的青竹筒，压声问道，“那虫子是认人，还是只认药味？”\n\n“虫子哪认得人脸！专嗅赤蝎崔婆独门熬的赤煞母气！”贺九斤拍着大腿低声叫苦，“可你刚从孙老鬼丹房出来，屋里又压着盐场文牒，等搜到巷尾还不是个死？”\n\n陈长庚眼神微冷，脑中飞快过了一遍这几日的线索：“这几天除了我，乌卤盐场可还有旁人溜进黑石坊市？”\n\n贺九斤愣了一下，下意识回道：“旁人谁敢这时候往枪口撞？也就盐场正把头周大昌那个贪财外甥丁四，趁乱顺了丹房外院几件没烧坏的铜药碾子，昨儿晌午刚带着两个脚夫住进东街的‘黑芦客栈’销赃……”\n\n话未说完，陈长庚眸底精光骤亮！\n\n周大昌的外甥！初八雨夜在芦苇荡派刀手截杀他不够，如今倒自己把脖子送进坊市替死来了！\n\n陈长庚当机立断，先从贴身布袋摸出一块碎灵石塞进贺九斤手里。\n\n随即他背过身探手入怀，从孙奉先那只储物囊角落取出一团用三层油纸裹紧的破烂麻布——正是那晚搜刮丹炉药案时顺手带出、沾满浓烈赤煞引原液的半截旧药囊！\n\n“这一块碎灵石归你。”陈长庚将油纸包拍在贺九斤掌心，声音冷冽果决，“现在绕小巷去东街黑芦客栈，不必露面，只把油纸剥开将这半截烂药囊塞进丁四房后的柴垛底下，塞完立刻回脚行睡觉！”\n\n贺九斤捏着沉甸甸的一块碎灵石，再闻到油纸缝里透出的一丝若有若无甜腥气，浑身汗毛一竖，瞬间明白了这少年的借刀狠招！\n\n不用动刀见血，只需往黑栈柴房丢块烂布就能白赚一块碎灵石，还能把催命毒婆引去东街！\n\n“高！实在是高！”贺九斤眼珠发亮，把碎灵石往怀里一揣，“半柱香内办妥！兄弟你自己千万藏严实了！”\n\n贺九斤如狸猫般钻入东侧污水沟远去。\n\n陈长庚不再迟疑，趁着罗三一伙还在前排巷口翻箱倒柜，悄无声息贴着乱石岗后墙翻回自家石屋。\n\n他迅速撬开北墙地砖，将十袋废丹灰、储物囊、寒玉匣与竹斗笠一股脑塞进地缝下的干燥空腔盖严青砖。\n\n紧接着摸出前两夜捡来的小瓷瓶，倒出一粒灰褐敛息丸直接嚼碎咽下！\n\n一股阴涩药力散入四肢百骸，原本澎湃的通窍四窍气血眨眼间沉寂如死水，连心跳都慢了半拍。\n\n陈长庚抓起火盆里混合黑油的湿炭灰，将脸颊、脖颈与双手涂得漆黑斑驳，撕下两条烂布缠住手腕。\n\n他又抠了一小块苦涩生木炭含在舌根底下，提着火钳蹲在浓烟滚滚的破火盆前扇风。\n\n刚扇了不到二十下——\n\n“砰！！”\n\n石屋木门再次被人粗暴踹开！\n\n光头罗三提着弯刀跨进门槛，被满屋呛人的劣质湿煤烟熏得连咳两声，骂骂咧咧挥手：“妈的，穷鬼烧的什么烂泥炭，呛死个人！”\n\n他身后，那名面色青白、眼窝深陷的黑衣药童缓步走入，一双阴冷死鱼眼上下扫过蜷在火盆边发抖的陈长庚，拧开了手中青竹筒的木塞。\n\n“嘶嘶——”\n\n一只拇指粗细、背生赤红鬼脸斑纹的肥硕肉蛊爬出筒口，两根猩红触须在空气里急促晃动。\n\n陈长庚弓着瘦削脊背，半点气机不露，惊恐地指了指自己抹满黑灰的喉咙，张开嘴对着罗三比划了两下，喉间只挤出两声被生炭堵变形的“嗬、嗬”嘶哑破音。\n\n罗三嫌恶地往后退了半步，回头向药童陪笑道：“小师父您瞧，这就是前两日刚来投奔老瞎婆的逃荒哑巴炭工，连一窍气感都没有，裤裆里五两纹银早叫小的刮干净了。”\n\n黑衣药童没有搭腔，端着青竹筒逼近陈长庚鼻尖三尺之内！\n\n陈长庚眼睑低垂，藏在破烂袖筒里的右手食指微曲，静静贴在淬毒分水刺的机括扣上——倘若敛息丸瞒不过这虫子，三尺之内，药童和罗三谁也别想活着走出这道门槛。\n\n一息，两息。\n\n青竹筒上的赤斑肉蛊被浓重刺鼻的硫磺湿煤烟呛得直缩脑袋，在陈长庚身前转了半圈，触须蔫头耷脑，毫无反应！\n\n恰在此时，一阵凛冽子夜寒风卷过巷尾高墙！\n\n原本萎靡的寻煞蛊像是突然嗅到了十里外的血腥美酒，整个虫身猛地弓起，发出尖锐刺耳的“吱吱”嘶鸣，两根猩红触须笔直指向了东街方向！\n\n黑衣药童脸色陡变，一把扣死竹筒木塞，眼中凶光大盛：“好大的狗胆！这么浓的赤煞母气，果然藏在东街客栈销赃！”\n\n“东街？”罗三一愣，“难道不是盐场逃出来的苦力？”\n\n“苦力个屁！一个连气窍都没摸着的烂哑巴，也配吞我师父十二枚灵石的大货？”黑衣药童反手一脚踢碎屋角的豁口陶罐，头也不回地冲出巷外，“叫上你的人跟紧点，师父就在前街候着，今晚谁敢吞赤蝎谷的东西，剥了他的皮喂蜂！”\n\n“是是是！小师父慢走！”\n\n罗三连看都懒得再看火盆边的“臭哑巴”一眼，带着打手呼啦啦追向东街。\n\n听着大队脚步声彻底远去，西棚区的暗哨眼线被一扫而空，陈长庚缓缓吐掉嘴里的苦炭块，用破布擦净指尖煤灰，眼神冷静如渊。\n\n他起身扶正木门，搬过顶门石条死死抵住门板，盘膝静坐调息了近两个时辰。\n\n转眼熬至十一月十二日五更寅初！\n\n距初九五更提纯整整满三十六个时辰，北墙地缝下的蚀纹石臼准时发烫震颤！\n\n陈长庚添旺湿炭浓烟，撬开青砖搬出鼎余轩送的那十袋高浓剧毒废丹灰，解开三袋一股脑塞满石臼凹槽！\n\n大铺子攒下的丹炉废灰成色极毒，转化为道髓晶砂的分量更是惊人！\n\n待收尾腥甜气被炭烟卷散，臼心赫然躺着整整两钱半晶莹如雪、灵气浓郁得几乎化雾的极品晶砂！\n\n陈长庚先分出一钱封入锁灵寒玉匣留底，随即盘膝坐上土炕，张口将余下一钱半温润晶砂尽数吞入腹中！\n\n轰——！\n\n远胜前四窍的磅礴精纯洪流在腹中轰然炸开，无需分心拔除半丝丹毒，在《引火行气诀》与《井煞锻骨功》的双重催动下，如千钧铁槌狠狠撞向紧闭的第五处主气窍！\n\n同一时刻，三里外的东街黑芦客栈已被团团围死。\n\n一名拄着蛇头铁杖、满脸褐斑的干瘦老妪立在夜雾檐下，周身萦绕着绿瘴毒雾与嗡嗡盘旋的腐骨毒蜂——正是通窍六窍凶名赫赫的赤蝎崔婆！\n\n看到药童刚从后院柴垛翻出的那半截赤煞旧药囊，崔婆眼底杀机暴涨，大步登上二楼客房，枯掌裹挟腥臭绿煞轰然拍落！\n\n“咔嚓——轰！！”\n\n厚木房门瞬间炸成漫天碎屑！\n\n屋内油灯下，正把头周大昌的外甥丁四刚把销赃换来的纹银捆进包袱准备趁五更出城，骤然撞见门外煞神般的老毒婆，吓得亡魂皆冒：“你、你是谁——”\n\n“把孙奉先的破障丹方和灵石交出来，老身留你全尸！”崔婆五指如钩直取其咽喉！\n\n惨叫声撕裂东街夜空的那一刹那，西棚区昏暗石屋内，陈长庚脊骨发出一串闷雷般的脆响！\n\n第五处气窍壁垒应声贯通！\n\n五窍气血连成一片奔腾江河，周身百锻皮膜泛起一层内敛深沉的熟铁暗泽，陈长庚缓缓睁开双目，一口绵长白气自唇齿间直射出三尺开外。"}, {"n": 16, "title": "捏铁立威", "body": "踏入通窍第五窍，陈长庚五指轻轻一握，掌骨间便传出熟铁摩擦般的低沉闷响，耳目聪明比四窍时又强出近半。\n\n十二日清早，他没急着去打听东街黑芦客栈死了几个人，而是坐在昏暗石屋里把随身家底彻底盘了一遍。\n\n冯保山密信上写得明明白白：云泽宗外门补缺接引楼船，定在本月十八日辰时于黑石渡口截止验纳，距今只剩最后六天。\n\n他把手里九块零散碎灵石挑出五块，去前街散摊兑成了一枚完整下品灵石——如今贴身整灵石不多不少正好二十六枚，外加四块碎灵石。\n\n买路钱要足足三十枚整灵石，这里头还差着四枚硬缺口，更别提进宗门后打点上下的安家余粮！\n\n而且赤蝎崔婆绝不是蠢货。\n\n五更天血洗了周大昌外甥丁四，一旦搜不出灵石和破障丹方，那老毒婆回过味来必定发疯反扑；偏偏他杀孙奉先时把三枚过载烈阳火珠全用光了，眼下袖里只剩一柄近身用的淬毒分水刺。\n\n“手头这二十六枚整灵石是登船命根子，一枚也不能动。得拿孙老鬼剩下的死物，先换一套保命重火器出来。”\n\n计议已定，陈长庚翻出那半卷赤褐绢书《控火诀》，用炭笔在粗麻纸上只摘抄出其中关于“地火分流聚爆”的半页控火关窍。\n\n随后他又从孙奉先遗留的储物囊角落翻出两粒炼丹备用的高纯火煞碎晶，一并揣入怀中。\n\n当天晌午，他换上一身宽大灰褐短褐、戴稳遮面竹斗笠，避开前街大铺，七拐八绕摸进了坊市南角烟熏火燎的铁匠巷，停在最深处一间挂着破铁毡招牌的矮铺前。\n\n铺里炉火正旺，一名赤膊高壮学徒正抡大锤砸铁；柜台后坐着个左眼塌陷、右眼蒙着厚白翳的驼背老匠人，正是黑石坊市独门私造凶器的通窍四窍老散修，胡铁锤！\n\n陈长庚递上半页控火图谱与两粒火煞晶，指明要定制四枚赤铜箍改良过载烈阳火珠，外加一面能挡毒针飞刃的贴身玄铁护心镜。\n\n剩下的四块碎灵石则当场拍在桌上，充作炭火定金。\n\n胡铁锤虽瞎，鼻子与指肚却灵得邪门，摸过火煞晶又听学徒念了头两句控火口诀，激动得胡子乱颤，满口应承按图谱抵扣大头工料，约好三天后申时一手交余谱、一手取成器。\n\n转眼三日过去，到了十一月十五日申时。\n\n距离十八日渡口登船仅剩最后三天，石臼第九轮潮汐也在今晨五更蓄满待发。\n\n陈长庚揣着默好的后半截分流短诀再度踏进铁匠铺时，炉火已压小了大半。\n\n油腻木柜台上，整整齐齐摆着一面巴掌薄、泛着冷幽幽乌光的弧形玄铁护心镜。\n\n旁边一只铺满石棉灰的木盒里，静静躺着四枚比拳头略小、外箍三道赤铜锁纹的暗红火珠！\n\n哪怕隔着石棉灰，那四枚改良火珠透出的毁灭性狂暴火煞，仍比先前铁火铺的残次货强出至少五成！\n\n“胡师傅好手艺。”陈长庚验过火珠引线无误，将剩余两百字分流口诀推过柜面，伸手便去取木盒。\n\n“啪！”\n\n一只粗糙如老树皮的大手猛地横伸过来，重重按在了石棉木盒盖上！\n\n柜台后的胡铁锤抬起那只蒙着白翳的独眼，耳朵微微抖动了两下，脸上原本憨厚的匠人笑容渐渐拧成一抹阴狠贪婪：\n\n“小哥慢着。老头子我眼瞎耳不瞎，听你这呼吸骨音，年纪怕还不到二十岁，连个护道长辈都没带吧？”\n\n炉台后头，那名高壮学徒嘿嘿冷笑一声，不动声色拎起八十斤重的长柄打铁锤，横跨一步堵死了铁匠铺半掩的侧门！\n\n陈长庚收回手指，隔着竹斗笠黑纱平静看着胡铁锤：“胡师傅这是什么意思？前日定的规矩，控火分流诀加两粒火煞晶、四块碎灵石，买断四珠一镜。”\n\n“前日是前日，今儿是今儿！”\n\n胡铁锤冷哼一声，垂在柜台底下的右手已悄悄扣住了暗槽里一架三矢破甲机关弩的铁扳机，嘴里却占尽道理地坐地起价：\n\n“为了锁住你这四枚火珠的过载煞气，老夫多耗了半斤赤铜精！想要拿走东西，除了把你手里那本《控火诀》全卷真本掏出来，还得再加八枚下品灵石的压惊钱！拿不出来，这定金和火珠就当孝敬老夫了！”\n\n高壮学徒在门后重重一顿铁锤柄，震得地面乱颤：“小子，识相点把储物袋解下来，省得爷给你开瓢放血！”\n\n在黑石坊市杀人动火器，不出十息执法巡卫就会封锁南巷；可若是露半分怯意，今天不仅拿不到杀器，连怀里二十六枚买路灵石都得被这师徒俩啃干净！\n\n陈长庚站在柜台前，连呼吸快慢都没变一下。\n\n“胡师傅既要验我的底子，不妨听个响。”\n\n话音未落，陈长庚缓缓抬起右手，没有去摸袖中短刺，只是伸出食指与中指，轻轻搭在了柜台右侧用来试锤镇纸的一块两寸厚“百炼精铁锭”上！\n\n胡铁锤嗤笑一声：“一块死铁锭能听出什么花——”\n\n“嘎吱——！！”\n\n一声令人牙酸骨寒的金属扭曲闷响陡然炸开！\n\n陈长庚体内通窍五窍的磅礴气血与《井煞锻骨功》百锻铁骨之力凝聚于双指指腹，对着那块刀砍不留痕的百炼精铁锭悍然往下一摁！\n\n当着高壮学徒瞪圆的眼珠子，坚硬如石的精铁锭竟像一块刚出锅的软豆腐般，被那两根手指硬生生捏陷下去，留下两道深达寸许、边缘龟裂的恐怖指印！\n\n“哐当！！”\n\n门后高壮学徒吓得肝胆俱裂，手心一滑，八十斤大铁锤重重砸在自己脚背旁，脸色瞬间白如死灰：“师、师父！铁锭叫他两根指头捏扁了！！”\n\n什么？！两指捏陷百炼精铁？！\n\n胡铁锤脸上横肉狂跳，额头豆大的冷汗唰地滚落下来！\n\n他在坊市打了一辈子铁器，比谁都清楚这意味着什么——莫说普通通窍四窍，便是寻常五六窍修士拿刀劈都砍不出寸许深坑，眼前这少年分明是个把横练外功修到化境的煞星！\n\n胡铁锤慌得手指一颤，险些当场抠动柜底的机关弩扳机！\n\n“别乱动右手指头。”\n\n陈长庚松开精铁锭，语调依旧平淡得像在聊家常，目光却轻轻飘向打铁炉后墙角一摞盖着湿麻袋的破木桶：\n\n“胡师傅眼盲，怕是还不知道吧？你这好徒弟这半个月趁你歇晌，偷偷把筛剩的烈性硝火药粉攒了半木桶，就藏在红炭火炉后头三尺远的麻袋底下。”\n\n门边高壮学徒膝盖一软，“噗通”瘫跪在地：“师父饶命！我、我就想攒点私房换酒钱……”\n\n陈长庚屈指轻轻弹了弹柜上那枚过载火珠的外壳，声音冷彻骨髓：“胡师傅柜底那架三矢机弩，破不开五窍横练的皮；可我的指风只要把炉膛里一块红炭弹进后面那只木桶，半息之内，你这铺子连同师徒俩就得一块儿上天。胡师傅要不要赌一把？”\n\n铁匠铺内死寂得落针可闻，只剩炉膛火星噼啪轻响。\n\n胡铁锤后背衣衫已被冷汗彻底浸透，扣在机关弩上的右手像触电般猛地缩了回来！\n\n跟一个随手能捏扁精铁、还把铺子死穴摸得一清二楚的五窍横练狠人黑吃黑，那是嫌自己活得太长！\n\n“啪！！”\n\n胡铁锤猛地转身，照着跪地学徒的脑袋狠狠抽了一记耳光，回过头时满脸只剩惶恐敬畏的赔笑，双手颤抖着将玄铁护心镜与四枚改良过载烈阳火珠一并推到陈长庚跟前：\n\n“老朽有眼无珠！冲撞了小爷！四珠一镜早按最高规格打磨妥当，分文不加，求小爷大人不记小人过！”\n\n陈长庚不再多看他一眼，掀起短褐将冰凉坚韧的玄铁护心镜贴胸绑紧，又将四枚赤铜箍过载火珠连同石棉袋稳稳收入双袖暗扣，转身推门步入黄昏暮色之中。\n\n刚走出铁匠巷口不到二十步，前头泥水街角突然冲出一道瘦小人影！\n\n只见贺九斤跑得丢了半只草鞋，满脸血污冷汗，一头撞进巷侧阴影里死死抓住陈长庚的胳膊，带着哭腔嘶声急喘：\n\n“长庚兄弟，出大祸了！赤蝎崔婆在丁四那儿没搜出破障丹方，顺着老底查到了我脚行头上，刚把我的小徒弟小石头扣作人质，逼我今夜给准话、明夜交出拿走丹房东西的正主，不然就放腐骨毒蜂把他活活啃成白骨！”"}, {"n": 17, "title": "残方设局", "body": "冷风卷着铁匠巷的煤灰灌进领口，陈长庚反手扣住贺九斤乱抖的手腕，一把将他拽进暗巷拐角。\n\n“闭嘴，回西棚区再说。”\n\n两人一前一后猫腰穿过三条污水窄巷，钻进乱石岗尽头的青石小屋。\n\n门栓刚落，贺九斤便双膝一软，“噗通”跪在冰冷青砖地上，满脸血污混着鼻涕眼泪往下淌：\n\n“长庚兄弟，救命啊！小石头才十三岁，是我死鬼老娘舅留下的独苗！”\n\n陈长庚搬过顶门石条抵死木板，掀起衣摆查看四周并无尾巴，这才沉声问道：“把气喘匀，崔婆怎么查到你头上的？”\n\n“坏就坏在东街黑芦客栈！”贺九斤拍着大腿直哆嗦，“昨晚崔婆一掌拍死丁四，把客栈地板都掀了三层，只翻出几十两凡俗纹银和几件破铜药碾子，半张丹方影儿都没见着！”\n\n“那老毒婆当场回了味，知道有人拿烂药囊耍她！”\n\n贺九斤声音抖得不成调：“她今早带人把近半年进出过乌卤盐场的脚夫全筛了一遍，查出我上个月替孙老鬼捎过两回黑市药材，晌午直接堵了我的脚行窝棚！我恰巧在外头躲铁火铺的人，小石头当场叫她抓回南巷毒蜂院了！”\n\n陈长庚眸光微冷：“她开了什么话？”\n\n“限我今夜亥时前递准信，明夜子时把拿走孙老鬼遗物的正主交出去！”贺九斤膝行两步抱住陈长庚小腿，拼命磕头，“不然明夜一过，她就放腐骨毒蜂把小石头活活啃成白骨！”\n\n“兄弟，哥哥给你立过指血毒誓，打死也不敢出卖你啊！”\n\n贺九斤哭丧着脸比划道：“可小石头不能死！求兄弟大发慈悲，先借哥哥十枚下品灵石去向崔婆赎人！要是不成……咱俩今晚就赶紧翻西岗逃去南镇吧，这黑石坊市待不得了！”\n\n昏暗石屋里静得只剩贺九斤粗重的喘息声。\n\n陈长庚垂眸看着他，既没伸手去扶，也没去摸怀里的灵石袋，声音冷得像井底寒铁：\n\n“拿十枚灵石去赎人？贺哥在黑市混了十几年，是真糊涂还是吓傻了？”\n\n贺九斤一呆：“怎、怎么讲？”\n\n“一个跑腿脚夫，平白无故掏出十枚整灵石赎一个小学徒。”陈长庚竖起一根手指，字字戳破他的幻想，“崔婆一眼就能断定你背后藏着吞了丹房肥肉的正主！”\n\n“灵石她会照单全收，转头就会往你和小石头身上种下寻煞母蛊，放长线把我也一块儿钓出来剥皮！”\n\n贺九斤脸色唰地惨白如纸，嘴唇直哆嗦：“那、那咱不赎了，趁夜弃屋跑路！”\n\n“往哪儿跑？”陈长庚冷冷反问，“你今夜不回话，崔婆笃定正主心虚要逃，明早头一件事就是封死黑石渡口和四门荒道！”\n\n陈长庚心里把账算得明明白白。\n\n后天十八日辰时便是云泽宗接引楼船截止验纳的死期，他手头只有二十六枚下品灵石，离三十枚买路钱还差四枚硬缺口，入宗打点更是分文未备。\n\n这时候弃了贺九斤往外逃，不仅凑不齐买路灵石、彻底断掉日后黑市销货的白手套，更会把一只发疯的通窍六窍老毒蝎直接引到黑石渡口堵船板！\n\n退一步是死，掏钱赎人更是找死。\n\n想在后天清早干干净净踏上云泽宗楼船，唯一的解法，就是赶在明夜把赤蝎崔婆连人带袋一块儿吃进肚里！\n\n“那……那横竖都是死，可咋整啊？！”贺九斤急得直揪头发。\n\n“死不了。”陈长庚走到破木桌前坐下，目光如刀看向贺九斤，“你想没想过，孙奉先只欠崔婆十二枚灵石的毒引尾款，崔婆为何连杀数人、花重金买通罗三搜街还不肯罢休？”\n\n贺九斤怔了怔：“为啥？不就心疼那十二枚灵石吗？”\n\n“通窍六窍的老毒修，为了十二枚灵石犯得着在坊市大动干戈？”陈长庚嘴角勾起一抹讥诮冷意，“她真正眼馋的，是孙奉先耗尽十年心血攒出来的那张禁方——能助通窍后期强冲开脉境的‘赤煞破障丸’！”\n\n一语惊醒梦中人！\n\n贺九斤猛地瞪圆了眼珠子：“对啊！崔婆卡在通窍六窍快二十年了，头发都快掉光了！上个月孙老鬼买母引时漏过半句口风，说丹成之后分她一粒药渣参详，她定是冲着破障丹方来的！”\n\n想抓狐狸，就得往夹子上挂她最馋的那块腥肉。\n\n陈长庚不再多言，俯身撬开北墙地砖，没有动那半卷真本《控火诀》绢书，只撕下一张粗糙黄麻纸铺在膝头，拾起烧黑的柳木炭条落笔疾书。\n\n他在丹房看守了半个月地火风门，又把孙奉先的《控火诀》残篇嚼透了大半，对火煞走脉与草药配伍熟稔于心。\n\n短短半盏茶工夫，半页蝇头小字跃然纸上。\n\n前头七味主辅毒草与“三转地火融煞法”皆是货真价实的九窍丹师真传路数，精妙得足以让任何野路子散修奉若神明；唯独在最末收丹入腹的那半句关窍处，陈长庚不动声色将“火归气海”倒改成了“逆冲心窍”，并故意在关键药引分量处撕去下半截！\n\n外行人瞧不出端倪，懂毒理的老散修一验前头控火法便知绝非凡品，不拿到下半截全方根本不敢开炉！\n\n写罢，陈长庚从储物囊角落翻出那晚割破的半片孙奉先青色法袍碎角，蘸水将上面干涸发黑的九窍修士精血化开，抹在麻纸撕裂边缘烘烤微干。\n\n一股若有若无的苍老丹煞血腥味立刻透纸而出。\n\n“拿着。”陈长庚将这半页染血残方折好丢给贺九斤，“亥时之前，你找把铁胎弓，把这半页纸连同你的口信一块儿射进南巷崔婆院门，人别露面。”\n\n贺九斤双手捧着麻纸，咽了口唾沫：“哥哥怎么跟她说？”\n\n“就说拿走丹房遗物的高人看在你替他跑过腿的份上，愿拿全本《赤煞破障丸》真方换小石头一条命。”\n\n陈长庚声音冷肃，定下死规矩：“明夜子时正，黑石坊市外西北三里的废弃硝石窑，一手交全方，一手放活人。告诉崔婆，她只准独自一人押着小石头来，敢带半个坊市巡卫或外人设伏，高人立刻一把火烧了下半截真方远走高飞！”\n\n坊市内禁动重火器，城外三里废弃硝石窑却是巡卫懒得管的荒坡死地，更是埋火药最好的天然坟包！\n\n贺九斤眼睛越听越亮，猛地一拍大腿：“妙啊！崔婆把破境丹方看得比亲爹还重，生怕外人知道了分一杯羹，绝不敢报官惊动坊市巡卫！哥哥这就去办！”\n\n亥末时分，南巷深处一座爬满紫藤的阴森小院外。\n\n“夺！”\n\n一支无羽铁箭破开夜雾，重重钉在黑漆院门正中，箭杆上绑着一卷泛黄麻纸。\n\n不过三息，院门吱呀裂开一道缝，拄着蛇头铁杖的赤蝎崔婆阴沉着老脸走出来，拔下铁箭展开麻纸。\n\n先凑到鼻端嗅了嗅纸角那抹熟悉的九窍丹师血腥气，再借着绿油灯火细看前头那几句精妙绝伦的“三转地火融煞”口诀，崔婆干瘪眼眶里骤然爆出骇人贪光！\n\n“好精妙的控火化煞术……错不了，确是孙奉先那老鬼藏着掖着的破障真方！”\n\n崔婆再看背面约战废硝石窑的炭字，沙哑冷笑起来：“既想要脚行小崽子的命，又怕在坊市里叫老身堵死？哼，待明夜拿到下半截全方，老身把你们连皮带骨一块儿喂蜂！”\n\n她抬头冲门外黑暗高声嘶喝：“传话回去！明夜子时城外废硝石窑，老身独自带那小杂种赴约，敢少半个字，老身抽了他的魂！”\n\n暗巷尽头偷听的贺九斤如蒙大赦，猫腰一溜烟跑没了影。\n\n院门口，赤蝎崔婆脸上的冷笑却渐渐敛去，浑浊老眼闪过一丝老江湖的多疑。\n\n“敢拿真方换一个脚行学徒，那藏头露尾的正主怕也不是善茬……”\n\n崔婆拄着蛇头铁杖顿了顿地面，没有回前屋歇息，反而转身推开后院角门，拉起黑斗篷悄无声息钻进隔壁窄巷，扣响了一扇挂着剥皮牛头骨的石门：\n\n“屠七，滚出来接活。明夜随老身去城外硝石窑摁死一只肥羊，事成之后，分你五枚下品灵石！”"}, {"n": 18, "title": "烂摊得图", "body": "十六日晌午，铅云低压，黑石坊市北角的旧货烂泥摊挤满了讨生活的底层散修。\n\n这片泥滩紧挨着坊市排污沟，地上随便铺几块破油布，摆的全是从废弃矿坑刨出来的伴生碎渣、生锈断刃和死人剥下来的烂皮甲。\n\n在这儿半块碎灵石都难得一见，通用的是凡俗纹银与铜钱。\n\n陈长庚压低遮面竹斗笠，穿着那身洗得发白的灰褐短褐，随贺九斤一脚深一脚浅地踩过黑泥水。\n\n距今夜子时废弃硝石窑决战，还剩整整六个时辰。\n\n“长庚兄弟，咱不趁白天去前街符铺买两张火球符防身，跑这臭烘烘的烂泥摊淘啥破烂？”贺九斤捂着鼻子小声嘀咕，眼圈因为一夜没合眼熬得通红。\n\n“前街符铺全有崔婆的眼线盯着，这会儿去买攻击灵符，跟敲锣告诉她今晚要翻脸有什么区别？”\n\n陈长庚脚步不停，目光冷冷扫过两侧杂乱地摊。\n\n赤蝎崔婆能在黑石坊市横行十几年，靠的是通窍六窍修为、绿瘴护罩和那一窝防不胜防的腐骨毒蜂。\n\n他袖里虽有四枚胡铁锤改良过的过载烈阳火珠，可荒郊野岭一旦没能把老毒婆困进死角，让毒蜂散开或是走脱一人，后患无穷。\n\n想拿五窍身板稳吃六窍老怪，就得先把整座废弃硝石窑改成一座插翅难逃的毒火熔炉！\n\n“停一下。”\n\n走到泥滩最北头一处歪脖子枯柳下，陈长庚脚步微顿，停在了一名缩着瘸腿、满脸老年斑的干瘦老摊主跟前。\n\n破麻席上堆着满满两竹筐灰黄色、表面布满蜂窝孔洞的碎矿石渣，隔着三尺远都能闻到刺鼻呛嗓的硫磺地火燥味。\n\n旁边还零散摆着一把缺漆旧猎弓、几支粗铁箭，以及一捆用烂麻绳捆紧、被陈年黑卤泡得发黑发硬的破烂皮卷杂物。\n\n陈长庚蹲下身，捻起一块灰黄蜂窝矿渣在指尖搓了搓，故意皱眉嫌弃道：“老人家，这矿底刨出来的废硫渣受了潮，烧炭都嫌呛人，两筐一块儿怎么卖？”\n\n跛脚老摊主掀开浑浊眼皮瞥了眼他的粗布短褐，懒洋洋伸出两根黑指头：“地火硫煞渣，掺进石炭里耐烧得很，专防水蜈毒虫！两筐一共六十斤，外加那把旧铁胎弓，给二两纹银全拿走！”\n\n陈长庚心里微定。\n\n这正是大泽深井伴生的“地火硫煞废矿”！单烧不过冒些毒烟，可一旦跟老硝石窑墙壁上积了几十年的白硝霜混在一起引爆，爆燃的毒火连青砖承重柱都能瞬间烧酥塌陷！\n\n陈长庚也不还价，直接探手入贴腰旧布袋，把身上仅剩的二两散碎纹银连同三十四文零散铜板一股脑摸出来，拍在破麻席上：\n\n“弓箭和两筐硫渣我都要了。银角子略沉了一钱半，劳驾找半吊铜钱给我买干粮。”\n\n跛脚老摊主抓起碎银放进小铜戥子里一称，果然多出一钱多，可他把破钱褡裢翻了个底朝天，里头连十个铜大子都凑不出来。\n\n老头儿舍不得吐出到嘴的银角子，眼珠一转，枯手一指摊角那捆发臭的黑色破烂：“小哥行个方便，老汉蹲了一上午还没开张，实在没零钱找！这捆前代乌卤老盐工死在渠底留下的遗物，有两件厚牛皮护膝和几张烂羊皮纸，老汉原本卖一吊钱的，算半吊钱白搭给你抵账成不？”\n\n贺九斤在旁边看得直翻白眼，刚想开口替陈长庚骂这老头拿垃圾糊弄人，陈长庚却已伸手按住了他的肩膀。\n\n“行，破牛皮烤干了还能垫鞋底。”\n\n陈长庚装作挑拣牛皮护膝成色，随手扯开那捆散发着陈年咸腥味的烂麻绳。\n\n指尖在几块硬邦邦的烂皮子里一摸，触到了里头卷着的一张尺许宽、被黑卤浸透得像铁片似的陈旧羊皮卷。\n\n借着宽大竹斗笠垂下的黑纱阴影，陈长庚不动声色地将羊皮卷捻开一道三寸宽的窄缝，目光顺着缝隙往里一扫——\n\n呼吸在黑纱下微不可察地屏住了半息！\n\n他在乌卤盐场熬了三年毒卤，一眼便认出羊皮上用暗红矿粉勾勒的山形水脉，正是前代老盐工冒险勘修大泽地下卤道留下的《修渠草图》！\n\n真正让他心头剧震的，是草图右下角一处画着三重骷髅死禁的深渊标记旁，用朱砂小楷密密麻麻批注着一行小字：\n\n“沉渊古盐墟外崖地磁裂魂，唯西北三里废排卤暗沟压于死泥之下，可避乱磁直抵古墟侧翼内壁……”\n\n沉渊古盐墟！\n\n陈长庚在盐场时便听老灶匠当神话提过一嘴，那是云泽宗严密封锁的大泽第一绝地。\n\n传闻地底盛产唯有开脉仙师才配染指的至宝灵矿，寻常修士莫说进去，便是挨近外崖都会被乱磁撕成碎片！\n\n而这张被烂泥老头当废品搭账的臭羊皮上，竟标着一条前代盐工挖通、连云泽宗本山未必知晓的侧翼废弃排卤暗沟！\n\n陈长庚眼皮都没跳一下，脸上依旧是一副嫌弃破烂发臭的木然神情，随手把这卷《修渠草图》重新裹进烂牛皮护膝最里层，打上死结塞进贴胸内袋。\n\n随后他才拎起那把旧铁胎弓，将两筐硫煞废矿渣交给贺九斤背好。\n\n刚直起腰准备离开泥滩——\n\n“滚开！全都给爷滚到沟边去！！”\n\n北街口陡然炸开两声嚣张跋扈的厉喝，伴随着急促沉闷的铁蹄踏泥声！\n\n满滩摆摊的低阶散修脸色齐齐大变，像见了猫的老鼠般慌忙抱起家当往排污臭水沟里乱扑！\n\n陈长庚瞳孔一缩，一把拽住背着矿筐发懵的贺九斤退到枯柳树干后侧，深深垂下竹斗笠。\n\n哗啦——！\n\n泥浆炸起半丈高，两匹披着青鳞铁甲的高头健马横冲直撞闯入烂泥摊，碗口大的铁蹄踩碎了沿途好几只瓷瓶竹篓！\n\n马背上端坐着两名身穿云泽宗外门青灰劲装、袖绣银白云纹的青年修士，领头那名三角眼青年腰悬外门采买执事铁牌，周身赫然散发着通窍七窍的强横气机！\n\n两骑径直停在陈长庚隔壁三步外的一处石摊前。\n\n那摊主是个通窍四窍的独眼老散修，面前破布上正摆着一块刚从荒泽深洞抠出来、拳头大小的“赤铜伴生灵矿”。\n\n三角眼采买执事居高临下扫了一眼，随手从马鞍袋里摸出两枚成色极差的下品灵石丢在泥地里，冲身后随行弟子一努嘴：“成色尚可，收进宗门器堂交差。”\n\n随行外门弟子翻身下马，伸手便去拿那块赤铜灵矿！\n\n独眼老散修急得额头青筋暴起，双手死死护住灵矿，颤声哀求：“上宗执事容禀！小老儿为了挖这块伴生赤铜矿，折了一条左腿才从毒泥洞爬出来，按坊市公道价少说值十枚下品灵石！两枚灵石连小老儿买接骨药的本钱都不够啊……”\n\n“坊市公道价？”\n\n马背上的三角眼采买执事像是听到了天大的笑话，嘴角咧开一抹残忍讥诮：“整座沧溟大泽八百里水陆，哪一寸泥巴不是我云泽宗的产业？你在我宗门地界偷刨灵矿，老子没按盗矿罪剁了你的爪子，赏你两枚灵石已是法外开恩，你还敢跟爷讨价还价？！”\n\n“小老儿不是偷矿，小老儿交过坊市税钱的——”\n\n“给脸不要脸的老狗！”\n\n三角眼执事眼神骤寒，连马鞍都没离，右手猛地扬起一柄通体乌金的倒刺马鞭，通窍七窍的暴烈气劲灌入鞭身，照着独眼老散修胸膛悍然一鞭抽落！\n\n“啪——嗤啦！！”\n\n一声撕裂空气的恐怖爆鸣！\n\n通窍四窍的独眼老散修连护体劲气都没来得及撑稳，胸前皮甲连同肋下血肉当场被乌金马鞭抽出一道深可见骨的血槽！\n\n他惨叫着狂喷鲜血倒飞出一丈开外，重重砸进臭水沟里昏死过去！\n\n凌厉狂暴的鞭梢余风贴着枯柳树干横扫而过，“咔嚓”一声脆响，擦着陈长庚的竹斗笠竹檐削断了两根篾条。\n\n跛脚老摊主面前的破木摊案，更被这一鞭余劲抽成了漫天碎木屑！\n\n跛脚老摊主吓得屎尿齐流，趴在泥浆里把脑门磕得砰砰响，大气都不敢喘一口。\n\n随行外门弟子嗤笑一声，弯腰捡起那块染血的赤铜灵矿擦了擦，翻身上马。\n\n三角眼采买执事勒转马头，冰冷傲慢的目光扫过满滩噤若寒蝉的底层散修，冷哼道：“一帮不知死活的泥腿子，再敢拿宗门采买当儿戏，这就是下场！驾！”\n\n铁蹄翻飞，两骑溅起满地腥臭黑泥，大摇大摆消失在南街尽头。\n\n直到马蹄声彻底听不见了，泥滩上才响起压抑的抽泣与救人声。\n\n枯柳阴影下，贺九斤吓得后背冷汗直流，牙齿直打颤：“乖乖……通窍四窍的老好手，在云泽宗外门执事跟前连一鞭子都扛不住……”\n\n陈长庚缓缓抬起头，伸手扶正被鞭风削断两根竹篾的斗笠。\n\n隔着随风轻晃的黑纱，他看了一眼臭水沟里生死不知的独眼散修，右手隔着粗布短褐轻轻按了按怀里那卷浸满黑卤的《修渠草图》，眼底深处唯有彻骨幽冷的寒芒。\n\n在这片上官掌秤杆、拳头定生死的修真丛林里，不爬到执鞭人的头顶上，走到哪儿都是案板上的肉。\n\n“先回僻巷歇脚。”陈长庚从贺九斤手里接过一筐沉甸甸的硫煞废矿渣扛上肩头，压低声音道。\n\n两人背着竹筐绕回北棚死巷避过白日耳目，直熬到申末暮色将近，方才悄然踏上通往城外荒坡的小径。\n\n陈长庚抬眼望向铅灰天幕，声音冷寂如铁：“天快黑了，该去城外替崔婆把坟砌好了。”"}, {"n": 19, "title": "火窑绝杀", "body": "十六日夜，子时将至。\n\n黑石坊市西北三里外的荒坡寸草不生，湿冷大泽寒雾裹着刺鼻硝碱味，将一座坍塌了小半边的废弃古硝石窑笼罩得鬼影森森。\n\n老硝石窑高约两丈，穹顶由三根风化斑驳的青砖承重柱撑起，窑心空地上被绳索五花大绑着一个满脸青紫、嘴塞破布的十三岁瘦弱少年，正是脚行学徒小石头。\n\n小石头拼命扭动身子，惊恐绝望的眼珠子不住往头顶上方乱瞟。\n\n在窑顶破洞两侧的焦黑横梁阴影里，赤蝎崔婆与一名脸带狰狞刀疤的精壮散修正如两只夜蝠般悄无声息伏在暗处，全身气机敛得一丝不露！\n\n“崔婆子，子时都快过了，那藏头露尾的正主真敢独个儿往这死窑里钻？”刀疤散修屠七摸了摸怀里的鬼头大刀，压极了嗓门用气音传话。\n\n“急什么！”赤蝎崔婆枯瘦五指扣着袖口嗡嗡欲动的腐骨毒蜂囊，浑浊老眼死死盯着窑外白茫茫的浓雾，“半页破障真方连老身都瞧不出破绽，只要他想要地上这小杂种活命封口，今晚就得乖乖踏进这窑门！”\n\n“待会儿人一进窑，你跳下去堵死后路，老身拿绿瘴锁死他的气门，千万别烧坏了他怀里的下半截丹方！”\n\n屠七舔了舔干裂嘴唇，眼底凶光毕露：“放心，老子通窍五窍的大刀，专剁人四肢留活口！”\n\n两人都稳操胜券，却谁也没有低头细看一眼身下——\n\n就在他们落脚的东侧主承重柱根部，以及脚底十字排风暗道深处，早在两个时辰前的戌时，便已被陈长庚用分水刺掏空砖芯，严严实实塞满了整整六十斤地火硫煞废矿渣，上头只盖了一层薄薄的陈年白硝粉伪装！\n\n距离窑口三十步外的干涸乱石沟里，一身黑衣蒙面的陈长庚静静伏在枯草下，手里握着那张老旧铁胎弓，冰冷眸光穿透夜雾锁死了硝石窑穹顶。\n\n“子时到了。”\n\n随着陈长庚指尖弹出一粒碎石落入后方苇丛，百丈外高坡上的贺九斤猛地抡起木槌，照着一面破铜锣狠狠砸了下去！\n\n“哐——哐哐！！”\n\n凄厉刺耳的破锣声骤然撕裂死寂寒雾！\n\n贺九斤躲在大石后扯着嗓子嘶喊起来：“崔婆婆！我家主顾守信带全本丹方来了，就在东坡石沟验货！快把小石头推出来——”\n\n突如其来的炸耳锣声震得窑内回音乱撞！\n\n赤蝎崔婆袖筒里那群最忌高频金铁震音的腐骨毒蜂瞬间受惊狂躁，发出一阵密集尖锐的“嗡嗡”振翅声，两只黑斑毒蜂更是失控冲出了横梁阴影！\n\n“妈的，在东坡石沟？！”东侧承重柱横梁上的刀疤散修屠七下意识探出半个脑袋朝外张望。\n\n三十步外枯草沟中，陈长庚眸底杀机暴涨！\n\n“果然多请了一个五窍帮手伏在东柱顶上。”\n\n半句废话没有，陈长庚更不曾踏入硝石窑半步！\n\n左手铁胎弓瞬间拉成满月，右手搭上一支箭头裹满火油麻布、刚在火折子上舔燃幽蓝火苗的粗铁箭，对准窑口地面草丛里预埋的那根油浸引火线——\n\n“崩！”\n\n弓弦震响，火箭如流星赶月般破雾疾射，“夺”地一声精准钉入窑口三尺外的油麻引线节点！\n\n“不好！有诈——”窑顶上的赤蝎崔婆瞳孔骤缩，尖声厉叫！\n\n晚了！\n\n油浸麻线遇火即燃，一条赤红火蛇快如闪电般钻进十字排风暗道，瞬间引爆了深埋在三根承重柱根部的六十斤地火硫煞废矿与陈年白硝霜！\n\n“轰隆隆——！！！”\n\n大地剧烈震颤，三团混杂着刺目黄绿硫烟的狂暴烈焰自承重柱底部冲天炸开！\n\n本就风化酥脆的三根青砖大柱像纸糊般齐根崩断，重达万斤的砖石穹顶挟着漫天烈火轰然向内坍塌！\n\n“啊——崔婆救我！！”\n\n潜伏在东侧主梁上的通窍五窍刀疤散修屠七首当其冲，脚下横梁瞬间炸断，整个人避无可避地被两块千斤断墙砸断双腿，惨叫着一头栽进了下方爆燃沸腾的硫煞硝火深坑！\n\n滚烫粘稠的硫磺毒火沾肉即蚀骨髓，任凭屠七拼命催动五窍气血翻滚嘶嚎，不过三四个呼吸便被倒塌的红砖烈焰彻底吞没，活活烧成了一具蜷缩焦炭！\n\n“小畜生，找死！！”\n\n就在窑顶塌陷的前一刹那，通窍六窍的赤蝎崔婆展现出了老牌凶修的悍勇——她毫不犹豫一掌拍碎脚下蛇头铁杖借力横掠，硬生生在万斤乱石合拢前撞破西侧残墙冲出了火海！\n\n半空中，崔婆喷出一口墨绿精血，周身瞬间撑开一道三尺厚、腥臭扑鼻的六窍“碧磷绿瘴护罩”将坠落碎砖尽数弹飞；她一眼锁定三十步外石沟旁刚刚弃弓起身的蒙面黑衣人，枯瘦双手猛地往双袖一抹！\n\n“给老身烂成脓水吧！！”\n\n嗡——嗤嗤嗤！\n\n数十只死里逃生的腐骨毒蜂混杂着上百根细如牛毛、淬满墨绿尸毒的“腐骨毒针”，化作一片遮天蔽日的乌黑毒云，封死陈长庚周身三丈所有闪避死角，铺天盖地攒射而至！\n\n换作寻常通窍五窍散修，被这漫天毒针毒蜂正面罩住，唯有一死！\n\n陈长庚却连退半步的意思都没有！\n\n他不退反进，体内通窍五窍的磅礴气血与《井煞锻骨功》百锻铁骨瞬间催至巅峰，古铜熟铁般的皮膜轰然绷紧，左臂曲肘横挡咽喉面门，整个人如一头蛮横凶虎般迎着毒雨悍然狂冲而上！\n\n“叮叮叮叮——噗噗！”\n\n密集如急雨打芭蕉的金铁脆响在他前胸炸开！\n\n最致命的二十余根主力腐骨毒针穿透黑衣，结结实实撞在贴胸绑紧的那面“玄铁护心镜”上，溅起一串火星纷纷崩飞落地；另有四五根擦过边缘的毒针扎在左肩与肋侧，却被硬如熟铁的五窍横练肌肉死死卡在表皮三分浅处，未能伤及分毫筋骨！\n\n“什么？！横练体修？！”\n\n刚刚落地的赤蝎崔婆见剧毒飞针竟没能放倒对方，苍老面皮骇然剧变，本能地想要抽身暴退拉开距离！\n\n可陈长庚硬吃边缘毒针卖这一下破绽，等的便是这贴脸五步的绝杀死距！\n\n一步踏碎泥水，两人距离骤缩至五步之内！\n\n陈长庚漆黑双眸冷寂如冰，双袖暗扣同时一震，四枚箍着三道赤铜锁纹、早已扯断引线的改良过载烈阳火珠呼啸飞出，精准无比地呈四方合围之势锁死了崔婆前后左右全部退路！\n\n崔婆看清那四枚狂暴跳动的赤铜火珠，吓得魂飞天外，嘶声尖叫：“过载火珠？！住手，老身不要丹方了——”\n\n陈长庚一个字也没跟她废话，脚尖一点地面向后急掠三丈！\n\n“轰！轰！轰！轰——！！！”\n\n四枚改良过载烈阳火珠在同一息连环炸膛！\n\n远比当初地火室恐怖数倍的赤白毁灭雷火轰然合流，瞬间将方圆三丈化作一片沸腾的铁水火狱！扑在半空的数十只腐骨毒蜂连惨叫都没发出便被高温气浪烧成飞灰！\n\n火海中心，赤蝎崔婆拼命催动全部六窍修为死撑那层墨绿毒瘴护罩！\n\n第一枚火珠炸开，绿瘴剧烈凹陷；第二枚、第三枚火浪叠加轰落，“咔嚓”一声脆响，通窍六窍的碧磷绿瘴护罩终于承受不住狂暴冲击，当场炸裂成漫天绿烟！\n\n第四股狂暴火浪狠狠掀在崔婆胸腹之上，将她整个人炸得骨断筋折、浑身焦黑冒烟地横飞出火圈！\n\n“咳噗……饶……饶命……”\n\n崔婆重重摔在泥水沟里，满嘴黑血狂涌，刚挣扎着抬起枯爪想去摸腰间解毒丹。\n\n一道鬼魅黑影已踏着尚未散尽的滚烫火浪欺至她身前！\n\n陈长庚右手七寸乌黑淬毒分水刺顺着夜色悍然横掠，连半分迟疑都不留，“噗嗤”一声冷酷削过崔婆干瘪的脖颈！\n\n斗大苍老首级滚落泥水，通窍六窍凶名赫赫的赤蝎崔婆，双目圆睁，当场气绝！\n\n陈长庚看都没看尸首一眼，先伸手拔掉自己左肩表皮卡着的四根毒针，运转五窍气血逼出几滴发乌毒血擦净；随即反手扯下崔婆腰间那只灰布储物袋，抬脚将无头尸身与首级一并踹进旁边熊熊燃烧的硫煞硝火深坑之中。\n\n做完这一切，他才快步绕到前侧尚未全塌的窑口豁处，一刺挑断小石头身上的麻绳，像拎小鸡似的将吓晕过去的少年提出来，丢给满头大汗跑下荒坡的贺九斤。\n\n“人齐了，崔婆和她请的帮手全化了灰。”陈长庚隔着黑面巾冷声吩咐，“你背着小石头从南坡水道绕回脚行，今晚的事烂在肚子里，明早等我信儿。”\n\n贺九斤望着后方塌成一片恐怖毒火海的硝石窑，腿肚子抖得差点又跪下去，连连点头如捣蒜：“长庚爷放心！小的就是咬碎舌头也不敢漏半个字！”\n\n目送贺九斤背着徒弟仓皇消失在夜雾深处，陈长庚没有原路回西棚区，而是绕到二里外一处僻静芦苇暗渠旁，扯下黑面巾丢进水里，探出一缕五窍气血抹开赤蝎崔婆的无主储物袋。\n\n哗啦一声，袋中家当尽数落在掌心。\n\n除了几瓶阴损腐骨毒粉被他随手砸碎沉入臭水渠外，最显眼的是一大捧灵光澄澈的完整下品灵石！\n\n陈长庚五指飞快数过，冷峻眉宇间终于浮起一丝笑意。\n\n“整整二十二枚下品灵石！”\n\n加上他原本贴身藏着的二十六枚，如今手里完整下品灵石正好凑足四十八枚！\n\n即便后天在渡口交掉三十枚买路钱，身上还能稳稳留下十八枚下品灵石充作入宗安家底牌！\n\n陈长庚收起灵石，目光落在了储物袋最底层摸出的一只巴掌大小、边缘刻满细密敛风符文的青铜圆盘上。\n\n他试着往青铜圆盘中心凹槽嵌入一枚灵石。\n\n嗡！\n\n一层肉眼难辨的无形淡青气幕瞬间笼罩方圆三尺，连脚边臭水渠刺鼻的腥臭泥味都被彻底隔绝在外，半丝气息不再往外透漏！\n\n“竟是一只成色完好的隔味阵盘！”陈长庚眸光大亮，“崔婆原本用来遮掩屋内熬毒蜂腥气的宝贝，如今正好替我的蚀纹石臼彻底锁死收尾地火腥甜气！”\n\n身后三里外，废弃硝石窑坍塌腾起的滚滚浓烟早已与大泽子夜寒雾融为一体，将最后一丝杀伐血迹抹得干干净净。\n\n陈长庚收起隔味阵盘站起身，隔着茫茫芦苇水荡遥望向东方。\n\n二里外的黑石渡口栈桥尽头，一艘高达三丈的云泽宗接引楼船已悄然破雾泊岸，船首高悬的两盏青色阵灯在黑夜里幽幽亮起。"}, {"n": 20, "title": "渡口亮印", "body": "十七日五更卯初，西棚区窄巷还在湿冷晨雾里沉睡。\n\n陈长庚悄无声息翻过乱石岗后墙，撬开石屋门栓闪身入内，反手搬起顶门石条抵严木板。\n\n撬开北墙根那块焦黑青砖，温热硫磺地煞气扑面涌出，贴胸绑紧的蚀纹石臼早已蓄满第九轮潮汐余韵，正微微发烫轻颤。\n\n这一回，陈长庚没有再去点那盆呛人的湿泥炭。\n\n他取出昨晚从赤蝎崔婆储物袋里缴获的青铜隔味阵盘，平放在地缝旁，往阵心凹槽轻轻按入一枚下品灵石。\n\n嗡的一声微不可闻的轻颤，一层淡青色无形气幕顺着墙角铺开三尺，将土炕与北墙地缝罩得严严实实。\n\n陈长庚解开地洞里剩下的七袋鼎余轩剧毒废丹灰，挑出药毒最烈的四袋，一股脑倒进蚀纹石臼凹槽，将臼底重重按在地火支脉裂缝上！\n\n石臼嗡鸣吞吐，紫黑毒灰以肉眼可见的速度干瘪塌陷。\n\n一刻钟后，收尾特有的浓烈地火腥甜气如期喷薄而出，却在撞上三尺淡青气幕的刹那如泥牛入海，连半丝异味都没能透出阵盘之外！\n\n“好宝贝。”\n\n陈长庚眼底掠过一抹喜色，伸手扣出阵盘凹槽里的灵石——只耗去微不足道的一丝表层灵气，整枚下品灵石依旧澄澈完好。\n\n再探手摸向微凉的臼心，整整三钱莹白如雪、毫无半分丹毒的道髓晶砂静静躺在槽底！\n\n陈长庚留下一钱半新晶连同早先存底的一钱晶砂一并封入锁灵寒玉匣，随即盘膝坐上土炕，仰头将手里温润的一钱半道髓晶砂尽数吞入腹中！\n\n《引火行气诀》与《井煞锻骨功》同时全力运转！\n\n磅礴纯厚的暖流在四肢百骸间轰隆奔涌，将五日前刚冲开的第五处主气窍反复冲刷拓宽，周身骨骼发出细密低沉的铁鸣，直到五窍气血圆融如汞、彻底稳固在通窍五窍巅峰，他才缓缓吐出一口浊气。\n\n按三十六个时辰一轮的潮汐铁律，下一轮石臼充能就绪，正好在二十日卯时——那时候他早已在云泽宗接引楼船上了。\n\n歇息打磨了一整日，转眼到了十一月十八日寅末。\n\n陈长庚在黑暗中利落起身，将全部家当分作明暗四处：\n\n三十枚买路用的下品灵石装进一只不起眼的粗麻布袋；准备留给贺九斤的两枚灵石揣入袖兜；余下十六枚完整下品灵石，则分三处缝进贴身靴底夹层、护心镜内衬与腹间暗带，连同蚀纹石臼、锁灵寒玉匣及收着《控火诀》、《修渠草图》与剩余三袋废丹灰的储物袋一起，牢牢贴腹捆在隔味阵盘内侧。\n\n明面背上的破包袱里，只塞了两件换洗麻衣和两块乌卤盐场废铜牌。\n\n临出门前，陈长庚倒出瓷瓶里最后一粒灰褐敛息丸嚼碎咽下，配合锻骨锁气劲将五窍巅峰的强横气血尽数压进骨髓深处，只露出一丝刚松首窍、夹杂火毒的虚浮表象。\n\n把石屋地砖恢复原状，陈长庚戴稳竹斗笠推门而出，至于地头蛇罗三限他明日晌午交的押火钱，就让那光头对着空屋子慢慢骂娘去吧。\n\n辰初时分，黑石渡口南侧的枯苇暗巷口。\n\n贺九斤早已缩着脖子在雾里候了半宿，一见陈长庚的灰褐身影出现，慌忙迎上来深深作揖：“长庚爷！小石头昨晚退了烧，脚行上下全盼着您老的信儿呢！”\n\n“从今天起，忘了乌卤盐场，也别提昨晚硝石窑半个字。”\n\n陈长庚停住脚步，从袖兜摸出两枚灵光莹润的完整下品灵石，随手抛进贺九斤怀里。\n\n“嘶——两、两枚整灵石？！”\n\n贺九斤手忙脚乱接住，触手温润厚重，眼珠子差点瞪出眼眶！那可是足足抵得上十块碎灵石、两百多两雪花银的重赏！\n\n“一枚买你嘴严，另一枚是定金。”陈长庚隔着斗笠黑纱淡淡看着他，“往后我在云泽宗外门落了脚，免不了还要往黑石坊市倒腾些不惹眼的矿渣火器。每逢月初月末，你去南街老茶摊挂一根青竹签，有人敲三下桌角提‘乌卤换新炭’，便是我的信儿。”\n\n贺九斤心脏狂跳，顿时明白这位杀人不眨眼的少年是要拿他当宗门内外的长期白手套！\n\n傍上一位即将踏进云泽宗的五窍狠人，可比他在排污沟里倒腾私盐强出百倍！\n\n“长庚爷尽管放宽心！”贺九斤把两枚灵石揣进心口，拍着胸脯赌咒，“往后您的差事就是小的头等大事，小的在南街茶摊候着您的竹签！”\n\n陈长庚微微颔首，不再多言，摘下遮面斗笠扔进苇沟，只穿一身洗白灰布短褐，提着破包袱大步走向晨雾渐散的黑石渡口。\n\n辰时二刻，沧溟大泽水波浩渺。\n\n黑石渡口长长的青石栈桥尽头，那艘长达十余丈、高三层的云泽宗青木接引楼船正吞吐着淡淡灵雾，船帆上绣着巨大的银白云纹宗徽。\n\n栈桥入口摆着一张紫檀验纳长案，四名披甲执戟的外门护卫分列左右，长案后坐着一名留山羊胡、身穿皂色执事袍的干瘦老者，正是纳贡院派驻渡口点卯的通窍七窍修士，许执事。\n\n此时正额新丁早已登船完毕，岸边只剩十几个凑热闹的散修，外加最后几名拿着各矿场调令排队的杂役补缺人选。\n\n陈长庚排在队尾，一眼便瞧见验纳长案侧面站着两名衣着华贵的年轻公子。\n\n为首那人二十出头，身穿宝蓝云锦劲装、腰悬一枚正额入选的青铜登船牌，已有通窍四窍修为；他身旁跟着个面色虚浮、仅通两窍的锦衣少年，两人正围着许执事满脸堆笑地低声说着什么，一只鼓囊囊的小锦袋悄无声息滑进了许执事袖底。\n\n周围看热闹的老散修小声指点议论：\n\n“瞧见没，那是大泽盐商巨贾窦家的嫡长子窦文焕！自己拿了正额船牌还不算，正花重金替他族弟窦文彬买最后一个外门补缺席位呢！”\n\n“听说杂役补缺统共就放了五个名额，前头刚录了四个，后头那个穿破麻衣的盐场小子怕是要白跑一趟喽！”\n\n正说着，前头第四名补缺散修验过调令欢天喜地跑上了船板。\n\n许执事捻了捻袖底刚收的五枚灵石茶水钱，端起茶盏清了清嗓子：“下一个！辰时三刻即刻拔锚，没调令的速退！”\n\n陈长庚低眉顺眼走上前，双手将怀里那张盖着矿司官印的乌卤盐场遣散文牒呈在案上：“小人乌卤盐场司火童子陈长庚，前来应补外门火房杂役。”\n\n案旁的窦文焕斜眼上下扫了陈长庚一圈，见他衣衫寒酸、左袖焦黑，周身气血更是混浊微弱得刚摸到一窍边，当即嗤笑出声：\n\n“许执事您瞧瞧，乌卤盐场撵出来的熬卤贱役，肺里指不定烂了多少火毒，连站都站不稳，也配进云泽宗伺候仙师炉火？”\n\n旁边族弟窦文彬立刻挺起胸膛帮腔：“就是！许伯伯，小侄虽才通两窍，可家里从小拿灵参养着，比这短命泥腿子强出一百倍！”\n\n许执事放下茶盏，眼皮都没抬一下，两指捏起陈长庚那张轻飘飘的麻纸文牒，官腔十足地冷哼一声：\n\n“胡闹！外门补缺只剩最后一席，当择气血康健者录用。你气窍淤浊、左臂带伤，矿司遣散废牒岂能作数？来人，废牒撕了，把这厮轰出栈桥，名额记窦氏文彬！”\n\n“得令！”两名执戟护卫跨前一步便要架人，许执事枯瘦手指一错，眼看就要将那纸脱籍文牒当场扯碎！\n\n窦文焕嘴角勾起轻蔑笑意，抱臂等着看泥腿子跪地哭求。\n\n“许执事且慢动手。”\n\n陈长庚没有后退半步，也未露半分气急败坏之色，反而恭恭敬敬往前欺近半步，用只有案前三人听得清的低缓嗓音轻问了一句：\n\n“小人愚钝，只敢问执事一句——这最后一席火房补缺，究竟是大泽窦家说了算，还是山门纳贡院冯保山冯管事说了算？”\n\n许执事准备撕纸的双手猛地一顿！\n\n旁边的窦文焕脸色一沉，厉声喝斥：“大胆贱役！死到临头还敢攀扯冯管事的名讳吓唬人？许执事，快叫护卫掌他的嘴！”\n\n“住口？我看该慎言的是窦公子吧。”\n\n陈长庚看都没看窦文焕一眼，趁着宽大灰褐布袖抬手行礼的遮挡，右手稳稳将那只装满整整三十枚下品灵石的粗麻袋按在紫檀案角；左手则在袖影底下将怀中那封未封口的私函与半张兽皮残图轻轻掀开一角，只露给长案后的许执事一人过目！\n\n麻袋口微敞，三十枚棱角分明、灵光澄澈的下品灵石挤得满满当当！\n\n而在那张只有纳贡院内堂才用的竹纹信笺左下角，除了鲜红刺目的“云泽宗外门纳贡院”私印外，赫然还用朱砂笔勾着四个铁画银钩的蝇头小字——\n\n“丙字废火”！\n\n轰！\n\n许执事浑浊瞳孔骤然缩成针尖，后脊梁一股寒气直冲天灵盖，额角冷汗差点当场滴下来！\n\n他在纳贡院当了十年差，闭着眼都能认出顶头上司冯保山的亲笔字迹与私账暗记！\n\n丙字废渣房三年连折三任杂役，那是冯管事特地扣在手里、专卖三十枚整灵石高价私货的自留地！眼前这貌不惊人的熬卤小子哪是什么无主野狗，分明是揣着足额买路钱来交冯管事私账的正主肥羊！\n\n他刚才贪窦家五枚灵石的蝇头小利，要是真把冯管事这笔三十枚灵石的大买卖给撕黄了，回山当天冯保山就能寻个错处把他发配黑水矿坑熬到死！\n\n前后不过一息工夫，许执事那张原本阴沉刻薄的老脸瞬间堆满了春风般的慈和笑意！\n\n“哎呀！老夫老眼昏花，竟差点看漏了郑执事的批红！”\n\n许执事袖袍快如闪电般一卷，不动声色将那三十枚灵石粗麻袋连同私函残图一并扫入案下暗格，随即脸色一板，反手从袖里摸出窦文焕刚塞的那只小锦袋，“啪”地扔回窦文焕怀里！\n\n“许、许执事？！”窦文焕措手不及接住锦袋，整个人都懵了，“您这是何意？！”\n\n“何意？云泽宗门规森严，岂容尔等拿铜臭私相授受！”\n\n许执事猛地一拍惊堂木，义正词严地厉声呵斥：“此子陈长庚乃矿司郑执事亲验耐火毒奇才，正合外门丙字火房急缺，名正言顺！窦文焕，你既有正额船牌还不速速登船，再敢替无调令族弟在此喧哗闹事，老夫连你的正额资格一并革除！”\n\n全场一片哗然！\n\n刚才还等着看泥腿子被扔下水的散修们全都傻了眼，谁也没看懂这穷酸小子只行了个礼递了只破布袋，怎就让眼高于顶的许执事当众翻脸抽了窦家大少爷的耳光！\n\n“许伯伯！我的名额——”窦文彬急得伸手去抓长案。\n\n“轰出去！”许执事冷哼挥袖。\n\n两名执戟护卫毫不含糊，铁戟一横直接将面红耳赤的窦文彬硬生生架出了栈桥警戒线外！\n\n窦文焕攥着那袋被退回来的灵石，当着满渡口散修的面颜面扫地，一张俊脸涨成猪肝色，胸口剧烈起伏，却半个字也不敢顶撞七窍执事。\n\n长案后，许执事已飞快取出一块竹牌与一纸公文，啪地盖上纳贡院火漆大印，连同刚才那张郑执事签批的矿司原牒一并推回陈长庚面前，和颜悦色道：“陈长庚，补缺验讫，矿司原牒与纳贡院火漆回执你一并收好，入山门测窍验资还需呈验，快提行李上船入底舱歇着吧。”\n\n“谢许执事秉公栽培。”\n\n陈长庚深深一揖，双手将矿司原牒与那纸火漆回执一并揣入怀中，提着轻飘飘的破麻包袱，从脸色铁青的窦文焕身旁平静走过，一步踏上了接引楼船宽厚的青木跳板。\n\n“铛——铛——铛！！”\n\n辰时三刻已到，船首铜钟连撞三响！\n\n粗大铁锚在绞盘轰鸣声中缓缓拉离水底，船身两侧十二道风帆灵纹同时亮起青光，三丈高的云泽宗接引楼船轰然破开沧溟大泽白茫茫的锁江浓雾，朝着八百里水云深处的仙家山门破浪驶去！\n\n陈长庚站在底舱入口回望了一眼渐渐隐入雾气的黑石渡口，手掌隔着粗布短褐轻轻按了按贴腹暗藏的十六枚灵石与蚀纹石臼，转身弯腰钻进了昏暗潮湿的杂役底舱。\n\n就在他身影没入舱门的刹那，二层甲板雕花廊柱的阴影底下，勉强登船的窦文焕正居高临下死死盯住底舱楼梯口，眼底翻涌着毒蛇般的怨毒杀机。\n\n片刻后，一名腰悬“外门巡舱”木牌、眼角带着寸许刀疤的精悍老弟子踱步经过廊下。\n\n窦文焕眼神一闪，快步迎进暗影，将手里那袋原封未动的五枚下品灵石一把塞进刀疤老弟子袖筒里，咬牙压声道：\n\n“卢成师兄，刚才在渡口挤掉我族弟的那个盐场泥腿子就在底舱。今晚夜航过大泽深水带，劳烦师兄查舱时替小弟摸摸他的底，卸他一条胳膊出出气！”"}, {"n": 21, "title": "夜舱卸祸", "body": "十一月十八日，戌末。\n\n沧溟大泽深水带黑雾锁江，接引楼船破开暗浪，底舱木板随着水势吱呀乱晃。\n\n十几名补缺杂役挤在发霉的通铺草垫上，被舱底咸腥潮气熏得翻来覆去睡不踏实。\n\n陈长庚没有往角落里缩，而是抱膝坐在紧挨楼梯口的门框下。\n\n清晨寅末吞下的那粒低阶敛息丸，早在午后便散尽了药力。\n\n此刻他全凭《井煞锻骨功》的锁气劲，将通窍五窍巅峰的气血死死压进骨髓深处，外头只漏出一丝刚通一两窍、还掺着盐灶火毒的虚浮病气。\n\n旁边一个穿麻衣的矮胖新丁凑过来，压着嗓子递了半块硬麦饼：“陈兄弟，晌午多亏你扯那半截干净麻布给我包脚泡，不然这会儿早烂穿了。”\n\n陈长庚摆摆手没接麦饼，只拍了拍膝头那个干瘪的灰布破包袱：“举手之劳，你晌午塞给我的那两角黑碎银，已经抵过布钱了。”\n\n矮胖新丁嘿嘿一笑：“统共才抵七八文铜板，上山买碗热汤都不够。对了，你坐风口干啥？夜里泽风冷得很。”\n\n“肺里老毛病，闷在里头喘不上气。”陈长庚低声咳了两下，眼角余光却透过门缝瞥向二层甲板的走道。\n\n早上在黑石渡口，窦家大少爷窦文焕当众被许执事退赃训斥，丢尽了体面。那种养尊处优的盐商公子哥，绝不会把这口恶气咽到明天靠岸。\n\n底舱死角是个关门打狗的绝地，唯有贴死楼梯口，真有疯狗咬下来，才能一步撞进楼上执事的眼皮底下。\n\n念头刚落，头顶楼梯板突然传来一串沉重蛮横的靴响。\n\n“哐当——！”\n\n底舱木门被人一脚狠狠踹撞在舱壁上，震落满头灰尘。\n\n三名身穿青灰劲装的外门弟子提着风灯闯进来。领头那人三十上下，眼角斜劈着一道寸许长的狰狞刀疤，周身散着通窍四窍老手的凶悍气劲，腰间木牌刻着“外门巡舱”四字。\n\n正是收了窦文焕五枚下品灵石的卢成。\n\n满舱杂役吓得一骨碌爬起来，缩在铺位上大气不敢喘。\n\n“都给老子站直了！”卢成提着马鞭扫视一圈，目光在门边的陈长庚身上骤然定住，嘴角勾起一抹狞笑，“船入深水带，例行查验违禁火器！谁敢藏私，打断手脚直接扔下去喂鱼！”\n\n矮胖新丁哆嗦着举起包袱：“师、师兄明鉴，小的们都是各场调来的苦力，哪买得起火器……”\n\n“问你话了吗？滚一边去！”\n\n卢成一鞭杆抽开矮胖新丁，径直跨到陈长庚跟前，居高临下冷笑道：“乌卤盐场来的陈长庚是吧？早上在渡口挺威风啊，把包袱打开！”\n\n陈长庚慌忙起身垂手，弯着腰赔笑：“回卢师兄，小人包袱里只有两件换洗旧衣，绝无违禁之物。”\n\n“有没有，老子验过才算！”\n\n卢成一把夺过灰布包袱，双手猛力一撕，“嗤啦”扯裂布面。\n\n里头的东西哗啦撒了一地——两件打补丁的粗麻短褐、两块磨平字迹的乌卤盐场废铜牌，外加晌午刚换来的那两小角发黑碎银。\n\n跟在后头的年轻巡舱弟子愣了愣：“卢师兄，真是个穷鬼啊，连半块碎灵石都没见着。”\n\n陈长庚暗处贴腹绑着青铜隔味阵盘与储物袋，石臼、寒玉匣和分三处缝死的十六枚整灵石一丝气味灵光都不露。他脸上却装出肉疼惶恐的模样，弯腰想去捡那两角碎银：“师兄担待，这真是小人全部盘缠了……”\n\n“急着护食？包袱里没货，那就是贴身藏着烈火砂了！”\n\n卢成眼底凶光骤闪，趁陈长庚弯腰的刹那，右手五指成爪暗吐通窍四窍的卸骨狠劲，照着陈长庚左肩琵琶骨悍然扣落！\n\n这一爪若是扣实了，寻常一两窍杂役整条左臂筋骨当场就得废掉，紧接着便是撕衣搜身！\n\n电光石火间，陈长庚没有催动一丝五窍百锻铁骨硬顶。\n\n就在卢成指尖沾上粗布衣肩的前半息，陈长庚脚底故意踩中地上那块废铜牌，整个人顺着卢成前扑的掌风，像个纸糊的病秧子般借势往后猛跌出去！\n\n“啊——卢师兄饶命！”\n\n一声凄厉惊呼撕破夜航寂静，陈长庚后背撞开虚掩的舱门，连滚带爬摔在门外宽敞的楼梯转角甲板上，“砰”地撞响了二层廊柱铜铃！\n\n“放肆！大半夜在底舱鬼叫什么？！”\n\n二层雕花栏杆上方，一名身穿皂袍、刚巡视完船中阵枢的纳贡院押船副使猛地探身往下喝问，廊道两侧七八名值夜护卫齐刷刷投来目光，二楼暗影里等着听骨裂声的窦文焕更是脸色一僵。\n\n卢成抓了个空，一步追出舱门，见楼上宋副使正沉脸盯着这边，心头顿时咯噔一下。\n\n“宋副使息怒！”卢成连忙收起凶相抱拳，“底舱有个盐场新丁形迹可疑，弟子正按规矩搜检违禁火器，这小子做贼心虚自己摔出来了！”\n\n甲板冰凉的木地上，陈长庚捂着左肩剧烈咳嗽，挣扎着跪伏在地，却没有喊一句冤枉。\n\n他双手高高捧起怀里那张盖着鲜红火漆大印的公文与矿司原牒，对着卢成恭恭敬敬磕了个头，声音不大不小，刚好传遍上下两层廊道：\n\n“小人不敢躲搜！只是小人乃驻矿郑执事亲批、补入纳贡院‘丙字废火’的专调杂役！”\n\n陈长庚喘了口气，把那枚火漆大印又举高三分：“许执事登船前千叮万嘱，让小人护好这封纳贡院火漆回执，抵山过堂时完好无损交到冯保山冯管事手里！”\n\n他仰起蜡黄瘦脸，满眼惶恐地望着卢成：“卢师兄方才这一抓力道太大，小人贱骨头折了不要紧，万一撕烂了冯管事钦点的回执、耽误入山后丙字房顶缺，还求卢师兄替小人向宋副使和冯管事立个字据担待则个！”\n\n“丙字废火？冯管事？”\n\n楼上的宋副使眉头猛地一拧，居高临下盯向那枚醒目的纳贡院火漆大印，冷哼道：“卢成，冯管事点名要的补缺人丁，登船前许执事已经验过身了，你往他身上搜什么火器？”\n\n卢成后背瞬间沁出一层冷汗！\n\n窦文焕只说这是个挤掉他族弟的盐场泥腿子，压根没提这小子手里捏着冯保山丙字废火的私账回执！\n\n他在外门混了六年，哪能不知道冯保山那笑面虎的手段？丙字废渣房连死三任杂役，冯管事正愁抓不到替死鬼顶缸，要是今晚他当着宋副使的面把这小子的胳膊卸断了，回山后冯保山非扒他一层皮不可！\n\n为了窦家五枚灵石，去触通窍八窍实权管事的霉头？傻子才干！\n\n二楼廊柱阴影后，窦文焕脸色铁青，手指死死抠进木栏，却连头都不敢探出来。\n\n“原、原来是冯管事房里的人！”卢成眼角刀疤抽搐两下，变脸比翻书还快，弯腰一把将陈长庚拽起来，顺脚把底舱门口那两角发黑碎银踢进自己靴筒，色厉内荏地喝道，“早把火漆回执亮出来不就结了！底舱油火例钱我替你收了，滚起来吧！”\n\n宋副使不耐烦地挥挥手：“行了，深水带夜雾重，别在舱口吵嚷惊扰正额弟子清修！”\n\n说完转身拂袖离去。\n\n待楼上脚步声走远，卢成盯着低眉顺眼拍灰的陈长庚，眼底寒毒丝毫未消。\n\n拿冯管事压我？明面上动不得你的筋骨，这八百里大泽水路可长着呢！\n\n“既然是耐火毒的好手，底舱闷着也是糟蹋人才。”卢成冷笑一声，抬手指向浓雾翻滚的船首方向，“前甲板船首铁锚链缺个盯水路的夜哨，今晚子时换防，你去替值到天亮！敢偷懒漏了水情，按门规直接锁进水牢！”\n\n底舱里那矮胖新丁听得脸色发白——深水带子夜寒雾蚀骨，水底下更不知藏着多少嗜血水妖，去船首锚链站哨跟喂鱼没两样！\n\n陈长庚心里门儿清，面上却一句不辩，深深一揖：“小人领命，谢卢师兄抬举。”\n\n总好过困在底舱被人撕开衣裳摸出石臼。上了开阔甲板，天高水阔，谁喂鱼还不一定。\n\n亥末子初，整艘接引楼船灯火渐熄。\n\n陈长庚连同另外三名毫无背景的补缺新丁被赶上前甲板，寒风裹着粘稠如浆的白雾扑面卷来，三步之外人影皆无。\n\n另外三人抱团缩在舱门避风处瑟瑟发抖，陈长庚则按令走到最前头的粗大铁锚链旁，脊背微弓靠住冰冷锚柱，右手悄然按在袖内淬毒分水刺的滑扣上。\n\n脚下大泽水声呜咽，楼船底部镶嵌的青色护船阵纹在水面映出微弱波光。\n\n突然，“咕咚”一声闷响自船首黑水下翻起！\n\n陈长庚瞳孔微缩，垂眸朝铁锚链入水处望去。\n\n只见浓黑如墨的泽水里，毫无征兆地翻上来两具干瘪惨白、浑身精血被吸得涓滴不剩的采珠散修浮尸！\n\n而在两具浮尸下方的幽暗水底，数十双惨白如死鱼般的碗口复眼正密密麻麻浮出深渊，死死贴向了楼船底部的护船阵基！"}, {"n": 22, "title": "雾泽引蜈", "body": "“咯吱……咯吱咯吱……”\n\n令人牙酸的啃噬声顺着湿漉漉的铁锚链直往上窜，船首底部原本稳定的青色阵光肉眼可见地剧烈闪烁起来！\n\n“什、什么动静？！”\n\n缩在后头避风的三名补缺新丁听见异响，一个高瘦汉子壮着胆子凑到船舷边往下瞄了一眼。\n\n借着微弱阵光，只见漆黑船壳与粗大锚链上，不知何时已爬满了上百条手腕粗细、背覆黑铁硬壳的尺长毒蜈！\n\n每条毒蜈口器都长着两根锯齿状乌黑毒鳌，正疯狂啃咬浸泡过灵油的护船阵木！\n\n“铁、铁线水蜈！是成群的食髓水蜈啊！！”高瘦汉子双腿一软，嗓音都劈了叉，掉头就往后甲板通道狂奔，“快跑！护船阵要被咬穿了，快回舱叫执事救命！”\n\n另外两名新丁也吓得连滚带爬扑向甲板后方的铁栅门。\n\n然而三人刚冲到通道口——\n\n“哐当！！”\n\n一道手腕粗的玄铁栅栏门毫无征兆地从上方重重砸落，将前甲板退路封得严严实实！\n\n铁栅后头的廊道避风阴影里，刀疤脸卢成正慢条斯理扣死一把碗口大的黄铜重锁，嘴角挂着猫戏耗子般的残忍冷笑。\n\n“卢师兄开门啊！水底爬上来好多铁线水蜈！”高瘦汉子双手死死扒住铁栅栏哭喊。\n\n“慌什么？养你们这群贱役吃干饭的？”\n\n卢成一脚踹在铁栅上震开他的手，顺手从门缝底下扔进来四柄锈迹斑斑的长柄铁钩，冷喝道：“护船副使正在中舱稳固阵枢，严令前甲板封锁防虫群窜入内舱！你们四个拿铁钩把爬上船舷的水蜈全给我钩下去，敢退一步，按临阵脱逃立斩不赦！”\n\n说完，卢成看都不看哭爹喊娘的三人，提着风灯转身走上右侧二层走道，优哉游哉钻进了右舷探出船外的一座半封闭木制暗哨亭，抱臂靠栏等着看底下的好戏。\n\n船首浓雾里，陈长庚弯腰捡起一柄沉重长铁钩，借着雾气遮掩退到千斤铁锚绞盘柱的死角后头，胸口剧烈起伏，装出一副吓破胆气喘吁吁的模样。\n\n他抬头瞥了一眼右舷上方那点晃动的风灯微光，眼底寒意森然。\n\n好毒的一招借刀杀人！\n\n一旦被铁线水蜈咬死坠江，天亮后卢成只需报一句“新丁夜哨失足喂了水妖”，哪怕是纳贡院冯保山也挑不出一丝错处！\n\n“嗤——嗤啦！”\n\n前头那高瘦汉子退路断绝，红着眼抡起铁钩，照着刚翻上左舷栏杆的两条尺长水蜈狠命砸了下去！\n\n坚硬虫壳应声碎裂，可虫腹内积蓄的一团墨绿腥臭毒液当场爆溅开来，劈头盖脸浇在高瘦汉子面门与前胸上！\n\n“啊——！！”\n\n滋滋白烟腾起，那毒液烈得惊人，眨眼便蚀穿麻衣皮肉露出森森白骨！\n\n高瘦汉子凄厉惨叫着乱抓乱滚，脚下一滑，竟一把拽住身旁另一个吓傻的少年，两人双双翻出船舷，“扑通”栽进了黑水之中！\n\n水面瞬间沸腾，十余条铁线水蜈一拥而上，连两个呼吸都没撑过，两声惨叫便彻底淹没在浑浊血泡里。\n\n仅剩的矮胖新丁吓得瘫软在锚柱另一侧，裤裆湿透，连哭都发不出声了。\n\n二层右舷暗哨亭里，卢成满意地吐出一口瓜子皮，探头冲浓雾下的锚柱冷喝：“陈长庚！死在角落里了？还不滚出来清虫！”\n\n“卢、卢师兄饶命……小人这就钩……”\n\n陈长庚嘶哑应了一声，双手握着铁钩颤巍巍挑飞一条爬近脚边的幼蜈。他看似狼狈躲闪，通窍五窍巅峰的敏锐耳目与三年熬卤辨毒的看家本事却早已推至极致。\n\n不对劲。\n\n寻常铁线水蜈畏惧阵法灵光，绝不敢顶着护船青光死磕阵基。\n\n陈长庚鼻翼微动，在满甲板刺鼻腥臭中，精准捕捉到了一缕从右舷水线底下飘上来的古怪腥甜麝香！每当水下传来一声低沉如闷鼓的颚骨轻叩，甲板上的水蜈群便齐齐亢奋前扑！\n\n他顺着锚柱缝隙斜眼望向右舷下方——\n\n就在卢成藏身看戏的那座右舷暗哨亭正下方三尺的排水槽阴影里，一截足有水桶粗细、长达七尺的暗金斑纹巨躯正死死吸附在主阵木上！\n\n两根尺许长的乌黑毒鳌每一次开合，都刮下大片带灵光的木屑！\n\n通窍七窍级别的铁线母蜈！\n\n这畜生最嗜食浓烈地火硫毒与精血，此刻正躲在排水死角偷噬右舷阵眼，而二楼的卢成浑然不觉自己屁股底下就蹲着一头七窍凶物！\n\n“既然卢师兄这么喜欢看水蜈吃人，那小的就请师兄先尝个鲜。”\n\n陈长庚眸光冷冽如铁。硬砸铁栅门必会暴露百锻铁骨气力，把脚下这头七窍母蜈引去拆了卢成的哨亭，才是死无对证的阳谋！\n\n浓雾翻涌，又一条水蜈窜上锚链。\n\n陈长庚假意惊慌转身挥钩猛砸，借着宽大灰布衣摆旋身的遮挡，左手闪电般探入贴腹绑在青铜隔味阵盘旁的储物袋口，指尖精准捻出半撮鼎余轩买来的剧毒废丹炉灰，顺手裹进鞋底刮起的一团湿船泥里！\n\n鼎余轩的废丹灰本就蕴含狂暴地火硫煞，对嗜毒如命的母蜈而言，无异于十里飘香的绝世大补丸！\n\n“滚开！”\n\n陈长庚嘶喊着挥出长柄铁钩荡飞幼蜈，藏在袖底的左手拇指借着铁钩破空的呼啸声，运起五窍巧劲朝三丈外的右舷外壁轻轻一弹！\n\n“啪。”\n\n一粒比蚕豆还小的黑泥丸穿过茫茫白雾，不偏不倚，正糊在卢成脚下暗哨亭底板外侧的木梁上！\n\n湿泥遇风微散，一股极其霸道刺鼻的地火硫煞腥甜气骤然在右舷上方炸开！\n\n下一瞬，排水槽下的水声陡然死寂！\n\n卢成正趴在暗哨木栏上眯眼往船首瞅，忽然觉得脚底板一阵剧烈震颤，低头一看，一双足有铜铃大小、泛着嗜血凶光的惨白复眼竟从哨亭下方探了出来！\n\n“什、什么鬼东西？！”卢成头皮瞬间炸麻！\n\n没等他拔出腰间长剑，那头受浓烈硫煞药气刺激陷入狂暴的通窍七窍铁线母蜈发出一声尖锐嘶鸣，七尺长的暗金铁躯如攻城巨锤般破水暴起！\n\n“轰咔——！！”\n\n整座右舷木制暗哨亭连同三丈长的厚重护栏当场被母蜈撞得粉碎！漫天碎木屑中，腥风扑面，碗口大的毒口喷出一股墨绿毒箭直取卢成面门！\n\n“救命啊——！！”\n\n卢成吓得脖子后头寒毛倒竖，拼命催动四窍劲气横剑死挡，“铛”的一声巨响，精钢长剑竟被母蜈一对乌黑巨鳌硬生生磕飞出去！\n\n半滴溅散的墨绿毒液擦过他握剑的左手尾指，皮肉瞬间化作黑水直往掌骨蔓延！\n\n生死关头，卢成也是个狠茬子，借着撞击之力连滚带爬摔向二层内廊，右手反拔腰间短匕，“噗嗤”一刀狠狠剁掉自己染毒发黑的左手尾指，捂着鲜血狂飙的断手凄厉嘶吼：“敌袭！七窍母蜈破阵了！宋副使救命——”\n\n右舷大阵破损的警讯瞬间惊动中舱！\n\n“孽畜敢尔！”\n\n一声雷霆怒喝自船楼深处炸响，那名通窍八窍的纳贡院宋副使须发皆张踏梯掠出，双手掐诀一拍腰间剑囊，一道丈许长的赤霞灵剑带着开山裂石般的灼热剑芒呼啸斩落！\n\n虽未入开脉境无法百丈御器，但这倾尽八窍修为的灵器全力一劈，仍非水虫可挡！\n\n“噗嗤——轰！！”\n\n正欲追咬卢成的七窍铁线母蜈刚昂起上半身，便被赤霞灵剑从头顶正中一剑劈为两半！\n\n腥臭绿血如暴雨般洒满前甲板，断成两截的庞大虫躯抽搐着轰然砸落在前甲板浓雾边缘！\n\n母蜈一死，船舷四周残余的低阶水蜈如丧家之犬，哗啦啦退回黑水深处消失不见。\n\n“快开铁栅清点伤亡，修补右舷阵木！”宋副使脸色阴沉地收剑入鞘，大步赶往右舷破口查看阵基。\n\n几名护卫慌忙冲下来打开黄铜大锁。\n\n就在漫天浓雾与墨绿虫血遮蔽视线的短短两息间，原本缩在锚柱后的陈长庚早已猫腰掠过抽搐的母蜈残首旁！\n\n他假装用长柄铁钩去拨拉虫尸，右袖滑扣无声弹开，七寸精铁分水刺顺着虫颚关节根部闪电般连挑两下！\n\n“咔、咔！”\n\n两截足有半尺长、坚逾百炼精铁且蕴满破甲剧毒的乌黑“铁线蜈毒鳌”应声弹起！\n\n陈长庚手皮绝不沾半星毒血，左手悄然扯开衣襟里侧的无主储物袋口，分水刺尖轻轻一拨，两截带血剧毒毒鳌便滴溜溜滑入储物空间，袋口一束，连腐蚀毒液带血腥气尽数隔绝在内！\n\n待两名执戟护卫提灯冲上前甲板时，陈长庚已退回三步外，脸色煞白地拄着铁钩弯腰剧咳，右手只拎着半截毫无价值的母蜈残足呈上前去：“回、回各位师兄，前哨死了两人，小人与这位兄弟侥幸用铁钩挡到副使大人神剑斩妖……”\n\n瘫在地上的矮胖新丁劫后余生，拼命磕头附和：“全靠副使大人救命！陈兄弟刚才一直挡在前头！”\n\n宋副使走过来扫了一眼满甲板狼藉，见船首阵基未破，冷哼一声丢下两枚木制功勋签条：“还算没白吃宗门干饭！持此签条入山后可记护船小功一次，都滚回底舱待命！”\n\n“谢副使大人赏！”陈长庚双手接过木签，低头搀起腿软的矮胖新丁退回底舱。\n\n二层右舷破口旁，卢成正疼得满头冷汗，用止血散死死缠住缺了尾指的左手。\n\n他怨毒的目光扫过陈长庚瘦弱的背影，忽地一顿，低头盯住了暗哨亭残破底板边缘——那里赫然残留着一抹被水汽晕开、散发着淡淡硫磺味的焦黄泥痕！\n\n“硫煞泥……船首哪来的硫煞味？！”\n\n卢成眼角刀疤猛地扭曲起来，却深知此刻无凭无据根本告不倒刚立小功的陈长庚。他咬碎后槽牙退入廊道暗影，从怀里摸出一张赤色传音符咬破舌尖疾书两行，一扬手化作红光直射云泽宗山门方向：\n\n“表哥！明日靠岸后在苍芦渡测窍台，替我把乌卤盐场来的陈长庚直接按死在黑水矿坑！”"}, {"n": 23, "title": "测台藏拙", "body": "十九日午后，八百里大泽水雾尽头，七座高耸入云的青苍险峰豁然撞入眼帘。\n\n接引楼船缓缓靠泊在云泽宗外门水路门户——苍芦渡。\n\n百余名正额与补缺新丁背着行囊鱼贯下船，沿着宽阔青石阶一直排到半山腰的“测窍坪”。\n\n坪心高筑一座三丈见方的白石台，台心矗立着一根一人合抱粗的墨黑测窍石柱。\n\n主案之后，一名须发皆白、身穿深青执事袍的通窍八窍老执事端坐椅上，正对照名册逐一唱名验脉。\n\n陈长庚顺着石阶抬眼一扫，只见石台左侧栏杆旁还抱臂冷立着一名鹰钩鼻青年，眉眼与卢成有五分相似，一身玄色镶红边刑律堂劲装，腰悬黑铁锁链，周身赫然鼓荡着通窍五窍巅峰的强横灵压！\n\n正是外门刑律堂巡山弟子，卢耀。\n\n“正额第三十七名，大泽窦氏，窦文焕——上前按柱！”书办高声唱名。\n\n人群前排，换上一身簇新宝蓝锦袍的窦文焕整了整衣冠，昂首阔步登台，右掌稳稳按在墨黑石柱上。\n\n嗡！\n\n四道澄澈明亮的青白光环顺着石柱节节亮起，毫无滞涩！\n\n白须秦姓老执事微微颔首，难得露出一丝和气：“二十二岁，通窍四窍清气无瑕，根骨中上，可入外门上舍候补丹堂杂学。”\n\n“谢执事大人！”窦文焕得意行礼，转身下台时，阴冷挑衅的目光特意掠过队尾一身破麻衣的陈长庚，又冲台侧的卢耀几不可察地点了点头。\n\n陈长庚垂着眼皮排在补缺队伍最末，像根木头桩子似的纹丝不动，心里却把台上台下的门道摸了个透亮。\n\n卢成昨晚果然没闲着，还没靠岸就把刑律堂的亲表哥搬来堵门了。\n\n更要命的是，这测窍石柱直测周身气脉虚实。半个月前他在乌卤盐场档案里还是个刚松首窍的病弱司火童子，倘若此刻一掌按出通窍五窍巅峰的煌煌气血，别说卢耀，连台上老执事都得当场把他扣下，严查孙奉先丹房炸炉的真正死因！\n\n藏拙是保命底线，但藏得太狠只露一窍，又正中卢耀下怀被当成废柴扫进矿坑。\n\n“两窍半，掺火毒，刚刚好。”陈长庚指尖微缩，体内《井煞锻骨功》百锻锁气劲悄然流转，将第三至第五窍连同骨髓精气锁得滴水不漏。\n\n不到半个时辰，正额弟子测验完毕，轮到末尾几名补缺杂役。\n\n“补缺末席，乌卤盐场陈长庚，上台！”\n\n随着唱名声落下，台侧抱臂已久的卢耀嘴角勾起一抹森冷弧度，往前逼近两步。\n\n陈长庚低眉顺眼快步登台，学着前人模样伸出满是熬卤老茧的右手，轻轻贴在冰冷的墨黑测窍石柱上，放开了一缕早已调配好的混浊气血。\n\n嗡……滋！\n\n石柱表面先是亮起两道黯淡发黄的微光，爬到第三道刻度一半时便剧烈颤抖起来，散出一团夹杂着黑红斑点的浑浊灰光，随即噗地熄灭！\n\n“噗嗤——哈哈哈！”\n\n台下尚未散去的世家正额新丁们哄堂大笑起来。\n\n“才两窍半？那灰扑扑的黑红光是怎么回事，肺管子都快被火毒烧穿了吧？”\n\n“就这短命鬼成色，怕是熬不过今年冬天，招进山门替宗门浪费棺材板吗？”\n\n窦文焕站在廊下摇着折扇，笑得满脸畅快。\n\n主案后的白须老执事也皱起眉头，提笔便要在名册上画叉。\n\n没等老执事落笔，台侧的卢耀已猛地越众而出，手按腰间黑铁锁链厉声断喝：“慢着！按外门铁律，补缺新丁未满三窍且气脉淤毒者，不堪丹火清役！此子气血污浊、资质下下等，当直接划入黑水矿坑充作苦役，来人，给我锁去西山矿队交差！”\n\n“遵命！”台下两名刑律堂矿卫立刻拎着铁链冲上石阶！\n\n排在后头的矮胖新丁吓得面无人色——谁不知道云泽宗西山黑水矿坑是卢家叔侄把持的阎王殿？里头寒毒蚀骨，进去的杂役十个有九个活不过半年，陈长庚落到卢耀手里，今晚就得被活活折磨死！\n\n眼看冰冷铁链就要套上脖颈，陈长庚却没有后退一步，甚至连呼吸都没乱。\n\n他顺势矮身避开矿卫抓来的手，往前紧走两步直抵主案三尺前，双手稳稳将怀中三样凭证一字排开呈在白须老执事案头——\n\n最左是驻矿开脉执事郑奎亲笔批红的《脱籍遣散文牒》原牒，居中是黑石渡口许执事盖下的“纳贡院火漆回执”，最右则是昨晚宋副使刚赏的护船功勋木签！\n\n“启禀老执事，小人有一言请教。”陈长庚头埋得极低，声音却清晰得压过了满坪哄笑，“小人并非无主散招的矿役，而是驻矿郑执事亲验耐火毒立功、奉纳贡院冯保山冯管事钧令专调补入‘丙字火房’的顶缺杂役！”\n\n卢耀脸色一沉，踏前一步喝骂：“死泥腿子还敢狡辩！两窍半的废柴进什么火房？刑律堂按测窍等第调拨矿役，轮得到你拿死文牒搪塞？给我拿下！”\n\n“卢师兄要锁小人去挖矿，小人绝不敢抗命。”\n\n陈长庚根本不跟卢耀对骂，只转头看向主案后的白须老执事，恭声叩问：“只是渡口许执事昨日封火漆时再三交代，冯管事房里丙字火缺已空悬多日、急等用人。”\n\n他顿了一息，抬眼望向案头朱笔：“若卢师兄今日把小人截去黑水矿坑，敢求老执事给小人开一纸改调钧批，好叫人送去纳贡院请冯管事把丙字房的名额销了，免得冯管事怪罪下来算小人逃役！”\n\n一言既出，两名原本伸手抓人的刑律堂矿卫动作瞬间僵在半空！\n\n主案后，白须老执事捏着朱笔的手指也顿住了。\n\n他拿起案上那张矿司原牒与火漆回执扫了两眼——上头不仅有开脉境郑奎的亲笔红印，更有纳贡院专用的“丙字废火”暗记火漆，外加宋副使刚签的护船小功！\n\n老执事在山门当了二十年差，太清楚冯保山那老狐狸的脾气了。丙字废渣房是冯保山手里专门拿来刮油顶缸的私留地，冯保山为了抓个耐火毒的替死鬼费尽周折，他一个管测窍的清闲执事，凭什么替卢耀背这口抢冯保山人头的黑锅？\n\n“胡闹！”\n\n白须老执事把脸一沉，啪地一拍案头镇纸，冷冷扫了卢耀一眼：“专项补缺人丁，既有郑执事批红与纳贡院火漆回执，按宗门规矩一律归口纳贡院自行核验调配！卢耀，你是刑律堂巡山弟子，什么时候连冯管事房里的火役都要越权截留了？”\n\n卢耀一张鹰钩鼻长脸顿时涨得青紫交加！\n\n他只听表弟卢成传讯说这小子是个无依无靠的盐场贱役，万万没料到对方手里竟凑齐了开脉执事批文、纳贡院火漆调令外加护船功签三道护身符！\n\n“秦执事容禀，弟子也是体恤丹火重地，怕这火毒病鬼误了宗门差事……”卢耀咬牙抱拳还想硬拗。\n\n“他误不误差事，自有纳贡院冯管事审断，还轮不到你刑律堂操心！”白须老执事一丝情面没留，提笔在陈长庚文牒上重重批下“通窍两窍半、移交纳贡院候验”十字，将三样凭证推回陈长庚怀里，挥袖喝道，“来人，带这新丁去纳贡院候验寮房候审！下一个！”\n\n全场一片死寂，刚才哄笑的世家新丁们面面相觑，廊下的窦文焕更是把手里折扇捏得咔嚓作响。\n\n“谢老执事秉公圣裁！”\n\n陈长庚恭恭敬敬磕了个响头，收好三样凭证退下白石台。\n\n经过台侧时，卢耀猛地欺近半步，用只有两人能听见的阴毒嗓音从牙缝里挤出一句：“好一张利嘴的小杂种！进了外门山界，看冯保山那儿能保你几时！”\n\n陈长庚脚步微顿，抬起蜡黄的脸庞冲卢耀露出一抹谦卑怯懦的苦笑：“卢师兄教训得是，小人记下了。”\n\n说完低头跟着一名引路老杂役，顺着青石小径拐向半山腰侧后方的纳贡院大院。\n\n越往侧院走，林木越发阴翳，空气里隐隐飘来一股熟悉又刺鼻的赤铅丹炉废烟味。\n\n刚迈进纳贡院灰扑扑的西侧长廊，迎面忽然传来一阵急促沉重的脚步声。\n\n两名用湿布死死捂住口鼻的粗使老役，正抬着一副盖着破草席的竹担架匆匆往后山乱葬岗方向赶。\n\n长廊狭窄，陈长庚侧身贴墙避让。\n\n担架擦着他衣袖抬过的刹那，山风掀起了草席一角——底下露出一只肿胀僵硬、指甲盖乌黑发紫的死人手掌，手腕上还拴着一块刻有“丙字清灰”字样的焦黑木牌！\n\n“晦气！脚底下走快点，趁天黑前赶紧埋了！”前头老役瓮声瓮气地啐了一口。\n\n后头老役喘着粗气低声叹道：“这才十一月中旬，丙字废渣房今年都抬走第三个了……也不知明早冯管事堂审，又要把哪个倒霉催的新丁塞进去填坑哟！”\n\n脚步声渐行渐远，陈长庚站在阴冷穿堂风里，垂眸看了一眼自己袖口沾上的一星草席碎屑，漆黑眼底波澜不惊，迈步踏入了走廊尽头的候验寮房。"}, {"n": 24, "title": "候堂摸底", "body": "候验寮房是一排低矮潮湿的青砖大通铺，屋顶漏着阴风，空气里混着陈年汗酸与劣质草药的霉味。\n\n陈长庚迈进门槛时，通铺上已经挤了十一个等待明早过堂的补缺新丁。\n\n船上同来的矮胖新丁吴满仓缩在靠墙角落，一见陈长庚进来，忙不迭往旁边挪了半尺，拍着发潮的草席招手：“陈兄弟，快坐这儿！刚才廊道里抬出去那具死尸你瞅见没？”\n\n陈长庚把用破麻布重新捆好的两件旧衣垫在身下，顺势坐定，低声咳了一下：“擦肩撞见了，手腕上挂着丙字清灰牌。”\n\n旁边几个耳尖的新丁脸色齐刷刷白了三分。\n\n一个满脸络腮胡、有着通窍两窍修为的壮硕散修雷老五往地上狠啐了一口：“晦气！老子在渡口花了足足二十五枚灵石托关系进来，是为了学仙家本事的，谁去那死人堆里挑毒灰！”\n\n“雷大哥小声些。”吴满仓缩着脖子直咂舌，“我表舅早年在山脚挑水，听说外门各房全归纳贡院冯管事一言堂，惹毛了上官，连尸首都找不着地方埋。”\n\n“怕个卵！渡口验过调令盖了红印，难不成还能把咱生吞了？”雷老五梗着脖子冷哼。\n\n话音未落，院门外忽然响起一串清脆的算盘珠子碰撞声。\n\n“砰！”\n\n寮房木门被两名挎着水火棍的皂衣健役一把推开。\n\n一名四十上下、留着两撇鼠须的青衣书办背着手踱进屋内，腋下夹着一本厚账册，一双精明细眼慢悠悠扫过通铺上的十二名新丁。\n\n正是纳贡院掌案书办，庞文禄。\n\n“都站起来回话！”左边皂役拿水火棍重重一顿青砖地面。\n\n新丁们慌忙起身垂手，连刚才叫嚣的雷老五也收了散漫架势。\n\n庞文禄走到屋心八仙桌后坐下，慢条斯理掸了掸袖口灰尘，开口便是官面熟腔：“本吏姓庞，忝为纳贡院掌案书办。明早卯时冯管事亲自升堂点卯，今晚本吏体恤尔等初来乍到，先替你们预核一下安家资粮。”\n\n他一拍身后皂役捧着的木托盘，上头整整齐齐码着二十几包巴掌大的黄纸药散。\n\n“山门地脉燥烈，外门各房皆有火煞瘴气。”庞文禄拈起一包药散晃了晃，“这是院里特配的清瘴避毒散，一人限领两包，收工本价一块碎灵石。按规矩备齐了，明早过堂本吏自会替你们在名册上画个稳妥记号。”\n\n屋里瞬间安静下来。\n\n陈长庚垂着眼皮扫过那黄纸包边缘漏出的一星药末——三分滑石粉掺七分粗雄黄，搁在黑石坊市烂泥摊上，十文铜板能抓三大把。\n\n两包敢收一块碎灵石，这是还没进正堂，书办先拿着鸡毛当令箭来刮头道油水，顺带摸清谁兜里有钱、谁是刺头。\n\n“一块碎灵石？！”\n\n络腮胡雷老五眼珠子猛地瞪圆，粗声顶了回去：“庞书办，这雄黄味隔着三步都闻见了，凡俗药铺两分银子一包的东西，你张嘴就要五分之一枚灵石？”\n\n庞文禄脸上笑意未减，眼皮却微微往下一搭：“嫌贵？山门里的规矩，可不是黑石坊市的野摊子。”\n\n“规矩也不是这么个抢法！”雷老五仗着有点散修底子，捂紧腰囊硬梆梆道，“小的在渡口已经交清了茶水规费，身上只剩明早验资的整灵石，没碎石买药！”\n\n周围七八个新丁也跟着面露难色，纷纷退后半步捂住口袋。\n\n“好说，买卖不成仁义在嘛。”\n\n庞文禄竟一丝火气都没露，笑眯眯收回黄纸包，提笔在名册雷老五的名字旁轻轻点了一记墨点：“既是不怕火瘴的硬骨头，那就省下吧。还有谁要领药？”\n\n满屋新丁见雷老五顶回去也没挨罚，顿时心存侥幸，一个个低头装哑巴。\n\n就在气氛僵冷的当口，铺尾的陈长庚早已借着吴满仓肥胖身躯的遮挡，隔着袖袋用分水刺尖在靴帮旁一枚下品灵石纹路上悄然一磕。\n\n无声无息间，整石顺着天然节理裂作五块大小均匀的碎灵石。\n\n“启禀庞书办，小人肺弱畏瘴，求领两包救命药。”\n\n陈长庚弓着腰走出人群，装作满脸肉疼地从鞋帮破布缝里抠出一块棱角碎灵石，双手高举过顶呈到八仙桌前。\n\n庞文禄挑了挑鼠须，低头瞥见名册最末“乌卤盐场陈长庚、两窍半”那一行批注，神色稍霁：“倒是个知轻重的。拿去吧。”\n\n陈长庚收起两包劣药，见桌角那把粗陶茶壶已经凉透，顺手提起墙角泥炉上的滚水瓦罐，恭恭敬敬替庞文禄续满热茶。\n\n他又指了指桌上一叠散乱的护船与矿司竹签，低声赔笑：“小人在盐场替丹师抄过几天火耗单子，书办大人若不嫌小人手笨，小人替您把这十几支木签按渡口甲乙排好？”\n\n“哦？你还识字会算账？”庞文禄端起热茶呷了一口，有些意外。\n\n“只认得几个粗字，勉强算得清斤两。”\n\n陈长庚手脚麻利，三息工夫便将十二支竹签按正额附签与矿场补缺理得井井有条，连带每人的来历籍贯轻声报了一遍，分毫不差。\n\n庞文禄被那句“书办大人”捧得浑身舒坦，又见这盐场小子满身穷酸补丁、掏块碎灵石都得抠鞋帮子，顿时放下了戒心。\n\n“算得倒利索，只可惜命不好，顶的是丙字火缺。”庞文禄压低嗓音，像施舍般提点了一句，“看在你懂规矩的份上，教你个乖——明早进了正堂，渡口以前的事烂在肚子里，一个字不许提！”\n\n陈长庚手上一顿，惶恐低声道：“渡口许执事给小人盖过火漆回执……”\n\n“回执只管你上船，可不管你落户！”\n\n庞文禄嗤笑一声，拿茶盖刮着浮沫：“你们这批矿司脱籍文牒全过了三日火耗限期，按纳贡院老例，新人验资火耗折八成！十枚收八枚，二十枚收十六枚，谁敢在堂上哭穷翻旧账，按咆哮公堂直接乱棍打出去，一块碎石都别想带走！”\n\n陈长庚后背微僵，脸上适时露出煞白惧色：“折、折八成……那丙字废渣房，当真像外头传的那般凶险？”\n\n“丹房每日十车滚烫赤铅毒灰全往那谷底倒，地火毒烟熏三天就得咳黑血，今年抬出去那三个全是烂穿了肺管子的。”庞文禄站起身拍了拍账册，意味深长地看了他一眼，“不过去了那鬼地方也有一样好，没人跟你抢差事。好自为之吧。”\n\n说完，庞文禄背着手带人扬长而去。\n\n木门刚关上，雷老五便冲着陈长庚嗤之以鼻：“白瞎一块碎灵石买两包雄黄面！什么火耗折八成，纯属吓唬乡巴佬，明早他冯管事敢扣老子的灵石，老子去刑律堂敲登闻鼓！”\n\n陈长庚揣好药散坐回铺角，低头连一句嘴都没回。\n\n去刑律堂告冯保山？卢耀那帮刑律堂豺狼跟纳贡院本就是一丘之貉，这莽汉怕是连今晚子时都熬不过去。\n\n果不其然，刚交亥时二刻！\n\n“砰哐——！！”\n\n寮房木门被人一脚狠狠踹飞！\n\n四名如狼似虎的纳贡院皂役提着铁链冲进来，直扑雷老五的铺位，一棍子将刚睡迷糊的雷老五抽翻在地，伸手往他草席底下一掏，竟硬生生摸出一只青瓷小瓶！\n\n“好胆！尚未录籍竟敢在寮房私藏违禁散功粉，图谋不轨！”领头皂役正是傍晚跟在庞文禄身后的那名壮汉，一把铁锁咔嚓扣死雷老五琵琶骨，“按门规罚没全部资粮，革除补缺资格，押出山门！”\n\n“放屁！那瓶子不是老子的！是你们栽赃——唔！！”\n\n雷老五拼命挣扎怒吼，被皂役一团臭抹布塞死嘴巴，连人带腰里那袋灵石像拖死狗一样拖出了院门，棍棒闷响很快消失在夜风里。\n\n满屋十名新丁吓得筛糠般缩在被窝里，大气都不敢喘一口，吴满仓更是把头死死埋进膝盖，再没人敢提敲鼓告状的蠢话。\n\n陈长庚靠墙静坐，眼底古井无波。\n\n一块碎灵石，买来的不只是平安过夜，更是保住贴身家底的无价消息。\n\n冯保山吞了渡口三十枚买路钱还不算，明早竟还要拿“验资火耗折八成”硬刮明面口袋！\n\n要是今晚傻乎乎把整袋灵石全揣在明面去过堂，明早至少得被刮掉十之八九；可要是装得一文不名，冯保山捞不到油水，转头就能寻个“资粮不足不堪造册”的由头把他踢去黑水矿坑！\n\n十枚，不多不少，正好够喂饱笑面虎的嘴，又不至于露富惹疑。\n\n熬到后半夜丑末，满屋鼾声渐起。\n\n陈长庚起身捂着肚子走向后院僻静茅厕，借着断墙死角摸黑解开腹带与鞋底夹层。\n\n原本十六枚整灵石錾开一枚付了庞文禄一碎，眼下实存十五枚整石与四块碎石。\n\n他动作极快，先确认两截乌黑铁线蜈毒鳌与装有二钱半晶砂的锁灵寒玉匣均已严密封在储物袋空间内，再将五枚成色最足的整灵石与四块碎灵石分塞进双脚靴底暗槽与腹带夹层缝牢。\n\n最后，他把储物袋与半截蚀纹石臼一并贴腹捆死在玄铁护心镜与青铜隔味阵盘内侧，半丝棱角都不往外显露。\n\n明面那只洗得发白的粗麻布袋里，只端端正正留了十枚普通下品灵石。\n\n收拾停当回屋合衣假寐，快到五更天时，贴腹绑紧的蚀纹石臼隔着布帛传来一丝极细微的温热脉动——三十六个时辰已满，第十轮潮汐充能准时就绪。\n\n陈长庚按住腹间未动分毫。\n\n“铛——铛——铛！！”\n\n十一月二十日卯时正，纳贡院前院开堂铜钟骤然敲响！\n\n陈长庚睁开双目，攥着那只装有十枚灵石的粗布袋排众而出，顺着青石甬道低眉跨进正堂高槛。\n\n大堂主位太师椅上，一名面白微胖、身穿团花锦袍的中年执事正捧着一把紫砂小茶壶，笑眯眯掀开眼皮朝他打量过来。"}, {"n": 25, "title": "茶壶刮脂", "body": "纳贡院正堂高阔森严，两侧立着四名手持水火重棍的皂衣健役，堂上静得连炭盆爆火星子的轻响都清晰可闻。\n\n主位太师椅上，通窍八窍巅峰的管事执事冯保山一身深青团花锦袍。他圆团团的富态脸庞上总挂着三分和气笑意，左手托着一只油润紫砂壶，右手慢悠悠摩挲着壶嘴。\n\n前头九名新丁挨个上去验资画押，个个被刮去八成安家灵石，却因昨晚雷老五的前车之鉴，全都咬碎牙齿磕头认账，连大气都不敢多喘一声。\n\n“末席补缺，乌卤盐场陈长庚，上前验牒！”\n\n案侧掌案书办庞文禄瞥了陈长庚一眼，拉长嗓音唱名。\n\n陈长庚趋步上前，在堂心青石砖上规规矩矩跪倒，双手将郑奎批红的矿司脱籍原牒、许执事盖印的火漆回执、护船小功木签，连同那只粗麻灵石袋一并高举呈上。\n\n皂役接过托盘送上主案。\n\n冯保山没有急着看灵石，先拿起那张火漆回执与郑奎原牒端详片刻，对黑石渡口许执事早已替他收走的那三十枚买路灵石绝口不提，反倒轻轻叹了口气。\n\n“乌卤盐场来的苦命娃儿啊。”\n\n冯保山呷了一口热茶，语调慢条斯理，透着股长辈关怀晚辈的慈和温厚：“郑师兄的批文老夫看过了，能在孙丹师炸炉大火里捡回一条命，又在船上帮宋副使挡过水虫，是个老实耐苦的苗子。”\n\n“全赖宗门仙师庇佑，小人不敢居功。”陈长庚额头贴着手背，声音恭顺低微。\n\n“嗯，知本分就好。”\n\n冯保山放下紫砂壶，伸出两根保养得白胖圆润的手指，哗啦一声将粗麻袋里的灵石倒在紫檀案面上——不多不少，整整十枚普通下品灵石。\n\n庞文禄站在旁边执笔扫了一眼，眼底掠过一丝不出所料的轻蔑：果然是个抠完了棺材本才凑够十枚入门数的盐场穷鬼。\n\n冯保山指尖拨弄着灵石，笑眯眯的圆脸忽然露出一丝为难之色：“只是长庚呐，你这张矿司脱籍文牒是十一月初八签发的，按外门规章，补缺调令须在三日内入山销号。”\n\n他顿了顿，轻叹摇头：“如今已是十一月二十，足足逾限九日，这沿途积压的公牍火耗与验资折损，老夫身为纳贡院掌院，也不好替你徇私破例呀。”\n\n来了。\n\n陈长庚眼观鼻鼻观心，心里冷笑如刀。\n\n从乌卤盐场到黑石渡口隔着几百里水泽，云泽宗接引楼船十八日才开船、十九日午后才靠岸，神仙也飞不到山门三日内销号！所谓逾限火耗，不过是冯保山吃干抹净的遮羞布罢了！\n\n大堂两侧，四名执棍皂役悄然握紧棍柄往前逼了半步，庞文禄也停住笔尖冷眼俯视——只要这乡下小子敢抬头嚷一句“渡口交过三十枚灵石”，立刻便是咆哮公堂、污蔑执事的死罪！\n\n然而堂下的陈长庚连肩膀都没抖一下。\n\n不等冯保山再敲边鼓，陈长庚主动重重磕了个头，诚惶诚恐道：“小人愚钝，不知山门法度，累得冯管事替小人作难！一切全凭冯管事按宗门老例裁处，小人绝无怨言！”\n\n冯保山眉毛微挑，眼里闪过一抹满意。\n\n他大袖轻轻一拂，案上十枚完好下品灵石瞬间尽数滑入袖底暗袋；紧接着，他又像施恩般从案角笔洗旁摸出两枚边角崩裂、灵气流失近半的残次下品灵石，随手丢回粗麻布袋里。\n\n“按院里老例，补录验资火耗折八成。”\n\n冯保山端起紫砂茶壶，转头吩咐庞文禄：“账上记清：乌卤盐场陈长庚，验讫入册，家底贫薄，本院体恤其护船微劳，特发还安家残石二枚。”\n\n“是，大人仁厚！”庞文禄挥毫落墨，账册上干干净净，一字未提被卷进袖笼的那十枚完好灵石。\n\n紧接着，冯保山俯下身子，满脸春风和煦地看着堂下陈长庚，压低慢腔卖起了天大的人情：“长庚啊，你测窍只有两窍半，肺里又淤着火毒，照刑律堂卢耀昨日递来的条子，本该把你直接编进西山黑水矿坑背寒铁矿的。”\n\n陈长庚适时抬头，脸上满是后怕与感激：“多谢冯管事救命大恩！”\n\n“哎，老夫见不得老实孩子去矿坑折寿嘛。”\n\n冯保山捋着颌下短须，占尽便宜还要把恩人牌坊立得高高的：“老夫昨晚顶着刑律堂的闲话，硬替你保下了后山‘丙字废渣房’的清闲差事！”\n\n他笑眯眯地呷了口茶：“那地方独门独院，不用风吹日晒跟人争抢，每日只需把丹房退下来的炉灰筛拣归拢。往后你在外门发迹了，可得记着老夫今日拉你这一把的情分呐！”\n\n旁边一名年轻皂役差点没憋住笑，赶紧低头抿嘴——把今年连抬出三具紫黑毒尸的绝户坑说成清静福地，也就自家这位冯管事张得开这张嘴！\n\n陈长庚心里把渡口三十枚加堂上硬扣八枚、连余下两枚好石都被掉包成残石的血账一笔刻死，面上却激动得眼眶微红，连磕三个响头。\n\n“冯管事再生大德，小人就算肝脑涂地也报答不尽！”\n\n磕完头，陈长庚没有立刻退下，而是捧着那只装着两枚残石的空瘪布袋，顺着冯保山的话头小心翼翼仰脸道：“只是小人刚听管事大人训示，丙字废渣房乃清运宗门丹房官灰的要紧去处。”\n\n冯保山端着茶壶的手微顿，眯眼挑眉：“哦？你还有何顾虑？”\n\n陈长庚把腰弯得更低，诚惶诚恐道：“小人修为浅薄、人微言轻，深恐平日里有外院闲杂师兄误闯院落，万一冲散了毒烟瘴气、弄乱丹房官灰斤两，小人百死莫赎……斗胆求冯管事赏一纸‘丙字房独管清运、闲杂同门不得擅入’的禁牌，好叫小人关起门来安心替大人办差！”\n\n堂上静了一瞬。\n\n庞文禄愣了愣，狐疑地打量了陈长庚两眼。\n\n冯保山眯着细眼转念一算：丙字废渣房那鬼地方毒烟熏天，原本就没哪个外门弟子愿意沾边。\n\n他反倒怕卢耀那帮刑律堂恶犬三天两头闯进去找茬，万一把这新来的替死鬼直接打残了，到时候丹房没人接毒灰，石百川还得来纳贡院拍桌子要人！\n\n给块独管禁牌把这傻小子自己锁死在毒灰院里干活，岂不是省心至极？\n\n“哈哈哈，想不到你年纪不大，当差倒是极有章法！”\n\n冯保山抚掌一笑，随手从签筒里抽出一块尺许长的生铁木芯腰牌，拿起纳贡院朱砂官印重重一盖，当堂掷在陈长庚面前。\n\n“准了！持此‘丙字独管’印牌挂于院门，除丹房送灰与本院核查外，外门闲杂弟子擅闯滋事者，一律按扰乱丹务论处！去吧，辰时丹房头炉灰就该下山了，莫误了时辰！”\n\n“谢冯管事恩典！”\n\n陈长庚双手捧起那块沉甸甸的生铁独管印牌连同两枚残次灵石揣进怀里，千恩万谢地倒退着跨出了纳贡院正堂门槛。\n\n门外山风一吹，他脸上那副感恩戴德的惶恐笑意瞬间敛得一干二净，漆黑瞳仁深处只剩一片冷铁般的幽寂。\n\n三十八枚完好灵石，买一座带地火支脉、连外门巡山弟子都不准擅闯的合法私宅。\n\n这笔买卖，且让冯管事先把灵石揣在袖子里捂热乎了，来日连本带利一并连皮扒回来！\n\n问过引路老役方向，陈长庚紧了紧背上那件破麻衣包袱，顺着纳贡院西侧一条荒草丛生的陡峭青石阶，快步朝后山废渣谷方向走去。\n\n石阶两侧怪石嶙峋，越往下走，空气里那股熟悉的硫铅炉灰焦臭味便越发浓烈。\n\n刚拐过半山腰一道背阴的石壁死角，前方十丈宽的石阶路心忽然黑压压横出五道人影，将下山去路堵得水泄不通！\n\n领头一人身穿玄色镶红边刑律堂劲装，鹰钩鼻、三角眼，周身通窍五窍巅峰的阴冷气劲毫不掩饰地压迫过来，正是昨日在测窍台吃瘪的卢耀！\n\n而在卢耀左后方，眼角带疤的卢成左手死死缠着渗血白布，缺了一截尾指的断掌正怨毒发狂地指着陈长庚：“表哥！就是这小杂种！快卸了他的狗腿！”"}, {"n": 26, "title": "废谷立户", "body": "山道狭窄，左边是湿滑陡峭的峭壁，右边是深不见底的荆棘乱石沟。\n\n三名膀大腰圆、穿西山矿队皮甲的通窍三窍壮汉呈扇形散开，拎着包铁镐把嘿嘿冷笑，将前路封得死死的。\n\n陈长庚脚步一收，停在五步之外，双手拢在破麻袖筒里，顺势躬下脊背：“卢耀师兄，卢成师兄，小人赶着去废渣谷当差，不知何处得罪了二位师兄？”\n\n“得罪？你在船上害老子断了一根尾指，还敢装傻充愣？！”\n\n卢成疼得眼眶通红，恨不得生撕了眼前这张蜡黄瘦脸，拔出半截短刀就要往前扑，却被卢耀抬手拦住。\n\n卢耀负手立在高处两级石阶上，居高临下审视着陈长庚，嘴角挂着猫戏老鼠般的冷诮：“陈长庚是吧？昨日在测窍台拿冯保山的鸡毛令箭压秦执事，嘴皮子倒挺利索。怎么，今早过了纳贡院的堂，冯老狐狸给你留了几个子儿买棺材板啊？”\n\n陈长庚低头苦笑，脸上满是底层杂役的惶恐畏缩：“回卢师兄，小人穷酸，验完火耗只领得两枚残损灵石安家，正要去丙字废渣房上工……”\n\n“丙字废渣房归后山谷道，这半山石阶乃我刑律堂巡山必经之路！”\n\n卢耀脸色猛地一沉，通窍五窍巅峰的强横灵压如山岳般骤然朝陈长庚肩头碾压而下，厉声喝道：“外门贱役迎面撞见巡山师兄，不跪伏路侧避让，反敢昂首冲撞仪仗！按巡山律当场打断一条腿也没人能挑理！”\n\n三名矿队壮汉齐齐踏前一步，铁镐重重顿在石板上震起一片碎石屑！\n\n卢成更是狞笑着伸出右手：“少废话！要么把怀里那两枚安家灵石乖乖掏出来赔罪，再咬破指头立下血契，往后每月把丙字房筛出来的废铜例钱孝敬我兄弟三成！要么，爷几个现在就把你手脚敲碎扔下乱石沟，报个失足坠崖！”\n\n好一个敲骨吸髓的无赖算盘。\n\n要是真掏出那两枚残石立了血契，卢家兄弟立刻就会摸透他是个任人揉捏的软柿子，不出三天就得踹门进来搜刮他贴身暗藏的底牌。\n\n可要是在这儿拔出分水刺动用百锻铁骨硬拼，就算能当场格杀五人，山道尽头便是纳贡院与报时钟亭，十息之内就会惊动高阶执事，彻底暴露五窍巅峰的真实底细！\n\n就在卢耀灵压压落的同时，陈长庚通窍五窍巅峰的敏锐双耳微微一动——\n\n上方不到十五丈外的山道拐角报时钟亭后，正有一阵沉重刺耳的“轱辘、轱辘”生铁车轮碾石声由远及近，滚烫刺鼻的赤铅硫烟味更是顺着山风扑面灌了下来！\n\n丹房卸头炉毒灰的车队下来了！\n\n电光石火间，陈长庚非但没有运劲抵抗卢耀的气机，反而顺着那股五窍灵压双腿一软，脸色煞白地哎哟惊呼一声，踉踉跄跄连退了整整六大步！\n\n“噗通！”\n\n他这六步退得妙到毫巅，后背刚好撞出背阴石壁的视线死角，结结实实摔倒在上方报时钟亭十丈之内的开阔平台边缘！\n\n“装死也没用！给老子搜他的怀——”\n\n卢成浑然不觉有异，带着两名矿队壮汉凶神恶煞冲出石壁拐角就要按人！\n\n恰在此时，两辆由四名火工杂役吃力拽拉、车斗里冒着滚滚黄黑毒烟的千斤生铁灰车轰隆隆转出钟亭！\n\n车队最前头，一名满脸焦黑火斑、身材魁梧如铁塔的赤袍中年汉子正拿着铁烟袋边走边骂，周身赫然散发着通窍七窍的暴烈火煞气机——正是外门丹房掌管炉渣清运的实权副管事，石百川！\n\n没等卢成反应过来，摔在地上的陈长庚突然高高举起怀里那块刚领的“丙字独管”生铁印牌，冲着钟亭方向连滚带爬磕头高喊：\n\n“启禀丹房管事大人救命！小人乃纳贡院冯管事今早刚派去丙字废渣房顶缺的杂役陈长庚，赶着下谷开院门接今日头炉赤铅官灰！”\n\n他喘着粗气往旁一缩，指向逼近的卢成等人：“刑律堂卢师兄嫌小人冲撞山道，要扣小人在此训话立规矩！万一耽误了大人卸头炉滚灰的时辰烧穿铁车底板，这损毁官器的火耗该算刑律堂头上，还是算小人头上啊？！”\n\n这一嗓子字字清晰，如惊雷般炸响在半山腰！\n\n卢耀刚追出石壁拐角，一眼撞见十丈外黑着脸停步的石百川，脸色唰地大变，急忙喝止卢成：“住手！快退回来！”\n\n晚了！\n\n石百川这几日正因为丙字房前任杂役毒倒毙命、没人开火坑接灰憋了一肚子邪火。丹房头炉退出来的赤铅毒灰滚烫蚀铁，在生铁车斗里多焖两刻钟就能把车底烧出大窟窿，修一辆铁车得扣他石百川两枚灵石俸禄！\n\n此刻一见卢耀兄弟带着矿队堵死下谷山道，还要拿捏新来的倒灰替死鬼，石百川鼻子都气歪了，大步流星冲下石阶，手中尺长精铁烟袋锅指着卢耀的鼻子破口大骂：\n\n“卢耀你个小兔崽子长本事了啊！连老子丹房卸头炉毒灰的路都敢堵？！”\n\n面对通窍七窍的丹房实权副管事，卢耀气势瞬间矮了半截，头皮发麻地抱拳陪笑：“石副管事息怒！弟子不知这是去接丹房官灰的新丁，只是偶遇训诫两句……”\n\n“训你娘的狗臭屁！”\n\n石百川一丝面子不留，一口浓痰吐在卢成脚尖前，暴躁怒喝：“丙字房一连三天没人开门接灰，头炉赤铅灰都快把老子的铁车烧穿了！”\n\n他拿铁烟袋锅重重一指山沟：“你们叔侄在黑水矿坑刮地皮老子懒得管，谁敢拦着新杂役误了老子倒灰时辰，老子现在就叫人把这两车滚烫毒灰直接倒进你们刑律堂巡山房里！滚蛋！”\n\n四名拉灰车的火工杂役跟着把铁链一松，两车冒着刺鼻黄烟的滚烫毒灰嘎吱往前一溜，热浪烫得那三名矿队壮汉怪叫着连滚带爬往石沟边躲闪。\n\n卢耀被当众骂得青筋暴跳，双手死死攥紧拳头，却深知石百川在丹房根深蒂固，真烧坏了官车闹到内门丹堂去，他一个小小五窍巡山弟子吃不了兜着走！\n\n“是！弟子这就让路！”\n\n卢耀从牙缝里挤出几个字，阴鸷如毒蛇的目光狠狠剐了地上爬起来的陈长庚一眼，一把拽住还不甘心的卢成，灰溜溜贴着峭壁退向山道上方。\n\n“你还杵着等老子请你喝茶？！”石百川没好气地瞪向陈长庚，“拿着牌子还不滚前头带路开铁门！摔死在沟里也没人替你收尸！”\n\n“是是！小人这就前头引路，谢管事大人体恤！”\n\n陈长庚一文钱没花，拍拍膝盖泥灰，摸了摸怀里完好无损的两枚残石，低眉顺眼小跑在两辆生铁灰车前头直奔谷底。\n\n穿过一道终年弥漫着淡黄硫烟的狭窄山拗，眼前豁然出现一座背靠赤黑峭壁、方圆十余丈的独立青石院落。\n\n两扇厚达三寸的斑驳生铁大门紧闭，门楣上刻着“丙字废渣房”五个焦黑大字，四周荒草寸生，半里之内连半间邻舍都没有。\n\n陈长庚上前验开官锁，将冯保山赐下的那块“丙字独管、闲杂禁入”铁木印牌稳稳挂在大门正中铜钩上，用力推开沉重铁门。\n\n四名火工杂役用湿布蒙着脸，推车冲进后院，连跑五趟将整整十车滚烫发黑的丹炉废灰哗啦啦倾倒在石棚长槽里。\n\n石百川站在院门口捂着鼻子，远远丢过来一本发黄铁皮交接册，冷漠道：“听好了！每日辰时十车丹房退灰，你自己筛完废铜铁渣，剩下的毒灰推进后院地火坑烧化！”\n\n他厌恶地挥了挥烟袋杆：“每月底交足五十斤废紫铜屑，少一斤剥你的皮！真要咳血快断气了，提前拉响门外那口报丧钟，免得烂在屋里臭了老子的灰车！”\n\n说完，石百川像躲瘟神似的，看都不多看陈长庚一眼，领着杂役推起空车匆匆离谷。\n\n“哐当——咔嚓！”\n\n待车轮声彻底消失在谷口，陈长庚反手合拢两扇千斤生铁大门，落下碗口粗的横门铁闩。\n\n浓烟刺鼻的荒僻石院里，终于只剩下他孤身一人。\n\n陈长庚先走到后院石棚，屏息掀开排灰长槽尽头的那道生铁栅栏往下望去。\n\n只见三丈深的幽暗坑底直通山腹地下火煞支脉，暗红地火热浪裹着硫磺浊气滚滚翻涌，连蚀纹石臼贴在腹间都发出了欢快渴求的嗡鸣！\n\n“独门铁院，禁牌护门，脚底下就是现成的地火支脉，每日还有十车免费送上门的废丹炉灰……”\n\n陈长庚漆黑眼底终于浮起一抹真切笑意。\n\n别人闻风丧胆的短命绝户坑，对他和蚀纹石臼而言，简直是云泽宗上下打着灯笼都找不到的无上洞天福地！\n\n压下立刻开阵提纯的冲动，陈长庚转身走进前院唯一那间低矮阴暗的青石卧房，准备先把住处底细摸清。\n\n屋里积着厚厚一层铅灰，角落摆着一张简陋石榻，上头铺着一卷早已发黑发臭的破草席——正是昨天廊道里抬出去那具紫黑死尸睡过的地方。\n\n陈长庚拿铁钳挑起破草席往外一掀。\n\n“叮当。”\n\n半截拇指长、沾满发黑干涸血迹的残破白骨哨子忽然从垫床木板暗缝里滚落在地！\n\n陈长庚瞳孔微缩，快步蹲下身，拔出袖中分水刺挑开那块松动的靠墙床板。\n\n粗糙木板背面赫然有十道深可见骨的抓痕，前任杂役在毒发临死前用崩裂的血指甲歪歪扭扭抠出了七个触目惊心的血字：\n\n“夜半莫开西灰口……”"}, {"n": 27, "title": "铁闸夹鼠", "body": "陈长庚蹲在石榻前，指尖捏起那半截染着黑血的白骨哨子凑近鼻端一嗅。\n\n除了一股陈年尸臭，哨口内壁还残留着一丝极淡的甜腻酒酸气。\n\n“不是被丹房毒灰慢慢熏死的。”\n\n陈长庚眸光微冷，将白骨哨揣进怀里，不动声色把松动的床板按回原位，重新铺平那张破草席。\n\n前任杂役手腕上挂着丙字房木牌，死前指甲抠穿木板写下“夜半莫开西灰口”，分明是三更半夜有人从西墙暗口递东西进来，一招要了他的命！\n\n他拿起丹房副管事石百川临走丢下的那本发黄铁皮交接册，快步走出卧房，来到后院敞棚的排灰长槽前。\n\n铁皮册第一页写得明明白白：每日辰时丹房退灰十车，内含八车寻常赤铅炉渣，外加两车紫火官炉退下的头等“紫火炉底灰”。\n\n陈长庚挽起麻布袖口，抄起长柄生铁火铲，挨个往十堆尚带余温的黑灰堆里深铲下去。\n\n一铲，两铲，五铲。\n\n他在乌卤盐场熬了三年毒卤，又给孙奉先看过半个月丹炉地火，闭着眼都能分辨炉灰成色。\n\n铲到第九堆与第十堆时，陈长庚手上动作蓦地一顿。\n\n不对。\n\n真正的紫火官炉底灰历经地火百炼，灰质细腻泛着暗紫油光，里头蕴含的火煞硫毒最为霸道。\n\n可眼前这两堆灰虽然表层撒了一层薄薄的紫红药末遮眼，底下铲出来的却是发潮结块的灰白冷泥渣！\n\n“十车官灰，最肥的两车紫火炉底灰被人半道截胡调了包，拿泡水的陈泥渣凑斤两。”\n\n陈长庚放下铁铲，前院生铁大门外忽然响起两声木梆轻敲：“丙字房新来的在不在？外院送清水的！”\n\n陈长庚走过去拉开铁门上的一掌宽瞭望小窗。\n\n门外站着个挑着两桶山泉水、左腿微跛的灰衣老杂役，正拿汗巾擦着满脸褶子。\n\n“劳烦老哥跑一趟。”陈长庚隔着门缝接过水桶倒进院内水缸，顺手摸出一块棱角分明的碎灵石塞出小窗，压低声音赔笑道，“小弟陈长庚，今早刚入谷，身上没俗世铜板买盐巴草纸。”\n\n跛腿老马头接过碎灵石对着日头一照，浑浊老眼顿时笑成了月牙：“陈小哥要兑散银？”\n\n“正是。”陈长庚低声道，“外头一块碎灵石兑百两纹银，老哥留五两跑腿吃酒，给小弟捎九十五两碎银回来就成。”\n\n“陈小哥爽快！比前头那个姓赵的闷葫芦敞亮多了！”老马头喜滋滋揣好碎灵石。\n\n陈长庚递出空桶，顺口探问：“前任赵老哥是个什么章程？小弟初来乍到，怕犯了院里忌讳。”\n\n“嗨，老赵上个月不知发了什么横财，隔三差五托老汉捎烧刀子解馋。”老马头压低嗓门啧了一声，“结果前几日一连三天敲窗都没人应，昨儿抬出来，脸都紫透喽！等着，申时前准把银子给你送来！”\n\n送走挑着空桶一瘸一拐下山的老马头，陈长庚转
