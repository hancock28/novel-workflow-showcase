霍师兄手底下那个叫谭铸的凶神，提着大铁锤死死钉在东角地桩三尺内，眼珠子一眨不眨盯着小人的手！”\n\n陈长庚哭丧着脸压低嗓门：“小人脚底稍微滑了一颗碎石子，他举锤就要砸碎小人的脑袋！霍师兄更是一炷香巡视一回，这钉子要是硬塞，不等扎进土里就得当场人赃并获，反倒坏了公子的大计啊！”\n\n曹无极一把夺回淬血透骨钉，凑到鼻端仔细验看。\n\n钉尖乌紫毒芒完好，钉尾那圈血炼封蜡除了边缘被手汗蹭毛了一丝不起眼的皮儿，整枚毒钉压根没动过！\n\n“没用的软骨头！”\n\n曹无极暗骂一声，倒也没起疑——霍千山向来多疑霸道，派八窍心腹死守阵桩再正常不过。\n\n“算你识相没把本公子卖了！滚回去挑你的箱子，待会儿进了内窟少不了你出力的时候！”曹无极冷哼一声，将毒钉收回怀中转身回帐。\n\n陈长庚千恩万谢退回岩凹，低垂的嘴角微不可察地勾了一下。\n\n曹无极自己把钉子揣热乎了，却压根没瞧见十丈外器堂中军大帐后头的一幕——\n\n就在两刻钟前，巡桩的谭铸一脚踢开引阵铜丝旁那块灰白碎石，鼻端冷不防嗅到一丝腥臭刺鼻的烤骨髓朱砂味！\n\n此刻，国字脸铁青的霍千山正背对众人在石椅后捏着那块碎石，指腹重重碾过石底那一星暗红发粘的蜡痕！\n\n“霍师兄，小弟在器堂跟曹家打了五年交道，绝不会认错！”\n\n谭铸压着嗓子，凶光毕露：“这就是曹无极炼制血煞阴器专用的血炼封蜡！定是曹家探子趁乱摸到崖边想往护阵地桩下毒钉，被滚落的石子惊走了！”\n\n“喀嚓！”\n\n霍千山五指纯阳赤炎劲一吐，掌心盐石当场化作齑粉！\n\n“好一个同门师弟！明面上结盟抗敌，背地里竟想在戌初前废某家的纯阳气脉！”\n\n“师兄，要不要小弟现在带人去掀了曹家的摊子？！”\n\n“蠢货！对岸褚横山和樊九皋正等着咱们内讧！”\n\n霍千山眼底闪过毒蛇般的杀机，从怀里摸出三颗刻满赤炎阵纹的暗红铁丸递给谭铸：“不动声色把东角主阵眼往内移半丈！再把这三颗赤火地雷，顺着曹无极待会儿冲向莲台的侧翼石缝埋进去——他想阴某家，戌初开抢，某家先炸断他两条狗腿！”\n\n谭铸狞笑领命，借着加固石垒悄悄埋雷去了。\n\n地底闷热毒雾越积越厚，时刻转眼熬过午时，滑入未末申初！\n\n距离戌初莲熟只剩不到两个时辰，两岸六十多双眼睛熬得通红，呼吸声粗重得像拉风箱。\n\n就在这死寂紧绷到极点的一刻——\n\n“哈哈哈哈！干坐着闻花香有什么劲儿？樊某给诸位添道热菜醒醒神！”\n\n北岸高坡上，一直阴沉不语的血河宗樊九皋忽然仰天狂笑！\n\n霍千山猛地抬头握紧重剑：“樊老鬼要耍什么花样？！”\n\n话音未落，樊九皋大手一挥，身后血袍门徒竟从岩后拖出三名五花大绑、塞着破布的云泽宗外门采药弟子——正是昨日在北麓外围失陷的活口！\n\n“嗤啦！”\n\n樊九皋反手三刀划破三人胸膛动脉，鲜血狂喷而出，他狞笑着双手一提，将三名挣扎惨嚎的活人齐齐抛向滚沸翻涌的黑卤护城沟中央！\n\n“噗通！噗通！噗通！”\n\n滚烫活人精血泼进墨绿毒卤，整条黑卤护城沟骤然剧烈沸腾起来！\n\n“咕嘟——轰隆隆！”\n\n沟心黑水冲天炸开三丈高的腥臭水柱，三名落水弟子连半声惨叫都没喊完便被拽入水底撕碎；紧接着，两颗磨盘大小、披满墨绿腐蚀骨甲、竖瞳泛着惨黄凶光的狰狞扁平巨首，顶着三十余丈长的庞大铁鳞身躯，自沸腾黑渊底下咆哮破水暴起！\n\n通窍九窍巅峰异兽——双首卤甲蛟蜥！"}, {"n": 73, "title": "驱蛟乱阵", "body": "“吼——嘶嘶嘶！！！”\n\n三十余丈长的双首卤甲蛟蜥半截巨躯人立而起，两张血盆大口里还挂着半截碎衣烂肉，两条水桶粗的铁鳞长尾狠狠一拍沟心黑水！\n\n“哗啦啦——！！”\n\n一道足有两丈高、混杂着剧毒腐蚀卤浆的墨绿酸浪，如同崩塌的城墙般劈头盖脸朝南岸云泽宗防线狂拍过来！\n\n北岸高坡地势比南岸高出两丈有余，樊九皋抛俘炸窝之后，早已带着褚横山的人马好整以暇退上了高坡石垒，摆明了是要驱这头九窍巅峰的护潭凶兽先啃烂霍千山的主力！\n\n“樊老鬼无耻！！器堂举盾结纯阳火墙，东、西两翼死顶住，谁敢后退半步某家劈了他！！”\n\n霍千山目眦欲裂，周身通窍九窍巅峰的纯阳赤炎劲轰然暴涨，双手抡起门板宽的无锋重剑迎空横斩！\n\n“轰——嗤嗤嗤！！！”\n\n炽烈赤红剑罡硬生生将正面拍来的大半酸浪劈开一道豁口，滚烫毒卤与纯阳烈火相撞，刹那间炸开遮天蔽日的惨绿腐蚀毒雾！\n\n两名站在最前排的器堂七窍弟子躲闪不及，手里精钢大盾刚沾上几瓢墨绿酸浆，顷刻“滋滋”冒起刺鼻黄烟，铜汁铁水滴落脚背，烫得两人杀猪般惨叫跌退！\n\n而西翼这边，双首卤甲蛟蜥左侧那颗独角扁头猛地一拧，鼓起磨盘大的毒囊，一口腥臭扑鼻的黑绿强酸毒雾如狂风般直喷梁世勋立足的岩凹外沿！\n\n“少主小心酸毒！！”钱老头魂飞魄散地尖叫。\n\n“顶上去！给本公子顶住——”\n\n嘴上喊着顶住的梁世勋，脚底板却比兔子溜得还快！\n\n眼看那团能把精铁蚀成渣滓的黑绿酸雾离面门已不足两丈，梁世勋脸色惨白地往斜后方急撤半步，眼角余光冷不防瞥见三步外正蹲在铁木炭箱旁护绳子的灰衣陈长庚！\n\n一抹狠毒自私的戾色瞬间掠过梁世勋眼底！\n\n一个刚入七窍的熬盐苦力，死了也不用赔灵石，正好拿这身贱肉替本公子挡一挡酸雾！\n\n梁世勋半句招呼不打，撤步的同时右手五指曲成鹰爪，带着通窍九窍的凌厉擒拿劲风，一把抓向陈长庚的后脖领子，就想将他整个人提起来迎着兽口甩出去！\n\n快！毒！不留半点活路！\n\n可梁世勋做梦也想不到，从蛟蜥破水那一息起，陈长庚就留着三分眼角盯死这位专拿手下填坑的世家大少爷了！\n\n“想拿爷当擦脚布？叫你连裤衩一块赔进去！”\n\n就在梁世勋指尖恶风堪堪擦上灰麻旧袄后领的前半刹，陈长庚非但没有运劲硬抗暴露九窍横练底细，反而借着前方霍千山重剑劈浪荡开的狂暴气劲，脚下一软，“哎哟”一声顺势朝左侧翻开的试阵炭箱后头狼狈滚倒！\n\n梁世勋十拿九稳的一爪当场抓了个空，只扯断了半根捆箱草绳！\n\n与此同时，翻滚入箱后的陈长庚左手一拍箱内废炭——底下那尊足有三百斤重、严严实实裹着三层加料乌卤黑泥的青铜机括盾偶稳如泰山立成矮墙，将飞溅过来的零星酸沫挡得滴水不漏，黑泥硬壳只滋滋冒了几缕白烟，半点内层纹路都没露出来！\n\n而陈长庚缩回的右手食指与中指轻轻一捻一弹！\n\n一撮比烟尘还细、早已从寒铁虫瓮底刮攒出来的“二蜕嗜铁煞甲虫蜕壳腥粉”，顺着混乱气浪倒卷而上，不偏不倚全数糊在了梁世勋腰间那枚灵光温润的祖传暖阳温玉佩上！\n\n“小杂种滑得像泥鳅——”\n\n梁世勋一抓落空，正要骂娘再退。\n\n前方两丈外，那头被满场惨绿毒雾迷花了竖瞳的双首卤甲蛟蜥，四只铜铃大的鼻孔猛然剧烈抽动起来！\n\n在沉渊古盐墟地底黑潭里，卤甲蛟蜥平时最馋的血食，就是钻铁脉的成精煞甲虫！\n\n原本二蜕虫蜕腥粉无色无形，可一旦粘上梁世勋腰间那枚持续散发热力的暖阳温玉佩，奇异霸道的母虫腥香瞬间放大了十倍不止，在酸雾里简直像黑夜里点了一盏滚油明灯！\n\n“吼吼吼——！！！！”\n\n双首卤甲蛟蜥四只惨黄竖瞳瞬间充血赤红，竟连正面劈剑的霍千山都不顾了，庞大蛇躯在岸边乱石上一盘一弹，两颗狰狞巨首一左一右撕开漫天酸雾，疯了似地直扑梁世勋腰腹与天灵盖！\n\n“妈呀！！它怎么冲我来了？！”\n\n梁世勋吓得肝胆俱裂，手里的铁骨折扇仓促横架，周身九窍护体罡气催发到了极致！\n\n“咔嚓——噗嗤！！！”\n\n九窍巅峰凶兽暴走的一口咬合力何等恐怖！\n\n左侧蛟首一口便将铁骨折扇咬成漫天废铁片，锋利如铡刀的上下毒牙狠狠磕穿罡气，擦着梁世勋右肋撕下了大半片价值不菲的内门玄铁灵甲，带起一蓬刺目血雨！\n\n右侧那颗独角蛟首更是腥风扑面，獠牙距离梁世勋头盖骨已不足半尺！\n\n“不——！！！”\n\n生死一发间，痛得面无人色的梁世勋再也顾不得心疼家底，左手疯了一样探进内襟，一把捏碎了贴身悬挂的一枚青碧色古篆玉符！\n\n“嗡——轰隆！！！”\n\n正是梁氏族老赐下保命的一次性二阶重宝“青罡替劫玉符”！\n\n一团凝实如钟的青色罡风轰然炸开，硬生生将右侧蛟首崩得昂头倒仰三尺，梁世勋整个人借着反震之力口喷鲜血倒飞出三丈远，重重砸进碎石堆里，半边肋骨血肉模糊，腰间那枚沾满腥粉的温玉佩也摔得粉碎！\n\n“少主！！定是您腰上那块暖阳温玉灵气太盛，招了这孽畜的眼啊！”钱老头连滚带爬扑过去拖人，连半点怀疑都没落到三丈外抱头趴在炭箱后的陈长庚身上。\n\n梁世勋捂着血淋淋的右肋，看着化作飞灰的保命玉符，心头滴血得差点背过气去！\n\n人还没进内窟，追猎小队没了，半身灵甲废了，连压箱底的保命玉符都搭进去了！\n\n而岸边那头被青罡玉符崩碎了两颗毒牙的双首卤甲蛟蜥痛极狂吼，忌惮霍千山紧随其后斩来的纯阳重剑，庞大的三十丈身躯猛地往黑卤护城沟里一缩，两条铁鳞巨尾在沟底发狂横扫乱砸！\n\n“轰咔——隆隆隆！！！！”\n\n沟心水底不知沉积了多少年的多孔老卤暗坝，竟被这头九窍巅峰凶兽发疯的两尾硬生生抽塌了一大片！\n\n刹那间，整条黑卤护城沟中央裂开一口直径两丈的恐怖地下漏斗漩涡！\n\n“哗啦啦啦——！！！”\n\n原本深不见底、滚沸翻涌的墨绿毒卤，连同被漩涡扯住半截尾巴、拼命挣扎嘶吼的双首卤甲蛟蜥一道，如百川归海般顺着沟底大窟窿疯狂往下层地渊倒灌泄空！\n\n不过短短十来个呼吸，四五丈宽的护城沟水位暴跌两丈有余，露出了满是黑泥腐骨的干涸沟床！\n\n两岸正要催招的精锐全都看傻了眼。\n\n岩凹边缘，刚刚站起身的苏清晏清冷双眸骤然一凝！\n\n顺着她倏然抬起的素白指尖望去——\n\n只见中央那根十丈高的漏斗莲台石柱最底部、原本常年淹没在数丈剧毒黑卤之下的泥浆岩根处，随着黑水退尽，赫然显露出一座高约丈二、爬满斑驳铜绿、刻满繁复锁龙古篆的青铜古窟石拱门！\n\n一股比上方柱顶浓郁十倍的古老灵脉波动与醇厚莲香，正顺着青铜石拱门缝丝丝缕缕往外渗出！\n\n“上方柱顶磁障只是排泄地煞的天窗！”\n\n苏清晏清越冷冽的声音瞬间刺破满场水响，“莲根底下那座青铜石拱，才是通往古墟内窟的真正大门！”\n\n“什么？！”\n\n北岸高坡上的玄煞门褚横山虎躯猛震，居高临下一眼看穿青铜石拱后头隐约相连的地脉主气，当场狂吼出声：\n\n“真莲台和古墟核心主脉全在内窟拱门后头！！玄煞门的儿郎听令，趁黑卤泄空，给老子冲下沟底抢占石拱门！！”\n\n“休想！！器堂随某杀下去，绝不能叫玄煞门占住内窟隘口！！”\n\n南岸霍千山双目瞬间赤红如血，曹无极更是连拍身上灰土的工夫都省了，抓起血煞兵刃嘶吼狂奔！\n\n原本还要熬到戌初的僵局顷刻粉碎，南北两岸百余名红了眼的亡命精锐，如同五群嗅见血腥的饿狼，踩着尚未流干的滚烫毒泥，疯了一般从四面八方朝沟底那扇青铜石拱隘口合围猛扑下去！"}, {"n": 74, "title": "隘口卡位", "body": "干涸见底的黑卤沟床泥浆滚烫，百余道红了眼的身影踩着腐骨烂泥直扑莲柱根底！\n\n那座重见天日的青铜石拱门高逾丈二，门框浇筑着斑驳乌青古铜，门洞内并未砌死砖石，只悬着一层水波般荡漾的幽蓝磁幕。\n\n醇厚诱人的莲香混着雄浑灵脉气机，正一缕缕从磁幕后头往外钻。\n\n“头功归老子了！！”\n\n冲在最前头的两名玄煞门通窍八窍悍匪狞笑跃起，双手厚背砍山刀灌足阴煞真气，对着幽蓝磁幕狠狠劈落！\n\n陈长庚挑着两只铁木炭箱缩在云泽宗队列末尾，瞧见这一刀，脚步当场往后慢了半拍。\n\n古盐墟的地磁大禁要是能拿蛮力劈开，苏氏先祖八十年前还用得着坐化在里头？\n\n“铛——嗡隆隆！！！”\n\n两柄百炼砍山刀刚挨上幽蓝磁幕，甚至没能压出半寸凹痕！\n\n磁幕表面万千锁龙古篆骤然炸开刺目蓝白电弧，一股比劈刀凶猛三倍的逆乱磁暴顺着刀脊倒灌而回！\n\n“咔嚓！噗——！！”\n\n两柄精钢大刀当场寸寸崩断！\n\n那两名八窍悍匪连惨叫都来不及喊出半声，双臂经脉尽碎，七窍喷血倒飞出三丈开外，一头栽进滚烫黑泥里抽搐了两下便没了动静！\n\n全场狂奔的脚步声齐刷刷刹停在泥滩十步之外！\n\n玄煞门主将褚横山瞳孔一缩，上前一步挥动乌铁重戟隔空试探着一挑。\n\n“噼啪！”\n\n一串碗口粗的蓝电顺着戟尖炸开，震得这位通窍九窍巅峰的魔道凶人虎口发麻，蹬蹬连退两步才卸去反震煞劲！\n\n“娘的，是上古地磁锁龙禁！谁硬劈谁挨反震！”褚横山甩了甩发麻的右手，脸色阴沉得能滴出水来。\n\n云泽宗阵中，器堂副手谭铸猫腰凑到霍千山身侧，压低嗓门飞快禀道：“师兄，方才下沟前，小弟已将崖口埋的那三颗赤火地雷悄悄起回来了！”\n\n霍千山眼皮都没抬，冷声传音：“收在袖里，等进了这道门，照旧往曹贼抢莲的斜坡石缝里塞！”\n\n谭铸会意退后半步。\n\n此时南北五方人马隔着十丈烂泥呈半月形围死石拱门，百余双贪婪暴戾的眼珠子转了一圈，齐刷刷钉在了云泽宗队列侧翼那道素白身影上！\n\n全场懂堪舆破阵之术的，唯独天阵宗客卿苏清晏一人！\n\n“苏大客卿！”\n\n褚横山忽然咧开大嘴，把重戟往泥里一插，隔空抱拳朗声道，“云泽宗那帮穷酸给你多少雇金？只要你现在过来替老子从北侧打开一道缝，褚某当场拍给你五十枚下品灵石，外加保你平平安安出古墟！”\n\n血河宗樊九皋阴恻恻舔了舔薄唇，指尖捻着一滴腥臭尸血：“不识抬举的话，等樊某剥了你的皮炼成寻脉血偶，照样能破门！”\n\n“妖人敢尔！”\n\n捂着半边染血肋骨的梁世勋铁青着脸喝骂一声，转头却对苏清晏盛气凌人道，“苏客卿，你拿了本宗定金立过契书，还不快上去破了这劳什子锁龙禁？！”\n\n曹无极也冷笑着逼近两步：“不错！离戌初莲熟已不足一个时辰，耽搁了采摘时机，苏客卿担待得起么？”\n\n两边一个唱红脸重金诱降，一个唱白脸拿契书压人。\n\n霍千山更是半句废话没有，反手将背上那柄门板宽的无锋重剑铿然插回铁鞘，右手往腰间储物袋一抹！\n\n乌光暴涨！\n\n一杆长达丈一、戟刃铭刻着狰狞赤蛟破阵纹的百炼重兵“赤炎战戟”赫然握入掌中，被他单臂一抡，“咚”地一声重重顿在苏清晏靴尖两寸外的盐泥里！\n\n泥浆四溅，九窍巅峰的狂暴纯阳威压扑面压下！\n\n“苏客卿，某家器堂为护你进中窟折了不少弟兄。”霍千山声如洪钟，字字带着兵刃血气，“今日这道门，你不破也得破！”\n\n换作寻常通窍七窍修士被五名九窍霸主这般夹在刀尖上逼宫，只怕早吓得腿肚子转筋了。\n\n苏清晏却连眉梢都没动半分。\n\n她垂眸睨了一眼脚边滚烫冒烟的赤炎战戟，清泠嗓音不高，却像冰珠子砸在铜盘上，清晰穿透全场：\n\n“霍师兄尽管拿战戟往本座头上劈。”\n\n霍千山眉头猛拧：“你以为某家不敢？！”\n\n“劈死本座，这道地磁锁龙禁无人泄导，十日之内谁碰谁死。”\n\n苏清晏抬起苍白却冷傲的下颌，目光扫过五方首领，“诸位大可守在门外干瞪眼，等后天卯初地脉合拢，一块给伴生煞莲陪葬。”\n\n褚横山与霍千山呼吸同时一滞！\n\n这话半点没掺假，真把唯一能拔钉子的阵师逼死了，在场谁也别想吃着锅里的肉！\n\n曹无极阴沉着脸眯起三角眼：“少兜圈子！姓苏的，你到底想坐地起价要什么？”\n\n“本座不要那株赤煞伴生莲半片花瓣。”\n\n苏清晏伸出素手，直指青铜石拱门内左侧隐约可见的一片古老刻纹石壁，“我苏氏先祖当年参建此禁，门内左壁留有半幅堪舆阵纹。破禁之后，本座只拓左壁阵纹，莲台归谁，你们五家凭本事去抢。”\n\n樊九皋眼珠一转，桀桀怪笑：“就这么简单？小娘皮莫不是藏着后手？”\n\n“自然有两条铁规矩。”\n\n苏清晏竖起两根手指，寸步不让，“第一，地磁锁龙禁对武夫真气极度敏感，五方所有人马立刻退至石拱三十步开外！谁敢踏进三十步红线半寸，乱磁炸盘，本座当场收针罢手！”\n\n“第二，定磁泄气需一人在门槛砸钉扶钎。”\n\n她素手往侧后方一指正缩着脖子擦汗的陈长庚，“除了本座这名挑炭箱的杂役，第三个人不准沾石阶！”\n\n刷！\n\n上百道凌厉似刀的目光瞬间扎在陈长庚灰扑扑的麻布旧袄上！\n\n陈长庚心里把这群豺狼的肚肠看穿了底——五方霸主眼下答应得再痛快，等戌初门开的那一刹那，冲上来第一刀准是顺手把破阵的苏清晏和自己剁成肉泥灭口！\n\n不过苏清晏这一手“退三十步”，恰恰替两人抢出了门内最致命的半息身位差！\n\n陈长庚当即配合着浑身一哆嗦，苦着脸朝霍千山和曹无极连连作揖：“各、各位大老爷高抬贵手！小人手笨胆子小，诸位爷要是提着大刀站在屁股后头瞪着，小人一锤子砸歪了铁钎，咱们全得一块喂磁雷啊！”\n\n“滚上去干你的活，少废话！”\n\n曹无极鄙夷地嗤笑一声，心里却算得精明——一个七窍挑箱苦力配一个带伤阵修，就算站在门槛上又能翻出什么浪花？退开三十步，不过是九窍高手两息扑杀的距离！\n\n“成！老子信天阵宗的招牌一回！”\n\n褚横山率先拔起乌铁重戟，大手一挥，“玄煞门和血河宗退后三十步！谁敢提前乱动坏了破门大事，老子先劈了他！”\n\n霍千山深深看了一眼面色冷淡的苏清晏，拔起赤炎战戟沉声喝令：“器堂、曹家、梁家，全退三十步列阵！”\n\n哗啦啦一阵甲叶碰撞声响。\n\n南北五方百余号精锐各自后撤三十步，在烂泥沟床外围拉出两道剑拔弩张的包围圈，明面上收了兵刃，暗地里一张张灵符、毒镖、劲弩早已悄然扣死在掌心！\n\n石拱门前三十步方圆，眨眼清得干干净净。\n\n苏清晏不再耽搁，迈步踏上青铜石拱门前的三级青石阶，取出一捆缠满导磁银丝的百炼破岩精铁钎递给陈长庚：\n\n“离戌初还差两刻钟。按左二右一的石缝寸位，把三根定磁铁钎砸进门槛两尺深，莫用内劲，只凭死力落锤。”\n\n“是，仙师！”\n\n陈长庚卸下两只试阵铁木炭箱紧贴门框内沿放稳，抄起一柄十二斤重的生铁扁头锤，半蹲在石拱门槛下叮叮当当砸起第一根铁钎。\n\n“铛！铛！铛！”\n\n前两根铁钎顺着左侧门槛石缝稳稳楔入两尺，丝丝缕缕狂暴的幽蓝地磁顺着银丝导入地下，门洞内那层锁龙磁幕肉眼可见地薄了三分。\n\n三十步外，曹无极与褚横山等人眼底贪光大盛，身体已微微前倾！\n\n陈长庚喘着粗气抹了把汗，挪步蹲到右侧门框根下，左手扶稳第三根定磁铁钎，右手抡起十二斤生铁锤，对着石缝用力一锤砸落！\n\n“咚——嗡……”\n\n铁锤砸实钎尾的刹那，一股极其细微、截然不同于实心山岩的沉闷空腔回震，顺着锤柄猛然撞进陈长庚虎口！\n\n陈长庚抡锤的右臂微不可察地顿了半毫！\n\n他在乌卤盐场废井底下敲了整整三年卤壁空囊，如今又是通窍九窍初期的敏锐耳力——这一锤震上去，不仅门槛上方的青铜门柱是空的，顺着两侧空心铜柱往头顶承重主石梁一传，上头三尺厚的万斤黑磁门梁夹层里，竟同时传回了一片密集干燥的油纸包摩擦簌簌声，外加一丝若有若无的硝硫火药燥气！\n\n陈长庚后背汗毛瞬间炸起，脸上却连半丝惊色都没露，依旧低着头去摸第二锤！\n\n什么明日正午炸正门——玄煞门那帮狠毒内鬼，竟早就把整座内窟石拱门头顶的万斤承重石梁掏空，密密麻麻塞满了定时塌山的“断龙硫雷砖”！"}, {"n": 75, "title": "内窟开封", "body": "一万斤黑磁承重石梁悬在头顶，里头塞满的断龙硫雷砖只要引信一跳，整座青铜石拱门瞬间就是活埋百人的绝户坟！\n\n三十步外，五方九窍巅峰霸主正攥着刀戟虎视眈眈，但凡陈长庚此刻敢抬头喊半个“雷”字，褚横山和霍千山头一件事就是封死退路，逼他和苏清晏先拿命把硫雷砖拆出来！\n\n陈长庚半低着眉眼，额角淌下一滴冷汗，握着生铁锤柄的粗糙五指却稳如磐石。\n\n“右侧第三钎怎停了？”\n\n站在两步外操控古铜心血罗盘的苏清晏并未回头，清泠声音压在呼啸的乱磁风声里：“差三寸未到导气槽，莫在此时惜力。”\n\n“回仙师，右角石缝结了一层硬铁盐痂，小人换个巧劲夯进去！”\n\n陈长庚嘴上高声应着场面话给三十步外的人听，右手十二斤生铁扁头锤顺势扬起，对着第三根定磁铁钎的八棱钎帽，极有章法地连敲四记！\n\n“叮、叮、叮——铛！”\n\n三短，一长！\n\n脆生生的金铁敲击声混在乱磁嗡鸣里，听在外围褚横山与曹无极耳中不过是苦力砸铁钉的寻常响动；可落在苏清晏耳膜里，她托着古铜罗盘的素白左手食指却微微一颤！\n\n昨日两人从西偏废矿廊摸往苏氏古阁前，早定下过三套敲铁暗语——两短是遇哨，三长是有宝，唯有“三短一长”，专指头顶有塌方绝杀大险、开门即刻弃路逃生！\n\n苏清晏连眼角的余光都没往头顶门梁瞄一下。\n\n能够坐稳云泽宗外聘寻脉客卿的位置，她的临阵定力本就远超常人，借着俯身拨正罗盘磁针的动作，红唇微启，用只有两人能听清的气音冷冷吐出六个字：\n\n“梁上有雷？几成？”\n\n陈长庚一边抡锤把铁钎最后两寸砸进导气槽，一边低头吹去石缝盐屑，短促回道：\n\n“整梁掏空，十成活埋局！”\n\n苏清晏瞳孔深处寒芒一凛：“门内右下方有泄煞斜坡，听我收旗声，贴右滑！”\n\n“明白，小人替仙师垫背！”\n\n陈长庚收锤入腰，双手稳稳抓住身旁两只试阵铁木炭箱的扁担麻绳，双脚草鞋暗暗扣紧三级石阶最右侧的崩口边缘。\n\n时间一息一息熬过酉末，正式踏入二月初五戌初正刻！\n\n入墟已满十九个时辰，自辰初休战算起六个时辰待熟之期整点届满！\n\n“嗡——！”\n\n无需任何人报时，青铜石拱门深处骤然卷出一股炽烈滚烫的赤金霞光！\n\n原本夹杂在风里的那一丝乌紫涩腥气眨眼散得无影无踪，取而代之的，是一股浓烈到令人浑身气窍自发张开、仿佛吸一口都能增进十年苦修的异种醇香！\n\n六个时辰期满，内窟那株赤煞伴生莲彻底褪尽死毒，九瓣全熟！\n\n“花熟了！苏清晏，快拔旗开禁——！”\n\n三十步外，曹无极双目赤红如嗜血饿狼，扯着嗓子厉声暴喝！\n\n褚横山、樊九皋、霍千山、梁世勋四方人马同时踏前半步，周身九窍罡气轰然鼓荡，上百双眼睛死死盯住幽蓝磁幕，连半个人都没再去注意蹲在门框边上的灰衣杂役！\n\n“疾！”\n\n石阶之上，苏清晏左手咬破指尖点在古铜罗盘中心，右手猛然一把拔起插在正门阵枢上的定磁主阵旗！\n\n就在主阵旗离地半尺、狂暴锁龙磁力即将向两侧泄空的紧要关头！\n\n苏清晏手腕极其隐蔽地往右偏转了半寸，反手一抖，将三枚八棱试脉铁钎倒钉进左侧门框石缝！\n\n“刺啦——轰隆！”\n\n本该丈二洞开的幽蓝锁龙磁幕猛然一阵剧烈扭曲！\n\n整扇青铜石拱门左侧八尺竟被倒卷的乱磁狂风生生拧成了一团触之即碎的蓝黑电涡，唯独紧贴右侧门框的地方，撕裂开一道高约七尺、宽仅尺半、只容单人侧身硬挤进去的狭长裂口！\n\n裂口之内赤雾翻涌，隐约可见内窟中央一根拔地五丈的赤黑石笋顶端，一株巴掌大小、九片花瓣流转着赤金宝光的“赤煞伴生莲”正迎风摇曳！\n\n“门开了！伴生莲在石笋顶上——抢啊！”\n\n贪欲彻底冲垮了理智！\n\n原本还盘算着先一刀宰了苏清晏灭口的五方霸主，一瞧见这道窄得只能一人先钻的乱磁风帘，谁还顾得上两个随时能捏死的破阵工具？\n\n慢半息，九瓣宝莲就得落进死对头肚子里！\n\n“滚开！这株莲归老子玄煞门了！”\n\n距离最近的褚横山狂吼如雷，仗着肉身蛮横，提着乌铁重戟第一个冲上石阶，侧着魁梧肩膀便往尺半宽的风帘裂口里硬挤！\n\n“褚老魔休得独吞，吃本公子一记！”\n\n紧跟在侧翼的曹无极眼底凶光毕露，竟在跨上石阶的刹那率先撕毁同盟，左手自残袖中猛然甩出一道尺许长、缠满冤魂哭啸的乌红尖锥——正是曹家阴毒法器“血煞破禁锥”，直扎褚横山后心命门！\n\n“无耻小畜生，找死！”\n\n前脚刚迈进门缝的褚横山惊怒交加，硬生生刹住冲势回身横戟重砸！\n\n“铛——轰！”\n\n重戟与血煞锥在狭窄石拱门口正面硬撞，炸开一团丈许大的黑红气浪！\n\n“莫叫他们堵死门口！器堂随某杀进去！”\n\n霍千山手提赤炎战戟紧随其后怒吼扑上，路过门槛时左袖顺势往门内右侧高坡碎石间一抖，三颗暗红铁丸悄无声息滚入石缝；樊九皋与捂着肋骨的梁世勋更是唯恐落后，挥舞兵刃带着上百号精锐蜂拥挤上石阶，刀光戟影瞬间在尺半宽的风帘口撞成了一锅沸粥！\n\n“哎呀妈呀！神仙打架杀人啦，仙师快趴下！”\n\n早缩在门框最右角内侧的陈长庚扯开嗓子发出一声惊恐惨叫！\n\n趁着褚横山与曹无极交手炸开的狂暴气浪迎面掀来，陈长庚双臂死死箍住两只封条铁木炭箱护在背后当铁壳，左肩顺势一撞身侧收旗的苏清晏，两人借着气浪推力，顺着门内右侧一道陡峭湿滑的坍塌盐岩斜坡贴地急滑而下！\n\n离地始终不逾三尺，半点未触禁空死线！\n\n上方门口五尊九窍巅峰强者正为争抢入窟头筹杀得眼珠滴血，滚滚黑雾与乱磁电光彻底遮死了下方五丈深的底层乱石沟，竟无一人低头多看这两个“被余波震落深沟”的小虾米一眼！\n\n一滑到底！\n\n陈长庚草鞋重重抵住沟底一块风化黑磁岩，三千五百斤的九窍柔劲悄然卸尽冲势，连大气都没喘一口，猫腰拽着苏清晏飞快闪进底层一排坍塌断裂的古盐柱阴影深处！\n\n头顶五丈高处，兵刃交击声、怒骂咆哮声震得穹顶碎盐如雨点往下掉。\n\n底层乱石沟内却弥漫着齐腰深的浓重黑煞寒雾，连两丈外的人影都瞧不真切。\n\n苏清晏扶着粗糙断盐柱站稳，低头看了一眼怀中微微发烫、指针死死垂向脚底三尺处的古铜罗盘，素来清冷无波的眸子骤然一缩！\n\n“不对……上头那株赤煞伴生莲只是主脉溢出的余气所结！”\n\n她猛地蹲下身，指尖拨开断柱根下一层厚厚的乌黑盐垢，声音竟带上了一丝极罕见的紧绷：“整座沉渊古盐墟十年的地脉精髓，全聚在咱们脚底下！”\n\n陈长庚心头猛地一跳！\n\n他二话不说放下炭箱，反手拔出腰间一根百炼破岩精铁钎，顺着断盐柱根下那道尺许宽的天然岩缝插进去，双臂暗劲一吐，悄无声息将上头压着的三尺厚黑磁碎岩撬开一角！\n\n“嗡……”\n\n没有惊天动地的声响，一抹深邃、醇厚、令人神魂微颤的紫金色神芒，骤然从三尺深的漆黑石缝底下透射而出，将两人近在咫尺的脸庞映得一片紫金通透！\n\n顺着撬开的石缝往下看去——\n\n只见下方丈许长的古老晶槽内，横覆着一具碗口粗细的紫金伴生晶壳；而透过晶壳天然崩开的纵向裂隙望向中心，里头赫然孕育着整整一条尺半长、儿臂粗细、天然分作三节且流淌着璀璨星河的绝世主髓！\n\n正是贯通周天仙脉、激活蚀纹石臼二阶提纯的唯一核心母引——整条地母玄晶矿髓！"}, {"n": 76, "title": "煞莲混战", "body": "“盖上！莫漏紫光！”\n\n苏清晏反应极快，素手一压，陈长庚手腕一翻便将撬起的那块三尺黑磁碎岩轻轻合回原位，只留下一线指肚宽的暗缝，将那抹足以令全场九窍修士发疯的紫金神芒死死捂在了地底！\n\n几乎就在两人遮死宝光的同一刹！\n\n“铛！铛！铛——轰隆！”\n\n头顶五丈高的内窟中心莲台方向，爆开了一连串惊天动地的重兵硬撼巨响！\n\n陈长庚贴着断盐柱棱角抬头望了一眼。\n\n只见半空赤雾翻滚之中，器堂霍千山手挺丈一赤炎战戟，周身纯阳烈火如怒龙咆哮，正与玄煞门褚横山的乌铁重戟在石笋正面的狭窄盘道上硬拼了七八记，火星四溅，谁也休想越过谁半步！\n\n血河宗樊九皋则驱使着十几名悍不畏死的血袍刀手从西侧锁链扑击，与捂着肋伤死战的梁世勋及器堂副手谭铸绞杀成一团，不时有断肢残骸从高台摔进泥潭！\n\n而最阴险的曹无极，刚才在门口偷袭了一记之后竟滑泥鳅般缩到了最后头！\n\n趁着霍千山与褚横山正面火并无暇他顾，曹无极嘴角咧开一抹得逞的狞笑，带着恶奴胡彪贴着石笋东侧一条堆满碎石的陡峭偏坡，脚尖连点，直扑丈许之上的九瓣赤煞伴生莲！\n\n“蠢货们慢慢打吧！这株宝莲合该姓曹——”\n\n曹无极狂喜探手，右脚战靴刚重重踏上东侧偏坡第三块松动的赤黑碎石！\n\n石缝底下，三颗进门时刚被霍千山顺袖抖进去的龙眼大暗红铁丸，表面纯阳火纹骤然亮到极致！\n\n“咔——轰隆隆！”\n\n三颗专破护体罡气的二阶赤火地雷贴着靴底与左肋连环炸开！\n\n狂暴的赤白火柱混着滚烫铁蒺藜冲天暴起，当场将紧跟在侧后方替主子挡风的恶奴胡彪半边脑袋掀飞，无头肥躯滚落石坡！\n\n冲在最前头的曹无极更是躲无可躲，撑起的血煞气罩如纸糊般瞬间炸碎，整条左小臂连同肘弯被三颗赤火地雷正面轰中，皮肉骨骼炸得血肉模糊，只剩一层焦黑烂筋挂着半截白森森的断骨晃荡！\n\n“啊啊啊——我的手！我的左手！”\n\n剧痛钻心彻骨，半边身子烧成血人的曹无极摔退到石台边缘，先是一怔，旋即看清脚下残留的器堂独门赤炎阵纹，两只三角眼瞬间充血暴凸如疯狗！\n\n“霍千山！你他娘的竟敢在坡上埋赤火地雷阴老子？！”\n\n正在高处挥戟猛攻褚横山的霍千山头也不回，冷笑震天：“曹老三，你在崖口往某家护阵地桩抹血炼封蜡的时候，怎么没想过有今天？没炸碎你的狗头算你命大！”\n\n曹无极彻底听懵了，一口老血差点喷出三丈远：“放你娘的狗臭屁！老子什么时候动过你的破桩子？！”\n\n“还敢嘴硬？器堂儿郎听着，曹贼背刺同门，靠近三丈者与玄煞门同诛！”\n\n“霍匹夫含血喷人废我一臂，曹家死士听令，给老子连器堂和梁家一块宰了！”\n\n断了一臂、理智全失的曹无极凄厉狂嚎，右手抓起血煞破禁锥疯了似地反扑向器堂侧翼！\n\n褚横山与樊九皋见云泽宗三房当场窝里反杀作一团，更是狂笑连连，各引门徒依托多层石笋盘道围猎绞杀，整座内窟高台彻底沦为不死不休的修罗屠场！\n\n窟底断盐柱阴影里，陈长庚收回视线，心里暗道一声痛快。\n\n上午指肚刮出去的那绿豆大一星血蜡，这会儿连本带利换了胡彪一条狗命外加曹无极一条胳膊，买卖划算到家了！\n\n“别管上头，这底下的禁制棘手得很。”\n\n蹲在裂缝旁的苏清晏收回探入石缝的寻脉银丝，指尖拈着一撮刚带出来的紫黑磁粉，脸色凝重到了极点。\n\n陈长庚立刻蹲回身侧压低嗓音：“仙师，这地母玄晶不能直接撬？”\n\n“谁敢拿铁器硬撬分毫，整条矿髓蓄积千年的地磁元力当场就会引爆，方圆五十丈寸草不生。”\n\n苏清晏展开怀中那半卷《地脉堪舆总图》残卷飞快对照了一眼，纤指点向黑磁碎岩表面隐约浮现的九道古篆锁纹：“这是上古大能封锁灵脉本源的‘太古磁髓死禁’！”\n\n陈长庚眉头微蹙：“凭仙师刚取回的总图残卷，能解开么？”\n\n“能破，但要紧盯火候。”\n\n苏清晏没有半句虚言，手指顺着石缝往断盐柱后方那面爬满黑痂的垂直石壁一划：“你看清楚了，太古死禁的核心阵枢正好压着我苏氏先祖留下的下半部堪舆核心图纹；而紧贴晶坑后壁的这面百年封石后头，就是通往外泽的古排卤暗沟！”\n\n陈长庚瞳孔微亮！\n\n果然跟他在南岸崖顶瞅见的古引卤断槽严密对上了！只要破开这道太古磁髓死禁，不仅整条地母玄晶到手，连逃出内窟的独门水路都能一并打通！\n\n“破禁需要多久？动静大不大？”陈长庚直问最要紧的命门。\n\n“此禁牵连整座古墟地脉，推演生门并逐层导泄至少要一个半时辰，且阵枢泄气时会激起百丈磁鸣。”\n\n苏清晏从袖中摸出四杆尺许长的乌金小阵旗：“上头五人一旦分出胜负低头扫一眼，你我必死无疑。我现在先在断柱四周钉下‘隔音磁旗’锁住震波，你把昨晚古阁里用过的那面青铜隔味阵盘扣在石缝外侧，双重封死灵气外泄！”\n\n“好，小人这就布盘！”\n\n两人半点不拖泥带水，当场分头动手。\n\n苏清晏忍着左腕尺泽穴旧伤的隐痛，手腕翻飞，将四杆隔音磁旗悄无声息插入断盐柱四角的腐泥之中。\n\n陈长庚则麻利地从储物袋摸出青铜隔味阵盘摆在晶缝正上方，右手探入贴身暗袋，从七十九枚完整下品灵石里摸出一枚嵌进阵盘凹槽，贴身还稳稳余下七十八枚整灵石。\n\n“嗡……”\n\n青铜微光一闪即敛，一层肉眼难辨的三尺气幕混着四杆隔音磁旗的灰雾缓缓张开，将晶坑缝隙与苏清晏盘膝坐定的阵枢位置遮蔽得不漏半丝异香。\n\n“我需先推演一个半时辰锁死死禁生门，你守住断柱外侧黑雾盲口，绝不可让流矢或溃兵撞破阵旗！”苏清晏沉声叮嘱，双目微阖，十指已扣住八棱试脉铁钎逐寸推算繁复阵纹。\n\n“仙师放心推演，塌下来有小人顶着。”\n\n陈长庚应了一声，悄无声息退到粗大断盐柱朝外的阴影拐角处，左手虚按腰侧寒铁虫瓮，右手看似随意地握着一根破岩铁钎蹲在乱石后，一双耳朵却在隆隆斗法声中竖到了极致。\n\n一刻钟、半个时辰、一个时辰……\n\n上方五丈高的多层石笋盘道地势险窄，五方霸主与百余名门徒彼此牵制、谁敢先扑莲台便遭其余四家集火，拉锯血战足足僵持了一个多时辰仍未见分晓，不时有重伤惨叫的各派弟子滚落中层石坡。\n\n就在时间滑过亥末、即将跨过子夜迈入子初的刹那！\n\n一阵极轻、极腻、混杂着死人尸油与腐血恶臭的阴冷腥风，竟借着底层齐腰深的滚滚黑煞浓雾掩护，贴着内窟最外围的潮湿岩壁，悄无声息朝这根断盐柱后方摸了过来！\n\n来人脚步轻得像贴地爬行的老鬼，显然不是被炸下来的溃兵！\n\n陈长庚呼吸瞬间收成一线龟息，隐藏在天阵宗敛息玉符下的通窍九窍气血已如拉满的铁胎硬弓般悄然绷紧！\n\n三丈、两丈、五尺！\n\n黑雾分开一线，一道干瘦佝偻、披着血河宗暗红百衲袍的阴鸷老者身影，猫着腰鬼鬼祟祟转过了断盐柱拐角！\n\n正是血河宗樊九皋麾下最擅暗算偷袭、修为高达通窍八窍巅峰的控尸老手“邬千手”！\n\n这老鬼见高台上五强久战不下，眼珠一转便溜下底层黑雾沟，盘算着从崖底绕到器堂后背偷袭抢功，谁知刚转过这根断盐柱，迎面四尺外，竟撞见一个挑着两只大木箱的云泽宗灰衣七窍小杂役正蹲在石头缝边发呆！\n\n再往灰衣杂役背后三步的灰雾里一瞄，隐约还盘膝坐着一道白衣女修的纤细轮廓！\n\n邬千手先是一愣，随即枯树皮般的老脸上骤然绽开一抹捡着天大便宜的狰狞狂喜！\n\n“嘿嘿，老子道这天阵宗的小娘皮死哪儿去了，原来是带着个七窍废物躲在沟底下偷摸挖私货？！”\n\n根本不给对方开口求饶的工夫，邬千手枯爪猛拍腰间两只漆黑尸皮袋！\n\n“吼！吼！”\n\n两道腥风骤起，两具浑身钉满生锈精铁甲片、十指长满乌黑尸毒长指甲的高大铁甲血尸如恶虎出笼般并排跃出，四只铁爪带着刺耳破空声，当头直抓四尺外陈长庚的天灵盖与咽喉！\n\n而邬千手本人更是老奸巨猾，非但不自己冲上去拼命，反而借着两具铁甲血尸扑杀封路的瞬息，猛地后撤半步仰起脖子，胸腹真气鼓荡如雷，张开黄牙大口便要朝着头顶五丈高的莲台放声狂呼樊九皋！"}, {"n": 77, "title": "盲区瞬杀", "body": "“樊堂——”\n\n邬千手喉结暴凸，头一个“樊”字刚冲上嗓子眼，半缕音浪还未撞出四杆隔音磁旗拢住的灰雾！\n\n蹲在四尺外裂缝边的陈长庚猛然抬起了头。\n\n哪还有半点七窍挑箱苦力的瑟缩呆滞？那双幽深眸底只剩下一片看死人般的彻骨森寒！\n\n一旦叫这血河宗老鬼喊破嗓子，头顶五丈高处正杀红眼的五名九窍巅峰霸主低头扫下一眼，莫说底下这条地母玄晶，他和苏清晏连灰都剩不下一撮！\n\n“咽回去！”\n\n陈长庚一声极低的气音冷喝，胸前敛息玉符再不压制分毫，周身九大主气窍如江河决堤轰然全开！\n\n通窍九窍初期，整整三千五百斤暗金锻骨巨力在四肢百骸间炸起一串低沉金铁雷鸣！\n\n迎面扑来的两具铁甲血尸腥臭尸爪离他脑门已不足一尺！\n\n陈长庚非但没退，左脚草鞋踏裂黑磁岩往前悍然跨出半步，双手如铁钳般一把抄起手边试阵炭箱里早已拍活机括的三百斤糊泥青铜盾偶，当成一面攻城重槌，迎着两具八窍铁甲血尸拦腰横撞过去！\n\n“咚——咔嚓！”\n\n两具刀枪难入的铁甲血尸连哼都没哼出一声，胸肋精铁甲片连同腐朽脊骨被三千五百斤巨力推着三百斤铜偶正面碾扁，如两袋烂泥般被死死撞嵌进后方黑磁岩壁凹槽里！\n\n盾偶表层三层加料乌卤黑泥硬如生铁，只蹭掉一层白盐皮，底下残徽半点未露！\n\n同一刹那，陈长庚左手拇指早已掀开腰间寒铁虫瓮！\n\n“嗡——！”\n\n三十六道米粒大小的暗金细影混在黑煞浓雾里，比弩箭还快上三分，越过盾偶肩头直扑邬千手仰起的咽喉！\n\n“什——？！”\n\n邬千手眼珠子差点瞪裂眼眶！\n\n他做梦也想不到，一个外门挑箱的七窍灰衣杂役，一出手竟爆发出比他还霸道一截的通窍九窍横练凶威！\n\n那句求救呼哨被骇意生生憋在半道，邬千手本能缩脖去摸护身铁牌，脖子上一圈百炼精钢锻造的护喉铁领却骤然一凉！\n\n“咔嚓、噗嗤！”\n\n三十六只二蜕嗜铁煞甲虫一口啃穿两分厚的精钢护喉领，锋利口器顺势钻入皮肉，顷刻间将邬千手的喉管与发声气脉咬成了筛子！\n\n“嗬……嗬……”\n\n鼓荡如雷的呼喊化作一团腥臭血沫从喉咙血洞里狂涌而出，连半丝高音都没能传出三尺隔味阵盘之外！\n\n剧痛与窒息瞬间冲垮了邬千手的心神！\n\n“怪、怪物……九窍？！”\n\n邬千手捂着狂喷黑血的脖子踉跄倒退，枯瘦左手疯了似地探进怀里，一把扯出一张暗红刺目的二阶血遁灵符，拼着折寿十年也要化血光逃上高台！\n\n“想走？把命留下！”\n\n陈长庚怎会给他捏碎符箓的半息空档？\n\n借着盾偶松臂压尸的余势，陈长庚身形如贴地扑食的苍狼欺入邬千手怀中，右袖滑槽内九寸三分的百炼乌金破甲分水刺化作一道乌黑寒芒，贴着邬千手摸符的左肋斜刺而入，狠狠贯进小腹气海！\n\n“噗——！”\n\n手腕冷酷一绞！\n\n邬千手苦修数十年的通窍八窍巅峰气海丹田当场崩碎，手里那张血遁灵符灵光一黯，飘飘忽忽跌落泥地！\n\n“你……你到底是谁……”\n\n邬千手双膝跪倒，浑身真气泄得一干二净，枯手死死抓住陈长庚的灰麻袖口，满眼都是死不瞑目的怨毒与恐惧。\n\n“丙字房烧火的。”\n\n陈长庚面无表情地贴近他耳畔，左手自右袋摸出午前在南岸岩凹用两块地火精石与生铁砂缠好的那颗闷燃地火火珠，拇指利落抽掉中间的隔火云母片，顺着乌金刺拔出的小腹血窟窿硬生生塞了进去！\n\n紧接着，陈长庚飞起两记重脚，用破岩铁钎噗噗两声捣碎岩壁上那两具铁甲血尸的颅内尸核，将两具死尸一并摞在邬千手身上！\n\n“嗤嗤嗤——”\n\n没有半声炸雷巨响，也没有耀眼火光！\n\n两块高纯地火精石遇血肉铁砂瞬间剧烈闷燃，在青铜隔味阵盘与四杆隔音磁旗的双重封锁下，滚烫暗红火流不过十个呼吸，便将邬千手连同两具铁甲血尸由内而外烧成了一堆一碰即碎的焦黑骨灰！\n\n左肋暗囊里压箱底的三颗过载烈阳火珠，一颗未动！\n\n陈长庚吹了一声微不可闻的气哨，三十六只吃饱了精钢与精血的二蜕煞甲虫滴溜溜飞回寒铁虫瓮，一只不少。\n\n古盐墟乱磁锁死神念，通窍修士本就无法隔袋窥物，他手脚麻利地挑出邬千手未曾烧毁的储物袋与那张无主血遁符，扯开失了禁制的袋口探手一摸——里头除了一堆腥臭炼尸毒材，指尖赫然触到十四枚棱角分明、成色极佳的完整下品灵石！\n\n算上贴身原有的七十八枚，整灵石一举涨到了九十二枚！\n\n陈长庚随手抓过两捧黑卤湿泥将地上焦灰盖平，把糊泥青铜盾偶重立在身侧，这才转身走回晶坑边缘。\n\n三步外，盘膝坐在阵枢前的苏清晏早已睁开了双眸。\n\n紫金石缝透出的一缕微光映在她清冷侧脸上，那双素来古井无波的寒眸正一眨不眨地盯着陈长庚拍灰的双手，瞳孔深处罕见地掀起了一丝震动。\n\n八窍巅峰的血河宗老鬼外加两具铁甲血尸，从撞破拐角到化作一捧黑灰，前后竟没撑过十息！\n\n没有半分丹毒滞涩的浑厚气血，三千五百斤以上的纯粹横练巨力——哪里是什么通窍七窍，分明已是货真价实的通窍九窍体修！\n\n“仙师这般看着小人做什么？”\n\n陈长庚把九十二枚灵石贴身收稳，脸上又挂起那副憨厚守礼的平淡神色：“幸亏这老鬼托大没先捏符，不然小人这几斤蛮力还真摁不住他。”\n\n苏清晏静静看了他两息，清泠声音压得极低：“断桥底下，你说自己刚入七窍。”\n\n“在外门废渣房讨生活，露八窍嫌扎眼，露九窍嫌命长。”\n\n陈长庚半点不脸红，蹲下身替她扶正一杆微晃的隔音磁旗，坦然交底：“当时咱们还不熟，小人留一手保命底牌，总比死在曹无极脚底下强。”\n\n苏清晏指尖在八棱铁钎上轻轻一摩：“古阁外头那个郭断山，也不是靠反磁桩侥幸炸死的吧？”\n\n“反磁桩确实炸废了他半身重甲，小人只是顺手省了点力气。”\n\n陈长庚抬头迎上她的目光，语气诚恳又直白：“苏仙师要的是先祖堪舆残图，小人求的不过是一口破境汤水。咱们一路过桥拆桩，小人可曾坑过仙师半步？”\n\n苏清晏沉默片刻，眼底最后一丝审视彻底敛去。\n\n在这上下皆欲拿她填坑逼婚的绝渊里，身边这个嘴里满是铜板俗账、动手却干净狠绝的九窍青年，已是眼下唯一能托付后背的同路人。\n\n“藏得好。”\n\n苏清晏冷淡吐出三个字，竟算是夸了一句：“死禁生门我已推演出八成，再守我两刻钟——”\n\n“两刻钟”三字刚出唇齿！\n\n头顶五丈高的莲台上方，血河宗樊九皋刚一刀劈退梁世勋，抽空往窟底黑雾扫了一眼，怒骂道：“邬千手那老狗溜下去摸鱼，怎的半天没动静？！”\n\n话音未落！\n\n“嗤嗤嗤——！”\n\n一阵尖锐刺耳、仿佛地底万丈引线同时烧穿的恐怖硫火厉啸声，突兀从内窟入口那座青铜石拱门头顶炸响！\n\n陈长庚脸色骤变，一把拽住苏清晏的肩头将其按向断盐柱内侧凹槽：“趴下！门梁上的雷响了！”\n\n高台之上，正在挥戟狂攻霍千山的玄煞门褚横山猛然回头看向大门口，虎目瞬间瞪得溜圆，发出惊怒欲绝的嘶吼：\n\n“断龙硫雷砖？！严老狗疯了不成——老子还在里头，谁准你提前半日拉响禁磁线外的母引？！”\n\n无人应答！\n\n在古盐墟百丈禁磁线外坐镇的玄煞门接应长老，为防云泽宗执法长老强攻破局，竟狠辣到连自家褚横山与血河宗盟友一并舍弃，赶在刚交子初、距原定午时整整提前六个时辰隔界扯燃了活埋总引信！\n\n“轰隆隆隆——！”\n\n一连十八声震碎耳膜的连环巨爆，在青铜石拱门顶端的万斤承重石梁夹层里同时炸开！\n\n刺目赤红火海瞬间吞没了守在门口的十几名各派弟子，头顶整片千丈岩穹剧烈崩裂，数十块重达万钧的漆黑乱磁巨岩如天塌地陷般轰然砸落，顷刻间将整座内窟唯一的进出正门堵得严严实实、再无半寸缝隙！"}, {"n": 78, "title": "塌门困兽", "body": "“轰——哗啦啦！”\n\n狂暴的气浪卷着漫天滚烫碎石与浓黑硫烟倒灌入窟，五丈高的中心石笋剧烈摇晃，穹顶风化盐钟乳如冰雹般疯狂砸落！\n\n陈长庚将三百斤糊泥青铜盾偶横顶在断盐柱凹槽外侧，双臂硬生生扛住两块滚落下来的数百斤黑磁断岩，震得虎口发麻。\n\n“咳咳……正门塌死了！整条出路全被万钧磁岩封死了！”\n\n上方高台烟尘之中，幸存下来的三十余名各派精锐发出绝望至极的惊恐哭嚎！\n\n“严屠夫！你个断子绝孙的老匹夫！”\n\n玄煞门褚横山披头散发立在石笋盘道上，半边黑甲被飞石砸得凹陷吐血，气得仰天狂骂：“说好今日午时看老子号令封门，你竟敢拿老子六十号兄弟给云泽宗这群小崽子陪葬？！”\n\n“哈哈哈哈！好一个玄煞门，对自家人都下得去绝户手！”\n\n器堂霍千山抹去额角鲜血，手提丈一赤炎战戟不退反进，双目赤红如厉鬼：“既然出不去了，某家先把你褚老魔剁成肉泥垫背！”\n\n就在这天崩地裂的一撞之下，石笋顶端那株刚熟透的九瓣赤煞伴生莲受狂暴乱磁冲击，左侧四片晶莹花瓣当场炸成一团血雾消散！\n\n眼看整株宝莲就要被坠石砸毁！\n\n“滚开！半株也是老子的！”\n\n褚横山凶性彻底爆发，硬挨了霍千山一记侧戟劈肩，左手如铁钩般探入紊乱气障，一把将仅存五瓣的半株赤煞伴生莲连根拔起塞入怀中玉盒，扭头便朝石笋后上方一道尺许宽的天然排风黑缝亡命钻去！\n\n“老匹夫往哪儿逃！把伴生莲给某家留下！”\n\n霍千山岂容煮熟的鸭子飞走？怒吼一声提戟紧追而上，踩着石壁凸起一头扎进了那条充斥着乱磁风刃的上层风缝！\n\n“钱老头，跟上霍千山！正门堵死了，上头那条风缝准能通外头！”\n\n捂着血淋淋右肋的梁世勋吓破了胆，哪敢留在底下等死，带着仅剩的五六名梁家残兵连滚带爬也追进了上层风缝！\n\n转眼之间，上方五尊九窍巅峰霸主走脱了三尊！\n\n只剩下左臂齐肘断绝、浑身浴血的曹无极，与同样被堵在正门乱石堆前的血河宗樊九皋，带着十几个疯魔残兵在坍塌巨岩前红着眼疯狂劈砍！\n\n“铛！铛！”\n\n刀锋砍在万钧黑磁巨岩上只迸出几点火星，连道白印子都留不下！\n\n更可怕的是——\n\n“咔嚓……咔咔咔……”\n\n一阵令人牙酸骨冷的低沉岩石挤压声，正从脚下地肺深处与四面八方的盐岩山体内部不断传出！\n\n窟底断盐柱后，苏清晏左手死死按住剧烈震颤的古铜心血罗盘，看着盘面上逆转了近半圈的刻度金针，脸色瞬间白得没有半点血色！\n\n“糟了！”\n\n陈长庚拍落肩头碎盐，沉声急问：“仙师，上头那条排风裂隙能走么？”\n\n“走那条路是找死！”\n\n苏清晏语速快如疾风，指尖点向嗡鸣不止的罗盘：“那是地底排泄乱磁煞风的死烟囱，越往上越窄，全是能刮碎九窍护体罡气的蚀骨风刃，根本不通地面！”\n\n“那这山体咔咔响是怎么回事？”\n\n“十八块断龙硫雷砖炸断了内窟承重主脉！”\n\n苏清晏猛地抬头看向不断往下渗出粘稠黑卤的四壁，声音冷得像冰渣：“子夜已过，原本要到明日卯初才合拢的地脉，受这一炸牵引全面坍缩——最多还剩不到八个时辰，整座沉渊古盐墟就会彻底合拢，把所有活物碾成肉饼！”\n\n不到八个时辰！\n\n陈长庚瞳孔骤然缩紧！\n\n现在刚入二月初六子时，原本距二月初七卯初还有十五个时辰的宽裕工夫，被玄煞门外围这一记绝户雷硬生生砍掉了一半还多！\n\n“正门封死，上头是死路，咱们唯一的活路就是晶坑后头那面百年排卤石壁！”\n\n陈长庚一锤定音，目光如刀看向脚下裂缝：“仙师，两刻钟慢慢导气怕是等不及了，怎么强破这道太古磁髓死禁，你直接吩咐！”\n\n苏清晏深深看了这个临危不乱的青年一眼，没有半分犹疑，反手从内襟摸出一束足有七杆、杆身刻满苏氏血色古篆的六寸破禁阵旗！\n\n“常规导气已来不及了，唯有用我苏氏心头精血强行叩碎死禁阵枢！”\n\n苏清晏左腕旧伤早已崩裂渗血，她却连眉头都没皱一下，直接张口咬破舌尖，“噗”地将一口滚烫殷红的本命心头精血尽数喷在七杆阵旗之上！\n\n“仙师你的伤——”\n\n“死不了！听清楚，七旗入枢一旦敲响太古死禁，必会激起狂暴紫金磁光冲破隔音旗！”\n\n苏清晏唇角挂着刺目血痕，素手如电，连将前四杆染血阵旗死死钉入黑磁碎岩四角，冷喝道：“正门那边曹无极与樊九皋还没死绝，一旦见光扑下来，我立在阵枢正中寸步不能移，一动便是阵毁人亡！”\n\n“外头交给我！”\n\n陈长庚半个字不含糊，一把拔出三根百炼破岩精铁钎钉死在断盐柱隘口，双手将三百斤糊泥青铜盾偶重重顿在自己身前半步，九窍暗金气血蓄至巅峰：“仙师只管破禁，天塌下来小人先替你扛着！”\n\n“好！”\n\n苏清晏不再多言，第五旗、第六旗、第七旗带着凄厉破空声，接连贯入太古磁髓死禁正核心！\n\n“嗡——轰隆！”\n\n七星锁脉，精血叩关！\n\n地底三尺之下，那道尘封千年的太古磁髓死禁仿佛一头被激怒的太古凶兽，九道古篆锁纹骤然爆发出刺目欲盲的紫金雷弧！\n\n“啪！啪！啪！”\n\n先前插在外围的四杆普通隔音磁旗再也承受不住这股地脉反震，当场崩裂炸碎！\n\n一柱碗口粗细的紫金阵光穿透黑煞浓雾，直冲窟底半空！\n\n而此时此刻，三十丈外的正门乱石堆前！\n\n“曹家小儿，门已经死了，把你怀里剩下的灵药宝器交出来，樊某给你留个全尸！”\n\n血河宗樊九皋浑身浴血，一柄嗜血弯刀劈翻最后两名曹家护卫，刀锋逼得左臂断绝、失血过多的曹无极连连倒退！\n\n“想吃本公子的绝户？做你的春秋大梦！”\n\n已被逼到山穷水尽的曹无极双目充血凸出，状若疯魔，右手猛地探入怀中玉瓶，倒出一颗龙眼大小、表面爬满黑红血筋的禁忌邪丹，看都不看便一把塞进嘴里嚼碎咽下！\n\n正是燃尽全身精血元气、事后必成废人枯骨的搏命凶药——赤煞燃血禁丹！\n\n“轰——！”\n\n一股浓烈如粘稠血海的狂暴气机骤然自曹无极天灵盖冲霄暴起！\n\n他断臂伤口处喷出的鲜血竟在半空化作诡异血焰，原本通窍九窍巅峰的修为在这一刻强行撕裂界限，硬生生飙升到了触及半步开脉的骇人凶威！\n\n“滚！”\n\n曹无极披头散发一声厉吼，右手血煞破禁锥暴涨三尺血芒，正面一记硬劈，竟将猝不及防的樊九皋连人带刀震得虎口崩裂、狼狈暴退五步！\n\n樊九皋脸色剧变：“疯狗！连燃血禁丹都敢吞？！”\n\n他深知吞了此丹的疯子最多只能狂暴半刻钟，当下毫不硬拼，借着漫天硫烟往碎石阴影里一缩，准备等曹无极气血烧干再上去收尸！\n\n曹无极一击逼退强敌，胸膛剧烈起伏，急促滚烫的呼吸喷出尺许血雾。\n\n燃血禁丹每烧一息都在抽干他的骨髓生机，若不在药力散尽前寻到活路逃出去，他今日必死无疑！\n\n他赤红疯狂的三角眼四下一扫，猛然间，眼角余光死死钉在了三十丈外窟底断盐柱后头——那道刚刚冲破黑雾的紫金破禁阵光，以及阵光中单膝跪地叩阵的苏清晏！\n\n“苏清晏？！寻脉馆的贱婢在底下破阵开路！”\n\n绝境疯魔的曹无极先是一愣，旋即发出一声如同饿鬼见血般的狂喜咆哮！\n\n“哈哈哈哈！天不绝我曹无极！那贱婢懂堪舆术，她在底下破阵的地方定有逃出古墟的秘道！”\n\n根本不顾身后的樊九皋，气势暴涨至半步开脉的曹无极脚下重靴一踏轰碎三尺盐岩，右手紧攥滴血的血煞破禁锥，裹挟着滔天血浪，如一头出闸疯虎般朝着窟底断盐柱直扑而下！"}, {"n": 79, "title": "强破死禁", "body": "未至身前，半步开脉的狂暴血煞威压已将窟底齐腰深的黑雾硬生生排开两丈！\n\n三十丈距离，在吞服了燃血禁丹的曹无极脚下不过短短两三个呼吸！\n\n“挑箱的狗杂种给老子滚开！苏清晏，把底下的生路让出来，不然老子把你们两个全钉成血筛子！！”\n\n曹无极凄厉嘶吼，单臂高举那柄缠绕着三尺实质血芒的“血煞破禁锥”，整个人化作一道腥风血影，踏碎满地乱石正面狂冲而至！\n\n断盐柱内侧，双膝死死跪锁在阵枢正中的苏清晏浑身剧颤！\n\n太古磁髓死禁的九道古篆锁纹已被她以心头精血叩断了七道，最后两道核心磁锁正处于最凶险的反扑临界，她七窍同时渗出殷红血丝，双手死死按住阵旗，连偏一偏手指都会当场走火毙命！\n\n“还差最后十息！！”\n\n苏清晏喉间溢出一口鲜血，清泠声音在血浪呼啸中凄厉决绝，“陈长庚！他吞了燃血丹已是半步开脉之力——按你我地脉血契，遇不可抗绝局现在便可弃我独逃！”\n\n她双目赤红拍向第八道锁纹，咬牙喝出最后一句：“若替我死挡十息，死禁一破，坑底之物本座分毫不取！！”\n\n逃？往哪儿逃！\n\n站在隘口最前方的陈长庚，眼底没有半分犹豫，更无半丝退意，只有一把在瞬息间拨到极致的生死铁算盘！\n\n正门已被万钧巨岩堵死，此刻弃苏清晏逃进黑雾，首先便丢了底下那条赖以贯通周天仙脉、激活石臼二阶提纯的唯一母引“地母玄晶”！\n\n更要命的是，哪怕他稍后能趁乱钻进后壁的古排卤暗沟，那条废弃百年的水底暗道里藏着三处连老盐工都摸不准的致命乱磁水漩，缺了苏清晏这双堪舆辨脉的眼睛指路，他一个人钻进去也是十死无生！\n\n护住苏清晏这十息，就是护他陈长庚自己的长生大道！\n\n“仙师专心拍阵，十息之内，他越不过小人这双草鞋半寸！”\n\n陈长庚半句废话不再多讲，面对扑至两丈之内、凶威滔天的半步开脉疯虎，他双目寒电暴射，不退反进，右脚重重踏在隘口基岩之上！\n\n“给老子碎——！！”\n\n一丈之内，曹无极狰狞扭曲的血脸近在咫尺，压根没把眼前这个灰衣杂役放在眼里，右手血煞破禁锥带着足以洞穿三层精钢重盾的半步开脉血罡，对着陈长庚胸口连人带阵狠狠一锥狂刺而下！\n\n第一息！\n\n“起！！”\n\n陈长庚喉间炸开一声闷雷低吼，通窍九窍初期三千五百斤暗金锻骨巨力毫无保留灌入双臂，同时一掌拍碎三百斤糊泥青铜机括盾偶胸口暗槽的限流铜卡！\n\n嵌在槽内的两钱无瑕髓晶瞬间过载燃尽，整尊三百斤重的青铜盾偶双臂合拢如铁山，被陈长庚双手横推着正面悍撞上刺来的血煞破禁锥尖！\n\n“铛——轰咔！！！！”\n\n一圈肉眼可见的赤黑气浪在狭窄断柱间猛烈炸开！\n\n半步开脉的燃血一击霸道绝伦，血煞破禁锥硬生生刺穿三层乌卤黑泥与三寸厚的青铜胸甲！\n\n然而这尊二阶机括盾偶在髓晶过载自毁的刹那死死咬住锥身，轰然爆裂成漫天焦黑扭曲的碎铜烂泥，表面残迹彻底熔毁无踪，硬生生替陈长庚吃下了整整七成狂暴杀力！\n\n第三息！\n\n“噗——！！”\n\n余下三成狂暴血煞震波隔空狠狠轰在陈长庚前胸之上！\n\n灰麻旧袄应声寸寸碎裂，贴身那面早已凹陷半寸的百炼玄铁护心镜“咔嚓”一声崩开十余道蛛网裂纹，深深嵌进皮肉！\n\n五脏六腑如遭万斤铁锤重击，陈长庚仰头狂喷出一大口滚烫鲜血，周身暗金皮膜骨骼爆出不堪重负的嘎吱巨响，一双麻草鞋在坚硬黑磁岩上硬生生向后犁出两道三寸深的血槽，直至后背死死抵住阵枢外沿半步——竟真如一截生根铁桩般钉死原地，未曾退入阵中半寸！\n\n“什么？！硬接老子燃血一锥竟没碎成肉泥？！”\n\n被铜偶自爆反震得手臂发麻、冲势硬生生顿在半途的曹无极骇然失色！\n\n他只当这灰衣小子是靠那尊古怪铜偶与一身蛮横外门横练死撑的护主死士，眼见后头阵光越来越亮，当即狞吼着强提第二口燃血煞气，抽回血煞破禁锥便要再补一记绝杀：\n\n“没了破铜烂铁，老子看你拿什么挡第二锥！！”\n\n第六息！\n\n陈长庚抹去嘴角鲜血，迎着再次扑上的曹无极，染血的嘴角忽然扯出一抹森冷彻骨的讥笑：\n\n“曹公子左胳膊空荡荡的，小人给你添把火暖暖！”\n\n早在双脚犁地硬扛余波的那一刹，陈长庚紧贴肋下的左手五指早已一把扯出了暗囊里压箱底的全部三枚“过载烈阳火珠”！\n\n一根浸油麻线将三颗塞满三倍赤磷硫精的致命火珠死死串成一串！\n\n没有半丝迟疑，陈长庚左手大拇指甲盖闪电般刮燃三道双层引火槽，趁着曹无极旧力刚收、左肩断臂空门大开的电光石火间，手腕如毒鞭一抖，将整串嗤嗤冒着白烟的三枚过载烈阳火珠，劈头盖脸甩进了曹无极毫无防备的左肋断臂空门！\n\n“烈阳火珠？！三颗连珠——不！！！”\n\n曹无极瞳孔骤缩成针尖，亡魂皆冒地想要横锥封挡！\n\n晚了！半丈贴脸，三珠齐爆！\n\n陈长庚甩出火珠的同一瞬便猛地矮身抱头，整个人缩进脚下半尺深的犁地石槽！\n\n第七息、第八息、第九息！\n\n“轰隆——轰隆——轰隆！！！！”\n\n三团足以把通窍九窍巅峰炸成碎肉的刺目赤白雷火，贴着曹无极左肋断口连环炸开！\n\n哪怕曹无极仗着半步开脉的燃血护体罡气拼命护住心脉头颅，整个人依旧被三倍叠加的恐怖火浪与万千破甲铁砂正面掀飞出去！\n\n“啊啊啊啊——！！！”\n\n凄厉不似人声的惨嚎响彻窟底！\n\n曹无极右半边袍服连同皮肉被烧得焦黑翻卷，护身血罡彻底炸碎，口鼻狂喷黑血，如一只断翅破麻袋般蹬蹬蹬倒退出整整三丈开外，重重撞在一根断盐柱上才勉强没栽倒，左肋焦黑一片可见白骨！\n\n左肋三枚过载烈阳火珠全数耗尽，却实打实把这头半步开脉的疯虎钉死在了三丈之外！\n\n第十息，到！\n\n“破——！！！！”\n\n阵枢正中，七窍流血的苏清晏抓住这用命换来的最后一息，染满鲜血的一双素手结成古印，对着脚下剧烈颤抖的太古死禁阵眼悍然一掌拍落！\n\n“咔嚓——嗡！！！！”\n\n仿佛一条横贯地底千年的无形铁锁应声寸寸崩断！\n\n覆盖在晶坑上方的九道太古古篆锁纹轰然炸碎成漫天光雨，三尺厚的表层黑磁碎岩自动向两侧滑塌，坑底丈许紫金伴生晶壳应声震裂，中心整条尺半长、流淌着璀璨紫金星河的“地母玄晶矿髓”毫无保留地彻底裸露在空气之中，四周岩缝间还噼里啪啦跳跃着一圈尚未散尽的蓝紫残余磁雷电弧！\n\n然而，太古磁髓死禁崩裂刹那反扑回来的最后一股狂暴乱磁煞力，也结结实实顺着七杆阵旗倒撞进苏清晏心口！\n\n“噗——！”\n\n本就强行燃耗精血的苏清晏娇躯猛地一僵，心脉受震寸断，仰头喷出一口夹杂着内脏碎沫的乌黑逆血，眼前一黑，整个人毫无声息地朝晶坑边缘软软栽倒昏死过去！\n\n“仙师！”\n\n刚从石槽撑起半边身子的陈长庚心头一凛，伸手便要去揽！\n\n恰在同一刹那！\n\n三丈外滚滚未散的火珠黑烟骤然被人从后一刀劈开！\n\n一直贴着浓烟悄无声息摸到近前、等足了鹬蚌相争全过程的血河宗霸主樊九皋，脸上绽开贪婪狞笑，脚尖在碎石上一借力，手中那柄三尺嗜血弯刀裹着腥风血光，紧贴着焦黑踉跄的曹无极后背心狠辣无比地当头劈落：\n\n“哈哈哈哈！好宝贝！曹家小儿，多谢替老夫蹚平死禁——你们几个的命和坑里的神髓，老夫全收了！！”"}, {"n": 80, "title": "喂晶夺路", "body": "三尺嗜血弯刀撕开黑烟，裹着通窍九窍巅峰的狂暴血罡，结结实实劈在曹无极毫无防备的后背心上！\n\n“噗嗤——啊！！”\n\n本就被三颗过载火珠炸碎护体血罡的曹无极，后脊梁骨应声裂开一道尺许长的深可见骨血口！\n\n燃血禁丹强提起来的最后一口凶威当场泄尽，曹无极狂喷着内脏血块，如一条断脊野狗般扑通栽倒在晶坑三步外的碎石地上！\n\n他右手死死攥着的那柄乌红邪器“血煞破禁锥”脱手飞出，“当啷”一声滚落到陈长庚草鞋前不足四尺的岩缝边！\n\n“樊、樊老鬼……你不得好死……”\n\n曹无极满脸黑血抽搐着，独臂还在拼命往晶坑方向乱抓，扭头冲着撑起身子的陈长庚凄厉嘶喊：\n\n“灰衣小子！快拦住樊九皋！！替本公子挡住他，出墟赏你百枚整灵石，保你入内门——”\n\n“百枚灵石？”\n\n陈长庚抹去唇边血迹站稳脚跟，低头瞥了他一眼，嗓音冷得像冰碴子，“曹公子还是留着去阎王殿买路吧。”\n\n“哈哈哈哈！算你这小杂役看清形势！”\n\n一刀劈废曹无极的血河宗霸主樊九皋放声狞笑，连补第二刀的工夫都懒得费，染血重靴一脚踩住曹无极后腰，高大身躯借力前跃！\n\n他一双细长毒蛇眼贪婪扫过坑底那条流淌着紫金星河的地母玄晶，再扫过陈长庚身前满地炸烂的碎铜片与胸口崩裂的护心铁镜，杀机毕露：\n\n“九窍锻骨体修？藏得倒深！”\n\n“可惜傀儡炸碎了，怀里的烈阳火珠也甩光了吧？”\n\n樊九皋舔了舔刀锋血珠，恶风扑面，“乖乖跪下自断双臂，把这天阵宗小娘皮和坑底神髓献上来，老夫赏你个痛快全尸！”\n\n“想要神髓？”\n\n面对半丈外当头劈落的嗜血弯刀，赤手空拳的陈长庚非但没退半步，眼底反而闪过一抹看死人般的讥诮：\n\n“樊老鬼胃口这么好，那就跟曹公子一块吃个饱！”\n\n“找死！！”\n\n樊九皋狞喝暴起，嗜血弯刀化作一匹三尺血练，直取陈长庚脖颈大动脉！\n\n地上奄奄一息的曹无极见陈长庚不救自己，更是怨毒暴吼，染血右手猛地往前一探，五指如鬼爪般抓向陈长庚左脚脚踝，想拉着他一块垫背惨死！\n\n前有九窍巅峰霸主劈头绝杀，下有疯狗临死拽脚！\n\n生死一线间，陈长庚看都没看劈来的弯刀一眼！\n\n他心中算盘早已拨到了骨子里——太古磁髓死禁刚刚崩裂不足三息，晶坑外沿那圈噼啪乱跳的蓝紫残余磁雷电弧，正是最忌阴邪血煞法器触碰的暴躁引信！\n\n“给爷进去！！”\n\n不等曹无极指尖沾上麻草鞋，陈长庚右腿暗金锻骨劲骤然如崩弓炸响，草鞋脚尖贴着碎石地面闪电般一勾、一挑！\n\n“嗖——！！”\n\n地上那柄缠满百人怨魂精血、尚未敛去血光的“血煞破禁锥”，化作一道乌红流光，不偏不倚射进樊九皋胯下与曹无极头顶正中间那团最粗大的蓝紫残余磁雷弧心！\n\n“什么？！”\n\n正处于半空劈刀极致的樊九皋眼角瞥见那抹乌红邪光撞上太古残雷，浑身汗毛瞬间倒竖，魂飞魄散地想要收刀暴退：\n\n“小畜生疯了——别撞磁雷！！”\n\n趴在地上的曹无极更是眼珠子瞪裂眼眶：“不——！！”\n\n晚了！\n\n至阴至秽的血炼邪器一头扎进至刚至暴的太古磁髓残雷，就像一桶滚油当场扣进了九天雷池！\n\n“咔嚓——轰隆隆隆隆！！！！”\n\n一团刺目到令人双目失明的紫白毁灭雷球，在不足丈许的狭窄坑沿贴脸轰然炸开！\n\n陈长庚早在挑飞血锥的同一瞬，便一把抄起地上那面青铜隔味阵盘护住胸脸，整个人顺势扑倒在断盐柱内侧的凹槽死角里！\n\n狂暴的太古磁雷电蟒疯狂肆虐撕扯！\n\n首当其冲的曹无极连半声惨叫都没来得及吐出，残破躯体连同腰间储物袋便被万道紫白电弧正面贯透，瞬间撕扯成一蓬焦黑血雾！\n\n半空中的樊九皋拼命横起嗜血弯刀死撑九窍罡气，可血道罡气遇上太古磁雷如同烈日融雪，“咔嚓”一声弯刀寸寸崩断，整个人被狂暴雷暴卷入正中！\n\n“啊啊啊——老夫不甘心！！”\n\n仅仅撑了半息，不可一世的血河宗九窍巅峰霸主樊九皋连人带袋在雷光中轰然爆碎，化作漫天焦炭碎骨洒满乱石沟！\n\n一脚借锥引雷，两大九窍霸主同葬坑前，连半块囫囵骨头都没剩下！\n\n直到刺鼻的焦臭硝烟散开大半，陈长庚才吐出一口带血唾沫翻身跃起，随手将震出细纹的青铜隔味阵盘塞回储物袋。\n\n“轰咔——！”\n\n还没等他喘匀一口气，头顶五丈高的排风黑缝深处突然传来一阵惊天动地的重兵碰撞声，夹杂着玄煞门褚横山气急败坏的怒吼：\n\n“霍千山！上头风眼走不通了，你真要跟老子同归于尽不成？！”\n\n“少废话！交出半株伴生莲，不然今日谁也别想活！！”\n\n霍千山暴戾的咆哮声震得内窟穹顶大块盐岩哗啦砸落，四壁山体挤压的“咔咔”闷响比方才急促了一倍不止！\n\n“上头快见分晓了，最多一炷香霍千山就得杀回来！”\n\n陈长庚眼神一厉，一步抢到晶坑边缘，俯身扶起软倒在碎石血泊里的苏清晏。\n\n三指搭上她冰凉如雪的左腕寸口。\n\n指腹之下，脉象微弱得如同随时会断绝的蛛丝——方才太古死禁崩裂的那记反噬，已将她心脉震断了七八分，五脏生机正飞快涣散！\n\n至多再拖五息，这位天阵宗孤女就得彻底咽气！\n\n此刻四下无人，按理说一走了之最省事。\n\n可陈长庚心里半点迷糊没有——苏清晏方才没留半点私心燃血拍碎了死禁，更要紧的是，后头那条百年前废弃的水底排卤暗沟里藏着三道连修渠老匠都犯怵的乱磁死漩，没她这双堪舆辨脉的眼睛指路，自己背着金山钻进去也是十死无生！\n\n救她，就是买自己活着出墟的命票！\n\n寻常疗伤丹药自带三成火毒，喂进寸断心脉无异于催命砒霜。\n\n陈长庚半息不耽搁，左手探入怀中摸出第一只上古寒玉封匣，“咔”地推开玉盖。\n\n匣内整整五十钱颗粒晶莹、毫无半丝杂质的无瑕道髓晶砂流转着温润白芒。\n\n他毫不肉疼地捻起满满一撮、足有五钱重的无瑕道髓晶砂，捏开苏清晏紧咬的冰冷唇齿送入口中，右手掌心贴在她后心灵台穴，渡入一缕温和纯正的气血轻轻一催！\n\n昏死之中的苏清晏眉头痛苦微蹙，仅凭最后一丝求生本能咽下了化开的晶液。\n\n“嗡……”\n\n零丹毒的精纯道髓本源一入腹，便如滚烫春水般瞬间裹住她寸断濒死的心脉裂口！\n\n苏清晏依旧双目紧闭人事不省，但原本死灰一片的唇色肉眼可见褪去几分乌青，微弱却平稳的呼吸重新在鼻端续了上来！\n\n“五钱髓晶吊住命根子，值了！”\n\n陈长庚松开手将她平放在炭箱旁，手脚麻利地取出贴身那只旧锁灵寒玉匣，将第一只上古寒玉封匣里剩下的四十五钱无瑕道髓晶砂尽数倒换进去封严揣稳。\n\n紧接着，他把怀里另外两只空置的上古寒玉封匣一并掏出来，整整齐齐三只巴掌大的上古锁灵寒玉封匣全数腾空摆在坑沿！\n\n刚腾空匣子，上层风缝里忽地传来梁世勋凄厉的惊叫：“钱老头挡住！霍疯子砍过来了——”\n\n时间紧迫到了极点！\n\n陈长庚一个箭步跃至晶坑后壁。\n\n眼前是一面足有两尺厚、被百年老卤混着生铁汁浇铸得严丝合缝的乌黑封石墙，石缝后头隐约透出哗哗暗流声——正是直通外泽的古排卤暗沟！\n\n靠铁钎硬凿至少得一炷香，动静还会把上头的人全招下来！\n\n“该你们出力开饭了，给爷啃穿它！”\n\n陈长庚右手一拍腰间寒铁虫瓮！\n\n“嗡——！！”\n\n三十六道暗金细影如离弦黑电倾巢激射而出！\n\n经过毒泥二次蜕壳的三十六只嗜铁煞甲虫一扑上百年排卤封石，锋利如神兵的口器立即对准石砖之间浇铸的生铁合缝疯狂啃噬起来！\n\n“咔嚓、咔嚓、沙沙沙……”\n\n连通窍九窍兵刃都难劈开的百年老卤生铁封浆，在这群专吃精铁凶煞的异虫嘴里简直跟酥糖没两样！\n\n大片大片的铁渣黑粉簌簌剥落，仅仅十几个呼吸的工夫，封石墙正下方咔嚓一声塌开一道三尺见方、刚好容一人弯腰钻入的漆黑豁口！\n\n一股夹杂着腐苇与大泽苦咸水汽的阴冷暗风，瞬间从豁口深处扑面涌出！\n\n排卤暗沟，通了！\n\n陈长庚指尖母印一引，三十六只吃饱铁浆的二蜕煞甲虫一只不少，闪电般飞回腰间寒铁虫瓮锁紧。\n\n他反手将那只底层裹藏着蚀纹石臼的试阵铁木炭箱用麻绳死死勒在自己后背上，纵身跳进三尺深的晶坑底部！\n\n古老石槽内，丈许长的碗口粗紫金伴生空晶壳已震开裂口、溅满曹无极污血，中心内槽里尺半长、天然分作三节的“地母玄晶矿髓”正流转紫金星河，恰可折入三只巴掌大寒玉匣！\n\n“起！！”\n\n陈长庚右手滑出九寸三分的百炼乌金破甲分水刺，沿着伴生空晶壳的内槽接缝猛然插到底，双臂三千五百斤暗金巨力轰然暴吐，向上狠狠一撬！\n\n“咔嚓——嗡！！！！”\n\n伴着一声清脆如龙吟的晶石剥离声，整条六七斤重、凝重如汞的紫金地母玄晶主髓，被他硬生生从伴生空晶壳里连根撬离而起！\n\n然而，就在主髓离槽、璀璨紫金霞光骤然向内一敛的同一刹那——\n\n“轰咔——！！！！”\n\n头顶五丈高处的上层排风石缝，突然被一道狂暴绝伦的丈许赤炎戟罡从内向外生生劈炸崩裂！\n\n碎石火雨漫天飞溅，浑身浴血、状若杀神的霍千山左手提着玄煞门褚横山死不瞑目的滴血头颅，右手倒拖赤炎战戟自高处悍然跃回内窟石笋，低头一眼瞥见窟底晶坑里尚未散尽的那抹紫金余芒，当场发出一声震碎四壁盐柱的暴怒雷吼：\n\n“底下藏着地脉主髓？！哪个狗胆包天的贼子敢动某家的机缘——给某家滚出来受死！！”"}, {"n": 81, "title": "封壁嫁祸", "body": "五丈高的石笋断崖上，赤红火影裹着浓烈血腥压顶扑落！\n\n“底下藏着地脉主髓？！哪个狗胆包天的贼子——给某家滚出来！”\n\n霍千山暴戾的雷吼震得晶坑四壁碎盐乱蹦。\n\n古盐墟乱磁禁空，哪怕这位器堂九窍巅峰霸主也不敢凌空虚渡，只能左手拎着褚横山滴血的首级，右脚重重踏碎凸出的盐岩笋尖，如一头下山赤虎般顺着陡峭盘道疾掠而下！\n\n身后高台上，器堂副手谭铸带着四五名浑身浴血的精锐紧随呼啸：“围死东坡！别叫底下的耗子钻进黑雾！”\n\n五丈盘道，九窍巅峰全速扑落不过四五个呼吸！\n\n三尺深的晶坑底下，齐腰浓雾翻涌。\n\n陈长庚半声不吭，连抬头看一眼的工夫都省了。\n\n他双臂三千五百斤暗金锻骨劲一吐，双手顺着怀里那条尺半长、凝重如汞的紫金地母玄晶主髓天然三道竹节纹猛然一折！\n\n“啪、啪！”\n\n两声极轻的脆响，整条六七斤重的绝世主髓应声分作均匀三截，璀璨夺目的紫金星河霞光刚要外溢，陈长庚已探手抓过坑沿并排敞开的三只巴掌大上古锁灵寒玉封匣！\n\n一截入一匣！\n\n“咔、咔、咔！”\n\n三道刻满锁灵古篆的寒玉匣盖严丝合缝推死，刺目紫金宝光连同磅礴地脉灵韵瞬间被隔绝得一干二净！\n\n陈长庚手腕翻飞，两只封匣塞入储物袋最底层，第三只贴胸揣紧，顺手抓起地上那面带细纹的青铜隔味阵盘一并收妥。\n\n此时霍千山已连踏三处石台，距离底窟断盐柱不足十丈！\n\n偏偏就在这一瞬，右侧坍塌的斜坡风缝里骤然冲出两道血糊糊的狼狈人影！\n\n“紫金霞光！底下果真有古墟主脉至宝！”\n\n披头散发、右肋玄铁灵甲碎裂的梁世勋一眼瞥见坑口尚未散尽的一缕淡紫残晕，布满血丝的眼珠子瞬间红得滴血！\n\n他身边只剩一个断了左臂、满脸焦黑的老仆钱老头，先前带进风缝的五六名梁氏护卫早已死绝。\n\n“公子小心！霍疯子就在后头！”钱老头嘶声提醒。\n\n“怕个屁！没了青罡替劫符，抢不到主脉神物回宗也是废人一个！”\n\n梁世勋咬碎钢牙，左手死死扣住一把乌黑毒砂，非但不退，反而猫腰贴着右侧乱石风口疾绕而下，妄图赶在霍千山落坑前抢先截胡：“钱老头，给本公子拦住西口两息！”\n\n“梁世勋？！你这条丧家之犬也敢跟某家抢食？！”\n\n半道上的霍千山瞥见右侧鬼祟黑影，怒火直冲天灵盖，右手丈一赤炎战戟猛然轮圆，隔着七丈黑雾对着晶坑外沿轰然一戟劈落！\n\n“都给某家留下！”\n\n“轰咔——！”\n\n霸道纯阳戟罡犁碎三根粗大断盐柱，碎石烂泥如暴雨般朝着晶坑倾泻而下！\n\n浓雾掩护下，陈长庚早已跳出晶坑边缘。\n\n他后背麻绳死死勒紧那只裹藏蚀纹石臼的试阵铁木炭箱，左臂一把抄起人事不省的苏清晏扛上肩头，弯腰便朝后壁那道三尺见方的排卤暗沟豁口钻去！\n\n半个身子刚探进冰冷刺骨的豁口，陈长庚耳朵一动，听见右侧三丈外梁世勋踩碎盐渣的急促脚步声。\n\n直接钻进去，霍千山和梁世勋扑到坑边瞧见后壁新开的规整豁口，准得合兵一处顺沟追杀！\n\n陈长庚眼底寒芒一闪，脚步硬生生顿了半息。\n\n他探出右手，五指如铁钳般扣住坑沿那具丈许长、碗口粗细的紫金伴生空晶壳裂口，咔嚓掰下脸盆大一块沾满曹无极腥臭精血与点点紫金碎屑的空晶壳！\n\n“想要宝贝？接着！”\n\n陈长庚压低喉骨，借着轰隆隆的塌石巨响，反手将那块染血紫金空晶壳贴着浓雾地面，不偏不倚抛到了右侧刚冲出石影的梁世勋脚背前！\n\n与此同时，他左手自储物袋摸出两块鸡蛋大小、赤红滚烫的高纯地火精石——袋中十块精石瞬间只余八块——连同半袋破禁生铁砂与硫粉死死裹在一处，反手狠狠拍进豁口头顶早已松动的百年排卤石梁裂缝！\n\n“咔嚓！”\n\n两块地火精石撞碎生铁砂，陈长庚扛稳苏清晏，连人带炭箱一头扎进豁口深处的漆黑毒水之中！\n\n外头，正埋头猛冲的梁世勋冷不防见一团紫金血光滚到靴尖前，下意识伸手一捞：“到手了？！”\n\n入手却是轻飘飘半边空壳，内槽空空如也，只沾着一手温热腥臭的污血！\n\n“空的？！哪个天杀的把里头的矿髓撬走了——”\n\n梁世勋惊怒失声的话音还没落！\n\n“轰隆隆——！”\n\n三丈外晶坑后壁头顶的地火精石硫雷袋轰然引爆！\n\n原本就被三十六只二蜕煞甲虫啃空根基的两尺厚封石墙，连同上方数万斤风化黑磁岩层齐根坍塌，眨眼间将那道三尺见方的排卤暗沟入口砸得严严实实，激起漫天呛人黑烟！\n\n“哪里走！”\n\n就在浓烟炸开的同一息，霍千山魁梧浴血的身影重重砸落坑前！\n\n他挥戟荡开烟尘，一双虎目扫过满地曹无极与樊九皋残留的焦黑碎肉，再猛然钉死在三步外正蹲在乱石堆旁、手里捧着半块染血紫金伴生空晶壳的梁世勋身上！\n\n而梁世勋身后，独臂钱老头恰好刚从坍塌石壁侧翼的风口缩回脚步！\n\n“梁世勋！！”\n\n霍千山眼珠子瞬间瞪裂，额角青筋暴跳如雷：“好哇！怪不得你在上头风缝假装不敌逃窜，原来早派了梁家死士躲在窟底撬走地脉主髓，还敢炸塌石穴毁迹？！”\n\n梁世勋吓得手一抖，差点把空晶壳扔出去：“霍千山你放屁！本公子也是刚冲下来捡到这半块空壳！”\n\n“刚下来？曹无极和樊九皋尸骨未寒，满窟除了我器堂和你梁家，还有第三个活人？！”\n\n赶到的谭铸指着钱老头脚边的塌石新土，厉声怒喝：“师兄你看！钱老狗就站在塌石口外头，定是他们把主髓塞进密穴，或是叫死士吞带藏起来了！”\n\n“把地脉主髓交出来！”\n\n霍千山半句辩解都不听，将褚横山首级往腰间一挂，双手高举赤炎战戟，狂暴纯阳赤炎劲轰然炸开：“今日不吐出神髓，某家把你主仆二人剁成肉酱！”\n\n“霍疯子！你独吞半株伴生煞莲还不够，竟敢找借口杀同门灭口？！”\n\n梁世勋又急又怒，眼见霍千山战戟当头劈至，深知退让必死，当即狰狞嘶吼着一把扯过身旁的独臂钱老头往前猛推：“钱叔替我挡他一戟！”\n\n“公子——啊！”\n\n忠心耿耿的钱老头连惨叫都没喊完，便被赤炎战戟连肩带胸劈成两截血尸！\n\n梁世勋借着老仆鲜血喷溅的刹那抽身暴退，挥起残破短剑与扑上的霍千山、谭铸在塌石废墟上亡命厮杀在一处！\n\n怒骂声、兵刃硬撞声隔着数万斤坍塌巨岩，渐渐变作沉闷微弱的震颤。\n\n石壁之后，是一条宽约四尺、高仅五尺余的百年废弃排卤暗沟。\n\n漆黑恶臭的老卤毒水漫过腰际，水底遍布尖锐盐刺。\n\n陈长庚口含一颗辟毒丸，后背勒着铁木炭箱，双臂稳稳托住背上的苏清晏，深一脚浅一脚蹚着冰冷黑水飞快走出十余丈，彻底拉开了塌方震波范围。\n\n刚转过一道弯曲石壁，背上一直气息微弱的苏清晏胸口忽然剧烈起伏了一下！\n\n五钱零丹毒的无瑕道髓晶砂经过方才剧烈颠簸，已在她心脉间彻底化开。\n\n“咳……噗！”\n\n苏清晏猛地侧头，一口淤塞心窍的乌黑逆血喷在毒水里，紧闭的长睫剧烈一颤，骤然睁开了那双寒星般的冷眸！\n\n黑暗水声中，重伤初醒的本能快过神智！\n\n她察觉自己正被人死死扣在背上，右手五指闪电般自袖口滑出一根锋利如刃的八棱试脉铁钎，反手一横，冰冷刺骨的钎尖不偏不倚，死死抵住了陈长庚右侧脖颈跳动的大动脉！\n\n“别动。”\n\n嘶哑却清冽似冰的嗓音，贴着陈长庚耳根冷冷响起：“谁？！”"}, {"n": 82, "title": "暗渠抵账", "body": "冰冷锋利的八棱铁钎紧贴颈侧皮肤，只要往前送出半寸，便能挑破大动脉。\n\n陈长庚脚步稳稳停在齐腰深的黑卤毒水里，连脖子都没偏一下，双手依旧托着她湿冷的膝弯，只用平淡温和的嗓音低声道：\n\n“苏仙师，是小人陈长庚。”\n\n“咱们已经进古排卤暗沟了，外头后壁刚炸塌，霍千山听不见这儿的动静。”\n\n背上的苏清晏呼吸一滞。\n\n神智迅速回笼，她先听清了四周哗哗流淌的地下水响，旋即下意识内视心口——原本被太古磁髓死禁反噬震断七八分、本该必死无疑的心脉裂口，此刻竟裹着一层温润醇厚、毫无半丝丹毒排异的精纯髓力，正源源不断续住她的五脏生机！\n\n绝品零丹毒的护脉灵物？！\n\n云泽宗哪怕是内门丹房的上等净髓引，也绝无这般纯粹剔透的药性！\n\n更让她心神微震的是，按两人入墟前签下的地脉血契，方才死禁反噬她昏死坠地、强敌环伺之际，陈长庚完全可以卷走坑底机缘独自钻沟逃命，竟半点不曾违契弃她！\n\n抵在颈侧的八棱铁钎缓缓移开半寸，却仍未收回袖中。\n\n“曹无极和樊九皋呢？”苏清晏声音虚弱，却字字清醒。\n\n“曹无极的血煞破禁锥撞上了死禁残雷，把他们两个一块炸成灰了。”\n\n陈长庚省去细节，随口报了结果，又诚恳补了一句：“仙师心脉快断了，小人斗胆给仙师喂了一撮早年侥幸淘来的伴生净髓砂吊命，多有冒犯。”\n\n苏清晏指尖微紧，清泠眸子在黑暗中盯着他后颈：“那等毫无丹毒的髓砂，放到内门也抵得上三十枚整灵石……你按契丢下我便是，何苦下这般血本？”\n\n“仙师这话就外道了，小人算的是活命实账。”\n\n陈长庚半点不邀虚功，迎着阴冷暗风坦然交底：“小人买过前代盐工的修渠草图，这条荒废百年的排卤暗沟虽然通外泽，中段水底却藏着三处随着地磁乱转的夺命死漩。”\n\n“莫说小人这双肉眼凡胎，便是当年修沟的老师傅掉进去也得绞成碎肉。”\n\n“小人把仙师丢在坑里，自己背着家当钻进来也是十死无生——五钱髓砂换仙师一双堪舆神眼指路，这笔买卖小人不亏。”\n\n暗沟里静了两息，只有毒水拍打石壁的轻响。\n\n苏清晏苍白如纸的唇角极轻微地动了一下，冷冷偏过头，将八棱试脉铁钎彻底滑回袖中：\n\n“满嘴铜板账。”\n\n嘴上挤兑了五个字，她紧绷如弓的脊背却真真正正松了下来，虚弱地靠在陈长庚宽厚稳当的肩背上。\n\n在这人吃人的绝渊底下，一句摆在桌面上的利害明白账，远比孙奉先、霍千山之流满口仁义道德可靠百倍。\n\n“前面十丈水温骤冷，第一道乱磁水漩就在拐角底下。”\n\n苏清晏强提一丝神念感应水波地气，清泠叮嘱：“离申时古墟合拢最多只剩七个时辰，放慢脚步，听我叩肩指位。”\n\n“好嘞，全听仙师吩咐！”\n\n陈长庚应了一声，正要迈步转过石弯！\n\n“哗啦——轰咔！”\n\n斜前方三丈外，暗沟穹顶一口连通上层岩缝、早已干涸半截的排烟渗水竖井内，忽然砸下一大片带血的碎石烂泥！\n\n紧接着，一道浑身浴血、左肩几乎被战戟劈穿的凄厉人影，从丈许高的竖井滑道里狼狈滚落，双手死死抠住井口下沿一根锈蚀横铁梁，悬在半空剧烈喘息！\n\n竟是在外头被霍千山杀破胆、侥幸滚进坍塌岩缝死里逃生的梁世勋！\n\n“咳咳……霍千山你个狗杂种，等本公子活着回宗，定叫族叔扒了你的皮……”\n\n梁世勋吐出一口血沫，正要往暗沟下探脚，耳朵猛地捕捉到三丈外拐角阴影里极轻微的蹚水声！\n\n乱磁黑雾伸手不见五指，梁世勋看不清阴影里是谁，心头却骤然窜起一股溺水疯狗般的狂喜与狠毒！\n\n“底下有人？！是哪个门派的杂碎躲在水沟里？！”\n\n梁世勋左手死死吊住铁梁，右手猛地扯开腰间一只猩红皮囊，也不管底下是谁，对着水声传来的黑暗拐角劈头盖脸便扬出了漫天暗红毒砂：\n\n“不想被本公子的腐骨血砂化作脓水，立刻把身上的疗伤宝药和灵石扔过来，再过来给本公子垫脚探路！！”\n\n“嗤嗤嗤——！”\n\n上千粒歹毒无比的腐骨血砂遇风散成丈许毒云，所过之处连黑卤水面都滋滋腾起腥臭白烟，将狭窄暗沟封得严严实实！\n\n寻常修士在这四尺宽的死胡同里，非退即挡！\n\n可后退一步惊起大水花便会暴露具体身位，硬挡则必沾剧毒血砂！\n\n“莫退！水下三尺，左跨两步踏尖石！”\n\n千钧一发之际，背上的苏清晏咽下喉头翻涌的逆血，右手食指在陈长庚左肩骨上重重连叩两下！\n\n陈长庚对她的堪舆准头没有半丝怀疑，身形不退反进，猛然深吸一口气沉腰矮身，左脚顺着漆黑水底斜跨两步，草鞋底精准踩中一块凸起尺许的滑腻磁礁！\n\n“呼——！”\n\n就在他跨上磁礁的刹那，右侧两尺外的水底恰好卷起一股怪异的逆向吸风，如无形漏斗般将漫天飘落的腐骨血砂尽数扯偏，贴着陈长庚后背铁木炭箱擦边落入深水，连半粒毒砂都没沾上衣角！\n\n“嗯？！没叫唤？！”\n\n悬在竖井铁梁上的梁世勋没听见惨叫，心头大骇，伸手又要去掏第二把毒砂：“给脸不要脸的狗东西，给本公子死——”\n\n“送他下去。”\n\n苏清晏冷眸如霜，左手自袖中摸出两根缠着半截导磁银丝的细长试脉针，借着陈长庚稳如磐石的肩头一托，指尖凝起仅存的一缕气机，隔空将两根铁针悄无声息弹入梁世勋正下方的暗沟漩心！\n\n“叮、嗡——！”\n\n两根导磁铁针一钉入水底暗礁，原本平静流淌的黑卤水面骤然向内塌陷尺许！\n\n潜伏百年的第一道乱磁水漩被外铁引偏阵位，狂暴扭曲的地磁吸力陡然暴涨三倍，连带着上方竖井湿滑石壁猛烈一震！\n\n“咔嚓！”\n\n梁世勋左手抠住的那截百年锈铁梁应声崩断！\n\n“什么鬼东西——不！！”\n\n梁世勋一脚踏空，“噗通”一声重重砸进正下方的乱磁水漩中心！\n\n恐怖的暗流绞力瞬间撕碎他残存的护体真气，将他整个人像水草般狠狠扯入水底，撞得头破血流，连呛数口剧毒黑卤，转眼被狂暴涡流卷进了右侧一条黑漆漆的狭窄泄水岔洞深处，惨嚎声顷刻没了踪影！\n\n随着梁世勋被卷走，水底两根细针崩断，乱磁水漩缓缓平复归位。\n\n陈长庚这才从风眼死角直起身子，看了一眼右侧那条幽深岔洞：“那姓梁的命硬，被冲进侧岔暗河了，没当场绞碎。”\n\n“残废之躯入了盲岔，十有八九困死里头，不必费手脚追。”\n\n苏清晏额头渗出细密冷汗，方才那一针已耗尽她刚攒起的一丝力气，声音愈发轻浅：“走，前面还有两道水漩。”\n\n接下来小半个时辰，暗沟愈发曲折低矮，头顶不时传来古盐墟山体缓慢挤压的沉闷“咔咔”声。\n\n靠着苏清晏在背上叩肩指位——“右贴壁三步”“踏暗桩跃四尺”，陈长庚将通窍九窍的扎实下盘发挥到极致，险之又险地擦着另外两处夺命水漩边缘穿行而过。\n\n直至丑末寅初，苦咸湿冷的外泽水汽扑面浓重起来。\n\n陈长庚托着苏清晏跃上一处高出水面两尺的干爽修渠石台，将她轻轻扶靠在干燥岩壁上喘息。\n\n苏清晏闭目调息了十几个呼吸，睁开眼，一言不发地探手入怀，从贴身内袋取出一卷边缘染着她心头干涸血迹的暗青兽皮古卷，递到陈长庚面前。\n\n“拿着。”\n\n陈长庚垂眸一看，兽皮封角赫然篆刻着四个古朴小字——《地脉敛息阵图》，虽是上半部残本，却是货真价实的天阵宗核心真传，并非拓印副本！\n\n“仙师这是做什么？咱们说好三七分账，前头在古阁你已经给过避风图了。”陈长庚没立刻伸手。\n\n“一码归一码。古墟死禁是我自己要破的，你死挡曹无极十息，又喂我五钱绝品髓砂，这条命是我欠你的。”\n\n苏清晏性子清冷骄矜，最厌拖欠人情，直接抓过陈长庚粗糙的大手，将染血兽皮真本重重拍进他掌心：\n\n“此卷不仅能将修士自身气血神华敛如死石，更能借地脉泥煞布封灵纹，隔绝开脉修士神念探查。”\n\n“收好它，你我命账两清。”\n\n遮掩重宝、隔绝开脉神念？！\n\n陈长庚心头猛地一跳——怀里那三匣地母玄晶主髓和日后蚀纹石臼开炉，缺的不正是这桩保命真传么！\n\n这女人出手倒是实诚得紧！\n\n陈长庚不再矫情推辞，郑重将半部《地脉敛息阵图》贴肉收好，拱手低声道：“那小人便厚颜收下了，多谢苏仙师。”\n\n话音刚落，他眉峰骤然一凛，一把按住苏清晏肩头示意禁声！\n\n前方不足二十丈外、隐约透进微弱惨白雾光的暗沟出口水底，突然传来一阵“刺啦、刺啦”的刺耳金铁摩擦声——竟是有人在外头拿长柄铁钩，挨寸刮探水下拦路铁栅！"}, {"n": 83, "title": "推虎填网", "body": "“刺啦——当啷！”\n\n沉闷的铁钩刮擦声顺着黑卤水面一路传进石台，每一记都刮在两人心弦上。\n\n苏清晏脸色微变，压着气音道：“正门炸塌，玄煞门竟连这处荒废百年的排卤水口也派了暗哨？！”\n\n“严老狗连自家主将褚横山都舍得活埋，做事自然滴水不漏。”\n\n陈长庚神色冷静如常，扶着苏清晏贴着无声岩壁缓缓滑回浅水，指了指她腰间：“仙师把天阵宗的高阶敛息玉符贴紧心口，千万莫露半丝气机，小人去前头瞧瞧虚实。”\n\n苏清晏颔首照做，莹白玉符一贴上衣襟，周身微弱波动瞬间如泥牛入海。\n\n陈长庚自己也催动敛息玉符，放轻草鞋，猫腰蹚水摸到距离出口尚有五丈的一道狭窄岩折处。\n\n他先伸出右手，探进左侧高出水面三尺的一道隐蔽斜石缝里往里一摸——粗糙指腹稳稳触到一只裹了三层猪尿脬油布的沉甸甸小包！\n\n正是两天前潜滩核验暗沟时，他提前预埋在此处的退路后手！\n\n陈长庚解开油布摸了一把，两颗塞满精纯硫煞的赤阳雷火弹棱角完好、半点未潮，外加一只备用的空封晶寒玉小匣，分毫不差落回怀中。\n\n收好雷火弹，他屏住呼吸，借着齐胸深的浑浊黑水掩护，悄无声息摸到暗沟最尽头那扇百年精铁拦水栅内侧两步外。\n\n透过锈迹斑斑、茶碗粗的精铁栅栏缝隙往外望去——\n\n外头已是沉渊古盐墟西南断崖根下的恶臭浅滩。\n\n灰白毒雾里，七八名身穿玄煞门黑铁劲装的精锐正呈扇形守在出水口外！\n\n居中两名抱臂督阵的凶悍头领气息雄浑迫人，赫然全是通窍九窍的好手；尤其左侧那个满脸横肉的刀疤壮汉，手里倒提着一柄丈二长的倒刺分水大铁钩，脚下烂泥里更铺开了一张足有两丈见方、挂满精钢倒钩的捕兽大铁网，正好严严实实罩住整座排卤暗沟出口！\n\n“寇大哥，咱们在这臭泥沟子泡了快一个时辰了，连根死人毛都没见着！”\n\n旁边一名玄煞门八窍副手甩了甩铁钩上的黑泥，低声抱怨：“严长老十八块断龙硫雷砖把正门炸得连苍蝇都飞不出来，云泽宗那帮蠢货早闷死在里头了，哪还会钻这绝户废沟？”\n\n“少放屁！严长老发过死令，百年前修盐场的苦力留过野账，说西南崖底有条通内窟的排卤盲沟！”\n\n刀疤壮汉寇铁山吐了一口浓痰，三角眼恶狠狠盯着精铁栅栏：“万一云泽宗那群世家肥羊里头有懂门道的，揣着伴生煞莲从水底下溜出来，漏走一个，严长老就得剥了咱哥俩的皮！”\n\n“都给老子打起精神，每隔半刻钟拿长钩捅一遍铁栅！但凡网里动一下，乱钩齐下先捅成筛子再搜尸！”\n\n“是！”六名八窍门徒齐声应命，铁钩将水口封得水泄不通。\n\n栅栏内侧阴影里，陈长庚眯起双眼，心头飞快盘算。\n\n这扇百年精铁栅栏底部的两处生铁合页轴心，早在入墟前就被他放嗜铁煞甲虫啃空了九成，只留着薄薄一层铁皮挂样子，他一脚便能踹开。\n\n难的是栅外那张罩死出口的精钢倒刺大网，以及守在三步外的寇铁山两名九窍高手！\n\n一旦硬闯或扔出怀里仅有的两颗赤阳雷火弹，爆炸巨响立刻会把高空游弋的玄煞门接应长老引下来，背着毫无战力的苏清晏绝难逃出生天！\n\n缺一个能替他们把外头这张铁网填满的活靶子！\n\n念头刚转到这里——\n\n“哗啦啦！”\n\n右后方三丈外，一条连通地下暗河的狭窄回水石缝里，突然翻起一团浑浊血水！\n\n一道浑身被毒卤泡得焦烂浮肿、右肋白骨外翻的人影，竟顺着回水暗流连滚带爬冲了出来，一头撞在暗沟浅滩石壁上！\n\n正是方才被乱磁水漩卷进侧岔暗渊、凭着九窍深厚根基硬生生保住最后一口气的梁世勋！\n\n“咳……水口！亮光……天不绝我梁世勋！”\n\n死里逃生的梁世勋一眼瞧见前方透进雾光的铁栅，又瞥见蹲在栅前黑水里的陈长庚与后方石壁下的苏清晏，那双溃烂充血的眼睛骤然瞪圆！\n\n“是你们两个狗男女？！”\n\n梁世勋求生欲彻底压垮了理智，扑上来一把死死揪住陈长庚的小腿麻裤与岸边水草，破风箱般的嗓子压着恶毒嘶声：\n\n“外头有玄煞门伏兵是不是？！挑箱的贱种，你身上肯定还藏着火珠雷弹！立刻给本公子冲出去炸开水口，把玄煞门的人往北边引开——不然本公子现在就扯嗓子大喊，大家一块死在这儿！！”\n\n梁世勋张开满是血污的嘴，胸腹残余真气猛提，眼看就要朝着五步外的铁栅放声嘶吼！\n\n陈长庚低头看着这头自己送上门来的替死肥羊，眼底没有半丝波澜，只有一片冰冷笑意。\n\n正愁没肉填网，梁公子倒是赶着来送枕头！\n\n“梁师兄想先走？小人这就送你一程！”\n\n不等梁世勋喉咙里挤出半个字，陈长庚左手如铁箍般闪电探出，一把死死掐住他仰起的下颌将大嘴合拢！\n\n同一刹那，右袖滑槽内九寸三分的百炼乌金破甲分水刺悄无声息滑入掌心，乌黑锋刃顺着水下连闪三记寒光！\n\n“噗、噗、噗！”\n\n前两刺精准挑断梁世勋双手手腕大筋，第三刺贴着他咽喉侧翼狠辣斜划半寸，瞬间割断他半截发声气嗓，却偏偏留住颈侧动脉没叫他当场咽气！\n\n“唔——嗬嗬！！”\n\n梁世勋双手瞬间瘫软如泥，喉咙里再也吐不出半句完整人言，只剩下剧痛绝望的野兽嘶鸣！\n\n陈长庚看都不看他一眼，伸手扯出梁世勋塞在怀里遮掩的那枚巴掌大、雕着云纹青鹤的“梁氏嫡脉青玉佩”挂回他外腰最显眼处，随即飞起右脚，三千五百斤暗金巨力对着精铁栅栏底部早已虫蚀中空的薄铁皮合页狠狠一脚踹落！\n\n“咔嚓——哗啦！！”\n\n仅剩一层脆皮的百年铁栅下半截应声向内折断，暗沟里积蓄多时的漆黑毒卤瞬间化作一股汹涌激流向外狂泻！\n\n“去吧您呐！”\n\n陈长庚双手抓住梁世勋后领往外猛地一送，将这具活生生抽搐嘶嚎的九窍躯体，顺着狂涌黑流笔直推进了栅外正中央那张精钢倒刺大网里！\n\n“哗啦——嗬嗬嗬！！”\n\n大网剧烈绷紧翻滚，数十枚精钢倒钩当场扎穿梁世勋皮肉！\n\n“动了！网里有大鱼冲出来了！！”\n\n守在岸边的玄煞门副手眼睛一亮，扯着嗓子狂喜大叫！\n\n“收网！快给老子拉上来捅死！”\n\n寇铁山精神大振，一个箭步冲进浅滩，双手猛拽铁网总纲，低头一眼瞥见网中血人狂乱挣扎的通窍九窍气血，以及腰间那块在毒水里莹光流转的云泽宗梁氏嫡脉青玉佩，顿时仰天发出一声狂喜怪叫：\n\n“哈哈哈哈！通窍九窍！还是云泽宗内门梁家的嫡系公子哥儿！严长老神机妙算，真叫咱们蹲着携宝逃命的大肥羊了！弟兄们并肩子上，先乱钩捅死再剥他的储物袋！！”\n\n“杀！头功是咱们的了！”\n\n栅外七八名玄煞门好手贪心大炽，一窝蜂全涌到铁网北侧浅滩，七八把长柄倒刺铁钩带着凶悍劲风噗噗噗疯狂往梁世勋胸腹乱扎下去！\n\n梁世勋连半个字都喊不出来，绝望怨毒的目光死死瞪向漆黑水底，不过两息便被乱钩捅成了血筛子，彻底断绝生机！\n\n剧烈扑打与污血翻腾，将整片断崖水口搅起漫天丈许高的墨黑毒泡，彻底遮死了水下视线！\n\n就是现在！\n\n早已退后两步拽住苏清晏手腕的陈长庚运转水下龟息功，两人如两条毫无声息的贴泥游鱼，趁着玄煞门全员围网抢尸的盲区，紧贴着断崖根底三尺深的漆黑腐泥凹槽，顺着暗流滑出了铁栅缺口，几个起落便潜入了茫茫沧溟外泽的深水芦苇荡！\n\n水底闭气疾潜，两人手腕相扣，半点水花未露，一口气顺着水底暗渠潜出足足三里开外，远离了西南断崖封锁圈。\n\n直到周遭水色转清，陈长庚才托着虚弱不堪的苏清晏，借着一丛枯黄茂密的野芦苇掩护，悄无声息将口鼻探出水面半寸换气。\n\n刚吸进第一口微凉的泽畔晨风——\n\n“轰隆隆——！”\n\n三里外的西南断崖高空，浓重白雾骤然被一道横贯百丈、宛如实质青色蛟龙般的恐怖开脉境剑罡硬生生劈成两半！\n\n云泽宗开脉境执法长老许镇岳震怒欲狂的滚滚雷音，裹挟着令人胸口发闷的磅礴威压，轰然炸响在整片沧溟大泽上空：\n\n“玄煞门严老贼！敢用断龙雷活埋老夫宗门子弟——云泽铁甲卫听令！给老夫拉起锁江铁索封死南岸十里水面，不论死活，一只苍蝇也不准放过去！！”\n\n“哗啦啦啦——！”\n\n伴随着沉重号角声，数十条碗口粗的乌黑锁江精铁索自南岸大营两侧水寨同时绞起，激起丈高白浪，眨眼间将整片通往归宗大营的水面封锁得如同铁桶一般！"}, {"n": 84, "title": "沉髓留引", "body": "枯黄野苇被晨风吹得哗哗乱响，水面每隔十来丈便拉起一道碗口粗的锁江乌铁索。\n\n“快！东边三号浅滩再下一道倒刺网！”\n\n“许长老发了死令，敢从水下偷渡者，不论敌我一律乱弩射杀！”\n\n一队披着冷锻铁甲的云泽宗铁甲卫撑着快船擦过苇丛外沿，森冷弩箭在灰雾里泛着寒光。\n\n苇荡水下三尺，陈长庚扣紧苏清晏冰凉的手腕，借着腐泥遮掩一寸寸往南岸西侧潜行。\n\n直到钻进三里外一座坍了半边窑顶的前代烧碱废苇窑，两人才踩着烂砖翻上干地。\n\n刚背靠断墙坐倒，苏清晏便偏过头，捂着帕子闷咳两声，唇角又溢出一缕暗黑淤血。\n\n三里外的西南断崖高空，青色剑罡与墨黑煞云撞得天崩地裂，沉闷雷音震得废苇窑顶碎土簌簌往下掉。\n\n“许镇岳与玄煞门的严老鬼缠上了，一时半会儿分不出胜负。”\n\n陈长庚拧干麻衣下摆的毒水，探头扫了一眼外头封锁水面的铁甲船队，眉头微蹙：“就是大营外围箍成了铁桶，咱们眼下这副模样冒头，准被铁甲卫当细作拿了。”\n\n苏清晏缓过一口气，素手按住胸口内袋，抬起清冷眸子看向陈长庚：“返营之前，有一桩事我先与你说清。”\n\n“仙师请讲。”陈长庚蹲回炭箱旁。\n\n“我在内窟左壁拓得苏氏先祖《地脉堪舆总图》残卷之事，出墟之后，绝不可向第二个人吐露一个字。”\n\n苏清晏嗓音微哑，却字字斩钉截铁：“天阵宗内有大族长老盯着这半幅祖传总图，消息一旦走漏，不光我有杀身大祸，你这个同行向导也活不成。”\n\n“至于你在坑底撬走的东西——”\n\n她顿了顿，目光掠过陈长庚鼓囊囊的怀口，冷淡移开视线：“我立过誓分毫不取，便绝不多问一句。”\n\n陈长庚心里暗赞这女人守规矩，脸上憨厚拱手：“仙师放心，小人烂在肚子里。咱们歇过这阵风头，混进伤兵堆里就能登船……”\n\n“混不过去。”\n\n苏清晏直接打断了他。\n\n陈长庚一怔：“咱们有雇契在身，铁甲卫还能硬扣？”\n\n“曹无极、梁世勋两大世家嫡脉全折在里头，百余精锐十不存一。”\n\n苏清晏冷冷看着他：“许镇岳是开脉境中期的执法长老，回宗没法向曹、梁两家交差，每一个活着进辕门的人，他必用开脉神念挨个扫过！”\n\n陈长庚瞳孔骤然一缩：“开脉神念能扫穿储物袋？”\n\n“寻常外门一阶储物袋，还有没刻阵纹的寒玉匣，在开脉神念底下跟一层白纸没两样。”\n\n苏清晏指了指自己心口：“我这卷兽皮图能拿本命心血封进护身阵衣，再借天阵宗客卿体面挡住搜身。你一个七窍杂役，怀里揣着重宝往许镇岳眼皮底下凑，想被当场搜魂么？”\n\n后背瞬间沁出一层冷汗！\n\n陈长庚心脏重重跳了两下——幸亏这女人多提了一嘴！\n\n他如今身上不光揣着地母玄晶主髓、四十五钱无瑕髓晶和九十二枚整灵石，储物袋与袖里还装着两颗赤阳雷火弹、八块高纯地火精石、二阶血遁灵符、乌金破甲分水刺与三十六只二蜕煞甲虫！\n\n一个丙字废渣房筛灰的穷杂役，袋里扫出这堆杀器重宝，根本不用霍千山栽赃，许镇岳一巴掌就能拍碎他的天灵盖！\n\n“多谢仙师提点，救了小人一命！”\n\n陈长庚绝不赌侥幸，当即从怀里摸出那半部真本《地脉敛息阵图》，凑着苇窑破洞透进的微光飞快翻看：“这卷真图上写的‘浊泥封灵纹’，小人现在能现学现用么？”\n\n苏清晏看他反应这般果决，微微颔首：“后三页便是地煞封物法。无需深厚真气，只要拿大泽底下的腐骨黑卤泥混上生铁砂，按九宫逆位抹在外层，只要不被人亲手掰开泥壳，开脉神念扫过也只会当成一块死铁礁。”\n\n“只是泥封之物死重硕大，你总不能抱在怀里进大营。”\n\n“谁说要抱进大营？”\n\n陈长庚眼底精光一闪，嘴角勾起一抹冷冽弧度：“大泽南岸往北回云泽宗，官船必经五里外的‘黑石渡旧水闸’换水候潮——把家当沉在水闸暗桩底下，等夜里上了归宗大船路过时再捞回来，神仙也查不到小人头上！”\n\n苏清晏眸光微动，深深看了他一眼：“主意倒刁钻。但地脉合拢在即，你至多只有三个时辰来回，我在窑里封图等你。”\n\n“够了！”\n\n接下来一个时辰，废苇窑内寂静无声。\n\n苏清晏咬破指尖以心血加固阵衣秘卷；陈长庚则盯紧兽皮古卷，凭着三年熬卤控火练出的精细眼力，将敛息口诀与九道封灵泥纹一字不差烙进脑海。\n\n待日头爬至巳末，陈长庚转过身，背对着闭目调息的苏清晏蹲在铁木炭箱后头，悄无声息掏出三只上古锁灵寒玉封匣。\n\n他推开第三只玉匣，握住百炼乌金破甲分水刺，沿着那一截地母玄晶主髓根部最凝练的髓心关节轻轻一削！\n\n只留拳头大小、约莫两成重的一块紫金核心母引捏在掌心，将削剩的半截并入前两只上古寒玉封匣锁死。\n\n紧接着，陈长庚掀开试阵铁木炭箱底层的恶臭乌卤黑泥，摸到那只灰扑扑、缺了一角的蚀纹石臼。\n\n连开脉老怪都看不穿的太古残器，正是天底下最稳妥的藏宝匣！\n\n他把那块拳头大的地母玄晶核心母引严丝合缝塞进死寂无光的石臼窝心，上头倒覆那整袋七八斤重、毫无灵光的腥臭“百年凝卤髓渣”与两块废硫石。\n\n至于腾出来的第三只空上古寒玉封匣，陈长庚随手混进了苏清晏身旁那堆碎裂罗盘废料里，预备过堂时当废匣摔出去顶账。\n\n随后，他把装有八成地母玄晶的两只上古寒玉封匣、四十五钱无瑕髓晶旧匣、备用封晶寒玉小匣、九十枚整灵石与二阶血遁灵符一并摆开。\n\n又将随身两颗赤阳雷火弹、八块高纯地火精石、青铜隔味阵盘、乌金分水刺、母蜈毒针、《地脉敛息阵图》兽皮原卷及杂项私货悉数掏空，用三层猪尿脬油布死死捆成一团！\n\n洗得发白的低阶储物袋里，只留两枚磨损的下品灵石充作挑箱工钱、两瓶寻常解毒散与半袋破生铁砂，怀里再揣半块西偏废廊捡来的染血玄煞门巡哨铜牌。\n\n他挖来半桶大泽腐骨黑泥掺入生铁砂，十指如飞，按九宫逆位在油布重包外抹出九道古拙泥纹。\n\n泥壳刚一凝干，微弱宝气瞬间断绝，摸上去真如一块泡烂的死泥礁！\n\n“仙师好生歇着，小人去去就回。”\n\n陈长庚将封泥重包捆在腰后滑入暗渠，运起水下龟息功贴泥疾潜五里，赶在午正摸到了荒凉偏僻的黑石渡旧水闸。\n\n潜入两丈深的水闸底槽，他放出一只二蜕嗜铁煞甲虫在第三根青石暗桩背面啃出一道凹槽，用浸油牛筋黑绳将封泥重包死死拴上活扣，外头糊满水草螺壳，这才招回甲虫顺流折返。\n\n一回到废苇窑，陈长庚当即合严腰间寒铁虫瓮，让三十六只二蜕煞甲虫尽数沉入瓮底休眠。\n\n他掬起剩下的腐骨黑泥与生铁砂，同样按九宫浊泥封灵纹将整只寒铁虫瓮裹成一块黑乎乎的死铁泥疙瘩，连同石臼一块拍进试阵铁木炭箱臭泥深处——留它在箱里，夜里路过水闸才有苦力下水捞宝！\n\n此时西南断崖上空的惊天轰鸣终于歇止，玄煞门严长老不敌退走，许镇岳已率铁甲卫退回南岸大营。\n\n自昨夜子初炸门至今已近八个时辰，距离未末申初古墟合拢仅剩一炷香！\n\n陈长庚往破麻袄上抹了两把腥泥，挑起恶臭熏天的试阵炭箱，搀着脸色惨白的苏清晏一瘸一拐摸到了南岸大营辕门十步外。\n\n“站住！哪个堂口的？！”守门铁甲卫横戟厉喝，庶务执事赵怀恩正拿着名册急得满头大汗。\n\n“军爷饶命！寻脉馆苏客卿和挑箱杂役陈长庚，从西边断流泥沟爬回来的！”陈长庚喘着粗气赔笑递上号牌。\n\n赵怀恩猛地抬头，还没来得及开口——\n\n“轰隆隆隆——！”\n\n十里外的沉渊古盐墟方向，万丈地脉岩层发出震耳欲聋的合拢咆哮！\n\n就在两扇千丈石壁彻底咬死闭合的最后一息，一道霸道血红戟罡硬生生自古墟侧翼石缝劈炸冲天！\n\n浑身浴血、铁甲碎裂的霍千山左手拎着褚横山头颅与半株残莲亡命逃出，一眼瞥见辕门前的苏清晏与陈长庚，赤红虎目凶光暴起，扯开嗓子嘶声狂吼：\n\n“铁甲卫封死辕门！把苏清晏和那个挑炭箱的杂种给某家拿下——一个都不准放走！”"}, {"n": 85, "title": "掀箱过堂", "body": "“轰——咔！！”\n\n十里外最后一缕幽蓝乱磁雾气彻底被万钧大地吞没，十年一开的沉渊古盐墟轰然合拢，地面只剩下一道深不见底的死寂石疤。\n\n百余名意气风发杀进古墟的云泽宗三脉精锐，此刻蹲在南岸大营辕门校场里的，算上刚到的苏清晏与陈长庚，满打满算不过十三个带伤活口！\n\n“围起来！”\n\n随着霍千山一声怒吼，二十余名刀剑出鞘的器堂留守弟子与铁甲卫哗啦围拢上来，长戟寒锋直指辕门口的两人！\n\n陈长庚吓得肩膀一缩，慌忙放下肩头那只臭烘烘的试阵铁木炭箱，连退半步躲到苏清晏侧后方。\n\n他脸色蜡黄发白，连大气都不敢多喘一口，把一个刚从鬼门关爬回来的通窍七窍受惊杂役演得活灵活现。\n\n几个呼吸间，浑身血气冲天的霍千山已大步流星冲到辕门前！\n\n他胸前重甲凹陷，嘴角挂着暗红血迹——显然方才在石壁合拢前硬劈侧缝逃命，也挨了不轻的地脉反震。\n\n“霍师侄！内窟到底怎么回事？无极和世勋人呢？！”\n\n校场高台大帐帘幕一掀，身穿紫金执法道袍、颌下三缕铁须的开脉境中期长老许镇岳沉着脸迈步而出，身后跟着曹、梁两家随军管事，人人面无人色。\n\n“回禀许长老！”\n\n霍千山把褚横山首级往青石阶前一扔，抱拳咬牙道：“玄煞门严老贼歹毒绝户，昨夜子初隔界引爆门梁暗藏的十八块断龙硫雷砖，把内窟正门彻底炸死！”\n\n“曹师弟在石拱内侧先中了血河宗樊九皋埋下的阴雷断去一臂，梁师弟在断桥便折了大半护卫，后头混战双双惨遭魔道毒手！弟子拼死斩了褚横山首级、夺下五瓣赤煞伴生莲，九死一生才从西侧风缝劈开血路逃出来！”\n\n这番半真半假的说辞，霍千山路上早编得滴水不漏——把自己埋赤火地雷炸残曹无极、挥戟劈杀钱老头的黑锅，全扣在了死无对证的樊九皋和褚横山头上！\n\n曹、梁两家随军管事听得眼前一黑，当场瘫软在地嚎哭起来。\n\n许镇岳脸色阴沉如水，可低头瞧见地上玄煞门主将褚横山的真首级，紧锁的眉头还是暗暗松了三分。\n\n有这颗魔门主将人头和半株伴生煞莲回宗交账，至少他这个带队督查长老不必背全军覆没的渎职大罪！\n\n“既已夺得首级，速速上药登船——”许镇岳抬手便要下令收兵。\n\n“且慢！许长老容禀！”\n\n霍千山猛地转身，手中丈一赤炎战戟直指苏清晏与缩在炭箱后的陈长庚，双目赤红如狼：\n\n“弟子斩杀褚横山重返内窟底坑时，亲眼瞧见底下太古死禁被人破开，里头孕育的主脉至宝不翼而飞！”\n\n“满场除了死绝的魔修，唯独苏清晏懂破禁之术——他们两个在石拱门开启时便不见了踪影，如今竟全须全尾活着钻出来，底窟重宝定在他们身上！请长老当场搜袋验魂！”\n\n全场哗然！\n\n曹家与梁家管事像是抓住了救命稻草，跳起来尖声叫嚷：“搜！定是这两个外人见死不救，趁乱盗走了少主拿命换来的宝物！”\n\n庶务执事赵怀恩也凑上前阴恻恻帮腔：“苏客卿，事关宗门重宝与两位世家公子死因，还是把储物袋和贴身阵囊交出来叫许长老过目吧！”\n\n十几把雪亮长戟瞬间逼近三尺之内！\n\n苏清晏站在风口，素白衣袂染满泥血，面对满营逼宫一步未退，反而迎着戟尖往前迈出一阶。\n\n“噗——！”\n\n她喉头一甜，一口夹杂着冰碴与内脏碎沫的乌黑心头血，直接喷在了高台前的青石板上！\n\n紧接着，苏清晏反手从袖中抓出那面早已在死禁反噬中崩裂成三截的祖传寻脉铜盘，连同先前腾空混入废料的那第三只上古寒玉废匣，抬手“哐当”一声狠狠摔在赵怀恩面前的核验木案上！\n\n“搜魂？好得很！”\n\n苏清晏清冽嗓音冷得像数九寒冰，目光越过霍千山，笔直刺向高台上的许镇岳：\n\n“昨夜石拱门刚开一道尺半风缝，曹无极背后偷袭褚横山炸开气浪，把本座与挑箱杂役当场震落门槛外侧的西偏废卤沟！本座心脉震裂，毁了苏氏三代单传的本命罗盘与祖传空玉匣才勉强挡住塌方碎石，在臭泥沟里爬了整整七个时辰！”\n\n她猛地抬手指住霍千山鼻子，字字诛心：\n\n“霍师兄方才亲口向许长老禀报，内窟正门已被万钧巨石封死，里头五名九窍巅峰杀得尸骨无存——你倒说说，一个心脉寸断的七窍阵师带一个挑炭杂役，是怎么穿墙钻进你器堂包场的死窟，还能从你霍大统领眼皮底下抢走至宝的？！”\n\n“莫非霍师兄自己私吞了底窟宝物不好交账，还是内窟里头另有见不得人的同门血案，才急着拿天阵宗客卿的脑袋顶缸？！”\n\n霍千山脸色骤变，呼吸猛地一窒！\n\n这一记反问直接戳穿了他的命门！\n\n要是他咬死陈长庚和苏清晏进了封闭内窟还能活着逃出来，那曹无极身上的器堂赤火地雷伤、梁家钱老头身上的赤炎战戟口子万一扯出来，岂不成了他霍千山杀人灭口？！\n\n高台上的许镇岳眼神也瞬间冷了下来，怀疑地瞥了霍千山一眼。\n\n天阵宗虽非顶尖霸主，却是云泽宗护山大阵常年仰仗的盟友，无凭无据搜魂一名天阵宗真传孤女，传出去他许镇岳也担不起这桩外交恶名！\n\n“胡闹！”\n\n霍千山额角青筋乱跳，强行压下心虚，硬着头皮咬牙改口：“就算你们在门槛便震落西偏废沟、未曾踏入内窟核心，西廊一带亦有灵物散落！苏客卿是天阵宗贵客搜不得，这个本宗丙字房的贱役总不姓苏吧？！”\n\n话音未落，霍千山满腔邪火无处发泄，大步上前飞起一记重脚，灌足千斤蛮力，“嘭”地一脚狠狠踹在陈长庚脚边那只试阵铁木炭箱上！\n\n“哗啦——啪！”\n\n铁木炭箱翻滚着撞上石柱，箱板应声崩裂！\n\n没有一丝灵光霞气！\n\n满满一箱乌黑粘稠、裹着百年凝卤臭渣的烂泥混着两块废硫石泼了一地，一股如同陈年死鼠烂在粪坑里的刺鼻恶臭瞬间熏得周围十几名铁甲卫掩鼻暴退！\n\n箱底泥浆里头，半截灰扑扑、缺了一角的死石窝子，连同一块抹死九宫浊泥封灵纹的锈铁泥疙瘩咕噜噜滚了两圈，沾满黑垢，连喂狗的破烂都不如！\n\n“哎呀我的箱子！霍师兄饶命，许长老饶命啊！”\n\n陈长庚吓得扑通一声跪倒在臭泥旁边，双手哆哆嗦嗦解下腰间那个洗得发白的低阶储物袋高举过顶，同时把怀里那半块染血的玄煞门巡哨铜牌一并捧了出来，涕泪横流地磕头哭诉：\n\n“小人不敢藏私啊！昨夜在门口被曹公子和魔头交手的气浪掀翻滚进西偏臭水沟，苏仙师吐血昏迷，小人拼了老命背着仙师顺着废沟往外爬，半道撞见两个被落石砸死的玄煞门探子，只敢顺手摸了这半块铜牌回来报信！”\n\n“要不是许长老神威盖世劈退了外头的魔门老祖，小人这条贱命早喂了大泽王八了！袋里只有苏仙师雇小人挑箱的两块灵石，求长老明察！”\n\n高台之上，许镇岳冷哼一声，眉心一缕强横的开脉境中期神念如无形水银般骤然铺开！\n\n神念先扫过地上那摊恶臭黑泥、废硫石，掠过缺角破石臼与那块裹着浊泥封灵纹的死铁泥疙瘩——死气沉沉，毫无灵韵反应！\n\n再一寸不落地穿透陈长庚双手捧着的低阶储物袋——两枚边角磨损的普通下品灵石、两瓶大路货解毒散、半袋破生铁砂，穷酸得令人发指！\n\n至于赵怀恩木案上苏清晏摔碎的那三截罗盘与空置上古寒玉废匣，更是连一星地脉宝气都没沾过！\n\n“够了！还嫌今日丢人丢得不够么？！”\n\n急于回宗献首级报功的许镇岳彻底失了耐性，袖袍重重一拂呵退霍千山：“石拱炸塌前震落西沟，人证物证俱在，哪来的底窟重宝？定是死禁反噬与曹无极他们同归于尽毁在地下了！”\n\n“赵怀恩，记入战册：寻脉馆苏客卿破外禁有功，陈长庚护客卿脱险，准予免责！全军即刻拔营登船，申末之前开赴本山！”\n\n“谨遵长老法旨！”赵怀恩连忙低头记档。\n\n苏清晏看都没再看木案上那堆摔弃的碎罗盘与空寒玉废匣，冷着脸拂袖转身。\n\n陈长庚趴在地上千恩万谢，慢吞吞爬起身，手脚麻利地把地上那摊裹着蚀纹石臼、百年凝卤髓渣与封泥寒铁虫瓮的恶臭黑泥重新铲回破炭箱里捆牢，挑上肩头。\n\n三步外，霍千山死死盯着陈长庚佝偻卑微的背影，眼神阴鸷得像毒蛇吐信。\n\n就算这灰衣小杂种真没进底窟，方才苏清晏当众顶得他下不来台，这口恶气他也绝咽不下去！\n\n大军浩浩荡荡撤往岸边三层铁甲楼船。\n\n就在陈长庚挑着破炭箱踩上战船宽大木跳板的刹那，霍千山身边一名器堂心腹冷笑一声，快步凑到跟船督办的庶务执事赵怀恩耳畔，塞过去一只沉甸甸的小锦袋，压低嗓门飞快耳语了三四句。\n\n赵怀恩捏了捏锦袋棱角，浑浊老眼猛地一亮，缓缓抬起头，一道阴冷如刀的目光穿过攒动人头，死死钉在了刚踏上甲板的陈长庚后颈上！"}, {"n": 86, "title": "归舟捞宝", "body": "铁索绞起，三层高的云泽宗铁甲战船劈开浑浊泽浪，顺着宽阔官河向北疾驶。\n\n整座战船被一股压抑森然的丧气笼罩着。\n\n中层甲板两侧摆着七八副盖白布的担架，曹家和梁家的随军管事跪在空灵位前哭得嗓子嘶哑。\n\n谁都清楚，等明日早上船靠云泽宗码头，内门那几位护短狠辣的世家执事长老见不着自家麒麟儿，必定是一场人头滚滚的雷霆风暴。\n\n陈长庚把捆着麻绳的破炭箱安顿在二层尾舱寻脉馆客室门外的廊角，自己抱膝坐在箱子旁啃着半块干硬杂粮饼，眼观鼻、鼻观心。\n\n刚咽下两口干饼，走廊前头忽然响起一阵沉重整齐的官靴脚步声。\n\n庶务执事赵怀恩背着双手，领着两名膀大腰圆的通窍七窍内院护卫径直走到廊角，居高临下停在陈长庚面前。\n\n廊道两侧几个抱伤休息的外门幸存弟子见状，吓得纷纷缩脖避开三丈远。\n\n“丙字废渣房杂役，陈长庚是吧？”\n\n赵怀恩慢条斯理理了理袖口，皮笑肉不笑地睨着他：“手脚看着还挺利索，没断胳膊少腿，算你小子命大。”\n\n陈长庚连忙放下干饼起身，弯腰赔笑道：“托许长老和赵执事的洪福，小人侥幸捡回半条命。不知执事大人有何吩咐？”\n\n“器堂此番在古墟斩杀魔头立下头功，底舱几间功臣静室堆了不少染血甲胄和硫火废渣，缺个懂清灰的熟手打理。”\n\n赵怀恩下巴往船腹最底层黑漆漆的铁梯口一扬，官腔拿捏得滴水不漏：“本执事看你在丙字房干惯了筛灰活，把这箱烂泥搁这儿，立刻跟他们两个下器堂底舱当差去！”\n\n廊角空气骤然一冷。\n\n远处的几个外门老油条连头都不敢抬——器堂底舱贴着船底排污暗板，霍千山的人此刻正在底下擦洗兵刃，这脚迈下去，不用半炷香就会多一具“失足落水溺亡”的无头尸首！\n\n“赵执事体恤，小人本该立时下去伺候各位器堂师兄……”\n\n陈长庚脸上露出受宠若惊的惶恐，往前刚迈出半步，左腿膝盖忽地一软，整个人摇晃着往赵怀恩身前栽去，胸腔里拉风箱似地剧烈抽搐起来：\n\n“可、可小人在西边毒泥沟里泡了七个时辰……咳咳……心肺早叫铅煞毒水烂穿了啊——噗！！”\n\n最后一个字脱口，陈长庚早含在舌根底下、用炭箱铅毒黑灰混着齿缝淤血攒出的一大口浓稠腥臭黑血，劈头盖脸正喷在赵怀恩那双崭新云纹锦靴上，糊了满满一靴面！\n\n“滋啦！”\n\n古墟老卤铅灰带着蚀性，锦靴缎面当场冒起两缕恶臭白烟！\n\n陈长庚还不忘双手乱抓，沾满黑泥臭血的巴掌险些直接抹上赵怀恩的青绸官袍下摆：“执、执事大人拉小人一把……小人眼黑喘不上气了……”\n\n“滚开！腌臜瘟狗，找死不成？！”\n\n赵怀恩吓得脸色发绿，嫌恶万分地连退三大步，抬脚抖落靴面黑血，恼羞成怒地喝令身后两名护卫：“装死耍滑！拿铁链把他捆了，直接拖进底舱洗甲板！”\n\n“是！”两名七窍护卫狞笑着探手抓向陈长庚衣领！\n\n“吱呀——”\n\n紧闭的尾舱木门，恰在此时从内轻轻拉开半扇。\n\n换了一身素净白衣、脸色依旧苍白如雪的苏清晏扶着门框立在门槛内，冷冷垂眸扫过两名护卫僵在半空的手爪：\n\n“谁准你们动我寻脉馆的人？”\n\n两名护卫手腕一颤，下意识回头看向赵怀恩。\n\n赵怀恩脸色一僵，强挤出三分干笑拱手道：“原来是苏客卿。古盐墟差事既已办完，这小子原是外门废渣房的杂役，理当归庶务堂调配……”\n\n“谁同你说差事办完了？”\n\n苏清晏取出一纸盖着云泽宗外事堂与寻脉馆双朱印的外聘副契，清泠声音不大，却透着不容置疑的冷硬：\n\n“入墟之前，寻脉馆地底布了九处导磁副桩，须得在出墟三日内由原经手杂役挑回试阵母炭逐一起除，否则地磁倒灌炸毁外门西院，赵执事拿脑袋赔么？”\n\n赵怀恩额角冷汗刷地冒了出来：“这……随便换个杂役挑箱也是一样……”\n\n“炭箱封泥认气，换人乱动炸了阵基，本座明日便去升仙殿找许长老要个说法。”\n\n苏清晏眼皮都未多抬一下，冷声甩下一句：“本座现按副契续雇陈长庚三日，回山销完尾差之前，少他一根汗毛，你庶务堂自己去跟天阵宗交涉！”\n\n半个时辰前许镇岳才刚在辕门发过火不准节外生枝，赵怀恩哪敢真为器堂一袋碎银子去触霉头？\n\n他死死瞪了地上还在喘粗气的陈长庚一眼，擦着脏靴恨声甩袖：“算你这瘟狗走了狗屎运！三日之后交差回房，本执事看谁还护着你！我们走！”\n\n待三人骂骂咧咧下楼远去，廊道重归清静，陈长庚才不紧不慢擦净嘴角黑灰，站起身朝门内低声一揖：“多谢仙师替小人挡灾。”\n\n暮色四合，江风微凉。\n\n苏清晏缓步走出舱门，扶着船尾木栏望向远处沉入暮霭的连绵山影，声音压得极低：\n\n“挡得住船上一时，挡不住回山一世。”\n\n陈长庚挑眉走到她身侧两步外，垂手听着。\n\n“霍千山方才虽然只拿到五瓣残莲，回宗必会闭关强冲开脉境；更有曹无极的亲叔父曹敬塘、梁家的内门执事，绝不会信自家子侄死得这般干净。”\n\n苏清晏偏过头，清冷眸光落在陈长庚平静的侧脸上：“在云泽宗这等地方，通窍九窍说到底也只是大号杂役。一日不贯通周天仙脉披上内门执事道袍，旁人想捏死你，连借口都不用找第二次。”\n\n“三日后寻脉馆销差，我也该离宗去天阵宗遗迹了，你好自为之。”\n\n说完她便转身回舱掩上了木门。\n\n陈长庚独自扶着船栏吹了片刻冷风，粗糙五指在袖中轻轻摩挲了一下。\n\n不入开脉，终是砧板鱼肉——这话不用旁人教，他从乌卤盐场钻盲井那天起就刻进骨头缝里了！\n\n好在，破局的钥匙已经在手心里攥热乎了！\n\n夜色渐深，转眼滑过戌末，踏入二月初六亥时初刻。\n\n船舱各处灯火熄灭大半，陈长庚靠在廊角破炭箱上闭目假寐，后背隔着箱板与黑泥，清晰感应到箱底那半截蚀纹石臼极其细微地轻轻一震！\n\n整整三十六个时辰潮汐冷却届满，石臼已重新蓄满地脉煞力，随时可吞母引开炉！\n\n陈长庚强压下心头热意，不动声色——在挤满开脉长老与器堂眼线的铁甲战船上开炉，十倍地火腥甜气一冒出来就是找死！\n\n就在这时，整艘巨舰船身微微一顿，铁锚哗啦落水，船头传来水手压低嗓门的号子：“黑石渡旧水闸到了！落帆候潮换甜水，停船两刻钟！”\n\n到了！\n\n陈长庚睁开眼，借着廊角阴影探手摸进破炭箱黑泥底，取出那块死铁泥疙瘩，指尖暗劲一吐抠开九宫封灵泥壳，将寒铁虫瓮重新扣回腰间，随即拎起尾舱廊下两只满了大半的腥臭夜香木桶，猫腰晃晃悠悠走到底层船尾排污口。\n\n两名值夜铁甲卫嫌臭，远远躲在上风头抽旱烟，连看都没多看这倒夜香的病秧子一眼。\n\n陈长庚借着倾倒第一桶污水的哗啦水响掩护，左手拇指一拨腰间寒铁虫瓮！\n\n三十六只二蜕嗜铁煞甲虫尾足系着纤细坚韧的浸油黑牛筋丝，贴着漆黑船帮悄无声息滑入深水，循着白日留下的气味直扑三丈外水闸第三根暗桩！\n\n水下无声啃断活扣，三十六只吃过精钢凶煞的异虫合力一拽，陈长庚双手在污水掩护下顺势一提牛筋丝！\n\n“咕嘟。”\n\n裹满九宫敛息毒泥、分毫无损的重包，稳稳滑入第二只空木桶暗垫的干草夹层底下！\n\n收回虫群锁好虫瓮，陈长庚面不改色拎着木桶走回二层廊角，趁夜深无人将封泥重包悄然塞回铁木炭箱底层，与石臼内的核心母引严密合一。\n\n两只装有八成地母玄晶主髓的上古寒玉封匣、四十五钱无瑕髓晶旧匣、九十枚灵石，连同两颗赤阳雷火弹、八块地火精石、青铜隔味阵盘、乌金分水刺、敛息阵图真卷与备用寒玉小匣等一应家当，一分不少，完璧归赵！\n\n次日二月初七辰时，晨雾散尽，云泽宗巍峨外峰山门码头遥遥在望。\n\n巨舰靠岸搭稳跳板，陈长庚挑起沉甸甸的破炭箱随着人流刚迈下船头，抬头往码头青石阶上一扫，脚步微顿——\n\n只见外门纳贡院管事冯保山正端着那把熟悉的紫砂茶壶，黑着一张油光水滑的胖脸，带着书办庞文禄和四名手持铁尺的壮汉，严严实实堵在码头出口正中央！"}, {"n": 87, "title": "活人逼捐", "body": "山门码头江风腥凉，数百名候船的外门杂役远远瞧见纳贡院的铁尺阵仗，早吓得缩到了栈桥两侧。\n\n陈长庚挑着破炭箱走下木跳板，早已依《地脉敛息阵图》口诀将一身九窍气血锁回初入宗时的三窍虚浮表象，脸色蜡黄，脚步发飘。\n\n石阶正中，胖大富态的纳贡院管事冯保山正眯着细眼抿紫砂壶。\n\n一抬眼瞅见挑箱走来的灰衣青年，冯保山端茶壶的肥手猛地一抖，滚烫茶水险些泼在手背上！\n\n“庞书办！”\n\n站在冯保山斜后方一个穿绸衫、戴金戒指的圆脸胖杂役当场变了脸色，急吼吼拽住书办庞文禄的袖子压声低叫：\n\n“咋回事？！你们前天不是打包票说这病痨鬼跟去古盐墟必死无疑，收了我蔡金满十五块整灵石，许我初十就搬进丙字废渣房躲清闲么？！”\n\n“闭上你的狗嘴！”\n\n庞文禄脸色一黑，反手一记冷肘捅在蔡金满肥肚皮上，拿眼角偷觑前头的冯保山。\n\n陈长庚垂着眼皮走近五步内，耳根微动，把后头那两句咬耳朵听得一字不落。\n\n心里顿时冷笑一声。\n\n好一个冯大管事，自己尸骨还没见着影儿，后山那间遮人耳目的丙字废渣房倒先被他私卖了十五枚下品灵石！\n\n“小人陈长庚，给冯管事、庞书办请安！”\n\n陈长庚脸上未露分毫异色，卸下扁担，弯着腰满是劫后余生的庆幸赔笑。\n\n冯保山眼皮跳了两下，很快恢复了那副慈眉善目的官老爷派头。\n\n吃进肚里的十五块灵石，他冯某人这辈子就没往外吐过一块！\n\n“哟，是长庚回来啦？”\n\n冯保山慢悠悠摩挲着紫砂壶肚，重重叹了一口气：“活着回来就好，冯某这两天还在祖师爷牌位前替你烧香呢。”\n\n“全仗管事大人福泽庇佑！”陈长庚恭顺低头。\n\n“不过嘛，宗门刚出了一桩塌天大祸，冯某就算想偏疼你，也是爱莫能助喽。”\n\n冯保山话锋一转，朝着旁边的庞文禄使了个眼色。\n\n庞文禄立马跨前一步，抖开一本黑皮册子，扯着公鸭嗓喝道：\n\n“听真了！此番沉渊古盐墟遭魔门暗算，内门曹氏、梁氏两位嫡脉公子双双殉宗！”\n\n“上头急令重铸九座护山祭炉抚恤功勋，凡此番从古盐墟活着爬回来的外门杂役，每人须补缴十枚下品灵石‘修炉抚恤捐’！”\n\n周围看热闹的外门苦役倒吸一口凉气。\n\n十枚下品灵石！寻常外门杂役累死累活干上三年，不吃不喝也攒不出这个数！\n\n蔡金满在后头听得眉开眼笑，瞬间品出了冯保山这一刀借题发挥的狠辣。\n\n“十、十块灵石？！”\n\n陈长庚脸色煞白，两腿一软差点瘫在石阶上，嗓音带着哭腔发颤：\n\n“冯管事明鉴！小人在丙字房筛废灰连月例碎石都扣光了，这趟去古墟替苏仙师挑箱子，满打满算才挣了两块灵石工钱，上哪儿去变十块灵石啊！”\n\n“规矩是内门定的，又不是冯某吃你的。”\n\n冯保山捧着茶壶踱下两级石阶，拍了拍陈长庚脏兮兮的肩头，一副推心置腹的长辈口吻：\n\n“按理说，当场交不出就得锁去黑水死矿挖一辈子毒煤。”\n\n“冯某念你跟了我一场，替你担着天大的干系宽限五日！到二月十二辰时，凑齐十块灵石送来纳贡院。”\n\n“要是凑不齐，你就自己把丙字房腾干净，乖乖去领黑水矿的铁枷，往后在矿底可得记着冯某今日这份人情呐！”\n\n把吃绝户的黑账说成救命恩典，冯保山连眼皮都不眨一下。\n\n陈长庚低垂的眼底寒光一掠而逝。\n\n炭箱黑泥底下就躺着九十枚完整下品灵石，砸在冯保山肥脸上能把他满嘴牙都崩掉。\n\n可眼下自己还没贯通周天仙脉，一个三窍筛灰杂役敢随手掏出十枚灵石，今夜冯保山就能勾结内门执事破门搜出他的老底！\n\n五日缓冲，足够他锁门炼出二阶道晶、一举冲开仙脉了！\n\n“多谢管事大人开恩！小人这就回屋砸锅卖铁、找同乡拆借！”\n\n陈长庚千恩万谢磕了个响头，挑起破炭箱，一步三咳地穿过哄笑指点的人群，径直逃回后山乌烟瘴气的废渣谷。\n\n推开丙字废渣房熟铁大门，院内积了一层灰黑炉灰，屋后地火炉口依旧日夜喷吐着刺鼻硫烟，空无一人。\n\n陈长庚刚把炭箱卸在内室坑边，院门外突然传来一阵急促凶狠的皮靴踏石声！\n\n“嘭！”\n\n还没关严的院门被人一脚踹开！\n\n三名身穿皂黑劲装、袖口绣着狰狞血蝠纹的内门家奴气势汹汹闯进小院。\n\n为首的独眼老苍头太阳穴高鼓，赫然是通窍八窍巅峰的硬手，手按腰刀厉喝：\n\n“哪个是跟去古盐墟的陈长庚？！滚出来回话！”\n\n曹无极亲叔父、内门开脉执事曹敬塘的贴身恶奴曹旺！\n\n陈长庚心里门儿清，忙佝偻着背迎出屋檐，惊慌失措地作揖：“这位内门爷息怒，小人就是陈长庚……”\n\n“啪！”\n\n曹旺上前一把揪住陈长庚前襟，单臂将他提离地面半尺，独眼赤红如血：\n\n“我家少主通窍九窍巅峰、身怀二阶重宝，怎会折在古墟里头？！你在现场瞧见了什么，敢瞒一个字，老子现在就拧断你的脖子！”\n\n狂暴气劲勒得领口生疼，陈长庚却顺势双脚乱蹬、剧烈咳喘起来：\n\n“爷饶命！小人真没进内窟啊！石拱门刚开一道缝，曹公子一马当先杀魔头，小人和苏仙师在门槛外就被气浪掀进西边臭水沟了，许长老在辕门亲自验过的！”\n\n曹旺手劲微松少许，眼神凶疑：“那之前一路进墟，谁跟少主结过梁子？！”\n\n“小人……小人不敢乱嚼内门贵人的舌根……”陈长庚眼神躲闪，欲言又止。\n\n“说！曹执事替你撑腰！”曹旺厉声催逼。\n\n陈长庚咽了口唾沫，这才压低嗓门，带着几分替曹无极鸣不平的凄惶泣诉道：\n\n“进内窟前过那座蚀骨断桥时，天上扑下成群毒蝠！曹公子带着胡彪大哥在前头拼死开路，胡大哥肩膀都叫毒蝠撕烂了。”\n\n“可后头梁世勋梁公子和他的护卫非但不搭把手，反倒拿铁扇把毒蝠全往曹公子背上赶，还抢先把桥头生路占死了！”\n\n“后来到了中窟莲台，梁公子更当众撺掇器堂孤立曹公子……后头进了门洞黑灯瞎火发生了啥，小人就实在瞧不见了啊！”\n\n字字句句，全是五方人马在断桥与中窟有目共睹的真事，跟霍千山回禀的口径严丝合缝！\n\n“好你个吃里扒外的梁家杂碎！！”\n\n曹旺听得钢牙咬碎，一甩手将陈长庚掼在灰堆里，扭头冲两名随从怒吼：\n\n“跟霍统领亲兵说的一模一样！难怪梁世勋那小畜生也没活成，定是他在里头拖少主后腿遭了报应！走，回禀老爷去梁家祠堂讨说法！”\n\n三名曹家恶奴怒气冲冲卷风而去。\n\n陈长庚慢条斯理从灰堆里爬起身，拍掉衣襟脚印，眼神冷静如渊。\n\n曹敬塘这把疯刀去咬梁家，废渣谷这几天算是彻底清静了。\n\n熬到入夜三更，整座后山万籁俱寂，只有地底硫火轰鸣。\n\n陈长庚落下丙字房千斤熟铁闸门，顶死三道横梁，先抠开炭箱底重包的九宫封灵泥壳，将乌金破甲分水刺、雷火弹与寒玉匣逐一清出。\n\n他又撬开内室墙角青砖，取出早年留存的半块残次灵石，咔地嵌进那面布满细纹的黑市青铜隔味阵盘。\n\n微弱青光撑起三尺隔味幕。\n\n陈长庚深吸一口气，抱出早已蓄满三十六个时辰地脉潮汐的半截“蚀纹石臼”，先取出前日在大泽废苇窑便塞进臼心的那块拳头大“地母玄晶”核心母引搁在石案上。\n\n接着解开那整袋七八斤重的乌黑“百年凝卤髓渣”，倒出一半约三四斤铺满臼底，右手握起乌金分水刺，将核心母引边缘阻碍贴合的几处尖棱利落削平。\n\n十几粒米粒大小的紫金碎屑崩落在石案上，陈长庚随即将打磨圆整的核心母引稳稳按回石臼正中！\n\n“嗡——！”\n\n母引触底的刹那，石臼断口处那道沉寂已久的非金非玉暗金裂痕，骤然亮起一缕苍茫古老的暗金微纹！\n\n整座石臼如饥渴万载的凶兽轰然运转，地母玄晶母引与三四斤百年髓渣瞬间融作一团沸腾紫金浆液——\n\n然而下一息，一股比提纯一阶废渣时浓烈霸道整整十倍的奇异地火腥甜气，如决堤怒潮般自臼口狂喷而出！\n\n“咔嚓！！”\n\n地上那面带细纹的黑市青铜隔味阵盘连半息都没撑住，当场震碎成七八瓣废铜，浓郁到化不开的紫金奇香顷刻扑满内室，直往木窗缝隙外钻去！"}, {"n": 88, "title": "母引开臼", "body": "青铜隔味阵盘碎裂成片，霸道绝伦的紫金腥甜奇香如滚滚浓雾，眨眼灌满了整座石屋！\n\n陈长庚脸色微变。\n\n这股二阶提纯迸发的地脉异香实在太冲，哪怕外头有地火排灰炉的黑烟混着，一旦顺着窗缝飘出十丈远，莫说引来后山嗜血毒虫，但凡有个巡夜的内门高阶修士路过闻上一口，立刻就得破门夺宝！\n\n偏偏祸不单行！\n\n“轻点儿！别踩响碎煤渣！”\n\n就在奇香即将漫上西侧透气木窗的同一瞬，丙字废渣房低矮的院墙外头，突然响起一阵压得极低的猥琐脚步声！\n\n透过窗纸一道针尖细缝往外一扫——\n\n惨淡月色下，纳贡院书办庞文禄正猫着肥腰，领着两名拎着铁锁链的值夜帮闲悄悄摸到了院门根下！\n\n“庞头儿，大半夜不睡觉摸这臭烘烘的废渣谷干啥？那病痨鬼还能长翅膀飞了不成？”一名帮闲捂着鼻子小声嘀咕。\n\n“懂个屁！”\n\n庞文禄三角眼闪烁着贪婪精光，贴着院墙蹑足往西窗摸来：\n\n“十块整灵石的死捐，那穷鬼上哪儿凑去？八成今晚就得偷摸卷铺盖翻后山逃命！咱们抓他个私逃叛宗的现行，屋里剩下的破烂铜钱归咱哥几个平分，明早还能叫蔡金满再多吐两块跑腿灵石！”\n\n说话间，庞文禄距离内室木窗已不足两丈！\n\n地上蚀纹石臼暗金微纹正处于吞噬母引的最紧要关头，半途强行中断，整块价值连城的地母玄晶核心母引当场就得报废成白灰。\n\n可要是拔刃出去宰了庞文禄三个，明日纳贡院不见书办回衙，刑律堂开脉执事立时就会封锁全谷掘地三尺！\n\n两息！最多两息奇香就会透出窗纸！\n\n陈长庚双目寒芒骤凝，心神稳如铁石，脑海中瞬间闪过刚摸透的《地脉敛息阵图》第三页“借煞倒卷诀”！\n\n丙字废渣房正下方三丈深处，便是焚烧全宗丹渣废料的地下硫火主熔坑！\n\n“定！”\n\n陈长庚一声不响，左手自腰囊闪电摸出三根日常备用的八棱试脉铁钎，脚踏九宫坎离暗位，右掌凝起九窍浑厚劲力连吐三记寸劲！\n\n“噗、噗、噗！”\n\n三根试脉铁钎分毫不差，呈品字形深深钉入墙角连通地底熔坑的排烟砖缝三寸深处！\n\n铁钎入石勾连地底燥热磁煞，原本往屋内倒灌的排烟风口瞬间逆转气压，化作一口吸力惊人的无形风漏！\n\n“呼——”\n\n满屋翻涌欲出的浓烈紫金腥甜气像是被一只大手死死拽住尾巴，连一缕都没漏出窗纸，贴着青砖地面打着旋儿，一窝蜂全被抽进了三丈下的万度硫火熔坑，眨眼烧得干干净净！\n\n刚布妥导风钎，窗外庞文禄的大饼脸已经凑到了木窗棂三尺外，抽着鼻子狐疑道：\n\n“咦？你们闻见没，怎的好像有一缕甜丝丝的味儿……”\n\n“甜味？庞头儿，我就闻见一股烂耗子屎臭！”帮闲直翻白眼。\n\n庞文禄不死心，伸手便要去捅破窗纸往屋里瞧！\n\n屋内的陈长庚随手拿麻袋往发光的石臼上一罩，顺手拎起窗根底下满满半竹篓泡了七八天陈年铅毒废水、上头还浮着两只烂死鼠的湿炉灰，猛地拔掉窗闩，“哐当”一把推开半扇木窗！\n\n“哗啦——啪！！”\n\n半篓乌黑粘稠、臭气熏天的腐鼠湿铅灰，迎面扣了庞文禄满满一脑袋、一脖领子！\n\n“呸呸——呕！！哪个杀千刀的王八羔子？！”\n\n庞文禄嘴还没合拢就被灌了半口酸臭黑泥，当场弯腰呕得苦胆水直流，两名帮闲更是捂着鼻子连蹦出丈许远！\n\n“哎呀！是庞书办大驾光临？！”\n\n窗口里头，陈长庚顶着一张抹满黑锅灰的蜡黄病脸探出身子，一边撕心裂肺地大声干咳，一边伸出两只沾满烂泥臭水的黑爪子，热情无比地往庞文禄绸衫袖口上乱抓：\n\n“小人半夜肺痨发作咳得睡不着，正想把屋里攒的烂铅灰倒出去换两个铜板呢！”\n\n“书办老爷来得太巧了——您老慈悲，能不能先借小人两块下品灵石垫上修炉捐？小人给您立血字据，往后给您做牛做马……”\n\n“滚！快滚开！别拿你那烂肺痨爪子碰老子新衣裳！！”\n\n庞文禄一听他非但没逃跑、反倒要赖上来借两块灵石，再瞧他咳得满嘴黑沫子那副随时要断气的瘟神模样，吓得头皮发麻，一脚踹开脚边破竹篓，抹着满脸臭泥跳脚怒骂：\n\n“借你娘的春秋大梦！穷疯了的短命鬼，五天交不出十块灵石，老子亲自拿大铁链锁你去黑水矿烂死！晦气，真他娘的倒了八辈子血霉！走！”\n\n庞文禄生怕沾上古盐墟带回来的怪瘟疫，带着两个帮闲捂着鼻子连滚带爬逃出了丙字院，走出去半里地还在干呕骂娘。\n\n窗边，陈长庚止住假咳，冷冷瞥了一眼院外远去的灯笼火光，重新合严木窗落死铁插销。\n\n内室地底排烟口仍在呼呼倒吸余味，屋里再无丁点异香残留。\n\n他转身掀开罩在蚀纹石臼上的旧麻袋。\n\n熬过小半个时辰的剧烈碾磨转化，至二月初八寅末时分，石臼外壁那缕苍茫暗金微纹终于缓缓隐没归寂，重新进入了新一轮三十六个时辰的地脉潮汐冷却。\n\n那半袋约三四斤重的百年凝卤髓渣与拳头大核心母引已消失无踪，连一撮废灰都没留下。\n\n而在灰扑扑的石臼窝底正中央，赫然静静躺着三枚龙眼大小、浑圆剔透、内里仿佛封锁着一缕紫金游龙脉络的璀璨晶丸！\n\n陈长庚呼吸微促，伸出双指捻起一枚凑近眼前。\n\n入手温润沉重，一缕精纯到极致的开脉本源道韵顺着指腹毛孔轻轻一钻，他周身九处早已圆满的主气窍竟齐齐发出一阵欢鸣震颤，原本坚硬如铁的周天仙脉壁障当场松动了一线！\n\n二阶提纯奇物——无瑕“玄脉道晶”！\n\n寻常通窍九窍巅峰修士想冲开周天仙脉，至少得吞服宗门丹房三十枚灵石一剂的“破脉灵液”，还得赌命硬扛里头四成狂暴火毒，十个人里头倒有八个经脉寸断沦为废人。\n\n而石臼吞下地母玄晶母引开启二阶转化后，炼出的这三枚玄脉道晶毫无丹毒排异，药力更是精纯十倍！\n\n算上三日后二月十一寅末潮汐再满开第二轮二阶提纯——正好赶在二月十二辰时收房大限前——两炉六枚玄脉道晶砸下去，他这道困扰十六年的九窍蒙尘死锁，必破无疑！\n\n陈长庚压下心头激荡，取出从水底捞回的那只备用封晶寒玉小匣，将三枚紫金玄脉道晶严严实实封存进去。\n\n随后他又刮起石案上削平母引棱角时崩落的十几粒米粒大小的地母玄晶碎屑，打开腰间寒铁虫瓮倒了进去。\n\n“沙沙沙……”\n\n瓮内三十六只二蜕嗜铁煞甲虫疯抢吞食，不过片刻，原本乌金色的坚硬背甲上竟齐齐浮现出一圈细密紫金暗纹，口器寒芒吞吐，凶悍气息比在古盐墟时又暴涨了三成！\n\n收拾妥当，外头天色已擦亮，踏入二月初八卯初。\n\n陈长庚刚将装有八成地母玄晶的两只上古寒玉封匣、这只玄脉道晶寒玉小匣与四十五钱髓晶旧匣一并收进暗格，还没来得及躺下歇口气——\n\n“噗。”\n\n西侧木窗缝隙外，一只巴掌大小、用天阵宗秘制雪蚕纸折成的素白纸鹤，悄无声息钻过窗棂裂缝，悬停在他面前三尺处，无火自燃！\n\n幽蓝火苗一闪而逝，空气中只留下一行苏清晏清冷急促的灵力字痕，映亮了陈长庚骤然冰寒的瞳孔：\n\n“霍千山昨夜强吞五瓣残莲冲脉失败，火毒攻心，疑坑底寒髓落入生还者之手，已遣器堂死士今夜灭口搜魂。速避！”"}, {"n": 89, "title": "山亭别钎", "body": "幽蓝火字在半空停留两息，化作点点微尘散尽。\n\n陈长庚站在窗前，指尖轻轻捻碎纸鹤落下的一星白灰，神色沉静如常。\n\n难怪霍千山在大营辕门疯狗似地咬着不放——赤煞伴生莲被断龙硫雷炸碎了四瓣，剩下五瓣阴阳失衡、狂暴赤毒翻倍，他急于抢在曹、梁两家发难前强冲开脉境，结果反倒把自己烧成了半疯内伤！\n\n一个冲脉失败、怀疑旁人捡了寒属性主脉至宝的器堂霸主，绝不会讲什么宗门规矩。\n\n“避？往哪儿避。”\n\n陈长庚眼底掠过一抹冷冽杀机。\n\n此刻逃出云泽宗就是坐实做贼心虚，反倒白白丢了内门执事这层护身虎皮；何况苏清晏那边还剩最后半天续雇尾差，白天不露面销差，赵怀恩转头就能拿旷工借口带人砸门！\n\n他当即俯身撬开地火排烟道旁一块滚烫火砖，用《地脉敛息阵图》的九宫封泥手法，将装有八成地母玄晶主髓的两只上古寒玉封匣、封存三枚玄脉道晶的寒玉小匣与四十五钱髓晶旧匣严密裹好。\n\n连同蚀纹石臼、剩下的半袋百年凝卤髓渣、两颗赤阳雷火弹、八块地火精石与九十枚整灵石等全部重宝，一并封上隔灵黑泥，深埋进火道侧壁三尺暗槽。\n\n随后他换上那身洗得发白的灰麻杂役服，右袖滑槽扣紧百炼乌金破甲分水刺，腰悬三十六只刚吞过玄晶碎屑的煞甲虫，再从试阵炭箱底那滩古盐墟强蚀黑卤臭泥里滤出半瓢浓黑毒卤垫进破竹篓底，盖满废炭灰，挑起扁担晃晃悠悠出了门。\n\n辰时正刻，外门西院寻脉馆。\n\n青石院门外停着一辆拉套齐整的青骡兽车，苏清晏一身素白行装立在堂中，显然已收拾停当准备离山。\n\n然而前堂公案后头，庶务执事赵怀恩却翘着二郎腿坐在太师椅上，慢吞吞拿茶盖刮着浮沫，面前压着苏清晏那纸离山路引，迟迟不肯落下执事铜印！\n\n堂下四名庶务堂干办抱臂冷笑，把门口堵得死死的。\n\n“赵执事，九处导磁副桩的残阵图谱本座已全数交割清楚，为何还不盖放行印？”苏清晏脸色苍白，语气已冷到了极点。\n\n“苏客卿莫急嘛，公事公办。”\n\n赵怀恩皮笑肉不笑地放下茶盏，官腔十足：\n\n“古盐墟折了那么多内门栋梁，器堂那边今早发来协查签，说西院地底余煞还得请内门器堂长老亲自来复核一轮。劳烦苏客卿在馆里多住个三五日，等器堂长老出关核验无误，赵某立时盖印送行！”\n\n刚挑着灰篓走到堂口台阶下的陈长庚脚步一顿，心里瞬间透亮。\n\n拖上三五日，等霍千山压下火毒或者器堂开脉执事龚铁横腾出手来，苏清晏这只落单孤凤还想全须全尾走出云泽宗？\n\n堂内苏清晏指尖微扣袖中铁钎，可她心脉重伤初愈，一旦在宗门公堂动手抗检，正中器堂下怀！\n\n“劳驾让一让，丙字房杂役来交最后两篓试阵废灰喽——”\n\n陈长庚弓着虾米腰，扯着卑微嘶哑的嗓门吆喝一声，挑着竹篓低头往堂内迈步。\n\n“没长狗眼的东西！没瞧见赵执事正在办铁案么，滚出去！”守门干办厉声呵斥，伸手便往陈长庚肩头猛推一把！\n\n陈长庚“恰好”右脚脚尖绊在半尺高的青石门槛上，借着干办这一推之力，“哎哟妈呀”一声怪叫，整个人连扁带篓往前猛扑出去！\n\n“哗啦——噗！！”\n\n前头那只破竹篓脱钩翻飞，上头浮灰洒了一地，篓底暗藏的那半瓢古盐墟强蚀黑卤隔着三尺距离，整整齐齐泼在了赵怀恩垂在太师椅侧的青绸官袍左暗袋上！\n\n“混账瘟狗！又往本执事身上泼脏水——”\n\n赵怀恩暴跳如雷，一脚便要往陈长庚心窝踹去！\n\n“滋啦啦！”\n\n不等他脚尖踢出，官袍左侧双层绸布暗袋遇上霸道绝伦的古墟强蚀毒卤，两息之间便冒起一阵焦黑青烟，结实的丝绸袋底当场蚀穿出一个巴掌大的破洞！\n\n“啪嗒、啪嗒！”\n\n三张盖着外门纳贡朱红官印、本该昨日一并交去升仙殿由许镇岳核销入库的“外门灵矿火耗折抵贡票”，连同两锭私藏金叶子，顺着破洞滑落出来，明晃晃摊在了满堂干办与杂役眼皮子底下！\n\n每一张贡票，都抵整整二十枚下品灵石的宗门公账！\n\n堂上四个原本趾高气昂的庶务干办看清票面朱印，眼珠子齐刷刷瞪直，像是被掐住了脖子的鸭子般猛地闭紧嘴巴，齐齐后退一步低头看脚尖！\n\n“哎呀！小人该死，小人手滑罪该万死！”\n\n趴在地上的陈长庚仿佛吓傻了一般，手忙脚乱扑过去替赵怀恩捡那三张贡票，嗓门大得连院外车夫都听得真真切切：\n\n“赵执事恕罪！把您怀里还没来得及呈给许长老销账的三张灵矿贡票给卤水泡着了！这要是耽误了今日午时升仙殿查核古墟总账，许长老怪罪下来，小人十个脑袋也赔不起啊！”\n\n赵怀恩后背冷汗“刷”地湿透了中衣，伸出去的右脚生生僵在半空！\n\n许镇岳昨日才刚因古墟损兵折将憋了一肚子邪火，要是叫满堂人捅上去说他赵怀恩趁乱私截六十枚灵石的公账贡票，不用器堂保他，许镇岳今天中午就能一掌拍碎他的天灵盖立威！\n\n苏清晏垂眸扫了一眼地上那三张烫手贡票，清冷唇角微不可察地一挑：\n\n“原来赵执事公事繁忙，连许长老急调的灵矿贡票都还在袖里捂着。既如此，本座现在便陪赵执事去一趟升仙殿，当着许长老的面一块核验阵损如何？”\n\n一记软刀子，直接架在了赵怀恩大动脉上！\n\n赵怀恩脸色青白交替，额头豆大的汗珠滚落下来，一把从陈长庚手里夺回三张贡票死死塞进怀里，转身抓起案上执事铜印，咬碎后槽牙“咚”地一声重重砸在苏清晏的离山路引上！\n\n“阵基无损，准予销差离山！滚——都给本执事滚出去！！”\n\n一刻钟后，云泽宗山门外五里，云雾缭绕的送客山亭。\n\n陈长庚挑着两只空竹篓停在石亭阶下，将路引双手递还。\n\n山风吹动苏清晏素白衣袂，她接过路引，深深看了一眼面前这个永远低眉顺眼、一出手却能把贪官污吏噎死在公堂上的青年。\n\n没有俗套寒暄，更无儿女情长的黏腻拉扯。\n\n苏清晏素手一翻，取出三枚长约四寸、通体呈深邃暗蓝、表面铭刻着繁复古篆导磁纹的精铁短钎，“叮叮叮”并排放在石亭栏杆上。\n\n“此乃寒磁母铁精炼的‘破磁铁钎’，非前几日那些寻常试脉钎可比。”\n\n苏清晏清泠嗓音在山雾中平静响起：“三钎按三角入地三寸，以敛息阵纹勾连地磁，十息内可锁死通窍修士一切百炼精钢飞刃法器。”\n\n“天阵宗旧账待清，我今日便走。你我命账两清，云泽水浑，好自为之。”\n\n话落，她不再回头，转身登车放下青布车帘。\n\n老车夫一抖缰绳，青骡兽车辚辚碾过碎石官道，很快没入苍茫山雾深处，再不见踪影。\n\n陈长庚走上石亭，伸手将那三枚沉甸甸的精炼破磁铁钎收入袖囊，朝着浓雾翻涌的远山郑重拱手一礼。\n\n随即他直起腰背，挑起空竹篓，转身大步迈回云泽宗外门。\n\n日头渐偏，后山废渣谷黑烟蔽日，山道两侧荒草凄迷。\n\n刚拐过谷口那排荒废十余年、早已塌了半边山墙的甲字废渣房坡道，陈长庚低垂的眼角余光忽然极轻微地往上一扫——\n\n只见右侧破败黑瓦屋脊的烟囱阴影后头，正纹丝不动蹲伏着两道身穿器堂暗褐劲装的精悍身影！\n\n两人呼吸绵长沉重，太阳穴高高鼓起如核桃，赫然全是器堂最顶尖的通窍九窍巅峰老弟子，四只毒蛇般阴冷残忍的眼睛，正死死盯着百丈外丙字废渣房紧锁的熟铁院门！"}, {"n": 90, "title": "夜坑葬双", "body": "破败的黑瓦屋脊后头，那两双毒蛇般的眼睛死死钉在丙字废渣房院门上。\n\n陈长庚脚步未停分毫，连眼皮都没往上抬一下。\n\n他弓着虾米腰，挑着两只空竹篓晃晃悠悠踩过碎煤渣山道，嘴里喘着拉风箱似的破锣粗气：“咳咳……这鬼天气，骨头缝里都冒酸水……”\n\n一边咳，他一边慢吞吞掏出铁钥匙捅开丙字房熟铁院门，挑篓进院，“哐当”落了明锁。\n\n直到百丈外那排塌墙被院门彻底挡死，屋脊阴影里蹲伏的两名器堂九窍巅峰老弟子才悄然缩回脑袋。\n\n“狄师兄，瞧见没？挑个空竹篓上坡都喘成死狗，真是那个古盐墟活下来的挑箱杂役？”\n\n说话的是个满脸横肉、背负精铜圆盾的粗壮汉子段千钧，嗓门压得极低。\n\n蹲在他身侧的鹰钩鼻瘦高汉子狄冲冷笑一声，指尖摩挲着袖口两柄薄如柳叶的百炼精钢飞刀：\n\n“许长老在辕门当众验过，一个走了狗屎运的通窍七窍病秧子罢了。”\n\n段千钧舔了舔干裂嘴唇：“霍师兄昨夜强吞那五瓣残莲冲脉，被赤火毒烧得差点废了气海，怎会疑心这穷鬼手里藏着寒属性灵粹？”\n\n“宁杀错，勿放过！”\n\n狄冲眼神阴冷如冰，“霍师兄闭死关前下了死令，古盐墟底坑破开过太古死禁，万一这小子在西偏沟里捡过小块伴生寒玉，正好拿来给霍师兄压火毒！”\n\n段千钧狞笑点头：“那还等什么？咱们兄弟现在翻进去拧断他四肢！”\n\n“蠢货！大白天外门纳贡院的人随时来催捐，撞见了惹一身骚。”\n\n狄冲抬眼扫了扫天色，“等三更天全谷熄火，迷烟一吹，活捉搜魂再往地火熔坑里一推——谁知道他是畏罪跳坑还是病死了？”\n\n两人计议已定，重新伏低身形静候夜幕。\n\n丙字废渣房院内。\n\n陈长庚不紧不慢在院角生起小泥炉，故意往炭火里扔了两把潮湿臭艾草，熬上一罐苦涩刺鼻的劣等清肺汤，呛得自己隔三差五干咳几声。\n\n一转身迈进内室，他脸上那副病弱惶恐之色瞬间敛得干干净净。\n\n“通窍九窍巅峰，一刀一盾。”\n\n陈长庚反手掩上内室木门，眼神冷冽如铁。\n\n白日山道那一眼，他早已把两人的器物路数摸了个底朝天——瘦高个两袖坠手，藏的是器堂成名的百炼精钢飞刀；壮汉后背隆起圆弧，背的是一面不惧寻常刀剑的精铜重盾。\n\n苏清晏临别留下的那三枚精炼破磁铁钎，简直是为这两人量身打好的棺材钉！\n\n陈长庚当即蹲在内室门槛内侧三尺处，撬开三块松动青砖，取出那三枚四寸长、铭刻繁复古篆的寒磁母铁短钎。\n\n“咄、咄、咄。”\n\n三记无声寸劲吐出，三枚破磁铁钎呈品字三角深深没入砖下三寸，正好卡死地下硫火支脉与铁矿层交汇的磁眼！\n\n陈长庚指尖蘸起一抹黑卤泥，依着《地脉敛息阵图》的导磁暗纹在砖缝间飞快一勾，再把浮灰轻轻扫平，看不出丁点撬动痕迹。\n\n做完这一步，他又撬开地火排烟道侧壁火砖，从白日封泥深埋的暗槽里摸出那两颗赤阳雷火弹，随手将暗槽重新封严。\n\n寻常雷火弹炸伤九窍巅峰有余，想一击废掉死士捏碎传讯玉符的手爪还差三分火候。\n\n陈长庚拆开外层油纸，从储物袋抓出两把破禁生铁砂与硫粉死死裹在外壳上，再用浸油麻绳双层勒紧——一旦贴脸引爆，杀伤力足足翻上一倍！\n\n他将两颗改装过载的赤阳雷火弹扣进左手暗囊，右袖滑槽顶上百炼乌金破甲分水刺，腰间寒铁虫瓮打开一线活扣，吹熄油灯，盘膝坐到了内室土炕最里侧的阴影中。\n\n夜色一层层压垮废渣谷。\n\n子夜将近，外头风声呜咽，各院炉火尽熄，三更梆子声隔着山雾隐隐传来。\n\n“咔。”\n\n丙字房低矮的后院土墙上，两道黑影如夜枭般悄无声息翻落院中，落地连一粒煤渣都没踩响。\n\n狄冲打了个手势，摸到内室木窗根下，用唾沫润湿窗纸戳开一个小孔，将一管淡甜无味的“软筋迷魂烟”缓缓吹了进去。\n\n等了十几个呼吸，屋里土炕上传来一阵沉闷绵长的酣睡鼻息，再无动静。\n\n“成了，睡得跟死猪一样。”\n\n狄冲嘴角勾起一抹轻蔑冷笑，对身后的段千钧偏了偏头：“进去直接钉穿琵琶骨，堵嘴搜魂！”\n\n“好嘞！”\n\n段千钧左手一晃，一面三尺高、半寸厚的百炼精铜圆盾稳稳架在身前，抬起精铁战靴对着内室木门插销狠狠一脚踹落！\n\n“砰——咔嚓！”\n\n腐朽木门应声炸裂洞开！\n\n门开的刹那，狄冲不讲半分江湖规矩，双袖顺着段千钧肩头两侧闪电般一抖！\n\n“咻咻咻咻！”\n\n四道凄厉乌光破空激射，四柄削铁如泥的百炼精钢断魂飞刀裹着九窍巅峰真气，分取土炕黑影的双肩与双膝，一照面就要把人废成血葫芦！\n\n“中！”狄冲狞笑刚起。\n\n土炕阴影里，本该昏死过去的陈长庚倏然睁开双眼，左手食指对着脚下青砖轻轻一按！\n\n“嗡——！！”\n\n地面三寸之下，三枚精炼破磁铁钎骤然亮起幽蓝古篆阵纹，一股狂暴十倍的地下逆乱斥磁之力如无形铁网冲天卷起！\n\n“铛铛铛铛！”\n\n半空中疾射的四柄百炼精钢飞刀像是撞上了万钧磁石，凄厉破空声戛然而止！\n\n四刀失控歪斜着狠狠砸落青砖，刀身死死吸贴砖面，连刀柄都震不起来半分！\n\n就连段千钧腰间悬挂的那柄厚背精钢斩骨刀，也“哐”地一声连鞘带人往地面猛坠三寸！\n\n“反磁困阵？！不好，有诈！！”\n\n狄冲脸色剧变，双手拼命掐诀催动气机，可地上的四柄本命飞刀如同浇铸进了生铁地基，纹丝不动！\n\n“怕个卵！老子这面盾是纯精铜铸的，不吃磁力！”\n\n前头的段千钧到底是尸山血海滚出来的器堂凶徒，临危不退反进，暴喝一声扯掉腰刀皮扣，双臂灌足九窍巅峰横练蛮力，顶着三尺百炼精铜重盾如狂奔铁犀撞向土炕前的陈长庚：\n\n“装神弄鬼的小杂种，给老子碾成肉饼——狄师兄快捏符喊外院的人！”\n\n四尺、三尺！\n\n狭窄内室里避无可避！\n\n面对泰山压顶撞来的精铜重盾，陈长庚一声不吭，体内打磨到极致的通窍九窍浑厚气血轰然炸开，灰麻衣袖鼓荡如铁，腰间寒铁虫瓮盖子应声弹飞！\n\n“嗡——！”\n\n三十六道背生紫金暗纹的乌金细影化作一团死亡黑旋风，迎面扑上精铜重盾正中央！\n\n吞食过地母玄晶碎屑的二蜕嗜铁煞甲虫，凶悍程度早已今非昔比！\n\n“咔嚓嚓——嗤啦！”\n\n在段千钧惊骇欲绝的目光中，足以硬扛九窍刀剑劈砍十余合的半寸厚百炼精铜重盾，竟像一块酥脆麦饼，短短两息便被三十六只异虫啃穿出一个碗口大的透亮破洞！\n\n“什么鬼虫子？！”\n\n段千钧肝胆俱裂，刚想弃盾后撤！\n\n对面的陈长庚早已一步跨前贴死盾面，全身九窍横练劲力聚于右肩悍然撞偏残破铜盾，右袖滑槽内九寸三分的百炼乌金破甲分水刺如毒龙出洞，顺着虫群啃出的碗口盾洞笔直捅入！\n\n“噗嗤——！”\n\n乌黑锋刃毫无阻滞地扎穿段千钧胸前软甲，从左胸心口一贯到底，透背而出！\n\n手腕冰冷一拧，心脉尽碎！\n\n“呃……嗬……”\n\n段千钧魁梧身躯猛地僵直，口鼻狂涌鲜血，连惨叫都没挤出来便轰然跪倒断气！\n\n从破门到一名九窍巅峰体修毙命，前后不过短短三个呼吸！\n\n“段师弟？！”\n\n站在门口的狄冲吓得头皮炸裂，哪里还敢存搜魂夺宝的念头，脚尖一点门槛疯狂暴退向院中！\n\n他左手扬手撒出一把喂毒铁蒺藜封挡身后，右手探进怀里抓出一枚赤红滚烫的“器堂急调传讯符”，五指发力便要当场捏碎！\n\n只要符光冲上夜空，守在废渣谷外头的器堂巡夜队半刻钟就能杀到！\n\n“想报信？问过我手里的雷没有！”\n\n陈长庚岂会容符光漏出院墙？\n\n他看都不看脚边被反磁阵吸落的毒蒺藜，左手自暗囊抓出那两颗双层加固过载的赤阳雷火弹，大拇指闪电刮燃引信，算准狄冲跃出门口腾空的死角，双雷并拢贴地疾甩而出！\n\n“不——！！”\n\n狄冲刚退到院心，低头瞥见两团刺目赤白火光追至胯下右肋，吓得拼命侧身甩手护头！\n\n“轰隆——！！！”\n\n两颗过载赤阳雷火弹在丈许见方的小院天井里同时贴身炸开！\n\n受院墙与门内反磁煞气阻隔，狂暴火浪向内闷卷，漫天破甲生铁砂将狄冲右侧护体真气当场撕得粉碎！\n\n“啊——我的手！！”\n\n狄冲凄厉惨嚎着横飞出去，重重砸在后院煤渣堆上！\n\n他整条右小臂连同掌心还没来得及捏碎的那枚赤红传讯玉符，已被两颗过载雷火弹生生炸成了焦黑碎肉与玉粉，连一星传讯灵光都没能飞出院墙！\n\n两颗赤阳雷火弹全数耗尽，滚滚煤烟恰好盖住了院中血腥气！\n\n不等狄冲挣扎爬起，陈长庚身影已如鬼魅般掠出内室，草鞋重重一脚踏在狄冲塌陷的胸口上，冰冷刺骨的乌金分水刺尖端直接抵进他左眼眶三分：\n\n“再喊一声，我把三十六只虫子塞进你肚子里慢慢啃。”\n\n“别、别杀我！！”\n\n狄冲剧痛攻心，察觉眼珠上传来的刺骨寒意，吓得浑身筛糠般乱抖，死死咬住牙关不敢高声：“陈、陈师弟饶命！我袋里有十五块整灵石，全归你！”\n\n“霍千山现在在哪儿？外头还有谁知道你们两个今晚过来？”陈长庚声音平淡得没有一丝起伏。\n\n“没了！一个人也没有！”\n\n狄冲生怕慢一息被活活喂虫，竹筒倒豆子般急喘道：“霍师兄昨晚吞五瓣残莲强冲开脉走火入魔，赤毒攻入心脉，天黑前已经落下千斤断龙石闭了七日死关！”\n\n“他怕走漏冲脉失败的风声引来曹、梁两家落井下石，只密令我和老段趁夜过来摸底，外头巡夜队压根不知情！”\n\n陈长庚眼神微动：“器堂那位龚铁横执事呢？”\n\n“龚执事去三宗交界黑石峪查矿了，最快也得五天后才回山！我说的句句属实，求陈师弟留我一条贱命——”\n\n七日死关，无人知情，龚铁横五日后方归！\n\n这正是他冲击开脉境千载难逢的真空窗口！\n\n“多谢狄师兄把日子算得这么清楚。”\n\n陈长庚轻声道了句谢，右手乌金破甲分水刺干脆利落往下重重一送！\n\n“噗！”\n\n狄冲求饶声戛然而止，四肢抽搐了一下，彻底断绝气息。\n\n陈长庚手脚麻利至极，在两具尸首腰间一通摸索。\n\n两个鼓囊囊的器堂内院储物袋入手，抹开无主袋口一清点——狄冲袋里十五枚、段千钧袋里十三枚，整整二十八枚成色上佳的完整下品灵石，外加一面可出入内门地火支脉的赤铜“器堂火脉令牌”和几瓶疗伤散！\n\n算上火道暗槽埋着的九十枚与贴身两枚，他手头的完整下品灵石一举突破百数，涨到了整整一百二十枚！\n\n陈长庚指尖一引收回三十六只吃饱精血的二蜕煞甲虫，撬回砖下三枚完好无损的破磁铁钎，随后抓起内室墙角连接地下三丈主火道的生铁排灰盖板猛力一掀！\n\n滚滚赤红热浪扑面涌出，底下便是日夜沸腾、连精铁都能融成汁水的全宗地下硫火主熔坑！\n\n他一手拎起一具尸首，连同那面啃穿的精铜破盾、四柄精钢飞刀、段千钧的腰刀以及院里刮起的全部染血泥渣，一股脑儿全推进了深不见底的赤红岩浆火坑之中！\n\n“嗤——轰！”\n\n岩浆翻卷吞没，不过三五个呼吸，器堂两名通窍九窍巅峰死士便化作了袅袅青烟，世间再无寸骨留存！\n\n陈长庚合死生铁盖板，提了两桶黑卤污水将天井煤渣冲刷干净，转身走到丙字废渣房院门与内室门后，双手发力，“哐啷、哐啷”连续落下两道千斤重的熟铁横闸！\n\n外绝人踪，内锁风烟！\n\n回到寂静滚烫的内室，陈长庚撬开排烟道侧壁暗槽，取出那只封存着二阶奇物的寒玉小匣。\n\n推开玉盖，三枚龙眼大小、紫金游龙流转的无瑕“玄脉道晶”映亮了他沉静如渊的双眸。\n\n今夜已交二月初九子时，距离二月十二辰时冯保山带打手上门强收丙字房、削籍发配黑水死矿，满打满算仅剩最后三日有余！\n\n待十一日寅末石臼潮汐再满开出第二炉，两炉六枚玄脉道晶，足够把这外门的天捅个窟窿了！\n\n陈长庚盘膝坐上火炕，不再迟疑，捻起第一枚温润沉重的紫金玄脉道晶仰头吞入腹中——晶丸入喉即化作一道咆哮奔涌的紫金洪流，狠狠撞向体内尘封十六年的周天仙脉壁障！"}, {"n": 91, "title": "借瘟钉门", "body": "紫金洪流顺着咽喉轰然炸入四肢百骸。\n\n没有劣等丹药的燥烈火刺，温润霸道的二阶道晶药力如百川灌海，顶住第一道蒙尘气窍的顽垢，摧枯拉朽般撞了过去！\n\n“咔！”\n\n内室滚烫的火炕上，陈长庚双目紧闭，脊背青筋如铁虬隆起，额角瞬间渗出一层腥臭发黑的陈年卤毒汗珠。\n\n二月初九一整日，再到入夜子时。\n\n每当药力冲开两道窍桥、势头稍缓，陈长庚便毫不犹豫探指入怀，摸出备用封晶寒玉小匣里的第二枚、第三枚紫金“玄脉道晶”，接连仰头吞入腹中！\n\n首炉三枚零丹毒道晶尽数化开。\n\n一连六道困扰他十六年的九窍蒙尘死锁被硬生生贯通首尾，周身三千五百斤暗金锻骨气血奔腾如雷，只差最后一道横亘心肺之间的顽障，便能彻底连成周天仙脉！\n\n就在陈长庚凝神收拢六桥药力、静待明日寅末石臼潮汐再满做最后一击时——\n\n“哐！哐哐！！”\n\n前院那扇落了千斤横闸的熟铁大门，突然被人用重铁锤砸得震天价乱响，梁顶积年的黑炉灰簌簌直往下掉！\n\n陈长庚眉心猛地一跳，丹田内奔涌的紫金气血骤然激荡翻腾。\n\n此刻六道窍桥刚搭起雏形，一旦强行散去气机下炕开门，逆冲的药力当场便能震裂心脉；可若真放任外头把铁门砸穿闯进来，他这一身瞒不住的九窍圆满气血便彻底漏了底！\n\n门外，一个油腻尖细的胖子嗓门骂骂咧咧炸开：\n\n“庞书办你自个儿瞧！日头都晒屁股了，这姓陈的小杂种还敢拿铁闸顶着门装死！”\n\n正是花了十五枚下品灵石买下丙字废渣房的富户杂役蔡金满！\n\n“蔡老弟消消气，犯不着跟个快断气的肺痨鬼置气。”\n\n纳贡院书办庞文禄把玩着袖里刚收的一块碎灵石，公鸭嗓里满是不屑，“冯管事虽说限他二月十二辰时交捐腾房，可哥哥既然收了你的茶水钱，今儿初十午时准保让你搬进来！”\n\n“那还不快砸！”蔡金满拿绸帕捂着鼻子直扇煤灰，“十五块整灵石我都交了三天了，大通铺潮得老子风湿犯了一宿，今儿不把这穷鬼撵去睡山沟，我可找冯管事退钱去！”\n\n“退什么钱！阿牛、疤子，拿开山锤给老子砸断门耳！”\n\n庞文禄一听退钱二字顿时急了眼，指着门缝厉喝，“那陈长庚前天夜里还哭着找本官借两块灵石买药，早就剩最后一口游气了，砸开门拿草席一卷往乱葬岗一扔完事！”\n\n“好嘞庞爷！”\n\n两名纳贡院力夫吐了口唾沫，抡起二十斤重的八角铁锤，照着院门左侧铁铰链狠狠砸落！\n\n“铛——！！”\n\n火星四溅，熟铁门轴发出一声令人牙酸的呻吟，外门砖框裂开两道指宽大缝！\n\n内室火炕上，陈长庚双眸倏然睁开一线寒芒，盘坐的双腿却纹丝未动。\n\n“提前两天砸锁逼迁？好得很。”\n\n他心里冷笑一声——想进屋，那便请你们好好闻闻这丙字房攒了十年的老味道！\n\n陈长庚右手稳稳按在丹田锁住六道窍桥，左手食指对着腰间寒铁虫瓮极轻地一挑。\n\n三道背生紫金暗纹的乌金细影悄无声息滑出瓮口，顺着火炕砖缝疾窜入西侧排烟暗道！\n\n那里积着丙字房历任短命杂役熬炼废丹留下的十年陈年铅砒黑垢，全靠一块朽铁挡板封着倒灌风口。\n\n“咔嚓、咔嚓！”\n\n不过两个呼吸，三只凶悍绝伦的二蜕嗜铁煞甲虫便将挡板锈死的两颗铁销钉齐根咬断！\n\n外头第三锤刚举到半空，蔡金满正踮着肥脚凑到西侧破木窗根下，探头往窗缝里瞧热闹：“砸重点！老子倒要看看这穷小子死在炕上没有——”\n\n火炕阴影里，陈长庚左手尾指勾住连着墙角的一根细铁丝，猛地往回一拽！\n\n“轰——呼啦！！”\n\n西侧十年未开的铅毒回风栓骤然洞开！\n\n地下硫火热浪顶着整整一烟道腐烂发臭的浓紫铅砒毒烟，如一条咆哮毒蟒自内室木窗缝隙与门底风口狂喷而出，结结实实糊了蔡金满一整张肥脸！\n\n“噗——咳咳咳！！哎哟我的妈呀！！”\n\n蔡金满连一步都没躲开，一口滚烫腥辣的浓紫毒烟直接呛进嗓子眼，肥厚双唇肉眼可见地燎起一串乌黑水泡，整个人杀猪般惨嚎着仰面栽进煤渣堆里！\n\n“什么鬼烟？！”两名抡锤力夫呛得涕泪横流，丢下铁锤抱头暴退三丈！\n\n就在满院紫黑恶烟翻滚之际，紧锁的内室里突然传出陈长庚嘶哑破碎、活像破风箱漏气般的剧烈咳血声：\n\n“咳……咳咳咳！外头……外头是蔡师兄和庞书办到了么……”\n\n陈长庚咬破舌尖，运起一丝腹语震响空药罐，哭喊声凄厉得让人头皮发麻：\n\n“救命啊蔡师兄！小人从沉渊古盐墟底下带回来的‘腐肺尸瘟’烂穿胸口了……咳噗！满炕都是流出来的黑血脓水，两条腿早烂得动弹不得了！”\n\n“求蔡师兄发发善心，快砸开门进来搭把手，背小人去寻脉馆讨口汤喝……屋里这床烂棉絮和两个药罐子，小人全孝敬蔡师兄当谢礼了！咳咳咳——！”\n\n腐肺尸瘟？！烂穿胸口流黑脓？！\n\n煤渣堆里打滚的蔡金满一摸自己满嘴火辣辣的黑水泡，脑子里嗡的一声炸了锅，裤裆瞬间湿了一大片！\n\n“瘟、瘟神啊！！古盐墟带出来的绝户尸瘟啊！！”\n\n蔡金满连滚带爬往谷口疯跑，肿成两根紫黑香肠的嘴唇直哆嗦，回头指着庞文禄破口大骂：\n\n“庞文禄你个丧尽天良的狗杂碎！你管这叫清静福地？！里头躺着个流黑脓的古墟尸瘟鬼，你想害死老子吃绝户是不是？退钱！十五块灵石少一子儿老子去内门撞冤钟！！”\n\n“蔡老弟别跑！听哥哥解释，前两天他还没烂成这样啊！”\n\n庞文禄自己也吓得脸皮发绿，一听要去内门撞钟，脊梁骨都凉了半截——这十五枚灵石大头全进了冯保山腰包，这时候闹退钱，冯保山非扒了他的皮不可！\n\n庞文禄连退十步捂紧口鼻，急中生智冲着远处的蔡金满嘶声大喊：\n\n“蔡老弟你怕什么！腐肺尸瘟不出三天准咽气！等他烂死在炕上，咱们不进屋，直接从天窗灌两桶火油连人带炕烧成白灰，再洒十斤生石灰，照样是一间干干净净的好瓦房！”\n\n蔡金满缩在三十丈外的坡道上捂嘴直哼哼：“那、那万一他半夜爬出来抓人垫背呢？！”\n\n“爬个屁！阿牛、疤子，快去前头废甲字房拆四块三寸厚的松木门板，再拿一篓四寸棺材钉来！”\n\n庞文禄指着毒烟袅袅的丙字房大门，发狠跺脚喝道：\n\n“从外头给老子十字交叉钉牢！连窗框一块封严实了！谁也不准靠近三十丈内，等二月十二过了辰时他烂透断了气，咱们再请冯管事带火油来收尸！”\n\n两名力夫早吓破了胆，屏着气抱来四块厚重腐木板，隔着湿布巾抡锤狂砸。\n\n“砰、砰、砰、砰！”\n\n十几根四寸长的生铁棺材钉穿透木板，重重楔进丙字房青石门框与西侧木窗外框，转眼把整座院落封成了一口插翅难飞的死棺材！\n\n杂乱慌张的脚步声一路逃出废渣谷，外头瞬间死寂得连根针掉在地上都能听见。\n\n内室火炕上，陈长庚缓缓松开勾着回风栓的左手，抹去嘴角一抹自咬的淡血，冷峻唇角微不可察地勾了一下。\n\n省心了。\n\n有蔡金满那满嘴黑泡做活招牌，二月十二辰时之前，便是借庞文禄十个胆子，外门也没一条野狗敢往这扇“尸瘟门”跟前凑一步！\n\n他不慌不忙召回烟道里的三只二蜕煞甲虫，闭目调匀体内浩荡气血，顺手取出一块古盐墟带回的多孔灰白废石灰壳，借掌心一丝石臼余韵烘去水汽，雕琢成半块灵气枯竭的天然石乳空壳搁在一旁备用。\n\n日升月落，封钉的瘟宅内彻底隔绝了昼夜人迹。\n\n直至次日二月十一寅末时分！\n\n地火暗槽旁，沉寂了整整三十六个时辰的半截“蚀纹石臼”，断口处那道非金非玉的暗金裂痕骤然再度滚烫嗡鸣——新一轮地脉潮汐充能，准时圆满！\n\n陈长庚精神大振，翻身下炕。\n\n他先将苏清晏所赠的三枚寒磁母铁破磁铁钎钉入排烟道暗眼，熟练掐动《地脉敛息阵图》的“借煞倒卷诀”，令地下硫火主熔坑产生一股强劲吸力。\n\n紧接着，他推开其中一只上古锁灵寒玉封匣，用百炼乌金破甲分水刺自八成重的地母玄晶主髓上，再度精准切下约莫两成重、拳头大小的一块紫金核心母引按入臼心，将余下六成主髓重新严封收妥。\n\n随后解开隔磁蛟皮袋，把最后剩下的半袋约三四斤“百年凝卤髓渣”一股脑儿全数倒进石臼！\n\n“嗡——轰！”\n\n紫金浆液沸腾翻滚，十倍浓郁的霸道腥甜奇香刚一冒头，便被倒卷风压涓滴不漏地扯入三丈下的赤红岩浆熔坑焚为虚无！\n\n一刻钟后，时交二月十一卯初，异香敛尽。\n\n臼底清光莹然，第二炉整整三枚纯净无瑕的紫金“玄脉道晶”滚落掌心！\n\n距离明日二月十二辰时冯保山带人来烧屋收房，还剩整整十三个时辰。\n\n陈长庚盘膝重坐火炕，目光如电，没有丝毫迟疑，抬手将这新出炉的三枚滚烫玄脉道晶一并拍入口中咽入腹底——两炉六晶药力瞬间汇成九天狂澜，在他脊骨与心肺深处骤然炸开一声惊天闷雷！"}, {"n": 92, "title": "九窍贯脉", "body": "“轰隆——！！”\n\n那声闷雷不在耳畔，而在陈长庚紧闭的心肺大窍正中央轰然炸响！\n\n前日打底的三枚道晶药力与刚刚入腹的三枚滚烫紫金洪流首尾相撞，没有任何丹毒阻滞，化作一柄无坚不摧的暗金重锤，对着横亘在第六窍与心肺主窍之间的那层十六年蒙尘死膜悍然砸落！\n\n一遍、两遍、三遍！\n\n陈长庚浑身骨骼发出炒豆般的密集脆响，体表毛孔渗出一层腥臭粘稠如桐油般的乌黑毒脂——那是早先在乌卤盐场熬煮黑卤、后来在丙字房筛废丹灰积攒在骨髓深处的凡俗沉疴！\n\n剧痛如万针攒刺，陈长庚牙关咬得咯咯作响，神智却清醒冷冽得可怕，严格循着气海路线引动洪流一路横推！\n\n“咔嚓——哗啦啦！！”\n\n卯初晨光微透窗缝的刹那，最后一层顽固死障应声崩碎成虚无！\n\n第一窍至第九窍豁然洞开，九座气窍首尾贯连，在陈长庚体内轰然构筑成一条生生不息、自行吐纳天地灵煞的完整“周天仙脉”！\n\n汹涌澎湃的周天真气奔流百骸，干涸的气海瞬间拓宽十倍不止，一股前所未有的轻灵与磅礴生机自髓海深处涌遍全身——凡俗百载寿限一朝打破，寿元暴涨至二百四十载！\n\n心念微动间，一层厚约寸许、凝练如暗金琉璃般的“地火煞罡”自然浮出体表，将炕上残留的毒脂黑垢震成飞灰！\n\n“沙沙沙——！”\n\n火炕下方，敞开盖子的寒铁虫瓮内，三十六只原本就吞食过玄晶碎屑的二蜕嗜铁煞甲虫，贪婪鲸吞着主人破境时溢散满室的精纯紫金道韵。\n\n不过盏茶工夫，三十六只异虫背甲上的紫金暗纹彻底凝实如精铁浇铸，气息齐齐跨过门槛，尽数蜕变为足以威胁开脉修士的一阶巅峰铁甲虫群！\n\n“开脉境初期……成了。”\n\n陈长庚缓缓吐出一口长达三尺的灼热白气，抬起右手一看，昔日因火毒发乌的指节早已莹润如铁玉，五指轻轻一握，空气竟发出一声低沉气爆！\n\n自去年秋末至今大半载光景，从乌卤盐场二两银子一个月的等死学徒，到今日终是踏破了这道仙凡天堑！\n\n但他眼底没有丝毫得意忘形，静坐炕头调息稳固了整整一个白昼的周天境界。\n\n待夜幕彻底笼罩后山、时交二月十一亥时，陈长庚翻身下炕，将屋内一切痕迹清理得干干净净，连地砖下早先藏的七十五两纹银与火道暗槽里的家当都一粒不剩起出。\n\n“藏着开脉修为半夜偷逃，只会落个畏罪叛宗的海捕铁案；云泽宗祖制，凡开脉者不论出身直入内门授执事——这身合法的执事虎皮，不披白不披！”\n\n陈长庚心意已决，先运转《地脉敛息阵图》将周身浑厚气机与面容轮廓严密裹住，随后用九宫浊泥封灵纹把装有六成地母玄晶的两只上古寒玉封匣、蚀纹石臼、一百一十八枚整灵石、四十五钱无瑕髓晶及分水刺等重宝捆成一团死泥包。\n\n腰间洗得发白的外门储物袋里，只留两枚磨损旧灵石与那半块预先烘制好的枯竭“地髓异乳”灰白石壳。\n\n做完这一切，他走到钉着四块厚松木板的院门后，并指轻轻一震！\n\n“啪、啪、啪！”\n\n外头楔进石框的十几根四寸棺材钉寸寸震断滑落，陈长庚悄无声息闪出丙字房，先绕去后山绝壁一处干燥盲缝将封泥重包稳妥藏好，这才踏着浓重如墨的谷外夜雾，往通向内门升仙殿的青石山道行去。\n\n与此同时，废渣谷山口十丈外的老槐树阴影下。\n\n身穿锦缎皂袍的内门开脉初期执事曹敬塘背负双手，脸色阴沉得能滴出水来，身旁跟着独眼恶奴曹旺。\n\n“老爷，刑律堂许长老前日才发了钧令，严禁各房私审古盐墟生还弟子。”\n\n曹旺压低嗓门，独眼里满是惴惴不安，“咱们半夜瞒着刑律堂摸来外门废渣谷，万一走漏了风声……”\n\n“闭嘴！无极是我曹敬塘亲侄儿，就这么不明不白折在古盐墟，梁家那老匹夫又咬着牙不肯认账！”\n\n曹敬塘咬牙冷哼，袖中开脉初期的阴寒血蝠煞气蠢蠢欲动，“前几日问话那小杂役滑得像泥鳅！本执事不管他是不是真染了什么古墟尸瘟，今夜拧开他天灵盖直接搜魂，三息便知内窟门口到底是谁害了无极！”\n\n曹旺咽了口唾沫：“可小的昨日打听过，纳贡院庞文禄嫌那丙字房闹尸瘟，已经拿棺材钉把门封牢了……”\n\n“封牢了更好，省得惊动旁人！”\n\n曹敬塘一摆袖袍，“你就守在山口望风，敢放一个人过来，老子摘了你的脑袋！”\n\n“是、是！小的守紧山口！”曹旺慌忙弓腰退入坡下草丛。\n\n曹敬塘冷笑一声，身形一晃掠入滚滚浓雾弥漫的谷口羊肠窄道。\n\n刚往前掠出不足二十丈，山雾翻涌的前方石阶上，一道裹在灰暗雾气里、看不清面目高矮的沉默人影，恰好迎面缓步走了出来！\n\n“嗯？三更半夜，哪个外门鼠辈敢在废渣谷晃荡？！”\n\n曹敬塘心头一惊，生怕撞破自己私下抓人搜魂的勾当，干脆一不做二不休，右爪骤然凝起一团腥风扑鼻的开脉初期“阴蝠裂魂罡”，照着对面人影胸口悍然抓落：\n\n“给本执事跪下！”\n\n雾影之中，正欲出谷的陈长庚脚步一顿，一眼认出了曹敬塘袖口的赤金血蝠暗纹！\n\n曹无极的亲叔父，半夜三更做贼似地摸进废渣谷，不用问也是冲着他陈长庚那点魂魄记忆来的！\n\n不能开口，更不能动用分水刺露了底细！\n\n陈长庚眼神冰寒，借着《地脉敛息阵图》模糊面容与身形骨骼，不闪不避，体内刚刚贯通的周天仙脉轰然一转，右手握拳裹起一层毫无门派路数、却纯粹霸道到极致的暗金地火煞罡，迎着那记阴寒利爪正面硬撼而上！\n\n“砰——！！”\n\n拳爪在伸手不见五指的浓雾中结结实实撞在一处！\n\n没有花哨术法，唯有零丹毒玄脉道晶铸就的浑厚根基加上三千五百斤横练锻骨巨力，正面碾过曹敬塘斑驳虚浮的丹药煞气！\n\n“咔嚓！”\n\n一声清脆的指骨裂响混着闷哼炸开！\n\n“什么？！”\n\n曹敬塘只觉自己抓上的不是血肉手掌，而是一尊烧红的万钧生铁神砧！\n\n一股炽烈浑厚得不像话的无属性煞罡顺着指尖狂冲而入，当场震碎他右掌护体灵光，虎口皮肉“嗤啦”撕裂飙血，整条右臂酸麻欲断，脚下“蹬蹬蹬”连退五大步，后背重重撞在湿滑山壁上！\n\n而浓雾对面那道神秘身影击退他之后，竟连一句场面话都懒得吐露，负手微偏过头，冰冷目光隔着黑雾如刀锋般在曹敬塘脸上刮了一记！\n\n执法堂暗哨？！\n\n做贼心虚的曹敬塘脑海中轰然闪过这个念头，后背冷汗瞬间浸透了三层锦衣！\n\n整个云泽宗外门，哪有不显山不露水、随手一拳便能震裂他开脉执事虎口的无名高手？！\n\n定是执法长老许镇岳料定他曹敬塘不服管束会半夜摸来抓生还杂役搜魂，故意在废渣谷口埋了一位执法堂老牌开脉供奉“钓鱼抓现行”！\n\n刚才对方一言不发留手不追，分明是认出了他曹家路数，等着明日拿铁证上刑律堂参倒他！\n\n“走！！”\n\n曹敬塘哪里还敢再试第二招，吓得心胆俱寒，左手捂紧鲜血淋漓的右虎口，转身化作一道狼狈黑烟疯也似地冲出山口！\n\n“老爷！抓着那姓陈的小杂种了吗？！”草丛里的曹旺连忙迎上来，一眼瞥见自家老爷满手是血，眼珠子差点瞪出眶外，“老爷您的手怎么裂了？！”\n\n“闭上你的狗嘴！！”\n\n曹敬塘反手一耳光抽歪曹旺半边脸，脸色煞白地频频回头张望浓雾，“谷里蹲着执法堂的开脉老硬茬护着那间院子！快走，把今晚咱们主仆出过内门的脚印全抹干净，再敢提废渣谷一个字，老子先剁了你喂狗！”\n\n主仆二人屁滚尿流，眨眼间逃得没了踪影。\n\n谷口石阶上，夜风吹散缭绕毒雾。\n\n陈长庚散去面庞敛息雾气，低头看了看毫发无伤的右拳，随手一震，将指缝最后一丝沉积多年的沉疴灰垢彻底震散在山风里。\n\n内视丹田气海，九窍如星辰拱卫，一条紫金交织的周天仙脉奔流不息。\n\n抬眼望向半山腰云海之上，那座彻夜灯火通明、象征云泽宗真正仙凡分界线的巍峨“升仙殿”已在晨曦前微露飞檐，陈长庚整了整洗得发白的灰麻衣襟，迈开大步，一步步稳稳踏上了登殿长阶！"}, {"n": 93, "title": "碎鞭叩殿", "body": "二月十二，卯末辰初。\n\n天边刚翻起一抹鱼肚白，内外门交界的百级白玉石阶上寒雾未散，巍峨古朴的“升仙殿”高悬于云台之上，檐角那口千斤青铜升仙钟静默无声。\n\n算算时辰，再过两刻钟到了辰时，外门纳贡院管事冯保山就该端着紫砂壶，等他陈长庚送去十枚灵石“修炉抚恤捐”，或是拿黑水死矿的铁枷去丙字房锁人了。\n\n陈长庚神色平静，踩着整洁却发白的灰麻布鞋，一步步踏上最后十级白玉阶。\n\n“站住！外门杂役止步——嗯？！”\n\n殿前广场侧廊下，正揣着袖子巡值点卯的外门庶务执事赵怀恩斜眼一瞥，原本睡眼惺忪的老脸瞬间拧成一团狰狞，大步流星带着两名提铁尺的庶务干办横拦在了台阶正中！\n\n“我当是哪个不长眼的东西大清早往升仙殿撞，原来是你这条丙字房的赖皮瘟狗！”\n\n赵怀恩上下打量着一身粗麻旧衣的陈长庚，想起四天前在寻脉馆被这小子一篓黑卤蚀穿暗袋、害自己在许长老面前担惊受怕补窟窿的奇耻大辱，新仇旧恨直冲脑门！\n\n旁边一名尖嘴干办也跟着哄笑起来：“赵执事，前儿个纳贡院庞书办不是说这小子染了古盐墟腐肺尸瘟，连门板都拿棺材钉封死了吗？怎么这会儿诈尸爬出来了？”\n\n“爬出来也是找死！”\n\n赵怀恩狞笑一声，居高临下指着陈长庚鼻尖骂道：\n\n“今儿辰时就是冯管事给你定的五日死限！你交不出十块灵石修炉捐，撬了瘟门不敢往纳贡院去，跑来内门升仙殿重地撒什么野？莫不是想寻许长老告黑状？！”\n\n陈长庚停在三级石阶下，目光平淡地扫过赵怀恩油腻的官袍，语气听不出半点波澜：\n\n“赵执事早。陈某今日来升仙殿，不找冯管事，也不告状，只是按宗门祖制进来叩钟录册。劳驾让开道路。”\n\n“噗哈哈哈！叩钟录册？！就凭你？！”\n\n两名庶务干办笑得前仰后合，眼泪都快飙了出来。\n\n赵怀恩更是气极反笑，右手“哗啦”一声从腰间扯出那条浸过蛇油、专抽外门刺头的九节百炼玄铁鞭，满脸凶戾地往前逼近一步：\n\n“一个九窍蒙尘、连三窍都烧穿了的筛灰贱役，发瘟烧糊涂了敢拿升仙钟寻本执事开心！”\n\n“来得正好！省得冯保山费手脚，本执事今天就按‘身染恶瘟、擅闯内门禁地’的门规，先抽断你两条狗腿，再捆去黑水矿填坑！！”\n\n话音未落，赵怀恩根本不给陈长庚再开口的机会，手腕灌足通窍八窍真气，九节玄铁鞭撕裂晨雾，带着刺耳破空尖啸，照着陈长庚天灵盖与面门狠辣抽落！\n\n这一鞭要是抽实在凡俗三窍杂役头上，当场便是脑浆迸裂的下场！\n\n石阶之上，陈长庚连眼皮都没往上抬一下，双手依旧自然垂在麻衣袖侧。\n\n就在乌黑铁鞭鞭梢欺近头顶三寸的刹那——\n\n“嗡！！”\n\n陈长庚体内周天仙脉轻轻一震，仅有一缕凝练如暗金神铁的开脉境护体煞罡透衣浮出，伴着渊渟岳峙的开脉灵压如万丈狂澜轰然席卷整座白玉广场！\n\n“咔嚓嚓——嘣！！”\n\n那条足以抽裂青石的九节百炼玄铁鞭撞上寸许暗金煞罡，竟像一根朽烂枯枝撞上了高速旋转的精钢飞轮，一连九节鞭身自梢至柄寸寸崩断炸裂，碎铁片漫天倒飞！\n\n“哇——！！”\n\n反震巨力顺着鞭柄倒撞而回，赵怀恩脸上的狞笑瞬间化作见鬼般的极度骇然，虎口炸裂喷血，整个人如遭山岳压顶！\n\n“噗通！！咔嚓！”\n\n恐怖的开脉境周天灵压当头按落，赵怀恩连半息都没能扛住，双腿笔直砸在坚硬如铁的白玉石阶上，两块膝盖骨当场被硬生生压得粉碎，惨嚎着五体投地瘫死在陈长庚鞋尖三寸前！\n\n身后那两名刚才还在哄笑的庶务干办更是白眼一翻，手中铁尺哐当落地，像两只被掐断脖子的鹌鹑般抖成一团，脑门死死磕在石板上连大气都不敢喘！\n\n“开……开脉煞罡？！你、你怎么可能是开脉境？！”\n\n赵怀恩捂着血肉模糊的双膝，疼得满嘴血沫，浑浊眼珠死死盯着近在咫尺的那双灰麻布鞋，吓得肝胆俱裂、三魂丢了七魄！\n\n“殿外何人动武喧哗？！”\n\n一声苍老威严的惊喝自升仙殿朱漆大门内传来。\n\n紧接着，一名须发皆银、身披紫云鹤纹道袍的清癯老者踏风疾步迎出殿门——正是长年坐镇升仙殿的值守长老、开脉境后期大修士纪鹤年！\n\n纪鹤年目光刚落到台阶上，看清负手而立的陈长庚周身那圈浑圆纯粹、绝无半点虚假的开脉初期周天灵韵，花白长眉猛地一挑，满眼惊疑！\n\n“纪、纪长老救命啊！”瘫在血泊里的赵怀恩如同抓住了救命稻草，嘶声哭喊，“这外门丙字房杂役陈长庚当殿行凶，废了属下双腿——”\n\n陈长庚散去护体煞罡，不卑不亢地朝着殿门前的纪鹤年躬身拱手，行了一个标准的同道晚辈礼：\n\n“弟子原外门丙字房杂役陈长庚，拜见纪长老。弟子昨夜侥幸贯通周天仙脉，今晨谨遵本宗立派祖制前来升仙殿叩坛录籍；赵执事不问青红皂白，当阶挥玄铁鞭欲取弟子性命，被弟子护体煞罡反震伤膝，在场两名庶务干办皆可作证。”\n\n纪鹤年神念一扫满地寸断的玄铁鞭残片与两名筛糠似的干办，哪里还不明白前因后果，脸色当即沉如寒霜：\n\n“大胆赵怀恩！本宗铁律‘境界定辈分’，通窍执事敢对开脉同门动鞭行刑，按律同犯上论处！没当场震碎你的心脉已是陈执事手下留情！”\n\n“来人！削去赵怀恩外门庶务执事职牌，像死狗一样给老夫拖下山去自生自灭！”\n\n“不！纪长老饶命啊——”赵怀恩面如死灰，被两名值殿力士捂嘴拖下百级长阶，只留下一道刺目血痕。\n\n纪鹤年转过头，再看陈长庚时，严肃老脸上已换上三分温和笑意，好奇抚须问道：\n\n“好浑厚的周天根基！老夫记得外门名册上，丙字废渣房历来安置的是气窍蒙尘、火毒缠身之人，你年纪轻轻无师无靠，是得了何等造化一朝破开仙脉？”\n\n早料有此一问！\n\n陈长庚神色坦然，伸手从腰间那只洗得发白的破储物袋里，双手捧出那半块预先用石臼余韵烘制好的灰白多孔石壳，恭敬呈了上去：\n\n“不敢欺瞒长老。六日前沉渊古盐墟开启，弟子受寻脉馆苏客卿雇佣入墟挑炭箱，在入口处被曹师兄与魔门厮杀的气浪震落西偏断流废沟——此事许镇岳长老已核验记入战册。”\n\n“弟子背着昏迷客卿在地下废廊塌穴摸黑求生时，失足掉进一处干涸石窝，濒死之际胡乱吞了石窝底仅存的半口乳白石浆，谁知回山后竟与肺底十年火毒剧烈相冲，连咳三日黑血，外门同僚还当弟子染了尸瘟将门钉死。”\n\n“直到昨夜子丑之交，那股药力突然置之死地而后生，一举替弟子洗尽火毒、冲开了九窍仙脉！这半块枯竭石壳，便是弟子从石窝里顺手揣回来的。”\n\n纪鹤年接过那半块灰白石壳，指尖灵力一探，眼眸骤然大亮：\n\n“古脉伴生的‘地髓异乳’残壳？！此物百年难遇一滴，灵韵早已彻底枯竭，半点不假！九窍蒙尘之人吞之九死一生，你小子竟能靠熬火练出的硬骨头硬生生扛过来，当真是天佑我云泽宗！”\n\n此番古盐墟折损了百余外门好手与曹、梁两家嫡脉，宗门上下一片愁云惨雾，偏偏一个被当成废人的外门杂役大难不死撞上了千年罕见的“地髓异乳”破境开脉——这简直是给宗门冲喜的活招牌！\n\n纪鹤年再无疑虑，哈哈大笑一拂紫袍：\n\n“本宗开派祖训：凡贯通周天仙脉者，不论寒门贱役，一律直入内门，授执事尊位！随老夫入殿登升仙坛验脉撞钟！”\n\n“谢纪长老成全！”\n\n陈长庚躬身随入大殿，一步踏上殿心九宫测脉白玉坛，周天真气灌入阵眼，九道赤金光柱冲霄而起！\n\n纪鹤年满意颔首，亲自引动殿檐钟槌——\n\n“铛——！！铛——！！铛——！！”\n\n三声苍茫雄浑的升仙钟鸣冲破云海，霎时间传遍云泽宗内外七十二峰！\n\n同一时刻，内门器堂地火窟深处！\n\n“噗——！！”\n\n千斤断龙石轰然震开，强行冲关失败、满嘴乌红火毒血沫的霍千山披头散发冲出石室，一把死死攥住昨夜刚因边矿急报提前赶回山的器堂开脉中期执事龚铁横的衣袖，双目赤红欲裂：\n\n“龚师叔你方才说什么？！谁撞响了升仙钟？！”\n\n面容阴鸷的龚铁横脸色铁青如铁锅底，咬牙切齿吐出一句：\n\n“殿前刚传来的信儿——外门丙字废渣房那个挑炭箱的杂役陈长庚，今早贯通仙脉入升仙殿了！而且你派去摸底的狄冲和段千钧，已经整整失踪三天活不见人死不见尸！”\n\n“陈长庚？！！好你个装疯卖傻的小杂种，古盐墟底窟的寒髓至宝果然被你偷走了！！”\n\n霍千山气得心口火毒逆冲，仰天狂喷一口黑血，抓起赤炎战戟目眦欲裂地嘶吼：“走！随我去升仙殿拆穿这贼子，我要当堂抽干他的骨髓！！”"}, {"n": 94, "title": "反将夺印", "body": "三声升仙钟余音尚在七十二峰云海间回荡。\n\n升仙殿外，一阵狂暴杂乱的破空风声骤然撞碎晨雾！\n\n“慢着！这执事名册录不得！！”\n\n一声阴鸷厉喝如铁锤砸进大殿。\n\n两道裹挟着炽烈火煞的身影硬闯过殿门石阶，带起一股刺鼻的焦糊血腥气，直逼殿心九宫测脉白玉坛！\n\n当先一人四十上下，鹰鼻深目，身穿绣有赤鼎火纹的内门执事皂袍，周身开脉境中期的强横火煞鼓荡不休——正是昨夜因边矿急报提前赶回本山的器堂实权执事龚铁横！\n\n跟在他身侧的霍千山更是狼狈骇人。\n\n这位往日威风凛凛的器堂九窍巅峰统领，此刻面如金纸，眼眶深陷发黑，嘴角还挂着没擦净的暗红血渍，手里死死拄着赤炎战戟，一双布满血丝的虎目恨不得从陈长庚身上生剐下两块肉来！\n\n“陈长庚！你个藏头露尾的狗贼！”\n\n霍千山一进殿便举戟直指白玉坛上的灰衣青年，嗓音嘶哑如夜枭泣血：\n\n“一个九窍蒙尘、肺烂了半边的丙字房筛灰杂役，凭什么六天工夫就贯通周天仙脉？！说！你在沉渊古盐墟底窟偷了本属我器堂的什么寒髓至宝？！”\n\n殿上值守的数名内门书办脸色齐变，纷纷停笔后退。\n\n升仙殿值守长老纪鹤年眉头重重一拧，拂袖挡在测脉坛前，沉声斥道：\n\n“龚铁横！升仙殿乃祖师爷钦定录籍重地，谁准你们叔侄提兵带甲闯殿咆哮的？！”\n\n“纪长老息怒，晚辈也是为宗门除蠹！”\n\n龚铁横抱了抱拳，面上毫无惧色，一双鹰眼死死钉在陈长庚腰间那只洗得发白的旧储物袋上：\n\n“此番古盐墟内窟开启，本宗折损上百精锐，底窟伴生寒脉更是不翼而飞！偏偏这小子前脚从古墟爬回来装瘟钉门，后脚就一步登天冲开仙脉！”\n\n话音未落，龚铁横脚下猛地踏前一步！\n\n“轰——！”\n\n开脉境中期的燥烈赤火灵压如滚滚熔岩，避开纪鹤年，劈头盖脸朝着初入开脉的陈长庚当胸压落：\n\n“陈师弟若是心里没鬼，现在就把随身储物袋解下来，当着纪长老的面开袋受审！敢藏半片古墟赃物，休怪本执事按盗窃宗门军资将你当场废去仙脉！”\n\n殿内空气骤然凝滞如铁！\n\n几名书办被余波逼得呼吸窒塞，暗道一个昨晚刚破境的新嫩开脉，撞上浸淫开脉中期十余年的龚铁横全力施压，怕是要当场出丑跪倒。\n\n然而白玉坛台阶下，陈长庚双足如生根古松，连一片衣角都没往后飘动半分！\n\n寸许厚的暗金地火煞罡贴着粗麻旧衣一闪即敛，不争锋芒，却凝实浑厚得像一块万锻生铁礁，任凭那股中期火煞如何冲刷，愣是撼不动他半寸脊梁！\n\n“嗯？！”龚铁横瞳孔微不可察地一缩。\n\n这小子的开脉初期根基，怎会扎实得这般邪门？！\n\n同一刹那，殿门外一道冷肃青影缓步跨过门槛。\n\n正是闻听升仙钟响、过来复核名册的刑律堂执法长老许镇岳！\n\n“大清早吵吵嚷嚷，成何体统？”许镇岳背负双手立在门侧，目光冷冷扫过全场。\n\n“许长老来得正好！”\n\n霍千山一见许镇岳，像是打了鸡血般往前踉跄两步，指着陈长庚厉声叫道：\n\n“这贱役当日在南岸大营装穷骗过长老，实则暗藏了古墟底窟的破境寒髓！快搜他的储物袋，赃物定然还在他身上！”\n\n“搜袋？”\n\n陈长庚脸上看不出半点恼怒，反而顺从地垂眸一笑，伸手一扯腰间系绳。\n\n“啪！”\n\n那只洗得发白、打着两块补丁的低阶外门储物袋，被他随手解开禁制，干脆利落地拍在了殿心紫檀公案正中央！\n\n袋口敞开，陈长庚侧身让出半步，平静道：“龚师兄想看，只管看便是。”\n\n龚铁横冷哼一声，神念毫不客气地长驱直入，把那只破布袋里里外外犁了三遍！\n\n下一息，龚铁横脸上的冷笑僵住了。\n\n许镇岳与纪鹤年神念同步扫过——只见那寒酸得掉渣的破袋子里，除了两枚边角磨平的旧下品灵石，便只剩两块拿来压袋底的灰黑普通废矿石，连半点寒玉药渣的影子都没有！\n\n“这……就两块破石头？！”霍千山探头一看，眼珠子都快凸了出来，“不可能！他定是藏在别处了！许长老，下令扒了他的衣裳搜魂——”\n\n“霍师兄。”\n\n陈长庚淡淡开口，直接截断了霍千山的狂吠。\n\n他没有跟一个通窍败犬对骂，而是转过身，对着门侧的执法长老许镇岳恭恭敬敬一揖到底，抬起头时，字字清晰如刀：\n\n“晚辈初入内门，不懂规矩，有一桩糊涂账想请许长老替晚辈断一断。”\n\n许镇岳眉峰微挑：“讲。”\n\n陈长庚侧过半边身子，目光平静地落在满脸狰狞的霍千山脸上，慢条斯理反问道：\n\n“六日前在沧溟大泽南岸大营辕门，霍师兄当着许长老与三百铁甲卫的面，是不是亲口指天立下毒誓——说内窟石拱被魔门断龙雷彻底炸塌封死，里头绝无半个活口？”\n\n霍千山呼吸猛地一滞！\n\n不等他开口狡辩，陈长庚往前迈出一步，声音陡然转冷：\n\n“那日也是霍师兄亲口咬定，晚辈与寻脉馆苏客卿在门槛外便被气浪掀进了西偏臭水沟，根本未曾踏入内窟半步，此事许长老当场验明，白纸黑字记在升仙殿战册第一页！”\n\n“怎么才过了六天，霍师兄自己气血逆乱、满身禁药火毒冲脉不成，反倒跑到升仙殿改口，硬说晚辈盗了你器堂的内窟重宝？”\n\n陈长庚微微偏头，似笑非笑地盯着面无人色的霍千山，轻轻吐出最后一句绝杀：\n\n“莫非六日前在南岸大营，霍师兄呈给许长老的军情证词全是编来欺瞒长老的假话？还是说，那内窟里头，原本就藏着霍师兄见不得光的私货？！”\n\n轰！\n\n大殿之内落针可闻！\n\n旁边的几名内门书办倒吸一口凉气，看向霍千山的眼神瞬间变了味儿！\n\n好毒的一张嘴，好狠的一记回马枪！\n\n许镇岳一张方脸更是“刷”地沉成了万年玄冰，两道如电冷眸死死钉在霍千山背脊上，开脉中期的恐怖杀意轰然外泄：\n\n“霍千山！你给老夫说清楚——当日在大营辕门，你到底有没有瞒报内窟实情？！”\n\n霍千山浑身如坠冰窟，嘴唇哆嗦得像秋风里的落叶！\n\n认？一旦承认大营说了假话，许镇岳头一个就得拿他顶欺瞒军情、害死曹无极的大罪，他暗吞五瓣残莲冲脉失败的老底更是彻底暴光，今天竖着进来就得横着抬进刑律堂大牢！\n\n不认？不认那陈长庚连内窟门都没进，哪来的盗取底窟重宝一说？！\n\n“我……你、你这小杂种血口喷人……我……”\n\n霍千山左支右绌，被自己六天前发下的毒誓死死卡住了喉咙管，半个字也吐不出来！\n\n胸口压了三天的狂暴赤莲火毒本就只靠一口气强撑着，此刻急怒攻心之下轰然炸入心脉！\n\n“噗——！！”\n\n霍千山喉头剧震，一口滚烫发黑的毒血狂喷三尺远，手中赤炎战戟“哐当”砸落金砖，两眼一翻，竟当着满殿长老执事的面直挺挺仰面昏死过去！\n\n“千山！”龚铁横脸色大变，一把扶住瘫软如泥的霍千山，搭脉一探，脸色黑得几乎滴出墨来。\n\n心脉火毒反噬，这半年之内休想再摸开脉门槛了！\n\n“荒唐！简直丢尽我云泽宗内门的脸面！”\n\n纪鹤年重重一拍紫檀公案，冷冷扫了龚铁横一眼：\n\n“陈长庚误吞古脉地髓异乳破境，枯竭石壳老夫已亲自验过，来路清清白白！你器堂弟子自己贪功妄吞燥毒禁药走火入魔，还敢来升仙殿污蔑新晋同门？！”\n\n许镇岳亦是冷哼拂袖：“念在霍千山古墟斩敌有功，今日咆哮公堂之事罚俸半年，再敢胡搅蛮缠，老夫连你龚铁横一块送进黑水狱！”\n\n龚铁横胸口剧烈起伏，咬碎了后槽牙才硬生生咽下这口闷血，低头抱拳：“……谨遵两位长老训诫！”\n\n纪鹤年不再理会他，转身取过一只紫檀托盘，将一袭崭新的青玉云纹执事道袍与一方沉甸甸的赤铜官印双手递到陈长庚面前，朗声宣布：\n\n“即刻起，录陈长庚入本宗内门玉牒，授开脉初期‘内门巡脉执事’实职，享每月十枚灵石正俸！”\n\n“弟子陈长庚，谢两位长老赐印！”\n\n陈长庚神色平静，双手稳稳接过那方象征内门实权阶层的巡脉铜印与青玉道袍，顺手将案上那只破布储物袋收回腰间。\n\n就在礼成将散之际——\n\n“慢着。”\n\n架着昏迷霍千山的龚铁横忽然抬起头，阴鸷面皮上扯出一丝冰冷刺骨的狞笑：\n\n“陈师弟荣升巡脉执事，可喜可贺。按宗门规制，新晋巡脉执事驻守何处矿脉，须由升仙殿与我器堂联合会签指派。”\n\n龚铁横腾出右手，自怀中抽出一封盖着器堂赤鼎火漆印的黑色铁签调令，“啪”地拍在紫檀公案边缘，一字一顿道：\n\n“巧得很，本宗与玄煞门、血河宗三宗交界的‘断界黑石峪’火铜矿，上月刚殉职了一位巡脉执事，如今正缺人镇守。”\n\n“本执事今日便按章会签，调新晋陈长庚执事十日后赴任断界黑石峪——陈师弟根基这般浑厚，想来不会刚领了铜印，就吓得不敢替宗门戍边吧？！”\n\n殿上几名书办脸色微变。\n\n谁不知道那断界黑石峪是三宗劫修绞肉场，短短一年已经连死两任无靠山的新晋执事了！\n\n纪鹤年眉头一皱刚想开口缓颊，案前的陈长庚却已伸出右手，连眉毛都没动一下，稳稳按住了那枚染着煞气的黑铁调令！"}, {"n": 95, "title": "藏锋慑曹", "body": "冰冷的黑铁调令入手沉重。\n\n陈长庚指腹轻轻摩挲过背面未干的器堂火漆印，抬起眼，迎上龚铁横那双等着看他失态抗命的鹰眼，温和一笑：\n\n“食宗门之禄，担宗门之事。十日后赴任断界黑石峪，陈某领命便是，劳龚师兄费心替小弟挑了这么一处历练宝地。”\n\n龚铁横准备好的三句挤兑硬话当场噎在了嗓子眼。\n\n他冷冷盯着镇定自若的陈长庚看了两息，鼻腔里重重哼出一声：“好胆色！那本执事就在器堂，等着十日后给陈师弟喝践行酒！”\n\n说罢，龚铁横一把架起人事不省的霍千山，拎起地上赤炎战戟，铁青着脸拂袖冲出升仙殿。\n\n许镇岳看了陈长庚一眼，暗自点头：“不骄不躁，倒有几分定力。这十日好生备齐护身法器，莫堕了本宗威风。”\n\n交代一句后，许镇岳也转身回了刑律堂。\n\n殿内只剩纪鹤年与几名书办。\n\n纪鹤年捋着白须叹了口气，低声提点道：“那断界黑石峪矿脉杂乱，龚铁横是存心拿官面规矩给你穿小鞋。老夫职在升仙殿不便插手防区，这是东麓‘丁字三号’临时执事洞府的禁制玉牌，你先去内门庶务库房把五十枚安家灵石和开脉法器领齐，这十日闭门把御器术练熟些。”\n\n“长老厚恩，弟子铭记于心。”\n\n陈长庚双手接过洞府玉牌，郑重一礼告退。\n\n走出升仙殿，山风清冽，往来内门道童见到他手中托着的青玉执事袍与赤铜官印，无不敛容侧立、恭敬低唤一声“拜见执事师叔”。\n\n陈长庚神色如常，心里算盘却打得极清。\n\n抗命？抗命正中龚铁横下怀，当场就能治个怯战削职的罪名；接下调令，不但白拿十天稳妥缓冲期，还能先把宗门给开脉执事的那笔丰厚安家资粮光明正大揣进兜里！\n\n半刻钟后，内门西侧庶务库房。\n\n陈长庚亮出崭新的巡脉执事铜印过册画押，库房老管事笑眯眯捧出一只内门制式青云储物袋，将新晋开脉执事的一应定额福利当面点清：\n\n整整五十枚灵气盎然的完整下品灵石安家俸禄！\n\n一面巴掌大小、迎风可化四尺青光巨盾的一阶上品防御灵器“青鳞灵盾”，外加三柄专破护体罡气的制式“百炼乌金飞刃”！\n\n至于功法配额，陈长庚除选了一枚配套御盾杀伐的《玄煞凝盾诀》玉简外，又顺手挑了一本库房角落最不起眼的大路货行气册子——《赤卤开脉功》。\n\n将五十枚俸禄灵石与灵盾飞刃收进新发的青云储物袋，陈长庚随手翻了两页那本粗浅的《赤卤开脉功》，便记熟了其驳杂虚浮的行气法门。\n\n刚迈出庶务库房宽敞的青石阶——\n\n“哈哈哈！这位莫非便是今早一鸣惊人、撞响三声升仙钟的陈长庚陈师弟？！”\n\n一阵爽朗得略显刻意的大笑声自古松廊下传来。\n\n陈长庚抬眸一看，只见一名四十余岁、身穿暗纹锦袍的富态中年执事正背着手满面春风迎上台阶，袖口赫然绣着曹氏一族独有的赤金血蝠纹！\n\n更惹眼的是，此人垂在身侧的右手虎口上，正严严实实缠着三圈浸出淡红药渍的上好金疮细布！\n\n曹无极的亲叔父，昨夜三更摸去废渣谷口挨了自己一记纯煞罡重拳的开脉初期执事——曹敬塘！\n\n陈长庚眼底波澜不惊，忙快步迎下两级石阶，规规矩矩拱手执同辈礼：\n\n“小弟陈长庚，见过曹师兄。师兄谬赞了，小弟不过是在古墟侥幸捡回一条残命，当不得一鸣惊人四字。”\n\n“诶，自古大难不死必有后福嘛！”\n\n曹敬塘笑得眼角褶子堆起老高，一双精明多疑的三角眼却紧盯在陈长庚面庞与手腕上，心头疑云翻滚：\n\n昨夜废渣谷那人以古怪敛息术遮了形貌，一拳震裂自己虎口，掌力浑厚得像浸淫开脉境二三十年的老怪；谁知今早这住在废渣谷里的穷小子就突然破境开脉了！\n\n天下哪有这么巧的事？难不成昨夜那蒙面狠人就是这小子装的，又或者……这小子背后真站着执法堂哪位不开眼的太上供奉？！\n\n不搭手试一试底细，他曹敬塘寝食难安！\n\n“看陈师弟手里还捏着刚领的功法册子，想是初通仙脉，还没人指点过内门御器凝罡的关窍吧？”\n\n曹敬塘热络地跨前半步，笑呵呵伸出完好的左手，看似亲热地一把搭向陈长庚右小臂脉门：\n\n“来来来，你我既同为内门执事，做师兄的也不藏私，替你搭一搭周天脉象，顺手指点两句库房这路青鳞盾的催动巧劲！”\n\n手掌搭上腕骨的刹那，曹敬塘笑容未改，掌心却悄无声息吐出一缕阴寒刁钻如毒针般的开脉初期“阴蝠裂魂劲”，顺着尺泽穴直刺陈长庚体内仙脉！\n\n若陈长庚真是昨夜那个煞罡霸道绝伦的蒙面人，经脉受刺本能反震，绝瞒不过他的感知！\n\n电光石火间，陈长庚心里冷笑一声。\n\n想摸我的底？成全你！\n\n他稳稳锁住丹田深处那条浩瀚如紫金大江的真实仙脉，仅调起库房刚看来的那套粗浅《赤卤开脉功》，引着一丝斑驳浮散的燥热微气迎了上去！\n\n“嗤！”\n\n阴寒煞劲一碰即溃，陈长庚顺势脸色微白，“噔噔”连退两小步，右手五指被震得微微发颤，满脸敬畏惭愧地抱拳苦笑：\n\n“曹师兄好深厚的周天功力！小弟在古墟误吞那半口异乳全靠命硬熬过来，如今经脉还涩滞虚浮得很，师兄随手一缕真气，小弟便有些接不住了！”\n\n假的？不，经脉里那股属于大路货《赤卤开脉功》的虚浮燥气做不得假，连自己两成阴蝠劲都震得指尖乱颤！\n\n曹敬塘收回左手，眼皮狂跳，后背竟“唰”地冒出一层冰凉冷汗！\n\n既然这陈长庚本人只是个靠狗屎运撞开仙脉、根基浮浅的新嫩软柿子——那昨夜三更蹲在废渣谷口、一拳差点废掉他整只右爪的无名恐怖高手，除了暗中护持这小子的执法堂老怪物，还能是谁？！\n\n难怪纪鹤年与许镇岳今早双双出面保他，连器堂龚铁横都在升仙殿碰了一鼻子灰！\n\n好险！幸亏刚才没下重手，否则真惹恼了暗处那尊执法堂大佛，把昨夜他曹敬塘违令私搜生还弟子魂魄的脏事捅出来，他这内门执事明天就得撸到底！\n\n“咳、咳咳！哪里话，陈师弟初破仙脉，气机未稳乃是常情，调养两月便顺畅了！”\n\n曹敬塘脸上笑容瞬间真诚恭敬了十倍不止，连忙从怀中摸出一只绣工精致的云锦袋，不由分说双手塞进陈长庚掌心，压低嗓门热切道：\n\n“前几日下人不懂事，去废渣谷打扰过师弟清修，全是梁世勋那小畜生在古墟背刺我家无极惹出的祸端，与师弟毫无干系！”\n\n“这十枚下品灵石权当愚兄恭贺师弟登仙坛的一点薄礼，万莫推辞！往后在内门若有哪个不长眼的杂碎敢嚼舌根，师弟只管差人来曹某院里言语一声！”\n\n塞完灵石，曹敬塘生怕暗处那位“执法堂高人”多瞧自己一眼，拱了拱手，脚底抹油似地匆匆转身离去。\n\n石阶上，陈长庚掂了掂手里沉甸甸的十枚完整下品灵石，看着曹敬塘落荒而逃的背影，嘴角微勾，坦然揣进青云储物袋。\n\n不费一刀一枪，白拿十块灵石封口费，还把曹家这条疯狗彻底拴牢了。\n\n陈长庚不再耽搁，先绕道后山僻静绝壁，在无人察觉间从盲缝中取回昨夜封泥藏妥的重包，径直入了东麓山腰清幽僻静的“丁字三号”执事洞府。\n\n开启洞府隔绝石门，他将两只装有六成地母玄晶的上古寒玉封匣、蚀纹石臼与一众杀器妥善安置，把新旧灵石尽数归拢——前存一百二十枚，加上库房安家俸禄五十枚与曹敬塘贺礼十枚，完整下品灵石已暴涨至整整一百八十枚！\n\n随后他盘坐蒲团，耗去一个时辰将青鳞灵盾与三柄乌金飞刃初步祭炼如臂使指，这才起身褪去穿了数月的灰麻杂役旧衣。\n\n一袭挺括洁净、水火不侵的内门青玉云纹执事道袍披上肩头，腰间悬起赤铜巡脉官印与青云储物袋。\n\n铜镜映照之下，青年眉目冷峻沉静，渊渟岳峙，再不见昔日盐灶筛灰学徒的卑微佝偻之态。\n\n“轰隆隆——！”\n\n洞府之外，正午时分的天幕已被滚滚铅黑乌云压得极低，豆大的冷雨噼里啪啦砸落山林，转眼汇成倾盆暴雨！\n\n二月十二，午时已至。\n\n外门纳贡院管事冯保山定的五日收房锁人死限，过了！\n\n陈长庚推开洞府石门，撑开一把青竹三十六骨油纸伞，滚落的水珠滑过青玉袍角不留水痕，他缓步踏入漫天滂沱大雨之中，顺着下山石阶直奔外峰纳贡院而去！"}, {"n": 96, "title": "朱票讨命", "body": "瓢泼大雨如天河倒悬，将外门后山废渣谷冲刷出一道道乌黑泥汤。\n\n废渣谷北坡百丈外的避雨石亭内，一柄青竹油纸伞静静立在雨幕边缘。\n\n陈长庚一袭青玉执事道袍纤尘不染，居高临下冷眼俯瞰着谷底丙字废渣房门前的闹剧。\n\n昨夜去内门富户酒席喝到四更天、一觉睡到日上三竿连内门升仙晨报都没看一眼的外门纳贡院管事冯保山，此刻正由两名力夫打着大黑伞，端着他那把寸步不离的紫砂茶壶，神气活现地立在泥水里。\n\n他身旁除了书办庞文禄，还跟着两片嘴唇肿得结满紫黑硬痂、用油布裹着脑袋的买主蔡金满。\n\n“辰时死限早过了两个时辰！”\n\n冯保山抿了一口热茶，眯着绿豆眼拿壶嘴点了点钉满厚松木板的丙字房院门，慢条斯理道：\n\n“庞书办，叫人把棺材钉起开吧。那陈长庚要是烂死在炕上了，直接浇两桶火油连尸带灰烧干净腾给蔡老弟；要是还剩半口气，就套上铁枷锁去黑水死矿，也算冯某全了跟他的主仆情分。”\n\n坡上石亭里，陈长庚眸光微冷，并没有立刻掠下山坡现身。\n\n在荒无人烟的烂泥谷里亮出铜印，冯保山顶多吓得磕两个响头说一句“来探望师叔”，私卖宗门房舍与威逼杂役的烂账连张字据都没留。\n\n想一次性把这吃绝户的老狗扒掉三层油皮，就得等他自己回纳贡院公堂，亲手把找死的铁证写到纸面上！\n\n陈长庚手腕微转，撑着油纸伞悄然退出石亭，不疾不徐地顺着通往外门纳贡院的青石大街缓步前行。\n\n谷底丙字房门前，两名力夫早已憋足了劲，拿铁撬棍卡进松木板缝隙猛力一扳！\n\n“嘎吱——哐啷！！”\n\n四块厚木板连着十余根震断过半截的铁钉哗啦垮落，力夫一脚踹开虚掩的熟铁院门，举着火把冲进内室！\n\n“捂紧鼻子！小心尸瘟毒气——咦？！”\n\n冲在最前头的力夫阿牛刚跳进屋，手里的火把猛地停在半空，整个人傻了眼！\n\n哪有什么流黑脓的垂死瘟鬼？\n\n内室火炕扫得干干净净，连床破草席都没剩，地火炉口冰冷熄灭，墙角连半块碎瓦片、一文烂铜钱都找不着，干净得像是被耗子舔过三遍！\n\n“管、管事大人！庞爷！屋里没人，早跑空啦！！”阿牛连滚带爬冲出屋檐大喊。\n\n“什么？！”\n\n冯保山手里的紫砂茶壶差点没端稳，庞文禄更是眼珠子瞪圆，一把推开力夫冲进内室翻了个底朝天，出来时脸都白了：\n\n“冯爷！真跑没影了！门板上的棺材钉被人从里头齐根震断，这小兔崽子昨晚半夜就撬门畏罪潜逃了！”\n\n“好啊！你们叔侄俩合起伙来耍老子玩呢？！”\n\n原本缩在十步外的蔡金满冲进屋一看空空如也，想到自己前天白白挨了一嘴毒烟燎泡、还交了十五枚整灵石买了个惹祸逃犯的空壳屋，当场跳脚炸了毛！\n\n蔡金满一把揪住庞文禄湿透的衣领，唾沫星子混着雨水喷了冯保山一脸：\n\n“姓冯的！你说初十交吉屋，拖到十二撬开门连个人毛都没见着！这逃奴要是半夜摸回来放把火，老子小命找谁赔去？！退钱！现在就把老子的十五块下品灵石一子儿不少退回来，不然老子去庶务堂敲登闻鼓告你们私卖公房！！”\n\n周围几个冒雨看热闹的废渣谷杂役听得指指点点，窃窃私语。\n\n冯保山一张油光水滑的胖脸瞬间涨成了猪肝色！\n\n吃进他冯某人肚里替真窍幼子攒前程的十五枚灵石，当着外门这么多下贱杂役的面往外吐？他以后还怎么在纳贡院坐堂立威？！\n\n“放肆！蔡金满你嚷嚷什么！”\n\n冯保山老羞成怒，一甩袍袖厉声喝道：\n\n“不过是个三窍烂肺的盐场逃奴，还能翻上天去不成？！都跟本管事回纳贡院大堂——本管事现在就签海捕红票，半个时辰内把陈长庚那小畜生剥皮抽筋抓回来给你交差！”\n\n一行人骂骂咧咧顶着暴雨赶回外门前山。\n\n外门纳贡院高门大院，黑漆牌坊下雨水成帘。\n\n陈长庚撑着青竹油纸伞，静静停在街对角樟树廊檐的雨雾阴影里，目光穿过敞开的纳贡院正堂大门，将堂内鸡飞狗跳的一幕尽收眼底。\n\n大堂之上，十余名外门书办与皂衣打手分列两侧。\n\n蔡金满一屁股坐在客椅上拍着大腿嚷嚷退灵石，急得满头冷汗的庞文禄赶紧凑到主位太师椅旁，弯腰替暴怒的冯保山研开一砚刺目朱砂，谄媚献计道：\n\n“管事大人息怒！那陈长庚没路引没灵石，顶多缩在后山哪个破炭窑里躲雨！您老这就签一张‘畏罪叛宗、格杀勿论’的朱印红票发给外门巡山队，死活不论提头回来，蔡老弟的房事不就铁板钉钉稳了么！”\n\n“哼！一个从大泽盐场摇尾乞怜爬进来的九窍蒙尘贱种，本管事当年赏他一口废渣房的饭吃，他倒敢撬门逃捐打冯某的脸！”\n\n冯保山重重一拍惊堂木，抓起紫毫大笔饱蘸鲜红朱砂，在一张尺半宽的外门海捕铁签上龙飞凤舞刷刷写下两行杀气腾腾的大字：\n\n——丙字房贱役陈长庚，抗捐潜逃，形同叛宗；凡外门执役见者，当场格杀勿论！\n\n写罢，冯保山抓起外门纳贡管事铜印，“咚”地一声重重砸在红票正中央！\n\n鲜红刺目的官印墨迹未干，冯保山得意洋洋地重新端起案头紫砂茶壶，慢悠悠吹着浮沫，斜睨着满堂大气不敢出的书办与蔡金满冷笑道：\n\n“都给冯某听真了！在这云泽宗外门的一亩三分地上，是龙得给冯某盘着，是蚂蚁更休想爬出冯某这五根手指头！不出申时，定叫你们瞧见陈长庚那小杂种死狗一样拖回堂下！”\n\n“大人威武！那陈长庚这次死定了！”庞文禄拍手叫好。\n\n廊外雨幕中，陈长庚看着那张盖死官印的朱砂红票摆上公案，平静眸底终于泛起一抹冰冷笑意。\n\n私扣贡石、私卖公房，再加上这一张越权签发“格杀在册内门开脉执事”的铁证红票——冯大管事，这份三倍抄家的厚礼，总算被你亲手凑齐了。\n\n恰在此时！\n\n纳贡院外侧泥泞湿滑的雨廊拐角处，一道浑身裹满黄泥血水、已经被剥去执事官袍的老狼狈身影，正死死抓着两根烂木拐杖，拖着两条扭曲断折的废腿，像条丧家老狗般一寸寸从堂门外爬过！\n\n正是今早在升仙殿前被陈长庚一缕开脉煞罡震碎双膝、当众削职赶下山去的原庶务执事赵怀恩！\n\n赵怀恩淋得像落汤鸡一般刚爬到纳贡院正堂台阶侧面，猛地听见堂内冯保山拍着桌子狂吼“把陈长庚那小杂种当场格杀、死狗一样拖回来”，整个人如遭九天五雷轰顶，手里的木拐“啪嗒”吓掉在泥水里！\n\n疯了！！冯保山这个瞎了狗眼的蠢猪昨天没睡醒吗？！！\n\n那位爷今早已经撞响三声升仙钟、连器堂霍千山都被他一句话气得当堂吐血昏死、亲掌内门巡脉铜印的开脉境活阎王啊！你他娘的拿外门红票去格杀内门执事师叔？！\n\n赵怀恩吓得魂飞天外，生怕被溅一身血，拼了老命扒住石阶门槛，面无人色地扯开破锣嗓子刚想冲堂内尖叫：\n\n“冯保山你疯——”\n\n“哗啦。”\n\n最后一个字还没冲出喉咙！\n\n一只纤尘不染、绘着内门青玉云纹的道袍靴底，已稳稳当当踏碎门槛外的泥水，擦着赵怀恩颤抖的鼻尖，一步跨过了纳贡院高高的大堂门槛！\n\n赵怀恩仰头看清那截青玉道袍衣角与伞骨下垂落的赤铜巡脉印绶，一口气当场倒抽卡死在嗓子眼里，两眼翻白，死死捂住自己嘴巴瘫进泥水沟里，连半声呜咽都不敢再漏出来！\n\n大堂门口光线一暗。\n\n那道撑着青竹油纸伞的修长青袍身影，带着满身微凉雨气，不紧不慢地停在了纳贡院公堂正中央！"}, {"n": 97, "title": "执礼惊堂", "body": "雨水顺着青竹三十六骨油纸伞的伞尖滴落，
