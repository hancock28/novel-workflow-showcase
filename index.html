不等卢耀再喊半个字，盛怒之下的督查长老一掌隔空重重印在卢耀小腹气海之上！\n\n“噗——咔嚓！！”\n\n一声令人牙酸的气窍崩碎闷响，卢耀苦修十余年的通窍五窍修为被开脉罡气一掌废得干干净净，整个人狂喷鲜血瘫成一团死泥！\n\n“来人！拿穿骨铁钩锁了这吃里爬外的叛宗狗贼，押入刑律死牢严审同党，三日后祭旗问斩！”\n\n凄厉绝望的哭嚎声渐渐远去。\n\n而在两里外的后山废渣谷底，陈长庚早已从后崖悄无声息翻回丙字废渣房，换上那身沾着药渣味的破棉袄，安安稳稳吹灯躺回了冰冷石榻。\n\n山脚大泽方向的围剿血战一直杀到五更天方才彻底平息。\n\n正月二十三，天色刚蒙蒙亮，空气里还飘着散不尽的焦糊血腥气。\n\n“咚！咚！咚——！！”\n\n急促肃杀的行军战鼓混着整齐划一的铁甲脚步声，猛然踏碎清晨寒雾，将整座废渣谷与前山寻脉馆围得水泄不通！\n\n内门庶务执事赵怀恩一身玄铁戎装，骑在高头火麟驹上立于谷口高坡，手捧一卷杀气森然的赤金军令当众厉声宣读：\n\n“奉内门掌门真人铁令！昨夜敌宗玄煞门死士潜袭山门水寨，军情十万火急！”\n\n“凡前山寻脉馆客卿、及外门在册熟识大泽水文之杂役，限明日辰时全员拔营押赴沉渊大泽南岸军营待命——敢有称病推诿、迟误半刻者，按通敌叛宗论处，当场立斩无赦！！”"}, {"n": 50, "title": "血契锁界", "body": "赤金军令在谷口高坡展开，森然杀气比后山晨雾还要刺骨。\n\n赵怀恩勒住火麟驹，冷厉目光扫过谷底一众面无人色的灰衣杂役：\n\n“造册书吏上前！凡有大泽盐场及南麓水工案底者，当场发铁签锁档！”\n\n两名黑甲书吏捧着厚册抢步入列，朱笔勾点如催命符。\n\n不到半盏茶工夫，一块烙着“随军水工”火印的生铁腰签便塞进了陈长庚掌心。\n\n“明日辰时初刻，苍芦渡栈桥点卯登船！”\n\n赵怀恩一抖马缰，声震山谷：“少半个人头，拿各房管事项上首级抵罪！”\n\n马蹄声轰鸣远去，谷口要道却留下了四名持戟铁甲卫把死出入关隘。\n\n陈长庚低眉顺眼退回丙字废渣房，反手落死千斤铁闩，指腹轻轻摩挲过那块冰冷铁签。\n\n昨夜西岗哨塔那一箭，虽借内门督查长老之手废掉了卢耀，却也彻底捅破了玄煞门潜袭的马蜂窝。\n\n掌门真人一纸军令压下来，装病咳血的老把戏再也糊弄不过去了。\n\n“拿着外门水工铁签混大队登船，一到南岸军营就得被拆进前锋营蹚雷。”\n\n陈长庚坐在昏暗穿堂里，眼底一片冷寂。\n\n他如今身怀通窍八窍暗金横练、八枚过载烈阳火珠与三十六只二蜕凶虫，真厮杀起来寻常九窍也留不住他。\n\n可一旦在几百双眼睛盯着的炮灰营里被迫掀底牌，半年苦心经营的藏锋保护壳瞬间就得碎成齑粉。\n\n贴腹的蚀纹石臼要到明日未时三刻才满新一轮潮汐，距此刻尚有十几个时辰，上了船更需一处免检的合法遮护。\n\n“不想去杂役营当肉盾，今晚就得去寻脉馆把雇佣口风钉成铁契。”\n\n陈长庚起身吹灭油灯，从床底暗砖下摸出半截泛黄的乌卤盐场旧役文牒，连同水工铁签一并揣入怀中。\n\n熬到正月二十三子夜过后，山林寒雾浓得伸手不见五指。\n\n陈长庚胸前贴紧高阶敛息玉符，揣着寻脉馆通行签条，借送还炭篓签牌之名穿过了东道戒严哨卡。\n\n刚踏上寻脉馆外幽暗的青松石阶，正堂半掩的楠木门内便传出一道咄咄逼人的冷笑声：\n\n“苏客卿，我家梁公子好言相劝三次，你可别敬酒不吃吃罚酒！”\n\n陈长庚脚步一顿，悄无声息缩起肩膀停在廊柱阴影下。\n\n只见正堂灯火通明，梁世勋的心腹随从梁猛正按着厚背斩马刀立在堂心，桌上重重拍着一卷烫金红契。\n\n梁猛居高临下逼视案后的苏清晏：“赵执事已下了死令，辰时全军拔发南岸！”\n\n“南岸大营的前锋调拨权，全由器堂霍师兄与我家公子、曹无极三家分掌！”\n\n“你寻脉馆孤家寡人一个，今晚不签这份梁氏附庸契、不交出外围避风图，明早下船就编你进头拨破瘴队！”\n\n案后，苏清晏一袭素白道袍纤尘不染，随行阵箱早已束妥，眉目冷若寒霜：\n\n“内门长老聘书定明寻脉馆独立成队。梁世勋想吞我的编制，叫他自己拿掌门手令来试。”\n\n梁猛脸色一狞，上前一步压低嗓音：“军前急调，乱磁滩上死一两个外聘客卿谁会深查？苏客卿——”\n\n“铮！！”\n\n一道乌沉试脉铁钎擦着梁猛耳廓暴射而过，狠狠钉入他背后门框三寸，尾端嗡鸣刺耳！\n\n“滚。”苏清晏只吐出一个字。\n\n梁猛左耳廓被寒煞刮出一道血口子，气得脸皮紫涨，却终究忌惮她玉石俱焚的阵修手段，一把抓回桌上红契。\n\n“好！等明日到了南岸烂泥滩，老子看你拿什么挡蚀骨风眼！”\n\n梁猛恶狠狠甩袖冲出正堂，迎面撞见廊下拢着破袖低头轻咳的陈长庚。\n\n他脚步一停，凶戾目光扫过陈长庚蜡黄的面孔：“废渣房的病鬼，还没断气呢？”\n\n“回、回梁爷，小人听说天亮拔营，特来给客卿仙师缴还炭签……”陈长庚惶恐弯腰赔笑。\n\n前几日甲字房炸炉被执法堂查封，梁家上下还当这病小子上次送的火位草图立了奇功。\n\n梁猛鼻孔里哼出一声轻蔑冷气，抬手重重拍了拍陈长庚干瘦的肩头：\n\n“算你小子前几日懂事！进了大泽放机灵点，别跟着个自身难保的硬骨头一块儿填了黑水沟！”\n\n“小人谨记爷的提点！”\n\n目送梁猛大步流星消失在雾气石阶尽头，陈长庚脸上那副谦卑瑟缩的苦笑瞬间敛得干干净净。\n\n他迈步跨过寻脉馆正堂门槛，没有上前交签，反而转身双手一推，“吱呀”一声严严实实合上了两扇楠木大门。\n\n案后的苏清晏眸光骤冷，素手已扣住桌面两枚试脉铁钎：“谁准你关门的？”\n\n“外头风大耳杂，小人有笔入墟的生死账，想跟苏客卿关起门算清楚。”\n\n陈长庚缓缓转过身来，原本一直佝偻如虾米的脊背一寸寸挺直如枪。\n\n说话间，他隔着灰麻旧袄指尖微拨胸前敛息玉符，将锁死的气血精准放开一层！\n\n“嗡——”\n\n一股凝练沉稳、绝无半分铅毒滞涩的“通窍六窍”气机，在寂静正堂内悄然弥散开来！\n\n虽把真正的八窍暗金横练与满身杀器严密藏在第二层水下，可这份扎实六窍修为，在外门杂役里已是拔尖的好手！\n\n“铮！”\n\n苏清晏指间两枚试脉铁钎瞬间悬空浮起，清冷眸底寒芒暴涨，笔直锁死陈长庚咽喉：\n\n“通窍六窍？！你那身咳血肺毒全是装出来的——你是曹无极还是梁世勋埋在后山的暗桩？！”\n\n面对三步外随时洞穿喉骨的寒煞铁钎，陈长庚连眼皮都没跳一下。\n\n他摊开手掌，将那半截乌卤盐场旧役文牒与随军水工铁签平推到桌角：\n\n“苏客卿是明白人，何必拿话诈我？”\n\n“我若是曹家的狗，正月初十就不会点破甲字房的赤铁血煞砂，害屠满仓当场吐血赔石。”\n\n“我若是梁家的桩子，方才梁猛逼宫时大可里应外合偷你的图，何必等他滚蛋了再关门露底？”\n\n苏清晏指尖微顿，铁钎寒芒未散，语调冷硬如冰：“既非世家暗桩，为何在废渣谷装成三四窍将死之人？”\n\n“一个无根无靠的外门熬盐杂役，守着连死三任的毒灰坑，不装成随时断气的废人，骨头渣子早被人嚼碎了。”\n\n陈长庚神色平静，一句话反刺向苏清晏眼下最痛的软肋：\n\n“倒是苏客卿，梁、曹两家外加器堂霍氏要在南岸联手拿捏你，你身边连个能下毒水扛风煞的活人都没有，真准备孤身去闯蚀骨风眼？”\n\n堂内灯花轻轻爆出一声轻响。\n\n苏清晏沉默两息，悬在半空的试脉铁钎缓缓压低三寸。\n\n她重新审视着眼前完全褪去病弱伪装、眼神冷静得可怕的灰衣少年，素手从袖中抽出一张盖着天阵宗暗印的灰黄符纸拍在案上：\n\n“既要借本座寻脉馆的名头避开前锋炮灰营，那就咬破指尖签了这张‘随侍听调契’。”\n\n“入墟后一应进退皆听本座号令，事成返宗，本座另给你十五枚下品灵石！”\n\n陈长庚垂眸扫过符纸末尾“生死听凭驱策、不得违逆”一行细密篆字，直接摇头：\n\n“卖命当肉盾的主仆契，我不签。”\n\n苏清晏柳眉一挑，堂内寒意骤盛：“你刚洗脱暗桩嫌疑，便敢跟本座讨价还价？别忘了你怀里那块水工铁签，本座不收你，辰时你就得去前锋营填坑！”\n\n“我去了前锋营是填坑，苏客卿少了认得地底老卤水道的向导，进墟一样是替三大世家蹚雷。”\n\n陈长庚寸步不让，直视着她清冷如霜的眼睛：\n\n“我在乌卤盐场熬了三年毒卤，闭着眼都能闻出十丈内的地下毒囊深浅；正月初六奉命下南麓断崖清淤，我更摸清了一条前代盐工留下的外围旧引卤水道。”\n\n他伸出三根手指，不紧不慢把条件摆在明面上：\n\n“主仆奴契免谈。要签，就签贵宗权责对等的‘地脉血契’，只钉三条铁规矩！”\n\n“讲。”苏清晏冷声吐字。\n\n“第一，苏客卿将我正式记入寻脉馆随行专员花名册，销去外门水工散役；入墟后我负责辨毒探路，引你避开外围风眼直抵内窟门户！”\n\n“第二，沿途但凡寻获古墟灵矿宝物，苏七陈三，按三七明账当场分清！”\n\n苏清晏眸光微闪，还未开口，陈长庚已沉声补上最核心的第三条：\n\n“第三，血契存续期间，双方绝不背后下毒暗算；可一旦撞上开脉级死禁，或是内门九窍高手火并清场、事不可为——”\n\n陈长庚盯着苏清晏，声音冷硬得不带一丝虚伪温情：\n\n“你我当场各逃各命！你不准拿血契逼我留下替你挡刀殿后，我也绝不拿丝毫同路情分求你回头救我，生死各凭本事！”\n\n正堂之内霎时落针可闻。\n\n苏清晏定定看了陈长庚足足三息。\n\n她出身没落堪舆世家，见惯了满嘴同生共死、临阵却把同伴推向杀阵的伪君子。\n\n也见够了梁世勋这等打着护卫旗号、实则垂涎苏氏祖传阵图的豺狼。\n\n偏偏眼前这个盐灶出身的少年，把惜命、分赃与大难临头各自飞全摊在桌面上，半句场面好话都不肯编。\n\n可越是把丑话钉死在前面的明白人，在真正互利共生的契约里反而最守规矩！\n\n苏清晏收回那张主仆灰符，冷冷偏过头，留下一句极短的挤兑：\n\n“六窍修为，倒敢跟本座谈各逃各命。真撞上死禁，你的腿跑得过我的阵盘？”\n\n“跑不跑得过是小人的本事，守不守约是血契的规矩。”陈长庚坦然应道。\n\n“好，就依你这三条！”\n\n苏清晏不再拖泥带水，干脆利落地抬起右手，皓齿在食指指尖狠狠一咬！\n\n一滴殷红心头精血沁出指尖，她左手疾掐天阵宗古印，引动寻脉馆地底一缕纯正地脉煞气凌空勾勒出繁复血篆：\n\n“吾苏清晏，以天阵宗地脉本源立契：与陈长庚共入沉渊古盐墟引路至内窟，所得灵物苏七陈三，互不背刺；若逢死禁绝局，各寻生路，违契者地煞蚀心而亡！”\n\n陈长庚毫不迟疑，并指逼出一滴指尖精血弹入血篆正中：“陈长庚应契，违约同受此罚！”\n\n“嗡——！”\n\n半空那团暗红血篆骤然凝缩，化作两道细若红线的滚烫地脉血芒，闪电般没入二人掌心劳宫穴，烙下一星米粒大的暗红微痕后隐没不见！\n\n苏清晏随手拉过案头内门征调名册，提笔将陈长庚名字重重圈入“寻脉馆随行专员”一栏，当场划掉了外门水工散编。\n\n紧接着，她从贴身锦囊取出一卷绘在坚韧蛟皮上的半幅真本《古盐墟避风阵图》，隔着桌案推到陈长庚手边：\n\n“这是外围至中窟门户的真本避风阵图，与你手里那角残图合上便是全路。”\n\n她抬指点了点廊下两只贴着寻脉馆封条的试阵废炭箱，淡声吩咐：“那两只试阵炭箱归你归置挑运，辰时苍芦渡栈桥汇合。”\n\n陈长庚接过沉甸甸的蛟皮真图揣入怀中，重新微弓下腰，恢复了那副不起眼的灰衣随从模样：\n\n“小人省得，这就把试阵箱拾掇妥当随仙师登船。”\n\n就在掌心地脉血契最后一缕红芒彻底敛去、天际刚泛起一线铁青鱼肚白的刹那——\n\n“咚！咚！咚——哐、哐、哐！！”\n\n寻脉馆院墙外的青石长街上，骤然响起排山倒海般整齐沉重的玄铁重甲行军脚步声！\n\n内门庶务执事赵怀恩冷厉如刀的催船号令穿透五更寒雾，轰然炸响整座前山：\n\n“五更集结，辰初登船！各堂各馆随征人等即刻拔营赴渡——距沉渊古盐墟十年地磁退潮开启，仅剩最后十日，误船半刻者立斩无赦！！”"}, {"n": 51, "title": "拔营藏臼", "body": "五更的催船铁甲声还在前山青石街上回荡，寻脉馆后院偏廊已落下了木闩。\n\n陈长庚蹲在两只贴着封条的试阵废炭箱前，指尖巧劲微吐，沿着浆糊未干透的纸角无声挑开寸许缝隙。\n\n前夜黑芦沟水寨刚闹过玄煞门死士，今日辰时苍芦渡登船，战时盘查必定严得像铁篦子过虱子。\n\n把三百斤重的青铜机括盾偶和寒铁虫瓮揣在贴身储物袋里硬闯？\n\n万一栈桥口摆着测灵重镜，当场就是个私藏违禁军火、乱刀剁成肉泥的下场。\n\n陈长庚动作快得没有半丝杂音，先从廊角泥桶里掏出早就备好的陈年乌卤黑毒泥。\n\n这种盐场窖底刮出来的腐卤泥又腥又臭，还带着乱磁浊气，寻常修士神念一沾就犯恶心。\n\n他将半截蚀纹石臼、青铜机括盾偶、装满六十四钱无瑕髓晶的锁灵寒玉匣，连同封着三十六只二蜕煞甲虫的药瓮，挨个裹满三层厚黑泥，严丝合缝摁进两只铁木箱最底层。\n\n上头重新铺满五十斤定磁废火炭，封条原样抚平按死，连一丝新折痕都瞧不出来。\n\n至于过载烈阳火珠、八窍阴毒煞囊与三十七枚整灵石，则贴着胸口那枚滴血认主的高阶敛息玉符收进内袋，右袖滑槽照旧扣死百炼乌金破甲分水刺。\n\n做完这些，陈长庚抓起一只豁了口的破竹篓背上肩头。\n\n篓里不装别的，只扔了两把生锈旧铁勺、一只裂纹瓦罐，再倒上半篓发馊刺鼻的苦药渣。\n\n“咔哒。”\n\n前堂楠木门推开，苏清晏一袭素白道袍迈出石阶，目光扫过他挑稳的扁担，呼吸在第三息时极轻地滞了一瞬，面上却冷若寒霜：\n\n“走了。误了辰初点卯，谁也保不住你。”\n\n“小人省得，仙师请先行。”陈长庚弯下腰背，把外显气机稳稳压回三四窍虚浮病相，挑起两百多斤的铁木炭箱紧跟在她右后方半步。\n\n辰时初刻，苍芦渡江风如割，十余艘云泽宗玄铁接引战船横锁黑水渡口。\n\n主舰高耸的包铁楼台上，内门庶务执事赵怀恩按剑而立，两排黑甲执法卫长戟如林，杀气压得整座渡口鸦雀无声。\n\n而通往三号随行船的木栈桥口，偏偏支着一张盖红布的公案。\n\n外门纳贡院管事冯保山正四平八稳坐在太师椅里，手里捧着那把油光水亮的紫砂小茶壶，眯着细眼督查过卡杂役。\n\n“都把背篓行囊掀开！前夜敌宗细作摸进水寨，谁敢私夹铁器火药，就地正法！”\n\n掌案书办庞文禄扯着公鸭嗓挥舞戒尺，两名如狼似虎的皂役伸手就往随行水工怀里掏摸。\n\n“官爷高抬贵手！这二两碎银是小的留着下水买姜汤救命的啊！”一名老水工哭着去护裤腰。\n\n“啪！”\n\n庞文禄一戒尺抽在老水工手背上，顺手把碎银袋子撸进桌底暗筐，骂骂咧咧道：\n\n“混账东西！船上禁带散碎金属引磁，冯管事这是替你保管性命，下船再给你记功发还！下一个！”\n\n后头几十号杂役敢怒不敢言，排着队被刮去最后一层保命油皮。\n\n陈长庚挑着炭箱排在客卿通道侧旁，心里冷笑一声。\n\n好一个替人保管性命，这十死无生的古盐墟走一遭，能活着回来讨银子的有几个？冯保山这一张桌子支在鬼门关口，吃的完完全全是绝户财！\n\n前头队伍很快挪空，苏清晏执铜令径直踏上栈桥。\n\n陈长庚挑着两只大铁木箱低头刚要跟过去——\n\n“哟，慢着！”\n\n太师椅上的冯保山眼皮猛地一掀，端着紫砂壶的手指朝陈长庚鼻尖一点：\n\n“这不是丙字废渣房那个喷黑铅血的陈长庚吗？正月十八在堂上气都快断了，怎么今儿没死在床上，倒挑着大箱子混上内门战船了？”\n\n冯保山细眼一眯，上下打量着陈长庚扁担两头沉甸甸的铁木箱，心头顿时起了疑：\n\n这病鬼莫不是在废渣谷私藏了什么值钱矿料，偷偷买通寻脉馆逃避外院差役？\n\n“庞书办！”冯保山慢条斯理抿了口茶，官腔拿捏得滴水不漏，“战时军纪无情，越是病秧子越容易被人塞脏东西利用，仔细搜搜他的背篓和箱子！”\n\n“得令！”庞文禄眼睛一亮，带着两名皂役摩拳擦掌围了上来，“小子，把背篓卸下来，再把铁箱铜锁打开！”\n\n栈桥两侧十几道目光唰地聚拢过来。\n\n陈长庚脸上不见半点慌乱，赶忙放下扁担，捂着胸口重重咳了两声，点头哈腰地卸下破竹篓双手捧到公案前：\n\n“回、回冯大人！小人这半条烂命全是大人开恩留下的！前儿苏客卿嫌旁人筛的试阵灰粗了，点名抓小人挑这两箱细炭灰上船伺候……”\n\n说话间，他借着弯腰赔笑，双手从怀里摸出两个裹着粗黄纸的小方包，恭恭敬敬推到冯保山茶壶边，声音压得又卑微又惶恐：\n\n“大人明鉴，小人屋里连老鼠去了都得哭着出来，实在没孝敬！这是昨夜给寻脉馆守门，苏客卿赏剩的两包润肺粗茶，大人督船辛苦，留着赏下人漱漱口……”\n\n庞文禄一把掀开破竹篓，伸手往里一掏，抓出一把湿乎乎、散发着隔夜馊酸味的黑药渣和两柄豁口铁勺！\n\n“呸呸呸！什么破烂玩意儿，臭死个人！”庞文禄嫌恶地把铁勺砸回篓里，在裤腿上直擦手。\n\n冯保山低头扫了一眼那两包连半点灵气都没有的凡俗粗茶，鼻孔里嫌弃地哼了一声。\n\n看来真是苏清晏身边缺苦力，随手抓了个不要钱的筛灰病鬼凑数。\n\n可旁边一名皂役见背篓没油水，眼珠一转，伸出铁钩就去撬地上那两只试阵炭箱的封条：“庞爷，这俩大箱子沉得很，撬开瞧瞧里头有没有夹私盐——”\n\n陈长庚没伸手拦箱子，只吓得往后缩了半步，怯生生朝栈桥前头喊了一嗓子：\n\n“客卿仙师，纳贡院的官爷要撬您的定磁炭箱查私盐哩！”\n\n栈桥之上，已走出五步的苏清晏骤然驻足回身！\n\n她连看都没看那名拿钩子的皂役，素手一翻，云泽宗内门庶务堂亲发的青铜寻脉令寒光凛冽，清冷声音如冰珠砸落栈桥：\n\n“箱内乃本座推演古盐墟风眼的定磁母炭，沾半丝外人手汗铁腥，整箱尽废。”\n\n苏清晏抬眸直刺太师椅上的冯保山，半句废话不绕：\n\n“冯管事若想验箱，不妨请船头赵怀恩赵执事亲自下来揭封条——只是耽误了巳时开船吉时、废了入墟定磁炭，这通敌误军的罪名，你外门纳贡院接是不接？！”\n\n“唰！”\n\n主舰高楼之上，内门执事赵怀恩闻声转头，刀锋般森冷的目光瞬间锁定了三号栈桥！\n\n冯保山吓得手腕一抖，紫砂壶里的热茶差点泼在官袍上！\n\n跟一个天阵宗疯女人抢两箱破炭灰，再去触赵怀恩战时杀人的霉头？他冯保山还没活腻味！\n\n“混账奴才！谁借你们的狗胆碰苏客卿的官箱？！”\n\n冯保山变脸比翻书还快，起身反手一巴掌抽在那名拿铁钩的皂役后脑勺上，满脸堆笑地冲苏清晏拱手：\n\n“误会，全是底下人瞎了狗眼！苏客卿为宗门勘脉劳苦功高，快请登船，快请登船！陈长庚，还不挑稳箱子跟紧仙师，滚上去！”\n\n“哎哎！谢冯大人体恤，大人留步！”\n\n陈长庚诚惶诚恐地背回馊药篓，一肩挑起两只沉甸甸的试阵炭箱，低着头稳步跨过栈桥关卡。\n\n直到踏进三号战船底舱角落卸下扁担，他低垂的嘴角才勾起一丝极淡的冷弧。\n\n两包不值十文钱的粗茶沫子，外加苏清晏一块内门虎皮，三百斤过江猛龙就这么顺顺当当过了鬼门关。\n\n午后江面风急浪高，十余艘玄铁战船顺流南下，一头扎进雾气茫茫的沉渊大泽腹地。\n\n未时三刻一到，陈长庚隔着箱板清晰感应到箱底毒泥深处那半截蚀纹石臼轻轻一震——三十六个时辰潮汐充能已满！\n\n但他眼皮都没抬一下，依旧抱膝靠在舱壁闭目养神。\n\n船行百丈黑水之上既无地底煞脉接引，底舱里又挤着十几名各馆随从，这时候贪快动石臼纯属自寻死路，晚两个时辰上岸有的是僻静地方开炉。\n\n“呜——咚咚咚！！”\n\n申初时分，低沉苍凉的驻营号角穿透大泽浓雾，船身猛地一震，稳稳靠上了沉渊大泽南岸军营的巨木栈桥！\n\n“全员下船按牌入营！不得喧哗滞留！”\n\n甲板上铁卫厉声催喝。\n\n陈长庚挑起两只试阵炭箱跟在苏清晏身后踏下跳板，靴底刚踩上南岸湿滑腥咸的黑泥栈道，侧旁一艘押运铁笼船的舱门“哗啦”一声被皂役拉开！\n\n十几名脖套铁圈、手脚串在一条粗铁链上的头批破瘴死囚，被皮鞭抽打着跌跌撞撞赶下船来。\n\n“走快点！磨蹭什么！”\n\n一鞭子抽在第三名蓬头垢面、满脸污泥的青年背上。\n\n那青年惨叫着摔跪在栈桥边，下意识抬头往官道上一看——\n\n正对上挑着炭箱、衣衫整洁从容走过的陈长庚！\n\n刹那间，窦文焕浑身剧烈颤抖起来，干裂嘴唇咬出鲜血，一双布满血丝的眼珠子红得像要滴出血来，隔着铁链死死钉在了陈长庚背影上！"}, {"n": 52, "title": "驻营分帐", "body": "“陈长庚——！！你这该死的杂种怎么没死？！”\n\n栈桥泥水里，窦文焕像条疯狗般猛地挣起半截身子，脖颈铁圈勒得皮肉翻卷，嘶哑咆哮着就要往官道上扑，“赵执事！石师叔！他没吐血烂肺，是他害我顶了死士缺啊——”\n\n“啪！！”\n\n押队皂役反手一记浸油牛皮鞭，狠狠抽在窦文焕嘴脸上，当场抽飞两颗带血门牙！\n\n“嚎什么丧！上了南岸死士册，天王老子来了也得去填风眼！”\n\n后头捧着丹药木箱下船的丹堂副管事石百川更是吓得脸皮发白，生怕这蠢货乱攀咬惹恼了前头督军的赵怀恩，赶紧上去踹了窦文焕一脚骂道：\n\n“闭上你的狗嘴！自己签的采药契怨得了谁？赶紧给老夫拖去北栅铁牢关起来！”\n\n两名皂役拽着铁链，硬生生把满嘴血沫、犹自怨毒盯着这边的窦文焕拖进了芦苇囚棚。\n\n陈长庚脚步分毫未顿，只缩着脖子跟在苏清晏身后走过辕门，心里已给这蠢货判了死刑。\n\n自己找死不肯消停，若敢在南岸营里再生事端，就别怪他连这点喘气的工夫都不留了。\n\n抬眼望去，南岸大营沿着黑水滩涂连绵数里，中央高高竖着一根三丈粗的青铜镇磁巨柱，柱顶灵光明灭不定，勉强压住大泽深处翻涌的灰白瘴雾。\n\n分营台前，内门庶务执事赵怀恩翻开军册，冷漠目光扫过孤身立在台下的苏清晏：\n\n“中军高坡与东西干燥营区，已拨给器堂霍师兄、梁家及曹家精锐驻扎。”\n\n赵怀恩随手抓起一块最下等的黑木营牌扔下台阶，公事公办道：\n\n“寻脉馆统共就你们主仆二人，占不得大帐，去西南角三十丈外的芦苇烂泥坳扎营吧！”\n\n台下几名世家随从顿时发出一阵毫不掩饰的哄笑。\n\n谁不知道西南角烂泥坳正处全营下风口，紧挨着乱磁滩涂，每到下半夜蚀骨毒瘴倒灌，睡上三宿连铁甲都能锈出一层绿毛！\n\n苏清晏看了一眼地上沾泥的木牌，清冷眉宇未动分毫：“可以。入墟前无军令，莫派闲人来扰我推演。”\n\n说罢转身便往西南角走去。\n\n陈长庚弯腰捡起木牌，挑着炭箱踏入泥泞不堪的烂泥坳。\n\n这里离大营主栅足有三十余丈，三面全是枯黄高苇与冒着酸臭气泡的黑泥潭，连个现成哨桩都没有。\n\n陈长庚卸下箱子，麻利地割苇垫底、支起一顶素白主帐和侧旁一间仅容一人蜷身的值夜矮草棚。\n\n刚把主帐门帘挂上木梁，坳口泥道忽然传来一阵嚣张杂沓的脚步声！\n\n“都闪开！前锋营曹公子巡视滩涂防务！”\n\n管事胡彪带着八名披甲挎刀的曹家精锐悍然闯入泥坳，簇拥着身穿暗红血纹锦袍、面色阴鸷如鹰的曹无极停在帐前十步外！\n\n后山甲字房炼器炉炸膛被执法堂查封，还罚没了半年外院俸石，曹无极这几日憋了一肚子暴虐邪火无处发泄。\n\n他冷冷扫了一眼寒酸孤立的白布营帐，下巴微抬，直接伸手：\n\n“苏清晏，本公子奉命统领前锋破瘴营。把你手里那卷《古盐墟避风阵图》拓一份副册交出来，今晚本公子准你搬进东坡干爽石屋。”\n\n帐帘微掀，苏清晏缓步走出，素手垂在袖边：“内门聘书只写本座入墟引路，未写向曹师兄献图。”\n\n胡彪在旁狗仗人势地按刀厉喝：“姓苏的别不识抬举！在这下风口毒泥潭里孤家寡人一个，真等半夜乱磁瘴气漫上来，连个收尸的都没有！”\n\n“收不收尸是本座的事。”\n\n苏清晏眸光冷彻如冰，直视曹无极眼底：“图在我脑子里，曹师兄想要，不妨现在动手抢试试，看掌门真人的军法大刀快，还是你的血煞掌快！”\n\n当着八名家奴的面被一个没落分支女修硬顶回来，曹无极额角青筋暴跳！\n\n“好！好一副天阵宗的硬骨头！”\n\n曹无极怒极反笑，既不敢在拔营首日真杀客卿触怒长老，胸中戾气却绝不肯干咽，右掌猛然隔空往前一拍！\n\n“轰——咔嚓！！”\n\n一道炽烈狂暴的通窍九窍血煞掌风擦着苏清晏衣袂轰在右侧帐门主木桩上！\n\n碗口粗的硬松木桩当场炸成漫天碎木屑，半边白布营帐哗啦坍塌砸落泥水之中！\n\n“本公子倒要看看，没有营帐遮风，你们主仆俩在蚀骨瘴里能硬撑几个时辰！我们走！”\n\n曹无极冷哼甩袖，带着哄堂怪笑的胡彪等人扬长而去。\n\n泥坳口风瘴呼啸，左脉隐伤被掌风煞气一激的苏清晏指尖微白，强压住喉头逆血，冷声对缩在草棚边的陈长庚道：\n\n“把坍木清开，重新打桩立帐。”\n\n说完便转身步入半塌的帐内盘膝调息。\n\n几十丈外的高坡营哨上，几名梁家与外院巡兵抱着膀子指指点点看热闹，只当这寻脉馆主仆今晚必得求饶搬走。\n\n陈长庚从始至终连头都没抬一下，仿佛曹无极那一掌劈的不是脸面而是块烂木头。\n\n他默默从试阵箱夹层抽出一柄八斤铁锤和三根备用生铁长钎，蹲在坍塌的帐角泥地里，“哐、哐、哐”一锤接一锤将三尺铁钎往黑冻泥深处猛砸！\n\n第一尺，是腥臭刺鼻的腐苇烂泥；\n\n第二尺，是坚硬带盐碱的青灰冻土；\n\n就在第三尺铁钎尖端“噗”地扎穿冻土硬壳的刹那！\n\n一股温热酸麻、带着清晰规律脉动的灰白地煞热流，猛然顺着精铁钎尾震入陈长庚虎口掌心！\n\n陈长庚抡锤的手腕微不可察地一顿，低垂的眼底瞬间掠过一抹狂喜精光！\n\n“地下三尺冻壳底下，竟然贴着一条沉渊古盐墟外溢的活地煞潮汐支脉？！”\n\n赵怀恩看人下菜碟把他们发配到这下风口毒泥坳，曹无极震塌帐门想看他们笑话，这帮锦衣玉食的内门公子哥做梦也想不到——\n\n旁人避如蛇蝎的蚀骨毒瘴窝，对他这怀揣蚀纹石臼的熬盐杂役而言，简直是老天爷追着往嘴里喂饭的风水宝地！\n\n陈长庚脸上不动声色，故意把修好帐门的那根生铁钎留了半截尾端斜插进侧旁值夜矮草棚地底，拍净泥手向帐内低声回禀一句“木桩修妥了”，便钻进矮草棚拉严了破草帘。\n\n入夜亥时，大泽黑水涨潮。\n\n浓郁得化不开的灰黑腐骨毒瘴顺着南风倒灌进烂泥坳，十步之外人影皆无，连高坡上的巡营哨兵都捂着湿布远远退避。\n\n矮草棚内，陈长庚悄无声息取出青铜隔味阵盘扣在身前，嵌入一粒碎晶撑起三尺无声气幕。\n\n外有漫天恶臭毒瘴遮人耳目，内有隔味阵盘锁住气息，双重保险滴水不漏！\n\n他这才从炭箱黑泥底摸出早已满第三十一轮充能的蚀纹石臼，将臼底紧贴住那根直通地下支脉的铁钎尾端，反手取出黑芦沟苗五指遗留的那颗蜡封通窍八窍“阴毒煞囊”，捏碎蜡壳尽数投入臼窝！\n\n“嗡……”\n\n地下潮汐支脉的凶悍地煞源源不断顺铁钎涌入古拙石纹，墨绿腥臭的八窍毒囊在无形碾磨下迅速消融剥离！\n\n整整两刻钟，收尾那一刻钟逸散的浓烈地火腥甜气被三尺青铜阵幕严密摁在棚内，分毫未曾外泄。\n\n待灰白微光敛去，臼底赫然静静躺着五钱颗粒饱满、隐泛暗金光晕的极品道髓晶砂！\n\n不带一丝阴煞残毒，纯粹得如同天地初开的本源精粹！\n\n“通窍八窍后期，给我破！”\n\n陈长庚毫不犹豫，五指一抄将这五钱滚烫髓晶尽数拍入口中咽下，《井煞锻骨诀》中卷心法全力轰鸣运转！\n\n“轰隆——！！”\n\n五钱由八窍毒修毕生本源提纯的无瑕药力在脏腑百骸间轰然炸开，宛如滚滚岩浆冲刷过第八处主气窍每一寸细微壁障！\n\n原本初入八窍的气血以肉眼可见的速度暴涨凝实，暗金皮膜下筋骨齐鸣如弓弦绷紧，双臂潜藏的横练巨力一举冲破两千五百斤大关，稳稳踏入通窍八窍后期之境！\n\n直到子夜三更，体内奔涌如江河的气血彻底收束进高阶敛息玉符之下。\n\n陈长庚睁开清亮冷冽的双眸，麻利地将石臼重裹毒泥塞回炭箱底层，正伸手收起青铜隔味阵盘——\n\n他贴近地面的右耳廓，忽然微不可察地动了一下！\n\n三丈外白茫茫的滩涂枯苇荡深处，风声里夹杂着两道极轻、极沉、绝非寻常夜兽的踩泥破水声！\n\n透过草帘一道细缝往外瞥去。\n\n只见浓黑瘴雾中，白天被锁走的窦文焕竟拖着解开半截的脚镣猫腰缩在苇丛后，手指怨毒无比地指着这间矮草棚；而在他前头两步，两名周身凝着浑厚通窍九窍煞气的巡营老散修，已狞笑着一左一右包抄到了哨棚三丈之内！"}, {"n": 53, "title": "瘴滩反猎", "body": "三丈外的枯苇暗影里，窦文焕捂着白天被抽烂的半边肿脸，声音压得像毒蛇吐信：\n\n“葛六爷、马爷！那小杂种就缩在这破草棚里替姓苏的守炭箱，才三四窍的病秧子！”\n\n他摸了摸空荡荡的大拇指——为了偷溜出北栅囚棚出口恶气，他把贴身藏在鞋底夹层、值二十枚灵石的祖传青玉扳指都孝敬了这两名值夜巡滩的通窍九窍老散修！\n\n“别叫他死太痛快！”窦文焕眼底全是疯狂血丝，“先把他四肢骨头寸寸捏碎，再摁进黑泥潭里活活灌毒泥呛死！”\n\n左边那名满脸刀疤的九窍老散修葛老六嗤笑一声，指节捏得咔吧轻响：\n\n“二十枚灵石的买卖捏死只三窍臭虫，窦小哥只管瞧好戏，半息工夫都用不上！”\n\n话音未落，葛老六与右侧矮壮独眼散修同时暴起，两股凌厉通窍九窍劲风一左一右直扑矮草棚，封死了所有正面逃路！\n\n草棚之内，陈长庚眼神冷寂如渊。\n\n通窍八窍后期横练加乌金刺，原地反杀这两个贪财散修不难。\n\n可苏清晏的主帐就在左后方三丈外！\n\n一旦在棚口硬碰硬震散九窍气劲，瞬息之间苏清晏与高坡巡营铁卫就会赶到，他半年藏拙的底牌当场就得扒个精光！\n\n“想拿毒泥潭葬我？前头三丈的乱磁风眼，正好缺两条替死鬼！”\n\n早从傍晚打桩核对苏清晏那半幅真本《古盐墟避风阵图》时，陈长庚就将烂泥坳外围三丈浅滩那处隐形“乱磁风眼”的步距背得滚瓜烂熟！\n\n就在葛老六枯爪撕碎草棚前帘的刹那——\n\n“咳咳咳！谁……救命啊——！！”\n\n草棚后侧苇席“哗啦”撞破，陈长庚像是刚从睡梦中惊醒吓破了胆，怀里紧抱着半袋白天修桩剩下的定磁铁砂，捂着胸口撕心裂肺剧咳着，连滚带爬往雾气最浓的浅滩芦苇丛亡命逃窜！\n\n“往绝路死滩上跑？找死！”\n\n葛老六狞笑一声，压根没把这脚步虚浮的病小子放在眼里，仗着通窍九窍浑厚护体劲气，脚掌猛蹬冻泥，一跃三丈如苍鹰扑兔般直抓陈长庚后脖颈！\n\n矮壮独眼散修紧随侧后方半丈，反手扣住飞镖防他喊叫惊营！\n\n一步、两步、三步！\n\n耳听脑后恶风已触及后背衣领，脚下湿黑软泥里隐隐跳起一星细微乱磁电弧！\n\n前扑逃命的陈长庚眼神骤然化作万年寒冰，脚下盲井滑步毫厘不差往右侧半尺物理死角一拧，左臂猛然回扬，将怀里那半袋沉甸甸的定磁铁砂劈头盖脸撒向葛老六胸膛！\n\n“拿破铁砂糊老子眼？给老子躺下——呃？！”\n\n葛老六不闪不避，催动九窍护体罡气硬撞铁砂！\n\n可就在满把定磁铁砂撞上他护体真气的电光石火间，浅滩泥底潜伏的无形乱磁风眼仿佛被滚油泼醒的凶兽，骤然循着铁砂磁力疯狂偏转绞合！\n\n“嗡——嗤啦！！！”\n\n一声令人头皮炸裂的气机撕裂闷响混在夜潮风啸之中！\n\n葛老六体表那层坚韧的九窍护体劲气像纸糊一般扭曲崩碎，一道肉眼难辨的灰白蚀骨风刃顺着磁砂轨迹斜劈而过，当场将他整片右肩胛连同半条右臂齐刷刷削飞上天！\n\n“啊——我的胳膊！！”\n\n血泉狂飙三尺，葛老六惨嚎半声便一头栽进乱磁泥涡里翻滚抽搐！\n\n后头半丈外的矮壮独眼散修骇得魂飞天外，硬生生刹住前冲脚掌拼命往后暴退：“有乱磁暗风！点子邪门，快退——”\n\n退字刚出口，浓白瘴雾下方，两道早被陈长庚扣在左掌心的赤红暗影已贴着泥水滑至他靴尖三寸！\n\n双层引火槽，三倍赤磷硫精——两枚过载烈阳火珠！\n\n“轰隆——！！！”\n\n借着大泽滩涂闷雷般的涨潮乱磁爆音掩护，两团狂暴至极的暗红火球贴地炸开！\n\n矮壮独眼散修刚撑起的九窍护体罡罩被三倍过载火浪正面掀了个粉碎，整条双腿血肉模糊仰面抛飞！\n\n不等他落地张嘴呼救，一道快到极致的灰影已顶着漫天泥火欺进他怀里！\n\n陈长庚面无表情，两千五百斤八窍后期暗金巨力贯入右臂，九寸三分的百炼乌金破甲分水刺寒芒一闪，如毒龙出洞般精准捅穿矮壮散修咽喉，顺势一绞震断颈骨！\n\n紧接着脚步不停，反手一刺挑断泥涡里葛老六的喉管，挑起两具尚带余温的尸首猛往乱磁风眼边缘一送！\n\n“嗤嗤嗤——！”\n\n狂暴风刃瞬间将两人脖颈与胸膛创口绞得血肉稀烂，一点分水刺的三棱痕迹都没留下！\n\n从撕破草棚到双杀通窍九窍老散修，前后不过短短两息！\n\n陈长庚屏息站在死角泥地上，动作快如闪电地撸下两人储物袋与葛老六怀里那枚染血青玉扳指。\n\n神识往袋里一扫，整整十八枚下品灵石外加两颗散修私备的赤阳雷火弹！\n\n方才甩出去两枚过载烈阳火珠，贴身同款猛货还剩六枚，如今白捡十八枚整灵石把家底推上五十五枚，还添两颗雷火弹充数，这笔黑夜买卖稳赚不赔！\n\n陈长庚用脚后跟将窦文焕那枚祖传青玉扳指狠狠碾成碎玉渣踩进三尺臭泥底，又从储物袋摸出一截黑芦沟留下的玄煞门鬼首断镖，一把塞进葛老六烂肉模糊的肋骨缝里。\n\n做完这一切，他转过身，一步步走向五丈外枯苇丛。\n\n苇丛后头，亲眼看着两名通窍九窍凶人两息化作烂肉的窦文焕，早已吓得魂魄离体，裤裆湿热恶臭一片，双腿软得像两根烂面条瘫在泥水里，喉咙里只会发出咯咯怪响：\n\n“鬼……你是鬼……别杀我，陈爷饶命，我给你当牛做马……”\n\n杀了他沉进泥潭？\n\n陈长庚低头冷冷瞥了一眼他脚腕上的生铁锁链编号。\n\n不行。头批破瘴死士由赵怀恩按册点名，少一个活人必引内门执法卫翻遍全营彻查。\n\n让这疯狗活着进铁笼等死，比现在一刀宰了干净十倍！\n\n陈长庚一言不发，伸手像拎死鸡一样揪住窦文焕后衣领，借着还未散尽的夜瘴快步穿过滩涂小径，一把将屎尿齐流的窦文焕掼在丹堂营区木栅栏外！\n\n随即，陈长庚猛地往自己脸上抹了一把泥水，扯开嗓子凄厉惊恐地大喊起来：\n\n“来人啊！抓细作啊——！！烂泥滩上有敌宗内鬼杀人啦——！！”\n\n这一嗓子瞬间捅炸了半座南岸前营！\n\n数十支火把哗啦点亮，丹堂副管事石百川披着外袍提着药杵第一个冲出栅栏，巡营铁卫也纷纷拔刀赶向浅滩！\n\n“喊什么喊！哪来的细作？！”石百川惊怒喝问。\n\n陈长庚缩在栅栏边瑟瑟发抖，指着浅滩浓雾气喘吁吁道：“石、石管事！小人起夜听见滩涂有火器炸响，就瞧见窦师兄带着两个黑衣人在风眼边抢什么铁镖，一转眼那俩人就被风刃搅碎了！”\n\n赶去浅滩查看的巡营什长很快用刀尖挑着一枚带鬼首纹的断镖跑回来，脸色煞白高喊：“禀各位大人！滩涂风眼死了两个巡滩散修，尸身上真搜出了玄煞门的联络断镖！”\n\n“什么？！”石百川魂都吓飞了半截！\n\n地上瘫软如泥的窦文焕被火把一照，猛然抱住脑袋尖叫打滚：“不是细作！是鬼！是陈长庚这恶鬼拿火球炸死了葛六爷！石师叔救我，他不是病秧子，他是索命鬼啊——！！”\n\n四周铁卫看傻子一样看了一眼旁边缩着肩膀直咳嗽的灰衣杂役，又看了看脚腕铁链被人私自撬开的窦文焕。\n\n两个通窍九窍老散修被一个三四窍筛灰病鬼杀了？这死囚分明是偷开铁链私通玄煞门细作想逃役，见同伴误踩风眼暴毙吓疯了胡攀乱咬！\n\n石百川冷汗瞬间湿透后背——窦文焕可是挂在他丹堂名下的记名学徒，真让赵怀恩按通敌细作查下来，他石百川十颗脑袋也不够砍！\n\n“疯了！这畜生被瘴气冲心彻底吓疯了！”\n\n石百川眼底闪过一抹狠色，不等巡营什长细问，抢上前去一药杵重重砸在窦文焕后颈上将其砸得昏死过去，嘶声吼道：\n\n“来人！拿生铁堵嘴球塞严他的嘴，抬进丹堂双层铁囚车焊牢！开墟之前谁也不准放他出来一步！”\n\n看着窦文焕像条死狗般被塞嘴焊进黑铁囚车拖走，低头退回烂泥坳的陈长庚轻轻吐出一口寒气，连衣角都没湿一分。\n\n就在东方天际刚撕开一线苍白晨光、南岸军营尚未从夜惊中平息的刹那——\n\n“呜——呜——呜——！！！”\n\n三声沉雄霸烈、震得整片大泽黑水嗡嗡翻涌的赤金龙角号声，骤然自北面江心滚滚炸响！\n\n一艘悬挂着丈二“百锻赤锤”战旗的巨型铁甲楼船破开晨雾悍然抵岸，甲板之上，一名身披暗赤锁子甲、背负重剑的伟岸青年负手而立，通窍九窍巅峰的恐怖灼热气机如烈日当空压向全营！\n\n云泽宗器堂大师兄霍千山携宗门重宝压阵抵营，南岸三大内门霸主，至此彻底聚齐！"}, {"n": 54, "title": "三强议饵", "body": "赤金龙角号的余音还在大泽黑水面上滚荡，南岸中军高坡已立起两排森然黑戟。\n\n正月二十五辰时，浓雾未散。\n\n“器堂霍师兄奉内门长老手令升帐，传各房统领与寻脉客卿议定入墟序列！”\n\n传令铁卫高声唱喝，披甲身影往来如梭。\n\n烂泥坳出口处，苏清晏整理素白道袍袖口，脚步微顿，清冷目光扫过身后挑着茶水杂物匣的陈长庚：\n\n“进了帅帐只管守在角落看火添茶，三家争什么都当没听见。”\n\n“小人省得，绝不多看半眼。”陈长庚低眉哈腰应下。\n\n趁着弯腰紧草鞋带的工夫，他隔着灰麻旧袄指腹微拨胸前那枚高阶敛息玉符。\n\n原本对外压在三四窍的虚弱表象悄然松开半寸，稳稳卡死在滞涩混浊、夹杂陈年铅火毒的通窍六窍边缘。\n\n随寻脉馆进中军帅帐，三四窍太假反倒惹疑；这副勉强挑得动重箱、经脉却被毒烟熏废的六窍苦力相，正好塞进贵人们眼皮底下的盲区。\n\n掀开厚重牛皮帐帘，一股灼热霸道的金铁火气扑面压来！\n\n帅帐正北虎皮主位上，器堂大师兄霍千山一身暗赤锁子甲大马金刀端坐，背后斜靠一柄无锋玄铁重剑，通窍九窍巅峰的雄浑气机压得帐内炭盆火苗都往矮处缩了三分。\n\n左侧锦墩坐着脸色阴鸷的曹无极，右侧则是摇着折扇的梁世勋。\n\n下首两侧站着庶务执事赵怀恩、丹堂石百川等一干内外门管事，连大气都不敢喘。\n\n苏清晏执礼落座右侧末席，陈长庚则缩着脖子退到帐角铜泥炉旁，拎起粗陶水壶垂首侍立。\n\n“人都齐了，某家不讲虚礼。”\n\n霍千山虎目一扫全场，嗓音沉闷如重锤砸铁，“昨夜子时，西南烂泥滩死了两个带玄煞门断镖的巡营散修，哪一房当的值？”\n\n下首石百川双腿一哆嗦，抢步出列擦汗道：“回、回霍师兄！是两个外募散修私通敌宗细作摸上浅滩，被乱磁风眼当场绞碎了！挑事的疯囚窦文焕属下已拿生铁囚车焊死，绝未走漏半点军机！”\n\n“哼，外院这帮筛子，连营栅都看不住！”\n\n左侧曹无极冷笑一声，斜睨了对面梁世勋一眼，“依我看，玄煞门和血河宗的耗子早摸清咱们南岸虚实了，再拖到二月初四乱哄哄压进去，头汤全得喂了外人！”\n\n梁世勋“啪”地合拢折扇，皮笑肉不笑地顶回去：\n\n“曹师弟这话好没道理，后山甲字房炼器炸膛耽误了军械交期，这会儿倒急着催大伙儿进墟替你抢功？”\n\n“梁世勋，你找死？！”曹无极拍案暴起，九窍血煞气轰然外放！\n\n“够了！”\n\n主位上的霍千山手掌往帅案上一按！\n\n“咚”的一声闷响，百炼铁木帅案硬生生陷下半寸掌印，一股炽烈赤炎劲生生将曹、梁两股煞气震散！\n\n霍千山取出一卷赤金长老手令拍在桌角，顺势哗啦展开一幅丈许长的羊皮堪舆图：\n\n“掌门与器堂长老有令，本次沉渊古盐墟开启三十六个时辰，三家合力先取中层石窟那株‘赤煞伴生莲’！”\n\n“谁先破开中窟毒火障摘得莲台，莲心七颗伴生赤髓子归头功者独占四颗，余下三颗两家平分！”\n\n帐内呼吸声顿时粗重起来！\n\n赤煞伴生莲，那是十年才借古墟地火凝结一株的冲击开脉奇珍，省却数年苦功！\n\n曹无极眼底贪色暴涨，盯着羊皮图沉声道：“中窟外头隔着盐晶长廊与分卤岔殿，蚀骨风眼密如筛孔，谁打头阵开道？”\n\n梁世勋微笑着将折扇朝末席一指：“内门重金聘来天阵宗苏客卿，不正是为了破这蚀骨风障么？”\n\n几道滚烫算计的目光唰地钉在苏清晏身上。\n\n霍千山手指一点羊皮图前段红线，语气不容置疑：\n\n“赵执事，将铁笼死囚与外门水工编为第一梯队，进墟先蹚头道浮瘴。”\n\n“苏客卿携寻脉馆随从编入第二梯队正中破阵口，限半个时辰内钉住长廊风眼，替我三家精锐开道！”\n\n“办不到。”\n\n苏清晏端坐未动，三个字冷得像冰碴子，“聘书白纸黑字写明，寻脉馆只司定脉指路，不充前锋肉盾。”\n\n曹无极狞笑一声：“上了南岸军帐还拿聘书摆谱？赵执事，念念掌门军法！”\n\n旁边的赵怀恩立刻踏前一步，铁青着脸抱拳喝道：“战时抗命不尊调遣者，无论客卿杂役，一律按乱军斩旗！”\n\n梁世勋慢悠悠补上一刀：“苏客卿孤身一人，何必跟军法过不去？只要替咱们把中窟莲台外头的禁制挑开，沿途碎盐晶少不了你的份。”\n\n三言两语，三大内门霸主便在打压外人与争抢头功上达成了最冷酷的默契，把寻脉馆死死摁在了第二拨蹚雷刀口上！\n\n苏清晏握着茶盏的素白指节微微发青，呼吸在第三息几不可察地一滞，终究冷冷偏过头没再硬顶。\n\n“茶凉了，还不给几位师兄续水！”赵怀恩回头冲帐角厉喝一声。\n\n“哎，小人这就添！”\n\n陈长庚惶恐一颤，双手拎着滚烫粗陶壶，弓着虾米腰小碎步挪到帅案边。\n\n先给霍千山添满七分，再绕过案角给曹无极、梁世勋续水。\n\n茶水注入瓷盏热气氤氲的三息工夫，陈长庚低垂的眼帘借着水汽遮掩，将案心那幅三家合参的羊皮堪舆图从头到尾刮了一遍！\n\n只见图上朱砂红线穿过盐晶长廊、分卤岔殿、磁雷盐桥，最终密密麻麻圈死在“中窟·赤煞莲台”六个大字上。\n\n而在莲台石壁往下的整片图纸，赫然是一团涂黑的“绝脉死岩”！\n\n再瞥一眼霍千山与梁世勋随从靴跟沾着的灰白滩泥，没有半星西南断崖底下独有的腐黑老卤渍！\n\n陈长庚拎着茶壶退回炉角，心脏在胸腔里稳稳落回实处，嘴角深处掠过一抹无人察觉的冷意。\n\n闹了半天，这三位叱咤内门的九窍天骄，眼里只有中窟台面上那株赤煞伴生莲！\n\n他们连中窟黑岩底下藏着整条“地母玄晶”主矿髓的边都没摸着，更做梦都想不到西南芦苇断崖三丈水底，还有一条避开外围杀阵直插核心腹地的废弃排卤暗沟！\n\n“行了，各营按序备战，二月初四破晓准时入墟！散帐！”\n\n霍千山一挥手收起羊皮大图。\n\n曹无极与梁世勋各自冷哼一声，率领随从起身掀帘往外走，苏清晏也冷着脸拂袖离席。\n\n陈长庚等贵人们走空大半，这才麻利地端起木托盘，上前收拢帅案边缘几只喝剩的粗瓷茶盏，低着头往帐门外退去。\n\n一只草鞋刚跨过帅帐门槛——\n\n“慢着。”\n\n背后虎皮主位上，一直没动窝的霍千山忽然冷冷开口：“那个挑箱子的灰衣杂役，站住。”\n\n陈长庚脚步一僵，端着托盘半转过身：“回、回大老爷，小人……”\n\n话音未落，主位上的霍千山眼神骤然化作两道刺骨寒电！\n\n天阵宗苏氏孤女入险地，身边怎会只带一个连话都说不利索的外门废物？莫不是苏家暗中塞进来保命的九窍易容死士？！\n\n霍千山半句废话不问，搭在扶手上的右手食指猛然隔空一弹！\n\n“嗤——！！”\n\n一缕凝练如赤红钢针、足可洞穿精铁甲叶的通窍九窍巅峰“赤炎指劲”骤然撕裂三丈空气，毫无征兆地直射陈长庚右肩琵琶骨肩井大穴！"}, {"n": 55, "title": "卸劲演庸", "body": "那缕九窍巅峰赤炎指劲快如奔雷，离陈长庚右肩井穴已不足三寸！\n\n滚烫灼烈的火煞气未至，便将他肩头灰麻旧布燎出一圈焦黑糊味！\n\n帅帐门外十步之内，刚走下石阶的曹无极、梁世勋与苏清晏同时察觉恶风，齐刷刷驻足回望！\n\n生死悬于一发！\n\n陈长庚瞳孔不惊反敛，脑海里的念头比电光还快：\n\n霍千山这是疑心他是天阵宗暗藏的高阶护卫，拿重手法试他根骨深浅！\n\n这一指他若仗着通窍八窍后期横练硬扛不退，哪怕只卸掉表面冲力稳住下盘，当场就坐实了藏拙死士的罪名，霍、曹、梁三家立刻就会联手把他剁成肉泥！\n\n“想验我的成色？那就演足十分给你看！”\n\n千钧一发之际，陈长庚非但没有催动护体真气外顶，反而将全身肌肉瞬间放软！\n\n就在赤炎指劲透入右肩皮膜的刹那，深藏在脏腑骨髓间的《井煞锻骨诀》暗金柔劲如水底暗涡悄然一旋，无声无息化去七成摧筋裂骨的杀力，顺势将余下三成最精纯的赤炎火劲死死卡在肩井气窍边缘！\n\n与此同时，借着那一指凶猛的外冲余势——\n\n“砰——哗啦啦！！”\n\n陈长庚整个人像只被重锤砸飞的破麻袋，斜刺里狠狠撞翻门槛旁那张摆满茶具的矮木案，连人带碎瓷片狼狈不堪地滚下三层石阶，一头栽进腥臭黑泥地里！\n\n滚地的瞬间，他牙齿重重一磕舌底早就备好的一粒冷铅腐血丸！\n\n“呃啊……噗——！！”\n\n一口乌黑发紫、混着刺鼻药渣酸臭味的淤血狂喷出两尺远，染红了胸前破麻衣襟！\n\n陈长庚双手死死抠进黑泥浆里，一双满是乌卤裂口与厚黑老茧的熬盐手掌青筋暴凸，脖子拉风箱般剧烈抽气，周身只荡开一圈被高阶敛息玉符死死锁住、虚浮滞涩得随时会散架的通窍六窍气机！\n\n“霍千山！”\n\n石阶下，苏清晏俏脸骤寒，素手一翻扣住两枚八棱试脉铁钎，森冷煞气直指帐门，“拿本座挑定磁炭的随行杂役试指力，器堂是想先撕了内门聘约不成？！”\n\n旁边看热闹的曹无极原本还眯着眼等好戏，一瞅见泥地里吐黑血打摆子的陈长庚，顿时仰头哈哈大笑起来：\n\n“哈哈哈！我说霍师兄，你在器堂火窟里闭关炼器炼魔怔了吧？”\n\n“这就是后山丙字废渣房那个天天筛毒灰、上回在纳贡院差点断气的六窍烂肺鬼！也值得你器堂大师兄亲自弹一记赤炎指？传出去不怕笑掉外门杂役的大牙！”\n\n梁世勋摇着折扇瞥了一眼地上碎瓷片，嘴角也浮起一丝讥诮：“霍师兄谨慎过头了，天阵宗真有九窍死士，哪舍得去废渣谷闻半年冷铅臭气。”\n\n帐门高处，霍千山却压根没理会曹、梁二人的冷嘲热讽。\n\n他生性多疑到了骨子里，耳听为虚，非得亲手摸过经脉才信！\n\n霍千山迈开大步走下石阶，径直停在陈长庚面前，居高临下俯身探出铁钳般的右手，五指如钩一把扣住了陈长庚沾满黑泥的右腕寸关尺！\n\n“大、大老爷饶命……小人肩骨碎了……”陈长庚吓得浑身筛糠乱抖，连一丝挣扎的力气都使不出来。\n\n霍千山冷哼不语，一缕凝练霸道的九窍巅峰赤炎真气毫无顾忌地撞入陈长庚腕脉，沿着手三阳经横冲直撞扫了一圈！\n\n一息、两息、三息！\n\n胸口贴肉佩戴的天阵宗“高阶敛息玉符”温凉不动，将真正雄浑如江河的八窍暗金气血遮得严丝合缝。\n\n霍千山指腹探到的，唯有六处半通不通、淤满陈年乌卤铅火毒的破烂气窍，经脉壁薄弱滞涩，被他方才三分指劲一震便乱成了一锅烂粥！\n\n确确实实是个靠熬苦力硬磨上六窍的短命杂役，半点世家死士的根基都没有。\n\n“哼，经脉淤成这样还敢进中军帐端茶，算你命大禁摔。”\n\n霍千山眉宇间的疑云彻底散去，嫌脏似的松手甩开陈长庚手腕，转头瞥了冷面持钎的苏清晏一眼：\n\n“某家只是替苏客卿试试脚夫斤两，免得进了古盐墟连两箱炭都挑不动。管好你的人，莫挡器堂的路！”\n\n丢下这句场面话，霍千山双手负后，大步流星重返中军帅帐。\n\n曹无极嗤笑一声带着胡彪扬长而去，梁世勋则深深看了一眼苏清晏袖口的铁钎，慢条斯理踱回东坡营区。\n\n泥地里，陈长庚捂着右肩，一瘸一拐爬起身，捡起摔裂的木托盘跟在苏清晏身后退回西南烂泥坳。\n\n刚踏进泥坳口，苏清晏脚步一停，头也不回地从袖中抛出一只拇指大的青瓷药瓶：\n\n“外敷肩井，一日三次。死在开墟前没人替你挑箱子。”\n\n“咳咳……谢客卿仙师赐药……”\n\n陈长庚双手接住药瓶，弯腰目送苏清晏掀帘进帐落锁，这才捂着肩膀钻进侧旁那间低矮破草棚，反手拉严了加厚芦苇帘。\n\n草帘落定的一瞬。\n\n陈长庚脸上那副痛苦瑟缩的病容刹那褪得一干二净，佝偻的脊梁骨笔直如铁枪！\n\n他随手抹去嘴角残留的冷铅药血沫子，内视右肩井穴边缘那缕被暗金脏腑劲与贴腹石臼合力锁死、至今仍在左冲右突的赤红火丝，眼底浮起一抹幽冷笑意：\n\n“器堂大师兄亲手喂的九窍巅峰纯阳赤炎劲，外头花十枚灵石都买不着这么纯的火种。”\n\n接下来两日，陈长庚白日里胳膊吊着破布条在泥坳外慢吞吞劈柴垫路，演足了重伤未愈的萎靡模样，连高坡盯梢的梁家暗哨都懒得再多瞧他一眼。\n\n转眼熬到正月二十七亥时。\n\n夜潮翻涌，刺骨腥臭的灰黑蚀骨瘴再次将西南烂泥坳裹得密不透风。\n\n距前次炼化八窍毒囊已稳稳满三十六个时辰，炭箱黑泥底下的半截蚀纹石臼准时传来第三十二轮潮汐轻颤！\n\n陈长庚盘膝坐于矮草棚中央，先取小木盒里最后一粒边缘碎晶嵌入青铜隔味阵盘，撑开三尺无声气幕。\n\n随即摸出蚀纹石臼抵紧直通地下煞脉的生铁钎尾，先倒进半袋鼎余轩剧毒废丹灰垫底，紧接着左掌猛拍右肩琵琶骨！\n\n“给我出来！”\n\n《井煞锻骨诀》暗金气血轰然一挤，霍千山留在肩井窍边的那缕狂暴九窍巅峰赤炎劲被硬生生逼出指尖，尽数打入石臼灰窝之中！\n\n“嗡——！！”\n\n地下潮汐支脉凶煞与九窍巅峰纯阳火劲在古拙石纹间剧烈对撞碾磨，废丹灰里的铅汞残毒瞬息化作黑烟消弭，收尾一刻钟的浓烈地火腥甜气全数被隔味阵幕死死锁在方寸之地！\n\n两刻钟后，灰光敛尽。\n\n臼窝正中，赫然静静躺着四钱通体赤金交织、散发着灼热生机的无瑕道髓晶砂！\n\n陈长庚眼底精芒暴涨，仰头将这四钱融合了器堂真传纯阳本源的极品髓晶一口吞入腹中！\n\n“轰——！！”\n\n仿佛一轮赤金小太阳在五脏六腑间轰然炸开！\n\n毫无丹毒滞碍的精纯药力化作滚滚洪流，沿着第八处主气窍最后几道细微褶皱摧枯拉朽般横扫而过，将四肢百骸每一寸暗金筋骨淬炼得圆满无漏、坚若百炼乌金！\n\n通窍八窍圆满，成！\n\n陈长庚双拳微握，体内潜藏的纯粹肉身爆发力已直逼三千斤大关，距离通窍第九窍只剩最后一层窗户纸！\n\n他吐出一口绵长白气，收妥石臼与寒玉匣内原封未动的六十四钱存晶，安稳歇至天明。\n\n次日正月二十八卯末，晨雾湿冷。\n\n陈长庚照例卸掉肩头破布条，拎着一只空木桶慢步晃到大营后勤伙房领两日份的杂面干粮。\n\n刚领了四张硬饼子拐出伙房侧门，走到堆放烂菜叶的竹篱笆拐角——\n\n“笃、笃笃。”\n\n篱笆外泥道上，一名挑着两筐带泥老白菜、戴着破毡帽的驼背老脚夫忽然拿扁担头磕了三下竹竿！\n\n陈长庚眼角余光一扫，脚步微不可察地一顿。\n\n只见那驼背老脚夫抬起一张抹满锅底黑灰的干瘦老脸，拢在破棉袖筒里的右手飞快翻出三长两短、独属于黑石坊市脚行生死急件的暗手势——\n\n竟是不知怎的乔装混进南岸军营的地下老搭档，贺九斤！"}, {"n": 56, "title": "伙房密讯", "body": "伙房外人来人往，两名背刀巡卫正骂骂咧咧催促运粮车卸货。\n\n陈长庚脸上连一丝波澜都没起，像完全没瞧见竹篱笆外的驼背老脚夫，低头拎着装干粮的木桶拐过污水沟，一闪身钻进了伙房北墙根堆满丈高湿芦柴的狭窄死角。\n\n这处背风夹道两边被烂柴垛堵住，平日连倒泔水的杂役都嫌泥深不往里踩。\n\n不过五息工夫，外头枯苇叶哗啦一响。\n\n挑着空菜筐的贺九斤像条滑溜水蛇般猫腰钻进柴垛缝里，一进暗影便摘下破毡帽抹了一把额头冷汗，压得极低的嗓音都在发颤：\n\n“我的亲兄弟哎！可算叫哥哥蹲着你落单了！再晚半柱香送菜船开拔，哥哥提着脑袋也不敢在军营里多留！”\n\n陈长庚耳廓微动，确认十丈内绝无第三道呼吸声，这才低声开口：\n\n“九斤哥不在黑石坊市安稳做买卖，怎么抹着黑灰混上南岸送菜船了？”\n\n“还做个屁的买卖，大泽天都要塌了！”\n\n贺九斤急得直拍大腿，可一到正题上，多年刀口舔血的脚行老毛病立刻犯了，拢着破袖筒伸出五根黑瘦手指飞快一比：\n\n“长庚兄弟，亲兄弟明算账！为了截这条买命的死信，哥哥折了坊市暗渠两个老弟兄！一口实价，五枚整下品灵石，少半块哥哥现在就挑筐走人！”\n\n他嘴上喊着五枚整灵石，眼珠子却盯着陈长庚身上这件洗得发白的灰麻杂役袄直打鼓，生怕这盐场出来的老兄弟掏不出这么大一笔巨款。\n\n陈长庚一句讨价还价的废话都没讲。\n\n他左手探入怀中内袋一摸，从五十五枚整石里数出五枚棱角莹润的下品灵石，直接塞进贺九斤粗糙冰凉的掌心里：\n\n“数准了。说正事。”\n\n贺九斤手指一合，摸到实打实五枚灵气盎然的整灵石，眼珠子差点瞪圆了！\n\n好家伙，当年乌卤盐场熬黑卤的穷小子混进云泽宗外门才半年多，随手就能摸出五枚整灵石买信！\n\n但贺九斤最懂黑市活命铁律，一个字不打听财物来路，飞快将五枚灵石揣进贴肉肚兜，凑到陈长庚耳根前用气音吐出一段惊雷密讯：\n\n“前儿半夜，玄煞门和血河宗两派的黑水堂主在乱苇洲暗中摆了血酒，花整整一百枚灵石重金，买通了你们大营里随船征调的两个老散修向导！”\n\n陈长庚眼神骤凝：“哪两个向导？想在古盐墟里引路伏击？”\n\n“我要认得脸，早拿去卖内门换百石赏钱了！”\n\n贺九斤拼命摇头，声音压得像鬼吹风，“最狠的根本不是伏击！那两派知道你们云泽宗外头有开脉境长老坐镇战船，压根不跟你们拼地面阵仗——”\n\n“他们给那两个内鬼塞了六颗破脉轰天雷，定在古盐墟开启第三日正午时分，里应外合炸断古盐墟正门那根承重主石梁！”\n\n贺九斤一把攥住陈长庚胳膊，指节掐得发白：\n\n“兄弟你想想，古盐墟三日合拢，第三日正午炸塌唯一正门，你们宗门进去的霍千山、曹无极连同几百号人，全得活生生憋死碾烂在几百丈地底岩层里，一个活口都爬不出来！”\n\n湿冷柴垛间寒风倒灌，吹得人后颈生寒。\n\n贺九斤喘着粗气，从怀里摸出一块备好的油布塞过去，苦口婆心劝道：\n\n“当年在乌卤盐场暗涵口，你替哥哥瞒下私盐夹层救过我一命，今儿哥哥把这条道卖给你，咱们两清了！”\n\n“趁现在还没进那口绝命石棺材，今晚下半夜起东南大风，你赶紧钻西边芦苇荡顺水逃命！哥哥我拿了你这五枚灵石凑够养老钱，回黑石坊市买座带阵法的石屋彻底封门收山，这辈子再不沾大泽一滴腥水了！”\n\n听完这桩足以葬送云泽宗整代内门精锐的绝户毒计，陈长庚心头猛地一震。\n\n可不过短短两息，他脑海里那把冷硬到极致的铁算盘，却啪啪拨出了另一番截然相反的天大良机！\n\n今夜钻芦苇荡私逃？\n\n外行人才做这种春秋大梦！\n\n南岸大营帅楼上坐镇着内门开脉境督查长老，神念一铺笼罩十里水面，临阵逃役的杂役不出半个时辰就得被飞剑枭首挂上旗杆！\n\n就算侥幸逃回黑石坊市当一辈子缩头黑户，没有沉渊古盐墟底窟的“地母玄晶”做母引，他永远卡在通窍九窍门槛外，百年后照样是一捧黄土！\n\n反过来把这笔死账翻个面算——\n\n玄煞门和血河宗要在入墟第三日正午炸塌古盐墟正门！\n\n按古盐墟铁律，乱磁煞雾严禁开脉境修士入内，一旦正门承重石梁在第三日正午被轰塌封住，守在门外战船上的云泽宗开脉长老既进不去救人，神念也彻底穿透不了百丈塌方乱磁岩层！\n\n而窟内霍千山、曹无极、梁世勋三拨人马被断绝生路，必定与潜入窟内的敌宗高手杀得尸山血海！\n\n敌宗这一炸，哪是什么灭顶死局？分明是亲手替他陈长庚拉下了一道隔绝内外所有老怪耳目的千斤石闸，好让他干干净净摸进底窟独吞整条地母玄晶，再顺着西南断崖水底那条废弃排卤暗沟大摇大摆游出生天！\n\n心念百转，陈长庚脸上却恰到好处地浮起一抹煞白惊惶，反手重重握了一下贺九斤的手腕：\n\n“多谢九斤哥冒死送信！白日岗哨太密动不得身，等入夜起风我自会寻空子钻水荡。九斤哥快趁送菜船离岸，回了坊市关紧石门安稳享福，千万别再回头！”\n\n“成！你小子向来鬼主意多，定能捡回命来！”\n\n贺九斤欣慰地一拍胸口，重新扣上破毡帽，“走了！往后有命路过黑石坊市南街，记得敲三下石门找老哥哥喝烧刀子！”\n\n话音未落，驼背老脚夫挑起两只空菜筐钻出柴垛，混入伙房外挑潲水的民夫队伍里，几个起落便消失在南岸渡口浓雾之中。\n\n柴垛暗影里安静下来。\n\n陈长庚拎起木桶走出夹道，将“入墟第三日正午正门必塌”九个字牢牢刻进心底，面色平静地踏泥返回西南烂泥坳。\n\n主帐之内，苏清晏正盘膝擦拭那三枚八棱试脉铁钎。\n\n陈长庚隔帘奉上杂面干粮，随后蹲在帐门边整理那两只试阵废炭箱，一边捆麻绳一边状似无意地低声开口：\n\n“客卿仙师，方才小人去前营伙房领粮，路过水边瞧见大泽深水线连日退落了两丈有余，今早又骤降了三尺多深，滩底直往上翻白沫酸泥泡。”\n\n苏清晏擦拭铁钎的素手微顿，抬眸看他：“地磁退潮前夕，大泽水脉逐日下沉乃常理，大惊小怪什么？”\n\n陈长庚垂着眼皮，用最朴实的老盐工口吻回道：\n\n“回仙师，小人不懂大阵，只记得早年在乌卤盐场掏老井时，但凡遇上地下大水连落两丈多抽空泥浆，井口顶上的承重老石梁十有八九要受震塌方堵门。”\n\n他指了指炭箱侧面尚余的半尺空槽：“咱们箱边还塞得下家伙，不如趁拔营前多备三副破岩精铁钎带上，万一石廊落石卡住了门道，小人也好出力替仙师撬条缝出来。”\n\n帐内静了两息。\n\n苏清晏清冷如霜的眸子在陈长庚低垂的眉眼间扫过。\n\n没有追问他去哪听来的闲话——盐场苦力常年跟塌井毒窟打交道，防门梁塌陷确是保命老理，况且入墟后多备破岩器械百利无一害。\n\n“哗啦。”\n\n苏清晏素手一抹腰间储物囊，三副通体乌亮、前端带破石棱角的百炼精铁长钎直接扔在炭箱木盖上：\n\n“油布裹好塞进箱侧，少了一根拿你试问。”\n\n“小人遵命！”陈长庚麻利地将三副破岩铁钎捆进炭箱夹层，心里又踏实了一分。\n\n拾掇完炭箱，已近巳时。\n\n陈长庚端起夜里洗木桩剩下的半盆黑泥脏水，绕过矮草棚，走到烂泥坳最西南角的枯苇高坡边倾倒，顺势借着苇丛遮掩，抬眼望向半里外那道藏着水底排卤暗沟的芦苇断崖。\n\n只看了一眼，陈长庚端木盆的五指骤然收紧！\n\n只见大泽深水线受地磁退潮前兆牵引，较月初已累计退落两丈有余，今日更骤降三尺多深，使得原本潜于三丈水底的排卤暗沟铁栅，此刻距断崖浑黑水面已不足一丈！\n\n可就在那处荒僻芦苇断崖顶端的乱石坡上，内门庶务执事赵怀恩竟按剑亲临督阵，十二名披坚执锐的黑甲铁卫正抡锤砸下生铁桩，沿着断崖水面横空拉起了三道挂满示警铜铃的粗大困水铁索！"}, {"n": 57, "title": "夜潜蚀栅", "body": "芦苇断崖顶上的打桩铁锤声，隔着半里浓雾还震得水面直颤。\n\n陈长庚端着空木盆退下枯苇坡，面上神色如常，心里却把赵怀恩的布防路数摸了个通透。\n\n大泽水位连日退落，西南角这片背风深水崖最容易藏船偷渡。\n\n赵怀恩拉起三道困水铁索挂满铜铃，防的是玄煞门水鬼摸进大营后背，压根不知道水面以下不足一丈的岩壁凹槽里，还缩着一道前代盐工封死的排卤暗沟。\n\n可无心插柳的死哨，照样能要人命。\n\n“真等入墟第三日正午正门炸塌、几百号疯狗在窟里抢路逃命时，我再游过来硬撬那扇千斤生铁栅？”\n\n陈长庚走回烂泥坳矮草棚，弯腰把木盆扣在桩脚，“只要铁栅响上一声，崖顶十二双眼睛外加连弩火箭当场就能把暗沟口射成筛子。”\n\n退路必须赶在开墟前，悄无声息啃成一层一捅就破的窗户纸。\n\n接下来两日，南岸军营风声鹤唳。\n\n陈长庚白日里老老实实挑水劈柴，趁着去西滩捞浮苇垫帐的工夫，远远绕过断崖外围哨线，将崖顶十二名铁甲卫换防的时辰与避风石凹记了个分毫不差。\n\n傍晚收工路过东坡路口时，他还撞见梁世勋的刀疤随从梁猛领着一名黑衣瘦汉从苇荡边走过。\n\n那瘦汉脖颈两侧生着诡异灰斑，浑身裹着紧贴皮肉的油浸水靠，走起路来脚底连泥点都不溅一星，赫然是一名专精水底暗杀的通窍九窍水鬼暗卫。\n\n梁猛一边走一边朝西南烂泥坳方向努了努嘴，声音压得阴冷：“看准那女人营帐后的水路，办利索点，公子重重有赏。”\n\n那水鬼暗卫连头都没点，只阴森森扫了一眼烂泥坳口挑柴的陈长庚，转身便没入东坡大帐。\n\n陈长庚垂着眼皮挑担走远，眼底寒意一闪而逝。\n\n梁家明面上抢不到避风阵图，背地里已经动了水路截杀的脏心思。\n\n转眼熬至正月三十亥时。\n\n距前次吞炼赤炎劲又满三十六个时辰，炭箱毒泥底下的半截蚀纹石臼准时传来第三十三轮潮汐轻颤。\n\n陈长庚照例在矮草棚内掰下半块碎灵石嵌入青铜隔味阵盘，催动阵纹撑开三尺无声气幕，再将石臼抵紧直通地下支脉的铁钎尾端，把手里最后半袋鼎余轩剧毒废丹灰一股脑倒进臼窝。\n\n两刻钟后，浓烈地火腥甜气尽数敛于阵幕之内，臼底稳稳析出四钱莹白无瑕的道髓晶砂。\n\n陈长庚先取出其中两钱晶砂，亲手按进那尊三百斤青铜机括盾偶的胸口阵槽。\n\n微弱金芒一闪而敛，前些天在黑芦沟耗空威能的百炼盾偶，再度恢复了足以硬撼九窍重击的巅峰战力！\n\n余下两钱新晶并入锁灵寒玉匣，匣内存晶稳稳涨至六十六钱整。\n\n次日便是二月初一，距离沉渊古盐墟十年地磁退潮开启，仅剩最后三日。\n\n入夜前，乌云如铅块压住整片沉渊大泽，豆大的冰冷雨点噼里啪啦砸在营帐白布上。\n\n陈长庚挑完最后一桶清水送进主帐门廊，低声回禀：“客卿仙师，外头起了暴雨，大泽水气泛酸，小人把两只试阵炭箱全垫高了半尺防潮。”\n\n帐内灯影微晃，苏清晏正执朱笔核对蛟皮阵图，头也未抬：\n\n“水退日急，乱磁已近浅滩。今夜起无本座传唤，老实待在棚里，莫往水边乱撞。”\n\n“小人惜命得紧，一步也不敢乱走。”\n\n陈长庚恭顺应了一声，退回侧旁矮草棚拉严草帘。\n\n他静静盘膝等到子夜交更。\n\n外头狂风暴雨如天河倾泻，密集雨声混着大泽拍岸浊浪，将十步外的一切响动遮得干干净净。\n\n陈长庚在草棚角落堆起一卷破蓑衣伪作睡形，贴胸压实天阵宗高阶敛息玉符，腰间系上寒铁虫瓮与一只严密蜡封的小油布包，借着草棚后方排水泥沟如游鱼般滑入黑夜苇荡。\n\n半里外的芦苇断崖顶上，风狂雨急。\n\n“娘的！这鬼天连只水耗子都冻僵了，玄煞门的傻子才挑这时候摸营！”\n\n崖顶避风石凹下，刚交接换防的铁甲什长抹了一把脸上雨水，骂骂咧咧往火盆边缩，“把裤腿烤干再去巡西桩，横竖水面上三道铜铃索绷得紧实，碰一下半座营都能听见！”\n\n“什长说的是，来，喝口辣姜汤暖暖身子！”\n\n几名夜哨挤在石凹里分喝热汤，正是子夜换防最松懈的半刻钟死角。\n\n他们脚下两丈多高的断崖根部，一道不带丝毫真气波动的黑影贴着湿滑腐泥悄然滑入刺骨黑水之中，连一圈多余的水花都没溅起。\n\n水下漆黑如墨，混杂着地磁退潮前翻上来的浓重硫卤苦味。\n\n陈长庚运转《井煞锻骨诀》龟息秘法，周身毛孔闭锁，一口绵长内息足可在水底硬撑小半个时辰。\n\n他贴着水底烂泥缓缓游进，抬头借着水面微弱天光看准上方三道横江铁索，从两串示警铜铃下方的盲区轻巧穿了过去。\n\n顺着陡峭岩壁下潜不足一丈，绕过外侧一道厚实突出的天然折角石梁，双手便触到了内凹处高三尺二寸、宽两尺半的排卤暗沟石框。\n\n七根手腕粗的百年精铁栅栏牢牢封在沟口，两侧上下四处粗大合页早已被水锈与老卤盐壳糊成铁疙瘩。\n\n若拿乌金分水刺硬撬，水波传音极快，第一下金铁摩擦声就会顺着崖壁传进崖顶铁卫耳朵里。\n\n陈长庚悬停在浑水暗流中，手指在腰间寒铁虫瓮封口轻轻一按。\n\n神血母印悄然催动！\n\n二十道米粒大小的暗金黑影无声无息钻出瓮口，顶着浑浊暗流，精准无比地分成四股钻进了铁栅两侧上下四枚粗铁合页的背水死角！\n\n二次蜕壳的嗜铁煞甲虫最喜陈年精铁，锋利口器在水底交错开合，细碎如蚕食桑叶的微响彻底淹没在汹涌暗流与漫天暴雨声里。\n\n陈长庚双目微凝，将神念控虫的精度压到了极致。\n\n啃一分、再进一分……\n\n足足一盏茶工夫过去，四枚合页内里大拇指粗的百炼铁轴心，已被二十只凶虫从内部硬生生啃空了九成有余，只剩下最外圈一层薄如鸡蛋壳的红褐老锈皮勉强撑着原样！\n\n陈长庚伸出一根手指试了试铁栅分量。\n\n纹丝未动，连水流打上去的漩涡都没变分毫；可只要他日后从里头顺水冲出来肩膀一撞，这扇千斤铁门当场就会齐根崩飞！\n\n他心念一收，二十只吃饱精铁精华的煞甲虫乖巧退回寒铁药瓮。\n\n紧接着，陈长庚探臂穿过两根铁栏之间仅容手腕进出的窄缝，摸到暗沟内侧上方一处高于水线的干燥岩缝，将腰间那只裹了三层桐油布的小包严丝合缝塞进石槽深处，外头再拿一块老卤泥皮封平。\n\n油布包里装的，正是前几夜缴获的两颗赤阳雷火弹与一只空封晶寒玉小匣。\n\n身上留六枚三倍威力的过载烈阳火珠与两只空匣冲阵，暗道出口再备一份后手接应，哪怕在窟里拼得弹尽粮绝，钻出这道沟照样有翻盘的家伙！\n\n半刻钟换防窗口将尽，崖顶已隐约传来夜哨起身踢石子的脚步声。\n\n陈长庚仔细抚平沟口浮泥，贴着崖底缓缓往岸边枯苇浅滩退回。\n\n就在他半截身子刚缩进水下芦苇根丛、准备换气上岸的刹那——\n\n头顶近三丈高的断崖边缘，一道漆黑瘦削的人影竟避开所有铁索铜铃，如一片无声鬼蝠般从崖顶翻落，双足并拢笔直扎进了不远处的浑黑深水！\n\n借着水波荡开的一线幽微萤光，陈长庚瞳孔骤然缩成针尖。\n\n那人脖颈两侧灰斑显眼，一身紧绷油浸水靠，怀里还紧抱着一颗拳头大小、布满倒刺铁棱的乌黑圆球——\n\n正是白日里梁猛私下交代差事的那名梁家通窍九窍水鬼暗卫！"}, {"n": 58, "title": "借瘴葬卫", "body": "冰冷浑浊的黑水底下，那名梁家九窍水鬼暗卫水性极精。\n\n入水后双臂仅仅轻轻一划，整个人便如一条没有骨头的黑鱼般贴着崖壁下潜，腰间鼓鼓囊囊绑着一只水獭皮缝制的闭气皮囊，一根细芦管正咬在嘴角换气。\n\n他左手托着一块用黑布遮了大半、只漏出一豆惨绿微光的探水萤石，右手则拎着那颗挂满细铁链的乌黑铁球，径直朝着断崖根部这片背流凹槽摸来！\n\n“锁魂水雷？！”\n\n三丈外的水草腐泥深处，陈长庚整具身躯瞬间化作一块死寂顽石，连眼珠转动的幅度都压到了最小。\n\n他认得那玩意儿！\n\n上月跟贺九斤打听水战凶器时听过一嘴，这种内门水师严禁私用的锁魂水雷专炸水下暗桩，一旦拔掉顶端铜销绑上岩柱，十丈内只要有活人真气擦过引线，炸开来连九窍高手的神魂都能震成碎渣！\n\n这暗崖凹槽紧挨着西南烂泥坳后侧水道。\n\n梁世勋这是算准苏清晏孤立无援，怕她开墟前夜里下水勘脉或留水路后手，竟派贴身九窍水鬼趁暴雨夜偷偷摸下断崖，要把这颗绝户雷钉死在寻脉馆眼皮子底下！\n\n更致命的是方位！\n\n那水鬼暗卫挑中的绑雷岩笋，距排卤暗沟虽隔着一道厚实折角石梁，也在外侧丈许之内！\n\n他左手那块惨绿萤石正一寸寸往前探照——五尺、四尺、三尺半！\n\n只要绕过折角石梁再往前探出三尺光亮，铁栅合页缝隙里刚刚被煞甲虫啃落的一撮新鲜铁粉，当场就会撞进这九窍水鬼的眼帘！\n\n一旦让他活着浮上去向梁世勋报信，整条排卤暗沟和底窟玄晶的退路瞬间灰飞烟灭！\n\n现在暴起冲过去拿乌金刺捅穿他的喉咙？\n\n陈长庚死死按住右袖滑槽里的百炼乌金刺，一息之间便掐灭了硬拼念头。\n\n水下阻力极大，九窍水鬼在水中更是如鱼得水，真要近身搏杀，哪怕两息解决战斗，剧烈真气翻涌也必定撞响头顶两丈外的三道铜铃铁索！\n\n而且尸身上只要留下一道三棱破甲刺口，明日梁世勋与赵怀恩捞起死尸一验，立刻就知道水底藏着第二个高手！\n\n陈长庚冰冷的目光缓缓下移，落在了从暗沟下方一直延伸到折角石梁根部那片隆起尺许、表面结满滑腻黑苔的软泥包上。\n\n在乌卤盐场跟老卤打交道三年，哪怕隔着冰冷黑水，他鼻端也能清晰辨出那层泥皮底下渗出的刺骨腐臭——\n\n那是百年排卤暗沟淤塞后，沉积在崖底石缝里的天然剧毒黑卤囊！\n\n里头蓄满的陈年浓缩老卤毒瘴一旦挑破，粘上眼睛当场烧瞎，呛进半口连铁打的肺管子都得抽筋痉挛！\n\n“自己怀里抱着拔了销的催命雷，还敢往百年毒囊顶上凑……”\n\n陈长庚眼底杀机凝如实质，悄悄屈起左手两指叩开寒铁虫瓮一道细缝，右手无声滑出那柄九寸三分的百炼乌金破甲分水刺。\n\n不急，等他拔销！\n\n水波幽暗处，陈长庚趁水鬼背身之际借折角石梁死角贴泥潜近至石梁侧后伸臂可及处，那九窍水鬼丝毫不知一石之隔已贴上死神。\n\n他停在石梁外侧那根凸出岩笋前稳住身形，先把探水萤石夹在左腋下，腾出双手将锁魂水雷的细铁链绕上石笋，拇指扣住水雷顶端那枚半寸长的保险黄铜销，小心翼翼往外一拔！\n\n“咔。”\n\n极轻微的一声水下机括弹响，水雷内里暗红符纹骤然亮起一线微光——只要摁住侧翼弹簧片的五指一松，三息之内必爆无疑！\n\n水鬼暗卫刚低头要去打死铁链暗扣——\n\n就是现在！\n\n伏在石梁侧后死角的陈长庚右臂暗金柔劲悄然一送，手持乌金破甲分水刺绕过石梁根部无声探出，三棱寒尖精准无比地挑破了延伸至此的百年黑卤毒囊薄皮！\n\n与此同时，三道肉眼难辨的暗金微影贴着漆黑水底闪电般掠出，顺着水鬼暗卫垂落的双腿爬上腰侧，六片锋利口器对着那只鼓胀的水獭闭气皮囊狠狠一剪！\n\n“噗——咕噜噜噜！！”\n\n积蓄百年的粘稠剧毒黑卤浆，如同压抑到极点的海底墨泉般迎面狂喷而出，瞬间将水鬼暗卫整颗脑袋连同腋下萤石彻底吞没！\n\n“唔？！”\n\n水鬼暗卫双目被高浓老卤毒液一糊，眼珠剧痛如烙铁烫穿！\n\n惊骇之下他本能地猛吸嘴角芦管想提气暴退，不料腰间闭气皮囊早已被三只二蜕煞甲虫咬开一道寸许大口子，吸进嗓子眼的哪是什么净气，分明是一大口辛辣腐臭到极点的百年黑卤毒水！\n\n“嗬……咳咳！！”\n\n哪怕是通窍九窍的强横体魄，喉管与肺叶骤然灌入百年浓缩卤毒，全身筋脉也在刹那间不受控制地剧烈痉挛抽搐起来！\n\n他死死摁住锁魂水雷弹簧片的右手五指猛地一僵、一滑！\n\n水雷脱手滑落的瞬间，三只煞甲虫早已在陈长庚神血母印急催下倒射撤回三丈之外！\n\n陈长庚更趁着水雷松手后三息引爆的空档蹬泥暴退三丈，缩进了一块千斤断崖巨石后方，双掌死死护住耳膜心脉！\n\n水鬼暗卫溃烂模糊的血眼只来得及看见胸前那团急速膨胀的刺目血光，无边的恐惧彻底淹没了最后一丝意识——\n\n“轰隆——！！！！”\n\n一声沉闷恐怖到极点的水底巨爆，在断崖深水底悍然炸开！\n\n狂暴无匹的锁魂雷火冲击波混着翻江倒海的黑臭毒泥冲天而起，水鬼暗卫整具九窍肉身贴着水雷正心，连半块完整骨头都没剩下，当场被撕成漫天血雾碎肉！\n\n厚实的天然折角石梁稳稳挡住横向水爆冲击波，将内侧暗沟薄如蛋壳的铁栅合页与岩缝油布包护得完好无损！\n\n“叮铃铃铃——哗啦！！”\n\n冲天黑水浊浪掀翻两丈高，崖顶横拉的三道困水铁索被炸断两根，几百只示警铜铃在暴雨夜空里疯了一样凄厉狂响！\n\n而借着这股遮天蔽日的浑水乱流掩护，陈长庚早已收回三只毫发无伤的煞甲虫，贴着西侧浅滩枯苇悄无声息滑上泥岸，绕回西南烂泥坳矮草棚，拭干水迹换上干爽旧麻袄躺回了草席！\n\n不过十息工夫，整座南岸军营彻底炸了锅！\n\n“敌袭！！西南断崖水下有水雷炸响！！”\n\n急促铜锣声穿透雨幕，内门庶务执事赵怀恩披甲提剑，率领上百名黑甲执法卫顶着瓢泼大雨直扑芦苇断崖，器堂霍千山、曹无极与梁世勋也各自带着护卫闻声赶到！\n\n几十支松脂大火把往崖下水潭一照，在场众人无不倒吸一口凉气。\n\n只见三丈下的水面正咕嘟咕嘟翻涌着一层墨汁般粘稠腥臭的漆黑毒泡，刺鼻腐酸气熏得崖顶前排兵卒涕泪横流、连连干呕！\n\n浑黑水花里，只漂上来几片炸得焦卷的熟铁雷壳，外加半只套着破碎黑水靠的烂肉断掌！\n\n曹无极捏着鼻子往后退了两步，皱眉冷哼：“好毒的陈年黑卤瘴！哪个不开眼的水鬼敢往这绝地钻？”\n\n一名懂水战的执法什长用长钩挑起一片碎雷壳验看，高声禀道：\n\n“启禀赵执事、霍师兄！这是拔了铜销贴身炸开的锁魂水雷！定是敌宗玄煞门的水鬼趁暴雨摸到崖底想埋雷炸营，不料水黑眼瞎，一头撞破了崖底沉积百年的天然黑卤毒囊，呛毒手滑把自己炸成了碎渣！”\n\n人群右侧，撑伞而立的梁世勋目光扫过那片熟铁雷壳边角一道极隐晦的菱形刻痕，再看到那半截眼熟的油浸黑水靠，握着伞柄的五指骤然攥得死紧，手背青筋一跳！\n\n什么玄煞门水鬼！那分明是他梁家花了百枚灵石养了五年、半个时辰前刚奉他密令下水埋雷阴苏清晏的九窍王牌水鬼！\n\n梁猛站在主子身后，脸皮白得像刷了一层死灰，嘴唇哆嗦着连大气都不敢喘。\n\n军前严禁同门私设杀器，这口折兵赔雷的血亏，梁家要是敢张嘴认下半个字，赵怀恩和霍千山当场就能拿军法剥了梁世勋的前锋统领皮！\n\n“咳……”梁世勋硬生生把涌到嗓子眼的腥甜咽回肚里，脸上挤出一丝阴沉冷笑，“玄煞门鼠辈果然无孔不入，幸亏这断崖水底有百年毒囊护佑大营。”\n\n霍千山扫了一眼连铁钩探下去都瞬间蚀出一层黑锈的毒水潭，冷淡开口：“既已炸穿百年毒囊，这片黑水三日内沾之即烂，玄煞门再蠢也不会从这儿登岸了。”\n\n“霍师兄所言极是！”\n\n赵怀恩当机立断，手中长剑重重一指崖岸，“传本执事军令！撤回崖边夜哨免得中毒折损，沿断崖三十丈外钉死双排生铁禁桩、挂满死令红牌——自即刻起，西南芦苇断崖划为绝命禁区，擅入十步者立斩不赦！”\n\n半里外的烂泥坳草棚边，被锣声“惊醒”出来张望的陈长庚拢着破袖咳嗽两声，听着风里传来的封禁军令，低垂的眼底掠过一丝微不可察的笑意。\n\n借梁家一颗水雷葬了九窍暗卫，还请动内门赵执事亲手打桩替他看死这条独门暗道，世上再没有比这更省心的买卖了。\n\n次日清晨雨歇，百根生铁禁桩刚刚把西南断崖彻底封死——\n\n“咔嚓——轰隆隆隆！！！”\n\n沉渊大泽百里湖心深处，毫无征兆地炸开一连串如同地龙翻身般的沉闷岩层撕裂巨响！\n\n原本平静幽黑的湖面骤然沸腾倒卷，一道道肉眼可见的灰白乱磁煞雾冲破水幕，如万马奔腾的海啸般朝着南岸浅滩疯狂漫卷而来！"}, {"n": 59, "title": "祭旗立威", "body": "灰白乱磁煞雾漫上南岸浅滩，连空气里都跳动着令人皮肤发麻的细碎蓝弧。\n\n转眼到了二月初三辰时，距离沉渊古盐墟十年地磁大退潮正式开启，只剩最后一日。\n\n沉渊大泽南岸外围干涸露底的黑盐滩上，已被地底扭曲磁力硬生生撕开了七八道丈许宽、深不见底的幽黑煞缝，缝隙里不断传出鬼哭狼嚎般的蚀骨阴风啸声。\n\n“咚！咚！咚——！！”\n\n三通震耳欲聋的聚将战鼓敲响，全营三百余名内门精锐、随行客卿与外门杂役，全数按序列肃立在黑盐滩高坡的点兵台下。\n\n高台正中，器堂大师兄霍千山身披暗赤锁子甲按剑居中，曹无极与梁世勋分立左右，三股通窍九窍强者的凌厉气势压得全场落针可闻。\n\n陈长庚背着那只装满旧铁勺的破竹篓，垂首缩肩站在寻脉馆队列末尾，距离苏清晏右后方恰好半步。\n\n霍千山冷电般的目光扫过台下众人，往前迈出半步，声若洪钟：\n\n“古盐墟明日破晓开墟！入墟之前，某家不管你们是世家子弟还是散修客卿，先把老祖宗传下的两条保命铁律睁大眼睛看清楚！”\n\n他右手一抬：“赵执事，带人上来试缝！”\n\n“遵令！押死囚上前——！！”\n\n内门庶务执事赵怀恩厉喝挥手。\n\n铁链哗啦乱响，二十名黑甲铁卫押着十名披枷带锁、面无人色的重犯推到第一道乱磁煞缝边缘！\n\n那十人里头，除了前几夜抓获的敌宗外围探子与犯了军规的亡命散修，排在第四个被两名皂役架着胳膊拖出来的，正是丹堂那辆双层铁囚车里关了几天的窦文焕！\n\n几日不见，窦文焕浑身恶臭如烂泥，铁卫刚一把扯掉塞在他嘴里的生铁堵嘴球，他便被刺骨煞风激得浑身一个哆嗦。\n\n茫然抬起血红浑浊的双眼往点兵台下队列一扫，窦文焕一眼便瞧见了站在苏清晏身后、衣衫干爽平静的陈长庚！\n\n“呃……陈长庚！！”\n\n无边的恐惧与悔恨瞬间冲垮了窦文焕最后一丝神智，他拼命挣扎着朝台下哭嚎尖叫，“是我瞎了狗眼惹你！陈爷救我！石师叔救命啊，我不想填风眼——”\n\n队列侧旁的丹堂副管事石百川眼皮猛跳，把头扭向一边屁都不敢放一个。\n\n“聒噪！推进去！”赵怀恩冷酷挥剑。\n\n两名黑甲铁卫抬起铁靴，一脚便将嘶嚎不止的窦文焕连同前头几名死囚踹进了灰白浓雾翻涌的煞缝之中！\n\n“啊——！！！”\n\n凄厉惨叫声仅仅响了半息便戛然而止！\n\n只听煞缝内传来一阵令人牙酸的“嗤嗤”刮骨密响，一股卷着灰白盐晶的蚀骨旋风从缝底倒冲上来，“啪嗒”一声将半具被刮尽血肉皮膜、连铁枷都蚀穿了洞的森白骸骨抛回滩涂泥地上！\n\n全场外门杂役吓得齐齐倒抽冷气，不少人双腿一软差点瘫跪在地。\n\n从黑石渡口一路算计针对陈长庚至今的窦文焕，连块全乎皮肉都没留下，彻底化作了大泽滩头一捧碎骨！\n\n就在这死寂惊悚的刹那，死囚队末尾一名手腕铁铐早已暗中磨断的通窍九窍独狼散修突然双目暴睁！\n\n“老子跟你们拼了！！”\n\n那九窍散修一声狂吼，震飞身旁押解皂役，咬破舌尖一口精血喷在袖中暗藏的一柄三尺青铜飞剑上，竟不顾一切催动全身九窍灵力踩上剑脊，化作一道青光拔地而起，直往大泽芦苇荡上空御剑逃窜！\n\n“蠢货，找死。”点兵台上的霍千山连剑柄都没摸一下，眼底只有一片看死人般的漠然。\n\n那名九窍散修的飞剑刚刚离地跃起半丈高！\n\n“嗡——噼里啪啦！！！”\n\n整片黑盐滩上空无形无质的乱磁力场仿佛瞬间被灵器火光彻底引爆，数十道水桶粗的惨白乱磁电弧凭空交织劈落！\n\n“不——呃啊！！”\n\n半空中的九窍散修连护体罡气都没来得及收拢，体内奔涌的真气与脚下飞剑同时失控逆冲，整个人在三百多双眼睛注视下如塞满火药的皮囊般轰然爆体！\n\n漫天血雨混着炸成铁渣的飞剑碎片哗啦砸落泥滩，尸骨无存！\n\n霍千山冷冷抬手指向那滩刺目血泥，声音如寒铁砸地：\n\n“都看清楚了！沉渊古盐墟地磁大乱，开脉境踏入一步即引气海自爆；便是通窍九窍巅峰，谁敢祭飞剑法器离地逾半丈，下场就跟这蠢贼一模一样！”\n\n“明日卯初裂口一开，三十六个时辰内必须原路退出，逾时不归者，永埋百丈海底！”\n\n血淋淋的禁空铁律钉在每个人眼前。\n\n台下静立的陈长庚垂着眼帘，心头却是一片雪亮。\n\n开脉老怪进不去，九窍天骄的御器飞剑全成了废铁，进了那座贴身肉搏的乱磁死笼，他这一身逼近三千斤的八窍圆满暗金横练、百炼乌金刺、过载火珠与三十六只噬铁凶虫，简直就是为古盐墟量身打磨的阎王帖！\n\n就在这时，高台左侧的曹无极忽然往前迈出一步，阴鸷目光如毒蛇般落在寻脉馆队列最前方的苏清晏身上，嘴角勾起一抹森然冷笑：\n\n“霍师兄既已立明军规，明日头阵开路的人选也该当众拍定了吧？”\n\n曹无极一指苏清晏与她身后的陈长庚，声音不大却传遍全场：\n\n“苏客卿拿着宗门重金聘礼专司勘脉破瘴，总不能躲在我三家子弟背后捡现成便宜！明日跨入主裂口，头一道蚀骨风障就由苏客卿主仆二人排在最前头替大军破路——梁兄、霍师兄以为如何？”\n\n右侧的梁世勋想到前夜平白折在断崖底的那名九窍水鬼，眼底怨毒更甚，摇着折扇淡漠附和：“理当如此。能者多劳，梁某没意见。”\n\n霍千山只关心内窟伴生煞莲，闻言微微颔首：“准了。寻脉馆明日走第一序列引路，敢退后半步者，军法从事！”\n\n三言两语，三大内门霸主联手将最凶险的开路鬼门关推到了寻脉馆鼻尖上！\n\n四周各房杂役投向陈长庚的目光瞬间充满了怜悯——一个挑炭箱的外门病鬼走第一序列，怕是连门槛都跨不过去就得步窦文焕的后尘。\n\n苏清晏立在寒风中，素白道袍猎猎微动，清冷面容不见丝毫退缩：“本座按聘书引路便是。只盼过了风障，诸位的腿跟得上我的阵旗。”\n\n说罢也不等曹无极变脸，径直转身率陈长庚走下高坡返回西南烂泥坳。\n\n一进烂泥坳营帐范围，陈长庚卸下背篓去紧试阵炭箱的麻绳，胸前高阶敛息玉符悄然微拨一丝缝隙。\n\n一股比前几日略显凝实、恰好刚跨过“通窍七窍初阶”门槛的气血波动，随着他搬动两百斤铁木箱的呼吸自然流露出一分。\n\n正在帐前清点十二面定磁阵旗的苏清晏指尖一顿，清冷眸光陡然扫向他手腕：\n\n“你破入七窍了？”\n\n陈长庚停下捆绳的手，拍了拍右肩前几日敷过药的地方，老老实实低头回道：\n\n“托客卿仙师那瓶伤药的福。前儿挨了霍大老爷一指头，小人原以为肩骨要废，没想到这泥坳底下地煞劲冲，误打误撞把淤在第七处气窍口的老铅毒冲开了一道缝，昨晚侥幸摸进了七窍门槛。”\n\n他抬眼看了一下两只沉重铁炭箱，语气诚恳：“好歹多了几百斤力气，明早挑着这两箱定磁炭跟仙师走头阵，总算不至于掉链子拖累仙师。”\n\n苏清晏盯着他看了两息。\n\n由六窍顶峰借九窍巅峰外劲余波与浓煞刺激破入七窍初阶，虽算走运，倒也在常理之中，且在外门依旧算不得显眼高手，却实打实能替她扛住入墟重担。\n\n“算你命硬。”苏清晏收回目光，将一面尺许长的乌铁副旗扔给他，“明日紧跟本座右后半步，踩错半寸风眼，七窍九窍皆是白骨。”\n\n“小人谨记仙师吩咐！”\n\n入夜亥时，距离正月三十那轮提纯再度满三十六个时辰。\n\n陈长庚缩在矮草棚内，将余下半块碎灵石残片嵌入青铜隔味阵盘撑起气幕，利用这几日从泥坳冻土层顺手刮攒的伴生黑煞盐壳，稳稳完成了入墟前最后一轮石臼转化！\n\n四钱新析出的无瑕道髓晶砂尽数封入锁灵寒玉匣，匣内极品与无瑕髓晶总数，稳稳攒满七十钱大关！\n\n陈长庚借着棚内昏暗微光，开始做最后一次战前锁甲。\n\n他先将半截蚀纹石臼与那尊嵌足晶砂的三百斤青铜机括盾偶一并裹满三层乌卤黑泥，重新严密压入两只试阵铁炭箱最底层，上头铺平定磁废炭封妥。\n\n随后，他把封存七十钱救命髓晶的锁灵寒玉匣、两只空寒玉小匣与五十枚完整下品灵石贴胸收进高阶敛息玉符遮护之内。\n\n除开断崖暗沟岩缝里预埋的两颗赤阳雷火弹，余下六枚塞足三倍赤磷硫精的过载烈阳火珠被他贴身扣进左肋快取暗囊；右袖滑槽扣稳九寸三分百炼乌金破甲分水刺，腰侧药瓮内三十六只二蜕嗜铁煞甲虫蓄势待发，外头再罩上那件洗得发白的外门灰麻旧袄。\n\n一切归位，分毫不漏。\n\n时间一息息滑向二月初三子时三更。\n\n突然——\n\n“嗡——啪！！”\n\n矗立在南岸大营正中央那根三丈粗的青铜镇磁巨柱，顶端燃烧了十几个昼夜的赤金阵纹灵光毫无征兆地剧烈一颤，旋即彻底熄灭！\n\n天地陷入一片伸手不见五指的死寂黑暗！\n\n紧接着，下一息——\n\n“轰隆隆隆隆——！！！！”\n\n沉渊大泽深处骤然传来十年一遇、仿佛整座大地脉搏彻底抽空的恐怖退潮轰鸣声！\n\n全营数百支火把哗啦齐亮，陈长庚挑起两只沉甸甸的试阵铁炭箱掀帘迈出草棚，与帐前执旗而立的苏清晏、高台披甲的三大统领一道，所有人的目光同时牢牢锁向了北方剧烈翻涌倒退的黑水湖心！"}, {"n": 60, "title": "裂渊踏煞", "body": "地底轰鸣声持续了足足两个多时辰。\n\n直到二月初四寅末卯初，天际刚裂开一线死鱼肚白，沉渊大泽北方湖心猛然炸起一道贯穿南北的千丈水墙！\n\n百丈幽黑湖水仿佛被一只无形巨手硬生生向两侧劈开倒卷，露出干涸乌黑、布满远古巨兽肋骨般惨白盐晶的海底深渊！\n\n深渊正中，一道高达十余丈、缠绕着密集蓝白乱磁电弧的狰狞地底主裂口赫然洞开。\n\n那便是十年地磁大退潮才现世三日的绝地——沉渊古盐墟！\n\n“铛——！！！”\n\n裂口外百丈高的镇界石崖上，那位须发皆白的内门开脉境督查长老凌空止步，一掌震响崖顶镇军铜钟，苍老声音滚过整片干涸泽底：\n\n“卯初已至，地磁退潮起算！”\n\n“老夫率战船镇守百丈禁磁线外！尔等入墟，唯有三十六个时辰——三日后卯初地脉合拢，逾时不归者，生死自负！”\n\n内门庶务执事赵怀恩横剑立于石阶起点，厉声暴喝：“按昨日序列，开拔入墟！”\n\n“轰！”\n\n三百余名披甲精锐、外聘客卿与挑筐苦力如同开闸洪流，顺着湿滑腥咸的海底古石阶蜂拥压下深渊！\n\n陈长庚一肩挑着两只沉甸甸的试阵铁木炭箱，背挂破竹篓，腰插乌铁副旗，不紧不慢缀在苏清晏右后方半步。\n\n下到石阶中段拐角时，前头十几名随船征调的老散修向导正挤在一起往靴底抹防磁黑卤油。\n\n“都麻利点！蹭什么蹭！”督队皂役挥鞭催骂。\n\n“官爷息怒，石阶滑得很，抹厚点防摔……”\n\n一名驼背散修点头哈腰赔着笑，借着蹲身系草鞋带的工夫，藏在指甲缝里的一撮惨白细粉悄无声息摁进了石阶背风凹槽！\n\n十步开外，挑着扁担路过的陈长庚鼻翼极轻地动了一下。\n\n腥咸海泥味里，混着一丝死人骨灰拌卤油的冷腥气。\n\n他眼皮都没抬一下，连脚步节奏都纹丝未乱，心里却已冷冷记下一笔：\n\n贺九斤没说假话，玄煞门和血河宗花百石买通的那两条内鬼尾巴，已经开始给后头摸进来的敌宗主力留路标了。\n\n眼下揭破？\n\n纯属替霍千山和曹无极白打工，留着这帮内鬼在里头搅浑水，他才好趁乱摸进底窟！\n\n不多时，大队人马已抵近古盐墟主裂口门户。\n\n一层厚达三尺、不断扭曲跳跃着灰白电弧的天然“乱磁光幕”横封住整座洞口，刺骨阴寒风啸从幕后阵阵倒灌而出！\n\n前排众人脚步齐齐一顿。\n\n曹无极按着刀柄越众而出，下巴往光幕上一扬，冲苏清晏皮笑肉不笑地开口：\n\n“苏客卿，到了地头了，昨日点兵台上立的军令，该不会忘了吧？”\n\n管事胡彪在旁阴阳怪气地帮腔：“拿着内门上等聘礼，赶紧带你的挑箱杂役进去蹚头阵！莫非天阵宗高徒连道门帘子都不敢掀？”\n\n周围几百双眼睛瞬间全盯在了寻脉馆主仆二人身上。\n\n谁都看得出来，光幕后头浓雾翻滚看不清深浅，第一个迈进去的人就是拿命试机关的活靶子！\n\n陈长庚缩着脖子喘粗气，双手紧紧攥着扁担绳，一副吓得脸色发白、全靠主家拿主意的窝囊样。\n\n苏清晏连眼角都没扫胡彪一下。\n\n她素手一翻，掌心主阵旗迎风一展，旗面古篆亮起一圈清泠白芒，抬手便是一枚八棱试脉铁钎射入光幕左侧石缝！\n\n“铮——嗡！”\n\n原本狂乱撕扯的灰白电弧受铁钎地磁牵引，硬生生向两侧分开一道四尺宽的平静缺口！\n\n缺口刚开，光幕后头一条遍布雪白钟乳盐柱的宽阔长廊隐约露出一角，几块裸露在近处岩壁上的千年伴生紫卤晶顿时折射出诱人灵光！\n\n“门户已定，乱磁暂息十息。”苏清晏持旗迈步，冷淡留下一句，“怕死的只管缩在后头。”\n\n“走！快跟上！”霍千山眼神一凝，率器堂精锐紧压而上。\n\n右侧梁家队列里，两名身高体壮的通窍八窍护卫一眼瞥见长廊入口岩壁上的紫卤晶，呼吸顿时粗重起来，转头看向自家公子：“少主，头道长廊有现成灵晶，不能叫曹家抢了先！”\n\n梁世勋折扇微点下巴，给随从梁猛递了个眼色。\n\n梁猛心领神会，按刀低喝：“门障已破，你们俩冲前头占住长廊有利地形，谁挡道就撞开谁！”\n\n“得令！”\n\n两名梁家八窍护卫狞笑一声，仗着身披百炼精铜甲、手提重盾，大步流星便往四尺宽的光幕缺口硬挤！\n\n此时苏清晏刚一脚跨过光幕，陈长庚挑着两百多斤的铁木炭箱紧随其后踏入缺口正中。\n\n耳听背后两股蛮横八窍劲风恶狠狠贴背抢来，陈长庚低垂的眼底闪过一丝幽冷讥诮。\n\n抢着去前头吃头汤？这可是你们自己往上凑的！\n\n就在左脚跨过乱磁光幕的电光石火间，陈长庚像是被残余乱磁电弧激得气血岔道，喉咙里“呃”地闷哼一声，膝盖猛然一软！\n\n挑在肩上的两只大铁木炭箱顺势往横里一歪，把四尺宽的通道口堵得严严实实！\n\n“哎哟！磁劲好沉，仙师慢点……”陈长庚踉跄扶墙，慌手慌脚去正扁担。\n\n“滚一边去！好狗不挡道！”\n\n冲在最前头的高个梁家八窍护卫正急着抢功，见一个外门七窍初阶的挑箱苦力挡住去路，哪里耐烦等他站稳，张口一声怒骂，抬起包铁战靴狠狠一脚踹在右侧铁木炭箱边沿上！\n\n“砰！”\n\n沉闷巨力撞来！\n\n陈长庚借着对方这一脚的凶猛冲劲，腰胯暗金柔劲悄然一卸，整个人顺势抱着扁担“蹬蹬蹬”狼狈撞向右侧石壁凹角，箱底三层乌卤黑泥包裹的蚀纹石臼与青铜盾偶纹丝未动，连一根封条都没震裂！\n\n走在前方三步外的苏清晏脚步微顿，清冷余光扫过陈长庚那双看似慌乱、实则把两百斤铁箱重心控得滴水不漏的草鞋，眸光微不可察地闪了一下。\n\n“就这点三脚猫力气也敢走头阵，滚后头吃灰去！”\n\n络腮胡梁家护卫唾了一口，与高个同伴并肩举起厚重精铜大盾，得意洋洋地越过苏清晏三丈远，如两头蛮牛般一头扎进了浓雾翻滚的盐晶长廊最前方！\n\n曹无极见梁家公然抢了头筹，脸色一沉喝道：“胡彪，带人跟紧，别叫姓梁的把外廊灵晶全刮干净了！”\n\n后头梁世勋摇着折扇慢步走过墙角，居高临下瞥了一眼正在揉肩膀赔笑的陈长庚，鼻孔里发出一声轻蔑冷哼。\n\n“对不住各位爷，小人脚滑，各位仙师请先走……”\n\n陈长庚点头哈腰地把头排风口让得干干净净，重新挑稳扁担，稳稳卡回苏清晏右后方半步的安全位上。\n\n一踏入盐晶长廊，四周光线骤暗，浓稠如牛乳的灰白乱磁煞雾瞬间将众人视野压到了五丈之内。\n\n旁人神识一离体便被乱磁搅得头昏脑胀，陈长庚却压根不外放分毫神识。\n\n他只微眯双眼，借着前方苏清晏手中定磁主阵旗洒下的一圈三尺清辉，用乌卤盐场练了三年的观雾眼力牢牢盯住两侧盐柱底部的白霜走向！\n\n左边三丈盐柱根部无霜反湿，是一处未发威的隐形风眼；\n\n右前方七丈岩壁凹陷三尺，恰是避开正面气流的天然藏身盲区！\n\n脑海中那幅背了上百遍的避风阵图，与眼前浓雾实景一寸寸严丝合缝地重叠合一，右袖滑槽里的百炼乌金刺已悄然滑至指尖半寸处。\n\n大队人马踩着碎盐渣往前急行，踏入盐晶长廊尚不足百丈——\n\n“呜——嗡嗡嗡！！！”\n\n身后主裂口高耸岩壁两侧，毫无征兆地刮起一阵令人牙酸耳鸣的诡异阴风！\n\n原本平缓流淌的牛乳浓雾骤然逆旋成漏斗，前方十丈浓雾深处，正举盾狂奔抢摘紫卤晶的那两名梁家八窍护卫身形猛地一僵！\n\n“什么鬼风？！我的盾——啊——！！！”\n\n两声凄厉绝望到极点、完全不似人声的惨嚎骤然撕裂浓雾！\n\n后方紧追的各家精锐骇然止步，借着火把微光往前一看，所有人头皮瞬间炸裂——\n\n只见那两名通窍八窍精锐手里足有半寸厚的百炼精铜护身重盾，在灰黑阴风拂过的刹那，竟像浇了滚油的蜡块般“嗤啦”化作两团滚烫腥臭的赤绿铁水，当头泼满了两人全身！"}, {"n": 61, "title": "风眼试雷", "body": "两团赤绿铁水当头浇下，浓雾里那两声惨嚎只挣扎了两息便彻底断绝。\n\n焦臭黑烟混着血沫扑面涌来。\n\n紧跟在后头的各房精锐齐刷刷刹住脚步，前排几名梁家护卫吓得脸色煞白，手里的刀盾撞得叮当乱响。\n\n五丈外碎盐地上，方才还耀武扬威抢头筹的两名梁家通窍八窍好手，已化作两滩粘连着暗绿铜渣的焦黑枯骨！\n\n连半块全乎皮肉都没剩。\n\n“混账东西！”\n\n梁世勋手中折扇“啪”地收拢，铁青着脸抢上两步，双目喷火直刺最前方的苏清晏，“苏客卿！你执主旗引路，明知前头藏着这等融金绝命风眼，为何不早出声示警？！”\n\n随从梁猛更是锵地拔刀出鞘半寸，厉声帮腔：“莫不是存心拿我梁家精锐填坑？！”\n\n前夜在断崖水底不明不白折了王牌水鬼，梁世勋憋了一肚子邪火没处撒，眼下刚进门又折了两名八窍护卫，心头都在滴血。\n\n左侧的曹无极抱臂冷笑，慢悠悠添了一把柴：“啧，百炼精铜重盾一息化水，梁师兄这头汤喝得可真够烫嘴的。”\n\n“姓曹的你少说风凉话！”梁世勋猛地扭头怒视。\n\n苏清晏立在三尺白芒阵旗之下，清泠目光扫过地上尚在冒绿泡的铜汁，语声平直如铁：\n\n“入光幕前本座便说过，紧跟阵旗三尺之内。是梁师兄纵容手下踹开旁人、越旗三丈抢摘紫卤晶，怨不得阵旗不护。”\n\n“你——！”梁世勋被噎得额角青筋暴跳。\n\n当着器堂大师兄霍千山的面，他不敢真对唯一能破中窟禁制的苏清晏动刀，阴鸷眼珠一转，折扇猛地指向苏清晏右后方半步的陈长庚！\n\n“好！就算他二人贪快越界！”\n\n梁世勋冷笑一声，抬手指着不远处一名护卫吓掉在地的备用熟铁圆盾，“风眼刚歇，未知前头宽窄。苏客卿金贵，那便叫你这挑箱子的七窍杂役捡起铁盾，先进前头风道替大军蹚十步看看深浅！”\n\n管事胡彪立刻在旁怪笑起哄：“梁师兄这主意公道！寻脉馆领着头阵军饷，总不能光摇旗子不迈腿吧？灰衣小子，还不快捡盾上去！”\n\n百十道冷漠、幸灾乐祸的目光瞬间聚在陈长庚背上。\n\n在贵人们眼里，死两个八窍护卫肉痛，死一个外门挑炭苦力，连粒尘土都算不上。\n\n苏清晏眉峰微蹙：“梁世勋，我的脚夫挑着破禁定磁炭，折了谁挑箱？”\n\n“箱子自有外门苦力接手！”梁世勋寸步不让，拿军令硬压，“抗令不前，莫非苏客卿想替个贱役担乱军之罪？”\n\n后方按剑而立的霍千山眉头紧锁，目光盯在前方翻涌的灰白浓雾上，沉声开口：“莫为小事耽搁时辰。叫那杂役举盾贴右壁试五步，摸清风口边界即退。”\n\n霍千山一锤定音，生路顿时堵死。\n\n陈长庚缩着肩膀站在原地，粗糙手掌紧攥着扁担麻绳，脸上全是底层杂役被点名送死的惶恐惨白。\n\n可在他低垂的眼帘底下，眼神却冷得没有一丝波澜。\n\n方才那股灰黑阴风倒卷回三丈外时，他压根没用神识，单凭在乌卤盐场熏了三年的鼻子轻轻一嗅，便从融化的铜汁酸雾里闻出了一缕极淡的腐甜腥气！\n\n寻常古盐墟蚀骨风，刮人如钝刀削肉，点兵台上窦文焕化骨便是明证，绝不可能一息把半寸厚的百炼精铜盾烧成绿水！\n\n那是血河宗独门阴损毒物——腐髓砂！\n\n有人早在他们入墟之前，往这道迎门风眼里暗撒了大把腐髓砂！\n\n这会儿谁真傻乎乎顶着铁盾往正前头钻，毒砂混着阴风兜头一裹，不把八窍圆满的暗金筋骨亮出来必死无疑，一旦亮了底牌，身后这三位九窍恶霸头一个就要拿他搜魂！\n\n“怎么，聋了不成？！”梁猛上前一步，刀鞘恶狠狠捅向陈长庚后腰，“叫你捡盾蹚路，磨蹭什么！”\n\n“大爷饶命！小人不敢抗命，小人这就去、这就去！”\n\n陈长庚吓得浑身一哆嗦，连声告饶，左手慌忙弯腰抓起地上那面熟铁圆盾，右肩却还挑着那副两百多斤的试阵铁木炭箱，同手同脚地往风口边缘挪了半步。\n\n借着苏清晏主阵旗散出的三尺微光，他眼角余光早已将头顶丈二高处一根布满裂纹、正挂在侧逆气旋节点上的粗大卤晶钟乳锁得清清楚楚！\n\n“箱子不卸，挑着去投胎啊？蠢材！”\n\n站在梁世勋左前侧的梁家账房管事钱老头捻着山羊胡，不耐烦地往前迈出半步，伸手就要去扯陈长庚的扁担绳。\n\n就是现在！\n\n陈长庚草鞋踩在结霜的滑腻盐壳上，脚腕极其自然地往外一崴！\n\n“哎哟——滑！”\n\n他喉咙里发出一声变调惊呼，整个人顺着崴脚的冲势猛往右侧一栽，肩头受力的老桑木扁担骤然向上高高翘起！\n\n扁担梢头那枚用来挂筐的生铁弯钩，不偏不倚，正好狠狠挂进头顶那根松动卤晶钟乳的根部石缝，顺着两百斤坠力猛往下一扽！\n\n“咔嚓——！！”\n\n一声脆响在死寂的盐晶长廊里炸开！\n\n那根足有大腿粗、三尺多长的惨白卤晶钟乳应声齐根崩断，贴着陈长庚后背轰然砸进右前方三尺处的隐形气旋风口！\n\n“轰——嗤啦！！！”\n\n原本潜伏在岩壁裂缝里的侧逆阴风被巨石硬生生堵死半边，狂暴气流混着残余的零星腐髓绿砂骤然折射偏转，化作一道尺许宽的灰绿风刃，擦着摔倒在地的陈长庚头顶尺许掠过，笔直削向正伸手骂人的钱老头面门！\n\n“啊？！”\n\n通窍六窍的钱老头魂飞魄散，拼命往后仰脖子！\n\n“嘶啦——！”\n\n灰绿阴风贴着他额角头皮一掠而过，束发的青铜簪子瞬间融成几滴滚烫绿汁，半截花白发髻连着铜钱大一块头皮当场被削飞出去！\n\n“我的头！我的头化了——！！”\n\n钱老头捂着鲜血淋漓的秃顶惨叫跌滚，一头撞翻身后两名梁家护卫，烫手绿汁溅在石地上嗤嗤冒烟！\n\n梁世勋骇得猛退两步，折扇横挡胸前，脸色白得像纸。\n\n“都别乱动！！”\n\n一声清叱如冰泉击石，瞬间压住混乱！\n\n苏清晏左手飞快扣住三枚试脉铁钎连环钉入右侧墙根锁住余风，右手高举主阵旗，转头冷冷直视霍千山：\n\n“霍师兄亲眼看见了！这外廊钟乳盐柱连着整座穹顶磁脉，牵一柱便引侧风倒灌！再逼不懂阵脉的苦力瞎撞，一旦震塌头顶万斤盐梁，谁也别想进中窟见那株伴生莲！”\n\n一句话，精准无比地戳中了霍千山最在乎的痛处！\n\n梁世勋又惊又怒，指着趴在碎盐渣里瑟瑟发抖的陈长庚喝道：“分明是这贱役毛手毛脚钩断了盐柱——”\n\n“够了！”\n\n霍千山厉声打断梁世勋，虎目扫过钱老头焦黑冒烟的半边秃瓢，脸色阴沉得吓人，“一个挑炭苦力懂什么引风？要不是他脚滑摔低了半尺，此刻已是第三具白骨！”\n\n他哪里瞧得出陈长庚那一挂一摔里藏着的三年观雾绝活，只当是蠢笨杂役瞎猫碰上死耗子撞出了盐廊隐患。\n\n霍千山大手一挥，直接改了军令：\n\n“铁炭箱关乎中窟破阵，绝不容有失！让你这杂役退回苏客卿身后挑稳箱子！”\n\n“曹师弟、梁师弟，加上我器堂，三家各抽两名重金募来的外围散修向导，按苏客卿铁钎指的步点轮流往前探！谁敢再拿主阵炭箱赌气，某家先劈了他！”\n\n梁世勋胸口剧烈起伏，看着凄惨哀嚎的钱老头，却不敢顶撞手握掌门手令的霍千山，只能从牙缝里挤出一句：“……依霍师兄之言！”\n\n曹无极眼皮微垂，冷哼一声挥手叫胡彪揪出两名散修。\n\n“多谢大老爷饶命……小人该死，小人一定挑稳箱子……”\n\n陈长庚灰头土脸地从碎盐地上爬起来，点头哈腰地退回苏清晏右后半步，拍打膝盖灰尘的指尖不着痕迹地捻过地面一粒冷却的暗绿铜渣。\n\n指腹微不可察地一搓，心头明镜也似。\n\n血河宗腐髓砂假不了。\n\n外头内门长老守着百丈禁磁线，血河宗的人是怎么赶在他们前头往迎门风眼里撒砂子的？\n\n他抬眼看向被胡彪和梁猛拿刀逼着推上前排的六名散修向导，目光在队伍中间那个缩着驼背、正频频拿袖口擦汗的干瘦老散修背影上轻轻一掠，嘴角深处浮起一丝冷意。\n\n有意思，前头的戏怕是比风眼还热闹。\n\n有了苏清晏沿途弹射铁钎定住磁极，再由六名亡命散修战战兢兢踩点蹚雷，大队人马虽折了一名踩偏半寸被削断脚掌的倒霉散修，终究在两刻钟内有惊无险地穿过了百丈盐晶长廊。\n\n前方浓雾豁然一散。\n\n一座占地数十丈、穹顶高悬残破铁链的圆形石厅出现在众人眼前，四面石壁如同蜂巢般裂开东、南、西、北四条幽深岔道——正是外围枢纽“分卤岔殿”！\n\n“总算过了鬼风廊了！”前排探路的散修刚松一口大气，高举火把踏入石殿门槛。\n\n下一瞬，最前头那支松油火把猛地僵在半空！\n\n“血……死人！是我们云泽宗的前哨！！”\n\n惊恐变调的嘶喊声骤然回荡在空旷石殿内！\n\n霍千山、苏清晏与后方众人疾步抢入殿门，火光映亮殿心那根布满铜绿的镇磁石柱，所有人瞳孔同时一缩——\n\n只见石柱根下横七竖八躺着三具身穿云泽宗外门服饰的精悍探子尸首，咽喉处皆是一刀封喉的齐整利刃切口，涌出的鲜血甚至还未彻底凝冻！\n\n而在东、南、西、北四座黑黝黝的岔洞门槛石缝间，全都整整齐齐撒着一圈刺目诡异的惨白死人骨粉！"}, {"n": 62, "title": "岔殿揪鬼", "body": "“封死后门！所有人原地止步，谁敢乱动半步立斩！”\n\n霍千山一声暴喝如闷雷炸响，背后无锋玄铁重剑虽未出鞘，通窍九窍巅峰的狂暴赤炎气机已轰然锁死整座分卤岔殿！\n\n二十余名器堂披甲精锐哗啦散开，长戟森然堵住来路石门。\n\n时值辰时初刻，岔殿内阴风阵阵，火把跳跃的红光映在三具割喉尸首圆睁的死鱼眼上，寒意直往人骨头缝里钻。\n\n曹无极蹲下身，隔着皮手套捻了一撮洞口门槛上的惨白细粉凑近鼻端，脸色瞬间阴沉如水：\n\n“是拿死人指骨混阴磷磨出来的引路骨粉！这三名头拨进来探风的外门好手不是死于风眼，是被人从背后捂嘴一刀割断了喉管！”\n\n梁世勋折扇紧握，眼神阴鸷地扫过殿内众人：“这三名探子比咱们早进门不过百息工夫！血还没凉透，说明撒骨粉给玄煞门、血河宗引路的内鬼，此刻就在咱们这支队伍里！”\n\n一言既出，殿内三百余人轰然骚动，人人自危地盯着身旁同伴，兵器出鞘声此起彼伏！\n\n尤其是站在前排的那十几名外募散修向导，个个面无人色。\n\n霍千山虎目如电，一步步逼向散修向导队列，沉声喝道：“赵执事在岸上把外门杂役筛了三遍，唯独你们这帮临时征调的带路散修夹带最多！给某家挨个搜身验袋！”\n\n两名如狼似虎的器堂执戟铁卫当即大步上前！\n\n散修堆里，那个在入墟石阶上蹲身系过草鞋带的驼背干瘦老者——外号“钻山鼠”的邓老七，藏在破皮袄袖筒里的枯瘦五指猛地一颤！\n\n他左靴夹层里还剩小半包没撒完的阴磷骨粉，一旦铁卫上手扒靴，十息之内他就得被霍千山活活捏碎全身骨头！\n\n左右是死，不如把水搅浑拉个替死鬼挡刀！\n\n眼看器堂铁卫的大手就要抓上旁边一名同伴的衣领，邓老七猛地双膝一软扑通跪倒，扯着破锣嗓子凄厉哭喊起来：\n\n“霍大老爷明鉴！小的邓老七在黑石滩跑了二十年腿，最是本分不过啊！方才在长廊浓雾里，小的亲眼瞧见是谁在偷撒白粉！”\n\n“什么？！”霍千山脚步陡顿，厉声喝问，“是谁？！”\n\n全场几百道目光唰地聚拢！\n\n只见邓老七抬起枯瘦如鸡爪的右手，越过前排人群，恶狠狠直指缩在寻脉馆队尾、正挑着两只黑泥铁木炭箱的陈长庚！\n\n“就是他！苏客卿身后那个挑炭箱的灰衣小子！”\n\n邓老七唾沫星子横飞，把恶人先告状演得活灵活现，“方才在盐晶长廊他故意摔倒钩断盐柱搅乱阵型，小的走在前面回头瞧得真真的——他趁大伙儿躲阴风的空档，伸手从那只糊满黑泥的烂木箱缝里掏出一把白粉撒在墙根！他箱子里准藏着通敌毒物！”\n\n轰！\n\n满殿目光瞬间调转，像无数柄淬毒钢刀扎向陈长庚！\n\n陈长庚挑着扁担站在殿角，心头连半丝意外都没有，反倒暗暗冷笑了一声。\n\n这老耗子倒是会挑软柿子捏，见他是个外门七窍杂役，前脚刚摔了一跤惹恼梁家，便想借曹、梁两家的刀劈开他的炭箱脱身！\n\n果不其然，不等霍千山开口，一旁的曹无极眼底骤然爆出一团精光！\n\n他正愁抓不到苏清晏的把柄，这简直是瞌睡递来了枕头！\n\n“好哇！我说进门时怎么偏偏摔得那么巧！”\n\n曹无极狞笑一声，一挥手喝道，“胡彪！过去把那两只黑泥炭箱给本公子当众劈开，看看里头到底装的是定磁炭，还是玄煞门的买命赃货！”\n\n“得令！”\n\n管事胡彪满脸横肉一抖，抽出鬼头厚背大刀，带着四名曹家恶奴恶狠狠便往殿角扑来！\n\n千钧一发！\n\n那两只试阵铁木炭箱最底层的三层乌卤黑泥里，一左一右正密不透风裹着半截蚀纹石臼与那尊带天阵宗外围残徽的三百斤青铜机括盾偶！\n\n这一刀若真劈下去，黑泥崩裂露了石臼与残徽，莫说曹无极和霍千山，就连身前这位天阵宗孤女苏清晏都得当场翻脸，整个分卤岔殿顷刻便是十死无生的绝局！\n\n“站住！”\n\n一道素白身影横跨半步挡在炭箱之前。\n\n苏清晏指尖夹住两枚试脉铁钎，面罩寒霜：“试阵炭箱贴着内门庶务院封条，装的是破中窟禁制的孤品定磁炭，见风受潮即废！曹无极，你想毁炭误了掌门大事不成？！”\n\n“少拿掌门手令吓唬人！”梁世勋在旁阴阳怪气地帮腔，“真金不怕火炼，若没鬼，劈开验一眼又有何妨？总不能让寻脉馆包庇内鬼吧！”\n\n苏清晏气结，刚要催动气机逼退胡彪，左腕经脉旧伤受殿内乱磁阴煞一冲，呼吸在第三息微不可察地滞了半瞬。\n\n胡彪瞧准便宜，举刀狂笑：“滚开！老子今日劈定了——”\n\n“霍大老爷！劈箱子查不出真内鬼，反而放跑了真细作啊！”\n\n就在胡彪刀锋离炭箱不足三尺的刹那，一直没吭声的陈长庚非但没有去护那两只命根子炭箱，反而主动把扁担往地上一放，越过胡彪，朝着主位方向的霍千山扑通跪下，嗓音急促却字字清晰地穿透全殿！\n\n胡彪刀势一滞，狞骂道：“死到临头还敢耍花招！”\n\n霍千山眼神微凝，抬手止住胡彪：“给你三息，讲不出实据，连人带箱一块剁！”\n\n“小人不敢胡说！小人原本在乌卤盐场熬了三年黑卤，天天跟卤油骨灰打交道！”\n\n陈长庚连看都没看面目扭曲的邓老七一眼，抬手直指四面岔洞门槛上的白粉，语速极快，“大老爷请看！这外廊阴风刮得连石头都起毛，干骨粉撒在地上，一阵风就吹得干干净净，怎会牢牢粘在湿石缝里？”\n\n曹无极眉头一皱：“你想说什么？”\n\n“细作想让骨粉顶住蚀骨风不散，必得提前拿咱们入墟防滑的‘防磁黑卤油’拌匀了，借着走路拿靴后跟往石缝里踩实！”\n\n陈长庚猛地抬头，目光如钉子般扎向面色骤变的邓老七，“盐场三岁学徒都知道一桩铁律——死人阴磷骨粉一旦沾了防磁黑卤油，肉眼瞧着乌黑不显，可只要拿苏客卿手里的寻脉定磁针隔空一激，三息之内必冒幽绿尸烟！”\n\n“小人这双破草鞋就在脚上，根本不用费劲劈箱毁炭！只求霍大老爷命苏客卿弹针先验小人的鞋底，再把殿里这十几名向导的靴跟挨个照一遍，谁脚底下冒绿烟，谁就是杀探子的内鬼！”\n\n满殿瞬间鸦雀无声！\n\n不用劈箱子坏了破阵大事，只需三息弹针验靴，当场便见真章！\n\n梁世勋与曹无极对视一眼，心头暗骂这灰衣小子滑泥鳅一般刁钻，偏偏这法子堂堂正正，谁拦谁心里有鬼！\n\n苏清晏清冷眸光微亮，瞬间听懂了陈长庚递过来的梯子：“此法甚简，三息可辨。”\n\n霍千山虎目精光暴射，转头死死盯住额头冷汗涔涔往下淌的邓老七：“好！胡彪退下！苏客卿，当众弹针验靴！”\n\n陈长庚二话不说，坦荡荡抬起自己沾满灰白盐泥的右脚草鞋亮在众人眼前。\n\n邓老七脸色惨白如鬼，脚尖悄然往后缩了半寸，干笑着强辩：“大、大老爷别听这小杂役胡诌，卤油哪会冒什么绿烟……”\n\n“嗤！嗤！”\n\n苏清晏半句废话不讲，素手一扬，两枚缠绕着微弱定磁白芒的八棱铁针贴着青石地面电射而出！\n\n第一枚铁针擦过陈长庚的草鞋底，只激起几点干碎白盐渣，连半缕杂色烟气都无！\n\n第二枚铁针紧贴地面一折，闪电般钉入邓老七左脚牛皮靴后跟半寸外的石砖缝！\n\n“嗡——噗嗤！！！”\n\n铁针上定磁微光刚一触及邓老七靴跟边缘的黑油泥，就像滚油泼进了火星子！\n\n一股足有尺许高、刺目森然的幽绿磷烟“腾”地从邓老七左靴底板窜起，浓烈刺鼻的死人腐骨腥臭瞬间弥漫半座石殿！\n\n“哗——！！”\n\n站在邓老七身旁的几名散修向导吓得魂飞魄散，连滚带爬往两侧跳开：“绿烟！他靴底真藏着引路骨粉！！”\n\n铁证如山，连狡辩半个字的余地都没留下！\n\n“狗杂种，敢诓某家？拿下他，留活口撬嘴！”霍千山勃然大怒，踏步便抓！\n\n“小杂役坏老子好事！！”\n\n败露的邓老七双目赤红如疯狗，深知落入器堂手里生不如死，非但没有束手就擒，枯瘦左手猛地在怀里一掏，狠狠捏碎了一颗核桃大小、布满扭曲磁纹的灰黑圆珠！\n\n“砰——嗡嗡嗡！！！”\n\n正是玄煞门专门用来在古墟搅乱气机的“乱磁烟珠”！\n\n一团浓黑如墨、夹杂着噼啪乱磁电弧的刺鼻怪烟轰然炸开五丈方圆，瞬间将前排火光与众人五感视线彻底吞没！\n\n借着浓烟遮护，通窍八窍修为的邓老七脚底抹油，化作一道黑影亡命扑入东侧黑黝黝的分卤岔道，扯裂嗓子发出凄厉狂吼：\n\n“褚长老救命！！云泽宗大队进岔殿了，快收网啊——！！”\n\n“休走！器堂随某追进洞口堵截！”\n\n霍千山怒喝挥剑，劈开面前一团磁烟便往东侧洞口猛追，胡彪与大批内门精锐也被浓烟晃花了眼，乱哄哄拔刀冲向东廊！\n\n陈长庚早在烟珠捏碎的前半息便一把抓起地上扁担，脚跟悄然后撤半步贴紧殿角石柱，右手拇指已无声顶开了袖底暗槽。\n\n果然！\n\n就在全场注意力全被东逃嘶喊的邓老七吸走的电光石火间！\n\n三步之外，浓黑翻滚的乱磁烟雾深处，一名从进门起便一直低头缩在梁世勋随从队列里、背着药囊毫不起眼的蜡黄脸汉子，非但没有跟着大流冲向东侧岔洞，低垂的眼白里反而骤然爆出通窍九窍死士的滔天凶戾！\n\n没有半点风声预兆！\n\n那汉子足尖猛蹬石砖，整个人如一头贴地扑食的毒蟒横掠两丈，袖中翻出一柄幽绿淬毒短匕，趁着苏清晏刚弹针定磁、左脉旧伤换气微滞的致命空档，一匕直刺她护在胸前的阵图皮囊！"}, {"n": 63, "title": "毒匕留痕", "body": "两丈距离，在乱磁浓烟遮掩下不过眨眼即至！\n\n那蜡黄脸刺客显然把苏清晏的底细摸得透熟！\n\n他早算准苏清晏方才连弹两枚定磁铁针验靴，左腕经脉旧伤受殿内强磁反冲，第三息必有一瞬真气换气的凝滞死角！\n\n幽绿短匕带着刺鼻腐心腥气，不取咽喉，专挑皮囊带扣连同心口要害一并捅穿——既要夺走寻脉主图，更要当场废掉云泽宗唯一的破阵眼睛！\n\n“找死！”\n\n浓烟中，苏清晏清冷瞳孔猛缩如针！\n\n换作寻常阵师遇上通窍九窍死士这记贴脸绝杀，十有八九已被捅穿心窝。\n\n可苏清晏骨子里傲烈到了极点，哪怕左腕经脉如针扎般剧痛微滞，她竟半步不退，硬生生咬破舌尖提振一口清气，腰身如风中寒鹤骤然旋折半尺！\n\n“铮！铮！”\n\n藏在右手宽袖里的两枚八棱破禁铁钎几乎贴着毒匕脊背交叉电射而出！\n\n噗嗤两声闷响，血花在黑烟里骤然炸开！\n\n那九窍刺客志在必得的胸前一刀被苏清晏旋身险之又险地让开半寸，只划破了外层素白道袍，他自己左右两侧琵琶骨却被两枚铁钎结结实实钉穿，狂暴反震力震得他半边膀子鲜血狂飙！\n\n“呃——好毒的娘们！”\n\n刺客痛哼一声，眼见东洞口霍千山听见异响已震怒回头，三息之内必被合围剁成肉酱！\n\n亡命之徒的凶悍在这一刻展露无遗！\n\n他竟借着琵琶骨中钎的后坐冲势，腰腹在半空猛一拧折，不退反进斜掠三尺，右手那柄淬满剧毒的幽绿短匕顺势一翻，毒蛇吐信般抓向苏清晏右后方半步那个“最弱的七窍挑箱杂役”——陈长庚的咽喉！\n\n“给老子过来垫背！！”\n\n刺客算盘打得精绝：抓活这外门苦力挡在胸前做肉盾，苏清晏投鼠忌器不敢发钎，他正好挟人退进南侧暗洞脱身！\n\n苏清晏刚抽回第三枚铁钎，左脉旧伤一麻，眼看毒匕锋芒已逼近陈长庚脖颈三寸，素白指尖不由猛地一紧：“低头！”\n\n根本不用她喊！\n\n在刺客拧腰变招的前一瞬，陈长庚低垂的眼底早已把生死账算得清清楚楚！\n\n苏清晏是他眼下混进内窟最好用的护身虎皮，绝不能让她折在这儿；刺客怀里说不定还揣着敌宗串联的铁证，更不能叫这厮逃进暗洞！\n\n可五步外梁世勋与曹无极都在瞪眼看着，他一身逼近三千斤的八窍圆满暗金横练绝不能露半分马脚！\n\n电光石火间，陈长庚脸上血色尽褪，喉咙里发出一声吓破胆般的嘶哑惊叫：“啊——仙师救命！！”\n\n他双腿像是软成了面条，整个人无比狼狈地往后一屁股跌坐在地，双臂却拼命向上一举，抄起横在身前那只两百斤试阵铁木炭箱的包铁硬木箱沿，歪歪扭扭横挡在自己咽喉前头！\n\n“咔嚓——轰！！”\n\n九窍刺客含恨抓来的淬毒短匕狠狠劈进铁木箱沿半寸深，沉重炭箱受巨力一撞，底座重重砸在青石地面上，震起一蓬遮眼的黑炭碎屑！\n\n就是这箱底砸地巨响与黑灰腾起的半息盲区！\n\n跌坐在箱后的陈长庚眼神冷如万年寒冰，藏在铁木箱阴影下的左手食指，贴着破麻袖口内侧机括轻轻一扣！\n\n“噗。”\n\n细不可闻的一声微响，彻底淹没在箱底撞石的闷雷声里！\n\n一根细若牛毛、提前蘸满了断崖百年黑卤麻毒的“母蜈破甲毒针”，顺着箱角一寸宽的死角黑影电射而出，精准无比地扎进刺客紧握匕首的右手腕脉神门穴！\n\n“嘶——？！”\n\n九窍刺客正要发力拔出匕首拽过陈长庚脖领，右腕大筋却像突然被塞进了万年冰窟，一股阴毒霸道的麻痹酸劲瞬间顺腕脉炸开，五指竟不受控制地僵直了整整半息！\n\n高手生死相搏，半息僵滞便是鬼门关！\n\n原本因左脉微滞慢了半拍的苏清晏眸中寒芒暴涨，哪里会放过这送上门的破绽！\n\n她左手并指一点，袖底第三枚本命试脉主钎化作一道白虹，穿过尚未散尽的灰烟，自刺客张大的嘴巴正中一穿而入、后颈透出！\n\n“噗嗤——！！”\n\n滚烫鲜血混着碎牙喷出三尺远！\n\n通窍九窍的敌宗死士刺客双目凸出，喉咙里咯咯两声，带着满眼难以置信的惊骇，高大身躯轰然仰面栽倒在铁炭箱前，双腿抽搐两下便气绝身亡！\n\n左袖机括内，四根母蜈破甲毒针耗去一根，尚余三根静静蛰伏；而扎入刺客腕脉的那根黑针，早趁着尸身倒地溅血的工夫，被陈长庚借扶箱爬起的衣袖不着痕迹地拂落石缝踩成铁粉。\n\n“咳、咳咳……吓死小人了……”\n\n陈长庚捂着胸口大口喘着粗气，脸色发白地去扶歪斜的铁木炭箱，活脱脱一个刚从阎王爷裤裆底下捡回条烂命的七窍杂役。\n\n此时乱磁烟雾渐散。\n\n冲进东侧岔道的器堂护卫骂骂咧咧退回殿口禀报：“启禀霍师兄！那邓老七狡猾得很，钻进东洞三十步便劈断了预埋的乱磁石闸封死去路，一时半刻挖不开！”\n\n霍千山脸色铁青地大步折返，一眼便瞧见倒在寻脉馆炭箱前、身穿梁家随从皂衣的那具九窍刺客尸首！\n\n五步之外，梁世勋瞳孔骤然缩成针尖，后背瞬间惊出一层白毛冷汗！\n\n邓老七是外募散修也就罢了，地上这死人穿的可是他梁家本房随从的号衣！\n\n一旦从这九窍刺客怀里搜出通敌铁证，坐实他梁世勋驭下失察、把敌宗死士带进核心军阵，莫说争中窟伴生莲的头功，回了宗门刑堂长老都得扒他一层皮！\n\n绝不能让霍千山搜尸！\n\n“混账细作，竟敢混入本公子麾下冒充随从！死不足惜，看刀！！”\n\n梁世勋眼底杀机暴闪，嘴上喊着大义凛然的场面话，右手猛地拔出腰间百炼寒铁佩刀，抢在霍千山走近之前纵身扑上，九窍刀罡直劈刺客头颅与前胸衣襟——分明是要一刀将尸首连同怀中信物剁成碎肉毁迹！\n\n“梁世勋，留尸待验！”曹无极一眼看穿他的鬼胎，急声厉喝，却隔着两丈来不及阻拦。\n\n眼看森寒刀光离尸首胸口仅剩三尺！\n\n“哎哟——梁大老爷留神脚下！箱子滑了！”\n\n正蹲在尸首侧旁吃力扳正扁担的陈长庚，像是被梁世勋扑来的凌厉刀风吓得手脚发软，肩膀猛地一歪！\n\n那只重达两百斤、贴着内门封条的包铁炭箱“哐当”一声横滑出半尺，棱角分明的厚重铁包角不偏不倚，正好斜卡在梁世勋靴尖与刺客上半身之间那道必经刀路上！\n\n梁世勋前冲之势正猛，眼睁睁看着内门封条炭箱横进刀底！\n\n方才霍千山才放过狠话“谁敢毁主阵炭箱先劈了谁”，他这一刀若劈实了，把定磁炭箱砍成两半，霍千山当场就能拿掌门手令废了他！\n\n“滚开！！”\n\n梁世勋气得肝胆欲裂，硬生生拧腕收住七成刀劲！\n\n“铛！”\n\n佩刀擦着铁箱边缘劈在空处青石砖上，火星四溅，连刺客半片衣角都没沾着！\n\n“小人该死、小人手滑……”陈长庚慌忙拖着箱子往后缩，把尸首胸膛彻彻底底亮在了大步赶到的霍千山脚下。\n\n三步外，正在用素帕拭去指尖血迹的苏清晏动作微微一顿。\n\n她清泠幽深的双眸垂落下来，深深看了一眼陈长庚脚边那只铁木炭箱的倾斜角度——\n\n前一刻跌坐举箱，恰恰替自己挡住毒匕变招、还逼得九窍刺客莫名僵了半息；这一刻慌乱扶箱，又分毫不差卡死了梁世勋毁尸灭迹的必经刀路，连箱顶那张薄薄的纸封条都没蹭破一个角！\n\n一次是走运，两次、三次，世上哪有这么寸的“手滑”？\n\n迎着苏清晏探询扫来的冷冽视线，陈长庚只低着头揉着撞青的手肘，满脸憨厚后怕的苦笑，半点锋芒不露。\n\n苏清晏盯着他看了两息，终究没有点破，只冷淡吐出四个字：“收拾扁担。”\n\n“是，仙师。”\n\n就在这时，大步跨到尸首前的霍千山一把推开脸色煞白的梁世勋，弯腰如鹰爪般探入刺客染血的前襟，劈手夺出一块巴掌大小、正散发着温热血腥气的暗红兽骨牌！\n\n“梁师弟好大的威风，随从里藏着通窍九窍的死士，倒急着替人碎尸？”曹无极凑上前阴阳怪气地刺了一句。\n\n梁世勋咬牙强辩：“定是入墟渡船时被人暗中掉包，梁某也是受蒙蔽……”\n\n“都给某家闭嘴！！”\n\n低头扫视骨牌背面刻痕的霍千山，五指猛然捏得骨节咔咔作响，一张国字脸在火光下骤然变得铁青骇人！\n\n曹无极心头一跳，急忙探头看去：“霍师兄，牌上写的什么？！”\n\n“昨日半夜北麓高滩细缝提前松动，玄煞门褚横山与血河宗樊九皋折了四名死士硬挤进墟，根本没走南门，已提前咱们足足半日进来了！”\n\n霍千山一字一顿，声音里透着一股火烧眉毛的凛冽杀意，“这帮杂碎留两名内鬼在岔殿拖住咱们，褚横山和樊九皋主力此刻早已合兵一处，正抄近道直扑中窟那株赤煞伴生莲！！”"}, {"n": 64, "title": "分道弃卒", "body": "“褚横山和樊九皋提前半日进了中窟？！”\n\n曹无极脸色骤变，一步抢到霍千山身侧盯着那块染血兽骨牌，“北麓暗缝满是乱磁绞风，他们疯了不成？！”\n\n“折了四个通窍八窍死士硬垫出来的血路，你说疯不疯！”\n\n霍千山一把将兽骨牌攥出裂纹，虎目赤红扫向南面幽深通道，“中窟那株赤煞伴生莲统共只有七颗赤髓子！再按原定路线绕外围盘山道，等咱们磨蹭过去，连根烂莲梗都剩不下！”\n\n梁世勋刚丢了驭下失察的大脸，急于将功补过，折扇往西侧第三座岔洞一指：“绕盘山道要一个半时辰，走西面‘磁雷盐桥’横跨断渊，两刻钟就能直插中窟外崖！”\n\n“磁雷盐桥？”苏清晏清冷眉峰微蹙，“那座孤桥悬空百丈，两侧全是游离雷弧，连护栏都风化光了，大队人马挤上去便是活靶子。”\n\n就在这时，岔殿来路石门外传来一阵杂乱急促的脚步声。\n\n“霍师兄！曹师兄！属下率后梯队采药杂役赶到汇合了！”\n\n丹堂副管事石百川擦着满头虚汗跑进殿门，身后跟着四十余名背着药篓、修为多在通窍四五窍的老弱外门杂役。\n\n刚跨进门槛，石百川一眼瞧见镇磁柱下三具割喉探子与地上咽喉淌血的九窍刺客尸首，吓得双腿一软差点咬着舌头：“这、这是遭了埋伏？！”\n\n霍千山正愁大队拖累脚程，见石百川撞上门来，眼底顿时闪过一抹冷酷决断！\n\n“石百川，你来得正好！”\n\n霍千山长戟往地上一顿，声音不容置疑，“敌宗主力已扑中窟，某家与曹、梁二位师弟即刻率三房精锐改道磁雷盐桥抢莲！”\n\n“东侧岔道刚逃了一名内鬼，随时可能引来敌宗饲养的嗜血妖兽抄后路。命你率这四十名外门杂役原地结阵留守分卤岔殿，死死钉住东、北两处洞口，大军未返前退后半步者，斩！”\n\n轰隆！\n\n石百川脑瓜子嗡的一声，整张胖脸瞬间白得没了一丝人色！\n\n三房精锐全抽走，就留他一个通窍七窍的丹堂副管事带着四十个挖药老弱杂役守四战死地？玄煞门随便摸过来一队八窍刀手，他们全得喂了血兽！\n\n“霍师兄饶命啊！”\n\n石百川顾不得体面，扑通跪倒抱住大腿哭嚎，“属下这队人连副像样铁甲都没有，留在这儿就是白白填坑啊！求师兄带属下一块过桥吧！”\n\n“滚开！”\n\n霍千山一脚将其踹翻在地，冷冷喝道，“食宗门俸禄，拿命堵漏便是你的本分！再敢哭丧乱了军心，现在就拿你祭旗！”\n\n周围四十多名外门杂役吓得面如死灰，缩在墙根瑟瑟发抖。\n\n曹无极居高临下瞥了一眼瘫在血泊边的石百川，阴鸷目光一转，忽然落向右侧的苏清晏与她身后挑着铁木炭箱的陈长庚，嘴角勾起一丝冷笑：\n\n“既要轻装疾行抢盐桥，累赘自然越少越好。”\n\n曹无极伸手便往苏清晏面前一摊，“苏客卿，把你手里的中窟定脉副图交由本公子掌管。至于你身后这个刚摸到七窍边的挑箱废物，挑着两百斤烂木箱过窄桥纯属挡路，干脆留给石管事凑个人头守殿！”\n\n殿角阴影里，陈长庚低垂的眼皮微不可察地动了一下。\n\n方才进殿借火光打量四周时，他早已把西侧那座通往磁雷盐桥的洞口岩壁瞧得真真切切！\n\n洞口左壁三尺高处，有一道极不起眼的倒三角形灰白老卤渗霜印——那走向与他怀里那半张前代盐工修渠草图标注的排水坡度分毫不差！\n\n也就是说，紧贴磁雷盐桥对岸桥尾偏西不到二十步的断崖下方，就藏着那条荒废百年、连内门堪舆图都未曾记载的“西偏废矿廊”！\n\n留在这分卤岔殿跟石百川一块等死？绝无可能！\n\n他不仅要过桥，还要借这座桥，堂堂正正甩掉霍、曹、梁这三双烦人的眼睛！\n\n不等陈长庚开口，前头的苏清晏已冷冷抬起皓腕，露出掌心那面刻满血色细纹的古铜寻脉罗盘：\n\n“曹公子看得懂天阵宗的九宫反磁篆么？”\n\n曹无极脸色一僵。\n\n“此盘认本座心头精血，离手三息即成废铜。”\n\n苏清晏语调冷得像冰碴子，半寸不让，“桥上乱磁电弧随时易位，每三十步便需箱中孤品定磁火炭压阵换旗。把挑炭人留在殿里，过了半桥磁针乱跳，曹公子是打算拿自己的肉身去试雷弧？”\n\n“你少拿阵法拿捏本公子！”曹无极眼底凶光闪烁，“箱子叫胡彪手下拎着便是，何须带个外门病鬼！”\n\n“咳、咳咳咳……”\n\n一阵撕心裂肺的剧烈闷咳声突然从炭箱后头响起！\n\n陈长庚弓着虾米腰往前挪了两步，嘴角逼出一缕前几日备下的暗黑淤血沫子，扑通跪在碎盐渣里，满脸卑微惶恐地朝曹无极连磕两个响头：\n\n“曹大老爷开恩！小人这条贱命全靠跟着苏仙师混口汤喝，留在殿里连半刻钟都活不过啊！”\n\n他一边喘着粗气擦嘴角黑血，一边极其识趣地指了指曹家两名护卫背上鼓鼓囊囊的破禁生铁砂袋，赔着笑脸道：\n\n“小人虽没本事拼杀，可在盐场挑惯了重担，脚底板最稳！这两只炭箱之外，小人愿替曹大老爷麾下两位爷分挑两袋破禁铁砂！桥上若是遇着风吹草动，小人走在侧沿还能替各位仙师挡挡碎石风煞，只求大老爷赏条活路跟队！”\n\n旁边的胡彪原本还想骂人，一听这傻小子主动抢着挑两袋六十斤重的生铁砂，还肯走外侧挡风口，顿时乐得咧开了嘴，凑到曹无极耳边压低嗓门道：\n\n“公子，磁雷盐桥窄得很，听说常有暗雷劈外沿！带这蠢货挑着铁砂走桥边，不正好给咱们当个现成的引雷肉盾？等过了桥进中窟，随手一脚踹下去便是！”\n\n曹无极眼珠一转，瞧着陈长庚那副贪生怕死、拼命巴结贵人的窝囊苦力相，心头最后一丝疑虑彻底烟消云散，鼻孔里重重哼了一声：\n\n“算你这贱役识相！胡彪，把那两袋铁砂扔他扁担上！过桥敢慢半步，本公子一刀劈了你！”\n\n“谢大老爷赏命！谢胡管家！”\n\n陈长庚千恩万谢地爬起来，接过曹家护卫扔来的两只沉重铁砂袋捆上扁担两头。\n\n就在弯腰系麻绳的刹那，他粗糙手指顺势从炭箱侧边夹层摸出一只早先备好的灰麻小袋——里头塞满了他在丙字废渣房筛灰时特意攒下的十来斤见潮发烫的陈年硫铅毒渣！\n\n麻绳在扁担最外侧铁钩上轻轻一绕，打了个一扯即松的脚行滑水活扣，严严实实遮在铁砂袋底下。\n\n想拿他当引雷肉盾？待会儿上了桥，谁给谁垫背还不一定！\n\n“都跟紧了，出发！”\n\n霍千山一马当先提剑冲入西侧岔道，梁世勋、苏清晏、陈长庚与曹无极三房六十余名精锐鱼贯而入，转瞬消失在幽暗卤廊深处。\n\n空荡血腥的分卤岔殿内，只剩下石百川带着四十名面无人色的外门杂役。\n\n盯着三强远去的背影，石百川从地上爬起来，擦去脸上泥血，眼神怨毒得如同择人而噬的毒蛇，从牙缝里挤出低不可闻的咒骂：\n\n“好你个霍千山、曹无极……拿老子当弃子喂狗！真当老子在丹堂白混了十年，没给自己留条后路不成？！”\n\n……\n\n两刻钟后，巳时三刻。\n\n西侧卤道尽头豁然洞开，一股令人毛骨悚然的深渊阴风夹杂着噼啪电爆声扑面撞来！\n\n众人止步崖边往下看去，饶是三房精锐见惯了厮杀，也不由齐齐倒吸一口凉气。\n\n眼前是一道宽达六十余丈、下临无底幽暗黑渊的巨大地底断层！\n\n断渊正中，仅有一座由万年惨白老盐岩与生铁锁链凝结而成的天然窄桥横跨南北——桥面最宽处不足五尺，两侧寸缕护栏皆无，数十道手臂粗的蓝白乱磁电弧如同毒蛇般在桥底与半空肆意游走抽打！\n\n头顶禁空铁律高悬，一旦失足跌落这百丈黑渊，纵是通窍九窍巅峰也得摔成一滩烂泥！\n\n“苏客卿，定磁开路！全军单列疾行过桥！”霍千山沉声下令。\n\n苏清晏不发一言，咬破指尖在古铜罗盘上一抹，左手连甩四枚定磁铁钎钉入桥头盐岩，撑开三尺宽的避雷白芒率先踏上窄桥。\n\n陈长庚挑着近三百斤的炭箱与铁砂袋紧贴桥面西沿跟上，每一步草鞋落下都看似摇晃吃力，实则脚趾早已隔着鞋底死死扣住盐岩防滑脉理，目光透过浓重灰黑煞雾穿向对岸岩壁下方——\n\n找到了！\n\n就在临近北岸桥尾偏西下方约三丈高的对岸陡峭崖壁上，一截长约丈许的白色老盐台斜斜探出深渊，盐台内侧黑黝黝的裂口，正是修渠草图上的西偏废矿廊！\n\n队伍迅速越过孤桥中段，一路推进至距北岸桥尾断崖不足八丈处！\n\n对岸桥头已被翻滚如墨的黑煞浓雾彻底笼罩，近在咫尺。\n\n“已过中段快到桥头了，一鼓作气冲上岸！”梁世勋紧握佩刀低喝。\n\n话音未落！\n\n“桀桀桀……霍千山，多谢你们云泽宗千里迢迢替老夫送来这群血食！！”\n\n一阵沙哑刺耳、宛如夜枭刮骨的森然狞笑声，突兀地从对岸黑雾深处轰然炸响！\n\n“不好！有埋伏，举盾——！！”霍千山瞳孔骤缩，玄铁重剑悍然出鞘！\n\n还没等后排护卫举起铁盾！\n\n“吱吱吱——轰隆隆！！！”\n\n对岸浓雾骤然向两侧翻卷炸裂，成百上千只双翼展开足有三尺宽、通体覆盖暗红铁毛、獠牙滴落腥血的“嗜血磁蝠”，裹挟着漫天狂暴乱磁电弧如黑色海啸般迎面扑上孤桥！\n\n更致命的是，三头体型硕大的通窍八窍磁蝠王贴着桥底黑渊闪电掠过，双爪携万钧磁暴狠狠撞在众人身后十丈处的风化承重石梁上！\n\n“咔嚓——轰！！！”\n\n后方退路石梁当场崩断坠入百丈深渊，残存的前段盐桥剧烈摇晃，六十余人瞬间被死死截困在了临近北岸的悬空断桥之上！"}, {"n": 65, "title": "断桥借蝠", "body": "后路崩断，碎石如雨坠入不见底的漆黑深渊，连半点回响都听不见！\n\n窄桥之上，上千只嗜血磁蝠掀起的腥臭狂风混着噼啪炸裂的蓝白电弧，瞬间将队伍撕得七零八落！\n\n“稳住阵脚！谁也不许离地跃起，往前杀开血路冲上北岸！！”\n\n冲在最前的霍千山怒发冲冠，周身九窍巅峰纯阳赤炎劲轰然暴涨，手中无锋玄铁重剑横扫如门板！\n\n“嘭！嘭！嘭！”\n\n冲在头排的十几只通窍六七窍嗜血磁蝠被重剑霸道火劲生生砸成漫天血雾！引路的苏清晏刚推进至临近北岸桥尾三丈处，受漫天蝠啸声浪冲击牵动左脉旧伤，当即驻足桥尾石墩旁双手压旗稳住避雷白芒，霍千山与梁世勋率前锋精锐趁机越过她身侧，硬生生往北岸桥头犁出一条血路抢先冲上实地！\n\n唯有两名慢了半步的梁家护卫惨叫着被磁蝠咬穿咽喉，翻滚着跌落百丈黑渊！\n\n最为阴狠狼狈的，却是从后段发力抢向北岸桥尾的曹无极！\n\n血河宗樊九皋驱使的这群嗜血磁蝠专嗜血煞精气，曹无极修炼的偏偏是血煞功法，一时间竟有近两百只红眼磁蝠尖啸着朝他这一段蜂拥扑来！\n\n“滚开！替本公子挡着！！”\n\n眼看三只七窍磁蝠利爪裹着电弧直抓面门，曹无极眼神狰狞，左手猛地探出，一把揪住身旁一名跟队搬运阵盘的丹堂六窍学徒后领，毫不留情地将其当成活人肉盾迎面砸向蝠群！\n\n“啊——曹师兄饶命！！”\n\n那丹堂学徒连半息都没撑住，胸膛瞬间被三只磁蝠撕开，惨叫着连人带蝠坠下深渊！\n\n一不做二不休！\n\n曹无极借着死人挡灾的空档往前疾蹿数步抢至距北岸桥尾不足三丈处，正撞见苏清晏后半步紧贴桥面西沿、挑着两只大铁炭箱与两袋铁砂“步履蹒跚”的陈长庚挡住了半边冲锋道！\n\n“好狗不挡道！你也给本公子下去喂蝙蝠吧！！”\n\n曹无极眼底凶戾杀机暴涨！\n\n在他看来，桥面统共五尺宽，把这个碍事的外门七窍苦力连同沉重木箱一脚踹进深渊，既能腾出冲刺路，又能拿活人血肉引走头顶这群疯蝙蝠，死无对证，苏清晏也拿他没辙！\n\n没有任何预兆，曹无极右腿筋肉暴起，通窍九窍的阴狠血煞劲凝聚在包铁战靴尖端，对着陈长庚后腰命门恶狠狠一脚猛踹过去！\n\n三尺、一尺、三寸！\n\n胡彪在后头看得狞笑出声，仿佛已经听见这灰衣杂役骨断筋折掉进深渊的惨叫！\n\n然而，就在曹无极铁靴带起的恶风贴上灰麻旧袄的前半刹！\n\n一直弓腰低头、看似被漫天磁蝠吓傻了的陈长庚，眼底深处却闪过一抹冰冷彻骨的讥诮！\n\n从分卤岔殿主动替曹家挑起铁砂袋那一刻起，他等的就是曹无极过河拆桥这一脚！\n\n不等靴尖真正踢实命门，陈长庚双脚顺着摇晃的桥面极其逼真地往前一滑，整个人顺着曹无极踢来的风势猛地向桥沿歪倒，“哎哟”一声惨呼，右手慌乱间顺势在扁担外侧那枚滑水活扣上一勾一扯！\n\n“刺啦——！！”\n\n挂在扁担最外头、原本用来垫铁砂袋的那只灰麻口袋当场裂开一道大口子！\n\n曹无极一脚踹空七分，靴尖正好踢爆了滑落半空的灰麻袋！\n\n“哗啦——！！”\n\n十来斤陈长庚在丙字废渣房筛攒下来、遇古墟湿雾骤然滚烫发腥的陈年暗红“硫铅毒渣”，如同天女散花般迎风炸开，兜头盖脸泼了曹无极和紧跟在后的胡彪满头满背！\n\n“什么脏东西？！咳咳——”\n\n曹无极猝不及防吸了一口硫黄恶臭，还没来得及挥袖震散毒粉！\n\n头顶盘旋扑击的那两百多只嗜血磁蝠，鼻翼猛然剧烈抽动起来！\n\n古盐墟深处的嗜血磁蝠常年啃食伴生硫铁矿脉度日，对滚烫浓烈的硫铅火毒腥气简直比见了亲娘还要狂热十倍！\n\n“吱吱吱——！！！”\n\n刹那间，原本分散围攻器堂和梁家的上百只凶悍磁蝠，连同两头通窍八窍的巨型磁蝠王，绿油油的兽瞳同时锁定浑身冒着硫铅腥烟的曹无极，如同闻见血腥味的食人鲨群，调转方向疯了似地朝曹无极后背狂扑而下！\n\n“该死！！这麻袋里装的什么鬼玩意儿？！”\n\n曹无极魂飞魄散，头皮炸得发麻！\n\n两头八窍磁蝠王双爪撕裂空气，当场将他身后两名来不及躲闪的曹家七窍护卫抓碎天灵盖，紧接着数十张布满倒刺獠牙的血口狠狠咬在曹无极撑起的血煞护体气罩上！\n\n“咔嚓、咔嚓！”\n\n九窍护体罡气竟被蝠群自带的乱磁电弧啃得裂纹密布，胡彪更是被一只磁蝠撕掉半块肩头肥肉，杀猪般惨嚎连连！\n\n“给本公子滚开——！！”\n\n生死关头，曹无极再也顾不得回头补刀陈长庚，心头滴血般伸手入怀，一把摸出两张压箱底的二阶“赤血爆炎灵符”，咬牙切齿地迎空捏碎！\n\n“轰隆——轰隆！！！”\n\n两团丈许大的狂暴血色火球在北岸桥尾轰然炸开，当场将扑近身前的三十余只嗜血磁蝠烧成焦炭，借着爆炸前推之力，灰头土脸、半边袍袖烧成黑布条的曹无极拽着满身是血的胡彪，狼狈万状地追着霍千山屁股后头亡命跃上北岸实地！\n\n两张价值三十枚下品灵石的保命灵符一朝丧尽，曹无极肺都要气炸了！\n\n而就在那两团赤血爆炎灵符炸开、引动半空数十道水桶粗乱磁电弧齐齐劈中桥尾盐岩的惊天动地刹那！\n\n“轰咔——！！！！”\n\n苏清晏与陈长庚脚下这截北岸桥尾连接断崖的五丈盐梁，再也承受不住灵符与磁暴的双重轰击，伴着震耳欲聋的巨响寸寸崩塌解体！\n\n漫天惨白盐岩碎块混着浓郁得伸手不见五指的灰黑硝烟冲天而起，瞬间将南北视线彻底切断！\n\n“不好！桥塌了——苏客卿！！”\n\n已在北岸站定脚跟的霍千山惊怒回头，只见滚滚烟尘中整截连接北岸的桥尾盐梁已化作齑粉坠入百丈黑渊，哪里还有半个人影？\n\n对岸黑雾里的血河宗樊九皋见未能留住霍千山主力，又忌惮器堂重剑凶威，尖啸一声召回残余磁蝠群，迅速往中窟深处退去。\n\n梁世勋喘着粗气往黑渊底下探头看了一眼，脸色难看道：“百丈深渊，又不能御剑滞空，那姓苏的孤女和挑箱杂役掉下去，怕是连骨头渣子都摔碎了！”\n\n满脸焦黑的曹无极啐出一口带血唾沫，恶狠狠道：“死了干净！没有寻脉馆，咱们照样拿炸药轰开中窟禁制！快追樊九皋，别叫他们先把伴生莲摘了！”\n\n三人不再停留半息，率领残存的四十余名精锐顺着北岸正道狂奔而去。\n\n他们做梦也想不到——\n\n就在北岸桥尾盐梁崩塌、漫天烟尘遮死全场视线的那一瞬！\n\n紧贴北岸崖壁的断桥边缘，左脉旧伤被灵符震波冲得气血逆乱的苏清晏脚下一滑，整个人随着一块千斤断石直直往渊底坠落！\n\n禁空铁律锁死全身灵力，一旦祭出铁钎借力超过半丈便是爆体惨死，苏清晏清冷眸中第一次掠过一丝绝境寒意！\n\n千钧一发之际！\n\n一只粗糙如老树皮、却稳如百炼精钢铁钳的大手，穿透浓黑硝烟，分毫不差地一把攥住了她的左袖手腕！\n\n“仙师闭气，收肩！”\n\n低沉短促的喝声在耳畔炸响！\n\n身处半空的陈长庚压根没有外放一丝一毫灵力，他右臂肌肉如铁虬隆起，两百多斤重的两只试阵铁木炭箱被扁担麻绳死死箍在脊背正中，连半寸移位都没有；左臂顺着下坠之势猛然一收一拧，借着塌桥侧倾余劲带着苏清晏在浓烟碎石雨中横移半丈，贴着早已锁死的北岸西侧断崖斜扑而下！\n\n一丈、两丈、三丈！\n\n呼啸黑风刮面如刀，浓烟里连自己的手指头都看不见！\n\n苏清晏只觉握住自己手腕的那只大手稳得可怕，竟在毫无灵光视野的乱磁绝渊中算准了每一分下坠力道！\n\n“嘭——嚓！！”\n\n下一息，陈长庚双足草鞋不偏不倚重重踏在北岸西侧断崖下方三丈处那截仅三尺宽的凸出老盐台边缘！\n\n近三千斤的通窍八窍圆满暗金横练柔劲自足底涌泉穴瞬间回旋卸开，硬生生将两人一担近五百斤的恐怖下坠冲力卸进脚下盐岩，只踩裂了一层寸许厚的脆盐壳！\n\n不等脚下余势逼人外翻，陈长庚腰胯一沉，拽着苏清晏顺势往盐台内侧一滚！\n\n“噗通！”\n\n两人连同那两只完好无损的封条铁木炭箱，一骨碌全数滚进了盐台后方那条高不过五尺的漆黑矿洞深处！\n\n几乎就在他们滚入洞内的同一息，上方断桥最后几块万斤巨岩轰然砸落，卡在盐台外沿上方，激起的浓密盐尘与碎石哗啦封堵了大半个洞口，将外头的磁蝠嘶鸣与电弧爆响彻底隔绝在外！\n\n死里逃生！\n\n洞内伸手不见五指，唯有岩壁渗出的苦卤滴水声“滴答、滴答”回荡。\n\n陈长庚刚松开苏清晏的袖口，撑着铁木炭箱直起半截身子，准备拍打灰麻旧袄上的硫渣——\n\n“铮！”\n\n一缕细微到极致的破风寒音骤然刺破黑暗！\n\n方才还气息微乱的苏清晏在落地半息之内便已翻身半跪而起，右手反握一枚冰冷刺骨的八棱试脉铁钎，锋锐如针的钎尖停在陈长庚咽喉大动脉前不足两寸之处！\n\n黑暗中，女子左袖被震裂的伤口正一滴一滴往下渗着殷红鲜血，那双近在咫尺的清冷寒眸却亮得惊人，一字一句如冰刀刮过陈长庚耳膜：\n\n“刚入七窍的熬盐杂役，在乱磁浓烟里绝踩不准三丈盲区落脚点。”\n\n铁钎往前微递半寸，寒芒刺得喉间皮肤生疼：\n\n“说，你到底是谁的人？”"}, {"n": 66, "title": "暗廊摊筹", "body": "冰冷的试脉铁钎悬在咽喉前两寸，钎尖萦绕的一缕微弱定磁锐气，已将陈长庚颈侧汗毛激得根根竖起。\n\n只要他此刻往左肋火珠囊或右袖乌金刺挪动半寸手指，这位性子傲烈宁折不弯的天阵宗孤女，绝对会毫不犹豫地引爆铁钎与他同归于尽！\n\n洞外断桥余尘未散，洞内死寂落针可闻。\n\n迎着黑暗中那双如寒星锁魂的眸子，陈长庚非但没有去摸半件兵刃，反而顺着半蹲的姿势缓缓松开扁担绳，坦坦荡荡地将自己那双布满乌黑盐茧与火毒烫疤的粗糙大手往身前一摊。\n\n“回苏客卿的话，小人谁的人都不是。”\n\n陈长庚嗓音低沉平静，褪去了平日里在贵人面前点头哈腰的惶恐颤音，只剩下一笔一划摆在台面上的实在账：\n\n“小人就是丙字废渣房一个想活着走出古盐墟的外门杂役，陈长庚。”\n\n苏清晏手腕纹丝不动，清泠声音没有半分温度：“外门杂役？岔殿摔箱替我挡毒匕、歪扁担卡死梁世勋灭口刀路，再加上方才浓烟里闭着眼踩中这三尺孤台——你拿本座当霍千山哄？”\n\n“小人不敢哄仙师，只是外门烂泥塘里水太深，露了底裤活不过三天。”\n\n陈长庚脖子连偏都没偏半毫，任由铁钎抵着喉咙，语气坦然得近乎直白，“仙师若疑心小人是梁世勋或者曹无极安插的暗桩，方才在断桥边，曹无极踹我下渊、仙师脚滑踏空那一瞬，小人只需缩手慢上半息，仙师此刻已在百丈渊底摔成碎玉了，小人何苦冒着粉身碎骨的险拉仙师一把？”\n\n黑暗中，苏清晏握钎的素白指节极轻地动了一下。\n\n这是铁打的事实。\n\n在禁空铁律锁死的百丈断渊上，刚才那一拽，是实打实的救命之恩。\n\n不等她追问，陈长庚主动掀开半张早备好的底牌，指了指自己的双臂筋骨与怀里一角泛黄草纸：\n\n“至于仙师问小人为何踩得准落脚点，实情只有两桩。”\n\n“其一，小人入云泽宗前在沧溟大泽乌卤盐场熬了三年毒卤，机缘巧合练过一门盐工传下来的粗浅横练锻骨硬功，下盘气力比寻常同阶壮实些，早两个月其实就摸进通窍七窍锻骨门槛了。”\n\n“只因丙字废渣房前头三任杂役全死得不明不白，曹无极又最喜抓气血壮的外门弟子去甲字房试邪火，小人才借着早年肺里的一点陈年铅毒装病藏拙，昨日在营里也只敢向仙师透出一分初入七窍的气机。”\n\n苏清晏眉梢微挑：“那这处偏洞呢？连内门三家合参的羊皮主图上都未标过此路。”\n\n“其二，小人上月去黑石坊市鬼市淘换抗毒药散时，从个破落脚夫手里花半块碎灵石买到过半张前代老盐工修外围排烟廊的烂草图。”\n\n陈长庚从怀里摸出那半张裁去了水底暗沟核心段、只留外围西偏廊走向的旧草纸，坦然递到苏清晏眼皮底下，“方才在分卤岔殿西洞口，小人瞧见石壁上的老卤白霜走向与这张旧草图一模一样，这才敢替曹家挑铁砂混上桥，存了金蝉脱壳的心思。”\n\n七窍锻骨横练，加上三年盐工看霜认路的老底子与半张外围修廊残图！\n\n桩桩件件皆与他出身乌卤盐场的履历严丝合缝，半点不显突兀，更把最致命的通窍八窍圆满修为、蚀纹石臼、青铜盾偶与底窟水下暗沟捂得滴水不漏！\n\n苏清晏左手捏起一撮荧光矿粉捻亮，微弱青光映在泛黄草纸粗糙的炭笔线条上，又扫过洞壁古老的凿石斧痕。\n\n她眸光微凝，仍未彻底放下戒备：“你既有独门退路，自己跳下来逃命便是，拉上本座做什么？”\n\n陈长庚抬起眼，目光越过冰冷铁钎，直直落在苏清晏左袖那片已被鲜血浸透巴掌大的素白道袍上：\n\n“因为单靠小人这半张烂草图，走不出后头的古阵死禁；而单凭仙师眼下的伤势，一个人也拿不下你想取的东西。”\n\n苏清晏瞳孔骤然一缩，左腕下意识往袖中微敛半寸：“你看出什么了？”\n\n“正月十八仙师在寻脉馆招人那日，每逢第三息换气，左腕尺泽穴便有一丝地煞逆冲的滞意；方才在岔殿连发五钎杀九窍死士，又在断桥受了曹无极两张爆炎符震荡，仙师左脉的旧伤已经压不住血腥气了。”\n\n陈长庚不卑不亢，三两句便戳穿了这位清冷阵修死撑到底的软肋，“仙师宁肯得罪曹、梁两家也要接下云泽宗这趟浑水，总不会真为了挣那几十枚聘礼灵石替霍千山摘伴生莲吧？”\n\n“霍千山、曹无极、梁世勋三个九窍恶狼，过了桥只会拿仙师当破禁肉盾，门一开头一个就要杀仙师灭口！反倒是小人——无门无派，跟仙师劳宫穴里钉着同生共死的地脉血契，又只求在边角捡点破境灵矿活命。”\n\n陈长庚摊开掌心那道淡淡血契微痕，声音冷澈有力：“仙师出堪舆真传指路破禁，小人出这一身横练力气挑箱护道。这古盐墟里，仙师再找不出第二个比小人更守规矩的买卖人！”\n\n洞内一时安静下来，只听见苏清晏略显清浅的呼吸声。\n\n两息、三息……\n\n“锵。”\n\n抵在陈长庚咽喉前两寸的那枚八棱试脉铁钎，终于手腕一翻，干脆利落地收回了素白宽袖之中。\n\n苏清晏偏过头，从怀中取出一小瓶止血金创散倒在左腕裂口上，动作依旧孤傲利落，连眉头都没皱一下，只冷冷挤出一句：\n\n“油嘴滑舌，算盘珠子都快崩到本座脸上了。”\n\n话虽冷硬，眼底那层防贼似的杀意却已实打实散去了七分。\n\n正如陈长庚所言，在所有人皆欲吃干抹净她的修真丛林里，一个把利益底线摊在明处、断桥绝境下真伸手拉了她一把的体修搭档，远比满口同门大义的内门天骄可靠百倍。\n\n苏清晏系紧护腕布条，取出一枚刻着残缺云纹的青玉旧简对照了一眼西偏廊方位，不再隐瞒：\n\n“你这半张盐工旧图没画错。顺这条西偏废矿廊往东南潜行三里，可绕开中窟正面的五派混战区，直抵内窟侧翼岩壁。”\n\n她清冷眸中浮起一抹罕见的执念，“八十年前，我苏氏一脉曾有一位堪舆族老受邀入墟镇脉，不幸坐化在侧翼一座隐秘古阁内，随身遗落了半卷本门断绝的核心传承——《地脉堪舆总图》。”\n\n“霍千山他们争他们的赤煞伴生莲，本座此行只为收回先祖遗图！”\n\n苏清晏抬头看向陈长庚，干脆划出价码：“你护我破开古阁禁制取回《地脉堪舆总图》残卷，阁内其余陪葬灵材、玉器、丹石，按先前血契，划足三成归你独占；取图之后，再贴侧翼摸去内窟边缘，能捞多少机缘各凭本事。干不干？”\n\n陈长庚眼底微不可察地一亮！\n\n绕开中窟正面混战，不仅能顺路白分三成八十年前阵道前辈遗留的古阁藏宝，最后路线还正好贴着内窟侧翼往底窟地母玄晶的方向靠拢！\n\n“仙师爽快，小人没二话！”\n\n陈长庚麻利地弯腰重新挑起两只完好无损的试阵铁木炭箱，将扁担往肩窝一压，侧身让出前头半步，“那就有劳仙师前头指点风眼，小人替仙师垫后！”\n\n苏清晏深深睨了这个一转眼又恢复成老实挑箱苦力模样的青年一眼，没再多言，捏起一面敛光小阵旗压住两人足音，一前一后沿着倾斜向下的西偏废矿廊悄然潜行而去。\n\n这条废弃百年的排烟矿廊僻静幽深，地上积着厚厚一层干脆盐灰，沿途连半只嗜血磁蝠的影子都没有。\n\n两人配合默契，苏清晏指尖铁钎轻点避开两处暗藏的地磁漏气孔，陈长庚则挑着两百多斤重箱步履无声，顺手抹平沿途草鞋印记。\n\n往前潜行不过百余步，刚转过一道风化严重的马蹄形盐岩拐角——\n\n“啊——！！别割了！我说、我都说！！饶命啊几位好汉！！”\n\n一阵凄厉变调、熟悉到极点的杀猪般惨叫声，突兀地从拐角右下方一座坍塌废弃的圆形炼卤大坑底部传了上来！\n\n苏清晏脚步陡然刹住，素手一抬压低阵旗！\n\n陈长庚悄无声息卸下扁担，与苏清晏一同猫腰贴上大坑边缘一道天然排烟石缝，屏住呼吸往下俯瞰。\n\n只见下方三丈深的废弃炼卤大坑中心，燃着一堆幽绿鬼火。\n\n周围横七竖八倒着十几具早已咽气的云泽宗外门采药杂役尸首；而在火堆正中，半个时辰前被留在分卤岔殿看守后路的丹堂副管事石百川，正衣衫破碎、浑身血肉模糊地瘫在地上！\n\n三名身穿玄煞门黑衣劲装、气息赫然全是通窍八窍精锐的凶悍刀客围成三角，为首一名刀疤脸头目一脚死死踩在石百川肥腻的后背上，手里一柄弯刃剔骨尖刀刚从石百川大腿上削下一片血淋淋的皮肉，狞笑着拍打他的脸颊：\n\n“姓石的肥猪，少拿外围假话糊弄爷爷！再不说出霍千山主力走了哪条道、身上带了几件破禁家伙，下一刀老子先把你这两颗眼珠子剜下来泡酒！”"}, {"n": 67, "title": "隔岸观火", "body": "排烟石缝下头，腥臭的绿火映得石百川满脸肥肉直哆嗦。\n\n“我说！好汉饶命，我全说！”\n\n石百川趴在血泥里杀猪似的哭嚎，哪还有半星云泽宗丹堂副管事的体面，“霍千山带曹无极、梁世勋抄近道上磁雷盐桥了！他们统共就六十来号精锐，直奔中窟赤煞伴生莲去了！”\n\n踩着他后背的玄煞门刀疤脸头目冷笑一声，剔骨尖刀贴着石百川耳根子轻轻一刮：\n\n“算你识相。那姓苏的天阵宗娘们呢？她手里的破禁家伙装在哪儿？”\n\n“也在桥上！”\n\n石百川疼得浑身筛糠，竹筒倒豆子般卖了个底掉，“十二面定磁阵旗全在她袖子里，还有两箱孤品定磁炭，叫个丙字房的灰衣病鬼挑着跟在队尾！好汉，我知道的真全倒干净了，给我留条狗命吧！”\n\n石缝上头，苏清晏眼神骤寒。\n\n她左手三枚破禁铁钎悄然滑出袖口，刚要往下扣指——\n\n一只布满老茧的粗糙手掌横伸过来，极轻地虚按在她小臂上方半寸处。\n\n苏清晏偏头瞪去。\n\n陈长庚趴在阴影里，冲她缓缓摇了下头，低不可闻地吐出六个字：\n\n“三个八窍，等狗咬狗。”\n\n苏清晏眸光微闪。\n\n底下三名玄煞门刀客气息匀称凝练，俱是实打实的通窍八窍好手，且占着坑底视野。\n\n这会儿贸然跳下去硬拼，哪怕杀得光，动静一旦传出西偏廊，中窟的褚横山立马就能闻着味包抄过来。\n\n再往下看时，坑底果然起了新变化。\n\n左边一名三角眼玄煞门刀客啐了一口：“头儿，霍千山既然过了盐桥，留这肥猪还有屁用？一刀抹了干净，省得浪费伤药！”\n\n“别！别杀我！！”\n\n石百川吓得魂飞魄散，拼命拿额头磕着碎盐石，嘶声尖叫，“我有宝贝买命！就藏在这废坑南头那座塌了一半的老熬卤窑底下！”\n\n刀疤脸头目刀尖一顿，眯眼俯身：“什么宝贝？敢耍花样，老子把你舌头先割下来！”\n\n“千真万确！是十年前丹堂老执事入墟私扣下来的一匣‘高纯地火精石’，整整十二块，足够炼两炉二阶火煞丹！”\n\n石百川涕泪横流，反手指着三丈外那座半塌的青砖旧窑，“当年是我亲手替老执事封的砖缝，外头裹着隔磁铅皮，谁也没找着！我把精石全孝敬三位爷，只求三位爷当我是个屁放了吧！”\n\n三名玄煞门刀客呼吸猛地一粗！\n\n高纯地火精石在黑市一块就能换三四枚下品灵石，十二块便是四十多枚灵石的横财，连褚长老都未必舍得赏下来！\n\n“老三，踩死这肥猪别叫他乱动！老二跟我过去撬砖！”\n\n刀疤脸头目眼底贪光暴涨，当即提刀大步走向塌窑。\n\n两人照着石百川指的左角第三块青砖，拿厚背刀撬开三层铅泥封皮，从窑底暗格里拖出一只尺许长的熟铁扁匣。\n\n“咔哒”掀开铁扣！\n\n一抹浓郁灼热、宛如凝固岩浆般的赤红宝光骤然映红了两人的脸膛，十二块鸡蛋大小的地火精石整齐码在石槽内，热浪扑面！\n\n“真他娘的是上品地火精石！发财了！”老二喜得眉开眼笑。\n\n石缝上方，陈长庚低垂的眼眸里掠过一抹幽冷笑意。\n\n左手两根手指，已悄然探进左肋快取暗囊，稳稳夹住了一枚缠满双层引火槽的过载烈阳火珠。\n\n他太懂石百川这种外门老油条了，更懂黑吃黑的规矩——宝贝见光那一息，就是翻脸见血的时候！\n\n果不其然！\n\n坑底刀疤脸头目合上铁匣塞进怀里，跟老二对视一眼，嘴角瞬间勾起一抹残忍狞笑，提着滴血弯刀转身走回火堆前：\n\n“石管事果然够意思，这么厚的买命钱，爷爷收下了。”\n\n石百川趴在地上大喜过望：“多谢好汉饶命！多谢——”\n\n“钱收下了，路还得送你走一程！”\n\n刀疤脸头目脸色骤拧，右臂八窍黑煞劲轰然灌入弯刀，照着石百川肥硕的后颈窝恶狠狠一刀劈落！\n\n旁边踩着石百川后腰的老三也同时狞笑着松脚后撤，防备溅一身血！\n\n就在这旧力刚松、新刀将落的电光石火间！\n\n一直瘫在血泊里装死狗的石百川双目猛然凸出，眼白里炸开一股兔子急了咬人的疯狂怨毒！\n\n“狗强盗不讲信用——都给老子陪葬吧！！”\n\n石百川根本不躲后颈劈来的弯刀，藏在肥大丹袍右袖暗袋里的五指拼命一捏！\n\n“噗——砰！！！”\n\n一只丹堂专门用来毒杀矿兽、装满滚烫铅汞腐血的“赤铅毒囊”贴着地面轰然炸裂！\n\n浓稠腥臭到极点的暗红毒浆混着刺鼻铅烟，如毒龙出洞般迎面喷了近在咫尺的老三满头满脸！\n\n“啊——！！我的眼睛！瞎了！！”\n\n老三连护体气劲都没来得及闭锁，两只眼珠子当场被赤铅毒浆蚀成两个血窟窿，丢下佩刀抱着脑袋在坑底疯狂打滚惨嚎！\n\n“找死！！”\n\n刀疤脸头目惊怒交加，弯刀偏了三寸，咔嚓一刀将石百川右肩连着半边琵琶骨劈开尺许深的大口子，鲜血狂喷！\n\n可这窄坑旧窑本就窝风，炸开的赤铅毒烟瞬间罩住两丈方圆，刀疤脸头目与赶过来的老二猝不及防各吸了半口毒雾，嗓子眼火辣辣剧痛，弯腰呛咳出两口紫黑毒血，周身八窍真气顿时滞涩了三成！\n\n“咳、咳咳！快退去东头风口散毒——”刀疤脸头目捂着嘴惊慌厉喝。\n\n话音未落！\n\n头顶三丈高的排烟石缝阴影里，陈长庚右掌猛然往下一压：“封风口！”\n\n“铮！铮！铮！”\n\n早憋着一口恶气的苏清晏素手疾扬，三枚八棱破禁铁钎化作三道夺命白线，精准无比地钉入坑底东侧那道仅有的排风窄缝岩壁！\n\n三缕定磁寒芒一锁，坑顶塌落两块百斤盐岩，当场把排风口堵得严严实实！\n\n“什么人？！”\n\n刀疤脸头目骇然抬头！\n\n迎接他的，不是飞剑，也不是喊杀声，而是一颗从三丈石缝上屈指轻巧弹落、表面双层引火槽正嗤嗤喷着刺目白芒的赤红圆珠！\n\n三倍赤磷硫精——过载烈阳火珠！\n\n“暗器！快躲进旧窑——”老二肝胆俱裂，拽着刀疤脸头目就往半塌的青砖窑洞里扑！\n\n陈长庚在石缝上冷冷看着，像看两只自己往灶膛里钻的蠢耗子。\n\n就在火珠坠至坑底丈许高、恰好悬在赤铅毒烟最浓处的刹那！\n\n“轰隆——！！！！”\n\n一团毁天灭地般的紫赤狂暴火球在封闭大坑中心悍然炸开！\n\n三倍威力的烈阳火精瞬间点燃了弥漫全坑的赤铅铅粉，二次爆燃的恐怖火浪如百柄重锤狠狠砸在青砖旧窑承重墙上！\n\n“哗啦——轰！！”\n\n半塌旧窑当场崩碎坍塌！\n\n那个在地上打滚的瞎眼老三连哼都没哼一声，直接被狂暴火浪掀飞撞碎在石壁上，胸腹炸成一团焦炭！\n\n扑到窑口的刀疤脸头目与老二更是被爆炸气浪连同数千斤滚烫青砖正面埋在底下，八窍护体罡气应声炸碎，口鼻狂喷鲜血！\n\n烟尘未落！\n\n一道灰麻身影贴着陡峭坑壁如狸猫般无声滑坠三丈，双足落地不带一丝烟火气，完全卡在古盐墟离地不逾半丈的禁空铁律之内！\n\n“呃……饶……”\n\n刚从碎砖堆里挣出半截身子的老二眼珠子还没聚焦，一点幽暗无光的九寸三分乌金寒星已穿透浓烟，自他咽喉软骨一掠而过！\n\n血线飙射，老二脑袋一歪当场毙命！\n\n三步外，胸骨塌陷半边的刀疤脸头目拼尽最后一丝力气举刀想挡，陈长庚左脚重重踏住他手腕骨，咔嚓踩碎腕节，右手百炼乌金破甲分水刺顺着他锁骨缺口垂直贯入心脉，手腕冷酷一绞！\n\n刀疤脸头目浑身一僵，彻底断气。\n\n从弹珠封路到滑坑补刀，前后不过五息工夫，三名全副武装的玄煞门通窍八窍精锐，连陈长庚的衣角都没摸着便全军覆没！\n\n左肋暗囊内，六枚过载烈阳火珠耗去一枚，尚存五枚。\n\n“呼……呼……你……陈长庚？！”\n\n火堆旁血泊里，被劈开半边肩膀、又遭火浪震碎脏腑的石百川还没断透最后一口气，看清从浓烟里走出来的灰衣青年面容，浑浊老眼骤然瞪得滚圆，满脸都是见了鬼般的骇然与荒谬，“丙字房的……病秧子……怎么是你……”\n\n他做梦也想不到，霍千山没救他，玄煞门没吃掉他，最后站着来收尸的，竟是平日里在丹堂连头都不敢抬的筛灰杂役！\n\n陈长庚居高临下看着他，半句废话不讲，手中乌金分水刺往下一送，干脆利落替这位丹堂副管事合上了眼皮。\n\n上方苏清晏顺着斜坡轻巧跃下坑底，收回东壁三枚铁钎，看了一眼坑内四具一击致命的尸首与坍塌的火窑，清冷眸底掠过一丝不易察觉的凛然。\n\n这个自称“通窍七窍锻骨”的盐工杂役，出手时机之毒、补刀手法之干净，简直比刀口舔血十年的老散修还要狠辣老练！\n\n“仙师守一息风口，小人把首尾摸干净。”\n\n陈长庚动作麻利得像演练过百遍，先从刀疤脸头目怀里掏出那只装满十二块高纯地火精石的熟铁扁匣，又将石百川与三名玄煞门刀客腰间统共四只储物袋一并扯下。\n\n抹去袋口无主烙印一扫，里头零零散散装着二十二枚完整下品灵石、几瓶解毒散，外加一面巴掌大小、泛着沉凝乌光的“百炼玄铁护心镜”。\n\n加上贴身原有的五十枚灵石，完整下品灵石一举增至七十二枚！\n\n陈长庚按先前三七约定，挑出四块地火精石递向苏清晏：“仙师刚才三钎封风口居功至伟，这四块精石请仙师收着。”\n\n苏清晏瞥了一眼，冷淡摇头：“地火精石于阵修无用，抵入古阁分账便是。速走，血腥味散出去会引来磁兽。”\n\n陈长庚也不矫情，顺手将整匣精石收妥，把那面百炼玄铁护心镜解开皮扣，严丝合缝塞进灰麻旧袄内侧贴胸护住心口。\n\n最后，他蹲下身，准备将四具尸首拖进塌窑深处拿碎砖掩埋。\n\n手指刚扯过那刀疤脸头目腰间悬挂的玄煞门乌铜身份牌，指腹忽然在铜牌背面摸到了一排棱角锋利、显然是今早才拿利刃新刻上去的小字暗记！\n\n陈长庚动作猛地一顿。\n\n借着坑底将熄的残火微光翻过铜牌一看，那双一向沉静如渊的眸子骤然微微一缩：\n\n“苏客卿，前头那座古阁怕是不能直接推门了。”\n\n正准备转身登坡的苏清晏脚步一顿，回眸看他：“牌上写了什么？”\n\n陈长庚指尖擦去铜牌凹槽里的血污，一字一句念出上头刻着的十四个小字：\n\n“西侧古阁门前，已钉九阴反磁桩！”"}, {"n": 68, "title": "拔桩反埋", "body": "“九阴反磁桩？！”\n\n听见这五个字的刹那，向来面若寒霜的苏清晏指尖蓦地一紧，素白脸庞上浮起一层刺骨杀意，“褚横山好毒的心肠！玄煞门自己破不开我苏氏先祖留下的血脉石门，竟提前在门外钉桩守株待兔！”\n\n陈长庚麻利地拿几块千斤焦砖把四具尸首彻底封死在塌窑底下，撒上一把石百川剩下的除味石灰盖住血腥气，这才挑起两只试阵铁木炭箱跃回坑顶。\n\n“仙师，这九阴反磁桩是什么路数？”陈长庚一边压低草鞋声跟在苏清晏身侧往东南潜行，一边低声问清底细。\n\n摸不清规则的机关，给座金山他也不会拿肉身去撞。\n\n苏清晏握紧手中定磁主阵旗，语速简短清晰：\n\n“玄煞门阵堂专克寻脉师的阴损军械。一根三尺长的九阴寒铁桩打进地脉活节点，桩体表层刻满感应灵纹，内芯贯通三股导磁铁脉，一头锁着古墟乱磁，另一头隔空连着褚横山怀里的传讯母铃！”\n\n她顿了顿，声音更冷三分：“凡是身怀苏氏堪舆血脉信物之人踏入两丈之内，或是外人拿刀剑真气强拔铁桩，表层灵纹立时引爆地下乱磁雷暴，中窟的褚横山一息便知有人摸到了古阁！”\n\n陈长庚眉头微挑：“隔空连着母铃，碰不得也拔不得？”\n\n“寻常散修自然束手无策。”苏清晏冷哼一声，没再多言，脚下步子却未停半分。\n\n申时二刻，西偏废矿廊走到尽头。\n\n前头豁然出现一道背靠内窟万丈绝壁的偏僻乱石缓坡，浓稠灰白的乱磁煞雾如死水般淤积在坡底。\n\n透过五丈视野极限往岩壁根下望去，只见两株早已枯死矿化的惨白古树之间，半掩半埋着一座通体由整块黑青盐岩雕凿而成的古朴石阁。\n\n阁门上方一方残匾早已被岁月蚀去半边，隐约只留一个苍劲古篆“苏”字——正是八十年前苏氏族老坐化镇脉的堪舆古阁！\n\n距离石阁尚有十步远，苏清晏倏然抬手刹住脚步，示意陈长庚卸担止步。\n\n她自己也没有再往前迈半步，只蹲下身捻起坡上一撮潮湿黑盐泥放在鼻端轻嗅，随后取出一枚细如绣花针的寻脉银丝贴地一探。\n\n三息后，银丝尾端极其细微地颤了九下！\n\n苏清晏顺着银丝指向看去——在距离古阁石门正前方三丈远的一堆灰白乱石正中，泥土翻动痕迹被一层薄霜巧妙盖住，底下赫然埋着一截散发着森冷阴磁煞气的乌黑桩头！\n\n“果然钉在正门咽喉位上，一寸都不差。”\n\n苏清晏收回银丝，清冷眸光盯住那堆乱石，缓缓将左手护腕布条重新勒紧，右手两指并拢点向自己眉心与唇角，竟是要当场逼出一口本命心血涂抹主阵旗！\n\n“仙师且慢！”\n\n守在两步外的陈长庚眼疾手快，右手扁担头轻轻往苏清晏阵旗杆下一托，拦住了她咬破舌尖的动作。\n\n苏清晏寒眸斜睨过来：“让开。此桩表层灵路密如蛛网，不燃一口本命精血强行镇死外圈磁纹，咱们连古阁门槛都摸不着。”\n\n“现在把本命心血烧在这根死铁桩上，那才真着了褚横山的道了。”\n\n陈长庚把扁担稳稳立在脚边，声音压得极低，账算得冷硬透彻，“仙师左脉旧伤本来就压得勉强，这一口心血吐出去，元气至少折损三成！”\n\n“就算眼下硬镇了这根桩子拿到残图，待会儿再去内窟边缘碰上五派九窍高手，或者撞见死禁，仙师拿什么保命？靠小人这两只炭箱去撞霍千山的重剑么？”\n\n苏清晏指尖微僵，眉峰紧紧蹙起：“本座岂会不知损耗？可九阴反磁桩表层灵纹连一丝外放真气都碰不得，不燃心血封灵路，谁能隔着地皮拆掉桩芯？”\n\n在她天阵宗的传承认知里，破这种内外双锁的阴毒阵桩，除了高一阶的开脉境大阵师以力压人，便只剩燃血镇纹一条独木桥。\n\n“外头灵纹碰不得，那就不碰外头，直接把它肚子里那三根导磁铁筋吃空便是。”\n\n陈长庚神色平静，拍了拍自己腰侧那只毫不起眼的黑泥寒铁药瓮，“仙师退后五步替小人盯着来路风声，给小人半盏茶工夫试试。”\n\n苏清晏深深看了他一眼：“你拿什么试？一旦惊动表层灵纹炸桩，两丈之内你我都得被乱磁撕碎。”\n\n“小人惜命得很，没把握的事绝不瞎碰。”\n\n陈长庚咧嘴露出一丝老实巴交的笑意，“早先在丙字废渣房倒矿灰时，小人凑巧用毒渣喂熟了几只专啃废铁芯的矿坑小甲虫，个头跟米粒差不多，没有半点真气波动，钻土缝最是拿手。仙师若信得过，且容小人献个丑。”\n\n苏清晏盯着他腰间那只连灵光都没有的粗铁瓮，清冷眼底疑色一闪，终究缓缓后退三步，左手扣住三枚保命铁钎蓄势戒备：“若见桩顶泛红光，立刻后撤，莫逞强。”\n\n“省得！”\n\n陈长庚不再多言，猫腰挪到距离反磁桩一丈半外的一块卧牛大青石后头，借着翻涌的灰白浓雾与青石阴影遮挡，右手拇指悄无声息掀开了腰间寒铁虫瓮的一线封口！\n\n气血微凝，掌心神血母印泛起一丝微热共鸣！\n\n“沙、沙……”\n\n二十只通体暗金混黑、外壳坚硬如百炼精铁的二蜕“嗜铁煞甲虫”鱼贯钻出瓮口，没有发出半点振翅声响，顺着陈长庚裤脚贴地滑入潮湿松软的盐碱碎石缝中，眨眼便没了踪影！\n\n前几夜在芦苇断崖水底，这二十只小祖宗连百年精铁栅栏的合页轴心都能啃成鸡蛋壳，眼下对付一根玄煞门制式寒铁桩，简直就是大厨切豆腐！\n\n古盐墟乱磁压制之下，陈长庚压根不外放分毫神识，只半蹲在青石后闭目静听掌心神血母印传回的本命饥渴震颤。\n\n这类玄煞门制式地桩既然要锁死地脉活节点，桩尖最底端必留有吸纳阴磁煞气的导气孔隙，而桩芯里头那三股九阴寒铁混精钢锻打的导磁铁脉，对二蜕煞甲虫而言便是十步外都能闻见的绝顶肥肉！\n\n只听掌心母印传回一串细密轻快的共鸣波动——地底两尺深处，头虫已循着阴磁吸气暗流绕过桩皮血煞符文，领着十九只同伴顺着桩底导气圆孔鱼贯钻进了铁桩肚腹！\n\n“开饭了，只啃铁芯，留住外皮。”\n\n陈长庚指尖母印轻轻一叩，下达指令！\n\n地底桩腹之内，二十只饿了两天的二蜕凶虫口器齐开！\n\n二蜕后的嗜铁煞甲虫牙口锋利逾越凡俗宝刃，专挑最精纯的寒铁轴芯下嘴，极细微的“咔滋、咔滋”蚕食声被厚重盐泥与地底阴风掩盖得严严实实，外层那圈血煞报警符文连半丝涟漪都没泛起来！\n\n三步开外，持旗戒备的苏清晏原本已做好了随时出手拉陈长庚暴退的准备。\n\n可一息、十息、三十息过去……\n\n乱石堆下静得像坟墓一样！\n\n直到半盏茶工夫刚满，苏清晏握着定磁主阵旗的素手猛然一震！\n\n在她的堪舆阵感之中，前方三丈外那团原本如刺猬般蓄势欲炸的狂暴九阴磁枢，就像被人从地底无声无息抽掉了整根脊梁骨，三股致命导磁回路在一瞬之间齐齐断绝，只剩下一层空荡荡的表皮灵光还在傻乎乎地空转维持假象！\n\n中窟褚横山怀里的母铃，自始至终连半声脆响都没传出去！\n\n石块后头，二十只吃得肚皮滚圆的煞甲虫顺着原路悄然退回寒铁虫瓮，三十六只虫群一只未损。\n\n陈长庚扣死瓮盖，拍了拍膝盖上的泥土站起身，回头冲苏清晏憨厚一笑：\n\n“成了。里头三根导磁铁筋已经叫虫子啃断了九成九，就剩外头一层空铁壳子，仙师验验看？”\n\n苏清晏快步上前两步，再次弹出寻脉银丝一探。\n\n银丝入土纹丝不动，先前的致命反噬感荡然无存！\n\n饶是苏清晏见惯了天阵宗诸般奇门破禁秘术，此刻抬眸看向陈长庚腰间那只破铁瓮时，清泠眸底也忍不住掀起了一丝实打实的波澜！\n\n能隔土钻孔、专噬九阴寒铁桩芯而不触动半点表层阵纹的异种灵虫，这岂是寻常外门杂役撞大运能随便喂出来的“矿坑小虫”？！\n\n这陈长庚身上藏着的水，比她想的还要深得多！\n\n但苏清晏极懂分寸，半个字没往深处盘问，反而眸中寒芒一闪，手腕翻转间抽出三面乌铁副阵旗：\n\n“桩芯既废，外皮灵纹完好，正好拿来送褚横山和后头尾巴一份大礼！”\n\n“仙师要改阵？”陈长庚眼睛一亮。\n\n“来而不往非礼也。”\n\n苏清晏踏前两步走到乱石堆边缘，素手疾挥，三面乌铁副旗呈倒品字形斜插进九阴反磁桩外围三尺石缝，指尖一缕清泠定磁劲隔空一点！\n\n“嗡！”\n\n原本朝向古阁内侧锁死苏氏血脉的残余磁极被她顺势倒转一百八十度，直接嫁接到了下方那条狂暴的地底乱磁暗流之上，再拿碎盐石重新掩平旗尾！\n\n苏清晏拍净指尖白霜，语气冷冽如冰：“表层感应灵纹已让我逆转成触踏死局。咱们进阁无碍，后头无论玄煞门还是三家派人摸过来，只要踏入石门三丈踩中暗旗，整条地脉乱磁便会顺着空桩壳子迎面炸他个粉身碎骨！”\n\n陈长庚由衷竖起大拇指：“还是仙师手黑，省了小人一颗火珠！”\n\n苏清晏冷冷瞥了他一眼，懒得计较“手黑”二字，转身迈步登上古阁门前那三级布满厚厚盐霜的青石台阶。\n\n石门高达八尺，中缝被百年凝结的灰白老卤晶封得铁桶一般，上方凹槽内刻着一道繁复的苏氏血脉锁云纹。\n\n苏清晏划破指尖，将一滴殷红鲜血按入锁云纹核心。\n\n“咔、咔咔……”\n\n尘封八十载的古老机括在石壁内部发出艰涩低沉的转动闷响，门缝老卤盐壳簌簌崩落！\n\n“机括开了，搭把手推门，留神门后积煞。”苏清晏退开半步持钎戒备。\n\n“好嘞！”\n\n陈长庚卸下扁担放在门侧凹角，胸前百炼玄铁护心镜暗暗贴实，双掌抵住冰冷刺骨的黑青石门边缘，腰胯发力缓缓往内一推！\n\n“轰隆隆……”\n\n万斤石门碾过满地碎盐渣，刚往里推开一道尺许宽的幽黑缝隙，一股陈腐苦涩、夹杂着浓重铁腥味的八十年陈年阴煞冷风猛然扑面灌出！\n\n还没等两人看清殿内祭坛轮廓——\n\n“咔嚓……铿——！！”\n\n漆黑如墨的古阁大殿正中央，突然传出一阵令人毛骨悚然的沉重精铁甲叶摩擦声！\n\n借着门缝透入的一线微弱青光，只见三丈外的石筑镇脉祭坛下方，一具盘膝枯坐了八十年、浑身上下长满半寸厚紫黑铁盐结晶、外罩残破苏氏族老云纹袍的高大尸骸，僵硬的脖颈咔吧一拧，猛然抬起了一颗闪烁着两点猩红磁火的狰狞头颅！"}, {"n": 69, "title": "古阁取图", "body": "“吼——！！！”\n\n一声完全不似活人喉咙能发出的金铁摩擦嘶吼，震得整座古阁穹顶盐霜哗啦暴落！\n\n祭坛下那具身披残破苏氏族老袍的高大遗骸双膝猛地一弹，竟连半点弯曲蓄力都没有，裹着满身半寸厚的紫黑铁盐结晶，如一尊出膛重炮般贴地横撞三丈，五根长达三寸的乌黑盐晶利爪直掏门口苏清晏咽喉！\n\n快！猛！沉！\n\n狂暴阴冷的煞风未至已刮得人面皮生疼，这具受古盐墟乱磁侵蚀了整整八十年的先辈遗骸，肉身早已被异变成了一尊不惧生死痛楚、实力堪比通窍八窍巅峰的“铁盐尸傀”！\n\n“先祖得罪了！”\n\n苏清晏眸光一凛，脚尖点地疾退三尺闪入殿门侧翼，右手宽袖一抖，三枚灌注了破禁锐气的八棱试脉铁钎成品字形电射而出，分取尸傀眉心、咽喉与左肋心窝！\n\n换作寻常通窍八窍血肉之躯，这一记三连破禁钎足以将其钉穿成筛子！\n\n然而——\n\n“铛！铛！铛！！！”\n\n三声震耳欲聋的金铁交击脆响在狭窄石殿内炸出三团刺目火星！\n\n那三枚无坚不摧的百炼铁钎扎在铁盐尸傀覆盖着紫黑盐甲的眉心与胸肋上，竟像撞上了三尺厚的实心乌钢锭，连半寸皮壳都没能破开，当场被狂暴反震力崩得倒飞出去！\n\n“什么？！全身矿化成精铁盐甲了？！”\n\n苏清晏脸色微变，刚要横移换位再起困阵，左腕经脉旧伤受殿内八十年郁积阴煞猛烈一激，第三息换气骤然一滞，半边左肩瞬间酸麻慢了半拍！\n\n而那尊铁盐尸傀对她怀里的苏氏血脉气息敏感到了极点，双目猩红磁火暴涨，一步踏碎脚下青石砖，蒲扇大的紫黑利爪带着千钧巨力当头朝苏清晏天灵盖拍落！\n\n距离不足三尺，避无可避！\n\n苏清晏银牙紧咬，左手已扣住最后一张压箱底的自损灵符——\n\n“仙师退后，我来架住它！！”\n\n一声低喝如闷雷滚过门边！\n\n早在三枚铁钎崩飞火星的那一刹，守在门侧炭箱旁的陈长庚便已看穿这铁疙瘩绝非寻常利刃能破，右手五指如钩猛地掀开左侧那只试阵铁木炭箱的顶盖，隔着表层废炭朝着箱底重重一拍！\n\n“咔嚓——嗡！！”\n\n机括母簧应声弹开！\n\n一尊通体糊满三层干硬乌卤黑泥、看不出半点原本纹路与天阵宗外围残徽的三百斤粗壮人形铜偶，胸口暗槽内两钱无瑕髓晶轰然亮起狂暴白芒，顺着陈长庚一托之力如猛虎出柙般横跨两步，双臂交叉成盾，硬生生迎着铁盐尸傀拍落的双爪正面悍撞上去！\n\n“咚——！！！！”\n\n沉闷如攻城槌撞钟的恐怖巨响震得古阁石柱簌簌发抖！\n\n铁盐尸傀足以拍碎千斤巨石的一双紫黑利爪，结结实实抠进青铜机括盾偶双臂厚实的黑泥铜板里！\n\n三百斤重的盾偶双足在青石地上硬生生犁出两道寸许深的白印，表面糊着的三层加料乌卤黑泥虽被抓裂几道白痕，却如生漆铁壳般牢牢粘死在铜胎表层，分毫未曾剥落露出底下的残缺徽记！\n\n紧接着，嵌足两钱髓晶的二阶机括铁臂猛然向内一合，“咔吧”一声反将铁盐尸傀的两条手腕牢牢钳死在胸前！\n\n“古墟外围淘换的烂泥铜偶，撑不了五息！”\n\n陈长庚嘴上喊着藏拙的场面话，整个人却在盾偶锁死尸傀双爪的同一瞬动了！\n\n铁盐尸傀被钳住双手，暴怒张开黑洞洞的大嘴，一股恶臭刺鼻的灰黑老卤尸气喷涌欲出，脖颈猛地往后一仰！\n\n就在它仰头喷气的那半息！\n\n一直借着殿角微光紧盯尸傀周身盐霜纹路的陈长庚，眼底寒电骤然一闪！\n\n在乌卤盐场熬了三年毒盐，没人比他更清楚老卤结晶的脾性——卤壳结得越厚越硬，里头积攒的狂暴地火阴煞就越需要一个排气口，否则早就把尸身自己撑炸了！\n\n这尸傀全身上下紫黑盐甲浑然一体，唯独下巴颌骨正下方与喉结交界的那一寸凹陷处，因为常年往外排泄尸煞浊气，没有结出半粒紫黑硬晶，只覆着一层灰扑扑的软泥皮膜！\n\n那就是它全身唯一没矿化的命门死穴！\n\n“死！”\n\n陈长庚半个字废话没有，趁苏清晏退向祭坛侧翼视线受阻的刹那，脚下草鞋猛一蹬地，周身通窍八窍圆满的近三千斤暗金横练爆发力凝而不发、全数收束于右臂寸劲之中！\n\n他整个人几乎贴着青铜盾偶宽阔的后背欺入铁盐尸傀怀里，右手袖底滑出的九寸三分“百炼乌金破甲分水刺”化作一道肉眼难辨的乌黑毒龙，自下而上，刁钻至极地对准尸傀下颌那处灰白泄煞软孔狠狠一刺贯入！\n\n“噗嗤——！！”\n\n没有丝毫金铁阻滞的脆响，就像滚烫尖刀捅穿了一层腐烂牛皮！\n\n九寸三分的锋锐三棱乌金刺直没至柄，从下颌软孔斜穿而入，当场搅碎了尸傀颅骨正中那团凝聚了八十年的核桃大赤黑磁煞核！\n\n“嗬……嗬……”\n\n凶威滔天的八窍巅峰铁盐尸傀浑身猛地一僵！\n\n眼眶里那两点猩红磁火剧烈闪烁了两下，如同被掐灭的灯芯般倏然熄灭，喉咙里积攒的阴煞黑烟顺着分水刺血槽嗤嗤泄空，庞大的矿化铁躯推金山倒玉柱般轰然跪倒在地，再无半点声息！\n\n陈长庚手腕一拧抽出乌金分水刺，甩净刺尖一滴腥臭黑液收回右袖，紧接着反手按停青铜机括盾偶胸口机括，像搬铁坨子似的将这尊立下大功、黑泥外皮依旧结结实实的盾偶重塞回试阵炭箱底层，抓过两把定磁废炭盖得密不透风。\n\n一套动作行云流水，前后不到十息！\n\n站在祭坛右侧的苏清晏刚刚压下左脉翻腾的气血，转头看见已然跪毙的铁盐尸傀与正低头捆炭箱绳子的陈长庚，清冷眸光在炭箱边缘停了一瞬。\n\n能正面硬扛八窍巅峰尸傀一击而不散架的古铜偶，再加上刚才那一刺直取泄煞气孔的刁钻眼力……\n\n她没去追问铜偶哪来的，只当是这小子早年淘来的残损古傀，轻轻吐出一口浊气：“多谢。若非你看出它颌下留着泄煞口，今日非得毁掉半座古阁不可。”\n\n“小人天天在盐灶底下刮卤壳，哪儿漏气结不了硬痂一眼就能瞅见，算不得真本事。”\n\n陈长庚憨厚摆手，识趣地退到殿门内侧抱臂守门，连往祭坛上多瞄一眼的贪相都没有，“仙师先办正事要紧，外头说不准什么时候就有尾巴摸过来。”\n\n苏清晏颔首，转身步上三级石筑镇脉祭坛。\n\n对着下方族老遗骸郑重敛衽行了三拜大礼，她这才伸出素手，捧起祭坛正中一方由定磁白玉镇压的暗金兽皮半卷。\n\n展开一角，繁复精密的山川地脉古篆流转着温润微光——正是苏氏断绝八十载的核心传承《地脉堪舆总图》残卷！\n\n苏清晏素来古井无波的清冷眉眼间，终于浮起一抹如释重负的微澜，珍而重之地将兽皮残卷贴身收入内襟皮囊。\n\n紧接着，她没有半点拖泥带水，转身指向祭坛左侧石案上摆放的余下陪葬旧物：\n\n那里整整齐齐放着三只巴掌大小、通体由极品万年玄冰玉髓雕成、盒盖刻满锁灵古篆的“上古寒玉封匣”，以及旁边一只用隔磁蛟皮缝制、沉甸甸装满紫金色晶粒碎泥的鼓胀皮袋；右侧则只有两枚早已因岁月久远灵气散尽的废丹瓶。\n\n“我苏氏先祖入墟前曾替宗门采炼地底老髓，那两瓶丹药已化灰作废，唯独这三只锁灵寒玉封匣完好如初，皮袋里装的是先祖当年刮取积攒的一整袋‘百年凝卤髓渣’。”\n\n苏清晏素手一拂，将三只上古寒玉封匣与那只沉甸甸的蛟皮袋一并推到石案边缘，语气干脆利落：\n\n“本座既已收回《地脉堪舆总图》，按入廊前立下的三七契约，坛上其余完好遗物，全归你抵账。”\n\n守在门边的陈长庚呼吸几不可察地微微一热！\n\n上古寒玉封匣！百年凝卤髓渣！\n\n苏清晏只当这三只寒玉匣是好点的装药盒子、那袋混满狂暴乱磁杂质的百年凝卤髓渣是体修拿来熬汤泡澡的粗笨辅材，可落在怀揣蚀纹石臼的陈长庚眼里，这简直是比十件极品法器还要解渴的无上重宝！\n\n他身上原有的寒玉匣早已装满七十钱髓晶，正愁进底窟捞了大货没地儿保鲜封存，这三只上古锁灵寒玉封匣简直是雪中送炭；而那一整袋沉淀了百年的高浓度凝卤髓渣，一旦等石臼冷却期满投进去提纯，析出来的无瑕道髓晶砂怕不是能直接把他喂上九窍顶峰！\n\n陈长庚脸上却只露出几分得了实惠的朴实欢喜，上前双手抱拳一揖：\n\n“仙师敞亮！这寒玉匣子拿来装药材最耐用，这袋老卤渣子回去熬水泡筋骨也正合小人的横练路子，小人就厚颜收下了！”\n\n他上前两步，先打开蛟皮袋口验了一眼——足有七八斤重的紫金老卤髓渣灵气内敛、煞气逼人，随手系紧袋口塞进储物袋，再将那三只入手冰凉彻骨的上古寒玉封匣仔细揣入怀中贴身收稳。\n\n苏清晏见他收妥，刚开口道：“古阁地处内窟侧翼，下头侧室正好压着一条地煞潮眼，你我先去侧室调息半个时辰压住伤气，天亮前再摸去内窟——”\n\n“内窟”二字尚未落地！\n\n“轰隆隆隆——！！！！”\n\n古阁石门之外不过二十丈远、连接北岸外崖的侧道甬道处，突兀炸开一声惊天动地、仿佛整片岩壁都被生生掀翻的恐怖乱磁雷暴巨响！\n\n狂暴刺目的蓝白磁电火光穿透古阁门缝直射殿内，紧随其后的，是三声凄厉短促到极点的垂死惨叫，以及一声气急败坏、震得乱石簌簌滚落的通窍九窍强者怒吼：\n\n“该死！！谁把玄煞门的反磁桩倒插改成了绝户雷？！梁家的儿郎退后——那苏氏贱婢定躲在前头古阁里，给老子围死大门！！”"}, {"n": 70, "title": "借潮破九", "body": "乱磁雷暴的蓝白火光尚未散尽，刺鼻的焦肉恶臭已顺着古阁门缝倒灌进来！\n\n殿内祭坛旁，苏清晏左腕刚包好的裂口受狂暴磁震隔空一冲，喉头顿时涌上一股腥甜逆血，素白身形晃了半寸。\n\n“仙师退入内屏压伤，莫露气机！”\n\n陈长庚反应快如鬼魅，反手一把拉拢万斤黑青石门，只留出一道仅容单人侧身挤出的窄缝，整个人横跨一步闪出门外石阶！\n\n“郭断山是梁家豢养的通窍九窍追猎统领，你七窍修为挡不住他重锏，速退入阁！”苏清晏隔着门缝低喝，指尖已强提残气去摸阵旗。\n\n“门外乱磁还没散透，他重伤不敢硬闯！仙师快进侧室镇住逆血，小人拿火器封门！”\n\n陈长庚头也不回地飞快顶回一句，反手“哐”地将石门合死到只剩两指宽的气缝，彻底切断了殿内外的视线。\n\n石阶下三丈外的乱石缓坡上，黑烟滚滚翻腾。\n\n先前由苏清晏倒插阵旗改向的九阴反磁桩已炸出一个丈许宽的焦黑深坑，三名打头抢路的梁家通窍八窍精锐连声求饶都没喊全，便被狂暴地脉磁雷撕成了满坡焦碎尸块！\n\n唯独落后半步、站在外崖侧道岩檐下的那名高大壮汉捡回了一条命。\n\n此人身高八尺，满脸横肉虬髯，正是梁世勋麾下专干黑活的九窍追猎统领郭断山！\n\n他身上那副百炼玄鳞重甲胸腹处已被炸得乌黑翻卷，头顶精铁兜鍪更是崩飞不见，满头乱发焦糊冒烟，嘴角挂着一缕血丝。\n\n可当郭断山抹去眼角血沫，看清烟尘后头竟没有半个接应伏兵、只有三个死透的手下，而古阁台阶上竟还活生生站着陈长庚这一个本该坠渊摔死的灰衣挑箱杂役时，眼底的惊愕瞬间化作了狰狞狂喜！\n\n“娘的，吓老子一跳！连你这挑箱的瘸腿狗都没摔死，看来那姓苏的贱婢果真躲在里头！”\n\n郭断山啐出一口血痰，右手一提那根足有六十斤重、布满导磁暗槽的“混磁铁锏”，一步一震踏上碎石坡，“灰衣小子，那贱婢受了反噬不敢露头了吧？”\n\n“郭、郭大统领饶命！”\n\n陈长庚脸色惨白如纸，双手紧攥着一柄三尺破岩铁钎横在胸前，脚跟一步步往石门台阶上退缩，声音直打颤，“梁少主不是随霍师兄去中窟了吗？小人跟苏客卿掉下断桥九死一生，可没得罪梁家啊！”\n\n“少他娘的装蒜！”\n\n郭断山一边狞笑着逼近五步之内，一边借着说话偷偷调匀被反磁桩震乱的一口九窍真气，“我家少主早防着那贱婢在北岸桥尾命硬摔不死，特命老子带寻血盘顺着她在断桥头震裂旧伤留下的血气摸进这条外崖侧道！”\n\n他贪婪地舔了舔干裂嘴唇，铁锏遥指陈长庚鼻尖：“识相的现在滚去把石门撞开！等老子拿住那姓苏的孤女回营逼她交出阵图、给少主暖了床，赏你两条囫囵腿爬出去！”\n\n“大统领说真的？真能饶小人一命？”陈长庚喉结艰难滚动，握铁钎的双手抖得像筛糠，像是心动到了极点。\n\n“废话！老子一口唾沫一颗钉，快闪开！”郭断山脚步再欺两步，距离台阶已不足一丈！\n\n“那……那小人这就去推门，大统领您先收了铁锏……”\n\n陈长庚嘴上赔着讨好苦笑，半转过身作势要去摸门环。\n\n就在他侧身露出一线空档的刹那，郭断山眼底凶光骤爆！\n\n留个外门杂役活口分功走漏私擒客卿的风声？蠢货才信！\n\n“去阎王殿推门吧，蠢材！！”\n\n郭断山一声暴喝，脚下重靴猛踏青石，通窍九窍的狂暴煞劲轰然灌入六十斤混磁铁锏，锏身三处导磁枢孔嗡嗡吸聚四周残余乱磁，化作一道乌黑残影当头直砸陈长庚天灵盖！\n\n这一锏势大力沉，寻常通窍七窍修士擦着半点就得脑浆迸裂！\n\n然而，早在郭断山眼神起杀机的前半息，背对半边身子的陈长庚右手拇指已在腰间寒铁虫瓮盖上一抚而过！\n\n“去！”\n\n八道米粒大小的暗金黑影借着坡上尚未散尽的焦黑浓烟掩护，快如电火般迎面射入混磁铁锏中段那三枚正在吸气的导磁枢孔！\n\n二次蜕壳的嗜铁煞甲虫一口便狠狠咬死在精钢磁簧卡扣上！\n\n“咔——嗡？！”\n\n半空中势在必得的郭断山手腕猛地一抖！\n\n混磁铁锏内部原本顺畅流转的磁暴增幅劲竟冷不防卡壳逆冲，六十斤重锏在半空硬生生往斜下方偏了三寸有余！\n\n“铛——咔嚓！！”\n\n陈长庚顺势横起手中百炼破岩铁钎一架，偏斜的铁锏砸断铁钎，余下四成沉雄震劲结结实实轰在他前胸灰麻旧袄上！\n\n旧袄之内，前一个时辰刚从废卤坑缴获穿妥的“百炼玄铁护心镜”猛然凹陷半寸，暗金横练筋骨微震便将残劲卸了个干干净净！\n\n陈长庚却在挨砸的同一瞬自己舌尖一咬！\n\n“噗——！”\n\n一口滚烫鲜血狂喷三尺，他整个人如同断线风筝般仰面栽倒在三级石阶上，怀里铁钎脱手飞出，胸前衣襟染得一片血红，挣扎着往后直蹬腿：“呃……护心铁碎了……别杀我……”\n\n一锏未曾砸碎脑袋，郭断山原本还有半分惊疑，此刻一见这小子口喷鲜血瘫软如泥、连兵器都撒了手，最后一点戒心顿时荡然无存！\n\n“算你小子走运，铁锏吸歪了一丝乱磁！再吃老子一记补锤！”\n\n郭断山狂笑跨上台阶，根本不给陈长庚喘气的机会，魁梧身躯欺近至不足三尺，蒲扇大手一把揪向陈长庚衣领，右手铁锏高举过顶对着他咽喉狠砸而下！\n\n头无兜鍪遮护，相距不足三尺，旧力刚发、新力未收！\n\n台阶上原本满眼恐惧的陈长庚，眼底的慌乱在这一刹退得干干净净，只剩下一片看死人般的森寒漠然。\n\n“赏你的，接稳了。”\n\n陈长庚指尖神血母印微扣，先将锏孔内八只煞甲虫瞬息召回袖底，紧贴地面的左手五指如毒蛇翻腕，两枚刻满双层引火槽、塞足三倍赤磷硫精的“过载烈阳火珠”已被拇指甲盖当场刮燃，贴着郭断山探来的下巴颏子迎面狠狠拍了上去！\n\n“什么玩意儿——不！！”\n\n嗅到那股令人魂飞魄散的狂暴赤磷毁灭气息，郭断山瞳孔骤缩欲裂，拼命想仰头暴退！\n\n两尺距离，神仙难逃！\n\n陈长庚双腿猛蹬石阶借力往门侧凹槽一缩，顺手抄起靠墙的生铁扁担护住头脸！\n\n“轰隆——轰隆！！！！”\n\n两团足以掀翻九窍护体罡气的刺目赤白火球，贴着郭断山毫无防护的面门连环炸开！\n\n狂暴火浪混着万千烧红的破甲铁砂瞬间吞没了整片石阶，更将后方本就被反磁桩震酥的外崖侧道岩檐震得轰然坍塌！\n\n烟尘碎石足足落了十息才渐渐平息。\n\n陈长庚拍落灰麻袄上的火星站起身，眼神冷冽地走到石阶下。\n\n不可一世的梁家九窍统领郭断山还保持着半跪前扑的姿势，脖颈以上连同半边肩膀已彻彻底底炸成了焦黑碎炭，沉重尸躯晃了晃，“扑通”栽倒在地！\n\n五枚过载烈阳火珠耗去两枚，左肋暗囊内尚稳稳留着三枚压箱底。\n\n陈长庚手脚麻利至极，三两下摸遍郭断山与坡下残尸，将八枚完好无损的下品灵石收进贴身暗袋，又把那面炸裂的寻血罗盘与梁家腰牌砸成碎末，连同四具尸首一并拖进坍塌的东来岔道口，再抡起生铁扁担撬落几块数千斤的断崖巨岩，把那条外崖侧道堵得连只耗子都钻不过来！\n\n撒净石灰盖死血腥味，陈长庚这才拎起门外两只完好无损的试阵铁木炭箱，推门闪回古阁大殿。\n\n殿内镇脉祭坛后方，刚刚压住左脉逆血的苏清晏听见动静转出石屏，清冷目光扫过陈长庚胸前那片逼真的血迹与凹陷的护心铁镜，眉梢微动：\n\n“郭断山死了？”\n\n“托仙师门外那根倒插反磁桩的洪福。”\n\n陈长庚捂着胸口喘了两口气，半真半假地苦笑道，“那厮冲上来时早被磁雷炸去了半条命，一锏砸裂了小人刚捡的护心镜，小人趁他轻敌贴脸，咬牙把压箱底的两颗保命火珠全糊他脸上了，顺带震塌了东头那条外崖侧道，尸首都埋严实了。”\n\n苏清晏看了看他苍白却平稳的气色，丝毫没有怀疑一个七窍体修能正面硬杀全盛九窍统领，只当是反磁桩重创在前、火器偷袭在后才侥幸得手。\n\n她轻轻颔首，指向大殿左右两侧紧闭的石室小门：\n\n“干得干净。此刻已过戌末，距天亮尚有四个时辰。西侧静室归我参悟先祖残图、调平旧伤；东侧那间石室正压着古阁地煞潮眼，你进去歇息养伤，明日卯初准时动身穿过侧翼隘口赴中窟。”\n\n“多谢仙师体恤！”\n\n陈长庚抱拳应下，挑着两只炭箱迈入东侧石室，反手落下千斤断龙石栓。\n\n石室不过丈许见方，正中央一方青石蒲团底下凿着九道细密导气槽，丝丝缕缕精纯霸道的灰白地煞之气正顺着地底裂缝源源不断往上翻涌！\n\n陈长庚没有急着打坐，先从储物袋取出青铜隔味阵盘扣在石门内侧。\n\n身上碎灵石与小木盒碎晶前两日已耗得一干二净，不过方才摸尸郭断山新添了八枚下品灵石，贴身整灵石已攒到八十枚之多！\n\n他毫不心疼地摸出一枚完整下品灵石咔嚓嵌入阵盘凹槽！\n\n嗡的一声轻鸣，一层厚实无声的三尺青铜气幕瞬间张开，将整座东侧石室的气机波动与声响遮蔽得滴水不漏，只余下七十九枚整灵石贴身收稳。\n\n做完这一切，陈长庚才摸了摸左侧炭箱底部的三层乌卤黑泥，心里把时间账算得明明白白：\n\n蚀纹石臼上一轮提纯是在入墟前夜二月初三亥时，铁打的三十六个时辰冷却硬锁，一息都省不得，必得等到后天夜里二月初六亥时才能再开下一炉。\n\n他绝不干违规硬催暴露动静的蠢事，当即取出方才分账得来的三只巴掌大的上古寒玉封匣。\n\n先从旧寒玉匣七十钱存货里拨出二十钱颗粒饱满的无瑕道髓晶砂摊在掌心，将余下整整五十钱无瑕道髓晶砂尽数封入第一只上古寒玉封匣；另外两只上古寒玉封匣连同腾空的旧匣一并贴身留空，留着进底窟装真正的大家伙，至于那整袋七八斤重的“百年凝卤髓渣”，原本的隔磁蛟皮袋已锁灵八十年不泄半分煞气，照旧死死扎紧袋口收入储物袋，留待后夜冷却期满再行炼化！\n\n时间一息息滑入初四夜半子时正刻！\n\n“轰隆……”\n\n脚下百丈地肺深处，突然传来一阵低沉如万马奔腾的潮汐脉动！\n\n整座东侧石室的温度骤降三分，青石蒲团下方那九道导气槽竟喷薄出肉眼可见的灰白地煞浓雾——正是每日子时最猛烈的一波古墟地煞大潮！\n\n“八窍圆满打磨已足，又有子时地煞大潮外压淬体，二十钱无瑕髓晶在手，今日不破九窍更待何时！”\n\n陈长庚眼底精芒暴涨，盘膝坐定潮眼正中，仰头将掌心那二十钱毫无丹毒杂质的无瑕道髓晶砂分作两口尽数吞入腹中！\n\n《井煞锻骨诀》通窍终篇心法轰然催动！\n\n“轰——！！！！”\n\n二十钱极品与无瑕髓晶化作滚滚赤金洪流，在五脏六腑间掀起了滔天巨浪！\n\n外有古墟子时地煞大潮顺着周身毛孔疯狂挤压锻打皮膜筋骨，内有零丹毒的磅礴本源药力合为一柄无坚不摧的开山重锤，顺着早已贯通圆满的前八处气窍奔腾咆哮，对着眉心祖窍之下、锁死凡胎最后一重关隘的“第九处主气窍”悍然撞去！\n\n一撞！坚如顽铁的窍壁裂开千百道细纹！\n\n再撞！淤积在凡胎最深处的最后一丝晦暗浊垢被纯粹药力连根拔起！\n\n第三撞！\n\n“咔嚓——嗡！！！”\n\n仿佛九天惊雷在颅腔与气海之间同时炸响！\n\n第九处主气窍应声轰然洞开！\n\n刹那间，周身九大主气窍首尾呼应、气血贯通如江河奔涌，陈长庚全身暗金皮膜下每一块骨骼都发出清越低沉的金铁共鸣，纯粹肉身爆发力势如破竹般冲破三千五百斤大关！\n\n通窍九窍初期，成！\n\n没有半丝服用劣等净髓引的经脉灼痛，更无半分火毒淤积，根基浑厚得比内门世家嫡传还要扎实十倍！\n\n只要此番再从底窟拿到“地母玄晶”做母引，九窍连一线，便是寿享二百四十载的开脉大道！\n\n直到寅末时分，地煞潮汐渐渐退平。\n\n陈长庚缓缓吐出一口长达三尺的凝练白气，伸指轻拨胸前那枚天阵宗高阶敛息玉符。\n\n澎湃如渊的通窍九窍强横气血眨眼收敛得一干二净，外显气机滴水不漏地重新锁死在那个“略带暗伤疲态的通窍七窍初阶”表象之上。\n\n收起青铜隔味阵盘，挑稳两只铁木炭箱拉开石栓迈出静室时，西侧石室的门也恰好推开。\n\n苏清晏换了一袭干净素白内袖，虽脸色仍有一分清减，双眸却因参透先祖残图而格外清亮锐利。\n\n她扫了陈长庚一眼：“伤势可碍挑箱？”\n\n“回仙师，歇了一宿，挑两百斤炭箱健步如飞！”陈长庚憨厚拍了拍扁担。\n\n“好。入墟已满十二个时辰，此刻正是二月初五卯初，随我走侧道去中窟。”\n\n两人不再耽搁，沿着古阁北侧一条仅容一人通行的天然岩壁裂隙快步穿行。\n\n走了不足两刻钟，前头灰雾渐稀，一扇紧贴断渊峭壁的风化西廊石隘口豁然出现在眼前！\n\n然而，不等苏清晏与陈长庚一脚跨出石隘门槛——\n\n“轰隆隆隆——！！！！”\n\n脚下整座沉渊古盐墟大地猛然剧烈震颤起来！\n\n一股浓烈到化作实质的赤红血煞霞光骤然自前方百丈外的中窟高台冲霄而起，瞬间将灰白乱磁穹顶映得一片血红，奇异霸道的幽冷莲香顺着热浪席卷四方！\n\n伴随异象一同炸开的，还有中窟断渊南北两岸同时爆发的五股通窍九窍巅峰滔天杀气与震耳欲聋的兵刃咆哮声：\n\n“赤煞伴生莲提前开瓣了！！列阵封死南岸，谁敢越雷池一步格杀勿论——！！”"}, {"n": 71, "title": "莲台群狼", "body": "赤红霞光撞碎中窟穹顶灰雾，五股通窍九窍巅峰的狂暴杀气隔着黑水沟轰然对撞！\n\n陈长庚挑着两只铁木炭箱，随苏清晏穿过狭长岩缝踏出西廊石隘口，脚底盐岩震得麻草鞋直发麻。\n\n眼前是一座百丈宽的塌陷地渊。\n\n渊心孤耸着一根十丈高的漏斗状赤黑石柱，柱顶碗口状的乱磁气障翻涌着刺目血霞，一股甜腻带铁腥的异香扑面灌来——正是提前舒展花瓣的赤煞伴生莲！\n\n石柱四周环绕着四五丈宽的黑卤护城沟，墨绿毒卤翻滚着尺许高的大泡，溅上岸的沫子把青石蚀出白烟。\n\n沟北高坡上，玄煞门褚横山拄着重戟稳坐虎皮石，身侧血河宗樊九皋正拿舌尖舔着弯刀血槽，背后六十余名黑衣血袍悍匪杀气森然。\n\n沟南岩坪这边，霍千山横提无锋重剑立在中军，曹无极与梁世勋分据左右，身后只剩四十来名带伤的云泽宗精锐。\n\n两边正剑拔弩张，冷不防西侧石隘口灰影一晃，走出一白一灰两道活人身影！\n\n“谁？！”\n\n南岸西侧几名梁家护卫骇然拔刀。\n\n摇着铁骨折扇的梁世勋猛地扭头，看清素白衣袂的苏清晏与后头挑着封条炭箱的陈长庚，眼珠子差点瞪出眼眶！\n\n“苏清晏？还有你这挑箱杂役？！”\n\n曹无极也捂着烧焦半截的袖口转过身，三角眼死死盯住那两只铁木炭箱：“北岸桥尾塌下百丈黑渊，你们两个怎么没摔成肉泥？！”\n\n陈长庚心里冷笑一声。\n\n盼着爷死的人多了，可惜阎王爷嫌你们曹、梁两家的命更肥。\n\n他脸上却是一副刚从鬼门关爬出来的惊恐相，双膝发软似的晃了晃，左手死死捂住染满干涸血迹的前胸灰麻袄。\n\n梁世勋往隘口黑漆漆的裂隙深处一扫，没瞧见半个自家追兵，脸色瞬间阴沉下来。\n\n他昨晚刚上北岸，便私派九窍统领郭断山带着三名八窍好手顺外崖侧道去摸苏清晏的尸首与血气，如今正主儿活蹦乱跳钻出来，郭断山四个大活人却连个影都没传回来！\n\n“苏客卿命倒是硬。”\n\n梁世勋合拢折扇逼近两步，皮笑肉不笑地拿话探底：“你们既从外崖西廊爬上来，半道上可曾撞见本公子派去接应你们的四名巡崖护卫？”\n\n不等苏清晏冷脸开口，梁世勋又转头朝霍千山拔高嗓门拱火：\n\n“霍师兄！伴生莲已经开瓣，对岸褚横山和樊九皋正等着抢摘！既然寻脉馆的人没死，还不快命她立刻下沟破开柱顶磁障，免得夜长梦多！”\n\n“不错！”曹无极立刻帮腔，“养兵千日用兵一时，苏客卿该不会想捏着破阵手段坐地起价吧？”\n\n一顶顶大帽子迎头扣下，分明是想拿苏清晏去蹚对岸两派的刀口，顺带逼问郭断山的死活！\n\n苏清晏眉心微蹙，指尖刚搭上八棱试脉铁钎。\n\n“扑通！”\n\n后半步的陈长庚根本不接梁世勋的茬，扁担往脚边一卸，越过梁、曹二人对着主位上的霍千山重重跪倒，嘶哑哭喊起来：\n\n“霍大老爷救命啊！西廊底下全是玄煞门褚老魔埋下的杀才，压根没有什么接应护卫啊！”\n\n全场目光刷地聚了过来。\n\n梁世勋眼皮猛跳，厉喝道：“胡说八道！西廊怎会有褚横山的人？你把本公子的人怎么了？！”\n\n陈长庚缩着脖子打了个哆嗦，慌忙从怀里掏出半块崩碎缺角、还黏着黑红血痂的玄煞门乌铜腰牌，高高举过头顶：\n\n“梁少主冤枉死小人了！昨日桥尾炸塌，小人拼死拽着苏仙师挂在崖底半截老盐台上，顺着排烟废缝往这头爬！”\n\n“谁知才摸到半道，迎头就撞见三队玄煞门黑衣刀客，正押着几具穿咱们云泽宗衣裳的无头尸首往暗坑里填！”\n\n陈长庚一边喘粗气，一边拍着胸口凹陷半寸的护心铁板，哐哐作响：“小人挨了一记重劈，把攒了半辈子的两颗保命火珠全炸了震塌洞顶，这才背着苏仙师钻出来！这块黑铜牌就是从炸死的玄煞门探子腰上扯下来的！”\n\n霍千山伸手摄过那半块染血乌铜牌。\n\n正面狰狞的玄煞鬼头徽记做不得假，断口处还残留着烈阳火器灼烧的焦黑硫腥！\n\n梁世勋身旁，包着半边血头皮的钱老头脸色煞白，凑到他耳边急促低语：“少主！郭统领四个准是一头扎进褚横山的西廊口袋阵，遭了毒手了！”\n\n梁世勋胸口剧烈起伏，一口恶气直冲脑门！\n\n四个贴身精锐，外加一面价值二十枚灵石的寻血盘，全折在玄煞门手里了！\n\n他猛地转头瞪向黑卤沟北岸，咬牙切齿道：“褚横山！你好狠毒的手段，连外崖暗道都埋了伏兵截杀我梁家儿郎！”\n\n对岸虎皮石上，褚横山压根不知西偏廊哨队早被陈长庚扬成了灰，闻言只当手底下哪路游哨立了功，提着重戟哈哈狞笑：\n\n“乳臭未干的小兔崽子，你梁家蠢狗自己撞上老子的刀口，死了也是白死！有种现在跳下黑卤沟来替他们收尸？”\n\n这一句狂笑认账，把郭断山四人的死因钉得死死的！\n\n梁世勋气得铁扇骨咔咔作响，隔沟破口痛骂，再没往陈长庚这“七窍残废杂役”身上多疑半点。\n\n早先钻岩缝赶路加上这一番拔刀盘诘、验牌对质与隔沟叫骂，不知不觉已耗去大半个时辰，时刻滑入了二月初五辰初。\n\n霍千山随手捏碎半块残牌，沉声看向苏清晏：“苏客卿，褚老魔就在对岸虎视眈眈，这柱顶磁障此刻能不能破？”\n\n苏清晏看都没看梁世勋一眼，缓步走到南岸断崖边缘。\n\n她素手一扬，一缕寻脉银线迎风探出三尺，悬在翻涌而上的赤红莲雾之中，左手古铜罗盘指针急转，银线尖端“嗤”地腾起一缕紫黑毒烟！\n\n“破不得。”\n\n苏清晏收回银线，清泠嗓音传遍两岸：“此莲受昨夜子时地煞暴动刺激，虽提前撑开了外头六片赤瓣，但莲心三瓣尚呈乌紫死色。”\n\n曹无极皱眉道：“什么意思？讲明白些！”\n\n“此刻刚交辰初，离真正成熟褪毒还差足足六个时辰，必得等到今日戌初。”\n\n苏清晏淡淡扫过南北两岸红了眼的精锐：“戌初之前，谁敢强破柱顶乱磁气障，地煞倒灌入蕊，整株伴生莲三息之内便会逆化为穿肠烂肺的赤尸毒草。诸位若想抢一株废草陪葬，大可现在动手。”\n\n此言一出，南岸一片死寂。\n\n对岸樊九皋眯起毒蛇眼，伸鼻嗅了嗅风中那丝发涩的紫黑腥气，阴恻恻朝褚横山哼道：“这天阵宗的小娘皮没撒谎，莲心煞毒没化开，这会儿摘下来喂狗都嫌烂肚肠。”\n\n褚横山啐了一口浓痰，将重戟往石地上一顿：“成！老子就等六个时辰，到戌初再看这株莲花姓玄还是姓云！小的们，退后三十步扎阵歇马！”\n\n五方九窍巅峰霸主，个个都是不见兔子不撒鹰的主儿。\n\n莲花未熟，谁先下沟拼掉半条命，剩下的黄雀立刻就会扑上来吃绝户！\n\n霍千山冷哼一声，挥剑入鞘：“器堂听令，沿南岸崖口钉下三根护阵地桩！曹师弟守东翼，梁师弟守西头，戌初之前谁敢乱阵，军法从事！”\n\n一场一触即发的血拼暂时按下了火头。\n\n苏清晏借口压制旧伤，在器堂与曹家营地交界的一处风化岩凹里铺开阵垫盘膝闭目。\n\n陈长庚老老实实挑着两只炭箱退到岩凹外侧，刚弯腰要把箱子垫平，一道裹着焦糊血腥味的暗影忽然贴着他右肩擦身走过！\n\n正是领人去东翼扎营的曹无极！\n\n擦肩错身的刹那，曹无极垂在残袖里的左手快如鬼爪，一把扣住陈长庚粗糙的右手腕，将一枚三寸长、冰冷刺骨的乌黑尖钉硬塞进了他掌心！\n\n陈长庚浑身一僵，顺势低下头不敢乱动。\n\n一缕阴毒传音压在喉咙眼，顺着风声钻进他右耳：\n\n“灰衣小子，刚才在霍千山跟前挺能说会道啊？”\n\n曹无极眼角余光冷冷瞥着他，嘴唇微动：“这枚‘淬血透骨钉’，限你两个时辰，午初之前替本公子悄悄钉进霍千山中军那根东角护阵地桩底下！”\n\n“办成了，出墟赏你十枚整灵石；要是敢漏半个字或者磨洋工……本公子翻过你的外门名册，等出了古墟，乌卤盐场丙字灶跟你有过交情的老少活口，本公子叫胡彪挨个剥皮点天灯！”\n\n曹无极冷笑拍了拍陈长庚僵硬的肩膀，大摇大摆转身离去。\n\n不远处，肩头裹着厚厚血布的恶奴胡彪回头狞笑，伸出大拇指在自己脖子上狠狠一抹！\n\n陈长庚低眉垂目，粗糙五指缓缓合拢，摸了摸袖筒里那枚透着刺鼻腥气的淬血透骨钉，眼底深处浮起一抹彻骨森寒。"}, {"n": 72, "title": "双面递钉", "body": "岩凹背风处，陈长庚蹲在试阵铁木炭箱后头，借着捆扎麻绳的动作，悄悄低头瞄了一眼袖筒里的暗器。\n\n那枚“淬血透骨钉”通体由阴煞寒铁锻打，针尖泛着乌紫毒芒；最扎眼的是钉尾凹槽处，严严实实封着一圈暗红发粘、透着烤骨髓混朱砂怪味的软蜡。\n\n“曹家独门的血炼封蜡。”\n\n陈长庚前些日子在黑市跟贺九斤打听三大家底细时听过一耳朵——这封蜡平时锁死血煞剧毒不泄半点气机，一旦钉入护阵地桩受纯阳灵力激荡，蜡壳融化，毒煞便会顺着阵脉倒冲主阵之人经脉！\n\n到那时，霍千山在戌初抢莲关头吐血走火，曹无极就能顺理成章拣现成便宜！\n\n至于他这个去钉钉子的七窍苦力？\n\n霍千山手底下十几双八窍精锐的眼睛正跟鹰隼似的盯着三根赤铜地桩，他只要敢凑近三尺，当场就得被乱刀剁成肉泥；就算侥幸钉进去，事后曹无极为了灭口赖账，头一个要宰的还是他陈长庚！\n\n“拿乌卤盐场的老相识吓唬我？倒真看得起曹家的狗爪子。”\n\n陈长庚心里把账算得明镜也似。\n\n跟曹无极硬顶是找死，真去替他拔霍千山的虎须更是蠢死；想把这口黑锅甩干净，还得叫这两头恶虎自己咬起来！\n\n熬至巳初时分，盘膝调息的苏清晏睁开双眸，看了一眼黑卤沟上越升越浓的毒雾，开口道：\n\n“沟底毒瘴上翻，去南岸崖口捡四块百斤重的老卤压阵石回来，我要在岩凹外围起一道避瘴风帘。”\n\n“得令，小人这就去搬！”\n\n陈长庚眼睛微亮，瞌睡正撞上枕头！\n\n他把扁担往腋下一夹，缩着肩膀走向十丈外南岸断崖边缘。\n\n二十步开外，曹家营地前抱着鬼头刀监工的胡彪远远盯住陈长庚的背影，嘴角扯出一抹残忍冷笑。\n\n断崖南沿，三根碗口粗、刻满纯阳火纹的赤铜护阵地桩呈品字形深深楔入盐岩。\n\n守在最东头那根地桩旁的，正是器堂通窍八窍的副手谭铸，手里提着一柄四十斤重的开山铁锤，眼神凶悍地扫视四周。\n\n陈长庚弓着腰小跑过去，离东角地桩还有五六步远，谭铸便把铁锤往地上一顿，厉声喝道：\n\n“站住！器堂重地，哪房的杂役敢往阵桩跟前瞎摸？滚远些！”\n\n“谭师兄息怒，千万别动手！”\n\n陈长庚吓得连忙刹住草鞋，满脸堆着卑微苦笑，指了指断崖边沿散落的几块灰白大盐石：“苏客卿左腕旧伤犯了，命小人来崖边搬四块老卤石回去压阵旗！小人就在边上捡烂石头，绝不敢沾贵堂阵桩半寸！”\n\n谭铸回头扫了一眼岩凹里冷若冰霜的苏清晏。\n\n戌初夺莲还得指望这位天阵宗客卿破禁，霍师兄交待过不许无故招惹寻脉馆，谭铸这才不耐烦地挥了挥铁锤：\n\n“滚去东侧崖边捡！爪子放老实点，敢碰歪一根引阵铜丝，老子一锤砸烂你的狗爪！”\n\n“是是是！多谢谭师兄行方便！”\n\n陈长庚连连作揖，猫着腰退到东角地桩斜后方四尺外的碎石堆旁。\n\n趁着弯腰伸手去抠灰白卤石的刹那，他藏在右袖里的拇指甲盖对着淬血透骨钉尾部轻轻一刮！\n\n绿豆大小的一抹暗红血炼封蜡悄无声息粘在指肚上，未损钉身半点禁制，紧接着反手往引阵铜丝旁一块尖利碎石底面一抹、一按！\n\n动作快得连半息都没用上！\n\n陈长庚咬牙抱起崖沿一块百二十斤重的老卤石，起身时右脚草鞋“吃不住劲”往旁一滑，啪嗒一声将那块粘了血蜡的碎石踢翻了半个跟头，刚好滚到引阵铜丝寸许之外！\n\n“蠢材！连块石头都抱不稳？！”谭铸勃然变色，横锤跨上一步。\n\n“小人该死！小人腿软，这就滚、这就滚！”\n\n陈长庚吓得脸白如纸，抱着百斤巨石连头都不敢回；可在俯身发力的那一瞬，他眼角余光已顺着断崖毒雾缝隙，把崖底水线之上三丈处的地形瞧了个底朝天——\n\n就在中央莲台石柱侧后方的峭壁根下，隐约露出一截坍塌大半的古代青石引卤断槽；断槽尽头紧贴着一面爬满乌黑盐痂的百年封石墙壁！\n\n跟那半张前代盐工修渠草图上画的“底窟排卤暗沟封壁”，分毫不差！\n\n退路锁死，陈长庚心里大石落地，连跑几趟搬齐四块压阵石退回岩凹。\n\n苏清晏立起四杆避瘴小旗挡住外头视线，重新闭目养神。\n\n陈长庚缩在两只铁木炭箱后假装筛检受潮碎炭，左手探入储物袋，从十二块高纯地火精石里摸出两块鸡蛋大小、赤红滚烫的精石，铁匣内还剩十块，又从曹家先前留下的破禁铁砂袋里抓了一把生铁砂。\n\n他在盐场和丙字废渣房摸爬滚打这么久，攒闷火器的手艺早已熟极而流。\n\n不用亮火引信，只拿老卤油麻绳将两块地火精石与生铁砂死死缠紧，中间垫上一片薄薄的隔火云母片——临敌抽掉云母片往血肉窟窿里一塞，十息内便能无声无息把整具尸首闷烧成焦灰，正好省下左肋那三颗拼命用的过载烈阳火珠！\n\n将这枚新攒的闷燃地火火珠揣进右袋，时间已滑过巳末，逼近午初之限。\n\n东翼曹家营帐外，胡彪已经第三次站起身，右手按上了鬼头刀柄！\n\n陈长庚深吸一口气，往脸上抹了一把黑炭灰，借送还半袋铁砂的由头，哆哆嗦嗦摸到曹家营地侧后方的乱石影里。\n\n“办妥了？！”\n\n曹无极背着手转出石影，三角眼透着贪婪与嗜血。\n\n“曹、曹公子饶命啊！”\n\n陈长庚膝盖一软差点跪下，双手捧着那枚原封未动的淬血透骨钉递过去，嗓音抖得像秋风落叶：“不是小人惜命不干，实在下不去手啊！”\n\n曹无极脸色骤沉：“废物！你在崖边转悠了半晌，怎会下不去手？！”\n\n“
