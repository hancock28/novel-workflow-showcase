身顺着荒草丛生的西侧院墙根走去。\n\n拨开半人高的枯黄鬼针草，青石墙根底下果然嵌着一道三尺见方的生铁排灰暗口——那便是专供雨季向外清掏淤泥的“西灰口”。\n\n洞口上方悬着一扇厚达四寸、少说有千斤重的生铁闸板，全靠内壁一套锈迹斑斑的铁链绞盘吊着。只要拔掉卡轴铁销，千斤铁闸便会顺着石槽轰然砸落。\n\n陈长庚蹲下身细看滑槽内沿。\n\n本该积满老灰的石槽边干干净净，不仅有新近摩擦拽麻袋的滑痕，砖缝里还粘着两星湿润的紫红丹泥，与刚才灰堆表面撒的遮眼药末一模一样！\n\n前因后果在他脑子里瞬间串成了一条毒线。\n\n丹房里有内鬼私吞未燃尽的紫火炉底灰，拿去偷筛残药炼假丹牟利！\n\n前任杂役八成是筛灰时看破了少灰调包的猫腻，不知死活跟内鬼讨价还价要分五成脏利。结果内鬼表面答应半夜走西灰口分账送酒，反手一壶毒酒把人毒翻在石榻上，白白便宜了外头抬尸的乱葬岗！\n\n“去丹房找石百川告状？”陈长庚摇了摇头，唇角泛起一丝冷笑。\n\n那两车冷泥渣刚倒进他院里，无凭无据跑去嚷嚷，内鬼只需反咬一口“新杂役监守自盗”，石百川头一个扒了他的皮。\n\n更何况，他要的是每天足额送上门的紫火炉底肥灰喂饱蚀纹石臼，而不是把丹房搅个天翻地覆引人来查院子！\n\n腹间贴肉绑着的蚀纹石臼早在今早卯时便已蓄满第十轮潮汐灵机，此刻受院底地火支脉牵引正微微发热，陈长庚却硬生生按捺住没有开阵。\n\n毒鼠还没夹死，今晚这院墙外头不安生。\n\n赶在申初前，老马头果然隔着小窗塞进来一大包整整九十五两散碎纹银，外加半包粗盐巴，连院门都没多瞄一眼便哼着小曲下了山。\n\n陈长庚把七十五两散银埋进卧房墙角地砖下，单留二十两碎银揣在怀里备着打点，随即扛起两只空麻袋走到后院，装了满满一袋冰冷碎石渣拖到西灰口内侧半尺处垫好。\n\n他又滴了几滴水油润滑生铁绞盘，用火钳将卡轴铁销撬松到一碰即落的边缘。\n\n暮色四合，山谷硫烟与夜雾混成一片伸手不见五指的浓墨。\n\n子时刚过，万籁俱寂。\n\n卧房没点一星灯火，陈长庚身穿黑褐短衣，悄无声息贴墙立在西灰口上方的铁闸绞盘旁，全身五窍气血敛入骨髓，连呼吸都轻得几不可闻。\n\n“笃、笃、笃——笃。”\n\n西墙外荒草深处脚步轻响，三长一短的指节叩石声准时在生铁滑槽外响起！\n\n紧接着，一道用黑布巾蒙住大半张脸、身穿丹房司火灰袄的矮壮黑影蹲在洞口外，压着公鸭嗓朝黑漆漆的灰口里低唤：“姓赵的，还没死透吧？”\n\n陈长庚捏住自己喉骨，往嘴里塞了一小撮炉灰，学着前任垂死老役那副破风箱般的嘶哑气音，断断续续应道：“咳……咳咳……谁啊……”\n\n洞外黑影听见里头气若游丝，顿时发出一声幸灾乐祸的阴冷嗤笑！\n\n他这三天一直在内丹房紫火炉闭门值夜，今早刚换班出来。算准三天前给姓赵的喝下的慢发“腐肺散”该烂穿心肺了，今晚特地再带一壶烈毒药酒过来送这老贪鬼归西，顺便拿走前几日逼姓赵的筛攒下来的紫铜底砂！\n\n“少他娘的装蒜！”\n\n洞外黑影从怀里摸出一只扁腹青瓷酒壶，顺着西灰口石槽往里一推，阴恻恻低骂道：“前几日敢跟爷开口要分五成紫火灰的利，也不撒泡尿照照自己配不配！”\n\n他冷哼着催促：“看你咳得像条死狗，爷发善心给你捎了半壶加了润肺散的好烧刀子，赶紧喝一口暖暖身子，把这半个月筛出来的两袋紫铜底砂递出来！”\n\n一股甜腻发苦的药酒味顺着石槽飘进鼻端。\n\n陈长庚一闻便知，这壶酒里掺的腐肺剧毒比前任床板上的血腥味还要烈上三分，粘唇即烂喉管！\n\n“多……多谢师兄赐酒……”\n\n陈长庚在黑暗里拿起空瓷碗磕碰了一下酒壶嘴，发出咕咚倒酒的假响，喘着粗气虚弱道：“肺里疼得抬不起胳膊……两袋底砂就放在槽口里头半尺……师兄自己伸手拽一把吧……”\n\n“废物点心，等喝干了这壶酒，明儿爷就叫人来给你收尸！”\n\n洞外黑影心中大定，生怕夜长梦多，当即趴低身子，将整条右臂越过四寸厚的闸门槽口，径直朝洞内黑影里的麻袋扎口猛抓过去！\n\n一寸，五寸，整只手掌彻底探过铁闸底线，五指一把扣住了沉甸甸的麻袋绳口！\n\n“不对，怎么是冷石头——？！”\n\n黑影指腹刚摸出不对劲，黑暗中的陈长庚漆黑双眸杀机骤爆，按在生铁撬棍上的右手猛然往外一拔铁销！\n\n“咔嚓——轰哐！！！”\n\n失去绞盘挂钩的千斤生铁闸板，犹如断头台铡刀般顺着石槽狂暴砸落！\n\n洞外黑影吓得头皮炸裂，拼尽吃奶的力气亡命往外猛抽右臂！\n\n可千斤生铁下坠何等迅猛，饶是他通窍三窍的反应抽回了大半条胳膊，右手最末端的无名指与小指仍慢了半寸，被生铁闸口结结实实砸在青石底槽上！\n\n“咔嚓！噗嗤——！”\n\n骨碎肉烂的闷响混着飙射的鲜血炸开！\n\n“啊——！！我的手！我的手指头！！”\n\n矮壮黑影痛得一头栽倒在墙外乱草丛里，死死捂住齐根断掉两指、鲜血狂涌的右手手掌，疼得满地打滚，声音都变了调：“你不是老赵！老赵前天就该烂肺躺板了！你他娘的是谁？！”\n\n院墙之内，陈长庚连一步去开大门的意思都没有。\n\n他冷冷撤回铁撬棍，转身抄起门后碗口粗的生铁撞锤，照着悬挂在院门高梁上、直通山谷回音壁的防盗示警大铜钟悍然狂砸下去！\n\n“铛——铛——铛铛铛！！！”\n\n震耳欲聋的炸裂钟声瞬间撕破子夜山谷，传出二里开外！\n\n与此同时，陈长庚扯开嗓门，冲着半山腰刑律堂巡夜哨亭的方向放声嘶吼起来：\n\n“抓贼啊——！！有毛贼半夜撬丙字房西灰口，偷盗宗门丹房官灰啦！！快来执事大人拿贼啊——！！”\n\n“偷盗丹房官灰”六个字在山谷峭壁间层层回荡，犹如一道催命惊雷劈在墙外黑影天灵盖上！\n\n黑影浑身剧震，冷汗瞬间盖过了断指剧痛！\n\n私盗紫火官炉废渣炼假丹，在云泽宗外门是挑断手脚筋、废去修为扔进黑水矿坑活埋的重罪！这会儿要是被巡夜执事堵在西灰口抓个人赃并获，他十条命都不够填！\n\n“防盗铁闸……这新来的杂种怎么把锈死三年的防盗铁闸修通了？！”\n\n黑影又惊又惧，哪里还敢在墙根多留一息报复，一把扯下衣角死死勒住喷血的断指，连掉在滑槽里的两截手指头都顾不上抠，猫着腰连滚带爬窜进漆黑雾林，眨眼间逃得无影无踪！\n\n钟声余音在谷底嗡嗡回荡了半刻钟。\n\n半山腰巡夜哨亭只远远亮起两盏风灯晃了晃，连一个下来查看的护卫都没有——谁愿意大三更为了个连死三人的毒灰院跑断腿？\n\n陈长庚扔下铁锤，神色平静地走回西灰口，重新摇动绞盘将染血铁闸拉高半尺。\n\n借着火折微光，只见石槽底下躺着两截血淋淋的断指，指腹上结着一层厚实的紫红火茧，果然是常年在丹房伺候紫火官炉的司火熟手。\n\n他用生铁火钳夹起那两截断指，连同那壶未洒的腐肺毒酒一并挑到后院，随手扔进三丈深的地火暗坑，“嗤”地烧成了一缕黑烟，再回去把千斤铁闸落死内栓。\n\n次日，十一月二十一日辰时。\n\n院外准时响起铁车碾石的辘辘声。\n\n陈长庚打开生铁大门让灰车入内，四名蒙脸火工杂役老老实实推车卸货。\n\n“哗啦——！”\n\n最后两车炉灰刚一倾入石槽，一股灼热滚烫、浓烈刺鼻的暗紫硫煞热浪便扑面翻涌开来，灰堆里甚至还夹杂着不少未彻底烧化的紫红丹砂碎块！\n\n前头一名年轻火工杂役边拍车斗边小声跟同伴嘀咕：“怪了，上头管分渣的师兄今早包着右手请了病假，临歇前还黑着脸发下死话，说往后送丙字房的十车退灰，那两车紫火炉底渣半铲子都不许短……”\n\n守在廊柱阴影里的陈长庚低眉敛目，握着扫帚恭送空车出门，重新落死铁门大闩。\n\n隔门一闸，兵不血刃。\n\n从今往后，这最肥的紫火官炉底渣，算是彻底姓陈了。\n\n熬到午时正，日头毒辣，后山废渣谷空无一人。\n\n陈长庚铲起满满一竹筐滚烫纯粹的紫火炉底灰抱回青石卧房，顶死房门，从腹间解下青铜隔味阵盘平放在石榻下，往阵心凹槽轻轻按入一枚完好下品灵石。\n\n嗡！\n\n三尺淡青无形气幕瞬间张开，隔绝内外一切气息。\n\n他撬开榻下连通地火支脉的石砖缝，取出早已温热轻颤的半截蚀纹石臼按在火缝上，将整筐高浓紫火炉底灰分批尽数压入臼槽！\n\n石臼贪婪轰鸣，暗紫毒灰以远超黑石坊市散灰的速度飞快塌陷转化。\n\n一刻钟后，收尾喷薄的浓烈地火腥甜气被三尺青色气幕死死锁住，待灰白废粉筛净，陈长庚低头望向臼心，呼吸都不由得重了半分——\n\n只见巴掌大的灰扑扑臼底，赫然躺着整整四钱晶莹剔透、灵雾氤氲的无瑕道髓晶砂，足足比寻常废灰翻了一倍有余！\n\n他从储物袋取出锁灵寒玉匣，将这四钱新晶连同早先存底的二钱半晶砂一并严密封妥。\n\n手指刚合上寒玉匣盖，还没来得及去抠阵盘里的灵石——\n\n“哐！哐哐——！！”\n\n前院生铁大门外骤然炸响一阵急促嚣张的破铜锣声，紧接着纳贡院书办庞文禄尖利拿腔的喝骂声穿透硫烟直灌进屋：\n\n“丙字房陈长庚！死在屋里了吗？还不快滚出来开门，交这个月的净灰例银！”"}, {"n": 28, "title": "抹灰装咳", "body": "“哐！哐哐——！”\n\n门外铜锣敲得震天响，夹杂着皂役拿水火棍重重砸击生铁门板的闷响。\n\n青石卧房内，陈长庚动作快如闪电，不见一丝慌乱。\n\n一息抠出青铜隔味阵盘凹槽里的灵石收起气幕；两息将装有六钱半无瑕晶砂的锁灵寒玉匣塞进储物袋，连同阵盘与蚀纹石臼严严实实捆回贴腹暗带；三息翻过青石砖盖死地脉火缝，顺脚扫平地上的浮灰。\n\n“昨天辰时才进的院子，今天就上门收首月净灰例银？”\n\n陈长庚心里门儿清。\n\n什么净灰例银，不过是冯保山那老狐狸生性多疑，怕他身上还藏着漏网灵石，或是怕他在丙字房筛出了值钱废铜，特意派庞文禄来突击查房摸底！\n\n要是这会儿他面色红润、中气十足地走出去开门，庞文禄前脚回院，后脚冯保山就能再给他加派十车黑水矿渣的苦役，三天两头派人下谷刮地皮！\n\n想让纳贡院彻底断了念想，就得给他们演一出活不过开春的烂肺绝户戏！\n\n“再不滚出来，本书办叫人砸锁拿人了！”门外庞文禄不耐烦地尖声厉喝。\n\n“来……来了……大人息怒……”\n\n陈长庚捏着喉骨发出一声虚弱至极的嘶哑答应，转身一把抓起墙角簸箕里刚筛出来的无毒惨白废石粉，照着自己脸颊、眼窝与嘴唇狠抹了两把，瞬间遮去全部血色。\n\n接着他又抠起一撮乌黑湿炭泥，把十根手指的指节涂得青紫发乌！\n\n做完这些，他端起桌角瓦罐里早就泡着两根生锈铁钉与几星暗红赤铅铁锈泥渣的温腥水，猛灌一大口含在舌根底下。\n\n随即他左手抓起昨日兑好的二十两凡俗散碎纹银，右手拎起一小包刚从浅表炉渣里筛出来的二斤毛铜屑，弓着虾米腰快步走到前院。\n\n他没有直接去拔门闩，而是先站在院心赤铅硫烟最浓最呛的逆风口猛吸了半口毒烟，这才颤巍巍拉开沉重铁栓，将生铁大门扯开一道两尺宽的缝隙！\n\n“呼——！”\n\n积郁在院里的滚烫黄黑硫烟顺着门缝迎面扑出！\n\n站在门外石阶上的纳贡院掌案书办庞文禄正穿着一身浆洗挺括的皂绸直裰。\n\n他猝不及防被熏得眼泪直流，慌忙拿丝绸手帕死死捂住口鼻往后退了两步，三角眼越过陈长庚肩头就往院子里乱瞟：\n\n“好你个陈长庚，大白天的紧锁铁门干什么见不得人的勾当？敲了半天锣才挪窝，莫不是私筛丹房紫铜藏屋里了？闪开，本书办奉冯管事钧令进来查验灰槽！”\n\n身后两名挎刀皂役立刻上前一步，伸手就要推门闯院！\n\n陈长庚非但没有横身阻拦，反而顺从地把铁门大大敞开，整个人迎着风口弯下脊背，胸腹百锻劲气猛地一震咽喉！\n\n“咳……咳咳咳——噗！！”\n\n一阵撕心裂肺、犹如破风箱拉扯烂棉絮般的剧烈呛咳骤然爆发！\n\n陈长庚憋得满脸惨白泛青，一口混杂着暗红黑丝、散着浓重铁腥臭气的“烂肺毒血沫”毫无征兆喷涌而出，不偏不倚，“啪”地溅在了庞文禄刚迈上台阶的那只皂缎官靴尖上！\n\n静！\n\n院门口瞬间死寂了一息！\n\n“哎哟我的亲娘咧！！”\n\n素来洁癖惜命的庞文禄吓得脚底打瓢，像被毒蛇咬了脚背似的发出一声变调尖叫，蹭蹭蹭连退了整整三丈远，拼命在路边荒草丛上狠蹭靴尖，脸皮白得跟纸一样：“滚开！快给本官滚远点！这才进院一天你就咳黑血了？！”\n\n那两名原本准备闯院搜刮的皂役更是吓得头皮发麻，齐刷刷捂死鼻子暴退两丈开外！\n\n前天下午刚从这扇铁门里抬出去的老赵，死前就是这副眼窝青白、十指发乌、满嘴喷黑红腐血的鬼模样！院里老人谁不知道丙字房的赤铅火毒入肺烂髓，沾上病鬼一星血沫子都得折寿三年！\n\n浓黄毒烟风口下，陈长庚双膝一软跪伏在滚烫石阶上，胸膛剧烈起伏，喘一口气喉咙里就拉出一声“嘶啦”破音。\n\n他颤抖着举起十指乌紫发黑的双手，将那包二十两散碎纹银与两斤毛铜屑高高捧过头顶，连头都不敢抬：\n\n“庞、庞大人恕罪……小人昨日接十车热灰呛裂了肺管旧伤，夜里咳血不止爬不起床……”\n\n陈长庚剧喘着又磕了个头：“小人手里实在没碎灵石了，这是昨天求外院老哥换出来的二十两俗世碎银，外加筛出来的两斤毛铜渣……求大人嫌脏收下，代小人孝敬冯管事一杯润喉茶……”\n\n庞文禄躲在三丈外的上风口，眯着眼仔细打量了陈长庚两圈。\n\n只见这小子瘦得皮包骨头，一张脸惨白如死灰，十根手指头已经被赤铅毒气熏得乌黑发紫，地上那摊暗红带黑渣的血沫子更是在太阳底下冒着腥气，一丝破绽都瞧不出！\n\n再看他捧出来的东西——连块碎灵石渣子都榨不出来，只有二十两凡俗散碎银子和一包不值钱的毛铜屑！\n\n“真是个填坑的短命穷鬼，害本官白跑一趟吸两口毒烟！”\n\n庞文禄彻底断了进屋搜检的心思——屋里全是死人睡过的烂草席和剧毒赤铅灰，进去搜一圈没准还得搭上自己半条命！\n\n“去，拿铁钳把银子夹过来，铜屑倒进筐里！”庞文禄捂着丝帕厌恶挥袖。\n\n一名皂役硬着头皮憋住气，用随身长铁钎挑起那包二十两碎银和毛铜袋，在山泉水洼里涮了两遍才敢拎在手里。\n\n庞文禄隔着三丈远冷冷点指陈长庚：“听着！这二十两碎银权抵你首月净灰茶水钱！冯管事仁厚，看你这副烂肺相也不给你加派外差了，每月底五十斤废紫铜屑一两不准少！”\n\n他拿丝帕掩着鼻子退下半级台阶：“真要咽气了，趁早拉响门外这口报丧钟，别烂在石榻上没人收尸！我们走！”\n\n说完，庞文禄一甩袍袖，带着两名皂役像逃瘟疫一样头也不回地冲上了出谷石阶。\n\n陈长庚趴在台阶上又撕心裂肺咳了几声，直到三人的身影彻底消失在山拗拐角，才撑着门框慢吞吞关拢生铁大门，重新落死千斤铁闩。\n\n半个时辰后，纳贡院正堂偏厅。\n\n换了一双干净官靴的庞文禄捧着账册跨进门槛，将那二十两洗净的碎纹银放在案角，低声回禀：“启禀管事大人，小的亲自去丙字废渣房验过了。那陈长庚家底确已刮得干干净净，连交例钱都是拿俗世碎银凑的。”\n\n太师椅上，冯保山捧着茶壶抬了抬眼皮：“人可还老实？”\n\n庞文禄撇嘴摇头：“本身就有盐场旧伤，昨日接了十车赤铅热灰当场毒发烂肺，刚开门就喷了一地黑红毒血，十指乌紫，怕是连今年腊月都熬不过去。”\n\n冯保山慢悠悠呷了一口紫砂壶里的灵茶，满意地眯起细眼：“嗯，老实耐耗，又是个活不久的短命鬼，省得日后生出事端。”\n\n他放下茶壶淡淡吩咐：“既是快死的人了，往后院里就不必再派人下谷查房沾那份毒气，等哪天报丧钟响了，再去测窍台挑个新替死鬼便是。”\n\n他随手提笔，在杂役花名册“陈长庚”三字旁边重重画了一个代表死棋的墨黑圆圈，合上册子扔进了底格。\n\n夜幕降临，废渣谷底彻底成了被人遗忘的孤岛。\n\n青石卧房内，陈长庚舀起半瓢冷水往脸上一泼，随手拿粗麻布一抹。\n\n惨白石粉与指节乌炭尽数褪去，露出一张棱角分明、气血内敛沉凝的冷峻少年面庞；再漱口吐净舌底铁锈腥水，漆黑双眸在油灯下亮得惊人，哪有一丝将死病鬼的影子！\n\n“二十两俗世碎银，买冯保山在花名册上画个死人圈，值了。”\n\n陈长庚吹熄油灯，检查了一遍西灰口与院门铁闩，回到石榻上盘膝坐定，再次往青铜隔味阵盘凹槽按入一枚灵石撑开三尺气幕。\n\n打开锁灵寒玉匣，六钱半莹白如雪的无瑕道髓晶砂静静散发着温润灵雾。\n\n入外门短短两日，前有卢耀卢成虎视眈眈，后有丹房暗鬼与纳贡院盘剥，通窍五窍巅峰的修为还是不够稳妥！\n\n陈长庚毫不吝惜，用小竹匙从匣中精准舀出整整三钱无瑕道髓晶砂，顺手合拢还剩三钱半晶砂的寒玉匣盖收进储物袋，仰起头一口尽数吞入腹中！\n\n晶砂入喉即化！\n\n没有劣等净髓引的狂暴丹毒，也不用分心压制任何火煞排异，一股比前五窍加起来还要雄浑纯厚的暖流轰然自腹中炸开！\n\n陈长庚双手结印，体内《引火行气诀》与《井煞锻骨功》同时催动到极致！\n\n轰隆隆——！\n\n五处早已打磨得圆满如汞的主气窍齐齐震鸣，滚烫精纯的气血洪流顺着百锻铁骨经络奔腾咆哮，化作一柄无坚不摧的开山重锤，朝着胸口右侧紧闭的第六处主气窍壁垒悍然撞去！\n\n一撞，壁垒龟裂！\n\n再撞，碎障尽融！\n\n足足过了半个时辰，随着陈长庚脊柱深处传出一连串低沉如闷雷的骨节爆鸣，第六处主气窍轰然洞开！\n\n刹那间，六窍气血首尾相连，在他四肢百骸间掀起一阵滔天巨浪，周身熟铁般的百锻皮膜表面更是浮起一层温润内敛的暗金微泽，举手投足间气力暴涨近千斤！\n\n因有青铜隔味阵盘与锻骨锁气劲双重封锁，这破境动静连石榻三尺之外都没漏出一丝。\n\n陈长庚缓缓睁开双目，吐出一口绵长浊气，刚准备收起阵盘歇息——\n\n通窍第六窍贯通后暴涨近倍的敏锐耳力，忽然捕捉到了一丝极不对劲的地下震颤！\n\n他脸色微变，猛地俯身将耳朵贴在冰冷的青石地面上凝神细听。\n\n只听隔着厚厚岩层，后院三丈深的地火排渣坑最底部，正源源不断传上来一阵密集诡异、犹如成百上千只春蚕正在黑夜里齐齐啃噬生铁的“咔嚓、咔嚓”声！"}, {"n": 29, "title": "坑底收虫", "body": "“咔嚓……咔嚓咔嚓……”\n\n那声音细碎却极有韧劲，每一声轻响都伴随着一丝细微的金铁崩裂震动，正从地火坑最底部的阵基方向传来！\n\n陈长庚眼神骤凛，瞬间收妥寒玉匣与隔味阵盘捆回腹间，右手扣住袖内淬毒分水刺，提着一盏防风油灯快步来到后院石棚。\n\n掀开排灰长槽尽头的上层铁盖，一股比白日更加燥热的硫磺地火浪扑面涌出。\n\n陈长庚将麻绳一端系死在石柱上，纵身一跃，如灵猿般悄无声息滑落到三丈深的幽暗地火坑底。\n\n坑底不足两丈见方，脚下是焦黑滚烫的火成岩，裂口处横封着十二根手腕粗百炼玄铁柱铸成的“锁火护阵栅栏”。\n\n这道铁栅锁着整条支脉的地火喷发口，一旦栅栏损毁导致地火倒灌炸坑，独管丙字房的他必按“损毁宗门灵脉”论处，十死无生！\n\n陈长庚举高风灯照向铁栅根部，瞳孔猛地一缩！\n\n只见右侧排渣岩缝的一块垫脚石板不知何时裂开了一道豁口，里头堆积着一团早已风化破裂的暗红伴生矿卵残壳——显然是前几个月丹房炼器炼丹时当废渣一并倒下来的弃物。\n\n可在这终年赤铅毒灰覆盖、地火浓煞熏烤的绝地里，那团废矿卵竟被硬生生温养孵化了！\n\n昏黄灯影下，整整三十六只拇指大小、背甲乌黑如黑铁浇铸的扁平甲虫，正密密麻麻扒在锁火护阵栅栏根部疯狂啃咬！\n\n它们生着一对锯齿暗金口器，其中两根主承重玄铁柱根部已被啃出过半缺口，暗红地火苗正顺着缺口滋滋往外蹿火星！\n\n最多再啃一个时辰，整座锁火铁栅就会彻底崩断！\n\n“找死！”\n\n陈长庚毫不犹豫欺身上前，体内刚突破的通窍第六窍气血轰然灌入右臂，七寸精铁淬毒分水刺化作一道乌黑残影，照着最外围一只扑上岩台的大号铁甲虫背壳悍然劈落！\n\n“叮——！！”\n\n一声刺耳金铁脆鸣在坑底炸响，火星四溅！\n\n足以洞穿五窍修士护体劲气的百炼精铁分水刺，劈在甲虫背壳上竟被高高弹开，虫背上仅仅留下了一道肉眼难辨的浅白印子！\n\n非但没能破防，这一记清脆的金铁震音反而彻底激怒了整窝凶物！\n\n“嗡——！！”\n\n三十六只黑铁甲虫齐齐停口，猩红小眼瞬间锁定陈长庚，鞘翅高频震颤化作乌黑铁潮，张开锯齿毒颚朝他双腿凶悍扑咬而来！\n\n陈长庚脸色微变，脚尖一点岩壁，借着麻绳之力倒掠上丈许高的凸起石台！\n\n两只扑空的甲虫撞在刚才他落脚的火成岩上，锯齿口器咔嚓一合，竟将坚硬岩石生生咬下两块碎角！\n\n“好硬的壳，好毒的牙口！”\n\n陈长庚悬在石台上心念电转。\n\n刀剑难伤，更不能动用硫煞火药硬炸——脚底下就是地火支脉阵眼，一炸连人带院全得飞上天！\n\n怎么破？\n\n他低头盯着石台下焦躁打转、不断回头去啃玄铁栅栏的三十六只甲虫，脑中忽然闪过一道亮光。\n\n这群凶虫是在丹房赤铅毒灰堆里孵出来的，放着满坑普通石头不咬，专挑浸染了浓郁地火煞气的阵基玄铁柱下嘴——它们真正馋的不是铁，而是精铁里凝结的高浓地火毒煞！\n\n论地火毒煞的纯粹浓烈，这世上还有什么东西比得过“蚀纹石臼”提纯无瑕晶砂时，剥离挂在臼壁死角的那层极致狂暴煞毒泥垢？！\n\n想到便做，陈长庚一息不耽搁，借绳索一跃翻出三丈深坑，快步冲回青石卧房。\n\n他从墙角翻出一只前任留下来装火碱、壁厚半寸且带螺旋生铁盖的废弃“寒铁药瓮”。\n\n随即他掏出蚀纹石臼，用细竹片从臼槽边缘刮下绿豆大小一撮乌紫发亮、腥臭刺鼻的残余煞毒泥垢，拌进两把细碎生铁铜屑里，一股脑丢进寒铁药瓮最底层！\n\n回到地火坑边，陈长庚用长柄铁火钳勾住寒铁药瓮的提耳，顺着滑槽缓缓吊放到坑底距离玄铁栅栏三尺外的平地上。\n\n瓮口刚一落地，那股经由石臼浓缩了十倍不止的极致地火煞毒腥气便在坑底弥漫开来！\n\n奇迹发生了！\n\n原本还在疯狂啃咬玄铁栅栏、或是冲着上方陈长庚磨牙示威的三十六只黑铁甲虫，浑身猛地一僵！\n\n下一瞬，三十六只凶虫就像是饿极的豺狼嗅到了绝世仙酿，彻底丢开玄铁柱，争先恐后顺着药瓮外壁爬上瓮口！\n\n它们“扑通、扑通”一头扎进瓮底，抱住那两把裹满石臼煞毒泥的生铁屑疯狂大嚼起来！\n\n一息，五息，十息！\n\n石臼浓缩煞毒何等霸道，三十六只甲虫幼虫吞下大半铁屑后，乌黑虫腹肉眼可见地泛起一圈暗红微光。\n\n它们动作越来越慢，不过十几个呼吸便像喝醉了烈酒般齐刷刷缩起六足，一动不动陷入了沉沉休眠！\n\n陈长庚数得清清楚楚，一、二……三十六，一只没漏！\n\n他当即滑落坑底，拔出分水刺在半寸厚的生铁瓮盖顶上精准钻出三个比针尖还细的透气微孔，随即“咔嚓”一声将螺旋铁盖死死拧紧，把整瓮沉睡凶虫严密锁死！\n\n将寒铁药瓮提上去藏进卧房地砖暗格后，陈长庚不敢大意，又挑了两根备用的生铁门闩下到坑底。\n\n凭着六窍气血与《井煞锻骨功》百锻指力，他徒手将拇指粗的熟铁条拗弯成箍，严丝合缝卡死在两根受损玄铁柱缺口上。\n\n再糊上厚厚三层耐火赤铅胶泥烘烤封固，彻底把炸坑隐患掐灭在萌芽中！\n\n忙完这一切已是五更天，陈长庚看着地砖下那只安静的寒铁药瓮，眼底隐现灼热。\n\n连百炼分水刺都劈不破背壳的异种凶虫，若是能弄清底细驯养成军，岂不是比一次性烈阳火珠还要恐怖的贴身杀手锏？\n\n十一月二十二日辰时，四名火工杂役推车进院送来十车肥灰。\n\n领头老火工走到石棚边抽了抽鼻子：“咦，陈小子，排灰坑口咋有股新烤的赤铅火泥味？”\n\n陈长庚拄着扫帚低咳两声：“回老哥，昨晚风大震松了两块护砖，小人怕漏烟熏死在屋里，连夜和泥糊上了。”\n\n“算你惜命！”旁边年轻火工掉转空车，小声提醒，“好好干吧，听说今年外门半年校役要提前发榜了！”\n\n“多谢二位老哥提点。”陈长庚拱手送走灰车锁好铁门。\n\n巳时初，陈长庚换上一身洗得发白却整洁的灰布杂役服，把气息稳稳压在“两窍半淤毒”的病弱水平，腰挂外门号牌，步行来到前山半山腰的“藏书阁”。\n\n云泽宗外门藏书阁高三层，二三楼功法秘术区须凭灵石与功勋进入，唯有一楼侧廊的“百杂书库”收录着各地地理矿志与虫兽杂谈，按规矩外门杂役皆可入内翻阅。\n\n然而陈长庚刚走到一楼侧廊栅栏口，一根油光发亮的斑竹旱烟杆便“啪”地横在了胸前。\n\n柜台后坐着个六十上下、背脊微驼的通窍四窍管阁老役，姓曲。\n\n他正耷拉着三角老花眼上下扫视陈长庚，嫌恶地扇了扇鼻子：“站住！后山丙字废渣房来的？一身硫磺铅灰臭气，熏坏了阁里的孤本竹简你拿命赔啊？去去去，没半块碎灵石的净手茶水钱，百杂廊今儿扫灰不开门！”\n\n旁边两名来查草药图谱的药园杂役乖乖摸出几十文铜板凑了半块碎灵石递过去，才被放行入内。\n\n陈长庚怀里暗藏着五整三碎灵石与七十五两散银，面上却露出一抹囊中羞涩的苦笑，一丝掏钱的意思都没有。\n\n昨天他才在庞文禄跟前咳血哭穷，今天要是跑到藏书阁随手扔碎灵石打赏，消息一旦传回纳贡院，立马就是个欺瞒上官的死罪！\n\n他目光一转，落在了曲老役手边案头上——那里高高堆着三卷虫蛀发霉、字迹漫漶不清的《大泽外门废矿志》旧档，老头手边搁着半张抄错涂黑的宣纸，正揉着发红流泪的老花眼唉声叹气。\n\n陈长庚当即躬身退后半步，露出蜡黄干瘦的手腕低咳两声，恭敬陪笑道：“曲老丈息怒，小人前日刚被冯管事分去丙字房顶缺，兜里实在没碎灵石……只是昨晚坑底钻出几只怪虫咬人，小人怕死得不明不白，斗胆想借《百虫杂录》查个防虫土方。”\n\n曲老役冷哼一声：“没钱免谈，滚回谷里等死去！”\n\n“老丈莫急。”陈长庚指了指案头那叠发霉旧档，顺杆递上台阶，“小人瞧老丈正为月底交庶务堂的旧档修补差事劳神？”\n\n曲老役斜睨他一眼：“是又咋地？发霉水渍糊成一团，看两行眼珠子就酸！”\n\n陈长庚低声赔笑：“小人早年识得几个字，在盐场替灶头丹师抄过水册火单。小人愿在廊外替老丈把这三卷《废矿志》分文不取重抄一册交差，只求老丈赏半个时辰进去翻几页虫书，您老正好歪在椅上歇歇眼、喝壶热茶如何？”\n\n曲老役挑起眼皮愣了愣，半信半疑地扔出一支秃毛笔和半张毛边纸：“乡下熬盐的还会写小楷？写两行老夫瞧瞧！”\n\n陈长庚上前提笔蘸墨，手腕稳健，眨眼间便在纸上落下一行干净利落、工整端正的账册小楷，比曲老役自己哆嗦着抄的强出十倍不止！\n\n白捡一个不要钱的抄书苦力替自己完差，曲老役脸上顿时阴转晴，把三卷发霉矿志往外一推，哼道：“算你小子有点眼力见！坐廊下小桌抄，漏一个字仔细你的皮！抄完准你去西架最底层看半个时辰，敢往二楼楼梯瞄一眼，打断你的狗腿！”\n\n“谢曲老丈成全！”\n\n陈长庚老老实实坐在廊下冷风口奋笔疾书，花去整整两个时辰将三卷残破矿志抄得工工整整。\n\n曲老役验过字迹挑不出一丝毛病，满意地收起新册，挥挥烟杆放他进了百杂书廊。\n\n陈长庚直奔西侧最偏僻的虫兽木架，蹲在角落飞快翻检，不到一盏茶工夫，便从一册兽皮缺角的《异虫残录》后半卷里翻到了那幅一模一样的铁甲虫绘图！\n\n图旁朱砂小字批注得触目惊心：\n\n“嗜铁煞甲虫，上古地肺矿渊凶种。卵借剧毒炉煞孵化，幼虫背甲坚逾百炼精铁，刀剑水火难伤，唯嗜地火浓煞与五金矿精。”\n\n陈长庚目光紧盯着后半句朱批：“若饲以‘赤精铜髓’助其蜕壳成虫，结阵扑出可瞬息噬穿开脉境修士护体灵盾与法器！然此虫凶戾弑主，无上古控煞饲虫秘法烙印神魂者，切莫强养，蜕壳之日必遭万虫噬心！”\n\n陈长庚指尖轻轻抚过书页，心脏重重跳了一下，眼底精芒一闪即逝！\n\n连开脉境修士的护体灵盾都能活活咬穿的上古凶虫！\n\n他手里有蚀纹石臼每三日产出的浓缩煞毒边角泥当独家饲料，眼下只缺“赤精铜髓”与“控煞饲虫秘法”两样拼图！再过七天便是十一月末，正好按当初在黑石渡口定下的暗号，下山去乱石集鬼市找贺九斤暗中搜罗！\n\n半个时辰香尽，陈长庚将《异虫残录》原样放回架底，向闭目养神的曲老役恭敬作揖告退。\n\n走出藏书阁侧巷，午后山道渐热闹起来。\n\n路过外门演武坪东侧的高大青石庶务榜墙时，前头黑压压围了五六十名灰衣外门杂役，人人面色发白、议论声嗡嗡如蜂。\n\n“完了完了！往年都是腊月底才大考，今年怎么提前到十二月十二了？！”\n\n“没通三窍或者定额不够就直接削舍发配黑水矿坑？这才剩二十天，上哪儿去凑破窍药啊！”\n\n陈长庚脚步微顿，站在人群外围抬头朝榜墙正中望去。\n\n只见一张墨迹未干的丈许白麻大榜高悬墙头，鲜红庶务堂大印下写得森然夺目：\n\n定于十二月十二日辰时，于演武坪举行“外门半年验脉校役”！凡入籍外门杂役，届时现场测脉未满通窍三窍者、或当月本职庶务定额亏空者，一律削去原房木牌，当场锁入西山黑水矿坑充苦役！\n\n今日十一月二十二，距十二月十二满打满算只剩二十天！\n\n陈长庚目光顺着榜文缓缓下移，落在最末尾“奉令监考巡查”那一栏的首位名字上，漆黑瞳孔微不可察地一缩——\n\n刑律堂巡山弟子，卢耀！"}, {"n": 30, "title": "鬼市换诀", "body": "十一月二十九日，戌时初。\n\n离演武坪半年验脉校役还剩十三天。\n\n二十二日从藏书阁回来当天，陈长庚便借外院采买杂役去苍芦渡的机会，托往返货船往黑石坊市南街老茶摊捎去半截刻痕青竹签与口信，约贺九斤月末随商船北上乱石集接头。\n\n这七日里，他白日照常接灰筛铜，逢二十四日、二十七日午后两轮地脉潮汐期满，便在隔味阵盘气幕里炼化紫火炉底灰。\n\n两轮新析出八钱晶砂，合着早先剩下的三钱半，统共攒下十一钱半无瑕道髓晶砂。\n\n他特意从中挑出两粒重约半钱、外缘还带着灰黑矿壳的边缘碎髓晶充作野矿髓，寒玉匣里净存十一钱整；随后又运起六窍百锻指力，将储物袋里那两截铁线蜈毒鳌磨成六根三寸长的乌黑破甲毒针，妥帖藏入左袖机括。\n\n山脚二十里外的乱石集，每逢月末子夜前开地下鬼市。\n\n陈长庚借申领净灰火碱的夜行木签出了后谷，在林间换上黑麻斗篷、戴好遮面生铁斗笠，一步踏进乱石集棚口的破茶摊。\n\n昏黄油灯下，挑檐正挂着一根不起眼的青竹签。\n\n陈长庚在角落矮桌坐下，屈指在桌角轻敲三下：“掌柜的，乌卤换新炭，有门路吗？”\n\n正在擦桌子的干瘦汉子浑身一震，猛地抬头看向铁面斗笠，压低嗓门试探：“敢问客官打哪儿来？”\n\n“黑石渡口吹过风，托苍芦渡货船捎的竹签信。”陈长庚隔着铁面压哑嗓音，绝口不提丙字废渣房，“鬼市耳杂，今晚唤我灰客就行。”\n\n贺九斤眼珠子瞬间亮透，慌忙猫腰凑过来作揖：“哎哟，原来是灰爷大驾！小的收了渡口船夫捎来的口信，趁月底商船北上跑单，刚挂上竹签就把您盼来了！”\n\n陈长庚微微颔首：“黑石坊市那边还干净？”\n\n“干净得很！”贺九斤搓着手低声回话，“崔婆子失踪后几个毒贩子抢地盘打破了头，没人往大泽渡口查一句！”\n\n他往集西头努了努嘴，小声提醒：“对了灰爷，集西头老炭窑前两天刚塌了半边坡，里头闷着毒火沼气没人敢走，待会儿撤路咱们得绕东林枯井走。”\n\n“滑坡废炭洞，闷着火沼气？”陈长庚眼神微动，暗暗记在心里，“带路，先找卖外功残卷和赤精铜髓的摊子。”\n\n“得令！集尾疤面刘专收矿渊死人货，他那儿准有！”\n\n穿过两条点着惨白骨灯的地下石巷，两人停在一处挂着破兽皮幌子的石摊前。\n\n摊后坐着个左脸爬满紫红火疤的独眼壮汉，周身散着通窍六窍的凶悍煞气，正是鬼市老油条疤面刘。\n\n“买货亮钱，只看莫摸。”疤面刘眼皮微掀。\n\n陈长庚蹲在摊前扫过一排发黄皮卷与矿匣，伸指点了点一卷封皮残破的兽皮册和一只铅盒：“这半部《井煞锻骨诀》中卷，还有这盒铜砂，怎么卖？”\n\n他借着骨灯光亮瞄过扉页两行经络图，心里已然有底——名字虽差了一个字，路数正是他所修《井煞锻骨功》货真价实的后续中卷正篇！\n\n疤面刘嘿了一声，伸出三根粗黑手指：“行家啊！铜盒里虽不是整块赤精铜髓，却是老子从古矿坑筛出来的半斤‘赤精铜屑’，够喂灵虫开锋了！”\n\n他下巴一扬，漫天要价：“连这半部硬功中卷一块儿，十五枚完整下品灵石，碎石散银免谈！”\n\n身后的贺九斤倒吸一口凉气：“刘爷，半卷烂皮纸配一盒铜渣子，坊市顶天值八枚灵石，您这也太黑了！”\n\n“嫌贵滚蛋！”疤面刘冷笑抱臂，“整个乱石集独此一份，爱买不买！”\n\n陈长庚既没掏怀里暗藏的整灵石，也没跟他磨嘴皮子，右手探出斗篷，将一只小木盒推到摊角打开。\n\n盒底衬着黑布，静静躺着那两粒黄豆大小、外缘粘着灰黑天然矿皮的莹白碎晶。\n\n“现灵石没有，拿这两粒老坑矿髓抵账。”陈长庚哑声道。\n\n疤面刘漫不经心瞥了一眼，待鼻端嗅到那股清冽纯正的气息，独眼骤然瞪圆！\n\n他一把抓起木盒凑到骨灯下，指甲刮下一星粉末捻入鼻息，呼吸瞬间粗重了三分！\n\n一丝燥烈火毒都没有！\n\n这种零丹毒的极品伴生矿髓，卡在通窍六窍瓶颈的老散修吞下去，少说能省三年水磨工夫！\n\n疤面刘眼底掠过一抹极深贪婪，脸上却堆起豪爽大笑，飞快合上木盒揣进怀里：“成色勉强凑合！看在朋友爽快的份上，锻骨中卷和赤精铜屑归你了！”\n\n陈长庚收起兽皮中卷与铅盒起身离开，耳朵却清晰听见疤面刘用脚后跟在摊下石板上连磕了四下暗拍。\n\n巷口阴影里，一名挎厚背刀的高瘦汉子与一名铁杖驼子悄无声息跟了上来——全是通窍六窍的老牌劫修！\n\n走出鬼市石巷不到百步，贺九斤回头瞄了一眼，脸皮唰地白透了，声音发颤：“灰、灰爷坏菜了！疤面刘亲自关了摊子，带着黑风双煞缀在后头，这是看咱俩势单力薄要黑吃黑啊！快往北上云泽宗官道跑！”\n\n“去官道等着叫巡山队盘查身份？”陈长庚脚步不乱，反手一指西侧荒坡，“你现在立刻绕去东林老枯井口等我，我把他们引去西头废炭洞。”\n\n贺九斤急得直跺脚：“爷！西头塌坡炭洞是个没后门的绝路啊！”\n\n“让你走就走，少废话！”\n\n陈长庚低喝一声，身形骤然加快，故意装出气血不济、慌不择路的模样，一头扎进了西侧拉着禁绳的坍塌废炭窑口！\n\n几个呼吸后，疤面刘带着高瘦刀客、铁杖驼子追至洞口。\n\n“刘老哥，这铁面小子连路都不认，居然自己钻进塌方死窑里了！”高瘦刀客狞笑拔刀。\n\n疤面刘舔了舔紫红火疤，独眼凶光毕露：“一个靠通窍四窍脚夫带路的藏头鼠辈，八成是撞大运挖到了老矿窝！进去堵死他，搜出剩下的极品矿髓咱哥仨平分！”\n\n三人鱼贯闯入漆黑幽深的废炭洞。\n\n越往洞底走，空气越发闷热滞重，伸手不见五指，只听见前方十丈外的碎煤堆后传来急促喘息声。\n\n他们谁也没发觉，陈长庚早在进洞的第一息，便用百锻铁掌撬开了洞壁两侧封闭数月的陈年煤气裂隙，贴地屏息缩进了洞底最深处的泄水石凹里！\n\n“躲在煤堆后头装死？照亮宰了他！”\n\n冲在最前头的高瘦刀客不耐烦地一摸腰间，灵气微吐，“啪”地催亮了一支三寸长的赤铜火折法器！\n\n橘红明火跳起的刹那，疤面刘猛地嗅到满洞刺鼻微甜的闷浊煤味，吓得头皮炸麻，失声狂吼：“别点火！是沉积火沼气——”\n\n晚了！\n\n一点火星撞上积蓄了数日的狂暴地底沼气！\n\n“轰隆——！！！”\n\n整座废炭洞内部瞬间化作一尊炸膛的巨型火炮！赤红烈焰卷着恐怖气浪轰然横扫，碗口粗的坑木支架寸寸崩断！\n\n冲在最前的高瘦刀客与铁杖驼子连护体劲气都没撑满，当场被贴脸炸开的沼气火浪掀飞两丈，浑身衣发爆燃，口喷鲜血重重砸在石壁上！\n\n疤面刘走在最后反应最快，拼尽通窍六窍修为双臂交错护住头脸，仍被灼热气浪震得气血翻腾、独眼刺痛流泪！\n\n还没等他擦开眼角血糊——\n\n一道黑影已顶着滚滚热浪自洞底石凹暴掠而出，快如鬼魅！\n\n“噗嗤！”\n\n七寸淬毒分水刺顺着浓烟一闪而逝，先将地上挣扎欲起的铁杖驼子与高瘦刀客咽喉一并洞穿封死！\n\n“什么人？！”疤面刘骇得倒退半步，右手狂拍腰间储物袋欲取铁盾！\n\n陈长庚一句废话不讲，左袖机括一震！\n\n“咻！咻！”\n\n两根由七窍母蜈毒鳌磨制的乌黑毒针破开火烟，如穿朽木般直接射透疤面刘体表六窍劲气，“夺夺”两声死死钉穿他左右琵琶骨！\n\n酸麻剧毒入骨，疤面刘双臂一软，“扑通”跪倒在滚烫煤渣上。他看清眼前毫发无损的铁面身影，冷汗瞬间浸透后背：“六、六窍体修？！爷饶命！那两粒矿髓小的双手奉还！”\n\n陈长庚一脚踩住他胸口，冰冷分水刺尖抵在他独眼眉心：“刚才在你摊上闻见一股死虫腐腥味，你手里除了赤精铜屑，是不是还藏着养虫的册子？说清楚，给你留口气。”\n\n疤面刘浑身筛糠，哪敢隐瞒一字：“有！有！前年小的在古矿死人骸骨上摸过半册《饲虫控煞手札》，因为没母虫喂养，一直垫在小的左靴夹层里！求好汉饶……”\n\n话音未落，分水刺已干脆利落没入其咽喉。\n\n陈长庚拔出毒刺擦净，迅速从疤面刘左靴底搜出那册薄薄的暗金兽皮《饲虫控煞手札》，翻开扫见“神血烙母、煞泥饲群”八字真诀，心头一定。\n\n再将三具尸首怀里摸索一空——除找回那两粒边缘碎髓晶外，共搜出九枚完整下品灵石与五十两散碎纹银！\n\n陈长庚收妥战利品，单手拎起三具尸首连同刀杖一并扔进洞底深不见底的废弃渗卤枯井，推倒两块巨石将井口彻底砸塌掩埋。\n\n两刻钟后，东林老枯井旁。\n\n正急得团团转的贺九斤忽见一道带着淡烟味却滴血未沾的黑斗篷身影自林中走出，顿时张大了嘴巴：“灰、灰爷？疤面刘他们三个通窍六窍的凶人呢？”\n\n“贪黑踩塌了废炭洞，全埋底下化灰了。”\n\n陈长庚随手摸出十两刚搜来的碎纹银抛过去：“这是分你的两成跑腿钱。下个月底还在这儿挂签，替我继续收赤精铜髓和硫煞火器。”\n\n贺九斤捧着还带余温的银锭，双腿发软差点给这位爷跪下——一进一出不到半个时辰，三个通窍六窍的老油子连个水花都没溅起来就全没了！\n\n“灰爷神威！小的这辈子跟定爷了！”贺九斤死死捂紧银子，临别前想起一事，慌忙左右张望一圈，凑近三步压极了嗓音道：\n\n“对了爷，小的今儿在乱石集外围拉脚，打听到一桩邪门风声，您老在山上可得多留个心眼！”\n\n陈长庚脚步微顿：“什么风声？”\n\n“云泽宗内门丹堂这半个月不知发了什么疯，正托鬼市虫贩子重金搜罗耐地火毒煞的活体灵兽，听说连外门各火房耐火杂役的生辰八字都暗中调去筛了一遍！”\n\n贺九斤咽了口唾沫，声音抖得像秋风落叶：“有个老矿头喝多了漏出一句嘴——说是大泽地底那处十年一开的绝地‘沉渊古盐墟’，地磁退潮怕是要提前了！”"}, {"n": 31, "title": "演坪反诬", "body": "十二月十二日，辰时初。\n\n山风裹着霜粒子刮过云泽宗外门演武坪，两百余名灰衣杂役缩着脖子排成六列。\n\n坪西角刚拖走两个未满通窍三窍的药园杂役，铁链拖在青石板上哗啦作响，哭嚎声听得满场人人面色发白。\n\n陈长庚站在队尾那只铁箍灰篓旁，双手拢在破棉袖里，一张脸蜡黄寡白，时不时低头轻咳两声。\n\n自月末从乱石集回谷这十二天里，他按期交清了丹房首月五十斤废紫铜屑，借四轮地脉潮汐把寒玉匣里的无瑕道髓晶砂攒到了二十七钱。\n\n地砖暗格那三十六只嗜铁煞甲虫也早已用神血烙印妥当，连《井煞锻骨诀》中卷都摸进了门径。\n\n可眼下陈长庚半点没看高台，眼角余光只冷冷扫过十步外的司秤长案。\n\n掌秤的葛书办刚从兵器架后头钻出来，官靴后跟粘着半块暗红湿泥，隔着两丈远都能闻见一股淡淡的铁腥臭气。\n\n再看卯时初交进编号棚、刚被皂役抬出来的丙字房半月筛铜灰篓——篓底明显往左沉了半寸，竹篾缝里还沁着一星水迹！\n\n“好手段，连苦力都不肯白送我进矿坑，直接往官铜篓里塞湿沙栽赃了。”\n\n陈长庚心底冷笑一声，垂下眼皮纹丝不动。\n\n“下一号，后山丙字废渣房，陈长庚！”\n\n一声阴鸷冷喝自监考席炸响。\n\n身穿玄色镶红边巡山劲装的卢耀按刀走出，鹰钩鼻下挂着毫不掩饰的狞笑，大步逼到陈长庚面前。\n\n警戒绳外头，左手缺了尾指的卢成正死死盯着这边，满脸快意怨毒。\n\n“陈长庚，听说你进废渣谷第二天就咳黑血烂了肺？”卢耀居高临下拿刀鞘敲了敲黑曜测脉石，“先按石验脉，再过官秤！未满三窍，当场削牌锁进黑水矿坑！”\n\n周围几十名杂役齐齐屏住呼吸，谁都看得出卢耀这是要公报私仇把人往死里整。\n\n“回卢师兄，小人这半月喝了些顺气苦汤，侥幸冲开了些许火毒淤塞。”\n\n陈长庚弓着腰低咳一声，慢吞吞走上前，伸出涂得微乌的右手掌心，稳稳贴在冰冷的测脉石柱上。\n\n体内六处奔涌如汞的百锻气窍被锁气劲死死箍住，只放出一缕虚浮微弱、还带着几分驳杂火气的内息渡入石中。\n\n一息，第一道赤线亮起。\n\n两息，第二道赤线爬过中格。\n\n就在卢成咧嘴准备叫好的刹那，第三道赤线颤巍巍跳了两下，堪堪卡在及格刻痕上亮起一抹微光！\n\n“勉强……通窍三窍？！”葛书办眼珠子一瞪，脱口喊了出来。\n\n满场杂役顿时响起一片压低的惊呼——连抬走三具死尸的丙字绝户坑，这病秧子居然硬熬过三窍及格线了！\n\n卢耀脸色猛地一沉，眼底杀机暴涨，一脚踹在旁边铁秤架上：“刚擦边过三窍有什么用？葛书办，当众验他的半月筛铜灰篓！丙字房半月定额二十五斤废紫铜屑，少一两也是欺瞒宗门！”\n\n“得令！”\n\n葛书办抢步上前，压根不上钩称重，抬手抓起丙字房灰篓底耳，照着青石地坪狠狠一扣！\n\n“哗啦——！”\n\n表层薄薄五斤暗紫铜屑散开，底下夹层里竟滚出老大一堆湿漉漉、沉甸甸的灰黑细沙！\n\n葛书办跳脚指着陈长庚尖声大叫：“好大胆的贼厮！表层铺五斤铜渣糊弄上官，篓底竟塞了三十斤湿铅沙充分量！卢师兄，此人私吞丹房二十斤官铜，按律当场削牌锁拿！”\n\n“证据确凿，给我拿下！”\n\n卢耀厉喝挥手，身后两名刑律堂巡山役抖开碗口粗的玄铁锁链，恶狠狠朝陈长庚脖颈套来！\n\n四周灰衣杂役吓得哗啦啦后退三步，几个老火工嘴唇直哆嗦，却没一个人敢替他吭半个字。\n\n眼看铁链腥风扑面，陈长庚半句没跟葛书办争辩篓子是谁动的手脚。\n\n他脚步往侧后一滑避开锁头，撩起灰布衣摆“咚”地重重跪向高台主考大棚，声音清亮穿透全场寒风：\n\n“启禀主考褚副执事！小人卯时交篓还是满筐紫铜，转眼变成三十斤湿铅沙！”\n\n“小人不敢空口喊冤，只求器堂开猛火官炉当场复熔此沙！若烧不出栽赃贼人跟脚，小人甘受器堂抽魂炼骨之刑！”\n\n高台正中太师椅上，器堂主考副执事褚洪猛地掀开眼皮！\n\n外门谁不知道器堂与刑律堂为了争废矿罚没实权，素来水火不容。\n\n卢耀脸色微变，急忙抢上半步抱拳截话：“褚师叔明鉴！一篓掺假湿沙人赃并获，何须动用器堂验器猛火炉白耗火炭？弟子这就锁他回刑律堂审清——”\n\n“卢师兄这么急着拖小人走，莫非是怕器堂百锻猛火烧出这湿铅沙的老家？”\n\n陈长庚趴在石地上咳了两声，一句话直戳褚洪肺管子，“外门谁人不知，唯有褚大人座下猛火炉，一烧便辨得出矿沙出自哪座山头！”\n\n“哼！”\n\n褚洪蒲扇般的铁掌重重拍在座椅扶手上，通窍八窍的燥烈威压轰然席卷全场！\n\n他冷笑斜睨卢耀：“怎么，卢侄儿连老夫开炉验赃的炭火都要替器堂省了？来人，起三号猛火炉，把地上那堆沙泥连根铲进去烧！”\n\n“遵命！”两名赤膊器堂火工大步冲下高台，拉动风箱催起丈许赤焰，两铁锹便将那三十斤湿铅沙尽数铲进通红坩埚！\n\n葛书办额头冷汗唰地滚了下来，双腿直打摆子。\n\n卢耀死死攥紧刀柄，心里还在侥幸：湿铅沙到处都是，烧化了也是一滩废铅水，能验出什么鬼来？\n\n下一息——\n\n“啪！啪啦啦——！！”\n\n裹在湿铅沙深处的水汽遇上器堂百锻猛火，当场在坩埚里炸开一串闷雷般的爆响！\n\n灰黑铅壳崩裂，一股刺鼻至极、犹如腐血混着生锈铁渣的浓烈红泥腥臭味轰然炸散，顺着北风直灌满场众人鼻腔！\n\n更要命的是，两块没炸碎的暗红胶泥被气浪掀出炉口，滚落在高台石阶前——烘干的泥面上，赫然留着半截巡山铁靴独有的菱形钢钉齿印！\n\n满场哗然！\n\n褚洪豁然起身，跨前两步低头一嗅，花白胡须根根倒竖，指着卢耀怒极反笑：\n\n“好啊！赤铁腥泥，巡山钉印！”\n\n“整座云泽宗外门，只有你们刑律巡山堂后山断崖才产这种伴生湿铅赤铁泥！葛书办，陈长庚一个挂着独管禁牌锁在废渣谷底的病杂役，莫非昨晚长了翅膀飞去巡山堂后山挖泥栽赃自己？！”\n\n“噗通！”\n\n葛书办魂飞魄散，软泥般瘫跪在地，把脑门磕得鲜血淋漓：“褚大人饶命！小人招！全是卢耀昨晚塞给小人两块碎灵石，逼小人卯时在编签棚里倒掉丙字房紫铜、换塞这袋湿铅沙的啊！”\n\n四周两百多名杂役一片哗然，看向卢耀的眼神瞬间变了味。\n\n卢耀脸皮涨成猪肝色，厉声喝骂：“贱奴血口喷人！本巡查何曾——”\n\n“给老夫闭嘴！”\n\n褚洪一声暴喝震得卢耀耳膜生疼、蹬蹬连退三步！\n\n“校役大典竟敢买通书办、掉包官铜栽赃庶务！来人，把葛书办拖下去重打三十铁杖，削籍逐出外门！”\n\n褚洪冷冷盯住面无人色的卢耀，一字一顿砸下铁锤：“巡山弟子卢耀，监考舞弊、御下不严，按律罚没三个月宗门俸石，即刻滚出演武坪！丙字房陈长庚测脉三窍合格、定额无亏，发还腰牌！”\n\n两名器堂铁卫如狼似虎扑上去，一把摘下卢耀监考令箭，拖死狗般将惨叫求饶的葛书办架出演武场。\n\n“谢褚大人明鉴！”\n\n陈长庚恭恭敬敬磕头领回盖了红印的木牌，垂头退回灰衣队列最末端，连看都没多看卢耀一眼。\n\n卢耀后槽牙咬出了血，铁青着脸转身走下高台石阶，绳外的卢成慌忙缩着断手迎上去。\n\n就在兄弟俩灰溜溜退到高台东侧雕花长廊下时，一道身穿崭新青镶边锦袍的修长人影摇着折扇缓步走出。\n\n“嘶，那不是大泽盐商窦家大少爷窦文焕吗？听说前两日刚花重金捐进咱们外门丹堂当记名学徒了！”旁边两名药童低声惊叹。\n\n廊柱阴影下，窦文焕笑吟吟抬手拍了拍卢耀僵硬的肩头，低语了两句什么。\n\n随即他微微偏过头，一双阴冷如毒蛇般的眼睛越过攒动人头，遥遥锁死了人群末尾拢袖低眉的陈长庚。"}, {"n": 32, "title": "断灰抓把", "body": "演武坪的罚俸风波还没散尽，报应当天晌午就砸进了后山废渣谷。\n\n十二月十二日午初，陈长庚刚回丙字废渣房换下灰布旧衣，院门外便响起沉闷的铁轮碾石声。\n\n按老规矩，每日辰时退下来的八车赤铅废渣与两车高煞紫火炉底灰，今儿因半年校役推迟到了晌午。\n\n陈长庚拉开铁门让灰车进院，鼻翼只轻轻一动，眉头便微不可察地蹙了起来。\n\n前头八车赤铅渣全被浓碱水泡得透烂，冷冰冰不冒一丝毒烟，连里头的火煞与铜星都被沥得一干二净。\n\n最后那两辆原本该装满滚烫紫黑炉底肥灰的熟铁车里，倒出来的更是两车稀汤寡水、泛着灰白泡沫的刷锅湿泥！\n\n一丝地火煞气都没有，更别提筛出半星废紫铜屑！\n\n“王老哥，今儿这十车灰怎么全变成死渣和刷锅泥水了？”陈长庚拄着铁锹低咳两声，递过去半瓢凉茶。\n\n领头的老火工叹了口气，压低嗓门往坡上指了指：“陈小子，自求多福吧！管分渣的焦旺师兄今早接了丹堂新来的窦相公一壶好酒，当堂发了狠话。”\n\n老火工压低声音道：“他说这半月丹房严查铜耗，前八车赤铅渣全得先拿冷碱水泡透沥铜，紫火乾灰统统拨去甲字房，往后只给你们丙字房倒泡碱死渣和刷炉清汤泥！”\n\n说完，几个火工推起空车匆匆走了。\n\n陈长庚关拢铁门，拿铁铲拨了拨地上那摊死气沉沉的灰白湿泥，眼神瞬间冷了下来。\n\n焦旺？\n\n再想想老火工随口提过的“焦师兄前阵子夜里撞邪伤了右手两根指头”，陈长庚心底顿时对上了号。\n\n原来上个月子夜探手进西灰口投毒、被他用千斤铁闸齐根夹断无名指与小指的内鬼，就是这焦旺！\n\n前些日子这厮怕偷盗官灰的事败露，一直夹着尾巴足额供灰；如今窦文焕花重金捐进丹堂当了记名学徒，两条毒蛇立刻勾搭到了一块儿！\n\n“断我紫火肥灰与火煞，一则绝我修行的口粮，二则泡碱死渣与清汤湿泥里半两废铜都淘不出来。”\n\n“等腊月底交不出五十斤紫铜屑，不用卢耀动手，石百川自己就会按门规把我送进黑水矿坑！”\n\n好一招不沾血的软刀子釜底抽薪！\n\n十二月十二日午后，第十七轮三十六个时辰地脉潮汐期满。\n\n陈长庚不死心铲了一斗泡碱赤铅渣填进石臼试炼，谁知火煞早被浓碱蚀空，白白耗掉一轮充能，臼底连一粒晶砂都没析出来。\n\n捱到十五日午后第十八轮潮汐就绪，他又下到地火坑底刮了一层陈年旧垢再试，依旧因煞气枯竭耗空潮汐、颗粒无收。\n\n十五日申时，陈长庚从地砖下摸出二十两散碎纹银揣进袖口，依旧扮作三窍虚浮的病弱模样，顺着山道走上外门丹房侧院。\n\n侧门石阶前，一名三角眼、紫红酒糟鼻的灰红袍师兄正翘着二郎腿坐在条凳上剔牙。\n\n他右手裹着厚厚一层黑油布，尾端空荡荡缺了无名指与小指，正是分渣管事师兄焦旺！\n\n瞧见陈长庚走上石阶，焦旺三角眼瞬间蹿起刻骨凶光，猛地站起身横挡在门洞正中：“站住！废渣谷的烂肺鬼跑丹房重地干什么？”\n\n陈长庚低眉敛目，双手捧出那包碎银躬身道：“焦师兄安好，小人丙字房陈长庚。因这几日退下来的清汤湿泥泛着股怪酸潮气，小人怕沤坏了院里官家铁槽担不起罪责，想求见石副管事讨个章程……”\n\n“讨你娘的章程！”\n\n焦旺不等他说完，抬脚狠狠一踹门槛，一口浓痰直接吐在陈长庚布鞋尖前：“石副管事正忙着盯内门大炉，哪有空见你个短命丧门星！清汤泥怎么了？甲字房挑得，你丙字房金贵挑不得？”\n\n旁边两名正在装车的丹房火工缩着脖子不敢吱声，只拿同情的眼神瞥向陈长庚。\n\n门廊深处的太师椅上，一身青锦袍的窦文焕正端着茶盏慢悠悠吹浮沫，隔着影壁朝陈长庚露出一抹讥诮冷笑。\n\n焦旺叉着腰唾沫横飞：“滚回去老实接你的泥！腊月底交不够五十斤紫铜屑，老子亲自拿铁链把你拴去西山矿坑赎罪！”\n\n“是小人多嘴，谢焦师兄指教。”\n\n陈长庚连鞋尖都没擦，弯腰行了一礼，揣回碎银默默退下石阶。\n\n转过山道死角，他脸上谦卑瞬间散尽。\n\n硬闯告状没有实据，只会让人起疑他一个病杂役为何死盯着高煞紫火炉底灰不放。\n\n“焦旺刚才听到‘清汤湿泥泛怪酸潮气’那句话时，断指右手下意识往袖笼里缩了一下。”\n\n陈长庚眸光微闪。\n\n三年乌卤盐场熬卤观火，他对炉灰水汽从没看走眼过——刷洗正经丹炉的碱水只有苦涩硝味，院里那几车湿泥底下，分明藏着猫腻！\n\n当夜子时，陈长庚换上夜行黑衣，悄无声息摸到了外门丹房后崖三十丈下的排污暗渠口。\n\n一连蹲守两夜。\n\n到了十六日子夜三更，上方涵洞忽然哗啦涌出一股温热浑浊的暗粉废浆！\n\n陈长庚屏息探出竹片刮起一撮渠底沉渣，凑到鼻端轻轻一嗅，瞳孔骤然一缩！\n\n刺鼻碱水味底下，竟裹着一股甜腻发酸的春麝异香，还混着几星烧焦的赤桃花蕊碎末！\n\n“赤桃蕊配火麝髓……这是宗门严令禁绝的淫邪禁药‘春煞散’！”\n\n陈长庚瞬间把整条线串得明明白白！\n\n外门私炼春煞散卖去山下青楼鬼市乃是暴利，但非得借丹堂紫火官炉的猛火才能化开火麝髓！\n\n窦文焕刚花大钱捐进丹堂急着回本，便出本钱勾结管炉灰的焦旺，趁石百川夜里歇息盗用紫火官炉偷炼春煞散！\n\n他们怕含毒乾灰露馅，便把白日正常紫火灰全拨去甲字房掩人耳目。\n\n到了半夜，两人再用大量碱水冲刷炉膛，把洗炉残泥混进清汤里倒给无人查验的丙字房毁迹！\n\n“自己把脖子伸进铡刀底下，那就别怪我替石副管事松松筋骨了。”\n\n十七日傍晚，陈长庚从怀里取出冯保山当初退回的那两枚残次下品灵石，运起百锻指力“咔”地捏下半块残石，借暮色掩护绕到甲字房后山柴垛暗巷。\n\n不多时，甲字房出了名嘴碎好赌、前日刚被焦旺扣了饭钱的杂役侯三骂骂咧咧抱柴走过。\n\n“啪。”\n\n半块闪着微光的残次灵石从柴垛阴影后滚到侯三脚边。\n\n侯三吓了一跳，慌忙左右张望捡起灵石，只听柴垛后头传来一道沙哑压低的嗓音：\n\n“焦旺今晚戌末让你挑去后沟的那篓刷炉湿泥，算准石副管事去酒房打完酒回院的当口，在正堂台阶滑一跤摔碎在他脚前，只管大声哭喊泥酸烧手。”\n\n侯三手心一抖，压低嗓门急问：“哪位高人？万一石老头迁怒小的挨板子咋办？”\n\n“石老头痛恨的是盗用官炉的内鬼，哪会罚一个挑篓苦力？摔好这一跤，这半块残石归你翻本。”\n\n侯三捏着实打实的半块灵石呼吸急促，想起焦旺平日非打即骂的嘴脸，一咬牙低声应道：“成！瞧好吧您呐！”\n\n柴垛后再无声息，陈长庚早已如狸猫般翻下山梁返回丙字房。\n\n当夜戌时三刻，外门丹房前院灯火通明。\n\n刚灌了半壶烈酒、满面红光的丹房副管事石百川提着酒葫芦迈上正堂青石阶。\n\n迎面挑着两篓温热湿泥匆匆走来的侯三脚底板猛地一滑，“哎哟”一声惨叫连人带篓扑翻在地！\n\n“哗啦——啪！！”\n\n竹篓撞在石阶棱角上四分五裂，暗粉发腻的刷炉湿泥溅了石百川一靴筒，一股被热气蒸腾开的甜腻酸麝味瞬间弥漫满院！\n\n“混账东西！走路没长眼吗？！”石百川勃然大怒，抬脚就要踹！\n\n侯三抱头趴在地上嚎啕大哭：“石大人饶命啊！这刷炉泥邪门烧手，小的熏得头晕才滑了跤！怪不得前两天丙字房那姓陈的病小子来送银子，隔着老远闻了一鼻子就说清汤泥泛甜酸邪气怕烂铁槽，还被焦师兄骂滚了呢！”\n\n石百川抬起的大脚猛地僵在半空！\n\n他在丹房浸淫二十年，鼻翼一抽，酒意霎时吓醒了十成！\n\n“赤桃火麝……春煞散残渣？！”\n\n石百川脸色骤变如黑锅底，通窍七窍狂暴煞气轰然炸开，一脚踹飞紫火炉房木门冲了进去！\n\n炉膛前，右手包着黑布的焦旺正拿着铜铲往瓷瓶里刮粉，与站在屏风后的窦文焕同时吓得魂飞天外！\n\n“好你个吃里爬外的狗奴才！竟敢盗用本堂紫火官炉私炼违禁春煞散，你是想拉老夫一块儿掉脑袋吗？！”\n\n石百川怒发冲冠，一巴掌将焦旺扇飞撞碎药架，当场人赃俱获锁拿审问！\n\n窦文焕吓得连夜掏空私囊，硬塞给石百川与丹堂上官一大笔封口灵石，把全部罪名死死推在焦旺一人头上才保住记名学徒皮囊，心里对坏事源头的恨意却翻了十倍。\n\n焦旺就没那么好命了——当晚被扒去号衣重抽五十生铁鞭，打得皮开肉绽，连夜押往苦寒洗药涧充终身苦役！\n\n亥时末，两辆装得冒尖的滚烫紫火炉底肥灰重新轰隆隆推进了丙字废渣房。\n\n陈长庚刚送走满脸敬畏的送灰火工，还没来得及插上院门铁闩，院外石阶上忽然晃来一团昏黄冷冽的铜灯火光。\n\n浑身还带着酒气与血腥味的石百川独自提着风灯跨进铁门，一双精光四射的虎目上下打量着躬身垂首的陈长庚，忽然咧嘴一笑：\n\n“隔着两丈湿泥就能闻出春煞散的酸根子……陈小子，你这鼻子比山里的老猎犬还灵啊！替老夫私下筛批猛货，敢不敢接？”"}, {"n": 33, "title": "替筛留珠", "body": "夜风卷着硫磺烟扑进院门，吹得铜风灯里的火苗忽明忽暗。\n\n石百川一挥蒲扇大手，门外两名又聋又哑的粗壮老火工抬着十只黑铅布死死封口的熟铁大筐，闷不吭声摆满丙字房前院，转身退下山坡。\n\n院里只剩两人。\n\n石百川通窍七窍的浑厚气机若有若无罩住陈长庚，伸手掀开最前头一只铁筐封布。\n\n一股刺鼻腥辣、犹如陈年龟血混着生铅烧焦的剧毒热浪扑面涌出！\n\n筐里全是炸成碎块、泛着妖异暗紫红光的报废丹炉渣，离得近了连眼珠子都针扎般生疼！\n\n“龟血铅丹气……这老家伙竟在背着宗门私炼折损阴德的延寿猛丹，还连着炸了膛！”\n\n陈长庚心里一眼看穿底细，面上却惊得倒退半步，捂嘴弯腰剧咳起来：“咳咳……石、石副管事，这炉渣毒火霸道至极，寻常铁筛子碰上都得蚀穿啊……”\n\n“铁筛子能用，老夫半夜三更找你干什么？”\n\n石百川冷哼一声，从袖里摸出一杆精巧铜戥子扔在石桌上，“老夫替内门贵人试炼猛火大丹，火急炸了膛。这十筐废渣里混着没化尽的‘赤髓砂’，水洗火烤都会泄掉灵气，只能靠耐火毒的人手一把把从毒灰里摸出来！”\n\n陈长庚露出苦涩惶恐之色：“大人信得过小人是福分，只是这猛毒入肉……”\n\n“少跟老夫哭穷！”\n\n石百川竖起两根粗指，恩威并施砸下死话，“每旬十筐！后日午后老夫亲自来验头批！挑够分量，当场赏你半瓶丹房净髓引拔毒补身子！”\n\n话音一顿，他眼神骤然凶戾如刀：“可要是少了半钱，或是敢手脚不干净私藏赤髓砂——按盗窃丹堂重宝论处，老夫亲手把你塞进紫火炉烧成白灰！接，还是不接？”\n\n话已至此，哪有杂役说不字的余地？\n\n陈长庚膝盖一弯磕下头去，声音发颤却恭顺无比：“小人接！拼着这双烂手不要，也定替石大人把砂子一粒不差挑出来！”\n\n“算你识相！锁好你的独管铁门，一个字都不准往外漏！”\n\n石百川满意颔首，提着空灯大步离去。\n\n千斤生铁门闩重重落下。\n\n陈长庚缓缓直起脊背，拍掉膝头浮灰，走到头一只铁筐前眼底不惊反喜。\n\n拿他当折寿的人肉滤毒筛？\n\n殊不知越是炸膛狂暴的剧毒废丹渣，进了他的蚀纹石臼，炼出来的无瑕道髓晶砂就越肥！\n\n但他并未急着催动石臼，而是先戴上一双浸过桐油的厚猪皮手套，拿细竹片将头筐废渣摊在青石板上。\n\n凭着三年盐场熬卤摸盐花的指肚触感，陈长庚顺着渣底最沉的死角一寸寸细细拈摸过去。\n\n半刻钟后，“叮”的一声极轻脆响。\n\n竹片尖从两块焦黑铅饼夹缝里拨出一粒黍米大小、通体赤红圆润的砂珠。\n\n陈长庚拈起来凑近油灯一瞧，用指甲轻轻刮掉表层伪装的红丹皮，底下顿时露出一星亮晃晃的紫铜底色，珠腹还微雕着一道比发丝还细的“川”字暗痕！\n\n“老狐狸，嘴上说着信得过，筐底居然暗埋了同色同重的防盗记号铜珠！”\n\n若是寻常贪心杂役趁机抓两把赤髓砂藏私，哪怕只顺走一粒记号珠，后天交差立马就是个死无葬身之地！\n\n陈长庚唇角勾起一抹冷弧，耐着性子把十只铁筐从头到尾细细摸过一遍。\n\n一直忙活到五更天，整整五粒微雕“川”字暗痕的赤红铜珠被他一颗不落挑了出来，原封放进交差用的白瓷盘底。\n\n随后他又将混在表层、因炸膛早已流失三成灵力的四两次等赤髓砂悉数筛进盘中。\n\n剩下的，全是裹着厚厚赤铅毒壳、蕴满狂暴药煞的核心炸炉硬渣！\n\n陈长庚转身走进青石卧房，掀开墙角地砖抱出那只寒铁药瓮，拧开螺旋铁盖，心念微动催起《饲虫控煞手札》里的神血母印。\n\n“嗡——”\n\n三十六只拇指大小、背甲乌黑锃亮的嗜铁煞甲虫齐刷刷苏醒，顺着瓮口井然有序爬入石槽，再无半分早先的噬主凶态！\n\n一闻见核心炉渣外层那股浓烈赤铅毒壳味，虫群瞬间兴奋震翅，扑上去咔嚓咔嚓疯狂啃噬起来！\n\n不到半个时辰，十筐核心硬渣外头最扎手蚀肉的赤铅毒壳便被三十六只凶虫吃得干干净净。\n\n只见每只甲虫乌黑背壳边缘都浮起了一圈暗金细纹，体型胀大一圈，气息赫然已逼近初次蜕壳的关口！\n\n陈长庚收回饱食休眠的虫群锁回地砖下，天色正好放亮。\n\n十八日辰时，送日常炉灰的老火工推车进院，瞧见陈长庚眼圈青黑站在廊下，不由得啧啧摇头：“陈小子，昨晚石副管事真给你派苦活了？看你这脸色白的！”\n\n“混口汤喝罢了，劳王老哥挂心。”陈长庚袖着手低咳赔笑，送走灰车重锁院门。\n\n熬到午后未初，贴腹的蚀纹石臼准时传来滚烫潮汐脉动——第十九轮三十六个时辰充能就绪！\n\n陈长庚回到石榻上往青铜隔味阵盘按入灵石撑开三尺气幕，将虫群剥去铅壳的核心延寿丹废渣满满填进石臼凹槽！\n\n灰白石纹骤然亮如熔金！\n\n这一次吞噬的药煞远胜平日普通紫火灰，一刻钟后，浓烈如实质的地火腥甜气在隔味气幕内翻滚冲撞，臼底析出的莹白晶砂竟堆起了高高一撮！\n\n陈长庚取小秤一量，呼吸都热了一瞬——\n\n整整十二钱无瑕道髓晶砂！足足是平日单轮产量的三倍！\n\n他将十二钱新晶尽数封入锁灵寒玉匣，匣内存晶一举暴涨至三十九钱！\n\n仅仅吸入石臼边缘逸散的一缕温润残雾，他体内早已打磨圆满的第六处主气窍便轰然鼓荡，隔着一层薄如蝉翼的壁障，清晰摸到了通窍第七窍的门槛！\n\n收妥重宝，陈长庚没有留下一丝破绽。\n\n他在灶上烧滚半盆浓烈火碱水，咬牙将一双完好无损的手掌悬在滚烫碱汽上方反复熏蒸了半刻钟，又抹上少许炉灰盐卤。\n\n眨眼间，两只手掌皮肉红肿发乌，密密麻麻鼓起了十几个水亮骇人的烂燎泡！\n\n十二月十九日午后，石百川准时推门而入，一进屋便死死盯向石桌。\n\n陈长庚跪在桌旁，颤抖着举起两只布满烂燎泡、还在渗黄水的乌肿手掌，将那盘赤红晶亮的赤髓砂高高奉上：“幸不辱命……十筐废渣统共挑出赤髓砂四两二钱，请石大人过目！”\n\n石百川眼皮微跳，先扫了一眼他凄惨溃烂的双掌，随即抓起铜盘，通窍七窍气劲暗暗往盘底一探！\n\n一、二、三、四、五！\n\n五粒暗做记号的紫铜珠分毫不差躺在砂底，连盘中赤髓砂的分量都比他预估的多出两钱！\n\n至于砂子灵气散了三成，本就是炸膛常理，石百川压根生不出丝毫疑心！\n\n“好！好一个手脚干净、守本分的实诚小子！”\n\n石百川眉开眼笑，一把将整盘赤髓砂倒进自己皮囊，随手从怀里摸出一只塞着红木塞的白瓷药瓶扔在桌上：\n\n“这半瓶净髓引赏你拔毒养手！往后每旬替老夫筛一批渣，外院不管是哪房管事摊派的临时杂差，一概报老夫石百川的名号顶回去！”\n\n“多谢石大人厚赏！”\n\n陈长庚千恩万谢送走志得意满的石百川，反手插死生铁大门。\n\n回到昏暗卧房，他拔开白瓷药瓶木塞闻了闻，没有贸然往嘴里倒，而是掏出半截蚀纹石臼，用细竹签蘸了半滴灰白浑浊的药液，轻轻点在石臼缺口边缘。\n\n“嗤——”\n\n一声细微轻响，原本看着还算温润的半滴药液撞上石臼古纹，竟当场一分为二，足足有近四成化作一团阴寒粘稠的铅黑毒垢沉在底端！\n\n“好毒的劣等货！难怪外门杂役连喝三瓶不仅破不了窍，还得吐血暴毙。”\n\n陈长庚冷笑着擦净石臼边缘，刚把药瓶木塞重新按紧——\n\n“哐！哐哐——！！”\n\n前院生铁大门外突然响起一阵急促刺耳的拍门声，紧接着纳贡院掌案书办庞文禄尖利拿腔的公鸭嗓隔门炸响：\n\n“丙字房陈长庚听令！奉冯管事钧令，腊月山风凛冽，外门各房杂役自明日起，每人限期加缴两枚下品灵石防风修缮费！误期不交者，即刻锁押后山毒矿眼探脉！”"}, {"n": 34, "title": "捧药免捐", "body": "门外拍铁声震得门楣浮灰簌簌直掉。\n\n陈长庚不动声色将那半瓶含着四成铅毒的净髓引揣入怀中，把石臼与寒玉匣锁回腹带，这才弓起脊背挪到前院。\n\n门闩刚拉开一道三寸窄缝，黄黑硫烟顺风涌出。\n\n庞文禄早有防备，捏着丝帕站在三丈外的上风口台阶上，连正眼都不往门缝里瞧一下。\n\n“陈长庚，耳朵聋了？”庞文禄拿铜尺隔空一点，“冯管事体恤各房腊月风寒，特拨匠人加固外门风墙，每房摊派两枚下品灵石！”\n\n陈长庚扶着门框剧烈喘咳两声，嘶声道：“庞大人，小人上月连净灰茶水钱都是凑俗世碎银交的，哪来的两枚整灵石啊……”\n\n“少跟本官哭丧！”\n\n庞文禄厌恶地往后退了半步，“冯管事有钧令，明日巳时前自己送去纳贡院偏厅销账！”\n\n“逾时不交者，一律算抗捐怠工，当场拿铁链锁去后山赤煞毒矿眼替内门探脉！”\n\n丢下这句催命狠话，庞文禄一甩直裰下摆，带着皂役匆匆往坡上甲字房敲锣去了。\n\n陈长庚掩上铁门，眼底寒芒微闪。\n\n加固什么风墙？前两日送灰老火工闲聊时早漏了底——冯保山那刚满十四岁的幼子测出了真窍资质，正差百枚下品灵石打点内门长老铺路！\n\n这老狐狸趁着年底刮地皮，明着收两枚灵石，交不出的正好拿去顶内门摊派的探矿死差，一石二鸟吃人不吐骨头。\n\n“我兜里虽有十四枚整灵石，可一旦痛快掏出两枚，冯保山立马就知道我上月咳血哭穷是在耍他。”\n\n陈长庚看了一眼自己被热碱熏得红肿发乌、挂满水亮燎泡的双手，心头算盘已然拨响。\n\n掏钱是死路，硬抗也是死路。\n\n唯有把石百川刚赐下的这张丹堂虎皮，结结实实拍在冯保山脑门上！\n\n次日，十二月二十日辰时末。\n\n纳贡院西侧偏厅外人声嘈杂，十几名眼圈发黑的外门杂役排着长队，个个肉疼得手抖，正往庞文禄案头交灵石。\n\n两名挂着丹堂腰牌的送药杂役恰好挑着药箱停在廊下歇脚，正跟守门皂役讨热茶喝。\n\n陈长庚算准这个当口，没有排在队尾，而是高高举着两只缠着破麻布、不断往外渗黄水的烂手，双手捧着那只红木塞白瓷药瓶，一步三咳地抢进了偏厅门槛！\n\n“咳咳咳……丙字房陈长庚，来交防风修缮费！”\n\n这一嗓子沙哑凄厉，瞬间引得厅内外二十多双眼睛齐刷刷看了过来。\n\n案后的庞文禄一见他那双乌紫烂泡的手伸过来，吓得把茶盏一摔，猛地站起身尖叫：“站住！谁让你个烂肺鬼进厅的？灵石扔地上赶紧滚！”\n\n陈长庚扑通跪在门槛内侧，眼眶通红，把白瓷药瓶举过头顶：\n\n“回庞大人，小人昨日替丹堂石百川石副管事徒手筛了十筐炸炉毒砂，一双手全烂透了，实在没地方去抠两枚下品灵石！”\n\n他故意把嗓门抬高三分，生怕廊下那两名丹堂杂役听不见：\n\n“幸得石副管事仁慈，昨晚亲临丙字房，赏了小人这半瓶丹房官制净髓引保命拔毒！”\n\n“小人不敢误冯管事修风墙的大事，斗胆拿石副管事亲赐的保命药抵这两枚修缮灵石，求大人收下销账！”\n\n轰！\n\n厅外排队杂役一片哗然，廊下那两名端着茶碗的丹堂杂役更是猛地扭过头，眼神古怪地盯向那只印着丹堂暗纹的白瓷瓶！\n\n庞文禄的手僵在半空，额角冷汗唰地冒了出来。\n\n丹堂实权副管事石百川亲赐的拔毒官药！\n\n这要是收进纳贡院充了私设杂捐，不出半个时辰就得传进石百川耳朵里——以石老头护短暴烈的驴脾气，非打上门参冯管事一本“贪墨苛剥、截夺丹堂赏药”不可！\n\n“吵什么？”\n\n内屏风后转出捧着紫砂小茶壶的冯保山，胖脸上本带着几分收钱的惬意，目光一扫陈长庚手里的丹堂瓷瓶和廊外丹堂杂役，瞳孔骤然一缩。\n\n庞文禄慌忙凑过去低语两句。\n\n冯保山脸皮微不可察地抽了一下，心底把陈长庚祖宗八代骂了个遍，表面却在眨眼间换上一副痛心疾首的慈悲面孔！\n\n“啪！”\n\n冯保山反手一巴掌拍在庞文禄肩膀上，沉着脸厉声训斥：“混账东西！本官让你收各房余力修缮费，谁准你逼一个替丹堂办差烂了双手的苦命孩子交钱了？！”\n\n庞文禄愣了一瞬，连忙顺杆弯腰认错：“大人息怒，是小的死板糊涂，没看清陈兄弟的伤势！”\n\n冯保山背着手走到门槛前，隔着五步远温言俯视陈长庚，声音洪亮得满院皆闻：\n\n“长庚啊，快把石师弟赏你的救命药收好！你既替丹堂和本院分忧守着丙字房，便是外门有功之人！”\n\n他大袖一挥，把仁义牌坊立得足足的：“庞书办记下！本院体恤丙字房清灰艰辛，自今日起，免去陈长庚半年内一切杂项修缮摊派！快回去上药歇着吧！”\n\n廊外两名丹堂杂役暗暗点头，排队众杂役更是看得眼热不已。\n\n陈长庚心里冷笑，脸上却涕泪横流，死死护住怀里分文未动的药瓶连磕三个响头：“谢冯管事活命大恩！小人日夜替大人祈福！”\n\n一路捧着烂手千恩万谢退出纳贡院，拐进后山无人小径，陈长庚脊梁骨瞬间挺直如枪。\n\n一文钱没花，非但挡回了毒矿眼死差，还白赚半年免捐金牌，更让冯保山坐实了他穷得只剩半瓶赏药的假象。\n\n次日便是十二月二十一日，冬至。\n\n铅灰云层压得极低，晌午刚过，鹅毛大雪便伴着呼啸山风封死了整座废渣谷。\n\n送灰火工冒雪推车进院时冻得直哆嗦：“陈小子，今儿冬至大暴雪，夜里外院巡卫换防都得缩进暖阁喝酒，你早点落栓煨火吧！”\n\n“借王老哥吉言，小人这就锁门烧炭。”\n\n送走火工锁死千斤铁门，恰逢午后第二十轮地脉潮汐期满，陈长庚照例开阵炼化紫火炉底灰，寒玉匣内无瑕道髓晶砂稳稳增至四十三钱。\n\n趁着天黑前地火正旺，他又取出两袋鼎余轩买来的狂暴硫煞废丹灰。\n\n依着《控火诀》分流聚爆法门，陈长庚用熟铜壳严丝合缝压制出两枚比寻常火器烈上三倍的过载烈阳火珠，妥帖扣入右袖暗袋。\n\n入夜，暴雪狂吼，积雪深逾尺半。\n\n青石卧房内，陈长庚往青铜隔味阵盘按入灵石撑开气幕，打开锁灵寒玉匣，用竹匙一口气舀出整整五钱无瑕道髓晶砂仰头吞下！\n\n通窍第七窍属上三窍重关，非猛药洪流不足以一鼓作气轰穿！\n\n晶砂入腹，磅礴纯净的道髓暖流轰然炸开，没有一丝丹毒滞涩！\n\n陈长庚双目紧闭，催动《引火行气诀》与《井煞锻骨诀》中卷法门，六处圆满气窍如六座沸腾烘炉，裹挟着千斤气血洪流朝着胸口正中第七处主气窍悍然撞落！\n\n一撞，窍壁剧震！\n\n再撞，裂纹贯通！\n\n子时初刻，陈长庚周身百锻皮膜骤然腾起一层深邃暗金光泽，第七处主气窍轰然洞开！\n\n刹那间，七窍气血贯连成势，双臂气力暴涨至一千五百斤开外，耳目五感更在气机洗练下敏锐了近乎一倍！\n\n陈长庚刚睁开精光湛然的双眸，还没来得及收起阵盘——\n\n隔着漫天风雪呼啸声，他暴涨的耳力猛地捕捉到后院断崖上方三十丈处，传来“嘣”的一声极轻马尾弦断响！\n\n紧接着，“噗”的一声闷响。\n\n他亲手栓在后崖枯松死角的那枚防贼预警铜铃，连半声脆响都没发出，便被人一刃剪断引线，悄无声息坠进了厚厚雪泥里！"}, {"n": 35, "title": "雪夜埋钉", "body": "雪风灌进山谷，把最后一丝铃线断音彻底吞没。\n\n青石卧房内，陈长庚眼神冷得像万年寒铁，动作却快如鬼魅。\n\n半息收起隔味阵盘与还剩三十八钱晶砂的寒玉匣，连同蚀纹石臼一并贴腹绑死在玄铁护心镜下；两息掀开墙角地砖，将寒铁虫瓮盖栓拧松半扣！\n\n鼻翼微动间，一股混在暴雪寒气里的淡淡腥甜刀油味与生人血气，已顺着后崖岩壁飞速滑入后院！\n\n两人！\n\n一人脚步虚浮带躁，是通窍四窍；另一人落地轻若狸猫，呼吸绵长阴冷，赫然是通窍六窍的老牌杀手！\n\n“冬至暴雪，巡卫换防空档，摸后崖剪断铃……窦文焕这阔少爷连年关都等不及了。”\n\n陈长庚没有点灯，更没有傻站在门口硬拼惊动山谷。\n\n他探手从火炉膛边抓起四块烤得滚烫的耐火砖坯，飞快塞进装废铜的破麻袋里卷成条状，一把塞进石榻破棉被底下拱出人形，连带着被窝都透出活人睡熟的微热！\n\n下一瞬，他双足一点地面，一千五百斤横练气力收放自如，整个人如壁虎般倒挂上房梁阴影里的排灰暗槽顶壁，右手拎起满满一袋筛剩的极细赤铅毒灰，屏住了一切呼吸！\n\n三息之后。\n\n卧房背风的木格小窗缝里，悄无声息探进一柄薄如柳叶的乌黑匕首，轻轻一挑便拨开了木栓。\n\n两道裹着夜行黑毡衣的蒙面人影翻窗落地，没有发出半点声响。\n\n后头那个矮壮黑衣人左手赫然缺了一根尾指，借着窗外雪光死死盯住石榻隆起的被窝，压极了嗓音狞笑：“夜枭老哥，我就说这三窍烂肺鬼睡得跟死猪一样！一刀抹了脖子扔进地火坑，神仙也查不出痕迹！”\n\n正是收了窦文焕十五枚灵石、憋着断指血仇赶来虐杀的卢成！\n\n前头那名鹰眼瘦削、浑身透着血腥气的通窍六窍杀手夜枭却没搭话，右手反握淬毒短刺，左袖扣死三寸袖箭机括，足尖点地暴掠至石榻前！\n\n“噗嗤——铛！！”\n\n灌足六窍阴煞劲力的一刺狠狠扎穿破棉被，非但没有刺入血肉的绵软感，反而撞在坚硬滚烫的耐火砖坯上，擦出一溜刺眼火星！\n\n“不好！是空被热砖——”\n\n夜枭不愧是刀口舔血十年的老杀手，脸色剧变的刹那脚尖猛蹬床沿暴退，左臂本能朝头顶房梁阴影猛抬！\n\n然而他快，早已蓄势待发的陈长庚比他更快！\n\n“哗——！！”\n\n倒挂顶梁的陈长庚右腕猛抖，整整二十斤呛鼻蚀目的极细赤铅毒灰如黑瀑倾泻，铺天盖地将下方狭小丈许空间彻底淹没！\n\n“咳啊——我的眼！！”\n\n刚扑上前半步的卢成猝不及防吸了满肺火辣铅灰，眼珠子火烧般剧痛飙泪，瞬间成了瞎子！\n\n夜枭第一时间闭气偏头，在漫天黑灰中听风辨位，左袖机括悍然震响！\n\n“咻咻咻——！”\n\n三支足以射穿五窍修士胸骨的乌钢破甲袖箭呈品字形撕裂毒灰，贴脸直射陈长庚胸腹要害！\n\n避无可避，陈长庚压根不避！\n\n他双眸寒芒暴涨，体内刚破通窍第七窍的磅礴气血与《井煞锻骨诀》中卷横练劲力瞬间灌满前胸双臂，左臂曲肘横封咽喉，整个人如千斤铁锤般顺势扑落！\n\n“叮！叮！噗！”\n\n两支乌钢袖箭撞在他泛着暗金微泽的小臂皮膜上，竟发出金铁交击的闷响双双崩飞，最后一支擦过肋下皮肉只划破半寸浅口，连骨膜都没伤到分毫！\n\n“什么？！横练体修？！”\n\n毒灰弥漫中，夜枭听见崩箭脆响吓得头皮炸裂，转身就要撞破房门逃命！\n\n可陈长庚落地刹那右手早已贴地一扬！\n\n两枚外壳压到极限的过载烈阳火珠顺着青石砖面滚至卢成脚边！\n\n“轰隆——！！”\n\n屋外暴雪狂风与后院地火轰鸣成了最完美的掩护，两团刺目紫赤火球在狭小卧房地面贴脸炸开！\n\n恐怖的硫煞冲击波瞬间将刚拔刀乱砍的卢成双膝连骨带肉炸得血肉模糊！\n\n“啊——！！”\n\n卢成惨嚎半声便被热浪掀翻砸在墙角，而正欲夺门的夜枭也被狂暴气浪震得护体六窍劲气溃散、身形猛地一滞！\n\n就这一滞，生死已判！\n\n一道黑影如鬼魅般贴着火光残烟欺近夜枭背后，一千五百斤巨力尽数凝于右掌七寸精铁淬毒分水刺尖！\n\n“噗嗤！”\n\n乌黑分水刺毫无阻碍地从夜枭后心贯入、前胸透出，精准绞碎心脉！\n\n夜枭浑身剧震，艰难扭过半张布满惊骇的脸，嘴里涌出黑血：“你……不止六窍……”\n\n陈长庚手腕一拧抽回毒刺，任由夜枭软绵绵扑倒毙命，转身一步踏到双膝尽碎、满脸血污的卢成面前。\n\n火光余烬映出陈长庚那张毫无血色波动的冷峻面庞。\n\n卢成看清来人毫发无损、气血如渊的恐怖模样，疼得浑身抽搐，鼻涕眼泪混着血沫拼命往后缩：\n\n“别、别杀我！我是刑律堂卢耀亲表弟！窦文焕出了十五枚灵石雇夜枭杀你，只要你饶我狗命，我替你去咬死窦文焕，我表哥给你三十枚灵石——”\n\n陈长庚连半个字都没回他。\n\n蹲身，探掌，五指如百炼铁钳扣住卢成下颌与后颈，“咔嚓”一拧！\n\n颈骨寸断，卢成双目圆瞪，求饶声永远卡死在了喉咙里。\n\n屋内重归死寂，唯闻窗外暴雪呜咽。\n\n陈长庚吹亮火折扫视一圈，打开墙角寒铁药瓮，心念催动神血母印。\n\n三十六只嗜铁煞甲虫如黑线般涌出，眨眼间便将崩落在地的三支乌钢袖箭、两枚烈阳火珠炸碎的熟铜残片乃至石榻上的刺痕铁屑啃食得渣都不剩！\n\n收回甲虫，陈长庚铲起地上染血的铅灰尽数扬入后院三丈地火坑烧成虚无，又铺回一层干净旧灰，修好窗栓，屋里连半星打斗气息都闻不见。\n\n随即他仔细将两具尸首全身上下摸索一空。\n\n夜枭腰间皮袋里有十五枚刚收的雇凶整灵石外加四枚私蓄整石，合计十九枚完整下品灵石，另有一枚刻着篆体“窦”字暗纹的青玉私印腰佩——正是窦文焕给杀手验明正身的信物！\n\n再探入夜枭贴胸油皮暗囊，指尖却摸出了一张折得方方正正、边缘沾着干涸血迹的麻纸悬赏单。\n\n陈长庚凑近火折扫过纸面，瞳孔微微一缩。\n\n“悬赏红榜：云泽宗丙字房陈长庚，取首级者十五石……”\n\n目光下移，他心头猛地一凛！\n\n只见陈长庚三个字上方，竟还用朱砂勾掉了两个名字、留着一个未勾的名字——王老栓、刘瘸子、孙铁牛！\n\n这三个名字他太熟了，赫然全是十年前在乌卤盐场跟着老工头修缮过地底排卤暗渠、如今退入外门各镇养老的老杂役！\n\n“有人在借窦文焕和地下黑手，顺着乌卤盐场旧档清洗所有知晓排卤暗渠的活口？！”\n\n陈长庚深深看了那张染血悬赏单一眼，将其与十九枚灵石、窦家玉佩一并锁入储物袋。\n\n子时三刻，暴雪最猛。\n\n陈长庚拔出卢成自己的短刀，在夜枭与卢成尸身上交互补了两记刀口，用破麻袋捆起两具死尸扛上肩头，趁着漫天风雪掩护翻出后崖，一路疾行三里，直抵西坡卢家把持的废私矿断崖顶。\n\n他将两具尸首连同空瘪钱袋狠狠推落十丈乱石深坡，风雪不过半刻便掩去了崖顶一切脚印。\n\n“分赃不均，黑吃黑坠崖——卢巡查，明早这份冬至大礼，你可得接稳了。”"}, {"n": 36, "title": "指鹿咬狗", "body": "十二月二十二日，雪霁天晴，寒风如刀。\n\n辰时刚过，丹堂那两名聋哑老火工便踩着厚雪，将第二批十筐报废古丹炉残渣送进了丙字房。\n\n临走前，老火工还在石桌上留下了一块盖着石百川朱砂私印的“丹堂限期筛砂签押令”。\n\n陈长庚收好木令，早在天亮前便下到后院三丈深的地火坑底，撬开了火成岩背风死角的一块暗砖。\n\n三十三枚整灵石、三块碎灵石、寒玉匣、储物袋，连同蚀纹石臼与寒铁虫瓮，早被他严严实实封入赤铅火泥后头。\n\n回到冰冷卧房，他只在破木匣明面留下一大一小两块残次灵石，又往痰盂里倒了半碗铁锈黑血水。\n\n随即锁气劲悄然一收，一身通窍七窍气血便死死压回了“三窍虚浮、肺管漏风”的半死病相。\n\n果不其然，还没挨到未时初！\n\n“砰——哐当！！”\n\n前院生铁大门被人一脚暴踹得轰然砸在石墙上，连门框积雪都震塌了一大片！\n\n双目赤红如疯狼的卢耀提着鬼头刀第一个冲进院子，身后紧跟着两名身穿玄铁锁子甲、气息沉凝达通窍六窍的刑律堂执法铁卫！\n\n“小畜生！滚出来受死！！”\n\n卢耀一步蹿进卧房门洞，瞧见正蹲在炭盆前捂嘴剧咳、双手缠着渗黄水烂布的陈长庚，一把揪住他衣领就要往外拖：“说！昨晚冬至夜，你是怎么害死我表弟卢成和夜枭的？！”\n\n“慢着！”\n\n后头那名国字脸、留着络腮胡的刑律堂廖铁卫眉头一皱，伸手按住卢耀手腕，冷声道：“卢师弟，西坡私矿崖底发现两具尸首，堂主命我二人随你下谷协查，没见到铁证前，刑律堂不兴屈打成招！”\n\n说完，廖铁卫朝同伴使了个眼色：“搜！连床板灰堆都别漏！”\n\n另一名铁卫当即拔出铁鞘在狭小卧房里翻箱倒柜，挑开破棉被、掀翻烂草席、踢开墙角杂物瓦罐。\n\n他一路查到后院热浪熏天、毒烟刺鼻的地火排渣坑口，被硫烟呛得连退三步。\n\n半刻钟后，那铁卫捂着鼻子走回来摇头：“廖头儿，全屋搜遍了，除了两块不值钱的残次灵石、半盂黑毒血痰和丹堂送来的十筐废炉渣，连件像样的铁器都没有！”\n\n卢耀胸口剧烈起伏，咬牙切齿道：“定是他藏了修为！廖师兄你亲自搭他的脉！”\n\n廖铁卫上前一步，蒲扇大手猛地扣住陈长庚烂泡密布的右腕脉门，一股阴冷霸道的通窍六窍内息长驱直入！\n\n陈长庚顺势闷哼一声，脸色由蜡黄瞬间转作青白，体内锁气劲纹丝不乱。\n\n他只任由那股六窍真气在三条虚浮纤弱、淤满燥烈火毒的气窍间横冲直撞，喉头一甜，“噗”地呛出一口暗红血丝！\n\n廖铁卫试了三息便闪电般松开手，还在袍角蹭了蹭指尖黄水，转头沉脸看向卢耀：\n\n“千真万确的通窍三窍虚浮病脉，肺窍火毒都快烂穿了，双手更是被丹毒蚀得握不住刀！”\n\n廖铁卫冷哼道：“崖底那夜枭是乱石集出了名的通窍六窍狠手，致命伤是一击贯穿心脉，卢成双膝更被猛烈火器炸碎！”\n\n“你告诉我，这么个三窍烂手病秧子，怎么毫发无损瞬杀他们两个，再扛去三里外的西坡？！”\n\n卢耀被问得哑口无言，可一想到表弟惨死在自家私矿坡下、全身灵石被摸得精光，理智早已被怒火烧穿：“就算不是他亲手杀的，他也定然知情！来人，先把他锁回刑律堂大牢，夹棍伺候自然招认——”\n\n“咳咳……卢、卢师兄饶命啊！”\n\n陈长庚吓得缩在墙角瑟瑟发抖，双手慌忙捧起石桌上那块朱砂木令，涕泪俱下地朝廖铁卫哭喊：\n\n“两位铁卫大人救命！小人昨晚冬至大雪一步都没敢出院门，只半夜起来去后墙根倒灰水时……隔着雪雾瞧见坡上好像有人提着灯往西坡私矿方向走……”\n\n卢耀眼珠子猛地瞪裂，死死钉住他：“你瞧见谁了？！”\n\n陈长庚被他凶相吓得一哆嗦，把头埋进臂弯里直往后缩：“雪、雪太大小人真没看清脸……只瞧见那人手里提着丹堂制式青纱风灯，身形像是前几日跟在窦文焕窦师兄身后的家仆……”\n\n他死死抱住怀里的朱砂木令哭求：“小人还要按签押令限期替石百川石副管事筛赤髓砂，求各位大人别锁小人走啊！”\n\n轰！\n\n“窦文焕的随从？！”\n\n卢耀脑子里仿佛炸开了一记惊雷，整张脸瞬间扭曲得不成人形！\n\n别人不知道昨晚怎么回事，他卢耀能不知道吗？！\n\n昨晚正是窦文焕掏了十五枚灵石，撺掇卢成领着夜枭来废渣谷杀陈长庚！\n\n前几天春煞散案发，焦旺被抽五十铁鞭发配洗药涧，外院早有风声说窦文焕怕牵连自己，一直在暗中灭知情人的口！\n\n卢成恰恰知道窦文焕好几桩黑活底细！\n\n定是窦文焕这毒蛇怕夜袭败露，派心腹高手暗中尾随，等卢成与夜枭分赃时杀人灭口，连十五枚雇凶灵石都一并黑了回去！\n\n越想越严丝合缝！\n\n两名刑律堂铁卫对视一眼，眼底也露出恍然忌惮之色。\n\n外门谁没听说卢成近月一直替盐商阔少窦文焕跑脏腿？如今一边是手握石百川限期签押令的三窍病杂役，一边是卢家与丹堂阔少分赃黑吃黑的烂泥潭！\n\n“够了！收队！”\n\n廖铁卫当机立断一挥手，冷冷警告卢耀：“陈长庚有石副管事的丹堂急差在身，脉象屋舍皆无嫌隙，谁也不准动私刑！卢耀，你表弟跟谁合谋犯险，你自己找正主算账去，别拉刑律堂下水背黑锅！”\n\n说完，两名铁卫头也不回跨出铁门。\n\n“窦、文、焕——！！”\n\n卢耀从牙缝里挤出三个带血的字，再不看墙角的陈长庚一眼，提着鬼头刀双目赤红地冲出废渣谷，直扑外门丹堂上舍！\n\n不到半个时辰，前山便炸开了锅。\n\n傍晚送炭老役路过谷口时，隔着铁门拍着大腿直咋舌：\n\n“痛快！卢耀提刀一脚踹碎了窦家阔少的小院门，咬死窦文焕卸磨杀驴害了卢成，当众逼他赔一百枚下品灵石封口！”\n\n陈长庚扶着门框低咳一声：“窦师兄肯认这笔账？”\n\n“认个屁！窦文焕有苦说不出，连夜喊来护院家丁跟卢耀动了刀子，两条昔日穿一条裤子的恶犬彻底撕破脸皮啦！”\n\n送走老役，夜色深沉，陈长庚锁死院门与西灰口，从后院地火坑暗砖后取回全部家当。\n\n“狗咬狗，一嘴毛，够他们消停好一阵子了。”\n\n陈长庚回到点着油灯的卧房，将白日丹堂送来的那十筐报废古丹炉残片倒在青石板上，准备先挑一遍赤髓砂。\n\n这是丹堂库房积存了几十年的老炉底碎渣，混着不少烧裂的青铜片与焦黑废石。\n\n陈长庚伸手拨开两块碎炉壁，指尖刚触及筐底一块巴掌大小、布满蜂窝状蚀孔的暗青色炉底垫石——\n\n“嗡——！！”\n\n一直安安静静贴在他腹间护心镜内侧的半截蚀纹石臼，毫无征兆地滚烫震颤起来，竟隔着皮肉传递出一股前所未有、近乎贪婪渴望的剧烈嗡鸣！"}, {"n": 37, "title": "垫石验锁", "body": "暗青色炉底垫石不过巴掌大小，表面布满蜂窝似的焦黑蚀孔。\n\n陈长庚指尖刚搭上去，贴在腹间护心镜内侧的半截蚀纹石臼便烫得惊人，臼壁断口那道暗金裂痕竟隐隐透出一丝微光。\n\n“奇了，连紫火官炉的延寿丹毒渣都没让它这么馋过。”\n\n陈长庚压下心头悸动，没有强行催动——距离冬至午后那轮提纯才过去一天半，三十六个时辰的潮汐冷却还没满。\n\n他将垫石小心藏进储物袋，顺手摸出前夜从杀手夜枭怀里搜来的那只贴胸油皮暗囊，凑在油灯下细细拆看夹层。\n\n干刀口舔血买卖的老油子，接阔少爷的脏活向来会留一手防卸磨杀驴。\n\n果不其然，分水刺尖挑开暗囊底缝，里头除了那张染血悬赏单，还折着半张盖有窦氏私记指印的乱石集黑市货单。\n\n薄纸上白纸黑字，清清楚楚记着窦文焕家仆私购三斤“火麝髓”与二斤“赤桃蕊”的斤两银数！\n\n“焦旺被抽五十铁鞭的时候，窦文焕花重金赌咒发誓自己毫不知情，原来采买禁药主材的亲笔底单一直捏在夜枭手里。”\n\n陈长庚吹熄油灯，将这半张催命薄纸夹进了《控火诀》册页里。\n\n次日辰时，送灰老火工王老头推车进院，满头白霜混着热汗，连旱烟袋都顾不上抽。\n\n“王老哥，今儿前山怎么连钟声都乱了？”陈长庚递过半瓢温水，弯腰低咳两声。\n\n王老头灌了一口水，压低嗓门直拍大腿：“别提了！昨儿傍晚内门丹堂下来一位黑脸执事，指着石副管事的鼻子骂了半个时辰！”\n\n陈长庚眉头微挑：“内门执事发这么大火？”\n\n“可不是嘛！限咱们外门丹房五日内赶交三十瓶‘古墟避瘴丹’，这会儿前院十几口药炉全烧红了，学徒跑断腿都要挨鞭子！”\n\n王老头推起空车匆匆嘱咐：“你那批赤髓砂赶紧挑，明天去交差时千万顺着石大人的毛摸，别往枪口上撞！”\n\n“晓得了，多谢王老哥挂心。”\n\n送走灰车，陈长庚锁死院门，眼底闪过一丝精芒。\n\n前山果然动起来了！\n\n熬到十二月二十四日午后，贴腹的蚀纹石臼准时传来沉浑潮汐脉动。\n\n第二十一轮充能就绪！\n\n陈长庚盘膝坐上石榻，往青铜隔味阵盘凹槽按入一枚灵石撑开三尺气幕，取出那块暗青色炉底垫石，稳稳按进石臼凹槽。\n\n“嗡——咔嚓！”\n\n没有往常研磨废灰的滞涩声，坚逾精铁的蜂窝垫石刚触及臼底古纹，竟如冰雪遇沸汤般寸寸酥裂化为飞灰！\n\n刹那间，臼壁断口那道非金非玉的暗金裂痕骤然亮起三寸金芒！\n\n只是那金芒闪了三息便不甘心地重新黯淡下去，臼底没有析出一粒白色晶砂，反而凝出了一缕比发丝还细、灿若赤金的奇异髓气！\n\n“百年前大泽古盐墟外围采出暗青蜂窝奇石，性耐万钧地火，昔年丹师常取其废壳垫炉……这是《大泽外门废矿志》里记载的‘地母玄晶伴生废壳’！”\n\n陈长庚脑中电光一闪，张口将那缕即将消散的金丝髓气吸入腹中！\n\n轰！\n\n那缕金丝髓气入喉似有千钧之重，顺着经络直坠气海，原本刚破通窍第七窍不久、尚有一丝浮躁的七处主气窍齐齐发出清越鸣响！\n\n不过十几个呼吸，他一身气血便凝练如汞，修为彻底稳固在通窍七窍中期！\n\n更让陈长庚心头雪亮的是石臼刚才那三息异动——\n\n普通丹灰卤渣最多帮他堆满九窍，想要冲破凡胎桎梏贯通周天仙脉，或是彻底激活蚀纹石臼二阶转化，非得弄到真正的“地母玄晶”做母引不可！\n\n半个时辰后，陈长庚收妥石臼，将挑好的四两赤髓砂装入白瓷盘。\n\n他又取出夜枭留下的那半张禁药货单，悄然夹进《筛灰交接簿》末页，揣着烂布包扎的双手走上外门丹房。\n\n刚踏进丹房侧院，两名灰衣药童便捂着肿成猪头的脸哭丧着跑出来。\n\n“滚！再烧焦一炉避瘴草，老夫把你们全填进炉膛当柴烧！”\n\n偏厅里传出石百川暴躁如雷的咆哮。\n\n陈长庚弓着虾米腰，低眉顺眼跨进门槛：“小人陈长庚，奉命交第二批赤髓砂，求石副管事核验。”\n\n石百川正急得嘴角起泡，见四两赤髓砂成色分毫不差，五粒记号铜珠也原封躺在盘底，脸色总算缓了三分：“算你小子手脚麻利！”\n\n陈长庚捧着交接簿跪在地上，故意龇牙咧嘴倒吸了一口凉气，低声道：“回大人，这一批老炉渣底火比上回还毒，里有几块青黑蜂窝碎石，熏得小人掌心烂泡直冒黑水……”\n\n“哼，那是百年前沉渊古盐墟外围刨出来的地母玄晶伴生废壳，能不霸道吗？”\n\n石百川随口哼了一句，话音未落，一双虎目忽然直勾勾盯住了陈长庚乌肿的双掌，眼珠子猛地一转！\n\n他转身从公案底层抽出一张盖着鲜红丹堂大印的黄麻文书，“啪”地拍在陈长庚面前！\n\n“陈小子，你来得正好！内门急调三名耐火毒的‘背篓探路杂役’随丹堂进古墟外围采药，赏十枚下品灵石！你熬得住伴生石毒烟，这桩肥差老夫便宜你了，按手印吧！”\n\n空气瞬间凝固！\n\n十枚灵石的肥差？黄麻纸右上角明晃晃印着“死伤勿论”四个血红小字，分明是拿绳子拴在前头替内门弟子肉身蹚蚀骨风眼的必死炮灰契！\n\n一旦按了手印，出入路线全被内门锁死，别说暗中谋夺地母玄晶，能不能活过头道风口都是两说！\n\n“咳咳咳——！！”\n\n陈长庚吓得浑身剧颤，非但没去碰朱砂印泥，反而一头重重磕在青石砖上，咳得上气不接下气：“石、石大人明鉴！小人不是惜命，实在是这副三窍烂肺身子刚见风就喘不上气啊！”\n\n石百川眼睛一瞪，一掌拍得桌面茶盏乱跳：“少给老夫装死！本房耐火熟手全在赶炼避瘴丹，你不去谁去？来人，掰开他的指头按印！”\n\n门外两名护院火工闻声就要跨进来！\n\n“大人息怒！”陈长庚急声抢话，一句话直扎石百川最痛的软肋，“内门执事要的是能背三十斤避瘴丹篓走完十里毒滩的活劳力！小人进谷不到半刻钟就得断气，万一摔碎了内门贵人的丹篓，岂不是连累石大人担一个以次充好、贻误军机的重罪？！”\n\n石百川手掌猛地僵住，脸色阴晴不定：“可名册明早就要交上去，老夫上哪儿抓个耐火又通四窍的替死鬼？！”\n\n陈长庚膝行半步，双手颤巍巍将那本《筛灰交接簿》高举过头顶：“小人替大人销签押令……对了大人，小人昨夜挑那十筐旧炉渣时，在筐底竹缝里捡着半张不知哪位师兄落下的黑市药单子，小人斗胆不敢私看，一并呈给大人……”\n\n“什么破烂单子？”\n\n石百川烦躁地一把扯过交接簿，夹在末页的那半张乱石集麻纸飘落掌心。\n\n只扫了一眼，石百川瞳孔骤然缩成针尖！\n\n“乱石集老鬼摊，收窦记银八十两，付火麝髓三斤、赤桃蕊二斤……底部还带着窦文焕那小畜生独有的折扇私押？！”\n\n石百川气得胡须乱颤，随即胸口浊气一松，竟发出一声狰狞至极的冷笑！\n\n好一个盐商阔少窦文焕！\n\n前几天春煞散案发拿灵石糊弄他说是焦旺一人所为，害他替丹堂背了一身腥臊。\n\n两天前卢耀又提刀闯进丹堂上舍跟窦文焕狗咬狗，闹得内门执事都骂他石百川治下乌烟瘴气！\n\n窦文焕今年二十二岁，通窍四窍清气修为，不正是现成能背三十斤药篓的顶缸肥羊吗？！\n\n“陈小子，你今儿倒是替老夫送了场及时雨！”\n\n石百川一把抓回桌上那张探路死契揣入怀中，大袖一挥：“你这烂肺鬼确实不够给内门丢人现眼的！滚回丙字房关死门替老夫筛砂，今天这半张纸的事，敢往外漏一个字，老夫割了你的舌头！”\n\n“小人本来就不识几个字，什么也没瞧见！谢石大人体恤！”\n\n陈长庚磕头如捣蒜，揣起销讫的木令倒退着溜出丹房侧门。\n\n身后偏厅里，已炸开石百川中气十足的怒吼：“来人！去上舍把记名学徒窦文焕给老夫绑过来签入墟采药契！他敢放一个屁，就把他私购三斤火麝髓的铁证直接捅去刑律堂大牢！”\n\n回到丙字废渣房，陈长庚洗去手背黄水，眼底一片冷寂。\n\n两天后，十二月二十六日傍晚。\n\n被石百川捏死罪证强按了探路死契的窦文焕，哭爹喊娘跑到内门山门外，求他那位世家远房表哥出面捞人。\n\n谁知人没捞出来，半个时辰后窦文焕面无人色地瘫软下山，一桩石破天惊的凶讯瞬间席卷整座云泽宗外门——\n\n大泽地底那座本该明年夏天才开的绝地“沉渊古盐墟”，地磁退潮骤然提前半年异动，内门精锐已全线封锁外围水道！"}, {"n": 38, "title": "暗拍淘偶", "body": "凶讯传开不到三日，云泽宗外门各处坊铺的疗伤丹与护身符价钱翻了一倍还多。\n\n丙字废渣房终日毒烟缭绕，反倒成了风声鹤唳里最清静的死角。\n\n十二月二十七日午后，第二十二轮地脉潮汐期满，陈长庚照例炼化紫火炉底灰，锁灵寒玉匣里的无瑕道髓晶砂稳稳攒到了四十二钱。\n\n更让他惊喜的是地砖暗格里那只寒铁药瓮——\n\n吃光了半斤赤精铜屑与十筐延寿丹赤铅毒壳后，三十六只嗜铁煞甲虫在二十八日子夜齐刷刷蜕下一层薄如黑纸的旧壳！\n\n蜕壳后的一阶成虫通体呈暗金乌铁色，锯齿毒颚开合间寒芒森然，神血母印催动之下如臂使指，再无丝毫迟滞。\n\n十二月二十九日，戌时正。\n\n山野黑风呼啸，陈长庚借夜行木签悄然出谷，在密林里换上黑麻斗篷与遮面生铁斗笠，揣着三十三枚完整下品灵石踏入山脚乱石集。\n\n破茶棚挑檐下，一根青竹签正随风轻晃。\n\n“灰爷！您老人家可算来了！”\n\n守在灶后的贺九斤一见那顶熟悉的生铁斗笠，忙不迭猫腰迎上来，一边拿抹布擦矮凳一边压极了嗓门：\n\n“您上月交代收的硫煞火器，这几天全被各大宗门外围采买扫空了，倒是今晚子时集底有一场月末‘暗拍会’，流出不少压箱底的硬货！”\n\n陈长庚在阴影里坐下，哑声问道：“暗拍会水深不深？”\n\n“深！古盐墟退潮提前，周边百里刀口舔血的亡命徒全闻着腥味钻过来了！”\n\n贺九斤拢着袖筒比了个抹脖子的手势，小声提醒：“尤其是三年前因偷盗百炼精铁被云泽宗器堂赶下山的弃徒孟逵！”\n\n“那可是通窍七窍的硬茬子，专在暗拍会后头盯独行肥羊，灰爷待会儿露财可得千万留神！”\n\n“器堂弃徒？”陈长庚指尖微顿，不置可否，“走，带路进场。”\n\n交过两块散碎银子的门头钱，两人穿过三道暗哨铁门，步入一座掏空山腹建成的昏暗地下石窟。\n\n石窟内早已黑压压坐了七八十名蒙面戴笠的散修，空气里混杂着血腥气与旱烟臭味。\n\n高台铁案后，一名干瘦老者敲响铜磬，一件件拍品流水般呈上。\n\n“丹房流出的正宗净髓引一瓶，底价十枚下品灵石！”\n\n“十二枚！”\n\n“老子出十六枚！谁敢跟老子抢破窍救命药！”\n\n台下散修眼珠子通红，叫价声此起彼伏，连一柄卷了刃的精钢短剑都拍出了十二枚整灵石的天价。\n\n陈长庚缩在石柱最阴暗的角落一言不发，冷静盘算着入墟局势。\n\n沉渊古盐墟内乱磁煞雾弥漫，开脉境进不去，却是通窍八窍、九窍的内门世家恶霸扎堆，且乱磁禁绝飞器，寻常符箓灵器十成威能剩不下五成。\n\n他有横练铁骨、分水刺与嗜铁煞甲虫主攻，唯独缺一件能在混战死角替自己硬扛致命偷袭的实体防御重器！\n\n正思忖间，两名壮汉吭哧吭哧抬着一尊四尺高、满身绿锈泥斑的青铜人形铁偶砸上高台，“咚”地一声震得石台乱晃。\n\n干瘦老者干咳两声：“下一件，前代大泽古泥坑挖出来的‘青铜机括盾偶’一尊，附配套腕间子母引簧铜扣！全身百炼青铜重甲浇铸，不受乱磁干扰，护身大盾可硬挡通窍八九窍全力重击三次！”\n\n台下顿时响起一片粗重呼吸声，十几道目光齐刷刷亮了起来。\n\n老者话锋一转，指了指铜偶胸口一道寸许宽的焦黑裂槽：\n\n“丑话说前头，这盾偶胸口核心枢槽损毁了半截，寻常下品灵石灵气驳杂催不动，非得嵌上极纯地火煞晶才能唤醒机括！底价八枚完整下品灵石，概不退换！”\n\n“切——！”\n\n满场散修顿时哄堂倒彩。\n\n“胸口枢槽都裂了，买回去当祖宗供着啊？”\n\n“极纯地火煞晶比开脉灵器还罕见，有那宝贝谁喂个死铜烂铁！”\n\n转眼三息过去，竟无一人应价，干瘦老者举起铜槌正要流拍。\n\n角落阴影里，陈长庚铁面下的双眸却骤然一亮！\n\n极纯地火煞晶别人求爷爷告奶奶找不到，他锁灵寒玉匣里足足躺着四十二钱毫无杂质的无瑕道髓晶砂，不就是由地火废渣提纯出来的至纯煞晶吗？！\n\n“八枚下品灵石，我要了。”\n\n陈长庚抬起左手比了个八字，沙哑低沉的声音不大，却清晰传遍石窟。\n\n全场几十道目光刷地扫了过来，见他真拿一个破铜烂铁当宝，纷纷嗤笑摇头移开视线。\n\n唯有东侧石阶阴影里，一名双腕套着半寸厚百炼精铁护腕、背背硕大生铁锻器箱的络腮胡壮汉眯起凶睛，贪婪地舔了舔嘴唇。\n\n陈长庚面不改色上前交割八枚完整下品灵石，借斗篷遮掩将沉重青铜盾偶连同配套的子母引簧铜扣收入贴腹储物袋，余下二十五枚整灵石分毫未露。\n\n暗拍散场，按事先定下的规矩，贺九斤独自混入大拨人流从东巷撤离。\n\n陈长庚则压低斗笠出了西口，顺着荒草丛生的山涧小径疾行三里，一脚踏进雾气迷蒙、碎石带磁的“乱磁滩”。\n\n身后三十丈外，一阵沉重急促的破风声骤然撕裂夜雾！\n\n“嘭！”\n\n一柄碗口粗的破甲熟铁尺横空砸断前路枯树，络腮胡壮汉孟逵大步拦在滩心，通窍七窍的凶横气血轰然封死退路！\n\n“朋友好阔气啊！八枚整灵石买尊废铜偶眼都不眨一下！”\n\n孟逵双拳对撞，腕上那对半寸厚的百炼精铁护腕撞出闷雷般的金铁铿锵声，“把储物袋里的盾偶外加二十枚买命灵石扔过来，孟爷爷今夜留你一具全尸！”\n\n陈长庚停住脚步，非但没有惊慌后退，反而隔着铁面纱平静打量了一眼他背后的生铁箱：“阁下便是器堂出来的孟逵师兄？不知我拍下那尊盾偶胸口的裂槽，孟师兄可会修补？”\n\n孟逵狞笑一声，满脸傲然：“算你小鬼有眼力！那古偶用的是‘赤铜咬合暗簧’，整座乱石集除了老子这手器堂独门回温三锻术，天王老子来了也是一堆废铜！怎么，死到临头还想求老子给你修？”\n\n“会修就行，省得我白引你跑这三里夜路。”陈长庚淡淡道。\n\n“找死！！”\n\n孟逵勃然大怒，通窍七窍狂暴劲力尽数灌入双臂，整个人如出山恶虎般踏碎溪石暴扑而至，右手破甲铁尺当头猛砸，左手精铁护腕横封陈长庚咽喉！\n\n快准狠辣，寻常六窍散修挨上一下便是脑浆迸裂！\n\n陈长庚站在原地一步未退，左手悄然拍开腰间寒铁药瓮盖扣，心念一催神血母印！\n\n“去！”\n\n“嗡——！！”\n\n一道刺耳高频振翅声骤然压过山涧水响！\n\n三十六道暗金乌黑流光自斗篷下电射而出，快得在夜雾里拉出三十六条残影，迎面撞上孟逵横封而来的百炼精铁护腕！\n\n“拿几只破虫子吓唬谁？给老子碎！”孟逵不屑狂笑，七窍护体刚劲催至极限！\n\n下一息，他脸上的狞笑瞬间僵死！\n\n“咔嚓！咔嚓嚓——！！”\n\n号称刀砍不留痕、重锤砸不瘪的半寸厚百炼精铁护腕，在三十六只初蜕一阶的嗜铁煞甲虫锯齿毒颚合围之下，竟像脆萝卜皮一样被当场咬穿、撕碎！\n\n“啊——！！我的手！！”\n\n凄厉惨叫划破山涧！\n\n护腕崩碎的刹那，十几只凶虫顺势钻进皮肉，锯齿口器死死咬进孟逵双腕桡骨，剧烈煞毒痛得他破甲铁尺脱手飞出，“噗通”一声跪倒在冰冷溪滩上！\n\n还没等他催劲震飞凶虫，陈长庚鬼魅般的身影已欺至近前，一脚重重踏碎他胸骨，七寸淬毒分水刺冰冷抵进他喉结半寸！\n\n两只暗金甲虫更是悬停在孟逵眼珠子前一指处，锯齿口器咔咔磨动！\n\n“鬼、鬼虫……是上古嗜铁煞甲虫？！好汉饶命！！”孟逵吓得浑身肥肉乱颤，裤裆瞬间湿透。\n\n“赤铜咬合暗簧的回温三锻秘窍，从头到尾背一遍。”\n\n陈长庚声音冷得没有一丝起伏，“敢漏一个火候字眼，我让这三十六只虫子从你眼眶钻进去吃空脑髓。”\n\n“我背！我全背！！”\n\n生死一线，孟逵哪敢耍丝毫花样，竹筒倒豆子般将如何以赤铜屑填补裂槽、如何分三次地火回温咬死内簧机括的器堂独门秘窍一字不差背了出来。\n\n陈长庚本就精通《控火诀》与百锻铁理，听完两遍心中印证无误，右腕干脆利落往下一送！\n\n“噗嗤！”\n\n分水刺贯穿咽喉，孟逵抽搐两下彻底气绝。\n\n陈长庚催动三十六只煞甲虫将其碎裂护腕与熟铁尺残片吞吃一空，顺手摘下孟逵背后那只装满凿锤赤铜料的生铁锻器箱。\n\n随后他给尸首绑上两块乱磁巨石，一脚踹进三丈深的涧底寒潭彻底沉灭。\n\n五更时分，丙字废渣房卧房内。\n\n陈长庚借地火支脉余温，按孟逵吐露的三锻火工秘窍，只花了一个时辰便用赤铜料将青铜机括盾偶胸口裂槽严丝合缝修补如初！\n\n随后他打开锁灵寒玉匣取出两钱莹白如雪的无瑕道髓晶砂，合拢尚存四十钱晶砂的玉匣盖，将这两钱晶砂精准按入盾偶胸口核心凹槽！\n\n“咔、咔哒——嗡！”\n\n两钱晶砂瞬间化作精纯火煞，尽数融进干涸百年的古偶枢槽，完成了初次温养开锋！\n\n沉寂百年的青铜机括盾偶双目骤然亮起两团暗红微光。\n\n陈长庚套上配套的腕间子母引簧铜扣，指尖轻轻一拨机簧，盾偶当即横举沉重青铜大盾踏步旋身，犹如一尊不知疼痛的八窍铁卫！\n\n待两钱开锋火煞浸润完毕、机括重归沉寂，陈长庚心头大定——往后临敌，只需临时嵌晶扣簧即可瞬发护身！\n\n他俯身收拢盾偶，目光扫过刚刚合拢的胸甲内壁时，动作忽地一顿。\n\n只见青铜内壁角落，赫然刻着半枚被利器刻意铲削过、却仍能辨出星盘阵纹轮廓的古老徽记——大泽之外，天阵宗外围残徽！\n\n天刚蒙蒙亮，还没等他细想这尊盾偶为何流落大泽，前山方向忽然连响三通戒严铜锣！\n\n辰时送灰的王老头跑得上气不接下气，隔着院门拍大腿惊呼：“陈小子听说了吗？今早外门东道全戒严了！听说内门请来破古墟死禁的贵客到了——是一位出自天阵宗没落分支的年轻女客卿，刚住进前山寻脉馆！”"}, {"n": 39, "title": "恶邻倒渣", "body": "天阵宗女客卿入驻寻脉馆的消息刚传开，内门各大修真世家的动作比寒风还快。\n\n十二月三十日晌午，本该辰时送达的日常废灰足足拖了两个时辰才进废渣谷。\n\n更邪门的是，推进丙字房院子的只有八辆普通赤铅渣车，那两辆最要紧的高煞紫火炉底灰车连影子都没见着！\n\n“王老哥，莫非丹房又出内鬼了？”陈长庚帮着搭手卸车，压低嗓音问道。\n\n王老头吓得慌忙摆手，往坡上甲字房方向努了努嘴，声音直发颤：“这回借石副管事十个胆子他也不敢吭声啊！内门曹家那位通窍九窍的嫡系大公子曹无极亲自派人下场，把丹房所有紫火炉底灰全包圆了，说是要提炼火精赶制进古盐墟的破禁重器！”\n\n陈长庚心头微凛：“连外门丹房的灰都强截？”\n\n“何止截灰！”王老头叹了口气，推起空车就往外走，“听说曹家奴才正在后山挑地火旺的独立院子建私人火工坊，陈小子你千万锁紧门别露头——”\n\n话音还没落地！\n\n“砰——哐！！”\n\n半掩的生铁院门被人从外头一脚踹得重重撞在石壁上，刚推车走到门口的王老头直接被掀翻在雪泥里！\n\n三名身穿皂色锦边劲装、腰挎百炼雁翎刀的彪悍家奴大步闯进前院。\n\n领头的是个满脸横肉、左眉带刀疤的通窍六窍中年管事胡彪。\n\n他一进门先斜睨了一眼门框上的“丙字独管”生铁印牌，抬手一马鞭抽翻在地，一口浓痰啐在上头：\n\n“什么狗屁纳贡院独管牌！在内门曹公子面前，冯保山自己来了也得跪着说话！”\n\n摔在雪地里的王老头吓得脸无人色，连滚带爬推着空车逃出了山谷。\n\n院内毒烟翻滚，胡彪拿鹿皮手套掩着鼻子扫视一圈，感受到脚下青石板隐隐透出的温热地火气，顿时满意点头，拿马鞭遥指弓腰站在廊下的陈长庚：\n\n“喂，那个烂手杂役！这院子底下连着地火支脉，我家曹公子看上了，要改建炼器火工坊！限你今日日落前卷铺盖滚出丙字房，晚半个时辰，老子打断你的狗腿扔进乱葬岗！”\n\n身后两名通窍五窍的曹家恶奴狞笑着按住刀柄往前逼了两步。\n\n陈长庚袖笼里的五指微微一紧，面上却露出惶恐至极的谦卑苦笑。\n\n跟内门通窍九窍的世家嫡系硬顶？\n\n莫说冯保山的独管牌不管用，便是把石百川搬出来，人家曹无极一句话也能按死两个外门杂役！\n\n可真要被赶出丙字废渣房，不仅脚下这条三日一潮汐的地脉支脉彻底断绝，连遮掩地火腥甜气的老窝都得丢光！\n\n硬顶是死，退让也是绝路，那就只能顺着恶奴最怕掉脑袋的软肋，请君入瓮！\n\n“咳咳……胡、胡管事息怒！”\n\n陈长庚慌忙上前两步弯腰赔笑，满脸诚惶诚恐：“曹公子能看上这破院子，小人就是爬也得立马往外爬！只是……小人滚蛋前有桩掉脑袋的隐情不敢瞒管事大人，求大人随小人去后院火坑掌掌眼，省得回头污了曹公子的法器胎骨！”\n\n胡彪眉头一拧，狐疑地上下打量他一眼：“少耍花招！一座破排灰坑能有什么隐情？带路！”\n\n陈长庚点头哈腰引着三人穿过低矮穿堂，来到后院三丈深的地火排渣坑沿。\n\n趁着胡彪探头往下张望的刹那，蹲在坑沿西侧清理浮炭的陈长庚借宽袖遮掩，百锻双指悄然探入岩壁暗缝。\n\n指尖扣住一块封闭了整整十年的生铁“铅毒回风板”，无声无息往外撬开了两寸豁口！\n\n“地火苗子倒是挺旺，哪有什么毛病？”\n\n胡彪冷哼一声，从怀里摸出一片薄如榆叶、专验炉火毒煞的百炼精铁“试火铁叶”，拿长铁钳夹住探向火坑上方。\n\n就在试火铁叶悬定坑口的同一息——\n\n“呼——嗤啦啦！！”\n\n西侧岩缝撬开的豁口里，积郁沉积了整整十年的黑黄浓稠陈年铅毒回风，被下方热浪一顶，如毒龙出洞般轰然倒灌喷出！\n\n那片薄如榆叶的百炼试火铁叶刚沾上黑黄毒烟，连一息都没撑住，表面瞬间鼓起密密麻麻的惨绿毒泡。\n\n“滋滋”两声轻响，试火铁叶竟当场蚀穿融化，变成一滩腥臭黑水滴落坑底！\n\n“我娘咧！什么鬼毒烟？！”\n\n胡彪吓得脸色煞白，手里的长铁钳差点扔出去，带着两名被呛得涕泪横流的家奴连滚带爬暴退三丈，死死贴在院墙根剧烈干呕！\n\n陈长庚早已屏息退到侧廊，双手捧着那本发黄的《丙字房交接尸格册》快步跑上前，跪在雪地里翻开册页高高举起：\n\n“胡管事受惊了！您老请看官册——今年短短十个月，这丙字房已经连着暴毙了三任杂役，死的时候连五脏六腑都化成了紫黑铅水！”\n\n胡彪捂着口鼻惊疑不定地瞪向册子上的纳贡院红印：“这坑底怎么会有这么霸道的回风铅毒？！”\n\n“大人有所不知啊！”\n\n陈长庚替他把利害账算得明明白白，句句往胡彪心窝子上戳：“这废渣谷底处在整条山腹地火支脉的最下风死窝！平日看着火旺，每逢子午潮汐便会倒灌十年陈铅腐毒！”\n\n他抬头看了一眼胡彪发青的脸皮，压低声音诚恳道：“小人贱命一条，烂手烂肺熏死也就埋张破草席；可曹公子炼的是入古盐墟争命的破禁重宝，万一开炉融金的紧要关头倒灌一口黑铅毒，把公子爷价值百枚灵石的主材蚀成废铁……胡管事，这干系谁担得起啊？！”\n\n胡彪后背瞬间惊出一层白毛汗，激灵灵打了个寒颤！\n\n自家公子曹无极脾气暴戾嗜杀，要是选错炉房毁了破禁法器胎骨，头一个被剥皮抽筋的就是他胡彪！\n\n“妈的，好险！差点着了这绝户坑的道！”\n\n胡彪骂了一句，抬头环顾山势，眉头紧锁：“可公子爷严令晌午前必须占下地火口开炉，这后山还有哪处火脉干净？”\n\n陈长庚顺势抬手，恭恭敬敬指向斜上方三十丈外那座青砖大院：“回胡管事，坡上‘甲字废渣房’正居整条地火支脉最上风口！院子比这儿宽敞三倍，地火纯正又绝无回风毒气！”\n\n他把头垂得极低，主动递上最后一级顺风梯：“管事大人只管请曹公子占了上风口甲字房起炉，留小人这不怕死的烂肺鬼守在下风口丙字房，专门顺着排灰石槽替公子爷承接炼器排下来的剧毒尾渣，岂不是两全其美？”\n\n胡彪眼睛猛地一亮，顺着手指望向高处宽敞明亮的甲字房，再看看脚下还在冒绿泡的黑铁水，当即一拍大腿：\n\n“算你这病秧子懂事！要是没有你提醒，老子今儿险些误了公子大事！”\n\n胡彪一挥马鞭，带着两名家奴转身就往院外走，临出门前还不忘居高临下敲打一句：\n\n“听着！甲字房老子这就去清场占下！往后几日公子爷炼器筛下来的废矿毒渣全顺着山坡石槽冲进你院里，你要是敢堵槽让毒气倒灌上坡，老子拧掉你的脑袋！”\n\n“小人绝不敢堵！一定替公子爷把毒渣接得干干净净！”\n\n陈长庚站在风雪里千恩万谢，一直目送胡彪三人凶神恶煞冲上坡顶，一脚踹开甲字房大门，把里头四名外门杂役连人带被褥轰出山谷。\n\n待坡上喧闹远去，他才慢条斯理捡起地上那块“丙字独管”印牌，擦净泥雪挂回门框，“哐当”落死千斤铁闩。\n\n回到后院坑沿，他随手一脚便将西侧那块撬开两寸的十年铅毒回风板重新严丝合缝卡死，再用赤铅泥封住缝隙，漫天黑黄毒烟眨眼散得干干净净。\n\n“抢走两车丹房紫火灰，赔我满槽内门高阶炼器废矿渣……曹公子果然大方。”\n\n果不其然，未时刚过，坡顶甲字房便腾起滚滚赤红炉烟！\n\n紧接着，“哗啦啦——”一阵密集脆响顺着连通两院的山坡排毒石槽滑落下来！\n\n足足三大筐刚被榨去表层灵精、却依旧滚烫赤红、散发着狂暴金铁血煞气息的内门“高阶赤煞废矿渣”，源源不断倾泻进丙字房后院石池！\n\n恰逢未时三刻，贴腹的蚀纹石臼准时传来第二十三轮潮汐充能脉动！\n\n陈长庚嘴角微扬，用铁锹铲起满满一斗高阶赤煞废矿渣退回卧房，嵌好隔味阵盘灵石，将赤红矿渣尽数填入石臼！\n\n“嗡——！！”\n\n石臼古纹大放光明，这一回吞噬的内门高阶矿煞比丹房紫火灰精纯了何止一筹！\n\n一刻钟后，浓烈地火腥甜气在三尺阵幕内散去，陈长庚低头看向臼底，呼吸都不由得重了几分。\n\n只见臼底静静躺着整整六钱晶莹剔透、隐泛一丝淡金光泽的极品无瑕道髓晶砂！\n\n他当场拈起两钱吞入腹中，其余四钱封入锁灵寒玉匣，匣内存晶稳稳攒至四十四钱！\n\n轰隆！\n\n精纯至极的药力化作滚滚洪流冲刷四肢百骸，原本刚稳固在通窍七窍中期的气血节节暴涨，一路势如破竹推向通窍七窍圆满关口！\n\n直到除夕夜色彻底笼罩后山，漫天鹅毛大雪再次飘落。\n\n陈长庚缓缓收功吐出一口浊气，刚起身走到窗边查看雪势——\n\n“啊——！！饶命！曹师兄饶命啊——！！”\n\n一阵凄厉得不似人声、仿佛活生生被人拿烧红铁锥抽干骨髓的惨嚎，猛地穿透漫天风雪，从三十丈外的上风口甲字房里炸响夜空！"}, {"n": 40, "title": "潜滩核沟", "body": "除夕夜那声凄厉惨嚎，直到五更天风雪停歇才彻底断绝。\n\n开春头四天，上风口甲字房的炉火一日比一日腥红，里头接连抬出两卷裹着黑血草席的散修尸首，唬得整条后山山道的杂役绕着废渣谷走。\n\n丙字废渣房铁门紧闭，反倒成了最安稳的避风港。\n\n趁着甲字房日夜顺排毒槽往下倾倒高阶赤煞废矿渣，陈长庚在正月初三未时三刻准时开启开年头一轮石臼提纯，再析出六钱极品晶砂。\n\n继除夕服下两钱后，开年他又连吞六钱极品无瑕道髓晶砂，一身百锻气血如大江奔涌，水到渠成冲至通窍七窍圆满顶峰！\n\n地砖暗格里那三十六只嗜铁煞甲虫也分食了四钱晶砂拌赤煞毒渣，在初四子夜齐刷刷褪去第二层旧壳。\n\n二次蜕壳后的凶虫背甲泛起深邃暗金冷光，锋利口器轻轻一合便能剪断百炼铁丝。\n\n正月初五辰时，送灰的王老头推车进院，一张老脸白得不见一丝血色。\n\n“陈小子，前山庶务堂刚贴出急榜，这回可是要命的苦差！”王老头一边倒赤铅渣一边压低嗓门哆嗦。\n\n陈长庚拄着木锨轻咳两声：“王老哥，大过年的能有什么急差？”\n\n“大泽南麓二十五里外的芦苇断崖老水闸，昨晚被地磁暗潮顶歪了闸门！”\n\n王老头往手心吐了口唾沫，连连摇头：“庶务堂强征二十个通窍三四窍的杂役明儿申时趁退潮去清淤摸桩，每人倒贴二两御寒姜汤银，可谁不知道那水底冒乱磁毒瘴？沾上就得烂腿！”\n\n“大泽南麓，芦苇断崖老水闸？”\n\n陈长庚握着木锨的手指微不可察地一动。\n\n当初在黑石坊市烂摊淘来的那卷《修渠草图》上，前代老盐工用炭笔标出的废弃排卤暗沟入口，不就藏在芦苇断崖水闸西侧三丈深的水底岩凹里吗？\n\n眼下内门已经开始封锁古盐墟外围水道，再晚几天连只水鸟都飞不进去，这正是奉命合法摸清海底退路的唯一天机！\n\n“二两现银，够买半篓老姜熬肺汤了。”陈长庚弯腰咳了两声，苦笑着叹气，“甲字房这几天炼器邪烟呛得小人整宿睡不着，横竖是熬命，不如去挣这二两银子。”\n\n王老头瞪大眼珠子：“你真去？那督工的狄世昌狄执事可是出了名的阎王脾气！”\n\n“小人就在浅滩铲两锹烂泥，绝不往深水凑。”陈长庚赔着憨笑送走灰车。\n\n当天晌午，他便揣着号牌去庶务堂偏廊画了押，管事书办见真有丙字房的短命鬼主动顶缺，二话不说甩给他一块水工腰签。\n\n正月初六，未时三刻。\n\n临出门前，陈长庚在卧房隔味阵盘内稳稳做完新的一轮地脉潮汐提纯，将新析出的六钱晶砂封入锁灵寒玉匣，匣内存晶恰好攒至满满四十六钱整。\n\n锁好院门与虫瓮，他把全身气机锁回虚浮三窍，背起一只破竹篓赶到山脚苍芦渡，登上了庶务堂的平底快船。\n\n船头太师椅上，坐着个身穿青色执事袄、鹰眼薄唇的通窍八窍中年汉子，正是督工执事狄世昌。\n\n申时初刻，快船顺流疾驰二十五里，一头扎进枯苇丛生的大泽南麓断崖湾。\n\n此时正逢大泽冬日退潮，半截锈迹斑斑的千斤石闸露在浑浊黑水外，水面丝丝缕缕冒着惨绿色的乱磁寒瘴，连罗盘指针都在船头疯狂打转。\n\n“都给老子麻利点下浅滩清淤！”狄世昌裹紧狐裘站在高处船头，一步不沾泥水。\n\n船尾一名六十来岁、满手老茧的通窍四窍老水工柳四跳下浅滩，拿铁钎往水闸根部一撬，脸色忽然变了。\n\n他捞起半截泡得发软发臭的灰白断木，快步跑到船舷下压低声音急道：“狄执事，坏事了！上个月院里不是批了二十枚灵石买百炼铁樟桩固闸吗？这水底下打进去的怎么全是烂榆木楔子？！”\n\n船头空气骤然一冷！\n\n狄世昌眼底凶光一闪而逝，猛地一脚踢翻柳四手里的断木，厉声喝斥：“老东西老眼昏花了！那是十年前的旧辅桩！主桩在断崖下头三丈深的闸槽里！”\n\n柳四呆了呆，看着木头断面崭新的斧凿痕，嘴唇哆嗦了一下，瞬间明白那二十枚灵石早进了狄世昌私囊，吓得扑通跪进泥水里：“是、是小的看岔眼了！”\n\n狄世昌眯了眯鹰眼，嘴角浮起一抹冷笑，从靴筒摸出一把竹签扔进木筒：\n\n“光清浅滩顶什么用？来三个人，系上麻绳潜到断崖闸底摸清主桩松没松！谁抽中红头签谁下水，敢退缩一步，按违抗宗门军令当场杖毙！”\n\n船上十九名杂役脸色煞白，挤成一团没人敢伸手。\n\n“柳四，你熟水性，头一个不用抓了，直接去东侧苇湾摸！”狄世昌随手一点柳四，又拿竹筒逼向人群，“剩下的过来抽！”\n\n前头几个杂役哆哆嗦嗦摸出白签，紧接着一名黑瘦杂役哭嚎着抽出一根红头签。\n\n轮到人堆后的陈长庚时，他伸出微乌手指探入筒中，指腹一捻凹痕，顺势拈出了最后一根红头竹签。\n\n“哎哟，丙字房那病秧子也抽中红签了！”旁边幸免的杂役顿时松了口气，看死人似的往后躲。\n\n“执、执事大人，小人肺虚气短，下深水怕是浮不上来……”陈长庚瑟缩着发抖。\n\n“少废话！拴上引魂绳滚下去，摸不到桩底不准上船！”狄世昌不耐烦地一挥手。\n\n那名抽中红签的黑瘦杂役被皂役一脚踹往中段浅槽，陈长庚则苦着脸在腰间系上粗麻绳，背起破竹篓，一步三滑地踏进西侧冰冷刺骨的断崖黑水里。\n\n“噗通。”\n\n浑浊浪花一卷，瘦削身影瞬间没入水下。\n\n下潜不到五尺，上方船头的视线已被滚滚黑泥与墨绿乱磁瘴气彻底隔绝！\n\n原本缩肩弓背的陈长庚双眸骤然睁开，眼底哪还有丝毫病弱惶恐？\n\n《井煞锻骨诀》中卷横练劲力无声流转周身皮膜，刺骨阴寒的乱磁毒瘴撞在他暗金微泽的皮肤上，连一丝白印都留不下来！\n\n通窍七窍圆满的绵长内息锁死心肺，足可让他在水底闭气两刻钟不换一口气！\n\n他随手扯过腰间粗麻绳，活扣一绕栓在一截晃动的浅水沉木上，借水流一冲一拽，岸上拉绳的杂役只当他在泥里艰难摸索。\n\n做完伪装，陈长庚双足一点崖壁，整个人如一条无声滑溜的黑鱼，顺着《修渠草图》熟记于心的石纹走向，笔直潜入断崖西侧三丈深的幽暗水底！\n\n越往下潜，地磁乱流越发狂暴。\n\n陈长庚贴着湿滑岩壁横移四丈，拨开一丛如乱发般缠绕的乌黑水草，伸手往两块犬牙交错的吸铁巨石夹缝里一探！\n\n指尖触到的不再是普通山岩，而是一层厚达三寸、坚硬如铁的百年黑卤钙化壳！\n\n他运起百锻指力轻轻抹去表层浮泥，五根粗如儿臂、被黑卤包裹得严严实实的乌金生铁栅栏赫然出现在掌心之下！\n\n陈长庚屏息凝神，用双臂丈量了一遍栅栏间距与后方幽深涵洞。\n\n高三尺二寸，宽两尺半，刚好容许单人俯身钻入！\n\n他微微抬头朝上方水面望去——只见两丈高的水层上方，云泽宗布设的外围封锁水阵正流淌着淡青灵光。\n\n可每当青色阵纹蔓延到这处吸铁巨石上方时，便被断崖底天然喷涌的狂暴乱磁漩涡搅得支离破碎，硬生生在岩凹正上方撕开了一片方圆丈许的阵法死角！\n\n“果真是大宗封锁阵眼的绝对盲区！”\n\n陈长庚心头一定，没有动那层百年黑卤封壳分毫，反手掬起两把黑泥将指印原样抹平，悄无声息顺着石缝往上浮去。\n\n为了避开船头耳目，他特意从东侧十丈外一丛茂密枯芦苇荡根部浮出半颗脑袋，准备悄悄换一口气再回浅滩。\n\n谁知刚拨开一片烂苇叶，三丈外的断崖苇湾死角里，忽然传来柳四压抑惊恐的求饶声！\n\n“狄执事饶命！小的烂在肚子里，绝不敢往庶务堂漏一个字！家里还有瞎眼老娘等小的拿工钱抓药啊——”\n\n陈长庚眼神骤凝，整个人瞬间沉入水面以下，只留双目隔着苇秆冷冷窥视。\n\n只见苇丛深处，狄世昌不知何时下了船，正笑眯眯拍着柳四湿透的肩膀，语气温和得像自家兄长：“老柳啊，咱们爷俩共事三年，本执事还能信不过你？来，把这块固脉石揣好，上岸喝热酒去。”\n\n柳四满脸劫后余生的狂喜，刚弯腰去接——\n\n“嘭！！”\n\n狄世昌脸上的温和笑意瞬间化作狰狞杀机，灌满通窍八窍阴煞真气的右掌毫无征兆印在柳四胸口！\n\n一声沉闷骨裂响起，柳四连半声惨叫都没吐出来，五脏俱碎，七窍溢血软倒在泥水里！\n\n“二十枚灵石的账，只有死人最守规矩。”\n\n狄世昌面无表情地往柳四号衣里塞进两块早备好的吸铁沉石，一脚将尸首踹进旁边深不见底的乱磁水眼，拍了拍袍袖转身就往浅滩走！\n\n苇根暗水下，陈长庚连睫毛都没动一下。\n\n路见不平拔刀相助？\n\n为了一个素昧平生的水工暴露通窍七窍圆满实力、替庶务堂抓贪官，那是嫌命长的蠢货才干的事！\n\n趁狄世昌绕过苇坡的短短五息，陈长庚早已如游鱼般滑回西侧浅水区，解下沉木上的麻绳重新系回自己腰间。\n\n他顺手在齐腰深的烂泥坑里一通乱掏，抓了满满大半篓滑不溜秋的冬眠肥泥鳅，又塞进两块朽烂木渣。\n\n随即他猛吸一口凉气把脸皮憋得青紫，扯动麻绳哗啦啦爬上了泥滩！\n\n“咳咳……咳咳咳！冻、冻死小人了……”\n\n陈长庚摔在浅滩碎冰上，抱紧破竹篓缩成一只煮熟的虾米，上下牙床磕得咯咯直响。\n\n恰在此时，狄世昌背着手从东头苇丛慢步走出，鹰隼般的眼睛猛地钉死陈长庚：“丙字房的小子，你刚才往水下哪边摸去了？听见什么动静没有？！”\n\n四周十几名正在铲泥的杂役全吓得停了铁锹。\n\n狄世昌右手已悄然按在了腰间长刀吞口上，通窍八窍灵压如有实质般压在陈长庚头顶——只要这小子眼神闪烁一下，当场便是第二个失足溺毙的鬼！\n\n“阿嚏——！！”\n\n陈长庚重重打了个震天响的喷嚏，鼻涕混着黑泥水流了一嘴，哆哆嗦嗦举起怀里还在活蹦乱跳的半篓泥鳅：\n\n“回、回狄大人！底下绿烟太扎骨头了，小人刚潜下去半丈腿肚子就抽了筋，死活不敢往下沉，只敢趴在石闸根泥坑里摸了两块烂木皮……”\n\n他一脸讨好憨笑地把竹篓往前递了递：“小人怕空手上来挨大人的板子，顺手在浅泥窝里抠了半篓肥泥鳅，给大人回船炖碗鲜汤驱寒……咦，东头下水的柳老哥本事大，还没摸完桩上来吗？”\n\n船边两名杂役瞧见他鼻青脸肿献宝的滑稽样，忍不住噗嗤笑出声：“真是个没出息的饿死鬼，下去摸闸桩都能抠半篓泥鳅上来！”\n\n狄世昌走近两步，探手抓过陈长庚手腕一试。\n\n脉象微弱散乱得随时要断气，膝盖裤管上沾的也确确实实全是浅滩独有的黄腥烂泥，不带一星深水黑卤腥气！\n\n狄世昌眼底杀机缓缓敛去，嫌恶地一脚踢开竹篓，转身朝船上高声喝道：“柳四贪功贸进东侧乱磁水眼，方才已被暗流卷入地底尸骨无存！水桩既已查过，全队即刻登船返宗！”\n\n“啊？柳老头淹死了？！”众杂役骇得魂不附体，连滚带爬争相逃上快船。\n\n陈长庚心底冷笑，手脚并用捡回洒出来的几条泥鳅塞进篓子，低眉顺眼缩在船尾最角落。\n\n酉时正，残阳如血，漫天暮霭笼罩八百里沧溟大泽。\n\n平底快船顺着返宗水道拐过黑石渡旧口外滩时，原本低头烤火的十几名杂役忽然齐齐倒吸一口凉气，扒着船舷呆立当场！\n\n陈长庚顺势抬起眼帘朝大泽腹地望去。\n\n只见浓重晚雾裂开处，三艘长达二十余丈、通体包覆乌黑灵甲的云泽宗巨型玄铁战船，正成品字形横锁住通往沉渊古盐墟的全部内圈水域！\n\n船首森寒灵炮蓄势待发，杀气直冲霄汉。\n\n而在居中主舰那根高耸入云的玄铁主桅杆顶上，赫然倒吊着两具身穿玄煞门黑袍、浑身骨节尽碎的暗探尸首，正随着腥咸晚风在血色残阳里缓缓晃荡！"}, {"n": 41, "title": "借煞淬骨", "body": "正月初六入夜，后山废渣谷的风里已经带上了铁锈般的血腥味。\n\n陈长庚从苍芦渡快船下来，一路贴着山道阴影溜回丙字废渣房，反手落死千斤生铁门闩。\n\n院外三十丈高的坡顶上，甲字房那道赤红炉烟比除夕夜还要粗壮三分，滚烫火星子在半空噼啪乱炸。\n\n“曹无极这是连年都不让人过了。”\n\n陈长庚站在穿堂屋檐下，抬头瞥了一眼坡顶火色，鼻翼轻轻一动。\n\n熬了三年毒卤的鼻子不会骗人。\n\n那股赤红炉烟里除了内门高阶赤煞矿的燥烈，还混着一股皮肉筋骨被活生生熬焦的甜腥气。\n\n正月初七晌午，甲字房后门抬出了开春第三卷滴着黑血的破草席。\n\n到了初八后半夜，又是一阵仿佛拿烧红铁锥往活人琵琶骨里硬拧的凄厉惨嚎，只叫了半刻钟便戛然而止。\n\n紧接着，坡顶炉烟猛地由赤红转为暗紫，翻滚速度慢了足足一半，连顺着山坡石槽往下淌的废矿渣都断了流。\n\n卧房暗格旁，陈长庚倏地睁开双眼，眼底一片冷冽。\n\n“连折两个试器苦力，炉底血煞又憋了膛。”\n\n“上风口没了喘气的活耗材，坡上那帮曹家恶奴明天一准得下坡抓人填坑！”\n\n跟通窍九窍的内门嫡系曹无极硬拼？\n\n他如今虽已修至通窍七窍圆满顶峰，双臂有千五百斤横练巨力，暗格里还藏着三十六只二蜕煞甲虫和青铜机括盾偶。\n\n可一旦在自家院里宰了曹家奴才，不出半个时辰，内门执法铁卫和曹无极本人就能把整座废渣谷翻个底朝天！\n\n到时候别说地脉支脉保不住，连怀里的蚀纹石臼都得见光。\n\n“想抓我试器，也得看你们嫌不嫌脏。”\n\n陈长庚嘴角浮起一抹冷峭弧度，起身走到后院排渣坑死角，用铁铲挖出一瓢黄黑发绿、直冒泡的陈年“腐骨硫泥”。\n\n这是废渣坑底积存多年的蚀皮毒泥，寻常三四窍杂役沾上一星就得烂穿皮肉，唯有百锻暗金皮膜能将其死死挡在真皮之外。\n\n他挽起破麻衣袖，面不改色地抓起滚烫硫泥，混着几滴鸡血腥水，厚厚抹满两条小臂！\n\n“嗤啦——”\n\n硫泥遇热发泡，表层死皮瞬间鼓起数十个核桃大小、流淌着腥臭黄黑脓水的可怖毒疮，满屋顿时弥漫开一股令人作呕的腐尸恶臭！\n\n正月初九，巳时刚过。\n\n“砰——哐当！！”\n\n前院生铁大门被人一脚踹得门框碎石乱飞，门闩弯折出刺耳酸响！\n\n三条彪悍人影裹着热浪凶神恶煞闯进院子。\n\n打头的是个身高八尺、满脸络腮横肉的光膀壮汉，一身通窍六窍狂暴火煞气，手里提着一根小孩手臂粗的乌黑生铁锁链。\n\n正是与胡彪同驻甲字房的掌炉恶奴，屠满仓！\n\n“丙字房那个喘气的死哪儿去了？给老子滚出来！”\n\n屠满仓一脚踢翻院心破竹篓，生铁锁链在青石板上拖出“哗啦啦”一串火星。\n\n“咳咳……咳咳咳！来了来了，哪位爷驾到……”\n\n穿堂破门帘一掀，陈长庚佝偻着脊背，把全身气机死死锁在虚浮散乱的通窍三窍，捂着胸口一步三晃地迎了出来。\n\n屠满仓压根不跟他废话，蒲扇般的大手一扬铁链，兜头就往陈长庚脖子上套：\n\n“少哆嗦！我家曹公子赶炼入墟重宝‘血煞破禁锥’，缺个耐火毒的活人试一试锥尖煞气！”\n\n“胡管事点名赏你这桩造化，跟老子上坡走一趟！”\n\n身后两名五窍家奴狞笑着包抄上来，伸手就要拧陈长庚肩膀。\n\n前几天被抬出去的那几卷草席，哪个不是去试这邪门破禁锥被抽干了全身精血？\n\n陈长庚眼底寒芒一敛，非但没往后躲，反而满脸受宠若惊地往前一扑，主动撸起两只破烂袖筒去抱屠满仓递来的铁链：\n\n“哎哟！曹公子肯用小人试器，那是小人八辈子修来的福分！屠爷您快锁，小人这就爬上去伺候——”\n\n“哗啦！”\n\n两条布满黄黑烂泡、正噗嗤噗嗤往外飙腥臭脓水的小臂猛地凑到屠满仓鼻尖底下，两滴浓稠发绿的腐臭黄水险些甩在屠满仓手背上！\n\n“我操你娘的！！”\n\n屠满仓被那股直冲天灵盖的恶臭熏得脸色骤变，怪叫一声松开铁链前端，蹬蹬蹬连退三大步！\n\n旁边两名正要搭手的家奴更是捂住嘴“哇”地干呕出来，活像见了从粪坑里爬出来的瘟鬼！\n\n“你他娘的胳膊烂成什么鬼东西了？！”屠满仓捏着鼻子破口大骂，眼珠子瞪得溜圆。\n\n陈长庚扑通跪在地上，举着那双淌黄水的烂胳膊瑟瑟发抖，语气谦卑得不能再谦卑：\n\n“回、回屠爷！小人守这绝户坑日夜铲铅灰，开春双臂就发了陈年‘腐铅烂骨疮’，流出来的全是蚀铁化铜的臭铅脓！”\n\n说到这儿，他像是忽然想起什么要命大事，小心翼翼抬头瞄了一眼坡顶发紫的炉烟，压低声音替屠满仓算起了明白账：\n\n“屠爷，小人烂命一条，被破禁锥扎死也是该着的！”\n\n“只是小人瞧坡上炉烟紫滞下沉，分明是炉底血煞憋了膛，曹公子那件宝贝法器的胎骨眼下正在收浆定性吧？”\n\n屠满仓脸色一僵，下意识喝问：“你怎么知道？！”\n\n“小人熬了三年盐灶，别的不会就认得火色。”陈长庚把头磕在青石砖上，句句往屠满仓肺管子上扎，“法器胎骨收浆最忌污秽杂铅！”\n\n“您老要是拿小人这身腐铅烂脓血去喂锥尖，万一臭铅毒顺着血槽沁进胎骨里，叫宝贝生了暗锈炸了纹……胡管事和屠爷您回头怎么跟曹公子交差啊？”\n\n院子里霎时安静下来。\n\n左边那名年轻家奴脸色发白，扯了扯屠满仓衣角：“屠哥，这病鬼说得邪乎！昨晚二号锥刚裂了一道纹，公子爷正发邪火呢，真要沾上这臭脓污了主锥胎骨，咱哥仨皮都得被扒下来！”\n\n屠满仓额头青筋直跳，盯着陈长庚那双还在滴绿水的烂手，进也不是，退也不是。\n\n抓回去怕毁了主子法器掉脑袋，不抓回去，甲字房炉底淤积的狂暴血煞排不出去，照样得憋炸炉膛！\n\n“妈的！不拿活人引煞泄火，上头炉坑憋得全都是紫毒烟，你让老子怎么开下午这炉火？！”屠满仓暴躁地一鞭子抽碎墙角瓦罐。\n\n陈长庚等的就是这句话！\n\n他慌忙膝行半步，抬起烂手指向两院交界的北侧石墙根：\n\n“屠爷息怒！哪用得着脏了公子的法器泄煞啊！”\n\n“这北墙根地底三尺下，原本就有前代器堂留下的‘地底排火回流暗槽’，只是早年拿三块青条石封死了！”\n\n他满脸讨好地仰起头：“您老只需叫两位哥哥在坡上墙根砸开封石，甲字房憋在炉底的淤毒余火顺着陡坡往下一冲，全能泄进小人这丙字房废坑里，上头炉火保准立马通透！”\n\n屠满仓眼睛猛地一亮：“此话当真？！”\n\n“小人哪敢糊弄爷！若是半刻钟内排不净上头淤烟，屠爷再拿铁钩把小人拖上去剁碎了填炉！”\n\n屠满仓狐疑地走到北墙根跺了两脚，脚下果然传来空洞闷响！\n\n他再低头看一眼陈长庚胳膊上恶臭扑鼻的黄黑毒泡，嫌恶地往地上狠啐一口浓痰：\n\n“算你这烂肉鬼机灵，省得污了公子爷的法宝！”\n\n“你们两个，跟老子回坡脚拿大锤，把地底回流暗槽给老子砸通！让血煞毒火全冲这废坑里来！”\n\n“得令！”\n\n两名家奴如蒙大赦，跟着屠满仓转身冲出院门。\n\n不过一盏茶工夫，北侧墙外坡脚便传来“轰隆、轰隆”几记重锤闷响！\n\n随着最后一层封槽青石被砸穿，一股灼热腥红、浓稠得近乎实质的高纯度“血煞余火”，夹杂着内门精炼赤煞碎屑，顺着贯通的地底回流暗槽轰然咆哮倾泻，一头扎进丙字房后院地火坑！\n\n坡顶那道发紫憋闷的炉烟瞬间由紫转红，畅快笔直地冲上云霄！\n\n“哈哈哈！痛快！姓陈的病秧子，好好在底下替公子爷吃毒烟吧！”\n\n墙外传来屠满仓志得意满的大笑声，脚步声很快远去。\n\n陈长庚慢条斯理从地上站起身，拍净膝盖灰土，重新将弯曲的生铁门闩一掌按直卡死。\n\n回到后院，他舀起一瓢冷碱水往两条小臂上一冲，再用粗布一抹。\n\n那些骇人至极的黄黑脓泡连同腐骨硫泥簌簌脱落，露出了底下光滑紧密、隐泛暗金微泽的强健小臂，连一道红印子都没留下！\n\n他走到地火坑沿低头一看，呼吸顿时热了三分。\n\n只见凿通的回流暗槽口正源源不断喷涌着甲字房溢出的高纯度血煞余火，热浪里裹着的金铁血煞之精，竟比前几日干筛下来的废矿渣还要醇厚数倍！\n\n“上赶着把内门精炼血煞火引到我炕头底下……多谢屠爷赏火。”\n\n熬到当日未时三刻，贴腹的半截蚀纹石臼准时传来沉浑滚烫的潮汐脉动。\n\n距离正月初六未时三刻上一轮转化，整整三十六个时辰冷却期满！\n\n陈长庚毫不迟疑，铲起满满一铁斗暗槽刚冲下来的滚烫血煞矿屑退回卧房，按亮青铜隔味阵盘锁死三尺气幕，将矿屑尽数填入石臼。\n\n“嗡——！！”\n\n石臼内壁古拙蚀纹大放光明，刺鼻的地火腥甜气在隔味阵幕内翻滚凝缩。\n\n一刻钟后，白灰散尽，臼底赫然躺着整整六钱淡金流转的极品无瑕道髓晶砂！\n\n陈长庚拈起四钱封入锁灵寒玉匣，看着匣内整整齐齐攒满五十钱大关的晶莹砂堆，反手扣紧玉盖，将剩下两钱仰头吞入腹中！\n\n这一次，他没有在卧房干坐行功，而是赤着上身直接跃下后院地火坑底，盘膝坐进回流暗槽喷涌而出的滚烫血煞余火之中！\n\n腹内两钱极品晶砂化作磅礴暖流自内向外冲刷，暗槽血煞烈火自外向内猛烈锻打！\n\n《井煞锻骨诀》中卷法门全力运转，周身筋膜骨骼发出密集如炒豆般的“噼啪”脆响，向着中卷大成关口狂飙突进！\n\n一直淬炼到子夜三更，坑底血煞火势忽地一滞。\n\n紧接着，上方回流暗槽里传来“砰”的一声沉闷炸响，混着大股滚烫赤铁砂浆“哗啦啦”冲落坑底石箅！\n\n陈长庚猛然收功跃上坑沿，抄起长柄铁钳往滚烫砂浆里一拨。\n\n“叮。”\n\n铁钳尖端磕中了一件坚硬脆响的非铁器物。\n\n他夹起那物在冷碱水桶里一涮，借着坑底红光定睛一看，瞳孔骤然微缩！\n\n那是半块被狂暴煞气炸裂、边缘焦黑的青白残玉盘，盘面赫然镌刻着十几道精细繁复到极点的古拙避风阵纹！\n\n还没等他看清裂口处的砂痕——\n\n“咻——咻咻——！！”\n\n废渣谷外寂静的夜空里，毫无征兆地炸响三声凄厉急促、专司前山寻脉馆戒严缉盗的穿云铜哨声！"}, {"n": 42, "title": "残盘识眼", "body": "穿云铜哨声撕裂后山寒雾，一声紧似一声，直奔废渣谷方向压来！\n\n陈长庚站在地火坑沿，手里的长柄铁钳稳如磐石，连眼皮都没跳一下。\n\n他没有用手指去碰那半块青白残玉盘分毫，只隔着三寸距离凑近火光细看。\n\n残玉盘断面崭新，焦黑裂口深处死死嵌着几粒针尖大小、泛着暗红血光的金星铁珠子；而回流暗槽出口的青苔，全被方才那股逆冲紫烟燎成了焦卷状。\n\n“前山寻脉馆戒严，这必是那位天阵宗女客卿手里的避风阵胚！”\n\n“曹无极想白嫖人家的破禁手艺，半夜叫屠满仓在甲字房偷摹试炼，结果控火不稳炸了盘，碎玉顺着白天刚凿通的回流暗槽冲进了我院里！”\n\n陈长庚瞬间把前因后果算了个底掉。\n\n现在把残盘扔回暗槽？逆坡冲不上去。\n\n挖坑埋进废灰窖？天阵宗阵修最擅寻脉追气，一旦顺着残玉灵机搜到丙字房地底下，浑身是嘴也洗不清偷盗贵客阵胚的死罪！\n\n“想让我替甲字房背黑锅，门儿都没有。”\n\n陈长庚当机立断，戴上平时铲铅灰的破麻手套，拿竹夹夹起残玉盘在冷风里吹散水汽，原原本本摆在回流暗槽出口那块焦黑破瓦片上。\n\n随后他抓起一把灶灰抹黄脸皮，将通窍七窍圆满的气血重新锁回虚浮三窍，披上破棉袄推门守在穿堂廊下。\n\n正月初十，寅末卯初，山谷晨雾浓得化不开。\n\n院外陡坡上骤然响起一阵杂乱急促的脚步声！\n\n屠满仓提着一口百炼鬼头刀，带着三名神色惊慌的曹家恶奴从坡顶狂奔而下。\n\n昨晚子时摹刻的仿制阵胚炸裂，他们清点碎片时死活找不到最关键的阵眼半块，直到天快亮才猛然想起白天刚砸通了通往丙字房的排火暗槽！\n\n“快！趁寻脉馆那娘们还没查进谷底，把暗槽里的碎玉抠出来，顺手宰了那烂肺杂役灭口！”\n\n屠满仓满眼凶光，一脚踹向丙字房院门！\n\n“哐当！”\n\n没落大栓的铁门应声洞开。\n\n屠满仓一步抢进前院，刚举起鬼头刀指向廊下瑟缩的陈长庚，背后山谷浓雾里忽然传来一道极轻、却冷得像冰碴子落地的脚步声。\n\n“咔。”\n\n青布云靴踏碎门外薄霜。\n\n一道身穿素白窄袖道袍、腰悬青铜寻脉令的高挑女子身影，孤身立在丙字房石阶之外。\n\n她发髻仅用一根乌木簪挽住，眉目清冷如霜雪削成，周身不见丝毫烟火客套气，正是入驻前山寻脉馆的那位天阵宗女客卿！\n\n屠满仓浑身汗毛倒竖，举到半空的鬼头刀硬生生僵住！\n\n跑是跑不掉了！\n\n一旦让这位天阵宗客卿查到甲字房奉曹公子之命偷摹她的独门阵胚，曹无极为了摘清自己，头一个就得把掌炉的屠满仓推出去砍头谢罪！\n\n恶向胆边生，屠满仓脸皮一横，竟在眨眼间把刀背一拍，指着廊下的陈长庚破口大骂：\n\n“好你个吃里爬外的狗杂役！老子昨晚起夜就瞧见一道鬼影从前山东道往这破院子钻，原来真是你小子偷了寻脉馆苏客卿的阵胚宝贝！”\n\n身后三名曹家家奴也是人精，立马拔刀帮腔：\n\n“对！屠管事天没亮带小的们下来拿贼，正好堵在他院里！”\n\n“苏客卿明鉴，这丙字房三窍病鬼手脚最不干净，快搜他屋子！”\n\n三言两语，一顶十死无生的盗宝大帽结结实实往陈长庚天灵盖上扣！\n\n素衣女客卿站在门槛外没动，清冷目光越过满脸横肉的屠满仓，落在廊下灰衣杂役身上：“东西在哪？”\n\n四个字，平直清泠，听不出喜怒，却透着一股随时出手毙人的森然煞意。\n\n屠满仓眼底闪过一抹狞色，大步扑向陈长庚：“小畜生还不跪下交赃——”\n\n他这一扑暗藏六窍碎喉劲，分明是要借抓贼之名一把捏碎陈长庚喉骨，做成死无对证的铁案！\n\n陈长庚膝盖一软，看似被刀威吓得脚底打滑，“哎哟”一声贴着廊柱歪倒下去，毫厘之间恰好让屠满仓的碎喉爪抓了个空！\n\n不等屠满仓变招再抓，陈长庚已连滚带爬缩到后院穿堂口，双手高高捧起那块垫着残玉盘的焦黑破瓦片，连头都不敢抬：\n\n“回、回禀客卿仙师！小人没长翅膀飞不进前山戒严哨卡，这半块碎玉是昨夜顺着后院排火暗槽自己冲下来的！”\n\n屠满仓脸色铁青，厉声截断：“放你娘的狗臭屁！明明是你偷回来摔碎了往暗槽里塞——”\n\n话没吼完，屠满仓扬起大脚就要把那块破瓦片连同残玉盘一脚跺成齑粉！\n\n“铮！”\n\n一道细若游丝的乌光擦着屠满仓靴尖钉入青砖，寒气瞬间冻僵了他半只脚掌！\n\n“再动一下，剁了你的脚。”素衣女客卿冷声开口，迈步跨入前院，“让他说。”\n\n屠满仓吓得僵立原地，额头冷汗涔涔而下。\n\n陈长庚跪伏在三步外，半句喊冤哭屈的废话都不讲，只伸出微乌手指，点了点瓦片边缘与暗槽出口，用最老实巴交的熬盐火工行话低声回禀：\n\n“仙师请验，小人常年在乌卤盐场看灶烟、守卤槽，别的本事没有，只认得火色走向。”\n\n“昨夜子时正刻，连接坡上甲字房的这条地底回流槽里，忽然倒灌出一股只有猛火催逼过头才会炸膛的紫黑逆冲烟，把槽口积年的湿青苔全燎卷了边。”\n\n屠满仓眼角狂跳，刚要张嘴反驳：“后山地火夜夜翻涌，哪来的什么逆冲烟——”\n\n“可紧跟着紫烟冲下来的这半块碎玉裂口里，还死死嵌着几星暗红金珠子！”\n\n陈长庚像是怕极了这位凶管事，缩着脖子抢先说出半句。\n\n旁边两名曹家家奴握刀的手腕猛地一抖！\n\n陈长庚垂着眼帘，慢吞吞补上了最致命的下半截话：\n\n“外门八座废渣房全是冷铅灰，唯独坡上甲字房这两日日夜猛火融炼内门‘赤铁血煞砂’，只有炸炉时，才会有这种挂血光的生铁星子崩进玉缝里！”\n\n轰！\n\n这一句不偏不倚，像一记重锤狠狠砸在屠满仓天灵盖上！\n\n那两名曹家恶奴手里的百炼雁翎刀“当啷”撞响，脸色唰地惨白如纸，下意识往后缩了半步！\n\n“你、你血口喷人！”屠满仓色厉内荏地暴喝，硬搬出主子名头撑场面，“苏客卿莫听这贱役挑拨！坡上甲字房可是内门曹无极曹公子亲自占下的炼器坊，我家公子什么身份，岂会看上外人阵盘？！”\n\n素衣女客卿连眼角余光都没分给屠满仓。\n\n她走到后院穿堂口，先扫了一眼瓦片上残玉裂口嵌着的赤铁金星，随即俯身探出两根素白手指，在回流暗槽底端捻起一撮尚带余温的湿黑泥。\n\n凑至鼻端，轻轻一嗅。\n\n刹那间，她清冷眸底寒霜暴涨！\n\n行家一伸手便知有没有。\n\n槽底湿泥里不仅混着浓烈刺鼻的活人血煞气，地磁残纹炸裂的源头更是顺着三十丈斜坡笔直指向坡顶甲字房，铁证如山！\n\n“偷摹本座避风阵胚，控不住地磁反噬炸了炉，还敢拿曹无极压我？”\n\n素衣女客卿缓缓直起身，左袖一扬！\n\n“铮！铮！”\n\n又是两枚通体乌沉的八棱“试脉铁钎”破空射出，与地上先前那枚呈品字形深深钉入屠满仓脚边青石板！\n\n她指尖法诀一引，地底支脉残存的狂暴乱磁寒煞如怒蛟翻身，顺着三枚铁钎轰然合拢！\n\n“咔嚓——嘭！！”\n\n屠满仓惊骇欲绝地催动通窍六窍真气举刀硬挡，护体火煞刚触及那圈灰白寒霜阵纹便如薄纸般寸寸崩碎！\n\n一股阴冽至极的地磁反震巨力透胸而入，震得屠满仓虎口崩裂，整个人仰天狂喷出一大口黑红淤血，双膝“扑通”砸碎青砖跪倒在地！\n\n“屠哥！！”三名家奴魂飞魄散，齐刷刷扔刀跪倒。\n\n屠满仓胸口剧痛如裂，眼看女客卿指尖寒芒再起，真要把此事捅去内门长老堂，曹无极绝对头一个宰了他顶罪！\n\n“苏客卿饶命！是、是小的猪油蒙了心！”\n\n屠满仓顾不得满嘴血沫，拼命磕头把额头撞得血肉模糊：“曹公子毫不知情！是小的昨夜在谷口捡到半张残纸一时贪心私试炉火，冲撞了仙师虎威！小的愿赔二十枚下品灵石领罪，求仙师高抬贵手！”\n\n素衣女客卿冷冷俯视着抖如筛糠的屠满仓。\n\n古盐墟开墟在即，她孤身受聘入宗，没必要在开墟前跟曹家彻底掀桌死磕。\n\n“滚回去告诉曹无极。”\n\n她声音冷得没有一丝温度：“天阵宗的阵纹，少画半笔便是抽髓炸炉的下场。再有下次，我拿他的炼器炉祭旗！”\n\n屠满仓把二十枚灵石袋双手奉在地上，连滚带爬被家奴架起，屁滚尿流逃出了丙字房，连头都不敢回一下。\n\n院内浓雾微散，只剩下地火坑隐隐的呼啸声。\n\n陈长庚依旧老老实实跪伏在穿堂石阶下，双手保持着托瓦片的姿势纹丝不动，呼吸轻浅虚弱，俨然一个刚捡回半条命的本分老杂役。\n\n素衣女客卿收起残玉盘与灵石袋，清冷目光垂落，第一次细细打量起眼前这个灰衣少年。\n\n“你在乌卤盐场待过？”她忽然开口问道。\n\n“回仙师，小人入宗前在乌卤盐场丙字灶熬了三年黑卤，常下废井清烟道。”陈长庚垂着眼帘恭声答道。\n\n素衣女客卿未置可否，素手一翻收起地上两枚铁钎。\n\n走到前院门槛时，她脚步微顿，屈指对着脚边最后那枚乌沉试脉铁钎轻轻一弹！\n\n“铮——！”\n\n八棱生铁钎化作一道乌影，精准无比地钉进丙字房青石门槛外侧三寸深处，尾端嗡鸣不止，隐隐散发着天阵宗独有的凛冽寒煞气息！\n\n有这枚试脉铁钎镇在门槛上，便是给坡上曹家恶奴划下了一道禁制红线。\n\n“院里那些干透的细炉灰，替我筛净两篓。”\n\n素衣女客卿头也未回，留下一句清泠简短的吩咐：\n\n“三日后辰时，挑来前山寻脉馆交差。”\n\n话音落定，一袭素白身影已踏着山道寒雾飘然远去。\n\n直到院外彻底没了声息，陈长庚才缓缓直起腰板，走到门槛边低头看了一眼那枚入石三寸的乌沉铁钎，指腹轻轻摩挲过粗糙掌心。\n\n“刚赶走恶狼，又被破阵贵客盯上了这双手眼……”\n\n“三日后进前山寻脉馆，怕是没那么容易挑着空篓子出来。”"}, {"n": 43, "title": "寻馆试针", "body": "送走寻脉馆那位素衣女客卿后，上风口甲字房果然老实了整整三天。\n\n屠满仓被寒煞震伤心脉，连门都不敢出，只敢乖乖顺着地底回流暗槽往下排泄废矿余火，再没一个人敢往丙字房门槛凑近一步。\n\n趁着这难得的三日清静，陈长庚在正月十二未时三刻准时等来了蚀纹石臼新一轮三十六个时辰充能。\n\n他照例撑开青铜隔味阵盘，将暗槽冲积的精纯血煞矿屑炼化，再得六钱淡金无瑕道髓晶砂，悉数封入锁灵寒玉匣中。\n\n看着匣内沉甸甸攒至五十六钱的极品晶砂，陈长庚合上玉盖埋回地砖暗格，随即坐在床沿思忖起来。\n\n“明日辰时要挑两篓筛净的干炉灰上前山寻脉馆。”\n\n“两只大竹篓装满细炉灰少说也有九十斤，我要是还装成随时断气的三窍烂肺鬼，一路挑上三里陡坡反倒惹那位女客卿起疑。”\n\n阵修心思细密如发，过分示弱跟过分逞强一样容易露马脚。\n\n正月十三一早，陈长庚换上一身洗得发白的灰麻杂役短褐，运转《井煞锻骨诀》锁气法门，将体内通窍七窍圆满的磅礴气血徐徐放开一线。\n\n不多不少，正好卡在“气血亏虚、靠常年苦力熬出几把死力气的通窍四窍初期”！\n\n辰时初刻，他挑起两篓细如面粉的干炉灰，揣着门槛边拓下的寻脉馆通行签条，一步一喘地踏上了戒严森严的前山东道。\n\n验过两道内门执戟卫哨卡，青松掩映间的“寻脉馆”青石院落已近在眼前。\n\n陈长庚刚挑着扁担迈上馆外石阶，还没来得及向守门杂役通传，正堂敞开的楠木雕花大门里便传出一道带着几分倨傲笑意的年轻男声：\n\n“苏清晏苏客卿，梁某今日可是诚心登门相邀！”\n\n“古盐墟地磁提前半年退潮，里头乱磁风暴比往届凶险十倍，曹无极那莽夫连活人祭器的下作手段都使出来了，分明是没安好心！”\n\n陈长庚脚步一顿，缩着肩膀停在院角槐树下，借着擦汗悄悄抬眼瞥去。\n\n只见寻脉馆正堂内，一名身穿月白蟒纹锦袍、腰悬上品暖玉佩的俊朗青年正负手而立，周身通窍九窍浑厚灵压隐而不发，气度比曹家恶奴不知体面了多少倍。\n\n在他身后两侧，还站着四名气息精悍的内门随从，为首一名左脸带疤、手按厚背斩马刀的通窍七窍壮汉更是眼神凶戾。\n\n“原来她叫苏清晏……堵门的这位穿月白蟒袍，莫非是内门另一大修真世家的九窍精锐梁世勋？”陈长庚心头微凛，立马把头垂得更低。\n\n主位旁，一袭素衣的苏清晏端立桌案后，连坐都未请对方坐一下，语调清泠如冰泉击石：\n\n“曹家如何行事，与我无关。苏某受云泽宗内门长老聘书破除古墟外禁，按约独立成队，不入任何世家私帐。”\n\n梁世勋手中折扇轻轻一合，笑容淡了三分，话里软刀子直往外冒：\n\n“苏客卿何必拒人于千里之外？天阵宗这一支如今家道中落，你在云泽宗孤身一人，连个探路挡风的得力帮手都没有。”\n\n“只要苏客卿肯把古盐墟外围那幅堪舆避风图与梁某共享，入墟之后，梁家八名好手全归你调遣护卫——否则真进了暗无天日的地底盐窟，刀剑无眼，万一叫恶徒冲撞了苏客卿千金之躯，梁某想救怕也鞭长莫及啊！”\n\n赤裸裸的逼宫吞并！\n\n先把保护费的名义立起来，你不交图入伙，进了古盐墟头一个下黑手截杀你的就是他梁世勋！\n\n苏清晏眸底掠过一丝厌烦寒意，目光一转，恰好扫见院外槐树下挑着两篓炉灰候命的陈长庚。\n\n“本座试阵的干灰到了。”\n\n苏清晏压根不接梁世勋的威胁，直接朝门外淡声开口：“挑灰的，进东侧偏室把灰卸在木架下。”\n\n正堂内五六道凌厉目光瞬间齐刷刷射向门口！\n\n梁世勋眉头一皱，看着挑着破竹篓、满鞋泥灰蹭进院门的陈长庚，眼底满是居高临下的嫌恶。\n\n“是，小人遵命……”\n\n陈长庚弓着腰，扁担压得吱呀作响，低眉顺眼绕过正堂廊檐，一脚迈向东侧偏室的青石门槛！\n\n就在他右脚草鞋踏过门槛、即将落向偏室第一块青方砖的刹那——\n\n陈长庚脚底涌泉穴周围的皮膜毫无征兆地微微一麻！\n\n偏室地面看似平平无奇的青砖灰缝底下，竟呈三角方位暗埋着三枚倒插的乌沉地磁铁钎，结成了一座无形无影的“乱磁迷步禁”！\n\n一股刁钻古怪的扭曲磁吸力骤然拽向他右脚踝，同时另一股反向斥力暗顶扁担后篓！\n\n陈长庚后背心念电转！\n\n好一个天阵宗阵修，连收两篓炉灰都在门槛底下埋了探底的钩子！\n\n但凡换作曹家或梁家派来的高阶武夫暗桩，脚下骤遇乱磁扯偏重心，体内苦修多年的强横气血必定会本能勃发震脚稳身——而一旦真气外泄一丝，砖缝下那三枚地磁铁钎立刻就会发出蜂鸣，把真实骨龄修为卖个底掉！\n\n可若是真的一头栽翻在偏室里，撒了满地炉灰，一个连脚下磁涡都察觉不到的蠢笨苦力，苏清晏同样瞧不上眼！\n\n电光石火的一息之间，陈长庚死死咬住后槽牙，将体内通窍七窍圆满的如龙气血锁得滴水不漏，连一缕真气都没往双腿灌注！\n\n他顺着那股拽向脚踝的古怪磁力，使出了早年在乌卤盐场下三号毒烟盲井、贴着油滑吸铁井壁摸黑探路的看家笨功夫！\n\n右脚尖顺势往斜刺里虚滑半寸，不与磁力硬顶；左肩扁担猛地往脖子后窝一沉，借着后头那篓五十斤干灰的下坠死沉劲，精准压住反向斥力！\n\n“呼哧……呼哧……”\n\n陈长庚粗重地喘着气，腰背弯成一张老弓，脚下草鞋看似蹒跚笨拙地一深一浅连踩三步。\n\n可每一脚落点，竟都寸毫不偏地踩在了三道乱磁吸力相互抵消的半尺物理死角之上！\n\n“咚、咚。”\n\n两只装得满满当当的大竹篓稳稳当当卸在偏室墙角木架旁，连一撮浮灰都没溅出来！\n\n陈长庚耳廓微动，清晰听见脚下青砖缝里的三枚地磁铁钎死寂无声，没有激起一丝真气反震蜂鸣。\n\n他借着弯腰搁扁担的余光往门帘缝隙一瞥，只见侧后方静立旁观的苏清晏眸光微凝，视线在他沾满泥灰的草鞋与压弯的肩头上停了一瞬，原本微扣袖中铁钎的素白指尖悄然松开了三分。\n\n“成了。既没试出世家护卫的真气底子，又亮出了盐工下盲井避乱磁的老练脚力，正好合了她眼下孤立无援、急需可控耳目的胃口！”\n\n陈长庚心里笃定，面上却揉着发酸的膝盖，缩手缩脚退回偏室门口：“客、客卿仙师，两篓细炉灰全卸妥了，小人告退……”\n\n正堂里的梁世勋早已等得不耐烦，折扇重重一敲掌心，冷声呵斥：“苏客卿，梁某跟你说正经入墟大事，你叫个满身铅臭的废渣房贱役在眼前晃悠什么？滚出去！”\n\n“慢着。”\n\n苏清晏步出偏室，神色清冷地拦住话头，素手从腰间解下那枚云泽宗内门庶务堂亲发的“寻脉客卿铜令”，往桌案上一按！\n\n“按内门聘约，本座开墟前有权在外门点调两名知晓大泽水脉的杂役听用。”\n\n她看了一眼躬身呆立的陈长庚，再抬眸直视脸色阴沉的梁世勋，字字清晰：\n\n“自今日起，丙字废渣房陈长庚归寻脉馆调遣，专司试阵炭灰。馆内即将布设地磁推演禁制，忌外人久留，梁师兄请回吧！”\n\n拿一个外门四窍杂役当挡箭牌，当众下了他梁家大公子的逐客令！\n\n梁世勋俊朗面庞上的笑意彻底消失殆尽，阴鸷目光先在苏清晏冰冷的脸上停了一瞬，随即缓缓下移，像刮骨钢刀般在挑着空篓的陈长庚脊梁骨上刮了一遍。\n\n“好，很好。苏客卿既喜欢使唤废渣房的烂泥，梁某便拭目以待！”\n\n梁世勋冷哼一声，猛一甩月白蟒袍大袖，带着四名随从大步流星踏出寻脉馆！\n\n“拿着签条回去吧，有差事自会传你。”苏清晏收起铜令，转身走回内室，干脆利落地关上了房门。\n\n陈长庚暗暗吐出一口浊气，捡起桌角盖了印的签条，挑起两只轻飘飘的空竹篓快步退出寻脉馆院门。\n\n前山东道松林幽深，因戒严清场，下山的青石夹巷里静悄悄连个人影都没有。\n\n陈长庚挑着扁担刚拐过半山腰一道背阴石壁死角——\n\n“锵啷！！”\n\n一道刺目刀光毫无征兆地从拐角古柏后劈出，带着森寒通窍七窍劲风，贴着陈长庚鼻尖削断一截扁担绳，厚重冰冷的百炼斩马刀脊结结实实横架在了他咽喉前三寸！\n\n刚才跟在梁世勋身后的那名左脸刀疤随从梁猛，面无表情地从阴影里逼出一步，单手按刀将陈长庚死死顶在冰冷石壁上！\n\n“大、大人饶命！小人就是个挑灰的……”陈长庚吓得脸色惨白，双腿筛糠般发软。\n\n“闭嘴！敢叫半声，老子现在就割了你的舌头！”\n\n梁猛眼神凶狠如狼，左手一翻，将一个沉甸甸的小灰布袋随手扔进陈长庚脚边的空竹篓里。\n\n袋口微敞，五枚莹白温润的下品灵石撞出一声清脆轻响！\n\n梁猛刀锋往前微压一分，在陈长庚脖子皮肤上勒出一道白印，嗓音低沉森然：\n\n“我家梁公子看得起你，赏你五枚灵石买命！”\n\n“你既能进寻脉馆偏室送灰，限你五日之内，也就是正月十八日落之前，把苏清晏案头上那幅古盐墟外围阵图原样拓一份交到东坡松亭！”\n\n陈长庚喉结艰难地滚动了一下，带着哭腔颤声道：“大人，那位苏客卿动不动就拿铁钎扎人，小人只有四窍微末力气，去偷她的图不是找死吗……”\n\n“不拓，正月十八子时老子亲自摸进废渣谷，一把捏碎你的喉骨扔进大泽喂黑鱼！”\n\n梁猛狞笑一声，“哐”地收刀入鞘，抬手重重拍了拍陈长庚僵硬的脸颊：\n\n“拿了梁家的灵石，你就是梁家的狗。自己掂量掂量，是五天后横着死，还是替公子办妥差事吃香喝辣！”\n\n丢下这句催命狠话，梁猛身形一晃，几个起落便消失在东道松林深处。\n\n冰冷夹巷里山风穿过。\n\n陈长庚缓缓松开捂着脖子的右手，脸上哪还有一丝惊恐瑟缩？\n\n他低头弯腰，伸手从空竹篓里拎起那只装着五枚下品灵石的灰布袋，放在掌心轻轻掂了掂，眼底浮起一抹幽深冷意。\n\n“白送五枚灵石上门，还要图看？”\n\n“正好坡顶曹无极炉底那团邪火还没处引呢……梁大公子，这幅图你可得看仔细了。”"}, {"n": 44, "title": "假图挑虎", "body": "揣着梁猛丢下的五枚下品灵石回到丙字废渣房，陈长庚反手落死铁闩，将灵石并入暗格布袋。\n\n算上先前积攒的二十五枚，手里完整下品灵石正好凑足三十枚整。\n\n“五日之内拓出苏清晏的古盐墟阵图，不交就捏碎喉骨喂黑鱼。”\n\n陈长庚坐在床沿，指尖轻轻叩了叩膝盖，眼底冷意如冰。\n\n真去寻脉馆内室偷拓天阵宗客卿的阵图？\n\n莫说苏清晏那三枚试脉铁钎杀人不眨眼，一旦坏了她在古盐墟前夕仅存的这点信任，往后想借她的避风图入墟便是痴人说梦。\n\n可要硬顶着不交差，梁世勋手下那帮恶犬在正月十八子夜真敢摸进后山杀人灭口！\n\n“梁家想要天阵宗真纹，坡顶曹家又刚拿残盘试炸了炉……”\n\n陈长庚目光转向北侧墙外轰隆作响的地底回流暗槽，胸中算盘已然拨定。\n\n要借梁世勋这头猛虎去咬死曹无极，还得先把自家这副身骨再往上推一层楼！\n\n随后两日，陈长庚白日照常筛灰铲渣，半步不往寻脉馆多凑。\n\n熬到正月十五元宵当日未时三刻，贴腹的半截蚀纹石臼准时传来滚烫潮汐脉动。\n\n距离正月十二未时三刻上一轮转化，三十六个时辰冷却期满！\n\n陈长庚当即回房嵌亮青铜隔味阵盘，铲入满满一斗甲字房排下的高纯血煞矿屑。\n\n一刻钟后，浓烈地火腥甜气在三尺阵幕内散尽，臼底静静躺着六钱淡金流转的极品无瑕道髓晶砂。\n\n入夜，前山外门张灯结彩庆贺元宵，后山废渣谷却只有地火咆哮声。\n\n陈长庚打开锁灵寒玉匣，从原有的五十六钱存晶里再舀出两钱，合紧尚存五十四钱晶砂的玉匣盖。\n\n看着掌心凑足整整八钱的淡金极品晶砂，他没有丝毫犹豫，一仰头尽数吞入腹中！\n\n通窍第八窍直连五脏心脉，寻常修士连吞三瓶净髓引都得丹毒爆体而亡，唯独石臼析出的无瑕髓晶没有一丝排异杂质！\n\n轰隆——！！\n\n八钱极品晶砂入腹即化，狂暴而纯净的道髓洪流瞬间席卷四肢百骸！\n\n陈长庚立刻跃入后院地火坑底，盘膝坐进回流暗槽喷涌的滚烫血煞余火中央，同时催动《引火行气诀》与《井煞锻骨诀》中卷法门！\n\n内有道髓神力如万马奔腾，外有内门精炼血煞火千锤百炼！\n\n七处圆满气窍轰然共鸣，拧成一股粗壮如柱的赤金气血洪流，对着左胁下第八处主气窍悍然撞去！\n\n一撞，窍关震裂！\n\n再撞，淤障尽碎！\n\n三更梆子隐隐从前山飘来的刹那，陈长庚胸腔深处发出一声低沉如闷雷的脏腑齐鸣，第八处主气窍轰然洞开！\n\n不仅修为正式踏入通窍第八窍初期，《井煞锻骨诀》中卷更在内外夹锻下彻底跨入大成之境！\n\n原本只覆在皮膜上的暗金韧性一路渗入五脏六腑，随手一握拳，双臂气力已暴涨至两千斤开外！\n\n陈长庚跃出火坑洗净汗垢，以大成锁气劲将澎湃气血重新死死压回虚浮四窍，眼底精芒尽敛。\n\n正月十六辰时，他挑着两篓筛净的细炉灰再去寻脉馆应卯。\n\n苏清晏正在内室闭门推演大阵，连面都没露，只由守门杂役验灰收篓。\n\n陈长庚规规矩矩卸完灰便走，下山拐过松林时，眼角余光清晰瞥见梁猛抱刀站在高处古柏下，冲他冷冷比了个“还剩两日”的手势。\n\n当晚回到丙字房，陈长庚从地火坑底石箅铁缝里，抠出了两片指甲盖大小的焦黑碎玉边碴。\n\n初十清晨那半块避风残玉盘虽被苏清晏收走，但他前夜隔火细看时，早已凭过目不忘的眼力将盘面十几道避风阵纹死死刻在脑海里。\n\n如今再拿同炉崩落的焦玉边碴一核对走向，分毫不差！\n\n陈长庚铺开一张泛黄薄桑皮纸，削尖一段寻脉馆带回的冷松炭条，手腕稳如铁铸，将那十几道货真价实的天阵宗外围避风残纹原样默摹在纸心。\n\n画完底纹，他嘴角微翘，蘸起一点赤红朱砂泥，在阵纹东北侧斜拉出一条引火虚线，重重画下三道醒目红圈！\n\n那红圈所指的地脉方位，正是后山上风口曹无极霸占的甲字房地火炉眼！\n\n他还在焦玉边碴上轻轻擦了一抹血煞铁灰蹭进纸角，折好塞进怀里。\n\n正月十七，酉时初刻，残阳压山。\n\n前山东坡松亭四面漏风，梁猛按着斩马刀站在亭柱阴影里，身旁还立着个山羊胡子、手持罗盘的通窍六窍老幕僚。\n\n陈长庚缩着脖子一路小跑钻进松亭，做贼似的四下张望两眼，双手颤巍巍从怀里掏出那卷桑皮纸递过去：\n\n“梁、梁大人！小人昨日趁送灰偷瞄了苏客卿摊在偏案上的副稿，回屋拼了半条命才默下来，求大人饶命！”\n\n梁猛一把夺过桑皮纸抖开，冲身旁山羊胡老幕僚一偏头：“钱老头，验验这病鬼敢不敢拿鬼画符糊弄公子！”\n\n山羊胡幕僚拈起桑皮纸先嗅了嗅松炭味，随即托起手中“试磁母针”往纸心十几道墨纹上一悬！\n\n“嗡——！”\n\n原本静止的乌黑磁针骤然剧烈轻颤，针尖死死吸向墨纹交汇的北坎生门！\n\n山羊胡幕僚脸色一变，失声低呼：“错不了！这引磁卸风的勾连笔法，确是天阵宗秘传的避风真纹底子，外人绝难凭空捏造！”\n\n梁猛大喜过望，目光往纸角一扫，忽然指着东北侧那三个刺眼的朱砂红圈冷声喝问：\n\n“慢着！外围水道怎么会连到咱们宗门后山支脉上？这三个朱砂圈是什么意思？！”\n\n陈长庚吓得一缩肩膀，连连摆手：\n\n“小人连字都不识几个，哪懂什么阵纹啊！”\n\n“小人就瞧见那张纸角沾着点后山红铁灰，苏客卿拿朱砂笔在红圈上重重敲了三下，嘴里好像冷冰冰念叨了一句什么‘甲火逆枢，炉成再取’……”\n\n“甲火逆枢，炉成再取？！”\n\n山羊胡幕僚与梁猛对视一眼，两人眼珠子同时瞪圆！\n\n“好哇！后山甲字房眼下不正是曹无极闭门炼器的地方吗？！”山羊胡幕僚倒吸一口凉气，“怪不得前几天传出苏清晏拿铁钎伤了曹家奴才，敢情那是一出瞒天过海的双簧苦肉计！”\n\n梁猛更是气得咬牙切齿：“他娘的曹无极！明着装作跟寻脉馆翻脸，背地里早就私吞了苏氏阵图借地火抢炼破禁重宝，把我家公子当猴耍！走，即刻回去禀报公子！”\n\n梁猛一把揣起拓图，顺手一脚踢在陈长庚屁股上：“滚回你的烂泥坑把嘴缝死，敢漏半个字，老子扒了你的皮！”\n\n陈长庚顺势滚下石阶，连声应是，拍着灰土一瘸一拐溜下了山梁。\n\n这一夜，后山风声鹤唳。\n\n还没到五更天，陈长庚敏锐至极的八窍耳力便听见谷口松林里接连落入七八道强悍呼吸声，死死钉在了坡顶甲字房院墙外！\n\n正月十八，卯末辰初，天刚擦亮。\n\n坡顶甲字房铁门“吱呀”推开，管事胡彪带着两名家奴刚推着废渣车露头，猛见墙根树影里蹿出几条黑衣劲装汉子探头往炉房里张望！\n\n“什么人？！敢窥视我家曹公子炼器重地，找死不成！”胡彪勃然大怒，拔出雁翎刀劈头就砍！\n\n“锵啷——！！”\n\n火光四溅，梁猛横握百炼斩马刀硬架住胡彪刀锋，满脸狞笑怒骂：\n\n“胡瞎子少给老子装蒜！奉我家世勋公子钧令，就盯你们甲字房！”\n\n“曹无极背着各房私吞天阵宗阵图，窝在后山偷炼破禁邪器，还敢演苦肉计瞒我梁家？识相的叫曹无极滚出来把阵图见者有份！”\n\n胡彪气得三尸神暴跳：“放你娘的春秋大臭屁！前几天苏清晏那臭娘们刚把老屠震吐了血，哪来的狗屁阵图？！梁家狗奴才敢上门找茬，给我剁了他们！”\n\n“怕你不成？动手！！”\n\n两拨世家恶奴本就积怨已久，三句话没说完便在废渣谷坡口拔刀群殴，刀光剑影撞得山石乱飞，眨眼间便有两个家奴挂彩见血！\n\n丙字房铁门缝后，陈长庚冷眼看着坡口撕咬成一团的两条恶虎，唇角微微一勾。\n\n有梁世勋日夜派人死盯甲字房，不论是梁猛还是屠满仓，眼下都没工夫再来找他这个挑灰杂役的晦气了。\n\n谁知他刚松开搭在门闩上的手——\n\n“当——！当——！当——！！”\n\n前山外门纳贡院方向，毫无征兆地连撞九声急促沉重、震彻整片群山的催命铜钟！\n\n谷口正在厮杀的梁、曹两家家奴同时被钟声惊得收刀罢手。\n\n不过半盏茶工夫，掌案书办庞文禄便带着四名挎刀皂役，一路敲着破锣冲进后山岔道，扯开公鸭嗓凄厉高喊：\n\n“外门急令！沉渊古盐墟开墟在即，奉内门钧令张贴头批蹚雷死士摊派红榜！”\n\n“丙字废渣房陈长庚名列第三，限巳时初刻亲赴纳贡院正堂听点画押，抗命误期者当场斩首示众——！！”"}, {"n": 45, "title": "咳血落榜", "body": "九声催命铜钟余音未绝，外门纳贡院前坪已黑压压跪满了面无人色的各房杂役。\n\n正月十八巳时初刻，陈长庚拢着破棉袄袖口，低眉顺眼挤在正堂门槛外侧。\n\n正堂廊柱下贴着一张墨迹未干的丈二红榜，“古盐墟头批破瘴死士营”九个碗口大的黑字刺得人眼眶生疼，丙字房陈长庚的名字赫然排在第三行！\n\n更叫人心头发寒的是，东侧廊庑下正站着身穿巡山皮甲、左臂还缠着渗血绷带的卢耀。\n\n他手里拎着一串哗啦作响的精铁锁链，一双三角毒眼死死盯在陈长庚后脖颈上，嘴角挂着猫戏耗子般的狞笑。\n\n“都安静！”\n\n掌案书办庞文禄一拍惊堂木，正堂屏风后，胖管事冯保山捧着那把油光水亮的紫砂小茶壶，眯着细眼慢条斯理踱坐上首。\n\n冯保山先吹了吹茶沫抿上一口，这才拖长了官腔慢悠悠开口：\n\n“诸位也听见钟响了，沉渊古盐墟地磁提前半年退潮，内门曹无极曹公子亲自统领前锋营，指名要本院挑二十名耐瘴气的精壮杂役编入头拨探路队。”\n\n堂下二十名上榜杂役吓得哭爹喊娘，谁不知道头拨探路死士就是拿肉身去蹚蚀骨风眼，十个进去活不回半个！\n\n冯保山眼皮微抬，话锋不紧不慢一转：\n\n“当然了，宗门向来体恤下情。实在身子骨弱受不住水瘴的，按外门验资老例，当堂交足二十枚下品灵石‘买甲保役费’，本官便担着干系替他改调后方粮船看舱。”\n\n“交不出的，现在就按红指印，由巡山堂卢执事锁进前锋大牢候船！”\n\n一开口就是二十枚下品灵石！\n\n上次修风墙刮两枚还不够，这老狐狸分明是趁着开墟前最后一次大征调，拿人命逼着外门杂役倾家荡产，替他那真窍幼子凑齐打点内门的百石缺口！\n\n前头两个家里有底子的杂役咬碎牙关，哆哆嗦嗦掏空私囊凑上二十枚灵石消了灾。\n\n很快，庞文禄朱笔一点：“第三名，丙字废渣房陈长庚！交石还是按印？！”\n\n陈长庚屋里暗格虽藏着三十枚整灵石，出门时袖底只揣了三块碎灵石应急；况且今日只要敢露出一枚整石，不仅坐实他往日装穷欺瞒上官，回头还得被冯保山连皮带骨榨干！\n\n他膝行两步爬进门槛，双手从怀里摸出腊月那块免捐木牌高举过头，声音嘶哑发颤：\n\n“回、回冯大人！小人腊月替丹堂筛毒砂烂了手，蒙大人仁慈亲口免了小人半年内一切摊派差役啊……”\n\n“啪！”\n\n庞文禄一戒尺打翻那块木牌，冷笑叱道：“睁开你的瞎眼看清楚！腊月免的是外院杂项修缮捐，今天贴的是内门军令死士榜！没二十枚灵石就滚过来按死契！”\n\n廊下的卢耀狞笑一声，拎着生铁锁链大步跨进正堂：“庞书办跟这病秧子废什么话！老子这就替他把爪子剁下来按印——”\n\n铁链腥风扑面而至！\n\n跪在地上的陈长庚浑身剧烈一抖，牙齿猛然咬破提前藏在舌底的一颗薄蜡丸，同时体内大成锁气劲暗逆寸关尺三脉！\n\n“咳……噗——！！”\n\n一口粘稠乌黑、混着陈年冷铅灰与腥臭腐血浆的黑血箭，毫无征兆地狂喷三尺远，溅了前头青砖一地黑紫腥沫！\n\n陈长庚两眼一翻，整个人如抽去脊梁骨的破麻袋般重重砸在血泊里，四肢剧烈抽搐，喉咙里拉风箱似的只进气不出气！\n\n“哎哟妈呀！喷黑铅血了！”旁边几名杂役吓得尖叫四散。\n\n卢耀脚步一顿，随即恶狠狠抬脚就往陈长庚肋骨上踹：“少给老子装死！剩最后一口气老子也把你拖进曹公子营里喂风眼！”\n\n“住手！！谁敢动老夫筛毒砂的人？！”\n\n堂外骤然炸响一声惊雷般的暴喝！\n\n只见丹堂副管事石百川顶着一脑门烟灰火急火燎闯进正堂，一把推开卢耀，指着冯保山鼻子就吼：\n\n“冯保山你什么意思？！内门急催五十瓶避瘴丹明早交货，老夫那十筐炸膛赤髓砂全指望这小子筛出来入药，你敢把老夫的熟手抓去填坑？！”\n\n冯保山眉头微皱，放下紫砂壶端起官腔：“石师弟稍安勿躁，这是内门曹公子亲批的死士红榜，冯某也是按章办事，总不能缺额交差吧？”\n\n“老夫不管你什么榜！今天这人你扣不得！”石百川脖子涨得通红，唾沫星子直喷公案。\n\n堂上两人僵持不下，冯保山脸色沉了下来，显然不愿当众折了纳贡院的官威。\n\n庞文禄见状，连忙捏着鼻子蹲下身去探陈长庚鼻息：“大人，小的先看看这小子死透没有……”\n\n就在庞文禄探手触及陈长庚衣领的刹那！\n\n瘫在黑血泊里抽搐的陈长庚借宽袖一遮，左手两根微乌手指闪电般一抹，两块棱角分明的碎灵石悄无声息滑进了庞文禄袖袋深处！\n\n与此同时，一道细若蚊蚋、却字字扎穿官场命门的气音钻进庞文禄耳孔：\n\n“庞大人救命……小人肺烂穿了，真抬进曹公子头拨营，没下水就断气在点卯场上……曹公子怪纳贡院拿死人充数糊弄内门，冯管事担得起这欺瞒军机的大罪吗……”\n\n庞文禄手掌猛地一颤！\n\n袖袋里两块实打实的碎灵石烫手，耳朵里这句话更是让他瞬间出了一身冷汗！\n\n对啊！曹无极是什么暴戾性子？要是纳贡院塞个走两步就吐黑血暴毙的废人去凑头拨死士数，曹公子非扒了他们纳贡院的皮不可！\n\n庞文禄眼珠子飞快一转，赶忙起身凑到冯保山耳边，压低嗓门急语数句：\n\n“大人，这病鬼脉象都散成游丝了，真抬去曹公子营里当场断气，反坏了大人足额办差的金字招牌！”\n\n“况且石副管事正在气头上……我瞧丹堂那个记名学徒窦文焕，腊月本就签了外围背篓采药契，四窍清气壮实得很，不如顺水推舟把窦文焕提进头拨死士营顶第三名缺，两头都交得上差！”\n\n冯保山眯着的细眼猛地闪过一道精光！\n\n廊下正端着铁链生闷气的卢耀耳朵最尖，一听见“窦文焕”三个字，整双眼睛瞬间充血发红！\n\n表弟卢成雪夜惨死西坡，他至今认定是窦文焕那小畜生黑吃黑灭口，正愁丹堂护着没法弄死姓窦的！\n\n“冯管事明鉴！”卢耀当即收起铁链抢步抱拳，声音震天响，“庞书办说得在理！地上这烂肺鬼连路都爬不动了，哪够给曹公子探路？丹堂窦文焕年轻力壮又有采药契在身，锁他去头拨死士营最合军规！”\n\n石百川愣了一下，想起窦文焕私炼春煞散害他背黑锅的旧恨，只要不耽误自己筛赤髓砂交差，死个记名学徒算个屁！\n\n“哼！窦文焕本就有采药契在身，你们调他老夫不管，这筛砂病鬼老夫得留着用！”石百川顺坡下驴冷哼一声。\n\n冯保山端起紫砂茶壶轻轻一磕桌面，脸上重新浮起那副滴水不漏的慈悲笑意：\n\n“既然石师弟与卢执事皆有公论，本院自当实事求是。庞书办，勾去丙字房陈长庚，改填丹堂记名学徒窦文焕编入头拨破瘴死士营，即刻拿签锁人！”\n\n“得令咧！！”卢耀狂喜狞笑，抓起红头铁签带着皂役如恶狼般直扑丹堂上舍而去！\n\n陈长庚趴在冰冷青砖上，心里冷笑一声，刚想喘口气谢恩，上首冯保山慢悠悠的声音却再次飘落下来：\n\n“至于陈长庚嘛……既然病得连床都下不来了，整日烧炭岂不是白白熏坏了身子？”\n\n冯保山眯眼一笑，官字两张口刮起最后一层油皮：“庞书办记下，丙字房下月例发炭火银扣去七成充作前线军需。叫他滚回去歇着，申末自己来偏房领盖印的免调木签吧！”\n\n好一个雁过拔毛的冯管事，免了死士差，顺手把七成炭火银吞进了肚子里！\n\n“咳咳……谢冯大人不杀大恩……”\n\n陈长庚擦着嘴角黑血磕了个头，扶着墙根一步三晃地挪出纳贡院，两块碎灵石换一条命外加送宿敌窦文焕下地狱，这笔买卖赚翻了天。\n\n午后回到丙字废渣房，他漱净口中铅灰残渣，锁门静候。\n\n未时三刻一到，蚀纹石臼准时完成新一轮三十六个时辰充能，陈长庚在隔味阵盘内炼化血煞矿屑再收六钱极品晶砂，锁灵寒玉匣内存晶稳稳攒满六十钱整！\n\n傍晚时分，乌云压顶，一场罕见的冬末瓢泼暴雨倾盆砸落山谷。\n\n陈长庚冒雨去纳贡院偏房领回盖妥内门大印的免调木签，戌时初刻才顶着湿透的破蓑衣赶回丙字废渣房。\n\n他刚反手掩上千斤生铁大门，甩掉蓑衣雨水准备清点入墟存粮——\n\n“叩、叩、叩。”\n\n滂沱雨幕之外，生铁门环忽然被人用极轻、极稳的力道叩响了三下！\n\n陈长庚眼神骤凛，右袖乌光微扣，无声贴到门后拉开门缝往外一瞧。\n\n只见漆黑冰冷的瓢泼夜雨之中，寻脉馆客卿苏清晏竟未撑雨伞，一袭素白道袍孤身立在石阶下，垂在身侧的左袖管口隐隐透出一缕被雨水冲淡的暗红血迹！"}, {"n": 46, "title": "隔门讨价", "body": "瓢泼大雨砸在门廊青石板上，溅起一尺高的冰冷水花。\n\n陈长庚目光在苏清晏左袖那抹暗红血痕上一掠而过，鼻翼极轻地动了动。\n\n雨水腥寒，却盖不住一股从心脉震荡溢出的淡淡内腑血气；再听她呼吸，每逢第三息换气末尾便有一丝极细微的凝滞。\n\n“白日寻脉馆闭门推演，她定是独自强算古盐墟地磁死禁遭了煞气反噬！”\n\n陈长庚心如明镜，脸上却没有露出一丝看穿虚实的异样，更不敢把一位杀伐果断的阵修往藏着石臼阵盘的屋里请。\n\n骄矜孤高的天阵宗客卿半夜带伤登门，若是叫一个外门杂役点破她受了内伤，迎面而来的绝不是感激，而是杀人灭口的寒煞铁钎！\n\n“客、客卿仙师？！”\n\n陈长庚隔着半扇拉着铁链的生铁门缝，慌忙躬身行礼，故意缩着脖子剧咳两声：“这么大的雨，仙师怎么亲自下后山来了？小人这屋里全是铅毒恶臭，实在不敢污了仙师衣履……”\n\n雨幕中，苏清晏面色苍白如雪，雨水顺着乌木发簪滑落，眼神却依旧冷得像两口古井。\n\n她看都没看门内一眼，右手一翻，直接从袖中取出一只干爽素锦小袋，隔着门缝递到陈长庚面前：\n\n“半月后沉渊古盐墟开启。你随本座入外围水道辨识毒烟风向，这五枚下品灵石是你的酬劳。”\n\n没有一句客套寒暄，开口便是买命定价。\n\n换作寻常穷疯了的外门杂役，见着五枚白花花的整灵石早跪下抢进怀里了。\n\n可陈长庚非但没伸手去接，反而像见了烧红烙铁一般，脸色煞白地往门后缩了半步，连连摆手苦笑：\n\n“仙师饶命啊！这五枚灵石小人万万不敢拿！”\n\n苏清晏柳眉微蹙，声音冷了一分：“嫌少？”\n\n“不是嫌少，是有命拿没命花啊仙师！”\n\n陈长庚苦着脸摊开自己粗糙微乌的双手，把死人账摊在明面上算：\n\n“仙师白日或许也听说了，小人今早在纳贡院刚吐了一升黑铅血，差点把命丢在堂上，就为了躲开那探路死士榜！”\n\n“古盐墟里头全是刮骨吸髓的乱磁风眼，连通窍八九窍的内门师兄进去都得脱层皮，小人这点虚浮四窍力气跟着进去，一阵黑风吹过来就成枯骨了，拿五枚灵石给谁花去？”\n\n苏清晏清冷目光钉在他脸上，袖中试脉铁钎发出一声若有若无的铮鸣：\n\n“你既已调归寻脉馆听用，待内门征调令一落，不去也得去。跟在本座身边尚有阵法遮护，难道你想去曹无极前锋营当肉盾？”\n\n软硬兼施，直接拿调令压人！\n\n若是一味哭软，真被她当成随便揉捏的廉价炮灰，进了古盐墟头一个被推出去试风眼的就是自己。\n\n陈长庚呼吸一滞，迎着那股迫人寒意，非但没松口，反而顺杆往上爬，压低声音一句顶了回去：\n\n“仙师明鉴，小人真进了曹公子营里固然是死，可眼下梁家、曹家都在外头红着眼盯死寻脉馆！”\n\n“小人没根没派跟着仙师入墟，在两位内门公子眼里，那就是头一个该拔掉立威的活靶子！”\n\n苏清晏瞳孔微凝，握着锦袋的手指微微一紧。\n\n这灰衣杂役足不出谷，竟连梁世勋与曹无极准备在入墟后拿她寻脉馆开刀祭旗的凶险局势都看得一清二楚！\n\n“那你待如何？”苏清晏没有动怒，语调平直问道。\n\n“小人贱命一条，真要豁出去替仙师辨毒烟探水路，散碎灵石一文不要！”\n\n陈长庚伸出两根手指，目光诚恳却寸步不让地盯住苏清晏：\n\n“小人只求仙师先行赐下两样保命订金——第一，赐小人一件能遮掩周身气血声息、叫八九窍高手贴面也瞧不出深浅的敛息宝贝，好让小人在暗处替仙师摸风向；”\n\n“第二，请仙师先给小人看一角外围水道走向图，小人好回屋提前按水脉深浅调配解毒灰囊！否则两眼一抹黑往绝地里钻，小人宁可明早撞死在纳贡院柱子上！”\n\n门廊下只剩哗哗雨声。\n\n十来句短促交锋，两人隔着一道生铁门缝目光相撞。\n\n苏清晏静静审视着门后这张蜡黄谦卑、实则把每一步退路都算进骨子里的少年面孔。\n\n梁家与曹家塞过来的人个个满嘴忠义，实则全盯着她怀里的苏氏祖传堪舆图；而眼前这个废渣房杂役，不要现成的五枚灵石，张口只讨保命符与探路底图。\n\n越是惜命算细账的人，进了绝地反而越不会乱踩死禁连累旁人！\n\n左脉深处再度传来一阵针扎般的地磁反噬隐痛，苏清晏不宜在雨夜久耗，冷冷偏过头，留下一句极短的挤兑：\n\n“四窍气力，算盘倒拨得比九窍还响。”\n\n话音未落，她收回那袋灵石，素手在腰间储物囊上一抹，隔着门缝递进两样物件！\n\n上头是一枚巴掌大小、通体灰青无光的古朴玉符，入手冰凉沉凝；下头则是半张被利落裁下边缘、绘着细密水纹墨线的油布残图！\n\n“此乃我天阵宗秘制‘高阶敛息玉符’，滴血贴胸佩戴，便是通窍九窍巅峰当面亦探不出你气机深浅。”\n\n苏清晏声音清泠简短，一字一顿划清界限：\n\n“这张是古盐墟外围西北角避风残图，仅作订金。待入墟引我过了前三道毒瘴槽，余下酬劳另结；你若敢拿了符图逃役，天涯海角本座必取你性命！”\n\n“小人省得！谢客卿仙师赐宝保命！”\n\n陈长庚双手恭恭敬敬接过玉符与油布残图，凑近门廊内侧那盏昏黄防风油灯，装作辨认毒瘴水位，目光在残图上一扫而过！\n\n只这一眼，陈长庚后背汗毛猛地一跳，心底掀起滔天巨浪！\n\n只见油布残图西北边缘，清清楚楚用朱砂小楷标着一道“古引卤断槽”，向外延伸三里的出水口方位，分毫不差正是他正月初六潜入芦苇断崖三丈深水亲手摸到的那道废弃排卤暗沟！\n\n而更令他心跳加速的是，顺着这道断槽往古盐墟内部延伸的虚线，竟完美避开了外围三处骷髅标记的蚀骨风眼，斜斜插向残图内侧被苏清晏刻意裁去的核心石窟腹地！\n\n前代盐工草图与天阵宗古墟残图，在这一刻彻底严丝合缝拼上了！\n\n陈长庚硬生生压下翻涌的心绪，脸上一丝异色不露，小心翼翼折好残图揣入怀中：“水脉深浅小人记下了，这几日一定配齐避毒灰囊听候仙师传唤！”\n\n“敛息符贴身戴稳，莫还没进墟便死了，白费本座订金。”\n\n苏清晏深深看了他一眼，不再多留一息，素白衣袂微振，转身几个起落便悄无声息隐入了谷外漆黑瓢泼的雨幕之中。\n\n陈长庚吐出一口长气，刚要拉上铁栓回房滴血祭炼敛息玉符——\n\n“轰隆——！！！”\n\n一声远胜九天闷雷的恐怖炸响，毫无征兆地从三十丈外的上风口甲字房正中央轰然引爆！\n\n陈长庚脚下青石地面猛烈摇晃，屋顶积灰簌簌狂掉！\n\n透过漫天雨帘抬头望去，只见坡顶甲字房整座青砖炉厅屋顶被一股狂暴失控的赤红血光硬生生掀飞上天，紧接着两声凄厉绝望到极点的活人惨嚎刚冲出喉咙便被烈焰吞没！\n\n“曹无极趁着暴雨夜强催血煞破禁锥成器，把炼器炉彻底催炸膛了？！”\n\n陈长庚瞳孔骤缩，话音还没在肚子里落定——\n\n“咻——咻咻咻——！！”\n\n后山四面八方雨幕深处，原本盯梢梁曹动静的内门执法铁卫瞬间吹响刺耳欲裂的破空急哨！\n\n数十道森然火把流光混着沉重整齐的铁甲奔袭声如铁桶合拢，眨眼间便将整座废渣谷出口死死封锁！"}, {"n": 47, "title": "塌窖藏偶", "body": "大地还在剧烈震颤，坡顶甲字房掀飞的半边青砖屋脊裹着赤红火球砸落山腰，激起漫天黑臭水雾！\n\n陈长庚站在丙字房穿堂下，指尖刚把苏清晏留下的高阶敛息玉符与避风残图塞进贴胸储物袋，脸色已沉如寒铁。\n\n谷外四面八方全是内门执法铁卫刺耳的竹哨声，火把流光正顺着泥泞石阶狂奔而下。\n\n“两条试器人命当场炸成焦炭，曹无极就算内门有人撑腰，今晚也兜不住这通天篓子！”\n\n“屠满仓那条疯狗想保命，必定拿两院刚砸通的地底回流暗槽做文章，把炸炉黑锅往我丙字房头上扣！”\n\n陈长庚心念电转，猛地回头看向后院地火坑。\n\n白天他刚把四尺高的青铜机括盾偶和装满三十六只二蜕煞甲虫的寒铁药瓮挪进坑底暗格温养火气，此刻根本来不及一件件往回起！\n\n一旦让内门执法铁卫跳下火坑掘地三尺，机关盾偶与凶虫当场就得暴雷！\n\n果不其然，坡顶浓烟里已炸开屠满仓嘶声裂肺的嚎叫：\n\n“严执事明鉴啊！不是小的控火失手，是坡下丙字房那个狗杂役堵死了排毒暗槽，害沼气倒灌顶炸了曹公子的丹炉！”\n\n“快封死丙字房搜他的地火坑！赃证全在他坑底下！”\n\n杂乱沉重的铁靴踏水声如暴雷般直扑丙字房院门，距离撞门已不足五息！\n\n陈长庚眼底寒芒暴涨，不退反进，一步抢入后院东侧那座荒废了十余年的陈年废灰砖窖旁。\n\n这座半塌拱顶老灰窖里头，结结实实堆着不下八千斤早年器堂筛剩的冷铅废灰，底下两块承重拱砖早被酸雨蚀得酥朽不堪！\n\n就在坡上甲字房残炉再次传来“轰”的一声余爆闷响、震得山岩微晃的同一刹那——\n\n陈长庚右掌暗金微泽一闪而逝，通窍八窍两千斤横练暗劲隔着三寸浮灰，悄无声息吐在东侧老灰窖最酥朽的那块拱心残砖死穴上！\n\n“咔嚓——轰隆隆！！”\n\n酥烂的老拱砖应声崩碎，整座丈许高的陈年废灰窖顺着余爆震波轰然坍塌！\n\n八千斤夹杂着碎青砖的乌黑冷铅灰如山洪倾泻，眨眼间便把后院地火坑填平了大半，将坑底暗格连同盾偶、虫瓮严严实实封死在五尺废灰之下，半丝人为掌印都没留下！\n\n紧接着，陈长庚往漫天黑灰泥水里狠狠一滚，牙齿顺势磕破下唇蹭出满嘴鲜血，手脚并用爬到前院穿堂门槛边。\n\n“砰——哐！！”\n\n丙字房千斤生铁大门被四名披甲执法铁卫合力一脚踹飞！\n\n一名面容冷峻、身穿玄黑云纹执法袍的通窍九窍中年执事大步跨入院中，正是内门执法堂实权执事严嵩。\n\n在他身后，半边膀子被气浪掀掉一层皮肉、满脸黑血的屠满仓正指着地上吐血咳嗽的陈长庚跳脚咆哮：\n\n“严执事您看！就是这三窍病鬼怀恨在心，半夜拿湿泥堵死回流槽害炸了曹公子的炉子，快叫铁卫把他拖出去杖毙！”\n\n跟在后头的管事胡彪吓得面无人色，只敢缩着脖子拼命点头帮腔。\n\n严嵩眉头紧锁，冰冷目光扫过一片狼藉的后院，沉声喝问：“丙字房杂役陈长庚！甲字房炸炉折损两条人命，你可知罪？！”\n\n通窍九窍的森严灵压当头压落。\n\n陈长庚趴在冰冷泥水里剧烈喘咳，抬起一张糊满黑灰血泥的脸，连半句空口辩白都没有，只颤抖着伸手指向后院坍塌的灰窖与北墙暗槽：\n\n“咳咳……严大人救命！方才坡上一声惊雷把小人这老灰窖都震塌了，差点把小人活埋在底下啊！”\n\n“屠管事说小人从下风口堵槽倒灌……求大人移步瞧一眼北墙那道回流暗槽出口，一看便知是谁炸了谁！”\n\n屠满仓眼皮猛地一跳，厉声喝阻：“严执事别听这贱役狡辩！暗槽都叫塌灰埋了有什么好看的——”\n\n“闭嘴！”\n\n严嵩冷冷瞥了屠满仓一眼，带着两名懂行的老铁卫快步走到北墙根。\n\n坍塌的冷铅灰只掩住了坑底，高出地面两尺的回流暗槽石口依然露在外头。\n\n一名老铁卫举起强光火折子凑近槽口一照，脸色顿时变了，伸手抠下一块挂在槽壁倒刺上的暗红铁渣呈给严嵩：\n\n“启禀严执事，槽口青砖全是从上往下崩裂的，半点没有下头淤堵的痕迹！”\n\n“而且这槽壁上溅满的全是刚出炉的‘赤铁血煞铁屑’，里头还混着焦黑人骨渣……分明是坡上甲字房强催邪火炸了膛，狂暴火浪顺着暗槽往下倒灌冲进了丙字房！”\n\n屠满仓脑门上冷汗如豆大滚落，嘴硬嘶喊：“不可能！定是这小子前几天偷塞了邪物进槽——”\n\n“大人明鉴！”\n\n陈长庚跪在雨地里，又往大门门槛外侧一指，声音沙哑却字字清晰：\n\n“正月初十清晨，前山寻脉馆那位天阵宗苏客卿亲自来废渣谷查过地脉，当场就验出甲字房半夜逆冲赤铁毒火！”\n\n“苏客卿怕坡上恶火再冲坏地脉，临走亲手在咱们院门槛上钉下了那枚天阵宗‘试脉铁钎’镇煞，那铁钎至今还在石槛上插着呢！”\n\n严嵩猛地转头看向大门青石槛！\n\n只见火把映照下，那枚乌沉八棱的天阵宗独门试脉铁钎正入石三寸，尾端寒煞凛然！\n\n还没等严嵩开口，被铁卫拦在谷口竹栅外的两名梁家精锐暗桩早已看热闹不嫌事大，隔着雨幕扯开嗓门高声起哄：\n\n“严执事尽管秉公办案！小的们奉梁世勋梁公子之命在谷外巡夜，刚才四双眼睛全瞧得真真的！”\n\n“分明是坡顶甲字房先冲起三丈高的活人血光炸了屋顶，隔着二里地都听见里头两个杂役喊救命，跟坡底下这病秧子有个屁相干！”\n\n轰！\n\n前有槽壁血煞人骨渣铁证，中有天阵宗女客卿留下的试脉铁钎，外头还有死对头梁家的眼线拿炭笔现场记账！\n\n严嵩原本跟曹家有些香火情，还想着找个外门替死鬼糊弄过去。\n\n可眼下这局势，他要是敢硬指鹿为马去动苏客卿点过名的杂役，明早梁世勋就能把状纸连同天阵宗的脸面一并捅到内门掌刑长老案头！\n\n“混账奴才！自己控火无能炸毁炉房闹出人命，还敢当着本执事的面栽赃陷害？！”\n\n严嵩脸色铁青，反手一记耳光将屠满仓抽得原地转了个圈，满嘴黄牙混着血水狂飙而出！\n\n“严、严执事饶命！小的也是替曹公子——”屠满仓吓得魂飞天外，刚喊出半句曹公子，严嵩眼神骤然一厉！\n\n“还敢攀咬内门弟子？！”\n\n严嵩一挥玄黑大袖，当众铁面宣判：“甲字房掌炉家奴屠满仓违禁猛火炼器致炉膛炸裂，当场重抽三十生铁执法鞭！管事胡彪督管失察，罚没曹家外院俸石半年！甲字房即刻贴封条熄火查封，任何人不得擅开！”\n\n“不要啊大人——啊！！”\n\n四名如狼似虎的执法铁卫一把按倒屠满仓，浸过盐水的沉重生铁鞭带着破空厉啸，一鞭接一鞭狠狠抽在他后背上！\n\n皮开肉绽的闷响与凄厉惨叫响彻雨夜山谷，听得胡彪跪在泥水里筛糠般磕头谢恩，半个字都不敢多放。\n\n三十铁鞭抽完，屠满仓后背已是白骨隐现，整个人像滩烂泥般只剩半口气。\n\n严嵩冷哼一声，命铁卫收队押着胡彪上去贴封条，转眼间退了个干干净净。\n\n两名曹家家奴抬起奄奄一息的屠满仓往门外走。\n\n经过门槛时，满脸血污的屠满仓死死扒住门框，布满血丝的独眼怨毒至极地钉住廊下的陈长庚，用颤抖的右手在自己脖子前狠狠比出一道割喉手势！\n\n陈长庚缩着脖子瑟瑟发抖，等那伙人一走远，赶忙一瘸一拐上前，“哐当”落死千斤生铁门闩。\n\n转过身的一刹那，他擦去嘴角血沫，脸上惶恐之色荡然无存，只剩一片彻骨冰寒。\n\n“三十铁鞭还没抽死你……行，那就在进古盐墟前，送你上路。”\n\n雨势渐歇，陈长庚没有急着回屋歇息，而是抄起一把精铁大锹走到后院地火坑边，动手铲开坍塌的陈年冷铅灰，准备先把暗格里的虫瓮起出来透气。\n\n两千斤臂力挥锹如风，不过两刻钟便清到了东侧老灰窖最底层的青石地基。\n\n就在他一锹铲向墙角一块松动黑石板的瞬间——\n\n“铛！！”\n\n铁锹刃口猛地磕在一件坚硬无比的金属棱角上，竟在黑夜里迸出一溜刺目金星，把精铁锹头都崩开了一道米粒大的豁口！\n\n陈长庚动作一顿，蹲下身拨开积存数十年的乌黑老炉垢，伸手将卡在石缝底下的那截器物抠了出来。\n\n入手沉重得吓人，足有十余斤重！\n\n借着坑底微弱地火红光一看，那竟是一截长约九寸、通体乌黑发亮、布满天然细密暗金百炼云纹的三棱尖刺粗胚！\n\n即便在废灰窖底埋了不知多少年月，刺尖三寸处依旧流转着一股刺痛指腹皮膜的凛冽破甲寒芒！\n\n“这是几十年前器堂还没搬走时，哪位内门炼器师炸炉遗落在地基缝里的……百炼乌金刺胚？！”\n\n陈长庚指腹轻轻弹过乌金刺脊，听着那声清越如龙吟的嗡鸣，眼底骤然亮起一抹灼热精光！"}, {"n": 48, "title": "芦沟灭口", "body": "甲字房贴上执法堂封条后，整座废渣谷终于彻底安静下来。\n\n距离沉渊古盐墟开启已不足半月光景。\n\n陈长庚锁死院门潜心休整了三日，在正月二十一未时三刻准时迎来蚀纹石臼新一轮三十六个时辰潮汐充能。\n\n他将地火坑底残存的最后一斗精纯血煞矿屑尽数炼化，再收六钱极品晶砂封入锁灵寒玉匣，匣内存晶稳稳突破至六十六钱！\n\n“修为已至通窍八窍，晶砂、盾偶、二蜕凶虫俱全，唯独上次雪夜用光了过载烈阳火珠，手头还差一柄能一击捅穿八九窍灵罩的贴身凶刃。”\n\n正月二十二戌时初，夜黑风高，山林无月。\n\n陈长庚先往胸口贴紧滴血认主的“高阶敛息玉符”，将通窍八窍气血敛成虚浮四窍病态，随后披上那件洗得发白的外门灰麻旧袄，顺着废渣谷外偏僻的后山裤裆路一步一晃走下山脚。\n\n穿过山脚乱石岗后，他折入乱石集西口一片无人密林，确认身后并无尾巴缀行，这才闪身换披上宽大灰黑斗笠与遮颜铁面，一头扎进鱼龙混杂的乱石集暗巷。\n\n排污暗渠尽头的老茶棚早已打烊，唯有后窗挂着半截红草绳。\n\n陈长庚屈指在窗棂上三长一短轻叩四下。\n\n“吱呀。”\n\n木门开了一道窄缝，浑身带着水腥气的贺九斤探出半颗脑袋，一见这身熟悉的铁面灰斗笠装束，赶忙赔笑将人迎进点着豆油灯的地窖：\n\n“哎哟我的爷！您老可算来了，再晚两天哥哥我都怕被内门征船抓去当纤夫了！”\n\n陈长庚嗓音压得沙哑低沉，开门见山：“预订的猛货齐了？”\n\n“给您老办事，哪敢含糊半星！”\n\n贺九斤搓着手，小心翼翼从地砖暗槽里捧出一只裹满油纸的沉重木箱，掀开盖子推到桌上：\n\n“您掌眼！八枚请器堂老供奉私改过双层引火槽的‘过载烈阳火珠’，每一枚塞足了三倍赤磷硫精，炸开来通窍八窍沾着也得脱层骨头皮！”\n\n“外加两只上好封晶寒玉小匣！连手工带暗渠买路钱，一口实价，二十四枚整灵石！”\n\n陈长庚摘下皮手套，指腹挨个摸过八枚沉甸甸的熟铜火珠外壳，确认既无暗裂也没被人撒过追踪香粉，这才从袖里数出二十四枚莹白下品灵石拍在桌上，把余下六枚整石收回贴身暗袋。\n\n“痛快！跟爷做买卖就是舒坦！”贺九斤眉开眼笑地收起灵石，顺口提醒一句，“对了爷，这两天集外黑芦沟不太平，听说敌宗玄煞门的探子跟黑市毒贩混在一块儿摸哨，您老回程绕着点走！”\n\n“省得。借你后院无人地火炭炉使半个时辰，另算你两块碎银。”\n\n“成嘞，后院哑巴老铁匠今儿歇工，火精炭现成的，哥哥我先走东巷回避！”\n\n贺九斤最守黑市规矩，收了碎银转身锁上外门，头也不回地钻进东侧暗渠撤离。\n\n陈长庚独自步入后院炙热打铁棚，拉响风箱催旺百炼火精炭，将那截九寸长的“百炼乌金刺胚”连同孟逵留下的赤铜辅料一并投进白炽炉心！\n\n等到乌金粗胚烧至暗红透亮，他抄起八十斤重的百炼生铁大锤，通窍八窍两千斤暗金横练巨力轰然爆发！\n\n“铛！铛！铛——！！”\n\n一锤落定，火星四溅！\n\n他严格依着器堂“回温三锻术”秘窍，猛火急锻九锤、冷卤淬锋一息、再入余炭回温定性！\n\n整整两刻钟，数百记千钧重锤将乌金胚内最后一丝驳杂气泡彻底砸尽，硬生生锻打出一柄长九寸三分、三棱带深血槽、通体泛着幽暗乌光的绝命凶器——百炼乌金破甲分水刺！\n\n陈长庚随手拿刺尖往棚角一块半寸厚的废精铁护心镜上一送。\n\n“噗！”\n\n如同热刀切牛油一般，连一丝滞涩声都没发出，三棱刺尖已齐根没入精铁镜面！\n\n“好刺。”\n\n陈长庚收刺入右袖滑槽，想起方才贺九斤提醒黑芦沟不靖，当即打开锁灵寒玉匣取出两钱无瑕晶砂，将尚存六十四钱晶砂的玉匣合紧锁回储物袋，亲手把那两钱晶砂按进青铜机括盾偶胸口阵槽，扣紧腕间子母引簧铜扣备战。\n\n一切备妥，已近子时。\n\n他出了乱石集西口，在先前那片僻静密林里脱掉铁面与灰黑斗笠收起，换回外门灰麻旧袄，沿着返回废渣谷最近的一条黑芦沟小径疾步而行。\n\n刚走入两岸枯苇高逾丈许的黑芦沟腹地，陈长庚脚步忽地一缓。\n\n太静了。\n\n两侧烂泥水洼里，连冬夜常叫的寒鸦与水鼠声都死绝了，夜风里隐隐飘着一丝腥臭刺鼻的腐骨铁锈味！\n\n“等了我小半宿吧？”陈长庚停在泥道中央，似笑非笑地轻叹一声。\n\n“哗啦啦——！！”\n\n两侧枯黄芦苇丛猛然炸开，一张足有三丈方圆、挂满倒刺绿毒钩的百炼“腐骨铁网”借着滑轮机括兜头罩落，瞬间封死了前后所有退路！\n\n左边苇荡里，后背缠满厚血布、拄着铁拐的屠满仓一瘸一拐钻了出来，那张浮肿的横肉脸在夜色下扭曲得如同恶鬼：\n\n“小杂种！老子叫暗哨在远坡盯死后山裤裆路整整四天，总算瞧见你披着这身破麻袄半夜溜下山买烂草药了！”\n\n而在正前方三丈外的一块青石上，不知何时多了一个身穿墨绿短褂、十根手指乌黑如老鹰鸡爪的干瘦老者，周身赫然翻涌着通窍八窍初期的阴毒煞气！\n\n正是乱石集凶名赫赫的八窍毒贩，苗五指！\n\n“屠老弟没骗老夫，果然是个走路都打晃的外门病秧子。”\n\n苗五指阴恻恻怪笑一声，枯爪一搓，一团腥臭扑鼻的惨绿毒砂已在掌心蓄势，“小子，老夫不白杀无名鬼——把你从寻脉馆那小娘皮手里摸到的古盐墟阵图交出来，老夫给你留具全尸！”\n\n屠满仓咬牙切齿地拿铁拐指着陈长庚狂吼：“苗五爷别跟他废话！先拿腐骨网勒断他四肢，老子要亲手一寸寸刮了他的肉，报那三十铁鞭的血仇！”\n\n拉紧铁网绳索的机括轰然绞动，带着剧毒倒刺的百炼铁网离陈长庚头顶已不足三尺！\n\n换作任何一个通窍四窍杂役，此刻除了跪地等死别无他路。\n\n网底中央，一直缩肩垂首的陈长庚缓缓抬起头，眼神冷漠得像在看两具死尸，连半个字的废话都没回。\n\n“嗡——！！”\n\n体内《井煞锻骨诀》中卷大成的通窍八窍气血如火山轰然解封，周身皮膜骤然腾起一层深邃暗金冷光！\n\n就在苗五指脸色剧变、猛然欺身一记十成威力的“腐骨毒砂掌”拍向陈长庚面门的电光石火间——\n\n“咔！”\n\n陈长庚左手腕间子母引簧铜扣猛然一拨！\n\n一道四尺高、重达三百斤的百炼青铜机括盾偶凭空闪现横挡身前，胸槽两钱无瑕晶砂光华暴涨，碗口厚的青铜巨盾迎着惨绿毒掌悍然硬撞！\n\n“嘭——铛！！”\n\n震耳欲聋的气劲爆鸣炸开，足以拍裂巨石、蚀穿七窍武夫胸膛的八窍毒砂掌结结实实印在青铜大盾上，竟只溅起一蓬黑烟，连盾偶半步都没震退！\n\n“什么鬼机关？！”苗五指瞳孔骤缩成针尖！\n\n与此同时，头顶那张腐骨铁网已当头压落！\n\n陈长庚心神一动，三十六道暗金流光自袖底呼啸冲天——二次蜕壳的嗜铁煞甲虫群见铁如见血食，锋利口器疯狂开合！\n\n“咔嚓嚓嚓——！！”\n\n手指粗的百炼腐骨铁网连半息都没撑住，当场被三十六只二蜕凶虫啃出一个丈许大洞！\n\n虫群去势不减，在陈长庚神血母印催动下化作一道夺命黑金箭矢，直扑三丈外拄拐呆立的屠满仓！\n\n“啊！！滚开！这是什么鬼虫子？！”\n\n屠满仓吓得亡魂皆冒，拼命挥动铁拐催发六窍火煞护住胸口，可他背上三十铁鞭重伤未愈，真气刚提起来便是一阵撕裂剧痛！\n\n“嗤啦——噗噗噗！！”\n\n三十六只暗金甲虫瞬间噬穿他胸前那面精铁护心铜镜，如滚烫铁珠般钻透心肺琵琶骨！\n\n屠满仓连第二声惨叫都没喊出来，双眼暴凸，喉咙里涌出大股黑血，“扑通”一头栽进烂泥坑里抽搐气绝！\n\n从盾偶挡掌到屠满仓毙命，前前后后不过短短两息！\n\n“通窍八窍横练？！点子扎手，撤！！”\n\n苗五指到底是在刀尖舔血十余年的老牌八窍毒修，一见势头不对毫不停留，脚尖猛点青石暴退，同时全身通窍八窍阴煞真气狂涌而出，在体表撑起一层厚达三寸的墨绿毒煞护体气罩，左手已摸向怀中求救信号！\n\n“现在想走，晚了。”\n\n陈长庚冷冷吐出六个字，脚下盲井贴地滑步如贴水黑燕，两千斤横练爆发力将泥地踩出两个尺深脚印，一步便跨越两丈距离贴进苗五指怀里！\n\n右臂肌肉坟起如铁虬，那柄刚出炉的九寸“百炼乌金破甲分水刺”裹挟着撕裂空气的尖啸，笔直刺向苗五指咽喉！\n\n“老夫八窍毒罡，凭你也想破——呃？！”\n\n苗五指狞笑着双爪交叉硬封，可乌金三棱刺尖刚触及墨绿毒煞气罩——\n\n“啵——噗嗤！！”\n\n百炼乌金天生破煞，配以两千斤暗金横练寸劲，那层寻常刀剑难伤的八窍护体气罩竟如肥皂泡般应声洞穿！\n\n冰冷乌金分水刺毫无阻碍地切开苗五指交叉的双腕筋骨，一刺到底，从他咽喉正中狠狠贯入、后颈透出三寸寒尖！\n\n“嗬……嗬……”\n\n苗五指十根乌黑毒爪死死抠在半空，满眼尽是荒谬与骇然，生机在三棱放血槽下瞬息断绝！\n\n第三息落定，一八窍、一六窍，全灭！\n\n陈长庚面不改色抽回滴血不沾的乌金分水刺，一拍储物袋收起胸槽两钱晶砂已然燃尽的青铜机括盾偶，又召回啃净碎铁网的三十六只煞甲虫收入药瓮，动作麻利地在两具尸身上摸索一通。\n\n屠满仓贴身钱袋里搜出九枚染血下品灵石，苗五指腰间储物袋更是肥得流油——整整二十二枚下品灵石、一只封口完好的寒玉小匣，外加一颗鸽卵大小、封在蜡壳里的通窍八窍“阴毒煞囊”！\n\n算上先前买火珠剩下的六枚，他手头完整下品灵石一举暴涨至三十七枚！\n\n陈长庚从苗五指药囊里倒出半瓶化尸黑水浇在两具尸首上，又弹出一撮残余赤磷火将其连皮带骨烧成焦渣，绑上两块吸铁石狠狠踩进黑芦沟丈许深的腐泥潭底，顺手扶正折断的枯苇抹去一切脚印。\n\n刚拍净手掌准备回山，他忽然发觉指尖从苗五指贴胸夹层最后摸出的一块巴掌大惨白兽骨，触感有些不对劲。\n\n陈长庚低头摊开掌心。\n\n只见那是一枚刻着狰狞鬼首暗纹的“玄煞门传讯骨牌”！\n\n就在这一瞬，原本冰凉死寂的惨白骨牌毫无征兆地剧烈滚烫起来，鬼首眼眶骤然亮起两团急促闪烁的妖异血红微光，笔直指向三里外的大泽黑水芦苇深处——\n\n那片死寂黑水荡里，竟潜伏着整整一支正在等内线口令摸上山的玄煞门精锐死士队！"}, {"n": 49, "title": "借钟拔钉", "body": "掌心那枚玄煞门传讯骨牌烫得像块刚出炉的烙铁，鬼首双目每闪一下红光，便有一缕微弱阴煞波纹朝三里外的大泽黑水荡回荡。\n\n陈长庚站在黑芦沟外侧背风山梁上，五指一合，用高阶敛息玉符边缘暂时压住骨牌外泄的红芒，脑海里瞬间拨清了两笔死活账。\n\n“苗五指根本不是普通黑市毒贩，他是敌宗玄煞门安插在乱石集的八窍外围接应桩！”\n\n“三里外水寨里藏着的玄煞门死士正在等他回传后山岗哨口令，最多半个时辰没回音，那帮死士要么强攻摸进后山废渣谷，要么换路潜伏，到时候整座外门都得血流成河！”\n\n可要拿着这块骨牌连夜跑去外门刑律堂报信请赏？\n\n陈长庚嘴角浮起一丝讥诮冷笑。\n\n一个白日还在纳贡院吐黑铅血装死的丙字房三窍杂役，子夜三更从山外黑芦沟捡回一块通窍八窍毒修贴身藏着的传讯骨牌？\n\n不等宗门发下十枚赏石，刑律堂的大刑铁烙就得先按在他胸口，逼问他是怎么弄死苗五指、半夜下山干了什么见不得光的勾当！\n\n“检举头功谁爱要谁拿去，但这把灭门大刀……正好替我把外门最后一颗毒钉连根拔了！”\n\n陈长庚眼底寒光一闪，目光遥遥投向二里外半山腰那座亮着风灯的青石箭楼——外门西岗巡山哨塔！\n\n按外门轮值旬历，今夜子丑交接镇守西岗哨塔的巡山执事，正是对他恨之入骨的宿敌卢耀！\n\n陈长庚毫不耽搁，贴胸催动天阵宗高阶敛息玉符，整个人气息与山林夜雾融为一体，脚踏盲井轻身步贴着崖壁阴影疾驰，不过半盏茶工夫便悄无声息摸到了西岗哨塔三丈外的古松树冠上。\n\n哨塔二层值守廊内正燃着一盆旺炭火，浓烈刺鼻的烧刀子酒气顺着木窗缝直往外飘。\n\n两名值夜皂役早已裹着羊皮袄缩在墙角呼呼大睡。\n\n左臂还缠着旧伤绷带的卢耀大马金刀歪在虎皮交椅里，手里拎着一只朱漆大酒葫芦猛灌了一大口，醉眼惺忪地拍着扶手骂娘：\n\n“妈了个巴子的！演武坪罚老子三个月俸石，窦文焕那狗娘养的害死老子表弟还不肯吐灵石赔命，全宗上下都拿老子当软柿子捏！”\n\n他重重打了个酒嗝，随手把喝剩半壶的朱漆酒葫芦挂在靠窗木栏的腰带扣上，咬牙切齿地嘟囔道：\n\n“还有丙字房陈长庚那个吐黑血的小畜生……等后天大军拔营下大泽，老子非在船底给他绑块铁砣沉江不可……呼……”\n\n骂声未落，卢耀脑袋一歪，鼾声如雷地靠在椅背上睡死了过去。\n\n古松阴影里，陈长庚眼神冷寂如冰。\n\n“还惦记着沉我的船？那就先去刑律堂死牢里醒醒酒。”\n\n他屈指在腰间药瓮口轻轻一叩。\n\n两只背甲泛着暗金冷光的二蜕嗜铁煞甲虫悄无声息展翅飞出，没有发出半丝振翅虫鸣，顺着哨塔外墙青苔飞快爬上了三丈高的塔顶飞檐！\n\n塔顶横梁下，悬着一口重达千斤的“山门急警铜钟”，一根拇指粗的百炼精铜拉索直垂二楼值守廊。\n\n陈长庚凝神催动神血母印，精细到极点地控制着两只二蜕凶虫口器。\n\n“沙……沙……”\n\n两只煞甲虫伏在铜索阴影死角，锋利口器避开表层两根外皮铜丝，将里头九成承重精铜内芯一寸寸无声啃断！\n\n整根警戒铜索看似还挂在钟锤上，实则只剩两根头发丝粗的铜皮勉强吊着，风稍微大点都能崩断！\n\n召回两只凶虫收妥，陈长庚身形如一片没有重量的枯叶滑落哨塔后窗根下。\n\n隔着半尺窗缝，卢耀如雷的鼾声近在咫尺。\n\n陈长庚屏住呼吸，探出两根修长微乌的手指，指尖百锻巧劲轻轻一捻，便将那只悬在窗栏边的朱漆酒葫芦底座圈足蜡封暗扣无声挑开一线！\n\n这种巡山油条随身带的酒葫芦底座都有藏私钱的干爽夹层。\n\n陈长庚手腕一翻，将掌心那枚正越发滚烫泛红的“玄煞门传讯骨牌”严丝合缝塞进酒葫芦底座夹层深处，再将原蜡封口一抹按死，连半个指印都没留下！\n\n做完这一切，他没有惊动塔内一个人，脚尖一点山石，借着浓重夜色一口气退出半里开外，稳稳立在西侧背风山脊一块巨岩之上。\n\n从储物袋底层摸出一张冬至雪夜缴获的无记号铁胎牛角猎弓，搭上一支削去尾羽印记的制式铁簇秃箭。\n\n陈长庚双足扎稳马步，双臂稳稳控住通窍八窍暗金巧劲，将这张硬实铁胎猎弓拉成一轮饱满惊弦满月，森寒箭尖遥遥锁死七八十丈外西岗哨塔顶端的千斤警世铜钟！\n\n“卢执事，这桩通敌大案，你背稳了。”\n\n五指骤松！\n\n“崩——！！”\n\n铁簇秃箭化作一道撕裂夜幕的乌黑流星，跨越七八十丈山涧夜空，不偏不倚重重撞在西岗哨塔千斤铜钟正心！\n\n“当——！！！！”\n\n一声凄厉雄浑到极点的急警钟鸣骤然在寂静群山间轰然炸响，声震二十里！\n\n与此同时，塔顶那根早已被煞甲虫蛀空九成内芯的精铜警戒拉索受此巨震，“啪”地崩断砸落二楼地板，那支无标秃箭也弹落进百丈深涧乱石堆里无影无踪！\n\n“什么人撞钟？！”\n\n二楼交椅上的卢耀吓得一个激灵滚翻在地，酒意还没醒透，山门内峰方向已轰然冲起三道恐怖绝伦的青虹遁光！\n\n大泽南麓水面之上，三艘横锁内圈的云泽宗玄铁巨舰几乎在同一息拉响战鼓，数十门灵炮赤光暴涨，顺着半山腰刚刚被引动的传讯骨牌共鸣方位，如天罗地网般直扑三里外的黑芦沟芦苇水寨！\n\n“轰隆隆——！！杀！！玄煞门狗贼藏在黑芦沟苇荡里，一个不留！！”\n\n震天动地的灵炮轰鸣与凄厉喊杀声瞬间点燃了山脚黑水荡，火光映红了半边夜空！\n\n而就在西岗哨塔前坪上，“轰”的一声重响，一名须发皆白、周身环绕着骇人周天仙脉罡气的内门开脉境督查长老铁青着脸凌空落下，身后紧跟着二十名杀气腾腾的内门黑甲执法卫！\n\n“长、长老息怒！属下不知哪个天杀的敲了虚警——”卢耀连滚带爬跑下哨塔跪倒请罪。\n\n“虚警？！”\n\n白发督查长老怒极反笑，一脚踢过地上那截断口齐整如锯的警戒铜索，恐怖开脉境神念如狂涛般扫过全场，目光猛然钉死在卢耀腰间那只正在微微发烫泛红的朱漆酒葫芦上！\n\n“咔嚓！”\n\n督查长老隔空一抓吸过酒葫芦，五指罡气震碎木底，那枚正与黑芦沟玄煞门死士气机共鸣、闪烁着刺目血光的鬼首传讯骨牌“啪嗒”掉在卢耀鼻尖前！\n\n全场二十名执法卫齐齐倒吸一口凉气，百炼长戟瞬间架满卢耀脖子！\n\n“玄、玄煞门传讯骨牌？！怎会在属下酒葫芦里？！”\n\n卢耀眼珠子都快瞪出眼眶，吓得魂飞天外，疯了一样磕头嘶喊：“冤枉啊长老！定是有人栽赃害我！属下对宗门忠心耿耿啊——”\n\n“忠心耿耿？！”\n\n督查长老须发怒张，声音冷得像九幽寒冰：“你上月在演武坪栽赃同门被罚俸三月，前几日又为私矿分赃大闹丹堂欠下一屁股赌债！今夜轮你守西岗，塔顶警索被人齐根锯断，怀里揣着给三里外玄煞门死士引路的母子骨牌——不是你收了敌宗重贿充当内鬼，难道是鬼塞进你贴身酒壶里的？！”\n\n在战时铁证与严丝合缝的贪财前科面前，任何辩解都是找死！\n\n“不、不是我……啊——！！！”\n\n
