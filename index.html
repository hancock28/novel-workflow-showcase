缺口，好歹十息猛攻之下护手绝不会崩脱。”\\n\\n公孙妙将惊蛰剑抛还给他，眼珠子滴溜溜一转，又从背后摸出一面巴掌大小、也不知拿什么废铜烂铁与碎镜片拼凑而成的八角阵盘，不由分说便往晏怀瑾腰间乾坤袋里硬塞：\\n\\n“还有这个！师姐呕心沥血改出来的古禁制奇宝‘照胆真言镜阵盘’！荒州地界多上古废墟禁地，万一撞上封灵绝境或是护体灵光太厚的硬茬子，你只管把这镜盘往残阵阵眼上一拍，保准叫那帮仗势欺人的狗东西道心崩裂、跪地求饶！”\\n\\n晏怀瑾低头看着那面边缘还焊着两块破铜钱的古怪镜盘，太了解自家三师姐的路数。前年守藏阁清查内鬼，公孙妙送来一口审讯铜钟，人是招供了，在场三个执事也被钟声震得当众学了半个时辰山鸡打鸣。\\n\\n他按住乾坤袋口，冷静追问：“激发此阵，入阵者需付出何种代价？”\\n\\n“咳！能有什么代价，无非是顺应上古阵灵规矩说两句场面吉祥话罢了！”公孙妙眼神骤然往天上乱飘，脚底板已经开始往守藏阁院门倒退，“哎呀坏了坏了，我后院炉子上还炖着半锅寒星铁汁，再晚一步连房顶都要掀了！小师弟一路顺风，那镜盘不到绝境别乱掏啊，记住啦！”\\n\\n话没说完，红影一溜烟钻回滚滚浓烟里，哐当一声从里头栓死了院门。\\n\\n晏怀瑾看着紧闭的守藏阁大门，额角极轻地跳了一下。能让公孙妙心虚逃跑的“吉祥话”，绝对不是什么体面玩意儿。他默不作声将那面照胆真言镜阵盘压进乾坤袋最底层，心底暗下批注：非十死无生之局，此物严禁启封。\\n\\n核清袋中五十块中品灵石、苍梧残剑令、药奴身契与核矿公文无误，晏怀瑾收回心神，侧眸看了一眼静立风中的越流萤。\\n\\n“跟紧。出了护山云海便是荒州官道，掉队三丈之外，按逃奴论处。”\\n\\n“是，罪女省得。”越流萤轻声应下，手中竹杖点地，不疾不徐跟在他身侧三尺之内。\\n\\n……\\n\\n苍梧山与荒州仅隔着一道百里断魂岭。踏出截天剑宗温润清冽的护山云海，天地间的灵气顿时变得驳杂燥烈起来，连刮面而来的风里都夹着赤砂戈壁特有的粗粝沙砾。\\n\\n为赶在十日期限内摸清坠龙墟虚实，晏怀瑾雇了一辆不起眼的青篷快马车沿官道疾行。一整日下来，车厢内安静得近乎古板——晏怀瑾盘膝闭目养蓄剑气，越流萤便抱膝坐在车辕角落，既不多嘴打听去向，也不喊半声颠簸劳累，安分得像一尊没有脾气的瓷人。\\n\\n直至酉时末，残阳如血沉入荒原尽头，昏黄暮色四合。\\n\\n马车驶抵两界交接处的樟树古驿。这是一座前不着村后不着店的孤僻石砌驿馆，院前立着一棵枯死大半的百年老樟树，枯枝上挂着两盏惨白纸灯笼，在晚风里摇摇晃晃。驿馆里头静悄悄的，只有个驼背老驿卒坐在柜台后打瞌睡，连半个过路脚夫都看不见。\\n\\n晏怀瑾付了两块碎下品灵石要下后院两间相邻净房，正欲提桶去庭院古井边打水洗去风尘，身后一直乖巧跟行的越流萤脚步忽然一顿。\\n\\n一只微凉纤细的手穿过暮色，极轻却极稳地拽住了晏怀瑾玄色皂衣的后摆。\\n\\n晏怀瑾豁然停步，右手无声搭上惊蛰剑格，压低声音：“怎么？”\\n\\n越流萤覆着白纱的脸庞微仰，秀挺鼻翼在潮湿阴冷的晚风里轻轻动了动。自封双目之后，她一身古巫灵觉尽数收束于耳鼻气血之间，对药毒煞气的分辨力比寻常金丹修士还要敏锐数倍。\\n\\n她借着整理衣袖的动作遮住唇形，用仅有两人能听见的极轻气音低语道：\\n\\n“大人，井水别碰。院子西角那口古井底下……飘着一股死人骨头混着蛇涎泡烂的腥甜味，是南荒死士布阵前专门用来锁人气血的‘腐骨引煞散’。”"}, {"n": 6, "title": "十息截脉，煞火攻心", "body": "腐骨引煞散五个字入耳，晏怀瑾搭在剑格上的手指没有半分多余动作，神色依旧如常地拎起井台边的空木桶，随手往石栏上一放，仿佛只是嫌井水浑浊懒得再打。\n\n“山野古驿水质苦涩，今夜不烧茶了，回房歇息。”\n\n他淡淡丢下一句给暗处耳目听的场面话，领着越流萤径直迈入后院东侧净房。房门合拢的刹那，晏怀瑾指尖剑气微吐，无声无息封住窗纸缝隙，目光冷峻地打量了一眼屋内陈设——桌上的粗瓷茶壶、床角的熏香铜炉干干净净，下毒之人显然极懂行规，怕高阶修士入房警觉，只将药引下在了必经的古井水源与院墙地脉里。\n\n“不是卢铮那批缇骑的手笔。”晏怀瑾立于窗侧阴影中，声音压得极低，“钦天监办差讲究官印锁灵，不屑用这种阴损尸毒。冲你来的？”\n\n越流萤站在桌旁，双手攥着粗麻衣角，白纱覆面的神情显得既惶恐又温顺：“罪女……罪女也不知。许是早年部族仇家流落荒州的死士，嗅着气味寻来了。”\n\n嘴上说着不知，她搭在右腕药奴红绳上的指尖却微微发冷。腐骨引煞散乃南荒叛巫乌骨部独门秘药，荒州乃是大乾钦天监铁桶经营的地盘，乌骨部的死士能精准堵在苍梧山下山的必经古驿，若无钦天监外围线人暗中指路放行，绝不可能如此巧合。\n\n晏怀瑾深深看了她一眼，没有当场戳穿她话里的保留。不管外头蹲着的是哪路鬼魅，既然敢把阵旗插到他镇契堂主事落脚的院子，先拿下活口审清底细便是。\n\n两人滴水未沾，各自在房中屏息静待。\n\n转眼入夜，子时初刻。\n\n樟树古驿外原本呼啸的荒原夜风诡异地停了。前院老樟树上的两盏白纸灯笼噗嗤一声同时熄灭，浓稠如墨的灰黑寒雾自四面院墙根下疯狂涌出，眨眼间便化作一只倒扣的毒碗，将整座后院严密笼罩在其中！\n\n嗤——嗤——\n\n地面青砖缝隙里渗出腥臭刺鼻的暗绿水汽，院井方向更是冲起一道尺许粗的阴煞黑柱。三道裹着漆黑骨纹斗篷的鬼魅身影自浓雾三角同时现身，手中各摇一串惨白指骨铃，森冷嘶哑的低喝在雾中交错回荡：\n\n“蚀影引煞阵已成！院中气血已锁，那瞎眼余孽果然藏在东房——速速破门抽她心头巫血验脉，莫教旁人抢了头功！”\n\n三人皆是实打实的古巫通幽境好手，联手结阵之下，阴毒煞气如百鬼哭嚎般直扑东侧净房！\n\n就在那股蚀影阴煞穿透房门的瞬息，屋内一直极力收敛气息的越流萤浑身猛地一颤！\n\n她体内深处仿佛有一头沉睡已久的凶戾火兽被同源邪煞狠狠刺醒，一股霸道酷烈到极点的紫黑巫煞不受控制地撞向四肢百骸！几乎在同一刹那，两人腕间无形的同命血蛊契骤然绷紧，狂暴灼痛顺着契机倒灌而入，刺得晏怀瑾丹田金丹上的三道折剑裂痕铮然悲鸣！\n\n不能拖！邪阵每多运转一息，越流萤体内的隐患便暴躁一分！\n\n砰！\n\n净房木门轰然炸成漫天碎屑！\n\n一道玄色身影逆着滚滚毒雾电射而出，晏怀瑾面沉如水，在跨出房槛的刹那已将金丹后期灵力催至巅峰，心底冷酷如铁地叩响第一声计时——\n\n一息！\n\n呛啷一声龙吟，加固过紫金焊液的残剑惊蛰悍然出鞘！凛冽剑光照亮满院黑雾，正面扑来的黑巫首领狞笑一声，挥动骨杖卷起三丈毒蟒迎头砸落：“区区落魄剑修，中了腐骨引煞散还敢逞凶——”\n\n话音未完，他瞳孔骤然缩成针尖！\n\n面前的青年剑修气息澄澈锋锐得可怕，哪里有一丝饮水受毒的滞涩？\n\n两息！三息！\n\n晏怀瑾身形在半空折出一道险峻折线，擦着毒蟒獠牙掠过，镇契堂审卷断痕练就的毒辣眼力在电光石火间扫过全院——东南井口、正北枯桩、西南墙角，三缕缠绕在指骨铃与地脉之间的暗红煞线纤毫毕现！\n\n“装神弄鬼。”\n\n四息！\n\n惊蛰剑化作一线凄寒白电，不劈敌首头颅，而是精准绝伦地施出截天剑宗独门绝学“截脉三式”第一式——截流！\n\n噗嗤！剑尖斜挑东南方那名高瘦黑巫的右腕尺泽穴，紫金加固的剑格重重撞碎其手中指骨铃，霸道剑气顺经脉长驱直入，当场震断他半边行功枢机！\n\n“老三！”其余两名黑巫骇然变色，做梦也没想到此人三息之内便看穿了南荒秘阵的气机死结，急忙咬破舌尖喷出精血，催动漫天骨影合围绞杀！\n\n五息！六息！七息！\n\n丹田内折剑裂痕传来的刮骨寒痛节节攀升，晏怀瑾连眼角都没眨一下，旋身踏碎地面阵石，惊蛰剑一气呵成连走两道截然相反的诡奇弧线——破枢！断岳！\n\n两道寒芒先后点穿西南黑巫的肩井气海与为首黑巫胸前的护心骨牌！没有半招花哨缠斗，全是冲着人体行气最脆弱的节点下死手。伴随着两声凄厉惨嚎，护院毒雾失去阵眼支撑轰然溃散，三名通幽境黑巫死士齐刷刷捂着寸断的经脉栽倒在泥水里，连咬碎毒囊自尽的力气都被截脉剑气封得干干净净！\n\n八息！九息！\n\n晏怀瑾足尖落地，赶在第十息红线到来的前半拍，手腕沉稳一翻——\n\n咔哒。\n\n第九息半，惊蛰剑分毫不差归入剑鞘！\n\n强行收束巅峰剑意震得他周身经脉微微发凛，喉间掠过一丝极淡腥气，但好在严丝合缝卡住了十息大忌，既未扩张金丹裂痕折损十日阳寿，握剑的右手也依旧稳如磐石。\n\n院中寒雾散尽，只余三名黑巫在地上痛苦抽搐。晏怀瑾缓出一口浊气，正欲迈步上前搜身提审这群来路蹊跷的南荒死士，手腕脉门处的同命感应却毫无征兆地滚烫如火炭！\n\n“大人……”\n\n身后净房廊柱下传来一声压抑至极的痛苦低喘。\n\n晏怀瑾猛然转身，只见原本扶墙立在廊下的越流萤已双膝一软蜷缩在青石阶上，她紧咬着下唇，缠着药奴红绳的雪白右腕上竟浮现出一道道妖异扭曲的紫黑巫纹，正顺着血管疯狂往心口蔓延！\n\n未等晏怀瑾俯身扣脉，少女单薄的身躯剧烈一颤，一口滚烫如岩浆的暗红心血猛地喷出，尽数溅在了他刚归鞘的惊蛰剑鞘之上！"}, {"n": 7, "title": "百日煞限，欠契锁人", "body": "滚烫的心血溅上乌木剑鞘，发出嗤的一声轻响，连鞘口凝结的夜露都被瞬间蒸成了淡红白雾。\n\n几乎在越流萤呕血栽倒的同一刹那，晏怀瑾手腕脉门猛地一抽，一股霸道酷烈的紫黑火毒顺着无形的同命血蛊契狂涌过来，撞得他丹田金丹上那三道折剑裂痕铮铮直颤！\n\n晏怀瑾脸色微沉，半步抢上前去，左手一把扣住越流萤烫如烙铁的右腕，指腹连点内关、神门、太渊三处大穴。精纯凛冽的金丹后期剑气化作三缕细密寒针，不由分说贯入她紊乱暴走的腕脉，硬生生将那股直冲心脉的紫黑巫纹截停在寸许之外！\n\n“别乱动气机，顺着剑意吐纳。”\n\n他嗓音冷肃短促，半跪在廊下青石阶前，顾不得自身刚催完九息半剑招后隐隐发麻的右臂经脉，源源不断渡入清冽剑元替她弹压反扑的煞火。\n\n越流萤半边身子倚在廊柱阴影里，覆着白纱的脸庞白得近乎透明，冷汗顺着鬓角滑落，打湿了粗麻领口。直至腕间翻腾的紫黑纹路一寸寸缩回红绳底下，她才剧烈喘息了一声，哑着嗓子低声道：“多谢……司律大人。”\n\n晏怀瑾探指搭了搭她渐趋平稳却依旧虚浮滚烫的脉象，确认一时半刻烧不穿心脉，这才松开手站起身来。\n\n庭院泥水里，那三名被“截脉三式”废去行功枢机的黑巫死士正痛苦抽搐。为首的黑巫眼见越流萤腕间退去的紫黑巫纹，浑浊眼珠里非但没有畏惧，反倒迸出一丝狂热狠戾：“紫煞锁腕，封目藏灵……果然是当年漏网的九黎……”\n\n啪！\n\n晏怀瑾根本不给他把话说完惊动四野的机会，惊蛰剑连鞘重重往他肩头琵琶骨上一顿，冷冽剑气顺势封死他咽喉半寸声息，顺手用剑尖挑开此人怀中贴身皮囊。\n\n一只刻着荒州巡狩司暗记的赤铜传讯哨，连同半张绘着苍梧山官道驿站分布的引路草图滚落出来。\n\n果然与钦天监荒州外围线人穿了一条裤子。\n\n“谁派你们来的，冲着她身上什么东西？”晏怀瑾剑鞘微压，抵住黑巫首领眉心死穴，“说实话，给你个痛快；敢吐半个假字，镇契堂有十八种截脉手法叫你求生不得。”\n\n黑巫首领满口黑血，怨毒地盯着廊下的越流萤，喉间挤出破碎嘶笑：“剑宗司律……你以为自己护着的是什么善茬？她是南荒九黎古巫一脉遗落人间的少司命！十年前钦天监与我乌骨部大巫联手踏平九黎祖寨，这小贱人自封双目掩住天机，才逃过《奉天承运金册》万里搜魂……咳咳！没用的，她强封本源压制‘九黎煞脉’早已到了油尽灯枯的关头，方才受我蚀影阵阴煞一激，煞锁已裂，满打满算活不过百日！到时候煞脉焚身，方圆十丈连你的金丹都要一并炸成飞灰！”\n\n九黎少司命？百日焚脉？\n\n晏怀瑾眸光微凝，并未全信死士临死前的攀咬之词。他心念一动，直接引动识海深处那卷《春秋勘误录》。\n\n底部凹槽内悬着的两滴勘误墨气轻轻一晃，其中一滴骤然化开，顺着青铜竹简上的斑驳纹路飞速游走，转瞬间凝成数行铁画银钩的史官红批，只余最后一滴墨珠静静悬在槽底：\n\n【勘误核验：越流萤确系南荒九黎少司命，怀原初巫脉。其体内九黎煞脉锁期仅余九十九日，逾期必焚脉爆体，顺同命血蛊契引爆宿主折剑金丹，十死无生。】\n【破局主材：荒州坠龙墟地底将出世千年“地肺阴火髓”，既可替越流萤洗练煞锁续命，亦可融火重淬惊蛰剑残锋、暂稳金丹裂痕。】\n\n一行批注看罢，晏怀瑾心底彻底有了准数。\n\n难怪钦天监校尉卢铮前夜刚在镇契堂吃了瘪，转头就甩出十日内赴坠龙墟核查废矿死契的公文，外围线人还暗中把乌骨部死士引到樟树古驿试探虚实——两拨豺狼分明都在打坠龙墟和九黎遗脉的主意。\n\n指尖剑气一吐，干脆利落震碎三名黑巫死士的心脉，免去留活口走漏风声的隐患。晏怀瑾用黑巫斗篷裹起那枚赤铜传讯哨留作日后反咬钦天监的铁证，随手弹出一点火星化去院中尸迹与血污，这才转身走回廊下。\n\n越流萤依旧曲膝坐在冰冷的石阶上，双手抱臂，头垂得很低。\n\n听到脚步声停在跟前，她覆着白纱的眼睫轻轻颤了颤，没有再搬出那套荒州流民的假话，嗓音轻得像随时会散在夜风里：“大人都听见了。罪女身上背着九黎血债，体内煞脉只剩九十九天……是个彻头彻尾的祸害。”\n\n她摸索着从怀里取出一小片刻满古巫咒文的残破兽皮，双手捧过头顶：“这是南荒残卷里记载的偏门泄契法。大人回苍梧山请代掌教真人护法，趁罪女煞脉尚未彻底炸开，用重剑强斩血契，虽会伤及大人数成神魂，总好过九十九日后被罪女拖着金丹俱碎……大人趁早弃了罪女罢。”\n\n廊下夜风凛冽，吹得少女宽大的粗麻罪衣空荡荡贴在瘦削肩头。之前在镇契堂百般算计求留的是她，如今底牌被掀开、怕九黎死劫真拖死他而劝他斩契弃车的，也是她。\n\n晏怀瑾静静看了她两息，既没去接那片兽皮，也没提半句斩契的事。\n\n他径直俯身拎起越流萤的后领，将人带回东侧净房摁在桌边坐下，随后从乾坤袋里摸出一张空白镇契堂黄麻欠纸，提笔蘸墨，面无表情地刷刷写下数行字迹。\n\n“手伸出来。”\n\n越流萤微怔，迟疑着探出右手。\n\n晏怀瑾扣住她指尖尚沾着一点未干心血的大拇指，稳稳往黄麻纸末尾重重一摁，留下一枚清晰的暗红指印，随即吹干墨迹折好入怀。\n\n“按大荒坊市行价，千年地肺阴火髓一株作价一千五百块中品灵石。”晏怀瑾居高临下看着她，语调平直得像在核对一笔再寻常不过的宗门烂账，“本座每月俸禄三十中品灵石，截天剑宗从不做赔本买卖。自今日起，替你压煞寻药的一千五百中品灵石全数记在镇契堂试剑药奴越流萤名下——债没还清之前，你的命是本堂抵押物，少活一日都算赖账，一文钱也别想逃掉。”\n\n越流萤僵在桌边，指腹还残留着他扣按时的微凉温度，半晌说不出一个字来。七成神魂撕裂的凶险，被他轻描淡写压成了一张一千五百灵石的欠条。\n\n话音刚落，净房窗纸忽然微微震颤起来！\n\n轰隆隆——！\n\n沉闷如雷的铁蹄轰鸣声骤然从二里外的荒州主官道尽头滚滚压来，其间夹杂着钦天监开道铜锣的刺耳鸣响与军士厉喝：“荒州巡狩司车驾过境赴坠龙墟封山！闲杂车马一律退避十里，违者格杀勿论！”\n\n晏怀瑾豁然吹熄桌上残灯，按住惊蛰剑柄走到窗缝前冷眼望去——黑沉沉的官道尽头，一排排赤金龙纹火把正撕裂夜幕疾驰而来。"}, {"n": 8, "title": "罚抄戒律，朱砂作聘", "body": "主官道上的赤金火把足足绵延了三里地，裹着破禁铜铁的妖马铁蹄踏得荒原碎石乱跳，直到寅时将尽才彻底绝尘远去。\n\n晏怀瑾没有去触钦天监巡狩大队霉头的打算。天还没亮透，他便退掉租来的青篷马车，换上两身不起眼的灰布斗篷，另从驿卒手里买下一辆轻便耐颠的青骡山车，赶在第一缕晨光落上樟树梢前，载着越流萤拐进了通往坠龙墟西侧的偏僻山林栈道。\n\n山道崎岖难行，两侧尽是遮天蔽日的苍黑古木与乱石涧谷，好处是彻底避开了钦天监沿途设立的关卡耳目。\n\n白日赶路倒还罢了，一入夜色，九黎煞脉残留的隐患便准时发作起来。\n\n樟树古驿那一战虽由晏怀瑾用金丹剑气强行封住了腕间三处煞穴，可被邪阵勾醒的巫脉心火就如闷在灰堆底下的炭块，每逢子午阴气交替之际便顺着血脉往上翻涌。\n\n入山次日戌时，离下山已过了整整三天。山风渐紧，晏怀瑾寻了一处背风的断崖石坳停骡宿营。\n\n篝火刚点起没多久，坐在车辕旁抱膝歇息的越流萤呼吸便渐渐急促滚烫起来。少女双颊泛起一层不正常的潮红，额角细汗涔涔，双手无意识地攥紧了身下的粗麻衣摆。\n\n晏怀瑾正在丈许外的青石上盘膝擦拭惊蛰剑身，敏锐地听见身后传来竹杖轻叩碎石的细响。\n\n越流萤似乎被体内燥热烧得有些辨不清方向，摸索着往前挪了两步，借着添柴烤火的由头，一点点挨到了青石边缘。金丹后期剑修周身自然流转着一层凛冽清寒的护体剑意，她刚凑近三尺之内，紧蹙的眉心便肉眼可见地舒展开一分，连带着半边肩膀都悄悄往晏怀瑾袖口垂落的阴影里靠了过去，贪恋那点压制心火的凉气。\n\n“站住。”\n\n擦剑的细布骤然停在缺了一角的剑尖上。晏怀瑾头也没抬，声音冷得像山涧冰泉：“离剑锋两尺，不要命了？”\n\n越流萤身形一顿，忙规规矩矩缩回半步，指尖却还轻轻虚拢在剑气余寒能扫到的边角，低声告罪：“罪女该死……一入夜里经脉便像架在火上烤，实在辨不清远近，冲撞了大人清修。”\n\n晏怀瑾收剑归鞘，侧眸看了一眼她烧得发红的耳廓与微微发颤的指尖，眉头蹙起一道浅痕。\n\n南荒古巫不修金丹，最忌心神浮躁引动煞火焚心；眼下离坠龙墟赤砂镇尚有半日脚程，九黎煞脉锁期还剩九十八日，若放任她每晚这般心火燎原，还没见到地肺阴火髓的影子，人先要走火入魔。\n\n“坐过去，不许乱动。”\n\n晏怀瑾冷声吩咐一句，转身从行囊底层取出一只巴掌大的黑铁药铫，引山泉洗净，毫不心疼地摸出两片压制自身折剑寒毒备用的苦心寒莲叶，混着三钱清魂草一并丢进滚水里慢火煎熬。\n\n不过半刻钟，一股苦涩到令人头皮发麻的草药浓香便弥漫了整座石坳。\n\n隔着素白眼纱，越流萤都清晰闻见了那股能把舌根苦麻三天的恐怖药味，下意识往车轮后头缩了半寸：“大人……罪女喝点山泉水压一压便好，寒莲叶金贵，不敢折损大人的备药……”\n\n“一千五百中品灵石的大头都记了，不差这两片叶子。”晏怀瑾用木箸夹开滚烫药盖，倒出一碗墨绿浓稠的寒莲镇魂汤，稳稳递到她面前，“喝干净。剩下一滴，明日加倍。”\n\n越流萤逃无可逃，只得双手接过粗陶碗，屏住呼吸仰头灌了下去。极寒苦药入喉，犹如吞下一团夹着冰碴的黄连汁，呛得她眼尾瞬间泛红，白纱下的唇瓣紧抿成线，好半晌才把那阵反胃的苦意压下去。\n\n好在一碗苦汤落腹，胸口翻腾的燥火果真消退了七八分。她刚松一口气，却见晏怀瑾并没收摊，反而从乾坤袋里取出一卷空白竹纸、一方朱砂砚台与一支狼毫笔，端端正正摆在了马车踏板上。\n\n“汤药治标不治本，古巫煞气最易惑乱心志。”\n\n晏怀瑾撩袍坐直，右手执起饱蘸鲜红朱砂的狼毫笔，公事公办地开口：“按镇契堂罪徒训诫章程，心浮气躁者当罚抄《清心寡欲戒律百篇》三遍。念在你双目不便执笔，本座准你逐句背诵，由本座代录立卷归档——第一条，念。”\n\n越流萤捧着空药碗愣在原地。\n\n她设想过这位铁面司律百般严防试探的手段，唯独没料到他会在荒郊野岭搬出笔墨纸砚，一板一眼盯着她背清心戒律。\n\n“怎么，镇契堂晨钟诵过的戒条，才下山三日便忘了？”晏怀瑾笔尖微顿，抬眸冷冷扫来。\n\n“罪女不敢。”越流萤忙敛衽垂首，压下唇角一丝险些溢出的古怪笑意，乖乖顺着他提示的戒辞轻声诵读起来，“凡修道守心者，一戒贪嗔妄动，二戒私欲障目，三戒妄结外缘……”\n\n山林夜色深沉，篝火噼啪轻响。\n\n少女清软温顺的嗓音在寂静石坳里一句句回荡，晏怀瑾面色端肃，手腕悬空稳如磐石，每听完一句便在竹纸上落下一行铁画银钩的朱砂小楷。朱砂本就蕴含纯阳辟邪之力，再融进他指尖一缕澄澈剑意，整张纸页隐隐透出一股清心定神的凛然正气。\n\n足足半个时辰，百句清心戒律一字不差录完。\n\n晏怀瑾审视一遍确认无误，在卷尾空白处略作停顿，挥毫添上两行锋芒毕露的批语，随后解下腰间那枚代表其本命剑修名讳的玄铁私印，重重摁在两人名字交界之处，随手将竹卷递还过去：\n\n“收好。每日早晚摸着印痕温习一遍。上头写了本座批语——‘晏怀瑾亲勘：命契相连，朝夕监管，未得本座钧旨不得擅离半步。’若有违犯，两罪并罚。”\n\n越流萤双手接过那卷尚带着剑气余温的竹纸，指腹下意识抚过卷尾湿润微凸的朱砂字痕与那方四四方方的私印。\n\n“命契相连，朝夕监管……”\n\n当她借着古巫对朱砂气机的感应“摸”清那两行字与交叠名讳的刹那，整个人犹如被烫了一下，纤细指尖猛地一颤，原本刚被寒莲汤压下去的热意轰然直冲双耳，连雪白颈侧都染上了一层薄薄的绯色！\n\n在南荒九黎古巫传承千年的礼俗里，唯有立誓生死相守的夫妻，才会以辟邪朱砂将男女双方真名并书一纸，写下“命契相连、寸步不离”的锁名誓词，再加盖贴身私印交予女方收执——那不叫什么监管训诫档案，那分明是九黎巫神见证下、至死不可悔改的定情婚书！\n\n越流萤心脏在胸腔里重重跳了两下。她悄悄抬起覆着白纱的脸，只见对面的青年司律正一丝不苟地收拢砚台笔墨，神情冷肃坦荡得不能再坦荡，脑子里显然全然不知南荒巫俗，真拿这页纸当防备药奴逃跑的公文铁券。\n\n“还愣着做什么，上车歇息。歇足半个时辰，子初拔营连夜赶路。”晏怀瑾收拾停当，冷淡催促了一句。\n\n“……是，罪女谢大人赐卷训诫。”越流萤深深低下头掩住滚烫耳根，声音软得发颤，捧着那卷竹纸快步钻进了山车车厢。\n\n夜半子正，青骡山车沿着平缓林道稳稳前行。\n\n晏怀瑾盘膝坐在前辕内侧闭目调息，平稳绵长的呼吸在狭小车厢里清晰可闻。而在他对面角落的阴影中，本该眼盲熟睡的越流萤悄无声息掀开一角车帘，借着林间漏下的一缕清冷月光，指尖一遍又一遍轻抚过纸页末尾“晏怀瑾”三个朱砂大字，唇角无声弯起一抹极深、极执拗的弧度，将其仔细折成一枚南荒古巫特有的同心方胜，严严实实塞进了贴身心口衣襟里。"}, {"n": 9, "title": "金册锁血，墨竭竹封", "body": "第四日正午，山林尽头豁然开朗，一股混杂着硫磺焦臭与赤红沙尘的热浪扑面卷来。\n\n坠龙墟门户——赤砂镇到了。\n\n此地原是三百年前大荒地火龙脉崩裂留下的千丈巨谷，外围赤砂旧矿本归截天剑宗早年开辟，后来灵气枯竭荒废了数十年，平日里只有些刀口舔血的低阶散修进谷淘换火铜碎石。\n\n可今日晏怀瑾将青骡山车拴在镇外枯林，压低灰麻斗笠，领着同样戴着幂蓠遮掩白纱的越流萤步入镇街时，入目却是一派铁桶合围的森严杀局！\n\n通往坠龙墟矿口的百丈黄土坡已被成排的拒马玄铁栅死死封住。数十名身披玄甲的钦天监精锐缇骑持戟列阵，一面绣着九天紫微星纹与赤金蟠龙的大纛迎风猎猎作响，沉甸甸的官威压得满镇散修连大气都不敢喘。\n\n矿口东侧新筑的三丈望楼高台上，摆着一张铺了虎皮的宽大太师椅。一名身着绯紫锦袍、面容阴鸷修长的中年男子正端坐其上，慢条斯理地用银签剔着指甲，周身赫然散发着金丹巅峰的强横灵压——正是大乾钦天监少监赵景曜麾下执掌气运子契的七大巡狩行走之一，贺兰枭！\n\n而在望楼下方的关卡桌案前，三天前曾在寒鸦崖吃瘪的独眼校尉卢铮正按刀而立，身后墙上齐刷刷贴着一排盖有荒州巡狩司鲜红官印的海捕盘查榜文，榜首画着的玄衣负剑青年虽只七分神似，下头“严查截天剑宗镇契堂司律及随行盲眼女眷”一行黑字却刺目至极。\n\n“都给老子排好队按手印！想进坠龙墟淘火铜的，先签这份《奉天灵契借贷券》——借十块中品灵石入场费，出谷还三十块，拿命脉做保！不签的趁早滚蛋，敢在矿口百丈内逗留窥探者，一律按截天剑宗同党论处！”\n\n卢铮一脚踹翻一名试图讨价还价的老散修，骂骂咧咧地冲手下挥手。\n\n距离矿口恰满百丈的一间破败芦苇茶棚里，晏怀瑾挑了个背光的角落坐下，将包着粗麻布的惊蛰剑平放膝头，端起粗碗浅啜了一口冷茶，借着斗笠阴影将关卡布防与阵旗走向尽收眼底。\n\n“贺兰枭竟亲自坐镇山口督采，连进谷散修都要强绑灵契贷充当探路炮灰。”晏怀瑾指腹摩挲着粗糙碗沿，声音压成一线送入越流萤耳中，“看来地肺阴火髓离彻底成熟不过这两三日工夫，地底火煞定是不好相与。”\n\n坐在内侧长凳上的越流萤隔着幂蓠微微偏头，左手在桌下极轻地碰了碰晏怀瑾的手背。\n\n“大人当心。”她用蚊蚋般的气音轻声提醒，“望楼上那个人怀里……揣着一件让我骨血发冷的脏东西，气味跟三天前卢铮手里那卷敕令同源，却霸道百倍。而且茶棚外头卖炊饼的跛脚汉子，还有斜对面蹲墙根的货郎，呼吸都带着钦天监锁灵甲的铁锈味，是外围暗哨。”\n\n晏怀瑾眼神微凛。能让南荒少司命本能厌恶到骨血发冷的器物，除了钦天监那部名震九州的《奉天承运金册》赤金副页，绝无第二件东西！\n\n若能趁贺兰枭孤悬高台、身边仅有两名近卫侍立的空当，暴起十息截脉剑意先废掉这名主将，矿口大阵自然不攻自破？\n\n这个念头刚在脑海中浮起半瞬——\n\n嗡！！\n\n晏怀瑾识海深处那卷一直安安静静的青铜竹简《春秋勘误录》，毫无征兆地剧烈滚烫起来！\n\n百丈之外望楼高台上，贺兰枭怀中隐隐透出的一缕赤金皇道龙气似乎与竹简产生了某种跨越阶位的激烈冲撞。竹简凹槽底部仅剩的那最后一滴勘误墨气根本来不及保留，当场轰然炸碎燃烧，化作一行触目惊心、近乎滴血的狂草警句横贯识海：\n\n【大凶勿动！贺兰枭已签《奉天承运金册》气运子母贷契，性命受仙朝皇道龙气锁血庇护！外人凡对其正面动致死杀机或毁魂剑招，必遭九天紫微龙气百倍反震，剑毁人亡！】\n\n皇道龙气锁血，百倍反震？！\n\n晏怀瑾瞳孔骤缩，搭在膝头惊蛰剑布包上的五指瞬间收紧。难怪钦天监这帮巡狩行走敢在八州横行无忌，赵景曜竟用仙朝国运给麾下恶犬套了一层碰不得性命的反伤乌龟壳！一旦他刚才贸然拔剑直取贺兰枭咽喉，不等剑锋建功，百倍倒卷的紫微龙气便能当场震碎他的金丹与全身剑骨！\n\n还不待他借着墨气余韵细看这龙气锁血究竟有无破绽可钻，百丈外那股浩瀚森严的皇道大气运余波已顺着神识感应狠狠撞进识海！\n\n咔——啪！\n\n槽底墨气彻底归零的《春秋勘误录》发出一声沉闷哀鸣，两片斑驳青铜简页在大气运冲撞之下轰然合拢，表面所有朱砂字迹瞬间湮灭无踪，犹如一块彻底死去的顽铜沉入识海最深处，再无半点声息！\n\n墨竭竹封，强制休眠。\n\n晏怀瑾太阳穴刺痛了一瞬，喉头微腥，神色却在斗笠阴影下冷静得可怕。竹简休眠期间若拿心头精血强行催开，换来的只会是双目失明三日与折剑旧伤恶化——从这一刻起，再没有任何先知批注替他探路，坠龙墟这一局，只能靠他自己的眼睛与剑去盲打硬拆！\n\n就在青铜竹简轰然闭合、切断气机牵连的电光石火间——\n\n百丈外望楼高台上，正垂眸剔着指甲的贺兰枭动作忽然一顿。\n\n他疑惑地伸手按了按胸口衣襟内侧微微发烫的赤金副页，那双狭长阴鸷的鹰隼眸子猛地抬起，越过喧闹拥挤的矿口散修人群，带着刺骨森寒的审视杀意，径直朝坡下这间破败芦苇茶棚的角落扫视过来！"}, {"n": 10, "title": "盲女嗅契，换壳入墟", "body": "那道自三丈望楼劈落下来的森寒视线，像淬了毒的鹰爪，一寸寸刮过芦苇茶棚里的七八张木桌。\n\n晏怀瑾没有抬头，甚至连端着粗陶茶碗的手指都未曾绷紧半分。\n\n在贺兰枭目光扫及角落的前半瞬，他已顺势垂下双肩，借着灰麻斗笠的阴影掩住挺拔脊梁，发出一声压抑虚浮的闷咳，随手从袖袋摸出两粒碎灵石渣丢在桌面，像足了被钦天监大纛官威吓破胆、不敢再打火铜主意的寒门散修。\n\n“这趟混水摸不得，走。”\n\n他嗓音沙哑低沉，拎起桌上包着粗麻布的惊蛰剑当拐杖般拄在身侧，拉起戴着幂蓠的越流萤，步履略显虚浮地从茶棚后侧矮门退了出去，顺着黄土街尾一路往赤砂镇西面荒僻的废窑巷走去。\n\n高台之上，贺兰枭眯着狭长双眸盯了那两道灰扑扑的背影两息。神识扫过，只探到一股驳杂衰败、连筑基门槛都摇摇欲坠的寒酸气机，寻不见一丝截天剑宗特有的凌厉剑意。他疑心渐消，只当方才怀中金册副页发烫是地底火脉震动所致，冷哼一声收回了视线。\n\n可茶棚外头那个卖炊饼的跛脚汉子，却与斜对面蹲墙根的货郎对了一个眼神。两人不动声色地撂下扁担竹篮，一前一后贴着土墙阴影，悄无声息缀上了镇尾那条死胡同。\n\n风卷着赤红砂砾灌进狭窄的废砖窑巷，两侧尽是早年烧制耐火砖留下的坍塌土窑，越往里走人烟越绝。\n\n晏怀瑾听着身后三十丈外踩在碎陶片上的两道轻重脚步，脑海里已将眼下死局飞速过了一遍账。\n\n识海深处，《春秋勘误录》如一块沉入枯井的顽铜，静寂无声。没了竹简批注兜底，前路吉凶全凭自己一双眼睛去拆——正门有贺兰枭怀揣金册副页坐镇，硬闯必撞上皇道龙气百倍反震的铁板；可卢铮定下的十日核契大限只剩七天，越流萤体内的九黎煞脉也只余九十七日锁期，此时退回荒州城便是自断生路。\n\n既然大门走不得，那就只能从钦天监自己人身上剥层皮下来。\n\n走到一座半塌的红泥废窑拐角后，前头带路的晏怀瑾脚步倏然一顿。\n\n巷口阴影里，跛脚汉子与那货郎见猎物停步，当即不再掩饰行迹，一左一右反手扣住袖中锁喉铁钩与传讯响箭，狞笑着疾掠逼近：“前头那两个鬼鬼祟祟的，把斗笠幂蓠摘下来叫爷瞧瞧——”\n\n最后一个“瞧”字还卡在喉咙眼里，原本弯腰扶墙的晏怀瑾骤然回身！\n\n没有拔剑，更不曾催动一缕足以惊动矿口大阵的截天剑宗独门剑气。在镇契堂缉拿叛逃死士锤炼十余年的近身擒拿功夫，在这一瞬展现得狠辣到了极点！\n\n第一步踏出，他整个人如鬼魅般切入跛脚汉子右侧死角，左手五指如铁钩精准扣碎对方袖中传讯响箭的引线，顺势往上一拂，两指重重戳在汉子咽喉廉泉穴上！\n\n一招封喉断音！\n\n那货郎瞳孔剧缩，刚拔出腰间淬毒短匕往前猛捅，晏怀瑾左脚不退反进，铁肩顺势一记沉猛寸撞狠狠顶进货郎胸口膻中穴，震得对方五脏移位、一口真气当场岔断！紧接着第三招双掌齐落，一左一右精准摁住两人颈侧大筋与气海枢机，暗劲一吐即收！\n\n咔、咔两声轻响。\n\n两名有着引气巅峰底子的钦天监外围暗哨连一声闷哼都没能挤出来，白眼一翻，如两滩烂泥般软绵绵栽倒在滚烫红砂里，周身气脉尽数闭锁，两日之内休想醒转。\n\n前后不过三招，巷中连一片衣角破风声都未惊起。\n\n晏怀瑾俯身在两人怀里利落一摸，除了两枚钦天监外围耳目的灰铁腰牌外，竟从那货郎贴身皮囊里搜出了两块刻着“散修盟·勘脉”字样的乌木腰牌，外加一纸盖着荒州巡狩司红印的黄麻文书——《入墟采买副契》。\n\n“怪了。”晏怀瑾展开那纸副契扫了两眼，眉心微动，“卢铮在山口逼散修签借一还三的卖命高利贷，这两名暗哨怀里怎么还藏着散修盟高价募人入谷的采买契？这两块腰牌看着倒像是刚截杀或是扣下旁人得来的。”\n\n越流萤提着竹杖摸索上前，在风沙稍歇的废窑口半蹲下来。她抬手将外头那顶粗麻幂蓠掀开一角，露出覆着素纱的清丽面庞，伸出两指轻轻接过那页黄麻副契，凑到鼻端半寸处极轻地嗅了嗅。\n\n白纱之下，少女秀挺的鼻翼微不可察地动了两下，随即笃定开口：\n\n“大人，这不是截杀旁人抢来的，是贺兰枭急着托散修盟往里头送人，交给外围耳目去黑市招募好手的真凭据。”\n\n晏怀瑾目光落在她脸上：“何以见得？”\n\n“寻常修士只看得见契纸上的官印龙纹，可在我们南荒修咒契的人鼻子里，凡是勾连了《奉天承运金册》子契签发的官凭，朱砂里都带着立契人本身的气运余味。”\n\n越流萤指尖轻轻点在副契末尾那方鲜红官印上，无人旁听时，她嗓音褪去了怯生生的颤音，冷静清冽得像淬过冰的刀锋：“这团朱砂看着鲜亮，底下却缠着三层焦黑断绝的血煞死气——每折损一批立契探矿的人手，官印气机便会滞涩一分。三层死气叠在一处，说明坠龙墟地底近两日火煞暴动，贺兰枭手底下已经连着折了整整三批探路人。”\n\n她顿了顿，唇角弯起一丝极淡的弧度：“外头卢铮抓的普通散修只配填外围废坑，根本分不清哪处是生火脉、哪处是绝命毒瘴。贺兰枭等不起了，这才一面封山，一面急着花重金招募懂辨阴火走向的散修药师进去探真火眼。大人，咱们机会来了。”\n\n不过隔着白纱嗅了一口官纸朱砂，便把钦天监矿口内外的虚实亏空刨了个底朝天。\n\n晏怀瑾深深看了她一眼，难得没搬门规训人，只冷淡评了一句：“鼻子倒还不算白长。”\n\n越流萤乖巧垂下颈子，指尖捻着那页副契边缘，轻声细语地回敬：“罪女再不济，也是大人花了一千五百中品灵石记在镇契堂大账上的药奴，总得替大人把门路闻准些，才不算亏本。”\n\n晏怀瑾不接她这句软中带刺的俏皮话，当即拍板定策。\n\n他先将那两名昏死暗哨身上的灰褐短褐剥下，捏碎他们怀里的钦天监耳目铁牌，将两人拖进废窑最深处的坍塌火道里，指尖暗劲一震，推倒半堵风化土墙将洞口封得严严实实，又借着狂风卷沙抹平了巷内所有脚印。\n\n想要混过矿口那座专测高阶灵力与剑宗路数的皇道龙气盘查大阵，光有腰牌还不够，必须连骨子里的气息一并换壳。\n\n晏怀瑾摘掉灰麻斗笠，将一头墨发随意拿根草绳松松束在脑后，披上沾满煤灰的破旧短褐。他闭目内视丹田，非但不再用灵力压制金丹上那三道折剑枯荣劫裂痕，反而主动放开一丝寒毒顺着经脉溢向四肢百骸！\n\n刹那间，他原本冷白端肃的面容迅速褪尽血色，唇瓣泛起一层久病不愈的灰青，周身雄浑的金丹后期剑意被彻底封镇在枯荣裂痕底层，外泄出的气息萎靡虚浮，活脱脱一个早年伤了肺腑根基、靠给药师拎篓子混口饭吃的寒门病弱剑修。他顺势将双手拢进宽大破旧的灰布袖筒里，遮住常年握剑留下的掌茧，背起粗麻裹紧的惊蛰剑。\n\n一旁的越流萤也摘去了惹眼的幂蓠，抓起一把红砂混着窑灰抹脏粗麻罪衣下摆，背上从货郎身边捡来的破竹药篓，只留脸上遮掩双目的素白药纱。荒州采火药师常年与地底硫磺毒烟打交道，被毒火熏瞎眼睛、缠着药布靠鼻子辨脉的盲眼药女在散修堆里并不罕见，反倒比藏头露尾的幂蓠更合这纸采买副契的名目。\n\n“记住，你现在是流落赤砂镇的盲眼辨火药女，我是你雇来背剑护身的同乡表兄。”晏怀瑾压着嗓子咳了两声，声音嘶哑晦涩，“过了大阵少开口，一切看我手势。”\n\n“是，表兄。”越流萤隔着白纱轻轻颔首，伸手自然而然地搭住了他垂在身侧的破旧袖角。\n\n申时将尽，天边残阳把坠龙墟矿口染得一片暗红。\n\n两人混在另外五六个同样持着散修盟腰牌、背着药锄罗盘的散修中间，不紧不慢排到了矿口东侧的应募专用隘口前。\n\n头顶三丈高的赤金阵门嗡嗡运转，水波般的皇道龙气光幕垂落下来，但凡路过修士体内藏有金丹以上强横修为，或是怀有截天剑宗清冽剑气，阵门上的铜铃立时便会炸响示警。\n\n轮到晏怀瑾与越流萤上前时，守关的钦天监执事斜着眼劈手夺过那两块乌木腰牌与《入墟采买副契》，拿验契镜照了照上头货真价实的巡狩司官印，又狐疑地上下扫了一眼捂嘴低咳的晏怀瑾和缠着白纱的越流萤：\n\n“瞎子配病痨鬼？散修盟这回就招来这么两块废料？”\n\n晏怀瑾佝偻着背脊，双手缩在袖筒里赔着嘶哑苦笑：“回军爷的话，舍妹三年前在火云涧采药被毒烟熏坏了招子，别的干不了，唯独一双鼻子闻地火硫磺比寻常罗盘还准三分。小人贪图副契上那二十块灵石抓药救命，这才斗胆来应个差……”\n\n说话间，两人坦然迈步踏入赤金龙气光幕之下！\n\n冰冷霸道的龙气神念自头顶一寸寸扫过全身。晏怀瑾识海一片死寂，丹田内只有折剑寒毒透出的衰败死气，不露分毫金丹锋芒；越流萤周身九黎巫脉更被三穴剑气与封目白纱锁得滴水不漏。\n\n嗡——\n\n阵门顶端的赤铜警铃纹丝未动，光幕泛起一圈代表核验无误的淡黄微光。\n\n守关执事见阵法未响，榜文上画的又是气度森严的金丹司律，哪里会把眼前这两个灰头土脸的苦哈哈往截天剑宗头上想？他不耐烦地将腰牌扔回晏怀瑾怀里，往身后黑沉沉的裂谷斜坡一指：“算你们走运！赶紧滚下主裂谷听候调遣，误了贺兰行走采髓的时辰，仔细你们的脑袋！”\n\n“多谢军爷。”\n\n晏怀瑾哈腰接过腰牌，不动声色地引着越流萤穿过层层玄铁拒马，沿着开凿在峭壁上的宽阔石阶一步步踏入了坠龙墟核心主裂谷！\n\n一过山口风口，外界喧嚣瞬间被两侧高达百丈的赤黑断崖隔绝。谷底热浪翻涌，一道道深不见底的地缝里不断喷吐着刺鼻的硫磺浓烟与暗紫色火煞，嶙峋怪石间随处可见被地火烧成焦炭的兽骨与碎裂铁镐。\n\n两人刚绕过谷口一块犬牙交错的玄武巨岩，前方浓稠的赤红烟瘴里，忽然传来一阵哗啦啦的沉重铁链拖地声！\n\n紧接着，靴底碾碎焦石的脚步声由远及近。\n\n只见独眼校尉卢铮正按着腰间绣春锁灵刀，黑着一张横肉丛生的脸，押着一队七八名戴着玄铁重枷、浑身衣衫焦黑破烂的散修迎面走上坡道。那几个散修个个口鼻溢血、双目翻白，显然刚从前头凶险坑道里折腾得只剩半条命。\n\n卢铮正为连折探路炮灰憋了一肚子邪火，抬头撞见刚下谷的这批应募药师，那只凶戾独眼胡乱往人群里一扫，掠过缩袖低咳的晏怀瑾，目光陡然定格在了背着旧药篓、双目覆纱的越流萤身上。\n\n他脚步一顿，嘴角扯出一抹残忍冷笑，猛地抬起粗壮右手，隔着数丈毒烟直直指住了越流萤：\n\n“来得正好！前头三号裂坑刚涌出一股紫黑怪瘴，连烧了老子三个探路鬼——那个缠白纱的瞎眼药女，既然拿了采买契的灵石，别缩在后头装死，现在就滚去前头替本官试试那口地火毒瘴！”"}]}, {"id": "male_kouchangsheng", "badgeClass": "emerald", "tag": "男频 · 凡人流修仙（1—120章完整正文）", "title": "叩长生", "logline": "天生九窍蒙尘的大泽盐场熬卤学徒陈长庚，在管事克扣逼探毒井与恶师暗种火毒拿他炼药渣的折寿死局中，偶得每三日借地脉潮汐将剧毒废卤渣提纯为无瑕髓晶的“蚀纹石臼”，自此人前低眉赔笑装病弱学徒让贪婪者替死探路，人后闷声攒下十倍破境髓晶与狂暴火器反杀恶师，从废脉矿坑一步步杀穿沉渊古海与上界仙城，踏碎归墟界门叩问长生。", "outlineUrl": "files/male_kouchangsheng_outline_1_200.txt", "outlineFileName": "《叩长生》_第1-200章大纲.txt", "proseUrl": "files/male_kouchangsheng_chapters_1_120.txt", "proseFileName": "《叩长生》_第1-120章正文.txt", "outlines": [{"n": 1, "title": "压秤逼井", "synopsis": "乌卤盐场丙字灶房毒烟刺鼻，十六岁的熬卤学徒陈长庚肺淤火毒、九窍蒙尘，辛辛苦苦熬足十二石黑卤交课，副把头周禄却用铁秤杆硬压箩筐，咬定湿柴潮气重少半两，当众扣光他攒来买救命药的半月工钱，还逼他明早下连死两人的三号盲井探漏。同灶老灶匠葛老栓想替他求情反被踹翻，陈长庚当面低眉赔笑认下短秤亏空，半句狠话不吐。入夜后他为凑私盐买避瘴散保命，冒险钻进坍塌的旧卤槽掏刮槽底盐皮，却被巡夜梆子声逼进裂缝，指腹意外抠出一只断口泛着暗金丝纹的缺角灰石窝。"}, {"n": 2, "title": "私盐钓狼", "synopsis": "陈长庚连夜藏好吸干毒渣后陷入沉寂的灰石臼，清楚未通气窍硬闯三号盲井必死无疑。次日清早周禄提鞭催命，陈长庚故意在交接箩筐时露怯遮掩，让周禄搜出半包品质极高的雪白私盐，并在挨抽时颤声求饶，漏出“昨夜听三号井底风响反常、岩缝怕是结了值几十两银子的老卤冰晶”的口风。周禄正愁凑不够百两纹银巴结巡灶孙丹师，一听横财眼红心热，又怕正把头叔父周大昌闻讯分一杯羹，当场改口骂陈长庚手脚笨重会坏了宝物，喝退其余学徒，逼陈长庚守在井口拉绳，自己拎刀抢先下井。"}, {"n": 3, "title": "盲井埋骨", "synopsis": "周禄钻入三号盲井深处贪婪凿壁，一镐震裂岩层毒囊引发局部塌方，腿骨被砸断且吸入毒瘴重伤。他挣扎爬到吊绳下仰头哄骗陈长庚拉他上去再分一半银子，袖底却扣着短匕打算出井便杀人灭口独吞风声。陈长庚从绳索坠重与井底喘息听破杀机，顺着井壁暗阶摸下两丈，趁周禄伸手抓钩时一铁钩贯穿其咽喉，将其踹回塌方碎石堆伪造成贪采私盐失足现场。当夜恰逢地脉潮汐满三日，怀中石臼滚烫析出一撮莹白道髓晶砂，陈长庚借灶烟遮住逸散的地火腥甜气吞砂入腹，一举冲破首窍、咳出肺底黑红淤血。"}, {"n": 4, "title": "慈颜赐汤", "synopsis": "正把头周大昌见内侄惨死盲井，暴怒揪住陈长庚欲动私刑逼问。巡灶丹师孙奉先慢步入场，搭脉三息察觉陈长庚气窍初动且肺腑格外耐火毒，正是试炼禁丹梦寐以求的活体药引，当即搬出云泽宗门规喝退周大昌，慈和叹息着将陈长庚破格提拔为丹房司火童子。入丹房后，孙奉先亲手端来一碗甘甜温润的“温脉汤”与半页《引火行气诀》，叮嘱他安心养身。陈长庚凭长年熬卤观火的嗅觉闻出碗底一丝极淡的火煞腥气，面上感激涕零跪饮见底，夜里却借石臼余韵引气内视，惊觉一缕赤红毒丝正死死缠向心脉。"}, {"n": 5, "title": "咳血藏锋", "synopsis": "陈长庚赶在孙奉先贴窗窥探前散去内息、捂胸剧烈呛咳，成功演成药力冲刷旧伤的虚弱假象。次日孙奉先搭脉见其气机浮乱，防心大减，准许他每日独自将报废丹炉灰推去排污渠倾倒——陈长庚自此白得源源不断的高浓度提纯原料，每次服下加料温脉汤便在夜间用无瑕髓晶拔除九成赤煞毒引，白日咬破舌尖咳出黑血丝交差。运灰途中，他撞见脚行趟子手贺九斤在粪灰车夹层藏私盐躲避搜检；陈长庚非但没举报，反倒抓了一把刺鼻废丹灰撒在车辙上帮其遮过巡卫灵犬，凭这份知趣与半撮伪装成天然老矿髓的碎晶，敲开了贺九斤的黑市门路。"}, {"n": 6, "title": "借虎驱犬", "synopsis": "贺九斤将碎矿髓在黑石坊市卖出高价，按约替陈长庚带回体修残篇《井煞锻骨功》与一柄淬毒分水刺，并证实部分寿尽丹师会用“赤煞引”养活人药渣开炉破境。陈长庚借废丹灰析出的大把道髓晶砂冲开第二、第三处气窍，每夜泡在滚烫废卤桶中暗修锻骨横练。不甘侄子白死的周大昌买通外灶管事，趁孙奉先外出时闯到丹房后院堵截陈长庚，逼他交出盲井私盐赃款。陈长庚故意不还手，退入丹房引翻一盆备用火炭惊动回返的孙奉先；孙奉先唯恐炉鼎受损，当场祭出一缕丹火灼伤周大昌立威，转头却对陈长庚定下了初八开炉的催命日子。"}, {"n": 7, "title": "暗渠换雷", "synopsis": "距初八死限仅剩九日，单靠四窍横练仍破不开九窍修士的护身灵罩，陈长庚急需不耗自身内息的一次性重火力。他掐准石臼离器六个时辰散化的时限，在交货前两个时辰提纯出一小撮极品髓晶，逼贺九斤立下血誓当夜往返黑石坊市换购三枚濒临炸裂的残次“过载烈阳火珠”。贺九斤贪图双倍跑腿碎灵石，却被坊市黑店伙计尾随至盐场苇荡；陈长庚未等贺九斤开口求救，便借夜雾从泥淖暴起，一记井煞锻骨重拳砸碎跟踪者喉骨沉入毒塘，既震住贺九斤不敢生二心，又顺利拿稳三枚火珠，并于返屋后吞晶冲开第四处气窍。"}, {"n": 8, "title": "石闸落锁", "synopsis": "初七黄昏，孙奉先为防夜长梦多，突然借口地火潮汐提前，遣散丹房外院所有杂役，并端出一碗色泽暗红、掺了三倍赤煞引的“固元浓汤”，眼神死死盯着陈长庚咽喉。陈长庚心知此刻拒喝必遭孙奉先全盛状态强杀，当即双手捧碗一饮而尽，暗中以四窍浑厚气血配合胸前贴肉石臼强行截留毒液于食管边缘，表面则顺势软倒在地、七窍渗出凄惨黑血。孙奉先探见他脉象微弱如游丝、心脉赤煞引已彻底生根，狂喜之下放下最后一丝戒备，亲手拽着“奄奄一息”的陈长庚拖入隔绝内外声息的地下地火炼丹室。"}, {"n": 9, "title": "贴脸炸符", "synopsis": "地火室内赤焰翻涌，孙奉先催动母引法诀欲隔空抽干陈长庚全身髓血入炉，岂料陈长庚体内早被无瑕髓晶涤荡得毫无赤煞根脚，丝毫不受牵引。孙奉先惊愕色变，急祭赤铜火链锁拿；陈长庚仍装作气机溃散扑倒在地，诱使惜命的孙奉先欺近三步伸手抓他天灵盖探查。就在指尖将触未触的一瞬，陈长庚暴起发难，凭井煞锻骨硬骨生生绷断赤铜火链，左手将三枚过载烈阳火珠抵住孙奉先胸膛贴脸引爆！狂暴雷火当场炸碎孙奉先的护身玉符与半边肩胛，不等他捏碎求救玉简，陈长庚右手淬毒分水刺已狠辣捅穿其咽喉，彻底断绝生机。"}, {"n": 10, "title": "焚炉截信", "synopsis": "石闸外周大昌拍门窥探，陈长庚冷静压细嗓音模仿孙奉先怒斥“滚远些，莫惊了老夫凝丹火候”，当场吓退周大昌。随即他迅速搜刮战场，从孙奉先储物囊与暗格中摸出十八枚下品灵石、一只可锁住髓晶灵气的寒玉匣、半部《控火诀》，并在丹炉底座夹层翻出云泽宗外门纳贡残图与管事冯保山未寄出的私函——信中索要三十枚下品灵石买通下月补缺名额，还提点丙字废渣房连死三任杂役无人肯去。陈长庚将前任童子枯骨与禁丹残渣塞进主炉逆转风门，伪造出孙奉先强炼禁丹反噬炸膛的铁证，算准火势将爆，一掌拍裂侧墙排烟道钻回外院。"}, {"n": 11, "title": "验灰定案", "synopsis": "丹房炸膛惊动全盐场，正把头周大昌抢先带人围住灰头土脸的陈长庚，一口咬定是他司火失职害死仙师，欲借机搜身夺财杀人灭口。天明时云泽宗外门巡矿执事郑奎御器降临，周大昌恶人先告状；陈长庚当众咳出两口真血，瑟缩呈上昨晚被孙奉先赶出外院添炭的半截焦木，并怯生生指出炉底残留的甜腻腥气与三日前失踪的毒药账册。郑奎验出主炉确系禁药“赤煞破障丸”炸膛，为免家丑牵连自己督察不力，当场一巴掌抽翻多嘴的周大昌罚去半年月俸，草草定下丹师走火入魔结案，将包括陈长庚在内的丹房杂役一并签发脱籍文牒遣散。"}, {"n": 12, "title": "雨夜留银", "synopsis": "拿到脱籍文牒的陈长庚并未白日招摇离场，而是等到夜雨滂沱时才背着破包袱出棚。周大昌挨罚后笃定陈长庚摸走了丹房油水，暗遣两名通窍一窍的心腹刀手在必经的芦苇水荡设伏拦截。陈长庚早借地势绕到上风芦苇丛，撒出半包废丹毒灰迷住二人视线，贴身三记分水刺干净利落割喉沉尸，搜出十几两碎银。离泽前他绕回丙字灶后巷，冒雨潜入早年屡次分他半块杂粮饼的老灶匠葛老栓破屋，将二十两纹银与两包祛火毒药散用油布裹紧塞进水缸底座，隔着雨幕听见屋内一声苍老咳嗽，默然拉低斗笠转身远赴黑石坊市。"}, {"n": 13, "title": "暗涵入坊", "synopsis": "听闻通窍六窍的黑市毒修“赤蝎崔婆”因收不到孙奉先买禁方的十二枚灵石尾款正在正门税卡堵截盐场来人，陈长庚果断付给贺九斤半块碎灵石，钻进腥臭的排卤暗涵绕入坊市西侧散修棚户区，租下一间紧挨地下火煞支脉的偏僻石屋。脚刚站稳，把持西棚区的地头蛇罗三便带着打手踹门查户，见陈长庚面生瘦弱，张口便要三枚下品灵石的“新户押火钱”。陈长庚既不露富也不硬顶，苦着脸亮出盐场遣散文牒和满手熬卤老茧，奉上五两纹银加半罐私盐哭穷求宽限十日，令罗三认定他只是逃荒盐工，骂骂咧咧收银离去。"}, {"n": 14, "title": "借客抬价", "synopsis": "针对隔壁凿壁偷窥的棚户惯偷，陈长庚悄无声息将一撮滚烫废卤毒粉吹入孔洞，烫瞎对方右眼令其连夜骇逃，彻底清净了石屋周边。次夜他将石臼新析出并封在寒玉匣内的一钱道髓晶砂刮去棱角、裹上盐泥伪装成废井老矿髓，戴上斗笠潜入地下黑市“鼎余轩”。掌柜钱半城验出矿髓毫无丹毒，眼底精光暴闪，故意压价至三枚灵石并暗使伙计堵门摸底。陈长庚当即抓回木匣转身走向对门散修摊位高声询价，引来两名卡在通窍瓶颈的老散修争相竞夺，逼得钱半城咬牙掏出八枚下品灵石外加十袋剧毒废丹灰买断，陈长庚趁乱混入夜市人流脱身。"}, {"n": 15, "title": "染囊嫁祸", "synopsis": "面对罗三带崔婆药童搜街的险境，陈长庚没有慌乱弃屋，而是从贺九斤口中套出正把头周大昌的外甥昨日刚潜入坊市黑栈销赃孙奉先外院遗物。他当机立断分给贺九斤一块碎灵石，命其把孙奉先留下的半截残留赤煞引气息的旧药囊，悄悄塞进周家外甥落脚客栈的柴房，自己则吞下一粒敛息丸涂黑面皮扮作哑巴烧炭工混过搜查。药童手里的寻煞蛊虫果然被客栈浓烈的赤煞味引走，崔婆认定周家私吞了孙奉先的丹方与灵石，当夜上门血洗黑栈；陈长庚则趁西棚区守备空虚，锁门用石臼炼化鼎余轩废丹灰，顺利贯通第五窍。"}, {"n": 16, "title": "捏铁立威", "synopsis": "算准距云泽宗补缺验纳仅剩六日，而手里二十六枚灵石扣去买路三十枚仍差缺口，陈长庚决定补强护身家当。他换装寻到黑市瞎眼火器匠胡铁锤，拿出孙奉先半页控火心得与高纯度火煞晶定制四枚过载烈阳火珠及一面贴身玄铁护心镜。交货时胡铁锤听出他气息年轻，突然坐地起价索要双倍灵石，还暗扣机关弩对准柜台想黑吃黑扣下控火图谱。陈长庚不动声色伸出两指，当着学徒的面将柜上试火的百炼精铁锭生生捏出两道深寸许的指印，淡声点破炉后学徒偷藏火药的破绽，吓得胡铁锤冷汗直流，乖乖按原价交齐火珠与内甲。"}, {"n": 17, "title": "残方设局", "synopsis": "赤蝎崔婆血洗周家外甥后只搜出凡俗银钱，暴怒之下查到曾替孙奉先跑腿的贺九斤脚行，扣下其小徒弟限明夜交出真正拿走丹房遗物之人，否则放腐骨毒蜂噬魂。贺九斤吓得跪求陈长庚拿十枚灵石救人或立刻分道跑路。陈长庚冷静权衡：此时跑路必失黑市耳目且凑不齐入宗灵石，而崔婆真正垂涎的是孙奉先那张能助人强冲开脉境的“赤煞破障丸”丹方。他当场稳住贺九斤，凭记忆默出半页看似精妙实则逆乱火脉的残缺丹方，沾上孙奉先旧袍血迹，命贺九斤传话约崔婆明夜子时到坊市外三里的废弃硝石窑一手交全方一手放人。"}, {"n": 18, "title": "烂摊得图", "synopsis": "为确保明夜一击必杀通窍六窍的崔婆，陈长庚随贺九斤赴坊市北角旧货烂泥摊，低价扫购一批富含地火硫煞的废矿残片准备埋入硝石窑底助燃。旧货摊老头见他爽快，将一捆无人问津的前代老盐工遗物折算半吊铜钱搭售抵账；陈长庚随手翻检遮掩耳目，指尖触到一卷被陈年黑卤浸透发硬的羊皮修渠草图，借斗笠阴影瞥见图角赫然批注着一条直通地底绝地“沉渊古盐墟”侧翼的废弃排卤暗沟！他面色如常将其卷进破麻布收好，恰逢两名云泽宗外门采买弟子纵骑闯摊，一鞭抽翻护宝散修强按两成贱价收走灵矿，令他亲眼见识了大宗外门的丛林霸道。"}, {"n": 19, "title": "火窑绝杀", "synopsis": "子夜废弃硝石窑寒雾弥漫，赤蝎崔婆果然暗携一名通窍五窍的刀疤散修提前潜伏窑顶，只把被捆住的脚行学徒推在窑心当诱饵。陈长庚早提前两个时辰在窑顶承重柱与排风道埋满硫煞废矿残片，让贺九斤在外围敲锣引动毒蜂暴露两人藏身处，随即一箭射燃引火线！窑顶轰然塌陷将刀疤散修砸入火坑烧毙，崔婆撑起绿瘴护罩冲出烟尘，甩出漫天腐骨毒针直取蒙面的陈长庚。陈长庚凭玄铁护心镜与五窍锻骨体硬抗边缘毒针，一步欺近甩出四枚过载烈阳火珠封死四方，狂暴火浪撕碎绿瘴，淬毒分水刺顺势削断崔婆首级，救出人质并尽收其毕生积蓄。有了隔味阵盘，石臼此后提纯再无腥甜气外泄之忧。"}, {"n": 20, "title": "渡口亮印", "synopsis": "吞服新析髓晶稳固通窍五窍巅峰后，陈长庚将四十八枚灵石分三处贴身藏妥，留给贺九斤两枚灵石封口定下日后暗货联络暗号，随即持盐场脱籍文牒赶赴黑石渡口登船。不料大泽盐商富户子弟窦文焕为替族弟强抢最后一个外门补缺席位，重金买通渡口验纳执事，当众挑刺陈长庚出身贱役、气窍混浊，欲撕毁其文牒轰下船板。周围散修纷纷冷眼看戏，陈长庚却不争辩半句，只躬身递上三十枚下品灵石，借袖口遮挡亮出冯保山亲笔私函角落的“丙字废火”私印暗记。验纳执事瞳孔骤缩，深知这是纳贡院冯管事钦点的肥羊，当即变脸呵退窦文焕，放陈长庚登船入舱。"}, {"n": 21, "title": "夜舱卸祸", "synopsis": "接引楼船夜航沧溟大泽深水带，收受窦文焕灵石贿赂的外门巡舱弟子卢成借查验违禁火器闯入底舱，意图搜走陈长庚贴身财物并废其一臂替金主出气。陈长庚早料到窦文焕不会善罢甘休，提前将火珠、石臼与十六枚灵石封入隔味阵盘贴腹暗藏，明面行囊只放两块乌卤盐场废铜牌；卢成伸手扣肩试探时，他装作仅通两窍的气虚学徒顺势跌撞出舱门，引来押船纳贡院副使侧目，并双手捧出盖有纳贡院火漆的补缺回执请卢成代呈冯管事复核。卢成忌惮坏了冯保山的私账担责，只得抓走两块碎银下台，临走却冷脸将陈长庚调去雾气最重的船首锚链处替值夜哨。"}, {"n": 22, "title": "雾泽引蜈", "synopsis": "子夜水底群居凶物铁线水蜈啃噬楼船阵盘，卢成故意落锁封死前甲板退路，逼陈长庚等四名无背景补缺新丁持铁钩清剿攀舷毒虫。两名新丁惊慌乱砍被毒液溅中坠水惨死，陈长庚表面握着长柄铁钩缩在锚柱死角剧喘示弱，暗凭熬卤辨毒眼力锁定通窍七窍母蜈潜伏在右舷排水槽下——恰在卢成躲清闲督战的暗哨正下方。他借浓雾掩护将半撮混有硫煞废粉的腥甜药渣弹上右舷外壁，受激狂躁的母蜈轰然撞碎护栏直扑卢成，逼其自断尾指狼狈逃命；护船执事闻声赶来斩杀母蜈，陈长庚趁乱用分水刺挑下两截铁线蜈毒鳌藏入怀中，明面只交半截残足领下护船嘉奖。"}, {"n": 23, "title": "测台藏拙", "synopsis": "楼船抵达云泽宗外门苍芦渡，百余新丁在山门测窍台公开验测气窍等第，刑律堂巡山弟子卢耀早已候在台侧，准备借口资质低劣将陈长庚直接发配卢家把持的折寿黑水矿坑。轮到陈长庚按手测柱时，他运转敛息术锁紧周身气门，令石柱仅泛起两窍半夹杂浓重火毒的浑浊灰光，引来台下世家新丁哄笑。卢耀当即越众喝令将其划入矿奴名册，陈长庚却不慌不忙躬身呈上盐场巡查执事郑奎签发的耐火立功文牒与纳贡院补缺调令，点明自己系指定补填丹火杂役缺口之人。主持测窍的老执事不愿平白得罪纳贡院冯管事，当场驳回卢耀，将陈长庚档案移交纳贡院。"}, {"n": 24, "title": "候堂摸底", "synopsis": "入册前夜新丁暂居纳贡院候验寮房，书办庞文禄借预核资粮向众人高价兜售劣质避毒散，同屋一名硬顶拒买的散修当晚便被栽上夹带违禁散功粉罪名押走清退。陈长庚主动摸出一块碎灵石买下两包滞销药散，替庞书办添茶算账，顺口套出冯保山次日堂审绝口不提渡口买路钱、还要拿验资火耗刮走明面八成安家灵石的潜规则，以及丙字废渣房因丹房赤铅毒灰连折三任杂役的实情。夜深后陈长庚借如厕暗角，将余下六枚完好灵石、铁线蜈毒鳌与寒玉匣严密封入隔味阵盘藏进靴底，明面布囊仅留十枚普通下品灵石待验。"}, {"n": 25, "title": "茶壶刮脂", "synopsis": "纳贡院正堂点卯造册，管事执事冯保山对渡口已收的三十枚灵石只字不提，慢条斯理验看陈长庚呈交的十枚安家灵石，随即捧着茶壶眯眼叹道补缺文牒过了三日火耗期，按宗门老例新人验资火耗折八成，大袖一拂直接收走八枚，只推回两枚边角崩裂的残次灵石，还满脸慈和卖乖称自己担着干系替他挡掉黑水矿役、分去清静少争的福地丙字废渣房。旁侧书办冷眼等着看新丁哭闹犯上好罚没净身，陈长庚内心冷冽记下这笔死账，面上却深深一揖感激涕零，顺杆爬求得一纸独管丙字废渣房清运、闲杂同门不得擅入的签押木牌。"}, {"n": 26, "title": "废谷立户", "synopsis": "卢耀兄弟堵在石阶上，借口山道冲撞师兄威逼陈长庚交出仅剩的两枚安家灵石并按月奉上三成例钱。面对卢耀通窍五窍巅峰的灵压逼迫，陈长庚假作惶恐退至钟亭十丈内，突然高声向推车下山的丹房副管事石百川请示：冯管事钦派他赶接今日头炉毒灰，若在此被拦误了时辰该算哪房火耗。石百川正愁丙字房空缺没人接滚烫赤铅灰，当场沉脸呵退卢耀兄弟不许阻拦丹房公干。陈长庚兵不血刃随灰车踏入浓烟刺鼻的丙字废渣房，验看独立石屋与直通地下支脉的排灰火坑，确认此处正是遮掩石臼腥甜异味与潮汐充能的绝佳宝地。"}, {"n": 27, "title": "铁闸夹鼠", "synopsis": "核对首日交接的十车废丹灰时，陈长庚凭观火辨渣绝活察觉少了两车含煞最浓的紫火炉底灰，结合床板血字断定有内鬼夜盗。子夜西侧排灰暗口果然响起三长一短暗号，原是丹房司火学徒焦旺私盗未燃尽的废药渣炼假丹牟利，前任杂役因贪心索分五成被其下腐肺散毒杀，今夜焦旺不知换人仍递入毒酒接货。陈长庚压哑嗓子假装接酒，待焦旺探手进洞摸灰袋时猛然扳落千斤铁闸夹断其两指，却绝不开门照面，只扯嗓高喊有贼偷宗门官灰敲响警钟。焦旺做贼心虚捂着断指仓皇逃窜，次日送来的十车废灰连带最肥的紫火炉底渣再不敢少半分。"}, {"n": 28, "title": "抹灰装咳", "synopsis": "冯保山派书办庞文禄借收净灰例银突击查房，实则试探新杂役是否私藏废铜铁牟利，一旦见其精气神尚可便要加派双倍挑灰苦役。陈长庚听见锣声迅速收起寒玉匣，抓一把石臼筛剩的无毒白灰抹暗面色，含一口铁锈温水走到炉烟最呛的风口开门迎客，弯腰剧咳喷出暗红血沫溅上庞文禄鞋尖，双手奉上二十两凡俗碎银与一包普通废铜屑请其代孝敬冯管事。庞文禄嫌恶掩鼻连退三丈，见陈长庚指节抹乌、喘息如破风箱，回院禀报此子老实耐耗且已毒入肺腑；冯保山放心将其划为死棋不再派查，陈长庚当夜连吞三撮道髓晶砂，零丹毒轰开通窍第六窍。"}, {"n": 29, "title": "坑底收虫", "synopsis": "顺着坑底异响撬开排渣岩缝后，陈长庚惊见前任丹师倾倒的伴生矿卵在剧毒炉灰温养下，孵出三十六只背甲坚逾精铁的凶戾甲虫，正啃食地火铁栅，一旦咬穿阵基引爆地火自己必担死罪。分水刺试劈仅留白痕且激凶虫狂躁，他当即变招，取石臼提纯髓晶后残留的一撮浓烈煞毒泥混入铁屑，成功诱使群虫钻入寒铁瓮贪食休眠，并连夜修补好铁栅。次日他换上灰衣赴外门藏书阁底层，面对管阁老役伸手索要查典茶钱，主动揽下抄录三卷残破矿志的苦差换得半个时辰翻阅《异虫残录》，确认此乃可噬穿开脉灵盾的嗜铁煞甲虫，唯晋阶急需赤精铜髓。"}, {"n": 30, "title": "鬼市换诀", "synopsis": "距半年校役仅剩二十日，陈长庚既需把明面修为合理垫至三窍保住废渣房，又急需横练后续功法与饲虫辅材，遂持联络木牌夜赴山脚地下鬼市乱石集与贺九斤接头。他戴铁面斗笠化名灰客，用两粒边缘碎髓晶在疤面刘摊上换得《井煞锻骨诀》中卷与赤精铜屑；疤面刘验出髓晶全无丹毒顿起贪心，暗招两名通窍六窍劫修尾随截杀。陈长庚借贺九斤探明的滑坡废炭洞地形佯装不敌逃入洞底，诱劫修亮起火折法器引爆沉积沼气，反手甩出铁线蜈毒针钉穿疤面刘琵琶骨，逼问出《饲虫控煞手札》藏处后灭口沉井，分出两成碎银给吓白脸的贺九斤锁死长期暗货同盟。"}, {"n": 31, "title": "演坪反诬", "synopsis": "外门半年验脉校役在演武坪开考，卢耀买通司秤书办，在核验丙字废渣房半月筛铜定额时暗往灰篓夹层塞入湿铅沙，当众喝斥陈长庚克扣三十斤废铜且修为不足三窍，欲削去其木牌直接锁往黑水矿坑。满场杂役噤若寒蝉，陈长庚不争口舌，先按住测脉石显露刚好过线的三窍微弱气机堵住修为借口，随即叩请主考的器堂副执事开炉过火复熔灰篓。铅沙遇器堂猛火当场炸开，散出唯有刑律巡山堂后山靴底才沾有的赤铁泥腥臭！本就与刑律堂争权的器堂副执事勃然大怒，当场杖责司秤书办并罚没卢耀三月俸石，陈长庚稳稳保住丙字房差事。"}, {"n": 32, "title": "断灰抓把", "synopsis": "窦文焕入丹堂后与断指怀恨的焦旺勾结，借口清洗丹炉将原本归丙字房的高煞紫火炉底灰全数改拨甲字房，只给陈长庚倾倒毫无煞气的清汤湿泥，既断其提纯原料又逼他下月交不出筛铜定额。连续两轮潮汐颗粒无收，陈长庚带碎银找石百川求情亦被焦旺拦门羞辱。他冷静蹲守排污渠两日，从湿泥残留的甜腻酸涩气断定二人在瞒着石百川盗用紫火官炉偷炼违禁春煞散牟利，当即花半块残灵石雇了一名嘴碎的甲字房杂役，趁石百川酒后查院时故意在台阶摔裂夹带春煞残渣的泥篓。石百川震怒之下当场人赃俱获拿下焦旺，恢复丙字房全部紫火炉灰配额。"}, {"n": 33, "title": "替筛留珠", "synopsis": "石百川因私炼延寿丹屡屡炸膛，命陈长庚每旬从十筐剧毒报废炉渣中徒手筛拣未融的赤髓砂，成则赏半瓶劣等净髓引，少一钱便按盗窃丹堂重宝治罪，实则拿他当折寿的人肉滤毒筛。头批猛毒炉渣入屋，陈长庚凭熬卤摸骨手艺先从渣底挑出石百川暗埋试探的五粒记号铜珠原封留底，再放出三十六只嗜铁煞甲虫吞吃赤铅毒壳，将最狂暴的废渣填入石臼析出三倍无瑕髓晶，最后只把灵力流失三成的表层赤髓砂连同记号珠足秤交还，并用热碱将双掌熏出燎泡装苦。石百川验过记号珠大为满意，当场赏下净髓引并放话免去他一切临时外差。"}, {"n": 34, "title": "捧药免捐", "synopsis": "冯保山为替真窍幼子凑足百枚内门铺路灵石，巧立防风修缮费名目强刮外门各房每人两枚下品灵石，交不出者直接押去替内门试探凶险毒矿眼。陈长庚虽暗攒十余枚灵石，却深知一旦痛快交钱必被当成肥羊连环压榨。他赶在庞书办上门收钱前，双手捧着石百川刚赏的半瓶劣等净髓引直奔纳贡院偏厅，当着几名来往丹堂杂役的面痛陈自己筛毒灰烂手、愿拿石副管事亲赐的保命药抵缴冯管事的新规费。冯保山最怕私设杂捐捅到丹堂惹出贪墨官司，当场沉脸训斥庞书办不懂体恤苦役，高调免去丙字房半年杂费博取仁名。"}, {"n": 35, "title": "雪夜埋钉", "synopsis": "窦文焕因春煞散折本又见陈长庚屡屡滑脱，趁冬至暴雪外门巡卫换防空档，花十五枚灵石雇来断指卢成与通窍六窍散修杀手夜枭，翻越废渣谷后崖潜入丙字房欲将其扭颈推入火坑焚尸。二人撬窗扑向石榻一刀扎穿被褥，却只刺中裹着麻袋的滚烫砖坯！刚冲破通窍七窍的陈长庚早在铜铃断裂前便嗅出雪中铁腥，提前伏于排灰暗槽顶梁，一扬手洒下整袋赤铅毒灰糊住二人口鼻，仗着井煞锻骨中卷横练硬吃夜枭反手袖箭，贴地甩出两枚过载烈阳火珠炸碎卢成双膝，分水刺瞬穿夜枭后心。面对搬出兄长求饶的卢成，陈长庚半句不言拧断其颈骨，放甲虫啃净暗器残片，连夜将两尸拖至三里外卢家私矿险坡推落灭迹。"}, {"n": 36, "title": "指鹿咬狗", "synopsis": "卢成与夜枭尸首在私矿坡底被发现，卢耀暴怒之下怀疑陈长庚知情，率两名刑律堂铁卫踹开丙字废渣房翻箱倒柜。铁卫搜遍全屋只见两块残灵石、呛人毒灰与血痰盂，搭脉验得陈长庚依旧是虚浮不堪的三窍病体，绝无可能无伤反杀两名六窍好手。卢耀不甘心欲强锁人回堂动私刑，陈长庚边剧咳边瑟缩指认雪夜似乎瞥见丹堂窦师兄的随从提灯往西坡私矿去过，顺手亮出替石百川限期筛砂的签押令。铁卫早闻卢成替窦文焕跑黑活，不愿替卢耀背得罪丹堂的黑锅，当场喝令收队；卢耀转身闯去丹堂向窦文焕索要百枚灵石抚恤封口，双方彻底撕破脸皮。"}, {"n": 37, "title": "垫石验锁", "synopsis": "陈长庚将那块暗青色古炉垫石投入石臼，认出其乃百年前采自沉渊古盐墟外围的地母玄晶伴生废壳，析出的一缕金丝髓气不仅令他稳固七窍中期，更彻底证实冲击开脉境与激活石臼二阶转化非夺取真正的地母玄晶不可。他借交砂旁敲侧击试探垫石来历，正逢石百川被内门催逼古墟避瘴丹焦头烂额，反逼陈长庚签下死契充当丹堂进古盐墟外围探路的背篓杂役。陈长庚当面磕头哭诉体弱进墟必误大事，暗把从夜枭身上搜出的窦文焕私购春煞猛药账单夹进筛灰簿递上，诱使石百川捏住肥羊窦文焕抵充炮灰名额，自己保住暗中行动自由。"}, {"n": 38, "title": "暗拍淘偶", "synopsis": "古盐墟开启骤然提前，陈长庚深算墟内必是八九窍精锐扎堆且乱磁禁空，单凭几枚火珠难以自保，遂揣着攒下的三十余枚灵石再赴乱石集暗拍会。会上散修疯抢净髓引，唯有一尊核心阵槽损毁、非极纯地火煞晶不能驱动的青铜机括盾偶流拍，陈长庚压低斗笠以八枚灵石底价收入囊中，离场果遭专做黑活的器堂弃徒孟逵尾随索要买命钱。陈长庚将其引至山涧乱磁滩，首次放出初蜕一阶的三十六只嗜铁煞甲虫瞬间噬穿孟逵精铁护腕，逼问出修复机括盾偶的火工秘窍后将其灭迹沉潭，携全套锻器箱全身而退。"}, {"n": 39, "title": "恶邻倒渣", "synopsis": "古盐墟开启倒计时逼近，内门世家精锐纷纷下场抢占外门火煞资源赶炼破禁杀器；通窍九窍的内门嫡系曹无极派家奴直接垄断丹房全部紫火炉底灰，连石百川都噤声退让，家奴更踹门限陈长庚三日内滚出丙字废渣房改建私人火工坊。硬顶必死、搬走则彻底断绝地脉潮汐，陈长庚低眉赔笑引家奴查看火坑，暗撬西侧积存十年的铅毒回风板，让倒灌毒烟当场将试火铁片蚀成黑水，再呈上前三任暴毙尸格，诚恳建议曹公子占上风口宽敞的甲字房、留他这贱命杂役在下风口承接排毒尾渣。家奴怕毒气损毁公子法器担责，欣然改占甲字房，反将每日筛剩的高阶赤煞废矿渣尽数倾入丙字排毒槽。"}, {"n": 40, "title": "潜滩核沟", "synopsis": "曹无极在甲字房强抓外门散修试炼血煞破禁锥搞得人心惶惶，陈长庚一面借高阶赤煞矿渣喂助嗜铁煞甲虫完成二次蜕壳、将修为推至通窍七窍圆满，一面趁外门征调杂役修缮大泽南麓水闸，主动报名混入水工队核验修渠草图。清淤至芦苇断崖时，督工执事畏惧水底乱磁瘴气抓阄逼杂役下水摸桩；陈长庚仗着七窍横练屏息潜入三丈浑水，绕过明面木桩亲手摸到那道被百年黑卤封死的废弃排卤暗沟铁栅，确认仅容单人钻入且正处大宗封锁阵眼盲区！浮出换气时恰撞见督工执事私吞修闸灵石灭口知情水工，他悄然潜回浅滩拎起一篓泥鳅憨笑交差，将这条独门夺宝生路死死藏入心底。"}, {"n": 41, "title": "借煞淬骨", "synopsis": "内门九窍嫡系曹无极霸占上风口甲字房日夜赶炼血煞破禁锥，连折两名试器杂役后嫌火坑排毒不畅，掌炉恶奴屠满仓提着铁链踹开丙字房大门，要把陈长庚拖去充当第三名试锥苦力。陈长庚早在听见惨叫时便将腐骨硫泥涂满双臂烫出脓泡假象，当面弓腰剧咳露出满臂恶臭毒疮，谦卑指点屠满仓只需凿通两房地底回流暗槽即可借丙字废坑泄走淤煞。屠满仓嫌他脓血晦气怕污了公子法器，骂骂咧咧命人砸通暗槽退走；陈长庚关门洗去硫泥，反借倒灌而入的高纯度血煞余火催动石臼析晶，将井煞锻骨中卷飞速推向大成。"}, {"n": 42, "title": "残盘识眼", "synopsis": "原来曹无极暗命屠满仓偷摹外聘寻脉客卿苏清晏的避风阵胚，试炼炸裂后当废渣冲入暗槽。苏清晏一袭素衣孤身踏入废渣谷清查地脉流向，屠满仓抢先带家奴赶到倒打一耙，一口咬定是丙字房病杂役偷盗阵胚。陈长庚早抹净自身痕迹，双手捧出残玉盘，不辩冤屈，只按乌卤盐场观烟断火的本事低声报出昨夜子时甲字房回风逆冲并混有赤铁砂的异状。苏清晏捻起槽底湿泥一嗅便断定血煞源头在甲字房，反手催动三枚铁钎布下寒煞逼得屠满仓吐血赔罪退缩，清冷目光却落在了这个能凭烟色辨地脉走向的灰衣杂役身上。"}, {"n": 43, "title": "寻馆试针", "synopsis": "三日后陈长庚以敛息术将气机压在虚浮四窍，挑着两篓筛净的干炉灰赴寻脉馆应卯，正撞见内门另一名九窍世家精锐梁世勋带人围堵厅堂，逼苏清晏交出古盐墟外围堪舆图并入梁家队伍。苏清晏冷声回绝，借收灰之名唤陈长庚入侧室，暗用三枚地磁铁钎在地面布下乱磁迷步禁试探其根底。陈长庚忍住横练气血本能，全凭早年在盐场下毒烟盲井贴地辨风的老经验踩准死角卸去磁力，稳稳放妥灰篓。梁世勋怒斥贱役碍眼，苏清晏却看中他修为低微易于掌控且善识地瘴，当场拿客卿令调他专司寻脉馆炭灰。"}, {"n": 44, "title": "假图挑虎", "synopsis": "面对梁家随从五日交图的催命通牒，陈长庚深知真偷苏清晏阵图必死、硬拒梁家亦难安生。当夜他先借地脉潮汐用石臼提纯甲字房排下的高阶血煞渣，吞服整撮无瑕道髓晶砂一举冲破通窍第八窍，五脏六腑尽数淬出暗金韧性；随后他临摹先前那半块废玉盘残纹，故意将甲字房密炼血煞破禁锥的地火节点标成苏客卿重点查勘标记，按期交给梁家随从。梁世勋见图大怒，认定曹无极早已私吞苏氏阵图抢炼破禁重宝，当即派精锐暗桩日夜死盯甲字房，两家内门势力剑拔弩张再无暇顾及陈长庚。"}, {"n": 45, "title": "咳血落榜", "synopsis": "纳贡院正堂内，冯保山捧着紫砂茶壶慢条斯理开价：凡榜上杂役交足二十枚下品灵石验资费便可改调后勤，否则三日后编入曹无极麾下头拨探路死士营，堂外卢耀已拎着铁锁冷笑候押。陈长庚分文不露，上前叩头时猛然逼出提前含在舌底的铅毒黑血瘫倒抽搐；恰逢丹房副管事石百川火急火燎赶来索要筛砂熟手赶制避瘴丹，陈长庚趁乱塞给庞书办两块碎灵石低语“将死废人进墟不够蚀骨风吹半刻，反坏冯管事足额交差的名声”。冯保山权衡利弊，大笔一挥改将丹堂记名学徒窦文焕顶上死士榜，却顺手扣掉了丙字房下月七成炭火银。"}, {"n": 46, "title": "隔门讨价", "synopsis": "苏清晏强行推演古盐墟地磁死禁遭反噬受创，又看透梁世勋与曹无极皆欲在入墟后拿她祭旗夺图，唯独这个被外门视作废人却熟知大泽毒脉的陈长庚不沾世家派系。她隔着半掩铁门直截了当抛出五枚灵石，雇陈长庚入墟替她辨识地底毒瘴水道。陈长庚嗅出她呼吸微滞却半字不提以免招忌，只苦着脸摊手哭诉三四窍贱命进墟必成枯骨，在短短十余句交锋中寸步不让，硬逼苏清晏退让一步，先行取出古墟外围避风残图一角与一枚高阶敛息玉符作订金。借油灯火光一扫残图水脉走向，陈长庚心头剧震——自己那张前代排卤暗沟草图果真直插苏氏目标石窟腹地！"}, {"n": 47, "title": "塌窖藏偶", "synopsis": "甲字房血煞破禁锥失控炸毙两名试器杂役，内门执法执事率铁卫连夜封谷核查。屠满仓为替曹无极掩盖私用活人祭器的罪责，当众反咬丙字房排毒暗槽沼气倒灌引发炸膛，领着铁卫直扑丙字房地火坑——坑底暗格正藏着青铜机括盾偶与三十六只二蜕煞甲虫！千钧一发间，陈长庚在铁卫撞门前三息暗运八窍横练劲震塌东侧陈年废灰窖封死暗格，自己滚满灰血爬出叩头喊冤，引执法执事查验暗槽内残存的曹家独门血煞铁屑，并指认石槛上苏客卿亲手钉下的试脉铁钎作证。执法执事不愿得罪天阵宗客卿与梁家眼线，当场重鞭屠满仓三十铁鞭罚俸半年结案。"}, {"n": 48, "title": "芦沟灭口", "synopsis": "距古盐墟开启仅剩半月，陈长庚趁夜换装潜入山脚乱石集，找贺九斤交割重金预订的八枚改良过载烈阳火珠、两只封晶寒玉小匣，并借火精炭将乌金刺胚锻成破甲分水刺。不料受罚怨恨的屠满仓竟私通玄煞门潜伏黑市的通窍八窍毒贩苗五指，在返程必经的黑芦沟张开腐骨铁网合围截杀，逼问寻脉馆阵图底细。陈长庚半句废话不讲，首次全开八窍锻骨横练，祭出嵌满无瑕髓晶的青铜机括盾偶硬扛苗五指毒砂掌，三十六只二蜕嗜铁煞甲虫眨眼咬穿铁网钻碎屠满仓护心铜镜，乌金分水刺贴身一击洞穿苗五指咽喉，焚尸沉泥不留寸迹。"}, {"n": 49, "title": "借钟拔钉", "synopsis": "握着发烫的玄煞门传讯骨牌，陈长庚瞬间算清利弊：若亲自去刑律堂检举必被追问黑夜外出行踪与八窍毒贩死因。他当机立断潜至外门巡山堂卢耀值守的西岗哨塔，放两只二蜕煞甲虫悄无声息蛀断塔顶警戒铜索，趁卢耀醉卧打盹将发烫骨牌塞进其腰间酒葫芦底座夹层，退至半里外山脊一箭射响铜钟急警！云泽宗内门战船闻警合围黑芦沟水寨与玄煞门死士展开惨烈夜战，督查长老循骨牌波动在卢耀身上搜出铁证，震怒之下当场废去卢耀全身气窍押入死牢候斩，替陈长庚干干净净拔掉了这颗外门毒钉。"}, {"n": 50, "title": "血契锁界", "synopsis": "因玄煞门死士渗入大泽腹地，内门庶务执事赵怀恩颁下铁令：凡寻脉客卿及登记在册熟识大泽水文的外门杂役，明日一早全员押赴大泽南岸军营待命，敢避役者立斩。梁世勋趁机派人逼苏清晏并入梁家队当破禁附庸；陈长庚当夜主动踏入寻脉馆，褪去病相展露“通窍六窍”气机与半截大泽水工文牒，拒签卖命主仆契，冷静提出改签平等地脉血契：入墟后他负责避毒引路至内窟门户，所得灵物三七分账，一旦撞上开脉死禁或内门高手火并清场，双方各逃各命绝不拖累。苏清晏审视着这个把生死账算到骨子里的杂役，咬破指尖凝血成契，将半幅真本避风阵图推过桌案。"}, {"n": 51, "title": "拔营藏臼", "synopsis": "次日辰时全营拔发，外门纳贡院在登船栈桥设卡核验行囊，冯保山捧着茶壶眯眼督查，借清点违禁品之名狠刮随行杂役攒下的保命碎银，见陈长庚竟没死还跟在苏客卿身后，当即招手命书办翻检其背篓。陈长庚早料到这一关，提前将蚀纹石臼、机括盾偶与寒玉匣裹上三层腥臭乌卤毒泥封入寻脉馆试阵废炭箱最底层，自己背上只背一只装满旧铁勺与苦药渣的破竹篓，还躬身递上两包“苏客卿赏剩的润肺茶”赔笑认穷。冯保山翻出满篓穷酸杂物嫌脏挥手，苏清晏更冷面亮出内门寻脉铜令护住试阵炭箱直接免检登船。"}, {"n": 52, "title": "驻营分帐", "synopsis": "南岸大营旌旗蔽日，内门庶务执事赵怀恩看人下菜碟，故意把无靠山的苏清晏寻脉小队分派到紧挨乱磁滩涂的下风口烂泥坳；营帐刚支起，曹无极便带人登门索要避风阵图副册，遭苏清晏冷拒后一掌震碎半边帐门扬长而去。旁人皆畏惧泥坳蚀骨瘴气，陈长庚却默不作声抡锤修补木桩，借铁钎入土三尺精准探出泥坳正下方贴着一条古盐墟外溢的地煞潮汐支脉！入夜后他借滩涂天然毒瘴与隔味阵盘双重遮蔽开启蚀纹石臼，炼化苗五指遗留的八窍煞囊，一举将修为推至通窍八窍后期，气血雄浑远超同阶。"}, {"n": 53, "title": "瘴滩反猎", "synopsis": "窦文焕自知进了探路死士队必死，怨恨陈长庚滑脱顶替，偷摘贴身祖传玉扳指重金买通两名随营听调的通窍九窍老散修，趁夜摸入烂泥坳欲打断陈长庚四肢扔进毒泥潭泄愤。陈长庚早凭苏清晏那半幅避风阵图摸透帐外三丈的隐形乱磁风眼，故意捂胸剧咳往浅滩芦苇退逃，算准步距扬手撒出一把磁铁砂引偏煞风！冲在最前的九窍散修护体劲气当场扭曲，被无形风刃削去半边肩胛，另一人惊骇急退时迎面撞上陈长庚贴地甩出的两枚过载烈阳火珠与乌金分水刺，哼都未哼便爆碎咽喉。陈长庚搜空两人储物袋，塞入一枚玄煞门残镖，拎着吓疯尿裤的窦文焕扔回丹堂营门高喊抓获通敌内应。"}, {"n": 54, "title": "三强议饵", "synopsis": "器堂真传大弟子霍千山（通窍九窍巅峰）携内门长老手令升帐议事，召集曹无极、梁世勋及各房客卿划定入墟序列。帐内三强表面共商抵御玄煞门渗透，实则句句机锋都在争夺古盐墟中层石窟唯一一株明面破境奇物“赤煞伴生莲”的归属，并霸道拍板将外门杂役与外聘客卿混编为前三拨“破瘴先遣队”替内门精锐蹚雷。苏清晏被强排在第二梯队破阵口，陈长庚垂首立于帐角添茶，从三人争抢的中窟路线图与靴底泥迹断定：三大内门霸主谁都不知道中窟之下还有底窟整条地母玄晶矿髓，更不知断崖水底那条废弃排卤暗沟！"}, {"n": 55, "title": "卸劲演庸", "synopsis": "霍千山生性多疑狠辣，见天阵宗出身的苏清晏身边只带一名不起眼的外门杂役，疑心此人是苏家暗藏的九窍死士护卫，一缕凝练赤炎劲毫无征兆直透陈长庚琵琶骨！电光石火间，陈长庚体内八窍横练劲悄然回旋卸去七成暗劲，却故意顺着余力狼狈撞翻茶案滚出帐门，张口喷出一蓬舌底淤血，显露出敛息玉符精准锁死的“通窍六窍虚浮气机”与满手熬卤黑茧。曹无极在旁嗤笑霍千山跟个废渣房筛灰苦力疑神疑鬼，霍千山搭脉验见其经脉混杂陈年铅火毒，方才冷哼收手。回帐后陈长庚反用石臼逼出那缕精纯赤炎劲吞炼，修为水到渠成臻至通窍八窍圆满！"}, {"n": 56, "title": "伙房密讯", "synopsis": "陈长庚借去伙房领干粮之机，在柴垛暗影里与扮作送菜脚夫的贺九斤短促交接，爽快付给五枚下品灵石买下其冒死截获的密报：邻派玄煞门与血河宗已重金买通随营两名散修向导，定于古盐墟开启第三日正午引爆正门承重石梁，将云泽宗内门精锐全部活埋在窟内！贺九斤苦劝陈长庚趁今夜暴雨钻芦苇荡逃命，自己拿了这笔养老钱便彻底收山。陈长庚冷静盘算：私逃必遭宗门铁骑追杀且永失开脉机缘，而敌宗炸塌正门恰能替他堵死外头开脉境接应长老的视线，让他从容走水底暗沟独吞底窟玄晶！他重谢送别贺九斤，回帐以水工经验隐晦点醒苏清晏多备三副破岩铁钎防石门塌陷。"}, {"n": 57, "title": "夜潜蚀栅", "synopsis": "距古盐墟开启仅余三日，大泽水位退落令断崖下那道废弃排卤暗沟铁栅距水面不足一丈，上方却多了赵怀恩增设的困水铁索与夜哨。陈长庚深知等窟内火并逃命时再破千斤锈栅必成活靶，遂趁子夜暴雨换防的半刻钟死角，佩敛息玉符贴泥滑入刺骨黑水，避开锁链铜铃摸至暗沟口。他不动半点金铁声响，放出二十只二蜕嗜铁煞甲虫钻入铁栅合页死角啃空粗铁轴心，仅留最外一层薄锈皮撑住原样，随后在沟内岩缝藏妥一只装有备用火珠与寒玉匣的油布包，彻底铺平单向脱身生路。"}, {"n": 58, "title": "借瘴葬卫", "synopsis": "梁世勋的九窍水鬼暗卫奉命潜入断崖水底私埋截杀苏清晏的锁魂水雷，手电萤石再往前探三尺便会照见铁栅合页上的虫咬新痕！陈长庚伏在烂泥底屏住呼吸不露半点杀气，算准暗卫低头绑雷的刹那，以乌金分水刺无声挑破暗沟下方沉积百年的天然剧毒黑卤囊，同时指派三只煞甲虫贴水咬穿暗卫腰间闭气皮囊！浓黑卤毒瞬间翻涌糊眼，暗卫吸毒痉挛手一抖，怀中已拔销的锁魂水雷轰然贴胸炸开将其撕成碎肉！崖顶铁卫惊慌赶来，见水面翻滚剧毒黑泡与碎裂雷壳，认定是敌宗水鬼偷埋水雷误触百年毒囊暴毙，当即划为绝命禁区严禁兵卒踏足。"}, {"n": 59, "title": "祭旗立威", "synopsis": "地磁退潮前一日，沉渊大泽外围裂开数道细小煞缝，霍千山、曹无极、梁世勋披甲登台点兵，命赵怀恩将疯癫的窦文焕等十名死囚杂役推入裂隙试测磁压。一名混在其中的九窍亡命散修妄图祭出飞剑凌空逃窜，刚离地半丈便因体内灵力引动乱磁轰然爆体化作漫天血雾，窦文焕亦被蚀骨风刮成白骨，当众血证古墟严禁开脉及御空铁律！曹无极随即冷笑点名，命苏清晏与陈长庚明日排在世家精锐前头破第一道蚀骨风障。苏清晏冷面应战回帐核对阵旗；陈长庚默默将八枚过载火珠、机括盾偶与虫囊贴身扣紧，把外露气机微调至刚够跟进内层又毫不惹眼的通窍七窍初阶。"}, {"n": 60, "title": "裂渊踏煞", "synopsis": "十年一遇的地磁大退潮正式降临，沉渊大泽百丈黑水向南北轰然倒卷，露出遍布惨白盐晶与乱磁电弧的地底“沉渊古盐墟”主裂口，三十六个时辰合拢死限当场起算！霍千山、曹无极、梁世勋各率本脉精锐与先遣苦力蜂拥压上石阶，两名被敌宗买通的散修向导混在人群中段悄然留下骨粉暗记。陈长庚背着沉重铁箱紧跟苏清晏右后方半步，跨过入口乱磁光幕时故意脚下一软闷哼踉跄，任由急于抢占头筹的梁家世家子弟骂骂咧咧一脚踹开他抢先冲入浓雾翻滚的盐晶长廊，低垂的眼眸已借苏清晏阵旗微光将前路三处风眼与藏身盲区尽数锁死。"}, {"n": 61, "title": "风眼试雷", "synopsis": "两名抢功的梁家八窍精锐被暗掺血河宗腐髓砂的蚀骨风眼蚀穿铜盾惨死，梁世勋恼羞成怒斥责苏清晏藏私，当众喝令背箱的陈长庚顶铁盾钻进风道试探宽窄。陈长庚低眉哈腰应声上前，刚迈半步却故意让扁担铁钩挂住头顶松动的卤晶钟乳，喀嚓坠石瞬间引偏一股侧逆阴风，贴着梁家管事头皮削飞其半截发髻！苏清晏趁机冷声断喝乱闯必致整条盐廊塌方，霍千山为保苏清晏留力破中窟大阵，强压梁世勋改由三家各自驱赶雇来的亡命散修轮流探路，陈长庚则从融化的盾沿嗅出了敌宗毒砂痕迹。"}, {"n": 62, "title": "岔殿揪鬼", "synopsis": "霍千山下令封锁分卤岔殿清查内鬼，被玄煞门重金收买的散修向导邓老七眼见败露在即，抢先一指队尾陈长庚挑着的黑泥炭箱，诬陷这外门杂役沿途偷撒骨粉引敌。曹无极手下当即拔刀上前要劈箱搜检！一旦开箱露底便是死局，陈长庚却不护箱硬顶，只惶恐跪请霍千山查验各人靴跟——盐场老人都懂骨粉混入防磁卤油遇寻脉磁针必泛绿光。苏清晏屈指弹针，邓老七靴底霎时腾起刺目绿烟！败露的邓老七猛捏碎一颗乱磁烟珠掩护，嘶吼着冲入东侧卤道呼唤玄煞门褚横山接应。"}, {"n": 63, "title": "毒匕留痕", "synopsis": "这名混在梁世勋随从里的九窍刺客专挑苏清晏引针定磁的旧伤空档发难，苏清晏旋身两枚铁钎钉穿其琵琶骨，刺客吃痛借势横掠，毒匕改抓看似最弱的陈长庚欲挟持脱身。陈长庚骇然跌坐举起炭箱木沿硬挡，借箱底撞击之震悄然按动机括，一枚淬满百年黑卤麻毒的细针无声没入刺客腕脉！刺客指尖一僵慢了半息，苏清晏第三枚铁钎已精准贯穿其咽喉。梁世勋怕驭下不严担责，抢步上前劈碎尸首头颅想毁迹，苏清晏却深深看了一眼陈长庚炭箱恰好卡死刀路的倾斜角度。"}, {"n": 64, "title": "分道弃卒", "synopsis": "得知玄煞门与血河宗已抢先扑向中窟，霍千山等三人决意抛下外门采药队改走近道磁雷盐桥，强令丹堂管事石百川率老弱杂役留守岔殿吸引敌宗血兽。曹无极冷笑逼苏清晏交出副图并把累赘脚夫陈长庚留给石百川凑数；苏清晏寒声指明罗盘须本人心血催动、缺了箱中定磁火炭寸步难行，陈长庚更识趣地捂胸咳血，主动替曹家护卫分挑两袋破禁铁砂。曹无极盘算过桥正好拿这主仆二人试探雷弧，方才冷哼放行，石百川则在殿后怨毒咒骂不止。"}, {"n": 65, "title": "断桥借蝠", "synopsis": "嗜血磁蝠群裹挟乱磁电弧扑上窄桥，曹无极一把抓过身旁丹堂学徒挡刀，抬脚便要将陈长庚连人带炭箱踹下深渊减重！陈长庚早防他这一手，顺势松开箱外挂着的诱饵麻袋——袋内塞满丙字房攒下的滚烫硫铅毒渣，刺鼻硫腥瞬间引得成群磁蝠调头疯扑曹无极后背，逼得曹无极狼狈连烧两张护身灵符开路！趁桥尾崩塌烟尘遮天，陈长庚一把拽住苏清晏袖角跃向下方三丈处的凸出盐台，精准滚入前代草图标注的西偏废矿廊，彻底摆脱三大恶霸的监视。"}, {"n": 66, "title": "暗廊摊筹", "synopsis": "咽喉抵着铁钎，陈长庚非但不摸火珠，反而坦然摊开满是黑茧的双手，直言自己为免被曹无极抓去炼邪器才隐瞒了七窍锻骨横练与半张盐工旧廊图，若真是梁家细作方才桥头松手她早已坠渊。接着他目光落向苏清晏渗血的左袖，平静算清利弊：她旧伤未愈，单凭一人绝破不开前头苏氏先祖留下的残阵死禁，而他这无派系外人恰是最守信的破禁帮手。苏清晏核对旧廊方位与祖传残记分毫不差，终收起铁钎吐露实情：内窟侧翼埋着苏氏先祖坐化古阁，藏有《地脉堪舆总图》残卷，议定先取古阁再赴内窟。"}, {"n": 67, "title": "隔岸观火", "synopsis": "透过排烟石缝俯瞰废卤坑，三名玄煞门八窍好手正割肉逼供石百川。石百川贪生怕死，不仅把霍千山走盐桥的路线卖了个底掉，还主动供出坑底旧窑暗藏一批丹堂私扣的高纯地火精石求饶！待玄煞门修士撬开窑底见宝起杀心挥刀时，石百川凶性大发引爆袖中赤铅毒囊糊瞎一人，自己亦被当场劈翻。眼看坑底余下二人中毒剧咳，陈长庚果断打手势请苏清晏三钎封死逃生风口，自己屈指甩下一枚过载烈阳火珠轰塌窑壁，跃下补刺灭口，将精石与四只储物袋尽数笑纳。"}, {"n": 68, "title": "拔桩反埋", "synopsis": "抵近半埋岩壁的苏氏堪舆古阁，苏清晏果在门前地脉节点验出玄煞门阵师暗钉的九阴反磁桩——凡携苏氏血脉信物靠近或强拔铁桩，必引乱磁爆裂并惊动中窟的褚横山。苏清晏欲咬破舌尖燃耗本命精血强行镇桩，陈长庚却伸手拦住，直言她留着心血破内窟死禁更值钱，随即借浓雾掩护放出二十只二蜕嗜铁煞甲虫钻进土缝，悄无声息蛀断桩芯三处导磁铁纹而不伤表层灵路！苏清晏眸光微震，压下惊异顺势倒插阵旗逆转磁极，将这根夺命桩改成了专炸后来追兵的连环雷。"}, {"n": 69, "title": "古阁取图", "synopsis": "古阁祭坛前，八十年前坐化镇脉的苏氏族老遗骸受乱磁侵蚀化为八窍巅峰铁盐尸傀，周身盐甲坚逾精铁，苏清晏三枚破禁铁钎射中肋骨竟尽数崩飞！尸傀嘶吼扑向强取玉卷的苏清晏，千钧一发之际，陈长庚拍活青铜机括盾偶横身死死卡住尸傀双爪，自己仗着八窍圆满锻骨劲欺入怀中，凭熬卤匠辨气绝活，一记乌金分水刺精准扎穿尸傀颌下唯一未曾矿化的泄煞软孔将其钉毙！苏清晏收妥祖传总图残卷，守约将坛上三只上古寒玉封匣与整袋百年凝卤髓渣划归陈长庚抵三成分账。"}, {"n": 70, "title": "借潮破九", "synopsis": "阁外反磁桩当场炸毙三名梁家精锐，唯独通窍九窍的追猎统领郭断山仗着重甲捡回半条命，见苏清晏在阁内调息、门口只挡着“七窍杂役”陈长庚，狞笑着抡起混磁铁锏直砸陈长庚天灵，欲擒苏清晏回去逼婚邀功！陈长庚先放煞甲虫咬卡铁锏磁枢，故意用玄铁护心镜硬受一记余波吐血后仰诱敌欺近，贴脸甩出两枚过载烈阳火珠将其头颅炸成焦炭！乱石封死甬道后，恰逢蚀纹石臼三十六时辰潮汐充能圆满，陈长庚在侧室开启隔味阵盘炼化百年凝卤髓渣，吞下大把无瑕髓晶一举冲开第九处主气窍，多余晶砂尽封寒玉匣！"}, {"n": 71, "title": "莲台群狼", "synopsis": "中窟断渊前杀气如沸，霍千山、曹无极、梁世勋据守南岸，隔着滚沸黑卤沟与玄煞门褚横山、血河宗樊九皋对峙。见苏清晏与陈长庚从侧道现身，梁世勋眯眼质问可曾撞见自家追猎小队并逼苏清晏立刻破开莲台磁障；陈长庚惶恐呈上在废卤坑缴获的半块染血玄煞门腰牌，哭诉西廊全是褚横山伏兵，成功令梁世勋将账算到褚横山头上。苏清晏验看莲台断定尚差六个时辰成熟，强摘必成剧毒废草，五方霸主各怀鬼胎暂罢刀兵，曹无极却在转身时向陈长庚递来致命脏活。"}, {"n": 72, "title": "双面递钉", "synopsis": "夹在曹无极灭口威胁与霍千山多疑杀心之间，陈长庚半点不为曹家火中取栗。他借去南岸崖边搬运压阵卤石之机，暗将曹无极毒钉上刮下的一抹独门血炼封蜡粘在霍千山阵角碎石上，故意踩松石块引霍千山副手低头查验，自己则原封不动退回向曹无极哭诉霍师兄寸步不离阵桩无从下手。霍千山验出血蜡震怒不已，不动声色移开阵眼并在曹无极侧翼反埋三颗赤火地雷！陈长庚则趁俯身拾石探明渊底三丈外那道封死排卤暗沟的百年石壁，把退路摸得一清二楚。"}, {"n": 73, "title": "驱蛟乱阵", "synopsis": "受活人精血刺激的双首卤甲蛟蜥掀起漫天酸卤扑向南岸防线，霍千山厉喝结阵迎敌，梁世勋却脚底抹油后撤，伸手便抓身侧陈长庚的后领想扔进兽口替自己挡酸雾！陈长庚假意被气浪掀翻躲入裹泥的机括盾偶后，指尖顺势将一撮二蜕煞甲虫蜕壳腥粉弹上梁世勋腰间温玉佩！被酸雾迷眼的蛟蜥嗅到异虫腥气瞬间暴走，甩开旁人一口咬碎梁世勋半边灵甲，逼得他肉痛捏碎家族保命玉符才捡回性命！就在蛟蜥翻搅沟底之际，苏清晏眸光骤凝，一指水位暴跌后显露的莲根下层古拱门！"}, {"n": 74, "title": "隘口卡位", "synopsis": "五方人马抢至内窟青铜石拱前，却被一道狂暴的地磁锁龙禁死死拦住去路，谁敢硬劈便遭乱磁反震吐血。褚横山隔门重金招揽苏清晏倒戈，霍千山则将赤炎战戟重重顿在她身侧以势相逼。苏清晏面若寒霜寸步不让，当众划下硬条件：破禁后她只拓取左壁先祖阵纹、绝不染指伴生煞莲，但五方必须退开三十步，且只准她的杂役陈长庚入拱门扶定磁铁钎。两派高手急于进窟抢宝，各自冷笑后撤暗蓄杀招准备门开卸磨杀驴；陈长庚则低头扛钎踏上拱门石阶，正式切入内窟生死局。"}, {"n": 75, "title": "内窟开封", "synopsis": "摸清头顶石梁确系敌宗定时活埋杀局，陈长庚借锤击铁钎敲出先前与苏清晏约定的三短一长塌方警讯。苏清晏心领神会，收旗破封瞬间故意偏转半寸阵眼，令内窟大门仅裂开一道只容单人侧身挤入的乱磁风帘！门后赤雾散开，高耸石笋顶端一株九瓣赤煞伴生莲正流转异香！早已按捺不住的曹无极率先撕毁盟约，一记血煞破禁锥偷袭褚横山后背，纵身抢向莲台！霍千山、樊九皋、梁世勋瞬间怒吼混战成一团蜂拥挤入，苏清晏与陈长庚顺势被气浪掀落底层乱石阴影，悄然摸向窟底灵脉源头。"}, {"n": 76, "title": "煞莲混战", "synopsis": "内窟高台杀声震天，霍千山与褚横山硬拼数记战戟难分高下，扑向侧翼的曹无极却一脚踩爆霍千山先前因血蜡暗记预埋的赤火地雷（第七十二章伏笔），炸得左臂血肉模糊，疯吼着与霍千山、梁世勋自相残杀起来！窟底断柱后，苏清晏验明整条紫金地母玄晶被一层极其霸道的“太古磁髓死禁”锁死，死禁阵枢恰压着先祖遗留的下半部堪舆核心图纹与底层排卤石壁。二人正分工布设隔音磁旗准备强破死禁，一道腥风突然贴着底层岩壁绕柱袭至！"}, {"n": 77, "title": "盲区瞬杀", "synopsis": "一旦让邬千手喊出半个字引下五名九窍巅峰霸主，地母玄晶与两人的命都得交代在此！陈长庚眸中寒芒暴涨，不等两具铁甲血尸合围，通窍九窍气血轰然全开，一步跨出抡起青铜机括盾偶将两具血尸死死撞嵌进磁岩，三十六只二蜕嗜铁煞甲虫如黑电扑上咬穿邬千手护喉铁领，生生截断其呼哨！邬千手骇得魂飞魄散，没料到这挑箱杂役竟是九窍体修，刚摸出遁血符，已被陈长庚乌金分水刺贯碎丹田、贴腹闷爆一枚火珠化作焦灰！一旁护阵的苏清晏瞳孔微缩，首次看清这外门杂役藏得何等惊人。"}, {"n": 78, "title": "塌门困兽", "synopsis": "万钧乱磁巨石彻底堵死内窟正门！玄煞门外应长老竟连自家褚横山与血河宗盟友一并舍弃，誓要将云泽宗年轻一代精锐尽数活埋绝地！死局之下五强彻底疯狂：褚横山抢下半株伴生煞莲钻入上层风缝，霍千山与梁世勋红着眼紧追截杀；断了一臂的曹无极则在碎石门前与樊九皋拼命搏杀。受炸门震动牵引，古墟岩壁咔咔挤压，距地脉彻底合拢已不足八个时辰！正门断绝，唯有破开太古磁髓死禁打通底层排卤石闸方有一线生机，苏清晏当即逼出心头精血全力叩阵！"}, {"n": 79, "title": "强破死禁", "synopsis": "苏清晏立于阵枢寸步难移，见吞服燃血丹暴涨至半步开脉凶威的曹无极狂扑而来，厉声让陈长庚替挡十息或按血契独自逃命！陈长庚瞬间算清利弊：此刻弃她，不仅拿不到死禁下的地母玄晶，后段水底乱磁暗渠缺了堪舆术亦十死无生！他半句废话不讲，横推青铜机括盾偶硬迎曹无极血锥——盾偶当场炸成碎铜，陈长庚凭九窍锻骨体与玄铁护心镜硬扛余波喷血不退半步，反手甩出三枚串联过载烈阳火珠轰入曹无极断臂空门将其逼退三丈，硬生生抢出苏清晏拍碎太古死禁的最后一息！"}, {"n": 80, "title": "喂晶夺路", "synopsis": "苏清晏遭死禁反噬昏死坠地，血河宗樊九皋恰越过焦黑惨叫的曹无极挥刀扑向晶坑欲连人带宝通吃！电光石火间，陈长庚一脚挑起地上曹无极失手跌落的血煞破禁锥，精准踢进两人中间尚未散尽的太古死禁残余磁雷弧！邪器撞引狂暴磁雷轰然贴脸炸开，当场将重伤的曹无极与措手不及的樊九皋双双撕成血雾！陈长庚毫不停留，搭脉探得苏清晏心脉将绝，当机立断开匣喂她吞下一撮无瑕道髓晶砂锁住生机，同时倾巢放出三十六只嗜铁煞甲虫扑向晶坑后壁，疯狂啃穿连通排卤暗沟的百年封石！"}, {"n": 81, "title": "封壁嫁祸", "synopsis": "霍千山提着褚横山首级自上层风缝杀回内窟，恰撞见坑底紫金霞光敛没，重伤未死的梁世勋亦红着眼从斜刺里扑下抢宝！陈长庚半息不缓，挥乌金分水刺撬起整条地母玄晶主髓塞入三只古寒玉匣，一把背起昏迷的苏清晏钻进虫群咬穿的排卤暗沟。霍千山怒掷赤炎重戟轰塌坑壁欲封死去路，梁世勋则绕向侧翼风口堵截；陈长庚临入洞前反手将一块沾满曹无极精血的伴生空晶壳抛在梁世勋脚边，引爆备用硫雷袋炸塌石壁断后，令杀红眼的霍千山认定梁世勋同党私吞宝髓，两强当场在废墟上死磕起来。"}, {"n": 82, "title": "暗渠抵账", "synopsis": "苏清晏醒来察觉心脉竟被一团毫无丹毒的精纯髓力护住，又见陈长庚未按血契弃她独逃，指尖铁钎微顿。陈长庚平静交底：前方古排卤沟有三处乱磁水漩，缺她堪舆辨位谁也出不去，救她即是自救。话音未落，被霍千山打成血人的梁世勋侥幸跌入上方渗水竖井，听见水响便狂撒腐骨血砂逼二人献宝垫背！苏清晏咽下逆血轻叩陈长庚肩头指路，助他三步跨入风眼死角，同时隔水弹针引偏暗沟磁涡，将梁世勋连人带砂卷入岔道死渊，随后在石台上将半部真本《地脉敛息阵图》抵给陈长庚清账。"}, {"n": 83, "title": "推虎填网", "synopsis": "陈长庚摸黑取回先前藏在沟口岩缝的油布火珠包，贴着铁栅窥见两名玄煞门九窍精锐寇铁山等人正用长钩搜刮断崖毒泥——正门炸塌后，敌宗竟连废弃水口也派了暗哨！偏偏浑身焦烂的梁世勋从侧岔冲出，死死拽住水草嘶吼逼陈长庚替他引开敌哨。陈长庚冷眼拔出乌金刺挑断梁世勋手筋，一脚踹碎早被煞甲虫蛀空轴心的百年铁栅薄皮，顺激流将惨叫的梁世勋连同其贴身世家玉佩猛推向寇铁山大网！趁敌探狂喜收网围杀梁世勋激起漫天黑卤毒泡，陈长庚拽着苏清晏贴着断崖底泥无声滑入外泽深水。"}, {"n": 84, "title": "沉髓留引", "synopsis": "许镇岳与玄煞门接应长老在断崖上空隔雾激战，逃回大营的零星幸存者全被铁甲卫圈禁待查。三里外废苇窑内，苏清晏明言天阵宗旧敌环伺，请陈长庚严守她得回《地脉堪舆总图》之秘，坑底其余机缘她分毫不取；同时提醒他开脉长老神念能扫透低阶储物袋与寒玉匣。陈长庚心头凛然，当场依《地脉敛息阵图》泄气法门，将装满八成地母玄晶的两只寒玉匣裹上毒泥沉入大泽水闸暗桩下，只取拳头大一块核心母引塞进毫无灵光的蚀纹石臼，重新封入寻脉馆恶臭试阵废炭箱底。"}, {"n": 85, "title": "掀箱过堂", "synopsis": "沉渊古盐墟轰然合拢，百余入墟精锐仅逃出十之一二。只抢到半株伴生煞莲的霍千山暴怒失态，指认苏清晏与陈长庚断桥失踪必有猫腻，逼执法长老许镇岳当场搜魂验袋！苏清晏呕出心脉黑血，冷掷碎裂祖传阵盘于案，直言二人坠入西偏废廊九死一生爬出，霍千山若想搜天阵宗秘传只管动手！霍千山转而一脚踢翻陈长庚的试阵炭箱，却只见恶臭黑卤泥与两块废硫石；陈长庚瑟缩跪地奉上西廊捡来的玄煞门铜牌，哭诉背客卿躲避敌宗游哨之苦。急于拿褚横山首级回宗请功的许镇岳不耐烦呵退霍千山，下令收兵登船。"}, {"n": 86, "title": "归舟捞宝", "synopsis": "归宗战船气氛森然，曹无极、梁世勋双双陨落的消息令随船执事人人自危。赵怀恩收受霍千山好处，以“清扫功臣舱室”为名强拽陈长庚去器堂底舱，摆明要让他在船上不明不白落水暴毙。陈长庚脚下一软，一口积攒的腥臭铅毒黑血直接喷在赵怀恩锦靴上，舱内苏清晏适时推门冷声宣布续雇陈长庚三日回山拆除寻脉馆余煞阵基，令赵怀恩悻悻缩手。黄昏甲板上，苏清晏低声警醒陈长庚：曹、梁两家长老必拿外门幸存杂役泄愤，不入开脉境终是砧板鱼肉。陈长庚垂眸谨记，当夜船经旧水闸时暗放甲虫收回全部玄晶。"}, {"n": 87, "title": "活人逼捐", "synopsis": "冯保山原以为陈长庚必死于古盐墟，早已收了富户杂役蔡金满十五枚灵石许诺腾出丙字废渣房；见陈长庚竟活着下船，他非但不退赃款，反捧着茶壶慢悠悠下令：因内门曹、梁两脉折损嫡系，凡生还杂役须在五日内补缴十枚灵石“修炉抚恤捐”，逾期削籍发配黑水死矿！紧接着曹无极叔父、内门开脉执事曹敬塘的家奴又闯入废渣谷盘问死因。陈长庚对冯保山点头哈腰求宽限筹钱，转身对曹家奴才泣诉断桥上梁家护卫如何见死不救（与霍千山证词严丝合缝），成功把曹家怒火引向梁氏，回屋即刻锁门催动石臼！"}, {"n": 88, "title": "母引开臼", "synopsis": "石臼吞下地母玄晶母引解锁二阶转化，收尾迸发的霸道腥甜气咔嚓震裂黑市旧隔味阵盘，偏偏纳贡院书办庞文禄正带人摸到院墙外，想抓陈长庚连夜卷逃现行好白吞其私财！危急关头，陈长庚依半部《地脉敛息阵图》将三枚试脉钎钉入地火排烟口，一举逆转地煞风压把满屋奇香尽数抽入三丈下的硫火熔坑，顺手掀窗将半篓腐臭湿铅灰哗啦扣在庞文禄头顶，边剧咳边哀求庞书办借两块灵石救命！庞文禄晦气跳脚骂娘逃走，屋内石臼清光微敛，三枚毫无丹毒的紫金“玄脉道晶”赫然成形！"}, {"n": 89, "title": "山亭别钎", "synopsis": "陈长庚依约挑灰赴寻脉馆了结尾差，恰逢赵怀恩借口核验阵损百般刁难扣压苏清晏的离山路引，妄图拖到霍千山长辈出关强留人审问。陈长庚挑着残灰篓低头上堂，故意被门槛绊倒，将半瓢古墟带回的强蚀黑卤泼在赵怀恩暗袋上——当众蚀穿布帛滑出其私瞒许长老截留的三张外门贡票！赵怀恩吓得魂飞魄散，唯恐许镇岳翻脸治罪，咬牙盖印放行。山亭云雾外，苏清晏在石栏留下三枚精炼破磁铁钎，清泠留话“命账两清，云泽水浑，好自为之”，登车绝尘远去；陈长庚躬身目送，转身踏回杀机四伏的外门。"}, {"n": 90, "title": "夜坑葬双", "synopsis": "霍千山因伴生煞莲火毒攻心冲脉失败，疑心陈长庚在坑底捡了寒属性灵粹，密遣器堂两名九窍巅峰心腹狄冲、段千钧三更翻入丙字废渣房捉人搜魂。二人冷笑着踹开内室木门，脚下却骤然亮起陈长庚以苏清晏三枚破磁铁钎布下的反磁困阵，护身飞刀瞬间吸死地面！陈长庚九窍圆满气血轰然爆发，三十六只吞过玄晶碎屑的嗜铁煞甲虫两息啃穿段千钧精铜盾，乌金分水刺一击洞穿其心口；狄冲骇然欲捏碎传讯玉符，被两枚过载火珠炸断右臂，吐出霍千山正闭死关七日压毒的实情后，连人带尸被陈长庚推入地火熔坑彻底扬灰！"}, {"n": 91, "title": "借瘟钉门", "synopsis": "陈长庚吞晶贯通六道窍桥、正待最后一轮石臼潮汐冲破心肺顽障时，花重金买房的富户杂役蔡金满等不及五日之期，塞给庞文禄一块碎灵石提前上门砸锁逼迁！门外铁锤震得炉灰簌簌直落，强行收功必致经脉逆血。陈长庚盘坐内坑纹丝不动，仅屈指拉动西侧十年铅毒回风栓，命三只甲虫咬落烟道挡板——浓紫毒烟轰然倒喷出窗，当场将蔡金满嘴皮燎起一串黑泡！陈长庚隔墙发出嘶哑鬼哭般的咳血声，哭喊自己染了古盐墟腐肺尸瘟求蔡师兄进屋搭把手。蔡金满吓得屁滚尿流大骂庞文禄卖瘟宅，庞文禄忙拿大木板钉死院门等他烂死再收尸。"}, {"n": 92, "title": "九窍贯脉", "synopsis": "六枚无瑕玄脉道晶药力化作滚滚洪流，一举撞碎困扰陈长庚十六年的九窍蒙尘枷锁，九窍首尾相连贯通周天仙脉——寿元暴涨至二百四十载，体表自然凝出寸许暗金地火煞罡，连坑底三十六只嗜铁煞甲虫亦借溢出灵韵彻底凝成一阶巅峰铁甲虫群！他刚破钉门踏入谷外夜雾，恰撞见不甘心侄儿惨死、瞒着刑律堂私潜下山想抓杂役搜魂的开脉初期执事曹敬塘！陈长庚以敛息阵纹裹住面容不发一言，迎面纯凭无属性地火煞罡硬撼一记重掌！曹敬塘虎口崩裂倒退五步，骇然以为撞上执法堂暗哨钓鱼，捂胸仓皇逃窜！"}, {"n": 93, "title": "碎鞭叩殿", "synopsis": "陈长庚深知若藏着开脉修为偷逃必遭通缉，唯有堂堂正正披上内门执事虎皮方能一劳永逸。清晨他步至内外门交界的升仙殿阶前，正撞见巡值的赵怀恩；赵怀恩大怒喝骂瘟房贱役敢擅闯禁地，扬起玄铁鞭当头抽落！陈长庚眼皮未抬，仅放出一缕开脉境护体煞罡，咔嚓震碎铁鞭，磅礴灵压如山岳压顶将赵怀恩当众按跪在青石阶上膝盖骨碎裂！殿内开脉后期长老纪鹤年惊疑迎出，陈长庚恭敬执礼，呈上早用石臼伪造的半块枯竭“地髓异乳”石壳，自陈在古墟西废廊濒死误吞异乳侥幸冲脉。纪鹤年大喜宗门添丁，当即按“凡开脉者不论出身直入内门”祖制开坛验脉！"}, {"n": 94, "title": "反将夺印", "synopsis": "验脉钟声未落，器堂开脉中期执事龚铁横便携脸色惨白的霍千山闯殿发难，一口咬定陈长庚盗走器堂古墟底窟重宝才得以破境，仗着中期威压逼他交出储物袋受审！陈长庚体表煞罡稳如磐石，坦然解下仅装两块残石的旧布袋拍在桌上，转头当着纪鹤年与赶来的许镇岳反问霍千山：“霍师兄在大营当着许长老立誓说晚辈断桥坠沟未入内窟，如今又说我盗你内窟重宝——莫非霍师兄自己吞禁药冲脉反噬，便拿欺瞒长老的假话栽赃新晋同门？”霍千山被自己昔日证词堵死七寸，急怒攻心当堂喷血昏厥！两位长老拍案定夺，正式授陈长庚内门巡脉执事之职！"}, {"n": 95, "title": "藏锋慑曹", "synopsis": "陈长庚接下十日后赴任断界黑石峪的调令，先赴内门库房领足五十枚下品灵石安家俸禄，兑出开脉修士标配的《玄煞凝盾诀》、青鳞灵盾与三柄乌金飞刃。刚出库房，心怀鬼胎的曹敬塘便满脸堆笑迎上来道贺，借搭手试演指点之名暗渡一缕阴寒煞劲，试探他是不是前夜废渣谷那名掌力惊人的蒙面开脉客！陈长庚心如明镜，故意催动新领的大路货《赤卤开脉功》让指尖微颤卸力，满口称赞曹师兄功力深厚。多疑的曹敬塘见状冷汗直流，断定前夜高手乃是陈长庚暗藏的执法堂师长，慌忙塞上十枚灵石贺礼结交退避！"}, {"n": 96, "title": "朱票讨命", "synopsis": "暴雨倾盆浇透外门废渣谷，昨夜在富户酒席贪杯未看内门晨报的冯保山，一早便领着庞文禄与买主蔡金满冒雨撬开丙字房瘟门，准备收尸腾房赚双份黑心钱。谁知铁门撞开，屋内炉冷坑净、连半块碎银都没留下！蔡金满跳脚索退十五枚定金，丢尽老脸的冯保山拍案暴怒，回纳贡院当堂抓起朱笔签下“拘拿畏罪叛逃贱役陈长庚、格杀勿论”的外门红票，还端着紫砂壶向满堂书办吹嘘外门蚂蚁绝逃不出他的五指山。正待用印，被削职断腿的赵怀恩狼狈自雨廊爬过，听见这话犹如见鬼！"}, {"n": 97, "title": "执礼惊堂", "synopsis": "青玉执事袍下摆滴水不沾跨入正堂，冯保山眯眼瞧见内门徽记，忙哈腰赔笑奉茶，转头还冲庞文禄怒喝快去抓那不知死活的陈长庚——话未落音，伞沿微抬露出陈长庚平静冷淡的脸，开脉境周天灵压轰然笼罩全堂！庞文禄手一抖摔碎紫砂茶盏瘫软泥水里，冯保山双膝一软险些栽倒，做梦不敢信九窍蒙尘之人竟能贯通仙脉！他强挤冷汗干笑攀交情称当年分去丙字房是替师叔寻清静福地；陈长庚径直落座主位太师椅，拈起案上墨迹未干的格杀红票，慢条斯理原话奉还：“按宗门老例，外门管事私吞买路与安家灵石、妄发红票拘拿内门执事，冯管事算算该折几成火耗？”"}, {"n": 98, "title": "跪雨称叔", "synopsis": "冯保山吓得魂不附体，冒着瓢泼大雨跑去内门求旧靠山曹敬塘说情，不料曹府管家一听是新晋陈执事，当场拿门棍将他轰出大门严令莫连累曹家！走投无路的冯保山终于尝到体制铁律倒转的刺骨寒意，连夜折价变卖珍藏灵茶庄与为幼子攒了五年的全部私蓄，将当年三十枚买路石与克扣安家石按三倍凑足整整一百二十枚下品灵石！次日天未亮，冯保山便捧着锦盒跪在纳贡院牌坊外的暴雨泥水里，当着数百震惊围观的外门弟子左右开弓狠扇自己耳光，肿着双颊高举灵石颤声高呼：“晚辈冯保山猪油蒙心，请陈师叔收账饶命！”陈长庚撑伞止步檐下，神色漠然收妥百余灵石，半句多余狠话不留转身离去。"}, {"n": 99, "title": "故泽听雨", "synopsis": "距赴任尚余三日，陈长庚借巡查南泽水脉重经乌卤盐场旧址。昔日威风八面的正把头周大昌早已沦为跛脚看门老役，匍匐泥中向天际灵光磕头，浑不知云端青袍仙师便是当年被克扣半两盐的十六岁学徒；镇边葛老栓草院内传出教小徒观火的朗笑，陈长庚隔着细雨将一枚温脉延寿玉坠无声挂上屋檐，不现身惊扰半分。转入黑石坊市，恰逢两名通窍七窍地头蛇砸贺九斤新开的石铺逼收保护费，斗笠遮面的陈长庚微露一缕开脉煞罡吓得恶霸磕头鼠窜，向战战兢兢的贺九斤用五十枚灵石购齐促虫蜕变的赤精铜髓与百枚火珠主材，留下一瓶延寿丹砂飘然远去。"}, {"n": 100, "title": "执印赴边", "synopsis": "启程前夜，器堂实权长老派龚铁横登门“招揽”，笑吟吟许诺只要陈长庚献出断界黑石峪八成暗矿收益作孝敬便可挂名免灾，暗点前两任无靠山执事皆尸骨无存。陈长庚躬身推说误服异乳气脉尚虚，待首月交足宗门正课再登门拜师，实则已从纪鹤年书办处打探到看守偏远地肺废火窟的孤僻器堂长老门路。当夜他用解锁二阶的蚀纹石臼提纯首块黑市废煞矿，将护体煞罡与三十六只吞食赤精铜髓产卵的嗜铁煞甲虫推至巅峰。次日破晓，陈长庚腰悬巡脉铜印，脚踏青鳞灵盾破开云泽山门重重云海，孤身悍然杀向三宗混战的断界黑石峪！"}, {"n": 101, "title": "借烟瓮杀", "synopsis": "二月十八辰末，断界黑石峪谷口赤磷狼烟滚滚，玄煞门开脉初期劫修焦破山与樊缺耳蹲守哨塔残垣只等新执事落地夹击。陈长庚伏于山脊看准北风倒灌死角，先以《赤卤开脉功》凝一缕虚浮青光贴地掠进谷口佯装惊慌救火；双匪大喜合围劈碎残影刹那，陈长庚真身自浓烟盲区暴起，三枚裹满生铁砂的过载烈阳火珠贴脸炸碎樊缺耳铜锤灵罩，三十六只巅峰嗜铁煞甲虫噬穿焦破山护身煞气，破甲分水刺瞬杀樊缺耳并将重伤的焦破山死死钉在碎石坪上。内谷矿道忽冲出器堂驻矿司炉郑百斛率矿卫哭喊救驾，眼珠却直往焦破山咽喉乱瞟。"}, {"n": 102, "title": "哭丧试鬼", "synopsis": "郑百斛一边捶胸痛骂魔门劫修屠戮外卡杂役，一边抢步挥起百炼铁尺欲替陈长庚砸碎焦破山天灵盖灭口。陈长庚横起青鳞灵盾轻巧架住铁尺，推说需留活口审问魔门大队动向，单手提着已被震断舌筋喊不出声的焦破山走入哨房。密室内焦破山受分水刺挑脉剧痛，颤指蘸血写出昨日递信报讯者正是郑百斛，且玄煞门黑风寨开脉中期百夫长乌横岭定于二月二十一日子时来收两成私矿与新执事首级。陈长庚拧断焦破山脖颈焚尸，出屋叹气称贼人死硬暴毙，反夸郑百斛守内坑有功，将矿仓铁钥原样交还。"}, {"n": 103, "title": "废坑摸脉", "synopsis": "二月十九日间，陈长庚深入黑石峪内坑巡视，安抚断指老矿匠岳铁脊等三十名惶恐矿役，顺口问出前两任无靠山执事皆是在查验“三号塌方废洞”次日遭劫修夜袭丧命。陈长庚借口核查地脉独自钻入三号废洞，凭熬卤观火眼力识破乱石堆实为人为垒砌的障眼法，后方暗藏一条高纯火铜支脉与温热铜煞泉眼。恰逢午初蚀纹石臼满三十六个时辰冷却，他以支脉地煞毒烟遮味提纯最后一块二阶废煞黑矿，并将寒铁虫瓮内百余粒紫黑变异虫卵埋进铜煞泉催化破壳，随后揣上两块烂煤石从容出洞。"}, {"n": 104, "title": "假账喂鼠", "synopsis": "面对洞口端酒试探的郑百斛，陈长庚扔下两块伴生烂煤叹气苦笑，直言只想混够半年平调回山，回房便在写着“月度塌耗三成”的旧底册上痛快画押。郑百斛彻底放下戒心，当夜将“新执事胆怯未觉支脉、二十一日子时照约摘头交矿”的密信塞入排风竹管放飞夜枭；陈长庚伏在崖顶敛息截看密信后原样放行，下半夜悄然将三枚寒磁破磁铁钎钉入谷口瓮城风眼，把十枚过载烈阳火珠分埋进必经石缝。次日二月二十傍晚，例行运粮脚夫入谷，车尾却多出一名气息阴冷的灰衣生面孔。"}, {"n": 105, "title": "黑吃黑饵", "synopsis": "混入车队的灰衣客乃是玄煞门乌横岭麾下开脉初期副手，进司炉房便拿以往交接字据威胁郑百斛交出全部私藏精矿。争执间东院忽传出陈长庚演练《赤卤开脉功》岔气闷哼的虚弱动静，灰衣副手贪念大炽，拔刀逼郑百斛当夜引路先宰了新执事独吞安家灵石与悬赏，免得次日被乌横岭分大头。子夜二人摸进东院石室一刀劈碎空被褥，千斤石闸轰然落锁；陈长庚立在廊外冷眼旁观灰衣副手怒砍郑百斛泄愤，待郑百斛肩骨被劈裂倒地，三柄百炼乌金飞刃破窗瞬斩灰衣副手，将吓瘫的郑百斛死死按在血泊里。"}, {"n": 106, "title": "借笔钓虎", "synopsis": "死亡逼命之下，郑百斛竹筒倒豆子招认器堂龚铁横每月靠黑石峪两成暗矿孝敬掌矿鲁长老，前两任执事皆因拒不画押被郑百斛勾结玄煞门乌横岭袭杀平账，并交出炉底暗册与三十枚赃款灵石。陈长庚逼郑百斛按平日笔迹与暗号向乌横岭发出一道“巡脉堂新拨百枚抚恤灵石抵矿、速来独吞”的加急火符，随即将封死气窍的郑百斛押去谷口炉房作饵。二月二十一入夜，三号支脉铜煞泉内百余粒紫黑变异虫卵悉数破壳，啃食缴获的血煞废刀迅速硬化成凶戾紫纹甲虫群。子时前夕，谷外荒原马蹄声骤起。"}, {"n": 107, "title": "瓮谷焚煞", "synopsis": "玄煞门开脉中期百夫长乌横岭生性多疑，率四名精锐抵谷后并未直扑东院，而是先踏入谷口炉房拿刀背挑起郑百斛下巴验话。见郑百斛瞳孔涣散，乌横岭立知有诈，一刀枭首郑百斛便欲抽身退往谷外；陈长庚果断引动三枚破磁铁钎逆转瓮城地煞狂风封死退路，埋入石缝的火珠连环炸乱敌阵。乌横岭狞笑祭出二阶赤煞断魂刀劈开烟浪，自恃中期修为逼近强攻；陈长庚故意用青鳞灵盾硬接两刀踉跄示弱，诱其欺入三丈绝杀圈，骤然放出百四十只新旧煞甲虫啃穿其护体尸煞，破甲分水刺配四枚过载火珠贴胸轰爆。"}, {"n": 108, "title": "斩将立旗", "synopsis": "乌横岭捏碎血遁骨符化作红光窜向崖口刹那，陈长庚早埋在半空的三柄百炼乌金飞刃呈品字形绞碎其双膝，欺身上前一刺洞穿其眉心，再御青鳞灵盾追出谷外将四名吓破胆的通窍喽啰逐一灭口。清点战利品，共得二阶下品赤煞断魂刀、百二十枚下品灵石及三封器堂勾结密信。陈长庚冷静布置炉房现场，做成郑百斛私通乌横岭分赃不均火并重伤、自己率队拼死补刀斩将的合规铁证，随后提着乌横岭血淋淋的首级挂上重立的云泽宗界碑旗杆。破晓雾散，内坑矿役出洞仰望血颅，尽皆骇然跪拜。"}, {"n": 109, "title": "清仓锁脉", "synopsis": "陈长庚召集残存矿役当众砸毁郑百斛吃秤黑砣，提拔熟悉矿脉的断指老匠岳铁脊任代司炉，将三号支脉表层明矿划归宗门正课足抵双月定额，深层富脉则以敛息阵纹隐秘封存。二月二十二午后蚀纹石臼冷却期满，他借炉房浓烟将半截损坏魔刀与毒铜渣一炉提纯，吞服二阶煞髓晶砂令开脉初期顶峰真气愈发浑厚如铁，百余紫纹新虫亦稳固在一阶中上品。傍晚两名邻卡巡脉执事闻狼烟赶来，见旗杆上货真价实的乌横岭首级震惊不已，陈长庚掩唇轻叹侥幸惨胜，顺手请同僚在斩将勘验文书上联名画押。"}, {"n": 110, "title": "矿火温酒", "synopsis": "乌横岭血颅高悬界碑三日，玄煞门游骑吓得退避三十里，断界黑石峪迎来罕见的平静春夜。陈长庚卸下连日厮杀的紧绷心神，在打扫干净的石院支起红泥火炉，炖上半锅鲜嫩黄羊肉，邀代司炉岳铁脊对坐温酒闲话边荒风物。几杯热酒下肚，岳铁脊感念新执事不扣口粮的活命恩情，随口聊起北面二十里三不管的灰铁荒矿，提及前几日曾撞见大泽逃难来的老熟人孙铁牛在那边背矿，昨日却有两名佩云泽宗内门剑穗的冷面修士在荒矿茶棚重金打听大泽修渠旧人。送走微醺的岳铁脊，陈长庚回房静坐灯前。"}, {"n": 111, "title": "荒矿夜影", "synopsis": "为免古盐墟排卤暗沟线索落入暗处之人手里牵出自身，二月二十四夜陈长庚换上灰黑散修劲装、佩妥天阵宗高阶敛息玉符悄赴灰铁荒矿。荒矿深处的废弃砖窑内，两名通窍九窍巅峰的内门死士正将遍体鳞伤的孙铁牛反吊房梁，厉声逼问当年乌卤盐场修渠草图卖去了黑石坊市哪家铺子、西侧暗沟究竟通往古墟何处。孙铁牛哭喊只知脚行收过废纸却不识买主，一名死士拔剑欲割其喉，陈长庚在窑外屈指弹出碎砖击响枯井，诱另一名死士出窑查看，于芦苇暗沟中一记横练指劲洞穿其咽喉。"}, {"n": 112, "title": "红榜断根", "synopsis": "窑内留守的九窍死士久不见同伴归来，警觉拽过孙铁牛退向后井，左手已捏住传音火符欲向五里外茶棚坐镇的内门执事窦长青示警。十只紫纹煞甲虫早顺井壁潜至其袖底，一口咬碎火符与两根手指，陈长庚欺入浓烟以乌金飞刃瞬斩死士首级。搜检怀中密令方知，内门窦氏老祖早年有枚关乎铸鼎的秘钥遗落古墟西窟，窦长青悬红榜只是怕散修先摸去西窟，压根不知内窟地母玄晶之事。陈长庚隔着黑巾塞给孙铁牛十两纹银与南疆商队路引令其连夜远遁，随即引燃火油烧塌砖窑从容返谷。"}, {"n": 113, "title": "押车返宗", "synopsis": "二月二十八月底核销期至，陈长庚留岳铁脊依托新修石垒驻守黑石峪，亲自押送足抵两月正课的高纯火铜精矿与冰封首级返宗。车队行至距本山四十里的一线峡窄道，两名受龚铁横暗中指使的内门开脉初期师兄蒙面杀出，专劈矿车轮轴企图毁矿嫁祸陈长庚失职。陈长庚端坐车辕不起，单御库房制式青鳞灵盾灌注三千五百斤暗金锻骨巨力迎面猛撞，一记重盾直接砸碎为首蒙面人护身法器、震裂其胸骨吐血败逃。申时未过，插着边军捷旗的重车稳稳驶入云泽宗山门，沿途内外门弟子尽皆震动侧目。"}, {"n": 114, "title": "联堂核册", "synopsis": "三月初一辰时，巡脉堂与器堂联席核销边矿月册。尚不知峡谷失手的龚铁横端坐副席冷笑发难，斥责陈长庚临阵畏缩定是空车逃回，提议当场收回巡脉铜印罚入苦役营。陈长庚平静拱手，命力士抬入足额双倍火铜精矿并揭开玄煞门开脉中期百夫长乌横岭的冰封首级，升仙殿纪鹤年与巡脉堂主事抚掌惊叹。龚铁横脸色青白交替，强词夺理称黑石峪旧账尚有两成塌耗亏空未清欲压下头功；陈长庚顺势自袖中取出一叠郑百斛勾结乌横岭私卖两成精矿的亲笔密信，温和请龚师兄当众核验自家司炉手迹。"}, {"n": 115, "title": "借功摘印", "synopsis": "铁证摊上联堂公案，满座内门执事哗然窃语。龚铁横额角冷汗滚落，深知一旦刑律堂介入追查两成黑矿去向必牵出掌矿鲁长老，届时自己必成弃子，只得打碎牙齿和血吞，当堂认下器堂选人失察之过，自掏腰包赔出五十枚下品灵石填平矿册亏空，并眼睁睁看着巡脉堂全额核发陈长庚百枚灵石斩将头功。陈长庚见好就收，掩口轻叹与乌横岭硬拼震伤经脉，主动向纪鹤年恳请卸去外驻矿差，改调往后山西北角终年毒烟弥漫、无人愿去的地肺废火窟看守废炉温养伤势，纪鹤年当堂朱笔准调。"}, {"n": 116, "title": "三成叩窟", "synopsis": "三月初一午后，陈长庚备齐黑石峪三成精铜羡余厚礼，持调令踏入内门西北绝谷浓烟蔽日的地肺废火窟。坐镇此地的半步铸鼎长老寇重山早年炸炉毁去左脸，生平最厌掌矿派钻营油滑之徒；听闻新晋巡脉功臣求见，连铁门都不开便隔门抡锤挑出一锅混杂剧毒铅煞、即将炸膛的沸腾赤铁汁砸在阶前，暴喝三息内说不出症结便带着铜礼滚出山谷。陈长庚神色不变，不散灵识硬探，单凭盐灶三年观烟辨卤的毒辣眼力紧盯铁汁青黑气泡，在寇重山冷声倒数中一步踏前抓起石阶盐碱灰。"}, {"n": 117, "title": "挂名立规", "synopsis": "陈长庚在第三息落音前点破炉底三寸误掺阴寒湿铁致火煞倒冲，反手一捧盐碱灰撒入赤铁汁中心，“嗤”地将狂暴铅煞压成温顺赤水。铁门轰然洞开，独眼焦面的寇重山上下打量陈长庚两眼，痛快收下三成精铜厚礼立下规矩：入废火窟挂名记名弟子，不许在外仗势欺人，每月只需替他看管三座废器熔炉、筛净炉底剧毒矿渣；但只要他在窟一日，鲁长老一脉谁敢来废火窟抓人派炮灰差，寇某便一锤砸断谁的爪子。陈长庚恭敬奉茶行礼，获赐《赤火控炉诀》玉简与紧邻熔炉的东侧独立石院。"}, {"n": 118, "title": "挡驾折威", "synopsis": "三月初二清晨，咽不下恶气的龚铁横搬出掌矿鲁长老座下开脉中期巅峰大弟子柳横舟，气势汹汹闯至地肺废火窟谷口，借口考核器堂新执事火工，欲强行改派陈长庚去赤砂前线押运高危火器。陈长庚立于谷口石阶不卑不亢，亮出昨日纪鹤年与巡脉堂联签公文慢条斯理驳回；柳横舟恼羞成怒，放出中期巅峰灵压逼陈长庚跪接师命。话音未落，主窟内破空飞出一柄烧得赤红的百斤玄铁巨锤，“轰”地将柳横舟脚前界石砸得四分五裂，寇重山沙哑怒骂声震得二人耳膜渗血，龚铁横与柳横舟骇然变色狼狈逃下山去。"}, {"n": 119, "title": "废窟安炉", "synopsis": "赶走掌矿派恶客后，地肺废火窟重归硫烟袅袅的清幽宁静。陈长庚花两日工夫将东侧石院内外拾掇妥当，以《地脉敛息阵图》配破磁铁钎锁住密室地火暗眼，从容清点此番边矿立威后的丰厚家底——算上斩将摸尸与联堂功勋赏赐，储物袋内完整下品灵石已稳稳跨过四百枚大关，另有二阶赤煞断魂刀及大堆无人问津的废器残片。三月初四夜蚀纹石臼满冷却，他首次投入三号熔炉筛出的二阶报废飞剑毒渣，滚滚地肺硫烟将收尾异香遮得滴水不漏，顺利凝出一撮精纯金煞髓晶。次日午后他坐看云海煮茶，通体舒泰。"}, {"n": 120, "title": "炉边论火", "synopsis": "三月初六傍晚，陈长庚利落筛净三座熔炉底渣，提着两壶黑石坊市老酒与烤得滋滋冒油的岩羊肋排走进主窟交差。寇重山难得放下大锤，师徒二人不讲究虚礼，席地坐在滚烫炉台旁大口啖肉对饮，聊的皆是百锻辨色、控火除杂的实在手艺。酒至半酣，寇重山看他根基扎实却外功浮浅，随口点拨开脉初期想稳跨中期门槛、免为日后铸鼎留暗伤，最好寻一味罕见的“百炼寒煞铁髓”打磨经脉，顺手抛来一枚半月后三宗交界地下散修“黑煞鬼集”的匿名铁牌，叮嘱他换身皮囊去淘换尖货。陈长庚执弟子礼谢过归院。"}, {"n": 121, "title": "筛灰淘雷", "synopsis": "地肺废火窟步入正轨，鲁长老座下大弟子柳横舟明面不敢闯谷，暗中却指使库房管事将一批夹杂“阴雷砂”的前线报废兵甲混入三号熔炉，企图引爆废炉坐实陈长庚控火失职之罪。交接时管事满脸堆笑催促当场投炉，陈长庚随手抓起两片断甲嗅出硫雷暗腥，表面爽快画押送客，关门后却用低温盐卤水将三十粒阴雷砂尽数淘洗剥离，反手箍进过载火珠充作破禁杀器。当夜他借熔炉滚滚毒烟遮掩，以蚀纹石臼提纯二阶残甲毒渣喂饱百四十只紫纹煞甲虫。"}, {"n": 122, "title": "易骨赴集", "synopsis": "距黑煞鬼集开启仅余一日，陈长庚向寇重山告假三日外出寻铁，下山后寻荒洞运转《地脉敛息阵图》微调颧骨肩背，换上焦黄老铁匠短打、含药砂压哑嗓音，持匿名鬼面铁牌踏入三宗交界乱葬谷底的地下鬼集。守门恶修见他独身面生，故意引一名黑市皮货商撞肩试探虚实；陈长庚半字不吐，仅伸出枯糙五指顺势扶住对方铁护腕，三千五百斤锻骨暗劲悄然一吐便将精铁护腕捏出五道指印。皮货商脸色大变拱手退让，陈长庚从容入街打探到“百炼寒煞铁髓”已被列为明日内堂压轴交换物。"}, {"n": 123, "title": "残臂藏谱", "synopsis": "鬼集西巷散摊上，断了三根手指的落魄机关散修荀木鸢正守着一堆破烂木甲咳嗽不止，摊角一截被地火煞毒蚀穿的古铁偶残臂无人问津。陈长庚蹲身翻拣，凭盐灶辨味本事嗅出残臂中空内芯藏有百年蜂蜡封存的古兽皮气息，当即指着外层腐铁摇首叹气作势欲走。急需丹药拔除肺毒的荀木鸢慌忙拉住他讨价，陈长庚比划哑语挑剔铁质酥脆，最终仅摸出两瓶掺了一阶道髓晶粉的拔毒药散外加十枚下品灵石，便将整截残臂连同荀木鸢搭送的旧簧片一并收入囊中。"}, {"n": 124, "title": "隔帘验晶", "synopsis": "次日午时鬼集内堂开启以物易物，血河宗外围开脉中期执事“白骨书生”温无咎捧出一尺长的“百炼寒煞铁髓”，直言自己经脉淤煞严重，不收寻常灵石法器，只换毫无丹毒的净脉灵粹。场内鼠须托儿“摸骨鼠”胡三尾趁机拿出劣等净髓膏哄抬门槛、讥讽前排散修寒酸。陈长庚裹在黑纱斗篷下默然上前，取出一只小玉碟，只搁上米粒大小半钱二阶无瑕金煞髓晶。温无咎用验毒银针一试，银针非但不黑反而泛出澄澈紫光，当场震住满座修士，温无咎欣然拍板与陈长庚当堂交割铁髓。"}, {"n": 125, "title": "断涧反猎", "synopsis": "陈长庚得手后不待鬼集散场便由侧道离谷，夜半行至荒僻狭窄的断魂涧时，贪图他身上剩余无瑕髓晶的“摸骨鼠”胡三尾果然带着两名开脉初期亡命徒提前张开二阶锁灵铁网拦路，狞笑逼他交出全部髓晶留条全尸。陈长庚顺势脚下一绊，演作气机被锁摔倒在地；胡三尾大喜抢步上前伸手抓向他怀中储物袋，左袖内百四十只饥渴已久的紫纹煞甲虫轰然化作紫黑狂潮席卷而出，一息咬穿铁网钻入胡三尾护体煞罩，配合右手两枚掺了阴雷砂的过载火珠贴脸引爆，三名劫修连惨叫都未发全便毙命当场。"}, {"n": 126, "title": "旧院新蔬", "synopsis": "平安返宗后，陈长庚先去寇重山处销假，午后顺路拐去后山外门废渣谷走了一遭。昔日破败阴冷的丙字废渣房已被残役曲老五拾掇得干干净净，院角还种了两畦耐旱青菜，冯保山每月按时派人恭敬送来双份炭贴，见着陈长庚青袍影子便绕道行礼。陈长庚留下一壶驱寒药酒与曲老五闲话半刻钟家常，心境澄明返回废火窟东院。入夜他在密室用温卤化开古铁偶残臂蜂蜡，取出一卷保存完好的《机括煞偶残谱》兽皮真本，伴着窗外硫烟煮茶细读，尽享满载而归的清静余韵。"}, {"n": 127, "title": "叠锤锻骨", "synopsis": "连日研读残谱后，陈长庚带着几块筛净杂毒的百炼废铁主动去主窟请教活动铁骨的锻接巧劲。寇重山见他不贪花哨剑诀反倒钻研苦累火工，难得露出一丝笑意，抡起大锤在炉台前亲自示范了十七锤不断气的“叠浪百锻锤”，却守着匠人规矩半句不打听徒弟炼制何物。陈长庚悟透借震卸煞关窍，回三号炉房日夜挥锤，半月内用废兵甲精铁配黑市簧片打成首具刀枪难伤的一阶顶峰“玄铁机括煞偶”躯壳，唯独胸口驱煞核心尚缺二阶阴髓寒铜方能如臂使指。"}, {"n": 128, "title": "茶房探底", "synopsis": "听闻霍千山提前出关，陈长庚并未闭门死守，借月初上交废铁清册之机提了一包雨前茶去升仙殿旁的老书办房闲坐。几盏热茶下肚，老书办压低声音透露：霍千山原本半年难愈，全靠内门窦氏执事窦长青暗赠一味虎狼奇药强行压下心脉火毒并硬冲开脉初期，二人近日频频密会，似在追查古盐墟遗失的一件窦氏祖传信物。陈长庚顺势聊起器堂历年废矿旧闻，无意间套出十年前器堂曾有一条直通外山赤砂涧的“赤砂暗火道”，其开启副牌正是他手里那面赤铜火脉令牌。"}, {"n": 129, "title": "顺签出山", "synopsis": "不出三日，庶务堂一名管事便捧着例行公签来到废火窟，通知轮值记名弟子陈长庚明日下山赴三十里外的青石炭场押运十车冷锻木炭。陈长庚接过公签一嗅，指尖立刻辨出印泥里混着器堂特有的赤脂香，显是霍千山与窦长青忌惮寇重山不敢闯谷，故意设下调虎离山的荒野截杀局。寇重山闻讯皱眉欲出面骂回差事，陈长庚却平静劝住师父，直言千日防贼不如顺道办妥公差免落人口实，当夜将十枚阴雷过载火珠严密嵌进首具玄铁机括煞偶胸膛，悄然装上空炭车。"}, {"n": 130, "title": "落坡炸偶", "synopsis": "两辆空炭车刚驶入三十里外险峻荒僻的落鹰坡峡道，四面山壁骤然升起四道青蒙蒙的二阶“锁风困灵阵旗”封死退路。刚靠虎狼药强冲开脉初期的霍千山手提赤炎战戟狞笑跃落路中，窦长青则持阵盘冷眼立于高坡压阵，二人厉喝逼陈长庚交出古盐墟底窟盗走的寒髓重宝与镇脉铜枢。陈长庚脸色大变，慌乱间弃了前车退守后车草席旁；霍千山生怕窦长青抢先搜袋，狂催赤炎戟罡一戟劈碎草席，席下玄铁机括煞偶双臂猛然死锁戟杆，胸膛十枚阴雷过载火珠贴脸轰然炸裂。"}, {"n": 131, "title": "斩草焚旗", "synopsis": "雷火硝烟中，右臂炸断、护体灵光崩碎的霍千山刚欲后退求救，陈长庚已如鬼魅欺近三尺，暗金地火煞罡灌注百炼乌金分水刺，半句废话不讲一刺洞穿其咽喉。高坡上的窦长青魂飞魄散，哪料这个“靠异乳侥幸开脉”的火工竟凶悍至此，当即弃阵捏碎祖传二阶替身木符化影疾逃。谁知他刚掠出十丈，早被陈长庚提前放出的百四十只紫纹煞甲虫便自地底钻出，瞬息啃穿困阵边缘他预留的生门灵枢；陈长庚脚踏青鳞灵盾凌空截住真身，三柄乌金飞刃呈品字贯胸而过，彻底斩断全部活口。"}, {"n": 132, "title": "伪迹领恤", "synopsis": "山谷寂静，陈长庚熟练清点两具储物袋：除二百一十枚完整下品灵石与四杆二阶锁风困灵阵旗外，最意外的是窦长青怀中那枚寻找多年的祖传秘钥，材质竟正是炼制二阶煞偶急需的极品“阴髓寒铜”，另有一纸密札点明此钥关联三宗交界一处上古赤铜煞冢。他将霍、窦二人衣物残器以地火精石彻底熔毁扬灰，洒上此前断魂涧缴获的血河宗腐骨毒钉，把两辆炭车劈成流寇劫掠状，再往自己左肩划开一道三寸血口染红青袍，架盾跌跌撞撞逃回山门向刑律堂许镇岳报案求援。"}, {"n": 133, "title": "伤假温炉", "synopsis": "许镇岳亲率执法队赶赴落鹰坡，只查获血河宗腐骨毒钉与狂暴魔火焦土，而私自离山未报备的霍千山与窦长青活不见人死不见尸，最终被按边荒失踪悬案挂起。掌矿派平白折了一员得力干将，龚铁横疑神疑鬼却见陈长庚左肩缠伤躲在废火窟半步不出，实在挑不出破绽。陈长庚借刑律堂特批的半月伤假安心闭门调养，白日筛渣练锤、傍晚提壶烧酒陪寇重山在炉台烤山猪肉闲聊宗门旧事；入夜石臼满冷却，他切下一缕地母玄晶作引，将百炼寒煞铁髓提纯为六枚澄澈冰蓝的二阶寒金道晶。"}, {"n": 134, "title": "寒火贯中", "synopsis": "四月中旬子夜，陈长庚在东院密室四周插满刚缴获的四杆二阶锁风困灵阵旗，彻底封死一切灵气波动，盘膝将六枚零丹毒寒金道晶分批纳入腹中。极寒铁髓灵力与他原有的暗金地火煞罡在周天仙脉内一冷一热反复锻打，毫无寻常修士服丹冲关的淤塞剧痛，水到渠成冲破中期壁障。踏入开脉境中期后，他丹田仙脉拓宽倍许、寿元愈发绵长，护体煞罡凝如百炼寒铁，外放神识更从十丈暴涨至三十丈方圆；寒铁瓮内百四十只紫纹煞甲虫吞食晶屑残渣后，背甲亦浮现出二阶初期的金线雏形。"}, {"n": 135, "title": "交铁换皮", "synopsis": "实力跃升开脉中期后，陈长庚深知在内门长期装病咳血反易惹丹师起疑，当即换代藏拙路数：他以《地脉敛息阵图》将外显气机稳稳压在开脉初期中段，拆去肩头伤布，推着一车亲手锻打的三十锭百炼精铁前往器堂库房交差。验铁执事一试铁锭成色均匀扎实、却无半点杀伐锐气，不由摇头感叹寇长老真把个巡脉功臣带成了木讷铁匠。陈长庚憨厚赔笑领下微薄匠贴，半句不提争抢肥差，连暗中观察的龚铁横见他双手满是炉灰老茧、修为寸步未进，也嗤笑一声撤回了眼线。"}, {"n": 136, "title": "鬼巷解围", "synopsis": "五月上旬，陈长庚再度扮作哑巴铁匠前往黑煞鬼集采买辅材。路过鬼集南角药石铺时，恰见一名十九岁憨实青年捧着半匣伴生赤硫矿被掌柜硬指为假货强压三成死价，青年急得满脸通红报出黑石坊市“九斤杂货”字号仍遭驱赶，正是贺九斤带出来跑腿的亲侄贺小五。陈长庚缓步上前敲了敲柜台，指尖一缕暗劲震落矿石表层泥壳露出内里上品赤硫晶心，当众拆穿掌柜眼拙压价，顺手按公道市价买下这半匣赤硫矿替贺小五解了窘境，未留片语便转身去西巷找荀木鸢取走了定制的三套二阶机括铜簧。"}, {"n": 137, "title": "融铜成偶", "synopsis": "回宗后陈长庚先将窦氏那枚阴髓寒铜秘钥的云篆纹路用火泥一比一精准拓模留存，随即切下七成阴髓寒铜熔入三具百锻偶躯中枢，嵌合新购铜簧与地火精石，历时十日成功炼成三具悍不畏死、合击堪比开脉中期的“赤铜火煞偶”。恰逢五月地肺夏至煞潮翻涌，主窟内镇压火脉的寇重山引动十年前炸炉淤积心肺的沉年铅煞，半夜咳出乌血却倔强不肯请丹堂看诊。陈长庚闻声思忖片刻，感念老人硬顶掌矿派护短之情，悄悄切下半钱一阶无瑕道髓晶砂融进盐卤清火汤中端去主窟。"}, {"n": 138, "title": "雨夜开阁", "synopsis": "寇重山接过粗碗一饮而尽，原本只当是徒弟一番孝心，不料无瑕髓晶药力顺盐卤直透肺叶，半个时辰后竟逼得他呕出一团核桃大小的漆黑铅毒淤血，堵了十年的胸口豁然通畅。老火工又惊又喜，直夸大泽盐户祖传的卤水拔毒方子比丹堂那群庸医强上百倍，对陈长庚愈发视作衣钵自己人，当场摸出私藏器室铁钥抛给他，准他随时入内翻阅自己毕生搜集的《百炼灵器图鉴》与二阶破损古器孤本。是夜山雨滂沱，师徒二人守着余烬烤红薯吃茶，废火窟内难得满是暖意。"}, {"n": 139, "title": "秋烽急征", "synopsis": "平静的苦修日子持续到八月初秋，北境三宗边界骤然烽烟大作——玄煞门与血河宗竟罕见联手，出动数名开脉后期精锐突袭云泽宗辖下白石、青铜两座大矿，护矿阵弩损毁殆尽。掌矿鲁长老趁势与巡脉堂下达战时最高征调钧令，凡器堂在册执事无论挂名何处皆须抽调赴边抢修守城重弩。联席议事殿上，沉寂数月的龚铁横猛然发难，笑吟吟高声举荐近半年“百锻手艺冠绝同辈”的陈长庚赶赴最凶险的黑风寨前线督修阵弩，企图借战时军法废掉寇重山的护短挡箭牌。"}, {"n": 140, "title": "借律随军", "synopsis": "满殿皆以为陈长庚会搬出寇重山抗命，谁知陈长庚踏前一步平静领命，紧接着转身向同坐主位的刑律堂长老许镇岳拱手进言：前线阵弩损毁蹊跷，恐有坊间劣铁充好之弊，恳请将督修差事并入刑律堂战时军械核查队同车北上，凡前线换下的战损破败灵器残骸一律由他当场验明封存回炉。许镇岳正愁不懂器道难查器堂烂账，闻言抚掌大赞准奏；龚铁横原本安排在半路截杀落单火工的毒计瞬间落空，还要眼睁睁把前线海量二阶废损灵器的处置权拱手送进陈长庚口袋。"}, {"n": 141, "title": "剖弩揪蛀", "synopsis": "核查队抵达北境黑风寨，驻寨器师钱百炼系柳横舟心腹，见陈长庚下车便倒打一耙，哭诉前线风煞太烈震断六架二阶破城弩，逼陈长庚签字认下自然战损并追拨五十枚灵石修费。陈长庚不与争辩，请刑律堂统领戚怀山升帐见证，抡起百锻铁锤沿折断弩臂背面三寸敲击，当众震开表层赤铜皮，露出内里疏松如蜂窝的生铁废渣。戚怀山勃然大怒当场锁拿钱百炼，将寨后修械大院及三车带毒二阶战损灵器全权交由陈长庚封存督修。"}, {"n": 142, "title": "夜堑试偶", "synopsis": "三更浓雾锁山，血河宗大队佯攻黑风寨正门，两道开脉中期黑影却循内应灯号直扑后方修械大院；被押偏房的钱百炼买通看守逃出，反手落下院外千斤铁闸，妄图把陈长庚困死在魔修刀下灭口。陈长庚早防备院墙风口暗桩，故意引燃一桶废硫磺造出慌乱浓烟，诱两名血河宗斥候踏入排渣深堑，随即催动三具赤铜火煞偶呈品字铁壁封死退路，配合乌金破甲分水刺三息内双双枭首，摸走精血妖核与百枚灵石后引爆残破火药匣掩去偶痕。"}, {"n": 143, "title": "封箱记功", "synopsis": "戚怀山在寨后山沟截获趁乱外逃的钱百炼，当场搜出未烧尽的传讯铜簪，连夜合上劣铁贪墨铁证快马呈报刑律堂。陈长庚绝口不提独杀两名中期斥候之功，只推说魔修误触库房残余火药匣自毙，随后连轴开炉两日，以百锻精铁将六架二阶破城重弩修得坚逾往昔。三日后军令传回，鲁长老为保晚节被迫大义灭亲，罚大弟子柳横舟吐出二百枚灵石并禁足思过三月；陈长庚获记战时一等督修功，名正言顺押着五口贴满封条的二阶战损毒渣大箱凯旋归山。"}, {"n": 144, "title": "淬渣蜕虫", "synopsis": "重返地肺废火窟后，陈长庚向寇重山交割公账精铁，随即将截留的五箱二阶魔器残片与剧毒弩渣搬入东院密室。此地终年翻涌刺鼻硫磺火烟，哪怕蚀纹石臼全速碾磨二阶煞毒也不会外泄半丝异味；半月之内他每隔三日准时开臼，析出十余钱纯净无瑕的金煞髓晶，一举将初入开脉中期的周天真气打磨得圆融浑厚。同时他以剥离出的精纯铜煞毒屑喂养虫群，百四十只紫纹煞甲虫顺利产卵孵化至三百二十只，尽数沉入寒铁瓮底结出暗金硬茧。"}, {"n": 145, "title": "秋堂品茗", "synopsis": "九月秋高气爽，陈长庚换上整洁青玉执事袍，提着两副用羡余精铁锻成的内衬护腕，先后登门拜谢升仙殿纪鹤年与刑律堂许镇岳。两位长老见他立下大功仍谦逊守礼、半字不居功讨赏，愈发引为知己晚辈，留他在桂花树下细品新焙云雾灵茶，闲谈间透出掌矿派近日被查账弄得灰头土脸的窘态。午后陈长庚信步走过内门山腰小集，各摊管事纷纷起身拱手笑迎，他慢悠悠挑了两坛十年灵谷陈酿与半扇酱卤岩羊，迎着漫山红叶返回废火窟与寇重山对酌。"}, {"n": 146, "title": "改签推缸", "synopsis": "十月初冬，玄煞门与血河宗在北境青盐岭大举增兵，器堂鲁长老顺势推出“百炉轮值督运制”，龚铁横大笔一挥便将陈长庚排进伤亡最惨的断魂岭火药押运队。点卯堂上，陈长庚不吵不闹，只从待发火药箱里随手拈出三根引信当众捻碎，点破硫油配比畏寒易哑火的致命纰漏。同堂督战的纪鹤年脸色微沉，当即拍板留陈长庚驻守后方安全的青石驿统一改装引信，而原本帮龚铁横敲边鼓挤兑人的墙头草执事孙万钧措手不及，被当场顶包派往断魂岭押车。"}, {"n": 147, "title": "暗道寻胎", "synopsis": "距奔赴青石驿尚有五日筹备期，陈长庚盘算要将机括煞偶扩充成阵，急需大批抗高温玄铁与二阶煞核。深夜子时，他借清扫三号熔炉烟道之机，摸出昔日战利品中的那面赤铜器堂火脉令牌，严丝合缝按入炉底暗槽。尘封数十年的千斤火铜闸门无声滑开，露出一条直通后山地肺支脉的废弃“赤砂暗火道”。道内灼浪滚滚、遍布常人沾之烂肺的赤砂毒火晶，对旁人是十死绝地，在手握蚀纹石臼的陈长庚眼里却是天然宝库，往里百丈更散落着前代器师遗弃的半成品铁偶。"}, {"n": 148, "title": "赤窟猎蜥", "synopsis": "暗火道尽头岩浆池畔，一头背生赤甲、堪比开脉中期的二阶“赤甲吞铁蜥”正盘踞在五具上古玄铁偶胎上吞吐毒焰，见生人闯入当即甩尾砸塌退路顽石凶悍扑来。陈长庚早有防备，不施展动静过大的火珠，先掷出三枚破磁铁钎钉死岩池两侧滑道断其潜逃水路，随即放出三具赤铜火煞偶结成三角铁阵硬抗巨尾横扫。趁吞铁蜥一口咬住居首煞偶铁肩、旧力刚尽的刹那，陈长庚裹满暗金地火煞罡欺身切入盲区，百炼乌金破甲分水刺自其颚下软鳞一贯穿脑。"}, {"n": 149, "title": "烤硝救驿", "synopsis": "十一月中旬陈长庚抵青石驿坐镇验械，适逢巡脉堂硬汉执事孟横山率二十名精锐冒雪换领轰天雷匣准备夜袭敌哨。押运军需官催促孟横山免检画押即刻出发，陈长庚却嗅出木箱底缝泛着微酸井卤潮气，伸手拦下交接，当众挑出一撮药粉撒入炭盆——药粉只冒黑烟竟不炸响，原是器堂军需官私卖上好赤硝、拿掺水旧药充数。孟横山惊出一身冷汗，当场拧断军需官胳膊押回本山，对救了全队二十条人命的陈长庚感激涕零，拍胸脯许诺前线打扫战场所得的二阶毒虫甲壳全归他挑拣。"}, {"n": 150, "title": "雪驿分肉", "synopsis": "暴雪连下两日封锁山口，青石驿厅堂内炭火熊熊、肉香扑鼻。孟横山与几名常年戍边的巡脉老执事卸去甲胄，拉着陈长庚围炉大碗喝酒、分食烤得焦香流油的雪岭妖猪肉，再无初见时的生疏客套。席间孟横山爽快将两麻袋刚缴获的血河宗二阶尸蟞残壳塞给陈长庚当炼器添头，另一名见多识广的老执事说起炼制群偶阵盘的轶闻，随口提及明年二月三洲交汇的“苍梧仙城”将办三年一度的洲际大拍，坊间传闻压轴奇物里便有一块能统御八方机括的上古镇脉母铜。"}, {"n": 151, "title": "群虫化金", "synopsis": "腊月初旬陈长庚差满返回地肺废火窟，钻入赤砂暗火道闭门忙活半月。他以蚀纹石臼轮番碾磨二阶赤蜥内丹、地肺毒火晶与两麻袋魔虫残壳，析出大把精纯异种煞髓倾入寒铁虫瓮。瓮底硬茧咔嚓齐裂，三百二十只甲虫背甲彻底褪为坚不可摧的暗紫金纹，双颚可轻易啃穿二阶下品灵器，更借余髓迅速繁衍凑足整整五百只二阶初期紫金煞甲虫大军。随后他又将五具上古玄铁偶胎熔入精铜地火石修复成型，凑齐八具二阶赤铜火煞偶，唯独齐催八偶时神识略有滞涩，亟待镇脉母铜统合中枢。"}, {"n": 152, "title": "掌册驳征", "synopsis": "腊月二十，先前替陈长庚顶包赴断魂岭的孙万钧等两名执事遭血河宗伏击一死一残，器堂人人自危。龚铁横趁岁末核功会在大殿发难，指责陈长庚缩在后方贪生避战，要求立刻换他顶上除夕夜前线巡防。陈长庚从容取出孟横山与北境三座戍堡联名签押的验械保堡功状呈上公案，证实经他改良的防潮火雷昨夜刚炸退血河宗百人敢死队。刑律堂长老许镇岳拍案怒斥龚铁横公报私仇、自毁长城，当堂免去陈长庚半年外派杂役，龚铁横在满堂嗤笑中颜面扫地。"}, {"n": 153, "title": "岁末封锤", "synopsis": "腊月廿九迎年封炉，地肺废火窟难得停下终年震耳的锻锤声。陈长庚亲手贴上辟煞桃符，用盐场老手艺焖了一只肥嫩盐焗灵鸡、切满大盘酱卤牛肉，陪独眼老火工寇重山守在暖烘烘的余烬旁痛饮守岁。寇重山喝得满面红光，难得讲起早年游历洲际大城的炼器趣事；半夜雪霁，陈长庚踏雪掠过外门后坡，将一袋银炭与两块碎灵石悄悄放在丙字房曲老五窗台外。听着屋内老人安稳的鼾声返回洞府，算算入宗一年已稳立开脉中期、手握八偶五百虫，道心愈发澄明坚定。"}, {"n": 154, "title": "鬼肆闻风", "synopsis": "第三年正月中旬冰雪初融，陈长庚再度缩骨易容成哑巴老铁匠潜入黑煞鬼集，携两壶好酒寻机关匠荀木鸢打探虚实。荀木鸢翻出刚从南边流出的苍梧仙城洲际大拍草目，指明压轴第十九号拍品正是从古墓挖出的拳大“镇脉母铜”，只是铜心缠满千年尸墓怨煞，寻常器师碰之即疯，起拍价倒不算天价。临别时荀木鸢压低声音提醒老主顾最近少往北边野矿跑，听说血河宗那位笑面虎执事温无咎近来花重金在鬼集暗收三宗交界荒谷详图，怕是在憋什么黑吃黑的毒招。"}, {"n": 155, "title": "隔楼看饵", "synopsis": "茶楼二楼雅座内，龚铁横的堂侄龚成正压着嗓门与一名断眉散修讨价还价，愿先付五十枚灵石定金买下三宗盲区“血鸦峡”新裂富铜矿的坐标，只待下月苍梧仙城大拍买齐破瘴阵盘便请叔父带队私挖翻本。陈长庚站在街角旧书摊前佯装翻捡破烂舆图，三十丈开脉中期神识悄然掠过楼板，一眼瞧见那断眉散修靴帮内侧沾着唯有血河宗炼尸窟才有的暗紫腐泥——正是温无咎放出来钓贪官的死饵。陈长庚不动声色放下耳中听闻，顺手在书摊买走一卷涵盖血鸦峡水文沟壑的旧地理志。"}, {"n": 156, "title": "悬锤代守", "synopsis": "往返苍梧仙城需耗时半月，若明着向庶务堂请假远行，必惹龚铁横派人盯梢节外生枝。陈长庚先回地肺废火窟向寇重山如实禀明想去苍梧大拍淘换一件炼器奇铜，老人豪爽挥手替他挂出“闭炉百锻谢客廿日”的铁牌；陈长庚则在东院锻房巧设水轮铜簧，留下一具赤铜火煞偶每隔半刻拉动风箱、抡锤敲响废铁砧，连烟囱飘出的煤烟浓淡都与平日一般无二。二月初二五更，他在掌矿派暗哨眼皮底下稳稳“锁门打铁”，真身却已从赤砂暗火道穿出山背密林潇洒南行。"}, {"n": 157, "title": "仙城换筹", "synopsis": "行路六日，雄踞三水交汇处的洲际巨邑苍梧仙城映入眼帘。陈长庚换上苍老蜡黄的游方阵匠“木石客”面容，先在城西近水巷租下带地下排涝暗渠的独院落脚，随后花了两日工夫，先后以不同装束走访城中三家互不对付的老字号器阁与丹铺，将积攒的四十余钱一阶道髓晶砂及十柄零瑕疵百炼精铁刃分批变现。因成色极佳且来路干净，共换回五百余枚下品灵石，加上原有私蓄凑足九百二十枚巨款，彻底备妥竞拍镇脉母铜的充足粮草。"}, {"n": 158, "title": "偏厅试火", "synopsis": "二月初十傍晚，苍梧拍场偏厅核验独立贵宾厢席位，一名背负金剑的邻洲金剑门开脉后期修士嫌散修挡道，冷喝逼戴黑铁面具的陈长庚让出最后一方验资火台。厅内众修皆等着看散修出丑，陈长庚一言不发，也不亮法器争斗，只屈指往验资炉内三寸厚的百炼寒铁砖上轻轻一弹——一缕由二阶金煞髓晶千锤百炼而成的暗金地火煞罡透指没入，寒铁砖半息内无声化作金红铁水滴落。金剑门修士骇得脸色发白，误当撞见了游戏风尘的开脉圆满炼器大宗师，慌忙抱拳深揖赔罪退开。"}, {"n": 159, "title": "隔厢截铜", "synopsis": "次日洲际大拍高潮迭起，第十九号拍品“古墓镇脉母铜”刚抬上玉台，散出的阴森尸怨便吓退大半正统器师。七号厢房内的龚铁横志在必得，欲拍下母铜献给鲁长老换取执掌内门大库肥缺，一路咬牙加价至四百五十枚灵石极限。十九号密厢内的陈长庚静待其气息急促、灵石见底，方才沙哑开口加价三十枚，并当场抛出两粒无瑕二阶金煞髓晶抵足尾款一锤定音。痛失母铜的龚铁横羞恼交加，生怕空手回宗无法交差，转头便将手里四百五十枚灵石全数砸进下一件血鸦峡破瘴阵盘拍品中。"}, {"n": 160, "title": "苇舟嫁祸", "synopsis": "夜色下城西排涝水巷雾气浓重，两名专做黑吃黑勾当的外洲开脉中期劫修前后包抄十九号厢房黑衣客，而心有不甘的龚铁横也指使龚成带两名护院抄近道摸来打探母铜买家底细。陈长庚步入水巷死角，运转《地脉敛息阵图》将黑铁面具与外罩黑斗篷套在预备的草人木筏上顺暗流漂向龚成来路，并在巷口洒下半撮带母铜尸煞味的铜粉。两名劫修循味猛扑而至，正撞上提刀探路的龚成一行，双方黑灯瞎火认定对方抢宝当场死斗见血；陈长庚早已换回麻衣钻出暗涵，登船离城。"}, {"n": 161, "title": "暗涵归山", "synopsis": "二月十六五更，陈长庚乘夜舟返抵云泽山脉背麓，循赤砂暗火道悄无声息潜回地肺废火窟，撤去水轮铜簧与敲铁替身偶。天刚蒙蒙亮，掌矿派柳横舟便带着庶务堂管事突袭查炉，实为替在苍梧仙城折损护院、怀疑内门有人截胡母铜的龚铁横摸底试探。陈长庚一身汗渍煤灰推门迎客，当场夹出炉膛内焖烧足二十日火候的百锻精铁胎任其查验；柳横舟摸着滚烫铁胎挑不出半点破绽，只得悻悻收队下山。陈长庚掩门转身，携镇脉母铜潜入地底暗火道。"}, {"n": 162, "title": "炼怨点枢", "synopsis": "赤砂暗火道岩浆池畔，陈长庚趁蚀纹石臼满冷却，将缠满尸怨的镇脉母铜投入臼心。令正统器师束手无策的百年古墓阴怨被石臼寸寸碾碎剥离，凝成一撮晶莹剔透的二阶“玄阴神髓晶”与毫无杂质的母铜灵液。陈长庚吞服玄阴神髓晶，识海豁然开朗，神识一举扩张至三十六丈，分神操控多具机关的胀痛隐患迎刃而解；随后他连熬五昼夜，将母铜灵液逐一浇铸进五具上古偶胎与三具赤铜偶核心，八具悍不畏死的二阶“八门玄铁煞偶”结阵成型，合击之威足以硬撼开脉后期修士。"}, {"n": 163, "title": "春涧烹鱼", "synopsis": "闭关炼偶大功告成，陈长庚特意给熔炉封火歇息两日，提着竹篓去后山幽谷寒潭钓起两条肥美的雪鳞灵鱼，佐以新采野笋端到主窟崖边。寇重山见状大喜，师徒二人在暖融春风里支起铁锅烹鱼烫酒，全无半点内门争斗的紧绷。酒过三巡，寇重山笑着说起前日去主峰交册的见闻：龚铁横从苍梧仙城灰头土脸归来，不仅没拍到鲁长老点名要的母铜，堂侄龚成还被人打断肋骨抬回，遭鲁长老闭门摔杯痛骂，近几日正急得像热锅蚂蚁般四处凑钱。陈长庚笑着添满热汤，静听山风松涛。"}, {"n": 164, "title": "借图添柴", "synopsis": "三月初八傍晚，急于私挖血鸦峡富矿翻本的龚铁横竟拎着礼盒登门废火窟，满脸堆笑与陈长庚“一笑泯恩仇”，许以两成干股邀他带私制火器入伙破障。陈长庚连忙摆手苦笑，推说自己胆小命薄只敢守炉打铁，万不敢沾私采野矿的掉脑袋买卖；见龚铁横面露愠色，他又惶恐捧出那卷花两块碎灵石买来的北境山水旧志赔罪，替龚铁横指点出一条可避开巡脉堂北线哨卡的干涸山沟。龚铁横细看水道隐蔽大喜过望，收起地图嘲讽陈长庚烂泥扶不上墙，扬长下山准备夜探血鸦峡。"}, {"n": 165, "title": "密报备案", "synopsis": "送走龚铁横次日，陈长庚并未在家枯等魔门独吞肥肉，而是带着两匣改良引信骑马赶赴青石驿叙旧。席间他与巡脉堂执事孟横山核对春防军火损耗，状似困惑提起近日器堂侧库有三批破障火雷未入前线公册，车辙印反倒朝三宗盲区血鸦峡方向去了，唯恐被血河宗游骑截获反伤边堡。孟横山闻言神色剧变，当夜便请来驻防附近的刑律堂统领戚怀山密议，两堂调集二十名开脉精锐悄赴血鸦峡二十里外设伏待命，准备人赃并获拿住私倒军资的内鬼。"}, {"n": 166, "title": "血峡入瓮", "synopsis": "三月十二子夜，龚铁横率柳横舟及四名掌矿派心腹顺着干涸山沟摸入血鸦峡，兴冲冲将四百五十枚灵石拍来的破瘴残盘嵌入矿壁。不料阵盘刚亮便逆转化作冲天血幕锁死全峡——血河宗开脉后期执事温无咎率八名魔修精锐自崖洞现身狞笑收网，当场轰杀四名器堂执事、一刀斩断柳横舟右臂。龚铁横肝胆俱裂拼死催动二阶上品护身灵剑苦撑；百丈峡顶的乱石盲区里，早已运转《地脉敛息阵图》潜伏多时的陈长庚静静俯瞰峡底血战，默算着温无咎体内真气的消耗刻度。"}, {"n": 167, "title": "隔雾摘桃", "synopsis": "绝境中的龚铁横眼见活命无望，发狠引爆压箱底的二阶赤阳铜镜，狂暴火浪炸得温无咎左肩血肉模糊，龚铁横自己亦经脉寸断瘫倒泥中。温无咎抹去嘴角鲜血刚欲上前摘取储物袋，陈长庚骤然引动峡底地火瘴气遮天蔽日，八具二阶玄铁煞偶从天而降结阵绞杀残余魔修，五百只紫金煞甲虫化作夺命金云瞬间噬穿温无咎护身血罩。温无咎骇然误判遇上云泽宗圆满老怪伏击，毫不犹豫自断左臂捏碎血遁符逃命；浓烟中龚铁横认出陈长庚靴角嘶声求饶，陈长庚半字不言，一刺精准穿喉断绝生机。"}, {"n": 168, "title": "弃旗引骑", "synopsis": "短短十息之内，陈长庚利落收走龚铁横、柳横舟与魔门死士的全部储物袋及温无咎断臂遗落的储物戒，入账六百四十枚下品灵石、一柄二阶上品青冥剑与掌矿派历年黑账总册。紧接着他催动现场遗落的半截血河宗残幡抽干尸首残血，将一切虫噬孔洞与暗金煞罡痕迹掩盖成魔功互拼惨状，故意打出一道刺目血光冲上夜空，人已收拢虫偶钻入地下排水暗沟远遁。孟横山与戚怀山率铁骑疾驰赶到，查验满地私调火雷与同归于尽尸骸，当场铁案定钉上报本山。"}, {"n": 169, "title": "抄堂换天", "synopsis": "血鸦峡铁案传回云泽宗本山，犹如平地惊雷炸翻整座器堂。刑律堂长老许镇岳手持现场起获的私调军械批条，联合巡脉堂纪鹤年在长老院拍案发难；掌矿鲁长老面对铁证百口莫辩，为免遭拔出萝卜带出泥的彻查，被迫当众交出半数边矿联合会签大权，并宣布闭死关三年自省思过。盘踞器堂多年的掌矿派一夜瓦解，昔日跟风排挤陈长庚的管事执事人人自危；而提前在青石驿提醒火硝异动的陈长庚不仅深藏功与名，还收到两堂私下送来的五十枚灵石厚赏。"}, {"n": 170, "title": "晴窗分茶", "synopsis": "大树倾倒之后，内门空气前所未有地清爽舒畅。陈长庚在东院晴窗下煮起一壶山泉，从容盘清血鸦峡之役的丰厚斩获——随身完整下品灵石已突破一千五百枚大关，各类二阶灵材火器塞满两只储物袋。午后他换上整洁青袍去内门丹茶坊采买雨前云雾灵茶，沿途往日鼻孔朝天的器堂大库管事老远便满脸堆笑拱手让路，尊称一声“陈师兄辛劳”；陈长庚温和颔首回礼，将好茶分送纪鹤年与恩师寇重山品鉴，在炉火茶香中慢享无债一身轻的自在春光。"}, {"n": 171, "title": "铜钥合图", "synopsis": "夜深人静，陈长庚震开龚铁横贴身暗匣，取出一张边缘参差的焦黄兽皮古矿图；当他试着将早年斩杀窦长青所得的“阴髓寒铜秘钥”放上缺口时，两者云篆暗纹竟严丝合缝咬合为一。次日他入主窟私藏器室翻查《百炼灵器图鉴》孤本，终于拼出全貌：此图乃三宗交界赤砂戈壁深处“上古赤铜煞冢”的下层铸火暗殿密径，该秘境每逢甲子地煞退潮方裂开一线，冢心不仅育有可锻无瑕本命重器的“赤渊地肺火种”，更沉积着常人避如蛇蝎、却最合石臼胃口的万年铜毒母矿。"}, {"n": 172, "title": "戈壁风起", "synopsis": "四月中旬，北境赤砂戈壁突发百里地脉轰鸣，一道赤金光柱冲破沙海——甲子一开的上古赤铜煞冢果真应期现世，瞬间引来云泽宗、玄煞门与血河宗三派铸鼎长老对峙。因古冢外围血煞禁制严禁铸鼎修士踏入，三宗约定三日后各遣六名开脉境精锐入冢各凭本事夺宝。升仙殿纪鹤年念及陈长庚精擅观火辨瘴且行事稳妥，专程发来传讯玉简，询问他愿否以随队火工执事身份跟内门开脉圆满首席梁世勋走一遭，许诺入冢所采辅材全归个人且抵免三年外役。"}, {"n": 173, "title": "藏锋应募", "synopsis": "陈长庚深知孤身闯戈壁易撞上三宗驻守的铸鼎老怪，混在宗门官队末尾既能名正言顺进门，又能让心高气傲的天骄替自己先趟血煞死禁，当即回讯应募。启程前点卯大殿上，已修至开脉境圆满的首席天骄梁世勋一身银甲意气风发，目光扫过昔日古盐墟见过一面的陈长庚及其布满老茧的铁匠双手，眼底掠过一丝轻蔑，随口将他与另一名无背景的开脉中期执事方怀石编在队尾负责背工具探铜瘴；陈长庚躬身领命半句不争，暗将八具煞偶与五百紫金甲虫稳妥藏入内袋。"}, {"n": 174, "title": "坊市夜话", "synopsis": "随宗门车队行至南麓驿镇休整当夜，陈长庚换上灰麻斗篷拐入黑石坊市“九斤杂货”添置封存毒矿的寒玉匣。铺内灯火融融，两鬓染霜的贺九斤正手把手教侄儿贺小五辨认矿砂成色，听见三记熟悉的叩桌轻响忙屏退伙计，恭敬奉上新沏热茶。听闻前辈要往北境风沙地采风，贺九斤特意从地窖捧出一包早年重金收来的“避铜辟瘴犀角粉”双手奉上；三人隔着茶烟闲聊半晌大泽旧闻，陈长庚留下二十枚灵石与两张二阶护身火符，在叔侄二人深深揖别中踏夜离去。"}, {"n": 175, "title": "沙海扎营", "synopsis": "四月十八黄昏，云泽宗飞舟降落在赤砂戈壁煞冢裂缝之外，东侧玄煞门少门主袁千绝与西侧血河宗督战统领巫千刃早已各自扎营，三大开脉圆满高手遥遥对视杀机暗涌。入夜云泽宗大帐议事，梁世勋为保存自身与三名世家师弟真气抢夺核心火种，毫不客气地将明日打头阵测探“蚀骨铜风眼”的折寿差事派给陈长庚与方怀石。方怀石面露苦色却不敢违逆，陈长庚平静接过测风罗盘，趁下半夜轮值巡营之机运转《地脉敛息阵图》，将煞冢西侧地底连通外界的排煞裂隙摸得一清二楚。"}, {"n": 176, "title": "铜瘴入冢", "synopsis": "次日午时地煞退潮，青铜巨门轰然裂开丈许通道，三宗十八名开脉精锐争先掠入第一重“万刃铜瘴廊”。袁千绝与巫千刃冷笑控速逼云泽宗趟雷，梁世勋当即喝令陈长庚上前试探翻滚的青绿毒雾。陈长庚手执八棱试脉铁钎踏前十步，表面被毒瘴呛得面色发青踉跄后退，袖底却借死角飞快刮下大把修士沾之即蚀脉、石臼却最喜吞噬的“万年铜绿毒苔”封入玉匣；退回之际他沙哑指出左墙三尺有微弱活风，并故意朝右侧看似宽敞的石阶瞥了一眼，引得两名急于抢先的玄煞门后期好手冷笑越众扑向右道。"}, {"n": 177, "title": "借坑折翼", "synopsis": "两名玄煞门开脉后期好手刚踏上右侧石阶，脚下青砖骤塌化作流沙旋涡，墙内万支剧毒铜剑攒射而出，当场将一人射成筛子、另一人重伤断腿拖回，吓得袁千绝脸色铁青不敢再乱抢。梁世勋大喜，率队顺陈长庚所指左道安然穿过长廊，率先撞见一座摆有古器架的偏殿；一见宝光，梁世勋立刻翻脸喝令陈长庚与方怀石守在殿门外警戒，自己带三名世家心腹入内瓜分宝器。陈长庚痛快应诺蹲守门外廊柱，趁殿内夺宝无人注意，无声撬开柱基暗槽掘走了整块人头大的二阶“赤铜煞晶母”。"}, {"n": 178, "title": "石廊分路", "synopsis": "踏入第二重“九宫熔铜迷宫”不久，三宗人马在中心石枢狭路相逢，为争夺主殿路线爆发惨烈混战，数十道千斤铜闸轰然坠落分割战场。寒门执事方怀石掩护侧翼时左腿中了血河宗一枚化骨毒镖，梁世勋看都不看一眼，直接纵身跃过铜闸追向主殿火光。陈长庚拉起方怀石闪入岔道，念其一路厚道本分，塞给他一瓶拔毒灵散并指明退回外殿生门石室闭守待援；待方怀石千恩万谢退走，陈长庚眼神转冷，放出五百只紫金煞甲虫开道噬禁，按古矿图径直潜向迷宫下层。"}, {"n": 179, "title": "古臼吞毒", "synopsis": "阴髓寒铜秘钥严丝合缝嵌入云篆锁孔，尘封千载的下层“百炼铸火暗殿”无声滑开一尺窄门。殿心废火池内沉积着半池连铸鼎老怪都不敢徒手触碰的“万年赤铜胎毒膏”，而一板之隔的上方主殿正传来梁世勋、袁千绝与巫千刃联手狂轰护火死禁的震耳爆响。陈长庚算准时机在池边布下敛息倒卷阵，取出满冷却的蚀纹石臼，将刚掘得的赤铜煞晶母配大团万年胎毒膏压入臼心；浓烈异香顺排渣道直入地底岩浆，一刻钟后竟凝出整整六枚蕴含庚金火煞本源的二阶极品“赤金道晶”。"}, {"n": 180, "title": "天骄破禁", "synopsis": "暗殿之内，陈长庚仰头吞下两枚赤金道晶，磅礴药力瞬间将周天仙脉推至开脉中期顶峰圆满，五百只吸食残余铜精的紫金煞甲虫更是凶焰滔天；恰在此时，头顶主殿的“九重血煞锁火禁”在三大开脉圆满高手耗尽保命符器后轰然告破。祭坛中央那团赤金如龙的“赤渊地肺火种”刚露真容，梁世勋与袁千绝便同时出剑互斩拼得吐血倒退，而一直留有余力的血河宗统领巫千刃骤然暴起背刺，一记血煞魔刀劈飞梁世勋、震裂袁千绝护甲，狂笑着张开大网独罩火种。"}, {"n": 181, "title": "盲门瞬杀", "synopsis": "巫千刃血网刚罩向祭坛火种，陈长庚戴黑铁面具自底座暗门悍然暴起，五百紫金煞甲虫瞬间噬穿血煞护罩，八具玄铁煞偶结阵锁死四方退路。巫千刃惊怒交加欲引爆本命血珠拉人垫背，重伤倒地的袁千绝为争逃命喘息之机，咬牙甩出半截断剑刺穿巫千刃小腹气海；陈长庚顺势欺身一记乌金分水刺洞穿其咽喉，用寒玉铅匣连根收走整团赤渊地肺火种与巫千刃储物袋，赶在梁世勋与袁千绝联手翻脸前掷出两枚阴雷火珠炸塌祭坛石柱，退回暗道。"}, {"n": 182, "title": "借水潜沙", "synopsis": "主殿崩塌引动古冢地煞倒灌，梁世勋与袁千绝各自捏碎保命玉符狼狈逃向正门，同时传讯外围驻军封死出口搜捕黑铁面具客。陈长庚不贪残余铜器，先在暗道卸去面具收拢虫偶，绕回外殿生门石室将腿伤未愈、被塌方巨石堵死的方怀石背出险境；面对正门方向震耳欲聋的三宗接应混战，陈长庚借口测风罗盘感应到西侧活风，带着方怀石钻入首夜探明的地下排煞裂隙，顺干涸沙渠悄然穿出十里外戈壁。"}, {"n": 183, "title": "飞舟问责", "synopsis": "返程飞舟议事舱内气氛森寒，折损三名世家心腹又痛失地肺火种的首席梁世勋怕回宗受罚，恶人先告状拍案怒斥陈长庚与方怀石畏战私逃延误破禁，喝令执法弟子当场挑断二人手筋押回刑堂。方怀石急得面红耳赤却嘴笨难辩，陈长庚躬身踏前一步，平静取出梁世勋在偏殿门外亲口喝令二人留守不许入内的传音铁牌，又呈上方怀石腿上拔出的血河宗化骨镖，温和反问梁师兄莫非是与袁千绝私分火种谈崩才遭巫千刃背刺，句句戳穿其贪功遮羞肺管，纪鹤年当场铁面驳回问责。"}, {"n": 184, "title": "分赃定功", "synopsis": "飞舟抵山当日联堂会审，梁世勋因刚愎冒进折损同门被罚削去首席津贴、闭门思过半年；轮到陈长庚核功时，他老老实实交出一筐外殿刮来的普通古铜残片，把脱险全归功于方怀石拼死断后与纪长老接应及时。堂上诸长老见他修为仍停在开脉初期顶峰、衣袍破烂，只当是个命硬本分的匠人，依律赏下八十枚下品灵石及一次入藏经阁二层选诀的功勋木牌；陈长庚恭顺谢恩退堂，避开一切风头径回后山废火窟。"}, {"n": 185, "title": "地火融胎", "synopsis": "深入地下百丈的赤砂暗火道内，陈长庚布妥九宫浊泥封灵阵与二阶困灵阵旗，小心揭开寒玉铅匣放出赤渊地肺火种。火种初出狂暴如赤龙扑噬，陈长庚不强行硬压，而是投喂三粒二阶金煞髓晶诱其温顺缠绕掌心，耗去七日工夫将其炼入丹田气海化作本命火源；随后他连续催动满冷却的蚀纹石臼，将巫千刃遗留的血煞魔刀碎块与古冢刮回的万年铜绿毒苔尽数碾磨提纯，加上古冢余存共凑齐四枚二阶极品赤金道晶。"}, {"n": 186, "title": "贯通后脉", "synopsis": "六月盛夏子夜地肺真火最为炽盛，陈长庚将四枚二阶极品赤金道晶分两次吞入腹中，引丹田赤渊地肺火种顺周天仙脉奔腾煅烧。零丹毒的精纯庚金火髓势如破竹冲开后期壁垒，体内仙脉扩宽一倍有余，体表暗金地火煞罡凝厚如百炼金甲，神识一举外放至四十八丈方圆。稳固境界后，陈长庚运转《地脉敛息阵图》将外露修为精细锁在“苦熬两年刚入开脉中期”的刻度，既能名正言顺享受中期执事待遇，又留足越阶翻盘余量。"}, {"n": 187, "title": "夏窟冰饮", "synopsis": "出关后陈长庚一连歇炉三日，用废置寒玉匣冰镇了一瓦罐山泉酸梅汤，切上两盘盐卤牛腱端到废火窟崖边石亭，陪铅毒大愈、红光满面的寇重山吹风消暑。老人大口吃肉痛饮，笑谈前山梁世勋闭门养伤的狼狈相，直夸陈长庚稳得住性子；午后一名刚从外门拨来扫煤渣的十四岁瘦弱学徒被炉烟呛得直揉眼，陈长庚瞧着像极了昔日盐灶边的自己，随口指点他顺风侧站撤湿炭的窍门，少年千恩万谢，山亭内满是清静人味。"}, {"n": 188, "title": "升阶露峥", "synopsis": "次日陈长庚前往庶务堂报备晋升开脉中期并换领银边执事袍印，堂内几名曾跟着曹敬塘看他笑话的世家执事见他不靠丹堂灵丹竟在废火窟稳扎稳打破入中期，神色顿凛，纷纷主动起身拱手道贺。陈长庚谦和回礼后径赴内门藏经阁二层，避开热门斗法剑诀，用功勋木牌拓印了二阶上品《九转控火诀》与讲述开脉圆满冲击铸鼎要义的《百脉筑鼎篇》，首次在宗门典籍中读到凡内门弟子铸鼎皆须赴祖师堂引“云泽母火”种下护鼎灵印的铁规。"}, {"n": 189, "title": "异纹初疑", "synopsis": "返回赤砂暗火道后，陈长庚逐字参详《百脉筑鼎篇》，并分出一缕由石臼道晶修成的纯粹真气在掌心模拟筑鼎经络走向。行至篇末要求必刻的“归元辅印”节点时，原本圆融无碍的紫金真气忽然生出一丝极隐晦的倒吸滞涩感，仿佛鼎成之日便会留下一道由外人执掌的暗门，而石臼髓晶自带的本源灵韵本能将其弹开。陈长庚心头微凛，虽暂不知高层设此暗印深意，却当即断了日后借宗门母火铸鼎的念头，定下自觅地肺精金母髓私铸无瑕道鼎的方略。"}, {"n": 190, "title": "坊楼压霸", "synopsis": "腿伤痊愈的方怀石特在山下仙缘楼订下临水雅间宴请陈长庚谢救命之恩，酒过半巡，梁世勋的堂弟、开脉中期执事梁世宽带着两名跟班一脚踹开房门，仗势要强征雅间并讥讽方怀石与臭打铁的也配坐二楼。换作刚入宗时陈长庚或会退让，如今他端坐未起，只平静抬眼放出一缕千锤百炼的暗金百锻煞压，“咔”一声当场震裂梁世宽腰间上品护身玉佩，淡淡问他想不想步梁世勋后尘去刑律堂再领半年禁足；梁世宽骇得冷汗直流，乖乖赔下酒钱灰溜溜滚下楼去。"}, {"n": 191, "title": "残匣得讯", "synopsis": "雅间门窗掩妥，方怀石感激陈长庚撑腰，低声吐露巡脉堂绝密风声：半月前北境赤渊裂谷地动，探子在裂谷深处捡到伴生赤精矿砂，疑似底下藏有铸鼎至宝“地肺精金母髓”，只是谷底毒煞能蚀穿开脉圆满护罩，三宗高层正在扯皮试探。陈长庚记在心头，回废火窟后用赤渊地肺火种慢火融开巫千刃储物袋内一只打不开的血纹铁匣，里头果然藏着半幅标注了赤渊裂谷三处地下泄煞口的血河宗密探草图，与方怀石所言严丝合缝。"}, {"n": 192, "title": "鬼集收匠", "synopsis": "预判三宗围绕赤渊裂谷迟早有一场恶仗，陈长庚再扮游方匠师“木石客”赴黑煞鬼集囤积火药矿材，恰撞见鬼集赌坊打手正按着落魄机关匠荀木鸢要剁其右手抵八十枚灵石印子钱。陈长庚深知单靠自己手工箍火珠、打偶壳耗时太慢，当即上前拍出百枚下品灵石买断债契震退打手；荀木鸢死里逃生叩首愿效犬马之劳，陈长庚立下隔月单线交货规矩，将机括煞偶拆成互不关联的零散铁壳铜簧交其批量粗锻，低成本搭起场外军工暗线。"}, {"n": 193, "title": "重铸青盾", "synopsis": "备足辅材后，陈长庚在赤砂暗火道闭门半月，以《九转控火诀》催动丹田赤渊地肺火种，将古冢所得精金熔入随身制式灵器：一阶上品青鳞灵盾经叠浪百锻蜕变为重逾千斤却收发由心的二阶上品“青鳞玄铁重盾”，三柄乌金飞刃亦晋升二阶中品破甲利器；同时用石臼提纯剩余魔器毒渣喂养五百只紫金煞甲虫，令虫群背甲生出暗金火纹直逼二阶中期。至此即便不动用石臼底牌，他单凭明面器道与护体罡气亦足可正面硬撼开脉后期好手。"}, {"n": 194, "title": "秋山访旧", "synopsis": "八月中秋山林染金，陈长庚提着两袋灵谷与自酿药酒先绕去外门丙字废渣房，见残役曲老五将小院种满秋菘、气色红润，笑着留酒叙话半刻；午后又便装逛至黑石坊市九斤杂货铺，贺九斤已带侄儿贺小五盘下隔壁店面把生意做得红红火火，叔侄俩恭敬奉上新沏毛尖，闲聊间提起南边乌卤盐场葛老栓得了块神仙檐玉，如今七十高龄耳聪目明还能抱重孙。陈长庚含笑饮尽热茶，不留名姓踏月归山，只觉满身烟火尘虑皆化作坦荡道心。"}, {"n": 195, "title": "三宗盟会", "synopsis": "回山当夜纪鹤年便急召陈长庚过府：玄煞门与血河宗使团突然联袂抵山，提议三宗暂罢边境零星厮杀，按老规矩各出三名开脉中期执事在迎客坪演武三阵，胜者执掌赤渊沉脉外围三座前哨矿堡头年采矿权。世家一脉被古冢打怕了纷纷称病避战，纪鹤年深知陈长庚根基扎实不浮躁，商请他挂名第三阵替补压阵，若前两阵能赢便无需登台，若登台无论胜败皆记大功一笔；陈长庚算准需要合法靠近赤渊前哨摸底，爽快应承下来。"}, {"n": 196, "title": "观礼识鬼", "synopsis": "迎客坪上气氛紧绷，前两阵云泽宗派出的两名开脉中期好手先后被血河宗阴毒咒印与玄煞门快刀逼落台下，眼看外围三座前哨矿堡将尽数拱手让人，观礼席一片哗然。末席上的陈长庚凝眸细察第三阵即将登场的玄煞门铁塔壮汉拓跋蛮，四十八丈凝实神识悄然扫过其靴底与后颈，发现此人表面修炼玄煞门狂风斧，经脉深处却蛰伏着一团血河宗秘传的“腐血暴气丸”药力——两派分明早已私下串通合演双簧，企图横扫三阵把云泽宗彻底挤出赤渊核心圈。"}, {"n": 197, "title": "一盾镇场", "synopsis": "拓跋蛮当众点名羞辱器堂无人，企图用狂暴巨力废掉云泽宗最后一名执事立威。陈长庚在纪鹤年期许目光中缓步登台，既不放虫也不掐繁复法诀，单手擎起二阶青鳞重盾稳立台心；拓跋蛮暗催腐血暴气丸狂劈三斧，火星如瀑炸裂却震不动陈长庚脚下半寸青砖。就在第三斧旧力刚尽、暴气丸反噬其右肋旧伤微滞的半息间，陈长庚踏步贴身，重盾顺着叠浪百锻暗劲斜撞斧脊，“铛”一声巨响震断拓跋蛮虎口将其连人带斧掀飞台下。"}, {"n": 198, "title": "堂前授禄", "synopsis": "第三阵干净利落的一盾翻盘，硬生生从两宗嘴里夺回赤渊外围咽喉要地“黑岩哨堡”的驻防采矿权，令魔门使团灰头土脸离山。议事大殿论功行赏，宗主亲自颔首嘉许，当众擢升陈长庚为内门一等精锻执事，重赏三百枚下品灵石、免除三年杂役外派，并特批借阅半部内门真传《凝鼎真解》正本；散堂之时，昔日鼻孔朝天的世家执事纷纷夹道拱手恭贺，连远处的曹敬塘都慌忙弯腰赔笑让路，陈长庚在云泽宗内门彻底站稳上层跟脚。"}, {"n": 199, "title": "雪窟围炉", "synopsis": "十月杪初雪封山，地肺废火窟内却暖意融融，寇重山特意让人宰了一头雪山肥羊支起红铜炭锅，纪鹤年与方怀石也踏雪提来两坛三十年灵酒登门道贺。四人围炉涮肉推杯换盏，再无上下级拘束；三巡过后寇重山抚着独眼伤疤感慨万千，低声叮嘱陈长庚：赤渊沉脉底下压着每甲子一沸的地肺煞兽窝，当年他师兄便是信了三宗高层停火盟约被留在谷底当了诱兽弃子，往后若去黑岩哨堡督械，万事多留三条退路，陈长庚郑重敬酒铭记于心。"}, {"n": 200, "title": "真解窥秘", "synopsis": "夜深人静，陈长庚在赤砂暗火道将新领的《凝鼎真解》正本与《百脉筑鼎篇》逐句比对，彻底印证心中猜测：宗门正统凝鼎法门竟将先前那道“归元辅印”深嵌于本命道鼎底座，一旦依诀铸鼎，生死气机便与本山祖师堂母火相连，唯有用蚀纹石臼提纯无主“地肺精金母髓”独立铸鼎，方能练成毫无隐患的无瑕混元煞鼎。此时储物袋内完整灵石已逾两千枚，五百二阶甲虫与八具玄铁煞偶蓄势待发，陈长庚收妥黑岩哨堡督造印信，静待开春踏入赤渊棋局。"}], "chapters": [{"n": 1, "title": "压秤逼井", "body": "“啪！”\n\n铁秤杆重重砸在竹箩沿上，震得雪白盐粒簌簌往下掉。\n\n丙字灶房里黑烟滚滚，呛得人嗓子眼发腥。十六岁的陈长庚垂手站在秤架前，眼角余光却死死钉在副把头周禄的右手大拇指上。\n\n那根粗短黑指正暗暗勾着秤毫根部，硬生生把翘起的秤尾压平了半寸。\n\n“二斤九两半。”周禄吐掉嘴里的草茎，斜睨过来，“陈长庚，今儿的交卤课短了半两。按场规，扣光你这半月的一两工钱。”\n\n所谓交卤课，便是盐场学徒每日熬足十二石黑卤、交够三斤雪白灵盐的死定额。\n\n陈长庚喉头一痒，强行把涌到嘴边的黑血沫子咽回去，躬身往前凑了半步：“周爷，小的卯时起熬足十二石卤，下灶过筛时足有三斤一两，您老再抬抬手？”\n\n“抬手？”周禄嗤笑一声，伸手抓起一撮细盐捻开，“你自己瞅瞅，烧湿柴省火耗，盐里裹的全是潮气！晒干了怕是连二斤八两都不到！”\n\n陈长庚垂下眼皮，盯着自己微微发乌的指节，心里冷笑。\n\n湿柴昨天分明是周禄亲手拨给丙字灶的，哪容学徒挑拣？听说这位周副把头正急着凑够百两纹银，好去巴结驻场的云泽宗孙丹师，抢那丹房司火童子的肥差。\n\n可他这半月的一两纹银，是拿来去药铺抓祛毒散吊命的钱。\n\n在这乌卤盐场熬盐，凡人天生九窍蒙尘，日夜吸入地底火煞毒烟，不出三年便会火毒淤肺。若不拿药散压着，胸闷咳黑血，根本活不过二十五岁。\n\n要想除根，唯有求购云泽宗垄断的净髓引冲开气窍，可一剂劣等净髓引就要十枚下品灵石，折合凡俗纹银足足上千两，哪是熬卤学徒摸得着的？\n\n“周副把头，行行好吧！”旁边铲灰的老灶匠葛老栓拄着铁锹挪过来，满脸褶子挤出讨好的笑，“长庚这娃肺里火毒重，夜里咳得睡不着，全指着这一两银子抓药熬过冬呢！”\n\n“老不死的，这儿有你说话的份？”\n\n周禄脸色一沉，抬脚便踹在葛老栓迎面骨上。\n\n咔的一声闷响，葛老栓惨叫着仰面栽进滚烫的草木灰堆里，半天爬不起来。\n\n周禄是冲开了两处气窍的通窍武夫，一脚下去寻常三五个壮汉都扛不住。灶房四周七八个学徒吓得齐齐缩紧脖子，握着搅卤木耙大气不敢喘。\n\n麻脸学徒偷偷扯了扯同伴袖口，低头只顾往灶膛塞柴，连看都不敢往这边看一眼。\n\n陈长庚藏在破袖里的五指猛地攥紧，又在一息之间松开。\n\n现在扑上去拼命？他连一处气窍都没通，还没近身就会被周禄一拳打断胸骨，再扣个殴打把头的罪名拖去喂狼犬。\n\n这口气咽下去虽亏了一两银子，却还能留着命算后账。\n\n陈长庚弯下腰，先替周禄掸了掸靴面溅上的灰星子，声音低顺谦卑：“周爷息怒，葛老伯老糊涂了，短了盐课全是小的手艺不精，小的认罚。”\n\n周禄往地上啐了口浓痰，拿铁秤杆拍了拍陈长庚瘦削的锁骨，得意地眯起眼：“算你小子识相。不过场规就是场规，光扣工钱可平不了短秤的账。”\n\n陈长庚眼皮微跳：“周爷吩咐。”\n\n“西头三号盲井昨儿卤水渗漏，上头催着查验。”周禄嘴角勾起一抹狞笑，“明早卯时，你背绳筐下井探漏。摸清了漏点，这半两盐的亏空爷就替你抹了！”\n\n这话一出，周围添柴的几个学徒脸色刷地白了。\n\n麻脸学徒手一抖，柴火砸在脚背上都没敢吭声，只用蚊子哼似的声音嘀咕：“三号盲井？前两月刚熏死两个壮劳力……”\n\n“谁裤裆没拴紧瞎放屁？”周禄猛地扭头瞪过去，“心疼他？明早换你替他下井！”\n\n麻脸学徒吓得一哆嗦，把脑袋埋到灶台底下：“小的不敢！周爷圣明！”\n\n周禄冷哼一声，铁秤杆重重杵在陈长庚肩头：“听准了，明早卯时井口见。晚半刻钟，爷打断你的狗腿直接扔下去！”\n\n“小的记下了，谢周爷留口饭吃。”陈长庚低眉顺眼地弓着背，一直目送周禄晃着膀子跨出丙字灶大门，脸上赔笑才一点点敛去。\n\n他快步转身，把葛老栓从灰堆里架到矮木凳上，伸手替老人揉开青紫的小腿肚。\n\n“长庚……咳咳，你怎能应下来啊！”葛老栓死死抓住他的胳膊，老眼通红，“三号盲井废了整整三年，井底积的全是蚀肺黑瘴！没通气窍的人下去，不出半刻钟就得烂肺吐血！”\n\n“不应下，他刚才就能借题打死我。”陈长庚拧了把湿布替老汉擦净灰脸，声音很轻，却稳得没有一丝颤音。\n\n“那你趁夜跑吧！”葛老栓压低嗓门急道，“往芦苇荡钻，好歹搏条活路！”\n\n“跑不掉的。”陈长庚瞥了眼窗外高耸的木望楼，“身契锁在管事房，大泽外围全是巡防铁骑和灵犬，跑出三里就是死尸一具。”\n\n葛老栓绝望地捶了下膝盖，颤巍巍摸向腰间破布袋，倒出十二枚磨得发亮的铜钱：“老头子就剩这点家底，镇口药铺半包避瘴散少说要四钱银子，这可咋凑……”\n\n陈长庚按住老人干枯的手掌，把铜钱推了回去：“葛伯留着买杂粮饼吧，别让人瞧见您接济我。避瘴散的钱，我夜里自己想辙。”\n\n摸了摸自己怀里仅剩的三十几文铜板，陈长庚眼底寒意渐深。\n\n明面上的活路已被周禄堵死，想在明早卯时前弄到换药钱甚至反咬一口，只剩后巷那座坍塌了半截的旧卤槽。\n\n亥时刚过，乌卤盐场各灶歇了大火，腥咸浓雾裹住了整片低矮草棚。\n\n陈长庚拿湿麻布蒙住口鼻，怀揣一把磨尖的旧铁刮刀，贴着墙根摸进了丙字灶后巷的废墟。\n\n这座旧卤槽三年前因地裂塌陷，槽底石缝时常渗出刺鼻地煞毒气，把头们嫌晦气便彻底弃用了。可老盐工都清楚，陈年卤水顺着石槽暗缝干涸后，往往会结出一层成色极高的雪白私盐。\n\n半包上等精盐在脚行私底下能换四五两纹银，足够他买齐避瘴散再留条后手。\n\n陈长庚伏低身子钻进断石拱门，凭着熬卤三年练出的观烟辨味本事，避开两处冒绿泡的毒泥坑，顺着倾斜的青石槽壁摸到底部。\n\n借着乱石缝漏下的一线残月光，槽底背风处果然凝着厚厚一层白霜！\n\n他心中一喜，掏出油布袋垫在下面，手腕发力，用铁刮刀顺着石纹飞快铲下大片雪白晶亮的盐皮。\n\n一捧、两捧……油布袋很快鼓起了大半包，颗粒饱满毫无黑斑，比今日交课的官盐还要纯上三分。\n\n“笃！笃笃——”\n\n巷口外忽然传来清脆的竹梆声！\n\n火把红光扫过断墙豁口，两名提刀巡夜趟子的脚步声正朝旧卤槽逼近。\n\n“慢着，废槽里头咋像有铁器刮石头的动静？”一个粗嗓门停步喝问。\n\n陈长庚浑身肌肉骤绷，毫不犹豫抓紧油布袋，一头缩进了槽底最深处的狭窄地裂岩缝里，死死屏住呼吸。\n\n外头火把晃了两晃，另一个懒洋洋的声音骂道：“你小子喝多了吧？那塌槽底下直通地煞毒脉，野耗子钻进去都得烂穿肠子，哪个嫌命长的敢往里钻？”\n\n“倒也是，这鬼味儿闻一口少活半年，赶紧巡完去东棚烤火！”\n\n脚步声骂骂咧咧地远去。\n\n岩缝深处闷热刺鼻，陈长庚憋得胸口火辣辣生疼，右手往湿滑的黑泥里一撑想要挪身，指腹却猛地硌在了一件棱角锋利的硬物上。\n\n既不像青石，也不像烂铁。\n\n等外头梆子声彻底消失在北巷，他才缓过一口气，拿铁刮刀沿着黑泥撬了两下，将那东西从厚厚的剧毒黑卤渣里抠了出来。\n\n凑到月光缝隙下一看，竟是一只巴掌大小的缺角灰石窝，灰扑扑的毫无光泽，活像灶房里砸碎的破蒜臼子。\n\n可陈长庚发乌的大拇指刚擦过石窝缺口，指肚便是一痛，渗出一丝血珠。\n\n他定睛细看，只见那缺角断面上竟嵌着一道非金非玉的暗金裂痕！他试着用铁刮刀刃口狠刮了两下，铁刃卷了白口，那暗金丝纹与灰石壁却连半点白印子都没留下。\n\n被地煞黑卤泡了不知多少年竟丝毫不腐，这破石窝绝非凡物。\n\n此地不宜久留，陈长庚来不及细琢磨，连同石窝槽心沾满的一团黑卤毒渣一起裹进破布，塞入贴胸怀里，猫腰爬出了坍塌旧卤槽。\n\n刚翻过断墙钻回丙字灶后巷的阴影里，贴着左胸皮肉的灰石窝陡然滚烫起来！\n\n陈长庚脚步猛地钉在原地，惊疑不定地按住胸口。\n\n只见怀里那只缺角灰石窝正贴着肋骨微微发颤，烫得如同刚出炉的火炭，而粘在石窝内壁的那团剧毒黑卤渣，竟在肉眼可见地融化干瘪，化作一缕刺鼻腥甜的白烟钻出衣领！"}, {"n": 2, "title": "私盐钓狼", "body": "那股腥甜白烟刚钻出衣领，便被巷口倒灌进来的灶房浓黑煤烟卷散了。\n\n陈长庚背贴冷墙等了十来息，见四周无人察觉，才快步闪回丙字灶草棚最里头的角落。\n\n同棚的几个学徒怕沾他的霉运，今晚全挤去了前院暖烘槽睡觉，破草棚里空无一人。\n\n他反手插上木栓，借着墙缝透进的微光掏出那只缺角灰石窝。\n\n方才还烫得灼人的灰石窝此刻已彻底凉透，死气沉沉地躺在掌心。原本粘在臼心里的半团剧毒黑卤渣干干净净没了踪影，只剩石壁内侧隐约露出的几道古朴蚀纹，连那缕腥甜气也散得无影无踪。\n\n陈长庚心念微动，从鞋底抠下一小块黑盐泥丢进臼心，屏息盯了半晌。\n\n灰石窝纹丝不动，半点反应也无。\n\n“看来刚才只是耗尽了它积在槽底的余劲。”陈长庚眉头微蹙，很快冷静下来。\n\n不管这带暗金裂痕的石臼藏着什么门道，眼下它既然沉寂了，明早卯时就指望不上它救命。\n\n陈长庚蹲下身，用铁刮刀撬开床铺底下松动的冷烟道青砖，将灰石窝严严实实埋进暗格，又撒上一层浮灰抹平痕迹。\n\n做完这一切，他摸出怀里那半包雪白晶莹的私盐，在手里掂了掂。\n\n离天亮只剩不到两个时辰，镇口药铺辰时才开门，现在就算拿着私盐也换不到避瘴散。更何况葛老栓说得明白，三号盲井封了三年，底下的黑瘴毒囊一旦踩破，光靠凡俗避瘴散照样得死在井底。\n\n自己没通气窍不能下井，那便只能请一位通了气窍、又急着发横财的贵人替自己下去探路了。\n\n陈长庚脑海里浮现出周禄压秤时那双贪得发红的三角眼，指尖轻轻系紧了油布袋的活结。\n\n寅末卯初，大泽上空还蒙着一层铁灰色的浓雾。\n\n葛老栓揣着一块浸湿了醋水的厚麻布摸进棚门，塞到陈长庚手里，嗓音沙哑：“长庚，实在躲不过就拿醋布死死捂住嘴，顺着井口浅处晃一圈赶紧喊拉绳，千万别往深处走！”\n\n“葛伯放心，我心里有数。”陈长庚接过醋布揣好，背起一只破竹筐走出了草棚。\n\n盐场西头的荒滩上，三号盲井黑黢黢的井口像只张开的兽嘴，四周寸草不生，连泥土都泛着一层紫黑色。\n\n井口木绞盘旁，周禄早已披着件油光水滑的羊皮坎肩候着，手里拎着根牛皮长鞭，身后还跟着麻脸学徒和高个学徒两个帮闲。\n\n“磨蹭什么？奔丧还挑吉时？”周禄见陈长庚走近，手腕一抖，鞭梢啪地抽碎了脚边的盐壳。\n\n陈长庚缩着肩膀小跑上前，指了指冒着淡绿雾气的井口：“周爷，今早井口返上来的风味儿有点不对，能不能容小的先投块火石试试……”\n\n“试你娘的头！”\n\n周禄根本不给他开口拖延的空当，一脚踹在旁边的牛皮绳筐上：“少跟爷耍花活！赶紧滚进筐里，半个时辰内摸不清漏水石缝，拉上来再抽你二十鞭子！”\n\n麻脸学徒和高个学徒连忙上前架起绳筐，催促道：“长庚，别磨叽了，周爷赶着回前院吃早酒呢！”\n\n眼看两人伸手就要往井口推人，陈长庚脚下一绊，把破竹筐递出去的同时，左手像受惊似的死死捂住胸口破衣襟，眼神慌乱地往两个帮闲脸上瞟了一眼。\n\n这副欲盖弥彰的贼相，瞬间落进了周禄眼里。\n\n“慢着！”周禄三角眼一眯，铁钩似的大手一把揪住陈长庚衣领，“怀里揣的什么玩意儿？掏出来！”\n\n“没、没什么！”陈长庚拼命往后缩脖子，脸色煞白，“就是葛老伯给的一块擦汗破布……”\n\n“破布你捂得跟命根子似的？”\n\n周禄冷笑一声，顺手用鞭柄往他怀里一挑，刺啦扯裂破布衫，那只鼓囊囊的油布包当场滚落出来，散开一角，露出里头雪白耀眼的细盐粒！\n\n高个学徒倒吸一口凉气，脱口喊道：“好家伙！头等雪花精盐！这成色拿到脚行私换，半包少说值五两纹银！”\n\n周禄眼珠子瞬间亮得吓人。他蹲下身捻起几粒放进嘴里一咂，咸鲜回甘、毫无苦涩杂质，绝不是丙字灶大锅熬出来的粗货！\n\n“好你个吃里扒外的狗东西！”\n\n周禄猛地站起身，扬起牛皮长鞭，狠狠一鞭抽在陈长庚左肩上！\n\n啪！血痕透衣而出，火辣辣的剧痛震得陈长庚半边身子发麻，顺势扑倒在盐泥地里。\n\n“说！这等精盐你打哪儿偷来的？”周禄踩住那包私盐，鞭梢直指陈长庚鼻尖，“不说实话，爷现在就拿私盗官盐的罪名沉了你！”\n\n陈长庚疼得倒抽冷气，跪在泥地里瑟瑟发抖，先拿惊恐的眼神扫过旁边两个伸长脖子的学徒，才压低声音带着哭腔求饶：“周爷饶命！真、真不是从官灶偷的……”\n\n“那是天上掉下来的？”周禄弯腰逼近半步。\n\n“是小的昨晚怕死，半夜摸来这三号井口探风……”陈长庚嘴唇哆嗦着，声音压得只有近处几人能听清，“小的听见井底风响跟拉空风箱似的，井口下头三尺的石缝里结了一层白霜，刮下来就是这盐！”\n\n周禄瞳孔猛地一缩！\n\n他在盐场混了十年，哪能不明白“空风箱风声配石缝白霜”意味着什么？那是封闭废井地气凝聚三年才偶有一遇的“老卤冰晶”！\n\n陈长庚像是怕极了挨打，还在竹筒倒豆子般颤声讨饶：“小的听老灶匠提过一嘴，废井岩缝要是结了老卤冰晶，底下必有一大窝晶簇，少说值四五十两纹银！小的本想今早悄悄抠两块上来孝敬周爷，求周爷高抬贵手……”\n\n四五十两纹银！\n\n周禄呼吸陡然粗重起来，心脏咚咚狂跳。\n\n他手头攒了六十两私房钱，离打点孙丹师的百两纹银正好差这四十两！只要拿到这窝老卤冰晶，下个月他就能进丹房当体面的司火童子，再不用在这折寿的臭盐灶熬日子！\n\n旁边麻脸学徒听得直咽唾沫，眼珠一转，忙凑趣道：“周副把头，四五十两的大横财啊！要不要小的赶紧跑回去禀报大把头他老人家，多调几个好手下来挖？”\n\n这话简直精准踩在了周禄的尾巴上！\n\n去报给叔父周大昌？他那个吃人不吐骨头的亲叔父一旦插手，大头九成全得进周大昌腰包，顶多打发他二两汤水钱！\n\n“禀你娘个屁！”\n\n周禄反手就是一记响亮耳光，抽得麻脸学徒原地转了个半圈，嘴角飙血。\n\n“这病秧子满嘴胡吣，指不定就是两撮不值钱的废盐花！”周禄捂紧怀里那半包私盐，凶神恶煞地瞪着两个帮闲，“惊动我叔父跑来扑个空，你小子替爷挨家法？”\n\n麻脸学徒捂着肿脸连连点头：“小的该死！小的多嘴！”\n\n“前头五号灶还缺人看火，你俩立刻滚回去盯着！”周禄抬脚踹在高个学徒屁股上，“今儿井口的事谁敢往外漏半个字，爷割了他的舌头喂狗！”\n\n两个学徒哪敢触霉头，连滚带爬地绕过灰堆跑没了影。\n\n荒滩井口转眼只剩下周禄和趴在地上的陈长庚。\n\n周禄低头打量着直喘粗气的陈长庚，眼底精光闪烁，飞快拨打着算盘。\n\n让这病秧子下去挖？老卤冰晶脆得很，万一这蠢货手重一镐凿碎了，或者在黑灯瞎火的井底偷偷往裤裆里藏最大的一块，自己岂不血亏？\n\n何况自己是通窍二窍的武夫，闭气半盏茶工夫轻而易举，浅层黑瘴根本奈何不了他！\n\n“废物点心，瞧你那手抖的熊样，凿碎了冰晶把你骨头熬油都赔不起！”\n\n周禄越想越觉得稳妥，一把夺过竹筐里的鹤嘴铁镐，又摸了摸袖底贴身藏着的防身短匕，抬脚将陈长庚踹离井沿：“滚去绞盘后头守着！爷亲自下去瞧瞧！”\n\n陈长庚捂着肩膀爬起来，惶恐点头：“是、是！小的替周爷拉紧绳头！”\n\n“竖起耳朵听准了！”周禄单手抓紧牛皮绳筐的粗麻绳，厉声喝道，“底下晃三下绳子，你就拼命摇绞盘往上拉！敢偷懒松手，爷上来拧断你的脖子！”\n\n“周爷放心，小的拿命盯着绞盘！”\n\n周禄满意地哼了一声，翻身跨进牛皮绳筐，借着滑轮吱呀转动声，飞快滑进了黑黢黢的三号盲井深处。\n\n井口边缘，陈长庚低头应声的谦卑神色寸寸褪尽，脊背缓缓挺直，右手已悄然攥紧了滑轮铁钩侧面的活扣销子。"}, {"n": 3, "title": "盲井埋骨", "body": "三号盲井深逾七丈，越往下井壁越窄，紫黑色的蚀肺毒瘴像浓粥一样翻涌在井底。\n\n陈长庚站在绞盘木架旁，掌心轻轻搭在绷紧的粗麻绳上，耳朵贴近冰凉的井圈石沿，静静听着底下的动静。\n\n“叮！叮——”\n\n井底六丈深处很快传来鹤嘴铁镐凿击岩壁的脆响，夹杂着周禄压抑不住的粗重喘息和低声咒骂：“妈的，盐霜怎么全卡在黑石夹缝里……再往里凿半尺！”\n\n陈长庚眼神幽冷，没有催促，也没有拉绳。\n\n昨晚他在旧卤槽底摸爬过，太清楚乌卤盐场地底的脾性了——凡是结出雪白老盐霜的断层背后，十有八九包着积蓄数年的高压毒水囊。寻常老盐工刮霜只敢拿竹片轻扫，像周禄这样贪急交加抡铁镐硬砸，跟找死没有分别。\n\n果然，底下第五镐刚落，井道深处陡然传出一声极细微的“嗤嗤”漏气声，活像滚油锅裂开了一道细缝！\n\n井底的周禄被横财迷昏了头，丝毫没察觉异响，反而抡圆膀子狠狠砸出了第六镐！\n\n“咔嚓——轰隆！”\n\n脚下荒滩猛地一震！\n\n井底岩层轰然炸裂，碎石坍塌的闷响混着周禄凄厉的惨叫声冲天而起，一股腥臭刺鼻的黑绿浓瘴像喷泉般窜上井道半腰！\n\n陈长庚早有防备，在震响传来的瞬间便捂紧浸醋麻布疾退三步，站到上风口屏住呼吸。\n\n足足过了十息，井口翻涌的毒雾才重新往下沉降。\n\n陈长庚这才猫腰凑回绞盘边，故意带着哭腔朝井下喊道：“周爷！周爷您没事吧？底下怎地塌了？”\n\n黑漆漆的井底死寂了三四息，紧接着响起粗重如破风箱般的呛咳与拖拽断腿的摩擦声。\n\n“咳咳……长、长庚！”周禄嘶哑变调的喊声从井底传来，“塌了两块脆页岩，砸断爷的左小腿了！没大事！”\n\n六丈下的乱石堆旁，周禄满脸乌血，左小腿折成诡异的弯角，刚才毒囊炸裂那一口浓瘴呛进肺管，烧得他五脏六腑都在抽搐，两窍武夫的气力已泄去了七八成。\n\n可他仰头望着井口那碗口大的天光，眼底闪过的却是怨毒至极的凶光。\n\n绝不能让这臭小子知道自己偷挖私盐摔断了腿！更不能留活口把风声漏给叔父周大昌！\n\n“长庚，好兄弟！”周禄强忍剧痛爬到悬空的绳筐旁，挤出无比热络的嗓音，“岩缝里真有一大窝老卤冰晶，全揣在爷怀里了！你快把精铁吊钩再放低三尺勾住爷腰带，拉爷上去！一上井爷分你一半，足足二十五两雪花银！”\n\n井口上，陈长庚面无表情地听着。\n\n昨天为半两莫须有的潮气扣光他救命工钱的人，现在断了腿反倒大方得要分他二十五两银子？\n\n更要命的是，陈长庚搭在麻绳上的指腹清晰察觉到：底下拽绳子的力道偏在一侧，明显只有左手在晃绳筐，而井壁石缝间刚刚擦过一声极其轻微的铁刃出鞘轻鸣！\n\n周禄右手正反扣着袖底短匕，只等拉上井口照面的刹那，一刀捅穿他的咽喉灭口！\n\n“二十五两？谢周爷大恩！小的这就放钩子下来接您！”\n\n陈长庚高声应承着，左手哗啦啦倒摇绞盘放长麻绳，右手却利落地拔掉滑轮侧面的活扣销子，抓起连着短铁链的三爪精铁吊钩，拿湿醋布死死勒住口鼻，悄无声息地踩着井壁检修暗阶摸下了两丈深处！\n\n这截暗阶藏在井道背光凹槽里，正好卡在浓瘴上方与微光交界的死角。\n\n井底浓雾中的周禄视线模糊，只看见黑影里的精铁吊钩晃晃悠悠垂到了头顶三尺处。\n\n“再低半尺……对，抓稳绞盘往上拉！”\n\n周禄狞色暴起，仅存的右好腿猛地蹬地跃起，左手一把抓住铁链借力上窜，蓄势已久的右手短匕化作一道寒芒，朝着记忆中井沿探头拉绳的位置狠辣无比地斜撩而上！\n\n一刀挥空！\n\n头顶根本不是井口，而是距离井底尚有四丈的幽暗井腰！\n\n“你——”\n\n周禄骇得魂飞魄散，一抬头，正对上侧面暗阶凹槽里陈长庚那双毫无温度的眼睛。\n\n陈长庚半句废话不吐，借着居高临下的冲势，双手抡起沉重的三爪精铁吊钩，朝着悬在半空无处借力的周禄脖颈悍然砸落！\n\n“噗嗤！”\n\n锋利的铁钩尖爪干脆利落地贯穿了周禄毫无防备的咽喉，直接震碎了喉骨！\n\n周禄眼珠暴凸，喉咙里只涌出一串血沫子，右手的短匕当啷砸在石壁上，双腿乱蹬了两下便彻底瘫软下去。\n\n陈长庚屏紧最后一口气，顺着绳索滑落井底乱石堆，动作极快地拔出铁钩。\n\n他没有直接弃尸，而是拖着周禄衣领将其重重按向一块棱角尖利的塌方青石，让青石断茬严丝合缝地豁开咽喉钩孔，又把短匕塞回周禄靴筒，将那把鹤嘴铁镐和几粒散碎私盐丢在尸体右手边，顺手从周禄怀里摸走了自己那半包雪白私盐。\n\n贪挖私盐、一镐砸塌毒囊摔在尖石上穿喉毙命——任谁下井验尸也挑不出半点人为破绽！\n\n做完这一切，陈长庚肺部已憋得生疼，手脚麻利地攀回地面，用井口黑泥抹净铁钩血迹重新插回滑轮活扣。\n\n紧接着，他扯下醋布在井沿浅瘴边故意吸了小半口毒气，呛得脸色瞬间惨白如纸、连咳数声黑痰，这才跌跌撞撞跑出十来丈，一头栽倒在通往丙字灶的盐泥路上，嘶声力竭地喊道：“来人啊……三号井塌方了！”\n\n这一嗓子瞬间炸翻了半座盐场。\n\n值守趟子与外灶管事带着长钩火把赶到三号井口，冒死用长杆捞起满身碎石黑血的周禄尸身，一瞧手里紧攥的盐粒和塌方铁镐，个个吓得面无人色。\n\n凑巧正把头周大昌今日一早进镇交账未归，外灶管事哪敢担责，草草拿芦席盖了尸首等周大昌回来发落，又嫌被毒瘴熏得“人事不省”的陈长庚碍眼，让人抬回丙字灶破草棚自生自灭。\n\n挨到戌时入夜，前院十二口大铁锅重开夜火，滚滚黑烟再次笼罩了丙字灶后巷。\n\n破草棚角落里，装晕躺了大半天的陈长庚忽然睁开双眼。\n\n床铺底下的冷烟道青砖缝里，正源源不断渗出一股惊人的灼热！\n\n乌卤盐场地底煞脉每隔三日便有一轮地脉大潮，今夜戌时恰逢潮汐顶峰。\n\n陈长庚翻身下床，确认草棚外连个人影都没有，立刻撬开青砖取出滚烫发颤的灰石臼，揣着它猫腰钻进丙字灶大烟囱背风的死角。\n\n他抓起铁铲，从废渣坑里铲出一大团人人避之唯恐不及的剧毒废卤黑渣，悉数塞进灰石臼的凹槽内，将臼底死死贴在渗出地热的气孔石板上。\n\n断口处那道暗金裂痕微光一闪，灰石臼无需石杵捣磨，竟自行吞吐地脉潮汐热力，将整团剧毒黑渣一层层碾融剥离！\n\n约莫过了一刻钟，收尾的石臼陡然逸散出一股极其浓郁刺鼻的地火腥甜气！\n\n好在头顶三尺便是丙字灶排烟总口，呼啸喷涌的滚滚黑煤烟瞬间将这股异味裹挟冲散，外头半点也闻不见。\n\n腥甜气一敛，灰石臼重归冰凉。\n\n陈长庚低头往臼心一瞧，心脏猛地一跳——原本腥臭粘稠的一大团黑毒渣已消失得干干净净，臼底正中竟析出了一小撮晶莹剔透、泛着温润白光的细碎晶砂！\n\n他伸指沾起两粒，指尖顿觉一股精纯至极的暖流顺经脉直透肺腑；可粘在温热指肚上的另外半粒碎屑，不过短短数息便肉眼可见地黯淡了一分！\n\n这宝贝离了石臼存不住太久，不赶紧吃下怕是要散成白灰！\n\n陈长庚不再迟疑，仰起脖子将臼心那一整撮莹白道髓晶砂尽数倒入口中，咽入腹内。\n\n没有半分劣等净髓引那种灼裂经脉的狂暴丹毒！晶砂入腹即化，变成一股温润却沛然莫御的暖流，如烧红的铁锥般狠狠撞向胸口蒙尘闭塞的第一处主气窍！\n\n“啵！”\n\n胸骨深处仿佛响起一声轻不可闻的裂帛声。\n\n陈长庚猛地扶住烟囱砖墙弯下腰，喉头翻涌，哇地吐出一大团腥臭粘稠的黑红淤血！\n\n三年熬卤积在肺底的陈年火毒竟被这一冲排出了大半！他深深吸进一口夜气，清凉气息直贯小腹，原本发乌的十指迅速泛起活人血色，双臂筋骨噼啪轻响，连二十步外泥沟里野鼠啃草根的细碎声响都听得清清楚楚！\n\n通窍境第一窍，成了！\n\n陈长庚拿黑煤灰严严实实盖住地上的淤血，将重归沉寂、怕是得等下轮三日地脉潮汐才能再用的石臼贴肉藏稳，又往脸上抹了把白灰，悄悄溜回草棚钻进破被窝里。\n\n前脚刚闭上眼装出虚弱呻吟，草棚外泥水地里突然响起一串急促杂乱的脚步声！\n\n苇帘被人一把掀飞，满头冷汗的外灶管事跌跌撞撞冲进来，指着床铺上的陈长庚失声喊道：“别装死了，快爬起来！驻场巡灶的云泽宗孙丹师亲自进了丙字灶，点名要验看那个活着出井的熬卤小子！”"}, {"n": 4, "title": "慈颜赐汤", "body": "草棚苇帘被掀飞的刹那，门外紧跟着卷进一股浓烈的血腥煞气。\n\n外灶胡管事哈腰让开门口，铁塔般的正把头周大昌大步跨进草棚，直接堵住了退路。\n\n通窍三窍武夫的凶悍劲力一震，棚顶枯草混着灰土簌簌往下掉。\n\n“就是这病秧子今早跟阿禄一块儿去的三号井？”\n\n周大昌双目赤红，蒲扇般的大手一把揪住陈长庚破衣领，将他整个人从铺板上硬生生提了起来！\n\n陈长庚顺势双脚离地，无力地抓挠着周大昌铁箍似的手腕，脸色惨白如纸，嘴角咳出半缕黑痰：“大、大把头饶命……小的在井口守绞盘，井底突然塌了……”\n\n“塌你娘的尸！”\n\n周大昌虎目圆瞪，五指骤然收紧：“阿禄通了两窍，闭气能撑半盏茶，怎会偏偏摔断腿扎穿嗓子？说！他在井底挖出的东西让你藏哪儿了？”\n\n身后两名周家心腹打手哗啦一声抽出厚背砍刀，反手便去插草棚木门。\n\n老灶匠葛老栓吓得扑通跪进泥水里：“大把头开恩呐！长庚出井时人都被毒瘴熏晕了，抬回来一口水都没咽下去……”\n\n“老东西滚一边去！”周大昌一脚踢翻矮木凳，指骨捏得咔吧作响，“小杂种，撬不开你的牙，老子今晚把你一寸寸捏碎了填井！”\n\n脖颈骨骼发出不堪重负的酸响，陈长庚眼底寒如死水，手脚却只做徒劳乱蹬状，一丝刚冲开首窍的气力都不露。\n\n周大昌刚从镇上交账赶回，没凭没据就敢动私刑逼问井底赃物，分明知道周禄暗地里在攒买路银。这时候一旦露劲挣脱，反倒坐实了井下有鬼！\n\n就在周大昌左手铁爪扣向他锁骨的瞬间——\n\n“咳。”\n\n草棚门外忽然响起一声轻缓温和的干咳。\n\n声音不大，却像一盆冰水迎头浇在周大昌天灵盖上。\n\n两名刚亮出厚背刀的打手浑身一僵，慌手慌脚把刀刃往裤腿后头塞。\n\n泥泞门帘外，一名身穿青灰道袍、须发微白的老者负手踱了进来。他手里端着一只素白药盅，神色慈和，鞋底离黑泥地面始终悬着半寸，不沾寸缕泥污。\n\n驻场巡灶仙师，通窍九窍圆满的孙奉先！\n\n周大昌脸上的横肉猛抽了一下，松开五指，陈长庚噗通摔回铺沿上，捂着脖子剧烈呛咳起来。\n\n“孙、孙仙师！”周大昌慌忙弯下腰，额角瞬间渗出豆大冷汗，“您老人家千金之躯，怎地踩进这腌臜草棚来了？”\n\n孙奉先眼皮都没抬，慢条斯理地瞥了眼打手藏在身后的刀柄：“周把头好大的威风。云泽宗外门铁律，盐场学徒身契归宗门矿司管辖，何时轮到你私设公堂、擅杀苦役了？”\n\n“小的不敢！借小的十个胆子也不敢坏宗门规矩！”周大昌膝盖一软，连连作揖，“只是小的那不成器的侄儿今早惨死三号废井，小的急糊涂了，想问清井底实情……”\n\n“三号井捞上来的尸首，老夫路过前院时已经验过了。”孙奉先缓步走到破床前，语调慢悠悠的，“咽喉撞在青石断茬上，右手还紧攥着私采的老盐霜。贪心不足凿破毒囊，怨得了旁人？”\n\n周大昌嘴唇哆嗦了两下，一个字也不敢顶撞：“仙师明鉴……是那逆子自作孽！”\n\n孙奉先不再理他，俯下身，伸出三根枯瘦温热的手指，轻轻搭在陈长庚左腕脉门上。\n\n陈长庚呼吸微滞，全身顺势装作惊惧发抖，心念却暗暗压住胸口首窍那一缕初生暖流。\n\n九窍圆满的老丹师亲自搭脉，会不会当场摸出他前半夜刚破开第一窍的底细？\n\n一息，两息，三息。\n\n一道细若游丝的温热气流顺着指腹钻入腕脉，绕着陈长庚心肺缓缓转了半圈。\n\n孙奉先浑浊的老眼深处，陡然掠过一抹极难察觉的狂喜！\n\n这少年肺底积了三年盐毒，寻常学徒早该烂肺吐血，他竟硬扛过了三号井浓瘴，连蒙尘闭塞的第一处气窍都被生死大劫激开了一线！\n\n当真是打着灯笼都难找的耐火毒良胚！\n\n孙奉先收回手指，笑容越发慈祥温和，轻轻拍了拍陈长庚瘦削的肩头：“苦命的娃儿。熬了三年毒卤，又遭盲井大难，倒生出几分耐火煞的韧劲，连首窍都自行松动了。”\n\n满棚人齐齐倒吸一口凉气！\n\n周大昌眼珠子差点瞪出眼眶——没喝净髓引，被毒瘴一冲竟撞松了气窍？这等泼天造化怎会落在这小畜生头上！\n\n陈长庚恰到好处地露出茫然又惶恐的神情，滚下床铺重重磕头：“小的愚钝，全凭仙师金口搭救，不然今晚就交代在这儿了！”\n\n“老夫向来见不得耐苦懂事的孩子白折在盐灶里。”孙奉先轻叹一声，偏头看向脸色铁青的周大昌，“丹房前几日刚病故了一名司火童子，炉前缺人看火。这陈长庚，老夫今晚便领走了，周把头可有异议？”\n\n周大昌后槽牙咬得咯咯作响，脸上却不得不挤出比哭还难看的媚笑：“仙师肯抬举这小子，是他八辈子修来的福分！明早小的就亲自把他的身契送去丹房！”\n\n“嗯，算你懂规矩。”孙奉先淡淡颔首，低头朝陈长庚温声道，“起来吧，随老夫回丹房，夜里风寒伤肺。”\n\n“谢孙仙师活命大恩！”\n\n陈长庚磕了个响头，借着弯腰系草鞋的工夫按了按贴胸绑紧的灰石臼，低眉顺眼跟在了孙奉先身后。\n\n经过门口时，葛老栓激动得老泪纵横，冲他连连摆手示意安心去；周大昌垂在袖侧的双拳却青筋暴起，目光怨毒如刀。\n\n巡灶丹房坐落在盐场东坡的地火泉眼上，院门守着两名披甲护院，院里闻不见腥臭卤气，只飘着一股浓郁苦涩的药草香。\n\n踏入外间暖室，孙奉先挥退值夜杂役，指了指靠墙的干净竹榻：“往后你便住这外间，白日替老夫看守地火风门，夜里安心调养。”\n\n“
