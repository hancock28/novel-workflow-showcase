  <script id="pub-data" type="application/json">{"books": [{"id": "female", "badgeClass": "female", "tag": "女频 · 玄学世情", "title": "凶宅相师：真千金铁口断生死", "logline": "从小在阴山道观长大的真千金沈知微回豪门当天，凭两处日常反常错位铁口直断族人血光之灾，手执玄铁量天尺劈碎豪门与都市凶宅里的借运厌胜局，顺手收服身负七杀绝脉的古建掌权人陆宴辞，在长篇连环诡案中逐一拔除七根夺运阴钉、联手掀翻窃命邪师集团。", "outlineUrl": "files/female_outline_1_100.txt", "outlineFileName": "《凶宅相师：真千金铁口断生死》_第1-100章大纲.txt", "proseUrl": "files/female_chapters_1_10.txt", "proseFileName": "《凶宅相师：真千金铁口断生死》_第1-10章正文.txt", "outlines": [{"n": 1, "title": "回门宴铁口断折腿", "synopsis": "自幼在阴山青云观长大的真千金沈知微背着十二斤玄铁量天尺与生母留下的半截染血鲁班尺回到江城沈家。回门家宴上，生父沈建业冷漠敷衍，假千金沈楚楚茶言茶语要将她塞进阴气最重的北侧杂物阁楼，二婶张翠兰与堂兄沈耀祖更嘲讽她是山野神棍。沈知微一进玄关便察觉穿衣镜倒影比活人慢半拍，在饭桌上又闻到张翠兰袖口返出废井泡烂头发的腥气、看到她左脚高跟鞋跟比右脚多磨平三毫米，结合沈耀祖印堂倒悬的鱼尾黑线，当众铁口直断今晚亥时三刻祖祠供桌必塌、沈耀祖双腿必折于阴木之下。全族哄堂大笑拒不相信，沈知微不争辩，直接拎包上楼住进北侧阁楼。"}, {"n": 2, "title": "量天尺劈梳反剃头", "synopsis": "北侧阁楼门窗反锁，梳妆台圆镜里的长发女阴魂握着断齿黄杨木梳钻出镜面，企图按沈楚楚买通外围术士定下的指令剃光沈知微头发、将她吓疯。沈知微看破木梳夹层塞着沈楚楚用她的生辰八字写的替灾纸条，反手抽出十二斤玄铁量天尺，一尺劈碎木梳阵眼，单手掐住阴魂脖颈问出是沈楚楚用腥血喂养它，随即将阴魂连同半截断梳直接塞进楼下沈楚楚主卧衣帽间的通风暗格。与此同时，亥时三刻一到，堂兄沈耀祖因心虚溜进后院祖祠查看供桌下的借运木牌，头顶被白蚁与阴气蚀空的横梁轰然砸落，当场砸断他双腿膝骨，凄厉惨叫响彻沈宅。"}, {"n": 3, "title": "五十万润金夺主卧", "synopsis": "沈楚楚顶着半边光头在走廊崩溃大哭，匆忙戴假发遮掩；医院那边传来急电，沈耀祖断腿伤口发黑流脓、麻药失效，手术室器械无故跳闸。二婶张翠兰与沈建业惊恐万分，想起沈知微昨晚精确到刻的判词，不得不低声下气求她救命。沈知微端坐在客厅慢条斯理喝茶，直接点破张翠兰连续七晚去后院废井投食借运的亏心账，开价五十万破煞定金并要求半小时内腾出主楼三层朝阳大套房、归还生母裴氏的遗物樟木箱。张翠兰怕儿子丧命当场扫码转账五十万，沈知微按“十留三”规矩立刻将三十五万转给青云观师兄修三清殿屋顶，随手画了一道镇痛符止住沈耀祖伤势恶化，拎包搬进主卧。"}, {"n": 4, "title": "外公提羊汤砸沈门", "synopsis": "古建木作泰斗外公裴鹤年与江城刑警支队队长表哥裴铮得知沈知微被接回沈家还遭冷遇，直接开着工程越野车撞开沈宅铁门，拎着滚烫的砂锅羊汤杀进客厅。沈建业妄图拿长辈架子摆谱，要求沈知微把生母留下的城南栖梧院地契交出来抵充沈楚楚的嫁妆，被裴老爷子一拐杖砸翻茶几痛骂忘恩负义。裴老爷子当众把保存十八年的栖梧院红本房契塞进沈知微手里，盛满一大碗羊汤哄外孙女趁热喝；裴铮则亮出刑警证件，警告沈家二房近期城南旧改工地有一名拆迁户离奇失踪正受警方调查。沈知微喝着热羊汤感受到久违的家人暖意，同时从张翠兰躲闪的眼神中锁死了废井与失踪案的关联。"}, {"n": 5, "title": "朱砂木筹断噬心劫", "synopsis": "裴鹤年带沈知微在沈宅门外散步消食，偶遇专程来请裴老爷子审阅跨江古桥修缮图纸的“陆氏营造”掌权人陆宴辞。沈知微刚靠近车窗三步，便闻到陆宴辞高定西装领口透出一股唯有百年水底阴沉木才有的冷檀腐气，且大晴天里他右手食指指尖泛着死人般的青紫寒霜、左胸口袋里的机械怀表走时比正常时间慢了整整七秒。观微天眼下，沈知微看清他极阳紫气被七杀锁脉煞缠绕，心脉处钉着第一根与沈家废井同源的夺运阴钉。她直接断言他三日内逢阴雨子夜必遭寒煞噬心、痛不欲生，随手塞给他一枚浸过朱砂的鲁班木筹，开价一千万拔钉。陆宴辞礼貌收下木筹，只当她是为要钱编造的玄学说辞。"}, {"n": 6, "title": "雨夜木筹碎救绝脉", "synopsis": "当晚江城暴雨倾盆，子时刚过，陆宴辞独自在顶层公寓审阅城南旧改与古桥档案，室内恒温二十六度的暖风突然失灵，书桌玻璃板下迅速凝结出一层人形白霜。第一根七杀锁脉阴钉在心口猛烈暴走，刺骨寒毒顺着经脉直逼心室，私人医生团队束手无策，除颤仪与监护仪全部黑屏乱跳。千钧一发之际，陆宴辞贴身放着的朱砂鲁班木筹突然自燃炸裂，一道霸道的纯阳破煞金光顺着他指尖冲入心脉，硬生生将噬心黑气逼退回锁骨下方，令他三年来第一次在雨夜呼吸顺畅、不再咳血。看着掌心化为焦炭的木筹残片与窗外雨幕，一向只信工程力学的陆宴辞眼神彻底震动。"}, {"n": 7, "title": "千万契约十指扣脉", "synopsis": "清晨雨歇，陆宴辞亲自登门沈宅，无视沈建业与沈楚楚的巴结讨好，径直请沈知微上车详谈。车厢内，沈知微毫不客气地伸手扣住陆宴辞冰冷的脉门，借自身功德金光替他压住锁骨下蠢蠢欲动的第一根浮钉，同时吸收他溢出的极阳紫气缓解自身漏阴骨寒意。陆宴辞原本习惯性抗拒旁人触碰，却在十指相扣间感到心脉前所未有的温热安定。沈知微直球报出账目：他体内共有七根子母夺运阴钉，第一根护心浮钉与沈家废井借运桩同源，拔除首钉顾问费一千万，后续按难度计酬。陆宴辞当场让特助拟定顾问契约并预付五百万定金（沈知微照例转三百五十万修道观），承诺随时为她调动陆氏工程队封场。"}, {"n": 8, "title": "排水管返发锁废井", "synopsis": "沈家老宅怪事愈演愈烈，不仅二楼浴室排水管每天半夜返出成团泡烂的黑发，连餐厅饭桌上保姆都会不知不觉多摆一副缺口的粗瓷碗筷，全家人走过却视而不见。沈知微结合陆宴辞提供的地下管网图，查明假千金沈楚楚与二婶张翠兰为独吞城南旧改项目三千万拆迁补偿款，半年前雇佣九宫厌胜会外围术士钱大师，用被逼死的老拆迁户周老汉的生辰八字与血衣，在后院废井底打入“沉井借阴桩”窃取苦主气运。如今祖祠横梁已塌，借阴桩失去压制开始反噬。沈知微故意在晚饭时放出“井底阴物今晚子时必破封索命”的风声，逼得做贼心虚的张翠兰与沈楚楚连夜联系钱大师入宅移桩。"}, {"n": 9, "title": "一尺破井桩反噬恶亲", "synopsis": "子夜废井旁，钱大师摇晃招魂铃引出浑身滴着黑水的周老汉冤魂，妄图连沈知微一起拖入井底灭口。沈知微踏出开门八极步震飞钱大师，抡起十二斤玄铁量天尺重重砸向井口青石板，一尺劈开井底暗格，将那根缠满死人头发、刻着周老汉八字的三尺阴沉木“沉井借阴桩”凌空劈成两截。按照鲁班厌胜“破桩必反噬设局人”铁律，井底积蓄半年的阴寒怨气顺着血契瞬间倒灌回张翠兰、医院里的沈耀祖与钱大师体内，张翠兰双腿当场浮现大片青黑水泡痛哭打滚。沈知微以功德金光超度周老汉冤魂，从井底暗格拎出防水袋装的拆迁款私吞账本，早已埋伏在墙外的表哥裴铮翻墙而入，当场给张翠兰与钱大师戴上手铐。"}, {"n": 10, "title": "收鬼匠拔除首根钉", "synopsis": "废井借阴桩破除后，沈知微来到坍塌的沈家祖祠清理尾煞，从断裂横梁暗格中放出了三十年前替沈家修祠堂却被二房害死封入木梁的独臂木匠老鬼鲁大爷。沈知微替他将当年凶案物证交给裴铮并许诺“包工伤香烛”，正式将精通古建榫卯的鲁大爷收编为首位看门鬼匠。随后陆宴辞赶到，因同源井桩已破，他心口第一根浮钉松动剧痛。沈知微在车内咬破指尖点在玄铁量天尺上，十指紧扣陆宴辞手腕导引极阳紫气，一寸寸将那根三寸长的乌黑子钉从他锁骨心脉间逼出体外。陆宴辞痛极反握住她的手，当场结清五百万尾款（沈知微再捐三百五十万修观），并忍着沈知微拔钉后三日经脉寒痛，亲自送她回房并备好红糖姜汤。"}, {"n": 11, "title": "探旧宅梁留墨斗痕", "synopsis": "二婶张翠兰被捕、沈耀祖残废后，沈建业为保住沈氏集团股价与城南旧改资质，假惺惺宣布三天后在江城云顶酒店为沈知微举办盛大认亲晚宴，实则纵容假千金沈楚楚暗中筹划反扑，并找借口拖延交出栖梧院的钥匙。沈知微一眼看穿父女俩的算计，当面要求晚宴当晚必须当着全城名流交割栖梧院全部产权与钥匙，否则当场拆穿沈家老底。随后，外公裴鹤年陪沈知微先行前往城南梧桐巷的生母旧宅“栖梧院”勘察。推开尘封十八年的院门，沈知微在正堂主梁上发现了外公曾提过的那道诡异墨斗断痕，其崩裂走向竟与她帆布包里那半截染血鲁班尺的缺口完全吻合。"}, {"n": 12, "title": "收灵猫劈碎窥阴偶", "synopsis": "栖梧院东厢房虽无人居住，窗纸上却在大白天映出一个弯腰偷听的佝偻人影，地面青砖缝里渗出桐油混合腐肉的怪味。那只脖挂前朝五帝铜铃的狸花猫死死按住第三块青砖，沈知微走近观察，发现猫儿天生异瞳能辨阴阳，而青砖下埋着一尊用槐木雕成、肚子里塞着活水蛭的“鲁班窥阴木偶”，正源源不断窃取院内残留的护宅气机。沈知微抽出玄铁量天尺撬开青砖，一尺将槐木偶拍得粉碎，并从猫爪下取出一枚沾着云顶酒店专用地毯纤维的铜钉。沈知微从包里掏出小鱼干喂饱狸花猫，取名“铜钱”正式收编为镇宅灵宠，并由鲁大爷带着铜钱先行留守栖梧院。"}, {"n": 13, "title": "晚宴前掉包招阴发", "synopsis": "认亲晚宴当晚，云顶酒店宴会厅宾客云集。沈楚楚重金请来九宫厌胜会外围好手冯大师，在宴会厅四根落地镜柱后布下“倒影招阴局”，并在送给沈知微的白色高定礼服内衬里偷缝了一缕横死女人的血发，企图让沈知微在敬酒时被镜中阴煞扑身、当众发疯扒衣出丑。沈知微刚进休息室，怀里的灵猫铜钱便对着礼服低吼，她指尖一捻便闻出内衬针脚处的尸脂腥臭，再看休息室穿衣镜左下角水银剥落呈倒三角、镜中吊灯比实际少亮一盏，立刻算清了冯大师的阵眼方位。此时陆宴辞派人送来一套镇压过古玉的墨绿长裙替她撑场，沈知微换上新裙，顺手将那包招阴血发塞进了沈楚楚搭在椅背上的白色狐毛披肩夹层里。"}, {"n": 14, "title": "墨斗线逆转倒影局", "synopsis": "认亲晚宴正式开场，沈楚楚披上狐毛披肩登台致辞，假意流泪欢迎姐姐回家，暗中给后台的冯大师打手势催动阵法。宴会厅四面落地镜柱瞬间泛起灰白雾气，镜中倒影纷纷扭曲伸手。然而沈知微早在入场时便将一根浸满朱砂的墨斗红线弹在了主镜柱底座的鲁班尺位上，直接截断并逆转了招阴回路。阴冷煞气顺着同源血发瞬间扑向台上的沈楚楚！沈楚楚只觉脖颈如被无数鬼手死死掐住，当着全城豪门名流与记者的面，双目翻白、不受控制地撕扯自己的狐毛披肩与礼服领口，哇地吐出一大团粘着黑血的死人头发，连垫在胸前的硅胶假体和买通冯大师的录音笔都滚落在地，全场哗然。"}, {"n": 15, "title": "当众夺房契断父女", "synopsis": "台下名流与媒体镜头对准狼狈不堪的沈楚楚和那支正在自动播放“只要让沈知微在台上发疯就行”的录音笔，沈建业脸色铁青冲上台想踩碎录音笔。沈知微迈步登台，抡起玄铁量天尺直接砸穿中央镜柱背面，将冯大师藏在夹层里的“七星招阴木盘”劈成碎木渣。后台被陆宴辞保镖堵住的冯大师遭阵破反噬，胸骨咔嚓脆响喷血倒地。裴鹤年老爷子当众率古建界名流怒斥沈家猪狗不如，陆宴辞则冷声宣布陆氏营造即刻终止与沈氏的一切合作。在阴阳反噬与商业封杀的双重泰山压顶下，沈建业冷汗淋漓，不得不当众签下栖梧院产权无条件交割书与断绝父女关系声明。沈知微拿齐房契钥匙，头也不回地离开宴会厅。"}, {"n": 16, "title": "栖梧院围炉喝羊汤", "synopsis": "脱离沈家泥潭的次日，外公裴鹤年亲自带着古建木作班底帮沈知微修缮栖梧院门窗，陆宴辞则直接派车送来全套红木家具与生活物资。傍晚，小院里支起炭火铜锅，裴老爷子炖了拿手的当归羊肉汤，表哥裴铮脱下警服拎来三大把滋滋冒油的夜市烤羊肉串和冰镇酸梅汤，狸花猫铜钱蹲在桌角啃小黄鱼，独臂老鬼鲁大爷在祠堂牌位前美滋滋地吸食特制高香。陆宴辞端坐在小马扎上，略显笨拙地替沈知微剥烤蒜，听她认真拿计算器核算还差多少功德金才能把青云观三清殿的大梁换新。在这热气腾腾的活人烟火气中，沈知微决定在栖梧院前院挂牌开办“堪舆堂”，专接凶宅破煞与古建堪舆生意。"}, {"n": 17, "title": "旧改工地钻头渗血", "synopsis": "城南旧改项目原由沈家二房分管，张翠兰入狱后，陆氏营造接手清查账目，工地却接连发生邪门事故：深达十米的旋挖钻头每天凌晨都会无故拧成麻花，值班室监控每到半夜两点便闪现穿红衣的女人背影。陆宴辞请沈知微以首席堪舆顾问身份入场。沈知微踏进暴晒三十五度的工地，先发现三号打桩机驾驶室方向盘上竟凝着一层刮不掉的白霜，再看折断的合金钻头刃口并非撞击岩石崩裂，而是呈逆时针螺旋状被黑红血丝包裹，且周围泥土散发出浓烈的朱砂混桐油腐气。沈知微当场断言：这不是普通地基塌方，而是沈家二房为压低拆迁成本、镇压钉子户怨气，在工地四角打入了“四方困魂借阴桩”。"}, {"n": 18, "title": "恶叔纵犬反遭铁断", "synopsis": "表哥裴铮打来电话，告知晚宴被抓的冯大师因惧怕厌胜反噬，在审讯室交代他上面的供货人是玄门邪派“九宫厌胜会”驻江城分舵，总坛首领是一名常年戴白手套的“墨先生”，且城南旧改工地的三号木桩正是分舵炼制的子桩。话音未落，沈家二叔沈建国（张翠兰丈夫）带着几条凶悍狼犬冲进工地撒泼，污蔑沈知微联合外人吞占沈家祖产，放狗扑咬沈知微。沈知微站在原地纹丝不动，手腕一翻将十二斤玄铁量天尺顿在地上，尺身煞气外放，搭配铜钱的一声怒啸，吓得三条狼犬当场夹尾哀鸣、反口咬伤沈建国小腿。沈知微看清沈建国耳后浮现的指印黑斑，冷声断言他吞了红衣女拆迁户的赔偿款，今晚子时女苦主必去他家敲门。"}, {"n": 19, "title": "深夜视频衣柜裂缝", "synopsis": "当晚十一点半，沈建国裹着纱布躲在高档公寓主卧里，把整屋大灯开得通明。然而十一点五十五分，客厅液晶电视屏幕突然自己亮起，画面里映出他家紧闭的入户防盗门正在被一只涂着红丹蔻的青白女人手掌从外面一寸寸抠开，中央空调出风口更成团往下掉浸透泥浆的红布条。沈建国吓得魂飞魄散，连滚带爬给沈知微打视频电话哭喊救命。沈知微在视频那头一边喝着外公泡的枸杞茶，一边看着他身后衣柜门自己裂开一道缝， calmly开出条件：立刻把私吞的一千二百万拆迁款原数退还苦主家属，并向裴铮交代红衣女苦主林秀芳的埋尸点，否则一分钟后女鬼掐断他脖子。沈建国在窒息边缘哭嚎着吐露了工地西南角废弃配电房的坐标。"}, {"n": 20, "title": "配电房探照锁绝户榫", "synopsis": "沈知微与陆宴辞、裴铮连夜赶到城南工地西南角的废弃配电房。配电房虽断电半年，里面的电表转盘却在疯转冒火花，水泥地面翻涌着深达半米的冰冷黑泥，无数泥手从地面抓向靠近的警员。陆宴辞果断下令陆氏重型破拆工程车直接撞塌配电房南侧围墙，用强光探照灯撕开阴霾，并亲自将一把擦得锃亮的备用桃木楔递给沈知微。沈知微放出独臂鬼匠鲁大爷探路，鲁大爷一眼认出配电房地基下采用的是九宫厌胜会专用的“倒扣莲花绝户榫”，里面不仅封着红衣女苦主林秀芳的尸骨，还钉着一根与陆宴辞体内第二根阴钉遥相呼应的引煞副桩。沈知微踏步跃上配电箱，一尺震散扑面的黑泥鬼手，精准锁死地底阵眼。"}, {"n": 21, "title": "劈绝户榫女魂指凶", "synopsis": "暴雨夜里，九宫厌胜会外围匠师孙木匠捏碎引魂骨牌，催动配电房地底的黑泥尸煞疯狂反扑，妄图炸毁基坑掩盖分舵痕迹。陆宴辞果断指挥重型铲车横堵路口截断假牌面包车退路，表哥裴铮率刑警鸣枪包抄。配电房内，沈知微踏着翻涌黑泥跃至阵心，双手抡起十二斤玄铁量天尺猛砸地面，一尺劈开“倒扣莲花绝户榫”石盖，起出刻满生辰八字的百年杉木困魂主桩与红衣女苦主林秀芳的遗骨。禁锢三年的怨气冲天而起，在沈知微朱砂墨斗线导引下未伤一名警员，化作一道红影顺着契约血线直扑门外孙木匠与沈建国私宅。"}, {"n": 22, "title": "恶叔吐账铁腕收监", "synopsis": "困魂主桩被毁引发的因果反噬在半小时内全面爆发，沈建国双腿长满泥水泡烂的青黑水泡，钻心剧痛下吓得魂飞魄散，连滚带爬拨打报警电话哭求裴铮来抓自己保命。沈知微从劈开的杉木主桩夹层里取出油布包裹的拆迁阴阳账本与沈建国买凶活埋林秀芳的录音卡，当场移交裴铮锁死阳间铁证，沈建国与妻子张翠兰彻底在看守所团聚。雨停天亮后，沈知微在基坑旁燃起三炷引魂清香，替林秀芳寻回嵌在泥缝里的陪嫁金戒交还其白发老母，化解女魂执念送其安心踏入轮回。"}, {"n": 23, "title": "十留三账暖透漏阴骨", "synopsis": "城南旧改工地恢复施工，陆宴辞按约向沈知微支付两百万破煞顾问费。沈知微坐在栖梧院石桌前拿着计算器认真分账，严格按玄门“十留三”规矩拨出一百四十万，一半委托裴铮转交林秀芳年迈父母作养老金，一半汇往阴山青云观订购修缮三清殿的楠木大梁，自己将六十万存进修房卡。善款落定瞬间，一缕温润功德金光没入眉心，抚平了她连日开天眼引发的漏阴骨寒咳。外公裴鹤年拎着刚出锅的姜枣老母鸡汤押着外孙女趁热喝完，裴铮也带回孙木匠口供：沈楚楚半月前曾从外围渠道重金买走一盒“换命红线”。"}, {"n": 24, "title": "古建书房右肋浮钉", "synopsis": "沈知微盯着陆宴辞鞋底转瞬即逝的青砖水印，再看他右眼尾浮起的一缕青黑细丝与按压右肋的细微僵硬，当场铁口直断：城南工地副桩被劈惊动了子母同源气机，他右肋骨缝里的“第二根锁脉阴钉”已经苏醒，今晚戌时必犯寒厥。陆宴辞神色凝重，带她前往陆氏老宅顶楼书房查阅祖父留下的民国镇河修桥手记。戌时刚到，密闭书房内温度骤降，博古架上的黄铜镇纸无故高频震鸣，陆宴辞右肋猛然刺痛、唇色发紫栽向书桌，沈知微眼疾手快上前一步，双手十指稳稳扣住他的脉门。"}, {"n": 25, "title": "渡阳锁二钉探水脉", "synopsis": "沈知微调动刚攒下的功德金光配合自身阳气，顺着陆宴辞劳宫穴强行将躁动的第二根阴钉重新封回骨缝，自己却冻得指尖发僵、连打两个寒颤。素来冷硬自持的陆宴辞眉眼微震，立刻扯下羊绒大衣将她严严实实裹住，亲自煮了一壶滚烫的红糖姜茶看着她喝下，并当场转入三百万护脉定金。两人细查那张泛黄草图，确认第二根阴钉带着浓烈水煞，母桩藏在江城主航道的跨江古桥之下，但缺少锁水榫卯全图不能硬拔。临别时，陆宴辞派工匠送来一块上等老樟木匾额胚料助她筹备堪舆堂。"}, {"n": 26, "title": "丝绸世家婚房绣鞋印", "synopsis": "外公老友唐敬山为独孙唐明轩筹备婚事，半月前花三百八十万从古玩行买回一张雕工极精的明代“千工拔步床”摆进朝阳婚房，不料怪事频发。沈知微随外公登门查看，一进二楼婚房便抓到两处违背常理的细节错位：大中午阳光暴晒的南向卧室内，真丝蚊帐内侧竟渗出一层带着桐油酸臭的暗红汗珠；而擦得锃亮的红木踏板左侧无故下沉两分，每天清晨都会浮现一双三寸金莲的湿绣花鞋印，准新娘梳头掉落的长发更会自己拧成股往床底钻。此时唐家大伯请来的堪舆名宿“鹤山居士”正摇着折扇断言只是老木燥火。"}, {"n": 27, "title": "铁口断吞金遭同行嘲", "synopsis": "面对鹤山居士倚老卖老的呵斥，沈知微平静指出：拔步床踏板下沉处藏着暗榫夹层，里面钉着枉死绣娘生魂炼成的“压床借财桩”，专吸买主家新婚子嗣的财运与阳气；鹤山居士用黄符堵死床柱泄气孔，等于把怨灵逼入绝境，今晚子时前不拆床，准新郎唐明轩必在婚房梦游自吞陪嫁金器窒息。唐家大伯嫌沈知微年仅十八岁咒人晦气，听信鹤山居士谗言执意留下古床，还讥讽裴老爷子带乡下丫头骗钱。裴鹤年暴脾气上来当场掀翻茶盘，护着外孙女拂袖而去，放话过了十一点半就算磕破头也得按翻倍规矩求上门。"}, {"n": 28, "title": "子夜吞金镯跪求栖梧", "synopsis": "婚房内异变陡生，唐明轩双目翻白死死卡住自己脖子硬塞金镯，守在客厅喝茶等看笑话的鹤山居士冲上楼想撕自己贴的黄符，却被拔步床底猛然弹出的几十根红绣线缠住脚踝，当场脸朝下栽倒磕断两颗门牙，吓得连滚带爬逃出别墅。唐老爷子见孙子脸色紫胀呼吸将断，用铁勺都撬不开牙关，盛怒之下踹开阻拦的大儿子，连夜备车冲到栖梧院门外，捧着五百万支票跪在青石板上高喊沈大师救命。沈知微慢条斯理收下支票验明真伪，拎起玄铁量天尺与朱砂墨斗登车赶赴唐宅。"}, {"n": 29, "title": "劈千工床反噬茶话会", "synopsis": "沈知微进门先用朱砂墨斗线弹在唐明轩眉心逼退怨气，捏开他下颌取出带血金镯救回一命；随即双手抡圆十二斤玄铁量天尺，重重劈向千工拔步床下沉两分的左侧踏板。百年硬木应声炸裂，暗格内露出一只钉着七枚铜钱、缠满带血断发与沈楚楚八字借运红纸的“借财厌胜木匣”。木匣碎裂刹那，被奴役的绣娘怨气顺着红纸血气轰然倒灌——此刻正在江城顶级会所举办“名媛复出茶话会”、试图勾搭豪门少爷套现的沈楚楚，众目睽睽下突然双手发狂撕烂高定礼服，张嘴呕出一大团发霉腐臭的红绿绣花丝线。"}, {"n": 30, "title": "绣魂诉冤锁城郊老仓", "synopsis": "沈知微没有打散断指绣娘的残魂，而是点起安魂香听她诉清原委：绣娘本是民国织坊女工，死后发辫被邪师封入床板，半月前沈楚楚伙同古玩街吕老板将借运红纸塞进木匣，妄图高价卖凶床套现并吸走唐家财运。表哥裴铮根据出库单连夜突审吓破胆的吕老板，吕老板招认这批厌胜古董家具全是从沈家废弃多年的“白鹤滩老货仓”提出来的。唐老爷子千恩万谢，在江城商会圈大力宣扬沈知微铁口神断，鹤山居士灰溜溜封山退隐。沈知微送走绣娘残魂，决定次日一早亲探白鹤滩老仓。"}, {"n": 31, "title": "探白鹤滩劈吊梁木人", "synopsis": "次日清晨，沈知微携灵猫铜钱与表哥裴铮赶赴城郊白鹤滩沈氏老货仓，陆宴辞也派来工程安保在外围封路协查。货仓大门挂着生锈铁链看似荒废十年，沈知微却一眼看穿两处反常错位：铁链锁芯内侧泛着新鲜的猪油滑光，且仓库屋檐下死了七八只麻雀，鸟头全部诡异地扭向仓库正梁。推门入内，阴风骤起，梁上倒吊着三具涂满尸漆的鲁班机括木人，手持铁凿直扑裴铮面门。沈知微踏步上前，开门八极拳震偏铁凿，反手一记玄铁量天尺横扫，将三具邪门木人当场劈成满地碎木片。"}, {"n": 32, "title": "发霉暗账揪封口稳婆", "synopsis": "裴铮戴上手套翻开铁皮暗门里的发霉旧账册，发现这处老货仓原是沈家二房与沈建业早年用来堆放拆迁黑货及私藏厌胜木料的窝点。沈知微则在最底下一口空置的陪嫁木箱夹缝里，捻出一张二十年前沈知微出生次日的银钱支取凭条：沈建业曾亲自批出一笔三十万元的巨额现金，收款人是当年替生母裴氏接生的稳婆马桂芝，备注写着“遣返江北芦苇镇养老封口”。结合半截染血鲁班尺刚才的震颤，沈知微笃定生母当年的“难产尸骨无存”纯属谎言，马桂芝手里必然握着雨夜实情。"}, {"n": 33, "title": "父女反目盗染血玉锁", "synopsis": "随着唐氏等江城老牌豪门联手陆氏全面封杀沈家，沈氏地产资金链彻底崩盘。连遭剃发、晚宴吐血发与茶话会吐绣线三次反噬的沈楚楚，不仅头顶大片斑秃，右脸颊更浮现出遮不住的青黑尸斑。沈建业见她彻底失去豪门联姻价值，翻脸无情逼她嫁给六十岁的矿业暴发户换取两千万救急款。沈楚楚又恨又怕，趁夜给沈建业安眠药加量，联合仍在病床上怨恨沈知微的堂兄沈耀祖，撬开书房保险柜偷走沈建业私藏二十年镇压裴家气运的“裴氏染血和田玉锁”，并用买来的换命红线召来了九宫厌胜会江城分舵大弟子严枭。"}, {"n": 34, "title": "夜巡拦木鸢反灼邪徒", "synopsis": "严枭查验完裴氏染血玉锁，贪图沈知微身上的功德金光与玄铁量天尺，答应替沈楚楚布设恶毒的“子母换命血桩”，将沈楚楚的烂脸早衰与死劫全部嫁接到沈知微身上。当晚深夜，栖梧院外槐树梢无风自摇，一只用棺材薄木片削成、眼珠点着尸油的“厌胜问路木鸢”悄无声息滑进院墙，企图偷啄晾在廊下的沈知微外衣布条。守夜的狸花猫铜钱凌空扑咬将其拍落，独臂老鬼鲁大爷抡起墨斗缠住木翅，沈知微推门而出，一尺将木鸢钉死在青石板上。两公里外作法的严枭右手食指猛然炸开一道血口。"}, {"n": 35, "title": "快艇破迷津直扑芦苇镇", "synopsis": "看破严枭要去江北芦苇镇抢夺二十年前的接生血引并杀人灭口，沈知微次日天未亮便与表哥裴铮出发，陆宴辞得知消息后直接开着改装越野车停在巷口，带着陆氏水路工程图坚持同行护航。车至江北支流渡口，原本晴朗的江面突然涌起浓稠白雾，渡船螺旋桨被水下几根系着红绳的阴木死桩死死卡住。沈知微凭船头罗盘倒转与江水散发的棺木漆臭两处错位看破拦路小阵，陆宴辞当场调来陆氏勘测快艇，沈知微立于船头，用墨斗红线缠住玄铁量天尺凌空掷入漩涡，一击震断水底阴木桩，全速冲破迷雾登陆芦苇镇。"}, {"n": 36, "title": "拔眉心木刺破引魂障", "synopsis": "快艇靠岸后，镇口牌坊下穿寿衣的盲婆正机械地对着水面呼喊沈知微生母裴氏的闺名，试图把外来人往东侧深水芦苇荡里引。裴铮刚要上前询问，沈知微一把拉住他，指出两处不对劲：盲婆鞋底沾的不是东边河滩的黑淤泥，而是镇西青砖巷特有的红苔土；她袖口还蹭着半小时内刚落下的紫檀邪香灰。沈知微上前用温热的朱砂木筹在盲婆眉心一抹，抽出一根细如牛毛的黑木刺。盲婆浑身一抖清醒过来，惊恐哭诉刚才有个黑衣男人塞给她一把纸钱，往西巷马稳婆家去了。"}, {"n": 37, "title": "废宅设母坛脓血祭木偶", "synopsis": "同一时刻的江城城郊废宅地下室里，沈楚楚头戴黑纱遮住溃烂发斑的右脸，正按严枭留下的邪法亲手布置“子母换命血桩”母坛。为了把沈知微那张清冷好看的脸、栖梧院千万身家以及陆宴辞的青眼全部抢过来，沈楚楚毫不犹豫地咬破手腕，将混着自己尸斑脓血的毒液涂满一尊刻有沈知微八字的槐木女偶，又把偷来的裴氏染血和田玉锁死死嵌进木偶心口，只等严枭从江北带回二十年前的“落地胎盘血灰”便可合阵换命。病床上的堂兄沈耀祖也押上自己名下最后的拆迁赃款，妄图借邪阵让沈知微暴毙。"}, {"n": 38, "title": "热饭倒插筷堂屋锁喉桩", "synopsis": "沈知微、陆宴辞与裴铮冲进马桂芝老宅堂屋，大白天的屋里却透着令人毛骨悚然的日常错位：八仙桌上摆着一碗刚盛出来还冒热气的白米饭，两根竹筷却倒插在桌子正下方的泥砖缝里；七十岁的马桂芝瘫在竹藤椅上，明明屋里没人掐她，她的脖子却向后折成诡异弧度，张大的嘴里舌根乌黑肿胀，像被塞进了一截看不见的烂木头，眼角滑落血泪拼命拍打扶手。沈知微一眼看穿她脖颈浮现的墨线勒痕与神龛香炉倒转的三根断香，断定严枭刚抢走东西不到半小时，并在屋里钉了灭口的“锁喉木舌桩”。"}, {"n": 39, "title": "劈龛救人证雨夜真相浮", "synopsis": "玄铁量天尺轰然劈开樟木神龛底座，一只嘴里塞满铁钉、缠着马桂芝白发的桐木小人应声断为两截。藤椅上的马桂芝猛咳出一口黑血痰，喉间禁锢瞬间消散。缓过气的马桂芝吓得老泪纵横，抓起纸笔颤抖着写出二十年前雨夜真相：当年裴氏顺利产下沈知微后根本没有血崩，而是察觉产房外有一名戴白手套的神秘男人带邪师窥伺；裴氏将一册手札藏进栖梧院主卧夹墙，托外公送走女婴，自己则握着半截木尺冲入暴雨引开强敌下落不明，沈建业见死不救霸占家产，而刚才黑衣人抢走了马桂芝私留镇宅的半包产房血灰。"}, {"n": 40, "title": "握脉驱寒霜返院锁子镜", "synopsis": "看清纸上生母孤身持尺冲进雨夜的字迹，向来冷静算账的沈知微指节捏得发白，眼底冷意彻骨，体内漏阴骨因心绪剧烈激荡渗出丝丝寒霜。一旁的陆宴辞一言不发，伸出宽大温热的手掌稳稳包住她冰凉的指尖，以极阳紫气替她驱散寒意，沉声承诺陆氏所有工程与情报网随她调遣，定将当年害裴氏与今日盗血灰之人连根拔起。三人安排重兵保护马桂芝后火速驱车赶回江城栖梧院，沈知微刚下车便凭风中飘来的尸脂腥气与墙角蚂蚁成群倒行两处细节，径直走到后巷锁死了严枭刚布下的换命子阵媒介。"}, {"n": 41, "title": "墨线封子镜反窥老城西", "synopsis": "面对后巷垃圾桶旁映出沈楚楚扎针笑脸的民国穿衣镜，沈知微没有鲁莽砸镜惊动母坛，而是抓到镜框背面沾着城西印染厂特有的蓝矾河沙、镜底水银层呈逆时针剥落两处错位，看破这是一面单向偷运的“窥命子镜”。沈知微用朱砂墨斗线在镜面弹出井字封煞格，命独臂老鬼鲁大爷连夜蹲守镜旁截断气机回流，让严枭误以为阵法仍在缓慢生效。陆宴辞同步调取后巷周边三公里市政天眼监控，排查出送镜货车消失在城西老工业区一带。"}, {"n": 42, "title": "病房输液管倒流黑水珠", "synopsis": "沈楚楚见子镜吸运受阻，听从严枭教唆赶到骨科医院，哄骗断腿住院的堂兄沈耀祖在“合谋借运红契”上按下血手印，暗中抽走他三管伤腿淤血去催熟换命母偶。当天下午，沈知微随表哥裴铮到医院核对二房拆迁赃款口供，路过VIP病房时一眼捕捉到两处反常错位：二十六度恒温病房里，沈耀祖的输液软管下端凝着冰碴且药液每隔五秒倒流一颗黑气水珠；床头沈楚楚刚送来的红富士苹果表皮鲜亮，果蒂处却钻出尸蝇幼虫。沈知微当众铁口直断：沈楚楚拿他当垫背耗材，今晚子时前不破契，他双腿残骨必枯死终身瘫痪。"}, {"n": 43, "title": "冰霜锁残骨恶兄吐贼窝", "synopsis": "临近子时，VIP病房灯光骤然忽明忽暗，输液管外壁结出一层猩红冰霜，沈耀祖打着石膏的双腿像被无数木虫啃噬般剧痛痉挛，监护仪警报凄厉长鸣，值班医生抢救毫无头绪。濒临截肢剧痛的沈耀祖彻底崩溃，哭喊着拨通裴铮电话求沈知微救命。沈知微赶到病房，一尺震碎藏在他病床床垫夹层里的“抽髓木签”保住他半条残命，作为交换，吓破胆的沈耀祖当场交出给严枭买凶的五百万转账记录，并招出沈楚楚正躲在沈氏荒废的城西第三制衣厂地下室布母坛。"}, {"n": 44, "title": "半截染血尺旋开鸳鸯榫", "synopsis": "得知严枭布的是歹毒“子母换命血桩”，沈知微没有贸然冲阵，而是按稳婆马桂芝纸条所指，请外公裴鹤年一同勘察栖梧院主卧。爷孙俩在房梁下方发现两处极隐蔽的木作细节：梳妆台背板后的青砖敲击声比旁处清脆三分，且梁柱交界处留有一道唯有半截鲁班尺锯齿才能咬合的“鸳鸯锁魂暗榫”。沈知微踩梯登高，将随身携带的半截染血鲁班尺缓缓嵌入榫槽轻轻一旋，机括轻响，夹墙内封存二十年的防潮楠木暗匣应声滑出。"}, {"n": 45, "title": "夹墙起手札参透反噬诀", "synopsis": "沈知微与外公在灯下翻开《镇河堪舆手札》上半册，里面不仅详尽记载了江城水陆三处镇河古椿的养护木诀，更专门批注了叛门邪派“九宫厌胜会”惯用的子母换命血桩破法：邪师需借月圆子夜抽干苦主气运置换皮囊，破阵者只需在合阵刹那以血亲指尖精血浸染墨斗线反扣母偶咽喉，即可令邪阵顺血契百倍反噬设局雇主。裴鹤年看着女儿绝笔老泪纵横，亲手替沈知微把玄铁量天尺擦拭一新，叮嘱她务必把偷盗遗物的畜生打落尘埃。"}, {"n": 46, "title": "废弃制衣厂无头模转身", "synopsis": "车队悄然合围城西第三制衣厂，沈知微、陆宴辞与裴铮率先踏入断电多年的二千平裁剪车间。熟悉的工业日常空间里透出刺骨邪气：上百具落满灰尘的无头塑料服装模特明明固定在铁架上，脚尖却全部扭转一百八十度齐刷刷对着地下室入口；靠墙二十台老式脚踏缝纫机在无人踩动的情况下自己咔哒咔哒倒退空转，针头扎出一排排渗血的红线。铜钱炸毛扑碎一盏引魂纸灯，沈知微看破假人底座连着鲁班机括丝线，抡起十二斤玄铁量天尺横扫主控线轴，将扑来的十几具藏魂塑料假人劈得粉碎。"}, {"n": 47, "title": "破火海副坛夺回血玉锁", "synopsis": "发觉后巷子镜被封、制衣厂外围失守的严枭极为狡猾，果断剪断副坛红线，推两名外门学徒挡住地下室铁门并引燃尸油火槽，自己则带着沈楚楚与核心“换命母偶”钻进直通江边的排污暗渠遁走。危急关头，陆宴辞精准算出老厂房承重水箱位置，指挥破拆手一锤砸裂消防蓄水池冲灭毒火；沈知微欺身冲入浓烟，八极拳震晕两名邪徒交给裴铮铐住，反手一尺劈开副坛铁笼，将生母遗留的“裴氏染血和田玉锁”完好夺回。"}, {"n": 48, "title": "清泉洗玉锁包扎定围猎", "synopsis": "回到栖梧院，沈知微用青云观清泉洗去和田玉锁上沈楚楚涂抹的污血，温润白玉背面显出“江城护水首椿·裴氏封”九个微雕古字，与《镇河堪舆手札》记载严丝合缝。刚才破火救玉时陆宴辞手背被碎木划出一道血口，沈知微难得没算医药费，拿出道观秘制金疮药替他仔细包扎；陆宴辞垂眸看着她认真的侧脸，眼底冷意尽化，当晚便调集陆氏工程无人机与高空探照车，配合裴铮刑警队将严枭必经的沈氏临江烂尾楼秘密锁死，只等明晚月圆子时对方开坛时人赃并获。"}, {"n": 49, "title": "烂尾楼天台献寿催死阵", "synopsis": "临江烂尾楼二十八层露天顶楼寒风呼啸，严枭得知血玉锁被夺本欲弃子跑路，彻底毁容斑秃、已被警方列为重点嫌疑人的沈楚楚却死死抱住他的腿，不仅交出藏在瑞士银行的最后八百万赃款，更咬牙用尖刀割破舌尖，自愿献祭自己三十年阳寿与生魂作燃料，只求用那半包产房胎血灰强行催动“剥皮换命母偶”，哪怕只能顶着沈知微的脸风光活十年也认了。严枭贪图沈知微天眼气运，狞笑着在天台四角钉下四根涂满尸脂的绝命柳木桩。"}, {"n": 50, "title": "铁尺破迷墙直抵二十八楼", "synopsis": "沈知微、陆宴辞与裴铮精干小队突入烂尾楼，一进十五层消防楼梯间便遇上两处诡异错位：水泥台阶上凭空多出第十四级湿滑木阶，墙面楼层号全都变成了鲜红的“4F”，两名特警刚迈步便差点踏空坠入电梯深井。沈知微一眼看破这是鲁班厌胜里的“迷魂悬梁局”，无需绕路解迷，陆宴辞直接展开大厦原始施工图点出东侧非承重封堵砖墙，沈知微双手握紧十二斤玄铁量天尺蓄力猛砸，轰然震塌砖墙破开迷障，一行人顺着货运通道直扑二十八楼天台。"}, {"n": 51, "title": "恶父抢金条撕破伪善皮", "synopsis": "天台之上上演狗咬狗闹剧，被高利贷逼疯的沈建业冲出暗处抢金条，沈楚楚死命护住法坛，尖叫着大骂沈建业当年见死不救害死裴氏、吞没栖梧院嫁妆还拿亲生女儿挡灾的畜生行径；沈建业也破口大骂沈楚楚只是二房表亲抱来的野种，早该拿她去抵债。撕扯间沈建业一脚踢翻东南角的引魂尸油灯，阵中饥渴狂暴的枉死阴煞瞬间顺火扑上他后背，沈建业惨叫着在湿滑天台边缘踩空，一头栽进二十七楼半平台摔断四根肋骨与右臂，全过程被赶到的裴铮执法记录仪拍得清清楚楚。"}, {"n": 52, "title": "血墨扣咽喉一尺碎母偶", "synopsis": "子时整点阴云蔽月，严枭摇动骨铃催发最终杀招，那尊嵌满脓血长钉的槐木母偶迎风暴涨出黑影利爪，天台水洼里沈知微的倒影竟开始模糊剥落，脸颊隐隐作痛。千钧一发之际，陆宴辞果断按下遥控开关，对面江岸三台大功率工程探照灯瞬间将天台照如白昼破开阴霾；沈知微眼神冷冽如冰，左手并指划过唇边抹上精血，拉满朱砂墨斗“啪”地一声精准弹在母偶咽喉红线上倒扣阵眼，右手十二斤玄铁量天尺挟裹璀璨功德金光当头劈落，将百年槐木母偶连同四根柳木桩一尺轰碎。"}, {"n": 53, "title": "邪火返本主假千金毁容", "synopsis": "随着换命母偶被同源母血与量天尺轰碎，沈楚楚亲手涂上去的尸斑脓血与献祭阳寿的恶毒死契瞬间百倍倒灌。在探照灯刺目的白光下，沈楚楚惨叫一声扑倒在地，原本靠医美维持的脸皮以肉眼可见的速度干瘪起皱、浮现满脸流脓的青黑尸斑，仅剩的几缕头发连根脱落，喉咙更像被滚烫炭火灼烧般彻底失声，只能发出嘶哑怪叫。她爬到水洼边看到自己如同八十岁烂脸老妪的恐怖倒影，死死抱住脑袋彻底精神崩溃，再无半点昔日假千金的体面。"}, {"n": 54, "title": "八极震邪骨生擒大弟子", "synopsis": "严枭借替死木牌炸出一团刺鼻黑雾跃上护栏想跳入滚滚江水，早守在天台外檐的独臂老鬼鲁大爷甩出墨斗绳死死缠住他脚踝，灵猫铜钱凌空扑抓撕烂他遮眼的黑布。沈知微脚踏八极闯步瞬息欺近，左肩铁山靠重重撞碎严枭胸前护身铜镜，右手玄铁量天尺顺势横拍在他捏诀的右肩胛骨上。伴随着清脆骨裂声，严枭盘了十年的两颗铁核桃当场炸裂，体内修习厌胜邪术的阴脉被量天尺浩然煞气彻底震废，重重摔回天台水泥地上吐血昏死。"}, {"n": 55, "title": "铁证锁重刑沈氏全覆灭", "synopsis": "大批刑警与急救车抵达临江烂尾楼收网，裴铮带队将毁容失声的沈楚楚、摔断肋骨的沈建业连同严枭全部押上警车，并同步对医院里双腿枯萎的沈耀祖执行逮捕。加上此前入狱的二婶张翠兰与沈建国，沈家涉案人员买凶活埋拆迁户、职务侵占、故意杀人未遂与盗窃遗物数罪并罚，铁证如山，等待沈楚楚与沈家二房的将是数十年至无期的铁窗牢狱，沈氏破产资产亦被法院查封拍卖赔偿苦主。至此，鸠占鹊巢的假千金与伪善原生父族在三轮梯次内干脆利落地彻底清零下线。"}, {"n": 56, "title": "提审废邪师浮现三杀局", "synopsis": "次日午后，裴铮在刑警支队提审经脉尽废的严枭。失去厌胜邪术傍身又惧怕体内残余阴气发作的严枭心理防线崩塌，交代他师父正是九宫厌胜会驻江城分舵主——此人表面顶着江城古建民俗专家的体面身份，实则已在江城布下三处大型聚煞子阵：一处在顶级私立医院病房替富豪“借寿”，一处在百年非遗老戏楼“借嗓”，最后一处直指跨江古桥桥墩“锁水”，企图在入秋台风大潮前攒够煞气，一举引爆陆宴辞体内的第二根夺运阴钉。"}, {"n": 57, "title": "青云换新梁小院飘栗香", "synopsis": "沈家旧账彻底翻篇后的周末，栖梧院洒满秋日暖阳。阴山青云观的大师兄寄来一大包晒干的野山菌、炒板栗和一叠彩照——沈知微按“十留三”规矩汇去的几百万功德款已将漏雨的三清殿换上合抱粗的新楠木大梁，师父云鹤道长的牌位前香火鼎盛。看着照片，沈知微体内温润的功德金光流转全身，原本每逢阴雨便隐隐作痛的漏阴骨彻底暖和起来。厨房里外公裴鹤年正炖着板栗烧鸡，表哥裴铮拎着刚出炉的桂花糖藕进门，小院里满是踏实热闹的活人烟火气。"}, {"n": 58, "title": "赠刀吃馄饨并肩定同盟", "synopsis": "傍晚，陆宴辞来到栖梧院，送上一套陆家珍藏的明代“鲁班百工随身雕刀墨簪”与陆氏营造特别堪舆顾问印鉴——凭此印鉴，沈知微可直接调阅江城所有市政古建档案并要求陆氏工程队配合封场破拆。两人坐在廊下石桌旁分食外公包的荠菜鲜肉大馄饨，沈知微自然地夹了只最大的馄饨放进他碗里，提醒他右肋第二根阴钉近两月内必随江潮异动，让他少熬夜看报表；陆宴辞耳根微热，低声应下，将剥好的热板栗推到她手边。"}, {"n": 59, "title": "栖梧堪舆堂鸣鞭挂金匾", "synopsis": "九月初吉日清晨，“栖梧院堪舆堂”黑漆描金大匾正式揭幕挂牌。外公裴鹤年携江南古建协会一众泰斗名宿到场镇场，唐氏丝绸老爷子与陆氏营造送来的花篮从巷口一直排到长街尽头，沈知微立下堪舆堂“三算三不算”铁律：亏心恶人不算、贪财害命不救、破煞润金十留三。看门鬼匠鲁大爷在暗处擦亮门环，铜铃灵猫铜钱神气活现地蹲在柜台招财猫旁收红包，沈知微在江城豪门与民俗圈彻底立住宗师新锐招牌。"}, {"n": 60, "title": "盛夏男童霜铁口断换寿", "synopsis": "冲进堪舆堂求助的是航运豪门贺家三少爷贺明远夫妇，怀里六岁的独生子小宝明明在三十度的初秋裹着两层羽绒服，眉毛和睫毛上却凝着白霜，头顶更在一夜间长出三绺枯草般的老人白发，脖颈皮肤散发出一股浓烈的中药棺材板腐味。贺明远哭诉找遍名医都查不出病因，而住在同一家康华私立医院顶楼ICU、原本已被下病危通知书的九十岁太爷爷贺老太爷，昨晚却奇迹般拔掉呼吸机红光满面地喝了两碗参汤。沈知微搭脉三息，当场看破这桩骇人听闻的至亲换寿亏心账。"}, {"n": 61, "title": "恒温病房结人形白霜", "synopsis": "沈知微先用一枚温热的朱砂木筹护住六岁男童小宝的心脉，随即在陆宴辞的陪同下随贺明远夫妇直奔康华私立医院顶楼VIP病房。二十六度恒温病房里透出两处违背常理的贴身错位：九十岁贺老太爷贺宏昌病床正下方的木地板结出一层擦不掉的人形白霜，而床头心电监护仪玻璃屏映出的老人倒影，竟套着一件带血渍的儿童病号服。贺家长房大伯贺长海与副院长赵德坤为独占百亿航运股权，联手隐瞒换寿邪术并将众人往外赶。沈知微看清贺宏昌人中发青、耳垂挂着黑木气，当场铁口直断：借来的童命压不住老骨头，今天酉时三刻贺宏昌必双腿僵如朽木、口吐黑药渣。"}, {"n": 62, "title": "酉时吐渣长房露马脚", "synopsis": "下午五点四十分，贺长海特意召集集团董事在病房开视频会议，企图借老太爷“康复”剥夺三房继承权。谁知分针刚指到五点四十五分（酉时三刻），红光满面的贺宏昌突然双眼翻白栽倒在地，两条腿硬得像风干棺材板怎么也弯不下去，嘴里更成口往外呕出混着烂木屑的腥臭黑药渣，抢救仪器乱响一团。董事们吓得纷纷惊呼，贺明远趁机带沈知微推门而入。眼看老太爷和小宝同时陷入窒息险境，贺家长辈再不敢嘴硬，当场签下八百万破煞润金契约求沈知微救命。"}, {"n": 63, "title": "沸罐结冰夜截脐带引", "synopsis": "沈知微断定病房白霜只是末端表象，真正的药引藏在医院底下。陆宴辞当即以医院大股东身份调出康华大楼原始管网图纸，发现负二层VIP煎药房与顶楼病房之间竟被违规改建了一条贯通排风竖井。三人赶到负二层煎药房，屋里十几口砂锅明明大火滚沸，锅盖上却凝满冰冷露珠，蒸腾的白气在半空聚成孩童哭脸。正在往排污口倾倒黑陶罐的副院长赵德坤见势想跑，看门老鬼鲁大爷冷不丁伸脚将他绊翻，灵猫铜钱扑上去护住还未倒空的陶罐，里面赫然泡着小宝周岁留存的乳牙与脐带血灰。"}, {"n": 64, "title": "一尺劈床桩毒伯遭反噬", "synopsis": "沈知微重返顶楼VIP病房，抡起十二斤玄铁量天尺直接砸穿护理床下的紫檀底座与竖井封板，起出一根缠满输液管、刻着祖孙生辰的“换寿药引木桩”。原来贺长海不仅帮老太爷借亲曾孙的寿，还买通赵德坤在木桩底部暗加了“绝户扣”，打算等小宝死后连老太爷一起弄疯独吞家产。沈知微手起尺落将邪桩劈成两半，被窃取的生机瞬间归还小宝体内，男童眉间白霜消融、枯白头发转黑苏醒；而反噬黑气顺血契倒灌，贺宏昌当场退回九十岁中风失语的垂死原状，贺长海与赵德坤更满脸爆出老人尸斑、半身麻木瘫软在地。"}, {"n": 65, "title": "八百万入账木屑指戏楼", "synopsis": "裴铮带刑警队将涉嫌故意杀人未遂与商业职务侵占的贺长海、赵德坤正式收监，贺明远夫妇千恩万谢，当场将八百万润金全额打入堪舆堂账户。沈知微照例只留二百四十万作日常开销，将其余五百六十万分批汇给青云观重修钟楼与市儿童大病救助基金，新凝聚的功德金光令她眼底清明倍增。鲁大爷仔细查验劈碎的药引木桩残片，指出这截百年老樟木沾着浓郁的戏台油彩与江底淤泥味；与此同时，赵德坤在审讯室扛不住反噬剧痛，供出木桩是由一名戴金丝眼镜的古建修缮顾问从昇平老戏楼暗中提供的。"}, {"n": 66, "title": "小院吃汤包戏徒泣血来", "synopsis": "入秋微凉的傍晚，栖梧院里热气腾腾，外公裴鹤年特意买了老字号蟹粉汤包配砂锅羊汤犒劳沈知微，陆宴辞与裴铮围坐桌旁，听沈知微拨着算盘规划堪舆堂下月的香烛账目。席间裴鹤年掏出一张烫金请柬，说百年非遗“昇平老戏楼”刚由市政古建首席顾问周明远主持修缮完毕，三天后当红昆曲名伶苏曼音将在戏楼举办慈善首演，请裴老爷子明天先去验收木作藻井。话音未落，戏班跑龙套的小学徒叶小棠满脖子血印扑进堪舆堂求助，把温馨夜宴瞬间拉入新诡事。"}, {"n": 67, "title": "化妆镜慢半拍油彩淌血", "synopsis": "次日上午，沈知微以裴鹤年外孙女兼陆氏营造顾问身份，带叶小棠重返昇平老戏楼核查。刚进后台一号专属化妆间，两处令人头皮发麻的日常错位便扑面而来：满屋暖光灯下，苏曼音梳妆台那罐进口卸妆冷霜竟散发出江底泡烂死鱼般的尸脂腥气，玻璃瓶内壁留着几道细小指甲抓痕；更邪门的是，苏曼音转头冲叶小棠发火时，化妆镜里的凤冠油彩倒影竟停在原地慢了半拍，嘴角淌着血丝无声开合唱戏。苏曼音的富商丈夫马文耀仗势欺人，当众污蔑叶小棠偷东西装神弄鬼，叫保安把人轰出去。"}, {"n": 68, "title": "周顾问圆场铁口断失声", "synopsis": "主持戏楼修缮的市政古建顾问周明远闻声走来，他戴着金丝眼镜、气质儒雅，三言两语将镜面异常解释为民国老水银镜反光折射，连外公裴鹤年指出戏台藻井斗拱比例改动的疑点也被他用防震加固搪塞过去。苏曼音愈发得意，扬言自己天生金嗓、明晚首演直播必轰动全城。沈知微冷眼看穿苏曼音喉结下方缠绕的青黑勒痕与说话时夹杂的双重女声回响，当众铁口直断：她这副嗓子是拿枉死活人命换来的，明晚戌时二刻唱到高腔时，必在全场名流面前撕裂声带、口吐腐烂棺木屑。"}, {"n": 69, "title": "旧档锁替身水渠引肋寒", "synopsis": "离开戏楼回到栖梧院，沈知微从叶小棠戏服袖口摘下一根沾着朱砂铁锈的民国陈年青丝，断定戏楼里不止有一个近年被害的苦主冤魂，戏台柱子里还被钉着一位道行极深却正气未泯的民国老戏魂。表哥裴铮连夜核查苏曼音戏班近五年人员去向，精准揪出三年前苏曼音声带受损复出前夕，其十八岁的孤女替身演员许小蝉离奇人间蒸发，被马文耀伪造出境记录压下；陆宴辞同步调来1938年昇平戏楼营造旧档，查明当年大火中为救十二名小学徒而死守戏台的班主柳青衣，且戏楼暗渠直通跨江古桥水脉。"}, {"n": 70, "title": "车库钻水袖恶商夜惊魂", "synopsis": "当晚十一点，嘴上骂沈知微是神棍的马文耀心里发毛，偷偷揣着邪师给的压魂血香钻进昇平戏楼负一层地下车库，想从后台货运梯溜上戏台加固镇物。空旷死寂的现代车库里异象骤起：未插钥匙的豪华轿车中控屏自己亮起，音响里传出许小蝉被灌哑药时凄厉的昆曲哭腔，紧接着两条湿淋淋、滴着黑泥水的白色水袖竟从车内空调出风口猛地钻出，死死缠住马文耀的脖子将他往方向盘上勒。马文耀连滚带爬撞开车门逃命，却不知后巷勘察水脉的沈知微早已将他的亏心举动尽收眼底。"}, {"n": 71, "title": "戌时起高腔当众吐木屑", "synopsis": "次日晚七点，昇平老戏楼座无虚席，文化名流与非遗评委齐聚台下，外公裴鹤年与沈知微、陆宴辞稳坐前排雅座。苏曼音以为后台刚加了双倍镇魂符万无一失，水袖一甩登台开唱。七点二十九分她唱腔婉转清亮，马文耀在包厢里得意冷笑；然而七点三十分（戌时二刻）整点钟声一响，苏曼音正拔高嗓音唱主句，喉咙里骤然炸开男女混杂的破锣惨叫，原本清越的嗓音瞬间烂成砂纸摩擦声，紧接着她捂住脖子跪倒台心，当着全场镜头大口吐出混着黑血丝的腐臭樟木锯末。"}, {"n": 72, "title": "清场锁戏楼藻井垂血袖", "synopsis": "戏楼内一片哗然，陆宴辞早有准备，指挥陆氏安保团队以舞台电路检修为由在五分钟内有序疏散全部无辜观众，表哥裴铮率便衣刑警悄然封死戏楼前后出口。马文耀慌忙给顾问周明远打电话，却发现周明远早在开演前十分钟便借口去市政开会溜之大吉。清场后的老戏楼大门自落千斤木栓，两侧走廊玻璃展柜里的十几套民国旧戏服无风自立，戏台正上方藻井里垂下数十丈浸血白水袖，将狼狈逃向台下的苏曼音与马文耀死死捆在台柱上。"}, {"n": 73, "title": "六百万买命招认杀替身", "synopsis": "面对贴到鼻尖的泡发女鬼脸与越收越紧的染血水袖，脖颈皮肤浮现黑木刺痕的苏曼音与马文耀彻底吓破苦胆。沈知微端坐在八仙椅上指明：她绝不替杀人凶手消灾脱罪，若想保住狗命留着上法庭受审，立刻把三年前怎么害死许小蝉、尸骨藏在哪一五一十交代清楚，并拿出六百万全额赔偿许小蝉双目失明的乡下外婆与修庙济困。濒临断气的马文耀涕泪横流，当着裴铮开启的执法记录仪招认：三年前苏曼音毁嗓后嫉恨替身许小蝉天赋，两人灌哑药毒坏她声带将其活活勒死在戏台乐池夹层，并花重金请邪师用她喉骨炼成“百伶借嗓木偶”。"}, {"n": 74, "title": "飞身劈木偶破柱出青衣", "synopsis": "拿到铁证与转账回执后，沈知微脚踏开门八极步蹬上三米高的朱漆戏台抱柱，一眼锁死藻井正中那尊嵌着活人喉骨、嘴拴红铜丝的“百伶借嗓柳木偶”。她双手抡圆十二斤玄铁量天尺雷霆横扫，百年阴木偶当空炸裂。邪气顺因果死契瞬间倒灌，台下的苏曼音惨叫一声彻底失去人声，下巴与脖颈爆出大片溃烂黑斑，马文耀亦口吐黑血瘫软如泥。与此同时，气浪震裂西侧主台柱表层腻子，七颗涂满江尸油的镇魂棺材钉崩飞落地，被邪师强行钉在柱内充当聚煞电池的民国护法阴魂柳青衣破封而出。"}, {"n": 75, "title": "拔毒刺解怨收编柳青衣", "synopsis": "被棺材钉折磨三年的民国戏魂柳青衣怒火滔天，漫天月白水袖化作利刃卷向戏台。沈知微一眼看到她魂体眉心萦绕着1938年大火舍身救徒的纯正金光，没有下死手拍散，而是横起玄铁量天尺稳稳架住水袖，左手弹出温润朱砂墨线，替她将卡在魂魄琵琶骨里的两截黑木毒刺利落拔出，并引功德金光打开乐池夹层，让苦主许小蝉的冤魂得以瞑目散去。柳青衣恢复神智，感念沈知微一身正道骨气，当场与沈知微立下“每月初一十五供奉茉莉香片与高香”的护法契约，成为栖梧院堪舆堂第二员猛将。"}, {"n": 76, "title": "恶侣终伏法警局逢伪善", "synopsis": "法医从乐池水泥夹层起出许小蝉尸骨与凶器，苏曼音与马文耀罪证确凿被批捕收押。裴铮传唤戏楼修缮总顾问周明远协查阴木来源，老谋深算的周明远却早把所有采购签字推给一名三天前“意外溺亡”的外包老木工，在阳间证据链上撇得干干净净。周明远神色自若走出刑警队大门，迎面撞见来送证物的沈知微与陆宴辞。他微笑着夸赞沈知微年少有为，沈知微却在他清淡檀香掩盖下闻到了浓郁的江底尸蜡味，并看清他纯银袖扣缝隙里嵌着活水江蛤血锈，心里彻底锁死此人便是九宫厌胜会江城分舵主。"}, {"n": 77, "title": "小院奉香茗青衣指古桥", "synopsis": "回到栖梧院，外公裴鹤年特意找出老式留声机放起昆曲名段，泡上特级茉莉香片招待新护法柳青衣。讲究体面的民国青衣嫌弃独臂木匠鲁大爷旱烟味重，一鬼一匠斗嘴逗得灵猫铜钱满院扑水袖，小院热闹非凡。待沈知微取出医院与戏楼的两块碎木桩比对，柳青衣神色骤凛，亲口指认三年前戴着手套把她钉入台柱的正是周明远，更听他亲口说过：借寿桩与借嗓偶只是两道开胃血引，真正的大杀器埋在陆家三代养护的“沧澜跨江大桥”明代老桥基下，只等秋分大潮引爆母桩抽干全江水运。"}, {"n": 78, "title": "台风催大潮扣脉压肋钉", "synopsis": "超强秋台风携天文大潮逼近江城，江水暴涨两米。沈知微冒风赶到陆氏大厦顶层总裁室时，室内暖气开到最高，落地窗玻璃上却结出一道道江浪形状的诡异冰凌；陆宴辞白衬衫右肋处渗出暗红血迹，皮肤下浮现出三寸长的青黑水草木纹，寒气直逼肺腑。沈知微二话不说扯开他衣领，左手十指与他死死相扣渡入温热功德金光，右手用半截染血鲁班尺压住他肋间穴位，硬生生将暴走的水煞逼退。沈知微喘着白气断定：这第二根子钉与沧澜古桥下的镇河生桩母木同根相连，不劈碎桥墩母桩，强拔必震碎他右肺。"}, {"n": 79, "title": "夜勘检修道铁舱立湿鞋", "synopsis": "台风登陆前夜，陆宴辞动用陆氏营造管养权限，带沈知微与熟悉古桥木桩结构的外公裴鹤年进入沧澜跨江大桥下层距江面五十米高的钢构检修通道。轰鸣江风中浮现两处令人脊背发凉的细节错位：悬空通道上的电子风速计叶轮竟迎着八级狂风逆时针倒转，轴承缝里不断往下滴落鲜活的江底水草；打开三号明代老桥墩上方的检修铁舱门，干燥水泥舱壁前竟整整齐齐立着七双湿透滴水的老式黑布鞋，鞋尖全部死死顶着墙壁，仿佛有七个看不见的修桥匠正贴墙罚站。沈知微一眼看破这是九宫厌胜会极其歹毒的“七匠镇河生桩局”。"}, {"n": 80, "title": "借风强封桥当面下死断", "synopsis": "周明远仗着市政防汛古建专家组组长头衔，带着刚批下来的七十二小时全桥封闭禁令与私人保安赶到检修道，假惺惺以台风安全为由强行清场封锁三号桥墩，实则盘算在后天中秋台风大潮峰值之夜引爆桥底母桩——既能震塌大桥让负责管养的陆氏营造身败名裂，又能借滔天水煞直接震碎陆宴辞心肺。面对周明远居高临下的虚伪逐客令，沈知微没有硬闯警戒线，而是看清他金丝眼镜后印堂已浮起一道横穿鼻梁的青黑断命纹，冷声留下铁口判词：后天子时大潮拍桥，他这根害人母桩必断，这座桥墩就是他给自己修的棺材。"}, {"n": 81, "title": "翻旧档揪出七匠血账", "synopsis": "回到栖梧院，外公裴鹤年凭记忆画出三号明代老桥墩的水下木石基础图，指出普通水泥修补绝不会传出空心木棺回响。表哥裴铮连夜调阅五年前沧澜大桥水下加固工程的尘封档案，陆宴辞同步比对当年分包商的资金流水，终于撕开桩骇人黑幕：五年前周明远主持水下桥基修缮时，私吞了三千万特种防渗钢材款，改用腐朽阴木充数；七名发现偷工减料准备举报的老潜水匠在下水作业当晚集体失踪，被周明远伪造成急流冲走草草结案，实则全被封入桥墩当了“七匠镇河生桩”。"}, {"n": 82, "title": "饮水机吐发贪官惊魂", "synopsis": "台风外围风圈登陆当晚，大桥北岸市政防汛临时指挥室里灯火通明。收了周明远五百万贿赂违规批下封桥令的副局长钱卫东正端起纸杯接热茶，饮水机出水口明明亮着九十五度红灯，流出来的却是冰冷刺骨、混着细碎河蚌壳与黑头发丝的江底泥水；他低头看玻璃茶几，倒影里的自己脖子上竟骑着一个穿橘色潜水服的肿胀人影。钱卫东吓得魂飞魄散，当场揪住周明远衣领质问五年前那七个潜水工是不是来索命了，哭闹着要撤销封桥令去自首。"}, {"n": 83, "title": "滨江路截车震出溺水刺", "synopsis": "钱卫东冒着暴雨驾车逃离指挥室准备回家拿账本自首，车刚开上滨江大道，方向盘突然锁死直冲江堤护栏，他明明坐在干燥车厢里，口鼻却不断往外呛出腥臭江水，眼看就要活活“旱地溺死”。早已在路口蹲守的裴铮果断驾警车逼停失控轿车，沈知微上前砸碎车窗，凭钱卫东耳孔渗出的绿萍水渍与后颈衣领鼓起的木棱两处细节，双指夹住玄铁量天尺尺柄在他大椎穴重重一磕，震出一根刻着生辰的柳木水刺，当场破了周明远的杀人灭口局。"}, {"n": 84, "title": "青衣展水袖铁尺碎潮桩", "synopsis": "灭口失败的周明远狗急跳墙，子夜时分命两名分舵邪徒撬开栖梧院后街的市政雨水井，顺暗渠放入三尊涂满尸蜡的“引潮水鬼木桩”。刹那间栖梧院青砖地面凭空渗出半尺深的黑臭江水，水影里伸出无数惨白手掌抓向正堂门槛。灵猫铜钱摇铃示警，新收编的民国戏魂柳青衣首次出战，十丈月白水袖凌空铺开护住院落四角，沈知微踏水跃出院门，凭井盖反冒冷泡与铁梯结霜锁死方位，一量天尺砸碎雨水井盖劈断水桩，隔空将百米外作法的两名邪徒震得双腕骨折吐血被擒。"}, {"n": 85, "title": "鲁大爷认出倒钩燕尾榫", "synopsis": "清晨，守祠独臂木匠老鬼鲁大爷死死盯着昨晚劈获的水桩残件，认出上面阴毒的“倒钩燕尾榫”正是九宫厌胜会江城分舵主的独门绝活——三十年前沈家修祖祠时，正是使这种榫法的邪门木匠教唆沈家害死鲁大爷封入横梁。这种倒钩榫一旦硬拔便会拉塌整座桥墩承重石，唯有顺着木纹斜下三寸七分、用十二斤以上重尺斩断“子母楔心”方能桩碎而桥不伤。外公裴鹤年对照大桥图纸当场验证榫卯受力点，彻底补齐了登桥破阵最关键的技术拼图。"}, {"n": 86, "title": "遗孀奉铜哨金芒覆铁尺", "synopsis": "午后台风眼短暂过境，裴铮带五年前失踪的七名潜水修桥匠的家属代表来到栖梧院。得知亲人并非意外溺亡、而是被黑心顾问封在冰冷桥墩下受尽折磨，白发老母与遗孀们泣不成声，没有求沈知微施舍钱财，而是颤抖着捧出工匠们生前贴身戴的七枚黄铜联络水哨，只求沈大师劈开邪桩让亲人魂魄回家。沈知微不收分文，用朱砂红线将七枚铜哨串在玄铁量天尺尺柄上，纯净的亲情愿力化作一层淡淡金芒覆满尺身，连院里的桂花树都在风雨前透出暖意。"}, {"n": 87, "title": "饮罢驱寒汤重船破浪行", "synopsis": "中秋台风夜幕降临，栖梧院厨房里外公裴鹤年煮了一大锅驱寒的胡椒猪肚羊汤，逼着沈知微和陆宴辞一人喝下两大碗才准出门。陆宴辞右肋下的第二根阴钉随江潮上涨已刺痛到渗血，脸色苍白却眼神沉静，亲自指挥水陆三路合围：表哥裴铮持钱卫东口供与搜查令带特警强攻北岸封桥卡口切断周明远退路，外公坐镇工程船指挥舱监控桥体应力，沈知微携陆宴辞、一猫两鬼乘重型破浪船直抵三号桥墩水下防撞钢围堰。"}, {"n": 88, "title": "桥腹立空衣铜哨唤匠魂", "synopsis": "破浪船顶着狂风巨浪精准贴靠三号桥墩钢围堰，陆宴辞用工程液压钳剪开水密检修暗门，与沈知微踏入桥墩内部潮湿幽深的明代石砌泄水廊道。封闭廊道里浮现骇人错位：墙壁挂着的救生圈自己渗出黑红血水，七具空荡荡的橘色旧潜水服竟像充了气般直立在积水里，头盔玻璃罩后贴着泡烂的惨白人脸，机械地举起铁撬棍拦路。沈知微没有挥尺打散苦主魂魄，而是摘下尺柄上的七枚黄铜水哨逐一吹响，熟悉的家人气息穿透邪术迷障，唤醒了老工匠们死前想保住大桥的执念。"}, {"n": 89, "title": "沉箱现母桩恶舵主催钉", "synopsis": "沈知微与陆宴辞推开石拱暗门，只见三号桥墩核心沉箱密室中央，赫然竖立着一根两人合抱粗、缠满铁链与七匠生辰血布的百年阴沉木“镇河生桩”，桩顶嵌着一卷油布古册。撕下斯文伪装的周明远身穿九宫八卦黑木袍，正手持紫檀骨锤敲击桩心——他不仅要吞没千万修桥巨款，更奉总坛“墨先生”密令，借今晚大潮水煞震塌大桥、抽干陆宴辞极阳紫气以换取晋升九宫堂主的资格。见两人闯入，周明远狞笑着拍下催命血钉，母桩与陆宴辞右肋二钉瞬间产生致命共振。"}, {"n": 90, "title": "极阳染尺锋群灵破水偶", "synopsis": "刺骨江潮涌入密室没过小腿，周明远掷出十二尊泡满江尸油的樟木水鬼偶扑向两人，企图趁陆宴辞剧痛倒地时夺取沈知微的玄铁量天尺。关键时刻，柳青衣水袖如刀绞碎左侧六尊邪偶，鲁大爷挥动墨斗鲁班斧劈飞右侧木偶，灵猫铜钱跃上梁头撞翻周明远的尸油灯。陆宴辞强忍右肋撕裂剧痛没有后退半步，反而主动扯开领口逼出一滴滚烫极阳指尖血抹在沈知微的玄铁量天尺刃口上，助她看清浑浊黑水中母桩“倒钩燕尾榫”那一线稍纵即逝的赤红楔心。"}, {"n": 91, "title": "斜劈三寸七母桩碎狂澜", "synopsis": "裹挟着功德金光与极阳血气的玄铁量天尺分毫不差劈入母桩斜下三寸七分的子母楔心！只听一声震耳欲聋的闷响，整根百年阴沉木“镇河生桩”从内部寸寸崩裂成焦黑碎木，倒钩燕尾榫应声瓦解，没有伤及三号桥墩明代条石分毫。被禁锢五年的七匠怨气混着狂暴水煞，顺着血契疯狂倒灌回设局人周明远体内。周明远金丝眼镜炸碎，全身皮肤瞬间鼓起溺水浮肿的青黑水泡，双腿膝骨在反噬巨力下咔嚓折断，一口接一口狂吐江底黑泥血沫，修为彻底废除。"}, {"n": 92, "title": "七匠归轮回夺取残卷图", "synopsis": "裴铮率特警队冲下检修通道，将全身溃烂瘫软、连自杀力气都没有的周明远连同密室铁匣里的三千万贪腐账册、买凶录音一并铐走查封；法医在碎裂母桩下方的石槽里起出七名潜水匠的遗骸与工牌，七道工匠残魂向沈知微深深鞠躬后踏着金光安然散去。沈知微伸手取下原先嵌在桩顶镇阵的油布古册，正是九宫厌胜会分舵秘藏的《鲁班厌胜残卷（水字篇）》。然而母桩一毁，失去根系牵引的第二根夺运阴钉在陆宴辞右肋内剧烈翻滚反扑，逼得他当场寒毒攻心倒在沈知微怀中。"}, {"n": 93, "title": "江心锁暖舱引煞入寒骨", "synopsis": "外公裴鹤年指挥破浪工程船驶入避风江湾抛锚，沈知微将浑身结满白霜的陆宴辞扶进底舱暖室。失去桥底母桩供养的第二根“锁水子钉”正顺着肋间经脉往他心肺深处疯钻，一旦入肺半个时辰必死。沈知微屏退众人，反锁舱门，用朱砂墨斗线缠住两人手腕建立阴阳气机回路，左手与半昏迷的陆宴辞十指死死相扣，主动用自己天生的“漏阴骨”把霸道刺骨的江底水煞往自己经脉里引，白皙手背瞬间浮现出一层刺目的青紫冰纹。"}, {"n": 94, "title": "双尺挑毒钉紫气融寒霜", "synopsis": "船舱外风浪渐息，舱内寒气却凝成实质白雾。沈知微额角冷汗涔涔，右手倒持十二斤玄铁量天尺压住半截染血鲁班尺的榫槽，借两人十指紧扣激荡出的精纯极阳紫气，猛地一挑一拔——一根三寸长、刻满细密水波咒文且带着倒刺的乌黑阴沉木子钉连根带血从陆宴辞右肋穴位拔飞出来，钉入舱壁寸许后化作焦炭！陆宴辞体内压抑三年的极阳气血轰然畅通，而承受了三日经脉寒痛代价的沈知微眼前一黑咳出一丝血沫，软软倒进陆宴辞滚烫宽阔的怀抱里。"}, {"n": 95, "title": "彻夜渡阳温尺榫露端倪", "synopsis": "后半夜破浪船返航靠岸，陆宴辞不假他人之手，亲自抱着因拔钉寒毒发热寒战的沈知微回到栖梧院主卧，整夜握着她的手渡送极阳温气替她驱散三日寒痛。替她整理随身帆布包时，陆宴辞近距离看清了那半截染血鲁班尺尾端的断裂榫口——那分明是唯有陆氏祖传《镇河秘档》才记载的“锁龙护心子母扣”，与他书房那张二十年前残图严丝合缝！陆宴辞心头巨震，初步意识到沈知微生母裴氏当年的失踪极可能与陆家水脉大劫有关，眼底冷硬彻底化作深沉偏爱，并当场安排财务转入两千万拔钉润金。"}, {"n": 96, "title": "提审废舵主指向玄水堂", "synopsis": "休养两日后，沈知微经脉寒痛在极阳紫气与功德金光滋养下痊愈，与陆宴辞一同前往监管医院听裴铮提审周明远。经脉尽废、面临无期徒刑的周明远为求镇痛药物减轻反噬折磨，交代他只是九宫厌胜会外围分舵主，从未见过总首领“墨先生”真容，只知墨先生戴白手套、精通失传鲁班秘术；而陆宴辞左肩深处潜伏的第三根夺运阴钉，正是由九宫厌胜会主力堂口“玄水堂”堂主用太湖古沉船阴木炼制，根系远在江南姑苏水乡古镇的百年园林水脉之中。"}, {"n": 97, "title": "合参残卷谱锁死姑苏水", "synopsis": "回到栖梧院书房，外公裴鹤年、沈知微与陆宴辞共同研读从桥墩母桩夺得的《鲁班厌胜残卷（水字篇）》。外公凭古建泰斗功底解开残卷上的鲁班暗码，上面清晰记载着九宫厌胜会截取江南水运的“子母连环水桩谱”：江城沧澜古桥只是最北端的一处引水支桩，真正的江南聚煞枢纽设在姑苏水乡的私家古园林、双生祠堂与太湖百年水葬沉船之中；唯有破开姑苏水木复合阵，才能安全拔出陆宴辞左肩骨缝里的第三根子钉，并寻回生母当年勘测水脉留下的下半部线索。"}, {"n": 98, "title": "千万汇青云铁口震江城", "synopsis": "跨江古桥化险为夷、贪腐专家周明远落网的消息传遍江城上流圈，市政桥梁局特意给外公裴鹤年与栖梧院堪舆堂送来护桥功臣牌匾，“江城铁口沈小宗师”的名号彻底响彻江南商圈，求卦破煞的豪门预约排到了半年后。沈知微认真拨着算盘，将陆宴辞刚转的两千万第二钉润金连同戏楼功德款严格按“十留三”铁律，一次性汇出一千四百万给阴山青云观重塑三清金身、铺设琉璃瓦并注入古建工匠抚恤基金，自身留存的存款也突破千万，漏阴骨在浩瀚功德金光包裹下再无往日阴寒。"}, {"n": 99, "title": "桂院烹羊汤烟火聚满堂", "synopsis": "秋分过后的夜晚，栖梧院百年金桂盛开，石桌上砂锅羊汤咕嘟冒泡，配着裴铮买来的麻辣小龙虾和炭火羊肉串香气扑鼻。裴老爷子红光满面地给外孙女夹羊排，看门鬼匠鲁大爷与民国青衣柳青衣在廊下享受特制高香与茉莉香片，灵猫铜钱抱着小鱼干打滚；向来有洁癖的陆宴辞熟练地戴上手套剥好一整碟虾仁放进沈知微碗里，听裴老爷子敲打他“敢让我外孙女累着就拿鲁班尺拍你”，冷峻眉眼间满是温柔笑意。昔日孤身算账的小道姑，如今已在江城拥有了最硬气的娘家与后盾。"}, {"n": 100, "title": "执尺向姑苏水脉起新潮", "synopsis": "陆宴辞告诉沈知微，随着秋雨入太湖，姑苏陆氏老园林的守园人昨日发来急讯：园中假山滴水竟在晴夜倒流回石缝，绣楼古镜无故渗出脂粉冷香，而他左肩骨缝里的第三根夺运阴钉也随之隐隐发紧。两人在桂花树下正式定下第二阶段同行盟约——沈知微留外公与表哥照看栖梧院根基，亲携玄铁量天尺、半截染血鲁班尺以及装有鲁大爷、柳青衣和灵猫铜钱的行囊，与陆宴辞并肩南下姑苏破水脉、拔三钉、寻母踪。次日清晨，阳光铺满跨江大桥，两人并肩登车驶向烟雨江南。"}], "chapters": [{"n": 1, "title": "回门宴铁口断折腿", "body": "九月初的江城刚下过一场秋雨，傍晚闷湿的风顺着雕花铁门灌进沈家老宅前院。\n\n沈知微背着一只洗得发白的军绿色旧帆布包，迈过汉白玉门槛走进玄关。帆布包看着瘪，里头却沉甸甸压着两样东西：一样是师父云鹤道长传下来的十二斤玄铁量天尺，另一样是用粗布裹了三层的半截染血鲁班木尺，断口处刻着残缺的“锁龙第三椿”五个旧字，木纹里还浸着她生母裴氏二十年前留下的暗褐指印。\n\n前些天师父在阴山青云观羽化，临闭眼指着三清殿漏雨的东侧屋顶，让她下山回江城沈家一趟，把生母留在沈宅的遗物樟木箱拿回来，顺便下山接几桩红尘破煞的活计，攒够修大殿屋梁的功德钱。沈知微兜里统共只剩买完硬座车票找零的三十八块钱，这才上了沈家派来接人的黑车。\n\n保姆刘妈站在玄关冷眼打量她的帆布鞋，随手接过她手里滴水的黑布伞往伞架上一插，嘴里敷衍地催了一句：“大小姐快进去吧，先生和二房一家都在餐厅等着了。”\n\n沈知微没急着抬脚，目光落在玄关右侧那面镶金边的落地穿衣镜上。\n\n水晶壁灯照得玄关亮堂堂的，她刚刚收回递伞的右手、侧身转向客厅，穿衣镜里的那个自己却还维持着抬手递伞的姿势，足足慢了半拍才生硬地转过肩膀。镜面右下角更笼着一团鸡蛋大小的灰白水雾，刘妈刚才拿干抹布擦过镜框，那团水雾却像长在玻璃夹层里似的纹丝不动。\n\n活人住的阳宅，镜影滞后半拍，说明屋里的阴气已经浓得挂住了光影。这栋表面富丽堂皇的民国翻新老宅，底下早被人动了借运害命的烂手脚。\n\n沈知微神色不变，按住帆布包肩带走进灯火通明的餐厅。\n\n长条红木餐桌旁已经坐满了人。主位上的中年男人穿着考究的深灰羊绒衫，正是她名义上的亲生父亲沈建业。见她进来，沈建业连屁股都没抬一下，只把面前那碗汤往旁边挪了挪，眉头微蹙地扫了一眼她肩上的旧帆布包：“回来了就坐下吃饭。在山里野观待了十八年，以后回了沈家，那些算命打卦的江湖习气趁早收起来，别出去丢沈氏集团的脸。”\n\n他之所以肯派车把沈知微接回来，不过是因为前阵子沈知微外公裴鹤年老爷子从省外修古建回江城了，几次三番追问外孙女的下落，再加上沈建业一直惦记着亡妻裴氏留下的城南梧桐巷老宅“栖梧院”，想把人接回来哄出地契。\n\n“爸，您别这么凶嘛，姐姐刚下山，肯定还不习惯家里的规矩。”坐在沈建业右手边的年轻女孩连忙站起身，穿着一身米白色真丝连衣裙，一头栗色长卷发梳得精致柔顺，眼眶微红地拉住沈知微旁边的空椅，尾音拖得又软又怯，“姐姐快坐。本来该把三楼向阳的大套房腾给你的，可那间屋子前两天刚巧漏水翻修，全是油漆味。我让人把二楼北头的小阁楼收拾出来了，虽然偏僻点，但清静，姐姐千万别怪我自作主张呀。”\n\n这就是鸠占鹊巢十八年的假千金沈楚楚，原本只是沈家二房远房表亲的女儿，当年沈知微生母临盆失踪后被抱来顶了名分。如今沈氏正盯着城南旧改的大项目，沈楚楚生怕真千金回来分走她的股份嫁妆，面上装得楚楚可怜，话里话外却直接把沈知微往二楼北侧的杂物阁楼里塞。\n\n刚才路过楼梯口时，沈知微就瞧见二楼北侧走廊连盏亮灯都没有，门缝底下丝丝缕缕往外冒着阴湿的陈年木头霉味。\n\n餐桌对面，穿紫红真丝旗袍的二婶张翠兰嗤笑一声，涂着丹寇的手伸长筷子去夹清蒸东星斑，阴阳怪气地搭腔：“楚楚就是心善，换作旁人，一个在阴山破道观里跟死人牌位打交道的丫头，给间佣人房住就烧高香了，还挑什么三楼大套房？”\n\n她儿子沈耀祖今年二十二岁，正翘着二郎腿低头猛啃一只奶油焗澳龙，闻言把虾壳往骨碟里一吐，吊儿郎当地晃着脑袋笑：“妈，人家说不定在山上练出神仙本事了呢！喂，新来的，听说你在道观里学看相？来给我算算，小爷下个月能不能把城南那台限量版超跑提回来？”\n\n一桌子人顿时发出哄笑，连站在餐边柜旁的刘妈都撇了撇嘴。\n\n沈知微拉开椅子坐下，没动面前那副连茶水都没倒的冷碗筷。刚才张翠兰伸手夹鱼的那两秒钟，一股熟悉的阴冷腥臭顺着空调风钻进沈知微鼻腔——那不是海鲜的腥味，而是常年不见阳光的废井死水里，泡烂了成团头发丝才会返出来的腐水味。\n\n她垂眸往桌布底下扫了一眼。张翠兰正得意地抖着脚，脚上那双定制裸色高跟鞋，左脚鞋跟的防滑胶皮比右脚硬生生多磨平了三毫米左右，鞋跟内侧还粘着指甲盖大的一抹青黑湿苔。那是夜里摸黑踩在古井青砖沿上、单脚吃力蹲身往下扔东西留下的磨损。\n\n沈知微抬起眼，目光落回对面沈耀祖那张油光满面的脸上。\n\n餐吊灯暖黄的光线照下来，沈耀祖两条眉毛正中间的印堂位置，赫然悬着一道半寸长的青黑细线，末端分叉倒垂，活像一条倒挂的死鱼尾巴，黑气已经顺着鼻梁山根往下扎进了眼角；而他搭在桌边的运动裤裤脚上，还沾着几粒暗红色的老桐油朽木渣——那是后院沈家祖祠百年老梁才有的漆皮碎屑。\n\n她修的是阴山观微骨相术，从活人骨相气色和周遭蛛丝马迹里就能断出吉凶，只是按师门规矩算人不算己。如今张翠兰身上的井水腐发味、磨偏的鞋跟，再加上沈耀祖眉心的黑线和裤脚木渣，桩桩件件都摆在明面上，连老天爷都在替她省力气。\n\n“超跑你提不到了，轮椅倒是可以提前订一把。”沈知微嗓音平缓利落，连语调都没起伏一下，像山里老木匠拿着墨斗报尺寸一样笃定，“二婶袖口返着后院废井泡烂头发的腥气，左脚鞋跟比右脚多磨平三毫米，最近没少半夜去井边喂东西吧？可惜借来的横财压不住反噬。”\n\n张翠兰夹鱼的筷子猛地一抖，鱼肉啪嗒掉在桌布上，脸色瞬间变了：“你、你胡说八道什么！什么废井喂东西！”\n\n沈知微没理会她的心虚尖叫，径直看向笑容僵在脸上的沈耀祖：“至于你，印堂鱼尾黑线过山根，裤脚粘着祠堂腐木渣。今晚亥时三刻，也就是九点四十五分之前，离后院祖祠远一点，千万别往供桌横梁底下站。不然老梁塌下来，你两条腿的膝盖骨当场就得碎在阴木底下。”\n\n餐厅里安静了两秒，随即爆发出沈耀祖恼羞成怒的拍桌骂声：“操，你个乡下神棍敢咒我断腿？我家祠堂前年才找大师重新刷过桐油，结实得很！”\n\n“够了！”沈建业重重摔下汤勺，老脸铁青地指着沈知微，“刚进门就咒你堂哥残废、污蔑你二婶，这就是你在道观里学的教养？没规矩的东西，这顿饭你别吃了，现在就给我滚上楼闭门思过！”\n\n沈楚楚拿着餐巾按了按嘴角，眼底掠过一丝压不住的快意，面上却赶紧招手叫刘妈：“刘妈，快带姐姐去二楼北侧阁楼休息，千万别让姐姐再惹爸生气了。”\n\n沈知微本来也没打算吃这桌满是怨煞气的冷饭。她站起身，单手拎起十二斤重的旧帆布包往肩上一挎，目光平静地越过沈建业：“我妈当年留下的那口樟木箱呢？”\n\n沈建业冷哼一声：“锁在二楼储物间里，等你什么时候学会懂事听话，什么时候再给你！”\n\n“行，锁好别丢，明天早上你们还得亲自给我抬出来。”沈知微看了眼墙上的石英钟，指针刚过八点半，“现在不信没关系，离九点四十五分还有一个多钟头，你们自己看表。”\n\n说完，她头也不回地迈步走上旋转楼梯。身后传来张翠兰骂骂咧咧的唾弃声和沈耀祖嚷嚷着“今晚非去祠堂转一圈打烂她嘴”的叫嚣，沈知微充耳不闻。\n\n二楼北侧走廊尽头没有开灯，刘妈把一把生锈的黄铜钥匙往她手里一塞，逃命似的转身跑下了楼。\n\n走廊拐角的挂钟滴答走到了九点四十分，距离亥时三刻只剩最后五分钟。\n\n沈知微拧开铁锁，推开北侧杂物阁楼吱呀作响的旧木门。屋里门窗明明锁得严严实实，迎面扑来的寒气却比深秋山涧里的冰水还刺骨。借着走廊透进来的半缕昏黄微光，她走到房间正中那张积满灰尘的民国旧梳妆台前停下脚步。\n\n台面上立着一面椭圆形的水银圆镜。沈知微已经站定了整整三秒钟，圆镜里映出的那个“自己”却还低着头，直到第四秒才脖子咔咔作响地缓缓抬起脸，伸出一只青白浮肿的手，抓起台面上一把断了两根木齿的黄杨木梳，冲着镜子外头无声地咧开了嘴角。"}, {"n": 2, "title": "量天尺劈梳反剃头", "body": "咔嗒一声轻响，阁楼背后的旧木门自己落了死栓，头顶那盏本就昏暗的钨丝灯泡滋啦闪了两下，彻底灭了。\n\n窄小的杂物阁楼里瞬间冷得像座地下冰窖，空气里弥漫起一股浓重的生锈铁腥味，中间还夹杂着廉价玫瑰护手霜的甜腻香气。\n\n梳妆台上的椭圆水银镜面像被人从背面捅破的水膜一样鼓胀起来。一缕缕湿漉漉、粘成条状的乌黑长发率先从镜框边缘垂落，紧接着是一颗头皮翻卷、满是细密血窟窿的脑袋。那穿着旧式碎花睡衣的女阴魂四肢扭曲地爬出镜面，枯瘦青白的手指死死攥着那把断齿黄杨木梳，喉咙里发出破风箱般的嗬嗬声：“梳头……替她梳头……头发剃干净，灾就替过去了……”\n\n话音未落，女阴魂猛地扑到沈知微面前不到半尺处，带着刺骨腥风的断齿木梳照着沈知微头顶百会穴狠狠刮了下来！这一下要是让普通女孩挨实了，不仅满头长发会被阴气连根扯落，三魂七魄还得被梳齿里的怨煞勾走一半，天亮就得变成疯子。\n\n沈知微站在原地纹丝未动，左脚往前踏出半步，正是阴山道观护山武学开门八极拳的落地桩。她左手手背迎着阴风干脆利落地往外一格，掌心流转的微弱纯阳气机当场震得女阴魂手腕歪斜，木梳擦着她耳畔划空；与此同时，她右手拉开旧帆布包拉链，握住那柄宽背厚刃、足有十二斤重的玄铁量天尺，顺势往上一挑！\n\n沉甸甸的玄铁尺身在黑暗中带起一声低沉的破风闷响。沈知微近距离看得清清楚楚：那把断了两根齿的百年黄杨木梳背脊上，被人用鲁班邪门暗榫掏了一道两寸长的细缝，缝隙里塞着一张卷成细筒的黄表纸，纸角沁着暗红的活人指尖血。\n\n“拿别人八字填坑的藏魂替灾梳，手艺糙得够可以。”\n\n沈知微冷笑一声，手腕发力，十二斤重的玄铁量天尺对准黄杨木梳脊背正中的暗榫阵眼，自上而下重重一尺劈落！\n\n啪的一声脆响，坚硬的黄杨木梳应声崩裂成两截！一股黑灰色的腥臭怨气从断裂的榫槽里炸开，里面塞着的那张黄表纸飘落在地。沈知微借着窗外透进来的冷月光扫了一眼，纸条正面用掺了血的红墨水写着她沈知微的出生年月日时，背面还压着“沈楚楚百无禁忌”七个娟秀小字——跟客厅果盘底下垫着的沈楚楚签名便签字迹一模一样。\n\n木梳阵眼一破，原本凶神恶煞的长发女阴魂像被抽掉了脊梁骨，尖叫一声跌坐在地板上，抱着满是血洞的脑袋瑟瑟发抖，再也不敢往玄铁量天尺跟前凑半步。\n\n沈知微弯腰捡起那张替灾纸条揣进兜里留作凭证，上前一步，五指扣住女阴魂冰冷滑腻的后颈，将它提溜起来：“说清楚，谁把你封进梳子里的？谁给你喂的血？”\n\n玄铁量天尺就横在阴魂眉心一寸外，尺身上历代传人斩煞留下的凛冽威压烫得阴魂魂体直冒白烟。女阴魂吓得连声哭嚎：“饶命！天师饶命！是一个穿白裙子、叫沈楚楚的小姐！三天前她花十万块钱从城南术士手里买下我，每天半夜扎破手指头往梳齿上滴血喂我，让我今晚守在阁楼镜子里，只要有人拎包住进来，就把她的头发剃得一根不剩、把人吓疯赶回乡下！”\n\n沈知微听得明明白白。沈楚楚既怕她分走沈家独女的名分和城南旧改的嫁妆，又舍不得花大价钱请真正的高人，就买了个这种下三滥的藏魂木梳，妄想神不知鬼不觉把她弄疯成秃子。\n\n按照鲁班厌胜术的规矩，邪器一破，怨气必归原主。这女阴魂生前没背人命债，只是死后头发被邪师封进木梳当了苦力，但沈楚楚既然连续三天用自己的心血喂熟了它，这桩因果账自然得落回雇主头上。\n\n沈知微松开手，拎起量天尺走到阁楼南侧墙角。这栋民国老宅当年改建中央空调前留着一套老式铁皮通风管道，阁楼这处检修口正好直通正下方二楼的主卧衣帽间——刚才上楼时她就闻见这通风口里飘出跟沈楚楚身上一模一样的玫瑰护手霜味。\n\n她用玄铁量天尺尾端轻轻一撬，卸下生锈的铁皮百叶窗，弯腰捡起地上那半截还沾着沈楚楚指尖血的断齿黄杨木梳，连同缩成一团的女阴魂一块儿推到管道口：“白吃人家三天血食，活儿总得干完。谁拿血喂的你，你现在顺着管子下去找谁梳头。记住，只准剃右边一半，别闹出人命脏了我的地界。”\n\n女阴魂原本被沈楚楚的血契强行驱使就憋了一肚子怨毒，此刻禁制一碎，闻着通风管里熟悉的雇主血气，两只灰白眼珠子顿时亮起绿光，抓着半截断梳嗖地钻进了黑漆漆的管道深处。\n\n沈知微拍了拍手上的灰，把百叶窗原样扣回去。\n\n恰在这时，走廊外那座老挂钟发出一声沉闷的报时脆响——晚上九点四十五分，亥时三刻到了！\n\n就在钟声落下的同一秒，老宅后院方向突然传来轰隆一声巨响，紧接着是一阵木梁断裂、砖瓦砸地的剧烈震动，连二楼的地板都跟着轻轻颤了颤。\n\n后院沈家祖祠里，堂兄沈耀祖半分钟前正打着手机手电筒，做贼心虚地猫腰钻在供桌底下。晚饭时沈知微那句“印堂黑线过山根、亥时三刻折双腿”骂完，他嘴上硬气，回房越想越发毛——半年前他妈张翠兰找钱大师在后院废井下桩借运时，专门让他把一块刻着自己名字的“借运红木牌”藏在祖祠供桌底下的暗砖里。他生怕沈知微偷偷去祠堂搞破坏，非要亲自摸黑过来检查一眼才安心。\n\n他刚蹲下身摸到那块冰凉的红木牌，头顶那根表面刷着光亮桐油、内里早被白蚁和积年阴煞啃成蜂窝煤的百年柏木大横梁，毫无征兆地从榫口处齐根崩断！\n\n足足四百多斤重的朽木横梁连着沉重的香炉供桌当头砸落，不偏不倚，结结实实砸在沈耀祖跪蹲着的两条腿膝盖骨上！\n\n骨头碎裂的咔嚓声混着沈耀祖杀猪般凄厉的惨叫，瞬间划破了沈宅的夜空：“啊——！我的腿！妈！救命啊！我的膝盖断了！”\n\n不到两分钟，整栋沈宅的灯全亮了。沈建业披着睡袍冲向后院，张翠兰看到儿子双腿扭曲成诡异的角度压在发黑的烂木梁底下、鲜血混着黑木渣往外涌，当场发出杀猪似的哭嚎。救护车尖锐的警笛声很快由远及近，保姆和保安手忙脚乱地抬担架、拿钱包，一家人哭天抢地跟着救护车奔向医院，乱成了一锅粥，压根没人顾得上北侧阁楼里住着的沈知微，而二楼紧闭房门戴着耳塞敷面膜睡大觉的沈楚楚更是翻了个身没醒。\n\n沈知微站在阁楼窗前看了一眼呼啸远去的救护车尾灯，把十二斤玄铁量天尺端端正正摆在行军床枕边，拉过自己在包里带的干净薄毯，踏踏实实睡了个好觉。\n\n一觉睡到第二天清晨六点，天色刚泛起蟹壳青。\n\n沈知微神清气爽地起了床，背好帆布包走出阁楼，在二楼走廊茶水间用自带的搪瓷缸接了杯滚烫的开水，慢悠悠倚在二楼雕花木栏杆边吹着热气。\n\n“啊——！！鬼啊！我的头发！！”\n\n走廊正对面的豪华主卧里，突然爆发出沈楚楚撕心裂肺、变了调的凄厉尖叫！紧接着房门砰地被撞开，沈楚楚连拖鞋都没穿，赤着脚疯了一样冲到走廊地毯上。她左边还垂着精心烫染的栗色大波浪卷发，右半边脑袋却被一把钝木梳贴着头皮剃得寸草不生，露着一大片青白色的光头皮，上面还横七竖八留着几道断梳齿刮出来的细红血印子——她惊恐万状地一抬头，正好对上栏杆边端着搪瓷缸喝热水的沈知微。"}, {"n": 3, "title": "五十万润金夺主卧", "body": "清晨的冷风顺着走廊窗户吹进来，沈楚楚右半边光秃秃的头皮凉飕飕的。她两只手往脑袋上一摸，摸到左边蓬松的卷发，右边却是刺手滑腻的青皮和干涸的血道子，整个人晃了两晃，差点一头栽倒在地毯上。\n\n“你……是你干的！沈知微，你对我头发做了什么！”沈楚楚嗓子都劈了叉，指着沈知微浑身哆嗦。\n\n沈知微吹开搪瓷缸水面上的浮沫，喝了一口热水，似笑非笑地上下打量她：“妹妹这话说的，昨晚可是你亲口心疼我，让刘妈把我锁在二楼北头阁楼里的。你自己的主卧反锁着门，衣帽间里怎么会跑出剃头的脏东西？难不成是你这几天手指头破了，滴了血喂过什么不干净的木梳子？”\n\n沈楚楚瞳孔猛地一缩，像被人一把掐住了嗓子眼，半个字都喊不出来了。\n\n那把藏魂黄杨木梳是她私底下偷拿零花钱找城南外围术士买的，里面还塞着她亲笔写的替灾八字纸条！要是现在嚷嚷出去报警或者告诉沈建业，岂不是等于自己招认买邪物害亲姐姐？\n\n看着沈知微那双清亮冷冽、仿佛什么都看穿了的眼睛，沈楚楚后背窜起一股刺骨寒气，死死拿双手捂住右半边光头，连滚带爬地退回主卧砰地关上门。过了十来分钟，她才顶着一顶仓促扣上去、边缘还有点歪斜的棕色长假发，脸色惨白地扶着墙溜下了楼。\n\n一楼大厅里此刻更是愁云惨淡。沈建业和二婶张翠兰熬得两眼通红，刚从市中心医院赶回来拿房产证和医保卡凑手术押金，张翠兰身上的紫红真丝旗袍皱得像咸菜，裤腿上全是干涸发黑的血迹。\n\n沈知微背着帆布包不紧不慢走下旋转楼梯，径直在客厅最宽敞的单人真皮沙发上坐下。\n\n沈建业一抬头看见她完好无损地坐在这儿，再想起昨晚在后院祖祠看到的那根断裂横梁，心里直犯怵，嘴上却还强撑着家主架子想发作：“你还敢下来！昨晚要不是你在饭桌上乌鸦嘴——”\n\n话没说完，张翠兰攥在手里的手机突然爆发出催命似的铃声。张翠兰手忙脚乱接通免提，那头立刻传来市医院骨科主任焦急变调的喊声：“张女士！你们家属快回医院签病危知情书！沈耀祖双腿粉碎性骨折的地方不对劲，刚才清创时伤口突然往外狂冒发黑发臭的脓水，麻醉师连推了两针最大剂量的麻药都跟注射了凉水一样，病人疼得把咬嘴都咬碎了！更邪门的是三号手术室的无影灯和心电监护仪连续跳闸黑屏三次，现在他心率掉到四十以下了，再止不住黑脓就只能高位截肢保命了！”\n\n啪嗒一声，手机从张翠兰手里滑落在地毯上。\n\n“截肢……耀祖才二十二岁啊！怎么会麻药不管用还冒黑脓啊！”张翠兰吓得魂飞魄散，浑身肥肉乱颤，猛地转头看向沙发上神色淡然的沈知微。\n\n昨晚饭桌上，沈知微说“亥时三刻祖祠横梁塌、沈耀祖双腿膝盖骨碎在阴木底下”，救护车行车记录仪记着报警时间是九点四十六分，一分一秒都不差！现在连医院顶级专家和进口仪器都失灵了，这不是撞了邪是什么！\n\n生死恐惧瞬间击碎了全部嘴硬和体面。张翠兰双膝一软，扑通一声跪爬到茶几前，涕泪横流地拍着自己的嘴：“知微！好侄女！昨晚是二婶嘴贱有眼无珠！你真有神仙本事，你快救救耀祖吧，他要是没了两条腿，二婶也不活了啊！”\n\n沈建业后背也渗出一层白毛汗。沈耀祖虽然是二房独苗，但二房手里攥着城南旧改项目好几个关键拆迁队的账，真要死在手术台上全得乱套。他连忙放低姿态走过来搓着手：“知微啊，到底是一家人，打断骨头连着筋。你既然在青云观学了破煞的本事，快跟你二婶去医院看看，爸回头给你买新衣服、办副卡！”\n\n缩在墙角的沈楚楚按着头顶发痒的假发套，吓得大气都不敢喘。\n\n沈知微端起茶几上保姆刚泡好的热龙井抿了一口，眼皮都没抬：“买衣服就不必了，咱们明算账。二婶心里应该比谁都清楚，沈耀祖腿上冒的不是普通脓水，是井水阴毒。”\n\n张翠兰浑身剧震，嘴唇哆嗦得像筛糠。\n\n“你连续七天半夜往后院那口废井里扔生肉投食，压着井底的脏东西替你们二房借横财运。昨晚祠堂老梁一塌，镇宅的气口破了，底下的债主顺着木头煞气找上了沈耀祖。”沈知微把茶杯轻轻搁回托盘，用最平淡的大白话把亏心账摊在明面上，“普通麻药只管活人神经，管不了阴煞索债。再拖一个半钟头，别说截肢，大罗金仙也留不住他的命。”\n\n“救命！知微你快开个方子救他！”张翠兰磕头如捣蒜。\n\n沈知微竖起三根手指，语速干脆利落：“想让我出手，先办三件事。第一，现在扫码付五十万破煞定金，注意，这五十万只是替他保命止脓、让他顺顺当当做完接骨手术的价钱，后院废井底下那笔烂账另算；第二，半小时之内，把三楼那间原本属于我妈的朝阳大套房腾干净，沈楚楚堆在里面的破烂全清出去；第三，把我妈留下的那口樟木箱原封不动抬进三楼套房。少一样，你们现在就可以去准备后事了。”\n\n沈建业脸色一僵，肉疼得直抽嘴角：“五十万？你这丫头怎么跟家里人狮子大开口，先救人，钱的事回头爸——”\n\n嗡嗡嗡！地上的手机再次疯狂震动，屏幕上跳动着“市医院急救室”六个红字，接起来就听见护士在喊病人开始往外吐黑水了！\n\n“我给！我马上转！”张翠兰哪还敢等沈建业磨叽，一把推开大伯哥，抖着手抓起手机点开收款码，当场输入五十万按下了指纹支付。\n\n叮——“支付宝到账，五十万元。”\n\n清脆悦耳的女声播报在死寂的客厅里响起。沈楚楚听着那五十万到账的声音，再想到自己三楼那间晒得到整片南向阳光的大套房也要被抢走，嫉恨得指甲死死掐进掌心，头皮却疼得丝毫不敢吭声。\n\n沈知微低头看了一眼余额，并没有急着把钱揣进自己腰包。她天生漏阴骨，入道那天师父就立下死规矩：破煞润金必须“十留三”，七成捐出去修庙济困攒功德，自己最多留三成，否则一旦贪墨亏心横财，半夜子时骨缝里就会结满白霜，五弊三缺反噬立至。\n\n她当着沈家人的面手指飞快点开转账页面，直接给阴山青云观大师兄的账户转过去三十五万元，备注栏敲上一行字：“修三清殿东侧漏雨屋顶瓦椽。”转完账，胸口漏阴骨常年萦绕的一丝阴寒顿时散去了几分，卡里稳稳当当留着十五万干净钱，够她在江城吃穿用度好一阵子了。\n\n做完这些，沈知微才从帆布包夹层摸出一张叠成三角形的黄表纸，用指甲挤出指尖昨日画符残留的一点朱砂印，飞快勾了一道镇痛封煞符丢在茶几上：“拿去贴在沈耀祖两边膝盖的纱布外头，五分钟内黑脓必止，医院可以正常打麻药接骨。记住，这符只保他三天平安，后院废井没平之前，别让他沾半滴生冷水。”\n\n张翠兰如获至宝地抓起黄符，连滚带爬冲出门打车直奔医院。沈建业看着沈知微那副油盐不进的冷淡模样，心里又忌惮又窝火，只能黑着脸冲刘妈和两个保安吼道：“还愣着干什么！还不快去把三楼大套房里的东西全搬出来，再把二楼储物间那口老樟木箱给大小姐抬上去！”\n\n不到二十分钟，沈楚楚摆在三楼向阳大套房里的几十只名牌礼服袋和香薰蜡烛全被保安一股脑扔到了二楼走廊上。沈知微拎着帆布包走进宽敞明亮的三楼大主卧，推开落地阳台窗，秋日金灿灿的晨光铺满整间屋子，驱散了一身阴寒。\n\n刘妈气喘吁吁地领着保安把一口蒙着厚灰、挂着老式黄铜横锁的旧樟木箱抬进屋，放下就溜了。\n\n沈知微锁好房门，从帆布包里摸出一根铁丝轻轻一拨，咔哒打开了生母裴氏留下的旧樟木箱。箱子里并没有沈建业以为的房产红本或秘籍手札，只叠着几件洗得干干净净的旧旗袍，箱底最深处嵌着一方长条形的楠木凹槽，槽底染着早已干涸发黑的血迹。\n\n她心头微动，取出包里那半截刻着“锁龙第三椿”的染血鲁班木尺往楠木凹槽里一放——严丝合缝，分毫不差，只是右边还空着另外半截尺身的位置。\n\n就在沈知微指尖摩挲着木尺断口沉思时，兜里的手机忽然叮咚一响，跳出一条外公裴鹤年发来的微信语音，老头儿洪亮护短的大嗓门还没播完，楼下院门外突然传来一阵震耳欲聋的工程越野车急刹声！与此同时，门外二楼走廊尽头那根铸铁排水管里，正咕嘟咕嘟往外翻涌着黑水，一缕缕泡烂的长头发丝顺着地漏缝隙悄悄钻了出来。"}, {"n": 4, "title": "外公提羊汤砸沈门", "body": "上午十一点刚过，三楼向阳大套房里晒满了暖融融的秋日阳光。\n\n沈知微刚把生母留下的那几件旧旗袍晾在阳台通风，将半截染血鲁班木尺重新用粗布裹好收进随身帆布包，点开外公裴鹤年发来的那条微信语音。听筒里立刻炸开老头儿中气十足的大嗓门：“囡囡别怕！外公刚下高速就听说沈建业那混账把你接回去了，我和你表哥这就到沈家门口，给你炖了一早上的砂锅羊汤，谁敢给你脸色看，外公今天把他们家房顶掀了！”\n\n语音刚落，楼下前院便传来砰的一声闷响，紧接着是越野车轮胎碾碎青砖花盆的刺耳急刹声和保安惊慌的叫喊。\n\n沈知微唇角微不可察地弯了一下，拎起十二斤重的旧帆布包走出房门。\n\n路过二楼北侧走廊拐角时，她脚步略顿了顿。清晨还只是微微冒泡的铸铁地漏口，这会儿积着一滩暗绿色的腥臭污水，几缕泡得发白腐烂的长头发丝缠在黄铜箅子上。就在这时，早上送完镇痛符去医院、见沈耀祖止住黑脓进了手术室便匆匆赶回来取换洗衣物和医药费的二婶张翠兰，正抱着一只皮包从二房卧室钻出来。\n\n一抬头瞧见沈知微正盯着地漏上的烂头发看，张翠兰吓得魂都飞了一半，脸色煞白地冲过来，一脚把浴室门口的吸水脚垫踢过去盖住地漏，嘴里结结巴巴地干笑：“老、老房子下水道堵了，我回头叫人通通……”说完抱紧皮包，逃命似的顺着楼梯往下跑。\n\n沈知微看破不说破，慢悠悠跟着走下一楼大厅。\n\n此时的沈宅前院已经乱成了一团。两扇平时紧闭装门面的雕花铁门被一辆沾满泥点的墨绿色工程越野车硬生生顶开，门边两尊充门面的汉白玉花缸歪倒在地。\n\n一个满头银发剪成利落寸头、身穿深蓝亚麻唐装的七旬老人大步流星跨进客厅门槛。老人身材魁梧硬朗，左手拄着一根沉甸甸的铁梨木拐杖，右手稳稳提着一只拿厚棉套捂着的竹编食盒，正是国内古建木作界泰斗、沈知微的外公裴鹤年。他身后半步跟着个身高腿长、穿黑色冲锋夹克的寸头青年，眉眼锋利挺拔，是江城刑警支队重案大队队长、沈知微的表哥裴铮。\n\n客厅里，沈建业正黑着脸坐在主位上，趁张翠兰回家的工夫盘算城南旧改项目的资金缺口；戴着棕色长假发的沈楚楚缩在侧边沙发上削苹果。一见裴鹤年踹门进来，沈建业脸色微变，连忙起身堆起一脸虚伪的笑迎上去：“爸，您老怎么从省城工地回来了也不提前打声招呼？阿铮也来了，快坐快坐，刘妈快看茶！”\n\n“少跟老子套近乎，谁是你爸！”裴鹤年眼皮都不往沈建业脸上撂一下，铁梨木拐杖往大理石地砖上一杵，震得地板咚的一声闷响，“我闺女走了二十年，你沈建业拿着裴家的陪嫁起家，把亲生骨肉扔在阴山道观十八年不闻不问，倒把二房远亲抱来的丫头当眼珠子疼！昨天把我家囡囡接回来，连口热饭都不给吃，这是你们沈家办的人事？”\n\n沈建业被骂得老脸一阵青一阵白，看了一眼从楼梯上走下来的沈知微，硬着头皮摆出父亲的架子圆场：“您老这就是听外头瞎传了，知微是我亲闺女，我还能亏待她？这不是刚把三楼最好的向阳大套房腾给她住了嘛！正好您今天过来做个见证——知微刚从山里下来，不懂城里的生意规矩，她妈当年留下的城南梧桐巷那座‘栖梧院’空了十八年，正好挨着咱们集团旧改的红线。我寻思让知微签个字，把栖梧院过户到集团名下抵押贷款，顺便给楚楚明年的联姻添一份体面嫁妆，以后她们姐妹俩荣辱与共……”\n\n沙发上的沈楚楚听到“栖梧院添嫁妆”几个字，连忙低下头掩住眼底的贪婪。城南旧改一旦动工，栖梧院那块独门独院的地皮少说值四五千万！\n\n话音未落，裴鹤年气得花白胡子直翘，抡起手里的铁梨木拐杖照着沈建业面前的红木玻璃茶几狠狠一杖砸了下去！\n\n哗啦一声巨响！整块加厚钢化玻璃连同上面的紫砂茶具当场碎成满地渣子，滚烫的茶水溅了沈建业一裤腿，吓得沈楚楚尖叫着缩到了沙发背后面。\n\n“放你娘的狗臭屁！”裴鹤年指着沈建业的鼻子破口大骂，嗓门震得客厅水晶吊灯都在嗡嗡发颤，“当年我闺女嫁给你这白眼狼，栖梧院是老子一斧一刨亲手给她起的婚前私宅！拿我闺女的遗宅去给你养的假货凑嫁妆？沈建业，你这根烂透心的歪梁，也配打栖梧院的主意！我老裴家的外孙女，轮得到你们沈家挑三拣四？”\n\n骂完，老爷子一转头看见站在楼梯口的沈知微，那张凶神恶煞的国字脸一秒钟垮了下来，眼眶唰地红了。他三步并作两步迎上去，上下打量沈知微清瘦的下巴和肩上洗得发白的帆布包，声音都带着颤：“囡囡……我是外公啊。在山上受苦了吧？怎么瘦得跟竹竿似的！”\n\n“山上吃得饱，就是道观屋顶漏风，没长肉。”沈知微看着眼前真心实意心疼自己的老人，原本冷淡疏离的眉眼柔和下来，脆生生喊了一句，“外公。”\n\n“哎！好孩子，快过来！”裴鹤年高兴得直抹眼角，拉着沈知微在干净的餐厅主位坐下，打开竹编食盒，端出一口还在咕嘟冒泡的黑砂锅。盖子一揭，浓郁鲜香的奶白羊汤热气扑面而来，上面撒着碧绿的青蒜苗和现磨白胡椒，旁边还配着四个烤得焦黄掉渣的热芝麻烧饼。\n\n“外公凌晨四点去东门老屠户那儿挑的滩羊肋排，小火慢炖了五个钟头，一点膻味都没有，快趁热喝！”裴鹤年盛了满满一大碗连肉带汤推到她面前。\n\n沈知微低头喝了一大口滚烫鲜美的羊汤，咬了一口脆香的烧饼。热流顺着食道一路暖进胃里，连体内常年泛着寒意的漏阴骨都跟着舒展开来。师父羽化之后，这还是头一回有人惦记着她喝汤烫不烫、烧饼脆不脆。\n\n趁着沈知微喝汤，裴鹤年从唐装内袋里掏出一个油布包得严严实实的深红房产本，啪地拍在沈知微手边：“囡囡，这是栖梧院的不动产红本！二十年前那个大暴雨夜，你妈在栖梧院临盆，沈建业和接生婆非说你妈难产血崩掉进后河冲走了，连块尸骨都没见着。外公连夜赶回来查验栖梧院，发现正堂大梁上留着一道入木三寸的古怪墨斗断痕，根本不是普通木匠家伙能弹出来的！外公知道沈建业心术不正，当年就把房本扣在手里替你守了十八年，上个月刚按继承公证直接换成了你沈知微一个人的名字！”\n\n沈知微咽下嘴里的羊肉，指尖摸过崭新的红本房契，心里顿时把樟木箱底那半截刻着“锁龙第三椿”的染血木尺和栖梧院正堂梁上的墨斗断痕对上了号。看来生母当年的失踪，根子就在栖梧院里。\n\n沈建业眼看房本已经改了名，脸色铁青地强辩：“房本改了又怎么样？栖梧院荒了十几年，院门大锁的钥匙还在集团物业手里，里面堆满了城南旧改的脚手架建材，一时半会儿可腾不出来！”\n\n“用不着你们腾。”沈知微把红本房契揣进帆布包，拿纸巾擦了擦嘴，平静地瞥了沈建业一眼，“钥匙先替我擦干净收好，不出五天，沈总自然会双手捧着送过来。”\n\n这时，一直抱臂站在桌边的表哥裴铮拉开椅子坐下，顺手把一本黑色刑警工作证啪地拍在餐桌转盘上，似笑非笑地看向脸色发白的张翠兰和沈建业：“沈总要是嫌物业锁生锈打不开，我们刑警支队的破拆锤挺顺手，随时免费帮忙。正好今天过来也跟你们沈氏集团提个醒——半年前你们负责清退的城南旧改片区，有个叫周老汉的独居拆迁户离奇失踪，家属昨天刚到支队补报了刑事协查。听说当时负责谈那片拆迁款的，就是二婶娘家侄子带的施工队吧？”\n\n正拎着皮包想往门外溜的张翠兰像被踩了尾巴的猫，手里的包啪嗒掉在地上，眼神慌乱地往后院废井的方向瞟了一眼，嘴硬道：“一个孤老头子指不定跑哪儿打工去了，关、关我们什么事！我医院还有事，我先走了！”\n\n裴铮冷哼一声，没拦她，转头解锁随身带的警务协查平板递到沈知微手边：“知微，你刚来江城，以后去城南梧桐巷那边走动多留个心眼，这是失踪那个周老汉的近照，瞧见可疑人直接给哥打电话。”\n\n沈知微端着第二碗热羊汤垂眸扫了一眼平板屏幕。只见证件照上那个六十来岁、满脸皱纹的周老汉眉心印堂处，死死盘踞着一团黑绿交杂、缠满湿水草与腐烂长发的井水死气——跟张翠兰旗袍袖口和二楼地漏返上来的腥臭味如出一辙。\n\n人早就死了，而且魂魄就压在沈家后院那口废井底下。\n\n沈知微不动声色地点了点头：“记下了，哥。”\n\n此时此刻，沈家老宅大门外百米处的梧桐树街口，一辆挂着京江通行黑牌的黑色劳斯莱斯正安静地停在路边。后座车窗半降，身穿黑色高定西装的陆宴辞手里攥着一卷跨江古桥修缮蓝图，忽然眉心紧蹙，拿一方雪白手帕抵住薄唇低低咳了两声，摊开帕子时，上面赫然印着一缕刺目发黑的冷血。"}, {"n": 5, "title": "朱砂木筹断噬心劫", "body": "午后一点半，秋日的阳光晒得梧桐树叶暖洋洋的。\n\n沈知微喝足了两碗滚烫的羊汤，又吃了整整一个半芝麻烧饼，胃里暖烘烘的，实在懒得再看沈建业那张拉得像苦瓜似的老脸，便拎着帆布包跟外公裴鹤年、表哥裴铮一块儿走出沈宅大门，顺着外头幽静的林荫街口散步消食。\n\n刚走出几十米，裴铮兜里的警务专线响了起来，是法医科那边汇报城南旧改工地土壤检测的结果。裴铮跟老爷子打了个招呼，走到前头路边的工程越野车旁接电话去了。\n\n街口拐角的香樟树阴下，那辆挂着黑牌的劳斯莱斯车门轻轻推开。\n\n一个身材修长挺拔的年轻男人拎着一只深胡桃木图纸筒迈步下车。男人看着二十八九岁年纪，五官轮廓深邃冷峻，鼻梁高挺，一身剪裁极尽考究的深黑色三件套高定西装衬得整个人矜贵而克制。他原本是算准裴鹤年回江城的日子，专程带着百年跨江古桥的加固蓝图过来请老爷子掌眼的，刚到街口听说裴老正在沈家给外孙女撑腰，便极有分寸地停在街口等候，没进去打扰。\n\n“裴老。”男人迈着沉稳的步子走上前，微一颔首，声线低沉清冽。\n\n“哎哟，宴辞啊！你怎么在外头干等着？”裴鹤年一见他顿时笑开了花，热情地拍了拍他的肩膀，转头给沈知微介绍，“囡囡，这是陆氏营造的当家人陆宴辞，咱们京江两地古建修缮这个数的人物，平时请都请不着！宴辞，这是我刚找回来的亲外孙女，沈知微。”\n\n陆宴辞目光落向旁边的年轻女孩。小姑娘穿着简单的白衬衫牛仔裤，肩上背着一只略显突兀的军绿色旧帆布包，一双乌黑透亮的眸子正一眨不眨地上下打量着他，眼神不像豪门名媛见到他时的羞怯讨好，倒像老木匠在审视一根哪里生了虫眼的梁柱。\n\n就在沈知微往前走了两步、距离陆宴辞不足三步远的那一瞬间，三处违背活人常理的贴身反常迹象，毫无遮掩地撞进了她的感官里。\n\n第一处是气味。今天明明是晴朗干燥的秋日午后，空气里飘着桂花与干树叶的清香，可陆宴辞那件一尘不染的高定西装领口里，却丝丝缕缕往外渗着一股极淡的冷檀腐气——那绝不是什么木质香水，而是常年沉在江河死水淤泥底下、泡足了百年阴湿尸气的阴沉木才会散出来的腐朽寒味。\n\n第二处是体温与皮相。午后二十六度的太阳正晒在他身侧，陆宴辞垂在图纸筒外壁上的右手修长分明，可唯独右手食指的指尖泛着一层死人般的青紫寒霜，连指甲盖底下的血色都褪得干干净净，僵白得像刚从冰柜里捞出来一样。\n\n第三处是时间。陆宴辞抬起左手从西装左胸内袋摸名片夹递给裴鹤年时，内袋边缘露出一截银质表链，里面揣着一块老式瑞士定制机械怀表。沈知微耳力极尖，听见那块贴着他心口放置的怀表滴答走针声发闷发滞；她顺势扫了一眼旁边劳斯莱斯中控屏跳动的标准电子钟秒数，再听怀表擒纵轮卡顿的节拍——那块贴着陆宴辞心脏走的机械表，比正常阳间时间整整慢了七秒。\n\n金属游丝本不该在恒温人体旁滞后，除非他心口盘踞的阴寒煞气已经重到能冻住方寸之间的机芯运转。\n\n沈知微眼底金芒极快地一掠而过，借观微骨相术往陆宴辞眉心与胸口看去。\n\n这一看，连她都微微挑了下眉。眼前这男人天生一副罕见的极阳命格，阳气极盛、周身流转着本该百邪不侵的护脉紫气，单是站在他三步之内，溢出来的一丝温意都让她微凉的指尖舒服了不少；可偏偏此刻，七股凶戾刺骨的借运黑煞像铁链一样死死锁住了他的奇经八脉，正是玄门里最歹毒的“七杀锁脉煞”。而在他左锁骨正下方贴近心室的皮肉深处，赫然钉着一根三寸来长的乌黑阴沉木钉虚影——那木钉上缠绕的阴湿怨气，竟与沈家后院那口废井底下的气息同出一源！\n\n“沈小姐，幸会。”陆宴辞丝毫不知自己已被看了个底朝天，压下心口隐约泛起的闷痛，礼貌地递过一张烫金素纹名片，“以后在江城若有古建修缮上的需要，随时联系陆氏。”\n\n沈知微伸手接过名片，却没顺着客套话往下接，而是直接指了指他的左胸口，语气平淡笃定：“陆总最近三年，是不是每逢阴雨天半夜十二点往后，左锁骨底下就像被人拿冰锥子往心窝里扎，彻夜睡不着觉，去各大医院照遍核磁和心电图，医生都说你心脏半点毛病没有？”\n\n陆宴辞收回手的动作猛地一顿，深邃的眸光瞬间冷锐了几分。\n\n他常年深夜失眠伴随心口剧痛的事，为了稳住陆氏营造的董事会，除了贴身特助和签过保密协议的私人医疗组，连外人半点风声都没透出去过，裴老爷子也只以为他工作太拼气色偏冷。\n\n“你怎么知道？”陆宴辞沉声问。\n\n“写在你身上了，不用猜。”沈知微竖起三根手指，用清晰利落的大白话一条条点破，“大晴天里，你西装领口往外返着百年水底阴沉木的冷腐气；二十六度的日头晒着，你右手食指指尖却结着青紫寒霜，那是手厥阴心包经被阴寒冻住的末梢反应；再加上你左胸口袋里那块怀表，贴着心口走针，比正常时间慢了整整七秒。有人拿百年阴沉木炼成的夺运阴钉，生生打进了你的心脉气门里。”\n\n旁边的裴鹤年一听脸色大变：“夺运阴钉？哪个天杀的敢用鲁班厌胜里的绝户邪术害人！宴辞，你最近是不是动哪座老宅或者古桥的桩基得罪人了？”\n\n陆宴辞眉峰微敛，抬手摸出左胸口袋里的银壳机械怀表看了一眼，再对照腕表——果然慢了整整七秒。不过作为一个常年跟桥梁荷载、结构力学打交道的掌权人，他只当是怀表受磁需要保养，至于体内被人打进木头钉子的说法，在他听来实在过于荒诞。\n\n“多谢沈小姐提醒，怀表大概受潮走慢了，回头我让家庭医生再做个全面体检。”陆宴辞合上表盖，语调依旧客气疏离，显然没把玄学之说放在心上。\n\n沈知微也不跟死脑筋的唯物主义者费口舌争辩。她看相向来只摆事实、等应验。\n\n“体检机器查不出死人木头。”沈知微下死断向来不留模糊余地，“你心口这根浮钉已经松动起煞了。三日之内，只要江城落雨，子夜十二点一过必发寒煞噬心之劫。到时候别说吃药，除颤仪推上去都救不回你这口气。”\n\n说着，她拉开旧帆布包侧袋，摸出一枚两寸长、宽约半指的枣木薄筹。木筹表面用青云观秘制辰砂混着雄鸡冠血浸染了七七四十九天，刻着细密的鲁班破煞寸纹，摸上去自带一股温润干燥的阳和暖意。\n\n沈知微随手把这枚朱砂鲁班木筹递到陆宴辞面前：“看在我外公的面子上，这枚朱砂木筹白送你防身，贴身揣在左胸口袋里别摘下来，关键时刻能替你挡一次噬心死劫。等木筹碎了、你知道疼了，再来沈家找我拔钉——咱们丑话说在前头，救命拔钉，一千万，少一个子儿我都不接。”\n\n一开口就是一千万，连眼皮都不眨一下。\n\n陆宴辞看着眼前女孩那副认真算账攒钱的直球模样，原本紧绷冷硬的唇角竟极浅地勾了一下。他只当这是小姑娘刚回豪门缺零花钱、顺着老爷子的古建行话编出来的一套新鲜说辞，但裴鹤年在旁边一个劲儿瞪眼催促：“宴辞你赶紧收着！我家囡囡是青云观正经传人，昨晚算沈家祠堂塌梁一分一秒都不差，宁可信其有！”\n\n“好，承裴老和沈小姐的情。”陆宴辞不再拂老人的面子，双手接过那枚带着淡淡朱砂松香的温热木筹，顺手放进左胸西装内袋，与那块慢了七秒的怀表贴在一处，“古桥图纸的事不急，等裴老陪外孙女安顿好了，我再登门讨教。”\n\n目送黑色劳斯莱斯平稳驶出街口，裴鹤年和接完电话回来的裴铮本想直接带沈知微回裴家住，沈知微却摆了摆手：“沈家后院井底还有一桩人命因果账没清完，等我这两天把烂摊子砸干净了，再搬出去清静。”\n\n外公和表哥拗不过她，千叮咛万嘱咐有事随时打电话，这才驱车离开。\n\n谁也没料到，午后还晴空万里的江城，刚到傍晚六点便骤然变了天。\n\n铅灰色的厚重积雨云从江面滚滚压过摩天大楼，闷雷在云层深处轰隆炸响，狂风卷着湿冷的水汽扑打着整座城市。\n\n江畔陆氏顶层私人公寓的书房里，刚开完跨国视频会议的陆宴辞站起身，走到落地窗前抬手解开了白色衬衫最上面的两颗纽扣。轰隆一道惨白闪电劈亮窗外天际，深色玻璃书柜清晰映出他敞开的领口——就在他左锁骨正下方的冷白皮肤上，不知何时竟浮现出了一道寸许长、犹如枯树根须般缓缓蠕动的青黑色木纹。"}, {"n": 6, "title": "雨夜木筹碎救绝脉", "body": "深夜十一点四十五分，酝酿了一整晚的雷暴彻底砸向江城。\n\n豆大的雨点像铁砂一样狂暴地抽打着玻璃窗，街道两侧的下水雨水井咕嘟嘟往外倒灌着浑水。沈家老宅三楼向阳大套房里，沈知微盘腿坐在厚羊毛地毯上，拿一块干净鹿皮巾慢条斯理地擦拭着十二斤重的玄铁量天尺。\n\n窗外一道惊雷炸响，她指尖微顿，感应到今天午后送出去的那枚朱砂鲁班木筹在十里外的江畔骤然绷紧了气机。\n\n“连三天都没撑到，赶上今晚这场秋暴水涨，那根浮钉倒是性急。”沈知微收起鹿皮巾，端起桌上的热红糖姜水抿了一口，神色笃定从容。今晚过后，修青云观大殿的那一千万功德大单，就该主动送上门了。\n\n同一时刻，十里外的江景顶层公寓三十六楼书房内，光景却已如同森罗鬼域。\n\n陆宴辞原本正坐在宽大的钢化玻璃书桌后，低头翻阅城南旧改片区早年的地下暗渠档案与跨江古桥水文图。他左锁骨底下的皮肤从傍晚起就像贴了一块冰坨子，那道寸许长的青黑木纹在几个钟头里又往心口蔓延了半寸，但常年忍受病痛养成的强悍自制力，让他依旧维持着冷静审阅完最后一份卷宗。\n\n滴答一声轻响。\n\n墙上原本显示室内恒温二十六度的中央空调液晶面板突然闪烁了两下，数字猛地熄灭。头顶出风口不再送出暖风，反而呼呼往外倒灌着一股夹杂着河底烂泥与腐朽棺木味的刺骨寒气！\n\n陆宴辞握着钢笔的右手猛地一僵，垂眸看向桌面。\n\n只见透明加厚的钢化玻璃书桌板正下方，连同他双脚踩着的深胡桃木地板上，竟在短短几个呼吸间咔嚓咔嚓凝结出一层厚厚的惨白冰霜！那白霜并不是胡乱蔓延的，而是清晰无比地勾勒出了一个蜷缩仰躺的成年人形轮廓——有头有肩有四肢，仿佛此时此刻正有一具浑身湿透、刚从百年江底捞出来的无形死尸，直挺挺贴在书桌玻璃板底下，伸出两只冰冷僵硬的手掌死死抱住了陆宴辞的脚踝！\n\n摆在桌角的银壳机械怀表咔哒卡死，秒针彻底停在了零点整。\n\n子时到了！\n\n“呃——！”\n\n陆宴辞喉咙里溢出一声极力压抑的闷哼，整个人剧烈弓起脊背，手里的钢笔啪地折断，一口夹着细碎冰碴的暗黑淤血直接喷在了古桥图纸上！\n\n左锁骨下方那根潜伏了整整三年的“七杀锁脉阴钉”，在窗外倾盆暴雨与江潮阴煞的引动下彻底暴走！皮肤表面的青黑木纹瞬间炸开成数十条狰狞的黑紫细线，像一把生满倒刺的千年冰锥，顺着心包经直直刺向他的左心室！五脏六腑仿佛被瞬间灌满了零下几十度的液氮，血液流动几乎凝固，眼前阵阵发黑。\n\n“陆总！！”\n\n守在外间值班的特助听见重物砸落的声响，脸色大变地撞开书房大门，一股比腊月寒冬还要冻骨头的阴风迎面扑来，冻得特助牙齿直打颤：“快！叫陈医生团队进来！陆总发病了！”\n\n三名全天候待命的私人医学专家提着急救箱和进口便携除颤监护仪冲进书房，合力将几乎失去知觉的陆宴辞扶到真皮沙发上。主治陈医生一把扯开陆宴辞染血的白衬衫，看清他左胸口那片蛛网般疯狂往心脏扎去的青黑木纹时，吓得手里的听诊器差点掉在地上：“这、这是什么皮下坏死栓塞？怎么胸口皮肤冷得像干冰一样！”\n\n“快上心电监护！推强心针！准备除颤！”\n\n护士手忙脚乱地将电极贴片摁在陆宴辞胸前，然而贴片刚一接触那片青黑木纹，金属扣表面竟肉眼可见地结起了一层白霜！旁边的进口心电监护仪屏幕发出一阵刺耳的电流滋啦声，心率数字从三十八疯狂乱跳到两百九，紧接着啪的一声爆出一团电火花，连同刚充好电的除颤仪一块儿彻底黑屏死机！\n\n一针肾上腺素推完，毫无半点反应。陆宴辞唇色已经彻底变成死灰青紫，胸膛起伏微弱得几乎摸不到脉搏，刺骨的黑暗正一寸寸吞没他的意识。\n\n就在那股阴寒死气即将刺穿心室的千钧一发之际，陆宴辞垂落的右手无意识地抓紧了搭在沙发扶手上的黑色西装外套——指尖隔着薄薄的真丝内衬，正好摁在了左胸内袋里那枚两寸长的朱砂鲁班木筹上。\n\n嗡——！\n\n仿佛滚油泼进了冰窖，那枚原本只有微温的枣木薄筹感应到宿主心脉濒死的滔天阴煞，骤然爆发出烙铁般的滚烫高温，在西装内袋里无火自燃，发出一声清脆如木匠弹墨线般的崩裂脆响！\n\n啪！木筹应声炸裂！\n\n一道肉眼难辨却霸道炽烈到极点的纯阳破煞金芒，顺着陆宴辞摁住衣袋的指尖轰然冲入他几乎冻僵的手厥阴心包经！那股力量堂皇刚猛，恍若一柄烧红的十二斤重锤当胸砸落，硬生生拦腰斩断了扎向心室的数十条黑紫细线，将那团凶戾暴走的阴沉木寒煞狠狠轰退回左锁骨下方，死死封压在方寸之间！\n\n陆宴辞浑身猛地一震，胸腔里那股冻裂肺腑的剧痛潮水般退去，猛地张口吸入了一大口顺畅温热的空气！\n\n几乎在同一秒，书桌钢化玻璃板底下那具瘆人的人形白霜迅速消融蒸发，连半滴水渍都没留下；沙发旁原本黑屏死机的备用监护仪滴的一声重新亮起，屏幕上跳动出平稳有力的正常窦性心律波纹，连头顶中央空调都重新吹出了二十六度的暖风。\n\n“神了……心律自己恢复正常了？刚才难道是大楼雷击电压不稳？”满头冷汗的陈医生握着听诊器反复听了三遍，看着陆宴辞胸口迅速淡化缩回锁骨下的青黑痕迹，满脸不可思议。\n\n陆宴辞撑着沙发扶手缓缓坐起身。三年来每逢雨夜犹如附骨之疽的噬心寒痛，在这一刻竟消失得干干净净，连呼吸都透着久违的轻快。\n\n“你们先出去。”陆宴辞嗓音微哑，却已恢复了平日的沉稳威严。\n\n等医生团队千恩万谢地退下关好门，陆宴辞一言不发地拿起那件西装外套，将手伸进被灼穿了一个焦黑小洞的左胸内袋里，慢慢摊开掌心。\n\n雪白修长的掌心里，那枚午后还完好无损的朱砂鲁班木筹，此刻已经彻底化作了一小撮焦黑细碎的木炭灰，上面还残留着一缕极淡的辰砂与雷击枣木焦香。而旁边那块原本停摆的银壳机械怀表，正重新滴答滴答清脆精准地走动着。\n\n“三日之内，只要江城落雨，子夜十二点一过必发寒煞噬心之劫……这枚朱砂木筹能替你挡一次死劫。”\n\n白日梧桐街口，那个背着旧帆布包的小姑娘平淡笃定的话音，一字不差地在他耳边回响起来。他活了二十八年所笃信的唯物铁律，在掌心这撮滚烫余温尚未散尽的木炭灰面前，碎得彻彻底底。\n\n凌晨两点，窗外暴雨如注。\n\n陆宴辞脱下染血的衬衫，换上一套干净挺括的深灰西装，扣好袖扣，眼底再无半分犹疑，推门对守在廊下的特助沉声下令：“备车。立刻通知财务调拨五千万流动资金到我随身账户上，现在去沈家老宅。”\n\n黑色劳斯莱斯亮起雪亮的车灯，劈开茫茫雨幕疾驰向城南方向。\n\n而此时的沈家老宅后院里，狂风暴雨正吹得芭蕉叶啪啪乱响。披着黄色塑料雨衣的二婶张翠兰被二楼卫生间涌出来的满地黑头发吓破了胆，正打着一把微弱的手电筒，浑身发抖地趴在后院废井湿滑的青砖井沿上，拿一根长铁钩拼命往暴涨发黑的井水里捞一只裹着红布的封魂黑陶罐。"}, {"n": 7, "title": "千万契约十指扣脉", "body": "大雨在凌晨五点半渐渐歇了声息，等到清晨七点半，雨过天晴的秋日晨光把沈家老宅前院的汉白玉石阶照得水亮。\n\n那辆挂着京江黑牌的黑色劳斯莱斯已经在雕花铁门外静静停了三个多钟头。陆宴辞顾忌着凌晨登门唐突，硬是坐在后座看完了两份工程季报，直到沈宅大门打开、保姆出来扫积水，才让特助上前递了拜帖。\n\n一听说陆氏营造那位平时连市政酒会都难得露面的陆宴辞亲自到了大门口，正在餐厅喝粥的沈建业差点把金丝眼镜摔进碗里。他顾不上擦嘴，赶紧拽起旁边顶着一头蓬松棕色假发套的沈楚楚，满脸堆笑地迎出大门：“哎哟，陆总大驾光临，真是有失远迎！是不是为了城南旧改二期工程的事？快请进客厅喝杯早茶！楚楚，还不快给陆总问好！”\n\n沈楚楚昨晚被二楼卫生间往外冒头发的动静吓得一宿没睡好，这会儿见了这位京江豪门圈最顶层的年轻掌权人，连忙扶了扶头顶发闷的假发刘海，掐出最柔弱温婉的嗓音上前一步：“陆先生早上好，早就听爸爸提起您……”\n\n陆宴辞站在车门旁，一身深灰色挺括西装纤尘不染，只是眼底带着熬夜后的淡淡青影。他甚至没往沈建业伸过来的手上扫一眼，更把矫揉造作的沈楚楚当成了路边空气，目光径直越过这对父女，落在了正背着旧帆布包走出门廊的沈知微身上。\n\n“沈小姐。”陆宴辞微一颔首，冷峻沉稳的声线里透着前所未有的郑重，“方便借一步，上车详谈吗？”\n\n沈建业伸在半空的手僵得发紫，沈楚楚脸上的甜笑更是当场挂不住了。父女俩眼睁睁看着特助恭恭敬敬拉开劳斯莱斯后座车门，沈知微连招呼都懒得跟他们打一声，拎着帆布包弯腰坐了进去。\n\n砰的一声，厚重的防弹车门合拢，升起的隐私隔音挡板把外头沈建业错愕难堪的老脸隔绝得干干净净。\n\n宽敞静谧的后排车厢里只剩下两个人。陆宴辞刚想开口道谢，左锁骨下方那团昨晚被朱砂木筹逼回去的阴寒煞气，似乎感应到了沈知微包里玄铁量天尺的气机，冷不丁又往下蹿了一寸。他脸色微白，下意识抬手按住左胸衣襟。\n\n“木筹只管挡昨晚那一刀，钉子还在肉里，一动气就会反扑。”\n\n沈知微看得分明，半句废话没有，直接探身伸出右手，一把抓过陆宴辞按在胸前的右手，五指分开，严丝合缝地与他冰凉修长的五指十指相扣，大拇指精准无比地按在了他寸口内关脉门上。\n\n陆宴辞浑身肌肉骤然绷紧。\n\n他有极重度的防备心与洁癖，成年之后莫说与异性十指紧扣，就连私人医生诊脉都得隔着一层医用纱布。他本能地想要抽回手，可就在指腹相贴的下一秒，一股温润清正的气流顺着女孩纤细微凉的指尖渡入他的心包经——那是沈知微前日捐出三十五万修道观后凝聚在体内的功德金光。\n\n金光一入经脉，他左锁骨底下那根原本像活蛆一样往心室拱的乌黑浮钉，像是撞上了烧红的烙铁，滋地缩回原位，整条冻得发麻的右臂瞬间涌起前所未有的温热与安定。\n\n而另一头，沈知微也舒服得眯了眯眼睛。陆宴辞天生极阳命格，哪怕被七杀锁脉煞困着，十指相扣间自然溢出来的一缕精纯极阳紫气，顺着她虎口淌进四肢百骸，把她天生骨缝漏阳的漏阴骨在秋晨里泛起的刺骨寒意熨帖得暖洋洋的，比喝三大碗老姜汤还管用。\n\n两人在狭窄的车厢里静静扣着手腕坐了足足三分钟，谁也没说话，车厢里只有彼此清晰平稳的呼吸声。陆宴辞垂眸看着女孩近在咫尺的清冷眉眼，耳根罕见地泛起一丝极淡的薄红，紧绷了三年的心弦彻底松了下来。\n\n直到脉象彻底平稳，沈知微才干脆利落地松开手，往后靠回真皮座椅：“暂时替你封住了，三天之内只要不去阴水重的地方，它翻不了浪。现在咱们可以把账算清楚了。”\n\n陆宴辞摩挲了一下尚存温意的指腹，嗓音低沉：“昨晚子时整，书房结出人形白霜，监护仪全废，是沈小姐给的朱砂木筹自燃救了我一命。陆某向来信奉等价契约，我身上到底是什么东西，沈小姐尽管直言。”\n\n“痛快。”沈知微喜欢跟聪明人打交道，“你天生极阳紫气护体，本该百邪不侵，但有人眼馋你们陆家镇守水脉的气运，用鲁班厌胜术里最歹毒的‘七杀锁脉桩’，往你心脉到四肢骨缝里陆陆续续打进了七根子母夺运阴钉。”\n\n陆宴辞眸光骤沉：“七根？”\n\n“对，一母六子，全是拿泡过枉死人尸水的百年阴沉木炼出来的。”沈知微指了指他左锁骨下方，“现在闹得最凶的这第一根护心浮钉，木头纹理和怨气来源，跟沈家后院那口废井底下埋着的借运木桩是同一批料子。想彻底拔干净这第一根钉子，不能硬撬，我得先把沈家后院那根同源的母桩劈了，松掉它的根，再拿我的血配量天尺替你往外逼。”\n\n她竖起一根手指，眼神清亮坦荡：“昨日在街口我就报过价了。第一根护心浮钉，顾问费一千万，包破桩、包拔钉、包清尾煞。至于后面那六根，藏得更深，牵扯外头的水脉大阵，到时候按难度一钉一结，绝不乱收你一分钱。”\n\n一千万买一条命，在昨晚鬼门关走过一遭的陆宴辞眼里，简直便宜得像白送。\n\n陆宴辞没有半秒钟犹豫，直接敲了两下隐私隔板，对前排特助下令：“把早上拟好的特别堪舆顾问契约拿进来，现在给沈小姐的账户打五百万定金，拔钉当日结清剩余五百万。”\n\n特助效率极高，立刻递进平板合同与签字笔。沈知微低头扫了一遍条款，确认没有霸王限制后利落签下名字。不到一分钟，她兜里的手机再次传出清脆提示音——银行卡到账五百万元整。\n\n陆宴辞正要把合同副本递给她，却见眼前的小姑娘头也不抬地捧着手机，手指飞快地在屏幕上戳点转账，眨眼间就把刚捂热的五百万划出去了整整三百五十万，收款人依然是“阴山青云观管委会”，备注写着：“大殿主梁更换及瓦作首期款。”\n\n看着她盯着剩下的一百五十万余额满意地弯起嘴角，陆宴辞不由微怔：“沈小姐费尽心力替人破煞，倒把大半酬金都捐出去了？”\n\n“道门规矩，破煞横财十留三，留多了半夜骨头缝结霜，划不来。”沈知微把手机揣回兜里，抬眼看向他，“钱收了，有件顺手的事得麻烦陆总。沈家正跟着做城南旧改，我需要城南片区连带沈家这栋老宅早年的地下排水管网原图。”\n\n“都在车上。”陆宴辞似乎早料到她要查沈家底细，反手从座位暗格里抽出一份密封牛皮纸档案袋递过去，“昨晚发病前我正好在查城南旧改的水文底档。另外，我已经让特助通知陆氏营造驻江城的应急工程队，二十四小时待命，沈小姐无论何时需要封锁现场、调挖掘机或者拆墙，打我私人电话，半小时内必到。”\n\n这甲方不仅给钱爽快，连递铲子封场的售后都包圆了。沈知微接过沉甸甸的档案袋，真心实意地夸了一句：“陆总讲究人，合作愉快。”\n\n送走黑色劳斯莱斯后，沈知微无视大门内沈建业探头探脑的追问，径直回三楼朝阳大套房锁好门，摊开了那份民国至九十年代多次改建的沈宅地下管网蓝图。\n\n这一看，所有散乱的线头全扣上了。\n\n蓝图上清清楚楚标着，沈家老宅原本建在城南一条地下暗渠支流上方，整栋主楼的上下水铸铁总管，在后院拐了个弯，紧贴着那口废弃百年老井的井壁外侧穿行而过！难怪二楼走廊和卫生间的地漏一到半夜就往上返泡烂的黑头发丝——废井底下的阴煞早就渗穿了铸铁管壁，把整栋宅子的水脉变成了一条活生生的招魂血管。\n\n时间很快滑到傍晚六点半，暮色四合。\n\n沈知微收起图纸走到三楼南向露台边，居高临下往后院荒僻的西北角望去。芭蕉树掩映下，那口被石板压住的废井刚刚经历过昨夜暴雨冲刷，周围一圈潮湿的青砖缝隙里，成片的暗绿青苔竟在昏暗暮色下泛着一层油汪汪、像死人尸油熬出来似的诡异绿光。"}, {"n": 8, "title": "排水管返发锁废井", "body": "晚上七点整，沈家老宅二楼的公用盥洗室里突然传出一声保姆刘妈的惊叫。\n\n沈知微拎着旧帆布包走出楼梯口时，正看见刘妈脸色煞白地举着一把皮搋子往后退。盥洗室白色瓷砖地面上漫着一层泛黑的腥臭污水，墙角那个黄铜地漏盖子被顶歪在一边，一团足有拳头大小、泡得发胀粘连的乌黑长头发正堵在管口，随着下水道深处咕嘟咕嘟的气泡声一耸一耸，活像水管底下正有一颗看不见的脑袋贴着铁箅子往外吐头发。\n\n闻讯赶上楼的二婶张翠兰一见那团黑发，吓得浑身肥肉一哆嗦，嗓门尖利地冲刘妈撒泼：“叫魂呢叫！秋天落叶堵了下水道有什么大惊小怪的，赶紧倒两瓶强酸通渠水烧烂它，下去开饭！”\n\n沈耀祖昨天贴了沈知微给的镇痛符，总算止住黑脓做完了双腿钢板内固定手术，眼下正雇了两个护工在市医院病房守着。张翠兰之所以火急火燎赶回老宅，就是因为昨晚暴雨里她去废井边用铁钩捞封魂黑陶罐时，非但没捞上来，铁钩反倒被井底一股大力硬生生拽弯了，吓得她白天去庙里求了一把香灰，死活不敢在医院独处。\n\n沈知微扫了一眼张翠兰眼底乌青的惊弓之鸟模样，没戳破她昨晚雨夜钩井的狼狈事，转身下了楼。\n\n可等众人坐到一楼灯火通明的餐厅里，更瘆人的一幕出现了。\n\n刘妈端着最后一盘清炒芦笋从厨房走出来，眼神不知怎么变得直勾勾的，脚步发飘地走到餐桌最末端的空位旁，顺手从碗柜最底层摸出一只豁了三角口子的粗瓷海碗、一双发黑变形的旧竹筷，啪嗒一声摆在了空椅子跟前，还拿起汤勺，恭恭敬敬往那只缺口粗瓷碗里盛了满满一碗白米饭。\n\n诡异的是，满屋子沈家人——无论是坐在主位翻财经报纸的沈建业、顶着假发低头喝燕窝的沈楚楚，还是紧挨着那个空位坐的张翠兰，明明眼皮子底下就摆着一只跟满桌描金骨瓷格格不入的破粗瓷碗，几个人却像集体瞎了眼似的，说笑夹菜，没一个人觉得哪里不对劲。\n\n连刘妈自己摆完碗筷退回墙边后，都茫然地揉了揉太阳穴，根本不记得刚才干了什么。\n\n沈知微坐在左侧中段，目光落向那只缺口粗瓷碗上方缭绕的灰白水汽，心里那本亏心账已经彻底翻到了底页。\n\n下午拆看陆宴辞留下的那份城南旧改底档与地下管网图时，里面正好附着梧桐巷待拆铺面的补偿明细表，她还顺手发微信向表哥裴铮核实了几句街坊走访记录——昨天裴铮警务平板上那位六十八岁的失踪拆迁户周老汉，独守着梧桐巷祖传三间临街铺面，按旧改标准本该拿到三千万拆迁补偿款；街坊邻里笔录里都提到，老爷子生前节俭，最习惯端着一只祖传缺口粗瓷大碗蹲在巷口吃饭，可半年前签字前夕却突然人间蒸发。下午她再去后院废井外围转了一圈，瞧见井口东侧两块压井青砖有半年内新撬动再抹水泥的痕迹，前后线索便严丝合缝地对上了。\n\n哪里是什么失踪。分明是负责城南旧改拆迁账目的张翠兰和急着攒巨额嫁妆的沈楚楚起了贪心，私底下做局逼死了不肯低价让步的周老汉，独吞了那三千万拆迁血汗钱；她们怕周老汉死后冤魂缠身，又花钱请了外围术士钱大师，拿周老汉的生辰八字和带血旧衣打进废井底下的排水主脉，做成了鲁班邪术里的“沉井借阴桩”，既锁死了苦主冤魂，又吸干死人最后一点财运替沈家填腰包！\n\n前晚祖祠老梁一塌，压住后院的阳气散了，井底这位周老汉已经顺着下水管道摸上了桌。\n\n不过要是大白天直接去砸井，张翠兰和沈楚楚大可以把头一缩，推说老宅荒井年久失修、自己毫不知情。想把这群毒虫连根拔起，还得让设局的邪师和雇主自己去把井盖掀开。\n\n沈知微在桌底下摸出手机，盲打了一条微信发给表哥裴铮：“哥，城南失踪的周老汉有信儿了。今晚十一点半带人来沈宅后院墙外蹲着，别开警笛，等里头动静停了直接进来拿人。”\n\n发完消息，沈知微拿起面前的骨瓷筷子，抬手在餐桌边缘那只缺口粗瓷碗沿上，当啷敲出一声清脆刺耳的响声！\n\n这一声脆响震散了蒙在餐桌上的阴障。刘妈浑身一激灵，低头看见那只粘着湿泥印子的破碗，吓得嗷一嗓子跳开两米远：“妈呀！这、这只破碗是谁摆上来的？家里碗柜根本没有这种粗瓷碗啊！”\n\n沈建业、张翠兰和沈楚楚同时低头看去。\n\n只见那只豁口粗瓷碗里的热白米饭，不知什么时候已经变得冰凉发青，两根发黑的旧竹筷子没有平搁在碗边，而是直挺挺地倒插在白米饭正当中——正是民间给死人供断头脚尾饭的插法！碗底周围的白桌布上，还一圈圈洇开着带着井水腥臭的暗黑水渍。\n\n“啊！！”沈楚楚手里的燕窝盅哐当砸碎在桌面上，脸色白得像擦了二斤粉；张翠兰更是直接从红木椅上滑到了桌子底下，眼珠子死死盯着那只眼熟得不能再眼熟的缺口粗瓷碗，牙齿咬得咯咯作响——半年前周老汉咽气那天，手里死死攥着的就是这只破碗！\n\n“大惊小怪什么，家里来了老熟客，连顿饱饭都不让人吃？”\n\n沈知微收回筷子，用帕子擦了擦手，慢条斯理地扫过张翠兰和沈楚楚惨无人色的脸：“在井底冷冰冰泡了大半年，连三千万买命钱都被人吞得骨头渣都不剩，换谁心里都得憋口怨气。祠堂老梁前晚一塌，这顿断头饭吃完，今晚子时十二点整，后院井底下的苦主就该破开青石板，挨个儿进屋找拿了他钱的人索命了。”\n\n说完，沈知微推开椅子站起身，留下一句“各位慢用，夜里记得锁好门”，头也不回地上了三楼。\n\n餐厅里死一般安静。沈建业虽然没亲手经办周老汉的死，但看弟媳和女儿这副见了鬼的怂样，哪还不明白底下有猫腻，气急败坏地压低声音吼道：“张翠兰！你们背着我在后院井里埋了什么见不得人的东西？还不赶紧处理干净！”\n\n一进二楼僻静客房，张翠兰就抖着手抓住沈楚楚的胳膊哭腔直颤：“楚楚！周老汉的鬼魂真爬上来了！那三千万咱们可是四六分的，你也拿了一千二百万进小金库，现在怎么办啊！”\n\n沈楚楚心里同样怕得要命，可她比蠢钝的张翠兰精明毒辣得多。她一把甩开张翠兰的手，眼神阴鸷地咬牙道：“你小声点！生怕沈知微听不见是不是？当初找钱大师下沉井桩是你出面办的，八字也是你递过去的！赶紧给钱大师打电话，加二十万让他半夜十一点半从后院角门摸进来，多带两桶黑狗血把井底那根木桩挖出来烧掉！只要东西没了，不管是鬼还是警察都抓不到把柄！”\n\n“对、对，烧了木桩就死无对证了！你今晚陪二婶一块儿去井边盯着！”\n\n“我头皮还伤着见不得夜风，在二楼阳台替你们望风就行，万一沈知微下来我给你发信号！”沈楚楚三言两语就把自己摘得干干净净，把吓破了胆的张翠兰推出了门外。\n\n夜色一寸寸沉入死寂，转眼到了深夜十一点五十五分。\n\n秋夜冷风刮过沈家老宅荒凉的后院，没有半点星月光亮。角门吱呀一声开了条缝，穿着一身灰布道袍、三角眼山羊胡的钱大师拎着一只肮脏的帆布法器袋溜了进来，身后跟着脸色铁青的张翠兰，两人合力抬着一只装满腥臭黑狗血的大红塑料桶，鬼鬼祟祟摸到了西北角那口泛着绿苔的废井边。\n\n“大师，您小点声！先把黑狗血泼下去镇住那个老东西，咱们撬开石板把木桩和账本一块儿拿走！”张翠兰压着嗓子直喘粗气，弯腰刚要去抓井沿的铁撬棍。\n\n“三千万拆迁款吃进肚子里大半年，现在才想起来给周老汉搬家，二婶不觉得太晚了点吗？”\n\n一道清冽平缓的女声，毫无征兆地从几步外的芭蕉树浓黑暗影里响了起来。\n\n张翠兰和钱大师吓得魂飞天外，手里的手电筒光束猛地晃过去——只见沈知微连帆布包都没背，右手单手提着那柄宽厚乌黑、足有十二斤重的玄铁量天尺，尺尖轻轻点在青石地面上，一步步走到了废井唯一的退路口。"}, {"n": 9, "title": "一尺破井桩反噬恶亲", "body": "午夜零点的冷风卷过芭蕉叶，后院废井口的腥臭水汽浓得几乎呛人。\\n\\n张翠兰看清挡在路口的只有沈知微一个人，先是吓得倒退半步，随即像是被逼急了的疯狗，恶向胆边生，压低嗓子冲旁边的山羊胡术士尖叫：“钱大师！就这死丫头坏我的事！她身边没带别人，快把井底那个老鬼放出来弄死她，推下井就说是她自己半夜失足淹死的，事成我再给你加五十万！”\\n\\n钱大师在九宫厌胜会外围混饭吃了十来年，手底下本就背着不止一条黑账。见行迹败露，他三角眼里凶光毕露，一把掀开脚边的黑狗血塑料桶盖，右手从腰间扯下一只乌黑油亮的黄铜招魂铃，咬破舌尖一口血沫喷在铃舌上，对着废井石板缝隙猛烈摇晃起来！\\n\\n叮铃铃——叮铃铃！\\n\\n急促刺耳的铜铃声在寂静子夜里传出老远，钱大师嘴里念着厌胜驱魂咒：“阴木锁魂，血食听令，起！”\\n\\n轰隆一声闷响，压在废井口的两块厚重青石板剧烈震颤起来，大量漆黑粘稠的井水混着成团水草从砖缝里狂喷而出。紧接着，一道浑身湿透、穿着破烂灰布中山装的佝偻苍老黑影，顺着黑水硬生生挤出了井口！\\n\\n正是半年前被害死的拆迁户周老汉！只是此刻这位苦主双目赤红无神，脖颈和手腕上死死缠着几圈墨斗黑线，魂体被井底邪桩折磨得神志全失，浑身滴落着腐蚀青砖的恶臭黑水，在招魂铃的催逼下张开十根乌黑指甲，裹挟着刺骨阴风直扑沈知微咽喉！\\n\\n钱大师狞笑出声：“小丫头片子，受死吧！”\\n\\n沈知微眼神冷冽如霜。观微相脉有训，枉死苦主被邪器拘魂行凶，罪在设局活人，不在无辜亡魂。\\n\\n面对扑到鼻尖前的腥臭鬼爪，沈知微没有挥尺去劈周老汉的魂体，而是左脚贴地猛趟半步，腰胯合一，一记刚猛绝伦的开门八极“猛虎硬爬山”侧身切入！她左手手掌裹着前两日修观攒下的金灿灿功德气机，重重往周老汉眉心虚拍一记。\\n\\n柔和堂皇的金芒轰然炸开，没有伤及老汉半分魂魄，却像快刀斩乱麻般震断了缠在他脖子上的厌胜驱魂丝。周老汉浑浑噩噩地惨呼一声，僵在原地抱头痛苦哀嚎；而沈知微脚下不停，跨步欺近还在摇铃的钱大师面前，左肩顺势一记八极铁山靠，砰地撞在钱大师胸口！\\n\\n咔嚓两声肋骨脆响，百十来斤的钱大师像只破麻袋一样倒飞出去三米远，手里的黄铜招魂铃摔得粉碎，整个人砸翻了黑狗血桶，淋了一头一脸的腥臭狗血，狂喷出一口鲜血爬都爬不起来。\\n\\n“就这点三脚猫的外围功夫，也敢学人家打沉井桩？”\\n\\n沈知微看都不看地上哀嚎的钱大师，转身走到剧烈翻涌黑水的废井口前。她双手一前一后握紧那柄十二斤重的祖传玄铁量天尺，深吸一口气，体内功德金光顺着双臂灌满乌黑尺身，对准井口正中那块刻着镇魂符文的四寸厚青石板，力贯千钧，自上而下悍然一尺劈落！\\n\\n轰——！！\\n\\n玄铁重尺硬撼青石，火星混着金芒在暗夜里骤然炸亮！四寸厚的坚硬青石板像酥脆的豆腐块一样当场崩裂坍塌！\\n\\n借着裂开的井口往下看，只见距离水面三尺深的井壁内侧，被人掏出了一个尺半见方的鲁班暗格。暗格正中央，死死钉着一根三尺来长、碗口粗细的乌黑百年阴沉木桩！木桩外面一层层缠满了周老汉生前的花白头发与一件染血布衫，桩身正面用朱砂混着尸油刻满了周老汉的生辰八字，七颗七寸长的生锈棺材钉把木桩牢牢钉穿在沈宅排水铸铁总管外壁上！\\n\\n这就是吸干苦主家破人亡怨气、替沈家二房源源不断聚拢横财的“沉井借阴桩”！\\n\\n“破！”\\n\\n沈知微手腕翻转，十二斤玄铁量天尺顺着井口裂隙探入暗格，尺锋精准无比地卡进七颗棺材钉交汇的母榫阵眼，猛然发力往上一挑、再凌空一劈！\\n\\n咔嚓——砰！\\n\\n那根坚逾精铁的三尺百年阴沉木借阴桩，连同七颗生锈棺材钉，被玄铁量天尺硬生生从中劈成了两截！\\n\\n鲁班厌胜门第一铁律：凡以活人八字血衣立桩借运者，阵眼一碎，积攒的全部死气怨煞必在转瞬之间顺着血脉契约原路倒灌，分毫不差地还给设局人与受益雇主！\\n\\n就在阴沉木桩断裂的同一秒，井底压抑了整整半年的滔天黑寒怨气冲天而起，化作两道肉眼可见的灰黑冷雾，根本不碰站在井边的沈知微，而是像长了眼睛的毒蛇，嗖地钻进了地上张翠兰和钱大师的口鼻与双腿裤管里！\\n\\n“啊——！！我的腿！好冷！我的肉烂了啊！！”\\n\\n原本想趁机往角门爬的张翠兰发出一声不似人声的凄厉惨嚎，整个人扑通栽倒在泥水里疯狂打滚。她掀起旗袍下摆一看，只见两条白胖小腿上，眨眼间鼓起了密密麻麻鸡蛋大小的青黑色尸斑水泡，水泡啪啪破开，淌出跟井底一模一样的发臭黑水，疼得她把泥地抓出了十道血印子！另一边的钱大师更是双眼翻白，整张老脸迅速浮现出溺死鬼般的青紫浮肿，双腿膝盖咔嚓扭曲变形，彻底瘫成了一滩烂泥。\\n\\n与此同时，张翠兰掉在草丛里的手机突兀地亮起屏幕，市医院值班护工带着哭腔的语音自动弹了出来：“张女士快来医院啊！沈少爷刚刚在病床上突然大喊大叫，之前贴的黄符自己烧成灰了，他两条断腿石膏里头全冒出青黑水泡了！”\\n\\n一饮一啄，报应爽利得连隔夜都不用等。\\n\\n井口旁，随着邪桩寸断，周老汉身上的黑水怨气彻底散去，恢复成了一个满脸沧桑的普通白发老人模样。他看着沈知微，老泪纵横地朝着她深深跪拜了三个响头。沈知微左手掐了个引魂诀，指尖渡出一缕温暖金光点在老人眉心：“账本我替你起出来交给警察，吞了你的钱、害了你的命，阳间牢饭和阴间苦果他们一样都跑不掉，安心去吧。”\\n\\n老人魂影化作点点微凉白光消散在夜风里，一缕比先前更为凝实的功德金光悄然没入沈知微眉心，暖得她指尖一片温热。\\n\\n沈知微弯腰探手进井壁崩裂的暗格深处，从碎木渣底下拎出了一只密封了三层的加厚透明防水塑料袋——袋子里整整齐齐装着周老汉带血的强拆协议原件、三千万拆迁款分赃流水，以及沈家二房行贿城南旧改办相关人员的私密花名册！\\n\\n躲在二楼北侧阳台窗帘后面偷看的沈楚楚，透过夜色看见后院金光炸裂、张翠兰满地打滚的惨状，吓得肝胆俱裂，死死捂住嘴巴缩回屋里反锁房门，连半个脑袋都不敢再露出来。\\n\\n就在这时，后院两米多高的青砖围墙外响起一阵利落的脚步声。表哥裴铮一马当先翻墙跃入，身后五六名便衣刑警鱼贯冲进角门，几支强光手电瞬间将废井四周照得亮如白昼！\\n\\n看到劈裂成碎石块的四寸厚青石井盖，再看看泥水里满腿青黑水泡、哭喊着“我招！周老汉是我们逼死的、快送我去医院”的张翠兰和钱大师，饶是办惯了大案的裴铮眼角也狠狠跳了两下。\\n\\n沈知微面不改色地把玄铁量天尺收回身后，顺手将那只沾着井泥的防水账本袋抛进裴铮怀里：“哥，城南失踪的周老汉找到了，尸骨线索和三千万拆迁分赃账本全在袋子里，地上这两个就是正主。”\\n\\n“干得漂亮！”裴铮接住铁证袋看了一眼，神色凛然地一挥手，“人赃并获！拷上，先押去市局监管医院固定口供，连夜提审医院里那个沈耀祖！”\\n\\n咔嚓两副冰冷银手铐锁死手腕，张翠兰和钱大师像两条死狗一样被刑警架出了后院角门。\\n\\n热闹散尽，后院重新安静下来。裴铮留了两名痕检员在外围拉警戒线取证，沈知微则蹲下身，用手帕捻起井边那截被她一尺劈断的百年阴沉木桩芯。\\n\\n借着廊下路灯的光亮细看，只见乌黑坚硬的木桩横截面上，赫然用烧红的细铁签烙着一枚铜钱大小的奇特火印——外圈是鲁班九宫格，正中锁着一道三曲水波纹。沈知微指尖刚一触碰那枚“九宫锁水”火印，一股与陆宴辞左锁骨下方那根夺运浮钉分毫不差的阴冷气息，顺着指腹猛地刺了过来。"}, {"n": 10, "title": "收鬼匠拔除首根钉", "body": "凌晨一点半，后院角门外的警车闪着红蓝微光悄然驶离，只留两名痕检警员还在废井边封存碎石物证。裴铮站在廊下打完局里的调度电话，一转头，却见沈知微没回主楼睡觉，正提着那柄十二斤重的玄铁量天尺，径直往东侧塌了一半的沈家祖祠走去。\n\n“知微，这么晚了还去祠堂干什么？里头危梁还没拆干净，小心砸着脚。”裴铮连忙拎着强光手电筒跟了上去。\n\n“废井底下的主桩虽然劈了，祠堂这根断梁里还卡着一桩三十年前的工伤烂账，一块儿清了省得返潮。”\n\n沈知微跨过散落一地的青瓦碎木，走到祠堂正中。两天前夜里砸断沈耀祖两条腿的那根合抱粗百年柏木大横梁，此刻正斜劈在坍塌的供桌残骸上。外头刚下过暴雨，祠堂里却没有半点雨水清气，反而弥漫着一股陈年老桐油混着干枯骨粉的酸涩闷味；强光手电照过去，只见断裂的横梁正中竟不是实心的，而是被人用木工凿子掏出了一个三尺长、一尺宽的封闭暗槽，槽口钉着三根生锈的镇魂铁锔钉。\n\n沈知微上前一步，双手握住玄铁量天尺尾端，尺锋卡进最中间那根镇魂铁锔钉底下，手腕发力往上一崩！\n\n嘣的一声脆响，锈死的铁锔钉应声弹飞。暗槽木盖滑开的瞬间，一股灰白色的陈年怨雾呼地涌了出来，紧接着，槽底赫然露出一包用桐油麻布死死缠裹的发黄人骨——虽然只是半截左臂残骨和几块碎裂指骨，可麻布底下还压着一把早年木匠随身带的牛角墨签、一块刻着“鲁大成”三个字的黄铜工牌，以及一把刃口卷曲、沾满黑褐血迹的半截铁扁凿。\n\n灰白怨雾在断梁旁打了个旋，凝成一个六十来岁、穿着打补丁蓝布短褂的小老头虚影。老头左袖管空荡荡地垂在身侧，仅剩的右手长满厚厚的老茧，原本浑浊呆滞的眼睛一看见沈知微手里那柄刻着正宗鲁班寸纹的玄铁量天尺，顿时激灵一下清醒过来，噗通跪倒在碎砖地上，哽咽却发不出大声：“正宗鲁班尺……小天师，老汉等了整整三十年，可算见着懂规矩的活人了！”\n\n旁边的裴铮看不见阴魂，却一眼看清了暗槽里的残骨和带血铁凿，脸色骤然铁青：“横梁里怎么会藏着人骨和凶器？！”\n\n沈知微低头听老木匠断断续续把当年的亏心账说了一遍，神色冷了几分，转头用大白话给裴铮翻译：“三十年前沈家翻修祠堂，二房老太爷和年轻时的张翠兰两口子想在祖祠主梁里掏暗格做‘借运聚财斗’，高薪请了城郊手艺最好的木匠鲁大爷。鲁大爷一听是要拿活人八字填梁的绝户活，当场摔了墨斗不干，还说要去派出所举报。二房怕事情败露，假意留他喝酒，趁夜砍断他左臂把人害死在后山，又听邪师指点，把他的左臂骨和随身工牌封进主梁暗槽里，拿桐油封死了充当镇祠堂的免费看门鬼。”\n\n裴铮气得一拳砸在廊柱上，指节咔咔作响：“这群吃人不吐骨头的畜生！三十年前城郊确实有一桩木匠鲁大成失踪悬案，卷宗至今还在局里积灰！我现在就让法医过来提取DNA，跟张翠兰那起拆迁命案并案彻查，死了的追究销户，活着的从重数罪并罚！”\n\n听到警官亲口说要替自己翻案追凶，独臂老鬼鲁大爷眼眶发红，冲着裴铮连作了好几个揖，魂体上的灰黑戾气散去了大半，眼看着就要顺着夜风飘散。\n\n沈知微却抬手虚按了一下，晃了晃手里的玄铁量天尺，冲鲁大爷挑眉道：“鲁大爷，先别急着走。我看你生前是吃明清官式榫卯饭的老师傅，这双眼睛认得出各路木作邪桩。我过些天要在城南栖梧院开间堪舆堂，缺个懂木头行规的看门把式。你要是愿意留下给我看门护院，阳间冤案我表哥替你办铁，阴间待遇咱们按规矩签——初一十五双份上等榆木高香，逢年过节加供烧鸡烧酒，出门探阵算工伤，魂体受了损我拿功德金光给你补，干不干？”\n\n鲁大爷一怔，低头看看自己空荡荡的左袖管，再看看眼前这个眼神敞亮、半点不拿阴魂当耗材使唤的小姑娘，咧开缺了颗门牙的嘴笑了：“管香烛还包工伤？那可比给黑心肝的沈家白当三十年苦力强到天上去了！主家不嫌老汉少条胳膊，老汉这把老骨头以后就归栖梧院差遣了！”\n\n沈知微干脆利落地从帆布包里摸出一只温润的老槐木墨斗盒，指尖引了一缕功德暖光点在盒盖上：“成交，进来歇着吧。”\n\n鲁大爷欢天喜地化作一缕青烟钻进墨斗盒里。等裴铮带着痕检警员把暗槽里的残骨铁证小心装袋封存好，时间已经滑到了凌晨两点四十。\n\n刚走到沈家前院大铁门内侧，一阵低沉急促的引擎声由远及近，那辆熟悉的京江黑牌劳斯莱斯稳稳停在了路灯下。\n\n特助快步下车拉开后座车门。车厢昏暗的阅读灯下，陆宴辞身上只穿了一件单薄的深色衬衫，领口微敞，整个人靠在真皮椅背上，额角布满细密的冷汗，右手死死按在左锁骨下方——就在午夜零点沈知微一尺劈断后院那根同源“沉井借阴桩”的瞬间，他心口那根失去地脉母气呼应的第一根夺运浮钉便开始剧烈松动挣扎，倒刺般的寒气刮得心脉生疼。\n\n裴铮认出车里坐着的是陆氏营造的掌权人，刚想开口询问，沈知微已经先一步摆了摆手：“哥，你先回局里审张翠兰，这位是找我拔钉结账的大客户，半个钟头就完事。”\n\n说完，沈知微拎着玄铁量天尺弯腰钻进劳斯莱斯宽敞的后座，随手拉上了车门。特助极有眼色地升起前后排隔音挡板，退到车外十米处守候。\n\n密闭的车厢里浮动着淡淡的雪松气息，混着陆宴辞身上透出来的丝丝阴木寒意。陆宴辞抬起略显苍白的俊脸看向她，嗓音因为忍痛而格外低哑克制：“零点十分左右，锁骨底下突然像有根钉子在往外顶。沈小姐，是后院那东西破了？”\n\n“同源的沉井桩被我劈成两截了，上面烙着‘九宫锁水’的火印，跟你心口这根浮钉是一个窝里出来的货色。”沈知微把十二斤玄铁量天尺横搁在膝头，没半句废话，“母桩一断，这根护心浮钉成了没根的死木头，现在不拔，天亮又得缩回肉里去。忍着点，拔钉见血，会比前天夜里还疼三分。”\n\n陆宴辞深吸一口气，主动解开衬衫领口往下拉开了半寸，露出左锁骨下方那片已经鼓起一道三寸黑线的冷白皮肤：“动手吧，我受得住。”\n\n沈知微神色凝肃起来。要替宿主拔除这种扎进心脉的锁脉阴钉，必须以指尖精血引尺、十指扣脉借阳，少一步都会震伤宿主心室。\n\n她低头张口，毫不犹豫地咬破自己右手食指指腹，将一滴滚烫鲜红的指尖精血重重抹在玄铁量天尺乌黑的尺尖上；紧接着，她伸出微凉的左手，五指张开，严丝合缝地穿进陆宴辞修长冰冷的指缝间，十指死死扣紧了他的脉门！\n\n掌心相贴的刹那，陆宴辞浑身微不可察地绷紧了一瞬。一股温和坚韧的功德金光顺着两人十指相扣的经脉渡入他体内，精准托住了他体内浩荡却被锁困的极阳紫气，由内向外狠狠撞向锁骨下的阴钉根部；与此同时，沈知微右手倒提染血的玄铁量天尺，尺尖精准点在他锁骨下方的黑线气门上，手腕沉稳有力地往外一寸寸勾挑引拔！\n\n“唔——！”\n\n骨肉剥离般的剧痛骤然炸开，饶是陆宴辞心志如铁，额角青筋也瞬间暴起，原本被扣住的右手下意识反客为主，五指用力收紧，将沈知微纤细的手掌死死攥在了掌心里，力道大得指节泛白，滚烫的掌心温度几乎要把她的手背烙红。\n\n一寸，两寸，三寸！\n\n嗤的一声轻响，一缕粘稠乌黑的寒煞顺着尺尖精血被硬生生扯出皮肉，啪嗒掉落在沈知微提前垫在座椅上的白手帕中央，落地瞬间凝结成了一根三寸整、筷子粗细的乌黑阴沉木毒钉！钉尾断口处，赫然也刻着半枚微缩的九宫水波纹。\n\n随着这根盘踞三年的护心浮钉离体，陆宴辞胸腔里那块压得人喘不过气的千年寒冰轰然碎裂，温热的极阳气血瞬间贯通四肢百骸，原本青紫的唇色以肉眼可见的速度恢复了红润。\n\n可另一头的沈知微却轻轻吸了口凉气，脸色肉眼可见地白了两分。引拔百年阴钉的阴寒煞气顺着量天尺反冲入臂，天生的漏阴骨受激泛起阵阵细密针扎般的寒痛——接下来整整三天，她这条右臂经脉都得像泡在冰水里一样酸冷。\n\n她刚想不动声色地抽回左手，陆宴辞却敏锐地察觉到她指尖冻得像冰块一样微微发颤，非但没松手，反而借着自己刚刚恢复奔涌的极阳掌温，稳稳包裹住她冰凉的指尖暖了十来秒，目光落在她咬破渗血的右手指腹上，眉峰紧蹙：“拔钉会伤到你？”\n\n“行规代价，经脉凉三天就过去了，死不了人。”沈知微抽回手，用纸巾随意按住指尖血珠，抬头冲他伸出五根手指，瞬间恢复了山里小财迷的实在劲儿，“第一根护心浮钉清干净了，剩下的六根藏在你右肋和深层大脉里，跟江城外头更大的水陆母阵连着，现在硬拔会要你的命，得等我后头顺藤摸瓜找到母桩再一根根算。先把这第一根的五百万尾款结了吧，陆总。”\n\n陆宴辞看着她脸色苍白还不忘算钱的模样，眼底掠过一丝极淡的无奈与温和，抬手敲了敲隔音板：“把尾款打给沈小姐。”\n\n不到半分钟，沈知微兜里的手机传出清脆悦耳的银行入账提示音——五百万元整，分文不差！\n\n沈知微眉眼弯弯地低头点开手机银行，照例连一分钟都没多留，当场给青云观大师兄转过去三百五十万元，备注“补三清殿金身与东厢房瓦木”。加上前两回留下的份额，她自己名下干干净净攒下了三百一十五万巨款，而青云观漏雨的大殿更是彻底有了着落！\n\n陆宴辞推门下车，没让特助代劳，亲自绕到另一侧替她拉开车门，又从后备箱拎出一只一直插电保温的紫砂焖烧壶递到她手里：“来之前猜到破煞耗神，让家里厨师熬了老红糖三年陈姜汤。我送你进去。”\n\n不等沈知微推辞，男人已经拎着保温壶，步履沉稳地一路穿过前院，硬是把她送到了沈宅主楼旋转楼梯口，看着她拎好帆布包才低声道：“这三天好好歇着，城南旧改和沈家这边的首尾，陆氏法务会替你盯着。”\n\n清晨六点，天边透出暖融融的橘红朝霞。\n\n沈知微回到三楼洒满晨光的向阳大套房里，拧开紫砂焖烧壶倒了一碗浓稠辛香的红糖姜汤。滚烫甜辣的姜汤顺着喉咙滑进胃里，把右臂经脉里那股阴寒针刺感驱散了大半。她捧着暖呼呼的瓷碗窝在沙发里，低头看着手机银行里那串足有七位数的余额数字，满意地眯起了眼睛。\n\n而此时此刻，二楼最深处一间紧闭窗帘的客房里，却是另一番怨毒光景。\n\n一夜没合眼的沈楚楚死死抓着头顶歪斜的假发套，透过窗帘缝隙看着楼下陆宴辞那辆绝尘而去的黑色劳斯莱斯，指甲几乎把窗台木漆抠烂！昨晚二婶张翠兰被警察像拖死狗一样铐走，沈耀祖成了残废还在医院被看押，沈建业刚才更是吓得六神无主，跑到她门外说为了稳住裴老爷子和沈氏暴跌的股价，三天后必须在云顶大酒店给沈知微办一场风光体面的豪门认亲晚宴！\n\n一旦让沈知微在认亲晚宴上压过她风头、再把城南栖梧院的钥匙彻底拿走，她沈楚楚十八年的豪门千金富贵就真成了全江城的笑话！\n\n“想抢我的位置，做梦……”沈楚楚眼底布满血丝，从枕头底下翻出一张藏了许久的黑底金字私人名片，颤抖却狠毒地拨通了上面那串加密号码，“喂，是省城来的冯大师吗？我出两百万！三天后云顶酒店的认亲晚宴，我要您亲自出手布那个‘倒影招阴局’——我不要沈知微死，我要她当着全城名流和记者的面扒光衣服发疯，一辈子烂在精神病院里！”"}]}, {"id": "male_fanren", "badgeClass": "male", "tag": "男频 · 凡人流修仙", "title": "青芜问仙录", "logline": "寒门少年沈砚为免除家中河工重役顶替入外山药庐当学徒，凭一方需废丹残渣配矿炭控火熬萃灵膏、却伴随燥毒反噬的残破石臼“青蚨烬炉”，在试药盘剥、坊市暗算与宗门垄断夹缝中精算得失、苦修药火百艺，一步步踏出清正长生仙路。", "outlineUrl": "files/male_fanren_outline_1_100.txt", "outlineFileName": "《青芜问仙录》_第1-100章大纲.txt", "proseUrl": "files/male_fanren_chapters_1_10.txt", "proseFileName": "《青芜问仙录》_第1-10章正文.txt", "outlines": [{"n": 1, "title": "霉梗拆账", "synopsis": "寒河县岁修摊派在即，十六岁的寒门医户少年沈砚因家中凑不出八两免役折银，顶替伤肺病退的堂兄沈禾赴百草堂外山药庐应募，随身仅携一只祖传灰青石臼。入门盘点时，副管事郑福全故意将受潮霉变的陈年药梗混入新筐，逼新学徒画押认下三十斤损耗烂账，拒签便要退籍送官服苦役。沈砚看穿郑福全急于平账的心思，不吵闹揭穿也不糊涂背锅，当场按医铺烘药规矩分拣成色，将霉梗折算作烘房垫底粗料，既替郑福全圆了账面亏空，又把自身赔偿责任择得一干二净，顺利拿下三日留庐复核资格，却在晚间领到的学徒补气汤里闻出了异样燥气。"}, {"n": 2, "title": "免役身契", "synopsis": "复核期内，郑福全紧盯众学徒吞服固本补气汤后的气色变化，同批学徒吴大勇等人贪图汤后浑身燥热力涨而争相多饮。沈砚联想起堂兄病退前咳血气衰的症状，断定此汤暗掺透支气血的猛药，每逢领汤便借口挑灰转身倾入墙根暗沟，只留唇边药渍应付查验。白日核账过秤时，沈砚精准算清内坊运来的废丹灰渣与烘房炭耗，当堂签下正式学徒契书，将抵扣寒河岁修的免役凭据稳稳寄回家中；过秤间他瞥见内坊特殊废渣混有诡异暗紫金星，且郑福全拨付的赤铁矿炭比账面短少近三成，遂主动请调偏僻苦累的灰房值夜差事以藏身避祸。"}, {"n": 3, "title": "烬底微脂", "synopsis": "沈砚独守灰房值夜，为配制遮掩自身康健气色的苦寒草散，将白日筛出的同源止血废丹渣盛入祖传石臼“青蚨烬炉”，搁在赤铁矿炭余火上凝神慢捣。随着他全神贯注倾听炭爆温差达一炷香之久，石臼内壁底部一缕暗青色残缺火纹倏忽闪灭，焦黑腥臭的药渣竟化作枯灰，臼底凝出半滴温润无杂的灰白药脂，同时一股微燥热流顺掌心窜入肺腑令他咽喉干刺。沈砚谨慎挑出一丝药脂涂抹虎口冻裂血口，伤处眨眼收口结痂且指节暖流涌动；他核算灰筐损耗与自身燥感，确认石臼须吃药渣炭火方能生脂，立下暗中试炉攒脂、寻觅修仙引气法门的目标。"}, {"n": 4, "title": "三斤定炉", "synopsis": "为摸透青蚨烬炉底细而又不拿性命冒险，沈砚趁连夜清灰之机展开严格对照测试。首夜他混入止血与补气两类异源废渣，炭火刚旺石臼便剧震冒出焦赤毒烟，他果断泼沙撤炭才未泄出动静；次夜他改投三斤同源一阶回气废丹渣、配足烘房省下的二两地火赤铁矿炭，凝神控温一炷香，稳稳萃出一整滴澄澈“净灵药膏”。沈砚捉来灰房冻伤野鼠先外敷后喂食微沫，见野鼠精神暴涨且脏腑无烂毒，方敢确认药膏纯净；不料他贪快紧接再开第二炉，炉成刹那心肺如遭火针攒刺、气血翻涌，由此彻底摸清石臼配比铁律与连开两炉必积燥毒的边界。"}, {"n": 5, "title": "寒涧咳血", "synopsis": "沈砚在后坡冰涧旁寻觅清燥草根，迎面撞上值夜伤退老护院陈戍旧疾发作，正扶树闷咳出夹杂赤黑火丝的淤血。陈戍眼神骤冷按住腰刀欲除目击者，沈砚却早退至上风口乱石后，左手袖扣生石灰与燥火药末，口中平静报出自身值夜学徒身份及药庐点卯时辰，点明一旦见血必引内坊执事搜山，继而直言陈戍所患乃是妖兽火毒淤肺、寻常燥烈丹散只会催命。见陈戍压住刀势，沈砚抛出用稀释净灵药膏调和白茅汁制成的半钱“清燥药脂”，提议免费供其试服三日，若能止咳化燥便按旬供药，只换外山黑摊门路与防身步法，陈戍冷声应下三日之期。"}, {"n": 6, "title": "藏脉淘诀", "synopsis": "晨检堂上，郑福全宣称内坊丹房欲挑三名气血最旺的学徒入内学艺，吴大勇等人欣喜若狂挺胸应选。沈砚早已从废渣损耗算透所谓丹房学徒实为替修士试火挡毒的短命炉童，提前吞服微调过的苦寒黄连散压低脉搏，诊脉时更暗引一丝肺燥装出气短虚咳之态，被郑福全嫌弃划入庸劣留用名单，成功躲过催命征调。第三夜陈戍如约而至，确认清燥药脂令其夜咳减半且绝无丹毒，当场指点沈砚散修保命的《敛息折苇步》要诀，并趁子夜带他蒙面潜入云泽坊外山草市黑摊；沈砚用省下的碎银与一钱药脂，从旧书摊淘得半册残缺的《青木引气篇》与三株清燥寒叶草。"}, {"n": 7, "title": "引气开窍", "synopsis": "接下来的五日，沈砚白日老实清灰记账、夜间演练《敛息折苇步》，待攒满三滴纯净灵膏并煎好清燥寒叶汤后，于灰房密处按《青木引气篇》盘膝冲关。温润药力化开驳杂灵窍的滞涩，辅以寒汤实时压住经脉燥意，沈砚熬过开窍刺痛，终于在五更前引第一缕青木灵气归入丹田，正式踏入炼气一层！破境后他耳目神识清明倍增，指尖能凝出一缕微弱控火灵劲，更将石臼刮下的燥火炉灰混入铁砂配成阴狠的“赤砂障目散”。同日傍晚，被选入内坊的吴大勇因试火伤脉吐血退庐，而郑福全突闻内坊执事将提前清查岁末矿炭总账，惊慌下闯入灰房逼沈砚连夜重做假账平窟窿。"}, {"n": 8, "title": "暗渠埋引", "synopsis": "面对郑福全的威逼利诱，沈砚垂首应承替其做平账册，暗中却在烘房折算栏留下一处唯有内坊专职司秤核验火耗方能察觉的暗扣，并将自己平日留存的矿炭实收竹签与车辙拓印油布封入灰房排烟暗渠深处。算准郑福全拿到假账后必借次日月底城外倾倒废渣之机杀人灭口，沈砚连熬三夜炉火，用高纯度燥火炉灰裹入赤铁精炭碎末，封进三枚中空大钱壳内煅成狂暴的“火煞铜丸”；随后他预付两旬清燥药脂寻到陈戍，不提管事恩怨，只按黑市价码请陈戍在明日夜路乱石沟暗中替他挡下暗处冷箭，双方击掌定下“只护一程、事后两清”的铁约。"}, {"n": 9, "title": "乱石焚煞", "synopsis": "朔夜寒雾弥漫，沈砚独自赶骡车押送废丹灰渣至城外乱石沟，郑福全刻意调走了随车杂役。灰车刚入窄谷，林间骤然射出一支淬毒铁矢直取沈砚后心，暗处潜伏的陈戍施展《敛息折苇步》鬼魅般欺近偷袭帮凶，挥刀格飞毒矢并将其死死缠住；正面一名炼气二层的独眼匪修狞笑亮出护体灵光逼近灰车，欲拧断沈砚脖颈伪造劫车假象。沈砚故作骇然跌落车辕诱敌踏入三尺死地，暴起扬出赤砂障目散蚀穿其双目，旋即弹出两枚火煞铜丸并以控火指劲引爆，狂暴赤燥火煞轰然炸穿护体灵光与匪修胸膛！两人迅速搜出匪修怀中十七枚碎灵砂与郑福全私库封泥，倾倒赤铁余炭将两具尸骸焚作飞灰。"}, {"n": 10, "title": "司秤夺印", "synopsis": "内坊丹房执事周明远（炼气五层）因上月废渣火候异常突临外山药庐查账，郑福全见沈砚未死归庐，当即恶人先告状污蔑沈砚夜出盗卖赤铁矿炭。沈砚捂着故意擦破的臂伤跪呈实收正账，请周明远核验烘房火耗暗扣，并当众从排烟暗渠取出历次短秤竹签与染有独眼匪修炭灰的私库封泥，铁证如山揭穿郑福全私倒三十斤矿炭致烘药失准的罪行。周明远震怒下令废去郑福全职司锁拿回内坊，郑福全被拖走前嘶声咒骂外门胞弟必来索命；周明远复测沈砚仅见微弱驳杂气感，嘉许其辨药算账精熟老实，当场擢升沈砚为药庐采买司秤，脱去试药杂役籍。"}, {"n": 11, "title": "立规清匣", "synopsis": "郑福全倒台次日，沈砚正式接过采买司秤铜印与西侧独立耳院钥匙，昔日克扣过他的烘房管事捧着热茶赔笑听调。沈砚不摆威风也不翻旧日小账，当众立下“公秤实收、合理火耗归烘房、灰房废渣由司秤亲自复验封存”的新规，既稳住了底下杂役生计，又名正言顺锁死了同源废丹渣与结余赤铁矿炭的截留渠道。他领出首月翻倍俸银，托稳妥乡邮将寒河县家中过冬炭粮与来年免役银一并寄足，随后闭门清点郑福全旧物，从桌底暗格翻出半张未及销毁的私炭交割残契，查知独眼匪修背后还牵着一伙盘踞坊市边缘的断碑岭散修。"}, {"n": 12, "title": "初涉云泽", "synopsis": "准备妥当后，沈砚佩上百草堂采买腰牌首次前往三十里外的云泽散修坊市。入坊后他先观察石碑禁武铁律与巡逻修士动向，在正街药铺按公账成色采齐周明远指定的三味压煞寒草；随即借公厕换上粗布斗笠、运起《敛息折苇步》潜入外棚灰市，用匪修遗留的十枚碎灵砂买下一块旧测灵石片与一卷《火工控温杂记》。在无人墙角测试之下，石片仅泛起微弱晦暗的青红双色，证实他只是修仙界最受轻视的下等木火双杂灵窍；沈砚毫不气馁，算清唯有紧握青蚨烬炉积攒无杂灵膏方能逆命，正欲离坊却撞见赤沙会散修四处搜寻独眼同伙下落。"}, {"n": 13, "title": "润脉成丸", "synopsis": "避开赤沙会眼线返庐后，沈砚锁紧司秤小院门户，利用每晚核验灰房之便稳定投入三斤同源回气废渣与二两优质赤铁矿炭，按日一炉攒下五滴净灵药膏。参照新淘来的《火工控温杂记》，他不再直接生吞原膏，而是以文火将药膏同冰叶草汁揉炼成绿豆大小的“清燥润脉丸”，服下后不仅将此前越限试炉残留的微末肺燥涤荡一空，行功时灵气转化更比原先顺畅数成，短短数日便将《青木引气篇》推至炼气一层顶峰。就在他准备攒力冲击二层关口时，内坊趁雨夜秘密运出两具暴毙炉童遗体交外山处置，尸身症状诡异骇人。"}, {"n": 14, "title": "红泥露踪", "synopsis": "沈砚借验看死籍之机暗查炉童尸身，发觉死者心脉被一股霸道紫煞烧穿，恰与内坊每月倾倒的暗紫金星废渣气味同源，心中对内坊的忌惮更深一层。次日午后，断碑岭赤沙会一名炼气二层小头目借口替炭行送样，大摇大摆闯入司秤房，阴阳怪气提起郑福全旧例，勒索每月十斤低价赤铁矿炭并打听乱石沟车夫去向。沈砚神色恭谨地搬出周明远亲笔查账封条，推说月底前内坊逐斤复秤、待风头过去再行商议，不卑不亢将人礼送出门；转头他根据对方靴底未干的硫铁红泥与焦磺味，夜间携改良润脉脂寻陈戍核对，摸清了赤沙会的老巢底细。"}, {"n": 15, "title": "破关试紫", "synopsis": "知晓赤沙会背后有炼气四层修士撑腰，沈砚深感炼气一层修为不足自保，遂向陈戍交付双份改良润脉脂助其压下七成肺毒，自己则在耳院布下铃线警戒闭门冲关。接连五夜，他逐枚服下清燥润脉丸运转《青木引气篇》，丹田气旋骤然扩充一倍，水到渠成冲破炼气二层关口！破境后沈砚神识可清晰覆盖三丈方圆，隔墙虫鸣亦历历在耳；他趁神识大涨，谨慎取出一两暗紫金星废渣投入青蚨烬炉试探火候，谁知炭火方燃，臼底残纹便剧烈排斥震颤、溢出一缕蚀骨紫烟，沈砚毫不恋战当即断火封灰，确认二阶异种毒渣绝非炼气初段所能染指。"}, {"n": 16, "title": "山口验车", "synopsis": "沈砚亲自押车将三味压煞寒草送往云泽山腰的百草堂内坊交割台，隔着护山云禁首次窥见内坊丹炉赤霞冲天的森严气象。负责收货的周氏内门管事故意挑剔寒草挂霜含水，硬压两成秤头欲罚沈砚补银；沈砚早料到内坊盘剥成性，不慌不忙从车底暗箱取出提前烘足火候的备用干草补齐斤两，令管事挑不出半分错处。交割闲谈间，沈砚旁敲侧击得知郑福全因供出私炭去向保住残命，已被贬入内坊废丹房充作试毒苦役；沈砚暗自凛然，辞别下山过溪饮骡时，凭炼气二层敏锐神识发觉车轴油泥被人趁交割空隙抹了追踪异香。"}, {"n": 17, "title": "祸水东引", "synopsis": "沈砚不动声色用苦艾烈酒洗净车轴追踪香，用油纸包好余粉绕道外山集镇，趁断碑岭赤沙会暗桩在茶铺歇脚时，施展《敛息折苇步》将香粉反抹在其运炭骡车底盘上，随即驾空车按时回庐点卯。是夜，顺着追踪香搜查私炭余党的周氏内坊巡卫直扑断碑岭废炭窑，当场撞破赤沙会囤积的赃炭与私囚散修，双方爆发惨烈斗法！沈砚登高远眺山谷内剑光火符交织，赤沙会死伤殆尽、炼气四层头目重伤遁逃，迫在眉睫的敲诈危机随之烟消云散；他强忍下山摸尸的诱惑稳守药庐，同时切身体会到无趁手法器在修士斗法中的脆弱。"}, {"n": 18, "title": "废窖审讯", "synopsis": "赤沙会覆灭的余波传开次夜，药庐内一名曾受郑福全恩惠的烘房旧杂役见势不妙，趁三更风紧潜至灰房外泼洒火油，企图烧毁废渣账册与沈砚耳院后逃亡。沈砚神识早察觉墙外脚步虚浮异常，先以石子打灭火折，再配合阴影中掠出的陈戍一举锁住纵火者咽喉。拖入废窖审讯之下，那杂役骇破苦胆，招认被贬在内坊试毒的郑福全虽半身溃烂，却用藏匿的金叶子买通送饭伙夫传出血书，诬指沈砚私藏罕见清肺灵药并害死私炭买主，其青芜宗外门炼气四层的胞弟郑福海已接信启程。沈砚依约将纵火贼交药庐公审发配矿坑，心中迅速盘算破局退路。"}, {"n": 19, "title": "置盾换石", "synopsis": "面对炼气四层外门修士寻仇的倒计时，沈砚深知困守外山无禁制遮护必成活靶，翌日借采买辅料之名再入云泽散修坊市。他在外棚旧器摊反复比对灵气传导，花光积攒的二十二枚碎灵砂淘下一面边角焦裂却木心完好的一阶下品“青鳞木盾”与两张基础轻身符；随后蒙面转入散修茶寮寄售柜，将三盒掺了微量净灵药膏的清燥润肺散挂单出售，半日内便被一名火功散修买走，扣除抽成稳稳落袋第一块下品灵石！沈砚顺路打探外棚西区带基础预警禁制的独院月租需两块灵石，正盘算再攒数日资粮便狡兔三窟，回庐却撞上内坊突降的一纸催命调令。"}, {"n": 20, "title": "紫渣杀局", "synopsis": "周明远派来的丹童不仅送达三日后调沈砚入内坊紫火房当差的口谕，还监督杂役卸下三大篓刚出炉的暗紫金星废渣；搬运间一名杂役脚滑打翻半篓残渣，滚烫紫灰沾肤即烂、哀嚎不止。沈砚奉命调配寒草膏救治伤者，趁擦洗创口贴近细辨未烧尽的紫叶药引与妖血腥气，结合前番暴毙炉童的紫斑死状，瞬间逆推出陇西周氏正在拿懂药理的学徒活体试炼一种折寿催境的阴毒“紫煞破障丹”，所谓提拔入紫火房分明是送死耗材签！沈砚面上感恩领命送走丹童，转身便开始秘密打包青蚨烬炉与细软，不料郑福海当夜袭庐的警讯已先一步送到眼前。"}, {"n": 21, "title": "鸣锣拒虎", "synopsis": "入夜寒雾弥漫，炼气四层的郑福海果然潜至外山药庐后墙，欲悄无声息掳走沈砚逼问清肺灵药与胞兄下落。沈砚凭三丈神识察觉墙外凌厉气机，算准青芜宗外门弟子绝不敢在陇西周氏产业内公然屠戮管事，当即敲响灰房防盗急锣惊动全庐二十余名护院火把合围，并高声宣称内坊周执事亲调的紫火房差拨不容有失。暗处的郑福海闻听周明远名号，投鼠忌器之下只得敛息退去，改在药庐通往坊市的咽喉山道蹲守，沈砚由此争得三日破局缓冲。"}, {"n": 22, "title": "旧档查煞", "synopsis": "郑福海堵死出山正路，三日后又是紫火房点卯死限，沈砚深知必须先摸透内坊调令底细方能借势脱身。他白日带三名护院押送例行药篓赴外山集镇，暗中调阅药庐近三年秋季废渣清运底账，并用半盒清燥药散撬开一名早年灼瞎左眼的老焙药工之口。两相印证下，沈砚彻底查明内坊丹师周鹤年每逢秋末便私炼阴毒“紫煞破障丹”，专挑通晓药理且气血未衰的杂役吸纳炉口紫毒，活不过两月便经脉尽烂而亡，这让他下定借双敌对撞金蝉脱壳的决心。"}, {"n": 23, "title": "借道设饵", "synopsis": "摸清内坊灭口规矩后，沈砚连夜在耳院筹备除敌后手：他谨守石臼不碰二阶毒渣的红线，只用长柄铁钳刮取干燥紫灰密封于蜡壳，裹在四枚火煞铜丸外层制成破灵毒火器；随后携两盒精调润脉脂密会陈戍，不求老护院正面硬撼炼气四层，只约其在西崖废炭道上方暗哨埋伏，关键时刻射出一支重铁破甲弩牵制敌手。部署妥当后，沈砚借采买脚夫之口向坊口客栈暗透“沈司秤畏惧内坊试毒、将于明夜携宝自西崖小径私逃”的诱饵消息。"}, {"n": 24, "title": "西崖焚敌", "synopsis": "贪图独吞清肺秘宝的郑福海果然甩开旁人，独自堵在西崖废炭道石缝出口。面对炼气四层修士祭出的一阶玄铁短刃，沈砚施展《敛息折苇步》借嶙峋石壁步步后撤，用青鳞木盾硬受一记劈斩，木盾应声崩裂的同时成功将急于活捉搜宝的郑福海引入预撒矿炭粉的死角。郑福海欺身探爪刹那，沈砚扬手泼出赤砂障目散，崖顶陈戍依约射出重弩逼偏短刃；沈砚趁其护体灵光波动，指劲连弹四枚紫灰火煞铜丸贴胸炸开，毒烟烈火瞬间蚀穿郑福海咽喉心脉，彻底拔除寻仇死敌。"}, {"n": 25, "title": "初获储袋", "synopsis": "沈砚依约将一枚下品灵石留在暗哨石下酬谢陈戍，独自转入荒僻山涧石窟清点战利品：郑福海的灰皮储物袋内共有九块下品灵石、一册青芜宗外门基础火工手札《控火初解》、一柄留有宗门暗记的一阶玄铁短刃及郑福全的诬告血书。沈砚销毁血书，深知此刻潜逃仍会连累寒河县家人被周氏追索，遂将青蚨烬炉与储物袋一并封入石窟暗格，仅留寻常行囊返庐，并借左肩轻伤与微服苦寒药散，将脉象伪造成气血亏败、肺络受损的残破之态。"}, {"n": 26, "title": "藏伤应调", "synopsis": "沈砚随巡卫抵达云泽山腰紫火房外院，首次见到陇西周氏主掌试丹的炼气八层丹师周鹤年。同批被征调的三名杂役中，两名气血充沛者当场被押入赤霞翻涌的内炉房充作滤煞炉童；轮到沈砚验脉时，周鹤年探出其左肩受创、肺脉寒涩滞重，认定这副残躯扛不住半日炉口紫煞，嫌弃地挥手将他贬去山坳外围的“紫灰窑”，命其与旧苦役一道将每日排出的剧毒紫泥烘干封坛，恰好落入沈砚预设的脱身棋局。"}, {"n": 27, "title": "灰窑末路", "synopsis": "紫灰窑内毒瘴弥漫，沦为试毒苦役的郑福全见沈砚完好无损入窑、自家胞弟却毫无音讯，顿时明白外援已绝，嘶声欲向监工揭发沈砚藏药；然而他喉头早被紫毒蚀烂发不出整句人言，反被嫌吵的监工一鞭抽翻在泄烟口旁，当夜便因毒烟攻心七窍流血而亡。沈砚沉默替其收敛残尸堆入后窑柴垛，趁清扫灰沟之机用铁钎探明窑底有一条被锈铁栅封死的排污暗渠直通山外溪谷，更在夜半听见周明远定下初十封窑灭口的密令。"}, {"n": 28, "title": "暗渠备蜕", "synopsis": "距离初十死期仅剩四日，沈砚白日老实守炉焙烧毒泥，夜间则借炉火轰鸣掩护，取窑内废药酸卤涂抹排污暗渠底部的锈蚀铁栅，再以《青木引气篇》微弱火劲一点点炙脆铁枢，于第三夜无声卸开容一人钻行的水口。为防周氏事后追查活口，沈砚暗将郑福全遗尸拖至主炉正前方，把自己的采买司秤铜牌塞入尸身腰间，又在堵塞的副烟道内填满赤铁炭末与干燥紫灰。正当他算准初九夜先行撤离时，山外骤起雷雨，周明远竟提前带队封门。"}, {"n": 29, "title": "炸窑脱籍", "synopsis": "周明远因忌惮明日青芜宗巡山执事路过云泽，临时决定提前焚窑灭迹。千钧一发之际，沈砚毫不慌乱，先以湿麻布裹紧口鼻退入排污暗渠入口，指尖弹出一缕火劲引燃副烟道内预埋的赤铁炭末与紫灰！轰然巨响中，狂暴紫火逆冲掀翻半边窑顶，将炉前挂着司秤铜牌的焦尸彻底烧成难辨面目的枯炭，连门外泼油杂役亦被气浪震飞。周明远见火势滔天怕引来宗门盘查，匆匆验看半块烧熔的司秤铜牌后当即按“焙窑走水、杂役俱殁”结案销籍，沈砚则顺着溪流潜回石窟取回全部身家。"}, {"n": 30, "title": "断尘入坊", "synopsis": "暴雨初歇，沈砚在林间破庙与等候接应的陈戍会合。得知百草堂已正式贴出紫灰窑走水抚恤告示、彻底勾销了“沈司秤”名籍，沈砚心中大石落地；他取出历月攒下的二十五两世俗纹银与半枚家传平安木扣，托付常跑青州南线的老实皮货商队，以“远调南疆药庄三年不归”之名送回寒河县父母手中，彻底斩断凡俗牵连。陈戍亦打算借攒下的灵砂迁居坊市边棚养老，二人约好联络暗记后先后分头进山，沈砚换上灰布道袍、头戴青竹斗笠，以自由散修身份迈入云泽坊。"}, {"n": 31, "title": "槐巷安炉", "synopsis": "云泽散修坊市分内外两层，内街商铺林立却房租昂贵，外棚则鱼龙混杂、凭灵石即可匿名领牌租住。沈砚避开百草堂耳目集中的东街，在偏僻的西区槐阴巷挑中一座背靠石壁的独门小院，付两块下品灵石月租与一块押金领下禁制木牌。入院首日他便闭门不出，在柴房青砖下深挖丈许暗窖安置青蚨烬炉，将烟道接入天然石缝散烟，又在院墙死角拉起细若游丝的铜铃暗线与石灰脚印带，刚把藏身窝经营妥当，便切身感受到坊市强手环伺的生存压力。"}, {"n": 32, "title": "散摊淘渣", "synopsis": "脱离外山药庐虽获自由，却也断了免费的废丹灰与赤铁矿炭来源，手头仅剩六块下品灵石坐吃山空绝非长久之计。沈砚连逛三日坊市灰摊，发现不少丹铺学徒将炼废的一阶丹渣当作“驱虫肥田药灰”低价论筐贱卖，只是内里混杂五六种相冲药性，旁人根本无法分拣。沈砚凭精湛辨药鼻目，特意分早晚在三家不同杂货摊各买数斤灰渣与零散赤铁矿炭，回窖精细筛出纯粹的“凝气丹”同源残渣入炉，萃出的净灵药膏灵力比昔日止血膏醇厚数分，稳稳接续上修行资粮链。"}, {"n": 33, "title": "炼气三层", "synopsis": "攒够十滴醇厚凝气净膏后，沈砚挂出闭关木牌，在暗窖内潜心冲击炼气中期瓶颈。凭借净膏毫无丹毒杂质的温和药力，配合《控火初解》中精细导引火木灵气的窍门，他在第十四日夜一举冲开第三条主经脉，水到渠成晋入炼气三层！破境后沈砚灵力暴涨近倍，神识外放扩展至五丈，不仅能熟练催动指尖“控火丝”熔掉玄铁短刃柄部的青芜宗外门暗记、将其祭炼为趁手防身法器，更看清手中《青木引气篇》最多只能修至炼气四层，寻觅正统五行功法迫在眉睫。"}, {"n": 34, "title": "故友警讯", "synopsis": "陈戍已在坊市北头猎妖散修聚居的破庙巷租屋安顿，沈砚在院中设茶接待，奉上两枚用凝气净膏改良的清燥润脉丸。陈戍服下运功片刻，积郁数年的肺经黑血竟咳尽收口，战力重回炼气三层稳固水准，对沈砚的药理本事愈发信服。酒过半巡，陈戍郑重告诫：近月秋猎将开，外棚连出三起灰市寄售药散被人顺藤摸瓜夜袭破门的惨案，寻常租院禁制形同虚设，劝沈砚尽早去南街符阵外棚置办几张高品“敛雾符”遮蔽火气，双方互留救急哨音后妥善作别。"}, {"n": 35, "title": "澄砂试售", "synopsis": "沈砚携灵石前往坊市南街规模最大的“丹砂阁”求购敛雾符，不料掌柜不仅将一阶中品敛雾符抬价至三块下品灵石一张，还要求登记买主住址与师承跟脚；外围散摊的劣质隐匿符则灵光散乱、贴墙半日即废。沈砚不肯露底，回院做配伍实验时发现将半丝净灵药膏融进青松脂液，竟能令浑浊矿物朱砂瞬间澄净沉渣，遂将其命名为“澄砂凝露膏”，装入两只不起眼的粗瓷瓶送交灰市茶寮寄售试水，结果不到两个时辰便被神秘买主以四十枚碎灵砂抢购一空。"}, {"n": 36, "title": "染巷截踪", "synopsis": "正如陈戍所料，灰市茶寮伙计见“澄砂凝露膏”成色罕见，暗中收钱向两名专干摸窝勾当的劫修（炼气二层与炼气三层）指认了取钱背影。沈砚凭五丈神识早早看穿脚下青石板被弹了荧光磷粉，不动声色拐入堆满烂染缸的死胡同，借《敛息折苇步》翻上梁木。待两名劫修持刀摸进窄巷东张西望时，沈砚骤然催动玄铁短刃凌空刺穿炼气二层匪徒肩琵琶骨，左手控火丝擦着另一名炼气三层劫修咽喉燎过！那劫修骇于沈砚神识精准与法器犀利，拖着同伙狼狈逃窜，沈砚亦迅速换装远遁。"}, {"n": 37, "title": "万宝问价", "synopsis": "断了茶寮散卖路子后，沈砚前往坊市信誉最稳的万宝楼一层探价：一册可安稳修至炼气九层的正统五行功法《厚木蕴火诀》标价高达三十五块下品灵石，而他手头满打满算不过六块灵石零几十灵砂。正盘算生财长策时，楼外忽起争执——丹砂阁管事正带人逼迫几名外棚散修符师签十年低价包身契，否则一律断供提纯朱砂灵液；众符师敢怒不敢言，唯有一名指尖染红的青裙女修冷脸摔回契纸、宁肯撤柜去外棚摆地摊也不低头，其宁折不弯的守信风骨令沈砚暗暗留心。"}, {"n": 38, "title": "朱砂询膏", "synopsis": "沈砚驻足外棚角落摊位前，摊主林晚萤（炼气三层）指尖沾着常年洗不净的淡红朱砂，正急切向过往药师询价能提纯陈年矿砂的二阶去杂辅料。面对旁摊男修讥讽女流不自量力，她不多废话，当场提笔以“青毫分水”绝活引符试效，一张一阶中品敛雾符贴上木桩瞬间隐去全部灵气波动！沈砚眼尖瞥见她竹篮角落留着灰市那只粗瓷空瓶，心知她误把无杂质的澄砂凝露膏当成了大铺流出的二阶辅料；沈砚掏灵石买下两张敛雾符，压低斗笠透出自己手握凝露膏货源，立下三日后小额试单之约。"}, {"n": 39, "title": "挂壁验符", "synopsis": "回院当夜，沈砚将两张敛雾符贴于暗窖封门，亲测即便石臼全速开炉，五步外神识亦探不出半分燥热灵机；他当即用蜂蜜苦参胶微调三份澄砂凝露膏的质地气味，彻底掩去废丹萃膏痕迹。三日后清风茶棚内，林晚萤揭盖挑起一缕药膏融进浑浊赤砂液，倾斜玉碟细看朱砂灵液挂壁流速瞬间变得匀净如绸，试画一笔灵光湛然，成符率足足提升三成！林晚萤难掩眼底喜色，爽快交割四张高品敛雾符与两张专破阴邪禁制的赤阳破障符，两人账目两清、绝口不探彼此师承来历。"}, {"n": 40, "title": "符斋挤兑", "synopsis": "丹砂阁管事眼见秋季猎妖大集将启、外棚散符分走客流，竟买通坊市外棚管事，以“散修私调劣砂易致猎妖途中炸符”为由，强令未挂靠大铺的散摊补交双倍保质押金四块灵石，否则即刻没收符匣驱逐出棚！此举直掐正攒钱赴万宝楼赎谱的林晚萤死穴，一旦失了秋集进项便前功尽弃；沈砚亦算清若任由丹砂阁垄断符道外棚，自己刚打通的隐匿符阵来源与后续借摊出货渠道将一并夭折。面对坊市棚区禁武铁律，沈砚暗中传音稳住林晚萤，敲定今夜赶制精品破障敛雾双符、明日直切北门猎妖团刚需的反击方案。"}, {"n": 41, "title": "北门试符", "synopsis": "清晨北门秋猎集结场上，丹砂阁贺掌柜仗势向各猎妖队兜售高价次等符箓，还当众讥讽林晚萤地摊散符遇山瘴即废。沈砚在旁传音指点林晚萤直切猎妖客最忌阴瘴偷袭的痛点，请炼气五层猎妖头领石猛取出腐毒兽皮当场试符：丹砂阁符纸仅燎焦表皮便灵光溃散，而林晚萤以澄砂凝露膏所绘的赤阳破障符一击洞穿兽皮，敛雾符更令活人气机瞬息全消。石猛大喜包圆全摊成符并付清十六块下品灵石，林晚萤顺利交齐押金立稳字号。"}, {"n": 42, "title": "守界立约", "synopsis": "秋集首战告捷后，沈砚与林晚萤在清风茶棚雅间核清账目，正式敲定守边界的长线合作：沈砚按旬定量供应澄砂凝露膏，并将稀释调配的清燥润脉散、拔毒药膏交由林晚萤摊位匿名寄售；林晚萤则按成本价为沈砚定制隐匿阵具并抽取两成代售佣金，双方约明绝不打听药方源头与符道秘传。交谈间林晚萤坦言正全力攒够百枚下品灵石，以赎回祖父典当在万宝楼的半卷《云篆符解》。当夜沈砚携她赶制的四方敛雾小阵归院布防。"}, {"n": 43, "title": "猎季收渣", "synopsis": "随着进山秋猎的散修陆续带伤返坊补给，灰市涌入大批炼废的一阶中品回元丹与辟瘴丹药渣。沈砚借四方敛雾小阵隔绝神识窥探，换装分摊零星购入同源回元丹废渣与赤铁矿炭，严守单日一炉铁律萃出温醇的回元净膏；自用苦修之余，将石臼余泽调成去腐生肌药膏交林晚萤摊位代销，一月间稳稳攒下二十二块下品灵石。丹田气旋日益浑厚并顺遂推至炼气三层顶峰，但残缺口诀行气粗疏的弊病也随之浮现。"}, {"n": 44, "title": "炼气四层", "synopsis": "沈砚备齐清燥寒髓草汤压住经脉燥意，在暗窖内分三日服下回元净膏全力冲关，一举贯通周身支脉晋入炼气四层，神识外放陡然扩至七丈方圆！然而《青木引气篇》口诀止步于此，体内木火双杂灵气亟需正统五行功法统摄，手头二十八块灵石距万宝楼的《厚木蕴火诀》尚有七块缺口。沈砚正盘算加配一批润脉丸补足差额，深夜却收到林晚萤传来的示警纸鹤，得知摊上药散被一名身染奇毒的独臂凶徒重金包圆并强行探底。"}, {"n": 45, "title": "赤蟒旧怨", "synopsis": "沈砚见信即刻叫停所有清燥药散寄售，连夜施展敛息步绕道边棚向陈戍核实买主特征。陈戍听闻“独臂刀疤、肺络残留赤练蟒火毒”数语脸色骤寒，吐露此人正是八年前在云泽深处同探古矿洞时背刺全队、独吞半张矿图的外棚劫修头目葛彪，如今已修至炼气五层。葛彪显然从药散奇效猜出陈戍未死或坊内藏有高明药师，且已与怀恨林晚萤的丹砂阁贺掌柜暗通款曲。两人算清敌强我弱之势，当即定下藏踪反钓之策。"}, {"n": 46, "title": "狡窟布防", "synopsis": "为防葛彪顺着药气锁死槐阴巷真身，沈砚不动声色在东柳巷另租一间偏僻杂院充作假窝点，并在暗窖增挖断后石灰道；同时刮取青蚨烬炉内壁积存的燥火炉灰混入精铁砂，耗时五日煅成六枚专污护体灵光的“赤煞铁丸”。第三日午后，葛彪果真借丹砂阁眼线在南街暗放灰鼻寻药鼠嗅探药味，沈砚凭七丈神识提前察觉墙根鼠影，故意用沾有药渣余味的旧麻袋将寻药鼠引出坊市西棚界碑外的荒竹径，反把葛彪一伙的埋伏人数摸得一清二楚。"}, {"n": 47, "title": "夜径挡箭", "synopsis": "西棚界碑外的荒竹径暮雾四合，沈砚故意露出一角药篓试探敌踪，葛彪携两名炼气三层劫修悍然合围，暗处更有一枚淬毒的一阶上品“乌金破甲锥”悄无声息直射沈砚后心死穴！电光石火间，靠润脉丸压住八成肺毒的陈戍施展《敛息折苇步》自竹影斜刺掠出，挥厚背刀硬生生替沈砚撞偏致命破甲锥，震得虎口崩裂见血。沈砚趁机扬出赤砂障目散与赤煞铁丸，御玄铁短刃瞬杀一名盲眼匪修，随即扶住陈戍借浓雾果断退回坊内。"}, {"n": 48, "title": "残图交底", "synopsis": "退入槐阴巷敛雾小阵后，沈砚毫不吝惜取出纯净回元药膏替陈戍敷治震裂的右臂，全程绝口不探问破甲锥背后的矿洞隐秘。陈戍感念沈砚临危不弃与守界重诺，主动摸出贴身藏了八年的半截焦黄兽皮，道明当年猎妖队在云泽深处误入古修遗留的“赤火矿脉”坍塌洞口，内产高阶地火赤晶炭与伴生灵药，葛彪叛变仅抢走外围路线而陈戍记下了核心裂隙坐标。两人断定葛彪肺毒将发必会再设毒计，议定先补齐功法阵器再寻机除根。"}, {"n": 49, "title": "厚木蕴火", "synopsis": "沈砚变卖荒竹径战利品并结清林晚萤分来的秋集符利，凑齐三十八块下品灵石亲赴万宝楼一层，稳稳买下可修至炼气九层圆满的正统功法《厚木蕴火诀》。回窖闭关转修七日后，原本滞涩的驳杂灵力化作温润厚木气护脉、纯阳火气凝神，不仅彻底打通后续破境坦途，更将青蚨烬炉开炉时的燥火炉毒反噬天然化解三成，指尖控火丝运转如臂使指。沈砚出关添置辅药途经万宝楼外墙，一眼瞥见刚挂出的典当催赎告示。"}, {"n": 50, "title": "符阵合练", "synopsis": "林晚萤收到催赎榜后更添紧迫，又查知丹砂阁贺掌柜正暗中替葛彪筹措破禁器物，企图截断澄砂膏货源逼她弃赎符谱。沈砚冷静定策，当即拨出双份高纯澄砂凝露膏，助林晚萤闭门十日绘成一套一阶上品“迷雾困灵阵”四旗一盘；沈砚自己则借《厚木蕴火诀》纯阳火气反复提炼石臼炉煞，凝成三枚专爆内腑火毒的“赤炎煞火丸”。他与陈戍在东柳巷假院暗演困阵分割与合击步位，备足一击必杀的筹码。"}, {"n": 51, "title": "双重饵局", "synopsis": "葛彪故意通过灰市牙人放出独赴黑松岭采挖寒潭草的口风，实则重金请动丹砂阁两名炼气四层护院提前潜伏在岭上鹰愁崖，布下请君入瓮的杀局。沈砚生性谨慎从不轻信对手独行之言，提前一日与陈戍冒雪绕至黑松岭背坡，凭七丈神识与猎人追踪术从崖后新踩雪窝和三份水囊余温中一眼看破伏兵。沈砚当机立断将计就计，趁夜在鹰愁崖退路必经的葫芦涧窄口埋入迷雾困灵阵旗，并于干燥松针雪壳下铺妥硫铁炭火暗引。"}, {"n": 52, "title": "松岭困杀", "synopsis": "风雪黄昏，陈戍现身黑松岭谷口佯装寻迹中计，葛彪狞笑着率崖顶两名炼气四层护院衔尾追入葫芦涧窄道。待三人前后脱节踏入阵心，沈砚果断扣动迷雾困灵阵盘，丈许浓白阵雾轰然合拢，瞬间将冲在最前的葛彪与后方两名护院彻底割裂！沈砚凭七丈神识穿透白雾锁定敌踪，左手控火丝引燃雪下硫铁暗引烧乱敌阵，右手御玄铁短刃配合陈戍搏命快刀，短短十息便将两名失明惊惶的炼气四层护院斩于刀下；另一侧葛彪则狂喷精血强行破阵。"}, {"n": 53, "title": "焚彪得图", "synopsis": "面对破雾扑杀的炼气五层凶徒葛彪，沈砚毫不惜财逆催阵盘引爆两面阵旗，狂乱灵波瞬间缠滞葛彪的乌金破甲锥与护体灵光；趁葛彪旧伤肺经抽气凝滞的一瞬，沈砚袖底三枚赤炎煞火丸成品字形贯入其胸口轰然炸裂！霸道药火引爆赤练蟒宿毒，葛彪惨嚎半声便脏腑俱焚而亡。沈砚与陈戍迅速焚尸扬灰、抹平雪地斗法痕迹，从葛彪储物袋中清出二十六块下品灵石、乌金破甲锥、一瓶焦黑中品废丹及另外半张赤火矿脉兽皮残图。"}, {"n": 54, "title": "分赃定界", "synopsis": "秘密返坊休整后，沈砚依战前出力与损耗分毫不差结清战利：自己留用乌金破甲锥、中品废丹及十五块下品灵石，另拨六块灵石配一瓶润脉膏厚偿林晚萤损毁的两面阵旗；陈戍分得十一块灵石购入压伤寒髓散，亲手摹绘一份详尽的“赤火矿隙外围副图”交沈砚日后采炭备查，自己贴身收妥兽皮原图。另一边，丹砂阁贺掌柜久候葛彪与两名护院泥牛入海，惊惧暗处药师杀伐狠绝，自此龟缩南街大铺再不敢派人滋扰林晚萤摊位。"}, {"n": 55, "title": "迁居竹溪", "synopsis": "隆冬封山后坊市渐归安宁，沈砚手握三十余块灵石积蓄，深感西棚槐阴巷灵气稀薄已难支炼气中期修行，遂留槐阴巷空院作预警暗哨，另在中环竹溪巷租下带基础隔音禁制与地火暖灶的青石独院。他闭门十日以《厚木蕴火诀》灵火彻底炼化一阶上品乌金破甲锥充作杀手锏，又花八块灵石添置一面一阶中品玄龟铁木盾补齐防御短板；待安顿妥当清点葛彪遗留的那瓶中品废丹时，辨出其中三枚乃火属“赤髓丹”珍贵残渣。"}, {"n": 56, "title": "旋火试膏", "synopsis": "寻常赤铁矿炭火力不足以熔化中品赤髓丹废渣，强催又极易炸炉泄烟。沈砚不急于求成，对照《厚木蕴火诀》与《控火初解》在竹溪巷暗窖苦练一月“三叠旋火指”，反复测试青冈灵炭与赤铁矿炭的混配比例；历经十余次指腹燎泡与神识微调，终在不违背单日一炉铁律的前提下，稳稳从赤髓废渣中萃出药力倍增的琥珀色“赤髓净膏”。正当他准备配制冲关丹丸时，林晚萤摊位传来一桩以药易书的特殊询单。"}, {"n": 57, "title": "凝膏换录", "synopsis": "沈砚头戴遮面竹笠在茶棚内室会见散修老药师秦松年。秦松年早年服劣丹过多致经脉淤塞，急需毫无新丹毒的化瘀药膏疏通暗伤以冲击炼气七层，愿以毕生手抄的《百草凝膏录》抵换。沈砚细验书册无毒无暗记，分两批交付特调清燥化瘀膏，顺利换回这部详载十八道丹膏中和秘方及二阶“赤髓芝”等筑基辅药辨识要诀的实用典籍，正式由民间药徒蜕变为通晓修仙药理的散修丹膏师；秦松年试药见效后更善意透出坊市炭荒风声。"}, {"n": 58, "title": "炼气五层", "synopsis": "依仗《百草凝膏录》所载的寒温中和妙法，沈砚将赤髓净膏与百年苦竹芯调制成醇厚温和的赤髓润元丸，在竹溪巷石院挂牌闭关二十日。木火真气沿正统经络周天奔涌之下，丹田壁垒水到渠成轰然洞开，沈砚稳稳晋升炼气五层，神识一举扩张至十丈方圆！破境后他不仅能分心二用同时御使乌金破甲锥与玄铁短刃，操控青蚨烬炉开炉亦缩短至七成炷香而神识不疲。谁知开春出关刚透一口气，坊市矿炭全面断流的消息便迎头砸下。"}, {"n": 59, "title": "隔街避煞", "synopsis": "沈砚换上粗麻短褐赴南街炭行探查断供虚实，十丈神识刚扫过街角，竟迎面撞见昔日百草堂内坊执事周明远——此人借瞒报紫灰窑走水案脱责高升，如今已达炼气六层并奉命统管外坊地火资粮征调！沈砚心头微凛却面色如常，当即运转《敛息折苇步》微偻脊背混入挑夫人群，敛尽周身灵气，距周明远十步擦肩而过而未惹半分疑心，更敏锐嗅出周氏封箱中夹杂着云泽地下火脉特有的硫煞焦灰。沈砚深知明面炭行尽布周氏眼线，当即彻底断绝铺面购炭。"}, {"n": 60, "title": "春集筹谋", "synopsis": "为绕开周氏炭行卡脖子盘剥并筹措后续冲关资粮，沈砚依《百草凝膏录》赶制出一批专克春季山瘴的“清瘴拔毒膏”，在北门外猎妖散集上拒收灵砂、专向进山猎妖队直换未经抽税的野生“地火赤铁原石”，悄然重续暗窖萃膏循环，亦助林晚萤将赎谱积蓄推过六十五块灵石大关。暗处丹砂阁贺掌柜见状眼红，偷偷串联外坊富商符客准备在万宝楼竞拍日抬价坑害林晚萤；而沈砚当夜分拣换回的原石袋底时，却意外敲出了一块罕见的高阶伴生火铜。"}, {"n": 61, "title": "火铜辨脉", "synopsis": "沈砚对照《百草凝膏录》与《控火初解》细验原石芯部的暗金赤阳火铜，确认此铜唯有在地底火脉剧烈上涌处方能自然熔结，恰是炼制高阶火煞暗器的上佳外壳，也印证了陇西周氏强征矿炭必与云泽山腹地火异变有关。他携火铜碎屑暗访在边棚支摊修刀的老护院陈戍，两人对照赤火矿隙外围副图细辨矿纹走向，锁死这批原石出自距坊市四十里的野狐涧火石滩，定下避开大路进山摸底的计议。"}, {"n": 62, "title": "夜探火滩", "synopsis": "沈砚不冒进硬闯西门关卡，备齐清瘴药膏与敛雾符，趁弦月夜绕行荒僻的野狐涧潜至赤火矿隙最外缘的火石滩。凭借十丈神识避开毒瘴热泉，他在滚烫岩缝间顺利撬出两袋火力远胜寻常矿炭的赤铁晶炭及三块伴生赤阳火铜；探查间更发现岩壁钉着数根刻有周氏阵纹的测火铜桩，证实周氏丹师与阵师已在暗中监控地火压力。天色将明之际，沈砚及时收手抹去凿痕悄然撤离。"}, {"n": 63, "title": "晶炭萃元", "synopsis": "回到竹溪巷暗窖，沈砚以新获的赤铁晶炭搭配分批淘来的一阶上品培元丹废渣试炉。晶炭火力绵长纯净，令石臼在单日一炉的安全铁律下顺畅萃出金润无杂的培元净膏，炉烟燥气较往常大减。沈砚耗时一月边炼制清瘴药膏变现，边将净膏配成七枚培元润脉丸备作冲关之资，分润亦助林晚萤攒下八十二块灵石；然百日赎谱期限逼近，急于凑齐缺口的林晚萤动了涉险接私活的念头。"}, {"n": 64, "title": "炼气六层", "synopsis": "沈砚深知林晚萤正面搏杀薄弱、一旦在城外折损将断绝自身符阵臂助，当即拍板待自己出关便预支十五块灵石抵扣后续符阵定金，稳住她焦躁冒进的心神。随后沈砚锁紧竹溪巷闭关十日，逐枚服下培元润脉丸运转《厚木蕴火诀》，木火真气一举冲开第六道灵脉关隘，正式晋升炼气六层，神识覆盖达十二丈！正当他如约携灵石出院助林晚萤赎谱时，丹砂阁贺掌柜勾结万宝楼内鬼设下的加价毒计已然发作。"}, {"n": 65, "title": "浮契验伪", "synopsis": "骤逢三十块灵石的讹诈息钱，林晚萤险些失态变卖祖传符笔进楼理论。沈砚沉声将她按在茶室，细嗅她花碎砂抄拓回来的附契墨迹与印泥样本，敏锐辨出祖父私印虽真，末尾加注的托管息款却掺有丹砂阁近半年才改用的松烟赤砂！结合陈戍从外棚探回的银钱流向，两人彻底摸清丹砂阁贺掌柜买通万宝楼外柜钱执事卡死赎期、企图在五日后内部小拍上低价吞下《云篆符解》的算盘。"}, {"n": 66, "title": "双线投饵", "synopsis": "沈砚算准若无高层主持公道，钱执事必会捂盖子偏袒贺掌柜，自己亦绝不肯抛头露面结怨大铺。他先用半滴赤髓净膏调出一小瓶极品澄砂膏，附匿名信指明典当附契朱砂有异，精准投递给素与钱执事不睦的万宝楼炼气七层首席鉴师鲁大师；随后又借灰市货郎故意向丹砂阁死对头“松烟斋”透出《云篆符解》暗藏二阶灵墨配方的风声，迫使势在必得的贺掌柜高息拆借灵石加码备战。"}, {"n": 67, "title": "当庭洗砂", "synopsis": "百日大限正午，万宝楼外院预展堂商客云集，钱执事正欲宣布林家违约将《云篆符解》移入竞价盘。林晚萤依沈砚所授机宜不吵不闹，当众拍出两块灵石鉴证费，恭请首席鉴师鲁大师以洗砂灵液当庭核验附契年份！众目睽睽及松烟斋掌柜见证下，附契末行浮出新鲜松烟赤砂油沫，假账铁证如山。鲁大师震怒之下为保万宝楼金字招牌，当场革除钱执事、免去全部讹诈息款，准林晚萤以百枚灵石（含沈砚所借十五块）堂堂正正赎回半卷《云篆符解》，并将丹砂阁永久踢出供货名录。"}, {"n": 68, "title": "枫沟伏杀", "synopsis": "沈砚早料到贺掌柜断了财路又背负高利灵石债，必会在坊外铤而走险，且贺掌柜只知林晚萤摊位而不知沈砚真容。沈砚让林晚萤花灵石住进万宝楼安全客舍避风头，另雇脚夫背空符匣往西棚界外走一遭作饵。果不其然，贺掌柜亲率两名苍岩岭炼气六层劫修尾随至界碑三里外的枫叶沟扑杀信使，一头撞进沈砚与陈戍预布的迷雾困灵阵！沈砚双御乌金破甲锥与玄铁短刃，配合两枚赤炎煞火丸正面轰穿贺掌柜护体灵光，与陈戍刀光呼应将三敌尽数灭口毁迹。"}, {"n": 69, "title": "云篆护院", "synopsis": "贺掌柜失踪令丹砂阁树倒猢狲散，外棚再无掣肘。沈砚回院与陈戍公道分妥灵石战利品，随后接应林晚萤密会验谱：赎回的玉简确系林氏真传《云篆符解》上半卷，详载云篆分水笔意与高阶隐匿困禁之道，唯下半卷杀阵篇早年遗落云泽深山。林晚萤感念沈砚借石设局大恩，先还十块灵石，并闭关半月融会新谱，亲手替沈砚竹溪巷暗窖与院墙升级布下准二阶“小云篆敛息阵”，纵使炼气九层修士贴墙而过亦难察炉火分毫。"}, {"n": 70, "title": "煞眼隐忧", "synopsis": "沈砚细研周鹤年密单所列的“引血锁脉阵旗”规制，再翻检《百草凝膏录》中关于地肺火脉潮汐与伴生二阶筑基辅药“赤髓芝”的记载，豁然贯通全局：云泽山地下火脉年内必有大裂变，陇西周氏囤炭制旗，分明是要在裂谷开启时拿外棚散修充当平息“火脉煞眼”的活体耗材！危机之中亦藏叩开大宗山门的机缘，沈砚深知炼气六层在混战中仍嫌单薄，决心先冲破炼气七层后期门槛，再赴赤火矿隙搜集高阶火引炼制保命杀器。"}, {"n": 71, "title": "破境七层", "synopsis": "进山涉险前必先厚植根本，沈砚拿出枫叶沟缴获的灵石积蓄，分批自猎妖客手中收齐一阶上品“赤元丹”废渣与清心寒草。在小云篆敛息阵密不透风的遮护下，他每日一炉精萃赤元净膏调丸服食，运转《厚木蕴火诀》连冲三十六个大周天，终于撞碎中后期壁垒，一举晋升炼气七层！踏入炼气后期令他丹田木火真气凝练近倍，神识外放直达十五丈方圆；刚出关透气，陈戍期盼已久的救命寒药线索便浮出水面。"}, {"n": 72, "title": "寒髓酬信", "synopsis": "念及陈戍数度守密挡箭之谊，沈砚暗查确认周氏丹童只收普通寒草，当即请林晚萤持万宝楼清白客牌花三十二块灵石买下那份烈性“玉露寒髓散”。因寒髓散药力霸道易冻裂伤肺，沈砚特意融进半滴温润净灵药膏调和药性，亲手助陈戍行功化瘀。陈戍连呕三口积郁八年的紫黑毒块，折磨半生的肺经火毒死根一朝尽除，寿元大限之忧顿解；感念之下，陈戍将早年亲历的焦鸦矿隙地火潮汐退落规律倾囊相告。"}, {"n": 73, "title": "潜入矿隙", "synopsis": "十五望日夜，沈砚贴妥林晚萤新制的云篆敛雾符与赤阳破障符，施展《敛息折苇步》绕过西山周氏明哨，趁地火退潮的三个时辰窗口潜入焦鸦矿隙。矿道内赤岩灼人、毒烟暗伏，沈砚仗十五丈神识提前避开两窝火甲虫，顺着陈戍指点的偏僻风口攀上中段晶岩台，用乌金破甲锥撬下六块精纯赤阳火铜，并以寒玉铁匣盛满岩芯渗出的“地肺赤煞火引”与伴生赤火灵炭，备齐淬炼杀手锏的核心主材。"}, {"n": 74, "title": "矿道避蟒", "synopsis": "沈砚当机立断激活云篆敛雾符缩入上方排风石缝，十五丈神识清晰映出下方变故：炼气七层散修“烈山客”率两名同伙贪挖深处火铜，竟莽撞引爆破石符惊醒了冬眠的准二阶赤练老蟒！巨蟒狂暴绞杀二匪，烈山客狼狈朝沈砚所在的排风道攀逃企图引祸。沈砚眼神冷冽，指尖悄无声息弹出一蓬混着矿道硫灰的赤砂障目散糊住烈山客双目，令其失足坠回蟒口，自己则顺手采走风口伴生的两株一阶顶峰“赤纹火芝”，迅速沿暗烟囱遁出重围。"}, {"n": 75, "title": "试炼煞珠", "synopsis": "回到竹溪巷小云篆敛息阵内，沈砚着手试炼足以威胁筑基初期或瞬杀炼气圆满的保命底牌“二阶赤阳火煞珠”：他将赤阳火铜掏成薄壁圆壳，填入青蚨烬炉积攒的燥烈炉灰、地肺赤煞火引及赤纹火芝汁液，再以炼气七层三叠旋火指层层压缩封口。前两炉皆因火煞狂暴震裂铜壳、灼焦衣袖，沈砚停手两日服寒草排尽肺燥，改用澄砂灵胶涂抹铜壳内壁缓冲，终在第九夜稳稳封成第一枚暗红欲滴的二阶赤阳火煞珠！"}, {"n": 76, "title": "铁券悬榜", "synopsis": "沈砚换上灰布散修袍赴坊市中心广场观榜：青芜宗丹鼎峰与符阵峰筑基初期巡察使陆执事亲临云泽，悬出三枚免试血擂、直入外门百艺堂的“百艺举荐铁券”。然其中两枚推荐权由东道主陇西周氏把持，周氏当场宣布凡报名散修须登记真实灵窍修为，并于下月随队“协理地火稳脉”；仅第三枚由陆巡使直掌，专授献上二阶地火奇珍或百艺绝活之辈。沈砚一眼看穿周氏征召实为送死填坑，暗定夺取赤髓芝与铁券的双重方略。"}, {"n": 77, "title": "藏锋纳课", "synopsis": "面对周明远以“稳脉火课”为名半价强征十张避火符的刁难，林晚萤谨记与沈砚的藏拙默契，面色冷淡地交出十张未掺澄砂凝露膏的寻常一阶中品符箓打发对方，未引起周氏对灵砂纯度的怀疑。当夜沈砚与林晚萤果断关停大半明面寄售，全面转入战前潜修：林晚萤凭前期分成积蓄冲破炼气六层，专心赶制便携式“云篆迷雾困阵”；同时通过老主顾石猛猎妖团的进山探子，替沈砚带回了西山南麓地壳新裂的隐秘情报。"}, {"n": 78, "title": "二探矿隙", "synopsis": "沈砚从兽皮草图描述的赤霞药香联想到《百草凝膏录》所载的赤髓芝伴生异兆，遂备足寒膏与云篆敛雾符二探赤火矿隙南侧暗沟。因地底岩浆南移，赤练老蟒已潜往更深地肺，暗沟岩壁恰好震裂出一处百年前散修丹师遗弃的封灰石坑，内藏十二斤同源一阶顶峰“烈阳丹”焦渣及充沛地肺赤煞火引！沈砚细查岩缝菌丝，确认真正的二阶赤髓芝正孕育在十里外的云泽地火裂谷主断层下；返程途中，他更远远撞见了周氏真正的坐镇杀招。"}, {"n": 79, "title": "闭关八层", "synopsis": "隔着半里山脊感受到的那缕筑基初期灵压令沈砚凛然警醒，回竹溪巷后当即全开小云篆敛息阵谢客闭关。整整三十六日，他严守单日一炉铁律，将十二斤一阶顶峰烈阳丹废渣逐日萃成霸道纯正的烈阳净膏，辅以《百草凝膏录》冰莲心汤化解燥烈火毒，推动《厚木蕴火诀》浩荡冲开第八重经脉关窍，修为水到渠成晋入炼气八层，神识覆盖十八丈，更趁势封妥第二枚二阶赤阳火煞珠！出关刹那，天地异变已迫在眉睫。"}, {"n": 80, "title": "裂谷前夜", "synopsis": "地底闷雷乃云泽地火裂谷表层岩壳崩裂的先兆，整座云泽散修坊市瞬间沸反盈天：避火符器与疗伤丹散一夜翻倍，贪婪散修纷纷摩拳擦掌欲进山撞大运，陇西周氏则封锁正山口并悬出重金招募五十名炼气后期散修充当“开道先锋”。沈砚丝毫不为重赏所动，趁高价将积存的一阶清燥润脉丸尽数抛售换回六十块下品灵石，备足冲击炼气九层圆满的资粮；当夜他约陈戍与林晚萤在槐阴巷旧院敲定紧急撤离暗道，却意外撞破周氏暗车在山脚布饵的鬼祟行径。"}, {"n": 81, "title": "紫饵辨机", "synopsis": "待周氏押车巡卫撤离山道后，沈砚借夜雾与《敛息折苇步》潜至西棚断层风口，用银针挑取少许暗紫金星废渣回院细验。结合《百草凝膏录》与昔日紫灰窑见闻，他迅速看透周鹤年的毒辣算盘：将混有腥甜兽血的紫煞丹灰洒满正山口风道，既能引诱地底火蜥群狂暴冲击散修开道先锋，又能借死者精血与紫煞中和主断层狂暴火气，替周氏筑基执事铺平采药坦途。沈砚立将此险情秘告陈戍与林晚萤，彻底否决随散修大流走正山口的念头。"}, {"n": 82, "title": "枯涧寻脉", "synopsis": "为寻一条避开正山口紫煞
