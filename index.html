在纳贡院门坎青石上砸出一串清脆轻响。\n\n伞下那袭内门青玉云纹执事道袍干爽挺括，雨水滑过衣摆纷纷弹落，连一星泥点都近不得身。\n\n堂外泥沟里，断了双腿的赵怀恩双手拼命捂紧嘴巴，眼珠子凸得快掉进泥汤，连牙齿打战的咯咯声都硬生生咽回肚里。\n\n大堂内却还没人瞧见廊下的死狗。\n\n主位太师椅后，冯保山正端着紫砂茶壶吹浮沫，冷不丁瞥见门口跨进来一袭水火不侵的内门青玉道袍，还有腰间那枚唯有开脉执事方能佩挂的赤铜巡脉官印，绿豆眼猛地一跳！\n\n伞沿压得略低，遮住了来人眉眼。\n\n冯保山压根没往外门杂役身上想，只当是哪位路过前山避雨的内门执事师叔，肥胖身躯展现出惊人的灵活，“噌”地搁下茶壶，堆起满脸褶子哈腰迎出公案：\n\n“哎哟！外头雨急风大，不知是内门哪一房的执事师叔大驾光临，晚辈冯保山有失远迎！”\n\n一边点头哈腰作揖，冯保山还不忘扭头冲着发愣的庞文禄瞪眼怒喝：\n\n“没眼力见的蠢奴才！还不快给师叔看最好的雨前灵茶！”\n\n“还有案上那张红票，赶紧差巡山队拿去后山，把陈长庚那个抗捐逃命的小杂种给老子剥皮抽筋抓回来，别搁这儿污了内门师叔的清听！”\n\n“是是是！小的这就给师叔奉茶，这就发签抓那小畜生！”\n\n庞文禄忙不迭哈着虾米腰，双手捧起一盏刚冲好的滚烫紫砂新茶，满脸谄笑小跑着递到青竹伞前：\n\n“师叔您老先润润嗓子——”\n\n修长手指轻轻一搭伞柄。\n\n“咔。”\n\n三十六骨青竹油纸伞缓缓收拢抬起，露出一张平静冷淡、年轻得过分的冷峻面庞。\n\n陈长庚垂眸看着捧茶僵在面前的庞文禄，又抬眼扫向三步外满脸堆笑的冯保山，嗓音平淡温和：\n\n“不必劳烦巡山队冒雨跑后山了。”\n\n“陈某人就在堂上站着，冯管事打算先剥哪张皮，抽哪根筋？”\n\n“轰——！！”\n\n话音落下的刹那，一股渊渟岳峙、再无丝毫遮掩的开脉境周天灵压自陈长庚体内倾泻而出，如万钧铁山重重压满整座纳贡院公堂！\n\n梁柱吱呀乱颤，堂外狂风骤雨竟被这股霸道煞罡硬生生逼退三尺！\n\n“啊——！！”\n\n捧茶的庞文禄首当其冲，魂儿当场吓飞了九成，双手剧烈一抖！\n\n“啪嚓！”\n\n滚烫的紫砂茶盏摔在青砖地上炸成粉碎，滚茶溅了一裤裆，庞文禄两腿面条似地一软，“噗通”瘫进泥水茶渍里，仰头看着这张五日前还隔窗泼了他一头臭铅灰、咳血讨借灵石的病弱脸庞，舌头瞬间拧成了麻花：\n\n“陈、陈长庚？！鬼……不对，开脉灵压？！”\n\n客椅上正拍大腿闹退钱的胖杂役蔡金满更是白眼一翻，“咕噜”一声从椅子上滚到桌底，双手紧紧捂住结满黑痂的肿嘴，脑门砸得青砖砰砰作响！\n\n两侧十余名外门书办与皂衣打手连一息都没撑住，手里的铁尺水火棍哗啦掉了一地，齐刷刷双膝跪倒，大气都不敢喘一口！\n\n公案之前，冯保山脸上的谄媚笑容一寸寸僵硬、碎裂。\n\n他双膝猛地一软，肥硕身躯晃了两晃，十指用尽全力抠进楠木公案桌角才没当场栽倒在地！\n\n“你……你是陈长庚？！”\n\n冯保山瞳孔缩成针尖，浑浊老眼里全是荒谬绝伦的惊骇，喉咙里发出破风箱般的倒抽凉气声：\n\n“不可能……绝对不可能！你去年入冬入宗验资明明是九窍蒙尘、火毒淤肺的废底子，怎么可能贯通周天仙脉？！”\n\n陈长庚没理会他的失态，撑着收拢的油纸伞，迈步从冯保山身侧擦肩而过。\n\n擦肩的瞬间，一缕凝若暗金实质的地火煞罡掠过冯保山官袍袖口，震得这位通窍八窍巅峰的外门管事左半边身子麻木冰凉，冷汗“唰”地浸透了三层肥膘！\n\n做不得假！\n\n这青玉道袍，这赤铜巡脉印，还有这股比寻常内门老执事还要凝练浑厚的周天真气，一丝一毫都做不得假！\n\n陈长庚径直走到主位那张铺着虎皮锦垫的太师椅前，坦然撩袍落座。\n\n他伸出两根手指，拈起公案正中那张朱砂墨迹未干的外门海捕红票，垂眸念了一遍：\n\n“丙字房贱役陈长庚，抗捐潜逃，形同叛宗，见者当场格杀勿论。”\n\n陈长庚抬起眼皮，看向面白如纸的冯保山：“冯管事好大的官威。”\n\n“误会！天大的误会啊陈师叔！！”\n\n冯保山到底是外门混迹二十年的老油条，生死关头狠狠一咬舌尖，顾不得官架子，弓着胖腰转过身，满脸堆起比哭还难看的干笑：\n\n“晚辈昨夜偶感风寒没看内门晨报，全是底下庞文禄这狗奴才瞎报军情！晚辈要知道师叔您老在丙字房闭关冲脉，借晚辈十个胆子也不敢动这支朱笔啊！”\n\n“再、再说了！”\n\n冯保山一边拿袖子狂擦额头冷汗，一边硬着头皮往脸上贴金攀交情：\n\n“去年入冬师叔持孙丹师荐信入宗，可是晚辈力排众议，特意替师叔挑了后山丙字废渣房那处无人打扰的清静福地！没有那间清静院子，师叔哪能安心潜修一飞冲天？咱们这可是实打实的香火旧情呐！”\n\n瘫在泥水里的庞文禄听见冯保山把黑锅全扣自己头上，吓得亡魂皆冒，手脚乱蹬着哭喊道：“师叔饶命！十五块灵石卖房和十块修炉捐全是冯管事逼小的办的，小的只拿了一块碎灵石跑腿钱啊！”\n\n“闭嘴！你个吃里扒外的狗东西！”冯保山气得浑身肥肉乱颤，恨不得一脚踹碎庞文禄的嘴。\n\n太师椅上，陈长庚静静听着叔侄狗咬狗，指尖轻轻将那张盖着纳贡院官印的格杀红票折成方寸大小，慢条斯理揣进自己怀里。\n\n看到红票进了陈长庚衣袖，冯保山眼皮狂跳，心脏瞬间提到了嗓子眼！\n\n“香火旧情，陈某自然记得一清二楚。”\n\n陈长庚端起案头那把冯保山盘得油亮包浆的紫砂茶壶，掀开壶盖看了一眼，把冯保山当年眯眼刮油皮的原话，一字不差奉还回去：\n\n“去年入冬入宗，补缺买路三十枚下品灵石，外加宗门发给新人的十枚安家灵石，冯管事按‘宗门老例’替陈某扣下整整四十枚折作验资火耗。”\n\n“五日前大泽归来，冯管事又收了蔡金满十五枚灵石私卖公房，逼陈某今日交十枚修炉抚恤捐，交不出便锁去黑水死矿记你一辈子人情。”\n\n陈长庚顿了顿，目光平静地落在冯保山惨白的胖脸上：\n\n“再加上方才这张越权格杀在册内门执事的朱印红票——冯管事掌了这么多年秤杆，自己算算，这几桩账摞在一块儿，按宗门铁律该折几成火耗？”\n\n每一句话都轻描淡写，却像一柄柄烧红的铁锤，砸得冯保山胸口发闷、两腿筛糠！\n\n桌底下的蔡金满吓得直翻白眼，哭丧着嗓子拼命摆手：“陈师叔明鉴！小的猪油蒙心，那丙字房小的再也不敢要了，那十五块灵石小的不要了，全孝敬师叔买茶喝！”\n\n“你的脏钱，自己找冯管事讨去。”陈长庚看都没看蔡金满一眼。\n\n冯保山嘴唇哆嗦得像秋风里的落叶，艰难咽了口唾沫，试探着弯腰低声道：\n\n“陈、陈师叔息怒！都是晚辈瞎了狗眼不会办事！当年那四十块灵石晚辈一直替师叔攒着呢，晚辈这就回屋取四十……不，五十块下品灵石孝敬师叔压惊，咱们把那张红票烧了揭过这一页，您看成么？”\n\n五十块就想买一条命？\n\n陈长庚笑了笑，没有再多费一句口舌，“啪”地将那把紫砂茶壶轻轻放回公案正中。\n\n“轰隆——！！”\n\n一道惨白惊雷恰在堂外雨幕炸响，映得满堂鬼脸森白。\n\n陈长庚起身撑开油纸伞，居高临下扫过汗如雨下的冯保山，声音清冷得不带一丝烟火气：\n\n“宗门规矩，以下犯上、克扣内门执事资粮者，怎么赔才能免进刑律堂，冯管事比我熟。”\n\n“明日日落之前，按宗门老例把账送到纳贡院牌坊外。少一枚灵石，陈某便拿着这张红票，亲自去刑律堂请许镇岳长老替你拨算盘。”\n\n话落，青玉道袍拂过门槛，踏入漫天滂沱大雨之中，转瞬远去。\n\n大堂内沉寂了足足三息。\n\n“噗通！”\n\n冯保山再也撑不住一身肥肉，一屁股跌坐在满地碎瓷热茶里，面无人色！"}, {"n": 98, "title": "跪雨称叔", "body": "二月十二，酉时初刻。\n\n暴雨非但没歇，反倒借着山风愈发狂猛，砸得内门西麓世家宅院的乌瓦噼啪乱响。\n\n朱漆兽首大门外，冯保山连雨伞都被狂风刮翻了骨子，浑身淋得精湿，怀里死死抱着一只缠红绸的百年老山参锦盒，跌跌撞撞扑上石阶拍响铜环：\n\n“曹旺老哥！劳驾通禀曹执事一声，外门纳贡院冯保山有十万火急的塌天大事求见老爷！”\n\n按宗门惩戒铁律，外门管事私扣资粮又妄签红票拘拿内门执事，若想苦主撤状不送刑律堂，必须当众执晚辈礼、按吞没原数三倍赔清！\n\n当年三十枚买路石加十枚安家石便是四十枚，三倍就是整整一百二十枚完整下品灵石！\n\n那可是他冯保山刮了五年地皮、准备明年送真窍幼子进内门拜师的全部棺材本！\n\n回屋把账一算，冯保山心疼得直抽冷气，怎么也舍不得把老底全割出去——陈长庚不过是个刚撞大运破境的泥腿子，只要旧靠山曹敬塘肯出面递句话压一压，顶多吐个四五十块灵石就能把事儿抹平！\n\n“吱呀——”\n\n侧门拉开一条缝，独眼老苍头曹旺探出半张阴沉老脸，看清泥猴似的冯保山，眉头一皱：\n\n“冯胖子？我家老爷这几日正为少主的事心烦闭门谢客，你半夜淋着雨跑来嚎什么丧？”\n\n冯保山如同见了亲爹，连忙把老山参锦盒往门缝里塞，哭丧着脸压低嗓门急道：\n\n“曹老哥救命啊！还不是古盐墟活着回来的那个丙字房杂役陈长庚！那小兔崽子不知走了什么邪门狗屎运，今早竟冲开仙脉混了个巡脉执事，午时跑来纳贡院拿腔作势，讹老弟我明日日落前赔他三倍灵石！”\n\n“你也知道老弟每年没少孝敬曹爷，求曹爷出面敲打敲打那新嫩小子，给他三十块灵石打发了——”\n\n“你说谁？！！陈长庚陈执事？！”\n\n曹旺原本漫不经心的独眼瞬间瞪得溜圆，像是被毒蛇咬了一口般猛地缩回手，那只百年山参锦盒“啪”地摔在石阶积水里！\n\n旁人不知道底细，他曹旺昨夜可是亲眼瞧见自家开脉境的老爷在废渣谷口被人一拳震裂虎口、吓得连夜抹脚印的！\n\n上午老爷从库房回来更是严令阖府上下：那陈长庚背后站着执法堂深不可测的老怪物撑腰，谁敢招惹姓陈的半句，直接打断四肢扔进大泽喂鱼！\n\n“你还敢签红票惹陈执事？！”\n\n曹旺吓得头皮发炸，转身一把抄起门后手臂粗的包铁水火棍，推开侧门照着冯保山肥厚肩头狠狠一棍砸了下去！\n\n“砰！！”\n\n“哎哟——！曹老哥你打我作甚？！”冯保山惨叫一声，整个人滚下七八级湿滑石阶，摔得满嘴泥血！\n\n“打的就是你这条害人精老狗！”\n\n曹旺提着铁棍站在廊檐下破口大骂，一脚把山参锦盒踢出三丈远：\n\n“我家老爷跟陈执事乃是平辈论交的过命交情！你个外门刮地皮的蠢奴才瞎了狗眼去拔老虎须，自己找死别拉上我曹家垫背！”\n\n“滚！立刻给老子滚！再敢往曹府门前凑半步，老子现在就绑了你送去刑律堂请功！”\n\n“哐当！”\n\n朱漆侧门重重摔死，落了双重大闩！\n\n冰冷雨水兜头浇在冯保山血肉模糊的额角上，他趴在泥水坑里，浑身最后一丝热乎气儿彻底冻成了冰渣子。\n\n连内门最护短霸道的曹敬塘，听见陈长庚三个字都吓得拿棍子往外轰人？！\n\n这一刻，在这外门作威作福半辈子的冯大管事，终于切肤尝到了“境界定辈分、铁律碾蝼蚁”是什么滋味！\n\n明日日落前交不足一百二十枚灵石，红票一进刑律堂，许镇岳一句话就能废去他八窍修为锁进黑水死矿挖一辈子毒煤，连他那十岁的真窍幼子都得贬为罪役永世不得翻身！\n\n“报应……全是报应啊……”\n\n冯保山牙齿咬出了血，连滚带爬从泥坑里爬起来，再不敢存哪怕半星报复与侥幸念头。\n\n那一夜，外门南街当铺与灵茶牙行灯火未熄。\n\n冯保山顶着狂风暴雨挨家磕头求爷爷告奶奶，将自己经营十年、每年稳产三十斤灵茶的半山茶庄地契按四成死价当场画押贱卖，又卖光了满屋紫砂灵器，最后哆嗦着手撬开卧房床底三层铁匣，把替幼子攒了整整五年的九十枚私蓄灵石一粒不剩全倒了出来！\n\n东拼西凑，倾家荡产，终于在五更梆子敲响前，凑齐了整整一百二十枚完整下品灵石！\n\n次日，二月十三，卯初。\n\n天色尚是一片铁青晦暗，春寒冷雨淅淅沥沥下个不停。\n\n冯保山哪敢等到日落？\n\n天还没亮透，他便褪去了往日威风凛凛的绸缎管事袍，只穿一身单薄灰布短褐，散去护体真气，双手高高捧着一只敞开盖子的楠木锦盒，笔直跪在了外门纳贡院黑漆大牌坊外的烂泥水洼里！\n\n在他身后三步，书办庞文禄也早已吓得跟过来，脑袋埋进泥浆里抖成一团。\n\n“铛、铛、铛——”\n\n卯时外门晨钟敲响，数百名披着蓑衣赶来纳贡院点卯交课的外门杂役与苦力陆陆续续聚拢过来。\n\n看清牌坊泥水里端端正正跪着的那坨肥胖人影，整条长街瞬间炸开了锅！\n\n“我没眼花吧？！泥水里跪着那人……是冯大管事？！”\n\n“连紫砂壶都没拿，旁边那是庞书办！老天爷开眼了，外门哪个活祖宗能叫这吃人不吐骨头的冯扒皮五更天跪大街？！”\n\n几名早年在冯保山手里吃过亏的杂役瞪大眼睛，连大气都不敢大声喘，纷纷缩在街边屋檐下翘首张望。\n\n就在数百道惊疑震撼的目光聚焦之下——\n\n连接内门山道的青石长阶尽头，一柄三十六骨青竹油纸伞破开迷蒙雨雾，不疾不徐地拾级而下。\n\n陈长庚一袭青玉云纹执事道袍纤尘不染，腰悬赤铜巡脉官印，神色淡漠地停在了纳贡院牌坊飞檐三步之外。\n\n“是丙字房的陈长庚？！天呐，他身上穿的是内门开脉执事青袍！！”\n\n人群里瞬间爆出一片倒吸凉气的惊呼！\n\n前天还被传染了古墟腐肺尸瘟钉死在屋里的九窍蒙尘病杂役，一转眼竟成了高高在上的开脉境执事师叔？！\n\n泥水之中，跪得双腿早已麻木刺痛的冯保山一见那双青云道靴停在面前，浑身肥肉剧烈一颤！\n\n当着整条街数百名昔日被他呼来喝去的外门杂役的面，冯保山把楠木锦盒往膝前青石上一顿，腾出双手，左右开弓照着自己那张油光水滑的胖脸狠狠抽了下去！\n\n“啪！！啪！！啪！！”\n\n没有留半分手劲，每一巴掌都脆响刺耳，十几记耳光抽完，冯保山双颊高高肿起如发面猪头，两颗带血的后槽牙混着血水吐进泥里！\n\n他双手重新抓起盛满一百二十枚莹白灵石的楠木锦盒高举过顶，额头“咚”地一声死死磕进冰冷泥浆，带着哭腔颤声高呼：\n\n“晚辈冯保山有眼无珠、猪油蒙心！当年私吞师叔四十枚资粮，昨日又狂悖无状冲撞尊驾，今按宗门铁律三倍奉还一百二十枚下品灵石——求陈师叔收账饶命！！”\n\n整条雨街鸦雀无声，只剩雨水敲打蓑衣的沙沙轻响。\n\n陈长庚撑着伞，低头俯视着泥水里肿脸磕头的冯保山，眼神没有半分怜悯，也没有小人得志的狂态。\n\n袖袍微拂，一缕周天真气卷过锦盒。\n\n一百二十枚成色十足的完整下品灵石分毫不差，尽数飞入腰间青云储物袋——加上原有的百八十枚，他手头的完整下品灵石瞬间突破三百大关，稳稳停在三百枚整！\n\n陈长庚摸出怀里那张折好的朱砂格杀红票，指尖地火煞罡一吐，“噗”地化作一撮飞灰飘落泥水：\n\n“账清了。”\n\n“谢陈师叔不杀之恩！谢陈师叔大恩！！”冯保山劫后余生，瘫在泥里涕泪横流地连磕三个响头。\n\n陈长庚不再看他一眼，迈步跨过牌坊之际，目光随意掠过街角屋檐下一名拄着拐、平日替废渣谷背煤渣从不坑害新人的老实残役曲老五，随手屈指弹出一枚巡脉堂协理木签：\n\n“后山丙字废渣房空着也是荒废，今日起拨给曲老五看炉养老，纳贡院按月照发双份炭贴。冯管事可有异议？”\n\n曲老五捧着木签呆若木鸡，旋即激动得跪地狂磕头；泥水里的冯保山更是把头摇成拨浪鼓，嘶声表忠心：“绝无异议！晚辈每月亲自给曲老哥送炭贴上门，少一文钱叫晚辈天打雷劈！”\n\n陈长庚微微颔首，撑着青竹伞转身踏上回返内门的山道。\n\n刚走出十余步，半山浓重雨幕突然被一道凄厉破空尖啸悍然撕裂！\n\n“咻——啪！”\n\n一道裹着火漆封印、尾端插着三寸腥红赤羽的加急军情铜管自巡脉堂方向化作赤电破雨射来，陈长庚左手闪电探出，五指稳稳将其扣在了掌心！"}, {"n": 99, "title": "故泽听雨", "body": "回到东麓丁字三号执事洞府，陈长庚震碎赤羽铜管外封，抽出一卷还带着血腥火药味的巡脉堂军情急报。\n\n急报只有寥寥数行：三宗交界的“断界黑石峪”外围两座哨卡昨夜遭玄煞门游骑袭扰，命新任巡脉执事陈长庚不必等满十日，提前于二月十八卯时赶赴黑石峪驻地接印布防，随函附有一卷黑石峪矿道海捕详图。\n\n“从十日压到六日，二月十八破晓动身……器堂那位龚执事催命倒是催得紧。”\n\n陈长庚将那卷厚实的海捕详图暂搁石案，指尖敲了敲膝头。\n\n眼下是二月十三，距二月十八赴任尚余整四日工夫。\n\n腰间储物袋虽躺着整整三百枚完整下品灵石，可断界黑石峪连折两任执事，光靠库房发的制式飞刃灵盾绝不够稳妥——瓮里三十六只一阶巅峰嗜铁煞甲虫急需催化繁衍的奇珍铜髓，手里耗空的过载火器也得补齐百枚规模！\n\n宗门内门库房耳目众多，一旦大批采买虫材火药必落入器堂眼线；唯有借巡查南麓水脉的职权顺道去一趟黑石坊市，再把乌卤盐场那点凡俗旧因果一并利落切断，方能毫无挂碍地杀奔边荒！\n\n次日二月十四，辰时，细雨如丝。\n\n百里外的沧溟大泽水汽苍茫，昔日黑烟滚滚的乌卤盐场在春雨洗刷下显得格外破败低矮。\n\n盐场外围泥泞官道的木栅门前，一名头发花白、右腿微跛的独眼老杂役正披着烂麻袋，吃力地拿铁铲往车辙坑里填碎煤渣。\n\n正是当年在丙字灶房一手遮天、纵容内侄周禄压秤逼学徒下盲井的正把头周大昌！\n\n自打去年秋末巡灶丹师孙奉先炸炉身亡、新丹师走马上任清洗旧账，周大昌不仅被撸掉肥差罚去刮了数月毒盐蚀跛了一条腿，如今更沦为挣一两银子度日的看门老朽，苍老得连腰杆都直不起来。\n\n“嗡——”\n\n高天细雨云层间，一道凝练青光破开水雾，悄无声息自盐场上空一掠而过。\n\n听到半空传来的御器破风轻鸣，周大昌浑身一激灵，手里的铁铲“哐当”扔进泥水，连滚带爬跪趴在烂泥坑里，把花白脑袋紧紧贴在泥地里，敬畏惶恐地扯嗓子高喊：\n\n“小的恭送云泽宗内门仙师老爷——祝仙师老爷仙福永享，长生不老！！”\n\n直到天边那抹青光彻底隐入雨雾，周大昌才哆哆嗦嗦爬起身，抹了一把老脸上的泥水，做梦也想不到云端那位连正眼都懒得瞧他一下的青袍仙师，便是当年被他克扣盐钱的十六岁少年。\n\n青鳞灵盾悬停在盐场西镇边缘的竹林外。\n\n陈长庚收起灵盾，散去周身灵光，撑着素面油纸伞缓步走到镇尾一座干净简陋的泥墙茅草院外。\n\n院内灶房飘出淡淡艾草暖烟，早先曾暗中塞给他烤饼、教他看青烟辨火毒的老灶匠葛老栓身子骨尚硬朗，苍老却温和的嗓音隔着竹篱笆清晰传来：\n\n“栓柱儿，眼睛盯紧卤锅边沿！火苗一发青就赶紧撤两根湿柴，宁可少熬二两盐挨顿骂，也别把黑火烟吸进肺管子里，人活一世先把自个儿这条命护住了……”\n\n“记住了师父！”小徒弟脆生生应道，伴着老人两声豁达朗笑。\n\n竹篱之外，陈长庚静静听了片刻，冷峻如铁的眉宇间掠过一丝极淡的暖意，却并未推门现身。\n\n仙凡早已两隔。\n\n他如今即将奔赴三宗绞肉场，与器堂、魔门结的皆是不共戴天的血仇；一旦大张旗鼓显圣认亲，非但给不了老人一分清福，反倒会给无修为护身的凡人招来灭门横祸。\n\n今早离山前，他特意花五枚下品灵石从内门丹房兑出一枚雕作寻常青石平安扣模样的“温脉延寿玉坠”与一瓶上品延寿丹砂。\n\n此刻陈长庚屈指轻轻一弹，那枚温脉延寿玉坠化作微不可察的流光穿过雨帘，悄无声息挂在了草院屋檐挡风的木钩正中。\n\n凡人佩戴此玉，寒暑不侵，足以保老人无病无灾安享百岁晚年。\n\n深看草院炊烟最后一眼，陈长庚转身步入迷蒙雨巷，将昔日盐灶微末尘缘彻底留在了身后。\n\n午后未时，黑石坊市南街。\n\n再次踏入这座散修混迹的地下坊市，陈长庚早已褪下显眼的青玉执事袍，换上一袭不起眼的灰麻斗篷，头戴压低眉眼的竹编大斗笠，熟门熟路拐向南街尽头那间新挂出“九斤杂货”木牌的青石铺面。\n\n还未走到铺门十步内——\n\n“砰！哗啦啦！！”\n\n两排摆满粗瓷药瓶与矿石标本的木货架被人一脚狠狠踹翻出街门，碎瓷混着黑泥溅了一地！\n\n“贺老狗，少他娘的跟爷哭穷！”\n\n石铺里头，两名太阳穴高鼓、浑身凶煞之气的通窍七窍壮汉正一脚踩在长条柜台上，为首那名满脸横肉、外号“黑水屠六”的坊市恶霸拎着九环鬼头刀，拿刀背拍得五十来岁、两鬓斑白的贺九斤老脸啪啪作响：\n\n“南街这片地界上月换我黑水帮接管了！别家铺子每月交三块灵石，谁叫你老小子以前干过黑脚行油水厚？今天不拍出五块完整下品灵石当平安份子钱，老子先剁碎你这双招子，再把你这养老石屋拆成乱葬岗！”\n\n旁边麻脸汉子卢五狞笑着一脚踢翻炭盆：“听见没有？拿钱还是拿手！”\n\n柜台后的贺九斤弓着背，捂着青紫脸颊苦苦作揖哀求：“屠六爷行行好！小老儿早金盆洗手不跑暗渠了，攒一辈子碎银才盘下这间破石屋卖点硫磺生铁混口棺材饭，哪拿得出五块整灵石啊……”\n\n“给脸不要脸，那老子今天就替你收尸！”\n\n屠六凶性大发，手腕灌足通窍七窍霸道劲力，九环鬼头刀一翻便朝着贺九斤右肩狠辣劈落！\n\n“踏。”\n\n一只沾着雨水的灰布靴稳稳跨过石铺门槛，斗笠下传出一道平淡无波的嗓音：\n\n“把刀收了，挡着陈某买货了。”\n\n屠六动作一滞，扭头见是个穿灰麻斗篷的孤身过客，顿时狞笑骂道：“哪钻出来的藏头露尾野杂种，敢管我黑水帮的闲事，连你一块剁——”\n\n最后一个“剁”字生生卡在喉管里！\n\n灰麻斗篷下，陈长庚连手指都没抬一下，仅有一缕凝若万钧赤铁的开脉境地火煞罡顺着青石地面碾压而过！\n\n“咔嚓！！噗通！”\n\n屠六与麻脸卢五只觉天塌地陷，周身引以为傲的通窍七窍真气像纸糊窗户般寸寸崩碎，两人手里的九环鬼头刀当场脱手震飞，四只膝盖重重砸裂铺内青石砖，齐齐喷出一口鲜血五体投地趴在地上！\n\n“开、开脉前辈？！！”\n\n屠六肝胆俱寒，整张横肉脸惨白如纸，顾不得满嘴血沫，拼了老命把脑门往碎瓷片上猛砸，嘶声哭嚎：\n\n“前辈饶命！小的有眼不识泰山，不知道贺掌柜是前辈罩着的人！黑水帮再敢踏进南街一步，叫小的全家不得好死！！”\n\n“滚。”陈长庚淡淡吐出一字。\n\n两名刚才还凶神恶煞的七窍地头蛇如蒙大赦，连刀都不敢捡，屁滚尿流手脚并用地爬出石铺，眨眼间逃进了大雨深处！\n\n石铺内骤然安静下来。\n\n贺九斤扶着柜台惊魂未定，刚想跪谢这位神秘高人，却见灰斗笠客人走到柜前，右手食指与中指曲起，按着昔日大泽暗渠交货的老规矩，“笃、笃笃”一轻两重敲了三下桌面：\n\n“赤精铜髓三斤，精纯赤硝硫髓百份，再把你库底压箱没人要的高阶废煞矿石全包起来。亲兄弟明算账，一共多少灵石？”\n\n听见这串熟悉到骨子里的叩指暗号与那句“亲兄弟明算账”，贺九斤整个人如遭电击，呆呆望着斗笠下那截棱角分明的下颌！\n\n去年秋末那个在暗涵里拿碎髓石换烈阳火珠、谨慎狠辣得像头孤狼的盐场少年……如今竟已踏破仙凡天堑，成了随手一缕气机便能吓瘫七窍恶霸的开脉大修士？！\n\n“噗通！”\n\n贺九斤眼眶一热，却没有丝毫逾越攀扯，恭恭敬敬撩起衣摆跪倒在地，把当年那声“长庚兄弟”硬生生咽回肚里，双手抱拳执足了修真界晚辈大礼，声音微颤却干脆利落：\n\n“小老儿贺九斤，叩见前辈！前辈要的赤精铜髓与百份赤硝火药主材小店地窖就有现成尖货，连同两块北边大墓流出来的二阶废煞黑矿，一共折算四十五枚下品灵石，小老儿这就去给前辈封箱！”\n\n聪明人说话，一句多余的话都不用嘱咐。\n\n不到两刻钟，几只封好隔味火漆的精铁匣子便收进青云储物袋。\n\n陈长庚数出四十五枚完整下品灵石拍在柜面，心里将账目过了一遍——算上清晨在丹房兑出温脉玉坠与延寿丹砂花去的那五枚，这趟备战采买共支五十枚，储物袋内恰好还留着二百五十枚整。\n\n他指尖轻叩柜沿，随口似地问了一句：\n\n“早先乌卤盐场修过地下暗渠的老杂役里，有个叫孙铁牛的，你脚行还有印象么？”\n\n贺九斤略一思索，忙低声回禀：“回前辈，那孙铁牛去年秋末盐场闹丹房炸炉时便吓破了胆，跟着一队流民脚夫逃去北边三宗交界的外境铁矿讨生活了，一直没回过大泽。”\n\n三宗交界外境矿山？倒是巧了。\n\n陈长庚不动声色记下这条红榜尾线，从袖中取出清晨一并兑好的那瓶上品延寿丹砂搁在灵石堆旁：“这瓶药抵刚才的茶水钱，门外那帮杂鱼不会再来了，好生看铺子。”\n\n“多谢前辈厚赐！祝前辈大道永昌！”\n\n贺九斤深深一揖到底，再抬头时，门外细雨蒙蒙，那道灰斗笠身影早已飘然不见踪影。\n\n二月十六入夜，云泽宗丁字三号执事洞府。\n\n寒铁虫瓮内，三十六只一阶巅峰嗜铁煞甲虫将三斤赤精铜髓蚕食殆尽，背甲紫金光泽大盛，在瓮底寒砂间顺利产下百余粒米粒大小、生机勃勃的紫黑变异新虫卵！\n\n陈长庚收妥虫瓮，坐回青灯石案前，缓缓摊开那卷巡脉堂发来的“断界黑石峪”海捕详图与近三月交接底册。\n\n一页页翻至卷末最后一行火铜矿月度折损数字时，陈长庚翻页的指尖骤然一顿，冷眸猛地眯起——\n\n那行写着“月度地火自然塌耗三成”的浓黑墨字底下，迎着灯光斜照，赫然透出一道被朱砂官笔强行刮擦涂改过的旧账刀痕！"}, {"n": 100, "title": "执印赴边", "body": "青灯微晃，海捕详图卷末那道朱砂刮痕在指腹下微微发涩。\n\n原本墨字写的分明是“月度塌耗一成”，被人用官刀刮去表层桑皮，硬改成“三成”。\n\n断界黑石峪每月产出的火铜精矿，足足有两成进了暗处硕鼠的肚子里。\n\n前两任无门无派的巡脉执事，只怕不是折在魔门劫修刀下，而是看懂了这本烂账，被人借刀灭了口。\n\n次日二月十七，申末酉初。\n\n残阳如血，将东麓山腰染得一片暗红。\n\n陈长庚刚从升仙殿书办房闲坐喝茶归来，还没掩上丁字三号洞府的隔音石门，山道下便传来一阵沉稳靴声。\n\n器堂开脉中期执事龚铁横负手踏上石阶，脸上竟一扫五日前在升仙殿碰壁的阴鸷，挂着三分热络笑意。\n\n“陈师弟果然在洞中潜修，倒是愚兄冒昧讨扰了。”\n\n陈长庚神色微怔，忙退后一步躬身迎客：“龚师兄大驾光临，小弟有失远迎，快请入内奉茶。”\n\n“茶就不必忙活了。”\n\n龚铁横大马金刀迈入石厅，目光似笑非笑扫过空荡简朴的石壁，袖袍一拂坐上主位石榻。\n\n“明日卯时师弟便要动身赴断界黑石峪，愚兄今儿傍晚过来，是替你送一道保命仙缘的。”\n\n陈长庚垂手站在三步外，面上露出恰到好处的受宠若惊：“保命仙缘？还请龚师兄明示。”\n\n龚铁横慢条斯理竖起两根手指：“断界黑石峪夹在本宗、玄煞门与血河宗三家犬牙交错之地，明面上是座贫瘠火铜矿，背地里每月都有些不入公册的‘火耗暗矿’。”\n\n陈长庚眼底寒芒暗敛，嘴上老实道：“小弟初入内门，这些边矿门道委实一窍不通。”\n\n“不通不要紧，有人替你撑伞就行。”\n\n龚铁横身体微微前倾，声音压低了几分，“器堂掌矿的鲁长老惜才，听闻师弟单凭一口异乳便撞开仙脉，有意破例收你做个记名门人。”\n\n“鲁长老肯收小弟？”陈长庚故作惶恐，“小弟既不懂炼器，又无家世孝敬……”\n\n“长老岂会贪你兜里那三瓜两枣？”\n\n龚铁横哈哈一笑，图穷匕见，“你去了黑石峪，公册正课照旧交巡脉堂；至于矿底下刨出来的暗矿羡余，每月按老规矩拨八成送进器堂火房充作孝敬，余下两成全归师弟私用！”\n\n八成暗矿归器堂，黑锅和魔门快刀归他陈长庚一个人背。\n\n算盘珠子都快崩到人鼻梁上了。\n\n陈长庚心里冷笑，脸上却苦着脸连连摆手，顺势掩唇低咳了两声：“咳、咳咳……龚师兄高看小弟了。”\n\n龚铁横眉头微皱：“怎么，陈师弟嫌两成少了？”\n\n“哪敢嫌少，实在是小弟这副身子骨接不住长老厚爱啊。”\n\n陈长庚摊开掌心，故意催动那套粗浅浮躁的《赤卤开脉功》，让气色显得有些发白虚浮：\n\n“不瞒师兄，小弟在古墟拿命硬扛异乳冲脉，心肺旧伤至今没平顺。明日去黑石峪，能不能在魔门游骑手里活过头一个月交足宗门正课都是两说。”\n\n“若是这会儿空口白牙应下鲁长老的记名厚恩，到头来连正课都折了，岂不是连累长老在刑律堂丢脸？”\n\n龚铁横脸色一沉，眼神瞬间冷了下去：“陈师弟这是不肯赏器堂这个脸了？”\n\n“小弟绝无此意！”\n\n陈长庚恭恭敬敬一揖到底，把软钉子裹在棉花里递过去，“等小弟到了黑石峪站稳脚跟、首月顺顺当当交足宗门正课，摸清了矿底深浅，定当亲自备齐厚礼回山，去鲁长老门前磕头求见！”\n\n既不翻脸拒人落了话柄，也不立一字死约。\n\n龚铁横冷冷盯了陈长庚三息，忽然皮笑肉不笑地站起身，抬手虚拍了拍陈长庚肩头：\n\n“师弟行事稳重，倒也没错。只是前两任巡脉执事，下山前也跟师弟一样觉着能靠自个儿站稳脚跟。”\n\n他凑近半尺，一字一顿冷幽幽道：“结果不到二十天，连块拼得齐的尸骨都没能从黑石峪运回来。”\n\n“多谢龚师兄提点，小弟一定多加小心。”陈长庚低眉顺眼。\n\n“但愿下个月初核销矿册时，愚兄还能在山门见到陈师弟全须全尾回来磕这个头！”\n\n龚铁横重重一甩黑袍，冷哼一声大步踏出洞府，很快消失在暮色山雾里。\n\n石门轰然落下隔绝禁制。\n\n陈长庚缓缓直起腰背，脸上那抹谦卑惶恐像潮水般褪得干干净净。\n\n“拜入你们器堂掌矿一脉，替你们填那两成涂改矿耗的烂账？做梦去吧。”\n\n今日午后他在升仙殿书办房陪老书办吃茶时，早已旁敲侧击摸清了内门底细——器堂并非铁板一块，后山西北角那处终年毒煞弥漫的“地肺废火窟”，便坐镇着一位脾气孤僻、从不掺和派系争矿的器堂老长老。\n\n等他在黑石峪立下首功站稳脚跟，回山便拿三成明面矿利去废火窟挂个清净名号，看龚铁横还能拿什么会签规矩卡他的脖子！\n\n夜色深沉，子时初刻。\n\n陈长庚走入内室，用九宫浊泥封灵纹将石室通风隙抹严，再把苏清晏所赠的三枚精炼破磁铁钎呈三角钉入洞府地火支脉暗眼，熟练引动《地脉敛息阵图》的“借煞倒卷诀”。\n\n地底深处传来微不可察的倒吸风鸣。\n\n他取出自二月十一寅末至今早已蓄满新一轮三十六个时辰潮汐的“蚀纹石臼”，打开黑石坊市淘回的铁匣，将第一块拳头大小、灰黑驳杂的二阶废煞黑矿稳稳按入臼心！\n\n“嗡——”\n\n早已解锁二阶转化的石臼暗金裂痕微亮，狂暴阴杂的大墓死煞被寸寸碾碎剥离，收尾迸发的十倍浓郁腥甜奇香刚溢出臼沿，便被地火暗眼倒卷扯入百丈岩浆深处焚尽！\n\n一刻钟后，臼底凝出一撮晶莹剔透、毫无杂毒的紫金二阶煞髓晶砂，边角还崩落数粒细碎晶屑。\n\n陈长庚先拨开寒铁虫瓮上层隔板，将那数粒二阶晶屑喂给三十六只嗜铁煞甲虫。\n\n吸饱二阶晶屑的三十六只一阶巅峰成虫背甲紫金流转，凶戾气息攀至顶峰，被他单独收入贴身左袖的软革御虫囊中随时迎敌；而瓮底寒砂层内那百余粒新产的紫黑变异虫卵，则用封灵泥严密裹护休眠，再以九宫浊泥封灵纹锁住整只寒铁虫瓮气机，贴腰悬于道袍内侧随身带走，不在丁字三号这座临时执事洞府里留下一丝底牌痕迹。\n\n随后，陈长庚仰头将整撮二阶无瑕髓晶吞入腹中！\n\n精纯药力化入周天仙脉，连日刚刚破境的一丝浮气彻底夯实如百炼神铁，体表那层寸许暗金地火煞罡愈发凝实厚重，稳稳推至开脉境初期顶峰！\n\n下半夜，他又取出坊市购回的百份精纯赤硝硫髓与生铁砂，双指如飞，赶在五更前亲手箍出二十枚威力倍增的过载烈阳火珠，分装入袖囊与储物袋。\n\n二月十八，卯初破晓。\n\n云泽宗七十二峰云海翻腾，晨光如剑劈开东天紫气。\n\n陈长庚抹净洞内阵痕，收妥蚀纹石臼、剩余一块二阶废煞黑矿、上古寒玉封匣与二百五十枚整灵石等全部家当，腰间内悬寒铁虫瓮，外佩赤铜巡脉官印，一袭青玉云纹执事道袍迎风猎猎，推门踏出石洞。\n\n单足轻轻一点，那面巴掌大的青鳞灵盾迎风暴涨至四尺见方，稳稳托住双足，化作一道凌厉青虹冲破护山云阵，朝着北方三宗交界的苍莽荒山破空疾驰！\n\n御风百八十里，不过一个多时辰。\n\n辰末时分，脚下青翠林海尽数褪去，取而代之的是一片犬牙交错、赤黑焦岩裸露的险峻山脉——三宗交界，断界黑石峪到了！\n\n陈长庚并未莽撞直扑矿谷正门，在距离黑石峪尚有十里的一道荒僻乱石山脊后悄然按下青光，运转《地脉敛息阵图》敛尽全身灵压，如一块灰青岩石般伏上岭头。\n\n刚探眸望向前方三里外的谷口界碑，一股刺鼻的焦糊血腥味便顺着北风扑面卷来！\n\n只见本该悬挂云泽宗青云旗的谷口界碑哨塔已被劈塌一边，一道粗如水桶的赤黑狼烟正笔直冲上铅灰天幕！\n\n哨塔下的碎石坪上，十几具身穿云泽宗外门灰麻号衣的驻矿杂役尸首横七竖八倒在血泊里，没剩下一个活口。\n\n两名身穿暗红血煞短打、气息彪悍凶戾的玄煞门开脉初期劫修，正大咧咧踩着界碑残石擦拭血刀。\n\n“呸！云泽宗器堂那帮吃里扒外的硕鼠刮得真他娘干净，库房里连二十斤火铜精砂都没剩！”刀疤脸劫修吐了口血沫骂道。\n\n旁边提着鬼头铜锤的独耳汉子嘿嘿狞笑，往狼烟火堆里又添了一把赤磷毒柴：\n\n“急什么？肥羊不在库房，在路上呢！内线昨儿递了准信，今天早上云泽宗有个没靠山的新嫩巡脉执事过来接印——闻见这柱挑战狼烟，那蠢货准得慌慌张张冲进来救火！”\n\n刀疤脸眼睛一亮，舔了舔刀口鲜血：“一个刚开脉的雏儿，身上最少揣着五十块安家灵石和全套制式灵器！等他一落地，咱哥俩前后夹击剁了他的脑袋去换悬赏酒钱！”\n\n乱石山脊之上，山风吹动青玉袍角。\n\n陈长庚冷漠俯瞰着谷底谈笑分赃的两名玄煞门开脉劫修，呼吸平稳得没有一丝波澜。\n\n左袖微垂，装满三十六只巅峰嗜铁煞甲虫的御虫皮囊活扣悄然滑开，右手五指间，三枚裹满破甲生铁砂的过载烈阳火珠已无声无息落入掌心！"}, {"n": 101, "title": "借烟瓮杀", "body": "北风卷着刺鼻的赤磷毒烟，顺着断界黑石峪狭窄的谷口倒灌进山坳。\n\n乱石山脊后，陈长庚伏在一块焦黑风化岩下，连衣角都没晃动一分。\n\n三里外的哨塔已经塌了半边，十几具穿着云泽宗外门灰麻号衣的尸首横陈在碎石坪上，血水渗进黑煤渣里，早冻成了暗紫硬块。\n\n火堆旁蹲着两个穿暗红血煞短打的玄煞门汉子。\n\n独耳汉子樊缺耳拎着一对磨盘大的鬼头铜锤，正往火里添赤磷毒柴；刀疤脸焦破山则踩着云泽宗断成两截的界碑，拿一块鹿皮慢悠悠擦拭厚背血刀。\n\n“再添两把柴，把烟烧浓些！”\n\n樊缺耳咧嘴嘿嘿直笑，“那新来的巡脉执事是个没师承的雏儿，老远瞧见驻地起了狼烟，准得急吼吼扎进来救火！”\n\n焦破山收刀入鞘，摸了摸横贯鼻梁的狰狞刀疤：“留神些，别一锤把人脑袋砸烂了，连储物袋带那颗人头，回黑风寨还能换三十块灵石酒钱。”\n\n山脊之上，陈长庚眼神冷淡如铁。\n\n库房提前被人刮得干干净净，谷口设伏的劫修连他今日辰末抵谷、出身无靠山的底细都摸得一清二楚。\n\n内坑里要是没蹲着一只吃里扒外的硕鼠，这柱狼烟根本点不起来。\n\n两个都宰了容易，倒叫暗处递信的人缩回了壳里。\n\n陈长庚右手扣紧三枚裹满生铁砂的过载烈阳火珠，左袖软革御虫囊活扣微松，丹田内却刻意压住浑厚如渊的紫金仙脉，只调起库房领来的那路粗浅《赤卤开脉功》。\n\n一缕斑驳虚浮、还带着几分滞涩的青赤灵光自足底亮起。\n\n“嗡——！”\n\n青光托着青鳞灵盾掠下山脊，迎着扑面浓烟莽撞冲进谷口，人在半空便传来一声惊怒交加的年轻喝斥：\n\n“何方贼子敢毁本宗哨卡！驻矿弟子何在？！”\n\n来了！\n\n哨塔断墙后，焦破山与樊缺耳对视一眼，眼底凶光暴涨。\n\n“这蠢小子灵光浮得像筛子，真是刚开脉的软脚虾！”\n\n樊缺耳狂笑暴起，周身开脉初期的浑浊血煞轰然炸开，双臂灌足千斤蛮力，一对鬼头铜锤带着恶风当头砸向浓烟中那团青光！\n\n焦破山更阴毒，半声不吭贴地疾掠，厚背血刀斜撩青光下盘退路，分明要一照面废掉来人双腿！\n\n“不好！”\n\n浓烟里传出一声慌乱失措的气闷惊呼，那团青赤灵光左支右绌晃了两晃，竟像被赤磷毒烟呛乱了气机，直挺挺撞进刀锤合围的正中央！\n\n“给老子碎！！”\n\n樊缺耳双锤重重轰中青光！\n\n“铛——！！”\n\n刺耳金铁巨响炸开，那团虚浮灵光应声崩碎，可铜锤砸中的却只是一面借着卸力巧劲斜滑弹开的四尺青鳞灵盾，盾后空空如也，连半片衣角都没有！\n\n金蝉脱壳？！\n\n焦破山刀锋劈空，积年舔血的凶悍本能让他浑身汗毛倒竖，猛地收刀横护咽喉，扯嗓子厉吼：\n\n“不对劲！老樊快退回哨塔背靠背——”\n\n最后一个字还没滚出喉咙。\n\n北风倒灌的最浓黑烟死角里，一道敛尽全身气息的青袍身影早已贴地欺近五步之内！\n\n没有半句场面狠话。\n\n陈长庚右腕一抖，三枚裹满破甲生铁砂的过载烈阳火珠呈品字形破烟射出，贴着樊缺耳旧力刚尽、新力未生的胸前护罩轰然引爆！\n\n“轰隆——！！”\n\n狂暴赤硝火浪裹着上千粒烧红的棱角铁砂，在三尺之内炸成一片赤金火狱！\n\n樊缺耳才刚举起半边铜锤，体表那层开脉初期的血煞灵罩便像脆纸般被生铁砂撕得千疮百孔！\n\n“啊——我的眼！”\n\n凄厉惨叫刚起半声，陈长庚左袖一拂，三十六道米粒大小的紫金暗影借着滚滚火烟掩护电射而出，瞬间咬穿焦破山横刀撑起的血煞罡气！\n\n“嗤嗤嗤！”\n\n焦破山只觉双肩琵琶骨与右腕脉门同时传来钻心刺痛，一身煞气像扎破的皮囊般狂泻不止，手里的厚背血刀“哐当”脱手坠地！\n\n“什么鬼虫——”\n\n焦破山骇得面无人色，刚想咬牙弃刀往谷外疯逃，烟浪已被一道快得拉出残影的身影一把撕开！\n\n陈长庚左手一招，三十六只嗜铁煞甲虫眨眼钻回袖囊，右手九寸三分乌金破甲分水刺顺着铁砂炸烂的焦口一刺贯入樊缺耳咽喉，反手夺过坠地的厚背血刀，刀柄裹着三千五百斤横练暗劲重重砸在焦破山膝弯！\n\n“咔嚓！”\n\n焦破山右腿膝骨应声折断，惨哼着扑倒在碎石血泊里。\n\n不等他翻身，两道寒芒一闪，乌金分水刺连挑两次，精准钉穿他双肩琵琶骨，再顺手抓过火堆旁半截烧红的赤磷铁钎，重重将他左掌钉在碎石坪上，滚烫焦黑的铁砂火痕顺势将肩头那点细微虫孔遮得干干净净。\n\n前前后后不过三息工夫。\n\n两名凶名赫赫的玄煞门开脉劫修，一死一擒，谷口只剩赤磷残火还在噼啪作响。\n\n陈长庚神色平静地收回分水刺，周身重新浮起那层《赤卤开脉功》特有的燥热浮光，顺手召回青鳞灵盾护在身侧，故意抚着胸口剧烈喘息了两声。\n\n就在火珠爆炸余音回荡进内谷的第三息——\n\n“快！快随老夫冲出去救陈师叔！！”\n\n内谷黑漆漆的运矿石道里，忽然炸开一阵惊慌失措的哭喊与杂乱脚步声！\n\n一名五十来岁、身穿油腻皂色司炉袍的瘦高老者，带着七八名手持铁镐木矛的矿卫火急火燎冲出山口。\n\n老者手里高举一柄三尺长的百炼铁尺，脸上涕泪俱下，可一双精明闪烁的细长眼珠子扫过满地死尸，却在被踩住咽喉的活口焦破山脸上猛地一缩！\n\n“天杀的玄煞门魔崽子！竟敢屠我黑石峪外卡弟兄、伏击新上任的执事师叔！”\n\n驻矿司炉郑百斛捶胸顿足嚎了一嗓子，脚下却快得惊人，抡起百炼铁尺便直奔焦破山脑门扑来：\n\n“陈师叔莫慌！小的郑百斛来迟一步，这就替师叔砸烂这魔狗的脑袋出气！”\n\n碎石坪上，陈长庚右靴稳稳碾住焦破山咽喉，没有挪开半分。\n\n他偏过头，看着满脸悲愤挥尺冲来的郑百斛，嗓音温和而平淡：\n\n“郑司炉先莫动火，不妨上前仔细瞧瞧，地上这位刀疤好汉可是熟面孔？”"}, {"n": 102, "title": "哭丧试鬼", "body": "百炼铁尺带起的恶风离焦破山天灵盖只剩半尺。\n\n郑百斛鞋底猛地搓地急刹，脸上悲愤欲绝的表情僵了一瞬，随即把头摇得像拨浪鼓：\n\n“陈师叔说的哪里话！这帮玄煞门黑风寨的杀才个个茹毛饮血，小的成日缩在内坑看炉子，哪认得这号魔门凶徒！”\n\n趴在碎石血泊里的焦破山一听这话，独眼里顿时喷出怨毒怒火。\n\n原来这老狗刚才抡铁尺冲过来，压根不是救驾，是要拿他焦破山的人头平账灭口！\n\n“唔……姓——”\n\n焦破山脖颈青筋暴起，拼尽全力张嘴就要攀咬！\n\n“大胆魔徒，死到临头还敢对本执事喷毒血？！”\n\n陈长庚脸色一沉，赶在焦破山吐出第二个字前，右靴靴尖暗吐一缕巧劲，“咔”地踢脱焦破山下颌骨，顺势震断他半截舌筋！\n\n焦破山眼前一黑，嘴里只剩大股血沫“荷荷”外涌，再也吐不出半个清楚字音。\n\n郑百斛悬到嗓子眼的心脏猛地落回肚里，却还不死心，双手攥紧百炼铁尺往前凑了半步，满脸关切道：\n\n“师叔好快的身手！这种魔门劫修浑身都是邪门血咒，留着一口气怕生变故，不如让小的补上一尺结果了他！”\n\n“慢着。”\n\n陈长庚横起那面沾满烟灰的青鳞灵盾，轻飘飘架住铁尺尺锋，掩唇咳了两声，露出几分初历血战的余悸：\n\n“郑司炉有所不知，本执事离山前巡脉堂长老严令，边卡近来魔骑异动，抓着活口必须问清谷外还有没有埋伏大队。”\n\n他垂眸扫了一眼郑百斛攥紧铁尺的枯瘦指节，语气缓和下来：\n\n“倘若外头三五里还蹲着玄煞门主力，这会儿不撬开他的嘴，今夜咱们满谷上下拿什么守？”\n\n身后几名扛铁镐的矿卫闻言脸色煞白，纷纷点头附和：“执事师叔说得是啊！前两任师叔就是半夜教魔修摸进来害了性命！”\n\n众目睽睽之下，郑百斛哪敢再硬砸铁尺，只得讪讪收尺入怀，弓腰赔笑道：“还是师叔思虑周全，是小的鲁莽了！那这贼子下巴脱了，可怎么审？”\n\n“无妨，他还有两根好手指头。”\n\n陈长庚弯腰单手揪住焦破山后领，像拖死狗一样将其拽进哨塔底层尚未烧塌的半间石屋，“郑司炉带弟兄们先把外坪同门尸首敛一敛，把谷口拒马重新支起来，谁也莫靠近石屋十步。”\n\n“是、是！小的这就盯着他们搬拒马！”\n\n郑百斛站在石屋破门外点头哈腰，眼睁睁看着厚木门“吱呀”合拢，后背冷汗把油腻司炉袍湿透了一大片。\n\n石屋内光线昏暗，浓重血腥味扑鼻。\n\n陈长庚随手用碎石卡死门缝，转身低头，脸上那点虚弱喘息早已消散无踪。\n\n地上的焦破山痛得满头冷汗，斜睨着陈长庚，喉咙里发出威胁的低吼，右手五指死死抠住泥地不肯动弹。\n\n陈长庚没跟他拍桌子瞪眼，蹲下身，九寸三分乌金破甲分水刺轻轻抵在他气海穴下半寸的逆脉节点上，声音轻得只有两人能听见：\n\n“刚才门外拿百炼铁尺想敲碎你脑壳的老东西，叫郑百斛。”\n\n焦破山浑身一僵，充血的眼珠子猛地盯住陈长庚。\n\n“你替他背黑锅守口如瓶，他转头拿着你的脑袋向我邀功请赏。”\n\n陈长庚指尖微沉，分水刺破开一寸皮肉，冰冷煞气直钻气海经脉，“写清楚谁递的信、后头谁来接应，我给你个一指断气的痛快；不写，我就把你全身三十六处气脉一寸寸挑开，再把你交回郑百斛手里，让他当众拿铁尺慢慢敲。”\n\n经脉逆冲的剧痛加上被同伙出卖的滔天怨毒，瞬间冲垮了焦破山最后一丝侥幸。\n\n这刀疤劫修眼底闪过一抹疯狂快意，艰难抬起尚能动弹的右手食指，蘸满自己胸口涌出的滚烫鲜血，在身下平整青石板上歪歪扭扭划出两行血字：\n\n“郑百斛昨递信，黑风寨百夫长乌横岭，廿一子时收两成私矿，摘你人头。”\n\n写罢最后一笔，焦破山抬起满是血污的脸，怨毒地冲门外方向咧了咧嘴，闭上双眼引颈待戮。\n\n陈长庚把石板上的每一个字收入眼底。\n\n玄煞门黑风寨开脉中期百夫长，乌横岭。\n\n二月二十一日子时，还有整整三天。\n\n“咔。”\n\n陈长庚并指如铁钳，干脆利落拧断焦破山颈骨，没让他再多受一息零碎罪。\n\n随后他用刀尖彻底刮烂青石板上的血字泥痕，将焦破山与门外拖进来的樊缺耳尸首摞在一处，挑进两捆院角现成的赤磷毒柴，引出一缕《赤卤开脉功》燥火丢了进去。\n\n“轰！”\n\n赤磷烈火夹着滚滚黑烟冲天而起，不到一盏茶工夫，两具劫修尸首连同所有兵刃创口便烧成了焦炭黑灰。\n\n石屋木门重新推开。\n\n陈长庚提着缴获的那把一阶上品厚背血刀与一对鬼头铜锤走出来，眉头紧锁，冲着快步迎上来的郑百斛重重叹了口气：\n\n“晦气！这玄煞门凶徒后槽牙里藏了腐心毒囊，本执事刚接上他下巴逼问半句，他便咬破毒囊自尽了，连半个字都没吐出来。”\n\n郑百斛往屋里焦黑刺鼻的火堆瞟了一眼，只见两具尸骨早已烧得焦黑蜷缩，心头那块千斤巨石轰然落地，脸上却装出痛心疾首的模样：\n\n“哎呀！这帮魔崽子向来亡命死硬！不过师叔甫一到任便独力斩杀两名开脉大盗，放眼咱们巡脉堂也是头一份的大威风！”\n\n陈长庚摆了摆手，神色略显疲惫地摸出方才从哨兵尸首旁捡起的一串黄铜矿仓大钥，随手抛还进郑百斛怀里：\n\n“什么威风不威风的，我那几枚压箱底的保命火珠算是全搭进去了。”\n\n“陈某初来乍到，内坑采掘与火炉调度一概不熟，往后这矿仓钥匙还是由郑司炉替我掌着，只求月底顺顺当当凑够巡脉堂正课，别再出什么乱子就好。”\n\n郑百斛双手接住沉甸甸的矿仓铁钥，简直不敢相信自己的耳朵！\n\n前两任巡脉执事一来就急着收钥匙查底账，没想到眼前这位年轻师叔被两个劫修吓破了胆，竟连矿仓大权都原封不动交了回来！\n\n“师叔放心！小的在黑石峪熬了八年，定替师叔把炉火盯得妥妥当当，绝不叫师叔费半点神！”郑百斛喜形于色，连连作揖包揽。\n\n当晚陈长庚便住进了内谷东侧的执事石院，早早落下隔音木栓歇息。\n\n夜交三更，万籁俱寂。\n\n内谷西头司炉房的木窗轻轻支开一条细缝，郑百斛披着一件深灰夜行短袄，做贼似地左右张望两眼，贴着山壁阴影摸上了后崖排风口。\n\n他熟门熟路踩上三尺高的风道垫石，枯瘦手指探进一块松动的青砖暗缝里，轻轻抠出了一截封着黑火漆的传讯竹管。"}, {"n": 103, "title": "废坑摸脉", "body": "二月十九，辰初。\n\n断界黑石峪内坑终年弥漫着一股硫磺与焦煤混杂的燥热浊气。\n\n陈长庚换了一身不起眼的青布常服，腰悬赤铜巡脉官印，背着手慢吞吞走在狭窄湿滑的主矿道里。\n\n郑百斛今早借口炉房赶炼精铜没露面，却指派了个歪嘴斜眼的亲信矿卫刁三跟在三步外点头哈腰，眼珠子贼溜溜盯着陈长庚迈向哪条岔道。\n\n走过二号采坑拐角，七八名赤着精瘦上身、脊背满是烫疤的老矿役正蹲在石槽边啃冷硬的黑豆糙饼。\n\n为首一名左手断了两根指头、脊梁骨硬得像铁弓似的老矿匠一见巡脉官印，连忙放下缺口瓦罐，带着众人惶恐跪伏在地：\n\n“小人岳铁脊，见过执事师叔！”\n\n“都起来干活吧，坑里湿气重，跪坏了膝盖谁替本宗背矿。”\n\n陈长庚随手抬了抬手，忽然皱眉捏了捏鼻梁，扭头冲跟班刁三吩咐道：“坑底煤烟呛得慌，我心肺旧伤有些犯燥，你去井口提一壶干净井水放凉了送来。”\n\n刁三迟疑了一下，见周围全是老实巴交的苦力，只得赔笑应声：“好嘞师叔，小的这就去提水！”\n\n脚步声刚拐出石巷，陈长庚低头扫了一眼岳铁脊瓦罐里发酸长毛的豆饼，从储物袋摸出两包行路备下的酱牛肉与白面锅盔，随手搁在石槽沿上：\n\n“昨儿谷口折了十几个外门弟兄，你们在内坑熬火也算命大，分着垫垫肚子吧。”\n\n岳铁脊愣愣看着油纸包里结实的酱肉，眼圈微微发红，粗糙大手在裤腿上擦了又擦才双手接过，压低嗓门颤声道：\n\n“谢师叔赏！师叔是个心善的体面人……小老儿多句找死的嘴，师叔既然心肺有旧伤，巡完这二号明坑就早些回东院歇着，千万莫往西头那条三号塌方废洞钻！”\n\n陈长庚眉梢微挑，像听见什么稀奇事：“三号废洞？交接图上不是写着去年地火走水塌死了么，有什么去不得的？”\n\n周围几名矿役吓得纷纷缩脖子往后退，岳铁脊左右看了一眼，声音压得像蚊子哼：\n\n“塌是塌了，可那地方邪性！前头来的孙师叔和赵师叔，都是不信邪非要举着火把进去核什么塌耗账，结果头一天刚出洞，第二天半夜就被外头翻崖进来的玄煞门马匪摸进院子，砍得连囫囵尸首都拼不齐啊！”\n\n前脚查三号废洞，后脚魔门劫修就精准摸进院子灭口。\n\n账册上刮改的那两成火铜精矿藏在哪儿，答案已经呼之欲出了。\n\n陈长庚脸上露出一抹恰到好处的忌惮，拍了拍岳铁脊肩膀：“多谢老丈提点，陈某惜命得很，绝不去触那个霉头。”\n\n待刁三提着凉水壶气喘吁吁跑回来，陈长庚只象征性抿了一口，便背着手晃去一号明坑转了半圈，借口困乏打发走刁三，转身拐进一条通往地下排风井的偏僻岔道。\n\n收敛气息贴墙折返，不过半刻钟，西头那座钉着交叉封木、挂着“地火塌陷严禁入内”木牌的三号废洞便出现在眼前。\n\n洞口堆满丈许高的焦黑乱石，乍看确实像岩层垮塌封死了去路。\n\n陈长庚没有动用灵识硬探，只凑近石缝深吸了一口气，眼底冷笑一闪而逝。\n\n他在乌卤盐场熬了三年毒卤，什么死井霉瘴没闻过？\n\n真正的塌方死洞，三年不通风必聚酸臭死水气；可眼前这堆乱石缝里渗出来的，分明是活火矿脉伴生的青碧铜煞暖雾，连底下垫脚的三块大青石都是按矿工“后天卸力楔”人为卡上去的障眼法！\n\n陈长庚运转《地脉敛息阵图》缩窄肩骨，顺着乱石顶部一道仅容一人侧身滑过的通风斜隙灵巧钻入。\n\n穿过三丈假塌方石堆，眼前豁然开朗！\n\n一条宽逾丈半、石壁布满紫赤色高纯火铜矿苗的天然支脉蜿蜒深入地底，空气炽热滚烫，两侧岩壁上还留着新鲜的铁钎凿痕与独轮车辙印！\n\n郑百斛这帮硕鼠非但瞒下了整条富铜支脉，还天天派心腹从暗道偷挖精矿私卖玄煞门！\n\n陈长庚脚步极轻，刚顺着车辙印往前摸出二十步，目光忽然在右侧离地三寸的阴影石棱上一凝。\n\n一根涂满黑煤灰的极细野蚕丝横绷在窄道两壁之间，丝线尽头栓在岩缝深处三枚拇指大的响铜暗铃上！\n\n一旦有人莽撞蹚断蚕丝，铜铃震响顺着排风管直通西院司炉房，郑百斛当场便知有人摸进了老窝。\n\n陈长庚屏住呼吸，足尖点在石壁凸起处轻飘飘翻越蚕丝，半片衣袂都未曾沾碰，一路摸到了支脉尽头。\n\n支脉最深处是一口方圆丈许、咕嘟咕嘟翻涌着紫绿气泡的温热“铜煞泉眼”，浓郁精纯的二阶火铜地煞凝成浓烟盘旋洞顶。\n\n陈长庚算了算时辰，恰交二月十九午初。\n\n距离前夜在丁字三号洞府开炉，蚀纹石臼正好蓄满新一轮三十六个时辰的地脉潮汐！\n\n他毫不耽搁，取出那尊巴掌大的缺角灰石臼贴在泉眼煞脉石台上，将储物袋里仅剩的最后一块二阶废煞黑矿稳稳按入臼心。\n\n“嗡——”\n\n石臼断口暗金裂痕微亮，滚滚地煞潮汐涌入臼壁，将黑矿内部狂暴驳杂的死墓阴毒寸寸碾碎剥离。\n\n一刻钟收尾将至，一股十倍浓烈的地火腥甜异香刚从臼沿逸出，便被泉眼上方翻涌蒸腾的刺鼻紫绿铜煞毒烟彻底裹住冲散，连三丈外都闻不见一丝异样！\n\n臼底清光敛去，一撮纯净无瑕的紫金二阶煞髓晶砂静静躺在掌心。\n\n陈长庚仰头将其一并吞服入腹，周天仙脉轰然运转，精纯药力化作滚滚暖流冲刷四肢百骸，令他开脉境初期顶峰的真气愈发凝练如百炼重铁。\n\n收妥重回冷却的蚀纹石臼，他又解下贴腰悬挂的封灵寒铁虫瓮。\n\n这口富含精纯火铜灵煞的温热泉眼，正是催化那百余粒紫黑变异虫卵破壳的天赐温床！\n\n陈长庚拨开封灵泥，将瓮底寒砂间那一百多粒米粒大小、泛着紫金暗纹的变异虫卵小心翼翼埋入泉眼边缘的温热铜髓软泥中，外层再覆上一道隐晦的九宫敛息泥印。\n\n只需吸饱两日铜煞泉精气，赶在二十一日子时乌横岭袭营前，这批新虫便能破壳成军！\n\n做完这一切，陈长庚原路轻巧翻过那根涂灰蚕丝，从乱石堆外侧随手抠下两块夹杂硫磺臭气的伴生烂煤石揣进袖袋，慢条斯理钻出封木洞口。\n\n刚抬手拍了拍袖口沾上的黑煤灰，斜刺里石阶下便传来一阵爽朗热络的笑声：\n\n“哈哈，小的去东院寻师叔扑了个空，原来师叔亲自来西坑查险了！”\n\n郑百斛怀里抱着一坛刚拍开泥封的老黄酒，笑眯眯停在五步外的石道中央，细长眼珠子不动声色扫过陈长庚微鼓的左袖与靴底黑泥，试探着拱手笑道：\n\n“这三号废洞去年塌得厉害，毒烟又冲，不知陈师叔方才在洞口瞧出什么门道没有？”"}, {"n": 104, "title": "假账喂鼠", "body": "石道里火把噼啪跳动，映着郑百斛那张堆满褶子的笑脸。\n\n他嘴上问得客气，藏在宽大司炉袍袖里的右手却悄然按在了百炼铁尺柄端——只要眼前这姓陈的小子敢吐出“支脉”或“新茬口”半个字，他就拼着提前撕破脸发号召出心腹，绝不让消息活着出黑石峪！\n\n陈长庚像是压根没瞧见他紧绷的肩膀，皱着眉头叹了口气，一抖左袖。\n\n“啪嗒、啪嗒。”\n\n两块酥脆掉渣、泛着刺鼻臭鸡蛋味的伴生烂煤石滚落在郑百斛靴尖前，摔成了七八瓣黑渣。\n\n“能瞧出什么门道？一嘴臭硫磺灰罢了！”\n\n陈长庚拿手帕捂着嘴咳了两声，满脸嫌弃地掸了掸青布袍角，“巡脉堂发的旧图上标着这儿有条主岔道，我还当能捡几块漏网的火铜砂充正课，结果扒开石缝闻了一鼻子死水毒烟，差点把心肺旧伤又勾出来！”\n\n郑百斛低头看着脚边货真价实的表层臭烂煤，又听支脉深处的示警铜铃自始至终没响过半声，紧绷的右肩顿时松了下来，陪着叹气道：\n\n“谁说不是呢！这黑石峪看着大，其实富矿早十年前就被前人刨空了，如今全靠弟兄们拿命在边角石缝里抠点碎砂交差！”\n\n“算了算了，横竖是一处鸡肋穷窝。”\n\n陈长庚意兴阑珊地摆摆手，伸手接过郑百斛递来的黄酒坛闻了闻，语气里透着一股小门小户出身的求稳算计：\n\n“郑司炉，明人不说暗话。我陈长庚无门无派，能撞大运开脉混个执事铜印已是祖坟冒青烟，可不想学前两任师兄把小命丢在这荒山野岭里。”\n\n“只要这半年任期里月底正课过得去、不叫巡脉堂挑出大错，等熬满半年我便求纪长老调回本山看库房——这矿里头的杂事，还得全仰仗郑司炉多担待。”\n\n这番贪生怕死的掏心窝子话一出口，郑百斛眼底最后一丝疑虑彻底烟消云散，笑得牙花子都露了出来：\n\n“师叔说哪里话！师叔体恤下情，小的哪能叫师叔吃亏？正好上月交接的塌耗底册已理清了，师叔回东院喝口热酒暖暖身子，顺手画个押，月底核销小的便好提前替师叔备车！”\n\n回到东院石厅，郑百斛麻利地从怀里捧出一本早备好的桑皮矿册摊在石案上。\n\n册尾明晃晃写着一行浓墨大字：“黑石峪二月地火走水，自然塌耗火铜精矿三成，驻矿执事亲验无误。”\n\n只要陈长庚这一笔朱砂签下去，以前被郑百斛和器堂私吞的两成黑矿亏空，就全成了他陈长庚亲口认下的“自然塌耗”！\n\n郑百斛屏息盯着案前青年，手心微微见汗。\n\n陈长庚却只粗粗扫了一眼总数，连旁边的紫檀算盘都没碰一下，随手提起朱砂官笔，刷刷两下签上大名，再掏出赤铜巡脉官印“咚”地盖上一记鲜红大印！\n\n“行了，账册郑司炉收好，早些把月底正课矿砂备齐便是。”陈长庚打了个哈欠，端起茶盏送客。\n\n“妥嘞！师叔好生将养，小的绝不打扰师叔清修！”\n\n郑百斛如获至宝地揣起画押矿册，迈出东院门槛时脚步轻快得差点哼出小曲儿。\n\n蠢货！到底是个外门废渣谷爬上来的泥腿子，给两句好话、灌半坛黄酒，就把卖命字据签得干干净净！\n\n入夜三更，冷风如刀刮过断界黑石峪后崖。\n\n郑百斛再次摸上排风口高台，从竹笼里抓出一只驯养多年的灰羽夜枭，将一枚刚封好黑蜡的细竹管绑在夜枭铁爪上，双臂一振将其抛向漆黑北空！\n\n灰羽夜枭双翅无声滑过百丈悬崖，刚掠过山梁一株枯死老松——\n\n松枝阴影下，一道与山岩气息浑然一体的灰影闪电探手，两根手指稳稳夹住夜枭翎羽将其按进怀里！\n\n夜枭连半声惊鸣都没发出便被一缕煞气震晕过去。\n\n陈长庚解下爪间细竹管，用分水刺锋刃贴着火漆边缘极薄地挑开蜡封，抽出一卷指肚宽的油纸密信。\n\n借着微弱星光一扫，上头正是郑百斛那手熟悉的瘦硬行书：\n\n“新执事陈氏胆怯眼瞎，未觉三号支脉，已签三成塌耗死账。此子昨日耗空护身火器且旧伤咳喘，随身携五十枚安家灵石与全套新领盾刃。廿一子时东院木窗悬红灯为号，请乌大人如约入谷摘头交割两成精矿，灵石法器照旧三七分账，务求一刀毙命勿留活口。”\n\n不仅要拿他的人头平矿账，连他口袋里的安家灵石和制式法器都已经算好三七分赃了。\n\n陈长庚指尖微热，用真气将火漆边缘重新烘软合拢得毫无破绽，原样绑回夜枭爪间。\n\n不能扣杀这只夜枭，一旦黑风寨收不到回信，生性多疑的乌横岭必会改期或调大队强攻。\n\n手臂轻扬，醒转的灰羽夜枭扑棱棱振翅高飞，眨眼间没入北方茫茫夜幕。\n\n下半夜四更，整座黑石峪死寂无声。\n\n陈长庚换上黑衣掠至谷口瓮城。\n\n这里两侧焦岩高耸近十丈，中间仅留一条丈余宽的碎石夹道，平日北风顺谷狂灌，正是天然的聚风口袋。\n\n他对照脑海中苏清晏留下的半部《地脉敛息阵图》，攀上两侧绝壁暗风眼，将三枚寒磁母铁精炼而成的破磁铁钎呈倒三角深深钉入岩髓，只留半寸乌黑钎尾隐在苔藓石缝下。\n\n一旦以周天真气隔空引动铁钎，谷口地磁风向便会在十息内瞬间逆转倒卷，将毒烟与烈火死死锁在瓮城之内！\n\n紧接着，陈长庚从储物袋摸出十枚裹满生铁砂的过载烈阳火珠，顺着瓮城两侧必经的乱石暗缝逐一埋妥，外覆黑煤碎屑，随身袖囊里仍稳稳留着七枚火珠压阵。\n\n天色将明前，陈长庚悄然返回东院，照常开门饮茶。\n\n转眼到了二月二十，酉初日落时分。\n\n残阳将谷口拉出道道狭长暗影，山下官道传来一阵沉闷的骡马响鼻与铁轮碾石声。\n\n每月二十例行给黑石峪运送糙米盐巴的脚夫车队到了。\n\n陈长庚站在东院高阶上随意扫了一眼谷口。\n\n五辆满载麻袋的骡车慢吞吞驶过拒马，赶车的都是满面菜色的凡俗老脚夫；可在最后一辆粮车高高垒起的麻袋阴影后，却跟着一个压低青竹帽檐、身穿灰麻短衣的精悍汉子。\n\n那汉子看似弓腰推车，虎口却布满常年握刀的厚茧，后背麻布下斜捆着一只三尺长的狭长黑木匣，一双阴鸷冷厉的三角眼刚进谷口便四下乱扫。\n\n没去粮仓卸货，那灰衣客趁着守门矿卫清点麻袋的空档，帽檐一压，踩着碎煤渣径直拐进了西头郑百斛独居的司炉房小院。"}, {"n": 105, "title": "黑吃黑饵", "body": "司炉房小院的木门“吱呀”一声从里头闩紧。\n\n郑百斛刚端起茶缸的手一哆嗦，看清灰衣客摘下竹笠后那张左眉断成两截的阴鸷瘦脸，脸色顿时沉了下来：\n\n“袁七？乌百夫长不是定了明晚子时再动手么，你混进粮车摸进来做什么？”\n\n被称作袁七的灰衣汉子反手卸下背后狭长黑木匣，“哐”地拍在八仙桌上，自顾自撩袍坐下：\n\n“郑老头，少拿乌大人的名头吓唬爷。老焦和樊缺耳前天折在谷口，寨子里弟兄都传你老小子暗投了新执事，乌大人叫爷先混进来摸摸你的心肝黑没黑！”\n\n“放他娘的狗臭屁！”\n\n郑百斛急得额角青筋直跳，压低嗓门骂道，“那两个蠢货轻敌冒进，被姓陈的小子拿压箱底的烈阳火珠炸了个措手不及，关老夫什么事？老夫昨晚才放夜枭把三成塌耗的画押账送过去！”\n\n袁七端起茶缸灌了一口凉茶，三角眼斜睨着他嘿嘿冷笑：\n\n“既没二心，那就把这半个月三号暗脉刨出来的两成火铜精砂先交出来，爷今夜验过成色，明晚大队才好进谷。”\n\n郑百斛眼神一缩，下意识护住腰间矿仓铜钥：“你少蒙老夫！按规矩向来是乌大人亲自验货三七分账，哪有提前交底货的道理？”\n\n“咔嚓！”\n\n袁七手掌一拍木匣机括，一柄泛着浓郁尸血腥气的开脉初期血煞长刀滑出半寸，冰冷刀尖直接抵上郑百斛咽喉：\n\n“老东西，你这八年私卖宗门精矿、勾结外匪截杀两任同门执事的红指印字据，此刻就在爷怀里揣着！”\n\n袁七凑近半尺，森然压低声音，“今天不把私藏精矿全吐出来，爷也不用等明晚了，这会儿就把字据扔进东院，看云泽宗刑律堂剥不剥你的老皮！”\n\n郑百斛气得浑身发抖，可对上袁七开脉初期的凶悍煞气，他一个通窍八窍的老司炉根本不够人家两刀劈的。\n\n就在两人僵持不下之际——\n\n隔着两道矮墙的东侧执事石院里，忽然传出一声压抑不住的气闷痛哼，紧接着是一阵撕心裂肺的剧烈呛咳，屋里青赤灵光乱闪了两下便骤然黯淡下去！\n\n院墙角落阴影里，负手立在暗风口旁的陈长庚收回刚散出的一缕《赤卤开脉功》躁乱火气，眉眼冷淡如霜。\n\n司炉房内，袁七耳朵猛地一竖，眼中凶光陡然大炽：\n\n“东院那动静，是新来的姓陈小子练功岔气了？”\n\n郑百斛擦了把脖子上的冷汗，顺口恨声道：“可不是么！那泥腿子在古盐墟伤了心肺根子，前天又耗光了护身火器，这两天进坑闻点煤烟都喘得像破风箱！”\n\n袁七眼珠子骨碌碌一转，呼吸瞬间粗重起来。\n\n按黑风寨规矩，明晚乌横岭亲自带队进谷，新执事身上的五十块安家灵石和全套制式灵器，乌横岭一个人就得吃下七成大头，他们底下人顶多喝口肉汤。\n\n可要是趁着这病秧子今夜行功岔气，自己逼着郑百斛带路先把人头摘了呢？\n\n灵石法器全归自己独吞，明日只需提着人头去寨口领赏，乌横岭还能挑出什么理来！\n\n“郑老头，想保住你那份私矿分成也不难。”\n\n袁七猛地抓起血煞长刀，一把揪住郑百斛衣领，“三更天你去敲开东院门引路，咱俩先把那病鬼剁了！他兜里的安家灵石归爷，矿仓里那半成浮财爷一个子儿不碰你的！”\n\n郑百斛吓了一跳，连声摆手：“使不得！乌大人最恨手底下人吃独食，万一那小子院里还有保命符箓……”\n\n“少废话！你不带路，爷现在就先捅穿你的心窝子！”袁七刀锋往前一送，血珠当场渗出皮肉。\n\n郑百斛脸色惨白，咬了咬后槽牙，心想横竖陈长庚已经是个没牙的病虎，早死一晚晚死一晚都是死，当即狠心点头：\n\n“成！东院没设什么大阵，老夫认得通内室的后窗暗栓，三更半夜摸进去一刀挑断他脖子！”\n\n夜交子初，山风呜咽，黑石峪万籁俱寂。\n\n两道黑影贴着内谷石墙根一路摸到东院后窗外。\n\n屋内黑漆漆一片，土炕青帐后隐约隆起一道蜷缩的人影，正发出微弱断续的粗重喘息。\n\n袁七贴在窗纸边用灵识悄悄扫过床榻，只觉帐内那股浮散燥热的《赤卤开脉功》气机弱如游丝，再无半分疑心。\n\n他冲郑百斛比了个割喉手势，指尖刀气无声挑断木栓，两人一前一后如狸猫般翻进内室！\n\n“小畜生，下辈子投胎长点眼！”\n\n袁七狞笑暴起，全身开脉初期血煞灌入三尺长刀，照着青帐中隆起的人影脖颈狠辣劈落！\n\n“嗤啦——！”\n\n刀光如匹练撕碎帐幔，将底下被褥连同青石炕沿劈开一道尺许深痕！\n\n没有半滴鲜血溅起。\n\n飞扬的棉絮底下，只有两捆裹着旧道袍的干麦秸，枕头下压着半块刻满敛息残纹的废铜片，刚才那微弱呼吸与浮散气机，竟全是铜片借地火余温拟出的假象！\n\n“空的？！”\n\n袁七瞳孔骤缩，一股寒气从脚底板直冲天灵盖！\n\n“轰隆！”\n\n还没等他转身扑向窗口，内室通往外厅与后窗的两道千斤精铁暗闸同时轰然砸落，严丝合缝卡进石槽，石壁四周预抹的九宫隔音泥印微光一闪，瞬间将整间石室化作一座密不透风的铁棺材！\n\n“姓郑的老狗，你敢联合外人给老子下套？！”\n\n袁七惊怒欲狂，压根不听郑百斛辩解，回身一刀便照着郑百斛脑袋狠劈下去！\n\n“袁爷饶命！我真不知道——啊！！”\n\n郑百斛魂都吓飞了，拼命横起百炼铁尺格挡，“铛”地一声火星四溅，通窍八窍的气力哪挡得住含怒一击，铁尺当场崩飞，血煞刀锋顺势劈进他左肩琵琶骨，深可见骨的刀口鲜血狂飙！\n\n郑百斛惨嚎一声跌翻在地，袁七红着眼抢步上前，举刀便要彻底结果这老贼，再去劈石闸突围：\n\n“给老子陪葬吧！”\n\n就在他旧力劈出、后背空门大开的刹那。\n\n石室高处拳头大的排烟铁格栅悄然滑开。\n\n廊外月影下，陈长庚神色漠然，右手食中二指轻轻一并。\n\n“咻咻咻——！”\n\n三柄早已蓄势待发的百炼乌金飞刃化作三道夺命乌电破孔而入，快得连破风声都凝成一线！\n\n第一柄直接斩断袁七持刀右腕，第二柄洞穿其护体血煞钉入后心，第三柄自左耳横贯太阳穴穿颅而出！\n\n袁七举刀的狰狞动作猛地定格在半空，喉咙里连半声惨叫都没挤出来，壮硕身躯“噗通”砸在郑百斛腿上，抽搐两下便彻底断了气。\n\n一袋鼓囊囊的储物袋与怀里那叠按满红指印的旧字据，顺着敞开的衣襟滑落进血泊。\n\n石室侧门暗锁轻响，陈长庚迈步走了进来。\n\n郑百斛捂着血如泉涌的左肩，看着三息前还凶神恶煞的开脉魔修转眼成了死尸，又抬头对上陈长庚那双没有一丝温度的眸子，裤裆一热，整个人瘫在血水里把脑门磕得砰砰直响：\n\n“陈师叔饶命！师叔饶命啊！全是这魔门杀才拿刀逼小的引路，小的也是被猪油蒙了心啊！”\n\n陈长庚没看他，弯腰拾起血泊里那叠通敌私卖字据，轻轻吹了吹纸角沾上的血珠，居高临下问道：\n\n“郑司炉在黑石峪熬了八年，账算得比我精。不妨自己说说，还想不想留条全尸？”"}, {"n": 106, "title": "借笔钓虎", "body": "冰冷的乌金飞刃悬在头顶三寸，刃尖未干的魔修鲜血一滴一滴砸在郑百斛鼻梁上。\n\n死亡贴着脑门打转，郑百斛哪还顾得上替本山主子守口如瓶，忍着肩骨碎裂的剧痛，竹筒倒豆子般嘶声哭招：\n\n“小的全招！只求师叔给个痛快，莫拿分水刺挑小的经脉！”\n\n“三号废洞后头那条火铜富脉，是三年前器堂龚铁横执事带人巡矿时暗中封起来的！龚铁横每月逼小的偷挖两成高纯精铜，一半走黑风寨乌横岭的路子换成灵石送回本山孝敬器堂掌矿鲁长老，另一半归乌横岭抵买路钱！”\n\n陈长庚垂眸翻看着手中字据，语气平淡：“前两任孙执事和赵执事，也是龚铁横叫你勾结乌横岭杀的？”\n\n“是、是龚铁横下的暗话！”\n\n郑百斛涕泪糊了一脸，哆嗦着指天发誓，“那两位师叔性子轴，查出三号洞猫腻后死活不肯在三成塌耗册上画押，还要上刑律堂参一本！龚铁横怕捅破鲁长老的黑账，就叫小的夜里挂红灯引乌横岭进谷灭口，对外全推到玄煞门游骑头上！”\n\n说到这儿，郑百斛生怕筹码不够买命，忍痛用右手从贴身油布兜里摸出一本巴掌大的黑皮暗册与一只灰布袋，双手高举过顶：\n\n“师叔请看！这本暗册里记着近两年龚铁横派心腹来提黑钱的亲笔签押，还有三封往来密条，全藏在小的司炉房灶底暗砖里，这灰袋里是小的攒下的三十枚下品灵石，一分不留全献给师叔！”\n\n陈长庚隔空摄过灰布袋与黑皮暗册。\n\n神识扫过袋内三十枚成色尚可的下品灵石，随手拨入青云储物袋——加上原有的二百五十枚，他手里的完整灵石已涨至二百八十枚整。\n\n再翻开那本黑皮暗册，前半截密密麻麻记着乌横岭交割精铜的斤两，后半截果然贴着几张盖有龚铁横私章的收款暗条，连末尾拨给鲁长老院中采买寿礼的折算数目都写得明明白白。\n\n至于鲁长老上头还有没有别人，郑百斛这等外驻老狗显然摸不到边。\n\n足够了。\n\n有这叠东西压箱底，月底回山核销时，足够把龚铁横那张吃人嘴脸敲碎满地牙。\n\n“郑司炉倒是个留心眼的人。”\n\n陈长庚收起暗册，从袁七尸身上摸出一张玄煞门特制的赤磷传讯火符与一管狼毫笔，丢在郑百斛膝前：\n\n“乌横岭生性多疑，袁七今夜没回信，明晚子时他未必肯轻易钻进谷口。”\n\n郑百斛怔了怔，颤声问：“师叔的意思是……”\n\n“按你平日跟黑风寨通气的暗语，给乌横岭发一道加急火符。”\n\n陈长庚慢条斯理开口，“就说今日傍晚运粮队顺带送来了巡脉堂补拨的一百枚修卡抚恤灵石，暂锁在谷口司炉房铁柜里；新执事练功岔气卧床不起，袁七已留在司炉房看住灵石，请他明晚提前半个时辰轻装疾袭，省得夜长梦多。”\n\n郑百斛倒抽一口凉气！\n\n一百枚现成的抚恤灵石，再加上袁七在谷口接应的准信——乌横岭那种见利忘命的豺狼，一旦接着这道亲笔火符，非但不会起疑，准保甩开大队累赘，带着几名心腹快马抢先入瓮！\n\n为了保住一条残命，郑百斛半点花样都不敢耍，趴在青石地上咬牙写完暗语，盖上自己的私印指模。\n\n陈长庚仔细核对过他往日字据的笔锋与暗号折角，确认毫无破绽，这才推开后窗一角，将赤磷火符激发化作一道微不可察的暗红细线射向北空。\n\n“师叔，火符发了，您答应饶小的……”\n\n郑百斛话没说完，陈长庚指尖三缕凝练煞劲连点，瞬间封死他周身九处气窍与咽喉哑穴，顺手震散其大半心神。\n\n郑百斛双目猛地涣散失神，软绵绵瘫倒在地，连一根小指头都动弹不得。\n\n陈长庚将袁七尸首烧成焦灰混入煤堆，唯有那把崩了口的开脉初期血煞长刀留了下来，随后提起烂泥般的郑百斛掠回西头司炉房。\n\n院门口守夜的心腹矿卫刁三正缩着脖子打瞌睡，听见风声刚一抬头：“郑爷，东院得手——”\n\n一只铁掌无声按在他后颈大椎穴上，暗劲一吐便震断其生机。\n\n陈长庚将刁三尸首塞进柴房草垛，把昏沉失神的郑百斛端端正正架坐在司炉房正对门口的太师椅上，重新掩好院门。\n\n次日二月二十一，白昼风平浪静。\n\n陈长庚白日里照旧露面巡了一圈二号明坑，吩咐代管工头的老矿匠岳铁脊今夜地火风冲，天黑后把三十名矿役全撤进内坑深处石室歇宿，落锁不许外出。\n\n岳铁脊刚得过酱肉恩惠，二话不说拍着胸脯把人全拢进了深坑。\n\n熬到戌末入夜，整座外谷空无一人。\n\n陈长庚悄然钻入三号废洞深处。\n\n刚靠近那口翻涌紫绿气泡的温热铜煞泉眼，一阵密集细碎、令人头皮发麻的金铁摩擦“沙沙”声便从泉边软泥下传了出来！\n\n成了！\n\n陈长庚拂开表层九宫敛息泥印。\n\n只见吸干了整整两日二阶铜煞泉精华的一百零四粒紫黑虫卵，此刻已尽数破壳而出！\n\n百余只蚕豆大小的新生煞甲虫通体漆黑如墨，背甲上天然生出三道妖异锋锐的暗紫铜纹，一对锯齿钢颚开合间寒芒闪烁，气息竟一生下来便直追一阶中品！\n\n只是刚破壳的虫群凶戾饥渴到了极点，正焦躁地啃咬泉边坚硬火铜矿石，咬得火星乱蹦。\n\n陈长庚早有准备，从储物袋取出昨夜缴获袁七的那柄血煞废刀，连同先前樊缺耳留下的那对百炼铜锤一并丢进虫群中央：\n\n“吃饱些，半个时辰后有大餐。”\n\n“嗡——！！”\n\n百零四只紫纹变异甲虫闻见法器精铁与血煞气息，瞬间化作一团紫黑旋风扑了上去！\n\n令人牙酸的“咔嚓”啃噬声密集响起，不过两刻钟工夫，整把一阶血煞长刀与两只精铁铜锤竟被啃得连渣都不剩！\n\n吞尽精铁血煞的新虫背甲紫纹彻底硬化定型，稳稳踏入一阶中上品之列。\n\n陈长庚放出左袖原有的三十六只一阶巅峰老虫作为头领，神念微引，整整一百四十只新旧嗜铁煞甲虫井然有序化作一道紫黑细流，悄然归入加宽的左袖软革御虫囊中。\n\n重返谷口瓮城阴影时，夜交亥末，距子时恰差半个时辰。\n\n铅云遮死星月，谷口风声凄紧。\n\n陈长庚垂手立在司炉房斜对面的乱石哨楼暗影里，将三柄百炼乌金飞刃悄然悬入上方崖口石缝，右手扣住四枚过载烈阳火珠。\n\n极目北望，三里外的漆黑荒原冻土上，五骑快马蹄包棉布，正贴着夜色朝黑石峪谷口疾驰而来。"}, {"n": 107, "title": "瓮谷焚煞", "body": "五匹杂血黑鳞马停在断界黑石峪谷口五十步外的老榆林下。\n\n为首骑士身材魁梧如铁塔，左脸爬满蜈蚣似的烧伤黑疤，一身凝厚沉重的开脉境中期尸煞之气压得胯下鳞马不安刨蹄，正是玄煞门黑风寨百夫长乌横岭！\n\n跟在他马后的四名玄煞门老卒个个都是通窍八九窍的悍匪，此刻盯着黑漆漆的谷口哨塔，一名尖嘴喽啰舔了舔嘴唇低笑道：\n\n“百夫长，司炉房檐下果然挂着红纸灯笼！姓郑的老小子还算识相，咱们这就冲进去搬那百块抚恤灵石？”\n\n“急着投胎不成？”\n\n乌横岭冷哼一声，翻身下马，伸手握住腰间那柄四尺长的二阶下品灵器“赤煞断魂刀”，一双狼似的黄眼珠子扫过两侧高耸幽暗的瓮城峭壁：\n\n“袁七那贪财鬼要是真捏住了百块灵石，这会儿早该蹲在拒马后头摇尾巴迎老子了，怎么连个人影都没露？”\n\n尖嘴喽啰一愣：“莫非是在屋里看住郑老头，怕那老小子反水？”\n\n“你们四个牵马守在瓮城外口，把风哨子含嘴里。”\n\n乌横岭生性多疑到了骨子里，半点险都不肯冒，“老子先进司炉房验一验郑百斛的舌头，十息内听不见老子击掌，立刻吹哨撤回黑风寨！”\n\n“遵命！”四名悍匪连忙散开卡住谷外退路。\n\n乌横岭足尖一点，周身开脉中期尸煞凝成一层厚达三寸的灰黑重甲，整个人如一头夜行暴熊悄无声息掠过瓮城夹道，一脚踹开了谷口内侧司炉房的虚掩木门！\n\n屋内一盏豆大油灯半明半暗。\n\n柴房草垛边露着刁三半截冰冷靴底，正堂太师椅上，郑百斛披着司炉袍端坐不动，脑袋低垂在胸前。\n\n“郑老狗，袁七人呢？”\n\n乌横岭右手按刀没有跨过门槛，左手抄起门边一根拨火铁棍，隔着五步远挑起郑百斛下巴！\n\n油灯光亮映上郑百斛老脸——只见他左肩衣袍底下塞满止血破布，一双浑浊眼珠子空洞涣散，喉咙里连半丝活人气劲都提不起来！\n\n气窍早被人封死了，这是个死饵！\n\n“中计了，撤！！”\n\n乌横岭反应快得骇人，不退反进手腕一翻，“铮”地拔出二阶赤煞断魂刀，顺手一刀狠辣掠过郑百斛脖颈将其枭首灭口，双足猛蹬地面，炮弹般朝着瓮城谷口倒射而出！\n\n“乌百夫长既然进了黑石峪，不喝杯热茶再走么？”\n\n一道平淡温和的嗓音自哨楼阴影上空响起。\n\n乌横岭刚冲入十丈高的瓮城碎石夹道正中，陈长庚左手隔空一抓，周天真气轰然引动两侧绝壁暗风眼里的三枚寒磁破磁铁钎！\n\n“嗡——呼啦！！”\n\n天地磁气骤然倒错，原本顺谷北吹的狂风在一息之间猛烈倒卷逆冲，化作一道旋转咆哮的黑风龙卷横堵谷口！\n\n紧接着，陈长庚右手屈指一弹，一缕赤火精准打入瓮城地面煤灰。\n\n两侧必经石缝里预埋的十枚过载烈阳火珠，同时被引信串联引爆！\n\n“轰轰轰轰——！！”\n\n地动山摇的连环巨响将狭窄瓮城彻底淹没在狂暴赤火与漫天破甲生铁砂之中，滚滚赤磷黑烟被逆转的地磁狂风死死锁在夹道里，化作一堵十丈高的烈焰风墙！\n\n“百夫长！！”\n\n瓮城外口看马的四名玄煞门喽啰被气浪掀翻在地，隔着咆哮火墙连里头半个人影都看不清，吓得脸色惨白乱喊：“谷口塌了还是炸了？！”\n\n烈火浓烟中心，一阵暴怒如狂狮的嘶吼骤然炸响：\n\n“区区几颗破火珠，也想困死你乌爷爷？给老子开！！”\n\n乌横岭到底是尸山血海杀出来的开脉中期悍将，仓促间催动全身尸煞护体，手中二阶赤煞断魂刀爆发出半丈长的刺目血芒，硬顶着漫天攒射的烧红生铁砂一刀劈开烟浪！\n\n虽然左臂与后背被狂暴铁砂撕开数道血口，护体尸煞甲也黯淡了三成，可他冲出火圈抬头一看——\n\n拦在碎石坪十步外的，竟只有一名身穿云泽宗青玉执事袍、独自撑着一面青鳞灵盾的年轻修士，周身散出的还是那路烂大街的《赤卤开脉功》虚浮火气，身旁连半个帮手都没有！\n\n“就你一个刚开脉的毛头小子？！”\n\n乌横岭先是一怔，随即怒极反笑，满脸蜈蚣刀疤狰狞扭曲，“老子还当巡脉堂埋了哪个老家伙！拿几颗火珠吓唬人，老子先把你劈成两半再冲出去！”\n\n杀心压倒了退意，乌横岭双脚踏碎青石，欺身暴进，手中二阶赤煞断魂刀挟着开脉中期碾压般的气势，当头一记力劈华山斩在青鳞灵盾正中！\n\n“铛——！！”\n\n刺耳爆鸣声中，青鳞灵盾灵光剧烈狂闪。\n\n盾后的陈长庚像是根本扛不住二阶重刀的霸道巨力，脸色刷地一白，双足在碎石地上犁出两道深沟，“蹬蹬蹬”狼狈暴退四步，持盾的右臂剧烈颤抖！\n\n“哈哈！果然是个靠火药撑场面的软脚虾！”\n\n一刀试出对方“根基虚浮”，乌横岭彻底没了顾忌，狞笑着再度欺前三大步，整个人已一步跨进陈长庚身前三丈之内，双手高举赤煞断魂刀，全身尸煞毫无保留压向刀锋：\n\n“把命和储物袋给老子交出来！”\n\n三丈。\n\n原本踉跄低头的陈长庚缓缓抬起眼帘，那双黑眸里哪还有一丝一毫的气虚慌乱，冷冽平静得宛如看一具死尸。\n\n“等的就是你跨过这三步。”\n\n话音未落，陈长庚左袖轰然鼓荡！\n\n“嗡——！！”\n\n一百四十道紫金与墨紫交织的凶戾暗影化作一股遮天蔽日的噬铁狂潮，在浓烟遮蔽下贴脸扑上乌横岭面门与前胸！\n\n“什么东西？！灵虫？！”\n\n乌横岭头皮炸裂，想收刀回防已然太迟！\n\n三十六只一阶巅峰老虫带着百零四只刚吞过血煞刀的紫纹变异甲虫，一口咬在他那层厚达三寸的开脉中期尸煞重甲上！\n\n寻常一阶法器都砍不动的浓郁尸煞，在百四十副锯齿钢颚的疯狂攒咬下，竟像腐朽棉絮般“嗤啦”一声被撕开碗口大的破洞，数十只紫纹甲虫顺势钻进甲缝，狠狠噬向他胸腹经脉！\n\n乌横岭剧痛攻心，挥刀的满身真气瞬间溃散一滞！\n\n就在这一息僵直间，陈长庚体内紫金仙脉与三千五百斤暗金锻骨巨力轰然全开！\n\n他一步踏碎脚下青石，左手乌金破甲分水刺如毒龙出洞，“铛”地精准架偏劈落的二阶断魂刀，右手五指箕张，四枚早已捏燃引线的过载烈阳火珠直接严严实实拍进乌横岭胸口破甲窟窿里，借着反震之力飘身后撤三丈！\n\n“不——！！”\n\n乌横岭亡魂皆冒的嘶吼刚出口，四枚过载火珠贴着他心口皮肉轰然炸裂！\n\n震耳欲聋的赤金火团将他整个人吞没，乌横岭胸骨寸寸碎裂，仰天狂喷出一大口夹杂内脏碎块的黑血，魁梧身躯如断线风筝般倒飞出去，“咔嚓”撞断司炉房门前的粗木梁柱！\n\n烟尘未落，瘫在废墟血泊里的乌横岭眼底闪过一抹亡命狠戾，左手毫不停留狠咬舌尖一口精血喷在腰间，一把捏碎了那枚压箱底的二阶血遁骨符。"}, {"n": 108, "title": "斩将立旗", "body": "二阶血遁骨符碎裂的刹那，一团刺目妖异的血色光茧瞬间裹住乌横岭残破的身躯。\n\n“小杂种，等老子回黑风寨调齐五百铁骑，必将你碎尸万段！”\n\n怨毒嘶吼声中，那团血光甚至顾不得冲撞谷口逆风火墙，贴着司炉房后侧陡峭山壁拔地而起，直奔十丈高的瓮城东崖口亡命电射而去！\n\n二阶血遁符瞬息百丈，一旦让他翻过崖顶遁入荒原夜幕，以青鳞灵盾的御风脚力绝难追上。\n\n碎石坪上，陈长庚连一步都没追，只抬头望着那道扑向东崖口的血虹，右手双指对着半空轻轻一引：\n\n“绞。”\n\n乌横岭化作的血光刚冲到东崖口狭窄一线天，二阶血遁初发、肉身支点尚未彻底化入血影的瞬间——\n\n崖口两侧漆黑石缝里，三柄早已敛息悬伏多时的百炼乌金飞刃骤然暴起！\n\n三道乌黑寒芒呈品字形首尾咬合，灌足陈长庚开脉境初期顶峰的浑厚真气，化作一轮高速旋转的夺命绞盘，迎头撞进血色光茧最薄弱的下盘！\n\n“噗嗤！咔嚓！！”\n\n血光应声溃散，两截齐膝斩断的小腿带着滚烫血雨从半空抛飞出去！\n\n“啊——！！半空怎么还有伏刃？！”\n\n乌横岭发出凄厉绝望的惨嚎，失去双腿平衡的残躯重重从三丈高的崖壁滚落下来，砸进碎石堆里动弹不得。\n\n风声微动，陈长庚足踏青鳞灵盾如鬼魅般欺至跟前。\n\n乌横岭捂着狂涌鲜血的断膝，吓得肝胆俱裂，右手哆嗦着刚想去摸地上掉落的二阶赤煞断魂刀：“饶命！云泽宗器堂龚铁横每年分我黑风寨两成暗矿，你留我一命，我替你指证——”\n\n“不必了，信你自己揣着就行。”\n\n陈长庚半句废话不多听，手中九寸三分乌金破甲分水刺寒光一闪，“噗”地自乌横岭眉心正中一刺贯入，震碎识海生机！\n\n叱咤边荒数年的玄煞门开脉中期百夫长，双目圆瞪，彻底气绝身亡。\n\n陈长庚手腕一翻拔出分水刺，召回半空三柄乌金飞刃与全部百四十只嗜铁煞甲虫塞回袖囊，随即一步踏上四尺青鳞灵盾，顶开渐弱的谷口烟墙疾冲而出！\n\n瓮城外口的老榆林下，四名看马的玄煞门通窍悍匪刚听见崖口传来自家百夫长的凄厉惨叫，魂儿都吓飞了九成！\n\n“那声音是百夫长？！快上马，点子扎手！”\n\n尖嘴喽啰翻身刚蹿上黑鳞马背，浓烟翻滚的谷口内已破空射出一道凌厉青虹！\n\n“分开跑！回寨子报信！”\n\n四人骇得连哨子都忘了吹，狠抽马臀便往四个方向亡命狂奔！\n\n“一个都别走。”\n\n半空青鳞灵盾上，陈长庚眼神冰冷，右手并指连点三次。\n\n三柄百炼乌金飞刃在夜空中拉出三道凄冷黑线，后发先至！\n\n“噗！噗！噗！”\n\n冲出不足三十步的三名通窍八窍悍匪连头都没回过来，后心便被飞刃洞穿，一头栽下马背滚进冻土沟里！\n\n跑在最前头的尖嘴喽啰吓得亡魂皆冒，猛地回身甩出两枚毒蒺藜想要阻敌，陈长庚已驾着青鳞灵盾追至马尾，灌注三千五百斤横练巨力的盾沿如铡刀般横拍而过！\n\n“咔嚓！”\n\n毒蒺藜连人带铁甲被一盾拍得胸骨尽碎，尖嘴喽啰喷血飞出两丈远，抽搐一下便没了声息。\n\n前后不过十余息，谷外四名随行精锐连同五匹黑鳞马尽数伏诛，荒原重归死寂。\n\n陈长庚落回地面，不疾不徐地把四具尸首与战马拖回谷口瓮城，先摘下乌横岭腰间那只宽大的血纹储物袋抹去烙印。\n\n神识探入一扫，饶是他心志沉稳，眼底也不由掠过一抹笑意。\n\n袋内除了杂七杂八的魔门血丹与兽皮，角落里整整齐齐码着一百二十枚灵气充沛的完整下品灵石！\n\n算上先前二百八十枚，他手头的完整下品灵石正好凑齐整整四百枚大关！\n\n除此之外，地上那柄材质极佳的二阶下品灵器“赤煞断魂刀”完好无损，储物袋夹层油包里更躺着三封盖有器堂外务暗印、与郑百斛暗册严丝合缝对得上的分赃密信。\n\n“龚师兄催我提前四天来黑石峪送死，没想到送了这么大一份厚礼。”\n\n陈长庚将四百枚灵石、二阶赤煞断魂刀与三封密信贴身收妥，只留出一把寻常一阶血刀与几块碎银充作明面缴获，开始动手清理战场。\n\n他提着乌横岭那把赤煞断魂刀，催动残余刀煞，将乌横岭胸前与喽啰尸身上凡是沾着煞甲虫啃咬细孔或分水刺窄伤的皮肉尽数顺着伤口劈开，再摸出一枚高纯地火精石碾碎扬在尸堆边缘，引燃残存赤磷柴火烘烤一圈。\n\n再借乌横岭刀锋在司炉房柱子上多砍出几道深痕，把无头郑百斛的尸首与半本撕碎的假分赃草纸摆在门边。\n\n如此一来，整座谷口现场脉络清晰得不能再清晰——\n\n驻矿司炉郑百斛私通玄煞门百夫长乌横岭，因分赃不均在司炉房爆发内讧被乌横岭一刀枭首；新任巡脉执事陈长庚闻讯赶至，依托瓮城窄道耗尽随身烈阳火珠炸伤强敌，拼着经脉震荡用乌金飞刃险胜补刀，全歼来犯魔骑！\n\n哪怕刑律堂许镇岳亲自拿放大镜来查，也挑不出半根骨头刺。\n\n做完这一切，天边已泛起一抹鱼肚白，时交二月二十二卯初。\n\n陈长庚收起那柄二阶赤煞断魂刀，走到谷口碎石坪前，单手抓起那块被劈断的云泽宗青石界碑残座重重夯入冻土，再将旁边倒塌的三丈精铁旗杆单臂立起卡牢。\n\n他提起乌横岭那颗满脸蜈蚣刀疤、死不瞑目的血淋淋首级，扣在精铁锁链挂钩上，手腕一拉。\n\n“哗啦啦——”\n\n染血铁链顺着滑轮一路升至三丈旗杆最顶端，连同重挂上去的云泽宗青云边旗在破晓寒风中猎猎作响。\n\n内坑深处传来铁锁开启的轻响。\n\n躲了一整夜的断指老矿匠岳铁脊握着一把豁口铁镐，领着三十名面黄肌瘦的矿役战战兢兢探出坑口，正撞上晨光刺破谷口残雾，第一眼便看见了界碑旗杆顶端那颗高悬滴血的百夫长首级。"}, {"n": 109, "title": "清仓锁脉", "body": "破晓寒风吹动界碑顶端的青云边旗，铁链碰撞发出清脆轻响。\n\n乌横岭那颗布满蜈蚣刀疤的首级高悬三丈之上，未干的暗红血珠顺着断颈往下滴落，砸在冻硬的碎石坪上。\n\n“噗通！”\n\n断指老矿匠岳铁脊手里的豁口铁镐掉在地上，双膝一弯跪倒在坑口。\n\n身后三十名熬得瘦骨嶙峋的矿役看清那张在边荒能止小儿夜啼的凶脸，浑身剧颤，黑压压跪倒一片，连大气都不敢重喘：\n\n“小的们叩见执事师叔！”\n\n前两任巡脉执事来时也穿过这样体面的青玉道袍，可没过二十天便成了荒岭野狼腹中的碎肉。\n\n唯有眼前这位看似年轻和气的陈师叔，单枪匹马进谷不过四天，竟把盘踞黑风寨多年的开脉中期活阎王挂上了旗杆！\n\n陈长庚站在司炉房残破的石阶前，青玉道袍袖口沾着几缕故意熏上的烟灰，脸色略显苍白。\n\n他抬手虚扶了一下，声音平静却透进每个人耳朵里：\n\n“都起来。玄煞门袭营马队连同吃里扒外的内奸郑百斛，昨夜已尽数伏诛。”\n\n岳铁脊咽了口唾沫，大着胆子抬头觑见司炉房门口那具穿着司炉袍的无头尸首，心头狂跳：“郑、郑司炉他……”\n\n“私通黑风寨，扣下你们的血汗矿砂换买路钱，分赃不均被乌横岭亲手砍了脑袋。”\n\n陈长庚迈步走到矿仓廊下，指了指墙角那杆郑百斛用了八年、砣底暗灌铅水的百斤大铁秤：\n\n“岳老丈，去把那杆黑心秤搬过来。”\n\n岳铁脊连忙起身，叫上两名壮实矿工合力将大铁秤抬到坪中。\n\n陈长庚没动飞刃，只右脚抬起轻轻一踏。\n\n“咔嚓！”\n\n重逾三十斤的灌铅黑铁砣当场裂成两半，里头灰白色的劣铅内芯滚落一地。\n\n周围矿役看着那团铅芯，眼睛顿时红了。这些年他们每天多背两筐矿石还挨鞭子扣糙饼，全填了这颗黑秤砣的无底洞！\n\n“从今日起，黑石峪废除私秤，按宗门制式官斛交课。”\n\n陈长庚从袖中摸出一只装有三十枚下品灵石的灰布袋——正是昨夜从郑百斛怀里搜出的那笔黑账赃款，随手抛进岳铁脊怀里：\n\n“郑百斛已死，司炉房不能空着。岳老丈在黑石峪熬了十几年，熟悉坑道火候，暂代驻矿司炉一职。”\n\n岳铁脊双手捧着沉甸甸的灵石袋，手背青筋直抖：“师叔！小老儿只是个断指凡人，哪担得起三十块仙石……”\n\n“不是白赏你的。”\n\n陈长庚语气淡然，“十枚换成白面咸肉给坑里弟兄补身子，余下二十枚雇石匠把谷口坍塌的哨塔石垒重新砌高三尺。月底前我要看到足抵两个月正课的火铜精矿装车，办得妥么？”\n\n不用再挨黑鞭，还有白面咸肉吃！\n\n三十名矿役轰然磕头谢恩，岳铁脊眼眶通红，把胸脯拍得山响：“师叔但凡信得过小老儿，月底少一斤精铜，小老儿提脑袋来见！”\n\n上午辰末，陈长庚带着岳铁脊独自进了一趟西头三号废洞。\n\n他只领岳铁脊走到支脉前半段那片裸露的火铜矿苗前，吩咐挑十名嘴巴严实的老矿匠每日定额开采表层明矿，既够抵足宗门双月正课，又能攒出三成干净的精铜羡余。\n\n至于支脉最深处那口温热铜煞泉眼与高纯富矿芯，早在他进洞前便用三块千斤断龙石配合《地脉敛息阵图》封成了天然绝壁，连岳铁脊这老把式都没瞧出石壁后头另有乾坤。\n\n安顿好外坑庶务，转眼到了二月二十二午后未初。\n\n内谷主熔炉升起滚滚刺鼻的炼铜黄烟。\n\n陈长庚独自关紧东侧司炉内房铁门，掐算时辰，距离十九日午初在铜煞泉开炉，怀中那尊缺角蚀纹石臼恰满三十六个时辰地脉潮汐。\n\n他将石臼贴在引火地脉砖口上，取出昨夜从魔骑尸身上收来的两截崩裂魔门血煞刀片，又铲入两捧从三号支脉深处刮回的二阶伴生毒铜渣，一并按入臼心。\n\n至于乌横岭那柄完好无损的二阶下品灵器“赤煞断魂刀”，自然连同净存的三百七十枚完整灵石严严实实锁在储物袋深处，绝不轻动。\n\n“嗡——”\n\n暗金裂痕微亮，石臼无声运转。\n\n一刻钟后，收尾迸发的浓烈腥甜异香顺着排烟暗管直接冲入外头沸腾的炼铜高炉，被漫天硫磺黄烟搅得无影无踪。\n\n臼底凝出小半撮澄澈紫金的二阶煞髓晶砂，边角另有十余粒细碎晶屑。\n\n陈长庚先放出左袖那一百四十只新旧嗜铁煞甲虫，任由百零四只紫纹新虫分食二阶晶屑。\n\n细密吞咽声过后，百余只新虫背甲上的三条暗紫铜纹愈发深邃坚硬，气息彻底稳固在一阶中上品，收发如心。\n\n陈长庚这才将掌心那小半撮温润晶砂仰头吞下。\n\n零丹毒的精纯煞髓化入紫金仙脉，昨夜连番催动飞刃灵盾消耗的真气顷刻补满，体表暗金地火煞罡隐隐透出一丝百炼精铜般的沉凝质感。\n\n申末酉初，暮色四合。\n\n谷口高空忽然掠来两道急促青光，落在界碑碎石坪前，显出两名身穿云泽宗巡脉执事袍的中年修士。\n\n左边国字脸执事姓周，右边瘦高个姓林，正是驻守南面三十里赤松卡与白石卡的邻防同僚。\n\n两人本是瞧见昨夜黑石峪火光冲天，拖到白日才结伴过来收尸报丧，谁知刚落地一抬头，正好对上旗杆顶端乌横岭那双死不瞑目的黄眼珠子！\n\n“嘶——这不是黑风寨那个开脉中期的屠夫乌横岭吗？！”\n\n林执事倒抽一口凉气，快步冲到旗杆下仰脖子细看，“左脸蜈蚣疤，错不了！前两月鲁长老派两名开脉初期师弟围剿他都折了一人，怎么死在黑石峪了？！”\n\n陈长庚披着一件半旧大氅从石阶上慢步迎下，脸色微白，抬手掩唇轻轻吁了口气，拱手苦笑道：\n\n“原是周师兄、林师兄大驾。昨夜郑百斛勾结乌横岭入谷分赃，一言不合先动了刀，小弟把攒下保命的十几颗烈阳火珠全砸进了瓮城，也是侥幸捡回半条残命。”\n\n没有刻意咳血做戏，只是周身那股《赤卤开脉功》真气显得有些透支散乱，加上瓮城两侧焦黑炸裂的岩壁与郑百斛无头尸首做证，两名老油条执事顿时信了十成十！\n\n周执事绕着现场转了一圈，啧啧惊叹：“好家伙，拿十几颗高阶火珠把瓮城炸成铁炉子，陈师弟这手笔够果决！这可是实打实的斩将头功啊！”\n\n“小弟初来乍到，怕月底回山核销时器堂那边对郑百斛之死有闲话。”\n\n陈长庚顺势从袖中取出一纸早写好的战况勘验文书与两小包上好雨前灵茶，温和递了过去，“还得劳烦两位师兄做个联防见证，顺手签个押。”\n\n不沾风险还能白落一位狠人同僚的人情，周、林二人满口应承，当场核验尸首签字钤印，又客套叮嘱陈长庚好生养伤，这才御器离去。\n\n送走两名同僚，谷口重归清静。\n\n代司炉岳铁脊端着一盘刚烙熟的白面葱油饼和一壶粗茶走上东院石阶，放下托盘后却搓着断指站在门边，欲言又止。\n\n陈长庚端起粗茶吹了吹热气：“坑里出岔子了？”\n\n“回师叔，坑里顺当得很。”\n\n岳铁脊左右看了一眼，压低嗓门低声道，“只是今早小老儿差人去北面二十里灰铁荒矿换铁钎，听那边的苦力嚼舌根，说这两天荒矿茶棚来了两个佩咱们云泽宗内门剑穗的生面孔，正花大价钱四处打听去年从沧溟大泽逃荒过来的老盐工呢。”"}, {"n": 110, "title": "矿火温酒", "body": "“沧溟大泽逃荒来的老盐工？”\n\n陈长庚握着粗瓷茶盏的手指稳稳当当，连茶面浮沫都没晃一下，只随口似地抬眼问了一句：\n\n“这北边荒山野岭离大泽足有两三百里，咱们内门师兄不去巡矿，跑去三不管的野矿找凡人盐工做什么？”\n\n岳铁脊摇了摇头，拿袖口擦了擦额头汗水：“这小老儿哪敢瞎打听，许是哪个盐工手脚不干净偷了宗门物件逃出来的吧？小老儿就是瞧那地界离咱们黑石峪近，怕生出乱子，才跟师叔提个醒。”\n\n“老丈费心了，外境的闲事咱们不掺和，守好自家谷口便是。”\n\n陈长庚温和颔首，示意他先去忙活砌墙差事。\n\n接下来一整日，黑石峪内外风平浪静。\n\n乌横岭那颗人头高高挂在界碑旗杆上迎风晃荡，震慑效果比十座箭塔还管用。\n\n白日里岳铁脊派高脚哨兵爬上北岭瞭望，往常隔三差五来山口转悠放冷箭的玄煞门游骑，这两天连个马毛都没敢露，听说黑风寨残部吓得往北连撤了三十里设防。\n\n到了二月二十三，戌初入夜。\n\n山谷褪去了白日叮叮当当的锤石喧嚣，春寒料峭，漫天星子亮得像水洗过一般。\n\n自打二月十一在废渣谷冲关开脉，接着升仙殿夺印、暴雨算旧账、千里奔袭连斩魔门悍匪，陈长庚这根弦已经紧绷了整整十二天。\n\n眼下防区铁桶一般，蚀纹石臼尚在冷却，正是松一口气的时候。\n\n东侧石院打扫得干干净净，陈长庚褪下那身挺括却拘束的执事道袍，只穿一件宽松暖和的青棉夹袄，在院心青石桌旁支起一只巴掌高的红泥小炭炉。\n\n炭火烧得通红无烟，上头架着一口黑陶砂锅。\n\n午后刚从运粮脚夫手里买来的半扇肥嫩黄羊肋排剁成寸段，配着山里挖的甜白水萝卜与几片老姜，在滚汤里咕嘟咕嘟翻着奶白油花，浓郁肉香混着淡淡花椒气飘满小院。\n\n院门外传来拘谨的敲门声，岳铁脊换了件洗得发白却没补丁的粗布短褂，手里拎着半坛封泥老高粱酒站在门外。\n\n“站在外头做什么，进来坐，锅里萝卜刚炖烂。”陈长庚拿竹筷敲了敲砂锅沿。\n\n“哎！小老儿哪敢跟仙师老爷同桌……”\n\n岳铁脊嘴上惶恐推辞，被陈长庚随手按在石凳上，看着面前满满一粗碗炖得脱骨的黄羊肉，粗糙眼角不由跳了跳。\n\n陈长庚拿过他带来的高粱酒拍开泥封，架在炭炉边温了一会儿，给两人各满上一小盅：\n\n“在坑里你是代司炉，关起院门就是两个守荒山的人，尝尝火候老没老。”\n\n“不老不老！香得小老儿舌头都快吞下去了！”\n\n岳铁脊双手端起酒盅敬过，一仰脖子灌进肚里，辛辣暖流顺着喉管滚下，连日提心吊胆的寒气顿时散了大半。\n\n他夹起一块肥瘦相间的羊肋排大口嚼着，话匣子也跟着热乎起来，讲起早年三宗还没划清地界时，散修和矿工在断界山抢水井的旧闻轶事。\n\n陈长庚慢条斯理吃着清甜水萝卜，偶尔添一筷子炭火，听得津津有味。\n\n没有尔虞我诈的试探，只有山风吹过屋檐、砂锅汤汁微沸的实在烟火声。\n\n三盅温酒下肚，岳铁脊脸膛微红，放下筷子感叹道：\n\n“说起来，还是咱们背靠大宗门的矿场安生。像北面二十里外那座灰铁荒矿，夹在咱们云泽宗、玄煞门和血河宗三家缝隙里，矿脉又杂又瘦，哪家大派都懒得派兵驻守，全成了黑户散修和逃荒流民混饭吃的烂泥塘。”\n\n陈长庚端起酒盅抿了一口，顺着话头随口问道：“就是你昨儿提过、有人在茶棚找大泽盐工那座荒矿？”\n\n“可不是嘛！”\n\n岳铁脊打了个酒嗝，压低声音道，“小老儿年轻时也在大泽边上背过两年卤桶，认得几个老乡。前儿个去荒矿东头铁匠铺打钎子，我还撞见乌卤盐场逃出来的老实汉子孙铁牛在废弃砖窑那边背煤渣，瘦得只剩一把骨头，见着熟人就躲。”\n\n陈长庚眼神微不可察地动了一下：“那两个佩本宗内门剑穗的人，直接进砖窑抓人了？”\n\n“那倒没有，灰铁荒矿暗沟废窑多得像兔子窝，强龙难压地头蛇。”\n\n岳铁脊摆了摆左手三根好指头，“听铁铺伙计说，那两人穿的虽是灰布劲装，可剑柄上拴着咱们内门特有的银丝云纹穗子，在山口歪脖树茶棚摆了十两雪花银，谁能指认去年秋末在乌卤盐场修过西边排卤暗沟的旧人，当场领银子！”\n\n乌卤盐场，西边排卤暗沟。\n\n每一个字，都精准踩在陈长庚心底那根红线上。\n\n去年他在黑石坊市从贺九斤手里买下那张前代盐工修渠草图，靠着西侧排卤暗沟才在沉渊古盐墟内窟虎口夺食，带走了整条地母玄晶主脉。\n\n入古墟前，他曾在南麓荒林截杀过两名手持染血红榜、四处虐杀知情老盐工灭口的黑衣死士；当时红榜名单上唯一没打红叉的活口，正是这个提前逃往北边的孙铁牛！\n\n如今古盐墟早已合拢半个多月，暗处那位盖着“窦”字私印的内门主使竟还不死心，一路顺着流民脚迹追到了三宗交界的灰铁荒矿。\n\n万一孙铁牛熬不住酷刑吐出当年草图卖给了黑石坊市脚行，顺藤摸瓜查到贺九斤铺子上，难免节外生枝。\n\n面上却看不出丝毫异样，陈长庚笑着给岳铁脊碗里又舀了一勺热羊汤：“十两银子找个修沟的苦力，内门世家子弟钱多烧得慌，许是丢了什么家传玩意儿吧。”\n\n两人不紧不慢把半锅羊肉吃得干干净净。\n\n亥初时分，岳铁脊千恩万谢地收拾好碗筷告辞回西院歇息。\n\n小院重归寂静，炭炉余烬泛着一点暗红微光。\n\n陈长庚回到内室掩严木窗，在青灯下坐定，从储物袋夹层摸出那张保存至今、边缘染着暗褐血迹的桑皮悬赏红榜。\n\n灯光穿过桑皮纸背，右下角那枚指肚大小、篆刻着阴冷“窦”字的反面私印清晰浮现。\n\n陈长庚端起案头微凉的半盏残酒一饮而尽，指腹轻轻按在那枚“窦”字印痕上，眼底一片平静深邃。"}, {"n": 111, "title": "荒矿夜影", "body": "二月二十四，戌末亥初。\n\n夜黑风高，弦月隐在薄云之后。\n\n断界黑石峪东侧石院早早熄了灯，房门挂着闭关勿扰的木牌，屋里土炕上照旧留着那半块维持微弱呼吸假象的敛息残铜片。\n\n一道身穿寻常灰黑散修粗布劲装、脸庞蒙着黑麻巾的修长身影，贴着后山阴影悄然翻出矿谷石墙。\n\n陈长庚胸口贴肉佩着那枚得自天阵宗传人的高阶敛息玉符，将一身开脉境初期顶峰的浑厚灵压锁得严严实实，外人用灵识扫过，顶多当是个通窍六七窍的夜路武夫。\n\n不用御盾显露青光，单凭三千五百斤锻骨横练的强横脚力，二十里崎岖山路不过两刻钟便踩在脚下。\n\n前方山坳地势渐平，空气里飘来一股劣质煤灰与铁锈混杂的酸涩气味。\n\n灰铁荒矿到了。\n\n山坳入口歪脖老榆树下支着座漏风的芦席茶棚，这会儿早已收摊熄火；再往里走，满坡都是早年乱挖乱采留下的黑窟窿与塌了一半的土砖废窑，荒草没膝，连声犬吠都听不见。\n\n陈长庚运转目力扫过山坳深处，鼻翼微动，顺着夜风捕捉到一缕极淡的松脂火把烟味与新鲜血腥气。\n\n他脚步放得比狸猫还轻，顺着一条干涸的排渣土沟蜿蜒潜行，很快停在荒矿最西头一座半塌的青砖废窑百步外。\n\n废窑前头挡着半堵断墙，窑洞窗户早用破草席堵严了，只有草席缝里透出一点昏黄跳动的火光。\n\n窑外二十步的乱石堆上没有明哨，显然里头动手的人自恃修为高强，压根没把这片散修泥塘放在眼里。\n\n陈长庚贴着冰冷砖墙绕到废窑后侧的通风裂隙旁，屏住呼吸往里一瞥。\n\n破窑正中的横梁铁钩上，反绑双手吊着一个五十来岁、满脸煤黑血污的庄稼汉子，身上破棉袄已被利刃划得稀烂，胸腹间全是烧红烙铁烫出的血泡，正是乌卤盐场逃出来的老盐工孙铁牛。\n\n横梁下方站着两名身穿紧身灰衣、面容冷硬的青年死士，周身气血鼓荡凝练，竟全是通窍九窍巅峰的好手，离贯通仙脉也只差半步之遥。\n\n左边高个死士手里捏着一柄烧红的短剑，剑柄末端果然露着半截扯断未净的云泽宗内门银丝穗底。\n\n“啪！”\n\n一记冷水泼醒昏迷的孙铁牛，高个死士拿滚烫剑脊贴在他脖颈皮肉上，声音阴冷压抑：\n\n“姓孙的，再给你最后十息活命机会。去年你在乌卤盐场收拾前代老渠匠遗物时，那卷画着古盐墟西侧排卤暗沟的桑皮草图，到底卖给黑石坊市哪个散修了？”\n\n孙铁牛疼得浑身筛糠，鼻涕眼泪混着血水往下淌，哑着嗓子拼命摇头哭求：\n\n“两位爷饶命啊！小人真没见过什么神仙买主！那包发霉的烂草纸小人一个大字不识，去年秋末只是搭着两斤私盐卖给大泽脚行的跑腿伙计换了三钱碎银，转头丹房炸炉小人就逃命来北边背矿了，去哪认买纸的人啊！”\n\n右边矮壮死士皱了皱眉，压低嗓门道：“丁三，这泥腿子烙了三遍还是这套词，不像装的。少爷还在五里外官道茶棚等回话，再拖下去恐撞上血河宗夜巡游哨，干脆割了喉咙回禀少爷去查黑石坊市脚行！”\n\n五里外官道茶棚，还有个被称作“少爷”的内门正主坐镇。\n\n窑外墙根阴影下，陈长庚眼神骤然一寒。\n\n不能让他们活着回去查黑石坊市脚行！\n\n虽然贺九斤嘴严守规矩，可面对内门修真世家的酷刑搜魂，凡俗与低阶散修根本扛不住；唯有今夜把这两条猎犬连同线索一并在这座废窑里掐断，才算真正断根。\n\n窑内，高个死士丁三冷哼一声，手腕一翻将烧红短剑改为正握，反手捂住孙铁牛嘴巴，剑锋径直抹向他喉管：\n\n“算你命不好，下辈子少捡烂纸——”\n\n“咚！”\n\n就在剑锋贴上皮肤的一刹那，废窑后方三十步外一口长满枯芦苇的废弃旱井里，突兀传出一声石块坠井的闷响，紧接着草丛簌簌晃动了一下，像是有人踩滑了脚跟仓皇往北坡逃窜！\n\n丁三割喉的动作猛地顿住，脸色微变：“外头有人偷听！”\n\n“我去拧断他的脖子，你看紧这老东西，十息不见我回来就发火符叫少爷！”\n\n矮壮死士眼神凶狠，反手拔出腰间柳叶快刀，一脚挑开后墙破草席，如一只敏捷夜枭般朝着旱井方向的芦苇丛疾扑而去！\n\n夜风吹得枯黄芦苇哗哗摇摆。\n\n矮壮死士刚扑到旱井边沿，通窍九窍巅峰的敏锐耳力还没来得及分辨风声，右侧一丛齐腰深的枯苇阴影里，一只毫无灵光波动、却快得超越肉眼极限的修长手掌已迎面探出！\n\n没有任何花哨真气外放，纯粹是三千五百斤井煞锻骨横练凝聚到极致的五指如钩！\n\n矮壮死士瞳孔猛缩，手里的柳叶快刀才抬起三寸，咽喉脆骨便被两根铁钳般的手指精准扣死！\n\n“咔嚓！”\n\n一声轻不可闻的骨裂闷响被芦苇风声彻底吞没。\n\n矮壮死士颈骨寸寸粉碎，双眼暴凸充血，连半丝气劲和闷哼都没能从喉管里漏出来，整个人便软绵绵瘫了下去。\n\n陈长庚左手顺势托住他的刀柄没让铁器磕碰井砖，随手将尸首塞进枯芦苇深沟掩好。\n\n前后不过三息工夫。\n\n五十步外的破砖窑内，留守的高个死士丁三握着短剑等了片刻，听见外头芦苇风声骤停却迟迟不见同伴回音，后脊梁顿时蹿起一股毛骨悚然的寒意：\n\n“老六？抓着什么人了？！”\n\n无人应答。\n\n破砖窑外重归死寂，陈长庚如一片没有重量的灰影悄然滑回窑后，足尖一点断墙豁口，敛尽全部气息伏上了破窑顶端的残垣，右手指尖扣住了一枚边缘锋利的碎青砖。"}, {"n": 112, "title": "红榜断根", "body": "破砖窑内，松脂火把“噼啪”爆出一粒火星。\n\n高个死士丁三连唤两声不见回音，常年刀口舔血的直觉令他脸色骤变，顾不得再去割孙铁牛的喉咙，一把扯过铁钩下的麻绳将孙铁牛拽在身前充作肉盾，后背紧贴着通往后院水井的窄门缓缓后退！\n\n他左手探入怀中，两根手指已经扣住了一张画满赤纹的宗门传音火符。\n\n五里外茶棚坐镇的窦长青少爷乃是开脉境初期好手，只要指尖真气一吐引燃火符，十几个呼吸内少爷便能御剑杀至！\n\n窑顶残垣豁口上方，陈长庚垂眸将丁三怀中动作看得一清二楚。\n\n早在刚才引走矮壮死士前，他便借着夜色放出了十只体积最小、速度最快的紫纹变异煞甲虫，顺着后墙阴暗潮湿的井壁砖缝提前摸到了窄门门框底下。\n\n丁三后背刚靠上门框，左手捏着传音火符正欲激发真气——\n\n“嗤！”\n\n袖口阴影下，十道细小如黑豆的紫黑暗影闪电般顺着裤管衣摆蹿入他左袖！\n\n十副能把二阶尸煞重甲都生生撕穿的锯齿钢颚，同时狠狠咬在丁三左手食中二指与那张传音火符正中！\n\n“啊——！！”\n\n十指连心，丁三只觉左手两根指头连骨带肉被烧红的铁剪子齐根夹断，那张尚未引燃灵力的传音火符更是在两息间被啃成一堆废纸屑！\n\n钻心剧痛令丁三惨叫失声，护体九窍真气猛地一乱。\n\n就在他惊骇低头甩袖的刹那，头顶残破瓦片豁口处，“啪”地射落一枚急旋如飞刀的碎青砖，精准打灭了墙角唯一那支松脂火把！\n\n窑内瞬间陷入伸手不见五指的漆黑浓烟之中。\n\n丁三亡魂皆冒，右手短剑本能地护在胸前胡乱劈砍：“哪个鼠辈藏头露尾，我家少爷是云泽宗窦——”\n\n“咻！”\n\n一道快得看不清形体的乌黑寒芒贴着浓烟一闪而逝。\n\n丁三喉咙里的狠话戛然而止，整颗头颅冲天飞起，无头尸身喷出一股热血，重重栽倒在泥灰地上。\n\n被麻绳带倒在角落草堆里的孙铁牛本来就被烙得奄奄一息，此刻被火把黑烟一呛，趴在地上拼命闭眼咳嗽，只听见耳边噗通一声闷响，根本没瞧见那两人在黑灯瞎火里是怎么死的。\n\n陈长庚落地无声，神念一招将十只紫纹甲虫与乌金飞刃收回袖中，又把门外芦苇沟里那具矮壮死士尸首一并提进窑洞。\n\n他蹲下身，迅速在两名死士怀里摸索了一遍。\n\n除了十几两散碎银子、两把凡铁快刀和几瓶金疮药，高个死士贴胸皮囊里藏着一封没落款、只盖着那枚熟悉“窦”字朱印的绢帛手令。\n\n陈长庚借着指尖一缕微不可察的火光扫过绢帛字迹，悬了大半个月的心头大石终于稳稳落地。\n\n手令上写得明明白白：窦氏一房先祖百年前曾有一枚关乎“玄水铸鼎秘藏”的青铜古钥遗落在沉渊古盐墟西侧废窟，窦长青暗中招募死士追查乌卤盐场修渠草图，纯粹是怀疑有散修买走草图提前摸进了西窟捡走古钥！\n\n至于古盐墟最深处内窟的地母玄晶主脉，这位窦长青压根连半个字都不知情，更不知道买图之人早已借暗沟贯通仙脉成了他的内门同僚。\n\n“原来只是冲着西窟一件先人遗物去的。”\n\n陈长庚掌心暗金地火煞罡一吐，将那张绢帛手令连同怀里留存多日的染血悬赏红榜一并烧成飞灰。\n\n角落草堆里，孙铁牛抖得像秋风里的落叶，闭着眼拼命朝黑影磕头：“好汉饶命！大侠饶命！小人瞎了眼什么都没看见，求大侠饶小人一条贱命！”\n\n陈长庚隔着黑麻面巾看了这老实盐工一眼。\n\n当年在丙字灶房，这汉子虽胆小怕事，倒也没跟着周癞子欺负过学徒；况且留个往南边逃命的活饵，更能坐实“外派散修截人夺线索”的假象。\n\n陈长庚从储物袋摸出十两凡俗纹银，连同刚才从矮壮死士身上搜出的一张通往南疆百蛮州药材商队的空白路引，随手丢在孙铁牛手边，用砂石磨过似的沙哑嗓音低喝道：\n\n“割断绳子，拿上银子路引，顺着南坡小道去官道搭商队马车。天亮前滚出三百里，这辈子再敢踏进三宗地界半步，没人救得了你。”\n\n孙铁牛摸到怀里实打实的十两银锭和通关路引，愣了一瞬，旋即喜极而泣，朝着黑影砰砰磕了三个响头，捡起地上崩断的铁片割开麻绳，连滚带爬钻出后洞往南山逃命去了。\n\n陈长庚没有急着走。\n\n他先用死士的柳叶刀将两具尸首颈部与断指创口彻底劈烂搅碎，再拎起窑角那两桶采矿照明用的猛火黑油，均匀泼满两具尸身与支撑窑顶的朽木梁柱。\n\n唯有那截扯剩一半的云泽宗内门银丝剑穗，被他故意丢在了窑门外三步的泥地上。\n\n屈指一弹火星。\n\n“轰——！”\n\n猛火黑油见火即燃，冲天烈焰瞬间吞没了整座废弃砖窑，干燥焦脆的土坯拱顶在滚滚热浪中“咔嚓嚓”坍塌砸落，将里头一切痕迹埋得严严实实。\n\n陈长庚早已退至百丈外的山梁暗影，回头看了一眼火光，转身疾掠返回黑石峪。\n\n两刻钟后，灰铁荒矿西头浓烟滚滚。\n\n一道凌厉剑光自五里外官道破空掠至，化作一名身穿锦衣、脸色铁青的鹰钩鼻青年，正是内门窦氏执事窦长青。\n\n看着眼前烧成一片赤红火海、梁塌砖碎的废窑，再低头拾起泥地上那半截被火燎焦的自家死士剑穗，窦长青一脚踢碎路边青石，咬牙切齿低骂道：\n\n“该死的血河宗杂碎，鼻子倒灵，竟敢黑吃黑截本少爷的暗哨！”\n\n至于那个早不知死在火海里还是被魔修掳走的凡人老盐工，既然古盐墟地脉已合拢十年，窦长青恨恨吐了口浊气，再不愿在这三不管险地多留片刻，御剑化虹径直折返本山而去。"}, {"n": 113, "title": "押车返宗", "body": "二月二十八，辰初。\n\n断界黑石峪谷口新砌的青石哨垒已拔高三尺，棱角森然。\n\n四辆包铁硬木大车一字排开，车厢里满满当当码着紫赤发亮的高纯火铜精矿，足抵宗门两个月正课定额；最后一辆押尾车的夹层木箱里，还单独封着三成成色最佳的精铜羡余。\n\n代司炉岳铁脊带着十名挑出来的精壮矿役检查完车轴麻绳，快步走到头车辕前躬身禀报：\n\n“师叔，二十四石正课精铜和冰匣全捆牢了，当真不用小老儿带人随车护送一段？”\n\n“不必，守好谷口石垒和西坑便是。”\n\n陈长庚一袭青玉云纹执事道袍，伸手拍了拍车辕正中那只贴着巡脉堂封条、寒气森森的尺半樟木匣——里头用硝冰封着的，正是玄煞门百夫长乌横岭的首级。\n\n他翻身坐上头车木辕，随手将一面绣着“云泽戍边·斩将报捷”的赤边青云旗插在车头铁管里：\n\n“起车。”\n\n“得令！起车喽——！”\n\n八名受雇的老脚夫甩响皮鞭，挽马嘶鸣，沉重的包铁车轮碾碎山道残霜，浩浩荡荡驶出黑石峪谷口，顺着南下官道直奔云泽宗本山。\n\n百八十里山路，前头百四十里皆是开阔荒原，连只拦路野狗都没见着。\n\n午后未初，烈日偏西。\n\n车队拐入距离云泽宗山门仅剩四十里的“一线峡”。\n\n两侧赤褐崖壁如刀劈斧削般向中间收拢，最窄处不过两丈来宽，抬头只见一线青天，山谷间回荡着铁轮碾压碎石的隆隆闷响。\n\n头车刚驶过峡谷中段一道鹰嘴弯，赶车的老脚夫胯下挽马忽然惊嘶人立！\n\n“唏律律——！”\n\n两侧三丈高的崖壁枯藤后，毫无征兆暴起两道凌厉剑光！\n\n两名身穿灰黑劲装、黑巾蒙住口鼻的修真好手凌空扑落，周身鼓荡的赫然全是纯正的开脉境初期周天灵力！\n\n“滚开！”\n\n左边身材微胖的蒙面人袖袍一挥，一股劲风直接将赶车老脚夫掀进路边草窝，手中一柄阔背青钢剑甚至懒得看车辕上的陈长庚一眼，灌足十成真气，恶狠狠朝着头车右侧承重铁轮轴劈落！\n\n右边瘦削蒙面人更是配合默契，三枚带着倒刺的破甲铁梭成品字形直钉后头三辆矿车的挽马前蹄！\n\n不杀人，不抢货，一出手就奔着毁车断轴去。\n\n宗门边矿核销铁律：月底申时日落前矿车未入山门，或半途损毁正课精矿逾两成者，驻矿执事以失职论处，当堂收回官印罚入苦役营！\n\n“龚师兄手底下的人，算盘打得倒精细。”\n\n车辕之上，陈长庚连屁股都没抬一下，眼底掠过一丝讥诮。\n\n引他下车追击调虎离山？没那个闲工夫。\n\n就在那柄阔背青钢剑距离头车铁轴不足半尺、微胖蒙面人眼底已露得色的一瞬——\n\n陈长庚右手并指如剑，腰间那面巴掌大的库房制式“青鳞灵盾”骤然脱扣飞出！\n\n“嗡——！！”\n\n青光迎风暴涨至四尺见方，盾面青鳞符文大亮！\n\n没有动用左袖半只煞甲虫，也没摸一颗过载烈阳火珠，陈长庚体内那条零丹毒紫金仙脉与三千五百斤暗金锻骨横练巨力轰然拧成一股，隔空灌入青鳞灵盾之中，如一堵崩塌的万钧铁壁，迎着阔背青钢剑与微胖蒙面人正面横撞过去！\n\n“一面破库房制式盾牌也敢硬接师兄我的百炼剑？给我开！”\n\n微胖蒙面人冷笑不闪，手腕加力硬劈在盾心正中！\n\n“铛——咔嚓！！”\n\n金铁交鸣声震得整条一线峡嗡嗡回响，乱石簌簌滚落！\n\n微胖蒙面人脸上的冷笑还没散去，瞳孔骤然缩成针尖！\n\n那哪是什么根基虚浮的新嫩执事催动的制式盾牌，分明是一头披着青铁重甲的洪荒蛮象迎面撞来！\n\n阔背青钢剑剑脊当场崩开三道寸许深的豁口，狂暴霸道的反震巨力顺着剑柄轰然炸进他双臂经脉，护身的一阶中品白玉佩“啪”地炸成漫天粉尘！\n\n“噗——！”\n\n微胖蒙面人胸前肋骨寸寸断裂，仰天狂喷出一大口鲜血，整个人像破麻袋般横飞出去，重重砸在两丈外的岩壁上滑落下来！\n\n另一侧，瘦削蒙面人射向挽马的破甲铁梭也被回旋一掠的青鳞灵盾扫飞钉入山石。\n\n“赵师兄？！”\n\n瘦削蒙面人骇得魂不附体，看着同伴胸口塌陷下去的掌大凹坑，哪敢再劈第二剑，冲上去一把架起吐血不止的微胖蒙面人，借着林间乱石连滚带爬蹿上崖顶：\n\n“点子邪门！这小子的横练力气不对劲，快走！”\n\n两道狼狈身影眨眼间逃进密林深处，连句场面狠话都没敢留。\n\n陈长庚单手一招，完好无损的青鳞灵盾缩回掌心挂归腰际。\n\n他低头掸了掸袍袖上并不存在的灰尘，冲草窝里爬起来发愣的老脚夫温言道：\n\n“两个不开眼的毛贼罢了，扶好车辕，赶在申时前上山吃热饭。”\n\n老脚夫看着岩壁上那滩刺目鲜血，敬畏得连连应声，挥鞭催马疾行。\n\n申时初刻，斜阳如金。\n\n云泽宗巍峨恢弘的白玉山门牌坊下，往来交接月底差事的内外门弟子络绎不绝。\n\n一阵沉稳厚重的铁轮碾石声由远及近，四辆插着赤边报捷军旗的包铁大车稳稳碾过护山石桥，停在了山门核验坪正中央。\n\n两名值守山门的内门精锐弟子刚蹙眉上前查验路引，目光扫过头车大旗与木匣封条上“玄煞门百夫长乌横岭首级”那行朱砂小字，呼吸猛地一滞。\n\n周围数十名路过看热闹的外门与内门弟子顺着旗面望来，嘈杂喧闹的山门广场，呼吸间静得连风吹旗角的猎猎声都清晰可闻。"}, {"n": 114, "title": "联堂核册", "body": "次日三月初一，辰时正刻。\n\n云泽宗内门半山腰，巡脉堂与器堂联席议事大堂。\n\n檀香袅袅，二十余名负责各路矿脉核销的内门执事分坐两侧楠木长案，主位上坐着升仙殿值守长老纪鹤年与巡脉堂刑核主事秦镇海，两人正低声翻阅上月各卡战报。\n\n右侧器堂副首席上，龚铁横端着一盏热气腾腾的灵雾茶，眼皮微垂，嘴角却噙着一抹压不住的冷笑。\n\n昨夜他派去一线峡毁矿的赵、钱两名师弟虽未回山复命，想来是怕撞上巡山暗哨先去山下坊市避风头了。\n\n一个靠狗屎运吞异乳破境的废渣房泥腿子，就算侥幸没死在黑石峪魔骑刀下，车轴一断、矿砂滚沟，昨日申时必定了误限！\n\n龚铁横慢条斯理放下茶盏，清了清嗓子，抢先起身冲主位一拱手：\n\n“启禀纪长老、秦主事，今日乃是二月边矿月册核销正期，辰时已过，各卡执事皆已到堂，唯独新驻断界黑石峪的陈长庚迟迟不见人影。”\n\n堂下几名器堂一系的执事立刻跟着附和摇头：\n\n“听说前几日黑石峪连燃狼烟，那陈师弟初通仙脉，怕不是瞧见魔门游骑吓破了胆，弃矿逃去外境了吧？”\n\n龚铁横脸色一板，义正词严地抬高嗓音：\n\n“边矿军令如山！依本宗律例，驻矿执事逾限未归、损毁正课者，当即刻削除内门执事铜印，押送刑律堂罚入黑水苦役营三年！愚兄提议现在便签发拿人铁牌，以儆效尤！”\n\n主位上的纪鹤年眉头微蹙，刚看向堂外书办：“昨日申时山门可曾报过黑石峪车账？”\n\n“不必劳烦书办翻册了。”\n\n一道温和清朗的嗓音自大堂门廊外传来。\n\n晨光穿过雕花高槛，陈长庚一袭青玉云纹执事道袍整洁挺括，腰悬赤铜巡脉官印，迈步踏入大堂正中，规规矩矩向主位长老与两侧同僚抱拳执礼：\n\n“弟子陈长庚，昨日申时初刻已将黑石峪正课精矿押入山门公库封存，特来联堂呈交核销印册。”\n\n“你……你昨日申时便进山了？！”\n\n龚铁横屁股猛地抬起半寸，瞳孔骤缩，茶盖磕在碗沿发出一声脆响！\n\n赵师弟二人两个开脉初期好手在四十里外一线峡截道，竟连一辆拉矿的凡骡木车都没劈碎？！\n\n不等龚铁横转过弯来，他眼珠一转，立刻重重一拍扶手冷笑道：\n\n“人回来有什么用！黑石峪外卡早几日便被玄煞门劈了界碑，你莫不是拉了一车掺煤渣的废铜回来糊弄公库？来人，当堂验秤！”\n\n“正要请龚师兄与诸位长老亲眼过秤。”\n\n陈长庚神色平静，侧身朝堂外拍了拍手，“抬上来。”\n\n四名公库力士肩扛两口卸开封板的大铁箱稳步入堂，沉重箱底落砖发出一声闷响！\n\n箱盖敞开，满箱紫赤如火、毫无杂煤的极品火铜精砂映得满堂红光流转，连公库老匠验完签条都高声唱喏：\n\n“黑石峪二月正课火铜精矿二十四石，成色上等，足抵双月满额！”\n\n满座执事顿时发出一阵低低惊呼！\n\n连死两任执事的绝地穷矿，头一个月非但没亏空，反倒交出了双倍上等精矿？！\n\n陈长庚没停，走到随行力士捧着的那只寒气森森的尺半樟木匣前，伸手揭开巡脉堂封条与匣盖。\n\n一颗左脸爬满蜈蚣烧疤、双目圆瞪的魁梧首级裹在透明玄冰之中，扑面而来的凶戾尸煞引得前排几名执事齐齐变色后仰！\n\n陈长庚双手呈上赤松卡、白石卡两位邻防执事联名画押的勘验文书：\n\n“二月二十一子夜，玄煞门黑风寨开脉中期百夫长乌横岭率精骑袭营，弟子依托谷口瓮城侥幸将其斩首全歼，邻卡周、林二位师兄已亲验无误，请长老核验！”\n\n“砰！”\n\n巡脉堂主事秦镇海猛地一拍大腿霍然起身，大步走到木匣前细看三息，仰头抚掌大笑：\n\n“好！真是乌横岭这畜生的脑袋！这魔头在断界山杀了咱们三个巡脉好手，老夫悬赏百块灵石半年都没人摘下，陈师弟初阵斩将，当记边防头等大功！”\n\n纪鹤年亦是满面欣慰，抚须连连颔首：“临危不乱，以弱胜强，升仙殿果然没看走眼！”\n\n大堂两侧赞叹声四起，先前跟着起哄的几名器堂执事讪讪闭紧了嘴，看向陈长庚的眼神彻底变了分量。\n\n能够越阶反杀开脉中期百夫长的狠角色，哪还是什么任人揉捏的废渣房软柿子！\n\n副首席上的龚铁横脸色一阵青一阵白，后槽牙咬得咯咯作响。\n\n一旦让陈长庚顶着斩将头功在巡脉堂彻底立稳脚跟，他器堂在黑石峪经营八年的暗矿财路就全断了！\n\n龚铁横眼底闪过一丝狠色，硬着头皮站起身，抱拳沉声道：\n\n“慢着！陈师弟斩敌固然可嘉，但一码归一码！据我器堂司炉房旧册记载，黑石峪前两月地火塌耗尚欠器堂两成火铜亏空未补，且我器堂驻矿老司炉郑百斛至今下落不明——在查清郑百斛死因与那两成旧矿去向前，这笔头功只怕还发不得！”\n\n拿死人跟黑账压我的军功？\n\n陈长庚静静看着图穷匕见的龚铁横，心里冷笑一声，面上却露出一副为难迟疑的神色：\n\n“龚师兄不提，小弟本想顾全器堂颜面私下禀报的。既然师兄当众问起郑司炉和那两成旧矿的下落……”\n\n陈长庚伸手探入怀中，慢条斯理取出一叠边缘整齐裁去下半截、上半截却清清楚楚按着鲜红指印与器堂外务暗记的油纸密信，外加一本郑百斛藏在炉底的私矿草册。\n\n他没有直接呈给主位上的秦镇海，而是迈步走到右侧副席三步外，双手捧着那叠裁掉鲁长老名讳、只留龚铁横外务印记与郑百斛亲笔字迹的密信，轻轻放在了龚铁横面前的楠木案角上。\n\n大堂内霎时落针可闻。\n\n陈长庚垂眸看着脸色骤变的龚铁横，语气恭谨得挑不出一丝错处：\n\n“这是小弟从乌横岭储物袋里搜出来的往来手书，上头刚好记着那两成塌耗精矿卖去了黑风寨哪座仓库。郑司炉在器堂当差八年，龚师兄最熟他的笔迹，不妨当着纪长老与秦主事的面，亲自替小弟掌掌眼？”"}, {"n": 115, "title": "借功摘印", "body": "阳光斜照进议事大堂，落在楠木案角那半页染着暗红血点的油纸密信上。\n\n龚铁横垂眸只扫了一眼纸上那熟悉的瘦硬行书，还有信尾那枚他亲手发给郑百斛核对暗矿数目的器堂外务私戳，脑子里“嗡”的一声炸开，整张阴鸷面皮瞬间血色尽褪！\n\n怎么会在乌横岭储物袋里没烧干净？！\n\n更叫龚铁横脊背发凉的是——信纸下沿整整齐齐被人用利刃裁去了一寸半！\n\n原信下半截写的什么，他比谁都清楚，那是郑百斛汇报“八成折银已按月孝敬掌矿鲁长老火房”的命根子！\n\n眼前这姓陈的小子没把原信一股脑桶给主位上的秦镇海，偏偏裁掉了鲁长老那半截，单把上半截搁在他龚铁横眼皮子底下！\n\n意思再明白不过：你龚铁横要真不怕死，尽管喊刑律堂来当堂验信彻查；一旦拔出萝卜带出泥牵扯到鲁长老，鲁长老为了自保，头一个就得把你龚铁横推出去当替死鬼砍头平账！\n\n主位上，巡脉堂主事秦镇海看出气氛不对，浓眉一挑往前探了探身子：\n\n“哦？乌横岭袋里还有郑百斛的往来信件？呈上来老夫瞧瞧！”\n\n书办刚迈出半步要去接信——\n\n“啪！”\n\n龚铁横五指如电，一把死死按住案角那叠密信与草册，额角豆大的冷汗顺着鬓角滚落下来！\n\n满堂二十余道目光齐刷刷聚在他发抖的手背上。\n\n三息死寂。\n\n龚铁横喉结艰难滚动了一下，脸上那副居高临下的官威碎得干干净净，挤出一个比哭还难看的僵硬笑容，冲主位深深一揖：\n\n“不必污了秦主事法眼！愚兄……愚兄方才粗看了一眼，确是郑百斛那吃里扒外的老畜生字迹！”\n\n两侧器堂执事一片哗然，面面相觑。\n\n龚铁横咬碎了满口银牙往肚里咽，连头都不敢抬高半分，嘶声将黑锅严严实实扣在死人头上：\n\n“是愚兄平日失于察核，竟不知郑百斛被魔门收买私卖边矿，还连累前两任巡脉师弟枉死！方才愚兄所提的两成旧账亏空，纯属郑百斛做假账欺瞒堂口！”\n\n说着，龚铁横肉痛得眼角直抽，颤手从腰间储物袋里哗啦啦倒出整整五十枚莹白饱满的下品灵石，双手捧过头顶：\n\n“愚兄治下不严，甘愿自掏五十枚私蓄灵石补入公库，填平黑石峪往期全部塌耗旧账！至于郑百斛勾结魔门罪证，已随其伏诛一笔勾销，恳请纪长老、秦主事从轻发落愚兄失察之责！”\n\n五十枚下品灵石，足抵内门开脉执事整整五年的干俸！\n\n大堂内响起一片压抑不住的倒吸凉气声。谁都看得出来，龚铁横这是被陈长庚一指头戳穿了肺管子，花五十块灵石买命封口呢！\n\n秦镇海跟纪鹤年对视一眼，都是人精，哪还不懂见好就收的门道。\n\n真把器堂掌矿一系逼急了掀桌子，对巡脉堂也没好处。\n\n秦镇海抚须一笑，大手一挥：“既已查明是叛徒郑百斛内外勾结，龚执事又能主动担责补齐公库亏空，便罚俸三月结案，将这批罪证当堂焚毁归档！”\n\n一名书办上前收走五十枚灵石，当众用真火将那半截密信烧成灰烬。\n\n“至于陈长庚执事——”\n\n秦镇海看向堂中神色谦和的青年，赞许之色溢于言表，亲自取过一只沉甸甸的锦囊与功勋玉牌递落：\n\n“单骑赴任，肃清内奸，阵斩玄煞门开脉中期百夫长并缴足双倍正课！按宗门战功榜，全额赏赐下品灵石一百枚，记大功一次！”\n\n一百枚整灵石稳稳落入手中。\n\n陈长庚心里将账目轻轻一拨——算上储物袋里原有的三百七十枚，他手头的完整下品灵石已跃升至四百七十枚巨款！\n\n满堂执事看着那只鼓囊囊的百枚灵石锦囊，眼底全是羡慕与敬畏。\n\n纪鹤年含笑温言道：“陈师弟立此大功，黑石峪如今又已固若金汤，不知可愿留任镇守，本殿可为你加拨双份戍边津贴？”\n\n留在黑石峪外头，迟早还得应付器堂与玄煞门没完没了的阴招，更没法名正言顺接触二阶炼器废渣。\n\n陈长庚当即掩住唇角，恰到好处地低咳了两声，脸色显出几分强撑多日的倦白，恭敬躬身一礼：\n\n“回纪长老、秦主事，弟子愧不敢领双份津贴。实不相瞒，那夜在瓮城硬接乌横岭二阶魔刀，弟子初通的仙脉受了不轻的暗震，随身护身火器也已耗得一干二净，眼下实在无力再替宗门守边关重地。”\n\n秦镇海惋惜蹙眉：“这倒是实情，那师弟想调回本山哪一房将养？”\n\n“弟子出身微末，以前在外门废渣谷看惯了炉火，受不得前山热闹。”\n\n陈长庚垂下眼帘，语气诚恳谦卑，“听闻内门后山西北角的‘地肺废火窟’终年地火温热，正缺个看守废器熔炉、筛理矿渣的值守杂务执事，弟子斗胆恳请卸去边差，调往废火窟看炉养伤。”\n\n话音一落，大堂里不少内门执事差点以为自己听岔了耳朵！\n\n地肺废火窟？！\n\n那是全宗熔毁报废灵器、终年飘满刺鼻硫磺铅毒的绝谷鬼地方，里头还蹲着个半步铸鼎、六亲不认的毁容疯长老寇重山，三年来派去镀金的执事没有一个能待满十天不被骂滚蛋的！\n\n这陈长庚放着立功肥差不要，主动往那鸟不拉屎的毒烟窟里钻，分明是被龚铁横吓怕了，想找个器堂手伸不进去的苦寒角落躲清静保命啊！\n\n纪鹤年暗暗叹息这年轻人太过谨慎知退，当即提笔取过调令官纸，朱砂大笔一挥盖下升仙殿与巡脉堂双印：\n\n“准奏！即刻调内门执事陈长庚赴后山地肺废火窟任司炉执事，非经本殿与废火窟长老联签，各房不得擅自征调！”\n\n“多谢纪长老、秦主事成全！”\n\n陈长庚双手接过那纸形同免死护身符的朱笔调令，连同百枚功勋灵石一并收入青云储物袋，再次向满堂执事拱手告退。\n\n转身迈出大堂门槛、经过右侧副首席时，陈长庚脚步微顿，冲脸色铁青的龚铁横客客气气颔首行了半礼，一言不发飘然远去。\n\n座位之上，龚铁横盯着那道青袍背影消失在廊外，扣住铁木太师椅扶手的五指青筋暴突，“咔吧”一声，在坚硬如铁的椅背上生生捏出了五道寸许深的指印。"}, {"n": 116, "title": "三成叩窟", "body": "三月初一，午后未初。\n\n云泽宗七十二峰大部灵雾缭绕、苍松翠柏，唯独内门西北尽头这道“断火绝谷”寸草不生。\n\n还未走近谷底，一股滚烫浓烈、混杂着硫磺地火与百金锈煞的赤黄浓烟便遮天蔽日翻涌上来，把正午日头都遮得昏黄暗淡。\n\n山道窄陡，两侧焦黑岩壁上随处可见报废断裂的青铜阵基与锈蚀铁甲残片。\n\n陈长庚独自牵着一辆矮脚青骡铁板车，不疾不徐顺着石阶走到绝谷最深处。\n\n板车上搁着两口结实的黑松木箱，里头整整齐齐码着从黑石峪带回来的那三成高纯火铜精矿羡余，折算市价足值六十枚下品灵石。\n\n前方山壁凹陷处，立着两扇高达两丈、通体由生铁浇铸而成的斑驳巨门，门楣石匾被常年地火熏得漆黑，隐约能辨出“地肺废火窟”五个刀劈斧凿的大字。\n\n铁门紧闭，门内传来“哐——哐——”沉闷如雷的百斤重锤锻铁声，每砸一下，脚下青石阶便跟着微微一颤。\n\n陈长庚拴好青骡，走上石阶三步外站定，既没有散发开脉灵识往门缝里乱探，也没拿官印砸门，只按着凡俗匠门拜山的老规矩，朗声抱拳道：\n\n“新调司炉执事陈长庚，携边矿火铜薄礼，奉调令前来废火窟拜见寇长老！”\n\n门内震耳欲聋的打铁锤声骤然一停。\n\n两息寂静后，铁门里头传出一道沙哑粗粝得像两块生铁硬刮的破锣嗓音：\n\n“巡脉堂刚立了斩将头功的大红人，不去前山掌矿房捧鲁老儿的臭脚，拖两箱破铜烂铁跑老夫这毒烟窝子躲什么清闲？！”\n\n话音未落，门内陡然响起一声刺耳的铁链滑轮暴响！\n\n“哗啦——轰！！”\n\n紧闭的两扇生铁巨门并未敞开，门顶上方三尺宽的排渣瞭望口却猛地洞开！\n\n一道魁梧如黑塔的半步铸鼎恐怖气机一闪即收，紧接着一柄长达丈二、烧得暗红发亮的玄铁长柄挑火钳自窗口闪电探出，钳头勾着一口桌面大小、正剧烈沸腾翻滚的生铁废熔锅，照着门外石阶三步前劈头盖脸狠狠砸落下来！\n\n“砰——嗤啦啦！！”\n\n千斤重的生铁熔锅重重砸裂两块青石阶板，锅内满满一池暗赤发紫的滚烫铁汁剧烈震荡，几十点混着刺鼻黑烟的毒火铁星四溅飞射，落在周围山石上瞬间蚀出一个个寸许深的焦黑蜂窝！\n\n更凶险的是，整口熔锅外壁已经胀出一圈蛛网般的赤红裂纹，锅心翻滚的赤铁汁深处正“咕嘟、咕嘟”疯狂往上顶着一颗颗拳头大的青黑色诡异气泡，狂暴紊乱的火煞随时可能炸膛崩碎！\n\n生铁门排渣口后，露出一张令人望而生畏的苍老面孔。\n\n老人左半边脸颊被早年炸炉毒火彻底烧毁，焦黑疤痕扭曲拉扯着眼角，只剩右眼亮得如万年寒星，赤着精壮虬结的上身，右手随意拎着一柄百斤重的八棱百炼锻锤，居高临下冷冷盯着阶下的陈长庚：\n\n“器堂和升仙殿塞过来的废物，老夫三年轰走了七个！想进废火窟挂名混日子，先接老夫这锅废汁！”\n\n“不许散灵识探炉底，三息之内，说不出这锅二阶赤纹铁为何将炸、拿不出压火的法子，就趁早推着你的破铜滚回前山去！”\n\n霸道、乖戾，半句虚头巴脑的客套都不讲。\n\n换作寻常靠丹药堆上来的内门世家子弟，莫说不准用灵识查探，光看眼前这口随时要炸成漫天剧毒铅火的二阶废铁锅，头一反应便是撑开灵盾远远退避。\n\n一旦后退半步，或者傻乎乎放出开脉灵识去触碰锅底狂暴铅煞引爆熔锅，今日这扇生铁大门便算彻底关死了。\n\n热浪扑面，吹得陈长庚额前碎发微扬，青玉袍角距飞溅的毒铁星不过尺许。\n\n他双脚稳稳钉在原地未退分毫，非但没有催动半点灵识，更严严实实锁死怀中蚀纹石臼的气机，只微眯起双眸，像当年在乌卤盐场丙字灶台前守着十二石滚烫黑卤一样，目光如钉子般锁在铁汁中央那串青黑色气泡与锅沿飘起的三寸灰白水烟上。\n\n“一！”\n\n铁门后，寇重山拎着百斤大锤，沙哑冰冷的第一声倒数如重锤砸落。\n\n陈长庚鼻翼微动，嗅清了硫磺浓烟底下夹杂的那一丝阴寒潮腥。\n\n锅心翻滚的根本不是单一火毒，气泡外青内黑、破裂时声闷而不脆，锅沿还挂着一圈未化尽的灰白冷霜印子——这是熔炼二阶赤纹铁时，有人往三寸炉底误投了受过地底暗河阴水浸蚀的“阴寒湿铁胎”，外热内寒两股煞气顶牛，把伴生的剧毒铅煞硬逼到了锅心临界点！\n\n用水泼必炸，用灵力强压更炸。\n\n唯有盐场熬卤老匠对付“冷底翻卤”的土方子，能顺气孔吃掉那股阴湿寒气！\n\n“二！”\n\n寇重山独眼微眯，第二声倒数紧随而至，锅壁上的赤红裂纹已发出“咔咔”刺耳崩响，拳头大的青黑毒泡胀高到了锅沿边上！\n\n陈长庚不再看铁锅一眼，目光闪电般掠过两侧长年被废火窟硫烟卤水冲刷的青石台阶根部。\n\n那里积着厚厚一层无人打扫、灰白干涩的陈年盐碱火灰！\n\n就在第三声倒数即将冲出寇重山喉咙的前一刹那，陈长庚一步踏前逼近滚烫熔锅三尺之内，右手不戴任何护具探入石阶墙角，五指如铲，稳稳抓起了满满一大捧干燥粗糙的灰白盐碱灰。"}, {"n": 117, "title": "挂名立规", "body": "排渣瞭望口后，寇重山那只亮如寒星的独眼微微一凝，嘴里那个“三”字含在舌尖没吐出来。\n\n石阶前，滚烫赤铁汁中心的青黑毒泡已顶到锅沿，锅壁赤红裂纹“咔”地崩落两片铁锈！\n\n陈长庚右手一扬，那一大捧灰白粗糙的陈年盐碱灰不偏不倚，顺着锅心翻涌最急的三处气孔撒了进去，嘴里语速极快却字字清晰：\n\n“炉底三寸误掺了暗河阴寒湿铁，外火内寒顶死了伴生铅煞！水泼必炸，灵识触之更炸，唯盐碱老灰能顺气孔吸干阴湿！”\n\n话音落下的瞬间——\n\n“嗤啦啦——！！”\n\n原本狂躁欲裂的暗赤铁汁撞上干燥盐碱灰，非但没有炸起半点毒星，锅心那串拳头大的青黑气泡反倒像被扎破的皮囊般迅速瘪了下去！\n\n几缕灰白色腥臭水汽顺着碱灰嘶嘶抽空，外壁狰狞的赤红裂纹肉眼可见地暗淡收拢，满满一锅将炸未炸的二阶赤纹铁汁，不过两息便平复成温顺流淌的赤水。\n\n绝谷石阶上一片安静，只剩山风卷着硫磺烟打旋儿。\n\n寇重山盯着那口稳稳当当的熔锅看了足足三息，独眼里闪过一丝罕见的讶色：\n\n“没放一缕灵识，也没动半点真气。小子，你以前在哪个匠铺学过熬铁？”\n\n陈长庚拍掉掌心残灰，退后两步恭敬抱拳：\n\n“回长老，弟子入宗前在沧溟大泽乌卤盐场熬过三年黑卤。卤锅底下混了冷泉毒泥也是这般翻黑泡，老灶匠教过抓灶台碱灰压底的土法子，理是一通的。”\n\n“盐灶熬卤？哈哈，好一个理是一通的！”\n\n寇重山沙哑大笑两声，看陈长庚的眼神比看前山那些满嘴丹火大道的世家子弟顺眼了十倍不止，“前山鲁老儿教出来的徒孙，瞧见炸锅只会祭灵盾抱头鼠窜，倒不如你一个熬盐出身的小子懂火性！”\n\n“轧轧轧——轰！”\n\n沉重刺耳的机括声响起，紧闭多时的两扇两丈生铁巨门缓缓向内洞开。\n\n一股灼热磅礴的地肺火浪扑面涌出，映出山腹内宽敞恢弘的石窟大厅——正中引着三条粗如水缸的赤红地火熔脉，三座高达三丈的青铜废器熔炉呈品字形矗立，西侧铁砧旁堆满了从各房运来待毁的残破刀剑与锈蚀阵盘。\n\n寇重山拎着百斤八棱锻锤迈出铁门，目光扫过板车上那两口装满高纯火铜精矿的木箱，鼻子里哼了一声：\n\n“行了，火铜抬进来吧。说吧，放着巡脉堂双份津贴的威风差事不干，拖六十块灵石的精铜跑老夫这毒烟窝子，打的什么主意？”\n\n在这位眼里揉不得沙子的半步铸鼎老火工面前，耍心眼套近乎只会适得其反。\n\n陈长庚坦然抬头，把实实在在的利害摊在明面上：\n\n“不敢欺瞒长老。弟子无门无派，在黑石峪坏了器堂龚执事的暗矿账，留在外头迟早被他们拿会签规矩派去十死无生的前线填坑。”\n\n“弟子想求长老收做记名门人，替长老看炉筛渣讨口安稳饭吃，顺道学两手真火工保命。”\n\n“倒是个不藏奸的实在话！”\n\n寇重山把百斤锻锤往青石地上一顿，震得碎石乱跳，伸出蒲扇般的大手一挥，两口沉重木箱便轻若无物地飞入主窟库角：\n\n“铜礼老夫收了！丑话说在前头，进我地肺废火窟挂记名弟子，没有前山那些师兄师弟迎来送往的排场，也不许打着老夫的旗号去外头仗势欺人，惹出祸事自己擦屁股！”\n\n“弟子谨记。”陈长庚干脆应下。\n\n寇重山指了指窟内那三座终年喷吐硫磺黑烟的青铜大炉，语气霸道冷硬：\n\n“每月各房送来的报废灵器残甲，你负责守紧那三座废器熔炉化铁除煞，每五日把炉底结出来的剧毒矿渣筛干净封桶运走，少筛一斤老夫拿铁尺抽你！”\n\n说到这儿，老人焦黑恐怖的左脸皮肉扯动了一下，独眼寒光凛冽：\n\n“但只要你把这三座炉子伺候妥当，有老夫在废火窟喘气一日，前山鲁老儿和龚铁横那帮杂碎谁敢伸手来老夫窟里抓人派炮灰差，老夫一锤砸断他的狗爪子！”\n\n等的就是这一句铁诺。\n\n陈长庚没有半点迟疑，当即走入石窟水缸旁舀了一碗粗茶，撩起青玉执事袍双膝跪地，规规矩矩磕了三个头，双手奉茶过顶：\n\n“记名弟子陈长庚，拜见师父！”\n\n寇重山痛快接过粗茶一饮而尽，随手从腰间摸出一枚被炉火熏得微红的火玉竹简，连同一串生铁院门钥匙抛进陈长庚怀里：\n\n“起来吧。这卷《赤火控炉诀》拿去揣摩引地火的门道。三号废器熔炉东头有座带地火支脉的独立石院，以后你就住那儿，没事少来主窟烦老夫打铁！”\n\n“谢师父赐法。”\n\n陈长庚恭敬执礼退下，牵着卸空货物的青骡走出主窟侧门，顺着一条飘满浓烈硫磺黄烟的石径拐向东侧崖壁。\n\n未到东侧石院门口，他的目光便落在了紧邻院墙十步外的三号废器熔炉堆料场上。\n\n半亩大小的焦石坪上，无人看管地堆着小山般高的报废法器残片——有被魔门污血蚀断灵纹的二阶飞剑残刃，有炸裂黑焦的二阶护身铜甲，每一块残铁上都缠绕着寻常炼器师避之唯恐不及的狂暴金煞与死毒。\n\n可在陈长庚眼里，这一座座散发恶臭毒烟的废铁山，全是不花一枚灵石、取之不尽的二阶无瑕髓晶。\n\n陈长庚握紧袖中那卷温热的《赤火控炉诀》玉简，推开东侧独立石院厚重的生铁院门，向来冷峻平静的唇角微微扬起了一丝弧度。"}, {"n": 118, "title": "挡驾折威", "body": "次日三月初二，辰初。\n\n山间晨雾尚未散尽，断火绝谷里的硫磺浓烟已被早风吹得翻滚如潮。\n\n陈长庚昨夜在东侧石院歇得极沉，一早起来刚把三号废器熔炉底下的通风铁栅清通一遍，绝谷外头的狭窄石阶上，便传来一阵急促嚣张的脚步声。\n\n“这就是那座鸟不拉屎的废火窟？呛死个人了！”\n\n一名身穿月白织金内门真传服饰、背负一柄阔口赤纹重剑的青年捏着鼻子走在前头，眉宇间满是居高临下的倨傲，周身毫不掩饰地散发出开脉境中期巅峰的强横灵压。\n\n正是器堂掌矿鲁长老座下大弟子，柳横舟。\n\n跟在柳横舟左后方半步引路的，赫然是昨儿在联堂割肉赔了五十块灵石、脸色阴沉如铁的龚铁横！\n\n龚铁横快步上前指了指东侧石院前穿着青布短打的陈长庚，咬牙压低嗓门道：\n\n“柳师兄，就是这小子！昨儿拿半截死人信压我就算了，转头竟滑溜钻进废火窟躲兵役，绝不能让他舒舒服服猫在后山享清福！”\n\n“放心，一个没根基的泥腿子，还翻不出我器堂的手掌心。”\n\n柳横舟轻蔑一笑，大步跨上谷口界石平台，下巴微抬冲陈长庚喝道：\n\n“前头扫炉灰的，可是新调来的陈长庚？过来接器堂钧令！”\n\n陈长庚放下手里的长柄铁铲，不紧不慢拍净衣袖，走到距离谷口界石五步外的台阶高处站定，平淡拱手：\n\n“小弟陈长庚，见过柳师兄、龚师兄。不知二位师兄大驾来废火窟有何贵干？”\n\n见陈长庚站在高阶上连腰都没弯一下，柳横舟眉头一竖，冷哼一声从袖中甩出一面赤漆火签：\n\n“本宗南线赤砂堡昨日军械告急！鲁长老念你既是器堂会签出身的司炉执事，特命本师兄前来考校提拔，即刻改派你押送三十车霹雳火油赶赴赤砂前线督军，限半个时辰内交出废火窟钥匙随我下山！”\n\n赤砂堡前线这几日正跟血河宗主力硬碰硬，押三十车见火就炸的霹雳火油过去，跟绑在火药桶上当活靶子没有任何区别。\n\n旁边的龚铁横抱起双臂，满脸快意地等着看陈长庚变脸求饶。\n\n谁知陈长庚连看都没看地上那面赤漆火签一眼，只从怀中取出昨日联堂核发的朱砂公文亮了亮，语气平和得没有一丝火气：\n\n“柳师兄怕是没看昨日联堂抄报。这纸调令上有升仙殿纪长老与巡脉堂秦主事双印，写明非经升仙殿与本窟寇长老联签，任何堂口不得擅自征调废火窟执事。”\n\n“师兄若真缺人押火油，不妨先去主窟请我师父寇长老签个字？”\n\n“你师父？！”\n\n龚铁横与柳横舟同时一愣，随即柳横舟像是听到了天大的笑话，仰头嗤笑道：\n\n“少拿寇疯子的名头吓唬人！谁不知道寇重山十年没收过半个徒弟，前几个来废火窟的执事连主窟铁门都没摸着！拿一张破纸就想抗掌矿房的军令，谁给你的狗胆？！”\n\n话音一落，柳横舟眼神骤狞，体内开脉境中期巅峰的炽烈剑煞轰然爆发，如一座烧红的铁山当头朝着石阶上的陈长庚狠压而下：\n\n“在器堂，鲁师尊的话就是规矩！给本师兄跪下接签！”\n\n狂风卷起满地碎煤砂。\n\n陈长庚衣袂猎猎作响，体内紫金仙脉纹丝不动，面上却顺势露出一分被中期巅峰灵压逼得呼吸微滞的凝重，双脚钉在石阶上硬是没弯半分膝盖，只冷冷吐出一句：\n\n“柳师兄擅闯长老驻地逼跪记名门人，就不怕坏了宗门铁律么？”\n\n“在这断火绝谷，本师兄就是铁律！跪——”\n\n柳横舟最后一个“下”字还没冲出牙关，三十丈外紧闭的废火窟生铁巨门内，陡然炸开一声如九天旱雷般的狂怒暴喝：\n\n“哪个没断奶的小畜生，敢在老夫门前放屁称铁律？！”\n\n“轰隆——！！”\n\n排渣瞭望口铁窗被一股蛮横绝伦的气浪直接撞飞！\n\n一道缠绕着恐怖半步铸鼎赤金煞火的乌黑流光撕裂浓烟，带着刺耳欲聋的破空尖啸，照着柳横舟站立的谷口平台闪电砸落！\n\n“不好！快闪开！！”\n\n龚铁横吓得魂飞天外，抓着柳横舟后领拼了老命往后暴退！\n\n“咚——咔嚓嚓！！”\n\n一柄烧得通体赤红、重逾百斤的八棱百炼玄铁巨锤擦着柳横舟鼻尖三寸重重砸进谷口青石地，那块立了百年的丈高花岗岩界石当场炸得四分五裂，狂暴气浪掀得柳横舟与龚铁横双双仰天跌滚出三丈开外！\n\n柳横舟头顶玉冠崩碎，披头散发瘫在煤灰堆里，双耳膜被那记蕴含半步铸鼎真元的怒喝震得流出两行殷红鲜血，整张俊脸惨白如纸！\n\n门内，寇重山压根连面都懒得露，生铁刮擦般的咆哮声震得两侧崖壁碎石哗哗乱掉：\n\n“姓柳的小杂毛！回去告诉鲁老儿，陈长庚昨儿给老夫磕过头奉过茶，是我寇重山窟里记名的徒弟！滚回去把耳朵洗干净，谁再敢踏过碎石界碑半步来老夫窟里抓差，下一锤老夫直接砸扁他的天灵盖！”\n\n“嗡——”\n\n插在深坑里的赤红百斤巨锤受无形吸力一扯，倒飞穿回瞭望口，“哐当”一声落闸关死。\n\n谷口死寂得只剩裂开界石滋滋冒出的焦黑青烟。\n\n龚铁横捂着嗡嗡作响的耳朵，看着深坑里融化的赤红石浆，眼珠子惊恐得快瞪出眼眶——寇疯子竟然真的破例收这小子当了记名弟子，还为他动了半步铸鼎真火！\n\n“走、快走！”\n\n柳横舟哪还有半点方才威风凛凛的真传派头，抹了一把耳朵流下的血水，连掉在地上的赤漆火签都不敢去捡，在龚铁横搀扶下一瘸一拐、屁滚尿流地逃下了绝谷山道。\n\n石阶上方，陈长庚静静目送两道狼狈身影消失在山道拐角，确认四周再无半双窥探眼线，这才弯腰捡起地上那面无主的赤漆火签，随手扔进了三号熔炉灶口烧成灰烬。\n\n经此一闹，前山掌矿一脉短期内绝不敢再明着往废火窟伸半根指头了。\n\n陈长庚拍了拍手，转身走回东侧独立石院，拉下厚重的隔音防窥生铁门栓，准备把自家这座长久落脚的新窝彻底布置妥当。"}, {"n": 119, "title": "废窟安炉", "body": "掌矿派两名恶客灰溜溜滚下绝谷后，整座断火绝谷重归只有铁锤声与风火声的清幽。\n\n东侧这座独立石院虽被硫烟熏得乌黑，内里格局却颇为宽敞，前院设着晾晒矿砂的石坪与水井，后院依山凿出三间石壁厚达三尺的静室，最里头一间内室地面还引着一眼温热稳定的地肺支脉火口。\n\n陈长庚没有急着开炉修炼，而是足足花了两日工夫，把石院内外像铁桶一样筛查拾掇了一遍。\n\n他在前院墙头补上了寇重山所赐的隔音预警禁制，又将内室通风暗缝用九宫浊泥封灵纹逐寸抹平，把那三枚寒磁母铁精炼的破磁铁钎呈品字形钉入内室地火火口边缘。\n\n真气微吐，半部《地脉敛息阵图》上的“借煞倒卷诀”悄然运转。\n\n火口深处立时生出一股柔和却绵密不绝的倒吸暗流——莫说内室里炼化晶砂的灵力波动传不出半寸，便是任何异味逸散出来，也会第一时间被扯进地底百丈深处的硫磺主火脉焚得干干净净。\n\n三月初四，入夜戌末。\n\n内室青灯微亮，暖意融融。\n\n陈长庚盘膝坐在重新铺好干爽蒲团的石榻上，解下腰间青云储物袋与贴身暗囊，不疾不徐地将这段时日边矿厮杀与联堂立功攒下的全部家当清点归位。\n\n最显眼的，是一堆堆码得整整齐齐、莹白温润的完整下品灵石。\n\n赴任黑石峪前净存二百五十枚，审郑百斛抄出三十枚赃款，瓮城斩乌横岭摸尸得一百二十枚，除去拨给岳铁脊修筑石垒抚恤矿役的那三十枚，再加上三月初一联堂核销赏下的百枚斩将头功——\n\n如今他手头随时可动用的完整下品灵石，已稳稳跨过四百枚大关，停在了四百七十枚整的丰厚数目上！\n\n单论现钱身家，寻常内门开脉中期老执事攒上十年也未必有他富裕。\n\n灵石旁侧，静静躺着乌横岭留下的那柄二阶下品“赤煞断魂刀”，两只严封着六成重紫金地母玄晶主髓的上古寒玉匣，四十五钱一阶无瑕道髓晶砂，以及仅剩的三枚过载烈阳火珠与七块高纯地火精石。\n\n左袖加宽的御虫皮囊里，三十六只一阶巅峰老虫与百零四只一阶中上品紫纹变异甲虫正安静蛰伏休眠。\n\n“火珠在黑石峪耗去了十七枚，改日倒要寻些高阶雷火主材重新补足百枚才稳妥。”\n\n陈长庚将灵石重宝逐一收回贴身储物袋，目光落向脚边一只刚从三号废器熔炉筛出来的生铁渣桶。\n\n桶里装的不是寻常废铁，而是今日白昼他亲自熔毁三柄报废二阶青钢飞剑后，从炉底筛出来的拳头大一团乌紫毒渣——里头既锁着二阶百炼精金本源，又混着剧毒蚀脉尸血，旁人碰都不敢碰一下。\n\n算算时辰，自二月二十二午后在黑石峪炼化残刀至今，早已过了十余日，怀中蚀纹石臼蓄满的地脉潮汐充盈欲溢。\n\n陈长庚取出那尊巴掌大的缺角灰石臼搁在地火暗眼旁，夹起那团乌紫刺鼻的二阶飞剑毒渣稳稳按入臼心。\n\n“嗡——”\n\n石臼断口那道非金非玉的暗金裂痕微光流转，早已解锁二阶转化的臼壁如鲸吞般引动地肺潮汐，将飞剑毒渣里沉积多年的尸血怨毒与铅火杂质寸寸碾磨剥离。\n\n一刻钟后，收尾将至。\n\n一股比提纯一阶废灰浓烈十倍不止的地火腥甜奇香刚漫出臼口三寸，便被地面借煞倒卷阵一口吞入地火支脉，再混入山谷外终年不散的滚滚赤黄硫磺浓烟之中，连院门外树枝上的夜虫都没惊动半只。\n\n待微光敛尽，陈长庚低头看去。\n\n臼底不见半点黑垢，唯有十余粒米粒大小、泛着淡淡赤金锋芒的纯净“二阶金煞髓晶”静静聚成一撮，边角还散着几星细碎金屑。\n\n“成了。”\n\n陈长庚眼底浮起一抹笃定笑意。\n\n不用去外头跟人拼命抢矿，单靠这座无人肯来的废火窟每日倾倒的报废二阶灵器残渣，他每隔三日便能源源不断白得一炉零丹毒的二阶金煞髓晶！\n\n他先拨出边角那几星金屑喂给御虫囊里的百四十只煞甲虫磨牙壮骨，随即将余下大半撮二阶金煞髓晶用寒玉小匣封存一半留作备用，另一半直接仰头吞入腹中。\n\n温和锋锐的金火药力顺喉化开，毫无滞涩地融进紫金周天仙脉，连日奔波留下的一丝微末倦意被涤荡一空，开脉境初期顶峰的真气愈发凝实醇厚。\n\n次日三月初五，午后申初。\n\n陈长庚按规矩看顾完三座熔炉火候，便搬了一张竹编躺椅搁在东侧石院临崖的后廊下，拿小泥炉引了一簇温和地火，慢悠悠煮上一壶清香云雾茶。\n\n崖下断火绝谷硫烟翻滚，抬头望去，远处云泽宗主峰云海浩渺、仙鹤翩跹，却再没有管事敲门催命，也没有暗箭冷刀悬在枕边。\n\n陈长庚捧着温热茶盏轻轻呷了一口，微眯双眸靠在竹椅背上，难得享了半日踏入仙途以来最松快清静的偷闲时光。\n\n半盏清茶刚见底，十余丈外的三号废器熔炉方向，忽然传来寇重山那中气十足、震得屋檐落灰的大嗓门：\n\n“东院的小子！明日该交头一轮底渣了，晚上拎上渣桶来主窟，顺道陪老夫喝两盅！”"}, {"n": 120, "title": "炉边论火", "body": "三月初六，酉初傍晚。\n\n残阳给断火绝谷的焦黑山崖镀上一层暗金余晖。\n\n陈长庚赶在日落前，利落地将三座青铜废器熔炉底部的五日毒渣筛得干干净净，装满三只贴上封条的精铁废渣桶搁在排渣道口；至于里头成色最肥的几块二阶断刃残芯，自然早进了东院暗格。\n\n洗净手脸换上一身干净青布常服，陈长庚没空着手去主窟。\n\n他左手提着今日早间花二两碎银托送废铁的老杂役从山下捎来的两坛“黑石陈酿烧刀子”，右手铁签子上串着半扇刚在三号炉口用果木炭烤得外焦里嫩、滋滋冒油的黄羊肋排，迈步走进了热浪滚滚的废火窟主厅。\n\n主窟正中，寇重山刚打完一柄二阶粗胚重尺，赤着精壮上身往冷水桶里一浸铁尺，“嗤”地腾起漫天白雾。\n\n老人鼻翼一动，扭头瞥见陈长庚手里油光锃亮的烤羊排和泥封老酒，焦黑冷硬的半边脸皮顿时舒展开来：\n\n“你小子鼻子倒灵，怎么知道老夫烦透了前山膳堂那些清汤寡水的灵谷粥？”\n\n“打铁熬盐都是出大力气的火里活，嘴里没点油水烈酒压不住燥气。”\n\n陈长庚笑着走上前，也没寻什么桌椅讲究虚礼，直接搬过两块平整干净的垫炉青石搁在一号熔炉旁，拿芭蕉叶垫好烤羊排，顺手用短刀片成巴掌大的厚肉条，再“啪”地拍开泥封，给寇重山满上一大海碗琥珀色的烈性烧刀子。\n\n“哈哈，对老夫的脾气！坐！”\n\n寇重山大步走过来一屁股坐上青石，抓起一条滚烫冒油的羊肋排咬下一大口，再端起海碗仰脖灌了半碗烧刀子，痛快得长哈出一口酒气：\n\n“痛快！比前山那些端着架子抿茶水的假道学强出一百倍！”\n\n陈长庚陪着浅饮了半碗，也不提器堂前山半句是非，只指着冷水桶里那柄二阶重尺胚子，虚心讨教起今日控火化铁时遇上的两处百金混熔节点。\n\n一聊起看家本事，孤僻寡言的寇重山话匣子彻底打开了。\n\n师徒二人就着炉台跃动的赤红火光，一口肉一口酒，聊的尽是哪路乌铜见地火三息必脆、如何听气泡闷响辨别铁芯暗纹的实在匠门绝活。\n\n陈长庚原本就有三年熬卤观烟的毒辣底子，一点就透，偶尔补上一句盐碱除铅的偏门巧思，听得寇重山独眼连亮，拍着大腿连饮了三碗烈酒。\n\n酒过三巡，两坛烧刀子见了底。\n\n寇重山放下酒碗，借着火光上下打量了陈长庚两眼，冷不丁开口道：\n\n“小子，昨日你提着百斤渣桶上台阶，脚步沉稳绵长，连半口粗气都没喘——你那身开脉初期的底子，不像外头传的那么虚吧？”\n\n陈长庚心头微凛，放下筷子坦然低声道：\n\n“瞒不过师父法眼。弟子早年练过一套粗浅横练桩功，在黑石峪又得了几分机缘将养好了大半暗伤，只是外人跟前不敢露白，怕惹器堂眼红。”\n\n寇重山很满意他的坦诚，也没刨根问底打听徒弟私密，只屈指敲了敲膝头：\n\n“懂藏拙是好事，修真界死得最快的全是爱抖羽毛的花孔雀。不过老夫瞧你周天真气虽稳，护脉外功却还差了一层真火候。”\n\n陈长庚精神一振，忙拱手请教：“还请师父指点迷津。”\n\n“寻常开脉修士图快，靠磕破境丹一路硬冲中期、后期，殊不知经脉未经寒煞千锤百炼，将来到了冲击铸鼎大关引地火凝鼎时，十个有八个要经脉崩裂炸成废人！”\n\n寇重山压低了沙哑嗓音，一字一顿道，“你想稳稳当当跨进开脉中期、顺道把日后铸鼎的底子夯成生铁板，最好在破境前寻一味二阶奇物‘百炼寒煞铁髓’，配着老夫的控炉火劲打磨一遍周天主脉。”\n\n百炼寒煞铁髓。\n\n陈长庚将这六个字牢牢记在心里，略一沉吟道：“这等淬脉奇珍，宗门庶务库房和黑石坊市只怕难见踪影吧？”\n\n“本宗库房那点存货，早被鲁老儿和几个世家大族瓜分干净了，轮不到你。”\n\n寇重山嗤笑一声，伸手进怀里摸索片刻，“啪”地抛过来一枚巴掌大小、通体乌黑冰凉的生铁令牌。\n\n陈长庚双手接住低头一看，铁牌正面未刻一字，背面却铸着一张獠牙毕露、透着阴森煞气的古怪黑煞鬼面。\n\n“半个月后是三月二十一，三宗交界北面百六十里的‘乱葬谷’地底，每季开一次不问出身来历的地下散修交换会，行里叫‘黑煞鬼集’。”\n\n寇重山站起身拎起百斤锻锤，背对着他摆了摆手，“魔门弃徒、散修老怪手里常有大墓挖出来的百炼寒煞铁髓流出。届时老夫替你看三天炉子，你自个儿换身不起眼的皮囊拿铁牌摸进去淘换，记住财不露白，死了别报老夫名字！”\n\n“多谢师父成全！”\n\n陈长庚起身朝着老人宽厚微驼的背影深深一揖，将残席碗筷收拾利落，这才揣着那枚沉甸甸的鬼面铁牌退出了主窟。\n\n夜风拂过绝谷石径，卷起地肺赤火微烫的余温。\n\n陈长庚走回东侧独立石院落下铁栓，指腹轻轻摩挲过铁牌背面冰冷凸起的黑煞鬼面纹路，转身步入隔绝一切窥探的内室密房，开始清点半月后赶赴地下鬼集的筹码与退路。"}]}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById("pub-data").textContent);
    const state = {
      bookIdx: DATA.books.length - 1,
      tab: "prose",
      chapter: 1,
      proseGroup: "1-20",
      allChapters: false,
      outlineGroup: "all",
      fontSize: 17,
    };

    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const fmtTitle = (n, t) => /^第[\d零〇一二三四五六七八九十百千万两]+章/.test(t) ? t : `第${n}章 ${t}`;

    function renderSwitcher() {
      document.getElementById("book-switcher").innerHTML = DATA.books.map((b, i) => `
        <button class="book-card ${i === state.bookIdx ? "active" : ""}" onclick="selectBook(${i})">
          <span class="tag ${b.badgeClass}">${esc(b.tag)}</span>
          <div class="book-name">《${esc(b.title)}》</div>
          <div class="book-desc">${esc(b.logline)}</div>
        </button>
      `).join("");
    }

    function renderPanel() {
      const b = DATA.books[state.bookIdx];
      const maxCh = b.chapters.length;
      let contentHtml = "";

      if (state.tab === "prose") {
        if (maxCh > 20) {
          const pGroups = Array.from({ length: Math.ceil(maxCh / 20) }, (_, idx) => { const s = idx * 20 + 1, e = Math.min(maxCh, (idx + 1) * 20); return [`${s}-${e}`, `${s}—${e}章`]; });
          const [ps, pe] = state.proseGroup.split("-").map(Number);
          const groupChs = b.chapters.filter(c => c.n >= ps && c.n <= pe);
          const list = state.allChapters ? groupChs : b.chapters.filter(c => c.n === state.chapter);
          contentHtml = `
            <div class="sub-nav">
              ${pGroups.map(([val, label]) => `<button class="btn ${state.proseGroup === val ? "active" : ""}" onclick="setProseGroup('${val}')">${label}</button>`).join("")}
              <button class="btn ${state.allChapters ? "active" : ""}" onclick="setAllCh(${!state.allChapters})">本组20章连读</button>
              <span style="margin-left:auto;display:flex;gap:6px">
                <button class="btn" onclick="adjFont(-1)">A-</button>
                <button class="btn" onclick="adjFont(1)">A+</button>
              </span>
            </div>
            <div class="sub-nav" style="padding-bottom:6px">
              ${groupChs.map(c => `<button class="btn sm ${!state.allChapters && state.chapter === c.n ? "active" : ""}" onclick="setCh(${c.n})">第${c.n}章</button>`).join("")}
            </div>
            <div style="--fs:${state.fontSize}px">
              ${list.map(c => `
                <article class="prose-box" style="margin-bottom:20px">
                  <h2>${esc(fmtTitle(c.n, c.title))}</h2>
                  ${c.body.split(/\n+/).filter(Boolean).map(p => `<p>${esc(p.trim())}</p>`).join("")}
                </article>
              `).join("")}
            </div>
            ${!state.allChapters ? `
              <div class="pager">
                <button class="btn" ${state.chapter <= 1 ? "disabled" : ""} onclick="setCh(${state.chapter - 1})">← 上一章</button>
                <span style="font-size:13px;color:var(--ink-2)">第 ${state.chapter} / ${maxCh} 章</span>
                <button class="btn" ${state.chapter >= maxCh ? "disabled" : ""} onclick="setCh(${state.chapter + 1})">下一章 →</button>
              </div>
            ` : ""}
          `;
        } else {
          const list = state.allChapters ? b.chapters : b.chapters.filter(c => c.n === state.chapter);
          contentHtml = `
            <div class="sub-nav">
              <button class="btn ${state.allChapters ? "active" : ""}" onclick="setAllCh(true)">1—${maxCh}章连读</button>
              ${b.chapters.map(c => `<button class="btn ${!state.allChapters && state.chapter === c.n ? "active" : ""}" onclick="setCh(${c.n})">第${c.n}章</button>`).join("")}
              <span style="margin-left:auto;display:flex;gap:6px">
                <button class="btn" onclick="adjFont(-1)">A-</button>
                <button class="btn" onclick="adjFont(1)">A+</button>
              </span>
            </div>
            <div style="--fs:${state.fontSize}px">
              ${list.map(c => `
                <article class="prose-box" style="margin-bottom:20px">
                  <h2>${esc(fmtTitle(c.n, c.title))}</h2>
                  ${c.body.split(/\n+/).filter(Boolean).map(p => `<p>${esc(p.trim())}</p>`).join("")}
                </article>
              `).join("")}
            </div>
          `;
        }
      } else {
        const maxOut = b.outlines.length;
        const groups = [["all", `全部${maxOut}章`], ...Array.from({ length: Math.ceil(maxOut / 20) }, (_, idx) => { const s = idx * 20 + 1, e = Math.min(maxOut, (idx + 1) * 20); return [`${s}-${e}`, `${s}—${e}章`]; })];
        const [gs, ge] = state.outlineGroup === "all" ? [1, maxOut] : state.outlineGroup.split("-").map(Number);
        const list = b.outlines.filter(o => o.n >= gs && o.n <= ge);
        contentHtml = `
          <div class="sub-nav">
            ${groups.map(([val, label]) => `<button class="btn ${state.outlineGroup === val ? "active" : ""}" onclick="setOutGroup('${val}')">${label}</button>`).join("")}
          </div>
          ${list.map(o => `
            <div class="outline-item">
              <h3>${esc(fmtTitle(o.n, o.title))}</h3>
              <p>${esc(o.synopsis)}</p>
            </div>
          `).join("")}
        `;
      }

      document.getElementById("main-panel").innerHTML = `
        <div class="toolbar">
          <div class="tabs">
            <button class="btn ${state.tab === "prose" ? "active" : ""}" onclick="setTab('prose')">第 1—${maxCh} 章正文</button>
            <button class="btn ${state.tab === "outline" ? "active" : ""}" onclick="setTab('outline')">第 1—${b.outlines.length} 章故事大纲</button>
          </div>
          <div class="dl-group">
            <a class="btn" href="${b.outlineUrl}" download="${esc(b.outlineFileName)}">下载 1—${b.outlines.length}章大纲.txt</a>
            <a class="btn" href="${b.proseUrl}" download="${esc(b.proseFileName)}">下载 第1—${maxCh}章正文.txt</a>
          </div>
        </div>
        ${contentHtml}
      `;
    }

    window.selectBook = function(i) { state.bookIdx = i; state.chapter = 1; state.proseGroup = "1-20"; state.outlineGroup = "all"; state.allChapters = false; renderSwitcher(); renderPanel(); };
    window.setTab = function(t) { state.tab = t; renderPanel(); };
    window.setProseGroup = function(g) { state.proseGroup = g; state.allChapters = false; state.chapter = Number(g.split("-")[0]); renderPanel(); };
    window.setCh = function(n) {
      state.allChapters = false;
      state.chapter = n;
      const gStart = Math.floor((n - 1) / 20) * 20 + 1;
      state.proseGroup = `${gStart}-${gStart + 19}`;
      renderPanel();
      window.scrollTo({ top: 180, behavior: "smooth" });
    };
    window.setAllCh = function(v) { state.allChapters = v; renderPanel(); };
    window.setOutGroup = function(g) { state.outlineGroup = g; renderPanel(); };
    window.adjFont = function(d) { state.fontSize = Math.max(14, Math.min(22, state.fontSize + d)); renderPanel(); };

    renderSwitcher();
    renderPanel();
  </script>
</body>
</html>
