风道的进退暗径，沈砚约上熟稔云泽山形水势的陈戍，趁夜摸入西山背阴处的寒鸦枯涧。两人顺着早年山洪冲出的干涸地下暗河逆流摸索三里，沈砚凭十八丈神识隔壁探查，确认暗河尽头距云泽地火裂谷中段岩台仅隔三尺薄脆焦岩，且地势高出谷底火浆河床数丈，恰处紫煞毒烟上风口。沈砚当即与陈戍在暗河拐角石梁下埋设硫铁火油罐与铜丝警铃，锁死这条进可夺药、退可断后的隐秘通道。"}, {"n": 83, "title": "扫货备关", "synopsis": "地壳蓄势震动令坊市高阶散修急于变现杂货换购保命符器，沈砚算准裂谷彻底崩开尚有月余窗口，决定先将修为推至炼气圆满再入险地。他连换三套衣装并借林晚萤贵宾牌遮掩，从散摊与万宝楼分批扫入十八斤同源一阶顶峰赤元增气丹废渣、十块赤铁晶炭及清解燥毒的雪莲寒露，又重金购下两件一阶上品青蚕避火内甲分赠林晚萤护身。返程察觉周明远暗探尾随大宗买主，沈砚从容绕入槐阴巷空院金蝉脱壳，安然携货潜回竹溪巷。"}, {"n": 84, "title": "炼气九层", "synopsis": "竹溪巷小云篆敛息阵内，沈砚心无旁骛闭死四十日。他恪守青蚨烬炉单日安全一炉的铁律，每日萃出一滴精纯赤元净膏，配以雪莲寒露涤尽肺络燥火，推动《厚木蕴火诀》真气浩荡冲开第九重经脉壁垒，一直打磨至进无可进的炼气九层圆满之境！破关后他神识暴涨至二十二丈，木火灵力圆融凝练，更趁热打铁将剩余赤阳火铜与地肺火引封成第三枚二阶赤阳火煞珠。刚收功出窖，坊市封门强征的急报已至。"}, {"n": 85, "title": "强征暗流", "synopsis": "沈砚以《敛息折苇步》将外显气机稳稳压在炼气六层，夜间于竹溪巷密会陈戍与林晚萤。原来周氏外派筑基初期执事周玄通亲自坐镇西门，纵容周明远带队挨巷搜院，凡无大铺庇护的外棚散修拒不报名皆被铁链锁拿充作开道苦役。沈砚深知硬闯四门必遭筑基神识锁定，当即拍板令林晚萤先持万宝楼符师客卿帖暂避南街内栈，待明日周氏押送首批散修进山、城防松懈之际，三人改走槐阴巷外年久失修的石砌排水暗沟脱身。"}, {"n": 86, "title": "云篆瞒天", "synopsis": "周明远率四名炼气后期护卫杀气腾腾拍响竹溪巷石门。沈砚早已将全部身家与青蚨烬炉收入贴身储物袋退入地底暗窖，由小云篆敛息阵隔绝内外气机，仅留灶房一炉掺了败血草的陈年霉药余烬散发刺鼻病秽酸气。周明远隔门神识扫见院空人杳、满屋瘟瘴霉气，唯恐沾染晦气耽误西门押队差事，厌恶地命人贴上封条匆匆离去。次日黄昏趁四门换防空隙，沈砚悄然汇合陈戍与林晚萤，顺槐阴巷排水暗沟无声滑出云泽坊界。"}, {"n": 87, "title": "各司其职", "synopsis": "西山地动山摇、硫烟蔽日，沈砚在寒鸦枯涧暗河内与两名盟友作最后战前交底：他将特制辟煞寒香囊分佩二人以防紫煞毒气侵肺，体谅陈戍修为止步炼气四层不宜入谷搏命，遂留十枚清燥解毒丸与破障符请其扼守枯涧出口、专司预警断援；林晚萤则携改良版准二阶云篆迷雾困阵随沈砚潜至中段岩台策应分割敌军。三人核准三声竹哨撤离暗号与战利分成，各按本事严守战位，沈砚随即持锥破开暗河尽头焦岩。"}, {"n": 88, "title": "裂谷血饵", "synopsis": "透过中段岩台石隙俯瞰，裂谷正道已成修罗血场：周氏筑基执事周玄通将一枚青芜宗百艺举荐铁券高悬阵台作饵，喝令周鹤年与周明远驱赶五十名应募散修踏入洒满紫渣的风口催动引血锁煞阵。上百头受毒灰刺激的一阶火蜥兽自岩浆河狂涌扑咬，散修死伤惨重却遭周氏护卫封死退路。沈砚凭二十二丈神识冷静穿透硫雾，精准锁定主断层石窟下两株霞光流转的二阶赤髓芝及四处引血阵枢，屏息静待谷底哗变爆发。"}, {"n": 89, "title": "群修哗变", "synopsis": "石猛振臂一呼彻底引爆幸存三十余名炼气后期散修的求生凶性，众人纷纷调转法器轰击周氏阵台，裂谷瞬间乱作一团。周玄通勃然大怒，催动筑基灵压连毙数名领头散修，一面强令周鹤年死守主阵压制即将喷发的地火煞眼，一面派周明远率四名炼气五层护卫沿两侧岩壁搜杀攀爬逃命的散修。见周明远小队脱离主战场摸向中段岩台，沈砚与林晚萤眼神交汇，借滚滚硫烟掩护悄然张开云篆敛雾困阵。"}, {"n": 90, "title": "宿敌伏诛", "synopsis": "周明远五人刚入阵心，林晚萤指诀一引，浓稠云篆白雾瞬间封死十丈声光灵波！沈砚不再压制炼气九层圆满修为，二十二丈神识如铁网罩定猎物，左手玄铁短刃、右手乌金破甲锥化作两道夺命乌光穿雾急掠，呼吸间便贯穿四名护卫咽喉。周明远骇极祭出青铜护心镜，被沈砚欺身一记三叠旋火指震裂镜面、破甲锥透胸而过；临死看清沈砚面容方知当年紫灰窑早被掉包。沈砚麻利收走储物袋焚尸，反手一锥击碎岩台下的侧翼引血阵枢。"}, {"n": 91, "title": "断枢引煞", "synopsis": "侧翼阵枢一碎，引血锁煞阵灵力逆冲，震得本有旧伤的周玄通气血翻腾，谷底残存散修趁乱四散突围。沈砚不贪恋外围厮杀，运起《敛息折苇步》贴着背阴岩缝疾掠而下，用酸性蚀石散配合控火丝悄然熔断第二根地底导火铜桩，令乱流岩浆彻底冲垮周氏营盘；随即趁浓烟蔽目闪入主断层石窟，以寒玉布裹住药铲，干净利落地将两株成熟的二阶赤髓芝连同伴生赤髓火晶一并收入铅封玉匣，然灵芝离土的奇香仍被上风处的周鹤年敏锐嗅出。"}, {"n": 92, "title": "困阵阻敌", "synopsis": "面对筑基初期的周玄通与炼气八层的周鹤年携两名内坊精锐凌空合围，沈砚足尖一点借火浪滑向地形狭长的“一线天火槽”，半途反手撒出混有硫灰的赤砂障目散，两名冲在最前的内坊精锐双目灼瞎惨叫坠入火涧。高处待命的林晚萤看准周玄通叔侄追入槽口，倾尽灵力激活预埋的十二杆准二阶云篆迷雾困阵阵旗，滚滚云雾瞬间将叔侄二人前后隔断在火槽两段；林晚萤毫不停留，按战前约定转身撤入寒鸦枯涧暗河。"}, {"n": 93, "title": "先斩丹师", "synopsis": "云篆困阵最多只能拖住筑基修士十余息，沈砚必须在时间差内先拔掉炼气八层的周鹤年以免腹背受敌。他仗着二十二丈神识在己方阵雾中单向视物，见周鹤年正焦躁催动紫煞毒火鼎喷火烧雾，当即御玄铁短刃佯攻其下盘逼其回鼎护身，右手精准弹出一枚一阶赤炎煞火丸撞入鼎口积存的紫煞药灰！轰然炸鼎的毒火当场反噬周鹤年面门，沈砚全力催动乌金破甲锥自其后心透体而过，顺手捞走储物袋；话音未落，周玄通已破雾杀至！"}, {"n": 94, "title": "外涧断援", "synopsis": "就在周玄通战戈劈落的千钧一发之际，五名听闻动静的周氏外围巡卫企图包抄寒鸦枯涧后路；守在高崖的陈戍沉稳张弓，一箭射爆石梁下的硫铁火油罐，滚滚落石火海当场截断全部外援，稳稳接应林晚萤入洞。火槽之内，沈砚果断祭出一阶中品玄龟铁木盾硬挡战戈锋芒，铁木盾应声炸碎，他仗青蚕避火内甲卸去大半火劲，嘴角溢血借势倒掠进仅三丈宽的死角火溶洞。周玄通见赤髓芝近在咫尺，不疑有他欺身追入洞腹！"}, {"n": 95, "title": "煞珠灭敌", "synopsis": "窄洞之内退路尽绝，沈砚眼中寒芒暴涨，以炼气九层圆满真气瞬息激发扣在掌心的全部三枚二阶赤阳火煞珠！三团狂暴绝伦的二阶地肺赤煞雷火在三丈石腹内连环炸开，恐怖冲击波硬生生撕碎周玄通本就带伤的筑基护体灵罡，将其左臂连同战戈炸飞、脏腑重创吐血。沈砚强咽喉头腥甜顶风突进，乌金破甲锥挟全身真元贯入周玄通眉心将其毙命！他迅速收走储物袋与残戈，一指轰塌洞底薄弱火脉，翻涌岩浆瞬间淹没整条火槽焚尽万迹。"}, {"n": 96, "title": "暗窖清获", "synopsis": "主煞眼崩塌令整座云泽地火裂谷被岩浆彻底封死，周氏留守外坊的低阶管事见周玄通叔侄久不归营，只当众人贪采灵药葬身地火天灾，坊市戒严随之瓦解。沈砚在安全暗点服寒丹调息三日平复震伤，清点战利：两株二阶赤髓芝完好无损，另获灵石百四十块、丹道手札及周玄通贴身携带的那枚不记名青芜宗百艺举荐铁券。沈砚留铁券供自己隐名入册，将伴生二阶赤髓火晶与四十块灵石分予林晚萤去考陆巡使亲掌的铁券，并厚酬陈戍三十块灵石。"}, {"n": 97, "title": "密室验艺", "synopsis": "青芜宗素来厌恶地方世家截留百艺苗子，陆巡使在穿云灵舟上设下隔绝神识的单人密室，声明只验百艺实才、名录对周氏严密封存。林晚萤先行登舟，献上二阶赤髓火晶并当场以青毫分水绝活一笔绘成上品云篆避火符，顺利拿下陆巡使亲掌的铁券入录符阵峰；沈砚随后戴笠入室交验铁券，刻意藏拙显露炼气八层修为，仅凭三叠旋火指在半刻钟内将一炉驳杂药散提纯至九成净度，听得陆巡使抚掌称善，当场发下丹鼎峰百艺弟子腰牌。"}, {"n": 98, "title": "故旧安顿", "synopsis": "趁灵舟启航前的两日空闲，沈砚陪同陈戍离开云泽坊，前往百里外远离周氏耳目、凡修混居的清净水镇白沙渡。沈砚出资四十块灵石替旧伤除根却经脉定型的陈戍盘下一座带防护小阵的临水药材栈房，又留足二十瓶温和润脉药脂供其安稳颐养天年。半生孤冷防人的陈戍眼眶微热，郑重取出贴身珍藏的《赤火矿脉全图》兽皮原件（内标深处二阶异火线索）及早年在古矿拾得的半枚暗青火纹铜片一并赠予沈砚，两人渡口饮酒体面作别。"}, {"n": 99, "title": "寒河寄银", "synopsis": "沈砚深知修仙界仇杀无常，一旦真身显露故里反易给凡俗家人招祸。他换上寻常青布棉袍敛尽灵气，冒雪赶至寒河县东街茶楼远眺，亲眼见父母与病愈的堂兄已凭前番银钱开起红火安稳的沈记草药铺，再无岁修河工之苦。沈砚欣慰一笑未去相认，转赴城中字号最老的通济钱庄总号，按堂兄早年约定的医户暗记存托黄金二十两、纹银三百两（足抵全家十年丰衣足食之资）及三张温和养生凡药方，隔街朝药铺深深一揖，飘然远去。"}, {"n": 100, "title": "青芜叩门", "synopsis": "沈砚携贴身密藏的青蚨烬炉、两株二阶赤髓芝与百余块灵石积蓄，与林晚萤并肩登临穿云灵舟，穿云破雾飞行五日抵达灵峰万仞的东隅大派青芜宗。刚入外门执事殿分派差役，丹鼎峰世家出身的管事弟子便借口外来散修火气驳杂，将上品地火院肥差尽数留给族人，把沈砚打发去山阴荒僻、专司清运二阶烈毒废丹的“废火房”当火工。旁人皆道苦差难熬，沈砚望向废火房后堆积如山的二阶废丹渣与地火支脉，眼底掠过沉静笑意，从容领牌入峰。"}], "chapters": [{"n": 1, "title": "霉梗拆账", "body": "十月霜降刚过，云泽山脚的冷风卷着一股苦涩的药烟味，刮过百草堂外山药庐的青石前院。\n\n廊下并排摆着四只半人高的大竹筐，筐口堆满切好的苍术与黄芩干片。副管事郑福全裹着一件半旧的青绸棉袍，坐在避风的太师椅里，左手端着热茶盏，右手慢条斯理地拨弄膝上一把黄铜算盘。\n\n“都听仔细了。”郑福全眼皮微抬，目光扫过阶下站着的四个半大少年，嗓音不高，却带着股拿捏惯了人的官腔，“进了我百草堂外山药庐，头一桩就是立规矩。你们四个今天先过盘点关，把这四筐新收的干料过秤验清，画押认领斤两，留庐复核三天。三天后烘药出库分毫不差，堂里才给你们签正式身契；若是算岔了斤两，或是烘出库时折了成色，按堂里的老规矩，要么拿十倍罚银来填，要么当场退籍，由县衙差役直接押去寒河工地挑泥筑坝。”\n\n话音落下，排在最前头的庄户少年吴大勇缩了缩脖子，却还是抢先上前抱起竹筐挂上木杆大秤。另外两个瘦小少年也忙不迭帮忙扶秤砣、看准星。\n\n站在末位的沈砚垂着双手，粗布短褐洗得发白，背上只斜挎着一只鼓囊囊的灰布包袱，包袱里硬邦邦地垫着家里带出来的那只残破灰青石臼。寒风灌进领口，他指节冻得微青，心里却把眼前的死活账算得明明白白。\n\n再过五天，就是寒河县冬日岁修河工抓丁的死限。今年秋旱连着早霜，家里那间小医铺赊出去的药钱收不回三成，爹娘砸锅卖铁也凑不出每年八两纹银的免役折银。原本在药庐当学徒抵役的堂兄沈禾，半个月前突然咳血不止、肺脉枯竭被退回县里，如今还瘫在炕上喘气。沈砚揣着仅剩的三十八文盘缠和堂兄的旧荐帖赶来顶替，今天这道门槛要是迈不过去，回县就得下寒河冰水里服苦役，十个人去未必能活回三个。\n\n“回副管事的话！”吴大勇抹了一把额头的汗，瓮声瓮气地高声报数，“四筐苍术并黄芩，每筐六十斤整，合共二百四十斤，一两不短！”\n\n郑福全拨算珠的手指停下，嘴角浮起一丝若有若无的笑意，从桌上抽出一张早就写好抬头的毛边纸，朝末尾的沈砚招了招手：“沈家小子，荐帖上写你是寒河县医户出身，识字会算账。他们几个蠢笨，手印你领头先摁。认下这二百四十斤上品干料，今夜就有白面馍和热汤管饱。”\n\n吴大勇几人一听有白面馍吃，脸上顿时露出喜色，催促地看向沈砚。\n\n沈砚上前两步，躬身双手接过笔单，目光却先落在那张纸的墨迹上——“上品干料二百四十斤，入烘房净出”一行字墨色干透，显然不是刚写的。再转头看廊下第三、第四只竹筐，表层铺着金黄干爽的黄芩新片，可竹筐底部的篾条缝隙却沁着一圈暗沉的水渍，寒风一吹，隐约飘来一丝极淡的窖泥酸腐气。\n\n沈砚握笔的指尖微顿，后背渗出一层冷汗。\n\n他在自家医铺跟爹熬药晒草七八年，不用翻筐底就已经看穿了名堂：后面两筐底下压着受潮回软的陈年霉梗。这种霉梗吸饱了山雾阴湿，过生秤时压手得很，可一旦送进烘药房用炭火烤干，水分抽尽不说，发乌酥烂的霉心还会碎成废末，少说也要凭空缩水三十斤！\n\n郑福全这是库房里原本就有三十斤陈年损耗烂账平不掉，特意趁新学徒入门盘点，拿霉梗混进新筐里找替罪羊。\n\n沈砚垂着眼帘，脑子里念头飞转。若是像吴大勇那样稀里糊涂摁了手印，三天后烘药出库短了三十斤上品干料，十倍罚银就是十几两雪花银，他把骨头拆了也赔不起，只能任人拿捏或退籍送官；可若是当众嚷破副管事拿霉药坑人，郑福全在这外山药庐一手遮天，当场翻脸扣他一个“咆哮公堂、不识好歹”的罪名撵出大门，他照样走投无路。\n\n既不能背这口黑锅，还得替这位副管事把面子和烂账一并圆过去。\n\n电光石火间，沈砚放下毛笔，朝着郑福全恭恭敬敬揖了一礼，声音不高不低，透着医铺小学徒特有的谦谨：“回副管事，小的在家跟家父炙药，学过一条烘房省炭的土法子。方才走近竹筐，闻着三号、四号筐底带着三分秋雨窖气，斗胆请副管事容小的翻筐分拣一二，免得辜负了堂里拨下来的好炭火。”\n\n郑福全端茶盏的手一顿，半眯起眼睛盯着他，慢悠悠道：“哦？堂里的药都是过手验过的，你要怎么分拣？丑话说前头，耽误了入库时辰，板子可不认人。”\n\n“小的不敢耽误工夫，半刻钟便好。”\n\n沈砚不再多言，挽起袖口走到第三只竹筐旁，也不用人帮手，双手稳稳探入筐底一掀，将底下压着的两层药材翻倒在廊下干净的竹席上。\n\n吴大勇凑近一看，顿时倒吸一口凉气。只见竹席上摊开的苍术老根表皮发乌，折断一截，断面泛着细密的白霜，捏在手里绵软潮湿，跟上面那层脆生生的干片简直天差地别。吴大勇脸色煞白，张嘴就要喊“这药坏了”，沈砚却顺势侧身一步挡住他，手里麻利地将干片与潮梗拨成两堆，一边过小秤一边朗声报账：\n\n“回副管事，山脚秋雾重，药农交货时常有底层受潮的老梗。按医家烘药的规矩，这种带潮陈梗药力散了大半，自然不能充作上品净料入药柜；但若是直接扔了也糟蹋东西，最合宜的用处是拿去做‘烘房垫底粗料’——铺在烘药竹匾最底下隔火吸潮，既能护住上头的上品黄芩不焦边，又能替烘房省下两成炭火。按行里三斤半湿粗梗折一斤干耗的通例，这四筐里共挑出上品足干净料二百一十斤，另分出垫底粗梗四十二斤，烘干入账正好折抵十二斤火耗，再算上常例清筛的十八斤泥皮旧耗，两下合拢，恰恰补齐二百四十斤整账！”\n\n廊下一片安静，只有算盘珠子被风吹得微响。\n\n吴大勇几个听得云里雾里，只觉得沈砚报数快得像竹筒倒豆子；可太师椅上的郑福全却是听懂了每一个字。\n\n这小子半个“霉”字、“假”字没提，全推到了山雾潮气和药农身上；更妙的是，用“烘房垫底粗料”加常例泥耗这么一拆算，库房账面上那三十斤填不平的亏空，名正言顺就化进了烘房火耗里，而沈砚自己认领画押的，只有实打实、干爽无亏的二百一十斤上品净料！\n\n郑福全放下茶盏，盯着沈砚看了足足三息。面前少年低眉顺眼地捧着改好细目的分拣单，双手稳当，既无拆穿上官的得意，也无畏缩发抖的怯态。\n\n“啪。”\n\n郑福全手指在黄铜算盘上一抹，珠子归位，脸上终于露出一丝笑模样：“到底是从小摸药秤长大的，比那几个只会死力气的夯货强些。行了，就按你拆的垫底粗料单子入册画押。你们四个，领了留庐复核的木牌，先去偏院住下，三天后烘房见真章。”\n\n“谢副管事抬举。”沈砚双手按印画押，指尖触到那块刻着“外山复核”的榆木腰牌时，紧绷的肩背才微不可察地松了一分。\n\n入夜戌时，山风更冷。\n\n沈砚因会算账，被单独分在偏院灰房紧挨着的一间狭窄耳房里，吴大勇三人则挤在隔壁大通铺。耳房四壁被经年的药烟熏得乌黑，只有一铺土炕、半张缺腿木桌。沈砚进屋头一件事，便是解开灰布包袱，把那只边缘缺了一小口、通体灰青粗糙的祖传石臼拿出来，稳稳塞进炕角木箱后头垫平。\n\n刚收拾停当，外头便有提着食盒的粗使杂役挨门送饭：两个掺了麸皮的白面馍，外加一碗冒着热气、浓黑稠厚的药汤。\n\n“都趁热喝了，一滴不许剩！”杂役敲着碗沿叮嘱，“这是郑副管事特意吩咐熬的‘固本补气汤’，专门给你们新学徒驱寒长力气的，外头花几十文钱都买不着这一碗！”\n\n隔壁吴大勇端起粗瓷碗“咕咚咕咚”几大口灌了个精光，抹着嘴走到耳房门口炫耀：“沈兄弟，这百草堂真是大方！一碗热汤下肚，我这肚子里跟揣了个小火炉似的，浑身筋骨涨得慌，明儿再扛两百斤药包都不带喘的！”\n\n沈砚捧着温热的粗瓷碗笑了笑：“吴兄好福气，我肠胃弱，得吹凉些慢喝。”\n\n等杂役收了食盒走远、吴大勇也回屋倒头睡下，沈砚脸上的笑意才一点点敛去。\n\n他掩上耳房木门，端起那碗固本补气汤凑到豆大的油灯下。汤面浮着一层暗红油星，初闻确有一股黄芪与炙甘草的甜香。他没有仰脖吞咽，只极其谨慎地用舌尖沾了一星半点汤水，刚一触舌，一股霸道刺舌的辛燥麻意便直冲上颚。\n\n沈砚眼神微凛，立刻低头将舌尖那点唾沫吐在擦桌破布上，随即伸出两根手指探入碗底，捻起一撮沉淀的暗红药渣细细搓开。\n\n在甘草纤维之间，混着些许磨碎的赤褐色矿物细末与焦黑草籽。指腹搓动几下，皮肤竟隐隐发烫发麻，鼻端更是嗅出一股绝不该出现在补气方子里的燥烈邪火！\n\n沈砚脑海里骤然浮现出半个月前堂兄沈禾被抬回寒河县时的模样——堂兄刚捎信回家时，也欢喜地说药庐待人厚道、天天有补汤喝得浑身是劲；可不过半年光景，整个人就瘦脱了相，夜夜咳出带黑丝的血沫，连爹把完脉都直摇头，说他肺络被猛药烧干锁死，这辈子再提不动半桶水。\n\n窗外寒风拍打着破旧窗纸，油灯火苗晃了晃。沈砚看着指尖那撮暗红药渣，指节慢慢攥紧，没有发出半点声响。"}, {"n": 2, "title": "免役身契", "body": "耳房墙根有一道年久失修的渗水暗沟，平日里排些洗涮灰盆的脏水，底下积着厚厚一层潮湿煤灰。\n\n沈砚端着那碗固本补气汤蹲在暗沟旁，先留心听过院外并无脚步声，这才将碗中浓黑滚烫的药汁顺着砖缝一点点倾倒下去，又铲起两捧冷草灰严严实实地盖在上面，压住那股辛燥甜腥的药气。末了，他用指尖蘸了一滴碗底残汤，在自己下唇边和粗布衣襟前轻轻抹出一点褐黄药渍，才拿冷水涮净粗瓷碗放回门外竹篮。\n\n接下来两天复核期，这套动作他早晚各做一回，半点差池没出。\n\n郑福全果然盯得极紧。每日清晨点卯和傍晚收工，这位副管事都要踱步到前院，看似随意地扫一眼四个新学徒的脸色，偶尔还会伸手拍拍吴大勇等人的肩膀，试探他们的呼吸粗细。\n\n才喝了四五碗汤，吴大勇那张黑红脸膛便涨得像涂了猪血，大冷天只穿一件单衣还在院里抢着扛百斤重的药捆，喘气粗重滚烫，嗓门洪亮得震耳朵；另外两个少年也一个个眼白泛红、精力亢奋。郑福全看在眼里，捻着算盘珠频频点头，唯独目光落到沈砚身上时，眉头微微皱了皱。\n\n沈砚这两日专挑烟尘大的角落分拣粗梗，见管事过来便微垂着肩背，脚步放得虚缓，唇色在寒风里显得有些发白，一看就是那号天生底子单薄、连补汤都催不起血气的文弱医户。\n\n“身子骨是虚了些，好在手脚仔细，没把烘房的差事办砸。”到了第三日午后大盘点，郑福全翻看着烘药房刚交上来的干料入库单，语气淡淡地评了一句。\n\n四筐药材烘出净料二百一十斤零二两，垫底粗梗吸足潮气后入账折耗分毫不差，正好把库房原先挂欠的三十斤陈账抹得平平整整。郑福全心里满意，便指了指后院灰房与烘房交界的过道：“沈砚，再跟我去趟后院，把今天云泽内坊刚清运下来的废渣和烘房炭耗过一遍秤。这笔账算清了，就给你立正式身契。”\n\n“是，小的遵命。”沈砚垂手跟在郑福全半步之后，穿过两道月亮门来到后院。\n\n后院比前院冷清得多，北面是热浪扑面的烘药房，西面则是三间孤零零的青砖灰房。此时灰房门口停着一辆刚卸完货的双轮铁箍板车，地上堆着十几只扎口的粗麻袋，空气里弥漫着一股焦糊混杂着硫磺燥气的刺鼻味道。\n\n两名穿灰衣的内坊健仆正抱着膀子监看交割，神色傲慢，连郑福全上前搭话都得赔着三分小心。\n\n沈砚一壁拨算盘记数，一壁借着过秤验袋的动作留心观察，很快弄清了这后院两样要紧物件的底细。\n\n头一样便是地上这十几麻袋“废丹灰渣”。百草堂外山药庐不过是个收售世俗草药的幌子，山腰往上的云泽内坊里住着真正的修仙丹师。仙家炼丹极难，十炉里倒有七八炉要废，每月都会攒下大批焦黑结块的废丹药渣运到外山药庐，由灰房杂役筛去砂石后深埋沤肥。这些废渣里虽还残存着一丝半缕未散尽的草木药力，却混杂着烈火炙烤出的狂暴丹毒，莫说凡人，便是内坊学艺的修士敢乱吞半块，也会烧烂肺腑、经脉淤死。\n\n而在十几只寻常麻袋旁，还单独摆着一只上了黄铜锁的生铁小桶。桶缝边缘漏出一点细灰，在冬日斜阳下竟闪烁着诡异的暗紫金星，隔着三尺远都让人觉得眉心发紧。\n\n“看什么看，低头记你的账！”郑福全见沈砚目光扫过生铁桶，立刻沉下脸敲打道，“那是内坊丹师老爷亲手封的特殊废渣，直接入深坑泼生石灰封死！堂里的死规矩记牢了——寻常灰渣短了斤两顶多挨顿鞭子，谁要是吃了豹子胆敢私藏半撮内坊特殊废渣，或是夹带外山矿炭出庐，一律按‘盗窃仙家资粮’论处，当场废掉双手押去寒铁矿坑服死役，连你寒河县老家的爹娘都得连坐赔十倍罚银！”\n\n“小的记下了，绝不敢乱碰半分。”沈砚连忙低头应诺，引着杂役转向烘药房墙角清点矿炭。\n\n墙角竹篓里堆着一块块拳头大小、色泽暗红如猪肝的沉重矿石炭，这便是外山烘炙贵重药材专用的“地火赤铁矿炭”。此炭采自云泽山脉地火矿缝，敲击有金铁声，一块能顶寻常松木炭五块耐烧，火力既猛又稳。\n\n按郑福全递过来的调拨底单，本月前十日烘房共领用赤铁矿炭一百斤。沈砚蹲在炭篓与灰坑旁，左手掂了掂剩余炭块的成色分量，右手拿木尺量过灰坑里暗红矿灰的厚度，心里算盘只拨了两下便暗暗心惊——赤铁矿炭烧透后留灰足有四成重，可眼前余炭加上坑底矿灰，满打满算只合七十二斤原炭！\n\n整整短少了近三成、将近三十斤赤铁矿炭，全被这位郑副管事不知从哪条暗路倒腾出去了。\n\n沈砚脸上却半点异色不露，顺着烘房连阴天加火的由头，把账面盈亏按公秤成色理得清清楚楚，双手呈还账册。\n\n郑福全接过账册从头扫到尾，见上头字迹工整、炭耗合情合理，不由满意地吐出一口长气，领着沈砚回到前院账房，当堂取出一式两份的正式学徒身契与一张盖着百草堂鲜红大印的免役担保凭据。\n\n“摁了指印，从今日起你就是外山药庐的正式学徒，每月六百文月钱，管两顿粗粮。”郑福全把那张盖印凭据推到桌边，“这张抵役回执拿去，百草堂替你作保，寒河县每年八两纹银的岁修河工折银便给你免了。”\n\n沈砚指腹重重摁上印泥，在身契上落下清晰指印，将那张薄薄却能救全家性命的免役凭据贴身收好。趁着黄昏官驿信差路过药庐山门收信，他咬牙从仅剩的三十八文盘缠里数出二十文加急脚力钱，亲眼看着信差将封好的家书与免役回执塞进邮囊策马往寒河县奔去，悬了整整半个月的心才算真正落回肚里。\n\n回到账房听候分派差事时，吴大勇三人正争着讨要去前院药柜或伙房当差。郑福全被吵得心烦，转头看向安静站在门边的沈砚：“沈砚，前院账房还缺个跑腿贴单子的，你可愿留下？”\n\n吴大勇顿时投来羡慕嫉妒的目光。谁知沈砚却上前一步，拱手低声道：“回副管事，小的有一事相求。小的自幼跟爹熬药，闻惯了烟火灰气，反倒不惯前院人多嘴杂。方才去后院过秤，见灰房夜间无人精细筛灰，不少还能垫烘炉的粗砂都混着废渣倒了。小的愿去偏院灰房当值夜筛渣的差事，白日照旧替副管事核对过秤单子，夜里顺手把灰筛净，绝不叫堂里吃亏。”\n\n这话一出，旁边吴大勇像看傻子一样看着他。灰房值夜又脏又冷，整宿跟焦臭药灰打交道，连老杂役都避之不及。\n\n郑福全先是一怔，旋即想到自己手头那些矿炭进出正嫌前院眼杂，有个老实怯懦、只知道埋头算账筛灰的小学徒替他守着偏院灰房，岂不正省心？他当即抚掌道：“难得你不贪清闲，肯替堂里省耗。行，往后偏院灰房的值夜筛渣就归你管，耳房也拨给你单住。”\n\n当夜子时将近，山风呼啸，整座外山药庐早早熄了灯火。\n\n偏院灰房离前院隔着两道高墙，四周静得只听见枯枝刮瓦声。沈砚插紧灰房厚重的木门栓，先检查了一遍窗户缝隙，这才长长舒出一口气。前院固然体面，可天天在郑福全眼皮底下喝那催命补气汤、替他顶着短少矿炭的雷，早晚死无葬身之地；唯有躲进这没人愿来的臭灰房，他才有喘息自保的余地。\n\n这两日搬筐筛灰，他双手虎口被寒风和竹篾生生冻裂出一道半寸长的血口，一碰冷灰便钻心地疼。加上为了应付郑福全随时可能的搭脉查验，他还得用随身带的几味苦寒草根配点压气色的药散。\n\n沈砚从耳房抱来那只祖传灰青石臼，又从烘药房今日退下来的废炭篓底挑出几块还没烧透、泛着暗红微光的赤铁矿炭余烬，盛在一只破铁盆里拢起火苗。随后，他走到白日筛过的普通废渣筐前，避开一切杂乱丹灰，单单挑出几捧气味最纯正、内坊炼废的一阶止血散药渣倒进灰青石臼。\n\n他原只打算借赤铁矿炭的余温把石臼烘暖，将止血废渣里的寒湿涩气焙干些许，看看能否外敷冻疮。\n\n灰青石臼稳稳搁上铁盆炭火，沈砚右手握住石杵，不紧不慢地顺着臼壁研磨起来。一息，十息，小半刻钟过去，铁盆里的赤铁矿炭本该越烧越旺，可沈砚握着石臼外壁的左手忽然察觉不对——那原本滚烫灼人的矿炭热浪非但没有外散，石臼粗糙厚重的底座贴着炭心，竟毫无征兆地传来一阵奇异的吸热轻颤！"}, {"n": 3, "title": "烬底微脂", "body": "铁盆里的暗红炭火像被什么无形之物猛吸了一口，跳动的火苗肉眼可见地矮下去半寸，连屋角原本被烘得微暖的空气都骤然冷了下来。\n\n沈砚握着石杵的右手瞬间停住，后背汗毛微竖，第一反应便是屏住呼吸，侧耳倾听灰房木门与窗外的动静。\n\n夜风穿过檐角破瓦，发出呜咽低响，院外并无半点巡夜脚步声。他低头再看铁盆上的灰青石臼，臼身虽在极其轻微地嗡鸣颤动，却既没有崩裂炸开的迹象，也没有冒出半缕呛人的焦臭毒烟，反倒像一块干渴了百年的老海绵，正将地火赤铁矿炭散出的霸道火力一丝丝往臼底深处吞敛。\n\n沈砚眼眸微凝，强行压下心头的惊疑。这只灰青石臼是沈家传了三四辈的老物件，听祖父生前随口提过，早年太祖父逃荒路过一处塌陷古山涧时捡来压药箱的，质地非石非铁，冬天不挂霜，架在猛火上干烧也从不炸裂，家里一直拿它捣些坚硬矿药，从未见过这等异状。\n\n为什么偏偏今晚动了？\n\n沈砚目光飞快扫过盆底的赤铁矿炭，又看向臼内那几捧从内坊运来的止血废丹渣。在家中医铺时，烧的是寻常松柴木炭，捣的是凡俗草根树皮；唯有今夜，底下是云泽山脉出产的地火赤铁矿炭，臼里装的是修仙丹师炼废的丹药残渣！\n\n“莫非这老石臼，要吃仙家的药渣和矿炭火才肯显出真用处？”\n\n这个念头一起，沈砚心脏重重跳了两下，却没有鲁莽地把炭火拨旺，也没有吓得立刻撤臼泼水。他在医铺熬过上百锅膏方，最明白行火走气半途而废的反噬凶险——此时石臼气机已引动，贸然断火或猛添柴炭都可能坏事，最稳妥的法子就是顺着眼前的火候稳稳送到底。\n\n当下他深吸一口冷气，左手抄起火钳，将铁盆边缘几块半红的赤铁矿炭碎块轻轻往臼底聚拢，右手重新握稳石杵，收拢全部杂念，一杵接一杵匀速慢磨起来。\n\n灰房里静极了，只剩下石杵擦过臼壁的沙沙轻响，以及盆中矿炭偶尔爆开的细微“噼啪”声。沈砚双目微敛，全凭一双练熟了的耳朵听炭爆疏密、用鼻子分辨臼口飘出的细微气味变化——哪一处炭温高了半分，石杵便顺势带过散去燥热；哪一处炭色暗了，火钳便极其轻微地拨开一层白灰透风。\n\n这种全神贯注盯紧温差的活计极耗心神。才过了半炷香工夫，沈砚额角便渗出细密冷汗，眉心隐隐发涨，仿佛有一根看不见的细线系在他心神与臼底之间，半息也松懈不得。\n\n他咬紧牙关硬撑着，手腕稳如秤杆，硬生生将这不疾不徐的火候维持了整整一炷香。\n\n“啪。”\n\n铁盆里最后一块核桃大小的赤铁矿炭彻底燃尽，表面裂开数道细纹，化作一捧毫无热气的惨白矿灰。\n\n几乎就在炭火熄灭的同一刹那，沈砚瞳孔猛地一缩——只见灰青石臼粗糙昏暗的内壁底部，倏忽亮起一缕指节长短、暗青幽微的残缺火纹！那纹路古拙苍劲，快得如同夜空中划过的萤火，刚一映入眼帘便隐没回灰青石质深处，再摸上去依旧冰凉粗糙，不露半点灵光。\n\n可臼内的景象却已天翻地覆。\n\n方才倒进去足有两三斤重、焦黑结块的止血废丹渣，此刻竟齐齐塌陷下去，化作了浅浅一层灰扑扑、连半分药腥味都没剩下的轻飘枯灰。而在枯灰正中央的臼底凹槽里，静静凝着半滴米粒大小、色泽灰白温润的浓稠药脂！\n\n沈砚凑近半尺，鼻端没有闻到半点废丹渣原本刺鼻灼喉的焦糊火毒，只有一股雨后新草芽般的清冽微香，闻上一口便觉头脑一清。\n\n然而还没等他露出喜色，一股细微却尖锐的燥热气流陡然顺着他方才贴扶石臼的左掌心窜入经脉，直扑肺腑！\n\n“咳……”\n\n沈砚猛地捂住胸口闷哼一声，只觉得咽喉深处像被人撒了一撮滚烫的炭火末，干涩刺痛得厉害，连带着肺叶吸进一口冷风都火辣辣地发紧。他连忙端起桌上凉透的白水连咽三大口，冰凉井水顺喉而下，盘膝静坐平复了足足十余息，肺络间那股针扎似的燥刺感才勉强压下去大半，只在喉底留下一丝挥之不去的干渴。\n\n“天下果然没有白捡的便宜。”沈砚放下水碗，眼神非但没有失望，反而愈发冷静清明。这石臼吞了废丹渣与赤铁矿炭，确实能把斑驳狂暴的残药熬萃成精华，但每开一次炉，自己不仅要耗费整整一炷香的心神盯紧火候，还得承受一分燥火入肺的代价。若是贪多硬撑，只怕药脂没攒下多少，自己的肺脉倒要先像堂兄那样烧坏了。\n\n他转头看向臼底那半滴灰白药脂，依旧严守着医户人家的保命规矩，绝不直接往嘴里送。\n\n沈砚从袖袋里摸出一根削尖的干净竹签，屏住呼吸，用签尖极其小心地从那半滴灰白药脂边缘挑起发丝粗细的一星微沫，轻轻涂抹在自己左手虎口那道冻裂见肉的血口上。\n\n药脂刚一触及皮肉，竟不似寻常猪脂药膏那般油腻滞涩，而是化作一缕温润清凉的水线瞬间渗入伤口。没有预想中废丹火毒蚀肉的剧痛，唯有一股暖融融的气流顺着虎口血脉蔓延开来，痒丝丝地包裹住冻僵的指骨。\n\n沈砚举着左手凑到油灯下，呼吸不由得一滞。\n\n不过十几个呼吸的工夫，虎口那道深红翻卷、连日筛灰都不曾愈合的冻裂血口，边缘竟以肉眼可见的速度收拢止血，凝出一层薄而柔韧的淡粉新痂！他试着屈伸五指用力攥拳，原本一动就撕裂钻心的痛楚荡然无存，整只左手更是暖意融融，连带着手腕筋骨都轻快了三分。\n\n这绝不是世俗金疮药能有的奇效！\n\n沈砚盯着重新归于死寂粗糙的灰青石臼，胸膛微微起伏，眼底终于燃起一簇压不住的亮光。百草堂背后立着云泽内坊的修仙世家，外山杂役在管事眼里不过是随时可弃的账面耗材；他一个毫无门路的寒门医户子弟，原本只求免去家中河工、在这夹缝里苟全性命，可如今手握这只能化剧毒废渣为纯净药脂的石臼，未尝不能窥一窥那高不可攀的仙家引气长生路！\n\n喜意只在心头转了一瞬，沈砚立刻起身料理手尾。\n\n他先用木铲将石臼里的轻飘枯灰和铁盆里的惨白矿灰尽数铲起，均匀撒进墙角明日待运的大灰筐底层翻拌抹平，不留半点异常成色；接着从贴身药囊里摸出一只装眼药散的指甲盖大小白瓷扁盒，用竹片将臼底剩下的近半滴灰白药脂刮得干干净净，封紧木塞，塞进石臼底座双层粗布暗垫的夹缝里。\n\n做完这一切，他心里已理出了清晰的章程：眼下还不清楚这石臼吃什么药渣最稳、一次要配多少斤两矿炭、一天最多能承受几次燥气反噬；接下来几夜必须趁值夜清灰一点点做对照试探，绝不能贪功冒进，更得想办法弄到一门真正的修仙引气法门。\n\n沈砚吹熄了桌上油灯，只留炭盆边最后一点微弱余温，和衣坐回草铺准备歇息。\n\n“笃、笃。”\n\n就在屋里陷入黑暗的刹那，紧贴着草铺的灰房青砖外墙上，毫无征兆地响起两记沉冷短促的铁尺叩击声！\n\n沈砚浑身肌肉骤然绷紧，右手无声无息扣住了枕边的铁火钳，连呼吸都压到了最轻。紧接着，一墙之隔的寒夜阴影里，传来一阵极力压在喉咙深处、却依旧嘶哑如破风箱般的低沉闷咳声，那脚步声在窗外停顿了片刻，似在隔着木窗嗅闻屋内的焦炭余味。"}, {"n": 4, "title": "三斤定炉", "body": "青砖墙外的铁尺叩击声停歇片刻，那阵破风箱般的嘶哑闷咳又压着嗓子响了两声。\n\n沈砚屏住呼吸贴在草铺暗影里，握着铁火钳的五指纹丝不动。借着熄灯前遮严的窗纸，屋里没透出半点亮光，炭盆里最后一点矿灰也早已冷透。窗外那人似乎贴着墙根听了一会儿，没闻见明火浓烟，只低哑地咕哝了一句“夜风大，看紧炭星子”，沉缓的脚步声便踏着枯草渐渐往西墙角远去了。\n\n直到院外彻底恢复死寂，沈砚才缓缓松开火钳，掌心已沁出一层微凉的薄汗。\n\n偏院灰房看似偏僻无人问津，夜里却有护院按时巡墙。方才若是贪快多烧半刻钟，或是石臼冒出什么异味浓烟，只怕当场就要招人破门盘问。\n\n这一夜余下的工夫，沈砚再没碰过灰青石臼，只在脑海里把开炉的前后细节反复推演了十余遍。\n\n天亮交班后，他照常帮着烘药房核对干料斤两。趁着帮烘药老杂役清扫炉膛的当口，他将炉角筛漏下来、按规矩本该当废渣扫走的赤铁矿炭碎块一颗颗捡进灰簸箕，积少成多，不动声色便攒下了五六两还没过火的好矿炭。\n\n挨到入庐第四日夜里子时，巡夜护院的铁尺声刚从外墙晃过，沈砚这才掩严门窗，在灰房最里侧的排烟渠口下摆开铁盆，准备做第一轮摸底试探。\n\n前一夜用的是单一的止血散废渣，但内坊每月倾倒下来的麻袋里，十有七八都是好几种废丹混倒在一起的杂灰。若是石臼不挑食，混着渣也能熬出药脂，往后省事百倍；可万一药性相冲生出变故，必须先拿极小分量摸清脾性。\n\n沈砚用小木秤称出半斤止血散废渣，又从另一只麻袋里舀了半斤气味辛温的补气丸废渣，两相拌匀倒进灰青石臼，底下只搁了半两赤铁矿炭引火，右手边则提前备好了一满桶干黄沙。\n\n火折子点着引草，赤铁矿炭很快泛起暗红微光。\n\n沈砚握住石杵刚磨了不到二十下，心头陡然一跳。只见石臼底座非但没有像前夜那样平缓吸热，反而传出一阵急促杂乱的嗡鸣，臼身烫得惊人！还没等他抽手，臼内两股不同路数的残存药力被矿炭烈火一激，瞬间在臼底冲撞炸开，“嗤”地蹿起一缕刺鼻腥臭的焦赤毒烟！\n\n那红烟擦过臼沿，连旁边垫桌的干草梗都肉眼可见地蜷曲发黑。\n\n沈砚脸色微变，半息也没犹豫，左手抄起铁钳猛地抽走盆底赤铁矿炭塞进湿灰坑，右手提起黄沙桶，对准石臼口兜头盖脸倾倒下去！\n\n厚厚一层干冷黄沙瞬间将石臼捂得严严实实，刚冒头的焦赤毒烟连三尺高都没飘起，便被干沙死死闷在臼膛里，只发出几声沉闷的“滋滋”轻响。沈砚又端起湿抹布捂住口鼻，用蒲扇顺着排烟暗渠口无声扇了小半刻钟，直到屋里那点焦腥味顺着地底烟道散得干干净净，紧绷的脊背才靠着青砖墙缓了过来。\n\n扒开黄沙一看，臼底混投的两样废渣已结成一团漆黑恶臭的硬块，半点药脂也没见着。\n\n“异种药渣药性相悖，一旦同入石臼受火，非但凝不出好东西，还会炸炉生出毒烟。”沈砚将焦块铲进深埋坑，把这一条死规矩牢牢刻进心里——往后无论多缺料，入炉的废渣必须分拣得纯而又纯，绝不能混进半点异源杂灰。\n\n摸清了混渣的忌讳，入庐第五日夜里，沈砚等巡夜动静过去，这才定下心神测试正经的斤两配比。\n\n他白日里趁清筛灰袋，挑出了整整一筐成色最齐整的一阶“回气丹”废渣。这是内坊炼气修士日常打坐最常用的低阶丹药，废渣呈青褐色，带着一股淡淡的陈皮苦香。前回两三斤止血废渣只熬出半滴灰白药脂，连炭火也是烧到半截便竭了；这一回，他用小杆秤精精准准称出三斤回气丹废渣倒入石臼，底下铁盆则摆足了整整二两地火赤铁矿炭。\n\n炭火燃起，暗红热浪稳稳托住臼底。\n\n沈砚盘膝坐在铁盆前，摒除一切杂念，耳听炭火细爆，鼻辨焦香浓淡，双手控着石杵不疾不徐地旋磨。一炷香工夫点滴流逝，他眉心神思如同绷紧的弓弦，将盆底火力分毫不差地锁在最温吞绵长的关口。\n\n“啪。”\n\n二两赤铁矿炭在满一炷香时恰恰燃尽成灰。石臼内壁底部那缕暗青色残缺火纹再度一闪即逝，三斤回气丹废渣齐齐化作轻飘枯灰，而在臼底正中央，静静悬着一整滴黄豆大小、通体澄澈如琥珀的温润药膏！\n\n比先前那半滴灰白药脂足足大了一倍有余，色泽更是剔透无瑕，凑近一闻，草木灵韵清润扑鼻，连半分丹火焦毒都寻不见。这般洗尽斑驳丹毒、只余纯粹草木精气的膏体，已算得上真正的“净灵药膏”。\n\n饶是如此，咽下口水的沈砚仍没有直接试服。虎口冻疮只是外敷，可这回气丹废渣熬出的净灵药膏是要吞进肚子里行功的，脏腑经脉娇嫩百倍，容不得半点闪失。\n\n他转身从墙角捕鼠笼里拎出一只傍晚刚捉到的灰毛野鼠。这野鼠后腿被捕夹刮破了一道血口，冻得在笼底瑟瑟发抖，眼看活不过今夜。\n\n沈砚用竹签挑起极微末的一丝净灵药膏，先抹在野鼠后腿伤口上，见血肉迅速收口并未溃烂；接着又刮了针尖大小一点药沫化进半勺温水，捏开鼠嘴灌了下去，把笼子搁在脚边静静盯着。\n\n一刻钟，两刻钟。\n\n那灰毛野鼠起初缩成一团轻颤，过了半刻钟，原本黯淡浑浊的绿豆眼竟猛地亮了起来，不仅后腿结痂不再流血，浑身灰毛也顺滑舒展，在铁丝笼里上蹿下跳，吱吱叫着啃咬木棍，劲头比壮硕田鼠还要凶猛三分！沈砚用竹筷按住鼠腹仔细摸过脉息脏腑，跳动平稳有力，口鼻间毫无溢血黑气，这才彻底确信此膏内服亦是纯粹无毒。\n\n眼看窗外离五更天还有近两个时辰，角落里筛好的回气丹废渣还剩四五斤，攒下的赤铁矿炭也恰好还够二两。\n\n沈砚看着白瓷小盒里那滴澄澈诱人的净灵药膏，心头不禁动了一念：“寒河县虽免了差役，可郑福全那三十斤矿炭窟窿迟早是个雷。趁今夜手顺，不如再开一炉，多攒一滴是一滴！”\n\n念头既起，他清理干净臼底枯灰，当即又称出三斤回气丹废渣与二两赤铁矿炭，重起炉火。\n\n然而石杵刚磨过半炷香，沈砚便察觉有些不对劲。前番开炉耗损的心神尚未缓过劲来，此刻眉心像塞了一团铅块般发沉，石臼外壁积累的燥热更是比第一炉猛烈了数倍。他咬牙硬撑着磨满一炷香，直到臼底凝出第二滴澄澈的净灵药膏，正要松气收杵——\n\n轰！\n\n一股远比前番凶悍十倍的滚烫邪气，骤然从发烫的石臼壁顺着双掌劳宫穴倒灌而入，一路烧穿双臂经脉，狠狠撞进心肺之间！\n\n沈砚眼前一黑，整个人闷哼着栽倒在草铺边，五指死死揪住胸口衣襟，剧烈地干呛起来。这便是连开两炉引发的“燥火炉毒”——石臼每萃炼一回废丹残渣，都会将剥离出的狂暴火煞蓄在臼壁与执炉人经络里；一日一炉尚可凭自身血气慢慢散去，一日强开两炉，郁结的炉毒便会瞬间反噬心肺！\n\n此刻他肺叶里像有几十根烧红的火针在来回攒刺，每吸进一口冷气，胸腔便火燎般生疼，连带着眉心神思一阵阵针扎似的刺痛，别说再凝神控火，便是多看一眼油灯火苗都觉得头晕目眩。\n\n沈砚颤着手摸过凉水壶灌下大半壶冰水，靠着冰冷砖墙喘息了足足半个时辰，才勉强把两滴净灵药膏连同先前那近半滴初萃药脂一并封死藏妥。经此一遭，他彻底摸清了石臼一日一炉的死界，往后三天之内，怕是半点炉火都碰不得了。\n\n后半夜肺络里的火针刺痛一阵紧似一阵，沈砚翻来覆去彻夜难眠，耳房里备着的一点干枯白茅根煮水喝尽也只压下三成燥意。\n\n熬到入庐第六日寅时初刻，天色尚是一片伸手不见五指的墨黑。沈砚听得肺叶间呼气越发滚烫，深知这炉毒拖到白日干活定会露馅，索性起身披上厚棉褐，把前几夜那近半滴初萃药脂取出来，兑着碗底最后两勺白茅凉汁调成半钱温润的清燥药脂装进小瓷瓶揣入怀中，又往左袖暗袋里塞了一包防身生石灰与燥火炉灰末。\n\n他挎上竹药篓、拎起小药锄，跟门房值夜小厮报备了一声“去后坡挖点苦草垫灰”，便顶着刺骨寒雾出了药庐侧门，踩着碎冰往后坡山涧摸去。\n\n药庐后坡荒草丛生，一条半封冻的浅水冰涧顺着乱石滩蜿蜒而下，涧边生着不少耐寒的清燥白茅根。沈砚借着微弱星光刚挖了小半篓鲜嫩茅根，顺着溪湾绕过一丛一人多高的枯黄芦苇，脚尖忽然踢到一块染了湿意的光滑鹅卵石。\n\n寒风卷开浓雾，一股带着怪异腥甜与焦糊火气的血味直钻鼻端。\n\n沈砚脚步倏然钉在原地，低头看去——只见芦苇丛边的白霜碎冰上，赫然溅着一滩尚未冻硬的粘稠黑血，血泊边缘还隐隐扭动着几缕暗红如炭火般的细微血丝！"}, {"n": 5, "title": "寒涧咳血", "body": "血泊边缘的霜花正被余温融出一圈细小水珠，寒风一吹，除了焦糊血气外，还泛起一股蛇蟒毒涎特有的腥臊恶臭，与寻常草木丹石的药火味截然不同。显然吐血之人离开不超过十息，甚至此刻就藏在几步外的芦苇深处。\n\n沈砚后背寒毛倒竖，却没有做出半点惊慌转身狂奔的蠢事。在这荒僻冰涧把后心亮给一个藏在暗处的高手，死得只会更快。\n\n几乎就在芦苇丛后传出一声极轻的衣袂摩擦声时，沈砚脚下借着碎冰滑势往斜后方连退三步，稳稳贴住上风口一块半人高的青黑乱石。他右手拎着的药锄自然横在身前，左手已悄无声息缩进袖筒，指尖死死扣住了那包混着燥火炉灰的生石灰粉。\n\n“哗啦。”\n\n枯黄芦苇分开，一道裹着黑色旧皮袄的高瘦身影扶着歪脖子老柳树走了出来。\n\n来人五十上下年纪，左脸颊有一道陈年爪痕，右手大拇指已然顶开了腰间一柄窄刃制式长刀的铜护手。正是百草堂外山药庐平日里沉默寡言、专管夜间巡墙的老护院陈戍。\n\n陈戍一双布满血丝的三角眼冷得像冰涧底下的寒铁，浑身散发出一股令凡人胸口发闷的凌厉气机，死死锁住乱石后的少年：“灰房新来的沈家小子？大清早不睡，摸到这后涧来盯谁的梢？”\n\n话音未落，他脚下未见如何用力，整个人已往前逼近半丈，窄刃长刀在寒雾中露出一线森白刀锋。那是实打实经历过生死搏杀的散修威压，只要沈砚露出半分转身逃喊的迹象，下一息刀锋就会抹过他的咽喉。\n\n沈砚喉头被那股寒意逼得微紧，脸色却没有半点溃乱，迎着陈戍的目光平静拱了拱手：“陈护院莫动手。小的沈砚，灰房值夜学徒，寅时初刻跟侧门门房赵老四登了记出来挖白茅根，再过一刻半钟就要回前院点卯。”\n\n陈戍顶刀的拇指微微一顿，眼神愈发阴鸷：“拿门房压我？荒山野岭摔进冰窟窿淹死个学徒，算不得稀奇事。”\n\n“淹死个学徒确实不稀奇，可陈护院若是动了刀，身上这口淤血怕就压不住了。”沈砚站在上风口半步不退，左手在袖中蓄势待发，语速简短清晰地算着明白账，“一旦见血误了点卯，郑副管事怕担干系，必定上报内坊执事封山搜查。小的烂命一条不值钱，袖子里这点毒灰死前撒出去，总能留点动静；倒是陈护院肺经里郁着凶悍毒兽火毒，一旦动刀提气牵动肺脉，旧伤势必反扑咳血，真闹到内坊修士带人搜山，护院觉得划算吗？”\n\n山风刮过枯苇，发出一阵沙沙轻响。\n\n陈戍眯起眼睛，上下打量着眼前这个年仅十六岁的灰衣少年。他早年在云泽山脉深处猎妖，曾被一条一阶顶峰的赤练蟒喷中火毒伤了肺脉，这才退到外山药庐当个混日子的护院。这桩旧伤他瞒得极紧，连郑福全都只当他染了寻常风寒老咳，没想到竟被一个刚入门几天的医户小学徒一眼看穿底子！\n\n更让陈戍忌惮的，是这小子站在上风口的站位和袖筒里鼓起的那团东西——不哭不求，句句戳在他的痛处和利害关口上。\n\n“你既看得出毒兽火伤，就该知道老夫宰你不过顺手一刀的事，费不了几分气力。”陈戍嗓音嘶哑得厉害，喉间又涌起一股腥甜，被他硬生生咽了回去，按刀的手却慢下了三分。\n\n“顺手一刀自然够快，但杀了我，陈护院夜夜子时如刀割肺腑的苦楚还是解不了。”沈砚见他刀势微敛，知道性命已保住了一半，当即顺势从怀里摸出那只拇指大小的白瓷瓶，没有走近，只弯腰稳稳搁在两人中间的一块扁平青石上，退回原处道，“小的在家中医铺见过进山猎户被异种火蟒喷伤的淤血，与地上这滩赤黑带丝、腥臊泛焦的血沫如出一辙。陈护院平日必是买了坊市里的寒属性丹散强压火毒，可仙家低阶丹散十成里带三成丹毒，越吃经脉淤塞越重，无异于抱薪救火。”\n\n陈戍瞳孔微缩，这几句话简直像剖开他胸膛看了一眼似的。这两年他攒下的一点碎灵砂全填进了外山药铺，买的寒散刚吃下去痛快两天，过后咳出来的黑血反而更多，如今连炼气三层的修为都快跌破了。\n\n“青石上是什么？”陈戍没有去捡，冷声问道。\n\n“小的自己配的‘清燥药脂’，一共半钱。”沈砚坦然道，“里头用白茅鲜汁调了温和草木净脂，不含半点猛药丹毒。陈护院若信得过，拿去分三次化水服下，免费试药三天。三天之内，若是子夜闷咳不曾减轻一半，或是肚腹经脉有半分丹毒滞涩，小的任凭护院处置，绝无二话。”\n\n陈戍走上前两步，单手抄起青石上的白瓷瓶，拔开木塞凑到鼻端轻轻一嗅。\n\n他走南闯北二十余年，见过不少毒药暗算，可这小瓷瓶里飘出的气息却极为奇异——既有白茅草的清凉微甘，更裹着一缕极淡却纯粹无比的温润生机，仅仅吸进鼻腔一丝，肺管里火烧火燎的刺痛竟隐隐舒缓了一线！\n\n陈戍霍然抬头，鹰隼般的目光钉在沈砚脸上：“天下没有白送的救命药。你想要什么？丑话说前头，替人杀人越货、蹚药庐管事浑水的事，老夫一概不接。”\n\n“小的也不打听陈护院的过往来历，更不求护院替小的去拼命。”沈砚迎着他的目光，把条件摆得明明白白，“三天后药若见效，小的往后每旬给陈护院供一次清燥药脂，保护院稳稳压住肺经旧火。作为交换，小的只求两样东西：第一，请护院教我一门散修敛藏气息、遇到凶险能跑路的防身步法；第二，带小的认一认外山散修私下交易的黑摊门路与规矩。一手交药，一手学艺，出了这片芦苇荡，你我照旧各干各的差事，两不相干。”\n\n陈戍握着白瓷瓶，指腹摩挲着冰凉瓶身，沉默了足足五六个呼吸。\n\n跟一个手无寸铁、有求于自己且懂分寸的小学徒做长期药石买卖，远比一刀砍死再满世界找高价丹药划算百倍。至于一门散修烂大街的敛息步法和外山草市带路，对他而言根本不损半点筋骨。\n\n“倒是个会算账的小滑头。”陈戍冷哼一声，咔嚓一响将窄刃长刀推回鞘中，把小瓷瓶揣进皮袄内袋，一脚踢起旁边积雪盖住地上那滩黑血，“记住你今天说的话。老夫最恨人探底细、耍花枪。这半钱药脂我试三天，若是有效，三天后子夜我来灰房外墙敲三下铁尺；若是拿糊弄凡人的糖膏消遣老夫，不用等内坊搜山，我先拧断你的脖子。”\n\n说罢，陈戍不再多看沈砚一眼，身形一晃，脚尖踏在枯黄芦苇杆上竟未发出半点折断声，几个起落便消失在山坡灰白晨雾之中。\n\n沈砚站在乱石后，直到周围那股压迫胸口的锋锐气机彻底散尽，才轻轻吐出一口白气，将左手袖筒里的生石灰包重新系紧。\n\n虽然把初萃的那近半滴药脂搭了进去，但总算在绝境里化杀机为生路，搭上了一条真正通往散修圈子的线。只是陈戍最后那两步踏苇无声的身法，也让沈砚越发看清了修士与凡人的云泥之别——不尽快弄到引气法门踏入修行门槛，在这药庐里终究只是砧板上的鱼肉。\n\n他不敢耽搁，俯身抡起小药锄，在溪边飞快挖满一整篓肥壮鲜白的白茅根，趁着天边泛起鱼肚白赶回药庐侧门。\n\n此时刚交辰初，本该是各房杂役慢吞吞领粥下工的散漫时辰。可沈砚刚跨进侧门回廊，前院正堂檐下悬挂的那口青铜警钟，毫无征兆地被人抡槌猛敲起来！\n\n“当！当！当！当！”\n\n急促短厉的钟声一连九响，震得廊下枯树上的积霜簌簌往下掉。\n\n偏院通铺里的吴大勇等人连鞋都没提好，慌里慌张地挤出院门。只见前院正堂石阶之上，副管事郑福全换了一身簇新的团花绸袍，双手高高捧着一封烫金火漆红帖，满面红光地往下喝令：\n\n“全体新老学徒听令！今日早饭一律停发，所有人空腹到正堂廊下按名册列队候检脉象！云泽内坊丹师老爷发下恩典红帖，要从咱们外山药庐挑三个气血最旺的好苗子进内坊学艺——谁敢迟到半步，家法伺候！”"}, {"n": 6, "title": "藏脉淘诀", "body": "“进内坊丹房学艺？！”\n\n这话如同往滚油锅里泼了一瓢水，阶下二十来个新老学徒顿时轰然骚动起来。\n\n吴大勇激动得脖子上的青筋都鼓了起来，一把拽住刚把药篓搁在廊柱边的沈砚，压低的大嗓门震得人耳膜生疼：“沈兄弟你听见没！仙师老爷的丹房啊！听说进了内坊，顿顿有精米兽肉吃，学会了看丹炉，往后连县太爷见了咱们都得拱手让路！”\n\n周围十几个老学徒虽然也有人眼热往前挤，角落里却有两个入庐两三年的扫地杂役暗暗缩了缩脖子，眼神闪烁着往后排退了半步。\n\n沈砚把这一幕尽收眼底，脸上顺着吴大勇的话露出几分羡慕，心底却是冷透了半截。\n\n他这几夜在灰房亲手筛过几十袋内坊废丹渣，最清楚里头混杂的火煞丹毒有多霸道；再加上半个月前肺脉焦枯、咳血瘫炕的堂兄沈禾，哪还有什么不明白的？内坊丹师老爷炼丹何等金贵，怎会无缘无故挑凡俗庄户小子进去传授仙家手艺？所谓“丹房学艺”，分明就是挑气血精旺的半大少年进去当“控火炉童”——守在地火丹炉跟前替修士扇风试火、吸纳开炉毒烟，甚至直接拿身子试那些药性未定的新汤猛药！\n\n寻常体弱的进去撑不过十天半月就废了，唯有喝了固本补气汤后气血虚旺的壮实少年，才经得起地火丹毒多熬榨几个月。\n\n“都闭嘴，排好队一个个上前搭脉！”郑福全领着一名穿皂衣、留山羊胡的内坊老医工在堂前摆开桌案，手里捏着红笔花名册，目光满意地在吴大勇等几个红光满面的少年身上打转。\n\n队伍从东往西挨个上前。\n\n沈砚排在中后段，趁着前头人挽袖搭脉、遮住堂上视线的工夫，借着抬手擦汗的动作，指尖从腰间药囊暗格里捻出一丸早就备好的苦寒黄连散塞进舌底化开。黄连配了生石膏微末，最能沉降浮脉；不仅如此，他在走近桌案前三步时，暗暗提了一口寒气去撞肺叶间昨晚残留的那丝燥火炉毒。\n\n肺络猛地一阵针扎刺痛，沈砚脸色肉眼可见地白了两分，额角沁出虚汗，捂着嘴低低呛咳了两声，这才躬身将右腕搭上脉枕。\n\n山羊胡老医工三根枯瘦手指搭上寸关尺，眉头立时拧成了一个疙瘩，又换左手复按了三息，嫌恶地挥手甩开：“脉浮而涩，肺燥气短，底子比纸还薄！进丹房闻两口地火烟就得断气，下一个！”\n\n郑福全凑过来看了一眼名册，啧了一声：“原来是沈砚。这小子算账倒还精细，就是胎里带的弱症，喝了几天固本补气汤也没养起半点血色。行了，红册划掉，照旧留外山灰房筛灰记账吧。”\n\n“谢副管事恩典，小的身子不争气，定在灰房好生当差。”沈砚垂着头又低咳一声，脚步虚浮地退到廊角留用队列里。\n\n紧接着上前的吴大勇把袖子一撸，露出黑红粗壮的胳膊。山羊胡老医工一搭脉便抚须点头：“脉洪如鼓，气血滚烫，是个顶好的耐火胚子！”\n\n最终，吴大勇连同另外两名喝补汤最多的壮硕学徒一并画上了红圈，当场领了一身灰青内坊短衣，在旁人艳羡的目光中欢天喜地背起包袱跟皂衣医工往山上内坊去了。沈砚站在檐下阴影里目送他们远去，默默回偏院煎了一瓦罐鲜白茅根汤喝下，严严实实封起石臼，安心静养肺络余燥。\n\n一连三日，沈砚白日老实过秤记账，夜间早早熄灯饮白茅汤调息，再未动过半块矿炭。到了入庐第八日十月二十，正逢堂里中旬按旬发放例钱，沈砚领到了正式学徒首旬的二百文足陌铜钱，肺叶间那股火针攒刺的炉毒也消退得七七八八，眉心神思恢复了清亮。\n\n当夜子时刚交，灰房青砖外墙上准时响起“笃、笃、笃”三记轻缓短促的铁尺声。\n\n沈砚披衣下炕，揣好早已用半滴净灵药膏兑白茅汁调成的一钱清燥药脂和白日刚领的二百文大钱，轻轻拉开门栓闪身而出。\n\n寒雾弥漫的墙根下，陈戍一身黑袄站在阴影里，气色比三天前冰涧咳血时稳健了许多，说话间胸腔再无那股拉风箱似的杂音。他深深看了沈砚一眼，也没废话，低声道：“你那药脂确有门道，连服三日，老夫前两宿子时闷咳少了六成，经脉也没添半点丹毒。按先前定的规矩，老夫今晚先教你《敛息折苇步》，再带你去外山草市走一趟；至于往后每旬三钱的供药，便从本月二十九月底那日起算。”\n\n说罢，陈戍引着沈砚绕到灰房后侧僻静的竹林空地，借着月光亲自演练了一遍步法与呼吸配合的关窍。\n\n所谓“敛息步法”，乃是底层散修进山猎妖或黑市防人最实用的保命底子。这门《敛息折苇步》并不深奥，甚至未入引气门槛的凡人也能先练架子：行步时膝微曲、足外缘先着地，如同寒风吹折芦苇般顺势卸去全身踏地声响；同时以特定的绵长闭气法门收束周身热气与心跳，在夜雾林莽中三丈之外便极难被人察觉。\n\n沈砚自幼背惯了上百张汤头歌诀，记性极稳，随着陈戍拆解的七处换气落脚要点走过四五遍，便将口诀步位分毫不差地记死在脑子里。\n\n“架子记住了，往后自己每晚踩砖缝苦练便是。”陈戍见他一点就透，暗暗颔首，随即抛过来一方黑粗布巾，“把脸蒙上，只露眼睛。离天亮还有一个半时辰，跟紧我的脚印，进了外山草市少开口、莫乱摸摊上的物件，谁问也别报百草堂的名号。”\n\n沈砚利落蒙好黑布，运起刚学的折苇步法跟在陈戍身后三步，顺着药庐西侧一条采药人踩出的荒僻山脊小径疾行了约莫五六里。\n\n绕过两座乱石山包，前方一处背风干涸的古河滩里，隐隐透出十几豆幽绿昏黄的纸灯笼微光。\n\n这便是云泽散修坊市山脚外围自发聚起的“草市黑摊”。真正由修仙世家坐镇的云泽坊正街门禁森严，外山杂役无通行铜牌根本进不去；而这片三不管的荒滩野市每逢旬日半夜聚散，摆摊的多是混不下去的低阶散修、采药客或是大铺子里偷摸倒腾边角料的伙计，铜钱纹银与仙家碎灵砂都能混着使。\n\n河滩上二三十个地摊大多只铺一块油布，摊主人人戴着斗笠或蒙着面巾，彼此交谈声压得极低。\n\n沈砚按捺住心头激荡，没有去看那些摆着带血妖兽皮骨或是寒光闪闪短刃的摊位，跟着陈戍慢步转到河滩最角落一处冷清的旧书草药摊前。摊主是个裹着破棉被、气息微弱的白发老散修，油布上零散摆着几株干瘪寒草和三四册虫蛀泛黄的线装残卷。\n\n沈砚蹲下身，先拿起那半册封皮缺了一角的手抄小册翻了两页，上头写着《青木引气篇》五个小字。凡人想要踏入修仙界，光靠吃补药只能强健皮肉，唯有照着这等“引气法诀”感应天地灵气、冲开体内闭塞灵窍并将灵气导入丹田化作灵力，才算真正迈进炼气一层的修士门槛。这册子虽只剩炼气一至三层的残篇，字迹却还连贯清晰；旁边油布上恰好还摆着三株叶片凝着白霜的“清燥寒叶草”，药性比世俗白茅根强出数倍。\n\n“这半册旧书，连同这三株寒叶草，怎么换？”沈砚压粗了嗓音低声问道。\n\n白发老散修掀了掀眼皮：“残诀不包练成，寒叶草刚采未干。合共十枚碎灵砂，若是拿凡俗银钱，非五两纹银不卖。”\n\n五两纹银足抵外山学徒大半年工钱。沈砚没有起身，只从袖里取出那只装有一钱清燥药脂的白瓷瓶递过去，又搭上白日刚领的首旬二百文足陌大钱：“老丈夜里呼吸带火音，想是常年焙药伤了肺气。我这有一钱无丹毒的清燥药脂，外山大药铺至少值四两半银子，搭上这两百文现钱，换这两样。”\n\n老散修半信半疑地拔塞嗅了嗅，又蘸了一星药脂尝在舌尖，浑浊老眼猛地一亮。这等温润无毒的润肺净脂在散修小摊上极是罕见，当即不再犹豫，一把将瓷瓶和铜钱拢进棉被里，挥手道：“拿走拿走，两清！”\n\n沈砚收起半册《青木引气篇》与三株清燥寒叶草贴身藏稳，灰房石臼暗垫里还留着整整一滴半净灵药膏，算算再熬两夜凑齐药力，开窍引气的家底便彻底齐备了。\n\n丑末时分，荒滩草市陆续熄灯散场。陈戍领着沈砚原路折返，刚顺着外山坡道摸到离百草堂不足二里的一处老槐树林拐角，走在前面的陈戍忽然右手一横，无声无息按着沈砚肩头矮身伏进了路边乱石荆棘丛里！\n\n沈砚立刻闭住呼吸，透过浓重夜雾顺着陈戍的视线往下方的车马土路望去。\n\n只见坡下停着一辆套着黑骡子的平板车，车辕旁立着一个左眼蒙着黑皮眼罩、身材魁梧的彪悍汉子，周身隐隐透出一层比陈戍略弱、却远超凡俗武夫的微弱灵气波动。而正弯着腰、吃力地将两只沉甸甸粗麻袋往骡车上搬的心腹杂役，赫然是平日里专门跟在郑福全屁股后头端茶管库房钥匙的亲信刘三！\n\n麻袋棱角坚硬，拐角磨破了一道小口，掉落在车板上的几块碎石在惨淡月色下泛着暗红如猪肝的光泽——正是百草堂账面上严禁外流的地火赤铁矿炭！"}, {"n": 7, "title": "引气开窍", "body": "老槐树林下的车轮轧过碎石，发出沉闷的吱呀声。那名左眼蒙着黑皮眼罩的彪悍汉子伸手拍了拍车板上的粗麻袋，朝刘三丢过去一小包沉甸甸的物件，随即一抖缰绳，赶着黑骡平板车没入山道浓雾之中。\n\n刘三左右张望两眼，揣紧怀里的东西，猫着腰溜回了百草堂侧门。\n\n荆棘丛后，陈戍直到骡蹄声彻底听不见了，才松开按在沈砚肩头的手掌，压低嘶哑嗓音道：“外山管事的烂泥潭，没本事前少沾边。各回各屋。”\n\n沈砚轻轻点头，半句多余的话也没问。两人一前一后错开半刻钟，踩着五更前的残霜悄无声息摸回了药庐偏院。\n\n接下来的四天里，外山药庐风平浪静。\n\n沈砚白日里照旧在灰房与烘房之间老实过秤、筛渣、记账，见了郑福全和刘三便低眉顺眼地行礼让路；一到夜深人静栓死灰房木门，他便在青砖地上踩着砖缝反复演练《敛息折苇步》，直到脚尖落处连灰尘都不惊起半分，才坐回炭盆前开炉。\n\n他严守着一天只开一炉的铁律，第九日与第十日夜里各取三斤同源一阶回气废丹渣，配足烘房省下的二两地火赤铁矿炭，凝神控温整整一炷香，稳稳添了两滴澄澈温润的净灵药膏。第十一日夜里，他没有再动炭火，只将先前多出来的那半滴净灵药膏化入温水服下，照着《青木引气篇》的吐纳路线先行温养经脉探路，随后一连停炉两宿，饮白茅汤把心神与肺气养得清亮饱满。\n\n转眼到了入庐第十三日，四更刚过，万籁俱寂。\n\n灰房最里侧被高高堆起的麻袋挡出一块三尺见方的密处。沈砚盘膝坐在蒲团上，身前矮凳摆着三样物件：左边是一只盛满墨绿冷汤的粗瓷碗，乃是那三株清燥寒叶草慢火煎出的药汁，碗沿凝着丝丝寒意；中间白瓷盒里静静躺着整整三滴饱满无杂的净灵药膏；右边则是摊开的半册《青木引气篇》。\n\n凡人躯壳想要踏入修仙界，第一道生死关便是感气开窍。寻常下等资质的学徒即便拿到法诀，单靠苦熬吐纳，往往两三年也休想磨开闭塞的灵窍；可沈砚手里这三滴净灵药膏，却是剥尽了狂暴丹毒的一阶灵药精粹。\n\n沈砚深吸一口气，不再迟疑，用竹签挑起第一滴净灵药膏送入口中。\n\n药膏入喉即化，刹那间仿佛有一团温润绵密的春水在胸腹间炸开，顺着四肢百骸汹涌流淌。沈砚立刻闭目收心，双手掐定《青木引气篇》的起手印诀，以意念引着那股滚烫药力往小腹脐下三寸的闭塞灵窍撞去！\n\n一撞之下，小腹深处宛如针扎刀刮，闷痛得他额头青筋暴起。他这具身体的灵窍天生滞涩驳杂，第一滴药膏耗去大半，那层无形障壁竟只松动了一丝缝隙，反倒激起一股郁结燥热顺着经脉往心肺倒冲。\n\n沈砚早有防备，眼皮都不曾掀开，左手端起粗瓷碗仰脖灌下两大口清燥寒叶汤。极寒草木药力如冰泉浇顶，瞬间将经脉里的虚燥火气抚得服服帖帖；紧接着，他毫不惜本，将盒中剩余的两滴净灵药膏一并吞入腹中！\n\n两股纯净磅礴的生机药力轰然合流，化作一道温厚柔韧的洪流，一次、两次、三次狠狠叩向那道松动的关口。\n\n不知过了多久，就在窗外传来第一声微弱鸡鸣、五更将交的刹那，沈砚丹田深处忽然响起一声唯有他自己能听见的轻微“啵”音！\n\n就像淤塞多年的古井骤然凿穿了泉眼，天地间游离的微薄灵气受到牵引，顺着他周身毛孔丝丝缕缕钻入经脉，在药力裹挟下走完一个完整周天，最终化作一缕发丝粗细、清凉温润的青木灵气，稳稳沉入丹田气海之中。\n\n引气入体，炼气一层！\n\n沈砚缓缓吐出一口带着灰浊腥气的长息，睁开双眼的瞬间，昏暗无光的灰房在他视野里竟变得纤毫毕现。更奇妙的是，他眉心生出一股无形的感知力，不用转头去看，两丈外墙角麻袋底下两只灰虫爬动的细碎声响便清晰映在脑海里。\n\n这便是唯有踏入炼气门槛才能修出的“神识”。虽然初入一层只能笼罩周身两丈之地，但在黑夜防人与控火把关上，已是脱胎换骨的变化。\n\n沈砚压下心头喜悦，抬起右手食指，照着《青木引气篇》末页附带的火工引火小术，调动丹田里那缕新生的灵气往指尖一逼。\n\n“嗤。”\n\n一星米粒大小、凝而不散的暗红火星在他指尖悄然跃动。炼气一层灵力微薄，这点“控火指劲”自然做不到像高阶修士那样凌空发火伤敌，但用来隔寸引燃火引药末，却比火折子快了十倍不止。\n\n趁着天色未亮，沈砚端过灰青石臼，用小铁铲将这几夜臼壁内侧积攒的一层焦赤细灰小心刮下。这是石臼萃膏后残留的燥火炉灰，火毒烈得沾肤即痛。他将炉灰与筛得极细的生铁砂按对半比例拌匀，用双层油纸严密包成巴掌大的一包，贴身藏进左袖暗袋。\n\n这包“赤砂障目散”是他专为近身保命配的阴招——铁砂压重防风，燥火炉灰蚀目破气，三尺之内迎面扬出去，任凭对方武功再高或是初通灵气的散修，双眼也得当场烧烂失明。\n\n白日里，沈砚照常收束气息，用《敛息折苇步》里的闭气法门压住周身微弱灵机，在外人眼里依旧是那个脸色偏白、手脚勤快的灰房小学徒。\n\n谁知到了傍晚申末，前院侧门外忽然传来一阵杂乱的脚步声与凄厉呻吟。\n\n沈砚正拎着空灰筐路过夹道，脚步微顿，侧目望去。只见两名内坊杂役抬着一副破竹架子匆匆进门，竹架上瘫着一个面色紫黑、瘦了一大圈的人影，正是七天前欢天喜地进内坊丹房学艺的吴大勇！\n\n此刻的吴大勇哪还有半点当日拍胸脯的壮实模样？他双臂布满燎泡焦痕，嘴角不住往外溢着暗紫血沫，喉咙里发出破风箱般的荷荷抽气声，连眼睛都睁不开。随行的内坊皂衣医工厌烦地一挥手：“这夯货受不住地火紫烟，试火第三天就烧穿了肺脉，赶紧退回他乡下老家去，别死在庐里晦气！”\n\n周围几个前几日还眼红没选上的学徒吓得面无人色，连大气都不敢喘。沈砚垂下眼帘挑筐走回偏院，心底越发冷澈——在这百草堂里，没有修为与后手，命便比草芥还贱。\n\n入夜戌时，山风骤紧，刮得灰房木窗格格作响。\n\n沈砚刚在油灯下检查完左袖暗袋里的赤砂障目散，还没来得及吹灯上炕，院外忽然传来一阵急促沉重的脚步声。\n\n“砰！”\n\n灰房木门被人从外头一把推开，冷风卷着枯叶倒灌进屋。副管事郑福全独自一人跨过门槛，平日里慢条斯理的官腔荡然无存，额角渗着虚汗，反手便将木门栓死，阴沉着一张脸快步走到木桌前，从袖中抽出一本厚厚的蓝皮账册重重拍在沈砚案头！\n\n震起的药灰在灯影下乱飞。沈砚起身退后半步，垂首拱手道：“郑副管事这么晚过来，可是账目上有何吩咐？”\n\n郑福全死死盯着他，声音压得极低，字缝里透着森森寒意：“少废话！内坊刚传下急讯，丹房周执事嫌上月送回去的废丹灰火候不对，改了年底盘账的旧例，过几日就要亲自下山突查赤铁矿炭总账！这本底账上烘房缺了三十斤赤铁矿炭，你给我睁大眼睛看清楚——三天之内，把这三十斤矿炭亏空给我严丝合缝做平进烘房损耗里！”"}, {"n": 8, "title": "暗渠埋引", "body": "油灯火苗被郑福全袖口带起的劲风吹得剧烈摇晃，将他半边阴鸷的脸映得忽明忽暗。\n\n案头那本蓝皮账册摊在中间，正是郑福全平日锁在私匣里的阴阳底账。上头清清楚楚记着外山药庐本季实领地火赤铁矿炭三百斤，而实际入烘房的只有二百七十斤，整整三十斤仙家矿炭不翼而飞。\n\n沈砚目光只在账页上扫了一眼，便明白郑福全为何慌成这样。按百草堂的铁律，克扣世俗草药顶多挨罚撤职，可私吞内坊拨付的地火赤铁矿炭导致药火失准，那是“盗卖仙家资粮”的重罪，一旦被内坊执事查实，郑福全不仅副管事的乌纱帽不保，连他在青芜宗外门的胞弟和老家亲族都得受牵连。\n\n“郑副管事……”沈砚脸上适时露出一丝初见大祸的惶恐，声音微颤地低声道，“三十斤赤铁矿炭不是小数目，寻常烘药一季火耗都有定例，这要是硬塞进损耗账里，万一内坊执事验看灰坑……”\n\n“所以我才来找你！”郑福全往前逼近一步，炼气二层外围家奴的气势沉沉压过来，随即又放缓了口气，伸手重重拍了拍沈砚单薄的肩膀，“沈砚，我平日待你不薄，免役回执给你办了，清静耳房也拨给你住了。你第一天进门拆那四筐垫底粗梗时，我就知道你是个会做账的聪明人。况且这半个月烘房炭耗单子都是经你的手过的秤——真要是查出窟窿，你觉得内坊老爷是信我这个管事，还是拿你这个经手学徒去寒铁矿坑顶罪？”\n\n威逼完了，他又从怀里摸出一锭亮晃晃的二两纹银搁在账册上，慢条斯理地补上一句：“乖乖在二十八日落前把一套干净的平账单子做出来。等过了周执事查账这一关，前院采买司秤的副手缺儿，我头一个保举你顶上，月钱给你涨一倍。”\n\n沈砚盯着那锭纹银，喉结滚动了一下，像是被寒铁矿坑四个字吓破了胆，深深弯下腰去：“副管事言重了，小的这条命都是堂里给的，哪敢不尽心？只是重排整季汤头火耗单子耗时精细，请副管事宽限小的整三天，二十八日落前，定把账面抹得平平整整。”\n\n郑福全见他服软，紧绷的嘴角这才松开一抹冷笑：“识时务就好。记住，这三天把嘴闭严实了，敢漏半个字出去，寒河县你老家那两间破医铺可经不起折腾。”\n\n说罢，郑福全连那锭二两纹银都没留下，顺手又揣回自己袖兜里，拉开木门扬长而去。\n\n直到院门落锁声远去，沈砚才慢慢直起脊梁，脸上哪还有半分惶恐怯懦？\n\n他走到桌前翻开那本蓝皮底账，眼神冷得像窗外的严霜。今天若是不答应做账，郑福全出了这个门就能按个“偷炭”的罪名把他乱棍打死在后院；可若是老老实实把假账做完交上去，以郑福全贪婪狠毒的性子，绝不可能留着一个亲手替他做过假账的活口等内坊周执事来问话！\n\n算算日子，十月小尽，二十八交账，二十九恰逢月底晦夜。按外山药庐每逢月底出城倾倒废丹灰渣的惯例，那天夜里没有半丝月光，城外乱石沟荒无人烟，再加上前几夜刘三偷偷送炭去见的那名独眼散修——郑福全十有八九会在二十九晦夜派他出城倒灰，半路杀人灭口，再把丢失矿炭的死账往死人头上一推，死无对证！\n\n“想拿我既平烂账又填命，也得看你有没有那副好牙口。”\n\n沈砚吹熄大灯，只留豆大一点灯芯，当夜便分头布下两手准备。\n\n白日里，他伏在木案前老老实实替郑福全重誊烘房清册。账面总数确实按郑福全的意思把三十斤赤铁矿炭分摊进了连阴天重炙苍术的火耗里，粗看之下天衣无缝；可沈砚却在第三页“烘房火耗折算栏”里故意留了一处极隐蔽的暗扣——他用的是夏秋潮湿鲜药的“三斤药折四两炭”比例，而非十月霜降干药的冬日定例。郑福全只盯尾数平不平，断然瞧不出破绽；可内坊专职查验药火的司秤执事只要往灰坑旁一站，一眼就能算出这三十斤矿炭根本没进过烘炉！\n\n与此同时，沈砚将自己这半个月私下记清的“实收正账底单”、每次刘三克扣矿炭时留下的短秤竹签，连同前几日他在后院侧坡用油布偷偷拓下的那道黑骡平板车独有缺口车辙印，一并用双层油布裹紧封蜡。趁着夜半无人，他撬开灰房灶台后方排烟暗渠第三块松动的青砖，将整包铁证深深塞进烟道夹壁里，再抹上湿煤灰复原如初。\n\n有了翻案铁证，还得先从二十九晦夜的杀局里活下来。\n\n接下来一连三夜，沈砚严守单日一炉的安全红线，每晚子时准点开炉一炷香，绝不多贪半分，连熬三宿稳稳萃出三滴净灵药膏，悉数用鲜白茅汁调配成两旬用量的六钱上好清燥药脂，分装在两只白瓷瓶里。\n\n每晚萃完药脂，他还将石臼内壁新凝的高纯度燥火炉灰刮下，掺入捣碎的赤铁精炭细末，一点点塞进三枚特意磨空了内芯的黄铜大钱壳里，外头用松香混细泥封死烘干，炼成了三枚沉甸甸的“火煞铜丸”。这铜丸把石臼燥火与赤铁精炭的暴烈火性死死锁在铜壳方寸之间，寻常磕碰不会炸开，唯有以他指尖那缕控火指劲透壳引燃，顷刻间便能炸开一团蚀骨焚金的赤燥火煞，正是近身阴人的绝命利器。\n\n二十八黄昏，沈砚准时将重做好的烘房清册双手呈进前院账房。\n\n郑福全逐页翻看了一遍结余总数，见那三十斤赤铁矿炭的窟窿果然被抹得干干净净，紧锁了三天的眉头彻底舒展开来，连声夸赞沈砚办事牢靠。\n\n当夜亥时，沈砚收起左袖的赤砂障目散与右袖的三枚火煞铜丸，运起《敛息折苇步》绕过巡院杂役，悄无声息摸到西墙角护院值房外的老槐树下，屈指在树干上轻叩三记。\n\n片刻后，陈戍披着黑皮袄从阴影里闪出。\n\n沈砚也不寒暄，直接从怀里取出那两只装满六钱清燥药脂的白瓷瓶递了过去：“陈护院，这是两旬用量的清燥药脂，成色比上回更纯三分，今日一并预付给你。”\n\n陈戍接过拔塞一闻，眼底闪过一抹精光，却没立刻揣进怀里，嗓音低沉道：“无功不受禄。一次掏两旬的药，你想让老夫干什么？”\n\n“不问恩怨，只按黑市规矩买一程护持。”沈砚平静道，“明日二十九月底，堂里多半会派我趁夜赶骡车去城外五里的乱石沟倒废丹灰。我怀疑路上有人想打灰车的主意，暗处多半藏着冷箭副手。请陈护院明夜提前在乱石沟侧坡盯一程，若有暗箭偷袭，替我挡下头一波冷箭、缠住旁边的帮凶十息工夫；正面来人，我自己料理。”\n\n陈戍浑浊的三角眼微微眯起，深深打量了沈砚两眼。那晚草市回来撞见刘三跟独眼散修倒炭时他就在场，哪会猜不到是谁要杀人灭口？只是他没想到，这个十六岁的医户少年竟敢把正面硬茬留给自己，只花重金请他防一手冷箭！\n\n“丑话说前头。”陈戍将两只瓷瓶收入内袋，伸出粗糙的右掌，“老夫肺伤未除，全力动刀最多撑十息。我只替你挡暗箭、拖副手，若是正面跳出炼气三层以上的高手，老夫扭头就走，绝不陪葬。护完这一程，两旬药账两清，谁也别再提今夜半个字。”\n\n“一言为定。”沈砚抬手与他重重一击掌，转身没入夜色。\n\n次日二十九，月底无月之晦夜，入夜后山雾浓得伸手不见五指。\n\n戌末时分，后院灰房外套好了那辆装满十麻袋废丹灰渣和半篓赤铁余炭的老骡车。平日里本该跟着一块押车推坡的两个粗使杂役，傍晚突然被前院管事派去十里外的庄子收柴草了，诺大一个侧门空地上，只剩沈砚一人握着鞭杆。\n\n院角昏黄风灯晃动，郑福全披着厚棉氅亲自走到侧门边，替沈砚提着灯笼照亮车辙，笑眯眯地伸手拍了拍冰冷的灰车木辕：“沈砚呐，月底灰多，幸亏有你勤快肯担待。城外山路雾大，早去早回，等倒完了这车废灰回来，我让伙房给你留一碗热腾腾的羊杂汤驱寒。”\n\n沈砚躬身道谢，拉紧粗布衣领迈步上车。余光掠过灯笼阴影，只见郑福全含笑站在门洞下目送骡车驶入浓雾，那双半眯的眼睛里没有半点暖意，冷冰冰的就像在看一具已经咽了气的死尸。"}, {"n": 9, "title": "乱石焚煞", "body": "老青骡拉着沉重的双轮灰车，深一脚浅一脚地碾过外山冻硬的碎石土路，车轴发出单调刺耳的“嘎吱”声。\n\n越往山下走，晦夜的寒雾越是浓重，三丈之外便只剩一片灰蒙蒙的白障，连路边歪斜的界碑都瞧不真切。\n\n沈砚蜷缩着肩背坐在车辕前端，手里松松垮垮握着麻绳缰绳，乍看之下与一个在寒风里冻得瑟瑟发抖的凡俗小学徒毫无二致；实则他丹田内那缕青木灵气早已悄然流转，两丈方圆的神识如水波般铺在车身四周，左袖指尖扣着赤砂障目散，右袖暗槽里三枚火煞铜丸一字排开。\n\n亥时初刻，骡车拐过一道陡弯，驶入了药庐五里外的城外乱石沟。\n\n这里是两座荒山夹出的一道狭窄干沟，最窄处不过两丈来宽，两侧全是犬牙交错的风化怪石与半枯马尾松，沟底堆着历年倾倒掩埋的灰渣土坑。\n\n车轮刚轧进窄谷中段，引气开窍后耳力敏锐的沈砚耳廓微动，清晰捕捉到左后方三丈外一株枯松背阴处传来的极轻微牛筋弓弦绷紧声，顺风卷来的寒雾里还夹着一丝刀口舔血之徒特有的铁锈汗腥；与此同时，正前方不足两丈的乱石拐角刚滑入神识边缘，一团浑厚燥烈的灵气波动已毫不掩饰地锁死了去路！\n\n果然是一明一暗两个人。\n\n沈砚呼吸节奏半点没乱，依旧微弓着背去拉手刹木棍，故意将大半个后心卖给了左后方的枯松林。\n\n“嘣！”\n\n弓弦震响撕裂夜雾，一支涂满幽蓝腥毒的精铁冷矢如毒蛇吐信，刚一射入车身两丈神识圈内便被沈砚分毫毕现地锁住轨迹，贴着怪石阴影直钉他后心要害！\n\n几乎就在铁矢逼近车尾的同一刹那，乱石沟左侧碎石坡上仿佛有一截枯苇随风折断——早已潜伏多时的陈戍将《敛息折苇步》催至极致，黑袄身影鬼魅般横掠两丈，腰间窄刃长刀带起一抹森白寒芒，精准无比地斜撩在铁矢中段！\n\n“铛！”\n\n火星四溅，淬毒铁矢被一刀劈偏三尺，擦着沈砚肩头狠狠钉进灰车厚木板里，箭尾嗡嗡乱颤。\n\n“什么人？！”枯松后的灰衣弓手骇然失色，刚想弃弓拔刀，陈戍却半个字废话没有，借着前冲之势一跃扑入松林阴影，窄刃长刀如狂风骤雨般劈头盖脸封死了弓手所有退路，刀光碰撞声瞬间响成一片！\n\n“哼，难怪敢一个人出山，原来花钱雇了个伤肺的老刀客！”\n\n正前方乱石后传出一声狞笑，一道铁塔般魁梧的身影大步跨出浓雾，稳稳堵在骡车正前方。来人左眼蒙着黑皮眼罩，仅剩的一只右眼凶光毕露，赫然正是数日前夜里在槐树坡下跟刘三交割私炭的那名独眼匪修！\n\n受惊的老青骡嘶鸣一声，前蹄高高扬起停在原地。\n\n独眼匪修往左侧松林瞥了一眼，听出陈戍呼吸间带着旧伤闷音，根本不急着去救同伙，反倒冷笑着一拍腰间，周身腾起一层寸许厚、昏黄泛红的护体灵光。这便是炼气二层修士凝练出的灵力护罩，寻常凡铁刀箭砍在上面连油皮都破不开。\n\n在他眼里，只要十息之内拧断眼前这个凡俗小学徒的脖子，再去联手宰了那个强弩之末的老护院，郑福全许诺的那二十枚碎灵砂和整袋矿炭便唾手可得！\n\n“小子，要怪就怪你算账算得太精，挡了郑管事的财路！”\n\n独眼匪修大步流星逼近车前。车辕上的沈砚像是被他身上那层昏黄灵光吓破了魂，“啊”地低呼一声，手脚慌乱地往后一缩，脚底踩滑车辕霜花，整个人狼狈不堪地翻滚跌落在冰冷碎石地上，抱着右脚踝瑟瑟后退。\n\n“没用的软骨头，还害老子半夜吹冷风！”\n\n独眼匪修眼底最后一丝戒备荡然无存，连腰间鬼头刀都懒得拔，迈开大步直接跨进沈砚身前三尺之内，蒲扇般的大手裹着昏黄灵光，居高临下便朝沈砚咽喉抓落！\n\n三尺死地，到了。\n\n原本蜷在碎石地上的沈砚猛地抬起头，那双漆黑眼眸里哪有半点惊恐？左腕贴地闪电般往上一抖，整包油纸破裂，混着燥火炉灰与细密铁砂的赤砂障目散化作一蓬暗红毒雾，贴着三尺不到的距离直扑独眼匪修面门！\n\n“找死——啊！！”\n\n独眼匪修下意识催厚胸前护体灵光，却忘了低阶修士口鼻眼窍仍需视物换气。滚烫霸道的燥火炉灰裹着锋利铁砂迎面钻进他仅剩的那只右眼，只听“嗤啦”一声焦响，眼珠表面瞬间被火毒蚀出一层白翳，钻心刺骨的剧痛令他惨嚎一声，抓向沈砚的大手本能地缩回去死死捂住血肉模糊的眼眶！\n\n气机一乱，他周身那层昏黄护体灵光顿时剧烈明灭、薄如蝉翼。\n\n沈砚半息也未耽搁，甚至不等起身，右手食中二指在袖底一扣一弹，两枚早已蓄势待发的火煞铜丸成品字形直射独眼匪修心口；紧随其后，他丹田青木灵气倾数涌向指尖，一缕炽热控火指劲隔空点破铜丸泥封！\n\n“轰！轰！”\n\n两团压缩到极致的赤燥火煞在方寸之间轰然连环炸裂！\n\n狂暴的火浪裹挟着碎裂铜片与赤铁精炭火雨，摧枯拉朽般撕碎了那层摇摇欲坠的护体灵光，正面轰进独眼匪修前胸！这名炼气二层的凶悍匪修连第二声惨叫都没能喊出口，胸膛便被炸开一个焦黑透亮的血窟窿，庞大身躯直挺挺仰面砸在乱石堆上，抽搐两下便彻底断了气。\n\n松林坡上正与陈戍死斗的灰衣弓手被这惊天动地的火光吓得魂飞魄散，动作一滞，当场被陈戍抓住破绽，窄刃长刀如毒蛇般抹过咽喉，捂着喷血的脖子栽倒在地。\n\n前后不过八息工夫，乱石沟重归死寂，只余浓雾里弥漫的焦糊血腥气。\n\n陈戍拄刀从斜坡上跃下，剧烈起伏的胸口压着一声低咳。当他看清地上胸膛被炸穿、连护体灵光都碎得一干二净的独眼匪修尸首，再看向正拍打衣摆碎石站起身、神色冷静得可怕的沈砚时，那双见惯生死的三角眼也不由得狠狠跳了一下。\n\n“陈护院好刀法，多谢挡下那一箭。”沈砚拱了拱手，没有解释半句铜丸来历，蹲下身利落地在独眼匪修尚未烧尽的皮袄内袋里摸索起来。\n\n很快，他摸出一只油腻的小鹿皮袋和半块拇指大小、印着“郑氏私记”暗纹的硬泥块。打开鹿皮袋一看，里头装着十七粒米粒大小、泛着淡淡莹白灵光的晶体碎屑——这便是底层散修日常交易最通用的“碎灵砂”，是从下品灵石边角敲碎下来的灵矿砂，攒够一百枚碎灵砂才能兑一块完整的下品灵石。而那半块硬泥块，正是郑福全锁私库麻袋专用的封泥，上头还沾着几星赤铁矿炭红灰！\n\n沈砚不动声色地将十七枚碎灵砂和私库封泥贴身收好，又搜出灰衣弓手身上几两散碎银子抛给陈戍：“战场脏乱，这几两银子请护院买酒压寒。”\n\n陈戍接过碎银，深深看了这个杀伐果决、连眼皮都不眨一下的少年一眼，沙哑道：“后生可畏。今夜这程买卖两清了，回庐之后你走你的阳关道，老夫睡老夫的值房。”说罢，他不等肺经燥气翻涌，转身几个起落便顺着山脊小路先行离去。\n\n沈砚摸了摸右袖暗槽里剩下的最后一枚火煞铜丸，独自将两具尸骸连同那支淬毒铁矢拖进沟底深坑，把车上十麻袋废丹灰渣与半篓赤铁余炭尽数倾倒覆盖上去，指尖弹出一点控火火星引燃矿炭。\n\n地火赤铁矿炭火力奇猛，不过两刻钟便将尸骨血迹烧成了一坑分不出彼此的焦黑枯灰。沈砚铲起冻土碎石将灰坑填平踩实，又拾起一块尖利山石，对着自己左小臂粗布衣袖狠狠划开一道口子，擦出些许逼真的皮肉血痕，这才调转骡头，赶着空荡荡的灰车往回走。\n\n山风渐歇，五更天色将明未明。\n\n寅末时分，老青骡喷着白气走到百草堂外山药庐山脚下。沈砚抬头望去，拉缰绳的手指微微一顿——只见高高的百草堂正门石阶前，不知何时竟并排停着两匹神骏异常的青骢快马，马鞍两侧悬挂着四盏唯有云泽内坊周氏执事出行才配点亮的青铜兽首风灯！"}, {"n": 10, "title": "司秤夺印", "body": "十一月初一卯初，微光刺破山雾，将百草堂正门前那四盏青铜兽首风灯照得泛出一层冷幽幽的青绿。\n\n沈砚牵着空荡荡的老青骡车刚转过石阶拐角，两名按着窄剑、身穿玄灰劲装的内坊随从便横跨一步拦在门前，冰冷的目光上下扫过他染血的粗布短褐与身后空车：“外山赶灰车的杂役？前院正堂候审，车丢这儿，人进去！”\n\n沈砚低眉顺眼地应了一声，松开麻绳缰绳，左手捂着小臂那道擦破渗血的裂口，垂首迈过门槛。\n\n平日里清晨嘈杂的前院此刻静得落针可闻。烘房、药柜与伙房的十几名杂役学徒全被赶在东西两侧廊檐下，人人缩着脖子大气不敢喘；西廊柱后的阴影里，老护院陈戍裹着旧皮袄靠墙而立，眼皮半垂似没睡醒，连眼角余光都未往沈砚身上扫去半分。\n\n正堂大门洞开，一股沉凝厚重的灵气威压如无形山石般笼罩着整座院落，压得台阶下的凡俗杂役胸口发闷。\n\n主位太师椅上端坐着一名三十许岁、面容冷峻的玄青道袍中年修士，正是云泽内坊丹房执事周明远。他脚边搁着一只敞盖的抽检木匣，里头盛着上月外山送回内坊的焦黑废丹渣，炼气五层修士的森然气机随着他指节轻叩扶手的声响一丝丝外溢。\n\n堂下右侧站着副管事郑福全与心腹刘三。郑福全额头原本布满细密冷汗，一抬头瞥见本该死在乱石沟的沈砚竟活着跨进院门，瞳孔骤然缩成针尖大小，脸上肌肉狠狠抽搐了一下！\n\n电光石火间，郑福全不等沈砚站稳，猛地抢先跨下两级石阶，伸手直指沈砚鼻子厉声喝道：“好你个吃里扒外的贼子，居然还敢回来！周执事明察，堂里库房短少的那三十斤地火赤铁矿炭，定是这管灰房的沈砚监守自盗，趁昨夜月底出城掩埋废渣之机偷运出去卖给了山外野修！刘三，还不快把这盗卖仙家资粮的畜生捆起来堵上嘴！”\n\n阶下的刘三如梦初醒，抓起一根麻绳便恶狠狠朝沈砚扑来。\n\n沈砚脚下顺势往旁一滑避开刘三的扑抓，扑通一声跪倒在正堂石阶正中，高声喊道：“周执事容禀！小的昨夜奉郑副管事之命独自赶车出山倒灰，走到五里外乱石沟窄谷，突遭两名蒙面匪徒放毒箭劫杀！小的拼死割开麻袋倾灰阻路，被受惊老骡拖行了数十丈才捡回半条残命，车上从头到尾只有十袋废灰与半篓烧剩的余炭，何曾见过半块整炭？！”\n\n“一派胡言！”郑福全脸色铁青，转身从桌上捧起那本蓝皮《烘房清册》呈向主位，嗓音拔高了几分，“周执事，这半个月烘房炭耗与灰房清筛皆由这小子一人经手过秤！方才执事盘点炭库少了整整三十斤赤铁矿炭，除了他趁夜盗运出山，外山谁还能神不知鬼不觉弄走这么多矿炭？”\n\n主位上的周明远眼皮微抬，冷电般的目光掠过郑福全急促起伏的胸口，又落在阶下少年染血的袖口上，淡淡吐出两个字：“退下。”\n\n前冲半步的刘三只觉一股寒气迎面撞在胸口，蹬蹬连退三步跌坐在地，半句屁话也不敢再放。\n\n“你说矿炭不是你偷的，可有凭据？”周明远声音不高，却字字压在人耳膜上，“仙家资粮短缺三十斤，拿空话搪塞本执事，舌头先给你拔了。”\n\n沈砚将丹田内初成的那缕微末灵气按闭气法门死死敛在脏腑最深处，额头触地，语速清晰而镇定：“回周执事，那三十斤赤铁矿炭早在半月前入库时便已被郑副管事私下截留！五日前夜里，郑副管事得知执事要提前下山查账，闯入灰房拿寒河县老家亲族性命威逼小的重做假账平窟窿。小的手无寸铁不敢当面抗命，只能在重誊的那本蓝皮清册第三页‘烘房火耗折算栏’留了一道暗扣——十月霜降入炉的皆是干透药材，清册上却故意按夏秋湿药‘三斤药折四两炭’虚报火耗！执事只需一验清册第三页，再查后院烘房灰坑实灰，便知那三十斤赤铁矿炭根本不曾进过烘炉！”\n\n郑福全脑子里“嗡”的一声炸响，低头死死盯住手里的蓝皮清册。他做账那日只顾着核对结余尾数平不平，哪曾细算冬夏干湿药材的折炭定例？！\n\n周明远根本不待郑福全翻页，右袖轻轻一拂，一股柔和却不可抗拒的灵力卷过，那本蓝皮清册已凭空摄入他掌中。\n\n翻开第三页只扫了两眼，周明远眉宇间便罩上一层寒霜。他起身走下正堂，径直穿过月亮门来到后院烘药房灰坑前，也不用凡俗木尺丈量，屈指从坑底隔空摄起一撮暗红矿灰，指尖“嗤”地燃起一簇寸许高、炽白纯粹的丹火。\n\n矿灰在丹火炙烤下发出细微爆鸣，眨眼间浮灰尽散，只在周明远指尖凝成黄豆大小一点暗沉铁渣。\n\n“三百斤地火赤铁矿炭若真在炉里烧透，坑底沉积的赤铁火髓至少该有拳头大一块。”周明远弹指震碎铁渣，转头冷冷盯住跟在身后的郑福全，“这里满打满算只烧了二百七十斤炭。郑福全，剩下的三十斤矿炭去哪了？”\n\n郑福全双腿一软瘫跪在青砖地上，汗如雨下，却还死咬牙关磕头哭喊：“冤枉啊周执事！小的平日都在前院理事，定是沈砚这奸猾小贼每天偷藏几斤……”\n\n“小的早知郑副管事做平假账后必会杀人灭口，故而将真账与实证藏在了灰房暗处，请周执事移步一观！”\n\n沈砚不再给郑福全攀咬的机会，起身快步引着众人走入西侧灰房，当众绕到冷灶后方的排烟暗渠前，伸手抠开第三块抹着湿煤灰的松动青砖，从烟道夹壁里取出一只双层油布蜡封的扁包双手呈上。\n\n周明远挥袖震开封蜡。油布包里，整整齐齐码着沈砚半月来逐日记录的“实收正账底单”、十几根刘三每次克扣斤两留下的短秤竹签，以及一张清晰拓着缺口车轮印的油布！\n\n不等郑福全面如死灰地开口，沈砚又从怀里摸出那半块沾着赤铁矿炭红灰与焦痕、印有“郑氏私记”暗纹的硬封泥，高举过顶：“回执事，昨夜乱石沟那名独眼匪徒扑上车辕掐小的脖子时，小的拼命抓扯，从他皮袄内袋撕下了这半块封泥！这上头既是郑副管事私库的独门印记，又染着赤铁矿炭新灰，后坡车辙印更与刘三夜间私会外人的黑骡车分毫不差！”\n\n“不关小的事啊！全是郑副管事逼小的干的！”\n\n跟在门口的亲信刘三见车辙印与私库封泥全摆在了眼前，再被周明远炼气五层的滔天灵压当头一压，心理防线彻底崩塌，涕泪横流地连连磕头招供，“是郑副管事！他为凑青芜宗外门胞弟的供奉，命小的分三次把三十斤赤铁矿炭倒卖给外山独眼散修换碎灵砂！昨夜调走随车杂役、给独眼散修报信在乱石沟截杀沈砚灭口，也全是郑副管事亲口吩咐的！”\n\n满院死寂，连廊下吹过的寒风都似停了一瞬。\n\n“好，好得很。”周明远怒极反笑，眼中杀机暴涨，“内坊上月退回的几炉药渣火气浮滑失准，丹师老爷还道是外山药材受潮，原来是你这吃里扒外的家奴私盗地火矿炭、暗减烘房火力，坏了内坊的大事！”\n\n“周执事饶命！看在小的替周家当牛做马十几年、胞弟又在青芜宗外门的份上……”\n\n郑福全魂飞魄散地膝行上前想去抱周明远靴筒。周明远眼神厌恶，连衣角都没让他碰到，右手并指如剑，隔空一指疾点在郑福全小腹气海穴上！\n\n“噗！”\n\n一声闷响，郑福全苦熬半生才修出的炼气二层灵力气旋如漏气皮囊般当场溃散锁死，整个人喷出一口鲜血，委顿在地如死狗般抽搐起来。\n\n“废去郑福全副管事职司，连同刘三一并锁回内坊黑牢，严审私炭买主与历年旧账！”周明远冷冷下令。两名内坊随从立刻上前，抖开沉重的乌铁锁脉链将两人死死穿琵琶骨捆紧，像拖死猪一样往院外拖去。\n\n被拖过灰房门槛时，满嘴血沫的郑福全猛地扭过头，那双充血凸出的眼珠死死钉在沈砚身上，发出野兽般的嘶哑毒咒：“沈砚……你个小杂种别得意！我胞弟郑福海在青芜宗外门当差，他早晚下山剥你的皮、抽你的筋，把你寒河县全家挫骨扬灰——！”\n\n“聒噪！”随从反手一记铁剑柄狠狠砸在他下巴上，卸掉关节拖出了大门。\n\n沈砚垂手站在原地，迎着那道怨毒目光，眼底深处古井无波。一个失势被废的家奴不足虑，青芜宗外门的郑福海也罢，暗处的匪修同党也罢，总归要先活过眼前，才有资格一桩桩清算。\n\n院内很快恢复了安静。周明远转过身，目光重新落回面前这个脸色微白、左臂渗血的十六岁少年身上：“伸出手来。”\n\n沈砚依言恭敬伸出右腕。周明远微凉的两根手指搭上他寸关尺，一缕精纯灵力探入经脉转了半圈。在《敛息折苇步》的收敛法门遮掩下，沈砚体内只透出一丝微弱晦涩、仿佛刚在药气熏蒸下侥幸感应到天地灵气的杂灵窍气感，连半分攻击性灵力都凝聚不起。\n\n周明远收回手指，神色间最后一丝戒心随之散去，微微颔首道：“气感虽驳杂微末，难成大器，但胜在识字通药理，盘账精细又懂规矩。外山药庐不可一日无管秤之人，从今日起，销去你的试药杂役贱籍，擢升你为本庐‘采买司秤’。”\n\n说话间，他屈指一弹，方才从郑福全腰囊搜出的那枚黄铜司秤方印稳稳落入沈砚怀中。\n\n廊下众杂役齐刷刷倒吸一口凉气，看向沈砚的眼神瞬间从同情变成了敬畏。在百草堂外山药庐，采买司秤虽居正管事之下，却是实打实掌管钱粮出入的半个主事执事——一旦接了这枚铜印，不仅彻底脱去了随时会被拉去喝猛药、充当内坊炉童的杂役死籍，每月例钱更是从六百文直接翻倍涨至一两二钱纹银，全庐药材矿炭过秤入库以及赴散修坊市采办资粮的实权尽归其手！\n\n沈砚双手捧稳沉甸甸的黄铜方印，深深揖礼：“谢周执事提拔，小的定当尽心竭力，绝不教药炭账目再出半点纰漏。”\n\n周明远未在外山药庐多留，拂袖走出正门，翻身跨上石阶前那匹神骏青骢快马。\n\n临扯动缰绳前，这位内坊丹房执事居高临下俯视着阶下的新任少年司秤，随手从袖囊里抛下两样物件——一块刻着细密云水禁纹的青铜腰牌，外加一纸火漆折封的素白密单。\n\n“持这块百草堂通行铜牌，你便可进出三十里外的云泽散修坊市。”周明远声音冷淡如冰，听不出半分温度，“密单上写着三味专压‘紫煞火毒’的偏门寒草，内坊丹师老爷急等着用。给你十日工夫，本月初十日落前亲赴坊市采齐送到内坊山口交割——少了一株，或是走漏半个字的风声，郑福全的下场你刚瞧见过。”\n\n马鞭破空一响，两骑青骢快马踏碎山脚晨雾，顺着盘山石道绝尘而去。\n\n沈砚独自站在百草堂高高的青石门阶上，晨风吹动他染血的粗布旧衣。他左手握紧那枚温凉厚重的采买司秤铜印，右手低头轻轻捻开密单火漆一角——纸页间隐隐渗出的一缕阴冷腥甜药气，竟与后院那只黄铜锁生铁桶里漏出的暗紫金星废渣一般无二。"}]}, {"id": "male_shitu", "badgeClass": "amber", "tag": "男频 · 师徒反差仙侠", "title": "让你戴罪掌灯，你拿本座结同命契？", "logline": "截天剑宗司律晏怀瑾惊觉自己与宗门三年内将沦为仙朝钦天监少监赵景曜收割气运的祭品，为破体内折剑死劫与灭宗危局，他在拆穿堂内装盲掌灯质女越流萤偷引自己精血结下古巫同命契的当夜非但未杀她，反而按剑挡回钦天监缇骑将这名未来南荒祸首扣在身边，联手钻透仙朝气运金册的规则漏洞，一路花式截胡特权天骄命债、掀翻仙朝窃运棋局。", "outlineUrl": "files/male_shitu_outline_1_100.txt", "outlineFileName": "《让你戴罪掌灯，你拿本座结同命契？》_第1-100章大纲.txt", "proseUrl": "files/male_shitu_chapters_1_10.txt", "proseFileName": "《让你戴罪掌灯，你拿本座结同命契？》_第1-10章正文.txt", "outlines": [{"n": 1, "title": "雪夜掌灯，血契初现", "synopsis": "苍梧山寒鸦崖风雪子夜，截天剑宗镇契堂司律主事晏怀瑾核验宗门罚没死契时，金丹内三道「折剑枯荣劫」裂痕剧痛发作，三年寿元大限压顶。识海祖传青铜竹简《春秋勘误录》渗血苏醒，史官红字揭破两桩灭顶死劫：三年内钦天监少监赵景曜将把截天剑宗当作气运坏账满门清盘；而西侧耳房双目覆白纱、每夜温顺进堂添油剪蕊的戴罪掌灯质女越流萤，正借青铜兽首长明灯芯暗引他逸散的剑骨精血凝结南荒「同命血蛊契」。杀她则巫火倒灌震碎金丹，放任则命脉受制。恰逢越流萤摸索入堂添油，晏怀瑾不动声色算准距离，在她指尖触及灯芯刹那反手扣死她腕脉，瞥见她虎口旧疤似曾相识，单手拧开滚烫灯座搜出凝血巫玉，落印封死堂门夜审。"}, {"n": 2, "title": "苦肉求钉，缇骑叩门", "synopsis": "镇契堂重门紧锁，晏怀瑾将血纹巫玉拍在案头审讯，试出同命血蛊契百丈心脉感应、他死则她焚心陪葬且强斩必致神魂撕裂七成的铁律。越流萤覆着白纱怯生生跪地，自称怕被逐出寒鸦崖冻毙才偷学粗浅护身血契，见契理瞒不过，非但不逃，反而算准晏怀瑾恪守门规不虐盲女，主动撩起单薄衣袖跪请镇契堂三枚「碎骨钉」求留堂赎罪。晏怀瑾一眼看破她以伤换留的把戏，未下刑钉，冷声拟定留堂监管查清解契之法的章程。话音未落，山门警钟急鸣，钦天监缇骑校尉卢铮连夜登崖索人。晏怀瑾隔门审视敕令，耗尽仅余的1滴勘误墨气显影批注：一旦交人验出巫血，剑宗即刻坐实通巫罪名遭封山清盘，且敕令龙气底纹暗藏一处古怪的巫祝断笔缺口。"}, {"n": 3, "title": "按剑镇堂，药奴归宗", "synopsis": "卢铮仗着仙朝钦天监威势踹开外院木栅，随行外门执事慑于通巫罪名欲劝晏怀瑾交人息事。耳房内的越流萤摸出袖底巫火银簪抵住心口，准备自绝气脉免连累晏怀瑾被冠罪名；晏怀瑾瞬间由同命血契感应到她心脉死意，提残剑「惊蛰」大步跨出堂门，拇指按开剑格半寸以金丹后期剑意震退缇骑半步。他当众亮出刚摁下朱砂主印的药奴身契，援引镇契堂第三律宣布越流萤乃本座亲签试剑药奴、内鬼死契未结前归剑宗全权处置，并三言两语点破卢铮所持「协查荒州逃巫令」缺掌教副署不得越界提审的程序硬伤。卢铮忌惮他十息夺命剑威不敢强抢，甩下十日内赴荒州坠龙墟核查剑宗废矿死契的公文离去。逆改死劫令竹简入账2滴墨气，荒州同行之局正式锁定。"}, {"n": 4, "title": "私死违律，师兄讹茶", "synopsis": "堂外风雪渐歇，晏怀瑾推门入耳房，精准扣住越流萤藏簪的右手抽走巫火银簪，冷声训诫试剑药奴性命属镇契堂资产、未奉钧令擅自寻死按叛宗论处，随手抛下一瓶止血金疮药。越流萤低眉顺眼称是，待他转身却把腕间药奴红绳死死缠紧三圈。翌日清晨，代掌教大师兄孟观澜端着豁口粗陶茶盏踱进镇契堂，先叹宗门账面只剩八十中品灵石、耗子都含泪搬家，旋即得意掏出五十中品灵石塞给晏怀瑾——原是他天没亮便捧着三百年前古盟约堵住下山的卢铮，硬拿昨夜缇骑踩裂的一块山门石讹出修缮茶水费。孟观澜收起笑意塞给他一枚「苍梧残剑令」，嘱咐荒州水深，真遇化神老狗越界便捏碎令牌，天塌下来师兄先拿账本顶着。"}, {"n": 5, "title": "师姐塞镜，古驿腥风", "synopsis": "守藏阁浓烟滚滚，灰头土脸的三师姐公孙妙拎着刚出炉的奇门阵盘拦住下山路，一边促狭打量乖巧福身行礼的越流萤，打趣铁面司律竟也有贴身带人办差的一天，一边用紫金焊液替残缺的本命剑「惊蛰」加固剑格护手。公孙妙强行往晏怀瑾乾坤袋里塞进一面拿废铜烂铁拼成的「照胆真言镜阵盘」，拍胸脯保证封灵绝境下专克高阶修士护体灵光，却在晏怀瑾追问阵法代价时眼神乱飘、借口炉上还炖着铁汁溜之大吉。晏怀瑾按例核清行囊灵石，携越流萤踏出苍梧山护山云海，沿官道进入荒州地界。黄昏行至樟树古驿投宿，越流萤凭封目后敏锐数倍的气血灵觉，第一时间嗅出驿馆暗藏杀机。"}, {"n": 6, "title": "十息截脉，煞火攻心", "synopsis": "子夜寒雾锁死樟树驿，三名受南荒叛巫乌骨部派遣、并与钦天监外围巡狩线人暗通款曲的黑巫死士启动「蚀影引煞阵」，毒雾封院直扑越流萤，企图强抽她心头巫血验明遗族王脉。阵中阴煞与越流萤气血剧烈冲撞，瞬间引燃她极力压制的体内隐患，一股霸道酷烈的巫煞顺着同命血蛊契倒灌，刺得晏怀瑾金丹折剑裂痕铮然作响！晏怀瑾心默算十息动武红线，拔出惊蛰剑迎风暴起，以镇契堂断案眼力锁定邪阵三处气机节点，连出「截脉三式」截断黑巫经脉枢纽。赶在第九息半收剑回气，他避开了十息折寿大忌将敌首生擒，不料转身便见越流萤蜷缩廊下，腕脉滚烫如烙铁，煞气已濒临失控。"}, {"n": 7, "title": "百日煞限，欠契锁人", "synopsis": "晏怀瑾先渡入精纯金丹剑气强行替越流萤封住腕间三处暴走煞穴，忍着经脉微颤提审黑巫活口，并耗费1滴勘误墨气（余1滴）核验竹简批注，彻底揭开真相：越流萤实为南荒九黎古巫遗落人间的「少司命」，当年部族支脉遭钦天监与叛巫合谋覆灭，她靠自封双目掩盖天机才躲过金册搜魂，但体内「九黎煞脉」仅剩九十九日锁期——百日内若无荒州坠龙墟即将出世的「地肺阴火髓」洗练煞锁，必将焚脉爆体并顺同命血契炸碎晏怀瑾的金丹，而阴火髓恰好也能修补惊蛰残锋。越流萤苍白垂眸请他趁早斩契弃车，晏怀瑾却面无表情按住她手指在欠契上画押，宣称治她煞脉的一千五百中品灵石全数记入镇契堂药奴账册，一文钱都别想赖掉。"}, {"n": 8, "title": "罚抄戒律，朱砂作聘", "synopsis": "避开官道耳目改走山林栈道赶往坠龙墟途中，越流萤每逢入夜便因九黎心火躁动而呼吸滚烫、屡屡借摸索探路贴近晏怀瑾剑气纳凉。素来端肃重规矩的晏司律认定此乃古巫心性失调之兆，当晚架起小药炉熬出苦得发指的寒莲镇魂汤盯着她一饮而尽，又搬出镇契堂训诫章程，罚「眼盲不能写字」的越流萤逐句背诵《清心寡欲戒律百篇》，由他亲自执朱砂笔立卷记录存档。晏怀瑾在卷尾郑重写下两行铁画银钩的朱砂批语并盖上私印：「晏怀瑾亲勘：命契相连，朝夕监管，未得本座钧旨不得擅离半步。」越流萤乖巧捧卷谢罚，一转头却因这句正中南荒古巫「朱砂锁名订终身」的誓词而耳根绯红，悄悄将其当作婚书贴身藏妥。"}, {"n": 9, "title": "金册锁血，墨竭竹封", "synopsis": "两人抵临坠龙墟门户赤砂镇，却见原属截天剑宗的赤砂旧矿已被钦天监荒州巡狩行走贺兰枭率重兵铁桶封锁。贺兰枭乃少监赵景曜麾下签订「气运子母贷契」的七大金丹巅峰行走之一，正高踞望楼督办采集地肺阴火髓，麾下校尉卢铮则在山口强逼各路散修签高利奉天灵契贷充当探路炮灰，并张贴海捕文书严查截天剑宗司律踪迹。晏怀瑾在茶棚暗察矿口阵势，识海《春秋勘误录》受百丈外贺兰枭怀中《奉天承运金册》赤金副页刺激骤然发烫，耗尽最后1滴勘误墨气显出警告：金册子契宿主受仙朝皇道龙气锁血庇护，外人对其动致死杀招必引九天紫微龙气百倍反震！血字未消，大气运余波冲撞之下，墨竭的竹简当场闭合陷入休眠。"}, {"n": 10, "title": "盲女嗅契，换壳入墟", "synopsis": "识海竹简彻底沉寂，失去先知批注的晏怀瑾迅速冷静复盘：正门强闯必陷重围，十日期限与煞脉倒计时更等不起退避。他假意携越流萤退入镇尾偏巷，引出两名尾随盯梢的钦天监外围耳目，三招之内封喉制穴未露半点剑宗路数。巷中搜出两块散修盟应募勘脉腰牌与一份钦天监「入墟采买副契」，越流萤隔着白纱轻嗅契纸朱砂，凭古巫对命契气机的天生敏感，精准指出贺兰枭因地底火煞异动已折损三批探矿人，此刻正急募懂辨阴火走向的散修药师探路。晏怀瑾当机立断毁去耳目踪迹，收敛金丹锋芒扮作寒门病弱剑修，携装盲辨脉的越流萤持腰牌混入应募队伍，顺利穿过矿口龙气盘查大阵踏入坠龙墟核心裂谷。"}, {"n": 11, "title": "旧矿拓印，虎口露痕", "synopsis": "竹简休眠第二日，面对卢铮指派试探毒瘴的刁难，越流萤不慌不忙捻起一撮赤砂嗅闻，精准报出三丈外暗火喷发时辰，数息后火柱果真冲霄而起，震得卢铮将信将疑留两人带路。深入外层废矿坑道途中，晏怀瑾发现贺兰枭竟拿签了高利灵契贷的违约散修喂养地火兽以催熟阴火髓；他压住怒火借勘查岩壁之机，在坍塌旧坑深处寻获截天剑宗初代立矿时打入地脉的「镇脉母契铜桩」，不动声色拓下完整古篆母印藏入怀中。越流萤同步感应到贺兰枭重兵把守的主坑实为偏脉，真正的千年地肺阴火髓正孕育于西侧断崖熔岩台。然而晏怀瑾侧身护越流萤避开落石时，右手虎口独特的剑宗司律剑茧落入卢铮眼底，杀机立起。"}, {"n": 12, "title": "试剑遭震，金章护命", "synopsis": "火煞栈道两头铁闸轰然落锁，钦天监巡狩行走贺兰枭持《奉天承运金册》赤金副页踏火而来，居高临下抛出一纸屈辱转让契，逼晏怀瑾签字献出苍梧山外围矿脉并交出越流萤验明巫身。退路尽断且竹简沉寂，晏怀瑾果断抢先发难，默数刻度催动金丹后期剑意，惊蛰剑化作寒电施出杀招「截脉断流」直取贺兰枭咽喉！剑锋先扫碎贺兰枭腰间私佩灵玉毫无异状，可距其咽喉三寸刹那，贺兰枭怀中金册副页轰然腾起九天紫微龙气，判定外人施加致命攻击，百倍反震之力顺剑身狂涌而回！惊蛰剑尖崩开一道新缺口，晏怀瑾胸口如遭重锤闷哼吐血，右臂经脉剧痛失温，却在生死电光石火间死死记住了私玉碎而无雷、刺喉方引反震的规则差异。"}, {"n": 13, "title": "燃火断桥，煞期折十", "synopsis": "晏怀瑾受皇道龙气反震右臂痉挛难提重剑，贺兰枭借金册气运加持一刀劈碎栈道护栏直取他天灵盖。千钧一发之际，烟尘中的越流萤眸光骤寒，背着晏怀瑾视线强行冲开第一重封目巫印一角，指尖逼出心头精血逆燃幽紫「九黎本命巫火」，化作诡谲火鸦迎刀撞上！古巫原初咒力与金册气运同源相克，幽紫巫火竟硬生生蚀穿贺兰枭刀罡、烧焦其半幅官袍而未引来半点紫微天雷！贺兰枭惊骇暴退，越流萤却因强动本源遭九黎煞脉凶猛反扑，原本九十九日的锁期当场折损十日，唇角溢血重新阖眸退回盲态，反手掷出火符炸塌崖壁，拉住晏怀瑾一剑斩断铁索藤桥，双双坠向下层幽暗诡谲的上古封灵石窟。"}, {"n": 14, "title": "石窟分玉，盲语破机", "synopsis": "上古封灵石窟隔绝内外神识并压制七成金丹灵力，暂时挡住贺兰枭本尊追索，唯留卢铮率缇骑在窟顶架设钻山弩凿壁。幽暗石窟内，晏怀瑾强忍折剑旧伤寒意，摸到越流萤滚烫紊乱的腕脉与焦黑袖口，当即明白栈道上那团逼退贺兰枭的奇火是她折损十日煞脉寿命换来的。铁面司律沉默良久，没有半句门规责罚，而是撕下干净内襟仔细包好她灼伤的指尖，摘下自己压制金丹寒毒的贴身暖玉塞进她手心，嘴上仍硬邦邦声称「药奴少活十日便是亏空本堂账目」。越流萤在黑暗中弯唇将脸颊轻贴他微颤的手背，借南荒古巫见闻点醒他：金册龙气呆板无情，只保宿主性命不保抵押外物，且持印人若违背亲手盖下钦天官印的誓约，金册反噬比外敌更狠。"}, {"n": 15, "title": "照胆真言，公文骂阵", "synopsis": "卢铮率八名缇骑杀入封灵石窟，仗着人多肉身强横步步紧逼，晏怀瑾灵力受封七成且右臂未愈。危急关头他摸出三师姐公孙妙塞的「照胆真言镜阵盘」按入石窟残阵阵眼——镜光大盛锁死全窟，古板阵灵轰鸣宣告：凡入阵者三息内须对眼前人吐露肺腑溢美真言，起杀心或口不对心者立受九霄落雷！卢铮举刀骂娘当场被劈成焦炭头；越流萤借白纱遮眼真心实意夸晏怀瑾剑眉星目举世无双轻松过关；轮到素来冷肃端方的晏怀瑾，为抢夺阵枢控制权，他只得黑着脸挺直脊背，用最铿锵冰冷的镇契堂宣判公文腔对着卢铮字正腔圆背诵镜底铭刻的荒诞夸赞词，硬生生把古阵判定卡进死循环倒转雷光，劈得众缇骑神智错乱、互相指认叛徒大打出手，两人趁机一举清场。"}, {"n": 16, "title": "墨醒重连，香灰识诈", "synopsis": "借奇阵逆改石窟必死危局，沉寂整整七章的《春秋勘误录》重新凝聚2滴勘误墨气苏醒！晏怀瑾搜刮卢铮等人资粮后携越流萤由石窟水道潜回地肺火眼外围，半途撞见一名浑身是血、自称被贺兰枭强夺祖矿的散修「周通」。周通哭诉愿献出避开缇骑的火眼密道，并殷勤奉上清水干粮。晏怀瑾办案眼力毒辣，一眼瞥见周通靴底并无外谷赤砂，反倒粘着贺兰枭主帐独有的名贵龙涎香灰；他不动声色耗费1滴勘误墨气（余1滴）勘验，竹简红字证实周通实为贺兰枭死士，水中掺了专封金丹经脉的「锁灵散」，同时批注点透破局死穴：凡贺兰枭以钦天巡狩官印担保入册之灵脉契，若三刻内查实标的权属造假，金册即判欺君违约并自动抽干其借贷气运！"}, {"n": 17, "title": "截脉留命，隐墨设契", "synopsis": "周通脸色剧变拔匕欲逃，晏怀瑾屈指一式「截脉指」精准震碎其四肢气海经脉，却特意留住心脉性命——周通怀中一枚贺兰枭赐下的护身子符闪烁两下竟悄然熄灭，实战证实「非致死破功」果然卡在金册龙气反震判定之外！审清贺兰枭正急需一份完整上古火脉产权契书向中州少监赵景曜邀功请赏后，晏怀瑾与越流萤连夜布局：他取出先前在废矿拓下的「三百年前截天剑宗镇脉母契古印」，撰写一纸表面将赤砂火脉全权献予钦天监、实则底层条款早已与苍梧山护山死契锁死不可分割的让渡文书；越流萤再刺破指尖以古巫隐墨秘术遮蔽底层死契字迹，三刻自消。两人押着周通发出得手暗号，布下请君入瓮局。"}, {"n": 18, "title": "熔岩对赌，诱印入彀", "synopsis": "地肺火眼熔岩台热浪翻涌，千年「地肺阴火髓」即将出世。贺兰枭率二十名精锐缇骑携《奉天承运金册》赤金副页合围石梁，却谨记风控并未贸然近身，先命副手上前查探晏怀瑾气机。晏怀瑾主动逆压金丹灵光咳出一口淤血，伪装锁灵散发作的虚弱态，双目覆纱的越流萤跪扶他身侧瑟瑟发抖，两人退至一旦强攻便会连人带母契坠入万丈熔岩的窄梁死角。晏怀瑾冷声抛出赤砂火脉让渡契，开出活命条件：贺兰枭须以钦天监巡狩官印在契书与金册副页同时盖印立誓，担保「今日合法收归赤砂火脉全权，若有欺瞒愿受金册清盘，且三刻内钦天监上下不得动手伤立契人性命」。贺兰枭用鉴宝镜核验三百年前剑宗母印灵光不假，盘算三刻后放地火兽咬死两人同样不违誓，当场冷笑盖印！"}, {"n": 19, "title": "违约反噬，当众碎印", "synopsis": "官印落定瞬间，赤红晶莹的地肺阴火髓跃出岩浆！贺兰枭狞笑吹哨驱使潜伏地火兽群扑咬两人，自认借兽杀人完美绕开官印誓言。晏怀瑾却骤然直起身形，哪有半分中毒虚态——他剑指一抹震散让渡契表层古巫隐墨，露出底下「苍梧山护山死契绑定资产、外人强占即属盗卖皇册坏账」的铁律真文，同时祭出镇契堂司律主印激活权属对冲！高悬半空的《奉天承运金册》副页只认死板条文，当场红光暴涨，判定担保人贺兰枭「以钦天官印做保虚假坏账、欺罔皇运」！原本护他性命的九天紫微龙气瞬间翻脸化作赤金刑链，当着众缇骑之面反噬贺兰枭全身，咔嚓震碎其紫金巡狩官印，将其借贷的半步元婴气运连本带利抽得一干二净！晏怀瑾施展截脉剑挑翻兽群，反手夺下地肺阴火髓。"}, {"n": 20, "title": "阴火淬剑，鬼市密函", "synopsis": "金册副页崩解化作残光遁往中州报信，众缇骑见主将官印碎裂一哄而散。晏怀瑾谨守不沾命案引母卷天雷的分寸，一剑挑废已无龙气护体的贺兰枭丹田气海，缴获八百中品灵石与三十张奉天灵契券；凭此番无伤破除金册子契死局，《春秋勘误录》一口气凝聚4滴新墨气（储量增至5滴）！两人退入火脉密室，晏怀瑾先引七成地肺阴火髓入阵，亲手替汗湿衣襟的越流萤洗练稳固第一重九黎煞锁，将其百日焚脉险情彻底按稳并助她恢复通幽初阶巫觉，余下三成阴火熔入残剑「惊蛰」补齐剑尖缺口、淬出破煞火纹。越流萤在洗髓余热中隔纱攥紧他衣袖，低声道这辈子只给司律大人一人掌灯。清点战利品时，一封荒州城地下鬼市的司账密函浮出水面。"}, {"n": 21, "title": "换装入城，黑水鬼市", "synopsis": "坠龙墟金册副页崩裂震动荒州，城主府全面封锁四门排查可疑剑修。晏怀瑾将初淬的惊蛰剑缠上粗布，替覆着白纱的越流萤披上斗笠，凭从贺兰枭处缴获的不记名「奉天灵契券」买通荒州漕帮货船，顺水路潜入荒州主城。入城后两人发现全城丹铺与渡口均拒收寻常灵石，强制要求兑换钦天监司账行走崔明算签发的灵契券，大批散修与小宗门弟子因高额火耗倾家荡产。晏怀瑾按密函线索寻至地下「黑水鬼市」入口，打算购置压制折剑旧伤的辅药并打探幽墟古祭坛残图下落，却在鬼市暗门前撞见一桩送上门的惊天假账。"}, {"n": 22, "title": "空头期票，账房坐庄", "synopsis": "黑水鬼市茶楼内，金丹巅峰的司账行走崔明算正摇着算盘坐庄，趁贺兰枭碎印败讯尚未传开，将早已易主荒废的坠龙墟赤砂火脉包装成日进斗金的皇室特许矿，加五倍杠杆发行三千张「赤砂期票」吸干全城流动灵石，准备在明日午时拍卖会独吞「幽墟古祭坛残图」。越流萤隔着白纱听风辨音，嗅出崔明算金库实则只留了两成备付灵石，其余现钱全押在了拍品保证金上。晏怀瑾冷笑盘算：崔明算既有《奉天承运金册》司账子契锁血护命，硬抢残图必遭反震，但只要做空他的赤砂期票引爆挤兑，就能兵不血刃抽干其资金链。此时展厅押上一批抵债拍品，吸引了晏怀瑾的目光。"}, {"n": 23, "title": "剑骨蒙尘，倾囊做空", "synopsis": "铁笼少年名唤燕惊弦，其父本是荒州寒门剑修，因拒签钦天监灵脉贷被害身亡，崔明算篡改利滚利死契将其定为五千中品灵石的「父债药奴」。晏怀瑾耗1滴勘误墨气（余4滴）核验拍品册，竹简批注不仅确认燕惊弦身怀万中无一的「天生庚金剑骨」，更点出热场杂物堆里一枚无人问津的「残缺司南铜盘」正是开启幽墟外谷密室的唯一阵钥！面对崔明算高达两万灵石的盘口优势，晏怀瑾分文不留作竞拍款，而是带着越流萤走入鬼市外围对赌银号，以全部八百中品灵石与三十张灵契券作本金，全数买进赔率一比八、赌崔明算赤砂期票三日内违约崩盘的「破产暗契」。越流萤更主动卸下腕间一枚南荒伴生血珀添作押注，笑言赌司律大人稳赢。"}, {"n": 24, "title": "铜盘入袖，挂牌立威", "synopsis": "次日正午，黑水鬼市大拍正式开锣。首轮杂项竞拍中，全场修士皆盯着丹药符箓争抢，晏怀瑾仅出价二十块下品碎灵石，便不显山露水地将蒙满铜绿的「残缺司南铜盘」收入囊中。崔明算端坐二楼雅间冷眼旁观，只当他是落魄散修。席间越流萤指尖轻搭晏怀瑾袖口，柔声试探若有一日自己这名戴罪药奴也被摆上台抵债，司律大人肯出几块灵石；晏怀瑾拇指按了按惊蛰剑格，面无表情回道「镇契堂没有卖人的规矩，谁敢挂牌，本座先拆他的台子」，说得白纱下的越流萤唇角微弯。话音未落，燕惊弦所在的铁笼被推至台心，崔明算故意坐地起价立威。"}, {"n": 25, "title": "当众核账，五十赎人", "synopsis": "满场剑修慑于三千灵石天价敢怒不敢言，铁笼执刑人已举起抽髓铁钩。晏怀瑾缓步起身，未喊一次竞价，而是抬手将一枚鉴伪灵石掷入鬼市中央的「天平公证古阵」，朗声指出燕父原契借款仅五十中品灵石，崔明算账房私自按日息一成叠算复利至三千，早已触犯《奉天承运金册·司账篇》「私设印子钱截留皇运者视同侵吞国库」的死线！越流萤暗中弹出一缕无形巫音震散崔明算账房手里的涂改障眼符，黑底白字的阴阳假账在公证阵光下纤毫毕现。崔明算若敢否认便要触发金册侵吞审查，只得咬牙认栽抹去违例利钱；晏怀瑾当众拍出五十中品灵石本金，以截天剑宗镇契堂名义堂堂正正劈开铁笼，将遍体鳞伤的燕惊弦护到身后。"}, {"n": 26, "title": "碎印砸盘，全城挤兑", "synopsis": "崔明算恼羞成怒，在压轴拍品「幽墟古祭坛残图」登场时直接喊出五千中品灵石天价，欲凭账面信用额度强行截胡。就在拍卖槌即将落下的瞬息，晏怀瑾抬手将一块缠绕着散逸紫微怨气的紫金碎块掷上高台——正是坠龙墟巡狩行走贺兰枭崩碎的钦天官印残角！晏怀瑾冷声宣告：贺兰枭已因赤砂火脉权属造假遭金册反噬废功，所谓日产百石的赤砂火脉早是一座废坑，崔明算发行的三千张赤砂期票根本毫无矿脉兜底！全场持票大户与黑市钱庄瞬间炸锅，纷纷冲向钦天监鬼市银柜要求立刻兑现灵石。崔明算仅留的两成备付金不到半刻钟便被抢兑一空，原本用来拍残图的五千灵石保证金当场被鬼市大阵冻结抵债！"}, {"n": 27, "title": "弃子除籍，八倍收割", "synopsis": "面对山呼海啸的挤兑狂潮，崔明算慌忙祭起《奉天承运金册》司账子页企图借皇道龙气镇压全场。岂料中州总坛的少监赵景曜早已从贺兰枭之败察觉单人子契漏洞，冷酷启动「坏账切割铁律」——金册子页非但未降龙气护主，反而浮现赵景曜「账穿失察、即刻除籍」的八字朱批，当场抽回崔明算体内全部借贷气运与锁血光环！崔明算惨叫吐血，修为从金丹巅峰跌落金丹中期，彻底沦为不受龙气庇护的弃子。与此同时，鬼市对赌银号愿赌服输，将一比八赔付的六千四百中品灵石尽数交割至晏怀瑾手中，宗门穷困窘境一朝大解！狗急跳墙的崔明算趁乱砸碎展台禁制，抓起古祭坛残图跳入鬼市暗河夺路狂奔。"}, {"n": 28, "title": "暗河截杀，傩鼓入账", "synopsis": "黑水暗河出口雾气森寒，崔明算刚冲出水面，便撞上按剑静候的晏怀瑾。既已无金册龙气锁血，晏怀瑾不再束手束脚，惊蛰剑携破煞阴火铮然出鞘，仅用八息便连破崔明算三面算珠灵盾，一剑挑断其手足经脉留其狗命抵罪！燕惊弦紧随其后封死退路，从崔明算怀中搜出半幅兽皮绘制的「幽墟古祭坛残图」及其私吞的南荒赃物箱——箱内除一批上品疗伤丹外，竟有一面刻满哭笑巫纹的「颠倒傩面鼓」（越流萤认出此鼓敲响可令强敌三息内认敌作父行礼听训）。此战彻底粉碎鬼市杀猪盘，《春秋勘误录》再凝3滴墨气（储量达7滴）。而两份单人子契接连折戟的警讯传抵中州，少监赵景曜敏锐复盘漏洞，当夜下令全面改制升级对手防线。"}, {"n": 29, "title": "铜盘指谷，药奴争编", "synopsis": "城外隐秘破庙内，晏怀瑾替燕惊弦敷药接骨，正式将其录入镇契堂记名剑卫，并拆解两式基础「截脉剑架」命他持木剑演练。覆着白纱的越流萤抱膝坐在火堆旁，听着晏怀瑾指点少年握剑姿势，待燕惊弦退到廊下守夜后，忽然伸手将刚温好的药盏塞进晏怀瑾掌心，阴阳怪气轻声问司律大人有了真剑骨传人，是不是嫌她这双瞎眼掌灯手碍事了。晏怀瑾一怔，一本正经按门规解释「他是外堂巡卫，你是内堂专管长明灯的试剑药奴，编制不同」，反把越流萤哄得转嗔为喜。随后两人将「残缺司南铜盘」嵌入半幅残图，铜勺飞旋指向百里外的险地「千瘴断谷」——能修补金丹裂痕与九黎煞锁的「千年双生太岁」十日内便将成熟！恰在此时，屋顶传来一声巨响。"}, {"n": 30, "title": "师姐携炉，联保锁关", "synopsis": "三师姐公孙妙奉大师兄孟观澜密信，一路炸翻两座钦天监路卡赶来支援，见面先围着装乖行礼的越流萤啧啧打量，打趣小师弟下山一趟连掌灯家眷都栓牢了，说得晏怀瑾耳根微绷、冷声催她干正事。公孙妙连夜开炉，替惊蛰剑镶入导火奇门阵纹，又塞给燕惊弦一副专卸重兵器的磁石护腕。次日清晨四人赶至通往千瘴断谷的必经隘口「锁风关」，却见钦天监新任联保校尉裴震高坐关楼，左右竟站着荒州三大本土剑派的掌门随军协防！晏怀瑾本欲故技重施设契诱裴震违约，耗1滴勘误墨气（余6滴）一探却心头微凛：赵景曜已将子契改为连环联保制，裴震若有闪失，三大剑派全山弟子性命灵脉将首当其冲替他垫背！"}, {"n": 31, "title": "惊雷调虎，潜入千瘴", "synopsis": "晏怀瑾立下「绝不拿大荒同道性命填钦天监坏账」的铁则，果断叫停做空裴震的计划。他观察到协防的三派掌门与钦天监貌合神离、极惧谷内毒瘴凶兽冲击自家山门，遂联手公孙妙布下一出调虎离山计：由燕惊弦潜至侧翼山涧投下公孙妙特制的「百兽惊雷匣」，模拟高阶瘴龙出谷的狂暴妖气与震天兽吼；三派掌门顿时惊慌回撤各自防区护持弟子，关口联防瞬间露出一线空当。越流萤凭通幽巫觉在十丈浓雾中精准摸出无阵纹死角，引着晏怀瑾与扛炉的公孙妙疾掠入谷，半滴血未沾便甩开裴震封锁。然而刚深入千瘴断谷十里，压抑神识的灰紫瘴雾中却浮现出令越流萤杀意暴涨的南荒故物。"}, {"n": 32, "title": "木鱼敲供，巫监暗合", "synopsis": "枯木林七根生魂幡结成恶毒迷魂阵，两名凝煞巅峰的南荒乌骨部探子潜伏暗处吹奏骨笛偷袭。不等晏怀瑾拔剑，憋着一股劲报恩的少年燕惊弦暴起突刺，天生庚金剑骨迸发锐利锋芒，以刚学的半式截脉剑精准挑飞骨笛，晏怀瑾剑鞘补上一记敲晕活口。乌骨探子嘴硬咬碎毒囊欲自尽，公孙妙眼疾手快塞入一枚漆黑「拔舌真言木鱼」——木鱼自动敲击，中咒者不但咬不动毒牙，还必须合着节拍边打自己嘴巴边唱出心底实话，场面滑稽又骇人。在木鱼清脆笃笃声中，探子崩溃招认：乌骨部金丹巅峰祭酒「斛律蛮」奉命搜捕少司命余孽，眼下正与钦天监裴震暗中分赃，企图用活人精血提前催开双生太岁！"}, {"n": 33, "title": "旧铃动煞，夜火护炉", "synopsis": "从乌骨探子身上搜出一枚染血的九黎支脉骨铃，正是当年护送越流萤逃亡而惨死的族姨遗物。越流萤指尖死死掐入掌心，腕间刚稳住的第一重煞锁剧烈发烫，杀意几乎冲破白纱。晏怀瑾借递水之机不动声色握住她冰冷手腕，渡入一缕温和剑元压住躁动血契，避开公孙妙与燕惊弦耳目低声道：「按镇契堂律，既归本座监管，你的旧债便是本堂积案，明日一并连本带利讨回来。」滚烫直球被包在冷硬官话里，越流萤紧绷的脊背骤然软化。是夜众人宿于断谷岩洞休整，乌骨部放出的巡山毒虫顺雨夜摸向看守丹炉的公孙妙；越流萤没有袖手旁观，主动替晏怀瑾护住这位聒噪却真心疼他的三师姐，被假寐的晏怀瑾尽收眼底。"}, {"n": 34, "title": "勘破假根，铜盘启门", "synopsis": "拂晓时分，断谷中心血雾翻腾，乌骨部祭酒斛律蛮押着十二名被封修为的大荒散修立于血池边，准备放血强催岩壁上的一株赤红肉芝。晏怀瑾耗1滴勘误墨气（余5滴）凝神勘验，竹简批注一针见血：岩壁肉芝仅是伴生假根，真正的「千年双生太岁」藏于血池正下方三十丈的上古剑巫合葬祭室，且斛律蛮一旦完成血祭便会彻底污损太岁药性！晏怀瑾当机立断兵分两路：公孙妙与燕惊弦潜至上风口，用颠倒阵旗悄悄截断血池引煞回路，趁守卫慌乱无声割断绳索救走十二名散修并留下一枚留影石取证；晏怀瑾则牵着越流萤潜入谷底潭渊，取出鬼市拍得的「残缺司南铜盘」严丝合缝嵌入水下青铜石门凹槽。"}, {"n": 35, "title": "剑莲同契，双圣伴生", "synopsis": "青铜石门后是一座上古剑修与古巫结盟共守的地下祭室，横亘在太岁玉台前的「九曲剑莲池」布满凌厉残剑气与巫咒冥火——单凭剑修入内必遭冥火焚魂，单凭巫修闯阵必被剑气碎骨，唯有气血同频、毫无猜忌的剑巫同契者方可踏莲而过。眼看外头血池异动随时惊动强敌，素来防人三分的晏怀瑾没有半句犹疑，主动散去手腕护体剑罡，反手与越流萤十指紧扣，任由同命血蛊契将两人心脉跳动锁在同一节拍。越流萤感受着他毫无设防的剑骨温热，白纱下眼眶微热，引九黎巫韵裹住惊蛰剑意，两人步履如一踏过九朵杀机四伏的剑莲，稳稳登上中央玉台。然而双生太岁刚现真容，上方石壁已被强行轰穿！"}, {"n": 36, "title": "巫监合围，联保棘手", "synopsis": "斛律蛮发觉血池被毁、太岁真身在底，当即引着率精锐赶到的钦天监校尉裴震破顶杀入！恰在此时公孙妙与燕惊弦从水路赶来汇合，扛起紫金雷火炉死死卡住祭室窄门挡住外面二十名缇骑与黑巫爪牙，将内室主战场交给晏怀瑾二人。内室内，金丹巅峰的裴震枪出如龙，身上流转着与荒州三大剑派灵脉相连的「连环联保金光」——晏怀瑾剑锋一旦刺向其要害必遭紫微龙气百倍反震，若损毁其抵押契书又会连累三派无辜剑修陪葬；而另一侧斛律蛮祭出乌骨血幡专攻神魂，逼得晏怀瑾左支右绌。交手至第七息，金丹裂痕剧痛翻涌，千钧一发之际，晏怀瑾瞥见裴震刻意避开斛律蛮飞溅黑血的嫌恶动作，脑中电光石火闪过一道破局灵光！"}, {"n": 37, "title": "借血染印，叛国铁律", "synopsis": "晏怀瑾果断收剑回撤重置十息计数，同时耗费2滴勘误墨气（余3滴）锁定裴震腰间联保子契！竹简红字瞬间印证猜测：《奉天承运金册》视南荒古巫为头号窃运死敌，铁律第一条便是「持印官吏若以官印沾染南荒异巫本命血，即刻按叛国私通异端论处，由本人独受紫微雷噬，严禁转嫁联保宗门」！原来赵景曜防外人做空，却更防手下私通古巫反水！晏怀瑾心念电转，与越流萤借同命血契心意相通：越流萤暗弹一缕纯正少司命威压刺激斛律蛮贪功冒进，斛律蛮狂喜以为抓到古巫圣物，咬破舌尖喷出本命乌骨精血化作血爪抓向太岁；晏怀瑾不退反进，在第八息以惊蛰剑身如镜面般一引一卸，将那团滚烫乌骨巫血分毫不差拍进了裴震催动的钦天官印正中！"}, {"n": 38, "title": "独受雷刑，九息枭首", "synopsis": "乌骨巫血渗入官印的刹那，高高在上的《奉天承运金册》子页仿佛受了奇耻大辱，连环联保回路瞬间自动切断！九天紫微龙气化作三道审判狂雷直劈裴震天灵盖，将其钦天官印与一身金丹巅峰修为劈得寸寸俱裂，门外三派协防掌门的联保玉牌却毫发无损！斛律蛮见盟友眨眼遭天谴吓得魂飞魄散，转身欲逃。南荒叛巫本就不受仙朝金册护命，晏怀瑾岂容残害越流萤族人的凶手生还——越流萤指尖九黎巫火凝成锁魂链缠死斛律蛮退路，晏怀瑾本命剑「惊蛰」全力爆发，在第九息剑气巅峰一式「截天断脉」正面劈碎百鬼骨幡，寒光掠过直接枭首斛律蛮！燕惊弦与公孙妙趁门外缇骑群龙无首轰开一条退路，晏怀瑾稳稳采下完整的「千年双生太岁」。"}, {"n": 39, "title": "流沙掩迹，留影诛心", "synopsis": "随着太岁离台，地下古祭室禁制开始坍塌。公孙妙眼疾手快拆走祭室核心四块上古星纹钢，反手拍碎流沙阵枢掩埋现场，领着晏怀瑾、越流萤与燕惊弦顺地下暗河激流全身而退，并将先前救下的十二名散修连同记录「裴震勾结乌骨邪巫血祭同道」的留影石一并送出断谷——不出三日，钦天监在荒州正道中的公信力便将裂开大缝！四人潜入三十里外一处隐蔽的钟乳石秘洞安营。清点收获，此战既保全三大剑派八百同道性命，又夺得双生太岁并拔除乌骨暗桩，《春秋勘误录》厚重回馈3滴勘误墨气（总储量达6滴）。公孙妙架起紫金雷火炉准备开炉分炼双生太岁，洞内气氛却因服药先后起了微妙争执。"}, {"n": 40, "title": "阴阳同炼，金丹暗钉", "synopsis": "千年双生太岁分赤白阴阳两株，阳株补金丹剑骨，阴株锁九黎巫煞。越流萤深知晏怀瑾三年折剑大限凶险，执意称自己第一重煞锁已稳，逼他先服阳株；晏怀瑾没有空口推让，直接搬出同命血蛊契原理——两人气血相连，单服一株药力必失衡外泄，唯有隔着紫金雷火炉盘膝对坐、借血契同步引导阴阳药力方能十成吸收。公孙妙守炉控火、燕惊弦持剑护法，一白一赤两道磅礴太岁精粹顺着两人相抵的掌心汇入体内！越流萤体内九黎煞脉在阴株滋养下迅速凝练温顺，而当晏怀瑾引导白玉阳株药力冲向金丹表面第一道「折剑枯荣劫」裂痕时，异变陡生——那道困扰他整整三年的护山剑伤深处，竟传来了与《奉天承运金册》如出一辙的阴毒反噬！"}, {"n": 41, "title": "巫火拔钉，首痕初愈", "synopsis": "金丹裂痕深处的「钦天锁运钉」遇阳株药力疯狂反扑，一旦强拔便会搅碎丹田。晏怀瑾当机立断耗费1滴勘误墨气（余5滴）看清暗钉专吸正统剑气的倒刺结构，首次主动撤去丹田防备，经由同命血蛊契借入越流萤一缕专克皇道龙气的九黎本命巫火，内外夹击将那根半寸长的紫金细针完整逼出并封入寒玉瓶留证！失了暗钉阻挠，双生太岁阳株药力瞬间弥合第一道折剑裂痕，晏怀瑾修为稳固至金丹后期巅峰，全力催剑红线由十息拓宽至十五息；越流萤亦彻底炼化阴株稳住第二重煞锁，巫觉跃升至通幽巅峰。两人气息交融收功之际，洞外传来急促示警。"}, {"n": 42, "title": "星钢铸脊，清盘下帖", "synopsis": "燕惊弦呈上从山下坊市截获的州府急报：裴震勾结乌骨邪巫血祭同道的留影石传遍荒州，舆论哗然；钦天监荒州镇守使梁崇山（元婴巅峰）为强压乱局，勒令全州十二座剑派五日后赴州城参加「百派清盘联保法会」。公孙妙趁休整两日开动紫金雷火炉，将古祭室拆回的四块上古星纹钢熔入「惊蛰」剑脊，使其彻底承受住十五息巅峰剑意，又顺手给缴获的「颠倒傩面鼓」装上扩音铜喇叭，把龟裂的照胆镜残片改造成留影扩音阵盘。面对梁崇山布下的龙潭虎穴，晏怀瑾盯住通告上用作联保抵押标的的「幽墟古祭坛下半幅真图」与州府灵契金库，拍板入局虎口拔牙。"}, {"n": 43, "title": "纸鹤传讯，借席入局", "synopsis": "拔营赶赴荒州州城途中，一只沾着茶香的灰扑扑纸鹤破空落在晏怀瑾掌心——代掌教大师兄孟观澜传信告知，少监赵景曜正借荒州试水「百派联保母契」，一旦梁崇山逼齐十二派画押，钦天监便可名正言顺强征截天剑宗外围灵矿，嘱咐师弟妹打不过就跑、千万别替宗门省灵石。晏怀瑾收起密信，冷静分析州府戒备：梁崇山坐镇内坛，外设护城锁龙阵，蒙面硬闯必成瓮中之鳖；唯有寻一家被钦天监逼债却尚未签字的正道剑门，以镇契堂协理讼师身份堂堂正正踏上清盘高台，方能近距离摸进金库。话音未落，前方官道传来惨烈剑啸。"}, {"n": 44, "title": "峡谷保印，持凭进城", "synopsis": "落雁峡内，与截天剑宗素有旧交的末流正派「断碑剑庐」掌门岑铁崖浑身浴血，被六名钦天监司仪爪牙围攻——清盘司仪冯敬尧算准岑铁崖骨头硬不肯签联保契，竟派人半途截抢其掌门印信，企图判其「缺席违约」直接吞并剑庐灵脉！晏怀瑾拔剑掠入场中，仅用六息施展「截脉三式」挑断六名恶吏手筋夺回铁印，燕惊弦亦果断出剑挡下偷袭暗箭。岑铁崖感念救命保宗之恩，听闻晏怀瑾欲借断碑剑庐席位上台对质钦天监假账，当即咬破指尖签下《镇契堂协理护契书》，正式聘请晏怀瑾为断碑剑庐全权执律代表，公孙妙、越流萤与燕惊弦随行充作护印弟子混入州城。"}, {"n": 45, "title": "暗钉指库，剑穗系腕", "synopsis": "一行人入住州城断碑剑庐落脚小院，刚靠近州府总坛百丈外，晏怀瑾袖中封存「钦天锁运钉」的寒玉瓶便泛起细微嗡鸣，隔墙精准指向总坛钟楼正下方的地底灵契金库！入夜布置完明日分工，越流萤摸索着替晏怀瑾擦拭惊蛰剑鞘，指尖微颤提出明日若遇梁崇山威压，她可再燃一次本命巫血破阵。晏怀瑾冷脸扣住她手腕，搬出镇契堂药奴折损条例严令她不准私烧半滴本源，随手却将一截浸过自身纯阳剑意的青色剑穗结系在她腕间掩住煞纹，硬邦邦称此乃防她在乱军中摸错方向的定位绳。越流萤摸着与三年前寒鸦崖一模一样的剑穗编法，唇角无声弯起滚烫弧度。"}, {"n": 46, "title": "登台亮证，满座哗然", "synopsis": "州府清盘高台四周旌旗森严，元婴初期的清盘司仪冯敬尧携附庸打手「金刀门主庞虎」「赤霞派掌门苗千鹤」高踞主位，珠帘后隐有镇守使梁崇山如渊似海的元婴巅峰气息。冯敬尧喝令断碑剑庐带头签下《百派连环联保母契》，否则以勾结邪修论处。晏怀瑾按剑替岑铁崖登台，不仅拒不画押，反手甩出公孙妙改装的留影扩音阵盘——半空百丈光幕清晰映出钦天监校尉裴震与乌骨邪巫斛律蛮活祭散修的铁证，更有获救散修血书画押！台下被胁迫的九派掌门哗然变色、纷纷按剑后退，冯敬尧为压制哗变，被迫全力催动金册副卷调集地底龙气镇场，恰中晏怀瑾调虎离山之计！"}, {"n": 47, "title": "台上核账，暗度陈仓", "synopsis": "趁半空金册光幕轰鸣遮掩，晏怀瑾耗费1滴勘误墨气（余4滴）锁定地底灵契金库因龙气上调露出的「一炷香子母锁真空期」，指尖轻叩剑格发出行动暗号：公孙妙当即携燕惊弦借早年州府古排水暗渠潜向金库外墙，而覆着白纱的越流萤则借端茶退席之机，凭通幽巅峰巫觉避开明哨摸入钟楼夹层。高台之上，冯敬尧欲强行宣判断碑剑庐抗命，晏怀瑾却不慌不忙掏出荒州鬼市账册，当众逐笔核对庞虎与苗千鹤虚报灵矿储量骗取钦天监低息气运贷的假账！庞、苗二人做贼心虚当场跳脚辩白，冯敬尧被迫分出七成心神维持金册验账金光，浑然不觉脚下金库已被悄然凿穿。"}, {"n": 48, "title": "调包真图，搬空金库", "synopsis": "地底灵契金库内珠光宝气，堆满钦天监搜刮荒州十年的民脂民膏。公孙妙放出三只专啃阵纹的奇门噬灵鼠卡住警报铜铃，与燕惊弦麻利将一万五千中品灵石、二百张奉天灵契券及十二剑派质押的祖脉地契尽数扫入储物袋！核心石台上，盛放下半幅「幽墟古祭坛真图」的龙纹铜匣附有金册气机感应，越流萤指尖燃起一缕极细的九黎拟态巫丝，模拟原图气息缠住匣锁，顺利取出真图并以假卷替之。然而金库灵石骤空三万斤导致地脉阵基微沉半寸，高台珠帘后闭目镇守的梁崇山猛然睁开双目，恐怖的元婴巅峰神识扫过空荡荡的地下金库，怒极震碎珠帘凌空拍落！"}, {"n": 49, "title": "元婴封城，十死合围", "synopsis": "梁崇山元婴巅峰威压如天倾覆下，护城锁龙大阵瞬间合拢，连一只飞鸟都休想出城！梁崇山身负少监赵景曜亲赐的州府镇守主契，周身紫微龙气凝如实质，抬手一道赤金大手印直抓高台上的晏怀瑾。晏怀瑾早有防备，果断耗费2滴勘误墨气（余2滴）推演生路——竹简血字警示正面硬接十死无生，唯钟楼地底残存一座上古单向传送台，但已被冯敬尧率庞虎、苗千鹤三人堵死入口！晏怀瑾当机立断震碎袖中扩音阵盘引发灵力烟幕，施展身法护着岑铁崖掠向钟楼，恰与从地底钻出的越流萤、公孙妙、燕惊弦汇合；身后梁崇山踏空紧追不舍，正前方冯敬尧三人已狞笑挥兵封死去路！"}, {"n": 50, "title": "傩鼓三通，群丑互跪", "synopsis": "前有元婴初期冯敬尧与两名金丹巅峰掌门拦路，后有梁崇山杀机锁背，常规剑招根本来不及破门！千钧一发之际，越流萤咬破指尖将一滴纯正少司命巫血抹在「颠倒傩面鼓」皮面，晏怀瑾灌注十成金丹灵力重重连擂三通！经公孙妙大铜喇叭十倍扩音的诡异巫鼓波纹横扫门前，当场击穿冯敬尧、庞虎、苗千鹤三人心防——古巫禁制发作，十息之内必将眼前最忌惮猜防之人认作顶头太上皇磕头请罪！素日高傲的清盘司仪冯敬尧扑通跪倒在死对头庞虎脚下，砰砰磕头哭诉自己私吞了梁崇山三千灵石回扣；庞虎则转身对着苗千鹤敬礼自抽耳光，三人抢夺官印互殴成一团乱麻，全场九派掌门看得目瞪口呆！"}, {"n": 51, "title": "护驾乌龙，借盾远遁", "synopsis": "梁崇山见冯敬尧当众抖出贪墨丑事，气得面色发紫，凌空一记元婴巅峰「紫微碎岳掌」连同晏怀瑾与冯敬尧一并拍下！岂料正处于颠倒魔怔第七息的冯敬尧、庞虎、苗千鹤三人，竟把半空怒劈而来的梁崇山当成行刺上官的狂徒，高喊着「护驾」合力祭起三派联保金光大盾，死死挡在梁崇山掌印正下方！轰然巨响中，自家联保护盾硬生生替晏怀瑾扛住九成掌力，冯敬尧三人被震得筋骨寸断横飞出去！趁这爆笑又致命的三息空档，公孙妙一锤砸开钟楼地砖，燕惊弦护着岑铁崖跃入阵心，晏怀瑾一把揽住越流萤腰身按入五十块中品灵石激活古传送阵，在梁崇山第二掌落下前化作流光远遁千里！"}, {"n": 52, "title": "焚券归脉，合图指渊", "synopsis": "单向古传送阵将五人精准甩在荒州极西「幽墟荒原」边缘的枯骨绿洲，距幽墟古祭坛不足三百里。此役虎口拔牙搬空灵契金库、全身破开元婴巅峰合围，《春秋勘误录》慷慨凝聚3滴新墨气（总储量达5滴）！清点金库缴获的十二剑派质押祖契时，公孙妙笑问是否拿捏各派把柄收保护费；晏怀瑾却拔剑削去契书上钦天监强加的高利贷附页付诸一炬，将干净的祖脉原契交予断碑剑庐掌门岑铁崖代为发还各派，只留一纸「钦天监金库亏空实属内哄」的公证回执——此举令荒州九派彻底寒了替梁崇山卖命的心，使梁崇山瞬间沦为孤家寡人。送别岑铁崖后，众人正式拼合完整的古祭坛真图。"}, {"n": 53, "title": "血月定期，去留暗问", "synopsis": "两半真图借司南铜盘磁极咬合，显影出沉陷于荒原沙海之下的「幽墟古祭坛」全貌：祭坛分断契外垣、沉剑中垣与九黎内坛三层，十日后血月食天之际瘴锁最弱；内坛中央既有可彻底重铸惊蛰剑锋、助晏怀瑾冲击半步元婴的「地心淬龙池」，亦有能助越流萤凝结「古巫真丹」、一劳永逸化解百日焚脉死劫的「古巫髓火」！然而越流萤指尖抚过图角一行细小南荒巫篆，心头微凛——凝结古巫真丹刹那巫光冲窍，必将短暂震散眼部封脉伪装。她怕自己南荒少司命的煞星真容吓退正道司律，夜半独坐沙丘发怔，却被巡夜走来的晏怀瑾一句直白发问撞在心口。"}, {"n": 54, "title": "荒原砺剑，百年掌灯", "synopsis": "面对晏怀瑾冷肃的去留之问，越流萤转瞬收起不安，隔着白纱轻笑拽住他袖口，软声道自己欠镇契堂一千五百灵石药钱未还，自然要回寒鸦崖再掌一百年灯；晏怀瑾耳根微不可察一热，丢下一句「记得按月扣俸」便转身督促备战。随后四日，众人利用金库缴获的一万五千灵石全力整备：公孙妙熔炼奉天灵契券上的碎金纹，替众人打制了四副可卸去三成龙气余波的「卸甲护腕」；晏怀瑾亲手拆解截脉剑理，护持天生庚金剑骨的燕惊弦吞服筑基灵丹，一举冲破关隘晋升筑基初期！全员战力焕然一新之际，荒原远方沙暴骤起，梁崇山的追剿先锋已循迹杀至。"}, {"n": 55, "title": "沙暴折骑，毒计曝光", "synopsis": "腥红沙暴遮蔽视线，十二名钦天监精锐缇骑与十名乌骨部黑巫驭使骨鹰掠过绿洲外围，沿途埋设引爆地脉的血煞钉。晏怀瑾不给斥候发讯之机，借狂风掩护与燕惊弦一左一右暴起出剑——燕惊弦筑基庚金剑气凌厉射落半空骨鹰，越流萤指尖巫丝封死黑巫咒言，晏怀瑾惊蛰剑寒光一闪，不到八息便将二十二名无金册锁血的斥候尽数挑断经脉生擒！公孙妙搜出斥候怀中的布防兽皮卷，揭开惊人黑幕：梁崇山被中州少监赵景曜下了最后通牒，走投无路之下竟与南荒乌骨部元婴初期长老「木鹿狰」勾结，押着三百死囚直扑幽墟古祭坛，妄图抽干地脉助自己强冲化神，再把屠灭生灵的黑锅扣死在截天剑宗头上！"}, {"n": 56, "title": "抢关入墟，断契碑林", "synopsis": "距血月开坛仅剩五日，一旦让梁崇山与木鹿狰抢先控制祭坛枢机，不仅机缘落空，苍梧山更将背上灭绝地脉的滔天罪名。晏怀瑾当即拍板兵贵神速，率众连夜横穿百里流沙直抵幽墟天坑边缘。此时天坑东侧已有戴罪立功的冯敬尧率五十残兵正在架设封山弩炮，后方十里外梁崇山与木鹿狰的主力黑云滚滚逼近。晏怀瑾不与冯敬尧缠斗，命公孙妙将三枚雷火震山子埋入天坑东侧流沙梁，燕惊弦剑斩弩索制造混乱，震山子轰然引爆掀起万钧沙瀑将冯敬尧部活活掩在坑外；晏怀瑾则紧扣越流萤手腕，四人借司南铜盘辟开外层瘴雾，抢先一步跃入幽墟外垣！"}, {"n": 57, "title": "古碑同痕，尸傀压境", "synopsis": "幽墟外垣「断契碑林」死寂森寒，数百座上古石碑专镇背弃盟约的古修残魂，擅动刀兵者极易引来碑煞噬魂。奇异的是，踏入碑林核心时，晏怀瑾识海中的《春秋勘误录》竟无需消耗墨气便自行微震，红光直指中央半截断裂的主盟碑！晏怀瑾凝神细看，瞳孔微缩——古碑末尾一处天然崩缺的巫祝篆体断笔，竟与当初寒鸦崖钦天监提人敕令底纹里那道隐晦的「巫祝断笔缺口」分毫不差！越流萤隔纱抚过碑痕亦心神剧震，隐约察觉钦天监引以为傲的皇道金册似乎偷学了南荒古碑皮毛。晏怀瑾果断将碑文拓印贴身收好，身后破风声已骤然逼近！"}, {"n": 58, "title": "激誓引碑，百傀成泥", "synopsis": "木鹿狰麾下金丹巅峰统领「赤兀」自恃百具铜甲尸傀无魂无魄不惧寻常剑气，呈扇形包抄而来。硬砍百具铜尸必耗尽晏怀瑾十五息剑气窗口，他冷静耗费1滴勘误墨气（余4滴）勘验碑林规则，查明古碑残存上古契灵：凡在碑前十丈内指天立下违心血誓者，连同其血炼傀儡必遭万钧碑煞碾压！越流萤悄悄以少司命正统巫血点亮三座古碑阵脚，晏怀瑾则负手立于碑前，故意用冷淡官腔讥讽赤兀私藏木鹿狰赐下的炼尸母珠、早有弑主自立之心。生性贪婪心虚的赤兀怕隔墙有耳，脱口咬牙指碑发毒誓表忠心——话音未落，三座漆黑古碑轰然腾空镇落，将百具血炼尸傀与赤兀双腿当场砸成肉泥！"}, {"n": 59, "title": "桥头明账，拒受绑架", "synopsis": "审讯赤兀得知木鹿狰正拿抓来的正道散修蹚雷，四人疾驰赶往通向中垣的咽喉要道「锁魂青铜桥」。桥头迷雾里，十几名伤痕累累的荒州剑修被困在蚀骨毒风阵中，其中既有断碑剑庐的年轻弟子，也有叠翠剑派迂腐傲慢的长老孙鹤年。燕惊弦与晏怀瑾出手破开风阵救人，不料孙鹤年刚喘过气，便摆出长辈谱要求公孙妙立刻交出四副「卸甲护腕」供他护体，大言不惭称正道同气连枝理当无偿让宝！公孙妙气得撸袖子要砸炉，越流萤指尖巫火已暗锁其咽喉；晏怀瑾却面无表情按住两人，翻开镇契堂算盘明码标价：断碑剑庐有协理旧约免费护送，外派欲借道避险者，须亲笔签下「梁崇山勾结黑巫强掳正道血祭」的实名证词并付三百灵石买路，否则请自便！孙鹤年再试毒风吃瘪，只得乖乖低头画押。"}, {"n": 60, "title": "夺桥落石，巨擘临渊", "synopsis": "横跨深渊的锁魂青铜桥设有上古「因果秤重禁制」，人数失衡或心怀鬼胎者踏桥即坠，对岸更有木鹿狰留守的二十名乌骨精锐弯刀待发。公孙妙三息算准配重刻度，命签了证词的荒州剑修分两批对称踏桥稳住铁索；晏怀瑾则与越流萤并肩掠上桥头正面开路——越流萤白纱飞扬间甩出九黎惑神火雾封死乌骨弓手视线，晏怀瑾十五息「惊蛰」剑气如长虹贯日，连挑七座乌骨阵盘，燕惊弦紧随其后补剑清场，一行人强势杀穿桥头冲入第二层「沉剑中垣」，反手斩断桥头机括落下万斤断龙石！几乎在同一瞬，深渊彼岸黑云压城，梁崇山携木鹿狰及三百死囚大军赶至崖边，杀机滔天亮出焚脉底牌！"}, {"n": 61, "title": "隔渊泄火，倒灌敌营", "synopsis": "梁崇山催动焚脉血诏、木鹿狰引爆外垣三座火穴，狂暴地火顺地下灵脉直冲断龙石后的沉剑中垣，炙热岩浆瞬间漫过石阶！随行避险的叠翠剑派长老孙鹤年惊慌失措，鼓噪众剑修轰开西侧薄壁逃生。晏怀瑾耗费1滴勘误墨气勘验地形，一眼看穿西侧薄壁乃是木鹿狰预设的噬魂死路，而脚下中垣实为三百年前截天剑宗先辈修建的导火剑渠。他当场按剑喝止乱局，命公孙妙将星纹钢楔入逆流总阀，自己携燕惊弦在十二息内挥剑斩通三处淤塞阵节，再由越流萤以九黎巫火牵引火头转向——轰隆巨响中，七成暴走地火顺外垣暗渠倒喷回深渊彼岸，当场掀翻乌骨部半数攻城骨车！"}, {"n": 62, "title": "沉剑遗简，内鬼疑云", "synopsis": "深渊对岸梁崇山吃亏后暂停强攻，暗令木鹿狰驱使死囚开凿侧翼风蚀裂道企图两日后绕后包抄。中垣内，晏怀瑾跃入显露真容的「镇煞剑池」，拔出池心半截先辈遗剑，从剑柄暗格取出一枚三百年前截天剑宗驻守长老留下的血书剑简：简上不仅绘明内坛核心分设淬剑破境的「地心淬龙池」与洗练巫脉的「古巫圣火台」，更留有一道感应禁制——此刻剑简微泛红光，警示过桥随行的荒州剑修里竟有人怀揣钦天监「窥天定位子符」！越流萤借整理池畔阵纹之机，指尖悄然吸走钻入晏怀瑾腕脉的一缕地火余毒；而池外孙鹤年已眼馋满池古剑，正煽动众散修强行瓜分。"}, {"n": 63, "title": "分剑立契，瓮中捉鳖", "synopsis": "面对孙鹤年带头讨剑鼓噪，晏怀瑾非但不恼，反而冷淡应允开池赠剑，只立下一条镇契堂规矩：古池残剑皆含三百年前截天先辈斩奸剑煞，凡入池领剑者须滴血剑脊立誓「未私通钦天监与乌骨邪巫，违誓者立受万剑穿心」。断碑剑庐弟子坦荡滴血领走良剑，孙鹤年虽贪小利却未通敌，咬牙验血亦安然过关；唯独缩在人群末尾、自称小门派弃徒的散修曹焕脸色惨白，后退半步悄然去捏袖中传讯玉符！守在侧翼的燕惊弦快剑如电，一剑挑飞其护腕，窥天定位子符当众滚落石阶。人赃俱获之下众散修哗然唾弃，晏怀瑾一指封死曹焕气海，识海竹简随之新凝2滴勘误墨气。"}, {"n": 64, "title": "假标诱敌，裂道埋雷", "synopsis": "审清乌骨大将屠跋（半步元婴凶徒）正率八十精锐自侧翼风蚀裂道掘进、预计明日夜半突袭后，晏怀瑾当即定下反伏击策。他没有毁去窥天定位子符，而是交由精通气机拟态的越流萤每隔两个时辰注入一缕模拟曹焕的灵力，向对岸梁崇山传递「晏怀瑾受地火反噬旧伤复发、退守西侧废殿疗伤」的假讯；公孙妙则大喜过望，带着燕惊弦与断碑剑庐弟子撬起镇煞剑池底部的天然玄磁母石，连夜埋入西侧废殿四柱，又将缴获的火雷子捆在断剑堆下。忙活间隙，燕惊弦好奇问越流萤蒙着白纱怎能精准递送阵钉，越流萤笑吟吟答道心里只记着一人的步子便不会踏错，听得少年一头雾水。"}, {"n": 65, "title": "冥风扣腕，朱批护短", "synopsis": "九幽冥风席卷中垣，寻常金丹修士神识与目力皆被压至三尺之内，晏怀瑾更因金丹裂痕受阴寒牵动出现半息目眩，三道无形空间风刃迎面割来！危急一瞬，素日柔弱摸索的越流萤骤然踏前一步，温热指尖精准反扣住晏怀瑾手腕，借封目苦修出的敏锐听风术拉着他旋身避入背风石龛。逼仄石龛内两人衣袂相贴，越流萤没有松手，反而仰起覆着白纱的脸庞，摸出那卷抄满的《清心寡欲戒律》求司律大人再添朱批，轻声试探倘若他日世人皆骂她是南荒妖孽逼剑宗交人该如何。晏怀瑾指腹按过她腕间剑穗结，冷声提朱砂笔批下「本堂旧案未结，天下外人无权插手」，令越流萤唇角无声弯起滚烫弧度。"}, {"n": 66, "title": "玄磁缴械，凶将困兽", "synopsis": "屠跋生性狡诈，故意提前两个时辰率八十乌骨死士轰穿西殿地砖杀出，妄图打目标一个措手不及，劈碎床榻却见只有两具贴符草人！屠跋惊觉中计刚喝令后撤，蹲守房梁的公孙妙重锤轰然砸落阵枢——四根石柱内的万钧玄磁母石同时爆开吸力，八十名乌骨死士手中的淬毒铁骨刀与锁链瞬间脱手飞出，连人带甲死死钉在磁柱上动弹不得！燕惊弦率断碑剑庐精锐守住殿顶缺口万剑攒射压制杂兵；半步元婴修为的屠跋怒吼震碎磁力束缚，仗着一身横练乌骨功直扑主位上的晏怀瑾！晏怀瑾拔惊蛰剑正面迎击，金铁交鸣火星四溅，转眼拼杀至第十二息关口。"}, {"n": 67, "title": "巫火融剑，十四斩枭", "synopsis": "眼看屠跋依仗乌骨重甲死拖十五息换气死角，守在侧后的越流萤没有半分迟疑，指尖按上腕间同命契纹，首次将一缕精纯凝练的「九黎破煞巫火」顺血脉共鸣直接渡入晏怀瑾掌中！原本凛冽纯粹的惊蛰剑锋骤然缠上一层妖异紫金火芒，专克南荒邪派炼骨阴煞。第十四息，晏怀瑾手腕一沉施出「截脉断岳」，剑巫合流的一剑如热刀切脂般当场劈裂屠跋引以为傲的不坏骨甲，剑气贯胸将其彻底斩灭！失去主将的八十乌骨死士被公孙妙引爆火雷子一举荡平。彻底粉碎侧翼包抄死局令《春秋勘误录》再凝2滴墨气（总储达7滴），只是两脉灵机初次同炉亦震得两人掌心滚烫微麻。"}, {"n": 68, "title": "悬甲诛心，炉畔调侃", "synopsis": "破晓时分，公孙妙兴致勃勃把屠跋的半截骨甲挂上断龙石高墙，架起扩音铜喇叭对着深渊彼岸循环播放审讯曹焕录下的铁证——揭露梁崇山故意隐瞒中垣导火渠、拿乌骨部死士替钦天监蹚雷送死！对岸木鹿狰本就痛失爱将，闻言暴怒揪住冯敬尧衣领险些火并，梁崇山不得不耗费半日弹压安抚，强攻浮桥的进度生生慢了一大截。中垣营地内气氛大振，获救散修主动包揽外围巡防；公孙妙开炉将屠跋遗留的半步元婴骨材熔入燕惊弦的护心镜，又凑到擦剑的晏怀瑾跟前促狭挤眼，笑称惊蛰剑如今都染上掌灯小姑娘的紫火香了，说得一贯冷肃的晏司律面无表情起身罚燕惊弦加练五百剑。"}, {"n": 69, "title": "百步斩妄，旧雪重逢", "synopsis": "血月升空前一日，通往幽墟内坛的必经之路「百步斩妄阶」开启外禁，登阶者须勘破心底执念幻象方可通行。公孙妙一锤砸碎「炼器炸穿宗门大殿」的幻影，燕惊弦挥剑斩断钦天监逼死父母的梦魇，双双踏上高阶；轮到晏怀瑾与越流萤时，腕间同命血蛊契骤然发烫，竟将两人神识拉入同一片凛冽风雪——正是三年前截天剑宗遭夜袭的寒鸦崖！晏怀瑾重见自己金丹碎裂仍死守山门的旧影，目光一转，却见崖底雪窝里蜷缩着一名双目浴血的垂死少女，正死死攥着他遗落的半截断剑穗抬头望来！就在少女面容即将清晰映现的刹那，身侧越流萤气息骤乱，逆催一缕巫火硬生生从内部撕碎了整座幻境！"}, {"n": 70, "title": "双钥启门，破城杵落", "synopsis": "踏出斩妄阶，越流萤耳尖泛白，低声谎称是被阶上古剑煞气冲了心神；晏怀瑾看着她紧拢袖口的防备姿态，终究没有拿审案手段逼问，只不动声色解下腰间温养神魂的清心古玉塞入她掌心，淡声命她稳住气血准备开坛。四人抵近高达十丈的幽墟内坛青铜巨门，公孙妙将「残缺司南铜盘」嵌入左槽、屠跋遗留的「乌骨祭司血钥」插入右孔，咔嚓连解两重上古机括，测算出只需再等半个时辰血月升顶即可彻底推门入坛！不料梁崇山在深渊对岸感应到内坛门禁松动，生怕机缘被截，竟不惜燃烧十年元婴精血强催赵景曜所赐重宝，提前轰穿断龙石率两百精锐直扑天阶！"}, {"n": 71, "title": "天阶喋血，送火留种", "synopsis": "万斤断龙石崩塌，梁崇山与木鹿狰率两百钦天监缇骑及乌骨精锐如黑潮涌入中垣！叠翠剑派孙鹤年吓得魂飞魄散，当场跪爬上前献出自己偷画的营地草图求饶，却被急于补回元婴损耗的梁崇山一把扣住天灵盖，借邪阵抽干一身金丹灵力化作枯骨！断碑剑庐年轻弟子目眦欲裂拔剑欲拼，晏怀瑾当机立断开启先前探明的沉剑渠排水暗道，严令断碑剑庐众人携各派画押证词即刻撤出幽墟向荒州同道报信，自己则与越流萤、公孙妙、燕惊弦退守「百步斩妄阶」！斩妄阶对心怀鬼胎的恶吏黑巫天然降下三倍神魂重压，燕惊弦与晏怀瑾双剑封路，公孙妙滚落残剑火雷，硬生生在狭窄石阶顶住数倍强敌狂攻！"}, {"n": 72, "title": "双血叩环，绝灵封壁", "synopsis": "梁崇山仗着元婴巅峰深厚修为硬抗斩妄威压，携《奉天承运金册》荒州镇守正卷踏空扑至，一掌震翻紫金雷火炉，距离血月升顶开锁尚差最后百息！退路已绝，晏怀瑾冷静耗费2滴勘误墨气勘验青铜巨门门枢，红字批注瞬间点透：此门原为上古剑巫盟主共设，无需死等血月满盈，以金丹剑骨血与九黎正统巫火同时叩击阴阳兽环即可强启！晏怀瑾反手划破掌心按上左环，越流萤心领神会凝指尖巫火拍向右环——沉寂千年的青铜巨门在梁崇山掌风及体的前一瞬轰然洞开一线！晏怀瑾一把抄起公孙妙与燕惊弦推入坛内，拉着越流萤闪身而入，当场拍落内坛第一重「九宫绝灵护坛壁」锁死大门！"}, {"n": 73, "title": "阴阳双池，分兵守枢", "synopsis": "幽墟内坛恢弘幽邃，穹顶天然圆孔正对天际血月，内室左右分列两座奇池：左侧「地心淬龙池」翻涌着专铸神剑剑骨的万载庚金龙髓，右侧「古巫圣火台」跳动着唯有九黎皇脉可引动的少司命本源髓火，而两池交汇的地底祭心正是整座荒州的地脉总枢！此时门外传来木鹿狰凄厉咒唱，敌军正不计代价用三百死囚怨血强行消融九宫绝灵护坛壁，公孙妙测算护壁最多撑不过两个时辰。与其干等壁破束手待毙，不如先一步将双池机缘化为战力——晏怀瑾迅速拍板：由公孙妙与燕惊弦依托前殿四象古阵延缓破壁，自己与越流萤即刻分入双池淬剑凝丹，抢在总决战前先拔头筹！"}, {"n": 74, "title": "解纱半寸，隔池同定", "synopsis": "内室仅余双池火光摇曳。古巫圣火台感应到九黎血脉嗡鸣不止，却因越流萤双目覆有封灵白纱而迟迟不肯降下髓火。越流萤立于圣火台前沉默片刻，背对十步外的晏怀瑾，指尖微颤解开脑后白纱暗扣半寸，仅露出一截雪白眼尾与惊鸿一瞥的赤金圣巫纹，嗓音微哑叮嘱司律大人万勿回头踏入巫火范围，否则剑骨必受火煞反冲。晏怀瑾盘膝坐于左侧淬龙池畔，连眼皮都未乱抬半分，拇指轻叩惊蛰剑格，平淡却笃定地回了一句「安心结你的真丹，门外天塌下来先砸本座肩上」。越流萤唇角微扬迈入圣火中心，晏怀瑾亦将惊蛰剑连同阴火髓余泽、太岁药韵一并沉入地心淬龙池！"}, {"n": 75, "title": "龙髓淬剑，跨池渡火", "synopsis": "万载庚金龙髓如钢针洗刷经脉，惊蛰剑身在池底贪婪吞吐龙气修补暗伤；然而当龙髓精粹冲入晏怀瑾金丹第二道「折剑枯荣劫」裂痕时，嵌在伤痕深处的第二枚钦天监紫微锁运暗劲受激暴起，勾连池底狂暴龙煞直冲识海，令晏怀瑾护体剑罡瞬间裂开数道血口！右侧圣火台上的越流萤正值凝聚古巫真丹雏形的紧要关头，腕间同命血蛊契一颤，她想都没想便强行中断自身周天，分出三成温润本源圣火顺血契跨池渡入晏怀瑾丹田，死死包裹住暴走的紫微暗劲助其炼化！晏怀瑾成功压服暗钉并吸纳六成龙髓稳固金丹巅峰剑体，越流萤却因分火损耗导致凝丹收官硬生生推迟了三刻钟！"}, {"n": 76, "title": "壁裂前殿，少年死守", "synopsis": "内室双池激荡之际，门外木鹿狰不耐等待，竟将百名死囚推上护坛壁当场引爆血魂，硬生生在九宫绝灵护坛壁东角炸开一道丈许窟窿，亲率麾下四大金丹骨将杀入内坛前殿！公孙妙眼眶通红，将紫金雷火炉催至极致喷吐雷火封锁中路；年仅十四岁、初入筑基初期的燕惊弦独守东侧四象阵眼，面对修为高出自己整整一个大境界的乌骨骨将，将晏怀瑾所授截脉快剑使到滴水不漏，虎口震裂、肩头见骨仍连挑七名悍匪！四大骨将恼羞成怒合击一处，硬生生震断燕惊弦手中凡铁长剑，弯刀挟腥风直劈少年天灵盖，妄图拔旗毁阵冲入内室打断双池闭关！"}, {"n": 77, "title": "惊蛰初鸣，赐剑断臂", "synopsis": "千钧一发之际，赤金剑虹自内室贯空而至，当场将劈向燕惊弦的乌骨弯刀连同那名骨将右腕齐根斩落！晏怀瑾青衫染火踏出石门，经过庚金龙髓初淬的本命剑「惊蛰」龙吟清越，一剑横扫震飞四大骨将，反手将从淬龙池底顺手捞出的上品古剑「鸣霜」掷入燕惊弦怀中，冷声赞了一句「剑架未乱，不愧镇契堂门人」。元婴初期的木鹿狰见状亲自挥动白骨权杖扑上，以为金丹后期的晏怀瑾必难抵挡；孰料晏怀瑾金丹首痕已愈、剑融龙威，在十五息窗口内连出九剑精准截断白骨权杖灵力节点，寒光暴涨一剑削飞木鹿狰左臂！重伤的木鹿狰疯狂催动血符引外门梁崇山主力破壁入坛！"}, {"n": 78, "title": "镇守临坛，血诏锁脉", "synopsis": "九宫绝灵护坛壁彻底崩碎，元婴巅峰的荒州镇守使梁崇山脚踏紫金云履、手托《奉天承运金册》荒州镇守正卷威严入坛，头顶盘旋的皇道紫微龙气凝若实质！吸取了贺兰枭、崔明算与裴震连折三阵的教训，梁崇山入坛竟不急于近身搏杀，而是抬手将少监赵景曜亲赐的「焚脉血诏」打入前殿副枢，联手断臂的木鹿狰瞬间张开「钦天血祭锁脉大阵」——直接把脚下荒州百里地脉与周边十二座凡人城池气运强行锁入镇守正卷担保栏！梁崇山居高临下冷笑宣告：晏怀瑾若敢杀他必遭紫微雷罚轰成飞灰，若敢做空正卷违约，整条荒州地脉便会先一步炸裂陪葬！"}, {"n": 79, "title": "浊煞冲台，一剑当关", "synopsis": "血祭大阵强抽地脉灵机，污浊煞气顺池底倒灌入内室「古巫圣火台」，正处古巫真丹凝结最后三刻钟的越流萤气息骤乱，白纱渗血却死咬牙关不敢散功——此时一旦中断，百日九黎煞脉必将彻底失控炸毁！梁崇山听见内室异响，一眼认出里面藏着南荒高阶巫脉，当即狞笑命木鹿狰率百名精锐强冲内室抓活口。晏怀瑾横持惊蛰剑稳稳立于内室门槛正中，一夫当关截住去路，公孙妙架起伤痕累累的紫金雷火炉封死左翼，燕惊弦握紧鸣霜古剑死守右翼！面对梁崇山隔空拍落的元婴巅峰皇道掌印，晏怀瑾硬提剑罡连挡三击，虎口崩裂染红剑柄，却连门槛半寸都未曾让开！"}, {"n": 80, "title": "耗墨窥私，分赃暗契", "synopsis": "穹顶之上，冯敬尧奉命升起钦天监「巡天留影宝镜」，梁崇山负手冷笑揭破毒计：只需再等半个时辰血祭抽干地脉，留影镜便会将「截天剑宗司律勾结南荒妖女屠灭荒州生灵」的铁证传遍九州，届时少监赵景曜便可名正言顺发兵踏平苍梧山！强攻反震、做空连坐、退守被污的三重绝境压顶，晏怀瑾抹去唇角血迹，果断耗费3滴勘误墨气对梁崇山与木鹿狰的气机连接作深度推演！青铜竹简翻页渗血，一针见血点破庄家私弊：梁崇山名为奉旨清盘，实则贪图化神机缘，背着赵景曜与木鹿狰私签了一纸瓜分七成地脉本源的「阴阳分赃背契」——一旦此契在巡天留影镜前曝光，不用外人动手，金册正卷与乌骨叛巫便会先一步反目成仇！"}, {"n": 81, "title": "挑袖夺契，镜前亮赃", "synopsis": "内室越流萤冲击古巫真丹尚余两刻半钟，穹顶巡天留影宝镜已将前殿画面实时投向荒州及邻州各大宗门。断去左臂的木鹿狰急于抢功，挥动白骨权杖率众猛扑内室门槛。晏怀瑾不退反进，命公孙妙轰出三团紫金雷火浓烟遮蔽两侧视线，燕惊弦斜刺里快剑逼退侧翼护卫；木鹿狰欺近五步举杖砸落的刹那，晏怀瑾硬扛元婴威压递出惊蛰剑，寒光不取咽喉，精准划裂木鹿狰空荡荡的左袖暗袋，剑尖挑出那纸盖着镇守私印的「阴阳分赃背契」，振腕直射穹顶留影宝镜正中！梁崇山背着仙朝私吞七成地脉龙髓的铁证，当场映入八州万千修士眼帘。"}, {"n": 82, "title": "弃卒灭口，巫监反目", "synopsis": "分赃背契当众曝光，高悬半空的《奉天承运金册》荒州镇守正卷金光剧烈紊乱，随时可能判定梁崇山盗卖皇产。梁崇山当机立断弃卒保帅，厉喝一声「妖巫伪造本使私印」，反手一记元婴巅峰皇道重掌狠狠印在木鹿狰后心！木鹿狰本就断臂挂彩，猝不及防被震碎半边肩骨呕血飞跌。眼见盟友翻脸灭口，木鹿狰目眦欲裂捏碎乌骨血幡，喝令麾下死士掉头扑向钦天监旗阵，两股人马在前殿疯狂火并！混战中乌骨骨将掷出重锤，将冯敬尧操控的巡天留影宝镜当空砸得粉碎，梁崇山借机再补一掌将木鹿狰拍落祭坛深坑。"}, {"n": 83, "title": "斩杖稳枢，墨添双滴", "synopsis": "白骨权杖邪煞灌入地脉副枢，整座内坛剧烈摇晃，内室圣火台受波及火光乱颤。趁梁崇山清理乌骨残党之际，晏怀瑾纵身掠上中央石台，十五息窗口内惊蛰剑连点七处杖身骨节，剑锋所附的地肺阴火纹嗤啦烧断乌骨咒丝；公孙妙紧随其后将三枚噬铁定脉钉打入副枢泄压槽，硬生生摁住暴走的地脉煞气。随着栽赃铁局被破、巫监同盟瓦解，晏怀瑾识海《春秋勘误录》温光流转，新凝2滴勘误墨气（储量回升至4滴）。另一边，梁崇山冷酷击毙木鹿狰与残余黑巫，决意杀人灭口独吞整座古祭坛。"}, {"n": 84, "title": "隔门渡元，真丹破茧", "synopsis": "梁崇山以自身元婴沟通镇守正卷筑起气运法坛，尚需半刻钟彻底锁死大殿空间。此时内室迎来最凶险的成丹关头，九黎煞脉积压百日的阴寒反噬猛烈冲击越流萤心脉，腕间同命血蛊契滚烫欲裂。晏怀瑾守在门外谨记不窥之诺，反手将左掌按上冰冷石门门框，不惜分出三成温润剑骨精元顺血契渡入她经脉，口中用平直冷肃的声线低诵自己曾朱砂批注过的清心戒律替她定锚。门内越流萤指尖紧扣心口那枚折成同心胜的戒律纸页，借他沉稳脉搏一举震碎百日煞锁，丹田内紫金巫火轰然坍缩凝成一颗璀璨夺目的「古巫真丹」！"}, {"n": 85, "title": "金坛压顶，双锋合试", "synopsis": "越流萤白纱翩然掠至晏怀瑾身侧，替下浑身浴血的公孙妙与燕惊弦。此时梁崇山已立于十丈高的赤金「钦天气运法坛」顶端，元婴巅峰威压混合皇道龙气如山倾泻。晏怀瑾与越流萤心意相通率先试招——越流萤抬手甩出真丹级「九黎惑心巫火」，紫金火浪无视龙气反震当场焚断两条皇道锁链；晏怀瑾惊蛰剑紧随火浪直刺法坛底座！孰料剑气轰中坛基的刹那，梁崇山毫发无伤，脚下荒州地脉总枢却猛烈塌陷三寸，震得穹顶乱石如雨——梁崇山竟把整座气运法坛的泄力阵根死死焊在了荒州十二城地脉大动脉上！"}, {"n": 86, "title": "两墨寻枢，断脐定策", "synopsis": "皇道镇山印虚影寸寸下压，公孙妙催动满是裂纹的紫金雷火炉死顶头顶重压，地面青砖尽数粉碎。既不能束手待毙，更不能震塌荒州地脉殃及无辜凡俗，晏怀瑾冷静耗费2滴勘误墨气（余2滴）凝视法坛底部气机流向。《春秋勘误录》红批立现：梁崇山先前为与木鹿狰私分七成龙髓，曾在内室淬龙池底私凿了一条「阴阳嫁接暗槽」，正是连接镇守正卷与荒州地脉的唯一脐带！只需越流萤以真丹圣火烧熔暗槽巫咒，晏怀瑾同步吸干池底剩余四成庚金龙髓重铸惊蛰剑一剑断脐，便可令地脉毫发无伤脱离正卷，但入池铸剑至少需争取十息死守时间！"}, {"n": 87, "title": "炸炉封路，双杰护关", "synopsis": "梁崇山被冯敬尧提醒，脸色骤变，当即分化三杆元婴龙气长枪直射内室拱门，并驱使冯敬尧率最后三十名精锐缇骑亡命冲锋阻截！千钧一发之际，三师姐公孙妙一把推开晏怀瑾，骂骂咧咧大笑一声「师姐这口破炉子早看腻了」，反手将陪伴自己十年的私房紫金雷火炉狠狠砸在拱门通道正中，逆转核心阵盘引爆满炉雷火精粹！轰天紫雷瞬间熔毁两杆元婴龙枪、将冲在最前的十余名缇骑掀翻在地；十四岁的燕惊弦将鸣霜剑插进门槛石缝，横身挡住第三杆龙枪余波口吐鲜血仍死死顶门，嘶声喊出「请司律大人铸剑」！晏怀瑾深深看了一眼师姐与少年，携越流萤疾掠入池。"}, {"n": 88, "title": "巫火剥契，地脉脱钩", "synopsis": "内室池底沸腾如海，越流萤双掌径直按入灼热的阴阳嫁接暗槽，催动初成的古巫真丹喷薄纯正九黎圣火，滋滋烧穿木鹿狰残留的血祭嫁接咒纹，白皙手背被皇道余威灼出道道血痕仍纹丝不动。同一瞬，晏怀瑾跃入地心淬龙池心，任凭剩余四成万载庚金龙髓如万剑穿心般灌入残缺的「惊蛰」剑身，在暗槽咒纹熔断的刹那人剑合一重重劈在「断脐契眼」之上！轰隆一声地底闷响，被强行绑架的荒州十二城地脉彻底挣脱金册枷锁，稳稳沉归大地深处！外殿梁崇山脚下气运法坛瞬间失去地脉供能，狂暴反震震得他七窍溢血，逼得他彻底发狂祭出同归于尽的禁招！"}, {"n": 89, "title": "献寿请神，巫火独扛", "synopsis": "献祭三十年元婴寿元换来的「皇道紫微龙气法相」高达十丈，散发着货真价实的化神初期毁灭威压，一戟横空劈碎内室石墙，金色戟芒直取刚斩断契眼、正处新旧剑气交替空档的晏怀瑾头顶，连带前殿重伤的公孙妙与燕惊弦一并笼罩！避无可避的死局一瞬，越流萤毫不犹豫闪身挡在晏怀瑾正前方，指尖疾点眼尾暗扣强冲开第一重眼脉内封，不惜折损刚凝成的古巫真丹本源，逆燃起漫天凄艳的紫金少司命圣火化作火凤护盾，硬生生架住了化神龙气法相这必杀一戟！狂暴冲击震得她五脏移位、鲜血染透胸前衣襟，却借同命契死死锁住护盾不肯散去半分。"}, {"n": 90, "title": "碎令唤剑，师兄护短", "synopsis": "龙气法相高举金戟再度压落，梁崇山狞笑断定荒州绝无人能挡仙朝化神天威。晏怀瑾双目寒彻骨髓，右臂稳稳揽住摇摇欲坠的越流萤将她护入怀中，左手五指猛然发力，咔嚓捏碎贴身珍藏的「苍梧残剑令」！三百里外苍梧山主峰，正在山门慢条斯理端茶待客的代掌教孟观澜神色骤寒，搁下粗陶茶盏并指一划——一道横贯荒州天幕的化神中期苍古重剑虚影直接撞碎幽墟穹顶，伴随着孟观澜温和却森冷彻骨的一句「本座的小师弟，也是钦天监阿猫阿狗能动的？」，重剑摧枯拉朽将十丈皇道紫微龙气法相从头到脚劈作两半！法相崩碎反震得梁崇山狂喷鲜血跌跪坛顶。"}, {"n": 91, "title": "惊蛰重铸，越阶斩坛", "synopsis": "孟观澜隔空一剑耗尽残剑令灵机消散，重伤的梁崇山见状眼中闪过侥幸，疯狂催动残存元婴巅峰灵力注入脚下气运法坛，妄图携镇守正卷遁逃回禀中州。晏怀瑾将越流萤轻放于公孙妙身旁，握紧融合了地肺阴火、双生太岁精气与万载庚金龙髓重铸而成的「惊蛰」新锋，果断耗尽识海最后2滴勘误墨气！红批瞬间锁死法相碎裂在镇守正卷上撕开的反噬命门——晏怀瑾体内金丹剑意轰然冲破桎梏迈出半步元婴气象，人随剑起化作一线截断天机的赤金惊雷，不斩梁崇山肉身，直接一剑贯穿气运法坛核心阵枢与镇守官印！正卷当场判定镇守失职崩盘，狂暴龙气反噬瞬间抽干梁崇山元婴本源！"}, {"n": 92, "title": "废敌收档，卷二初启", "synopsis": "气运法坛崩塌，失去官印与元婴修为的梁崇山如死狗般瘫在废墟中，妄图扒墙逃窜的冯敬尧亦被燕惊弦追上一剑挑废丹田生擒。至此，幽墟古祭坛血祭灭州与嫁祸剑宗的滔天死局被彻底掀翻！晏怀瑾识海内《春秋勘误录》青铜简页大放光明，一口气凝聚出足足8滴璀璨勘误墨气，其中3滴墨气自行没入青铜简身第二道锈锁，咔哒开启竹简第二卷「连环勘契篇」（自此可推演跨宗门连环联保子母契坏账，余5滴墨气）！清点战场缴获四千中品灵石与满地灵材之余，晏怀瑾打开坛心滚出的暗金密档，看清了赵景曜针对截天剑宗本山布下的下一记杀招。"}, {"n": 93, "title": "双池补本，半步元婴", "synopsis": "密档事关宗门根本，返程前须先稳住全员伤势。晏怀瑾抱起虚弱的越流萤重返内室，引圣火台余韵与珍藏的双生太岁灵液替她滋养受损的真丹本源，自己则借淬龙池残余精气一鼓作气炼化金丹第二道裂痕内的紫微暗钉——金丹第二道枯荣裂痕彻底愈合（仅剩最后一道浅痕，全力出剑窗口跃升至三十息），修为稳稳停驻在「半步元婴」之境！水雾氤氲间，恢复元气的越流萤在僻静处轻轻解开外层覆纱暗扣透气，隔着薄雾凝望近在咫尺替她护法的晏怀瑾轮廓，在他转眸前又乖巧系好白纱，只伸手拽住他袖口低声道下回绝不准再把她丢给旁人照看。"}, {"n": 94, "title": "立碑洗冤，红榜传名", "synopsis": "崖顶之上，岑铁崖等荒州九派掌门见晏怀瑾四人提着瘫废的梁崇山与冯敬尧平安出墟，无不凛然拜服。晏怀瑾按镇契堂章程，将冯敬尧与拓印的百份「阴阳分赃背契」交给九派当众竖立荒州公证碑，彻底堵死钦天监污蔑截天剑宗通巫毁脉的借口；梁崇山本尊则由镇契堂秘密押解作日后反攻筹码。与此同时，中州钦天监总坛内，温文尔雅的少监赵景曜看着碎裂的荒州镇守命牌，不但未怒，反而饶有兴致地提笔将「截天剑宗晏怀瑾」添入中州必杀红榜前列，传令沧溟大档头即刻收网，拿截天剑宗山底剑冢试一试新升级的七派联保铁桶阵！"}, {"n": 95, "title": "勾账留根，昂首归山", "synopsis": "一行四人乘缴获的钦天监快舟昼夜兼程赶回苍梧山。船舱内，公孙妙用战利品中的赤金灵铁重铸升级奇门炉匣，燕惊弦日夜擦拭鸣霜古剑期盼拜入寒鸦崖门墙；晏怀瑾取出第7章写下的那张一千五百灵石药材欠条，以「越流萤幽墟挡戟有功」为由一本正经用朱砂划去八百灵石债额，反被越流萤隔着白纱按住笔杆，轻笑央求司律大人莫要全销，好留着债根罚她在镇契堂掌一辈子灯。晏怀瑾指腹微顿，冷淡收起欠契默许。第五日破晓，苍梧山熟悉的凛冽雪峰刺破云层，山门外赫然横亘着三艘气势汹汹的跨州巨舰！"}, {"n": 96, "title": "三派逼门，师兄讹茶", "synopsis": "苍梧山门迎客亭前，沧澜剑阁贺钧、玄岳宗韩百川与赤霞谷钟离烈三大金丹元婴使者仗着钦天监「七派连环联保子契」撑腰，逼代掌教孟观澜十日内签下灵脉托管契。话音未落，晏怀瑾踏剑落入亭中，半步元婴的凛冽截脉剑意轰然散开，随手将荒州镇守使梁崇山崩碎的半块紫金官印扔在石桌上！三派使者认出镇守官印吓得脸色煞白；孟观澜顺势端起粗陶茶盏叹穷，掏出三百年前救过三派祖师的泛黄古盟约，笑吟吟讹了三派八百中品灵石「惊吓修山茶水费」，堵得贺钧三人灰溜溜退往外峰客院候信。转过身，孟观澜神色凝重地道出山底异变。"}, {"n": 97, "title": "惊弦入律，暗启剑冢", "synopsis": "阔别两月重返寒鸦崖镇契堂，青铜兽首长明灯再度燃起暖光。晏怀瑾按门规主持燕惊弦敬茶入堂礼，正式赐其镇契堂执律剑卫腰牌，命他留守寒鸦崖协助大师兄孟观澜盯防外峰三派使者；自己则与公孙妙、越流萤定于子夜密探后山底部的「九幽剑冢」。西侧耳房内，越流萤一如初见雪夜般摸索着进堂添灯油，晏怀瑾却未再扣腕搜检，只将一枚刻着镇契堂暗纹的随行护法玉牌塞进她掌心，冷声交代剑冢煞重须寸步不离。子夜时分，孟观澜亲自替三人打开寒鸦崖后山尘封百年的剑冢重锁，门轴内侧的新鲜刮痕令众人眼神俱凛。"}, {"n": 98, "title": "封灵煞雾，同契深鸣", "synopsis": "三人顺石阶深入苍梧山腹「九幽剑冢」外围，浓郁如墨的九幽封灵煞气扑面而来，将晏怀瑾与公孙妙的正统灵力压制六成，神识锁死在三丈之内。上古折剑煞气与越流萤体内的古巫真丹剧烈摩擦，两人腕间的「同命血蛊契」骤然泛起赤金双色涟漪，正式跨入「深层共鸣期」——越流萤指尖不慎被岩壁残剑锋芒划破一线，晏怀瑾左手指腹竟同步浮现一抹刺痛，连她骤然加快的心跳与暗喜情绪都分毫不差映入他心湖！晏怀瑾耳根微不可察一热，板着脸搬出「防走散损耗战力」的公事借口，倒转惊蛰剑鞘递入她手中牵引前行，前方煞雾却猛然炸开凄厉剑啸！"}, {"n": 99, "title": "拔钉收灵，古壁藏咒", "synopsis": "数十道历代古剑残灵并非存心弑主，而是剑脊被人恶意钉入了钦天监特制的「引煞金钉」。硬斩必毁宗门先辈遗剑，公孙妙当即祭出新改装的「归鞘引剑磁盘」吸附剑体，晏怀瑾借同命契共享越流萤敏锐的听风巫觉，在三丈浓雾中精准出指连拔三十六枚金钉，以镇契剑印安抚残灵归位，更获先辈残灵馈赠半卷失传的《截天古剑谱》！休整间隙，越流萤在石廊角落抚过一幅三百年前剑巫共守的残缺壁画，指尖微颤，暗中将壁画末尾「以少司命圣火逆冲契眼、独镇火眼替同契人扛九成天罚」的禁术死死刻入心底；待晏怀瑾走近询问，她神色温顺轻笑，谎称只是寻常暖脉古咒。"}, {"n": 100, "title": "卷二勘脉，内鬼露相", "synopsis": "护宗剑脉主槽边，一名身披黑袍的剑宗内鬼正配合一道钦天监沧溟分神虚影，用赤金锁链强抽九幽剑冢底部的护山龙脉气机，灌入一纸伪造的质押契书！晏怀瑾催动识海《春秋勘误录》刚解锁的第二卷「连环勘契篇」，耗费1滴勘误墨气（剩余4滴）推演锁链因果——红批瞬间贯通全局：赵景曜麾下沧溟大档头竟收买剑宗宿老，妄图偷拓九幽剑冢龙脉气机充作「沧溟百宗会盟」七派联保母契的底层抵押物，一旦成契，无需攻山便可借金册强行划走截天剑宗根基！晏怀瑾眼神冰寒拔出惊蛰剑，三十息半步元婴剑虹悍然斩碎钦天分神与盗脉母柱，剑风直削黑袍内鬼面门！"}], "chapters": [{"n": 1, "title": "雪夜掌灯，血契初现", "body": "苍梧山的风雪一入子夜便像淬了寒铁，顺着镇契堂殿门的缝隙往里刮，吹得案角那盏青铜兽首长明灯焰心直晃。\n\n晏怀瑾端坐在黑漆书案后，左手按着一叠刚从外门清查收回的罚没死契，右手执朱砂笔，一笔一划核对契尾的灵石数目。堂内没烧炭盆，不是镇契堂守规矩不许取暖，而是截天剑宗公账上满打满算只剩八十块中品灵石，护山剑阵每日吞吐都要精打细算，实在烧不起半篓暖阳炭。\n\n笔尖刚勾完最后一道红痕，丹田深处忽然掠过一阵寒刃刮骨般的剧痛。\n\n晏怀瑾脊背微绷，握笔的五指猛地收紧，指节泛出冷白。三年前外敌趁夜奇袭苍梧山，老剑主闭死关未出，他以金丹初期修为强行越阶拔剑护山，人是劈退了，自己金丹上却永远留下了三道横贯本源的折剑枯荣劫裂痕。\n\n自那夜起，他的寿元便被死死锁在了三年大限之内。平日审契巡山尚能压住，一旦全力催动金丹后期剑意，绝不可超过十息——多出一丝，金丹裂痕便要扩张一分，当场折去十日阳寿，浑身经脉更会冷得握不住剑。\n\n喉头涌上一股铁锈腥甜。晏怀瑾偏过头，借着宽大皂衣袖口掩住唇角，硬生生将那口逆血咽回腹中，唯有指尖渗出的一缕淡金剑骨精血，被穿堂寒风一卷，化作肉眼难辨的血雾散入空气。\n\n书案右侧的剑架上，本命剑惊蛰发出一声极轻的嗡鸣。那柄曾饮尽来犯强敌鲜血的长剑，如今剑尖缺了一小角，在幽暗灯火下透着股不肯弯折的冷厉。\n\n就在那一缕剑骨精血逸散的刹那，晏怀瑾眉心猛地一跳。\n\n识海深处，一卷沉寂了二十余年的祖传青铜竹简骤然发烫。斑驳铜绿间渗出丝丝缕缕的暗红血线，竹简无风自动，缓缓摊开第一页。\n\n上头赫然浮现出《春秋勘误录》五个古篆，底部凹槽里静静悬着一滴幽黑如渊的勘误墨气。\n\n晏怀瑾呼吸微滞。这卷竹简自他记事起便寄宿识海，无论用神识如何冲刷都纹丝不动，没成想竟在折剑旧伤引动死劫气机的这一刻醒了过来。不待他细探，竹简空白处便如冷酷史官执笔断狱，一行行刺目的朱砂红字疾书而出：\n\n【大乾历三百一十二年冬，截天剑宗司律晏怀瑾折剑伤发，寿余三载。】\n【勘误其一：钦天监少监赵景曜执金册清盘八州，截天剑宗已列气运坏账，三载之内，山门必覆，鸡犬不留。】\n【勘误其二：堂西掌灯盲女越流萤，实怀南荒巫脉，每夜借兽首灯芯暗引司律逸散精血，私结同命血蛊契。今夜子正血玉将满，若挥剑杀之，巫火顺契倒灌，金丹立碎；若纵之不理，命脉尽落人手。】\n\n红字落定，底部凹槽内那滴勘误墨气微微一颤，并未消散。这竹简既不曾凭空赐下什么疗伤仙丹，也没吐出半件神兵法宝，只在关乎生死的节点亮出冷冰冰的病灶批注——至于如何从死局里杀出活路，全看执剑人自己怎么选，唯有亲手逆改既定死劫，方能凝出新的墨气推演后招。\n\n晏怀瑾眼底寒意一寸寸沉了下去，面上却连眉头都没皱一下。\n\n钦天监少监赵景曜的名字，他并不陌生。近十年来，大乾仙朝钦天监仗着《奉天承运金册》向大荒各州宗门放贷皇道气运，谁签了托管契，灵脉便成了仙朝囊中物；截天剑宗骨头硬，大师兄孟观澜宁可端着豁口茶碗哭穷也不肯按手印，早已被州府官面联手排挤到了山穷水尽的地步。\n\n只是他万万没料到，连镇契堂西侧耳房里那个一年前从山脚雪窝捡回来、双目覆着白纱的柔弱罪女，竟也是冲着他的命脉来的。\n\n叩、叩。\n\n走廊尽头传来竹杖轻点青砖的细碎声响，伴随着女子刻意放轻的呼吸，一下一下由远及近。\n\n晏怀瑾不动声色地收回神识，指尖随手拈起一页废契挡在眼前，连呼吸频率都维持着旧伤初平时的微促，唯有右手拇指悄无声息搭上了案侧惊蛰剑的剑格。\n\n“司律大人，子时过了。”\n\n门帘微挑，一道单薄素白的人影扶着门框迈入堂内。少女约莫十八九岁年纪，身着洗得发白的粗麻罪衣，双眼严严实实缠着三层素净白纱，只露出秀挺鼻梁与一点没什么血色的唇。她左手提着一只黄铜添油壶，右手捏着修剪灯蕊的细银剪，摸索着朝堂心那座青铜兽首长明灯走来，尾音带着几分怯生生的轻颤：\n\n“外头雪大，长明灯的油快熬干了。罪女替堂里添完油、剪了焦蕊便退下，绝不扰大人审卷。”\n\n一年三百六十夜，越流萤每晚都是这副温顺守礼的模样。因着她眼盲体弱，修为又只有堪堪筑基初期的微末底子，堂中执事只当她是个抵债干杂活的可怜人，从无人起疑。\n\n此刻晏怀瑾凝目看去，借着幽微灯火，三息之内便从那盏青铜兽首灯上瞧出了端倪——\n\n长明灯燃的是镇压凶剑煞气的寒鲸油，寻常灯灰理应呈惨白色；可眼下那截焦黑灯蕊根部，竟隐隐缠着一缕极细的暗红丝线，正随着他方才散入空气的剑骨精血微微翕张，将血气一丝不漏地往下引去！\n\n十步。七步。三步。\n\n越流萤举步停在灯台前，白纱覆面的脸庞微微偏侧，似乎在凭热气分辨火苗方位。她温顺地垂着颈子，先提起黄铜壶沿灯盏边缘添了半勺清油，随即探出捏着银剪的右手，纤白指尖看似不经意地朝那截缠着血丝的灯蕊根部捻去。\n\n就是现在。\n\n原本靠在椅背上的晏怀瑾骤然暴起，身形未见如何作势，左手已如铁钳般破风探出，精准无比地扣死了越流萤的右手腕脉！\n\n“哐当！”\n\n细银剪脱手砸落青砖，溅起一串脆响。\n\n越流萤浑身剧震，像是被吓破了胆的小兽，下意识想要缩手后退：“司律大人……罪女可是剪错了灯蕊？”\n\n晏怀瑾一言不发，五指力道沉稳如铁，金丹后期的雄浑灵力瞬间封死她腕间三寸气机，令她半点巫术都催动不得。低头的电光石火间，他目光扫过少女被扣住的手背，视线忽然在她右手虎口处顿了一瞬。\n\n那里横着一道浅淡的新月形旧疤。\n\n三年前寒鸦崖大雪封山的那一夜，他巡山归来，曾在一处冰缝里随手救起过一个快要冻僵的垂死孤女，临走只留下一截压煞的断剑穗。那孤女抓住他衣角时，虎口似乎也裂着这样一道血口……\n\n念头只是一闪，便被晏怀瑾冷冷压下。寒鸦崖流民何止百千，眼下不是追忆旧事的时候。\n\n“按镇契堂第七律，私动堂内镇煞灯器者，断指。”\n\n晏怀瑾声音平直冷肃，听不出半分喜怒。他左手死死扣着越流萤腕脉，右手直接探向滚烫的青铜兽首灯底座，全然不顾炙人高温，扣住兽口下方一道极隐蔽的逆鳞机括，五指发力猛地一拧！\n\n咔哒。\n\n机括崩断，滚烫的青铜暗格应声弹开。一枚鸽卵大小、通体布满诡异紫红血纹的古旧巫玉从灯座夹层跌落出来，骨碌碌滚过黑漆书案，停在那叠死契边缘，玉髓深处赫然封着大半团尚未化开的淡金剑骨精血！\n\n晏怀瑾看都没看那枚巫玉一眼，右手顺势抄起案头沉甸甸的镇契堂执律契印，重重往阵枢上一落。\n\n轰隆一声闷响，大堂四面厚重的包铁楠木门同时落下千斤断龙闩，层层叠叠的隔音封禁符纹亮起幽光，将外头呼啸的风雪与整座苍梧山的耳目彻彻底底隔绝在外。\n\n堂内灯影暴涨又骤缩。\n\n晏怀瑾居高临下俯视着近在咫尺的白纱少女，正欲开口审问这南荒同命血蛊契的底细，掌心却忽然传来一丝极其细微的异样触感——\n\n随着他扣紧腕脉的力道加重，原本应该惊惶发抖、拼命挣脱的装盲少女，那截微凉纤细的指尖非但没有往后缩，反倒顺着他的指缝轻轻往里探了半寸，若有似无地勾住了他的掌心。"}, {"n": 2, "title": "苦肉求钉，缇骑叩门", "body": "微凉的指尖贴着掌心剑茧轻轻一划，像一片落进寒潭的羽毛，半点不似误触。\n\n晏怀瑾眸光骤冷，左腕猛地一震，雄浑剑气顺着指腹一吐即收，当场将越流萤的五指震开，反手把她整条右臂死死摁在冰冷的黑漆书案边缘。\n\n“在本座面前收起这套把戏。”\n\n他右手两指夹起案上那枚滚烫的血纹巫玉，指尖逼出一缕细若游丝的金丹剑气，毫不客气地刺入玉髓深处试探虚实。\n\n嗡——！\n\n血纹巫玉骤然腾起一圈妖异的暗红涟漪。几乎在同一瞬息，晏怀瑾只觉自己心口与越流萤被摁住的右腕同时一跳，两道截然不同的脉搏竟隔着尺许空气严丝合缝地叠在了一处！\n\n百丈之内，心脉急缓、气血盈亏乃至生死方位，清晰得如同掌上观纹。剑气再往巫玉核心深刺半分，一股霸道绝伦的南荒古咒反震之力陡然炸开——咒理结构极其歹毒偏执：契主晏怀瑾生则同生，一旦晏怀瑾身死道消，巫玉内的九黎咒火便会瞬间焚尽越流萤心脉拉她陪葬；可若是有人在未解开原初契眼之前强行挥剑斩契，相连的神魂本源便会当场撕裂七成，纵是金丹剑修也得沦为神智尽毁的废人！\n\n晏怀瑾缓缓撤回那缕剑气，指腹摩挲着血纹巫玉冰凉滑腻的表面，眼底最后一点侥幸彻底散尽。\n\n好一个同命血蛊契。拿她自己的性命做投名状，再拿七成神魂俱裂做连坐锁，硬生生把他这位镇契堂司律拖上了一条不死不休的贼船。\n\n“扑通”一声轻响。\n\n越流萤顺着他松开钳制的力道滑跪在青砖地上，单薄的素麻衣摆铺在冰冷地面，覆着三层白纱的脸庞低垂下去，露出一段脆弱得仿佛一折就断的雪白后颈。\n\n“司律大人恕罪……”她嗓音又轻又软，带着受惊过度的微颤，双手规规矩矩交叠伏在地上，“罪女自幼流落荒州边鄙，偶然从故去长辈遗物里捡到这半页护身血契残方。这一年来宗门灵谷日渐紧缺，外院执事几次三番提议遣散无用杂役……罪女眼睛看不见，下了寒鸦崖只有冻死喂狼一条路，一时糊涂，才斗胆借大人长明灯下的余威结契求活，绝无加害大人之心！”\n\n一套说辞合情合理，把走投无路的孤女求生演得滴水不漏。\n\n晏怀瑾居高临下看着她，连声调都没起伏半分：“荒州边鄙捡来的粗浅残方，能瞒过镇契堂镇煞长明灯，连本座金丹后期的剑骨精血都引得动？越流萤，按镇契堂第五律，口供不实者，罪加一等。”\n\n堂内死寂了两息。\n\n长明灯啪地爆开一朵灯花。跪在地上的少女肩膀轻轻抖了一下，似乎终于明白眼前这位铁面司律根本不是寻常苦情话术糊弄得过去的。\n\n可她非但没有起身逃向耳房，也没有磕头哭喊求饶，反而摸索着抬起左手，一把撩起了自己右臂宽大的粗麻衣袖。\n\n一截细瘦苍白的小臂暴露在森寒空气里，连青色血管都清晰可见。\n\n越流萤仰起覆着白纱的脸，精准朝着晏怀瑾立足的方向，声音轻柔却字字清晰：“大人断案如神，罪女不敢再狡辩。这血契确是南荒秘传，一旦结成便解不开，唯有每日取罪女心头血温养巫玉，待三年契力自行消磨方能无损剥离。罪女自知犯下死罪，不敢求大人轻饶——只求大人按镇契堂重犯规矩，赐罪女三枚碎骨钉钉入琵琶骨，将罪女锁在后堂日夜赎罪！”\n\n话音落下，她竟真的挺直纤薄脊背，主动把那截毫无防备的手腕高高举到了书案前。\n\n晏怀瑾目光落在案角那只盛放刑具的玄铁匣上，拇指在惊蛰剑冰冷的剑格上轻轻叩了一下。\n\n镇契堂的碎骨钉专钉叛宗重犯，三钉入骨，日夜如万蚁噬髓，筑基初期的微末身子骨挨上一枚便要废去半条命。这丫头嘴上求的是酷刑，算盘却打得比谁都精——其一，她笃定截天剑宗门风端正，他晏怀瑾从不滥用私刑折磨一个毫无还手之力的盲女；其二，同命血蛊契刚成，她若被碎骨钉重创气脉，难保不会引动巫玉反扑伤及他的金丹；只要这三枚钉子打下去或者免下去，她便算彻底过了明路，顺理成章在镇契堂扎下根来！\n\n以退为进，拿自己的皮肉骨血当筹码赌他心软守规矩。\n\n“收起你的袖子。”\n\n晏怀瑾连玄铁刑匣的盖子都没碰一下，冷声道：“镇契堂的碎骨钉每一枚皆由寒铁精炼成，造价三块下品灵石，钉在你身上，纯属糟蹋宗门公物。”\n\n越流萤举在半空的手腕微微一僵，白纱下的唇瓣极轻地抿了一下。\n\n“血纹巫玉暂由本座封存。”晏怀瑾提笔在案头宗卷上疾书两行，语气公事公办得像在清点一桩死物，“在查清无损解契之法前，你一步不准踏出镇契堂西侧耳房，每日寅卯二时受本座剑气核查脉象。敢再碰长明灯半滴灯油，本座宁可损去七成神魂，也先挑断你的手筋——听清楚了？”\n\n越流萤垂下眼帘，拉好粗麻衣袖，温顺无比地深深叩首：“罪女……谢司律大人不杀之恩。”\n\n最后一个“恩”字尚未落地——\n\n当！当！当！\n\n苍梧山前山方向，陡然撞响三声急促刺耳的警山钟鸣！钟声穿透漫天暴雪，震得镇契堂檐角冰棱簌簌坠落，摔得粉碎。\n\n按截天剑宗门规，唯有仙朝州府大员强闯山门、或是大敌压境时，值守弟子才会连撞三响急钟！\n\n越流萤伏在地上的指尖猛地蜷紧。晏怀瑾眼神一凛，袖袍一拂震开内侧耳房木门，冷声喝道：“滚进耳房待着，没本座钧令，连呼吸都给我放轻！”\n\n越流萤不敢怠慢，摸索着快步退入西侧耳房掩上门帘。晏怀瑾反手将血纹巫玉收入怀中，解开正堂外层隔音禁制的一道缝隙，缓步走到前窗格栅后凝目外望。\n\n只见寒鸦崖陡峭的石阶尽头，十余骑披挂玄黑重甲、腰佩绣春锁灵刀的精锐骑士正踏碎积雪疾驰而至！马蹄裹着赤铜破禁蹄铁，将剑宗清扫干净的山道踩出一串刺目裂痕。\n\n为首一名满脸横肉的独眼校尉勒住妖马，径直停在镇契堂外院木栅前，高高举起一卷流淌着赤金龙纹的官面敕令，滚滚灵力裹挟着倨傲喝声炸响在风雪夜空：\n\n“大乾钦天监荒州缇骑校尉卢铮奉上峰钧令办差！查尔等截天剑宗镇契堂内，私匿南荒逃亡巫女越流萤！识相的速速打开堂门，将嫌犯押出当场割腕验血，若有半刻迟误，视同抗旨窝藏异端！”\n\n随行引路的一名剑宗外门执事早已被那股官威吓得面无人色，连滚带爬跟在马后赔笑。\n\n窗棂阴影里，晏怀瑾眸光死死锁住卢铮手中那卷赤金敕令。深更半夜直扑后山镇契堂，连越流萤的名字都叫得一字不差，绝非临时搜山！\n\n心念电转间，他毫不犹豫催动识海《春秋勘误录》，将底部凹槽内仅存的那一滴勘误墨气彻底燃尽！\n\n幽黑墨珠轰然化开，青铜竹简上瞬间浮现出两行凌厉血批，随即便因墨气归零而彻底黯淡下去：\n\n【此令实为连坐杀局：一旦交人当众验出南荒巫血，钦天监立锁苍梧山门，以私通异巫铁证清盘剑宗灵脉！】\n【勘误异象：敕令底纹皇道龙气左下方第三折处，存一缕巫祝断笔缺口，非正统天命浑成之象。】\n\n巫祝断笔缺口？\n\n晏怀瑾心头记下这桩蹊跷，再抬眼时，外院风雪中卢铮已不耐烦地按住刀柄，朝着紧闭的镇契堂大门厉声暴喝：“晏司律！莫非截天剑宗真要做那通巫叛逆不成？给我拿人！”"}, {"n": 3, "title": "按剑镇堂，药奴归宗", "body": "咔嚓一声脆响！\n\n卢铮根本不等堂内回话，仗着大乾钦天监的赫赫凶威，抬脚便将镇契堂外院那排饱经风霜的青松木栅踹得四分五裂。十余名玄甲缇骑齐刷刷按刀逼上前庭，肃杀铁血之气混着风雪直扑正堂台阶。\n\n“晏师叔！晏司律啊！”\n\n随行的外门执事吓得双腿发软，扑到正堂门阶下急声哀求：“钦天监大人手里捧着荒州官令呢！不过是个捡回来掌灯的瞎眼丫头，咱们剑宗如今连护山大阵都快揭不开锅了，万万担不起私通南荒异巫的灭门大罪啊！您快把人交出去验个血，全宗上下也好落个清白！”\n\n西侧耳房内，仅隔着一道薄薄雕花木壁，外头的踹门声与执事哭喊声字字句句传进耳中。\n\n黑暗里，越流萤静静靠在冰冷墙角，缠着白纱的面容没有半分惧色，反倒冷清得吓人。她比谁都清楚自己血管里流着什么——一旦被钦天监的特制锁灵刀割破手腕，南荒巫血见风即燃，到时候莫说她活不成，整个截天剑宗与堂内那个人都要被扣上通巫铁帽万劫不复。\n\n她缓缓抬起左手，从粗麻袖口夹层里摸出一支寸许长的乌银细簪。簪尖隐隐泛着一丝幽紫巫火，只要往心口膻中穴轻轻一送，便能瞬间震碎全身血脉气机，烧成一具查不出巫脉痕迹的焦尸。\n\n不过是一命抵一恩罢了。\n\n越流萤唇角极轻地弯了一下，握紧乌银细簪，毫不迟疑地抵住自己心口衣襟往里刺去！\n\n一墙之隔的正堂内，晏怀瑾手腕脉门骤然传来一阵针扎般的冰冷悸动！\n\n百丈同命，心脉相连——耳房里那个女人竟在动自绝气脉的死念！她若此刻焚脉暴毙，九黎咒火顺着刚结成的同命血蛊契倒灌回来，不仅他金丹上的三道折剑裂痕当场要炸开，堂外卢铮更会借口剑宗杀人灭口，立刻发信号封锁整座苍梧山！\n\n“蠢货。”\n\n晏怀瑾眼底寒芒暴涨，甚至来不及推开耳房门喝止，左手一把扯过书案上一张空白的镇契堂黄麻官契，右手朱砂笔饱蘸灵血朱泥，龙飞凤舞疾书三行铁律条文，随即抓起沉重的司律主印，裹挟着一缕金丹剑意狠狠往契尾一盖！\n\n砰！\n\n朱砂大印落纸生辉，凛冽剑意顺势蒸干纸面朱砂墨迹，一道凌厉霸道的剑宗律契禁制顺着同命气机隔墙撞入耳房，硬生生震麻了越流萤捏着乌银细簪的五指，令那截簪尖停在心口半寸外再难寸进！\n\n同一息内，晏怀瑾抄起剑架上的残剑惊蛰，左手拎着剑气烘干的黄麻身契，一脚震开千斤楠木堂门，大步跨上风雪呼啸的石阶！\n\n“我看谁敢在镇契堂撒野。”\n\n清冷平直的嗓音不大，却如寒冬惊雷劈开漫天风雪。\n\n卢铮正欲挥手命麾下缇骑撞门，迎面只见一道修长冷峻的玄衣身影立于堂前高阶之上。青年面容白皙端肃，眼神冷得像寒鸦崖万年不化的坚冰，右手稳稳搭在腰间那柄缺角长剑的剑柄上。\n\n见卢铮脚步未停，晏怀瑾连多余的一句废话都没有，右手拇指往上一顶——\n\n锵！\n\n残剑惊蛰仅出鞘半寸！\n\n并未全力催动那要命的十息杀招，仅仅是金丹后期剑修千锤百炼的一线截脉剑威骤然泻出。庭院内飘落的鹅毛大雪在半空齐齐断作两截，地面青砖无声裂开一道笔直白痕，锋锐无匹的寒气直刺卢铮眉心！\n\n卢铮瞳孔骤缩，坐下妖马发出一声惊恐嘶鸣，前蹄高高扬起，带着他和身后两名筑基缇骑不受控制地倒退了半步，铁靴在覆雪石板上擦出刺耳锐响！\n\n“晏怀瑾！你想抗旨袭击仙朝命官不成？！”卢铮脸色涨得青紫，色厉内荏地高举手中赤金官卷，“本官奉钦天监敕令缉拿南荒嫌犯，你敢拦刀，便是满门谋逆！”\n\n“卢校尉嗓门不小，眼睛却不太好使。”\n\n晏怀瑾松开拇指，惊蛰剑咔哒一声落回剑鞘，仿佛刚才震退众人的根本不是他。他在风雪中一抖左手，将那张盖着鲜红司律主印、纸面干爽挺括的黄麻身契亮在众人眼前，声音冷肃铿锵：\n\n“看清楚了。越流萤并非无籍流民，而是本座三日前亲签入册的镇契堂试剑药奴！按截天剑宗镇契堂第三律，凡涉本堂清查内鬼死契一案的羁押药奴，在案卷核销结清之前，生死全归司律主事一人裁夺，任何人不得擅提！”\n\n那名跪在雪地里的外门执事愕然抬头，做梦也没想到向来不近女色、严苛守律的晏司律，竟会给一个掌灯盲女签下亲管药奴身契。\n\n卢铮冷笑一声：“少拿你们二流剑宗的家规糊弄本官！大乾律法大过天，钦天监提人，哪个宗门敢不放？”\n\n“好一个大乾律法。”晏怀瑾上前一步，目光如刀直指卢铮手中那卷赤金文书左下角，“卢校尉手里拿的，既非中州钦天监少监亲签的紫微拿人诏，也非州牧府会审铁券，不过是一纸荒州巡狩司签发的《协查逃巫令》。按仙朝与八州剑宗三百年前订立的苍梧旧盟，州府协查令跨界提审宗门在册药奴，须有本宗掌教真人亲笔副署用印——卢校尉，我家代掌教孟师兄的印信在哪？你拿一纸手续不全的半吊子白契，深更半夜踹我镇契堂外栅，本座便是现在一剑废了你的官刀，拿到荒州城主府评理，也是你越权擅闯在先！”\n\n一字一句，条理分明，偏偏全是照着钦天监自己定的官面章程往死穴上捅！\n\n卢铮脸上的横肉狠狠抽搐了两下。他本就是奉荒州巡狩行走贺兰枭之命，趁夜拿一份协查令来诈截天剑宗一回——若剑宗软弱交人，当场验出巫血便可顺势封山；哪曾想遇上晏怀瑾这么个既懂律例死角、剑又快得要命的硬茬子！\n\n他卢铮不过金丹初期修为，真要在没有金册副页锁血护身的情况下硬闯镇契堂，晏怀瑾十息之内绝对敢拿按律格杀擅闯者的名头斩下他一条胳膊！\n\n院中风雪呼啸，气氛僵凝如铁。\n\n足足过了五息，卢铮才重重冷哼一声，收起协查令，从怀中摸出一封封着火漆的玄铁公文，甩手掷在正堂石阶上：\n\n“牙尖嘴利！既然晏司律拿内鬼死契当挡箭牌，那本官便给你这个结案的机会！荒州坠龙墟那座原属你们截天剑宗的赤砂废矿，近来地火异动牵扯三十条散修命债，贺兰行走有令——限你镇契堂十日之内亲赴坠龙墟核清旧矿死契！过期不到，钦天监便按无主凶矿直接清盘封山！咱们走着瞧！”\n\n撂下狠话，卢铮猛一勒马缰，率领十余骑缇骑调转马头，灰溜溜踏着风雪退下寒鸦崖。那名外门执事更是吓得缩着脖子，连滚带爬跟着下山报信去了。\n\n直到马蹄声彻底消失在崖道尽头，晏怀瑾才弯腰拾起地上那封玄铁公文。\n\n就在他指尖触及公文的刹那，识海内原本干涸黯淡的《春秋勘误录》忽然发出一声清越轻鸣！\n\n先前浮现的“交人验血即遭封山清盘”那行死劫红字如冰雪消融般寸寸散去，取而代之的是一行古拙批注：【司律按剑拒令，破首重封山死局，勘误有功。】\n\n点点温润金芒自虚空汇聚，在青铜竹简底部凹槽内滴溜溜一转，赫然重新凝出了两滴饱满深邃的勘误墨气！\n\n果然，只要不顺着钦天监挖好的坑往下跳，这死局便有得改，墨气也有得赚。只是十日之内奔赴荒州坠龙墟……贺兰枭作为少监赵景曜麾下的得力恶犬，在矿坑那边摆下的只怕是真正的鸿门宴。\n\n晏怀瑾收起公文，按着惊蛰剑柄静立风雪之中，正盘算着明日如何带走耳房里那颗烫手山芋，身后却悄无声息。\n\n西侧耳房微掩的布帘后，原本应该双目失明、连路都要靠竹杖摸索的越流萤，正垂手捏着那支未能刺下去的乌银细簪，隔着素白轻纱，一眨不眨、分毫不差地凝望着风雪中青年按剑护门的挺拔背影。"}, {"n": 4, "title": "私死违律，师兄讹茶", "body": "寒鸦崖上的暴雪在寅时末渐渐歇了势头，只剩山风卷着碎雪沫子掠过残破的外院木栅。\\n\\n晏怀瑾将卢铮掷下的玄铁公文揣入怀中，提着惊蛰剑转身迈进镇契堂，反手合拢殿门。他脚步未停，径直走到西侧耳房外，伸手挑开了厚重的粗布门帘。\\n\\n耳房狭小阴冷，只摆着一张铺了干草的木榻与半截矮桌。听到靴声入内，原本立在门帘后的越流萤立刻退后半步，摸索着垂首福身，覆着三层白纱的脸庞温顺地低垂下来：\\n\\n“司律大人，外头的官爷……可是退走了？”\\n\\n她双手规规矩矩拢在洗得发白的粗麻袖口里，声音轻软平稳，听不出半分异样，只有藏在右侧袖管下的一缕极淡血腥气，没能逃过镇契堂主事的鼻子。\\n\\n晏怀瑾一句话没接，步履一错欺身上前，左手越过她微垂的肩头，一把扣住了她拢在袖中的右手手腕！\\n\\n“大人？”越流萤轻呼一声，指尖微缩。\\n\\n晏怀瑾两指并拢，顺着她粗麻袖口夹层一探一夹，寒光微闪间，已将那支寸许长的乌银细簪稳稳抽了出来。簪尖上幽紫巫火尚未散尽，还沾着一星鲜红血珠——正是方才他隔墙落印震麻她五指时，簪尖划破她掌心留下的血迹。\\n\\n耳房内安静得落针可闻。\\n\\n晏怀瑾捏着那支足以焚毁全身气机的毒簪，冷冷扫了一眼她渗血的掌心，随手将乌银细簪收进自己袖袋封死。\\n\\n“好得很。”他声音平直得没有一丝起伏，“前脚刚求本座免你碎骨钉留堂赎罪，后脚便在耳房里藏簪自绝。越流萤，你拿本座刚盖下的司律主印当废纸？”\\n\\n越流萤白纱下的睫羽轻轻颤了颤，苍白唇瓣微抿，低声道：“卢校尉带了锁灵刀上门，一旦割破罪女手腕验出南荒巫血，大人与截天剑宗都要受罪女连累背上通巫大罪。罪女贱命一条，若能烧干净了结案，总好过拖累大人……”\\n\\n“谁准你替镇契堂结案了？”\\n\\n晏怀瑾冷声打断，左手从案头取过一截浸过朱砂灵液的药奴红绳，毫不客气地套上她纤细的右腕，指尖引动剑气打了个死结：\\n\\n“给本座记清楚镇契堂第三律的下半句。自你名字入册那一刻起，你这条命、这身骨血便属镇契堂在编公产。未奉本座钧令擅自寻死毁损公物者，一律按叛宗重罪论处。再敢背着本座动半点轻生念头，不等钦天监验血，本座先拿锁魂链把你吊在寒鸦崖吹三天冷风。”\\n\\n话音落下，他松开手腕，顺手从怀里摸出一只青瓷小瓶，“啪”地搁在矮桌边缘。\\n\\n“下山前把掌心的口子涂干净。本座带药奴去荒州核查旧矿死契，没工夫沿途给你收尸。”\\n\\n说罢，晏怀瑾不再多看她一眼，转身掀帘迈出耳房，只留下一缕清冽如霜雪的剑气余韵。\\n\\n听着正堂那边重新响起翻阅卷宗的沙沙声，越流萤独自站在昏暗的耳房里，许久没有动弹。半晌，她才慢吞吞摸到桌角的青瓷小瓶拔开木塞，清苦醇厚的上等金疮药香顿时弥漫开来——这绝非外门杂役用的廉价止血散，而是金丹剑修随身备着的护脉灵药。\\n\\n少女苍白的唇角一点点弯起一抹极浅、极烫的弧度。\\n\\n她没有先涂掌心血口，而是缓缓抬起左手，勾住右腕上那截晏怀瑾亲手系上的朱砂药奴红绳，一圈、两圈、三圈，用尽全力死死缠紧在雪白腕骨上，直勒出一道深红印痕才肯罢休。\\n\\n公产便公产罢。既是入了晏司律的账册，这辈子都休想再把她销出去了。\\n\\n……\\n\\n天光破晓时，寒鸦崖的云雾裂开一线鱼肚白。\\n\\n镇契堂塌了半边的外院木栅还没来得及修补，一道修长青衫人影便踩着积雪晃晃悠悠踱了进来。来人三十出头年纪，发髻用一根寻常桃木簪松松挽着，眉眼温和带笑，手里还捧着一只磕掉了一小块瓷边的粗陶茶盏。\\n\\n“啧，昨夜风雪这么大，吹得镇契堂连院门栅栏都散架了？”\\n\\n未见其人先闻叹气。截天剑宗代掌教大师兄孟观澜迈进堂门，先往豁口茶盏里吹了吹早已凉透的茶叶沫子，苦着脸往客座上一瘫：“怀瑾啊，你可千万别找师兄批条子修栅栏。昨儿夜里我刚跟账房核过底，咱们截天剑宗公账上满打满算就剩八十块中品灵石，守山大阵每天一张嘴就要吞三块，后山粮仓穷得耗子都含着眼泪连夜搬家了……”\\n\\n正低头整理行囊卷宗的晏怀瑾眼皮都没抬：“卢铮率十余骑破禁妖马踏山，前山警钟连撞三响，师兄会睡得着？”\\n\\n“嘿，咱们家铁面司律就是不好糊弄。”\\n\\n孟观澜嘿嘿一笑，端着粗陶茶盏凑到书案前，变戏法似的往袖子里一掏，哗啦一声将一只鼓囊囊的灰布钱袋拍在了桌面上！\\n\\n袋口散开，里头整整齐齐码着五十块灵光澄澈的中品灵石。\\n\\n晏怀瑾动作微顿，抬眸看向自家大师兄：“哪来的？”\\n\\n“钦天监卢大校尉孝敬的修路茶水费啊。”孟观澜抿了一口凉茶，笑眯眯地眯起眼睛，半点看不出化神中期大剑修的宗师架子，“那独眼龙半夜踹坏你外院栅栏，下山时妖马蹄铁又把我山门牌坊底下第三块迎客青石踩裂了一道缝。师兄我天没亮就捧着三百年前仙朝太祖亲笔签的《苍梧互市古盟约》，往山门石阶上一坐——按古盟第十四条，外官无诏损毁剑宗祖制山石，当按上品灵玉折价十倍赔偿。他卢铮急着赶回荒州交差，又怕我真去荒州城主府敲登闻鼓丢钦天监的脸，只好咬碎牙掏光了随身私房钱。”\\n\\n晏怀瑾看着那袋沉甸甸的灵石，沉默片刻，伸手拨出二十块推了回去：“荒州核契来回十日，三十块中品灵石够用，余下的留给宗门维持护山剑阵。”\\n\\n“收着。”\\n\\n孟观澜手腕看似随意地一按，便将那二十块灵石连同钱袋一并推回晏怀瑾手边，脸上懒散的笑意一点点敛去。\\n\\n他放下豁口粗陶茶盏，目光扫过西侧紧闭的耳房门帘，没有多问半句掌灯盲女的事，只从贴身衣襟里取出一枚巴掌大小、边缘崩裂如断刃的古旧青铜剑令，轻轻按在晏怀瑾掌心。\\n\\n剑令入手微沉，内里蛰伏着一缕令人心悸的苍茫重剑剑意。\\n\\n“荒州坠龙墟那座赤砂废矿荒了二十年，贺兰枭早不查晚不查，偏偏拿卢铮那张破协查令逼你十日内下山，摆明了是少监赵景曜底下的人想在宗门护山大阵外头剪我的羽翼。”\\n\\n孟观澜拍了拍小师弟清瘦冷硬的肩头，声音温和却透着一股不容置疑的森寒杀气：\\n\\n“金丹同辈的场子，怀瑾自己拔剑去闯，师兄不拦你。可若是钦天监那帮不要脸皮的化神老狗敢以大欺小越界动你，别跟他们讲什么门规道理，直接捏碎这枚苍梧残剑令。你只管痛痛快快出剑，天塌下来，师兄先拿账本给你顶着。”\\n\\n晏怀瑾指腹触及残剑令粗糙的断口，丹田深处折剑裂痕传来的阵阵寒意仿佛淡去了几分。他没有推辞，郑重将苍梧残剑令贴身收妥，颔首道：“十日之内，怀瑾必携旧矿结案文书归山。”\\n\\n孟观澜这才重新弯起眉眼，端起凉茶准备再叮嘱两句路途琐事——\\n\\n轰隆！！\\n\\n一声惊天动地的炸炉巨响陡然从东峰守藏阁方向轰然炸开！整座寒鸦崖地面跟着剧烈颤了三颤，滚滚紫黑浓烟如蘑菇般直冲破晓云霄，紧接着便是一道风风火火、中气十足的女子叫喊声穿透山谷：\\n\\n“小师弟慢着下山！炉子虽炸了，师姐给你炼的保命宝贝成啦——！”"}, {"n": 5, "title": "师姐塞镜，古驿腥风", "body": "孟观澜手里的粗陶茶盏猛地一晃，凉茶泼了半袖子。\\n\\n这位连钦天监校尉都能面不改色讹诈的代掌教脸色微变，把茶盏往腋下一夹，拔腿就往堂外溜：“坏了，公孙师妹又把守藏阁后院的紫金炉给点炸了！怀瑾你自己应付她，师兄赶着去前山补那块裂石，先走一步！”\\n\\n话音未落，青衫一闪已没了踪影。\\n\\n一刻钟后，晏怀瑾背负惊蛰剑，领着提竹杖随行的越流萤沿东侧石径走过守藏阁山道时，迎面还飘着股呛人的硫磺混杂寒铁焦糊味。\\n\\n浓烟滚滚的院墙缺口处，一道火红劲装的身影扛着半截铁钳风风火火跳了出来，正好拦在山道正中。\\n\\n三师姐公孙妙左边脸颊蹭着两道黑灰，一头长发被炉火燎卷了几缕，偏偏双目亮得惊人。她先是叉腰上下打量了一番整装待发的晏怀瑾，视线一转，落在了落后半步、双眼覆着白纱的越流萤身上，眉毛顿时促狭地挑起老高：\\n\\n“哟！我当大师兄大清早神神秘秘瞒着谁呢，原来这就是镇契堂那位戴罪掌灯的小姑娘？”\\n\\n越流萤闻声停步，双手交叠在身前，朝着声音来处温顺乖巧地福了一礼，细声道：“罪女越流萤，见过公孙师姐。”\\n\\n“啧啧，生得这般怜人，说话也比某块寒鸦崖冻石头中听多了。”公孙妙绕着两人转了半圈，拿手肘捅了捅面无表情的晏怀瑾，语速飞快地打趣，“稀奇啊稀奇，咱们截天剑宗出了名的铁面活阎王，往年下山办差连匹脚力灵马都嫌费草料，今儿竟破天荒贴身带个人出门？怎么，镇契堂这是改善堂了？”\\n\\n“按镇契堂第三律，涉案试剑药奴须由司律主事随身羁押核查，以免中途畏罪潜逃。”晏怀瑾神色冷肃，半点不接师姐的调侃，“三师姐拦路，有何公干？”\\n\\n“没良心的小师弟，白瞎师姐熬了三个通宵的眼眶！”\\n\\n公孙妙撇了撇嘴，目光落回他腰侧那柄缺了一角的惊蛰剑上，神色总算正经了几分：“把剑递我。昨夜前山钟响我就猜你要动剑，你那惊蛰剑格护手三年前受过重击，内榫早松了半丝，真跟高阶修士硬碰硬是要吃暗亏的。”\\n\\n晏怀瑾没有推托，解下惊蛰剑递了过去。\\n\\n公孙妙单手托住剑身，从腰间皮囊里摸出一小管滚烫赤红的紫金焊液，指尖催动金丹巅峰的纯熟器火，屈指沿着剑格护手内侧缝隙疾抹三圈。嗤嗤轻响声中，赤红焊液瞬间渗入金属暗裂，冷却后化作一圈暗金色云纹，将松动的剑格咬合得严丝合缝。\\n\\n“行了，虽补不回剑尖
